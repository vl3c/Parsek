# Parsek Atlas prose.
#
# `scripts/arch/archview.py` renders docs/dev/arch/atlas.html from the live
# model plus this file. The narrative prose lives here; numbers, tables, chips
# and the map are generated, and the structural strings (headings, tile
# captions, the generated-views list) stay in the renderer template. `--check`
# reports prose that no longer matches the model (missing module summaries,
# glossary names that are gone, readings for vanished edges, reading-order
# types that do not exist, opportunity types that do not exist, literal numbers
# that disagree with the model) and the age of the `[findings]` review date.
# A number the check knows how to measure (archview.PROSE_NUMBER_CLAIMS) must
# match the model in any string that carries no YYYY-MM-DD date; in a dated
# string it is history and is only listed.
#
# `[findings]` and `[[opportunities]]` (at the end of this file) are the only
# conclusions on the page. They must not restate a number the page already
# generates: point at the section that shows it, or date the figure.
#
# Inline markup (`<span class="id">Name</span>`, `<em>`, `<code>`) is part of
# the prose and is rendered as-is.

[page]
lede = "What the mod is made of, how the parts lean on each other, which names you must know first, and where the structure resists change. Most numbers below come from the text scan in <code>scripts/arch/archview.py</code>; it counts type references between files, not compiler facts, and it is accurate to the folder, not the line. The Code facts section is the exception: it reads the compiled assembly."
map_note = "Twenty production modules, drawn as layers. A module's <em>instability</em> is the share of its references that point outward: near 1 means it only depends on others (the top), near 0 means it is only depended on (the bottom). Grey arrows point down the gradient, which is the healthy direction. <span class=\"up\">Red arrows point back up</span>: a more stable module leaning on a less stable one. Arrows carrying fewer than 8 references are hidden. Tooling modules (in-game tests, the command seam, the analyzer, the GUI census and harness support, 351 files together on 2026-11-14) are excluded from every figure on this page."
map_reading = "The reading, top to bottom: KSP touches Parsek through <strong>Patches</strong> and <strong>UI</strong>; <strong>Controllers</strong> (the scene addons and the scenario module) orchestrate; <strong>Ghost</strong>, <strong>Rewind</strong>, <strong>Missions</strong>, <strong>MapRender</strong> and <strong>Logistics</strong> are the feature layer; <strong>Recording</strong> and <strong>GameActions</strong> are the persistent model; <strong>Trajectory</strong>, <strong>Core</strong>, <strong>Config</strong> and <strong>LogIO</strong> are the floor."
directory_note = "Ordered by layer. \"Hubs\" are the module's most-referenced types, counted by how many other files use them. Descriptions are from the design docs, not derived."
vocabulary_note = "Learn these names before reading any file. Each is ranked by how many other files reference it. Together they are the language the whole mod is written in; the rest of the code is sentences made of them."
knot_note = "Every one of them can reach every other through references."
knot_consequence = "This is why the module map is one big cycle underneath the layering, and it is the single fact that most constrains refactoring: nothing inside the knot can be tested, extracted or reasoned about in isolation."
knot_cuts_note = "The knot is not held together by popularity. It is held by a few outgoing references from the hub types. Making a hub a pure sink (removing its own references to other knot members) shrinks the knot by this much:"
knot_callout = "<strong>How to read it.</strong> The cheap rows are gone: the recording data type, the game-action row, launch identity, the rewind hold and mission periodicity are out of the residue (launch identity is also outside the knot). What leads the sequence now is the flight controller, because its services, map markers and window set each hold a reference back to it, then the ghost playback logic, the supply route type, the recorder (which now also drives the shared part poller) and the god objects - the tree, the mission record, the route orchestrator, the scenario module, the game-state recorder, the store, the effective-state walker and the map presence. The services the program extracted are knot members that hang off the hubs they came from. What is left is a cluster led by the ledger and the stock-UI reservation layer, and that is where the opportunity list spends its argument."
layering_note = "On 2026-11-14, 81 module edges run upward on main (79 on 2026-11-10, 84 on 2026-11-07). Most are light. These are the ones that carry weight, with the types that cause them; the pairs at the end reference each other in both directions, which is the module-level signature of the knot."
backward_note = "The table above reads the stability gradient, and that direction is a measurement that moves: an edge flips when two instabilities drift past each other, as GameActions &rarr; Crew did during the refactor waves. The declared layers below move only when someone edits <code>[layers]</code> in <code>scripts/arch/modules.toml</code>: a module may depend on its own layer (lateral) and on lower ones, and an edge into a higher layer is backward. A backward module pair is measured in distinct (from type, to type) pairs, so neither call sites nor comments move it. CI ratchets every pair's count on the compiled IL (<code>scripts/arch/layer_pins.toml</code>); this table shows the text scan."
reading_note = "If you were new to this codebase, or coming back to it after months, this is the order in which the abstractions build on each other. Each step depends only on the ones before it."
views_note = "This page is a snapshot with prose. The live views regenerate from source in a few seconds and stay honest as the code moves; they are written under <code>docs/dev/arch/</code> and are not committed."
history_reading = "Co-change is a second opinion on the map: pairs that change together in most of their commits behave as one module whatever the folders say."
size_note = "The edges say what leans on what; this says how much of it there is. Lines are counted per file and per type with the parts of a partial class merged, so one row is one type however many files it is spread across. The candidates are rule output over those numbers, cheapest first, and each cites what fired it: a reading list for a later refactor pass, not a verdict that a split is safe. The rules, their thresholds and their blind spots are in <code>docs/dev/arch/README.md</code>, \"Size view\"."
facts_note = "The sections above read the source text; this one reads the compiled assembly, member by member, with lambdas and iterator bodies folded into the methods that wrote them. \"Can reach the game\" is the share of a module's instructions in methods that name a live KSP or Unity type or member, or call one that does, interface and virtual calls included; inert value types, enums and ConfigNode do not count, and it means can reach on some path, not needs. \"Called by unit tests\" is direct calls from the test assembly, not coverage. Uncalled code is what the runtime's own entry points (the root rules) do not reach through calls and virtual dispatch; each root rule shows how many live methods it alone keeps. The rules, the inert list and the three CI ratchets on these facts are in <code>docs/dev/arch/README.md</code>, \"Code facts\"."
findings_note = "The conclusions, written by hand and re-read against this page on the date below. They carry no live figures of their own: each points at the generated section that does, so read the section rather than a remembered number."
opportunities_note = "Refactoring opportunities in rank order, with their status. The evidence names the generated section behind each item; the only figures written here are dated facts. Every item still needs a proposal and a review against <code>docs/dev/refactor-guidelines.md</code> before code moves."
approximation_note = "Text-scan approximation. Type references are matched by name after stripping comments, strings and preprocessor lines; names declared in two modules are excluded; method calls that share a type's name are skipped. Good enough to place files, rank couplings and hold the declared forbidden edges at none; not sound enough to ratchet a count. The ratchets read the compiled IL: the semantic residue (<code>scripts/arch/semantic.py</code>), where a call through a forwarder counts as a call to the forwarded type, and the backward pairs of the declared layers (<code>scripts/arch/layers.py</code>); this page keeps the text edges."

# Layer bands for the module directory, by instability. A module belongs to the
# first band whose `min` it reaches, so keep the list ordered high to low.
[bands]
entry = { min = 0.70, label = "Entry layer: KSP calls in" }
feature = { min = 0.25, label = "Feature layer" }
model = { min = 0.18, label = "Model layer" }
floor = { min = 0.00, label = "Floor" }

[modules.Patches]
summary = "Harmony patches into stock KSP: physics frame, tracking station, orbit lines, facility and contract hooks, crew dialogs. 41 of its 76 types are entry points."

[modules.UI]
summary = "The IMGUI windows and tabs: recordings table, settings, missions, logistics, kerbals, spawn control, plus the stock-UI overlays KSP instantiates."

[modules.Timeline]
summary = "Builds the timeline window's entries from ledger and recording events."

[modules.Controllers]
summary = "The scene controllers: <span class=\"id\">ParsekScenario</span> (save, load, the OnLoad sweeps), <span class=\"id\">ParsekFlight</span> (the flight-scene composition root) and its eight <code>ParsekFlight*</code> services (ghost positioning, playback hosting, spawning, split branching, merge flow, switch continuation, post-switch auto-record, surface capture), the spawner, KSC and tracking-station addons, warp-to-time."

[modules.Rendering]
summary = "Smoothing, anchoring and outlier handling for drawn trajectories."

[modules.Display]
summary = "The map-view ghost trajectory polyline renderer and its route line sibling."

[modules.Reaim]
summary = "Re-aiming a recorded mission at a new arrival: descent triggers, loiter compression, arrival hold planning."

[modules.Ghost]
summary = "Ghost playback: the engine, map presence (proto vessels for the tracking station), loop units, visual building, spawn safety and FX."

[modules.Rewind]
summary = "Rewind-to-separation and re-fly: rewind points, supersede relations, the merge journal, effective state, revert and scene-exit interceptors."

[modules.MapRender]
summary = "Map and tracking-station render composition: phases, treatments, traces, the render manifest."

[modules.SwitchIntent]
summary = "Stock-action intent markers and vessel-switch continuation segments."

[modules.Missions]
summary = "The Missions tab model: composition trees, structure, periodicity, per-vessel rows, group linking."

[modules.Crew]
summary = "Crew reservations and kerbal end states."

[modules.Logistics]
summary = "Routes between recorded vessels: endpoints, stops, proofs of origin and harvest, the route store, delivery capacity."

[modules.GameActions]
summary = "The ledger: game actions, recalculation (the engine and the module set it walks), resource modules, KSP state patching, game-state events."

[modules.Trajectory]
summary = "Pure math over orbits and samples, and the trajectory data vocabulary: segments, points, track sections and their frames, terminal states, ballistic extrapolation."

[modules.Recording]
summary = "The recording itself: <span class=\"id\">Recording</span>, its tree, the store, the flight and background recorders and the part-state poller they share, sidecar codecs, the optimizer."

[modules.Core]
summary = "The kernel files used across many modules and owned by none: branch points, the playback trajectory interface, launch identity, the pure snapshot operations, milestone and group stores, inventory manifests."

[modules.Config]
summary = "Settings, loop timing, distance thresholds."

[modules.LogIO]
summary = "Logging, safe file I/O, the process id, the pre-Parsek backup."

[glossary.ParsekLog]
meaning = "The logger. Every subsystem writes through it; the KSP.log is the primary debugging tool."

[glossary.Recording]
meaning = "One recorded flight segment: metadata, trajectory points, track sections, part events, terminal state."

[glossary.LedgerOrchestrator]
meaning = "The ledger's entry point: captures KSC and flight game actions, builds the recalculation module set and runs the walk over it, patches stock career state from the result, and tells every reader when the committed timeline changed."

[glossary.RecordingStore]
meaning = "The static committed list and trees that survive scene changes, with the list primitives and the index-keyed notification contract; commit, discard, rewind, pending and file work live on its services."

[glossary.RecordingTree]
meaning = "The branch topology a flight produces: splits, docks, continuations, all rooted at one launch."

[glossary.OrbitSegment]
meaning = "A Keplerian arc in KSP-native elements; the unit of on-rails coverage."

[glossary.TrajectoryPoint]
meaning = "One sampled position and rotation; body-fixed in absolute sections, anchor-local metres in relative ones."

[glossary.TrackSection]
meaning = "A run of points sharing one reference frame and environment classification."

[glossary.ParsekScenario]
meaning = "The ScenarioModule: save and load, coroutine host, the OnLoad sweeps. OnLoad is a skeleton over a load context with one flow method per load branch."

[glossary.TerminalState]
meaning = "How a recording ended: landed, recovered, destroyed, disassembled, and so on."

[glossary.ReferenceFrame]
meaning = "Absolute or relative; decides how a point's coordinates are read."

[glossary.GameAction]
meaning = "One ledger row: a funds, science, reputation, crew or facility effect attributed to a recording."

[glossary.Route]
meaning = "A logistics route between recorded vessels, with stops and proofs."

[glossary.GhostPlaybackLogic]
meaning = "The pure decision half of ghost playback: what to show, when, from which section."

[glossary.EffectiveState]
meaning = "The one place that resolves which recordings and ledger rows are in effect after supersedes and chains."

[glossary.TrajectoryMath]
meaning = "Sampling, interpolation, orbit search, the relative-offset converters, the Zup swizzle."

[glossary.ParsekFlight]
meaning = "The flight-scene controller and composition root: Unity callbacks, event subscriptions, coroutines and the recording session; the bodies of eight seams live on its ParsekFlight* services, and the merge flow reaches it only through an interface."

[glossary.IPlaybackTrajectory]
meaning = "The interface the playback engine sees instead of a Recording."

[glossary.BranchPoint]
meaning = "Where and why a tree branched: decouple, dock, undock, EVA, switch."

[glossary.Kind]
meaning = "What a rewind split mutated: a branch point, a debris parent, a track-section anchor, a ledger row or a milestone row."

[glossary.ParsekGameModeGate]
meaning = "Whether Parsek runs in this save's game mode; every Harmony patch asks it first."

[glossary.VesselLaunchIdentity]
meaning = "Launch identity by KSP's per-launch vessel guid, because a persistentId is baked into the craft and repeats on every launch."

[glossary.GhostMapPresence]
meaning = "The ghost's map and tracking-station presence: its ProtoVessel, orbit line, icon and targeting."

[glossary.GameActionType]
meaning = "The kind of ledger row: which economy, roster or facility effect it records (science, funds, milestones, contracts, reputation, crew, facilities, strategies and route cycles)."

[glossary.FlightRecorder]
meaning = "The active vessel's recorder: samples the flight each physics frame into track sections and part events, and takes the live vessel snapshots. The part polling loops it shares with the background recorder live in PartStatePoller."

[[upward_readings]]
edge = "Recording -> Trajectory"
reading = "Not upward since the 2026-09-14 placements (Trajectory reads near 0.02 since TrackSection and TerminalState joined it on 2026-11-06). The recorder is Trajectory's main client: the extrapolator, the sample math and the section vocabulary."

[[upward_readings]]
edge = "MapRender -> Ghost"
reading = "The map renderer asks playback for what is present. Expected, given the layering; worth an interface."

[[upward_readings]]
edge = "Recording -> Rewind"
reading = "The model reaches up into supersede resolution, against a much heavier Rewind &rarr; Recording edge (the second number): the two are one subsystem on paper."

[[upward_readings]]
edge = "Rewind -> Controllers"
reading = "Feature code calling the scene controllers directly, through their static instances."

[[upward_readings]]
edge = "Recording -> Logistics"
reading = "Route detection hooks living in the recorder path."

[[upward_readings]]
edge = "Missions -> Reaim"
reading = "Perfectly symmetric. Either one module, or a cut is needed."

[[upward_readings]]
edge = "Core -> Recording"
reading = "The kernel vocabulary reaching up into the model: the playback trajectory interface (part and flag events), milestones, launch identity and the group hierarchy. The section and terminal vocabulary left this edge on 2026-11-06 (now Trajectory), and the spawner, once most of it, on 2026-11-07 (file-placement PR 9, now Controllers)."

[[upward_readings]]
edge = "GameActions -> Recording"
reading = "Ordering, not new coupling: the two modules sit at nearly the same instability, so the direction this table reads flips as either one moves (GameActions &rarr; Recording on 2026-11-06, Recording &rarr; GameActions on 2026-11-14). The ledger reads recordings, trees and the store to tag rows; the recorders reach the game-state recorder and the action row. The declared layers put both in the model layer, so neither direction is backward."

[[upward_readings]]
edge = "Crew -> Recording"
reading = "Ordering, like GameActions &rarr; Recording: the crew reservation manager and kerbals module read recordings and snapshots, and the same 2026-11-06 instability shift turned the pair around."

[[reading_order]]
title = "The floor."
types = ["ParsekLog", "ParsekSettings", "FileIOUtils", "TerminalState", "ReferenceFrame", "GameActionType", "BranchPointType"]
text = "Hundreds of types sit at this level (the ladder's bottom row); you need about a dozen."

[[reading_order]]
title = "Trajectory math."
types = ["OrbitSegment", "TrajectoryPoint", "TrackSection", "TrajectoryMath"]
text = "Plus the frame contracts in CLAUDE.md. Pure, testable, and the ground truth for every position on screen."

[[reading_order]]
title = "The recording model."
types = ["Recording", "RecordingTree", "BranchPoint", "VesselSnapshot"]
text = "What a flight becomes on disk."

[[reading_order]]
title = "The stores and the ledger."
types = ["RecordingStore", "GameAction", "Ledger", "LedgerOrchestrator"]
text = "What persists across scenes and how it patches KSP's career state."

[[reading_order]]
title = "Effective state and rewind."
types = ["EffectiveState", "RewindPoint", "ReFlySessionMarker"]
text = "Plus the merge journal. Which recordings count, given supersedes and re-flies."

[[reading_order]]
title = "Playback."
types = ["IPlaybackTrajectory", "GhostPlaybackLogic", "GhostPlaybackEngine", "GhostMapPresence", "LoopUnit"]
text = "How recordings become ghosts in flight and on the map."

[[reading_order]]
title = "Features over the model."
types = []
text = "Logistics, Missions, Reaim, MapRender. Each reads steps 3 to 6 and adds its own vocabulary."

[[reading_order]]
title = "The controllers and the surface."
types = ["ParsekScenario", "ParsekFlight"]
text = "Plus the UI windows and the Harmony patches. Read last: they are where everything meets, and they only make sense once the parts do."


# The Main findings list, in page order. `reviewed` is the date the list and the
# opportunities below were last re-read against a fresh page; `--check` says
# when it is more than 30 days old.
[findings]
reviewed = "2026-11-14"

[[findings.items]]
title = "The refactor shrank the core, and it is on main."
body = "The first wave (2026-11-07) only moved code, while wave 2 cut references: on 2026-11-10 the knot was 41 types smaller than on 2026-11-07 and the semantic residue the ratchet bounds had fallen from 258 to 141; the program merged as 1.1.0 (#2561, 2026-11-11) after its overnight batches flew 174 of 175 lanes green, and the services it extracted are still knot members that hang off the hubs they came from (<em>The knot</em>)."

[[findings.items]]
title = "What is left is a ledger and stock-UI reservation core."
body = "On 2026-11-14 the residue after the pinned cut order held 224 types, 60 of them GameActions and 32 UI as on 2026-11-10, led by <span class=\"id\">LedgerOrchestrator</span>, <span class=\"id\">GhostMapPresence</span>, <span class=\"id\">GameStateStore</span> and <span class=\"id\">RouteStore</span>; in the semantic residue (144 replayed members that day, 45 GameActions and 24 UI) 30 types call back into <span class=\"id\">LedgerOrchestrator</span>, which <code>docs/dev/research/ledger-orchestrator-back-edges-2026-11-14.md</code> sorts by what each needs."

[[findings.items]]
title = "Complexity fell this week; length did not."
body = "On 2026-11-14, as on 2026-11-10, one production file is above 5,000 lines (<span class=\"id\">ParsekFlightGhostPositioner</span>), 154 production files at or above 1,000 lines remain, 18 types reach 5,000 once partials merge and there are 654 methods of 90 lines or more, while the splits of <code>RouteAnalysisEngine.AnalyzeWindows</code>, <code>AnchorPropagator.Run</code> and <code>ParsekScenario.OnLoad</code> took the methods at complexity 100 or more from 5 on 2026-11-11 to 2 (<em>Largest files and types</em>, <em>Most complex methods</em>)."

[[findings.items]]
title = "OnLoad is a skeleton; ParsekScenario still leads the history."
body = "Since 2026-11-14 (#2598) <code>OnLoad</code> threads one <span class=\"id\">OnLoadContext</span> through a flow method per load branch and a headless test pins its executed steps for all seven load kinds, so its long stretch is now the in-session flow (<em>Largest files and types</em>), while the type keeps 31 reassignable statics and <code>ParsekScenario.cs</code> / <code>RecordingStore.cs</code> is still the most frequent cross-module file pair (<em>What changes together</em>)."

[[findings.items]]
title = "Three seams can now be tested without the game."
body = "On 2026-11-14 the merge flow reaches its host instance only through <span class=\"id\">IMergeFlowHost</span> (a fake host drives it in <code>MergeFlowDecisionTests</code>), the recalculation walk takes a <span class=\"id\">RecalculationModuleSet</span> instead of engine statics, and seven stores keep their save-scoped fields in one <code>ColdResetState</code> holder the Cold reset swaps whole (reassignable statics 860 to 819 at that merge); none of the three moved the semantic residue, and the four statics a Cold load still leaves set are pinned as todo COLD-RESET-LEFTOVERS (<em>Static lifetimes</em>)."

[[findings.items]]
title = "The two recorders share one part poller."
body = "Since 2026-11-14 (#2597) <span class=\"id\">FlightRecorder</span> and <span class=\"id\">BackgroundRecorder</span> run fifteen part-polling families through <span class=\"id\">PartStatePoller</span>, about 680 duplicated lines gone from each, at the cost of three more text-knot members (435 to 438 types that day) and no semantic residue; engine, RCS, light, robotic and EVA polling still differ per side and stay in each recorder."

[[findings.items]]
title = "History lags the split."
body = "The hotspot and co-change tables count commits over each type's current files, and the commits a base file had before it was split stay with it, so on 2026-11-14 they still lead with <code>ParsekFlight</code>, <code>RecordingStore</code> and <code>ParsekScenario</code>, raised by the refactor's own commits; read <em>What changes together</em> as where the pain was, and re-measure once the 30-day window holds only commits after the 1.1.0 merge (mid-December)."

[[findings.items]]
title = "The services still call their host; the metric forwarders are gone."
body = "The <code>ParsekFlight*</code> services, the flight map markers and the window set are built with the controller and reference it back (the merge flow only through its statics since 2026-11-14), which is why the flight controller is the first cut in <em>The knot</em>; the 11 <span class=\"id\">RecordingStore</span> forwarders kept only for the text ratchet were deleted on 2026-11-08 (W4c)."

[[findings.items]]
title = "No declared boundary is crossed, and CI holds it."
body = "The Ghost &rarr; GameActions VIOLATION main reported on 2026-11-07 is gone, and since 2026-11-11 CI gates the <code>[forbidden]</code> edges and ratchets every backward pair of the declared layers; the heaviest left are Rewind &rarr; Controllers, Ghost &rarr; Controllers, Recording &rarr; Logistics and Recording &rarr; Rewind (<em>Where the layering breaks</em>)."

[[findings.items]]
title = "The checker runs in CI, checks its prose, and gates on the compiled IL."
body = "CI's compiled-IL step ratchets the semantic residue (bound 124, 124 on 2026-11-14), the backward layer pairs, the static lifetimes, the headless-module leaks and the three code-facts sets (<em>Code facts</em>), and <code>--check</code> reports any undated literal number in this prose that disagrees with the page; CI runs the xUnit suite on mono only, so a Harmony patch over a Unity internalcall or a culture-formatted log line reds only on a Windows run (#2601, 2026-11-14)."

[[findings.items]]
title = "The modules are real."
body = "Even the most entangled pair of modules co-changes in a minority of its commits (the co-change tile above, and <em>What changes together</em>), so the folder and name boundaries match how the code is edited."

[[findings.items]]
title = "Missions and Reaim are not one module, and one file is the seam."
body = "They reference each other equally in both directions (21 / 21 on 2026-11-14, <em>Where the layering breaks</em>) but change together in a small share of their commits (<em>What changes together</em>), and every type Reaim reads from Missions is declared in <code>MissionPeriodicity.cs</code>, which since 2026-11-08 (W1c) takes the trimmed member windows as an input and is out of the residue."

[[findings.items]]
title = "Trajectory and Core are the floor the docs claim."
body = "Both sit near zero instability in the <em>Module directory</em>; Core still reaches Recording through the playback trajectory interface's event types and the save-format vocabulary (launch identity's sidecar read became a rule the sidecar store installs, 2026-11-07, W1a), and those event types are the next kernel question."

[[findings.items]]
title = "Parsek is data plus functions, not objects."
body = "On 2026-09-14 there were 26 interfaces and 6 abstract bases in 1,335 types, against 497 data types and 343 static helper classes; on 2026-11-14 there are 38 interfaces, and the services the refactor added are host-constructed classes, not a hierarchy (the abstractions are the names in <em>The vocabulary</em>)."

# The ranked opportunities. `types` names the types an item concerns; they are
# drawn as chips and `--check` reports any that are no longer in the model.
[[opportunities]]
rank = 1
item = "Cheap residue sinks: launch identity, the rewind vessel hold, mission periodicity"
evidence = "On 2026-11-07, 2 + 1 + 4 references take the replayed residue from 283 to 246; <span class=\"id\">MissionPeriodicity</span> is also the Missions / Reaim seam (<em>The knot</em>, <em>Where the layering breaks</em>)."
size = "an afternoon each"
status = "Done 2026-11-07 and 2026-11-08 (W1a, W1b, W1c): all three are out of the residue."
types = ["VesselLaunchIdentity", "MissionPeriodicity"]

[[opportunities]]
rank = 2
item = "ParsekScenario: partial files by load phase, then name the OnLoad phases"
evidence = "On 2026-11-10 <code>OnLoad</code> was the longest production method (1,377 lines); the type keeps 31 reassignable statics and sits on the top co-change pair (<em>Largest files and types</em>, <em>What changes together</em>)."
size = "2 to 4 PRs"
status = "Done for OnLoad 2026-11-14 (#2598, todo ARCH-ONLOAD-CONTEXT-AND-BRANCHES): a skeleton over a load context, one flow method per branch plus the shared tail parts, the step order pinned headless for all seven load kinds; the daily tier flew green on main with it on 2026-11-14 (28 of 28 lanes). Earlier: partial files (W2a), phase extraction (W2b), the static map (W2c). Left: the in-session flow is the type's longest method, and the statics."
types = ["ParsekScenario", "OnLoadContext"]

[[opportunities]]
rank = 3
item = "Stock-UI reservation layer below both GameActions and UI"
evidence = "GameActions &rarr; UI runs upward through the reservation text and predicates, and the residue is led by GameActions and UI (<em>Main findings</em>, <em>Where the layering breaks</em>). Todo ARCH-STOCK-UI-RESERVATION-CYCLES-2026-09-25."
size = "medium"
status = "Partly done 2026-11-08 (W3, W3b): the reason text moved onto <span class=\"id\">StockUiText</span> and 18 stock-screen types left the knot. No module rule can place the vocabulary below both (every candidate file also declares a type that reaches up), so the reservation layer is the residue's second hub cluster."
types = ["ReservationExplanation", "CommittedFutureIndex"]

[[opportunities]]
rank = 4
