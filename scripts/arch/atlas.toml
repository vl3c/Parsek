# Parsek Atlas prose.
#
# `scripts/arch/archview.py` renders docs/dev/arch/atlas.html from the live
# model plus this file. The narrative prose lives here; numbers, tables, chips
# and the map are generated, and the structural strings (headings, tile
# captions, the generated-views list) stay in the renderer template. `--check`
# reports prose that no longer matches the model (missing module summaries,
# glossary names that are gone, readings for vanished edges, reading-order
# types that do not exist, opportunity types that do not exist, literal numbers
# that disagree with the model) and the age of the `[findings]` review date.
# A number the check knows how to measure (archview.PROSE_NUMBER_CLAIMS) must
# match the model in any string that carries no YYYY-MM-DD date; in a dated
# string it is history and is only listed.
#
# `[findings]` and `[[opportunities]]` (at the end of this file) are the only
# conclusions on the page. They must not restate a number the page already
# generates: point at the section that shows it, or date the figure.
#
# Inline markup (`<span class="id">Name</span>`, `<em>`, `<code>`) is part of
# the prose and is rendered as-is.

[page]
lede = "What the mod is made of, how the parts lean on each other, which names you must know first, and where the structure resists change. Every number below comes from the text scan in <code>scripts/arch/archview.py</code>; it counts type references between files, not compiler facts, and it is accurate to the folder, not the line."
map_note = "Twenty production modules, drawn as layers. A module's <em>instability</em> is the share of its references that point outward: near 1 means it only depends on others (the top), near 0 means it is only depended on (the bottom). Grey arrows point down the gradient, which is the healthy direction. <span class=\"up\">Red arrows point back up</span>: a more stable module leaning on a less stable one. Arrows carrying fewer than 8 references are hidden. Tooling modules (in-game tests, the command seam, the analyzer, the GUI census and harness support, 339 files together on 2026-11-10) are excluded from every figure on this page."
map_reading = "The reading, top to bottom: KSP touches Parsek through <strong>Patches</strong> and <strong>UI</strong>; <strong>Controllers</strong> (the scene addons and the scenario module) orchestrate; <strong>Ghost</strong>, <strong>Rewind</strong>, <strong>Missions</strong>, <strong>MapRender</strong> and <strong>Logistics</strong> are the feature layer; <strong>Recording</strong> and <strong>GameActions</strong> are the persistent model; <strong>Trajectory</strong>, <strong>Core</strong>, <strong>Config</strong> and <strong>LogIO</strong> are the floor."
directory_note = "Ordered by layer. \"Hubs\" are the module's most-referenced types, counted by how many other files use them. Descriptions are from the design docs, not derived."
vocabulary_note = "Learn these names before reading any file. Each is ranked by how many other files reference it. Together they are the language the whole mod is written in; the rest of the code is sentences made of them."
knot_note = "Every one of them can reach every other through references."
knot_consequence = "This is why the module map is one big cycle underneath the layering, and it is the single fact that most constrains refactoring: nothing inside the knot can be tested, extracted or reasoned about in isolation."
knot_cuts_note = "The knot is not held together by popularity. It is held by a few outgoing references from the hub types. Making a hub a pure sink (removing its own references to other knot members) shrinks the knot by this much:"
knot_callout = "<strong>How to read it.</strong> The cheap rows are gone: the recording data type, the game-action row, launch identity, the rewind hold and mission periodicity are out of the residue (launch identity is also outside the knot). What leads the sequence now is the flight controller, because its services, map markers and window set each hold a reference back to it, then the ghost playback logic, the supply route type and the god objects - the scenario module, the tree, the mission record, the route orchestrator, the recorder, the game-state recorder, the store, the effective-state walker and the map presence. The services the program extracted are knot members that hang off the hubs they came from. What is left is a cluster led by the ledger and the stock-UI reservation layer, and that is where the opportunity list spends its argument."
layering_note = "On 2026-11-10, 79 module edges run upward at the frozen refactor tip (84 on 2026-11-07, 88 on main then). Most are light. These are the ones that carry weight, with the types that cause them; the pairs at the end reference each other in both directions, which is the module-level signature of the knot."
reading_note = "If you were new to this codebase, or coming back to it after months, this is the order in which the abstractions build on each other. Each step depends only on the ones before it."
views_note = "This page is a snapshot with prose. The live views regenerate from source in a few seconds and stay honest as the code moves; they are written under <code>docs/dev/arch/</code> and are not committed."
history_reading = "Co-change is a second opinion on the map: pairs that change together in most of their commits behave as one module whatever the folders say."
size_note = "The edges say what leans on what; this says how much of it there is. Lines are counted per file and per type with the parts of a partial class merged, so one row is one type however many files it is spread across. The candidates are rule output over those numbers, cheapest first, and each cites what fired it: a reading list for a later refactor pass, not a verdict that a split is safe. The rules, their thresholds and their blind spots are in <code>docs/dev/arch/README.md</code>, \"Size view\"."
findings_note = "The conclusions, written by hand and re-read against this page on the date below. They carry no live figures of their own: each points at the generated section that does, so read the section rather than a remembered number."
opportunities_note = "Refactoring opportunities in rank order, with their status. The evidence names the generated section behind each item; the only figures written here are dated facts. Every item still needs a proposal and a review against <code>docs/dev/refactor-guidelines.md</code> before code moves."
approximation_note = "Text-scan approximation. Type references are matched by name after stripping comments, strings and preprocessor lines; names declared in two modules are excluded; method calls that share a type's name are skipped. Good enough to place files and rank couplings; not sound enough to gate a build. The build gate is the semantic residue read from the compiled IL (<code>scripts/arch/semantic.py</code>), where a call through a forwarder counts as a call to the forwarded type; this page keeps the text edges."

# Layer bands for the module directory, by instability. A module belongs to the
# first band whose `min` it reaches, so keep the list ordered high to low.
[bands]
entry = { min = 0.70, label = "Entry layer: KSP calls in" }
feature = { min = 0.25, label = "Feature layer" }
model = { min = 0.18, label = "Model layer" }
floor = { min = 0.00, label = "Floor" }

[modules.Patches]
summary = "Harmony patches into stock KSP: physics frame, tracking station, orbit lines, facility and contract hooks, crew dialogs. 41 of its 76 types are entry points."

[modules.UI]
summary = "The IMGUI windows and tabs: recordings table, settings, missions, logistics, kerbals, spawn control, plus the stock-UI overlays KSP instantiates."

[modules.Timeline]
summary = "Builds the timeline window's entries from ledger and recording events."

[modules.Controllers]
summary = "The scene controllers: <span class=\"id\">ParsekScenario</span> (save, load, the OnLoad sweeps), <span class=\"id\">ParsekFlight</span> (the flight-scene composition root) and its eight <code>ParsekFlight*</code> services (ghost positioning, playback hosting, spawning, split branching, merge flow, switch continuation, post-switch auto-record, surface capture), the spawner, KSC and tracking-station addons, warp-to-time."

[modules.Rendering]
summary = "Smoothing, anchoring and outlier handling for drawn trajectories."

[modules.Display]
summary = "The map-view ghost trajectory polyline renderer and its route line sibling."

[modules.Reaim]
summary = "Re-aiming a recorded mission at a new arrival: descent triggers, loiter compression, arrival hold planning."

[modules.Ghost]
summary = "Ghost playback: the engine, map presence (proto vessels for the tracking station), loop units, visual building, spawn safety and FX."

[modules.Rewind]
summary = "Rewind-to-separation and re-fly: rewind points, supersede relations, the merge journal, effective state, revert and scene-exit interceptors."

[modules.MapRender]
summary = "Map and tracking-station render composition: phases, treatments, traces, the render manifest."

[modules.SwitchIntent]
summary = "Stock-action intent markers and vessel-switch continuation segments."

[modules.Missions]
summary = "The Missions tab model: composition trees, structure, periodicity, per-vessel rows, group linking."

[modules.Crew]
summary = "Crew reservations and kerbal end states."

[modules.Logistics]
summary = "Routes between recorded vessels: endpoints, stops, proofs of origin and harvest, the route store, delivery capacity."

[modules.GameActions]
summary = "The ledger: game actions, recalculation, resource modules, KSP state patching, game-state events."

[modules.Trajectory]
summary = "Pure math over orbits and samples, and the trajectory data vocabulary: segments, points, track sections and their frames, terminal states, ballistic extrapolation."

[modules.Recording]
summary = "The recording itself: <span class=\"id\">Recording</span>, its tree, the store, the flight and background recorders, sidecar codecs, the optimizer."

[modules.Core]
summary = "The kernel files used across many modules and owned by none: branch points, the playback trajectory interface, launch identity, the pure snapshot operations, milestone and group stores, inventory manifests."

[modules.Config]
summary = "Settings, loop timing, distance thresholds."

[modules.LogIO]
summary = "Logging, safe file I/O, the process id, the pre-Parsek backup."

[glossary.ParsekLog]
meaning = "The logger. Every subsystem writes through it; the KSP.log is the primary debugging tool."

[glossary.Recording]
meaning = "One recorded flight segment: metadata, trajectory points, track sections, part events, terminal state."

[glossary.LedgerOrchestrator]
meaning = "The ledger's entry point: captures KSC and flight game actions, runs the recalculation walk, patches stock career state from it, and tells every reader when the committed timeline changed."

[glossary.RecordingStore]
meaning = "The static committed list and trees that survive scene changes, with the list primitives and the index-keyed notification contract; commit, discard, rewind, pending and file work live on its services."

[glossary.RecordingTree]
meaning = "The branch topology a flight produces: splits, docks, continuations, all rooted at one launch."

[glossary.OrbitSegment]
meaning = "A Keplerian arc in KSP-native elements; the unit of on-rails coverage."

[glossary.TrajectoryPoint]
meaning = "One sampled position and rotation; body-fixed in absolute sections, anchor-local metres in relative ones."

[glossary.TrackSection]
meaning = "A run of points sharing one reference frame and environment classification."

[glossary.ParsekScenario]
meaning = "The ScenarioModule: save and load, coroutine host, the OnLoad sweeps."

[glossary.TerminalState]
meaning = "How a recording ended: landed, recovered, destroyed, disassembled, and so on."

[glossary.ReferenceFrame]
meaning = "Absolute or relative; decides how a point's coordinates are read."

[glossary.GameAction]
meaning = "One ledger row: a funds, science, reputation, crew or facility effect attributed to a recording."

[glossary.Route]
meaning = "A logistics route between recorded vessels, with stops and proofs."

[glossary.GhostPlaybackLogic]
meaning = "The pure decision half of ghost playback: what to show, when, from which section."

[glossary.EffectiveState]
meaning = "The one place that resolves which recordings and ledger rows are in effect after supersedes and chains."

[glossary.TrajectoryMath]
meaning = "Sampling, interpolation, orbit search, the relative-offset converters, the Zup swizzle."

[glossary.ParsekFlight]
meaning = "The flight-scene controller and composition root: Unity callbacks, event subscriptions, coroutines and the recording session; the bodies of eight seams live on its ParsekFlight* services."

[glossary.IPlaybackTrajectory]
meaning = "The interface the playback engine sees instead of a Recording."

[glossary.BranchPoint]
meaning = "Where and why a tree branched: decouple, dock, undock, EVA, switch."

[glossary.Kind]
meaning = "What a rewind split mutated: a branch point, a debris parent, a track-section anchor, a ledger row or a milestone row."

[glossary.ParsekGameModeGate]
meaning = "Whether Parsek runs in this save's game mode; every Harmony patch asks it first."

[glossary.VesselLaunchIdentity]
meaning = "Launch identity by KSP's per-launch vessel guid, because a persistentId is baked into the craft and repeats on every launch."

[glossary.GhostMapPresence]
meaning = "The ghost's map and tracking-station presence: its ProtoVessel, orbit line, icon and targeting."

[glossary.GameActionType]
meaning = "The kind of ledger row: which economy, roster or facility effect it records (science, funds, milestones, contracts, reputation, crew, facilities, strategies and route cycles)."

[glossary.FlightRecorder]
meaning = "The active vessel's recorder: samples the flight each physics frame into track sections and part events, and takes the live vessel snapshots."

[[upward_readings]]
edge = "Recording -> Trajectory"
reading = "Not upward since the 2026-09-14 placements (Trajectory reads near 0.02 since TrackSection and TerminalState joined it on 2026-11-06). The recorder is Trajectory's main client: the extrapolator, the sample math and the section vocabulary."

[[upward_readings]]
edge = "MapRender -> Ghost"
reading = "The map renderer asks playback for what is present. Expected, given the layering; worth an interface."

[[upward_readings]]
edge = "Recording -> Rewind"
reading = "The model reaches up into supersede resolution. Paired with Rewind &rarr; Recording at 98: the two are one subsystem on paper."

[[upward_readings]]
edge = "Rewind -> Controllers"
reading = "Feature code calling the scene controllers directly, through their static instances."

[[upward_readings]]
edge = "Recording -> Logistics"
reading = "Route detection hooks living in the recorder path."

[[upward_readings]]
edge = "Missions -> Reaim"
reading = "Perfectly symmetric. Either one module, or a cut is needed."

[[upward_readings]]
edge = "Core -> Recording"
reading = "The kernel vocabulary reaching up into the model: the playback trajectory interface (part and flag events), milestones, launch identity and the group hierarchy. The section and terminal vocabulary left this edge on 2026-11-06 (now Trajectory), and the spawner, once most of it, on 2026-11-07 (file-placement PR 9, now Controllers)."

[[upward_readings]]
edge = "GameActions -> Recording"
reading = "Ordering, not new coupling: upward since 2026-11-06, when moving TrackSection and TerminalState into Trajectory lifted Recording's instability just past the ledger's (both near 0.32). The ledger reads recordings, trees and the store to tag rows; Recording &rarr; GameActions, the lighter reverse, stopped reading upward."

[[upward_readings]]
edge = "Crew -> Recording"
reading = "Ordering, like GameActions &rarr; Recording: the crew reservation manager and kerbals module read recordings and snapshots, and the same 2026-11-06 instability shift turned the pair around."

[[reading_order]]
title = "The floor."
types = ["ParsekLog", "ParsekSettings", "FileIOUtils", "TerminalState", "ReferenceFrame", "GameActionType", "BranchPointType"]
text = "Hundreds of types sit at this level (the ladder's bottom row); you need about a dozen."

[[reading_order]]
title = "Trajectory math."
types = ["OrbitSegment", "TrajectoryPoint", "TrackSection", "TrajectoryMath"]
text = "Plus the frame contracts in CLAUDE.md. Pure, testable, and the ground truth for every position on screen."

[[reading_order]]
title = "The recording model."
types = ["Recording", "RecordingTree", "BranchPoint", "VesselSnapshot"]
text = "What a flight becomes on disk."

[[reading_order]]
title = "The stores and the ledger."
types = ["RecordingStore", "GameAction", "Ledger", "LedgerOrchestrator"]
text = "What persists across scenes and how it patches KSP's career state."

[[reading_order]]
title = "Effective state and rewind."
types = ["EffectiveState", "RewindPoint", "ReFlySessionMarker"]
text = "Plus the merge journal. Which recordings count, given supersedes and re-flies."

[[reading_order]]
title = "Playback."
types = ["IPlaybackTrajectory", "GhostPlaybackLogic", "GhostPlaybackEngine", "GhostMapPresence", "LoopUnit"]
text = "How recordings become ghosts in flight and on the map."

[[reading_order]]
title = "Features over the model."
types = []
text = "Logistics, Missions, Reaim, MapRender. Each reads steps 3 to 6 and adds its own vocabulary."

[[reading_order]]
title = "The controllers and the surface."
types = ["ParsekScenario", "ParsekFlight"]
text = "Plus the UI windows and the Harmony patches. Read last: they are where everything meets, and they only make sense once the parts do."

# The Main findings list, in page order. `reviewed` is the date the list and the
# opportunities below were last re-read against a fresh page; `--check` says
# when it is more than 30 days old.
[findings]
reviewed = "2026-11-10"

[[findings.items]]
title = "Wave 2 shrank the core; the first wave only moved code."
body = "On 2026-11-07 the first wave had bought locality, not decoupling: replaying the same cut order, the residue was 282 types on main and 283 on this branch. Wave 2 cut references instead of moving them: launch identity, the rewind hold record and mission periodicity left the residue, the stock-screen reason text moved onto <span class=\"id\">StockUiText</span>, and <span class=\"id\">ParsekUI</span> reaches its windows through interfaces. On 2026-11-10 the same 2026-11-07 order replays to 237 types, the knot is 41 types smaller than on 2026-11-07, and the semantic residue the ratchet bounds fell from 258 to 141. The extracted services are still knot members that hang off the hubs they came from (<em>The knot</em>)."

[[findings.items]]
title = "What is left is a ledger and stock-UI reservation core."
body = "On 2026-11-10 the residue after the pinned cut order held 225 types, 60 of them GameActions and 32 UI, then Rewind, Logistics, Recording, MapRender and Controllers. Its hubs inside the text residue are <span class=\"id\">LedgerOrchestrator</span>, <span class=\"id\">GhostMapPresence</span>, <span class=\"id\">RouteStore</span> and <span class=\"id\">GameStateStore</span>. The semantic residue moved the same way: its replayed members went from 297 on 2026-11-07 to 145, GameActions 52 to 45 and UI 45 to 24, while Ghost, Reaim and Rendering left it, so the ledger is nearly a third of it. Its hubs are <span class=\"id\">LedgerOrchestrator</span>, <span class=\"id\">GameStateStore</span>, <span class=\"id\">Ledger</span>, <span class=\"id\">KerbalsModule</span> and the stock-UI reservation layer (<span class=\"id\">CommittedFutureIndex</span>, <span class=\"id\">ReservationExplanation</span>). <span class=\"id\">ParsekUI</span>, <span class=\"id\">VesselLaunchIdentity</span> and <span class=\"id\">MissionPeriodicity</span>, residue members on 2026-11-07, are out."

[[findings.items]]
title = "One file is left above 5,000 lines; the giants are spread, not gone."
body = "On 2026-11-10 one production file is above 5,000 lines, <span class=\"id\">ParsekFlightGhostPositioner</span> (five on 2026-11-07), but 154 production files at or above 1,000 lines remain (147 on 2026-11-07, 135 on main then) and the same 18 types are at or above 5,000 once their partial files are merged. Long-method extraction moved more than it removed: 654 methods of 90 lines or more (664 on 2026-11-07, 665 on main). Live list and split candidates: <em>Largest files and types</em>."

[[findings.items]]
title = "ParsekScenario holds the longest method, and its file pair still leads."
body = "Its partial files are split by load phase and the stretches of <code>OnLoad</code> between gate-named lines are extracted, but on 2026-11-10 <code>OnLoad</code> is still the longest method in the production code (1,377 lines; the load gates read its source order, so the named lines stay in its body), the type keeps 31 reassignable statics, and <code>ParsekScenario.cs</code> is still on the most frequent cross-module file pair, with <code>RecordingStore.cs</code> (<em>Largest files and types</em>, <em>What changes together</em>)."

[[findings.items]]
title = "History lags the split."
body = "The hotspot and co-change tables count commits over each type's files since the window start, so on 2026-11-10 they still lead with <code>ParsekFlight</code>, <code>RecordingStore</code> and <code>ParsekScenario</code>, and the refactor's own commits raise them. Fan-in rose for both hubs on this branch because the services name their host. Read <em>What changes together</em> as where the pain was, and re-measure after a month of commits on main."

[[findings.items]]
title = "The services still call their host; the metric forwarders are gone."
body = "Each <code>ParsekFlight*</code> service, the flight map markers and the window set are built with the controller and reference it back, which is why the flight controller is the first cut in <em>The knot</em>. The 11 <span class=\"id\">RecordingStore</span> forwarders kept only for the text ratchet were deleted on 2026-11-08 (W4c), once the ratchet moved to the semantic graph, where a call through a forwarder counts as a call to the service."

[[findings.items]]
title = "No declared boundary is crossed on this branch."
body = "On 2026-11-07 main reported a Ghost &rarr; GameActions VIOLATION of weight 17 (one real call for recovered-recording evidence, plus two nested types named like BCL names); this branch moved the evidence index into <span class=\"id\">EffectiveState</span> and renamed the nested types, and on 2026-11-10 the edge is still gone. The heavy upward edges left are Rewind &rarr; Controllers, Ghost &rarr; Controllers and Recording &rarr; Rewind; GameActions &rarr; Crew now reads upward because the crew module's instability rose past the ledger's. Live list: <em>Where the layering breaks</em>."

[[findings.items]]
title = "The checker runs in CI, checks its prose, and gates on the compiled IL."
body = "CI runs <code>scripts/arch</code> on every PR with the semantic cells pointed at the built DLL, and on 2026-11-10 the 275-cell suite is green at the frozen refactor tip. The residue ratchet is the semantic residue (bound 141, measured 141), so adding or deleting a forwarder no longer moves it, and <code>--check</code> reports any undated literal number in this prose that disagrees with the page. The text residue is still measured and shown here, not bounded."

[[findings.items]]
title = "The modules are real."
body = "Even the most entangled pair of modules co-changes in a minority of its commits (the co-change tile above, and <em>What changes together</em>). The folder and name boundaries match how the code is edited."

[[findings.items]]
title = "Missions and Reaim are not one module, and one file is the seam."
body = "They reference each other equally in both directions (<em>Where the layering breaks</em>) but change together in a small share of their commits (<em>What changes together</em>). Every type Reaim reads from Missions is declared in <code>MissionPeriodicity.cs</code>. Since 2026-11-08 (W1c) <span class=\"id\">MissionPeriodicity</span> takes the trimmed member windows as an input instead of calling the loop-unit builder, so it is out of the residue; on 2026-11-10 the two modules still reference each other 21 / 21."

[[findings.items]]
title = "Trajectory and Core are the floor the docs claim."
body = "Trajectory no longer references Recording, and the spawner left the Core kernel for Controllers in the file-placement plan; both sit near zero instability in the <em>Module directory</em>. Core still reaches Recording, mostly through the playback trajectory interface's event types and the save-format vocabulary; launch identity's sidecar read became a rule the sidecar store installs (2026-11-07, W1a). The next kernel question is those event types."

[[findings.items]]
title = "Parsek is data plus functions, not objects."
body = "On 2026-09-14 there were 26 interfaces and 6 abstract bases in 1,335 types, against 497 data types and 343 static helper classes; on 2026-11-10 there are 38 interfaces, and the services the refactor added are host-constructed classes, not a hierarchy. The abstractions are the names in <em>The vocabulary</em>."

