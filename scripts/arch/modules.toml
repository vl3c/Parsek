# Parsek architecture-view module map.
#
# `scripts/arch/archview.py` reads this file to assign every C# file under
# Source/Parsek/ to exactly one module. It is the single hand-authored input;
# edges.json and every view are derived from it.
#
# Rules are evaluated in file order and the FIRST match wins.
#   folder = match the first path segment under Source/Parsek/ (only applies to
#            files inside a subfolder; a folder rule never matches a root file).
#   prefix = a regex applied to the file name of a ROOT-LEVEL file only.
# A file that matches no rule is reported as unplaced and skipped; Core is the
# kernel list (eight explicit files), written last so it can never shadow a
# rule above it. A new root file must get a rule.

# --- folder rules ---------------------------------------------------------

[[module]]
name = "Analyzer"
folder = "Analyzer"

[[module]]
name = "Diagnostics"
folder = "Diagnostics"

[[module]]
name = "Display"
folder = "Display"

[[module]]
name = "GameActions"
folder = "GameActions"

[[module]]
name = "InGameTests"
folder = "InGameTests"

[[module]]
name = "Logistics"
folder = "Logistics"

[[module]]
name = "MapRender"
folder = "MapRender"

[[module]]
name = "Patches"
folder = "Patches"

[[module]]
name = "Reaim"
folder = "Reaim"

[[module]]
name = "Rendering"
folder = "Rendering"

[[module]]
name = "TestCommands"
folder = "TestCommands"

[[module]]
name = "Timeline"
folder = "Timeline"

[[module]]
name = "UI"
folder = "UI"

# --- root-level file rules -------------------------------------------------

# --- R0 operator placements (phase 2b) ------------------------------------
# Evaluated FIRST so an explicit file name beats every family prefix below.
# Files below the R2 evidence floor or referenced by nothing outside Core,
# placed by hand from what each file does. The eight kernel files stay in Core
# on purpose: BranchPoint, IPlaybackTrajectory, VesselLaunchIdentity,
# VesselSpawner, MilestoneStore, GroupHierarchyStore, InventoryManifest and
# PlaybackTrajectoryBoundsResolver have no majority owner because every module
# uses them; that is the shared vocabulary, not a placement gap.

# session lifecycle, revert and unfinished-flight machinery (named in the rewind section of CLAUDE.md); SceneExitInterceptor is a Harmony-driven entry point referenced only from comments
[[module]]
name = "Rewind"
prefix = "^UnfinishedFlightClassifier[.]cs$|^UnfinishedFlightSealHandler[.]cs$|^UnfinishedFlightStashHandler[.]cs$|^PostLoadStripper[.]cs$|^ReconciliationBundle[.]cs$|^MarkerValidator[.]cs$|^RevertDetector[.]cs$|^RevertInterceptor[.]cs$|^SceneExitInterceptor[.]cs$|^QuickloadResumeMatchGuard[.]cs$|^CrashCoalescer[.]cs$|^CheckpointDoubleCoverRetire[.]cs$"
placement = "R0"

# sidecar I/O, recorder policy and classifiers; each referenced only by Recording or by Recording plus one controller
[[module]]
name = "Recording"
prefix = "^SnapshotSidecarCodec[.]cs$|^RecorderStateLog[.]cs$|^IncompleteBallisticSceneExitFinalizer[.]cs$|^TrajectorySidecarBinary[.]cs$|^TrajectoryTextSidecarCodec[.]cs$|^OrbitSegmentCheckpointBridge[.]cs$|^OrbitalCheckpointDensifier[.]cs$|^OrbitSeedResolver[.]cs$|^SidecarFileCommitBatch[.]cs$|^SessionMerger[.]cs$|^TreeDiscardPurge[.]cs$|^DiscardSidecarReap[.]cs$|^PartStateSeeder[.]cs$|^PartStateSeeder[.]Diff[.]cs$|^ProximityRateSelector[.]cs$|^SegmentPhaseClassifier[.]cs$|^TraceSeparation[.]cs$|^DebrisParentStateGate[.]cs$|^DebrisRelativeRecorderPolicy[.]cs$|^IdentityLossClassifier[.]cs$|^StockWarpAltitudeLimits[.]cs$|^AntennaSpec[.]cs$|^DiagnosticFormatters[.]cs$|^RecorderStateSnapshot[.]cs$"
placement = "R0"

# playback, spawn and ghost visual support
[[module]]
name = "Ghost"
prefix = "^PlaybackTrace[.]cs$|^PlaybackScopeTracker[.]cs$|^PlaybackOrbitDiagnostics[.]cs$|^EngineFxBuilder[.]cs$|^MaterialCleanup[.]cs$|^RecordedRelativeAnchorPoseResolver[.]cs$|^DebrisRelativeCoveragePrimitives[.]cs$|^LoopSeamMarkerRuntime[.]cs$|^LoopSeamMarkerBuilder[.]cs$|^VesselGhoster[.]cs$|^SpawnCollisionDetector[.]cs$|^TerrainCorrector[.]cs$|^SpawnWarningUI[.]cs$|^VesselDisassemblyClassifier[.]cs$"
placement = "R0"

# scene-level runtime control; the WarpToTime family is one unit
[[module]]
name = "Controllers"
prefix = "^TimeJumpManager[.]cs$|^PauseMenuGate[.]cs$|^InputFocusGuard[.]cs$|^MapMarkerRenderer[.]cs$|^ConnectionProducerClassifier[.]cs$|^WarpToTimeController[.]cs$|^WarpToTimeConsumer[.]cs$|^WarpToTimeMath[.]cs$|^WarpToTimeRequest[.]cs$"
placement = "R0"

# dialogs, caches for windows, and Unity-instantiated overlays that no code references (KSP creates them)
[[module]]
name = "UI"
prefix = "^CommittedActionDialog[.]cs$|^DockEventGraphCache[.]cs$|^ResourceBudget[.]cs$|^CurrencyReservationOverlay[.]cs$|^OverlayBadge[.]cs$|^StockUiOverlayController[.]cs$|^ParsekToolbarRegistration[.]cs$"
placement = "R0"

# all three references come from Display
[[module]]
name = "Display"
prefix = "^ForwardRenderWindow[.]cs$"
placement = "R0"

# all references come from Rendering
[[module]]
name = "Rendering"
prefix = "^PannotationsSidecarBinary[.]cs$"
placement = "R0"

# ledger observability
[[module]]
name = "GameActions"
prefix = "^LedgerTrace[.]cs$"
placement = "R0"

# in-game test and harness support; tooling, hidden from production views
[[module]]
name = "Harness"
prefix = "^LedgerGroundTruth[.]cs$|^LedgerGroundTruthDiff[.]cs$|^CareerSaveParser[.]cs$|^TestBatchMarker[.]cs$|^CareerStartSnapshot[.]cs$"
placement = "R0"
[[module]]
name = "Missions"
prefix = "^Mission"

# The Gloops recorder engine has no root-level files today; its only file,
