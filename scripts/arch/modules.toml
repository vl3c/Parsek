# Parsek architecture-view module map.
#
# `scripts/arch/archview.py` reads this file to assign every C# file under
# Source/Parsek/ to exactly one module. It is the single hand-authored input;
# edges.json and every view are derived from it.
#
# Rules are evaluated in file order and the FIRST match wins.
#   folder = match the first path segment under Source/Parsek/ (only applies to
#            files inside a subfolder; a folder rule never matches a root file).
#   prefix = a regex applied to the file name of a ROOT-LEVEL file only.
# A file that matches no rule is reported as unplaced and skipped; Core is the
# kernel list (nine explicit files), written last so it can never shadow a
# rule above it. A new root file must get a rule.

# --- folder rules ---------------------------------------------------------

[[module]]
name = "Analyzer"
folder = "Analyzer"

[[module]]
name = "Diagnostics"
folder = "Diagnostics"

[[module]]
name = "Display"
folder = "Display"

[[module]]
name = "GameActions"
folder = "GameActions"

[[module]]
name = "InGameTests"
folder = "InGameTests"

[[module]]
name = "Logistics"
folder = "Logistics"

[[module]]
name = "MapRender"
folder = "MapRender"

[[module]]
name = "Patches"
folder = "Patches"

[[module]]
name = "Reaim"
folder = "Reaim"

[[module]]
name = "Rendering"
folder = "Rendering"

[[module]]
name = "TestCommands"
folder = "TestCommands"

[[module]]
name = "Timeline"
folder = "Timeline"

[[module]]
name = "UI"
folder = "UI"

# --- root-level file rules -------------------------------------------------

# --- R0 operator placements (phase 2b) ------------------------------------
# Evaluated FIRST so an explicit file name beats every family prefix below.
# Files below the R2 evidence floor or referenced by nothing outside Core,
# placed by hand from what each file does. The eight kernel files stay in Core
# on purpose: BranchPoint, IPlaybackTrajectory, VesselLaunchIdentity,
# VesselSnapshotOps, MilestoneStore, GroupHierarchyStore, InventoryManifest
# and PlaybackTrajectoryBoundsResolver have no majority owner
# because every module uses them; that is the shared vocabulary, not a
# placement gap.

