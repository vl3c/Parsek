# --- declared layers -------------------------------------------------------
# The intended dependency order, lowest first: a module may depend on modules in
# its own layer (lateral: reported, not ratcheted) and in lower layers. An edge
# into a HIGHER layer is backward, and CI ratchets each backward module pair by
# its count of distinct (from type, to type) pairs on the compiled-IL graph
# (scripts/arch/layers.py, pins in scripts/arch/layer_pins.toml). Every
# production module must sit in exactly one layer and no tooling module in any,
# or the arch suite reds (test_semantic_layers.py). The assignment follows the
# module descriptions (atlas.toml, the README's map reading) and was chosen
# among honest placements for the fewest backward type pairs on 2026-11-11:
#   floor        the kernel vocabulary every module leans on: logging and file
#                I/O, settings, the Core kernel files, the trajectory math and
#                data vocabulary
#   model        the persistent model: recordings and their store, the ledger,
#                the kerbal and crew state the ledger books (KerbalsModule)
#   features     what the mod does with the model: playback, rewind and re-fly,
#                missions, routes, map rendering, re-aim, switch continuation
#   presentation the windows and the timeline rows they show
#   entry        what KSP calls: the scene controllers (the composition roots
#                that build the windows) and the Harmony patches
# Moving a module to another layer re-pins the ratchet (it reds otherwise when
# it creates a backward pair); say why in the PR.

[layers]
order = ["floor", "model", "features", "presentation", "entry"]

[layers.modules]
floor = ["LogIO", "Config", "Core", "Trajectory"]
model = ["Recording", "GameActions", "Crew"]
features = ["Ghost", "Rewind", "Missions", "Logistics", "MapRender", "SwitchIntent", "Reaim", "Rendering", "Display"]
presentation = ["UI", "Timeline"]
entry = ["Controllers", "Patches"]

# --- headless modules ------------------------------------------------------
# The production modules whose job is rules, math and data: code that should
# run with no game loaded. CI pins each LEAK, a (headless method, live thing)
# pair where the method names a live game type or member itself or calls a
# method outside these modules that can reach the game (scripts/arch/headless.py,
# pins in scripts/arch/headless_pins.toml; README, "Headless modules"). A new
# leak reds naming the method and what it touches. Each entry says why the
# module is headless; the README's table has the measure the choice read.
# Adding or removing a module re-pins in the same PR.

[headless.modules]
Core = "the kernel vocabulary every module leans on: branch points, launch identity, the pure snapshot operations over ConfigNode, milestone and group stores; its few live touches (save paths, a body or transform read, the Re-Fly marker check) are its leaks"
Trajectory = "pure math over orbits and samples and the trajectory data vocabulary; the live parts are the patched-conic snapshot and the orbit reseed, which the leak list names"
Missions = "the Missions tab model: composition trees, structure, periodicity, per-vessel rows; the stock Mission Control annotation and the live vessel-name writers placed here are its leaks"
Timeline = "builds the timeline's entries from ledger and recording events; no method names a game type itself, but its display text calls live formatters and name lookups in other modules (the time format, facility and strategy names), which the leak list names"
Reaim = "re-aiming a recorded mission: descent triggers, loiter compression and arrival hold planning, rules over recorded data; its live reads of bodies and orbits are its leaks"

# --- dependency policy -----------------------------------------------------
# Both lists use the edge form "From -> To", meaning "code in From references
# types declared in To".
#
# forbidden: edges that must never exist. The arch suite reds when one is
#            crossed: the DLL-free suite on the text scan's module edges
#            (test_archview), CI's compiled-IL step on the semantic graph
#            (test_semantic_layers). A spec naming no module reds too.
# allowed:   while this list is EMPTY the checker skips the allowlist section
#            entirely. Once any edge is listed, every production edge not
#            listed here is reported.

# --- size view -------------------------------------------------------------
# runtimeCoupled: the modules whose code is Unity / IMGUI / Harmony / map-render
# bound, so a size recommendation over one of them carries the "needs in-game
# validation, preserve log text and rate-limit keys" note. The list is the set
# docs/dev/plans/refactor-remaining-opportunities.md calls coupled (runtime,
# ghost and rendering owners, the stateful UI surfaces) plus Patches, whose
# Harmony bodies docs/dev/done/refactor/refactor-5-inventory.md marks the same
# way. Size THRESHOLDS are not here: they are named constants in archview.py.

[size]
runtimeCoupled = ["Controllers", "Display", "Ghost", "MapRender", "Patches", "Rendering", "UI"]

[forbidden]
edges = [
  "Missions -> Logistics",
  "Ghost -> GameActions",
]

[allowed]
edges = []
