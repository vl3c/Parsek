# Parsek architecture-view module map.
#
# `scripts/arch/archview.py` reads this file to assign every C# file under
# Source/Parsek/ to exactly one module. It is the single hand-authored input;
# edges.json and every view are derived from it.
#
# The folder is the module. Every .cs file lives in a module folder,
# Source/Parsek/<Module>/ (any depth below it), and each rule below names one
# module and its folder:
#   folder = the first path segment under Source/Parsek/.
# A .cs file in the root of Source/Parsek is an error: the arch suite reds
# naming it (RealTreeSmokeTests), archview.py prints an ERROR line for it, and
# scripts/refactor/move_to_module_folders.py --check exits 1 naming it (run the
# script without --check to move it into its module's folder).
# A file in a folder no rule names is reported as unclassified, so a new module
# needs a rule here, a layer below and a line in atlas.toml.
#
# Placing a new file: put it in the folder of the module that owns it. The
# history of the old per-file rules (git log of this file before the
# 2026-11-14 folder move) says why each existing file sits where it does.
#
# The `prefix` rule form (a regex over the name of a root-level file) is still
# read by archview.py for test fixtures and historical reconstructions; this
# file uses none.

[[module]]
name = "Analyzer"
folder = "Analyzer"

[[module]]
name = "Config"
folder = "Config"

[[module]]
name = "Controllers"
folder = "Controllers"

[[module]]
