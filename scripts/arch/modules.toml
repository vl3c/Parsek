# Parsek architecture-view module map.
#
# `scripts/arch/archview.py` reads this file to assign every C# file under
# Source/Parsek/ to exactly one module. It is the single hand-authored input;
# edges.json and every view are derived from it.
#
# Rules are evaluated in file order and the FIRST match wins.
#   folder = match the first path segment under Source/Parsek/ (only applies to
#            files inside a subfolder; a folder rule never matches a root file).
#   prefix = a regex applied to the file name of a ROOT-LEVEL file only.
# A file that matches no rule is reported as unclassified and skipped; the
# Core catch-all is written last so it can never shadow a rule above it.

# --- folder rules ---------------------------------------------------------

[[module]]
name = "Analyzer"
folder = "Analyzer"

[[module]]
name = "Diagnostics"
folder = "Diagnostics"

[[module]]
name = "Display"
folder = "Display"

[[module]]
name = "GameActions"
folder = "GameActions"

[[module]]
name = "InGameTests"
folder = "InGameTests"

[[module]]
name = "Logistics"
folder = "Logistics"

[[module]]
name = "MapRender"
folder = "MapRender"

[[module]]
name = "Patches"
folder = "Patches"

[[module]]
name = "Reaim"
folder = "Reaim"

[[module]]
name = "Rendering"
folder = "Rendering"

[[module]]
name = "TestCommands"
folder = "TestCommands"

[[module]]
name = "Timeline"
folder = "Timeline"

[[module]]
name = "UI"
folder = "UI"

# --- root-level file rules -------------------------------------------------

[[module]]
name = "Missions"
prefix = "^Mission"

# The Gloops recorder engine has no root-level files today; its only file,
# UI/GloopsRecorderUI.cs, belongs to the UI folder module. The rule stays so
# the declared [forbidden] Gloops boundaries are enforced the moment a
# Gloops root file appears.
[[module]]
name = "Gloops"
prefix = "^Gloops"

[[module]]
name = "Ghost"
prefix = "^Ghost|^Waterfall|^Pristine|^ReStock"

[[module]]
name = "Rewind"
prefix = "^Rewind|^Supersede|^Merge|^EffectiveState|^ReFly|^LoadTimeSweep|^RecordingTreeSplit"

[[module]]
name = "SwitchIntent"
prefix = "^Switch|^StockAction"

[[module]]
name = "Recording"
prefix = "^Recording|^BackgroundRecorder|^FlightRecorder|^Chain|^Track|^Optimiz"

[[module]]
name = "Trajectory"
prefix = "^Trajectory|^Orbit|^Ballistic|^PatchedConic|^TwoBody|^Incomplete"

[[module]]
name = "Crew"
prefix = "^Crew|^Kerbal"

[[module]]
name = "Controllers"
prefix = "^Parsek(Flight|KSC|TrackingStation|Scenario|Harmony|Playback)|^WatchMode"

[[module]]
name = "LogIO"
prefix = "^ParsekLog|^FileIO|^ParsekProcess|^Suppression|^PreParsek"

# --- R1 name-family placements (phase 2) ----------------------------------
# A file whose name starts with one of the family prefixes goes to the
# family's module regardless of references; the family is a unit. The
# evidence table is docs/dev/arch/core-placement.md.

[[module]]
name = "GuiTree"
prefix = "^GuiTree"
placement = "R1"

[[module]]
name = "GameActions"
prefix = "^GameState"
placement = "R1"

[[module]]
name = "Config"
prefix = "^ParsekConfig|^ParsekSettings|^SettingWhitelist"
placement = "R1"

[[module]]
name = "UI"
prefix = "^ParsekUI"
placement = "R1"

[[module]]
name = "MapRender"
prefix = "^MapRender"
placement = "R1"

[[module]]
name = "Logistics"
prefix = "^RouteProof|^RouteConnection|^RouteEndpoint|^RouteHarvest|^RouteRun|^RouteOrigin|^Route"
placement = "R1"

[[module]]
name = "Recording"
prefix = "^PartEvent|^FlagEvent|^SegmentEvent|^SegmentBoundary|^SurfacePosition|^AnchorDetector|^RelativeAnchor|^TrackSection|^ControllerInfo"
placement = "R1"

# --- R2 clear-owner placements (phase 2) ----------------------------------
# One exact-file rule per placement: the module that references the file most
# owns it (a majority share of its external references, or at least twice the
# second module). Evidence is the comment above each rule; the full table is
# docs/dev/arch/core-placement.md.

