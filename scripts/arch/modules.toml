# Core is the kernel vocabulary, not a catch-all: exactly the eight root files
# every module leans on. Any other root file must be placed by a rule above; an
# unplaced root file is reported by the checker and skipped. MUST stay last.
[[module]]
name = "Core"
prefix = "^BranchPoint[.]cs$|^IPlaybackTrajectory[.]cs$|^VesselLaunchIdentity[.]cs$|^VesselSpawner[.]cs$|^MilestoneStore[.]cs$|^GroupHierarchyStore[.]cs$|^InventoryManifest[.]cs$|^PlaybackTrajectoryBoundsResolver[.]cs$"

# --- production views ------------------------------------------------------
# Modules listed here are hidden from the production views (dot + matrix) and
# from the checker's metrics table. explore.html shows them behind a checkbox.

[tooling]
modules = ["InGameTests", "TestCommands", "Diagnostics", "Analyzer", "GuiTree", "Harness"]

# --- dependency policy -----------------------------------------------------
# Both lists use the edge form "From -> To", meaning "code in From references
# types declared in To".
#
# forbidden: edges that must never exist. Report-only today.
# allowed:   while this list is EMPTY the checker skips the allowlist section
#            entirely. Once any edge is listed, every production edge not
#            listed here is reported.

[forbidden]
edges = [
  "Missions -> Logistics",
  "Gloops -> GameActions",
  "Gloops -> Timeline",
  "Ghost -> GameActions",
]

[allowed]
edges = []
