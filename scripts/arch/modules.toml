# --- production views ------------------------------------------------------
# Modules listed here are hidden from the production views (dot + matrix) and
# from the checker's metrics table. explore.html shows them behind a checkbox.

[tooling]
modules = ["InGameTests", "TestCommands", "Diagnostics", "Analyzer", "GuiTree"]

# --- dependency policy -----------------------------------------------------
# Both lists use the edge form "From -> To", meaning "code in From references
# types declared in To".
#
# forbidden: edges that must never exist. Report-only today.
# allowed:   while this list is EMPTY the checker skips the allowlist section
#            entirely. Once any edge is listed, every production edge not
#            listed here is reported.

[forbidden]
edges = [
  "Missions -> Logistics",
  "Gloops -> GameActions",
  "Gloops -> Timeline",
  "Ghost -> GameActions",
]

[allowed]
edges = []
