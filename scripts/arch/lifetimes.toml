# The declared lifetime of the mutable static state in Parsek.dll production
# code: every reassignable static, and every static readonly collection whose
# contents a method other than a static constructor changes (the population
# ilanalysis.static_state reports). Read by scripts/arch/lifetimes.py and its
# gates (test_static_lifetimes.py); docs/dev/arch/README.md, "Static lifetimes".
#
# Hand-edited. Tag only what evidence supports (the reset helper and its
# allowlist, a store's own Cold loader, a cache's version key, a hook's name,
# a scene object read in its source). Everything else stays untagged and is
# pinned as the untagged set in lifetime_pins.toml: a NEW untagged static reds,
# so a PR that adds a static gives it a lifetime here.
#
# How a static gets its lifetime, most specific first:
#   1. a field entry under its type's [[type]] (`name = "lifetime: reason"`;
#      an auto-property is named by its property, as the allowlist does);
#   2. a [[pattern]] its name matches (the property name for a backing field);
#   3. its declaring type's `default` (the type itself, not its nested types).
# A type may appear once; a field once in its type's entry.

[lifetimes]
process = "lives as long as the KSP process: never reset by a load (caches keyed on a version or identity, counters, subscriptions, settings caches, constants)"
save = "the loaded save's own state, from one Cold load to the next: a Cold load clears it (ParsekScenario.ResetSaveScopedSessionState or the store's own loader)"
load-transition = "armed or captured before a load and consumed by the next OnLoad or the scene that load opens (an intent, a carry across LoadGame)"
scene = "a scene object or per-scene state, torn down or reset on a scene change"
scoped = "set and restored around one call (try/finally, a Dispose, a Harmony Finalizer); between calls it holds its resting value"
test-hook = "a seam only tests set (a provider, an override, a fault injector, a logging switch)"

# The methods a Cold load runs. Their transitive call closure (calls, plus
# every implementation or override of a called virtual slot; lambda, closure
# and iterator bodies fold into the method that creates them) is where a
# `save` or `load-transition` static must be CLEARED: a write that can empty or
# replace the value, never an append or a read. A clear is an `stsfld` (a
# reassignment, whatever it stores), a call to its auto-property setter,
# `ldsflda` + `initobj` (`x = default`), or a call of a clearing member below
# whose receiver is the static's own value (followed down the stack, or a
# parameter it is passed in as itself; never an element read out of it and
# never a call merely near the read).
[cold_load.roots]
"Parsek.ParsekScenario::OnAwake()" = "stock creates a fresh scenario module for every game load (ScenarioRunner) and calls OnAwake before OnLoad"
"Parsek.ParsekScenario::OnLoad(ConfigNode)" = "the load itself; its Cold branch runs ResetSaveScopedSessionState and every store loader"
"Parsek.ParsekScenario::ResetSaveScopedSessionState(string)" = "the save-scoped reset; reached from OnLoad, named so the gate does not depend on that call staying direct"
"Parsek.ParsekSettings::OnLoad(ConfigNode)" = "stock reads the save's difficulty parameters (this CustomParameterNode) on every game load"

# The collection members that empty the value they are called on. Clear is
# the one every BCL collection Parsek holds in a static exposes. Remove(key),
# RemoveAt, RemoveAll(predicate) and the set operations empty nothing in
# general; set_Length (StringBuilder) is not admitted because no save or
# load-transition static is a StringBuilder. Admit a member only with a reason.
[cold_load.clearing_members]
Clear = "List / Dictionary / HashSet / Queue / Stack / StringBuilder: empties the collection"

# A Cold clear the IL rule cannot see, one entry per static: the method in the
# Cold closure that clears it, and how. The gate checks every entry, needed or
# not: the method exists, is in the closure, and itself reads, writes or takes
# the address of the static (when the clear is a helper handed the static as an
# argument, name the caller that passes it). The reason is the claim; a person
# reads it.
[cold_load.cleared_by]
"Parsek.RecordingStore::committedRecordings" = { method = "Parsek.RecordingStore::ClearCommittedInternal()", reason = "OnLoad's Cold branch calls it; it removes every recording top-down through RemoveCommittedAtWithNotifications until the list is empty, so each removal raises the committed-list seam (a RemoveAt loop, which the rule does not read as a clear; the only Clear the closure reaches is the test-batch crash reconcile's ResetForTestingInternal)" }

[[pattern]]
match = "*ForTesting"
lifetime = "test-hook"
reason = "named as a test seam; the testHookWrittenByProduction finding checks no other production type writes it"

[[pattern]]
match = "*ForTests"
lifetime = "test-hook"
reason = "named as a test seam"

