# Far-watch site allowlist (design-far-watch.md section 11.4), read by
# scripts/arch/test_far_watch_sites.py over the compiled Debug Parsek.dll.
#
# One entry per (member, pattern): `count` is the number of IL instructions
# naming the pattern in that method (lambdas and local functions folded in),
# `codes` the audit decision codes (section 11.1), `audit` the audit rows.
# Seeded by scripts/refactor/seed_far_watch_sites.py from audits A, B, C at
# ba7cd9eb, counts re-read on main 7b1b7310; from then on
# entries are keyed by member, never by line. Change an entry in the same
# commit as the method it counts: a swap to IsGhostOrDroneVessel drops that
# method's IsGhostMapVessel count, a PLAYER-SHIP read moved to
# FarWatchPlayerVessel.Resolve() drops its ActiveVessel count.

schema = 1

[wrappers]
# Reader wrappers: a call to one is a `wrapper` site of its caller.
members = [
    "Parsek.WatchModeController::GetActiveVesselSafe()",
    "Parsek.WatchModeController::ReadActiveVesselCore()",
    "Parsek.PredictedCrashReconcilerHost::ReadActiveVesselCore()",
]

[notWrappers]
# Production methods returning Vessel that read ActiveVessel but are not
# reader wrappers (their callers are not sites), each with the reason.
"Parsek.TestCommands.ParsekTestCommandAddon::ReadActiveVesselForEditorRoute()" = "TEST-SEAM: the seam's own read for its EditorRoute verbs; the seam refuses them while far-watching (H7)"
"Parsek.FarWatchPlayerVessel::ReadActiveVesselCore()" = "H2: the core of FarWatchPlayerVessel.Resolve, read only while no drone exists; its one caller returns the player ship, which is what a PLAYER-SHIP site wants"
"Parsek.FlightRecorder::ResolveRecordedOrFallbackVessel(Vessel,string)" = "H5: returns the recorded vessel, and the active vessel only when the recorded one is gone and the active vessel is not the drone"
"Parsek.FlightRecorder::ResolveResumeVessel(bool)" = "H5: the false-alarm resume target; the recorded vessel whenever the drone is active"

