# ARRIVES. The required set below pins the HEALTHY state; the old trio moves
# to forbidden so a regression to decline-to-faithful reds legibly.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "ENGAGED re-aim Kerbin->Eve via Sun",
