schema = 1
id = "V8-eve-player-loop"
tier = "operator"
instanceProfile = "stock-minimal"
tags = ["V8", "player-loop", "loop-playback", "reaim", "interplanetary",
        "eve", "inward-transfer", "reading-iteration"]

[fixture]
saveTemplate       = "fixtures/saves/eve-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

# Stub-kill triple is steps 2-4 (the fixture's own parked craft is active, so
# the committed-tree restore path resumes a promotion-stub recording ~1 s into
# the scene - V2/V4's measured behaviour, same entry path). Tracer pins are
# steps 5-7, all BEFORE MissionConfig: verboseLogging is LOAD-BEARING (the
# probe/trace summaries and every [ReaimDiag]/[ReaimSeam]/PhaseLock line this
# reading run exists to collect are VERBOSE).
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig", args = { tree = "16af6b5e546a4bef86fcd8cde1ddc924", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "16af6b5e546a4bef86fcd8cde1ddc924" }, expect = "OK", budget = 300 },
  # Cross-body watch attempt at the cycle-0 relaunch: REJECTED is
  # deterministic (measured on iteration 1) - observer parked at Eve, ghost
  # at Kerbin ascent.
  { cmd = "EnterWatchMode",                                                  expect = "REJECTED" },
  # PACING SPACERS between boundary-straddling jump pairs, and they are
  # LOAD-BEARING: MapRenderTrace.IsLineBlink raises when a proto line's
  # ON/OFF toggle pair lands within LineBlinkFrameWindow = 8 visual frames,
  # and two back-to-back seam TimeJumps execute ~4-7 frames apart in WALL
  # time regardless of the game-seconds between them - so any leg line whose
  # window boundary falls between two adjacent jumps toggles ON at one
  # rebind and OFF at the next, inside the detector window. Runs _0810
  # (Eve-leg line, jump past the rendered window end, sinceFrames=4) and
  # _0814 (Sun-leg line, arrival-seam straddle, sinceFrames=7) both
  # PARSEK-FAILed on exactly that shape; both artifacts are archived and
  # the detector gap is filed in todo-and-known-bugs.md (the bodyChanged
  # exemption's own comment describes these as "two legitimate transitions
  # at a real geometry seam", but the flag does not trip when the line goes
  # dark because the CLOCK left its window rather than its body changing).
  # The RecordingState pairs below add wall frames between the straddling
  # jumps - pacing the seam like a player-scale clock instead of slamming
  # epoch shifts inside one detector window. allowedAnomalies stays [].
  #
  # Mid-Mun-transit observation point: the replay's Mun-frame slice
  # (recorded 11,838,940 -> 11,842,185; no other committed loop lane renders
  # a moon transit inside an interplanetary replay).
  { cmd = "TimeJump", args = { ut = "26527600" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # Kerbin->Sun escape bracket (-188 / -58 / +152 around 26,616,877.9).
  { cmd = "TimeJump", args = { ut = "26616690" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "26616820" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "TimeJump", args = { ut = "26617030" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # Sun->Eve arrival bracket (-189 / -59 / +181 around the recorded-map
  # 30,360,218.7; the re-aimed candidate 30,360,218.8 sits inside it too).
  { cmd = "TimeJump", args = { ut = "30360030" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "30360160" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "TimeJump", args = { ut = "30360400" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # Parked tail, INSIDE the rendered window (which ends 30,450,249.6 - see
  # the header's RENDERED WINDOW END note and the _0810 line-blink finding
  # for why this deliberately does NOT jump past it).
  { cmd = "TimeJump", args = { ut = "30450100" }, expect = "OK", budget = 300 },
  # Same-body watch attempt at the parked tail. PREDICTED REJECTED: the
  # observer's park phase after ~10.7M s of free drift is effectively random
  # against the ghost's, on an ~11,400 km-diameter orbit, vs the measured
  # (51.5 km, 144.3 km) watch-entry boundary (todo ->
  # WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE is the authority; V4's Duna
  # analogue measured REJECTED at 644 km). An OK here would read
  # INVALID(driver-verdict-mismatch) and would itself be a measurement worth
  # having - record the separation either way.
  { cmd = "EnterWatchMode",                                                  expect = "REJECTED" },
  # M-A7 RENDER-COMPOSITION CAPTURE (Phase 3). The recorder accumulates from
  # Awake, so placement decides only how much of this lane's observation is
  # already inside the exported manifest - and on this lane that argument
  # points at exactly one slot. Here, everything is in: the cycle-0 re-aim
  # engagement and its loiter cut (built at unit build, before the first
  # jump), the Mun-transit slice, the Kerbin->Sun escape bracket, the
  # Sun->Eve arrival bracket, the parked tail INSIDE the rendered window,
  # and both watch decisions. Exporting any earlier drops one of the three
  # brackets and with it whichever seam record RC-SEAM would have measured.
  # BEFORE FlushAndQuit, so the manifest is taken at a CHOSEN instant rather
  # than provoked by the scene-exit / teardown auto-flush - which is
  # `hlib`'s stated reason for the verb existing (the teardown composition
  # is not the one the twenty-nine steps above it built).
  # INERT by construction (`hlib.SEAM_VERB_TAIL_ROLE` = inert): it reads the
  # recorder's in-memory accumulation and writes one file in the KSP root,
  # touching no vessel, no save and no Parsek persisted state - so it cannot
  # perturb the two save-structure blocks this lane already gates on, and it
  # adds no TimeJump adjacency for the line-blink detector to see.
  { cmd = "ExportRenderManifest",                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

