[expectations.renderComposition]
# M-A7 Phase 3, ARMED 2026-08-25 by operator decision, off THIS lane's own
# report-only reading run `2026-08-25_0956` (PASS attempt 1, `renderCompose
# status=REPORT gating=false armedBlocks=[] mismatches=[]`, one INFO finding,
# zero WARN, zero FAIL). Every window is written FROM that run's facets - the
# header's RENDER COMPOSITION ledger carries them in full - and NOTHING IN THE
# FLOWN SHAPE MOVED at arming: no jump UT, no pacing spacer, no budget, no
# other expectation. That is the S4.1 rule, held here for the third time on
# this lane.
#
# WHAT ARMING BUYS: `run.py` writes `verifiers["render_composition_mismatch"]`
# only `if rc.gating`, so from here a window miss, a required seam kind absent
# from the chain records, or ANY FAIL-level rule finding classifies the run
# `PARSEK-FAIL(render-composition)`. The lane is registered in
# `RENDERCOMPOSE_ARMED_SPECS` (harness/lib/test_hlib.py).
#
# THE WINDOWS, each against its measurement:
#
#   dwells = { min = 1, max = 32 }   MEASURED 2 (1 open at export).
#     `min` is the ANTI-VACUITY floor - a manifest that observed no dwell at all
#     greened while measuring nothing, the shape this module exists to refuse.
#     `max` is an order-of-magnitude runaway guard, not a pin: the count follows
#     how many Director segments the replay walks, which a legitimate render
#     change may move by a few. Deliberately IDENTICAL to the V14M sibling's, so
#     the pair states ONE claim about the product rather than two claims about
#     two subjects.
#
#   unevaluable = { max = 250 }      MEASURED 76.
#     CEILING ONLY, ~3.3x the reading. 73 of the 76 are `seam-endpoint-skipped`,
#     which scales with the endpoint population (272 records here - 2.5x V14M's,
#     which is why this ceiling is 250 against that lane's 200: the same
#     ratio-to-measurement, not a different standard). That count moves with
#     frame timing rather than correctness, so a tight pin would red on a fast
#     machine. What the ceiling catches is the COLLAPSE case - an instrument that
#     stops measuring turns clauses into unevaluables wholesale. NO `min`: an
#     unevaluable count is not a thing to require.
#
#   requireSeamKinds = ["rigid", "flexible-soi"]
#     MEASURED {rigid: 6, flexible-soi: 4}. Both present, so this arms an
#     existing fact. Sharpest clause in the block: an interplanetary re-aimed
#     replay that stopped carrying a cross-SOI flexible seam would green every
#     count above and red exactly here. Vocabulary is
#     `rendercompose.SEAM_KINDS_REQUIRABLE`, which admits no other token.
#
# `cycles` IS DELIBERATELY OMITTED, and the omission is a MEASUREMENT, not an
# oversight. The reading counted cycles 0 with `clockEvents {cycle-rollover: 1,
# ...}`: RC-CYCLE counts CLOSED cycles, and this subject's single rollover
# bounds no completed one (`no-cycle-rollover-events: 2` is the matching
# unevaluable). A `min = 1` floor would red the very run it was armed off, which
# is dishonest; a `{ min = 0 }` pin can never red at all (counts are never
# negative - `_validate_armed_unreddable` refuses exactly that shape without a
# `max`, and a `max` over a facet measured at zero asserts nothing worth having).
# The anti-vacuity floor this block needs is `dwells`. V14M owns the cycles
# clause; this lane owns the re-aim and the loiter cut.
#
# ALSO NOT DECLARED:
#   * `warpBuckets` - every clock move here is an instantaneous TimeJump, so
#     RC-WARP's histogram is 1x-only BY CONSTRUCTION (measured {warp1x: 296}).
#     Declaring it would pin the drive shape as though it were the product.
#   * any RC-CUT surface, and this is the MEASURED CONSTRAINT the header ledger
#     flagged for arming: this lane owns the corpus's only non-zero loiter cut
#     (loiterCuts=1, cutSeconds=11,819,849) and RC-CUT's whole-ratio check STILL
#     could not evaluate it - the manifest carried no run period to divide by, so
#     `cutWholeRatios` came back empty and `cut-run-period-absent: 1` landed in
#     the census. An RC-CUT window armed off that reading would arm a clause that
#     never fires. It waits for a manifest that carries the period.
#   * any RC-HOLD clause - the `hold-engage`/`hold-release` pair observed at 1x is
#     this reading's headline, but it is ONE pair on ONE run, and the design's own
#     note says sizing that half wants a lane that dwells through a hold at a
#     known warp. One observation is not a window (S4.1's `rewindPoints` lesson).
#
# DISCIPLINE-COMPLETE 2026-08-25: the three-run workflow closed the same day. ARMED
# RE-FLIGHT `2026-08-25_1051` PASS (gating=True, zero mismatches; the reading run's
# `hold-engage`/`hold-release` pair and `reaim-window` event both reproduced);
# NEGATIVE CONTROL `2026-08-25_1054` red on exactly
# `PARSEK-FAIL(render-composition)` through a temporary `dwells = { min = 50 }`
# (single mismatch `renderComposition.dwells 2 < min 50`, every sibling verifier row
# PASS), reverted in the same change. The control was NOT shared with the V14M
# sibling: each lane inverted a window of its own (that one `cycles`, this one
# `dwells`), which proves each block rather than re-proving the shared
# `rendercompose` evaluator. Run ids also recorded in `RENDERCOMPOSE_ARMED_SPECS`
# and in the header ledger.
#
# The DECLARATION (not the arming) is what sets `PARSEK_RENDER_MANIFEST=1` at
# launch, which arms the C# recorder at Awake; without it the export step
# answers `REJECTED msg=manifest-not-armed`. That coupling is enforced
# pre-launch by `hlib.validate_spec`'s verb/block rule.
gating = true
dwells = { min = 1, max = 32 }
unevaluable = { max = 250 }
requireSeamKinds = ["rigid", "flexible-soi"]

