#     REPORT-ONLY in hlib; requiring the line here gates only this lane).
#   * the D11 gate: loiterCuts=1 cutSeconds=11819849, exact - the cut is a
#     pure function of the fixture and the compressor; a different number
#     means the compressor changed and this lane wants to know.
# RE-PINNED AFTER THE TILT-RETENTION FIX (branch reaim-inclined-targets,
# plan docs/dev/plans/reaim-inclined-target-tilt-retention.md). The former
# regression-floor trio (`tilt correction: unreachable target plane`,
# `faithful this window`, the Sun->Eve raise line) red this lane BY DESIGN on
# the fixed DLL - baseline run 2026-08-11_1242, PARSEK-FAIL with EXACTLY
# those three mismatches and every other verifier green: the collected log
# instead carries `re-aimed transfer ready` with devFromRecorded=0s (the
# step-0 candidate won), `tilt-correction ... state=retained
# reason=unreachable-plane` at the modeled inc-before=18.5369, and the
