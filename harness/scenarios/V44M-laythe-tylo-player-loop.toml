schema = 1
id = "V44M-laythe-tylo-player-loop"
# =====================================================================================
# V44M: the Laythe -> Tylo moon-to-moon loop. AUTHORED 2026-11-14.
# LIVE-PROVEN 2026-11-16 on its first flight (run 2026-11-16_0000, PASS attempt 1, 70 s).
# Fixture `laythe-tylo-recorded` harvested --keep-parsek from B44-laythe-tylo-transfer
# run `2026-11-15_2243` (PASS attempt 1, wall 888 s): the fresh Laythe-rooted tree
# 31e761fd179a43d3a27d5d7282af5324 with ONE recording (startBodyName Laythe, terminal
# Orbiting at Tylo, UT 28,817,026.6 -> 29,009,313.1, a 192,286 s span).
# Todo NEXT-TESTS-TO-BUILD-2026-11-11 item 2 / MOON-FLIGHT-TEST-PROGRAM Group B.
#
# WHAT IT READS. The subject is a Laythe-rooted tree that never leaves
# Jool's SOI, so rule 4a (`MissionPeriodicity.ResolveMoonRootedFrameParent`,
# #2554) takes its phase constraints in the moon-rooted frame: Orbital(Tylo) and
# Orbital(Laythe), both same-parent, support Supported. The lane loops the tree
# and reads three lines: the Verbose `ExtractConstraints: moon-rooted frame` line,
# the Verbose ExtractConstraints summary, and the phase-lock decision.
#
# THE PREDICTION (the real `MissionPeriodicity.Solve` driven offline 2026-11-14 over a
# modelled Laythe -> Tylo tree with stock periods: P_Laythe 52,980.88 s, P_Tylo
# 211,926.36 s):
#   ExtractConstraints  launchBody=Laythe support=Supported constraints=2
#                       [Orbital(Tylo) same-parent; Orbital(Laythe) same-parent]
#   Solve               dominant=Tylo, method=dominant-intercept (Laythe is at 4:1
#                       with Tylo, dropped residual ~3 s), P = P_Tylo, withinTol=yes
#   schedule            211,924 s intervals, worst residual ~26 s
# The same period as V43M from a different launch moon: the pair shows the TARGET
# sets the loop. P is pinned to the Tylo period's leading digits, method exactly.
#
# HANDED OVER in the harvest commit: the MissionConfig / StartLoopPlayback tree id is
# the harvested RECORDING_TREE `id`, tier "operator" with tag "pending-flight" (was
# "pending-fixture" / "awaiting-fixture"), "sandbox" back in D14 (the fixture is a
# SANDBOX save), the PENDING_FIXTURE_LANES entry deleted, the fixture registered in
# test_saveparse.RECORDED_FIXTURES, and the count window re-pinned to {1, 2} off the
# fixture's ONE recording (the structure windows already hold its 1 committed tree).
#
# THE LANE IS DELIBERATELY SHORT. It loads the subject, turns its loop on and starts
# loop playback, which is where `MissionLoopUnitBuilder` extracts the phase
# constraints and solves the period; it then quits. No jump table: the cycle seam
# UTs depend on the solver's first window, unknown until this lane's reading. A
# later lane (V17M / V21M shape) can add the jumps off the real bytes. Verbose
# logging is on because both ExtractConstraints lines are Verbose.
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-11-14, LIVE-PROVEN 2026-11-16 (run 2026-11-16_0000). On `laythe-tylo-recorded` (harvested from B44-laythe-tylo-transfer). Loops the Laythe-rooted Laythe -> Tylo tree and reads the moon-rooted phase lock: rule 4a's Orbital(Tylo) + Orbital(Laythe) constraint set, Supported, and the solver's decision."
instanceProfile = "stock-minimal"
tags = ["V44M", "player-loop", "loop-playback", "moon-to-moon", "moon-rooted-phase-lock",
        "laythe", "tylo", "jool", "flown"]

[fixture]
saveTemplate       = "fixtures/saves/laythe-tylo-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig",     args = { tree = "31e761fd179a43d3a27d5d7282af5324", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "31e761fd179a43d3a27d5d7282af5324" }, expect = "OK", budget = 300 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
D14 = ["laythe", "scene-flight", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# {N, N + 1} off the harvested fixture's 1 recording.
count = { min = 1, max = 2 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "ExtractConstraints: moon-rooted frame launchMoon=Laythe planet=Jool launchMoonPeriod=",
  "ExtractConstraints: tree=\\w+ members=[0-9]+ launchBody=Laythe ut0=[^ \\r\\n]+ support=Supported constraints=2 \\[Orbital\\(Tylo\\) same-parent P=[^;\\r\\n]+; Orbital\\(Laythe\\) same-parent P=",
  "PhaseLock APPLIED: mission='[^'\\r\\n]*' tree=\\w+ anchor [^ \\r\\n]+ P=2119[0-9]{2}(\\.[0-9]+)? method=dominant-intercept cadence [^ \\r\\n]+ fixedCadenceResidual=[^ \\r\\n]+ fixedCadenceWithinTol=yes",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "UnsupportedCrossParent",
  "PhaseLock SKIPPED: mission=",
]

[expectations.rewind]
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
committedTrees = { min = 1, max = 1 }
trees          = { min = 1, max = 2 }

[runtime]
# Boot + LoadGame + one StartLoopPlayback (a multi-day forward clock set) + quit;
# V31M's comparable seam lane measured 49 s.
budgetSeconds = 1200

[retry]
policy = "once"

[expectedFail]
bugId = ""
