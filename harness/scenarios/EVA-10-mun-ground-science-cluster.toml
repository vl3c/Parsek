schema = 1
id = "EVA-10-mun-ground-science-cluster"
# NIGHTLY (seam lane on a recorded fixture). Authored 2026-09-28 as the Mun
# variant of EVA-8 (cluster placement, pick-up, re-placement) + a spawn-after-rewind half.
# RE-CUT 2026-09-29 to spawn in FLIGHT like EVA-9 (see THE SPAWN HALF): the Space Center
# never spawns a Mun recording.
#
# HOST: `mun-landing-recorded`, the only committed fixture with a crewed vessel LANDED on
# the Mun (surveyed 2026-09-28 across every `harness/fixtures/saves/*/persistent.sfs`): the
# B13 Kerbal X lander, `#autoLOC_501232` pid 2708531065, Jeb aboard its Mk1-3 pod, landed at
# lat 0.77 lon -124.69, 3,854 m. Boot hygiene is V23M's / EVA-6's (the boot promotes the
# committed tip; stop and discard it). The inventory recipe is EVA-8's (Jeb carries the
# Central Station; the pod's 3-slot container holds the RTG, the seismometer and the Go-ob,
# taken one at a time with `EvaGroundScience action=take`); see EVA-8's header for the carry
# limit that makes this the only stock-legal way to build a cluster from one kerbal.
#
# THE STEP OFF THE LANDER. The first two flights (`2026-09-28_2048`, `_2053_a2`, both
# INVALID) never placed anything: after the ladder release in Mun gravity Jeb stood ON the
# lander, 1.2 m from the pod's origin, and on 7 of 8 face-away turns the placement preview's
# terrain ray hit the lander's own colliders (`placement-timeout part=DeployedCentralStation
# ... onTerrain=true insideCap=false reTurns=8`, `hit=Collider/layer0` / `Base/layer0`). A
# player walks off first. `EvaGroundScience action=step` sets him down on the terrain at
# a horizontal distance and (since 2026-09-29) a compass `bearing=` from the lander's
# origin (KSP has no walk API a seam can drive; the step is a short teleport).
#
# LAYOUT (operator directive 2026-09-29: "place the parts farther away" and "space them out
# more"). Spots on a 19 m ring round the lander at bearings 60 / 75 / 90 / 105: neighbours
# 2 * 19 * sin(7.5 deg) = 5.0 m apart, every part ~17 m or more from the lander even with
# the placement preview's ~0.9 m offset and the lander's centre of mass off its pod. 19 m,
# not EVA-9's 13 m, because the Space Center landed de-overlap keeps a non-sibling landed
# vessel 15 m clear (SpawnCollisionDetector.DefaultLandedSpawnSeparationMeters). Since the
# #1920 follow-up (todo KSC-DE-OVERLAP-MOVES-PLACED-PARTS-OFF-THEIR-SPOT, closed there; EVA-6
# is its regression lane) a vessel of an earlier committed tree standing there first no
# longer pushes a placed part either, but 19 m keeps this lane's subject to the SIBLING
# exemption alone, whichever build it flies on. Between
# placements Jeb steps to 3.5 m from the pod on the next part's bearing: that clears the
# landing legs (the LT-2 feet reach about 2.5 m from the axis) and keeps the pod inside
# stock's GameSettings.EVA_INVENTORY_RANGE (5 m, measured to the nearest point of its
# colliders): the pod's rim is ~2.25 m out and ~3.2 m up (VESSEL hgt 4.18), about 3.9 m. A
# take refused `out-of-range ... distance=... range=5.00` reads as that geometry, not as a
# defect. For the pick-up he steps to 2 m outside the placed seismometer (the step anchored
# on its `vesselPid`, captured from the place step's payload as `${seis.vesselPid}`; pick-up
# reach is 4 m) and re-places it from there; at the end he steps to 4.5 m on bearing 270,
# the far side of the lander. Steps inside the recording are teleports: the kerbal's ghost
# slides between spots, which no recorder path or analyzer rule reads as a defect.
#
# KEEP NEIGHBOURS UNDER ~6 m APART (the lane now spawns in FLIGHT, see THE SPAWN HALF). The
# exemption this lane requires is logged only when a member's spawn finds a standing sibling
# inside its flight overlap box, 6.25 m per side; past ~6 m the neighbours stop overlapping
# and the lane stops testing #1920 while still reading green. The 19 m ring (chosen when the
# spawn was the Space Center's 15 m de-overlap) also keeps every part outside the lander's box.
#
# THE SPAWN HALF (re-cut after `2026-09-29_1937`). The first design spawned the cluster from
# the Space Center; that flight reached UT 23430 with ZERO [KSCSpawn] lines, because
# `ParsekKSC.IsKscStructurallyEligible` (ParsekKSC.cs:1555) admits only recordings whose first
# point is on Kerbin. So the lane now spawns in FLIGHT, EVA-9's recipe: commit through the
# scene exit, back into FLIGHT, Rewind-to-Launch, SaveGame + LoadGame straight back into FLIGHT
# on the lander (a Space Center save focuses vessel 0, the lander once the asteroid is gone)
# before any member ends, and 640 steps of 1x flight time cross every EndUT. Each member left
# standing - and Jeb - spawns through the chain-tip spawn with the flight collision check; the
# picked-up seismometer member (Disassembled) never spawns. Witnesses: the committed store's
# read-back (ListHandles rows rec11..rec16, see the count derivation) right after the reload
# (the Central Station not yet spawned) and after the wait (every member and Jeb spawned with
# a pid), tied to each member by its rec id.
#
# THE #1920 WITNESS. The flight check pads a one-part vessel's bounds by 5 m per side
# (`halfExtents=(6.3,6.3,6.3)`), so each later member's spawn finds its ~5 m neighbour inside
# its box and must be exempted as a co-existing tree sibling (`Overlap exempt: co-existing
# tree sibling spawn:` or `... original:`), required for the RTG and the re-placed seismometer; walkback
# exhaustion and abandoned spawns are forbidden. On a pre-#1920 DLL the later members are
# blocked and their read-backs stay `false`. The lander stands ~19 m away, outside every
# member's box, and is the active vessel (skipped by the check) after the reload. Jeb ends
# 4.5 m from it on bearing 270.
#
# STAGGERED ENDS (EVA-9's first-flight lesson). A member recorded for 30 s or less is not
# trimmed, so it ends at the commit, and members that end in the same frame spawn with no
# sibling standing yet. The walk / take / walk / place cycle spaces the placements, and
# ~40 s of idle before the commit makes every member trim to its own placement + ~10 s
# (required per member), so each later member spawns beside an earlier one and the fix path
# runs for it. The trim runs only in the SCENE-EXIT auto-commit (EVA-9's second-flight
# finding: the seam CommitTree runs no optimization pass, todo
# IN-FLIGHT-COMMIT-SKIPS-OPTIMIZATION-PASS), so the lane commits the way a player does:
# `autoMerge=true`, `ExitToSpaceCenter` with the recording running, then SaveGame + LoadGame
# back into FLIGHT on the lander (the asteroid removed so a Space Center save focuses it)
# for the rewind verb, which needs FLIGHT.
#
# KNOWN PREAMBLE FLAKE: see EVA-9's header (the 1 Hz committed-spawned restore retry can
# re-adopt the lander right after the boot's DiscardTree; retried once).
tier = "nightly"
description = "Mun ground-science cluster: on mun-landing-recorded Jeb climbs out of the landed Kerbal X carrying a Central Station and places a four-part cluster on a 19 m ring round the lander, neighbours ~5 m apart (action=step walks him between the pod, where he takes the RTG, the seismometer and the Go-ob one at a time, and each part's own bearing); he picks the seismometer up and places it again; he leaves for the Space Center, whose scene-exit auto-commit trims every member to a staggered end; back into FLIGHT, Rewind-to-Launch, SaveGame + LoadGame straight back into FLIGHT on the lander, and 1x flight time spawns every member left standing (and Jeb) in FLIGHT, the picked-up member never. Each later member's spawn finds its ~5 m neighbour inside its overlap box and is exempted as a co-existing tree sibling (fix #1920)."
instanceProfile = "stock-minimal"
tags = ["eva", "inventory", "ground-science", "breaking-ground", "cluster", "mun", "rewind-to-launch", "spawn", "EVA-10"]

[fixture]
saveTemplate       = "fixtures/saves/mun-landing-recorded"
injectedRecordings = "none"
craft              = []

# The index-0 asteroid (Ast. MII-526) goes, so the lander is what a Space Center save
# focuses when the lane goes back into FLIGHT for the rewind (EVA-9's recipe; savepatch
# keeps the boot focus on the lander, activeVessel 1 -> 0).
[[fixture.liveState]]
pid    = 2815888106
remove = true

[[fixture.crewInventory]]
kerbal    = "Jebediah Kerman"
inventory = "DeployedCentralStation"

[[fixture.partInventory]]
pid       = 2708531065
part      = "mk1-3pod"
inventory = "DeployedRTG,DeployedSeismicSensor,DeployedGoExOb"

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnEva",    value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoMerge",          value = "true" },  expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva10-boot" },                    expect = "OK" },
  { cmd = "EvaExit",    args = { release = "true" },                         expect = "OK", budget = 120 },
  # Out to the Central Station's spot on the 19 m ring before the recording starts (LAYOUT).
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "19", bearing = "60" }, expect = "OK", budget = 120 },
  { cmd = "StartRecording",                                                  expect = "OK", budget = 180 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedCentralStation", faceAway = "true" }, expect = "OK", budget = 120 },
  # Per part: back to 3.5 m from the pod (a take reaches 5 m), take it, out to its spot, place it.
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "3.5", bearing = "75" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedRTG" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "19", bearing = "75" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedRTG", faceAway = "true" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "3.5", bearing = "90" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedSeismicSensor" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "19", bearing = "90" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedSeismicSensor", faceAway = "true" }, label = "seis", expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "3.5", bearing = "105" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedGoExOb" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "19", bearing = "105" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedGoExOb", faceAway = "true" }, expect = "OK", budget = 120 },
  # The pick-up: over to 2 m outside the seismometer (pick-up reach is 4 m), pick it up, and
  # place it again from there, a couple of metres further out than its first spot.
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "${seis.vesselPid}", distance = "2", bearing = "90" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "pickup", part = "DeployedSeismicSensor" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedSeismicSensor", faceAway = "true" }, expect = "OK", budget = 120 },
  # Jeb walks back to the far side of the lander, clear of every part.
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "4.5", bearing = "270" }, expect = "OK", budget = 120 },
  # ~40 s of idle so every member records more than 30 s and trims to a staggered end.
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva10-idle" }, expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva10-idle" }, expect = "OK" },
