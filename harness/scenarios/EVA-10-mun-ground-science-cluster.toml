[expectations.recordings]
# MEASURED, `2026-09-29_2018`: the produced save holds 19 `.prec` sidecars (this facet counts
# them). The fixture's 8 recordings are split into 11 by the cold boot's optimization pass; the
# boot's re-adopted lander is committed standalone as a 2-point segment (12); this tree adds 6
# (Jeb and five placed members) = 18 in the store (`Total committed: 18 recordings, 2 trees`); the
# 19th sidecar is not identified. `ListHandles kind=committed` lists 17 rows (tree members, the
# standalone is in no tree): this tree's rows are rec11..rec16 in the marks. The standalone
# segment also respawns a twin of the kept lander after the rewind, todo
# REWIND-KEPT-VESSEL-RESPAWNED-BY-STANDALONE-SEGMENT.
count = { min = 17, max = 19 }

[expectations.logContracts]
required = [
  "evaexit complete",
  "startrecording recordingId=[0-9a-f]+ already=false",
  "evagroundscience place start kerbal=Jebediah Kerman part=DeployedCentralStation slot=0 inventory=0:DeployedCentralStation",
  "evagroundscience take start kerbal=Jebediah Kerman part=DeployedRTG source=[^\\r\\n]* sourcePart=mk1-3pod sourceSlot=0 sourceInventory=0:DeployedRTG,1:DeployedSeismicSensor,2:DeployedGoExOb kerbalSlot=0 inventory=<empty> ",
  "evagroundscience take complete part=DeployedGoExOb [^\\r\\n]*sourceInventory=<empty>",
  "Ground part placed: tree member created part='DeployedCentralStation' vesselPid=[0-9]+ partPid=([0-9]+) rec=([0-9a-f]+) parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True[\\s\\S]*Part event captured: InventoryPartPlaced 'DeployedCentralStation' pid=\\1 via onDeployGroundPart rec=\\2",
  "Ground part placed: tree member created part='DeployedRTG' vesselPid=[0-9]+ partPid=([0-9]+) rec=([0-9a-f]+) parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True[\\s\\S]*Part event captured: InventoryPartPlaced 'DeployedRTG' pid=\\1 via onDeployGroundPart rec=\\2",
  "Ground part placed: tree member created part='DeployedGoExOb' vesselPid=[0-9]+ partPid=([0-9]+) rec=([0-9a-f]+) parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True[\\s\\S]*Part event captured: InventoryPartPlaced 'DeployedGoExOb' pid=\\1 via onDeployGroundPart rec=\\2",
  "Ground part placed: tree member created part='DeployedSeismicSensor' vesselPid=([0-9]+) partPid=([0-9]+) rec=([0-9a-f]+) [\\s\\S]*evagroundscience pickup start kerbal=Jebediah Kerman part=DeployedSeismicSensor partPid=\\2 vesselPid=\\1 [\\s\\S]*Part event captured: InventoryPartRemoved 'DeployedSeismicSensor' pid=\\2 via onGroundSciencePartRemoved rec=\\3[\\s\\S]*Recording terminal: kind=Disassembled reason=ground-part-retrieved vessel='[^'\\r\\n]*' pid=\\1 parts=1 rec=\\3 ",
  "Ground part placed: tree member created part='DeployedSeismicSensor' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*evagroundscience pickup complete part=DeployedSeismicSensor[\\s\\S]*Ground part placed: tree member created part='DeployedSeismicSensor' vesselPid=[0-9]+ partPid=([0-9]+) rec=(?!\\1)([0-9a-f]+) [^\\r\\n]*snapshot=True[\\s\\S]*Part event captured: InventoryPartPlaced 'DeployedSeismicSensor' pid=\\2 via onDeployGroundPart rec=\\3",
  # Off the lander before the recording (the step's completion line).
  "evagroundscience step complete kerbal=Jebediah Kerman anchor=[^\\r\\n]* horizontal=[0-9.]+ situation=LANDED",
  # Every step move told the kerbal's CollisionEnhancer to skip its next frames (EVA-8
  # `2026-09-29_1618`: without it the anti-tunnelling guard put him straight back).
  "evagroundscience step move kerbal=Jebediah Kerman move=1 collisionEnhancersSkipped=[1-9][0-9]* skipFrames=[0-9]+ method=anchor-release\\+rb-pose ",
  # Every settled step stands with its feet on the ground collider (the operator watched a
  # step end half inside the ground on `_1931`): the set-down is a raycast onto layer 15.
  "evagroundscience step ground kerbal=Jebediah Kerman feetClearance=-?[0-9.]+ [^\\r\\n]*groundSource=raycast ok=true",
  # THE LAYOUT: every spot at its own compass bearing on the 19 m ring.
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=19\\.00 [^\\r\\n]*bearing=60\\.0",
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=19\\.00 [^\\r\\n]*bearing=75\\.0",
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=19\\.00 [^\\r\\n]*bearing=90\\.0",
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=19\\.00 [^\\r\\n]*bearing=105\\.0",
  # The pick-up step was anchored on the placed seismometer (the captured vesselPid).
  "Ground part placed: tree member created part='DeployedSeismicSensor' vesselPid=([0-9]+) [\\s\\S]*evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* anchorPid=\\1 [^\\r\\n]*bearing=90\\.0",
  # THE COMMIT: the player's scene exit, whose auto-commit runs the optimization pass.
  "exittospacecenter complete scene=SPACECENTER",
  "full-fidelity auto-commit \\(scene-exit[^\\r\\n]*\\): tree='Jebediah Kerman' recordings=6 ",
  # THE STAGGER: every standing member trims to ~13 s after its own placement.
  "Ground part placed: tree member created part='DeployedCentralStation' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*TrimBoringTail: trimmed '[^'\\r\\n]*' \\(\\1\\) from endUT=",
  "Ground part placed: tree member created part='DeployedRTG' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*TrimBoringTail: trimmed '[^'\\r\\n]*' \\(\\1\\) from endUT=",
  "Ground part placed: tree member created part='DeployedGoExOb' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*TrimBoringTail: trimmed '[^'\\r\\n]*' \\(\\1\\) from endUT=",
  "Captured rewind save at UT ([0-9.]+): vessel \\\"Jebediah Kerman\\\" in [A-Z_]+ \\(save: (parsek_rw_[0-9a-f]+)\\)[\\s\\S]*Rewind-to-Launch initiated to UT \\1 \\(save: \\2\\)",
  "invokerewindtolaunch complete rec=[0-9a-f]{32} tree=[0-9a-f]{32} adjustedUT=",
  # EVERY member left standing spawns on the Mun from the Space Center (EVA-6's pair).
  # The fix's own witness (#1920), per member placed after the Central Station: its Space
  # Center spawn found an earlier sibling standing and the de-overlap exempted it.
  "MISSIONMARK label=eva10-commit-count-17(?:\\s|$)",
  # Right after the reload no member is spawned yet (the reload beat every EndUT).
  "Ground part placed: tree member created part='DeployedCentralStation' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-reloaded-count-17-[^\\r\\n]*-\\1-false(?:-|\\s)",
  # EVERY member left standing spawned in FLIGHT, read back from the committed store.
  "Ground part placed: tree member created part='DeployedCentralStation' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-spawned-count-17-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "Ground part placed: tree member created part='DeployedRTG' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-spawned-count-17-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "Ground part placed: tree member created part='DeployedGoExOb' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-spawned-count-17-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "evagroundscience pickup complete part=DeployedSeismicSensor[\\s\\S]*Ground part placed: tree member created part='DeployedSeismicSensor' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-spawned-count-17-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  # And Jeb.
  "startrecording recordingId=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-spawned-count-17-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  # The fix's own witness (#1920) in FLIGHT: each later member spawned while an earlier
  # sibling stood inside its overlap box, and was exempted.
  "Ground part placed: tree member created part='DeployedRTG' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-reloaded-count[\\s\\S]*Overlap exempt: co-existing tree sibling (?:spawn|original): site=[^\\r\\n]* rec=\\1 blocker=",
  # The Go-ob spawns before the re-placed seismometer and its only earlier neighbour (the
  # first seismometer) was picked up, so it spawns clear; the re-placed seismometer is the
  # member that finds standing siblings (`_2018`: the Go-ob and the RTG, both exempted).
  "evagroundscience pickup complete part=DeployedSeismicSensor[\\s\\S]*Ground part placed: tree member created part='DeployedSeismicSensor' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-reloaded-count[\\s\\S]*Overlap exempt: co-existing tree sibling (?:spawn|original): site=[^\\r\\n]* rec=\\1 blocker=",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "evagroundscience failed",
  "evagroundscience refused",
  # A step that settled off the ground, or fell back to the PQS height.
  "evagroundscience step ground [^\\r\\n]*ok=false",
  "evagroundscience step move [^\\r\\n]*groundSource=pqs",
  # A step set down lower than the stale cached terrain of the spot he left killed him (EVA-8 flight 1).
  "Vessel Jebediah Kerman crashed through terrain",
  "Ground part placement not recorded",
  "Ground part placement dropped",
  "Part event captured: InventoryPartRemoved[^\\r\\n]*[\\s\\S]*Part event captured: InventoryPartRemoved",
  "invokerewindtolaunch refused",
  "Spawn RETIRED",
  "Spawn ABANDONED",
  "Spawn FAILED",
  "Overlap not exempt: tree sibling (?:spawn|original)",
  "Ghost-only auto-commit",
  # Every part stands ~19 m from the lander, past the 15 m landed de-overlap, and its
  # neighbours are exempted siblings: no member of the cluster is moved.
  "De-overlap for #[0-9]+ \\\"(?:Probodobodyne Experiment Control Station|Mini-NUK-PD Radioisotope Thermoelectric Generator|Grand Slam Passive Seismometer|Go-ob ED Monitor)\\\": nudged",
  # The picked-up member is Disassembled: nothing spawns it.
  "Recording terminal: kind=Disassembled reason=ground-part-retrieved [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva10-spawned-count-[^\\r\\n]*-\\1-true-",
  # THE DEFECT's FLIGHT shape.
  "Trajectory walkback EXHAUSTED",
  "Spawn not needed for #[0-9]+ \\\"Jebediah Kerman\\\": non-leaf in tree",
]

[runtime]
# The act budget of EVA-8 + 9 steps + 40 s idle + 120 ExitToSpaceCenter + 120 SaveGame +
# 300 LoadGame + 300 rewind + 120 SaveGame + 300 LoadGame + ~160 s flight wait + 120 SaveGame
# + margin.
budgetSeconds = 3000

[retry]
policy = "once"
