schema = 1
id = "EVA-10-mun-ground-science-cluster"
# NIGHTLY (seam lane on a recorded fixture). NEVER FLOWN: authored 2026-09-28 as the Mun
# variant of EVA-8 (cluster placement, pick-up, re-placement) + a spawn-after-rewind half,
# taken at the SPACE CENTER on purpose so the two cluster spawn lanes cover both spawn
# paths: EVA-9 spawns its Kerbin cluster in FLIGHT (the collision refusal), this lane
# spawns its Mun cluster from the Space Center (`ParsekKSC.TrySpawnAtRecordingEnd`, which
# runs no collision check but a landed DE-OVERLAP nudge instead).
#
# HOST: `mun-landing-recorded`, the only committed fixture with a crewed vessel LANDED on
# the Mun (surveyed 2026-09-28 across every `harness/fixtures/saves/*/persistent.sfs`): the
# B13 Kerbal X lander, `#autoLOC_501232` pid 2708531065, Jeb aboard its Mk1-3 pod, landed at
# lat 0.77 lon -124.69, 3,854 m. Boot hygiene is V23M's / EVA-6's (the boot promotes the
# committed tip; stop and discard it). The inventory recipe is EVA-8's (Jeb carries the
# Central Station; the pod's 3-slot container holds the RTG, the seismometer and the Go-ob,
# taken one at a time with `EvaGroundScience action=take`); see EVA-8's header for the carry
# limit that makes this the only stock-legal way to build a cluster from one kerbal.
#
# THE MUN-SPECIFIC RISK. The Mk1-3 pod sits on top of the lander, about 4 m above the
# ground (VESSEL hgt 4.18), and a take is gated by stock's GameSettings.EVA_INVENTORY_RANGE
# (5 m, measured from the kerbal to the nearest point of the pod's colliders). A kerbal who
# lets go of the ladder and lands beside the legs may be just out of that reach: a
# `evagroundscience refused reason=out-of-range part=DeployedRTG distance=... range=5.00`
# on the first reading run is the geometry, not a defect, and the remedy is a host with a
# ground-level container (todo GROUND-SCIENCE-CLUSTER-FIVE-PART-HOST), never a larger reach.
#
# THE SPAWN HALF. Commit, Rewind-to-Launch (lands at the Space Center 15 s before the
# kerbal recording started), and 1x Space Center time crosses every EndUT, so each member
# left standing - and Jeb - spawns through the ordinary [KSCSpawn] spawn-at-end, never
# retired (the Mun is outside the KSC exclusion zone by construction). The picked-up
# seismometer member (Disassembled) never spawns. Per-member witnesses are EVA-6's KSC
# spawn pair tied to each member's rec id.
#
# THE SPACE CENTER TWIN OF PLACED-PART-CLUSTER-SPAWN-BLOCKED-BY-SIBLING. The landed
# de-overlap moves every non-EVA surface spawn 15 m clear of each existing landed vessel,
# which scatters a cluster whose members stand a metre or two apart (measured on EVA-6's
# green run `2026-09-27_1815`: `De-overlap for #10 "Grand Slam Passive Seismometer":
# nudged 15.0m`). Fix PR #1920 exempts co-existing tree SIBLINGS there and logs
# `Overlap exempt: co-existing tree sibling spawn: site=landed-de-overlap ...`, required
# below. It does NOT exempt the capsule (a pre-existing real vessel, not a spawn of this
# tree), so a member standing inside 15 m of the lander is still nudged after #1920; that
# is todo KSC-DE-OVERLAP-MOVES-PLACED-PARTS-OFF-THEIR-SPOT, which is why the nudge line is
# not forbidden here. EXPECTED-FAIL until #1920 is on the flown DLL, on exactly the one
# token only the fix prints (predicted, never read off a run).
tier = "nightly"
description = "Mun ground-science cluster: on mun-landing-recorded Jeb climbs out of the landed Kerbal X carrying a Central Station, places it, takes the RTG, the seismometer and the Go-ob one at a time out of the lander pod's container and places each, picks the seismometer up and places it again; commit, Rewind-to-Launch, and 1x Space Center time spawns every member left standing (and Jeb) on the Mun through the KSC spawn-at-end, the picked-up member never. Each placement is its own GroundPartPlaced member. EXPECTED-FAIL until fix PR #1920's sibling de-overlap exemption is on the flown DLL."
instanceProfile = "stock-minimal"
tags = ["eva", "inventory", "ground-science", "breaking-ground", "cluster", "mun", "rewind-to-launch", "spawn", "EVA-10"]

[fixture]
saveTemplate       = "fixtures/saves/mun-landing-recorded"
injectedRecordings = "none"
craft              = []

[[fixture.crewInventory]]
kerbal    = "Jebediah Kerman"
inventory = "DeployedCentralStation"

[[fixture.partInventory]]
pid       = 2708531065
part      = "mk1-3pod"
inventory = "DeployedRTG,DeployedSeismicSensor,DeployedGoExOb"

