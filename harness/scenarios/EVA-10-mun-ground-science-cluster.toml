  { cmd = "LoadGame",   args = { save = "${runSave}", name = "eva10-rewound" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
