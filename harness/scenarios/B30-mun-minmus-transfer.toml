id = "B30-mun-minmus-transfer"
# =====================================================================================
# B30: MUN -> MINMUS. THE SECOND MOON-TO-MOON TRANSFER, AND IT IS A REPLICATION.
#
# The crewed Kerbal X upper stage starts ALREADY PARKED in the 139,612 x 139,526 m
# Mun orbit B11 delivered, escapes Mun into KERBIN's frame, transfers to MINMUS,
# captures into a Minmus park and commits the tree there. THE RECORDING IS THE
# PRODUCT.
#
# WHY THIS LANE EXISTS, and it is NOT "a seventh moon". `B26-laythe-vall-transfer`
# flew the suite's first moon-to-moon hop and `V17M`/`V17T` read its routing: Parsek
# NEITHER re-aims NOR phase-locks a moon-to-moon recording - it replays it faithfully
# on the raw cadence (H3). That answer was measured ONCE, at ONE parent, on ONE pair
# of moons. `docs/dev/research/same-parent-reaim-jool-system.md` section 11.3 states
# the mechanism as a property of the FLIGHT PROFILE rather than of the pair - "THE
# MECHANISM IS THE FLIGHT PROFILE'S, NOT THE PAIR'S" - but THAT IS A PREDICTION.
# Roadmap gap G4 exists to convert it into a measurement at a second parent, and this
# is that lane's subject.
#
# Mun and Minmus ARE sibling moons of Kerbin, so `IsSameParentTarget` classifies a
# Mun-rooted recording targeting Minmus CROSS-PARENT exactly as it classified
# Laythe/Vall. The subject therefore also replicates the FAIL-CLOSED NESTED-SOI
# render policy at a second parent - the trigger is the SIBLING RELATION, not the
# seam count (`FailClosedClassifier` / `NestedSoiSubtree.FindNestedRoot`).
#
# **THIS SPEC ASSERTS NOTHING ABOUT THE ROUTING.** B30 produces the subject; `V21M`
# and `V21T` read it, carry the hypotheses, and gate on none of them. A DIFFERENT
# outcome at this parent would be the finding of the lane, and pre-judging it here
# would destroy that.
#
# STATUS: **AUTHORED, NOT YET FLOWN.** Every number below is DERIVED - from the
# fixture's own bytes, from cited stock constants, and from `mlib`'s own formulas -
# and nothing is copied from B26. The pre-registered observation targets are written
# down BEFORE the flight precisely so the post-flight paragraph cannot be written
# after the fact.
#
# =====================================================================================
# WHAT IS NEW HERE, named so the readings are ATTRIBUTED rather than pooled with B26's
# =====================================================================================
#
# (a) A DIFFERENT PARENT. That is the replication's whole purpose and needs no
#     further defence. Everything B26 measured at Jool is re-measured at Kerbin.
#
# (b) **MINMUS IS INCLINED ~6 deg**, where Laythe and Vall are BOTH coplanar with
#     Jool's equator (the research doc's section 5.1 walk notes the tilt gate is "a
#     no-op here ... this is the EASIEST pair in the system for that gate"). So the
#     stage-2 plan and the capture carry a plane-change cost B26 never paid:
#         2*v*sin(3 deg) at Mun's orbital radius (12 Mm)   =  71.67 m/s
#         2*v*sin(3 deg) at the transfer apoapsis (47 Mm)  =  18.30 m/s
#         2*v*sin(3 deg) to match Minmus's circular speed  =  28.69 m/s
#     MechJeb's `OperationTransfer` plans a COMBINED manoeuvre, so the term is priced
#     INSIDE the stage-2 node rather than added beside it, and the derived stage-2
#     band below already contains it (taken at the cheap end, the apoapsis).
#     **THE ONE-DIMENSION-AT-A-TIME RULE IS UNAVOIDABLY BENT BY THIS LANE.** It
#     changes the parent AND adds an inclined target in one step. The honest
#     consequence, stated before the flight rather than discovered after it: a
#     stage-2 node materially ABOVE the derived band cannot be attributed to the
#     parent change alone. It is bent because the alternative - a coplanar sibling
#     pair under a second parent - DOES NOT EXIST in the stock system; Kerbin has
#     exactly two moons and one of them is inclined.
#
# (c) **THE PARENT ENVELOPE IS 12.9x TIGHTER, AND IT INVERTS THE ESCAPE'S BINDING
#     CONSTRAINT.** This is the structural difference that makes the lane more than
#     a parameter swap:
#         Kerbin SOI / Mun SMA     =  7.01x       Jool SOI / Laythe SMA = 90.35x
#         Minmus SMA / Kerbin SOI  = 55.8%        Vall SMA / Jool SOI   =  1.8%
#     The DESTINATION sits over HALF WAY to the parent's SOI edge. So the unaimed
#     escape's high-energy tail does not merely overshoot the target the way B26's
#     did - **IT LEAVES THE PARENT SYSTEM**, which is a lane-ending outcome B26 never
#     had to size against. See THE ESCAPE, below: B26 had to OVER-size its escape
#     (450 against a 347.245 ideal) to clear a reachability floor; this lane
#     deliberately UNDER-sizes its escape (110 against a 142.257 ideal) to hold the
#     Kerbin-escape tail at 0.1% of the unaimed band. Same mode, opposite binding
#     constraint.
#
# (d) TWO CONSEQUENCES OF (c) THAT ARE WORTH WRITING DOWN SEPARATELY, because they
#     change what the numbers below are sized against rather than merely their values:
#     * THE SEAM MAGNITUDE IS **WORSE** HERE, not better. The research doc's section
#       5.2 SOI/SMA table already carries Mun at **20.25%** against Laythe's 13.70%;
#       Minmus adds 2,247,428.4 / 47,000,000 = **4.78%** against Vall's 5.58%. The
#       two seam gaps are 2.4296 Mm + 2.2474 Mm = 4.677 Mm. Nothing in THIS spec
#       gates on that - it is the V21 lanes' problem - but it is why the fail-closed
#       policy replication is worth having at this pair specifically.
#     * **MUN AND MINMUS ARE NOT RESONANT.** B26's pair sits in Jool's 1:2:4 chain,
#       which put P_Vall and the Laythe-Vall synodic 0.6615 s apart and made V17's
#       two candidate jump tables IDENTICAL on cycle 1. P_Minmus / P_Mun = 7.7513
#       and synodic / P_Minmus = 0.1481, so THAT CONVENIENCE DOES NOT EXIST HERE and
#       V21M/V21T's seed calibration is genuinely harder than V17's was. Flagged for
#       those lanes, not for this one.
#
# =====================================================================================
# THE MODE, INHERITED VERBATIM. No new machinery, and that is the claim.
# =====================================================================================
# This lane flies B26's flag-gated PARENT-RELAY mode (`parentRelayTransfer`) exactly
# as built and live-proven on B26 flight 3 and again on B28. It adds NO code. The
# ONLY thing `mlib` needed for this lane is one CITED row in `STOCK_BODY_GRAVITY` -
# Mun's (mu, equatorial radius, SOI radius) triple - and that is the whole diff.
#
#   STAGE 1, "ESCAPE": mlib computes ONE PROGRADE node itself, at the park's NEXT
#   PERIAPSIS, sized so the departure carries `escapeSoiSpeedMps` of relative speed
#   ACROSS MUN'S SOI BOUNDARY:
#       r  = R_Mun + periapsis_altitude                (the EXACT burn radius)
#       a  = R_Mun + (ap_alt + pe_alt) / 2
#       v  = sqrt(mu * (2/r - 1/a))                    (vis-viva, exact)
#       dv = sqrt(v_soi^2 + 2*mu*(1/r - 1/r_soi)) - v
#   kRPC's OWN `Control.add_node` places it - core kRPC, no MechJeb planner - which
#   is why B26 flight 1's moon-origin refusal cannot recur. The SAME autowarping
#   NodeExecutor flies it under the SAME watchdogs, and the coast out to Mun's SOI is
#   the SAME COAST-TO-TARGET leg.
#
#   STAGE 2 IS NOT A PHASE. On the first coast frame whose SOI body reads KERBIN, the
#   machine re-enters PLAN-TRANSFER at `relay_stage 1`, where the plan action is
#   MechJeb's MOON-path `OperationTransfer` - legal there BY CONSTRUCTION, because
#   vessel and target then orbit the same body.
#
# THE `- 1/r_soi` TERM IS B26 FLIGHT 2's DEFECT-A FIX AND IT IS A PROPERTY OF THE
# GAME, NOT OF LAYTHE. KSP is a PATCHED-CONIC game: it hands a departing vessel to
# the parent AT THE SOI BOUNDARY, never at infinity. AT MUN the two references differ
# by a factor of **2.33** - a 110 m/s ASYMPTOTIC request would deliver
# `sqrt(110^2 + 2*mu_Mun/r_soi)` = **256.36 m/s** at the boundary - against 3.12x at
# Laythe. Smaller, because Mun's well is shallower relative to its SOI, but the same
# defect and the same fix. The sharpest statement of it at this pair: the CORRECTLY
# sized escape here has a specific energy of **-20,760.8 m^2/s^2**, i.e. it is BOUND
# and has NO asymptotic excess at all, so the quantity the pre-fix formula aimed at
# DOES NOT EXIST for this orbit.
#
# =====================================================================================
# THE ESCAPE, AND WHY 110 - the one derivation this lane could not inherit
# =====================================================================================
# THE GEOMETRIC FLOOR still exists and still binds from below. `escape_node_plan`
# REFUSES a request under it BY NAME rather than clamping, so the value must be
# checked against the WHOLE ENTRY GATE and not just against the fixture:
#     smallest deliverable SOI speed = sqrt(2*mu*r_p / (r_soi*(r_soi + r_p)))
#     at the FIXTURE's park (r_p = 339,526.064)          =  81.08 m/s
#     at the ENTRY GATE's worst corner (round park on the
#       250,000 m apoapsis ceiling)                      =  91.54 m/s
# 110 clears the fixture's floor by **35.7%** and the gate's worst corner by
# **20.2%**, so every park the gate declares legal is actually deliverable. (That
# coupling is exactly what B26 flight 2's defect-A fix forced it to discover: the
# floor RISES with the park, so a too-generous ceiling admits parks whose floor sits
# ABOVE the requested speed and the lane dies in ESCAPE with a correct-but-baffling
# give-up.)
#
# THE CEILING IS NEW, AND IT IS THE PARENT'S SOI. Swept over every v_rel direction
# and every exit point on Mun's 2.4296 Mm SOI shell (B26's `_band()` method, 28,224
# samples: 24 exit azimuths x 7 tilts, squared), the delivered KERBIN-frame orbit:
#
#   escapeSoiSpeedMps | a_min  | ap_max   | pe_min | ESCAPES KERBIN | sub-atmosphere
#   ------------------|--------|----------|--------|----------------|---------------
#      100            | 6.51Mm |  77.66Mm | 3.456Mm|    0  (0.0%)   |   0
#   ** 110 COMMITTED**| 6.41Mm |  96.37Mm | 3.249Mm|   29  (0.1%)   |   0
#      120            | 6.31Mm | 125.17Mm | 3.053Mm|  217  (0.8%)   |   0
#      142.26 (IDEAL) | 6.11Mm | 328.26Mm | 2.653Mm| 1135  (4.0%)   |   0
#      150            | 6.05Mm | 695.66Mm | 2.525Mm| 1457  (5.2%)   |   0
#      200            | 5.69Mm | 4011.6Mm | 1.809Mm| 4127 (14.6%)   |   0
#
# READ TWO THINGS OFF IT. (1) The SUB-ATMOSPHERE hazard B26's FLOWN (broken) contract
# had - 5.51 Mm periapsides below Jool's atmosphere top - **DOES NOT EXIST HERE at
# any tested speed**: the worst periapsis at 110 is 3.249 Mm, 4.85x Kerbin's 670 km
# atmosphere top. (2) The KERBIN-ESCAPE hazard DOES exist and it is what sets the
# number. The IDEAL Hohmann excess (142.257) would put 4.0% of the unaimed band OUT
# OF KERBIN'S SOI ENTIRELY - into the Sun's - which `_b5_coast_bodies` = ("", "Mun",
# "Kerbin") makes an immediate ASSERT-FAIL. 110 holds it at 0.1% (29 of 28,224) while
# still clearing the geometric floor by 35.7%.
#
# **SO THIS LANE DELIBERATELY UNDER-SIZES ITS ESCAPE RELATIVE TO THE IDEAL, WHICH IS
# THE EXACT INVERSE OF B26.** B26 could not ask for its ideal 347.245 because the
# geometry could not deliver below 370.08 and it had to go UP to 450; B30 could ask
# for its ideal 142.257 and goes DOWN to 110 because the parent's SOI is close. Same
# mode, opposite binding constraint - and the reason is (c) above.
#
# WHAT UNDER-SIZING COSTS, priced rather than waved at: a smaller escape leaves the
# craft on a Kerbin orbit nearer Mun's own radius, so STAGE 2 pays more of the
# transfer. Swept over the same 28,224 deliveries (burn at the delivered periapsis to
# raise apoapsis to Minmus's radius, plus the 6 deg plane change at the transfer
# apoapsis), the stage-2 node is:
#     best 18.8 | p25 81.9 | MEDIAN 129.2 | p75 150.8 | worst 186.6 m/s
# which is CHEAPER than B26's measured 415.46 anyway, because the whole transfer is
# smaller. The under-sizing is free at this pair.
#
# THE ESCAPE IS NOT AIMED, and that is B26's stated v1 limitation inherited verbatim,
# not an oversight. Aiming it would need the vessel's and Mun's state VECTORS in
# Kerbin's frame plus an asymptote solve. STAGE 2 RE-PLANS FROM WHEREVER WE ARE.
#
# =====================================================================================
# THE FIVE PRE-REGISTERED OBSERVATION TARGETS, ranked by how likely each is to be
# what ends the run. Written down BEFORE the flight. Nothing below gates on them.
# =====================================================================================
#   (1) **WHAT `OperationTransfer` DOES FROM A KERBIN ORBIT NEAR MUN'S RADIUS.** The
#       likeliest failure, and the same one B26 flight 2 ranked first. The moon-path
#       Hohmann has only ever been asked to plan from a ROUND, UNINCLINED park; here
#       it is asked from an orbit that can be eccentric (a from 6.41 to ~30 Mm across
#       the band) toward a target inclined 6 deg. If it refuses, `node_count` stays 0,
#       the plan warning lands in the mission stdout and the lane flakes in
#       PLAN-TRANSFER - loud and bounded, exactly as B26 flight 1's refusal was.
#   (2) **THE STAGE-2 NODE DV against the 18.8 / 129.2 / 186.6 band**, and read it
#       BEFORE reacting to anything else. It is the number that says what the unaimed
#       escape cost AND it carries the inclination term, so a reading materially above
#       the band is the (b) attribution problem made concrete rather than a surprise.
#   (3) **THE ESCAPE NODE ITSELF: it should read 146.93 m/s.** The machine logs
#       `escape node added ut=... prograde=...` with a read-back and its evidence rides
#       the `escapedHomeSoi` assertion row. A materially different number means the
#       fixture's park is not the one this spec sized against. Its post-burn Mun orbit
#       should read a = 1,568,784 m, **ecc 0.7836** - BOUND, as at Laythe (0.7586) -
#       with an apoapsis radius of 2,798,042 m, i.e. **15.2% past the SOI**.
#   (4) **THE DELIVERED KERBIN ORBIT at the stage-2 PLAN-TRANSFER frame**, against the
#       band's a = 6.41 to ~30 Mm. This is the pass/fail on the escape sizing, and the
#       one number that would reveal a wrong `STOCK_BODY_GRAVITY` row. **AND CHECK IT
#       IS STILL BOUND TO KERBIN**: a hyperbolic Kerbin reading is the 0.1% tail, and
#       it ends the lane by ASSERT-FAIL rather than silently.
#   (5) **THE OPTIMIZER'S ANSWER AT TWO BODY-CHANGE BOUNDARIES** (Mun->Kerbin under
#       thrust, Kerbin->Minmus on rails). B26 flight 3 measured BOTH kept cohesive
#       (count 1, the bottom of its {1,4}) and B28 measured its single escape boundary
#       kept cohesive too. This is the THIRD data point on an ESCAPE boundary and the
#       SECOND on a two-seam recording. The load-time pass runs on V21's LoadGame.
#   (5b) THE DELIVERED ARRIVAL PERIAPSIS against the 250,000 m request - a SIXTH
#       finding-16d corpus point, at req/SOI 11.12%, essentially the Mun row's 10.29%
#       and Vall's 10.39%. Expected k ~ 0.5-0.7 -> 125-175 km delivered.
#
# =====================================================================================
# PHASE-0 DOOR: existing fixture, NO FORGE FLIGHT -- via a PARSEK-STRIPPED DERIVED
# COPY, `mun-park-kerbalx`, the FIFTH of its kind after `duna-park-probe` (B23),
# `eve-park-kerbalx` (B24), `jool-park-nerv` (B25) and `laythe-park-nerv` (B26/B28).
# See [fixture].
#
# POSTURE: A FIRST-FLIGHT READING LANE. Nothing armed - no `gating = true` block, the
# recordings window is a DERIVED range, and `[expectations.recordings.structure]` /
# points are ABSENT (a report-only block of PREDICTED numbers reads like a
# measurement). `tier = "operator"` on the calibration discipline.
# =====================================================================================
tier = "operator"
description = "**AUTHORED 2026-08-23, NOT YET FLOWN.** THE SECOND MOON-TO-MOON TRANSFER, AND IT IS A REPLICATION: the crewed Kerbal X upper stage starts already parked in the 139,612 x 139,526 m Mun orbit B11 delivered, escapes Mun into KERBIN's frame, transfers to MINMUS, captures into a Minmus park and commits the tree there. Roadmap gap G4. `B26-laythe-vall-transfer` + `V17M`/`V17T` measured the moon-to-moon routing ONCE, at ONE parent: Parsek neither re-aims nor phase-locks a moon-to-moon hop, it replays it faithfully on the raw cadence (H3). The research doc states the mechanism as a property of the FLIGHT PROFILE rather than of the pair ('THE MECHANISM IS THE FLIGHT PROFILE'S, NOT THE PAIR'S', section 11.3) - but that is a PREDICTION, and this lane's subject is what converts it into a measurement at a second parent. Mun and Minmus ARE sibling moons of Kerbin, so `IsSameParentTarget` classifies the recording CROSS-PARENT exactly as it classified Laythe/Vall, AND the subject replicates the FAIL-CLOSED NESTED-SOI render policy at a second parent - the trigger is the SIBLING RELATION, not the seam count. THIS SPEC ASSERTS NOTHING ABOUT THE ROUTING: V21M/V21T read it and gate on nothing. THE MODE IS INHERITED VERBATIM - B26's flag-gated PARENT-RELAY (`parentRelayTransfer`), live-proven on B26 flight 3 and again on B28 - and the ONLY code this lane needed is one CITED row in `mlib.STOCK_BODY_GRAVITY` for Mun. **THREE THINGS ARE GENUINELY NEW AND ARE NAMED SO THE READINGS ARE ATTRIBUTED.** (a) A different parent, which is the replication's purpose. (b) **MINMUS IS INCLINED ~6 deg** where Laythe and Vall are both coplanar with Jool's equator, so the stage-2 plan and the capture carry a plane-change cost B26 never paid - 71.67 m/s if taken at Mun's orbital radius, 18.30 at the transfer apoapsis, 28.69 to match Minmus's circular speed - priced INSIDE the stage-2 node because MechJeb plans a combined manoeuvre. THE ONE-DIMENSION-AT-A-TIME RULE IS UNAVOIDABLY BENT: this lane changes the parent AND adds an inclined target in one step, so a stage-2 node materially above the derived band cannot be attributed to the parent change alone. It is bent because a coplanar sibling pair under a second parent DOES NOT EXIST in the stock system - Kerbin has exactly two moons and one is inclined. (c) **THE PARENT ENVELOPE IS 12.9x TIGHTER AND IT INVERTS THE ESCAPE'S BINDING CONSTRAINT**: Kerbin's SOI is 7.01x Mun's orbital radius where Jool's is 90.35x Laythe's, and Minmus sits at 55.8% of Kerbin's SOI where Vall sits at 1.8% of Jool's - the destination is over half way to the parent's SOI edge, so the unaimed escape's high-energy tail does not merely overshoot, IT LEAVES THE PARENT SYSTEM. B26 had to OVER-size its escape (450 against a 347.245 ideal) to clear a geometric reachability floor; B30 deliberately UNDER-sizes (110 against a 142.257 ideal) to hold the Kerbin-escape tail at 0.1% of the unaimed band. Same mode, opposite binding constraint. EVERY NUMBER IS DERIVED AND NOTHING IS COPIED FROM B26. The escape: geometric floor 81.08 m/s at the fixture's park and 91.54 at the entry gate's worst corner (a round park on the 250,000 m apoapsis ceiling), so 110 clears the fixture by 35.7% and the whole gate by 20.2%; the node comes out at 146.93 m/s leaving a BOUND Mun orbit at ecc 0.7836 whose apoapsis radius sits 15.2% past the SOI, which is why `ejectionEccFloor` stays retired at 0 exactly as at Laythe. The sweep over 28,224 unaimed deliveries (24 exit azimuths x 7 tilts, squared) puts 0.1% outside Kerbin's SOI at 110 against 4.0% at the ideal 142.257 and 14.6% at 200, and finds ZERO sub-atmosphere periapsides at any tested speed - the hazard B26's flown contract had does not exist here, and the one that does is the parent-escape. Stage 2 is then cheaper than B26's anyway (best 18.8 / median 129.2 / worst 186.6 m/s against B26's measured 415.46) because the whole transfer is smaller. THE TIMING NUMBERS ALL MOVED and were re-derived rather than copied: the Mun-Minmus synodic is 159,570.7 s against Laythe-Vall's 105,961.4, the transfer leg is 267,853 s against 38,980 (6.9x), and Minmus's SOI-entry -> periapsis coast is 19,077 s against Vall's ~3,900 (4.6x) - which is what sets correctionTriggerTimeToSoiSeconds = [240000, 30000], flybyTimeoutSeconds, captureBurnTimeoutSeconds and the approach clamp. TWO FURTHER CONSEQUENCES worth carrying to the V21 lanes: the SEAM MAGNITUDE is WORSE at this pair, not better (Mun is 20.25% of its orbit against Laythe's 13.70%, Minmus 4.78% against Vall's 5.58%), and MUN AND MINMUS ARE NOT RESONANT - B26's pair sits in Jool's 1:2:4 chain, which put P_Vall and its synodic 0.6615 s apart and made V17's two candidate jump tables identical on cycle 1, whereas P_Minmus/P_Mun = 7.7513, so V21's seed calibration is genuinely harder. dv LEDGER against the fixture's own bytes: usable propellant 1,317.565 units = 6.5878 t measured off the save, ~1,970-2,280 m/s available at the Poodle's 350 s vacuum Isp over a 7.0-8.5 t dry stack; nominal hop 357.6 m/s (escape 146.93 + stage-2 median 129.2 + capture 81.5) and worst 720.3 m/s with all four correction rounds at the 75 m/s cap - a 2.7-3.2x margin, so the donor covers escape + plane change + capture comfortably and no better donor is needed. FIVE OBSERVATION TARGETS ARE PRE-REGISTERED and ranked, written down before the flight so the post-flight paragraph cannot be written after the fact: (1) what MechJeb's moon-path OperationTransfer does from a Kerbin orbit near Mun's radius toward a 6 deg-inclined target - the likeliest failure and B26 flight 2's own top rank; (2) the stage-2 node against the band, read BEFORE anything else because it carries the inclination term; (3) the escape node against 146.93 m/s and its BOUND ecc 0.7836; (4) the delivered Kerbin orbit against a = 6.41-30 Mm AND whether it is still bound to Kerbin at all; (5) the optimizer's answer at TWO body-change boundaries, the third data point on an ESCAPE boundary after B26 flight 3 and B28 both measured theirs kept cohesive. PHASE-0 DOOR: existing fixture, NO forge flight - `mun-park-kerbalx`, a PARSEK-STRIPPED derived copy of `mun-orbit-recorded` (V6M/V6T's subject, B11's product) and the FIFTH of its kind. The strip removed SEVEN child nodes of FIVE types (RECORDING_TREE, GROUP_HIERARCHY, MILESTONE_STATE x3, KERBAL_SLOTS, CREW_REPLACEMENTS), which is one MORE type than `laythe-park-nerv` needed - the recipe is 'excise every child, whatever they are', and this fixture is the second one to show why that distinction matters. NOTHING ARMED: the count window is a DERIVED range, `[expectations.rewind]` is report-only and no save-structure block exists, because this lane's product is a FIXTURE whose structure is pinned where it is CONSUMED (the B24/B25/B28 disposition verbatim)."
