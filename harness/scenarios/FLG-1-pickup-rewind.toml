schema = 1
id = "FLG-1-pickup-rewind"
# =====================================================================================
# FLG-1: A FLAG PICKED UP ON A RECORDED FLIGHT IS PLANTED ONCE AND TAKEN DOWN AGAIN AFTER A
# REWIND (owner ruling 2026-11-04, plant once and record pick-ups; todo
# LOOP-REPLAY-REPLANTS-REMOVED-FLAG; flight recorder design 4.13).
# AUTHORED 2026-11-04 (branch `claude/flag-lane-wip`). NOT FLOWN YET.
#
# WHAT IT PROVES. A kerbal's flag pick-up on a recorded flight is a FlagPickedUp segment
# event on the kerbal's recording (captured by Patches/FlagPickUpCapturePatch.cs on stock
# FlagSite.PickUp plus ParsekFlight.OnVesselWillDestroy). After a Rewind-to-Launch to before
# the plant, the replay plants the flag at its moment (GhostPlaybackLogic.ApplyFlagEvents)
# and takes it down at the pick-up moment (ApplyFlagPickUps), so the flag stands only for
# the recorded interval, and the live pick-up's own removal tombstone (after the rewind
# save's UT) does not block the replayed plant (LoadReconcilePolicy RemovedReplayFlags,
# PlainRewind: memory minus removals after the loaded world's UT).
#
# THE HOST is EVA-1's: gloops-airshow, Jeb in a mk1pod.v2 PRELAUNCH on the pad at UT 21.16.
# EVA-1's act, with the new seam verb PickUpFlag between the plant and the board:
#   (1) StartRecording on the pod (a fresh, non-promotion start: it captures the tree's
#       parsek_rw_ rewind save, CN-4 / VN-3's order), EvaExit release=true (the recorder
#       follows Jeb), PlantFlag ("Flag event captured" into Jeb's recording), PickUpFlag
#       (stock FlagSite.PickUp: "Flag pick-up captured", "Flag removed by the player ...
#       source=picked-up"), EvaBoard, StopRecording, CommitTree, StopRecording (EVA-6 /
#       VN-3's commit order: the second stop ends the committed-restore clone).
#   (2) InvokeRewindToLaunch tree=latest: the Space Center at start - 15 s (~6.5).
#   (3) 1x Space Center time to UT 50. Jeb's KSC ghost (an EVA kerbal's recording is never
#       launch-site hidden, PADG-1) replays the plant ("Spawned flag vessel", Verbose) and
#       then the pick-up ("Flag pick-up replayed ... took down 1 standing flag(s)"), or,
#       when one replay frame passes both UTs, the pick-up first ("took down 0") and then
#       the plant's skip on the pick-up's own tombstone (see THE SAME-FRAME CHAIN).
#
# THE REWIND MECHANISM, and the guess in it. InvokeRewindToLaunch (RecordingStore.
# InitiateRewind) reloads the parsek_rw_ save StartRecording captured, 15 s before the
# recording start (RewindToLaunchLeadTimeSeconds), and lands at the Space Center; the
# committed tree replays there as KSC ghosts (PADG-1, EVA-6). The pick-up UT is not known
# before a flight. MEASURED on run 2026-11-04_1733 (attempt 1): rewind landed at UT 7.78,
# plant at UT 31.68, pick-up at UT 31.70, so the 1x wait goes to 50. The
# wait stays at 1x on purpose: the replayed plant and pick-up are a seam round trip apart
# (well under a game second at 1x), and a walk that crosses both in one frame applies the
# pick-up first, whose tombstone then blocks the plant (no "Spawned flag vessel"). The
# measured run replayed the plant and the take-down 0.15 s of wall time apart.
#
# THE SAME-FRAME CHAIN (todo FLG-1-SAME-FRAME-PLANT-AND-PICKUP). Even at 1x one frame can
# pass both UTs: run 2026-11-08_0248 had the plant at ut=33.84 and the pick-up at
# ut=33.90. GhostPlaybackLogic.ApplyFlagEvents applies recorded pick-ups BEFORE plants on
# purpose, so that walk logs "Flag pick-up replayed ... took down 0 standing flag(s)" and
# then "Flag replay skipped: '<flag>' ... was removed by the player at ut=<pick-up ut>".
# No flag stands afterwards either way, which is the ruled end state (owner ruling
# 2026-11-04). The claim below therefore accepts EITHER chain: plant then take-down 1, or
# take-down 0 then a skip of the SAME flag whose removal UT is byte-equal to the replayed
# pick-up's UT (both print the one double with "R"). Every other skip stays forbidden, and
# so does a take-down 0 after a replayed plant spawned (the flag would be left standing).
#
# PRE-REGISTERED READINGS (first flight):
#   - "Flag replay skipped" after the rewind mark with no "Flag pick-up replayed" before
#     it: the live pick-up's tombstone survived the rewind load (a product defect: file
#     it). A skip right after the replayed pick-up, of the same flag at the pick-up's own
#     UT, is the accepted same-frame chain, not this reading.
#   - "Spawned flag vessel" then "took down 0 standing flag(s)": the replay planted the flag
#     somewhere the take-down did not find it (the 3 m match). "took down 0" with no plant
#     and no same-frame skip after it: the plant never landed at the Space Center.
#   - pickupflag-not-near-flag: the kerbal walked off the flag after the plant; read
#     `nearest=` (the seam's bound is 5 m).
#
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse: EVA-1's flight is a prefix of this
# one, but EVA-1 is the live-proven plant lane and must keep its plant-only shape and its
# exact count 4, so the pick-up and the rewind go in their own lane; (2) the only wait is
# an explicit-UT WarpToUT maxRate=1 (see THE REWIND MECHANISM for why it is not a rails
# rate); (3)-(5) no dwell, burn or coast; (6) retry once (the EVA verbs have a ragdoll
# flake history); (7) count pinned 4..4 (measured on run 2026-11-04_1733: EVA-1's four, no
# restore clone); (8) nightly, expected ~5 min;
# (9) flight_efficiency.py owed on the first green flight.
# =====================================================================================
tier = "nightly"
description = "A flag picked up on a recorded flight comes back once and goes away again after a rewind: on gloops-airshow Jeb steps out of the pad pod with a recording live, plants a flag, picks it up through stock's FlagSite.PickUp (the FlagPickedUp event) and re-boards; after the commit and a Rewind-to-Launch to before the plant, 1x Space Center time replays the plant and then the pick-up, which takes the replayed flag down."
instanceProfile = "stock-minimal"
tags = ["FLG-1", "eva", "flag-plant", "flag-pickup", "rewind-to-launch", "scene-ksc",
        "kerbin", "sandbox"]

[fixture]
saveTemplate       = "fixtures/saves/gloops-airshow"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # LOAD-BEARING: "Spawned flag vessel" and "Mid-recording EVA detected" are Verbose.
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },     expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # ACT 1: the recorded flight. Its start captures the rewind save.
  { cmd = "StartRecording",                                                       expect = "OK", budget = 180 },
  { cmd = "MissionMark",    args = { label = "flg1-exit" },                       expect = "OK" },
  { cmd = "EvaExit",        args = { release = "true" },                          expect = "OK", budget = 120 },
  { cmd = "PlantFlag",                                                            expect = "OK", budget = 180 },
  { cmd = "MissionMark",    args = { label = "flg1-planted" },                    expect = "OK" },
  { cmd = "PickUpFlag",                                                           expect = "OK" },
  { cmd = "MissionMark",    args = { label = "flg1-picked" },                     expect = "OK" },
  { cmd = "EvaBoard",                                                             expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                        expect = "OK" },
  { cmd = "CommitTree",                                                           expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                        expect = "OK" },
  # ACT 2: back to before the plant, at the Space Center.
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                     expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "flg1-rewound" },                    expect = "OK" },
  # ACT 3: 1x Space Center time past the pick-up UT (see THE REWIND MECHANISM).
  { cmd = "WarpToUT",       args = { ut = "50", maxRate = "1" },                  expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "flg1-replayed" },                   expect = "OK" },
  { cmd = "FlushAndQuit",                                                         expect = "OK" },
]

[dimensionsCovered]
D5  = ["eva-branch"]
D7  = ["flag-plant"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc", "warp-1x"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# EVA-1's four (pod root, pod continuation, Jeb's EVA, the board merge), measured on run
# 2026-11-04_1733 (3 mk1-capsule + 1 Jebediah Kerman, one committed tree).
count = { min = 4, max = 4 }

[expectations.logContracts]
required = [
  "Captured rewind save at UT",
  "startrecording recordingId=[0-9a-f]+ already=false",
  "Tree branch created: type=EVA",
  "MISSIONMARK label=flg1-exit[\\s\\S]*Flag event captured \\(foreground recorder pid=[0-9]+\\)[\\s\\S]*MISSIONMARK label=flg1-planted ",
  # The seam's own press, then Parsek's capture of it, inside the pick-up step.
  "MISSIONMARK label=flg1-planted [\\s\\S]*pickupflag start kerbal='Jebediah Kerman' flag='[^'\\r\\n]*' flagPid=[0-9]+ dist=[0-9.]+[\\s\\S]*Flag pick-up captured \\(foreground recorder pid=[0-9]+ rec=[0-9a-f]+\\): [\\s\\S]*Flag removed by the player: [^\\r\\n]* source=picked-up;[\\s\\S]*pickupflag complete kerbal='Jebediah Kerman' [^\\r\\n]* fires=1[\\s\\S]*MISSIONMARK label=flg1-picked ",
  "detected boarding from EVA",
  "committree committed=true",
  "invokerewindtolaunch target resolved tree=[0-9a-f]{32} resolvedBy=LatestKeyword arg=latest",
  "Rewind-to-Launch initiated to UT",
  # THE CLAIM: after the rewind the replay plants the flag once and then takes it down, OR
  # one frame passed both UTs (THE SAME-FRAME CHAIN): the pick-up took down 0 and the plant
  # of the SAME flag was skipped on a removal at the pick-up's own UT (\1 / \2 are
  # byte-equal back-references; the trailing lookahead stops 33.9 matching 33.95).
  "MISSIONMARK label=flg1-rewound [\\s\\S]*(?:Spawned flag vessel: '[^'\\r\\n]*' by '[^'\\r\\n]*' [\\s\\S]*Flag pick-up replayed: '[^'\\r\\n]*' on Kerbin ut=[0-9.Ee+-]+ rec=[0-9a-f]+ took down 1 standing flag\\(s\\)|Flag pick-up replayed: '([^'\\r\\n]*)' on Kerbin ut=([0-9.Ee+-]+) rec=[0-9a-f]+ took down 0 standing flag\\(s\\)(?:(?!Spawned flag vessel)[\\s\\S])*?Flag replay skipped: '\\1' on Kerbin \\(event ut=[0-9.Ee+-]+\\) was removed by the player at ut=\\2(?![0-9.Ee+-]))[\\s\\S]*MISSIONMARK label=flg1-replayed ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "startrecording start-refused",
  "evaexit refused",
  "evaexit timeout",
  "plantflag refused",
  "plantflag failed",
  "pickupflag rejected",
  "pickupflag error",
  "invokerewindtolaunch refused",
  "warptout refused",
  # The live pick-up went unrecorded (no recording owned the kerbal).
  "picked up by pid=[0-9]+ but no foreground or background recording owns the kerbal",
  "Flag pick-up not replayed",
  # A plant blocked after the rewind before any replayed pick-up: the live pick-up's
  # tombstone survived the rewind load (PRE-REGISTERED READINGS).
  "MISSIONMARK label=flg1-rewound (?:(?!Flag pick-up replayed)[\\s\\S])*Flag replay skipped",
  # Any other skip after a replayed pick-up: one that does not name the pick-up's flag on
  # its body at the pick-up's own UT (the only skip THE SAME-FRAME CHAIN allows).
  "MISSIONMARK label=flg1-rewound [\\s\\S]*?Flag pick-up replayed: '([^'\\r\\n]*)' on ([^\\s']+) ut=([0-9.Ee+-]+) rec=(?:(?!Flag pick-up replayed)[\\s\\S])*Flag replay skipped: '(?!\\1' on \\2 \\(event ut=[0-9.Ee+-]+\\) was removed by the player at ut=\\3(?![0-9.Ee+-]))",
  # A replayed plant stood and the replayed pick-up then took down 0: the take-down missed
  # it and a flag is left standing (PRE-REGISTERED READINGS). Take-down 0 is only the
  # same-frame chain's, where no plant spawned first.
  "MISSIONMARK label=flg1-rewound [\\s\\S]*Spawned flag vessel: [\\s\\S]*Flag pick-up replayed: [^\\r\\n]* took down 0 standing flag\\(s\\)",
  # A second replayed plant after the take-down: the flag came back.
  "Flag pick-up replayed: [\\s\\S]*Spawned flag vessel",
]

[runtime]
# LoadGame 300, StartRecording 180, EvaExit 120, PlantFlag 180, PickUpFlag 60 (default),
# EvaBoard 120, CommitTree 120, InvokeRewindToLaunch 300, the 1x KSC WarpToUT 120 (~42
# game seconds at 1x), the rest on the default, plus margin.
budgetSeconds = 1800

[retry]
policy = "once"

[expectedFail]
bugId = ""
