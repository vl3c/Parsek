  "Science subject captured: mysteryGoo@KerbinSrfLandedLaunchPad amount=2\\.2 increment=3\\.60 total=3\\.6 gainMultiplier=0\\.6 ",
  "Science subject captured: recovery@KerbinFlew amount=3\\.0 increment=5\\.00 total=5\\.0 gainMultiplier=0\\.6 ",
