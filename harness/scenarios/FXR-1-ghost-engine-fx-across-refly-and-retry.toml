batchVacuityOptOut = true
batchVacuityOptOutReason = "three GhostFxIntegrity batches, after the InvokeRewind, after the Retry-from-launch revert and after the merge, in one flight; each is pinned whole (total=3 passed=3 failed=0 skipped=0, measured on run 2026-11-17_1531) by its own required pattern anchored after its fxr1-sN mark, plus a {3} count pattern"
