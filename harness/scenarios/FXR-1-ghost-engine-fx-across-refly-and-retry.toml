  # A Poodle fingerprint after the revert that differs from one before it.
  "MISSIONMARK label=fxr1-s1 (?:(?!MISSIONMARK label=)[\\s\\S])*?part='liquidEngine2-2\\.v2' kind=engine midx=0 (systems=[0-9]+ nullSystems=[0-9]+ curves=\\S+ fp=\\[[^\\r\\n]*\\])[\\s\\S]*?MISSIONMARK label=fxr1-s2 [\\s\\S]*?part='liquidEngine2-2\\.v2' kind=engine midx=0 (?!\\1)",
  # The fork's ignition reached no engine info on a rebuilt ghost.
  "apply family=EngineIgnited surface=engine-fx rec=[0-9]+ pid=1592830016 applied=[0-9]+ skipped=[1-9]",
  # A cell's own failure lines.
  "\\[GhostFxIntegrity\\] (?:engine (?:PowerMismatch|DarkWhileOn|LitWhileOff)|fx ownership problem|inactive recording problem)",
  "reflyrevert rejected",
  "reflyrevert error",
  "reason=sealedTipClosed",
  "listhandles kind=chains .* evaluated=false",
]

