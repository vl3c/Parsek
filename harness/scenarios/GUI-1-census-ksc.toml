  # exactly that minimum - which is the height a PLAYER gets. At 700 the Basic capture
  # carried ~363 px of dead space under its last control, so the picture showed a window
  # shape nobody sees; Basic drops the Looping (3) + Diagnostics (10) + Sample Density (5)
