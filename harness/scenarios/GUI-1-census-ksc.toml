[expectations.logContracts]
# Only this lane's OWN verbs, and every line here is a seam INFO record rather than a
# claim about the host.
#
# THE DESCRIBE ECHOES ARE THE IN-RUN MAPPING CHECK. Each `open` is followed by a
# `describe`, whose log line carries `open=<n> openWindows=<comma-joined names>`; pinning
# the pair as a literal is an EXACT claim, because a third open window would move the
# count. That is what catches a seam whose `window=timeline` token is wired to some other
# window's fields - a class of error the headless suite cannot see, since the pure half
# never touches a live window. `scene=SPACECENTER` on every line additionally proves the
# whole census ran where it said (GUI-2's twin pins `scene=FLIGHT`), and `complexity=`
# separates the two passes.
#
# ONE CAPTURE LINE is pinned, not twenty-two: `capturescreenshot ok` is emitted only after
# the file settled at a stable non-zero size, so one is proof the write-and-poll path
# works end to end, and the other twenty-one are the PRODUCT - a reviewer counts them in
# the contact sheet. `bytes=` is deliberately not pinned; it is a real file size and would
# pin a machine.
#
# ALL TWENTY-TWO DUMP LINES ARE PINNED, and the asymmetry with the captures above is
# deliberate rather than untidy. `patched=<ok>/<of>` is the recorder's ARM-TIME
# Harmony.GetPatchInfo reading, taken FRESH on every arm - the patches are applied at arm
# and removed again when each capture flushes - so it is a per-dump measurement and not a
# property of the build. `patched=17/17` therefore asserts that all seventeen
# interceptions were installed for THAT frame, twenty-two times over, and one funnel
# whose signature drifted out from under the patch reds the lane at the dump where it
# happened. It is also the pinning that MADE this lane's first flight a measurement of the
# interception layer, which had never run inside KSP: all 22 read `patched=17/17` on both
# attempts of 2026-09-10, with zero repairs and every dump's anomaly counters at zero, so
# GUITREE-INTERCEPTION-LAYER-NEVER-RUN is closed on that reading
# (`design-gui-tree-dump.md` -> "What the first flight measured") and these lines stay
# pinned as the regression check they now are. `hits=` is deliberately left UNPINNED: it counts funnel body runs in a real
# frame, so any literal would pin the row count of whatever the window happened to
# contain; a reader compares it across the 22 dumps instead. `windows=` / `nodes=` are
# unpinned for the same reason.
#
# THE BATCH LINE IS A WHOLE PIN SINCE THE READING RUN, and it was an INTERIM one until
# then. `total=1` was always exact and derived from the source
# (hlib.parse_ingame_test_declarations sees exactly one
# [InGameTest(Category = "GuiTree")] declaration, scene-agnostic and batch-safe, so at
# scene=SPACECENTER the derivation is total=1 = 0 scene-skipped + 0 batch-skipped + 1
# executable); `passed=` and `skipped=` were REGEXED because the cell carries a run-time
# self-skip (it gives up if its probe window never sees a Repaint within 240 frames) and
# no run had measured which way that goes. THE FIRST FLIGHT MEASURED THE SPLIT but did
# not buy the pin: `2026-09-10_2255` and attempt 2 `_2256` both read
# `total=1 passed=1 failed=0 skipped=0` with the self-skip nowhere near firing
# (`repaintPasses=5`), and both read INVALID on the rect step above, so the split stayed
# regexed by decision - a whole pin belongs to a run that READ a verdict. THE READING RUN
# IS `2026-09-11_0548` (PASS, attempt 1, 96 s wall): the same line came back a third
# time, verbatim, so the pin is now the whole measured line and this id has LEFT
# IngameBatchWiringGroupTests.INTERIM_PIN_IDS
# (GuiCensusSeamVerbTests.test_the_gui_1_batch_pin_is_whole_off_the_reading_run is the
# cell that keeps it there). A SELF-SKIP THEREFORE REDS THIS LANE ON THE logContract ROW,
# and that is the intended reading rather than a gap: the lane claims the cell RAN, and
# the remedy for a red here is a HOST where the probe draws - never a looser pin.
