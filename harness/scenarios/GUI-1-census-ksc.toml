  # load-bearing: the mode IS persisted (ParsekSettingsPersistence), but run.py rewrites
  # the instance's `GameData/Parsek/PluginData/settings.cfg` to its own baseline at BOTH
  # stage and teardown (`reset_settings_sidecar`), and that baseline carries only the
  # three tracer flags and the readable-mirror pin - so whatever this lane persisted is
  # gone either way. The step
  # stays because it costs one op and it is the right thing to do to an install a person
  # also uses.
  { cmd = "UiAction", args = { op = "complexity", mode = "advanced" }, expect = "OK" },

  # THE ONE IN-GAME BATCH THIS LANE DRIVES, and it is here because the dumps above are
  # only half the instrument. Every `DumpGuiTree` step pins `patched=17/17`, which says
  # the interceptions were INSTALLED; the `GuiTree` cell is the one that says the
  # resulting TREE is right - it draws its own probe window with known contents and
  # asserts exact per-kind counts inside it, Begin/End funnel parity on the pairs whose
  # both sides are too large for Mono to inline, screen rects inside the window's own
  # measured content box, and a scroll offset that survived the screen conversion. It
  # needs no fixture, no scene and no seam verb (it builds and destroys its own probe),
  # which is why it can ride a lane that exists for something else, and it closes the
  # in-game category axis at 113 of 113.
  # LAST, deliberately: the batch captures and restores a persistent.sfs baseline around
  # itself (InGameTestRunner.CaptureBatchBaseline), and on a 42 MB career that is real
  # disk work - so it runs after every picture is taken rather than in the middle of the
  # window walk, where a restore would also undo the window state the walk arranged.
  { cmd = "RunTests", args = { category = "GuiTree" }, expect = "OK", budget = 300 },
  { cmd = "FlushAndQuit", expect = "OK" },
]

