schema = 1
id = "GUI-1-census-ksc"
tier = "operator"
# THE GUI CENSUS, KSC HALF. Walk every Parsek window the Space Center draws, size it
# generously, and take one PNG per window and per tab - in Advanced first, then in Basic.
# The product is not a verdict but the IMAGES: `results/<runId>_shots/*.png`, which
# `harness/tools/gui_contact_sheet.py` turns into one browsable `index.html`. That is the
# evidence a GUI review has never had.
#
# WHY IT NEEDS THREE NEW VERBS. Two of them close a measured instrument gap:
#   - the always-collect leg has harvested `<instance>/Screenshots/` into
#     `results/<runId>_shots/` since V3 (hlib.select_run_screenshots, a file-count cap
#     that was 64 and is 1024 since the gallery's P1b - see hlib.ARTIFACT_MAX_SCREENSHOTS)
#     and
#     `tools/contact_sheet.py` renders whatever it finds, but NOTHING ever wrote a file
#     there: the only screenshot path in the game is the player's F1 key. That tool's own
#     empty-state text ("no screenshots captured (the V4 capture verbs feed this)") has
#     been the literal truth on every run to date;
#   - every Parsek window's open flag is only ever written by a player click, so an
#     unattended run draws NOTHING and a capture would photograph an empty scene.
# `CaptureScreenshot` closes the first; `UiAction` closes the second by driving the
# EXISTING internal state (IsOpen, the tab fields, ParsekUI.SetUiComplexityMode). Neither
# adds a player-facing surface.
#
# The third, `DumpGuiTree`, closes the half a PICTURE cannot carry. An IMGUI window has no
# retained widget tree, no GameObject hierarchy and no accessibility surface: the only
# artefact of a window is the pixels it drew that frame. So an image cannot say which rows
# a filter left visible, which button was greyed out, what nests inside what, or which
# tooltip a control published - and a reviewer counting columns in a screenshot is
# guessing at all four. `GuiTreeRecorder` records exactly that for ONE Repaint pass and
# writes `Screenshots/<label>.gui.json`, which the harvest already carries
# (hlib.ARTIFACT_SHOTS_SUFFIXES) and `harness/tools/gui_tree_view.py` renders as labelled
# boxes over the matching screenshot. Every capture below is therefore followed
# IMMEDIATELY by a dump under the SAME label, which is what pairs the two files.
#
# HOST: an OPERATOR-LOCAL fixture (`fixtures/local-saves/c1-gui`), not a committed one,
# and the reason is density rather than convenience. A census photographs LAYOUT, and a
# window with no rows photographs as an empty box - so it needs a Missions window with
# missions, a Recordings table with rows, a Career State window with contracts and
# strategies, a Kerbals roster with kerbals, a Logistics window with routes. The only
# save like that is the operator's own long-lived career (42 MB, 704 recording sidecars,
# 12 vessels, CAREER mode), which cannot be committed and cannot be minted by a builder -
# the point IS the accumulated content. Stage it first:
#
#   python harness/tools/stage_local_fixture.py \
#       --from "../Kerbal Space Program/saves/c1" --as c1-gui --no-quicksaves
#
# Without that the run is refused PRE-BOOT as INVALID(staging) with the command in the
# error (hlib.local_fixture_hint); every committed suite stays green either way. Full
# rationale + the two load-bearing properties: `harness/fixtures/local-saves/README.md`.
#
# WHY `scene = "spacecenter"` IS REQUIRED HERE. The host's `activeVessel = 0` names a
# focusable vessel, so a plain LoadGame takes `TestCommandLoadGame.DecideLoadRoute`'s
# Focusable branch and boots into FLIGHT. R12's additive `scene=` arg forces the
# NoVesselSpaceCenter route instead. The flight half of the census is its sibling
# GUI-2-census-flight, which takes the DEFAULT route on purpose.
#
# WHY THE ANALYZER ROW IS REPORT-ONLY HERE (`[expectations.analyzer] gating = false`),
# and this is MEASURED, not defensive: the offline analyzer over this host reports
# `FAIL=25 WARN=6 INFO=3 RED=1`, all 25 FAILs `INV2-NO-DOUBLE-COVER`, on recordings that
# predate this lane by months (run 2026-09-10 with `-ResultsDir` outside the save, so the
# operator's save was not touched). `run.py` always passes `-FailOnRed`, so a gating row
# would red this lane for findings the census neither causes nor observes. It is NOT
# quarantined with `[expectedFail]`, which is what this lane shipped with first and which
# was the wrong instrument: the verifier chain SHORT-CIRCUITS on a non-PASS analyzer, so
# a quarantine skipped every LATER row - the `[expectations.logContracts]` below INCLUDED
# - and a run that captured NOTHING would have read EXPECTED-FAIL, i.e. green. The full
# argument is in the `[expectations.analyzer]` block at the bottom; the findings
# themselves stay filed as U1-GUI-CENSUS-LOCAL-HOST-REDS-THE-ANALYZER.
#
# WINDOW COVERAGE. Nine windows are drawn at the Space Center by `ParsekKSC.OnGUI`:
# main, missions, timeline, kerbals, career, logistics, structure, settings, testrunner.
# A TENTH is reachable there and is NOT this lane's: `testrunnerglobal`, the global
# Ctrl+Shift+T runner, which draws from its own MonoBehaviour outside that host's showUI
# gate and is photographed by GUI-12-census-testrunners together with the states of the
# Settings-launched one. That is also why every `describe` echo below reads `windows=12`:
# the count is the seam's whole TABLE, not the scene's drawn set.
# The two flight-only windows - spawncontrol and gloops - belong to GUI-2; asking for
# either here is a REJECTED (`window-not-in-scene`) by design rather than a capture of a
# scene without them. Sixteen of the captures are TABS: missions x8 (its two tabs, each
# in the restored, the collapsed and the fully expanded state, plus one deep fold
# apiece), timeline x4 (its filter modes), kerbals x2, career x2 (Contracts and Strategies; its Facilities and Milestones tabs were removed 2026-09-24 and their two captures with them). Settings has six SECTIONS rather than tabs (they
# all draw in one pass, and three are hidden in Basic), so the Advanced/Basic pair IS its
# section coverage; Logistics' bubbles are expand-collapse, not a selector.
#
# 27 PNGs (22 Advanced + 5 Basic) and 27 dumps beside them: 54 files, plus ONE more the
# `GuiTree` batch below writes itself (`parsek-guitree-probe.gui.json`, its probe
# window's own capture) = 55, against the harvest's file-count cap
# (hlib.ARTIFACT_MAX_SCREENSHOTS). That cap was 64 when this lane was written, which is
# why the dump steps did not need it raised; it is 1024 since the GUI state gallery's P1b
# (a capture PAIR is two files, so 64 harvested at most 32 STATES and silently dropped the
# rest), so this arithmetic has three hundred-odd captures of headroom now. Re-check it
# anyway before adding a 28th capture: the BYTE cap is the one that binds at scale.
#
# THE SIX FOLD CAPTURES (24th-29th) WERE ADDED 2026-09-22, and the gap they close is one
# a reader of the GUI mirror hits immediately: the Missions window's two tabs were each
# photographed in exactly ONE state, so every fold arrow in both pictures pointed at
# nothing. The mirror could show that a row COLLAPSES and never what collapsing hides.
# Six labels, all Advanced, all on the Missions window and all inside its existing
# open / close pair (no new window is opened, so every pinned `describe` echo below is
# untouched):
#   - `ksc-missions-{missions,recordings}-collapsed-advanced` - `key=none`, the floor;
#   - `ksc-missions-{missions,recordings}-expanded-advanced`  - `key=all`, the ceiling;
#   - `ksc-missions-recordings-chain-advanced` - ONE chain block, the rest shut;
#   - `ksc-missions-missions-events-advanced`  - ONE mission's Events digest, ditto.
# The two SINGLE-key steps are what `key=all` cannot buy: under `all`, a chain block and
# an event digest are two open things among every other open thing, and the picture
# stops saying which affordance drew what. Their ids are host-specific and the spec says
# so at the pins below.
# ORDERING IS DELIBERATE: none -> chain -> all -> (tab) -> none -> digest, which is four
# expand ops for six pictures, because the expand sets are per WINDOW rather than per
# TAB. The two pre-existing `ksc-missions-*-advanced` captures are KEPT and still come
# first: they photograph the state the window RESTORES, which is the state a player
# actually opens it in, and none of the six replaces that.
#
# THE 23rd IS `ksc-logistics-nearmiss-advanced`, added 2026-09-21 off a state-coverage
# audit of every capture this census had taken. It is the highest-yield single step the
# audit found: the Logistics window's near-miss subsection header is present and
# COLLAPSED in every existing capture, so all twelve of its reject reason strings had
# never been photographed anywhere, while this host alone had 18 rows waiting under it.
#
# TWO EXISTING LABELS CHANGED MEANING RATHER THAN NAME in the same pass, and both are
# re-shot by the act of re-flying this lane against HEAD:
#   - `ksc-settings-advanced` / `ksc-settings-basic` photographed a button reading
#     `Wipe All Game Actions (N)`; HEAD draws `Wipe All Milestones (N)`
#     (SettingsWindowUI.cs, renamed after the first flight). Nothing in this spec named
#     the old label, so the re-fly is the whole fix. The Basic capture ALSO changed rect
#     (see its step) so that it shows the height a player gets.
#   - `ksc-career-milestones-advanced` photographed the Rewards column at 180 px with
#     cells wrapping; `ColW_Rewards` was widened to 320 BECAUSE of that dump. The tab and
#     the capture were both removed 2026-09-24 (the Timeline's Career view owns milestone
#     history now).
# And `ksc-kerbals-roster-advanced` / `ksc-kerbals-outcomes-advanced` photographed the
# PRE-REDESIGN single-line Kerbals shape, which HEAD replaced with four-column tables.
# They are KEPT rather than dropped, which is a correction to the audit's own
# recommendation: the lane photographs whatever HEAD draws, so a re-fly makes them
# current, and they are this census's only DENSE Kerbals pictures (the committed-fixture
# lanes GUI-11 / GUI-6 hold a handful of kerbals each). Dropping them would have traded a
# stale picture for no picture.
# The batch's own dump is a BONUS artefact, not a product of this lane: it is the probe
# window, not a Parsek one, and the viewer will render it beside the census pages.
#
# At most ONE sub-window is open at a time, so no capture has another SUB-window
# overlapping it. The main window is the exception and has to be:
# every sub-window draw in both hosts sits inside the host's `showUI` gate, so it stays
# open throughout, and the two full-width windows below cover it.
#
# A DUMP IS PROCESS-WIDE, which the PNG beside it also is and which is worth stating
# once: the recorder intercepts UnityEngine's IMGUI funnels, not Parsek's draw code, so a
# dump contains every window the process drew that frame - the stock toolbar and any
# other addon's windows included, on an instance that had them. On `stock-minimal` that
# is Parsek plus stock, which is the point of the profile.
#
# `op=open window=main` FIRST IS A PRECONDITION, not just the natural order. The settle
# for a non-`main` `open` / `rect` REFUSES while the host's `showUI` is false
# (`ERROR window-host-hidden`), because the frame that advanced the count never drew this
# window and the read-back would only be reading the write back. This lane already opens
# `main` as its first UiAction step and leaves it open, so the gate never fires here.
#
# TWO WINDOWS DO NOT FIT THIS INSTANCE, measured off their own source rather than off the
# images: `missions` (RecordingsTableUI, laid out for 1355 px - the width its tooltip-echo
# strip is budgeted against) and `logistics` (LogisticsWindowUI, `MinWindowWidth = 1410`,
# first-open default 1556). The profile's screen is 1280x720. WHAT A NARROWER WINDOW DOES
# is neither a clean clip nor clean scrolling, and the mechanism is per-surface: the
# WINDOW itself does not scroll, so `missions`' fixed HEADER ROW - drawn outside the
# scroll view (RecordingsTableUI.cs:1647) - clips its right-hand columns outright, while
# the table BODY under it sits in `BeginScrollView(pos, false, true, ...)` (:1650-1651)
# and grows a HORIZONTAL BAR when its rows are wider than the view. `logistics` wraps its
# whole section stack the same way through the options-only overload
# (LogisticsWindowUI.cs:541), which defaults to the same show-if-needed behaviour. So a
# capture shows only the left-hand columns either way, but the body's are reachable
# behind a bar rather than gone.
#
# THEY ARE NOW COMMANDED AT THEIR OWN MINIMUM (`missions` 1355, `logistics` 1410) rather
# than at the instance width, and the change is a FIX rather than a preference. The first
# flight commanded `w = 1280` on both, and nothing clamped it: every minimum in Parsek is
# enforced in `ParsekUI.HandleResizeDrag`, which runs only during a resize DRAG, so a rect
# written straight into the field could be narrower than any player can make it. The
# pictures were squeezed layouts that do not exist in play, which a reviewer counting
# columns reads as a layout defect. `op=rect` now clamps to the window's own floor and
# reports `clamped= minW= minH=`, so commanding 1280 would have produced the same 1355 /
# 1410 rect with `clamped=true`; the steps name the floor outright so the spec says what
# the picture is. The consequence is HONEST CLIPPING: both windows now extend past the
# 1280 px client edge, so the right-hand columns are off-screen rather than crushed. That
# residue is GUI-CENSUS-TWO-WINDOWS-EXCEED-THE-INSTANCE-WIDTH, unchanged, and the only way
# to close it is a wider instance profile.
#
# KNOWN THIN CAPTURE: `structure` opens with no target, so it photographs the empty
# "Parsek - Structure" chrome. Its populated forms are reached from a Missions or
# Logistics ROW, which no seam op drives today - a follow-up, named here rather than
# faked (GUI-CENSUS-STRUCTURE-WINDOW-HAS-NO-DRIVEABLE-TARGET).
#
# THE SETTINGS WINDOW IS COMMANDED WIDER THAN IT ASKS FOR, and the number is measured
# rather than chosen. The first flight commanded `w = 360` and the Advanced-mode window
# grew to its own content minimum in BOTH axes - `uiaction error reason=rect-not-applied
# window=settings want=270,8,360,700 after=270,8,375,718`, i.e. 375 wide and 718 tall -
# while the Basic-mode site two passes later settled at the same commanded 360, which is
# what a per-MODE content minimum looks like. The 1 px width band refused a rect that had
# in fact been applied, so the read-back now treats WIDTH as a floor exactly like HEIGHT
# (`TestCommandUiAction.RectAppliedWithinTolerance`); both sites here are commanded
# `w = 400`, above either mode's minimum, so neither picture is clipped and neither
# depends on the tolerance to pass.
#
# FLOWN 2026-09-10 (`2026-09-10_2255`, attempt 2 `_2256`), both INVALID on that one
# rect step and on nothing else - 22 captures, 22 dumps and the GuiTree batch all landed;
# the READING run is `2026-09-11_0548` (PASS, attempt 1, 96 s wall). THE FOLD RE-FLY is
# `2026-09-22_1631` (PASS, attempt 1, 87 s wall, 60 harvested files), and its dumps are
# what the six new labels are worth, counted as nodes under the `Parsek - Missions`
# window root:
#   Missions tab   922 restored = 922 collapsed -> 1769 expanded, 999 with one digest;
#   Recordings tab 415 restored = 415 collapsed -> 1915 expanded,  453 with one group
#                  folder plus its chain block.
# THE TWO `collapsed` PICTURES MEASURED IDENTICAL TO THE RESTORED ONES (922 and 415 to
# the node), which is a reading rather than a redundancy: on this host the Missions
# window opens FULLY COLLAPSED in both tabs, so the census's two original captures were
# already the floor and nobody could tell. They are kept as the named half of each pair -
# the mirror pairs `-collapsed-` with `-expanded-`, and a jump needs both ends to exist -
# and the day the window restores anything open they diverge by themselves.
# The `[expectations.logContracts]` lines below pin ONLY the seam log lines
# this lane's own verbs write, and nothing about the host: a local fixture is
# unreproducible by construction (one person's save at one moment), so a lane on it may
# assert that a window DREW and never what it drew. A `describe` step follows every
# `open`, and its `open=<n> openWindows=<names>` echo is pinned exactly - which is the
# cheap in-run check that the seam's window-token -> live-object mapping points at the
# window the step named. The labelled screenshot is still the final instrument.
description = "GUI census, Space Center half: open every KSC-drawn Parsek window and tab in Advanced then Basic, capture one PNG plus one IMGUI control-tree dump each, and run the GuiTree cell, for a layout review."
instanceProfile = "stock-minimal"
tags = ["gui-census", "screenshots", "ui", "operator-local-fixture", "GUI-1"]

[fixture]
saveTemplate = "fixtures/local-saves/c1-gui"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  # --- boot, forced to the Space Center ---
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },

  # --- Advanced pass ---
  { cmd = "UiAction", args = { op = "complexity", mode = "advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "open", window = "main" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "main", x = "8", y = "8", w = "250", h = "700" }, expect = "OK" },
  # The inventory the reviewer reads next to the images: scene, mode, and every window's
  # availability / open state / rect / tabs. Taken with only the main window open so the
  # baseline it reports is the untouched one.
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-main-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-main-advanced" }, expect = "OK" },

  # missions (the RecordingsTableUI window; its second tab is the raw table)
  { cmd = "UiAction", args = { op = "open", window = "missions" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "missions", x = "0", y = "8", w = "1355", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "missions" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-missions-missions-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-missions-missions-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "recordings" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-missions-recordings-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-missions-recordings-advanced" }, expect = "OK" },

  # --- THE SIX FOLD CAPTURES (added 2026-09-22) ---
  # Everything shut FIRST, so the two collapsed pictures are a COMMANDED state rather
  # than whatever the two captures above happened to restore. One `key=none` serves both
  # tabs: the five expand sets this window resolves (group, chain, vessel, leg, digest)
  # are one collection per window, not per tab, so the state written here is still
  # standing when the tab flips.
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "none" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-missions-recordings-collapsed-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-missions-recordings-collapsed-advanced" }, expect = "OK" },
  # ONE chain block open with everything else shut - the picture `key=all` cannot give,
  # where a chain block is one expanded thing among fifty.
  # THE GROUP FOLDER IS OPENED FIRST, and that is MEASURED rather than assumed. The
  # 2026-09-22_1627 flight drove the chain expand on its own: the seam answered
  # `changed=1 expanded=1` - the flag really flipped - and the dump beside the picture
  # read 415 nodes, identical to the collapsed one. A chain block is drawn INSIDE its
  # group folder, and the `key=none` above had just shut all sixteen of them, so there
  # was nothing on screen for the flag to open. The group that owns this chain is
  # `R3-B2-U1-S7` (read off the host's own save: the five recordings carrying that
  # chainId all sit in it), and opening the two in order is what makes this capture a
  # picture of ONE chain block inside ONE open folder.
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "group:R3-B2-U1-S7" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "chain:97aedc38ca2f46fca19adab0a569dbdc" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-missions-recordings-chain-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-missions-recordings-chain-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "all" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-missions-recordings-expanded-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-missions-recordings-expanded-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "missions" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-missions-missions-expanded-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-missions-missions-expanded-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "none" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-missions-missions-collapsed-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-missions-missions-collapsed-advanced" }, expect = "OK" },
  # ONE mission's Events digest, on its own. `digest:` is the Missions tab's event-digest
  # foldout, keyed by MISSION ID (MissionsWindowUI.EnumerateDigestKeysForTesting).
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "digest:6fab7338969f4bb2a6fcc7027a012bce" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-missions-missions-events-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-missions-missions-events-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "missions" }, expect = "OK" },

  # timeline (four filter modes, treated as tabs: four mutually exclusive views)
  { cmd = "UiAction", args = { op = "open", window = "timeline" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "timeline", x = "270", y = "8", w = "1000", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "overview" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-overview-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-overview-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "details" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-details-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-details-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "rewindff" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-rewindff-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-rewindff-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "refly" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-refly-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-refly-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "timeline" }, expect = "OK" },

  # kerbals (drawn in both modes since the 2026-09-22 owner re-ruling; its Basic picture
  # is GUI-11's `bdk-kerbals-roster-basic`)
  { cmd = "UiAction", args = { op = "open", window = "kerbals" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "kerbals", x = "270", y = "8", w = "1000", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "kerbals", tab = "roster" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-kerbals-roster-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-kerbals-roster-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "kerbals", tab = "outcomes" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-kerbals-outcomes-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-kerbals-outcomes-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "kerbals" }, expect = "OK" },

  # career state (Advanced only, two tabs)
  { cmd = "UiAction", args = { op = "open", window = "career" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "career", x = "270", y = "8", w = "1000", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "career", tab = "contracts" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-career-contracts-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-career-contracts-advanced" }, expect = "OK" },
