[expectations.analyzer]
# THE ANALYZER ROW IS REPORT-ONLY ON THIS LANE, and this is the one spec-level
# declaration the census needs. MEASURED, not defensive: the offline analyzer over this
# host reports `FAIL=25 WARN=6 INFO=3 RED=1`, all 25 FAILs `INV2-NO-DOUBLE-COVER`, on
# recordings that predate this lane by months (run 2026-09-10 with `-ResultsDir` outside
# the save, so the operator's save was not touched; its own committed
# `analysis/c1.analysis.txt` from 2026-08-11 reads RED=1 too). A census takes SCREENSHOTS
# - it neither causes nor observes a recording-invariant finding - so gating a layout
# review on career bookkeeping would red it forever.
#
# WHY NOT `[expectedFail] subkind = "analyzer"`, which is what this lane shipped with
# first: `run.py`'s verifier chain SHORT-CIRCUITS on a non-PASS analyzer, so a quarantine
# would leave every LATER row SKIPPED - `[expectations.logContracts]` INCLUDED. A run that
# produced ZERO screenshots would then read EXPECTED-FAIL, i.e. green, while the header
# above claimed those contracts pinned the capture lines. Report-only keeps the analyzer
# RECORDED (status REPORT, with its classified verdict, RED token and counts beside it)
# and lets the rest of the chain evaluate, so this lane gates on its OWN log contracts
# instead of on nothing.
#
# WHY NOT A FINDINGS BASELINE: `run.py` hard-codes `-FreshSaveGate`, and
# `analyze-recordings.ps1` REFUSES `-UseBaseline` together with it, so a per-save baseline
# was never a route from here. Filed as U1-GUI-CENSUS-LOCAL-HOST-REDS-THE-ANALYZER, whose
# open decision is about the 25 findings themselves and not about this lane.
#
# Pinned by `ANALYZER_REPORT_ONLY_ALLOWLIST` in `harness/lib/test_hlib.py`: any OTHER
# committed spec declaring `gating = false` reds that cell.
gating = false

