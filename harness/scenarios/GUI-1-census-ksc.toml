[dimensionsCovered]
D14 = ["career", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.logContracts]
# Only this lane's OWN verbs, and every line here is a seam INFO record rather than a
# claim about the host.
#
# THE DESCRIBE ECHOES ARE THE IN-RUN MAPPING CHECK. Each `open` is followed by a
# `describe`, whose log line carries `open=<n> openWindows=<comma-joined names>`; pinning
# the pair as a literal is an EXACT claim, because a third open window would move the
# count. That is what catches a seam whose `window=timeline` token is wired to some other
# window's fields - a class of error the headless suite cannot see, since the pure half
# never touches a live window. `scene=SPACECENTER` on every line additionally proves the
# whole census ran where it said (GUI-2's twin pins `scene=FLIGHT`), and `complexity=`
# separates the two passes.
#
# ONE CAPTURE LINE is pinned, not twenty-two: `capturescreenshot ok` is emitted only after
# the file settled at a stable non-zero size, so one is proof the write-and-poll path
# works end to end, and the other twenty-one are the PRODUCT - a reviewer counts them in
# the contact sheet. `bytes=` is deliberately not pinned; it is a real file size and would
# pin a machine.
required = [
  # --- Advanced pass: main alone, then one per window opened ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=1 openWindows=main",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,missions",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,timeline",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,kerbals",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,career",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,logistics",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,structure",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,settings",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,testrunner",
  # --- Basic pass: the mode switch itself, then the windows Basic still offers ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=basic windows=11 open=1 openWindows=main",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=basic windows=11 open=2 openWindows=main,missions",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=basic windows=11 open=2 openWindows=main,timeline",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=basic windows=11 open=2 openWindows=main,logistics",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=basic windows=11 open=2 openWindows=main,settings",
  # --- and one capture, proving the write-and-settle path end to end ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] capturescreenshot ok label=ksc-main-advanced",
]
# EMPTY, deliberately, and this is a HOST decision rather than a weakened gate: the
# `[Parsek][ERROR]` surface of a real multi-year career's cold OnLoad (route reconcile,
# ledger recalc over 300+ actions) is not something this lane controls, observes, or is
# about. A forbidden pattern here would red a layout review over career bookkeeping. The
# ERROR surface is gated on the committed fixtures, where it is attributable.
forbidden = []

[expectations.analyzer]
# THE ANALYZER ROW IS REPORT-ONLY ON THIS LANE, and this is the one spec-level
# declaration the census needs. MEASURED, not defensive: the offline analyzer over this
# host reports `FAIL=25 WARN=6 INFO=3 RED=1`, all 25 FAILs `INV2-NO-DOUBLE-COVER`, on
# recordings that predate this lane by months (run 2026-09-10 with `-ResultsDir` outside
# the save, so the operator's save was not touched; its own committed
# `analysis/c1.analysis.txt` from 2026-08-11 reads RED=1 too). A census takes SCREENSHOTS
# - it neither causes nor observes a recording-invariant finding - so gating a layout
# review on career bookkeeping would red it forever.
#
# WHY NOT `[expectedFail] subkind = "analyzer"`, which is what this lane shipped with
# first: `run.py`'s verifier chain SHORT-CIRCUITS on a non-PASS analyzer, so a quarantine
# would leave every LATER row SKIPPED - `[expectations.logContracts]` INCLUDED. A run that
# produced ZERO screenshots would then read EXPECTED-FAIL, i.e. green, while the header
# above claimed those contracts pinned the capture lines. Report-only keeps the analyzer
# RECORDED (status REPORT, with its classified verdict, RED token and counts beside it)
# and lets the rest of the chain evaluate, so this lane gates on its OWN log contracts
# instead of on nothing.
#
# WHY NOT A FINDINGS BASELINE: `run.py` hard-codes `-FreshSaveGate`, and
# `analyze-recordings.ps1` REFUSES `-UseBaseline` together with it, so a per-save baseline
# was never a route from here. Filed as U1-GUI-CENSUS-LOCAL-HOST-REDS-THE-ANALYZER, whose
# open decision is about the 25 findings themselves and not about this lane.
#
# Pinned by `ANALYZER_REPORT_ONLY_ALLOWLIST` in `harness/lib/test_hlib.py`: any OTHER
# committed spec declaring `gating = false` reds that cell.
gating = false

[runtime]
# 22 captures, each holding the FIFO head for a couple of frames, plus a 300 s cold load
# of a 42 MB career and ~60 single-phase UI ops. 1200 s is generous on purpose: the
# product is the images, and a KILLED run leaves none.
budgetSeconds = 1200

[retry]
policy = "once"

[expectedFail]
# EMPTY, like every other committed spec. The analyzer quarantine this lane shipped with
# is GONE, replaced by `[expectations.analyzer] gating = false` above - see that block for
# why a quarantine was the wrong instrument: it short-circuited the whole verifier chain,
# log contracts included.
bugId = ""
