schema = 1
id = "ASR-9-escape-stage-ends-orbiting-sun"
tier = "daily"
# =====================================================================================
# ASR-9: A STAGE LEFT ON A KERBIN ESCAPE IS FOLLOWED TO ITS SOLAR ORBIT AND ENDS ORBITING
# THE SUN. AUTHORED 2026-11-21, NEVER FLOWN. Report-only until a reading run confirms the
# facets. Siblings: ASR-3 / ASR-4 (the same seam shape on grazing Kerbin orbits).
# =====================================================================================
#
# WHAT IT PROVES (owner ruling Q8, 2026-11-21). A tail with no natural end (escaping to
# the Sun) is followed to its FINAL orbit around the last body: the recording ends
# `Orbiting` there (terminal orbit body Sun) and spawns as a real vessel when the replay
# reaches that orbit, instead of `SubOrbital` at the 50-year horizon (never spawned). The
# V scenario that ruling answers (escape stage, rewind before it reaches the Sun's SOI)
# rests on the same commit-time computation: the ending is stored at the commit from the
# last state, so this lane reads it off the commit without warping to the exit.
#
# THE HOST. `kerbin-escape-probe-stack`, derived by construction from `gs2-orbital-stack`
# (harness/tools/build_kerbin_escape_probe_stack.py, drift-gated by
# lib/test_kerbin_escape_probe_stack.py): the crewed Kerbal X stack with its probe-cored
# core on a Kerbin escape hyperbola (e 1.5, periapsis 100 km, v_inf 1588 m/s), outbound
# at ~81 Mm, past every moon, with the Kerbin SOI exit 1800 game s after the save UT
# 416.91. KSP reads it ESCAPING. The solar orbit after the exit is bound whatever the
# asymptote direction (v_inf + Kerbin's orbital speed < the Sun's escape speed there).
#
# THE FLIGHT (seam only, ASR-3's shape): StartRecording, decouple the probe core
# (`PartAction decouple partPid=2923926328`, RF-21's measured split: a controlled child
# "Kerbal X Probe"), a 1x dwell to UT 430 so both halves record real post-split samples,
# then CommitTree in flight and FlushAndQuit. The probe is loaded and non-active at the
# commit, so the in-flight commit's finalizer (B4, WP3) extrapolates its hyperbola out of
# Kerbin's SOI into the solar conic and ends it there (WP8: final-orbit entry + a 60 s
# settle span). The active crewed stack keeps its live situation on a plain CommitTree
# (ASR-4's flight-2 reading), so its terminal is REPORTED, not pinned.
#
# C#-DEPENDENT: the extrapolator's final-conic line (`Terminal reason=stable-conic:
# body=Sun ...`, Trajectory/BallisticExtrapolator.cs, Info on the `Extrapolator` tag), the
# probe's commit verdict (`CommitTreeFlight terminal: ... terminalState=Orbiting
# terminalOrbitBody=Sun`, Controllers/ParsekFlight.MergeFlow.cs FormatCommitTerminalVerdict;
# the pre-Q8 build read SubOrbital at the horizon), the forbidden `final-escape` /
# `horizon-cap` reasons on the Sun, and the endings block (save `terminalState`,
# `tOrbBody`). NOT C#-dependent: the load, the decouple, the split and the commit tokens.
#
# FAST-LANE CHECKLIST. 1 No host flight leaves Kerbin's SOI without a burn verb, so a
# by-construction fixture makes it seam only (SOI-3's / ASR-3's precedent). 2 The one
# wait is an explicit-UT 1x WarpToUT (~13 game s). 3 Minimal dwell. 4-5 n/a: no burn, no
# coast lead (the exit is computed, not flown). 6 every seam step answers or the run is
# driver INVALID by name; `once` for the never-flown seam flake class. 7 count {2,3}
# (ASR-3's derivation). 8 daily (ASR-3's seam shape). 9 flight_efficiency.py on the first
# green flight.
# =====================================================================================
description = "Owner ruling Q8: a stage left on a Kerbin escape is followed out of Kerbin's SOI to its solar orbit and ends Orbiting the Sun. On kerbin-escape-probe-stack (gs2-orbital-stack's Kerbal X stack moved by construction onto an outbound Kerbin escape hyperbola, SOI exit 1800 s ahead) the probe core is decoupled, both halves dwell at 1x, CommitTree in flight; the probe's commit verdict reads Orbiting around the Sun on a stable final conic. Report-only endings block."
instanceProfile = "stock-minimal"
tags = ["ASR", "ASR-9", "Q8", "predicted-tail", "final-orbit", "soi-exit", "controlled-child",
        "kerbin", "sun", "sandbox", "crewed", "reading-run"]

[fixture]
# By construction from gs2-orbital-stack (harness/tools/build_kerbin_escape_probe_stack.py).
# Nothing is launched, so no `fixtures/shared-ships.toml` row.
saveTemplate       = "fixtures/saves/kerbin-escape-probe-stack"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "StartRecording",                                                          expect = "OK" },
  # The core decoupler (istg 2; the other Decoupler.2 is the pod's heat-shield stack).
  { cmd = "PartAction",     args = { button = "decouple", part = "Decoupler.2", partPid = "2923926328" }, expect = "OK" },
  { cmd = "RecordingState",                                                          expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "430", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "CommitTree",                                                              expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                            expect = "OK" },
]

[dimensionsCovered]
D5  = ["controlled-decoupled-child"]
D14 = ["kerbin", "scene-flight", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 2, max = 3 }

[expectations.logContracts]
required = [
  "Recording started",
  "partaction applied button=decouple pid=[0-9]+ part='Decoupler\\.2' partId=[0-9]+ event=Decouple newPid=[1-9][0-9]* ",
  "Controllable split children: \\[[0-9]+,[0-9]+\\]",
  "committree committed=true",
  # C#-DEPENDENT (owner ruling Q8): the probe's tail is followed out of Kerbin's SOI into a
  # bound solar orbit, a stable final conic.
  "\\[Extrapolator\\] Terminal reason=stable-conic: body=Sun enteredUT=[0-9.]+ ",
  "CommitTreeFlight terminal: rec=\\w+ terminalState=Orbiting terminalOrbitBody=Sun",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # C#-DEPENDENT: an escape the finalizer did not close on a stable solar conic.
  "Terminal reason=(?:final-escape|horizon-cap|soi-transition-cap): body=Sun ",
  "CommitTreeFlight terminal: rec=\\w+ terminalState=(?:Destroyed|SubOrbital) terminalOrbitBody=Sun",
]

# REPORT-ONLY (gating absent). C#-dependent; arm after the first reading run.
[expectations.recordings.endings.vessels."Kerbal X Probe"]
ended               = { min = 1, max = 1 }
terminalStates      = ["Orbiting"]
terminalOrbitBodies = ["Sun"]

# The active stack keeps its live situation on a plain CommitTree; read, not asserted.
[expectations.recordings.endings.vessels."Kerbal X"]
ended = { min = 1, max = 1 }

[expectations.rewind]
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1 }, Destroyed = { max = 0 } }
branchPoints   = { JointBreak = { min = 1, max = 1 } }

[runtime]
# LoadGame 660; WarpToUT and CommitTree at 120 each = 240; the other 6 steps at 120 = 720
#   -> 1620. 1800 clears it.
budgetSeconds = 1800

[retry]
policy = "once"

[expectedFail]
bugId = ""
