description = "**RE-PINNED 2026-08-24 OFF ITS FIXTURE'S REAL BYTES**, `PENDING_FIXTURE_LANES` entry retired in the same commit. `fixtures/saves/mun-landing-recorded` EXISTS, harvested `--keep-parsek` from `B13-mun-landing` run 2026-08-24_1449 (PASS attempt 1, wall 2,811 s / mission wall 2,764.1 s, MISSION-OK through SURFACE-COMMITTED). Real tree id; ONE jump UT, **RE-DERIVED IN ROUND 2 TO 1,273,133 OFF THE MEASURED PHASE-LOCK CLOCK** - reused verbatim from V23M's third cycle-1 bracket so both halves observe the SAME INSTANT from two scenes and a divergence is attributable to the HOST rather than the epoch - after reading run 1 (`2026-08-24_1626`, retry `_1627`) red INVALID(driver-rewind) on `timejump refused reason=backward-jump`, the spec's own forbid working as pre-registered, with no TS render pin reached and the lens entirely unmeasured. It is L1 = 1,249,901.1806192098 plus the MEASURED 23,091.405 s touchdown offset plus the family's +140 bracket. Round 1's derived anchor was wrong by ~970 ks even though its derived cadence was right to the digit. **THE ROUTING CAME BACK CONFIRMED HERE** (unlike the V22 trio, whose faithful pre-registration was refuted): `method=joint-best-fit` over `constraints=3` including `Orbital(Mun) same-parent off=16390.648888550266`, `zeroDrift=yes`, `scheduleWithinTol=yes`, no `[ReaimDiag]` - which is why requiring a road was defensible on this pair. V23M section 3 carries the surface-vs-orbit A/B that came with it. The Tracking-Station half of the Mun landing pair (roadmap gap G3a); V23M's header carries the A/B framing, the measured byte table and the derivation. IT HAS A SHARPER JOB THAN ITS V22 COUNTERPART: V6T is its direct A/B - same subject, host, road and epoch shape, differing ONLY in that V6T's recording ends in Mun ORBIT and this one ends LANDED - and four TS lanes (V6T/V14T/V15T/V16T) have pinned `factory chain ... reaimed=False` on same-parent subjects and got the same answer four times, so if a SURFACE endpoint changes what the TS scene assembles, this lane shows it against a four-run baseline rather than against nothing. ROUTING IS REQUIRED as on V23M (the phase-lock road is the control variable, not the question), with ONE difference following V6T's own precedent: `zeroDrift=yes` and `scheduleWithinTol=yes` are NOT required here, because they are FLIGHT-side solver-quality artifacts rather than TS render facts - V6M requires them and V6T does not, and the pair still gates them on the M half where they belong. THE LENS IS AIRLESS AND SCENE-STAMPED: the suppression reason token is `polyline-owns-phase` with `belowAtmosphere=False` (`below-atmosphere` never fires on a body with no atmosphere, and the V22 Kerbin lanes pin the other branch on purpose), and `Polyline frame:` takes the `scene=TRACKSTATION` form because copying the `scene=FLIGHT` one would be unsatisfiable. The `phase=MarkerDecision surface=AtmosphericMarker` tracer line is deliberately NOT required - it is CHANGE-ONLY and this lane enters TS already past the descent onset on a single dwell, so it may legitimately never fire. `phase=GhostCreated surface=ProtoIcon ... body=Mun scene=TRACKSTATION` IS required, but as a PRESENCE claim only: a proto icon being CREATED says nothing about whether a proto LINE is drawn at the touchdown, and on this subject it is not - the suppression pins carry that and the two must not be read as one statement. The forty-tick TS dwell is not optional (V17T's spawn-throttle reading: init walk contributes zero on a segment-less tail, real ghosts arrive newest-cycle-first at `MaxSpawnsPerFrame = 2`, and a landed recording's tail is exactly that shape), so `ParsekTrackingStation initialized: created N` is NOT required with a nonzero N. NO KSC HALF EXISTS and that is a scoping fact, not an omission - see V23M for the precise reason, which is narrower than \"the host is vacuous\": the recording LAUNCHES FROM KERBIN so `IsKscStructurallyEligible` admits it on `Points[0].bodyName` and its ascent leg renders; it is the per-frame pose gate that skips every Mun-frame point, so THE ARRIVAL is what the KSC host cannot show, and an arrival lane is what a KSC half would have to be. `allowedAnomalies = []` on purpose with TWO possible raises pre-registered and neither pre-tolerated: `rigid-seam-tangent-discontinuity`, and `icon-off-orbit`, whose family V19T has since NARROWED - six raises at three parents, V17T silent with two variables moving, V19T silent with self-overlap YES and nested-SOI NO, which excludes nested-SOI and leaves self-overlap the surviving candidate with no mechanism claimed - so this lane is a further data point on an open reading rather than a test of a settled one. NOTHING IS ARMED."
