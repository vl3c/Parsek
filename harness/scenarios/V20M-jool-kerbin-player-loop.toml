# =====================================================================================
# V20M: THE FLIGHT-MAP HALF OF THE FIRST **KERBIN-ARRIVAL** LOOP PAIR - the first lane in
# the suite whose subject arrives at KERBIN FROM ANOTHER PLANET, and the lane that reads
# the routing of a TWO-STAGE PARENT-RELAY interplanetary return.
#
# THE SUBJECT IS HARVESTED AND EVERY NUMBER BELOW IS READ OUT OF ITS BYTES.
# `B29-jool-kerbin-return` FLIGHT 3 flew on 2026-08-27, PASS attempt 1, MISSION-OK, wall
# 2,103 s, and its produced save is committed as `fixtures/saves/kerbin-return-recorded`
# (`--keep-parsek`). The full flight ledger - all three flights, the two INVALID
# calibration reads and the re-scope onto the parent-relay mode - lives at the top of
# `harness/scenarios/B29-jool-kerbin-return.toml` and is NOT restated here.
#
# NOTHING IN THIS FILE IS ARMED. It is a READING-RUN spec: no `gating = true` anywhere,
# no routing token in `required`, and every window is DERIVED from the committed bytes
# rather than measured. That is the V14M-through-V19M discipline at its first step.
#
# ---------------------------------------------------------------------------------
# 0. THE SUBJECT, MEASURED OFF THE COMMITTED BYTES
# ---------------------------------------------------------------------------------
#   tree id      = 6c0002fea2134f688e2c3e9252026543   ("Duna Rocket", persistent.sfs)
#   recording id = 6d171d14ef474fbf95c69ada863bda12   (ONE member, ONE .prec sidecar)
#   vessel guid  = 5384d5f4fe8244d782aaa5cb79345562   (recordedVesselGuid)
#   save UT      = 60,393,898.254155263               (the produced save's FLIGHTSTATE UT)
#   explicitStartUT / explicitEndUT
#                = 27,787,321.159510821 / 60,393,894.394154631   (= first / last POINT)
#   pointCount   = 739 (the `.sfs` metadata the C# codec writes)
#   startBodyName = Jool, endpointBodyName = Kerbin, terminalState = 0 (Orbiting),
#   segmentPhase = exo, CREWED (Valentina Kerman in the mk1pod.v2)
#   saveParse facets, measured with `saveparse.observed_structure_facets`:
#     trees 1 / committedTrees 1 / recordings 1 / terminalStates {Orbiting: 1} /
#     branchPoints {} / duplicateRecordingIds [] ; points 739/739/739 unparsed 0 ;
#     supersedeRows 0 / tombstones 0 / rewindPoints 0 / rewindRetirements 0
#
# **THE TWO POINT COUNTS ARE DIFFERENT SURFACES AND BOTH ARE RIGHT** (V19T's note,
# reproduced because it recurs): the `.prec` sidecar carries **749** POINT nodes while
# the `.sfs` metadata reads `pointCount = 739`. Nothing below pins either.
#
# **42 TRACK_SECTIONs - 24 at `ref=0` (Absolute, point-carrying) and 18 at `ref=2`
# (`TrackSection.ReferenceFrame.OrbitalCheckpoint`, one wrapping each ORBIT_SEGMENT),
# and ZERO at `ref=1`** - so there is no Relative-frame resolution anywhere in this
# subject. The `ref=2` sections are exactly the ones that carry an orbit SOURCE, which is
# what section 3's jump placement and V20T's init-walk question both turn on.
#
# **EIGHTEEN ORBIT_SEGMENTs, every one `isPredicted=False`** - Jool 0-4, Sun 5-13,
# Kerbin 14-17 - so exactly TWO body-change seams. The load-bearing ones, read off the
# sidecar:
#   seg#4  Jool   end   = **36,198,519.425954551**   <- the JOOL->SUN seam
#   seg#5  Sun    [36,198,519.425954551, 37,098,556.092056312]  sma 5.9638e10 ecc 0.16402
#   seg#6..13 Sun the transfer run, sma ~4.096e10 ecc 0.6724
#   seg#13 Sun    end   = **60,366,070.331327148**   <- the SUN->KERBIN seam
#   seg#14 Kerbin [60,366,070.331327148, 60,366,105.320848629]  sma -392,274.880 ecc 2.7877
#   seg#16 Kerbin [60,366,107.016874090, 60,392,908.239061728]  <- THE ARRIVAL COAST
#   seg#17 Kerbin end   = **60,393,505.214090839**   <- THE LAST ORBIT SOURCE
# The Kerbin-side conics are HYPERBOLIC (sma -392,274.880 m, ecc 2.7877, inc 16.4427 deg):
# this is the approach hyperbola, and the CAPTURE BURN that closes it happens AFTER the
# last ORBIT_SEGMENT ends.
#
# **SO THE PARKED TAIL IS SEGMENT-LESS, AND IT IS 391.700 s LONG.** Orbit-source coverage
# stops at 60,393,505.214090839 and the recording runs on to 60,393,896.914155044 with no
# ORBIT_SEGMENT over it. The `env=1` capture burn sits inside that stretch,
# [60,393,511.094091800, 60,393,717.394125618] (206.300 s). That is the B25/V16M/V19M
# shape and section 3's tail read is placed against it deliberately.
#
# THE BODY SEAMS AS THE **POINTS** SEE THEM, which is a DIFFERENT clock and is recorded
# so the two are not confused: the first Sun-bodied POINT is at 37,098,556.092056312 and
# the first Kerbin-bodied POINT at 60,366,105.320848629, both LATER than the
# ORBIT_SEGMENT seam, because the intervening `ref=2` checkpoint sections carry no points
# at all. **THE SPLIT PREDICATE AND THE LOOP UNIT BOTH READ SECTIONS, NOT POINTS**, so
# every offset in this file is measured against the section surface.
