# 4. THE FORTY-TICK CENSUS-PACING BLOCK, AND WHY IT SITS AT THE COAST EPOCH
# ---------------------------------------------------------------------------------
# The block is V16M's, verbatim, and it is PROVEN machinery rather than a proposal:
# V16M's reading run `2026-08-19_2114` emitted the `seam-endpoint summary` MEASURING line
# at BOTH arrivals, 11.502 wall-seconds apart, against the 5.0 s
# `ParsekLog.VerboseRateLimited` window that swallowed V15M's cycle-2 emission on all
# three of its runs. Forty `RecordingState` ticks cost `>= 10.0 wall s` at `run.py`'s
# 0.25 s `POLL_INTERVAL_SECONDS` hard floor (2.0x the window) and ~21.6 s at V5's MEASURED
# 0.54 s/tick (4.3x).
#
# **IT SITS AT THE COAST EPOCH RATHER THAN AT THE TAIL EPOCH, AND ON THIS SUBJECT THAT
# PLACEMENT IS SHARPER THAN IT WAS ON ANY PREDECESSOR.** The block buys two things:
#   (a) WALL-TIME SEPARATION between the two cycles' census emissions - placement-
#       independent, so it is not what decides.
#   (b) GAME-TIME DWELL ON A FRAME WHERE THE DESTINATION-FRAME LENS CAN ACTUALLY EMIT.
#       `phase=body-orbit surface=ProtoOrbitLine` is an ON-CHANGE Verbose truth line
#       (`MapRenderProbe.cs:652-671`): it prints when a proto's body / sma / ecc key
#       CHANGES, per live proto. At the COAST epoch the one Kerbin-side instance is
#       sitting on a stable Kerbin-framed conic with an ORBIT SOURCE under it (seg#16,
#       8,039.888 s of it still ahead). At the TAIL epoch that same instance is on the
#       391.700 s SEGMENT-LESS stub, where no orbit source resolves at all.
#       THE MECHANISM THAT MAKES THE KEY CHANGE IS THE FIRST-SAMPLE RULE, NOT A RE-ARM
#       (V19M's correction, inherited because the arithmetic is even more decisive here):
#       forty ticks buy ~10 game s at 1x after an INSTANTANEOUS TimeJump, against a
#       **1,630,328.8 s** launch pitch, so **ZERO instances launch inside the dwell** -
#       five orders of magnitude out, not a close call. What prints is
#       `MapRenderProbe.EmitTruthOnChange`'s first-sample rule
#       (`MapRenderProbe.cs:1261-1262`: a pid with no prior entry counts as CHANGED), over
#       the ghosts the jump rebuilt, and the dwell holds the scene open for those
#       emissions.
# WHAT IT COSTS, DERIVED: ~10 GAME seconds of 1x playback dropped into a **26,801.222 s**
# recorded arrival coast with **8,039.888 s** of it still ahead - **804x the dwell**, the
# most comfortable margin any lane carrying this block has had (V19M ran it at 141x,
# V16M inside 104.54 s of recorded tail). The ghost cannot run off the end of its own
# span here.
# WHAT IT MIGHT BUY THAT V19M's COULD NOT: this recording has TWO cross-body seams
# against V19M's one, so the `seam-endpoint` census has two candidate endpoints per
# cycle. That makes `evaluated=` a cleaner number to read and a worse number to guess,
# which is why nothing below pins its value.
