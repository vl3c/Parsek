# three of its runs. Forty `RecordingState` ticks cost `>= 10.0 wall s` at `run.py`'s
# 0.25 s `POLL_INTERVAL_SECONDS` hard floor (2.0x the window) and ~21.6 s at V5's MEASURED
# 0.54 s/tick (4.3x).
