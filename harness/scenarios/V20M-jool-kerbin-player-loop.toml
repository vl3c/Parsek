# lane's OWN green reading run 3, `2026-08-27_1925` (PASS attempt 1, wall 71 s, the
# reordered coast-epoch-first table), whose saveParse REPORT measured rewindPoints=0,
# supersedeRows=0, tombstones=0, rewindRetirements=0 - and off run 2 `2026-08-27_1856`,
# which measured the same four zeros on the pre-reorder table. **EVERY WINDOW BELOW WAS
# ALREADY MET BY BOTH GREEN RUNS, SO THE ARMING RE-PINNED NOTHING AND MOVED NO VERDICT**
# (the S4.1 bar). The reading runs carried these same three windows REPORT-ONLY; the
# numbers did not change, only their gating did.
# The claim being predicted is the family's, on the KERBIN-ARRIVAL axis: a pure
# replay-observation workflow (arm -> Warp-to -> stepped seam bracket -> a forty-tick
# coast dwell -> a tail read -> Watch, twice over) must author NOTHING durable, across a
