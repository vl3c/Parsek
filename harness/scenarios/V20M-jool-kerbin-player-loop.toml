allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir. The harvested fixture ships exactly ONE (measured:
# 6d171d14ef474fbf95c69ada863bda12.prec), and this lane starts no recording of its own,
# so the count can move only through the LOAD-TIME optimizer walk, which fires for the
# FIRST time on THIS lane's LoadGame (B29's own run commits and flushes without
# re-loading):
#   +1  the fixture's own committed recording, carried in and untouched.
#   +2  ADMITTED, NOT PREDICTED: a split at EITHER of the TWO body-change seams. That is
#       why this window is {1,3} where V19M's one-seam subject used {1,2}.
#
# THE CODE-READ PREDICTION IS COHESION AT BOTH, and the two seams reach it by DIFFERENT
# disjuncts of `ShouldKeepCohesiveCrossBodyExoCoast`, which is worth writing down because
# the second one has never been exercised at a real seam by a committed lane:
#   JOOL->SUN (sections #10 -> #11): both sides `env=2` ExoBallistic, both `ref=2`.
#       Clause (a), the original ballistic-coast rule. Same as V19M's single seam.
#   SUN->KERBIN (sections #30 -> #31): the LEFT side is `env=1` **ExoPropulsive** and the
#       right is `env=2` ExoBallistic, so clause (a) does NOT apply. Both classify to
#       `ExoSplitClass` (SplitEnvironmentClass maps ExoPropulsive and ExoBallistic to the
#       same class), so step 2 sees `envChanged=false, bodyChanged=true`, and step 3 is
#       reached - where **clause (b)** admits it because BOTH sections are
#       `ReferenceFrame.OrbitalCheckpoint`: the vessel was packed across the handoff, so
#       whatever env label the recorder stamped, it was coasting. **THIS SUBJECT IS THE
#       FIRST IN THE CORPUS WHOSE COHESION DEPENDS ON THAT DISJUNCT.**
# So the predicted optimizer line is `Split summary: rec=6d171d14ef474fbf95c69ada863bda12
# evaluated=2 ... exoCoastBodyChangeKept=2 splittableButRejected=0` and the predicted
# count is 1. **NEITHER IS PINNED ON A READING RUN.** V19M armed its
# `exoCoastBodyChangeKept=1` token only AFTER measuring it; the same discipline applies
# here, and the arming pass is where this window tightens and that token is promoted.
#
# **TIGHTENED {1,3} -> {1,1} AT THE ARMING PASS, 2026-08-27.** The admitted split DID
# NOT MATERIALIZE on any of this lane's three runs: every one measured
# `recordings.count = 1` and printed `Split summary: rec=6d171d14ef474fbf95c69ada863bda12
# evaluated=2 ... exoCoastBodyChangeKept=2 splittableButRejected=0` - cohesion at BOTH
# body seams, byte-identical on runs 1, 2 and 3 and on both of V20T's runs. The wide
# {1,3} window STAYS ON THE RECORD as the committed reading-era admission (a
# pre-registration is not deleted because the run answered it); it is SUBSUMED by this
# gate and by the `exoCoastBodyChangeKept=2` token now promoted into `required`, which is
# the V14M/V19M precedent for making a measured structural answer regress LOUDLY rather
# than silently.
#
# **RUN 1 CONFIRMED BOTH, AND AT THE READING PASS NEITHER WAS PROMOTED.** `2026-08-27_1828` measured
# `recordings.count = 1` and printed the predicted `Split summary` line verbatim,
# `evaluated=2 ... exoCoastBodyChangeKept=2 splittableButRejected=0` - so the clause-(b)
# argument above is now a MEASUREMENT and this is the first corpus exercise of that
# disjunct at a real seam. The window STAYS {1,3} and the token stays out of `required`,
# because this is still the reading pass; both belong to the arming pass, off a GREEN run
# of this lane.
count = { min = 1, max = 1 }

[expectations.logContracts]
# **ELEVEN TOKENS AFTER THE ROUND-2 RE-PIN, THE ROUND-4 RESTORE AND THE ROUND-5
# COHESION PROMOTION.** It was seven; run 1 (`2026-08-27_1828`)
# refuted one of them, that one is REMOVED here and KEPT VERBATIM in header section 5,
# and THREE run-1-MEASURED tokens replace it (header section 5A argues the choice and
# states plainly that the replacement is a DEMOTION from a rendered-frame claim to a
# seed-side one). The two a reader will notice missing are missing on purpose (header
# section 8): `PhaseLock APPLIED: mission=` and an `Orbital(...) same-parent`
# classification are BOTH phase-lock-road artifacts, and requiring either would have
# gated run 1 on R1 - the road the code walk ranked LAST and the run refuted.
#   "missionconfig applied:"       - the arm verb ran, and its Info line is where the
#                                    anchor is echoed (`anchorUt=` / `phaseAnchorUt=`).
#                                    THE most important line in the log for this lane,
#                                    because the anchor is the ONE seeded number.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired, not a test
#                                    back door.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door and
#                                    echoed the resolved relaunchUt. Read it PER CYCLE:
#                                    under R3 the two differ by exactly the span,
#                                    32,606,575.774644 s.
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line, which makes the
#                                    D9 claim GATED. Road-independent.
#   **THE REFUTED PIN, RECORDED HERE AND NOT IN THE ARRAY.** The original destination
#   token was
#       `phase=body-orbit surface=ProtoOrbitLine .*body=Kerbin`
#   - the ghost's proto orbit line rebound onto a Kerbin-framed conic. THE LENS ARGUMENT
#   BEHIND IT WAS CORRECT AND IS UNCHANGED (the visited set {Jool, Sun, Kerbin} LOOKS
#   nested and is not; `NestedSoiSubtree.FindNestedRoot`'s self-reference guard rejects
#   the Sun as a root, so V17M's structurally-unsatisfiable case cannot arise here). What
#   run 1 measured is that the lens has nothing destination-framed to REPORT on this
#   subject: all 41 `phase=body-orbit` reads are the recording's FIRST segment
#   (`body=Jool sma=590325785`), each pid emits exactly one sample, and 36 of 41 protos
#   were CREATED on a different orbit than the probe read back - so the token is
#   unreachable at EVERY epoch, not just at the ten this lane chose. Header sections 5
#   and 9 carry the per-pid evidence and the honest split between instrument limitation
#   and product observation.
#   THE THREE REPLACEMENTS, all MEASURED in run 1 (the S1.4 rule):
#   "OrbitReseed\\] TryFromHistoricalLatLonAltAndRecordedVelocityWithEpoch: body=Kerbin"
#       - **THE RE-PINNED DESTINATION TOKEN, and it is a SEED-SIDE claim rather than a
#       rendered-frame one.** `OrbitSeedResolver.TryDeriveTailOrbitSeed(..., MapPresence)`
#       resolves the ghost proto's ENDPOINT-TAIL orbit from the RECORDING's own latest
#       coast frame in the recording's endpoint body's frame, and `body` is
#       `FindBodyByName(RecordingEndpointResolver.TryGetPreferredEndpointBodyName(traj))`
#       - THE RECORDING's endpoint body, Kerbin, so a subject arriving elsewhere prints a
#       different body. Both call sites are in `GhostMapPresence.cs` (`:4673`, `:10594`),
#       so nothing but ghost-proto machinery reaches the emitter and the produced save's
#       OWN Kerbin-parked craft cannot satisfy it. Emitted via `ParsekLog.Verbose` (NOT
#       rate-limited), 41 times in run 1 - once per ghost-proto creation - carrying
#       `recordedUT=60393894.39`, this recording's own `explicitEndUT`. **IT DOES NOT
#       DISCHARGE THE RENDERED-FRAME CLAIM AND THIS FILE SAYS SO** (section 5A).
#   "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment"
#       - THE ANTI-EMPTINESS FLOOR. 41 in run 1. A scene that materialized no ghosts
#       cannot green it. Road- and body-independent by design: it is a floor, not a
#       destination claim, and it is here so the seed token above is never the only thing
#       standing between this lane and a vacuous pass.
#   "ShouldPopulateTerminalOrbitFromLastSegment: .*explicit endpoint body=Kerbin"
#       - THE LOAD-TIME STRUCTURAL PREMISE. Measured once at LoadGame: `preserved cached
#       terminal orbit for '6d171d14ef474fbf95c69ada863bda12' because explicit endpoint
#       body=Kerbin keeps cached orbit authoritative over later segment body=Kerbin
#       sma=-392274.9`. It guards that the recording's KERBIN endpoint survives the load
#       and stays authoritative over the hyperbolic approach segment - the premise the
#       rest of this file rests on. A LOAD-TIME token, labelled as one; it says nothing
#       about any render.
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - the PRESENCE form.
#       `sampled=[1-9]` is NOT pinned (the standing
#       FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and it
#       stays that way on a first run for TWO reasons rather than one. (a) The value is
#       unmeasured at this subject, which has TWO seams where V19M had one. (b) V16T
#       MEASURED that this lens can raise `outsideSoi=1` from a creation-frame binding
#       artifact rather than from real drift. Pin presence; read the value.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  # **RESTORED AT ROUND 4 (the reorder), and it is a RENDERED-FRAME token again.**
  # MEASURED by V20T reading run 1 in ITS OWN FLIGHT PRELUDE - pid 17209614, frame 7935,
  # currentUT 94,621,776.160, i.e. AT THIS LANE'S NEW FIRST JUMP - so the S1.4 rule
  # authorises it for THIS host at THIS epoch. Header section 11 argues it and names
  # the miss outcome.
  "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Kerbin scene=FLIGHT",
  "OrbitReseed\\] TryFromHistoricalLatLonAltAndRecordedVelocityWithEpoch: body=Kerbin",
  "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment",
  "ShouldPopulateTerminalOrbitFromLastSegment: .*explicit endpoint body=Kerbin",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
  # THE OPTIMIZER-COHESION PIN, PROMOTED AT THE ARMING PASS 2026-08-27 (the V14M/V19M
  # precedent). Measured IDENTICALLY on all five green-or-red runs across the pair -
  # `evaluated=2 ... exoCoastBodyChangeKept=2 splittableButRejected=0` - and this subject
  # is the FIRST in the corpus whose cohesion depends on
  # `ShouldKeepCohesiveCrossBodyExoCoast`'s SECOND disjunct (the Sun->Kerbin seam is
  # ExoPropulsive -> ExoBallistic and survives only because both sections are
  # OrbitalCheckpoint-framed), so a regression there would be a genuinely new failure.
  # WITHOUT this token such a regression would show only as a `recordings.count` window
  # miss, and only because that window was tightened to {1,1} in the same pass - the
  # token names the MECHANISM rather than its side effect. The trailing
  # ` splittableButRejected=0` is load-bearing: it stops `...Kept=2` matching a future
  # `...Kept=20`. **PINNED ON THIS LANE ONLY**: V20T pins the COUNT, this lane pins the
  # MECHANISM, one gate per fact across the pair (the V19M/V19T split, verbatim).
  "Split summary: .*exoCoastBodyChangeKept=2 splittableButRejected=0",
]
# THREE, NOT THE SAME-PARENT FAMILY'S SIX. `[ReaimDiag]`, `ENGAGED re-aim` and
# `FORCED FAITHFUL` are all REMOVED relative to V14M/V15M/V16M - those lanes forbid them
# because on a same-parent subject re-aim is structurally unreachable and its appearance
# would falsify the routing claim. HERE RE-AIM IS ONE OF FOUR ROADS THAT MIGHT
# LEGITIMATELY BE TAKEN - and this is the FIRST subject in the corpus that satisfies the
# classifier's arrival scan at all - so forbidding those tokens would red the interesting
# outcome. They are in NEITHER list, deliberately (header section 2).
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 MARKER, and it is a REDUNDANT grep-stable echo rather than the
  # self-detection the family's early text called it:
  # `ParsekTestCommandAddon.TimeJumpKscAction.cs:55-57` logs the Warn AND calls
  # `SetExecResult("REJECTED", null, "backward-jump")`, and every TimeJump step here
  # carries `expect = "OK"`, so the STEP itself goes unmet and the run is driver-INVALID
  # on both attempts. Kept because it is family convention and costs nothing.
  # **THE CASE NOTHING CATCHES** is a jump that lands FORWARD at the WRONG epoch: read
  # `anchorUt=` and both `relaunchUt=` echoes (header section 3).
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a defect in the RENDER rather than a reading
  # about the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
