ng faithful`. **A CORRECTION IS RECORDED RATHER THAN SILENTLY APPLIED**: this lane was commissioned expecting the decline to land on a `wholeRevs >= 1` conjunct measured against the recording's JOOL park. That arithmetic is real - park sma 590,325,784.58933163 with mu_Jool 2.82528e14 gives P = 5,361,505.4315 s and the park runs 3,764,772.221 s = **0.702186 rev** - but every `wholeRevs` test in `IsHeliocentricParkingDeparture` is scoped to COMMON-ANCESTOR runs, and the code says the launch-body loiter cut \"is the existing validated L2 trim and is NOT gated here\". R2 is nonetheless pre-registered in BOTH directions: a `supported=True` would mean one of the three refusals does not hold at runtime, and THAT is the finding. R3 plain faithful fixed cadence is the code-read prediction; R4 is any `[Parsek][ERROR]` or an unlisted decline reason. The sharpest single discriminator is `factory chain ... reaimed=` - grep `reaimed=` ALONE, because `MapRender/PhaseFactory.cs:118` interposes `window=[...]` before `faithfulFallback=`. The re-aim trio stays out of BOTH lists, V19M's posture for V19M's reason, sharper here because this is the first subject that can legitimately engage. **THE ANTI-VACUITY LENS DECISION IS THE MOST IMPORTANT DERIVATION IN THE PAIR, BECAUSE THE SUBJECT LOOKS LIKE A NESTED-SOI CANDIDATE AND IS NOT ONE.** Visited bodies are {Jool, Sun, Kerbin} and **the Sun has TWO visited children**, which is exactly the count `NestedSoiSubtree.FindNestedRoot` looks for - but `NestedSoiSubtree.cs:202-219` requires the shared parent to be NON-ROOT and detects the root both when its parent reports null and when it reports ITSELF (live KSP `Sun.referenceBody == Sun`), and the comment at `:212-214` names this exact shape as the reason that guard exists: without it, live `[\"Kerbin\",\"Sun\",\"Duna\"]` \"was wrongly flagged nested -> fail-closed every ordinary interplanetary transfer\". Our sequence is the MIRROR of that example, so `FindNestedRoot` returns null, `FailClosed