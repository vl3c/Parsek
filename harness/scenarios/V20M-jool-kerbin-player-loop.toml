# 5. THE SHAPE AND THE LENS - the coverage-criterion (a) obligation, discharged
# ---------------------------------------------------------------------------------
# `docs/dev/autotest-roadmap.md` -> "The loop-render coverage program" ->
# "Confirmation criteria" -> **(a)**: a spec must NAME which lens it pins the destination
# frame on, and why that is the right one FOR ITS SUBJECT'S SHAPE, because a nested-SOI
# subject fail-closes its proto orbit line to the ROOT frame and makes a
# `surface=ProtoOrbitLine ... body=<destination>` pin STRUCTURALLY UNSATISFIABLE rather
# than merely unmet. V17M spent four reading runs learning that.
#
# **THIS IS THE MOST IMPORTANT DERIVATION IN THE PAIR, BECAUSE THE SUBJECT LOOKS LIKE A
# NESTED-SOI CANDIDATE AND IS NOT ONE.** Visited bodies are {Jool, Sun, Kerbin}, and
# **THE SUN HAS TWO VISITED CHILDREN** (Jool and Kerbin), which is exactly the ">= 2
# visited children" count `NestedSoiSubtree.FindNestedRoot` looks for. A reader who stops
# there concludes root=Sun, a fail-closed root-frame render, and a structurally
# unsatisfiable `body=Kerbin` pin. **THAT READING IS WRONG, AND THE CODE SAYS SO IN AS
# MANY WORDS.** `Source/Parsek/MapRender/NestedSoiSubtree.cs:202-219` requires the shared
# parent to itself be NON-ROOT, and detects the root BOTH when the delegate reports its
# parent as null (headless fake) AND when it reports it as ITSELF (live KSP:
# `Sun.referenceBody == Sun`). The comment at `:212-214` names THIS EXACT SHAPE as the
# reason the self-reference guard exists:
#     "Without the self-reference guard, live ["Kerbin","Sun","Duna"] (Sun has >= 2
#      visited children, grandparent("Sun") == "Sun" != null) was wrongly flagged
#      nested -> fail-closed every ordinary interplanetary transfer."
# Our body sequence is the MIRROR of that example - [Jool, Sun, Kerbin]. `grandparent` of
# the only qualifying parent ("Sun") equals "Sun", the guard rejects it,
# `FindNestedRoot` returns null, `TryBuildFromBodySequence` returns null, and
# `FailClosedClassifier` leaves the decision SUPPORTED. **THERE IS NO FAIL-CLOSED
# ROOT-FRAME RENDER ON THIS SUBJECT and no `producer=nested-soi
# provenance=faithful-fallback` declaration line to re-target onto**, so V17M's
# TracedPath-shadow / dynamic-path workaround is NOT needed and is deliberately not used.
#
# SO THE ANTI-VACUITY PIN IS THE PROTO LINE CARRYING THE DESTINATION FRAME:
#
#     phase=body-orbit surface=ProtoOrbitLine .*body=Kerbin
#
# which is the exact form V19M measured 44 times as `... body=Jool` and V16M 40 times as
# `... body=Laythe` on their own subjects. **IF IT DOES NOT PRINT, THAT IS A FINDING, NOT
# A RECALIBRATION.** The lens was chosen from this subject's own topology before the
# flight; moving the pin after a miss would be re-targeting to green rather than
# measuring.
#
# **AND ON THIS SUBJECT THE SELF-OVERLAP CAVEAT INVERTS - THE PIN IS THE HARDEST IN THE
# PROGRAM TO SATISFY RATHER THAN THE EASIEST.** V19M had to argue AGAINST vacuity because
# roughly half of its twenty instances were destination-framed at any Jool-side epoch
# (measured Jool 44 / Laythe 41). Here the Kerbin window is **27,826.583 s** of a
# **32,606,575.8 s** span - **0.0853%** - against a **1,630,328.8 s** launch pitch that is
# 58.6x wider than the window, so AT MOST ONE instance can ever be Kerbin-framed. The
# derived census at every one of the ten observation epochs is:
#     **Kerbin 1 / Sun 14 / Jool-escape 3 / Jool-park 2**
# ONE ghost out of twenty carries the pin, and it is the OLDEST live instance. That is a
