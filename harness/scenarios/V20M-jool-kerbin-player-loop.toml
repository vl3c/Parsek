f propagation and the ghost's ~1,589 Kerbin rotations of body-fixed replay, neither of which this file will pretend to have done. The pin rests instead on `ResolveAutoWatchIndex` scoring ONE candidate per COMMITTED RECORDING INDEX out of `Engine.ghostStates[index]` - which V16M, V17M and V19M all measured as `reason=no-watchable-ghost committed=1 tree=(any)`, no candidate resolving at all. An OK is the finding and would land driver-INVALID; re-shape the step, never re-roll. **ONE COST NO PRIOR V LANE CARRIED, STATED HONESTLY**: the schedule traverses 66,843,337 s of game time (~7.3 Kerbin years) in ten instantaneous `Planetarium` clock sets, and no committed lane has measured KSP's on-rails propagation cost at that magnitude - if the run dies on a TimeJump budget rather than on a verdict, that is the reading and the fix is a budget, not a re-seeded table. `[expectations.recordings] count` is WIDE at {1,3} because there are TWO splittable candidates; the code-read prediction is COHESION at both, and it is worth writing down that the Sun->Kerbin seam is the **FIRST in the corpus to depend on `ShouldKeepCohesiveCrossBodyExoCoast`'s SECOND disjunct** - its left side is `env=1` ExoPropulsive and its right `env=2` ExoBallistic, so clause (a) does not apply and only the on-rails clause (b), both sides `ReferenceFrame.OrbitalCheckpoint`, keeps it whole. THE NEGATIVE CONTROL owed by criterion (b) is pre-registered and NOT yet flown: invert `body=Kerbin` -> `body=Duna` inside the required array only, `Duna` chosen because it is a SIBLING PLANET of both origin and destination that this recording never visits; and the PAIR must run TWO controls, not one shared, because V20T pins the proto ICON in TRACKSTATION while this lane pins the proto ORBIT LINE. **THE KSC THIRD IS NOT THIS LANE'S AND IS NOT SETTLED BY IT**: `ParsekKSC.IsKscStructurallyEligible` (`ParsekKSC.cs:1488`) admits on `rec.Points[0].bodyName == \"Kerbin\"` and THIS recording's first POINT reads `body = Jool`, while `ParsekKSC.Playback` hard-gates every point and segment on `bodyName != \"Kerbin\"` with skip reason `non-kerbin` (`:288-297` / `:362-372`) - so the KSC host may well see nothing here either, exactly as it saw nothing of B28. `V20K` over these same bytes is where that becomes either a closed payoff or a cited limitation, and **under confirmation criterion (c) no limitation may be written up before a V20K run exists**; V20M and V20T are the flight-map and Tracking-Station thirds and claim nothing about the KSC one. NO D11 CELL IS CLAIMED: the routing is what this run MEASURES, and claiming a cell whose gate is one branch of a four-way read is a coin flip dressed as coverage."
