`2a` = 24.5x the 300,000 m `WatchEnterCutoffMeters`), nineteen of the twenty instances sit at Sun/Jool distances of order 1e10-5e10 m and are excluded by radius alone, and **the twentieth is genuinely open** - instance 1 at the tail epoch is on the SAME Kerbin park as the observer, and resolving their separation would need the observer's 1,456.24 revolutions of propagation and the ghost's ~1,589 Kerbin rotations of body-fixed replay, neither of which this file will pretend to have done. The pin rests instead on `ResolveAutoWatchIndex` scoring ONE candidate per COMMITTED RECORDING INDEX out of `Engine.ghostStates[index]` - which V16M, V17M and V19M all measured as `reason=no-watchable-ghost committed=1 tree=(any)`, no candidate resolving at all. An OK is the finding and would land driver-INVALID; re-shape the step, never re-roll. **ONE COST NO PRIOR V LANE CARRIED, STATED HONESTLY**: the schedule traverses 66,843,337 s of game time (~7.3 Kerbin years) in ten instantaneous `Planetarium` clock sets, and no committed lane has measured KSP's on-rails propagation cost at that magnitude - if the run dies on a TimeJump budget rather than on a verdict, that is the reading and the fix is a budget, not a re-seeded table. `[expectations.recordings] count` is WIDE at {1,3} because there are TWO splittable candidates, and **RUN 1 CONFIRMED THE COHESION PREDICTION AT BOTH** - `Split summary: rec=6d171d14ef474fbf95c69ada863bda12 evaluated=2 ... exoCoastBodyChangeKept=2 splittableButRejected=0` - which makes this the FIRST MEASURED exercise of that second disjunct at a real seam. Neither the window nor the token is promoted here: that is the arming pass, and this is still the reading pass. It is worth writing down that the Sun->Kerbin seam is the **FIRST in the corpus to depend on `ShouldKeepCohesiveCrossBodyExoCoast`'s SECOND disjunct** - its left side is `env=1` ExoPropulsive and its right `env=2` ExoBallistic, so clause (a) does not apply and only the on-rails clause (b), both sides `ReferenceFrame.OrbitalCheckpoint`, keeps it whole. THE NEGATIVE CONTROL owed by criterion (b) is pre-registered and NOT yet flown: invert `body=Kerbin` -> `body=Duna` inside the required array only, `Duna` chosen because it is a SIBLING PLANET of both origin and destination that this recording never visits; and the PAIR must run TWO controls, not one shared, because V20T pins the proto ICON in TRACKSTATION while this lane pins the proto ORBIT LINE. **THE KSC THIRD IS NOT THIS LANE'S AND IS NOT SETTLED BY IT**: `ParsekKSC.IsKscStructurallyEligible` (`ParsekKSC.cs:1488`) admits on `rec.Points[0].bodyName == \"Kerbin\"` and THIS recording's first POINT reads `body = Jool`, while `ParsekKSC.Playback` hard-gates every point and segment on `bodyName != \"Kerbin\"` with skip reason `non-kerbin` (`:288-297` / `:362-372`) - so the KSC host may well see nothing here either, exactly as it saw nothing of B28. `V20K` over these same bytes is where that becomes either a closed payoff or a cited limitation, and **under confirmation criterion (c) no limitation may be written up before a V20K run exists**; V20M and V20T are the flight-map and Tracking-Station thirds and claim nothing about the KSC one. **THE THREE UNITY EXCEPTIONS RUN 1 REPORTED ARE EXAMINED, NOT DISMISSED, AND NONE IS PARSEK CODE OR THE GHOST-MAP TEARDOWN NRE FAMILY**: all three fire inside the process-teardown OnDestroy cascade after FlushAndQuit and after the manifest export - stock KSP staging-UI teardown (`StageManager.SetSeparationIndices` under `Part.OnDestroy_Patch1`), **MechJeb's own** `MuMech.MechJebCore.OnDestroy`, and stock KSP `CrewHatchController.OnDestroy` - each a `FlightGlobals.ActiveVessel`-null-at-teardown or Unity destroy-ordering NRE in stock or third-party code, all of them after every observation this lane makes. Recorded so nobody re-investigates them; `unityExceptions` is REPORT-ONLY. NO D11 CELL IS CLAIMED: the routing is what this pair MEASURED, and claiming a cell whose gate is one b