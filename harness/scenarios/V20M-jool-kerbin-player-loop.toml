  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# CLAIM-IS-NOT-GATE, and this list is short because the thing a loop lane usually claims
# D11 for is the thing this run MEASURES.
#   D9  `fast-forward`  gated by the PRODUCT's own `FastForwardToEventUT: jumping to UT=`
#       line, which fires whichever of the four roads the unit took.
#   D14 `kerbin` / `scene-flight` / `sandbox` are the environment axes. **`kerbin` is
#       gated by the BODY-FRAMED RENDER token** (`phase=body-orbit
#       surface=ProtoOrbitLine .*body=Kerbin`) rather than by the epoch alone - V14T's
#       iteration-1 lesson: an epoch claim says where the clock was, not what was
#       rendered. THIS IS THE FIRST TIME `kerbin` IS CLAIMED BY A LOOP-RENDER LANE AS AN
#       ARRIVAL FRAME rather than as a departure environment.
#
# NOT CLAIMED, DELIBERATELY:
#   ANY D11 ROUTING CELL. `phase-lock` is V14M/V15M/V16M's claim, gated by
#       `PhaseLock APPLIED: mission=`; the `re-aim` cells are its mirror. **THIS LANE
#       MUST CLAIM NEITHER**, because THE ROUTING IS WHAT THIS RUN MEASURES and its gate
#       would be one of FOUR possible outcomes (header section 2). Claiming a cell whose
#       gate is one branch of a four-way read is a coin flip dressed as coverage.
#       Note in particular that `heliocentric-parking-departure` is a REGISTERED D11
#       value and this subject walks right up to its gate - which is exactly why it is
#       not claimed: the code walk predicts the exception REFUSES, and claiming the cell
#       would assert the answer this lane exists to read.
#   D14 `jool` - the recording carries a long Jool phase and five of the twenty instances
#       replay it at every observation epoch, but NOTHING in this contract gates a
#       Jool-framed render, so the cell would be an epoch claim. (B29 itself claims it.)
#   D14 `scene-map` - this lane observes the flight-scene map surfaces through the
#       ghost-proto lens, but it drives no map-mode entry verb, so the claim would be
#       about which renderer emitted rather than about a scene the lane entered.
#   D6 `time-jump` - the jumps are the instrument, not the subject.
[dimensionsCovered]
D9  = ["fast-forward"]
D14 = ["kerbin", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header, or TOML scopes it into the sub-table and
# hlib.validate_spec rejects it.
#
# EMPTY. The loop-seam-teleport instrument is armed with no budget so a raise is REPORTED
# as the finding it would be. THREE known populations this lane may meet and does NOT
# pre-tolerate: the intermittent `line-blink` V15M's control run swept at a cycle-2 park
# epoch; the creation-frame family (`icon-off-orbit`, `seam-endpoint-outside-soi`) V16T
# measured, whose surviving ranked candidate after V19T is SELF-OVERLAP - which this
# subject has; and `rigid-seam-tangent-discontinuity`, which raises at an owned descent
# draw. This lane uses a STEPPED bracket, the silent control in all three earlier
# programs, so the expectation is silence and a raise is a real reading.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir. The harvested fixture ships exactly ONE (measured:
# 6d171d14ef474fbf95c69ada863bda12.prec), and this lane starts no recording of its own,
# so the count can move only through the LOAD-TIME optimizer walk, which fires for the
# FIRST time on THIS lane's LoadGame (B29's own run commits and flushes without
# re-loading):
#   +1  the fixture's own committed recording, carried in and untouched.
#   +2  ADMITTED, NOT PREDICTED: a split at EITHER of the TWO body-change seams. That is
#       why this window is {1,3} where V19M's one-seam subject used {1,2}.
#
# THE CODE-READ PREDICTION IS COHESION AT BOTH, and the two seams reach it by DIFFERENT
# disjuncts of `ShouldKeepCohesiveCrossBodyExoCoast`, which is worth writing down because
# the second one has never been exercised at a real seam by a committed lane:
#   JOOL->SUN (sections #10 -> #11): both sides `env=2` ExoBallistic, both `ref=2`.
#       Clause (a), the original ballistic-coast rule. Same as V19M's single seam.
#   SUN->KERBIN (sections #30 -> #31): the LEFT side is `env=1` **ExoPropulsive** and the
#       right is `env=2` ExoBallistic, so clause (a) does NOT apply. Both classify to
#       `ExoSplitClass` (SplitEnvironmentClass maps ExoPropulsive and ExoBallistic to the
#       same class), so step 2 sees `envChanged=false, bodyChanged=true`, and step 3 is
#       reached - where **clause (b)** admits it because BOTH sections are
#       `ReferenceFrame.OrbitalCheckpoint`: the vessel was packed across the handoff, so
#       whatever env label the recorder stamped, it was coasting. **THIS SUBJECT IS THE
#       FIRST IN THE CORPUS WHOSE COHESION DEPENDS ON THAT DISJUNCT.**
# So the predicted optimizer line is `Split summary: rec=6d171d14ef474fbf95c69ada863bda12
# evaluated=2 ... exoCoastBodyChangeKept=2 splittableButRejected=0` and the predicted
# count is 1. **NEITHER IS PINNED ON A READING RUN.** V19M armed its
# `exoCoastBodyChangeKept=1` token only AFTER measuring it; the same discipline applies
# here, and the arming pass is where this window tightens and that token is promoted.
count = { min = 1, max = 3 }

[expectations.logContracts]
# SEVEN TOKENS. The two a reader will notice missing are missing on purpose (header
# section 8): `PhaseLock APPLIED: mission=` and an `Orbital(...) same-parent`
# classification are BOTH phase-lock-road artifacts, and requiring either would gate this
# reading run on R1 - the road the code walk ranks LAST.
#   "missionconfig applied:"       - the arm verb ran, and its Info line is where the
#                                    anchor is echoed (`anchorUt=` / `phaseAnchorUt=`).
#                                    THE most important line in the log for this lane,
#                                    because the anchor is the ONE seeded number.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired, not a test
#                                    back door.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door and
#                                    echoed the resolved relaunchUt. Read it PER CYCLE:
#                                    under R3 the two differ by exactly the span,
#                                    32,606,575.774644 s.
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line, which makes the
#                                    D9 claim GATED. Road-independent.
#   THE ANTI-VACUITY / DESTINATION-FRAME PIN, and header section 5 argues the LENS CHOICE
#   from this subject's own topology rather than inheriting it:
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Kerbin"
#       - the ghost's proto orbit line REBOUND ONTO A KERBIN-FRAMED CONIC. The visited
#       set {Jool, Sun, Kerbin} LOOKS nested (the Sun has two visited children) and is
#       not: `NestedSoiSubtree.FindNestedRoot`'s self-reference guard rejects the Sun as a
#       root, by the code's own worked example, so the fail-closed ROOT-frame render that
#       made V17M's `body=Vall` pin structurally unsatisfiable CANNOT happen here. A run
#       that never prints this has measured nothing about a Kerbin arrival - the V1/V2
#       vacuity failure - and with ONE Kerbin-framed instance out of twenty this is the
#       most falsifiable destination pin in the program.
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - the PRESENCE form.
#       `sampled=[1-9]` is NOT pinned (the standing
#       FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and it
#       stays that way on a first run for TWO reasons rather than one. (a) The value is
#       unmeasured at this subject, which has TWO seams where V19M had one. (b) V16T
#       MEASURED that this lens can raise `outsideSoi=1` from a creation-frame binding
#       artifact rather than from real drift. Pin presence; read the value.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Kerbin",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, NOT THE SAME-PARENT FAMILY'S SIX. `[ReaimDiag]`, `ENGAGED re-aim` and
# `FORCED FAITHFUL` are all REMOVED relative to V14M/V15M/V16M - those lanes forbid them
# because on a same-parent subject re-aim is structurally unreachable and its appearance
# would falsify the routing claim. HERE RE-AIM IS ONE OF FOUR ROADS THAT MIGHT
# LEGITIMATELY BE TAKEN - and this is the FIRST subject in the corpus that satisfies the
# classifier's arrival scan at all - so forbidding those tokens would red the interesting
# outcome. They are in NEITHER list, deliberately (header section 2).
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 MARKER, and it is a REDUNDANT grep-stable echo rather than the
  # self-detection the family's early text called it:
  # `ParsekTestCommandAddon.TimeJumpKscAction.cs:55-57` logs the Warn AND calls
  # `SetExecResult("REJECTED", null, "backward-jump")`, and every TimeJump step here
  # carries `expect = "OK"`, so the STEP itself goes unmet and the run is driver-INVALID
  # on both attempts. Kept because it is family convention and costs nothing.
  # **THE CASE NOTHING CATCHES** is a jump that lands FORWARD at the WRONG epoch: read
  # `anchorUt=` and both `relaunchUt=` echoes (header section 3).
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a defect in the RENDER rather than a reading
  # about the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# **REPORT-ONLY. NOT ARMED.** This is a reading run and these three windows are the
# PREDICTION a green run will either confirm or move; arming them here would transcribe
# B29's PRODUCER-side facets and read like a measurement of THIS lane, which is exactly
# the mistake V19M's and V19T's own headers record having avoided. The arming pass
# belongs to a later commit written off this lane's own saveParse REPORT.
# The claim being predicted is the family's, on the KERBIN-ARRIVAL axis: a pure
# replay-observation workflow (arm -> Warp-to -> stepped seam bracket -> a forty-tick
# coast dwell -> a tail read -> Watch, twice over) must author NOTHING durable, across a
# SELF-OVERLAPPING 20-instance loop and 66.8 Ms of traversed game time.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# **REPORT-ONLY. NOT ARMED**, same reason as the rewind block above, and V17T's stated
# one: a report-only block of PREDICTED numbers already reads like a measurement, and
# arming it would make that misreading load-bearing. The numbers below are what the
# HARVESTED FIXTURE carries (trees 1, committedTrees 1, recordings 1, terminalStates
# {Orbiting: 1}, branchPoints {}, duplicateRecordingIds [], points 739/739/739 unparsed
# 0), i.e. B29's numbers - what this block will eventually CLAIM is what THIS lane's
# LoadGame + load-time optimizer walk + 104-step replay leaves behind, which has not been
# run.
# `recordings` is deliberately WIDE at {1,3}, matching the `count` window above and its
# two-seam arithmetic; `trees` keeps V2's max = 2, the documented duplicate-tree writer
# hazard.
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 3 }
terminalStates = { Orbiting = { min = 1 } }

[expectations.renderComposition]
# M-A7 - DECLARED BARE ON PURPOSE: no `gating`, no window, no list. Declaring is what sets
# `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder at Awake, and
# `rendercompose` then records its facets UNCONDITIONALLY on a parseable manifest - which
# is how a lane earns its first honest window off a green report-only run. A window
# written today would be a PREDICTION read back as though it were a measurement, the
# mistake V14M, V8 and V6M all shipped bare through their reading runs to avoid.
# READING PENDING - see the renderComposition arming ledger in this file's header.

[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 10x300 TimeJump + 80 RecordingState ticks
# (~20-44 wall s across the two blocks) + the fast non-deferred verbs + KSP boot +
# collect. Every jump is an INSTANTANEOUS Planetarium clock set, not a warp, so the
# per-step budgets are watchdogs rather than a cost estimate: V16M's 61-step shape
# measured 64 s end to end, V17M carries the same 2,400 for a 103-step shape, and V19M's
# own 103-step shape measured 98 s. This lane is 104 steps - V19M's plus one
# `ExportRenderManifest`.
# **BUT THIS LANE TRAVERSES 66.8 Ms OF GAME TIME AGAINST V19M's 24.5 ks - SIX ORDERS OF
# MAGNITUDE MORE** - and KSP must on-rails-propagate every vessel and SpaceObject in the
# save across each hop. That cost is UNMEASURED at this magnitude (header section 3
# prices it explicitly), so the family's 2,400 is carried unchanged as the watchdog it
# is, with the note that a TimeJump budget death is a READING about propagation cost and
# not a calibration failure.
budgetSeconds = 2400

[retry]
# One retry absorbs a transient seam flake. It does NOT absorb a mis-seeded anchor - that
# reproduces exactly on attempt 2, which is the point - and it does NOT absorb a watch
# verdict, because the selector outcome is a fixed structural fact (header section 7). A
# backward-jump on both attempts is the calibration signal, not a failure, and note that
# it reds through the STEP's own REJECTED rather than through the forbid.
policy = "once"

[expectedFail]
bugId = ""
