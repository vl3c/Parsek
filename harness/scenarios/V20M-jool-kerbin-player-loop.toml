# 7. THE WATCH PREDICTION - **PINNED REJECTED ON THE SELECTOR, NOT ON THE GEOMETRY**
# ---------------------------------------------------------------------------------
# The observer is the fixture's OWN parked craft - the player who watches a replay stands
# where the flight ended. Read off `persistent.sfs` (`Duna Rocket`, pid 807470910):
#   sma **3,670,509.7586827436 m**, ecc **0.80931045445302174**, inc 16.442681138876893,
#   LPE 11.405821723906005, LAN 2.9260556294006506, MNA 0.089592011945707428 rad,
#   EPH 60,393,898.254155263, REF = 1 (Kerbin)
#   -> pe radius 699,928 m / ap radius 6,641,092 m (i.e. the 99,928 x 6,041,092 m
#      ALTITUDE park B29's flight ledger records), and with mu_Kerbin = 3.5316e12
#      P_obs = 2*pi*sqrt(a^3/mu) = **23,510.3 s**, `2a` = **7,341,019.5 m** = **24.5x**
#      the 300,000 m `WatchEnterCutoffMeters`.
#
# **THE BOUNDARY IS `WatchEnterCutoffMeters = 300,000 m`** - `WatchModeController.cs:71`,
# reached via `ParsekTestCommandAddon.EnterWatchMode.cs:140` ->
# `WatchModeController.cs:712` -> `IsWithinWatchEntryRange`, whose body is
# `distanceMeters < WatchEnterCutoffMeters` (`WatchModeController.Diagnostics.cs:38-42`).
