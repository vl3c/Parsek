# ---------------------------------------------------------------------------------
# 1. THE MEASUREMENT - "KERBIN AS A DESTINATION", and the two-stage relay that got there
# ---------------------------------------------------------------------------------
# Every loop subject the suite has ever had DEPARTS Kerbin or hops between moons.
# V19M/V19T read the moon-to-parent inversion (Laythe -> Jool). **THIS SUBJECT IS THE
# CLASS NO COMMITTED RECORDING HAS EVER PRESENTED: an INBOUND interplanetary arrival, a
# Jool-rooted recording whose target is KERBIN.** B29 closed the planet-to-Kerbin half of
# G2 on 2026-08-27; this pair is where the RENDER of that arrival is read.
#
# AND THE FLIGHT PROFILE IS ITSELF NEW. B29 flight 3 flew a **TWO-STAGE PARENT RELAY**,
# not a plain interplanetary transfer:
#   stage 1  escape node    ut 31,552,118.5   272.36 m/s  (mlib-derived 272.38 - 2 cm/s)
#   stage 2  Sun-frame Hohmann node
#                           ut 37,099,270.5  1,455.20 m/s
#   corrections             1.97 + 21.00 m/s
#   capture                -1,350.10 m/s     -> Kerbin park 99,928 x 6,041,092 m,
#                                               ecc 0.809, inc 16.44 deg
# **THAT PROFILE IS WHAT MAKES THE ROUTING READING WORTH TAKING**, because it puts a REAL
# heliocentric coast between the escape and the transfer burn - a shape the re-aim
# classifier has a specific, never-yet-exercised opinion about (section 2, R2).
#
# **THIS LANE GATES ON NONE OF THE ROUTING OUTCOMES.** Section 2 is where that promise is
# kept, for the fourth time in the program (B26 -> B28 -> V19 -> here).
#
# ---------------------------------------------------------------------------------
# 2. THE FOUR PRE-REGISTERED ROADS, with the exact discriminating lines
# ---------------------------------------------------------------------------------
# The line SHAPES below are the ones V19M's own run printed; only the bodies, the tree id
# and the numbers are re-derived. Every one of them is a code-read PREDICTION and NOT a
# measurement - this lane has never flown.
#
# **R1 - PHASE-LOCK ENGAGES.** The lines that would say so:
#     `PhaseLock APPLIED: mission=` ... `method=single-orbital`
#     `Orbital(Kerbin) same-parent P=`
#   CODE READING SAYS NO, and the walk is short. `MissionPeriodicity` builds one Orbital
#   constraint per NON-launch body that has orbit segments (`MissionPeriodicity.cs:460-500`).
#   launchBody = `segs[0].bodyName` = **Jool**. The other bodied segments are Sun and
#   Kerbin. The Sun's own `bodyInfo.OrbitPeriod("Sun")` is degenerate, so rule 4 `continue`s
#   past it without emitting anything; Kerbin emits, with
#   `crossParent = !IsSameParentTarget("Kerbin", "Jool")` = TRUE, because
#   `ReferenceBodyName("Kerbin")` is `"Sun"`, not `"Jool"`. The first cross-parent
#   constraint flips `result.Support` to `UnsupportedCrossParent` and writes
#   `MissionPeriodicity.cs:497-499`'s reason verbatim. SO THE PREDICTED LINE IS:
#     `PhaseLock SKIPPED: mission='Duna Rocket' tree=6c0002fea2134f688e2c3e9252026543
#      support=UnsupportedCrossParent keeping anchor=<A>`
#     `ExtractConstraints: ... launchBody=Jool ut0=27787321.139510822
#      support=UnsupportedCrossParent constraints=1
#      [Orbital(Kerbin) cross-parent P=9203544.6 off=32578749.191816326]
#      why=orbital target 'Kerbin' is not a direct child of launch body 'Jool'
#      (synodic, Phase 4)`
#   `off=` is the earliest Kerbin orbit start minus ut0 = 60,366,070.331327148 -
#   27,787,321.139510822 = **32,578,749.191816326**, which is section 3's seam offset to
#   the digit - so the product's own echo is an independent check on the jump table's base.
#   **AND ONE READING THAT IS THE OPPOSITE OF V19M's, WORTH A SENTENCE.** V19M measured
#   `P=104661432.1079886` there - Jool's own SOLAR period, the physically WRONG recurrence
#   for Laythe/Jool relative geometry. Here `P` is KERBIN's solar period (9,203,544.6 s),
#   which IS the physically right recurrence for Jool/Kerbin geometry. It still FAILS
#   CLOSED at `UnsupportedCrossParent` and nothing downstream consumes it. Recorded as a
#   pre-registered reading, NOT as a claim and NOT gated.
#   AN INSPECTION RANKS A QUEUE, IT DOES NOT CLOSE IT - V17M's guard walk was right at
#   every step it modelled and still missed the step that decided the answer.
#
# **R2 - RE-AIM ENGAGES.** The lines that would say so:
#     `[ReaimDiag] ... supported=True`
#     `MissionLoopUnit: mission='...' ENGAGED re-aim Jool->Kerbin via ...`
#     `factory chain rec=... reaimed=True` - GREP `reaimed=` ALONE, NOT a longer quoted
#     run: `MapRender/PhaseFactory.cs:118` formats the line as
#     `... reaimed={4} window=[{5:F1},{6:F1}] faithfulFallback={7}`, so `window=[...]`
#     sits BETWEEN them and a literal `reaimed=False faithfulFallback=False` matches
#     nothing - which reads like "no factory chain line at all", i.e. the R4
#     discriminator.
#   **THIS IS THE DEEPEST ANY COMMITTED SUBJECT HAS EVER REACHED INTO
#   `ReaimClassifier.Classify`, AND THE WALK IS DERIVED HERE STEP BY STEP** because the
#   answer turns on a gate no prior V lane got near.
#     launchBody = Jool; `launchAncestors` (strict) = {Sun}.
#     helioIdx  -> the FIRST Sun segment, seg#5. commonAncestor = **Sun**.
#       (V19M's subject declined ONE step earlier than this on the arrival scan; the
#        MissingHeliocentricLeg decline every OTHER V lane printed cannot fire here
#        either, because seg#5 is a real recorded Sun leg.)
#     parkingIdx -> the last Jool segment before it, seg#4.
#     arrivalIdx -> the first post-helio segment whose body is neither Sun nor Jool =
#       seg#14, so targetBody = **Kerbin**. **THE ARRIVAL SCAN SUCCEEDS**, which is the
#       door V19M's two-body subject could not open.
#     direct-child guard: `ReferenceBodyName("Kerbin")` == `"Sun"` == commonAncestor. PASS.
#     cross-parent guard: LCA(Jool, Kerbin) = Sun, `launchToAnc` = [Jool], count 1. PASS.
#     multi-hop guard: no Sun-bodied segment after seg#14 (segs 15-17 are Kerbin). PASS.
#     TRANSFER RUN: `lastCoastIdx` is the Sun segment whose `endUT` is within
#       `SoiBoundaryEps = 1.0` s of `arrival.startUT` = 60,366,070.331327148 -> **seg#13**,
#       `firstA` = 40,758,641,877.765167 m. Walking back, every one of seg#12..seg#6 is Sun
#       with `aRel` = |a - firstA| / firstA of **0.004903** (segs 10-12) or **0.004954**
#       (segs 6-9), both far under `DefaultAStepRelThreshold = 0.05`, and every UT gap in
#       the chain is under `BurnChainTolerance = 3600` s (the largest is 36.744 s). At
#       seg#5 the step is `aRel` = |59,637,623,773.378 - 40,758,641,877.765| /
#       40,758,641,877.765 = **0.463190** -> BREAK. So **transferStartIdx = 6**,
#       `RecordedDepartureUT` = 37,099,419.332197808.
#     >1-revolution guard: `tRep` = 2*pi*sqrt(firstA^3 / mu_Sun) with
#       mu_Sun = 1.1723328e18 gives **47,751,164.483 s**; the run spans
#       60,366,070.331 - 37,099,419.332 = **23,266,651.0 s = 0.487 rev**, well under
#       1.5*tRep = 71,626,746.7. PASS.
#     **AND THEN IT HITS THE PARTIAL-TRANSFER DEPARTURE GATE, WHICH IS WHERE THE
#     TWO-STAGE RELAY SHOWS UP IN THE CLASSIFIER.** `segs[transferStartIdx - 1]` = seg#5
#     is a Sun segment, so `sunPredecessor` is TRUE, and re-aim declines UNLESS
#     `IsHeliocentricParkingDeparture` admits it. **IT DOES NOT, ON THREE INDEPENDENT
#     COUNTS, ANY ONE OF WHICH ALONE REFUSES:**
#       (a) THE FIRST GATE, AND THE ONE THAT ACTUALLY FIRES. The exception needs a CLOSED
#           park run - `ReaimLoiterCompressor.DetectRuns` only emits a run that traverses
#           at least ONE whole revolution. seg#5's period is
#           2*pi*sqrt(5.9637623773e10^3 / mu_Sun) = **84,515,216.19 s** and it spans
#           37,098,556.092 - 36,198,519.426 = **900,036.666 s = 0.010649 rev**. No run
#           ends at `lastPark.endUT`, `found` stays false, and the method returns false
#           with the code's own words: "the Sun predecessor is a sub-period (< 1 rev) MCC
#           arc, not a closed park".
#       (b) ecc: seg#5's **0.16402257** exceeds `ParkDepartureEccMax = 0.1`.
#       (c) co-orbital sma: seg#5's 59,637,623,773.378 m against Jool's own heliocentric
#           sma 68,773,560,320 m is **13.28% off**, over `ParkDepartureSmaRelTolerance = 0.1`.
#     PREDICTED DECLINE STRING, and **NO COMMITTED LANE HAS EVER PRINTED IT**:
#         `transfer departs from a heliocentric parking orbit or mid-course correction
#          (deferred); staying faithful`
#     which reaches `MissionLoopUnitBuilder.cs:1322` as
#         `MissionLoopUnit: mission='Duna Rocket' not re-aim (no member yields a re-aim
#          transfer); faithful`
#     (the unit-level line quotes the AGGREGATE reason, not the per-member one; the
#     per-member string above appears on the `[ReaimDiag]` lines).
#   **THE PROMPT THIS LANE WAS AUTHORED FROM PREDICTED A DIFFERENT GATE AND THE
#   CORRECTION IS RECORDED RATHER THAN SILENTLY APPLIED.** It expected the decline to
#   land on a `wholeRevs >= 1` conjunct measured against the recording's JOOL PARK. The
#   Jool-park arithmetic is real - sma 590,325,784.58933163 m with
#   mu_Jool = 2.82528e14 gives P = **5,361,505.4315 s**, and the park runs
#   27,787,321.159510821 -> the 31,552,093.380398802 escape-burn section start =
#   **3,764,772.221 s = 0.702186 rev** (0.702190 rev measured to the 31,552,118.5 node) -
#   but **IT IS NOT A GATE THE CLASSIFIER APPLIES.** Every `wholeRevs` test in
#   `IsHeliocentricParkingDeparture` is scoped to COMMON-ANCESTOR (Sun) runs; the
#   launch-body park is only `segs[parkingIdx]` and the code says so in as many words
#   ("A launch-body loiter cut is the existing validated L2 trim and is NOT gated here").
#   The 0.702-rev number is kept here because it is a true property of the subject a
#   reader will want, NOT because anything downstream reads it.
#   **AND THE HONEST HEDGE: R2 IS PRE-REGISTERED IN BOTH DIRECTIONS.** The walk above is
#   an inspection over one code path; if `supported=True` prints, the reading is that one
#   of the three refusals above does not hold at runtime (most plausibly (a), if
#   `DetectRuns` merges seg#5 into a longer Sun run than this walk models), and THAT is
#   the finding. Nothing below requires or forbids any re-aim token.
#
# **R3 - PLAIN FAITHFUL FIXED CADENCE**, the code-read prediction and the road section 3's
#   clock is built on. The lines:
#     `PhaseLock SKIPPED: mission='...' ... support=UnsupportedCrossParent keeping anchor=`
#     `[ReaimDiag] ... supported=False reason='transfer departs from a heliocentric
#      parking orbit or mid-course correction (deferred); staying faithful'`
#     `MissionLoopUnit: mission='...' not re-aim (...); faithful`
#     `factory chain rec=6d171d14ef474fbf95c69ada863bda12 ... reaimed=False`
#
# **R4 - A DEGENERATE PATH.** DISCRIMINATOR: any `[Parsek][ERROR]` (forbidden below, so it
#   reds), or a decline reason not in the lists above.
#
# **THE SHARPEST SINGLE DISCRIMINATOR IS `factory chain ... reaimed=True|False`**: one
# token, one line, and it is the RENDER-side truth rather than a planner intention. Read
# it first; read `[ReaimDiag]` for why.
#
# **POSTURE ON THE TRIO, AND IT IS V19M's FOR V19M's REASON.** `[ReaimDiag]`,
# `ENGAGED re-aim` and `FORCED FAITHFUL` are left OUT of BOTH `required` and `forbidden`.
# V14M/V15M/V16M FORBID them because on a same-parent subject re-aim is structurally
# unreachable. HERE RE-AIM IS ONE OF THE THINGS THAT MIGHT LEGITIMATELY HAPPEN - this is
# the first subject to satisfy the arrival scan at all - so forbidding those tokens would
# red the interesting outcome and requiring them would gate the reading on a prediction.
#
# ---------------------------------------------------------------------------------
# 3. THE SCHEDULE - THE LOOP CLOCK, DERIVED FROM THE SOURCE, WITH ONE SEEDED NUMBER
# ---------------------------------------------------------------------------------
# **THE SPAN IS THE TRACK_SECTION ENVELOPE, NOT THE POINT SPAN. THIS IS THE SPAN-END TRAP
# AND IT IS DERIVED FRESH HERE RATHER THAN INHERITED** (V17M measured it at 0.020 / 1.060 s
# on its subject, V19M at 0.020 / 1.360 s on its own; the deltas are a property of the
# SURFACE, so they must be re-measured per subject, never copied):
#   POINT span   27,787,321.159510821 -> 60,393,894.394154631  = 32,606,573.234643809 s
#   SECTION env  **27,787,321.139510822 -> 60,393,896.914155044** = **32,606,575.774644222 s**
#   ut0 sits **0.020000000 s BEFORE** the first POINT (section #0's startUT)
#   spanEnd sits **2.520000413 s PAST** the last POINT (section #41's endUT)
#   the span is **2.540000413 s longer** than the POINT-derived one
# Anything sized against the POINT span is short by 2.520 s at the tail end - which is
# 1.7% of the tail read's own 145.563 s margin below, so it MATTERS here.
# **EVERY OFFSET IN THIS FILE IS MEASURED FROM ut0 = 27,787,321.139510822.**
#
# THE CLOCK, every term named at its source:
#   cadence        = LoopTimeUnit.Auto -> max(spanDur, LoopTiming.MinCycleDuration = 5.0)
#                  = spanDur = **32,606,575.774644222 s**  (MissionLoopUnitBuilder.cs:260)
#   rawOverlapPeriod = ParsekSettings.autoLoopIntervalSeconds default
#                  = LoopTiming.DefaultLoopIntervalSeconds = **30.0 s** (ParsekConfig.cs:277)
#   overlapCadence = GhostPlaybackLogic.ComputeEffectiveLaunchCadence(30.0, spanDur, 20)
#                  = max(30.0, spanDur / MaxOverlapMissionInstances)
#                  = spanDur / 20 = **1,630,328.788732211 s**
#                    (MissionLoopUnitBuilder.cs:271 ->
#                     GhostPlaybackLogic.WarpLoopPolicy.cs:469-489, cap constant
#                     ParsekConfig.cs:168 `MaxOverlapMissionInstances = 20`)
# **THE CAP DOMINATES BY A FACTOR OF 54,344**, so the loop SELF-OVERLAPS: twenty
# concurrent instances of a 32,606,575.8 s (3.54 Kerbin-year) mission, launched
# 1,630,328.8 s apart. "Cycle N" is the Nth relaunch, not the Nth replay-then-wait.
# **THIS IS BY FAR THE LONGEST-SPAN LOOP SUBJECT THE PROGRAM HAS EVER CARRIED** - 2,719x
# V19M's 11,991.8 s span - and section 5 is where that changes what the anti-vacuity pin
# is worth.
#
# **AND BECAUSE `overlapCadence` IS EXACTLY `span/20`, INSTANCE 21 IS EXACTLY ONE SPAN
# AFTER INSTANCE 1**, so "cycle 2 = cycle 1 + one full cycle" and "cycle 2 = a real
# relaunch epoch the machine launches at" are THE SAME EPOCH. V17M's identity, third
# subject. Verify it on the run: the two `relaunchUt=` echoes must differ by
# 32,606,575.774644 s.
#
# **THE ANCHOR IS THE ONE SEEDED NUMBER IN THIS FILE, AND IT IS NOT A BYTE FACT.** With
# phase-lock skipped the anchor is "the UT the loop was enabled at". The save restores UT
# **60,393,898.254155263** and a handful of seam verbs run at 1x before `MissionConfig`,
# so the seed is
#   **anchorUT ~ 60,393,900   (+/- 3 s)**   i.e. saveUT + 1.746 s
# V19M's run landed 0.194 s past its own seed and V19T's 0.086 s below, on the SAME
# fixture and 0.280 s apart from each other - a seeded anchor is a PER-RUN quantity, not
# a fixture constant, and the +/- 3 s window is sized for that spread with ~10x margin.
#
# THE RE-PIN RECIPE (V2-sense). Read `anchorUt=` / `phaseAnchorUt=` off
# `missionconfig applied:` and each cycle's `relaunchUt=` off `startloopplayback
# initiated:`. Every offset below is relative to the anchor, so ONE substitution re-pins
# all ten jumps; if the two `relaunchUt=` echoes do NOT differ by 32,606,575.774644 the
# road is not R3 and the whole table is re-derived from the printed cadence.
#
# THE OFFSETS FROM ut0, which is what the jump arithmetic is measured against:
#   Jool->Sun seam (seg#4/seg#5)         8,411,198.286443729  (36,198,519.425954551)
#   **Sun->Kerbin seam (seg#13/seg#14)  32,578,749.191816326** (60,366,070.331327148)
#   seg#16 start (arrival coast)        32,578,785.877363268  (60,366,107.016874090)
#   seg#16 end                          32,605,587.099550907  (60,392,908.239061728)
#   seg#17 end = SEGMENT-LESS TAIL START
#                                       **32,606,184.074580017** (60,393,505.214090839)
#   capture-burn start                  32,606,189.954580981  (60,393,511.094091803)
#   capture-burn end                    32,606,396.254614796  (60,393,717.394125618)
#   last POINT                          32,606,573.254643809  (60,393,894.394154631)
#   spanDur (unit span end)             32,606,575.774644222  (60,393,896.914155044)
# **THE SEGMENT-LESS TAIL STARTS AT 32,606,184.075, i.e. AT THE LAST ORBIT SOURCE'S END**,
# which is the definition V19T used and which the V19 pair had to reconcile after
# shipping two different ones. Both halves of THIS pair use it from the start.
#
# THE JUMP TABLE (whole seconds, the V14M/V15M/V16M/V17M/V19M convention), with
# A = 60,393,900 (SEEDED), overlapCadence 1,630,328.788732211, seam offset
# 32,578,749.191816:
#
#   cycle-1 relaunch  R1 = A + 1*overlapCadence = **62,024,228.788732**
#     seam        R1 + 32,578,749.192 = 94,602,977.981
#       bracket -180 / -60 / +140 -> **94602798 / 94602918 / 94603118**
#       (rounded, the true offsets are -179.981 / -59.981 / +140.019)
#       WHAT EACH DWELL READS: at -180 and -60 the instance-1 ghost replays recorded UT
#       60,365,890.351 and 60,366,010.351 - both inside seg#13, the SUN-framed final
#       transfer coast, so an orbit source exists. At +140 it replays 60,366,210.351 -
#       inside seg#16, the KERBIN-framed approach hyperbola. **THE BRACKET STRADDLES
#       EXACTLY ONE FRAME TRANSITION** and the +140 leg is the one the anti-vacuity pin
#       can be satisfied on. The narrowest gap in the bracket is 120 s against an anchor
#       window of +/- 3 s - 40x.
#     coast dwell R1 + 32,597,547.211 -> **94621776**
#       DERIVED: the replayed seg#16 for instance 1 is [94,603,014.666, 94,629,815.888]
#       and this jump sits **70.0018%** through it, **8,039.888 s** clear of its far end
#       and **8,636.863 s** short of the replayed segment-less tail onset. This is where
#       the forty-tick block runs - section 4.
#     tail read   R1 + 32,606,430.211 -> **94630659**
#       DERIVED: replays recorded UT 60,393,751.351 = **246.137 s past the segment-less
#       tail start**, **33.957 s past the capture burn's 60,393,717.394 cut**, **143.043 s
#       short of the last POINT** and **145.563 s short of the unit span end** - so the
#       ghost is on the FINAL captured park rather than the approach hyperbola, which is
#       the property section 7 needs. Instance 1 still has 145.563 s of span left.
