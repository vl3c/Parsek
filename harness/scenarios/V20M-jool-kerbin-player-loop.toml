# ---------------------------------------------------------------------------------
# 5A. THE RE-PINNED ANTI-VACUITY TOKEN, and why it is a DEMOTION stated as one
# ---------------------------------------------------------------------------------
# Criterion (a) asks a spec to NAME its lens and argue it FOR ITS SUBJECT. Section 5's
# argument about WHICH lens (proto orbit line, not a nested-SOI root-frame fallback) is
# unchanged and was correct - the failure was not a wrong lens choice, it is that the
# lens has nothing destination-framed to report on this subject under this instrument.
# So the replacement is chosen on REACHABILITY MEASURED IN RUN 1's OWN LOG, and it is
# honestly a WEAKER claim than the one it replaces:
#
#     OrbitReseed\] TryFromHistoricalLatLonAltAndRecordedVelocityWithEpoch: body=Kerbin
#
# WHAT IT IS. `OrbitSeedResolver.TryDeriveTailOrbitSeed(traj, body, currentUT,
# TailSeedUse.MapPresence, ...)` resolves the ENDPOINT-TAIL orbit for a ghost proto from
# the RECORDING's own latest coast frame in the recording's endpoint body's frame
# (`OrbitSeedResolver.cs:57-170`), and on the MapPresence branch it goes through
# `OrbitReseed.TryFromHistoricalLatLonAltAndRecordedVelocity` -> the `WithEpoch` overload
# that emits this line (`OrbitReseed.cs:405-417`). Both call sites are in
# `GhostMapPresence.cs` (`:4673` terminal-map-presence, `:10594` the proto orbit-seed
# diagnostics), i.e. it is GHOST-PROTO machinery and nothing else reaches it.
# WHY IT IS KERBIN-SPECIFIC AND NOT A COINCIDENCE. `body` is
# `FindBodyByName(preferredEndpointBody)` where `preferredEndpointBody` comes from
# `RecordingEndpointResolver.TryGetPreferredEndpointBodyName(traj)` - THE RECORDING's
# endpoint body, which is Kerbin because this is the corpus's first Kerbin arrival. A
# subject arriving anywhere else prints a different body. The MEASURED line, 41 times,
# once per ghost-proto creation:
#     `[Parsek][VERBOSE][OrbitReseed]
#      TryFromHistoricalLatLonAltAndRecordedVelocityWithEpoch: body=Kerbin
#      recordedUT=60393894.39 epochUT=60393894.39 loopShift=0.00 lat=16.0272
#      lon=142.4314 inertialLon=79.6672 alt=351462.0 |vel|=2541.92`
# and `recordedUT=60393894.39` IS this recording's `explicitEndUT` / last POINT
# (60,393,894.394154631) read back out of the bytes - so the line is doubly
# subject-specific even though the token does not pin that number.
# IT IS NOT RATE-LIMITED: the emitter is `ParsekLog.Verbose`, not
# `VerboseRateLimited`, so there is no key to collide with and no suppression window to
# lose it in. `verboseLogging` is armed by this lane's own settings block.
# **AND THE LIVE VESSEL CANNOT SATISFY IT.** The produced save's own craft is parked at
# Kerbin, so a bare `body=Kerbin` would be ambiguous - which is why the token carries the
# `[OrbitReseed]` subsystem tag and the method name. Nothing but the ghost-map endpoint
# seed reaches that emitter.
#
# **THE DEMOTION, STATED PLAINLY BECAUSE IT IS THE HONEST PART.** The refuted pin was a
# RENDERED-FRAME claim: "a ghost's proto orbit line was actually drawn on a Kerbin-framed
# conic". The replacement is a SEED-SIDE claim: "the destination-frame arrival orbit was
# resolved from the recording's own Kerbin-frame bytes while ghost protos were being
# built". That is strictly weaker, it is NOT what roadmap G2's bar asks for, and **THE
# RENDERED-FRAME KERBIN CLAIM REMAINS OWED** - by V20K, or by whatever future run can
# reach live-frame protos on a long-pitch subject (section 9). Writing the replacement
# down as an equal is the failure this paragraph exists to prevent.
#
# TWO MORE TOKENS ARE ADDED WITH IT, both measured in run 1, and each does a job the
# seed token cannot:
#   * `GhostMap\] Created ghost vessel .*orbitSource=overlap-instance-segment` - the
#     ANTI-EMPTINESS FLOOR. 41 in run 1. An empty map with no ghosts cannot green it, so
#     it keeps the lane from passing on a scene that materialized nothing. Road- and
#     body-independent by design; it is a floor, not a destination claim.
#   * `ShouldPopulateTerminalOrbitFromLastSegment: .*explicit endpoint body=Kerbin` - the
#     LOAD-TIME STRUCTURAL PREMISE, measured once at LoadGame:
#     `preserved cached terminal orbit for '6d171d14ef474fbf95c69ada863bda12' because
#     explicit endpoint body=Kerbin keeps cached orbit authoritative over later segment
#     body=Kerbin sma=-392274.9`. It guards that the recording's KERBIN endpoint survives
#     the load and that its cached terminal orbit stays authoritative over the hyperbolic
#     approach segment - the premise everything downstream in this file rests on. It is a
#     LOAD-TIME token and is labelled as one; it says nothing about any render.
#
# **AND ON THIS SUBJECT THE SELF-OVERLAP CAVEAT INVERTS - THE PIN IS THE HARDEST IN THE
# PROGRAM TO SATISFY RATHER THAN THE EASIEST.** V19M had to argue AGAINST vacuity because
# roughly half of its twenty instances were destination-framed at any Jool-side epoch
# (measured Jool 44 / Laythe 41). Here the Kerbin window is **27,826.583 s** of a
# **32,606,575.8 s** span - **0.0853%** - against a **1,630,328.8 s** launch pitch that is
# 58.6x wider than the window, so AT MOST ONE instance can ever be Kerbin-framed. The
# derived census at every one of the ten observation epochs is:
#     **Kerbin 1 / Sun 14 / Jool-escape 3 / Jool-park 2**
# ONE ghost out of twenty carries the pin, and it is the OLDEST live instance. That is a
# far more falsifiable claim than V19M's - and it is also FRAGILE in a way V19M's was
# not: a jump that lands 30,000 s off (0.09% of the span) puts zero instances in the
# Kerbin frame and the pin goes unmet with no other error.
# **RE-DERIVED AT ROUND 4, BECAUSE THE REORDER CHANGED THIS COUNT.** The pre-round-4 text
# said 'three of the five cycle-1 epochs put instance 1 on the Kerbin side, so the pin has
# three independent chances per cycle and six across the run'. With the cycle-1 seam
# bracket traded away the epochs are: cycle 1 the COAST and the TAIL (both Kerbin-side for
# instance 1), cycle 2 the three seam legs of which only `+140` is Kerbin-side, plus its
# coast and tail - so **2 + 3 = FIVE Kerbin-side epochs across the run** rather than six.
# **BUT THE COUNT OF EPOCHS IS NO LONGER THE OPERATIVE QUANTITY, AND THAT IS THE ROUND-4
# LESSON**: runs 1 and 2 had six Kerbin-side epochs and rendered nothing Kerbin-framed,
# because what decides a proto's frame is the ONE epoch it was CREATED at. The reorder
# buys a single Kerbin-framed CREATION, which is worth more than any number of later
# Kerbin-side observation epochs.
