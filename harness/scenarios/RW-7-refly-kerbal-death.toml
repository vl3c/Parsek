schema = 1
id = "RW-7-refly-kerbal-death"
# =====================================================================================
# RW-7: A KERBAL DEATH IN A RE-FLY, DISCARDED THEN MERGED (the rewind ledger campaign, plan
# row 5: a kerbal dies in a Re-Fly attempt; the attempt is discarded once and merged once).
#
# THE RULINGS UNDER TEST: Re-Fly is losses-only and a merge must dominate (design
# docs/parsek-rewind-to-separation-design.md section 2.12, Rules 2 and 3); DISCARD RESTORES THE
# LEDGER TO JUST BEFORE THE RE-FLY STARTED (Rule 3); a MERGED loss follows the vessel that
# caused it, and Rule 2's loss swap decides which ReputationPenalty rows count. Here the
# replaced flight (G's pod slot) holds NO loss, the re-fly's crash files one ReputationPenalty
# (KerbalDeath) row, so L'(A) reads a lower reputation than L and the check takes VARIANT B
# (ReFlyMergeDominance.Evaluate, ReFlyMergeDominance.cs:244-256: `if (repA.Failed)` ->
# `v.Variant = LossSwapVariant.B`): the replaced flight's ReputationPenalty loss rows (none)
# are kept and the re-fly's OWN ReputationPenalty loss rows are tombstoned by the merge
# (SupersedeCommit.CommitTombstones, SupersedeCommit.cs:2580-2600, logged `Loss swap variant B
# applied ... tombstonedAttemptRepLoss=N` :2652 and `Tombstoned N career actions (...
# Reputation=N, Kerbal=0 ...)` :2663). The death row itself (KerbalAssignment Dead) is NOT a
# loss row of that rule and stays: the death follows the re-fly.
#
# THE KERBAL: the pod carries a GENERATED STAND-IN, not Jeb. H (the committed Jumping Flea)
# reserves Jebediah, so G's VAB manifest swaps him (RW-6's flight 2026-10-28_1214: `Stand-in
# generated: 'Isarigh Kerman' (Pilot) for slot 'Jebediah Kerman' depth 0`, KerbalsModule.cs:3981;
# `Swapped reserved 'Jebediah Kerman' -> stand-in '...' in part 'Mk1 Command Pod' seat 0`,
# Patches/CrewAutoAssignPatch.cs:253). The ledger files a stand-in-flown pod's crew under the
# slot owner (KerbalsModule.ReverseMapCrewNames, the #254 reverse map; RW-6's produced ledger
# carries `kerbalName = Jebediah Kerman` for G's and the merged attempt's KerbalAssignment
# rows), so the merged death is predicted to read as Jebediah's in the walk: the name is
# regexed and owed off the first flight.
#
# THE RESPAWN: cs-career-mun4 has `MissingCrewsRespawn = True` and `RespawnTimer = 7200`
# (persistent.sfs:86-87). Stock's crew death calls Die() and then StartRespawnPeriod()
# (Missing until death + RespawnTimer, then Available; KerbalsModule.cs:2738-2743), and Parsek
# stamps that policy on the recording at the death (`Crew death respawn policy stamped:
# recording='<rec>' (CS Flea Probe) deadCrew=1 respawn=True timer=7200`, KerbalsModule.cs:2812)
# and holds the kerbal as MISSING, not dead for good: `Death hold: '<name>' recording '<rec>'
# respawn scheduled deathUT=<d> respawnUT=<d+7200> timer=7200 (stock crew respawn was on at the
# death)` (:1698, reason :2847), never `is permanent` (:1696). The respawn is reachable inside
# the lane's budget (7200 game seconds is a ~75 s Space Center warp at x100), so the lane warps
# past it and requires `Reservation released: '<name>' ... (respawn applied: the clock has
# reached the recorded death's stock respawn instant - the kerbal is available again)` (:2198 /
# :2206). The open-ended co-row rule (KerbalsModule.ResolveOpenEndedRespawnDeaths, :682) would
# turn the death permanent if an un-closed Aboard / Unknown row of the same kerbal started
# before the respawn; RW-6's flight shows every such Jebediah row bounded (H's at 185807.9, G's
# TIP at 185797.0, the fixture's by split handoff), so it is forbidden.
#
# THE SHAPE: RW-6's prefix verbatim (H, the Jumping Flea recorded on the pad, committed,
# recovered; F, the survey contract f1fb89dc accepted, +37500; a Rewind-to-Launch to H; G, the
# CS Flea Probe recorded on the pad, its stand decoupled into a second controllable vessel so
# the split authors a rewind point, committed in flight and its pod slot stashed).
#   Each attempt: InvokeRewind slot 0, the flight-ready wait, `PartAction button=activate
#     part=solidBooster.sm.v2` (the RT-5 Flea's ModuleEngines "Activate Engine": it lights the
#     SRB WITHOUT staging, so the Mk16 chute, alone in stage 0, is never deployed), then a 1x
#     WarpToUT to 185930: the unchuted Mk1 pod (crashTolerance 14 m/s) comes back down and is
#     destroyed with its kerbal. CL-2 measured the same hop (the stock Jumping Flea, full SRB,
#     no chute) igniting at UT ~11 and impacting at 119.7-120.9, ~109 s; the re-fly lights at
#     ~185787.5, so the impact is predicted at ~185897 and 185930 leaves ~33 s of margin.
#   Attempt 1: Discard through the Esc menu (ReFlyRevert discard target=launch, RW-6's
#     measured route; the verb's resume wait reaches the 30 s settle budget when the crash
#     already stashed the tree, TestCommandReFlyRevert.cs:316-324, then drives the menu).
#   Back into FLIGHT: RW-6's re-entry, a mid-session LoadGame with no scene arg of the step
#     save written at the Space Center right after the discard (an InSession load).
#   Attempt 2: the same flight and crash, then AnswerMergeDialog merge (the post-crash
#     conclusion: the verb waits the same 30 s settle, then drives the Space Center exit and
#     answers the Re-Fly merge dialog). The clock is still under 186000 there (pinned on the
#     merged mark), so H's recovery and F's accept are still ahead and the pools must equal
#     the pre-invoke ones.
#   Close: WarpToUT 186100 at the Space Center across the committed rows, WarpToUT 193300
#     past the respawn, an unrecorded check Flea, the default-slot save and LedgerGroundTruth.
#
# THE GATES:
#   - attempt 1's death happens (`Active vessel destroyed in tree mode`, `PopulateCrewEndStates:
#     ... dead=1`, the respawn policy stamped) and is GONE after the Discard: no `Death hold:`
#     line before the merged attempt's crash, never a death hold or a KerbalDeath rep penalty
#     naming the discarded attempt's recording, no tombstone, and the walk's pools and ledger
#     row count equal those just before the first invoke (RW-6's backreferences, pre-invoke
#     150632.18 / 20.17 / 115.00);
#   - the stand-in is not dead after the Discard: the Discard Re-fly loads the rewind point's
#     game, whose roster holds the stand-in alive in the pod, and attempt 2's SRB reads
#     `engine:ignited=0` again (the attempt left nothing in the world);
#   - the merge: dominance pass, `Loss swap ... variant=B repLossOld=0`, the split, supersede
#     rows, `Loss swap variant B applied ... keptReplacedRepLoss=0 tombstonedAttemptRepLoss=N`
#     with `Tombstoned N career actions (... Reputation=N, Kerbal=0 ...)`, End reason=merged once;
#   - the death follows the re-fly: the merged provisional is the recording whose crew died,
#     `KerbalDeath rep penalty: ... -> ReputationPenalty(KerbalDeath) candidate`, the death
#     hold on that recording is `respawn scheduled ... timer=7200`, `respawnPending>=1` until
#     the respawn, and the reputation the walk reads after the merge is the pre-invoke 115.00
#     (the penalty tombstoned, variant B);
#   - the respawn: `Reservation released: ... (respawn applied: ...)` once the clock passes it.
#
# DEPARTURES FROM THE PLAN (each following the code):
#   - DROPPED: "the merge is refused if a later committed row uses the dead kerbal". The pod
#     carries a generated stand-in; the later committed rows (H's KerbalAssignment, start
#     185800.3) name Jebediah, and the world clause (ReFlyMergeDominance.TryFindWorldConflict,
#     ReFlyMergeDominance.cs:616-658) compares KerbalAssignment names and skips a use that
#     starts before the death (`start < deadFrom`): even with the death filed under Jebediah's
#     slot, H's row starts ~100 s before the crash. No committed row after the crash uses either
#     name, so the refusal half has no reachable shape on this host; this lane forbids
#     `result=refuse` instead.
#   - Attempt 1's discard runs after the crash, so ReFlyRevert reaches the Esc menu through
#     its settle budget instead of the active-tree wait (above). `AnswerMergeDialog choice=
#     discard` would conclude the same session without reloading the rewind point (clock and
#     roster left post-crash), so it is not used.
#   - The stock roster's Missing reading of the stand-in (Missing after the merged crash,
#     Available after the respawn) has no Parsek log literal: stock's status changes of a
#     managed stand-in are suppressed to a rate-limited Verbose line
#     (GameStateRecorder.Handlers.cs:1088), so it is read from the step saves (ROSTER
#     `state =` in rw07-06 / rw07-08), owed off the first flight; the gated reading is Parsek's
#     own respawn-scheduled hold and its release.
#   - `outcome=unbound-refly-provisional` is NOT forbidden (by design, CLAUDE.md
#     ReFlyProvisionalBinding); `Single-controllable split: no RP` is forbidden only before the
#     first invoke (the crash breakup prints it with controllable=0, as RF-12W's flight did).
#
# LITERALS (Source/Parsek/..., verified 2026-10-28 by grep in this worktree):
#   launchfromeditor complete scene=FLIGHT    TestCommands/TestCommandEditorRoute.cs:517
#   Game state: FundsChanged                  GameStateRecorder.cs:948 (arrow non-ASCII)
#   MISSIONMARK label=                        TestCommands/TestCommandMissionMark.cs:22
#   kscaction ... applied=true manifestKind=  TestCommands/TestCommandKscAction.cs:501
