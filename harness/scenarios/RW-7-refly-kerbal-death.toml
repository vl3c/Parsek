#
# PRE-REGISTERED READINGS (check these first if the first flight reds):
#   - `partaction rejected reason=partaction-event-unavailable` on the activate press: the
#     engine's Activate was not live (stock leaves it inactive after a PRELAUNCH OnStart and
#     re-arms it in ThrustUpdate on the first non-warped FixedUpdate; decompiled
#     ModuleEngines.cs:3949 / :3737); read the press's `engineModules=` / `candidates=`.
#   - `partaction-engine-not-found`: the part name is not `solidBooster.sm.v2` at runtime.
#   - no `Active vessel destroyed in tree mode` before the crashed mark: the hop outlasted
#     185930 (raise the warp target; keep the merged mark under 186000) or the pod survived.
#   - the 1x WarpToUT stalls after the crash: stock's crash screen (FlightResultsDialog.Display
#     calls FlightDriver.SetPause(true); `PostFlightDialog` lines) paused the clock. Neither
#     CL-2 nor RF-12W's crashes logged it.
#   - `reflyrevert` times out in AwaitingResume or after the Esc menu: the post-crash pause or
#     the stashed tree kept the menu or the Revert to Launch option away; the fallback is
#     `AnswerMergeDialog choice=discard` (no rewind-point reload; the clock gate then moves).
#   - `Loss swap ... variant=A`: the attempt filed no ReputationPenalty row (read `KerbalDeath
#     rep penalty:` for `- no row` and its reason, and `Game state: ReputationChanged ...
#     (VesselLoss)` for the stand-in's death).
#   - `Merge dominance check ... result=refuse world=kerbal:`: the crash came before H's
#     KerbalAssignment start (185800.3), which cannot happen for a ~109 s hop from 185787.5.
#   - `Death hold: ... is permanent` or `respawn suppressed: open-ended co-row`: the stamp did
#     not reach the stored recording, or an un-closed row of the kerbal spans the window; read
#     the `Reservation bounded by` lines of the same walk.
#   - the merged mark at or past 186000: the crash or the 30 s settle ran late; H's recovery
#     and F's accept then cross before the pool gate and the pre-invoke equality reds.
#   - recordings outside 39..48: the debris the crash breakup records (committed with the
#     merged attempt) differ from the 0..9 window; read `ProcessBreakupEvent: debris child`.
#
# Owed off the first flight:
#   - the dead kerbal's name in the walk (Jebediah predicted, the slot owner) and the stand-in's
#     stock ROSTER state in rw07-06 (Missing predicted) and rw07-08 (Available predicted);
#   - the impact UT (~185897 predicted) and the death / respawn UTs (regexed 1858xx-1859xx /
#     1930xx-1931xx);
#   - the KerbalDeath penalty magnitude, repLossNew, tombstonedAttemptRepLoss (1 predicted);
#   - the merged mergeState / terminalKind / classifierReason / autoSeal (regexed);
#   - the recordings count (39 + the crash's debris recordings; window 39..48), the rewind
#     point count after the merge (1 predicted), the saveParse rewind block (report-only);
#   - the batch split (`total=3` pinned from the source, `passed` / `skipped` regexed;
#     IngameBatchWiringGroupTests.INTERIM_PIN_IDS until then); the tier call (operator:
#     stock-tree is not in the nightly instance set).
#
# FAST-LANE CHECKLIST: (1) reuse: RW-6's prefix and its Esc discard and FLIGHT re-entry,
# RW-1's close. Not merged INTO RW-6: RW-6 gates science credited once across the same two
# attempts on a LIVE pod, this lane a death, which leaves no pod to take the report. (2)
# explicit-UT warps only; (3)-(5) no dwell, burn or coast beyond the 11 s pad recording and two
# ~143 s 1x hops (the crash needs the real flight); (6) retry `once`; (7) recordings window
# 39..48; (8) operator, ~25 min expected; (9) flight_efficiency.py after the first green flight.
#
# STATUS: AUTHORED 2026-10-28 (branch `rw7-death-push`, on the PartAction activate button of the
# same branch), never flown. Every pinned literal is derived from source (file:line above), the
# host, RW-6's flown log (2026-10-28_1214) and the crash shapes of CL-2 (2026-10-25_1043) and
# RF-12W (2026-10-16_1135).
tier = "operator"
description = "Rewind ledger campaign, a kerbal death in a Re-Fly, discarded then merged (plan row 5): on cs-career-mun4, RW-6's committed pad flight and contract accept, a Rewind-to-Launch and a CS Flea Probe flight decoupled on the pad (a rewind point) and committed; a first Re-Fly of the pod slot lights the SRB without staging (PartAction activate) and the unchuted pod crashes with its stand-in, then is discarded (no death row, no rep penalty, no tombstone, pools and rows back to their pre-invoke values); a second Re-Fly crashes the same way and merges (variant B: the re-fly's own KerbalDeath rep penalty tombstoned, the death kept under the merged flight with a stock respawn after 7200 s); a warp across the committed rows and past the respawn, then LedgerGroundTruth."
instanceProfile = "stock-tree"
tags = ["RW-7", "career", "ledger", "reputation", "crew-loss", "kerbal-death", "respawn",
        "rewind", "rewind-to-launch", "refly", "discard-refly", "refly-merge", "loss-swap",
        "variant-b", "tombstone", "supersede", "head-tip-split", "revert-dialog", "stash",
        "unfinished-flights", "controlled-child", "editor", "ground-truth", "ingame-batch",
        "timeline-ops", "reading-run"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 120 + 120 + 120 (three warps) + 2 x 240 (the 1x hops)
# + 120 + 240 (the KSC warps) + 120 (check warp) + 2 x (120 GoToEditor + 180 LaunchFromEditor)
# + 120 (G's GoToEditor) + 180 (G's launch) + 2 x 180 StartRecording + 2 x 120 CommitTree
# + 120 Recover + 60 KscAction + 300 rewind + 2 x 300 InvokeRewind + 300 ReFlyRevert
# + 300 re-entry LoadGame + 240 AnswerMergeDialog + 11 x 120 SaveGame + 540 RunTests = 7640;
# runtime 8600 adds the inert steps and FlushAndQuit.
steps = [
  # scene = "spacecenter": the host's three vessels are Mun debris (RW-1's boot).
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  # Clear of the fixture's last rows (185732-185734) and their 60 s rollout window.
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },

  # ---- flight H: recorded on the pad, committed, recovered (RW-1 / RW-6 verbatim) ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "h",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186000" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "Recover",        args = { pid = "${h.pid}" },                                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw7-h-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw07-01-after-h-commit" },                   expect = "OK", budget = 120 },

  # ---- F: the committed future, a contract accept at the Space Center ----
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "f1fb89dc-a471-42cf-94da-de4bb1080512" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw7-f-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw07-02-after-f-accept" },                   expect = "OK", budget = 120 },

  # ---- the rewind to H's launch ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw7-rewound" },                              expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw07-03-after-rtl" },                        expect = "OK", budget = 120 },

  # ---- flight G: recorded on the pad, the stand decoupled (a rewind point), committed ----
