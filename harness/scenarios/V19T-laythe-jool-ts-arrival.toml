# if the token is pre-tolerated. A PARSEK-FAIL(anomaly) with every step green is the
# pre-registered correct catch; a clean sweep is an equally load-bearing reading.
# THE ARMING RECIPE if it fires: add the BARE token (not a count budget - the whole-set
# invariant `MisplacedAllowedAnomaliesRejectionTests.test_no_committed_spec_arms_a_count_budget`
# ships that mechanism INERT) WITH the run that shows it, per the S1.4 rule.
# **MEASURED on run `2026-08-21_0750`: the sweep came back `hits=[] counts={}` - a
# CLEAN SWEEP, the load-bearing reading rather than the catch.** So the arming recipe
# was NOT invoked and this array STAYS EMPTY: a single silent run is not a licence to
# pre-tolerate a token that raised on six of the family's nine runs to date. Section 6
# carries what the silence buys - nested-SOI EXCLUDED, self-overlap the surviving
# candidate, no mechanism claimed.
allowedAnomalies = []

[expectations.recordings]
# ONE body-change seam, so ONE recording is the prediction and the window admits a
# LOAD-TIME optimizer split at it. This lane starts no recording of its own, and the
# fixture ships exactly ONE `.prec` sidecar, so the count can move only through that
# walk - which fires on THIS lane's LoadGame, not on B28's flight.
# Every earlier loop lane measured `exoCoastBodyChangeKept=1` at its boundaries, and
# B26 kept BOTH of its seams cohesive including an ESCAPE boundary. => {1,2}, matching
# B28's own window and its arithmetic, so the two halves of the program cannot drift.
#
# **TIGHTENED {1,2} -> {1,1} AT THE ARMING PASS, 2026-08-21.** The admitted split DID
# NOT MATERIALIZE: run `2026-08-21_0750` measured `recordings.count = 1`, and its own
# log carries the optimizer's answer once - `Split summary:
# rec=28f5cc0158c8461eb995ea1e505aa67e evaluated=1 grazeForward=0 grazeBackward=0
# surfaceGrazeForward=0 surfaceGrazeBackward=0 seamSkipped=0 exoCoastBodyChangeKept=1
# splittableButRejected=0` - cohesion at the one body-change seam, exactly as rule 3
# predicts for a same-class Exo body change on a transfer COAST, and byte-identical to
# what V19M's run printed over the same fixture. The wide {1,2} window STAYS ON THE
# RECORD as the committed reading-era admission (a pre-registration is not deleted
# because the run answered it); it is subsumed by this gate. The
# `Split summary: .*exoCoastBodyChangeKept=1` REQUIRED token is armed on V19M only:
# this lane pins the COUNT, its sibling pins the MECHANISM, and one gate per fact
# across the pair is the point of authoring them as a pair.
count = { min = 1, max = 1 }

[expectations.logContracts]
# TEN TOKENS. What a reader will notice missing is missing on purpose:
# `Orbital(...) same-parent`, `support=Supported`, any `PhaseLock APPLIED` form and the
# whole re-aim trio are the ROUTING, and B28's header is explicit that V19M/V19T are
# where the return direction's routing is READ rather than asserted - requiring or
# forbidding any of them would gate on an answer this pair exists to measure.
#   "missionconfig applied:" / "SetLoopEnabled: loop ON" - the loop is ARMED through
#     the production path, in FLIGHT, before the save; the first also echoes the
#     anchor, which is the number to read when re-calibrating the jump.
#   "startloopplayback initiated:" - the clock work entered the production door and
#     echoed the resolved relaunchUt. ROAD-INDEPENDENT and the single most important
#     line in this log for the re-pin, because the anchor is the ONE seeded number.
#   "FastForwardToEventUT: jumping to UT=" - the jump entered the production door.
# THE TWO R12 ROUTE LINES, verbatim from V17T with nothing changed - the trackstation
#     BRANCH was taken and the load COMPLETED against the TrackingStation expected
#     scene (H23's pins; this fixture has a focusable vessel and would otherwise route
#     to FLIGHT, so a TRACKSTATION landing can only mean the requested scene overrode
#     the save-derived route - the claim is falsifiable).
# THE TWO TS ANTI-VACUITY GATES, both on the DYNAMIC overlap path (section 5), because
# the init walk's answer at this subject is PRE-REGISTERED IN BOTH DIRECTIONS and must
# not be gated:
#   "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION"
#     - the dynamic overlap path actually materializing a loop instance IN the TS. An
#     empty tracking station cannot green this in either init-walk world.
#   "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Jool scene=TRACKSTATION" -
#     V6T's `body=Mun` pin with the body swapped, which turns the D14 `jool` claim from
#     an EPOCH claim into a RENDERED-FRAME claim. Six of the live instances are
#     Jool-framed at this epoch and they are the six OLDEST, hence the LAST to spawn -
#     which is exactly what the forty-tick dwell block buys.
# THE PROBE / LENS PRESENCE PINS (V6T/V14T/V15T/V16T/V17T's, verbatim):
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - emitted only when the
#     per-pid parity pass touched the lens, so PRESENCE cannot be produced by a frame
#     with no resolved ghost. `sampled=[1-9]` is NOT pinned (the standing
#     FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and it
#     STAYS presence-only past the reading run too: a TS dwell characteristically reads
#     the structural `evaluated=0 skip.no-cross-body-successor=1`, and V16T MEASURED
#     that this lens can raise a nonzero from a creation-frame binding artifact rather
#     than from real drift, so the VALUE is a reading and not a contract.
# WHAT THE TWO ANTI-VACUITY GATES MEASURED on run `2026-08-21_0750`, recorded and NOT
# pinned: **37** `Created ghost vessel` lines, `orbitSource` split
# `overlap-instance-segment` 36 / `visible-segment` 1 - so the DYNAMIC path did the work
# and the init walk contributed the one. **37** `phase=GhostCreated surface=ProtoIcon`
# lines, of which the `scene=TRACKSTATION` ones split **Jool 8 / Laythe 11**. Both
# tokens matched with room to spare; the counts are the reading section 4 promised to
# report.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "loadgame trackstation route: booting to TRACKSTATION save=",
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION",
  "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Jool scene=TRACKSTATION",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# FOUR - the reading run's three, plus the init-walk forbid armed 2026-08-21 - and each
# guards a PREMISE rather than deferring a MEASUREMENT.
# NOTE what is NOT here, in both directions:
#   * the re-aim trio (`[ReaimDiag]` / `ENGAGED re-aim` / `FORCED FAITHFUL`) and every
#     phase-lock artifact - V17M's posture for V17M's reason, sharper here because the
#     return direction is the thing being read, and KEPT at the arming pass even though
#     the routing is now measured (section 7).
#   * the `icon-off-orbit` raise this lane may or may not produce is the anomaly
#     sweep's surface, not logContracts', and it is handled - by being deliberately
#     untolerated, before and after a clean sweep - in `allowedAnomalies` above.
# **AND THE `created 0 ghost vessel(s)` FORBID, WHICH IS NOW CARRIED - IT WAS NOT ON THE
# READING RUN.** THE PRE-FLIGHT ARGUMENT IS KEPT VERBATIM, because it was correct FOR A
# RUN THAT HAD NOT HAPPENED YET: "V17T retired it after run 1 measured init-zero as the
# CORRECT product outcome on a segment-less-tail subject. That reasoning does NOT
# transfer cleanly here - this lane's entry epoch sits inside a real Jool ORBIT_SEGMENT,
# so an orbit source demonstrably exists at the observed instant and READING B
# (init-nonzero) is live. BUT THE FORBID IS STILL NOT CARRIED, and the reason is posture
# rather than comfort: section 5 pre-registers BOTH init-walk readings and gates on
# NEITHER, so a forbid on the init line would gate exactly one branch of a question this
# spec declares open."
# **WHAT CHANGED IS THAT THE QUESTION IS ANSWERED.** Run `2026-08-21_0750` measured
# `created 1 ghost vessel(s)` with `noOrbit=0` and the source resolving as
# `visibleSegment=1` (section 5) - READING B, on this subject, at this epoch. A forbid
# on `created 0` therefore no longer gates an open branch; it guards a MEASURED outcome
# against regression, which is exactly the S1.4 rule (arm the bare token WITH the run
# that shows it, here `2026-08-21_0750`). It is also FIREABLE here in a way it is not
# on V19M, whose lane never leaves FLIGHT - `ParsekTrackingStation` is its only emitter.
# The two dynamic-path tokens above still carry the anti-vacuity duty; this forbid adds
# the init walk's own answer on top of them.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # ADDED 2026-08-21 off run `2026-08-21_0750`, which measured `created 1`. See the
  # block comment above for why this was correctly ABSENT before that run and correctly
  # PRESENT after it.
  "created 0 ghost vessel\\(s\\)",
  # THE V3C RUN-3 MARKER. CORRECTED 2026-08-21: this used to read "the most
  # load-bearing forbid in the file" on the claim that a refused backward jump "is only
  # a WARN". It is not - `ParsekTestCommandAddon.TimeJumpKscAction.cs:55-57` logs the
  # Warn AND calls `SetExecResult("REJECTED", null, "backward-jump")`, and the TimeJump
  # step carries `expect = "OK"`, so the STEP itself goes unmet and the run is
  # driver-INVALID on both attempts. This forbid is a redundant grep-stable marker of
  # that catch, kept for family convention. The case NOTHING catches is a jump that
  # lands FORWARD at the WRONG epoch: read `anchorUt=` and `relaunchUt=` (section 2).
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a RENDER defect rather than a reading about
  # the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# **ARMED 2026-08-21** off THIS lane's OWN green reading run `2026-08-21_0750` (PASS
# attempt 1), whose saveParse REPORT measured rewindPoints=0, supersedeRows=0,
# tombstones=0, rewindRetirements=0 - every window below ALREADY MET, so the arming
# re-pinned nothing and moved no verdict. This is the V14T/V15T/V16T/V17T discipline
# verbatim: arm from THIS lane's own measured facets, never from predicted ones. The
# reading run carried these same three windows REPORT-ONLY; the numbers did not change,
# only their gating did.
# The CLAIM is that a FLIGHT-arm / SaveGame / TS-re-entry observation authors NOTHING
# durable, and it is worth more on this shape than on a single-scene dwell for V5's
# reason - this spec writes a save mid-run and reads it back through a SECOND scene
# load, the shape in which a stray durable write is easiest to miss, and here the second
# load additionally drives the dynamic overlap path through a full fill-in (37 ghosts
# materialized, section 4).
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# **ARMED 2026-08-21**, same reading run `2026-08-21_0750`, which measured trees=1,
# committedTrees=1, recordings=1, terminalStates {Orbiting: 1}, branchPoints {},
# duplicateRecordingIds [] - and the points facet read 201/201/201 unparsed 0, the exact
# on-disk count of the harvested fixture, so the double-entry chain authored nothing and
# split nothing.
# THE PRE-FLIGHT REASON THIS BLOCK WAS ABSENT IS KEPT ON THE RECORD RATHER THAN
# DELETED: a report-only block of PREDICTED numbers reads like a measurement (V17T's
# stated reason for leaving it out on its own first run). It has now been run once, so
# the numbers below are THIS lane's measurement rather than B28's.
# **THE PAYLOAD IS BYTE-IDENTICAL TO V19M's** - both lanes measured 0/0/0/0 and 1/1/1
# {Orbiting: 1} over the same fixture through two different scene chains. That identity
# is the pair's determinism statement, the same one V17M/V17T made.
#
# `trees` keeps V2's max = 2 - the documented duplicate-tree writer hazard -
# deliberately WIDER than the single measurement rather than pinned to it.
gating = true
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1 } }

[runtime]
# 300 LoadGame + 300 StartLoopPlayback + 300 TimeJump + 300 LoadGame(TS) + the fast
# non-deferred verbs + the forty-tick dwell (>= 10 wall s at run.py's 0.25 s poll
# floor) + KSP boot + collect. The jump is instantaneous, so the 9,772.3 s of game time
# traversed costs no wall clock. The pre-flight text budgeted against the SIXTEEN-step
# form of this chain - V6T, V14T, V15T and V16T all measured 50 s end to end - plus the
# forty-tick block, and carried the family's 2,400 s unchanged rather than re-deriving
# it. **THIS 54-STEP SHAPE NOW HAS ITS OWN NUMBER: run `2026-08-21_0750` measured 60 s
# end to end**, so the budget sits ~40x above it. Left at 2,400 - it is a watchdog, and
# sizing it down to one measurement would trade headroom for nothing.
budgetSeconds = 2400

[retry]
# One retry absorbs the V5 promotion-recorder re-arm race and the transient
# TS-re-entry `LoadGame REJECTED` deferred-save busy class V17T's attempt 1 hit on its
# armed re-flight. It does NOT absorb a mis-seeded anchor: that reproduces exactly on
# attempt 2, which is the point. NOTE it is ALSO budgeted to spend itself if the
# `icon-off-orbit` token fires, since it is deliberately un-tolerated so the sweep can
# measure it - in that case the run reports PARSEK-FAIL(anomaly) on both attempts, and
# that is a pre-registered outcome priced here rather than discovered. The reading run
# spent no retry (PASS attempt 1) and the token stayed silent, which is section 6's
# measurement rather than a reason to stop pricing it.
policy = "once"

[expectedFail]
bugId = ""
