# CLAIM-IS-NOT-GATE, and this is the thin TS list a reading run owes.
#   D14 `scene-ts` is gated by the two R12 route tokens; `sandbox` by the fixture;
#     `jool` by the TS host materializing a ghost IN A JOOL FRAME at the observed
#     epoch - gated from the START by `phase=GhostCreated surface=ProtoIcon ...
#     body=Jool scene=TRACKSTATION` (V6T's `body=Mun` pin with the body swapped),
#     which is what makes it a RENDERED-FRAME claim rather than an EPOCH claim.
# DELIBERATELY NOT CLAIMED: `laythe`. The recording HAS a Laythe phase and eleven of
#   the live instances are in it at the observed epoch, but this lane pins no
#   Laythe-framed token, and a claim whose gate is somebody else's token is a claim
#   about a coincidence. Also not claimed: any D11 cell (routing is what this pair
#   MEASURES - B28's header is explicit that claiming one here would be claiming the
#   answer before the reading), D6 `ghost-map-presence` (the TS ProtoVessel lifecycle
#   is H23/H28's contract), and D9 `fast-forward` (V19M owns it). Whichever road the
#   reading run measures, the corresponding cell can be claimed at the arming pass
#   with the token that showed it.
[dimensionsCovered]
D14 = ["jool", "scene-ts", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING (hlib.validate_spec rejects a bare allowedAnomalies written
# after any [expectations.<sub>] header).
#
# **EMPTY ON PURPOSE, AND THE OUTCOME IS GATED IN NEITHER DIRECTION** - section 6.
# `icon-off-orbit` on the ghost-proto creation frame fired on ALL SIX runs of V14T,
# V15T and V16T at three parents while the stepped-bracket controls stayed silent on
# all six of theirs, and then V17T's two runs swept CLEAN on an identical step shape,
# leaving the discriminating variable undetermined between the two subject properties
# V17T introduced together. This subject is self-overlapping like V17T but NOT
# nested-SOI, so it separates them for the first time - which is worth exactly nothing
# if the token is pre-tolerated. A PARSEK-FAIL(anomaly) with every step green is the
# pre-registered correct catch; a clean sweep is an equally load-bearing reading.
# THE ARMING RECIPE if it fires: add the BARE token (not a count budget - the whole-set
# invariant `MisplacedAllowedAnomaliesRejectionTests.test_no_committed_spec_arms_a_count_budget`
# ships that mechanism INERT) WITH the run that shows it, per the S1.4 rule.
allowedAnomalies = []

[expectations.recordings]
# ONE body-change seam, so ONE recording is the prediction and the window admits a
# LOAD-TIME optimizer split at it. This lane starts no recording of its own, and the
# fixture ships exactly ONE `.prec` sidecar, so the count can move only through that
# walk - which fires on THIS lane's LoadGame, not on B28's flight.
# Every earlier loop lane measured `exoCoastBodyChangeKept=1` at its boundaries, and
# B26 kept BOTH of its seams cohesive including an ESCAPE boundary. => {1,2}, matching
# B28's own window and its arithmetic, so the two halves of the program cannot drift.
count = { min = 1, max = 2 }

[expectations.logContracts]
# TEN TOKENS. What a reader will notice missing is missing on purpose:
# `Orbital(...) same-parent`, `support=Supported`, any `PhaseLock APPLIED` form and the
# whole re-aim trio are the ROUTING, and B28's header is explicit that V19M/V19T are
# where the return direction's routing is READ rather than asserted - requiring or
# forbidding any of them would gate on an answer this pair exists to measure.
#   "missionconfig applied:" / "SetLoopEnabled: loop ON" - the loop is ARMED through
#     the production path, in FLIGHT, before the save; the first also echoes the
#     anchor, which is the number to read when re-calibrating the jump.
#   "startloopplayback initiated:" - the clock work entered the production door and
#     echoed the resolved relaunchUt. ROAD-INDEPENDENT and the single most important
#     line in this log for the re-pin, because the anchor is the ONE seeded number.
#   "FastForwardToEventUT: jumping to UT=" - the jump entered the production door.
# THE TWO R12 ROUTE LINES, verbatim from V17T with nothing changed - the trackstation
#     BRANCH was taken and the load COMPLETED against the TrackingStation expected
#     scene (H23's pins; this fixture has a focusable vessel and would otherwise route
#     to FLIGHT, so a TRACKSTATION landing can only mean the requested scene overrode
#     the save-derived route - the claim is falsifiable).
# THE TWO TS ANTI-VACUITY GATES, both on the DYNAMIC overlap path (section 5), because
# the init walk's answer at this subject is PRE-REGISTERED IN BOTH DIRECTIONS and must
# not be gated:
#   "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION"
#     - the dynamic overlap path actually materializing a loop instance IN the TS. An
#     empty tracking station cannot green this in either init-walk world.
#   "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Jool scene=TRACKSTATION" -
#     V6T's `body=Mun` pin with the body swapped, which turns the D14 `jool` claim from
#     an EPOCH claim into a RENDERED-FRAME claim. Six of the live instances are
#     Jool-framed at this epoch and they are the six OLDEST, hence the LAST to spawn -
#     which is exactly what the forty-tick dwell block buys.
# THE PROBE / LENS PRESENCE PINS (V6T/V14T/V15T/V16T/V17T's, verbatim):
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - emitted only when the
#     per-pid parity pass touched the lens, so PRESENCE cannot be produced by a frame
#     with no resolved ghost. `sampled=[1-9]` is NOT pinned (the standing
#     FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and it
#     must stay presence-only on a first reading: the value is unmeasured at this
#     subject, a TS dwell characteristically reads the structural `evaluated=0
#     skip.no-cross-body-successor=1`, and V16T MEASURED that this lens can raise a
#     nonzero from a creation-frame binding artifact rather than from real drift.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "loadgame trackstation route: booting to TRACKSTATION save=",
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION",
  "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Jool scene=TRACKSTATION",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, and each guards a PREMISE rather than deferring a MEASUREMENT.
# NOTE what is NOT here, in both directions:
#   * the re-aim trio (`[ReaimDiag]` / `ENGAGED re-aim` / `FORCED FAITHFUL`) - V17M's
#     posture for V17M's reason, and sharper here because the return direction is the
#     thing being read.
#   * the `icon-off-orbit` raise this lane may or may not produce is the anomaly
#     sweep's surface, not logContracts', and it is handled - by being deliberately
#     untolerated - in `allowedAnomalies` above.
#   * **THE `created 0 ghost vessel(s)` FORBID, AND THE DECISION IS DELIBERATE.** V17T
#     retired it after run 1 measured init-zero as the CORRECT product outcome on a
#     segment-less-tail subject. That reasoning does NOT transfer cleanly here - this
#     lane's entry epoch sits inside a real Jool ORBIT_SEGMENT, so an orbit source
#     demonstrably exists at the observed instant and READING B (init-nonzero) is live.
#     BUT THE FORBID IS STILL NOT CARRIED, and the reason is posture rather than
#     comfort: section 5 pre-registers BOTH init-walk readings and gates on NEITHER, so
#     a forbid on the init line would gate exactly one branch of a question this spec
#     declares open. It would also be a bet against the ONE thing that is measured
#     rather than inferred - this recording's parked tail IS segment-less, the same
#     shape that produced V17T's init-zero. The anti-vacuity duty is fully carried by
#     the two dynamic-path tokens above, which no empty tracking station can satisfy.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The V3C run-3 self-detection guard: a refused backward jump is only a WARN, so
  # without this token a mis-seeded jump can green while dwelling nowhere. The anchor
  # here is the ONE seeded number (section 2), which makes this the most load-bearing
  # forbid in the file even though the jump is +10,358.5 s forward on paper.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a RENDER defect rather than a reading about
  # the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# REPORT-ONLY on a reading run, and NOT armed, which is the V14T/V15T/V16T/V17T
# discipline verbatim: arm from THIS lane's own measured facets, never from predicted
# ones. The CLAIM is that a FLIGHT-arm / SaveGame / TS-re-entry observation authors
# NOTHING durable, and it is worth more on this shape than on a single-scene dwell for
# V5's reason - this spec writes a save mid-run and reads it back through a SECOND
# scene load, the shape in which a stray durable write is easiest to miss, and here
# the second load additionally drives the dynamic overlap path through a full fill-in.
# B28's own saveParse REPORT on the produced save read 0/0/0, so the windows below are
# expected to be met; expected is not measured, which is why they do not gate yet.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# NO `[expectations.recordings.structure]` BLOCK, DELIBERATELY. A report-only block of
# PREDICTED numbers reads like a measurement (V17T's stated reason for leaving it out
# on its own first run). Author it from this lane's own saveParse facets at the arming
# pass, with `trees` given V2's max = 2 (the documented duplicate-writer hazard) and
# everything else pinned at the measured value.

[runtime]
# 300 LoadGame + 300 StartLoopPlayback + 300 TimeJump + 300 LoadGame(TS) + the fast
# non-deferred verbs + the forty-tick dwell (>= 10 wall s at run.py's 0.25 s poll
# floor) + KSP boot + collect. The jump is instantaneous, so the 10,358.5 s of game
# time traversed costs no wall clock. THE ONLY MEASURED PRECEDENT for the wall is the
# SIXTEEN-step form of this chain - V6T, V14T, V15T and V16T all measured 50 s end to
# end - and this lane adds the forty-tick block on top of that, so 2,400 s is the
# family's budget carried unchanged rather than a number re-derived from a 54-step
# run nobody in this worktree has a result JSON for.
budgetSeconds = 2400

[retry]
# One retry absorbs the V5 promotion-recorder re-arm race and the transient
# TS-re-entry `LoadGame REJECTED` deferred-save busy class V17T's attempt 1 hit on its
# armed re-flight. It does NOT absorb a mis-seeded anchor: that reproduces exactly on
# attempt 2, which is the point. NOTE it is ALSO budgeted to spend itself if the
# `icon-off-orbit` token fires, since it is deliberately un-tolerated so the sweep can
# measure it - in that case the run reports PARSEK-FAIL(anomaly) on both attempts, and
# that is a pre-registered outcome priced here rather than discovered.
policy = "once"

[expectedFail]
bugId = ""
