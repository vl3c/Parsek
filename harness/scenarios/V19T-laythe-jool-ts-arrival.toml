[fixture]
# COMMITTED, and produced by a green flight rather than predicted: the
# `B28-laythe-jool-return` harvest (run 2026-08-20_2330, PASS attempt 1). V19M walks the
# same bytes and its [fixture] block is not restated here so the pair cannot drift.
# WHAT THIS LANE DEPENDS ON, measured: ONE committed tree
# (91be0ffd2b5f42358d218d3f028224bc), ONE recording (28f5cc0158c8461eb995ea1e505aa67e,
# ONE .prec sidecar of 206 POINT nodes reported as `pointCount` 201), EIGHT
# non-predicted ORBIT_SEGMENTs across exactly ONE
# body-change seam, terminal Orbiting at JOOL, zero durable rows (supersedeRows 0,
# tombstones 0, rewindPoints 0 on B28's own saveParse REPORT), CREWED subject.
# THE FINAL PARK, for a reader checking the conic against the render: ap 19,728,666.573
# / pe 19,728,628.891 ALTITUDE about Jool, i.e. ecc ~7.3e-7 on a 25.729 Mm-radius
# circle, sitting ENTIRELY INSIDE Laythe's 27.184 Mm orbit and decoupled from it - which
# is what B28's header predicted and its flight delivered.
