[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # Kill the scene-entry auto-recorder. HARD precondition, not hygiene: the SECOND
  # LoadGame below is REJECTED `recording-active` by the dispatch guard if a
  # recorder is live, and SaveGame would persist a half-recorded stub into the save
  # the TS half then reads.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # mapRenderTracing arms the map/TS tracer + probe; verboseLogging is LOAD-BEARING
  # (the Tier-B truth lines are Verbose - the V1 lesson). Settings are
  # process-global, so both survive the LoadGame into TS.
  { cmd = "SetSetting", args = { name = "mapRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",   value = "true" }, expect = "OK" },
  # ARM (FLIGHT-only): the production MissionStore.SetLoopEnabled path. THIS is where
  # a RETURN-DIRECTION tree - target = the origin's PARENT - either reaches ApplyReaim
  # or does not. TREE ID read off the harvested fixture's RECORDING_TREE node.
  { cmd = "MissionConfig", args = { tree = "91be0ffd2b5f42358d218d3f028224bc", loop = "true" }, expect = "OK" },
  # WARP TO CYCLE 1's LAUNCH (FLIGHT-only): an instantaneous Planetarium clock set.
  # Its `relaunchUt=` echo is the number the whole seed table hangs off (section 2).
  { cmd = "StartLoopPlayback", args = { tree = "91be0ffd2b5f42358d218d3f028224bc" }, expect = "OK", budget = 300 },
  # THE ONE JUMP (FLIGHT-only): V19M's cycle-1 COAST-DWELL epoch, reused VERBATIM so
  # the two lanes observe the SAME instant from the two scenes. 70.0% through the
  # replayed Jool coast seg#6 [28,836,017.8, 28,840,817.7] - 1,439.7 s inside its far
  # end and 2,036.8 s short of the replayed segment-less tail - so an orbit source
  # exists at the observed instant. Strictly forward: +10,358.5 s on the restored
  # clock. Section 3 carries the derivation and the rejected tail-read alternative.
  { cmd = "TimeJump", args = { ut = "28839378" }, expect = "OK", budget = 300 },
  # PERSIST the armed mission state + the jumped clock.
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  # RE-KILL THE RECORDER immediately before the load the guard rejects (V5's measured
  # re-arm race - see the header).
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  # RE-ENTER IN THE TRACKING STATION (R12's additive `scene=` arg, the H23 route).
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "trackstation" }, expect = "OK", budget = 300 },
  # FORTY DWELL TICKS - SPAWN-THROTTLE HEADROOM, NOT CENSUS PACING (section 4).
  # Overlap-instance creation runs NEWEST-CYCLE-FIRST at `MaxSpawnsPerFrame = 2` per
  # lifecycle tick, so the OLDEST live cycle spawns LAST; V17T run 1's two-tick TS
  # phase gave ~0.65 s = 3 ticks = 6 ghosts and FlushAndQuit cut cycle 1 off at 6 of
  # 20. Here the six Jool-framed instances are the six OLDEST, so cycle 1 lands about
  # tick 9 and forty RecordingState ticks (>= 10 wall s at run.py's 0.25 s poll floor,
  # V16M's proven sizing) is ~4.4x the headroom the fill-in loop needs.
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
