EADROOM, NOT CENSUS PACING - V17T run 1 measured overlap-instance creation running NEWEST-CYCLE-FIRST at `MaxSpawnsPerFrame = 2` per lifecycle tick, so the OLDEST live cycle spawns LAST and its two-tick TS phase was cut off at 6 of 20 before cycle 1's turn; re-checked against the MEASURED anchor and pitch, at most 17 of 20 have launched by the observation epoch and the six Jool-framed ones are the six OLDEST, so cycle 1 lands about tick 9 and forty ticks is ~4.4x that. **IT BOUGHT 37 GHOSTS**: 37 `Created ghost vessel` lines, `orbitSource` split `overlap-instance-segment` 36 / `visible-segment` 1, and 37 `phase=GhostCreated surface=ProtoIcon` lines whose `scene=TRACKSTATION` members split Jool 8 / Laythe 11. Both anti-vacuity gates matched; none of those counts is pinned. **THE TS INIT WALK WAS PRE-REGISTERED IN BOTH DIRECTIONS, GATED IN NEITHER, AND THE RUN PICKED READING B - THE OPPOSITE OF V17T's ANSWER**: `CreateGhostVesselsFromCommittedRecordings: created=1 ... sources(visibleSegment=1 ...) (skipped: ... noOrbit=0 ...)` and `ParsekTrackingStation initialized: created 1 ghost vessel(s)`. The walk DID find an orbit source, because this lane's jump lands inside the SEGMENTED Jool coast rather than on V17T's segment-less tail, which is exactly the distinction READING B named before the flight; the losing branch (READING A, init-zero) is kept on the record rather than deleted. **THE ANOMALY DISCRIMINATOR IS THIS LANE'S WHOLE POINT AND IT DISCHARGED**: `icon-off-orbit` was SILENT. V14T/V15T/V16T raised it on 6 of 6 runs at three parents (self-overlapping NO, nested-SOI NO); V17T was silent (self-overlapping YES, nested-SOI YES); **this run is silent with self-overlapping YES and nested-SOI NO** - visited bodies {Laythe, Jool}, `FindNestedRoot` needs a non-root parent with >= 2 visited children and neither Jool nor Sun supplies one, so the proto-orbit-line lens stays intact. **SO NESTED-SOI IS EXCLUDED AS THE CAUSE** (absent here and the raise still did not happen) **