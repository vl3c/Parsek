# 2. THE LOOP CLOCK, AND WHY THIS LANE SELF-OVERLAPS
# =====================================================================================
# Cadence is `Auto` -> `max(spanDur, LoopTiming.MinCycleDuration = 5.0)` = spanDur. The
# per-instance launch cadence is then
#   ComputeEffectiveLaunchCadence(30.0, spanDur, 20)
#     = max(ParsekSettings.autoLoopIntervalSeconds default 30.0, spanDur / 20)
#     = **599.59084358736868 s**        <- THE CAP DOMINATES BY 20x
# RE-PINNED 2026-08-21 off this lane's own run, which printed
# `spanDur=11991.816871747375 unit=Sec cadence=11991.816871747375
# overlapCadence=599.59084358736868 overlaps=yes`. The pre-flight derivation used the
# POINT span and got 11,990.436871778 / 599.5218435889: **the STRUCTURE of the
# derivation was right and only its base was short.** Cadence is still exactly spanDur,
# overlapCadence is still exactly spanDur/20 with no NextUp bump, and the cap still
# dominates 20x - the two clocks differ by 1.380 s of span and 0.069 s of pitch.
# (`GhostPlayback.MaxOverlapMissionInstances = 20`, `LoopTiming.DefaultLoopIntervalSeconds
# = 30.0`, `LoopTiming.MinCycleDuration = 5.0`, all in `Source/Parsek/ParsekConfig.cs`.)
#
# So the loop SELF-OVERLAPS - up to 20 concurrent instances launched 599.52 s apart -
# and because `overlapCadence` is EXACTLY `spanDur / 20`, instance 21 is exactly one
# span after instance 1: "cycle 2 = cycle 1 + one span" and "cycle 2 = a real relaunch
# epoch" are the SAME epoch. That is V17M's identity, reproduced at a second subject.
#
# THE ANCHOR WAS THE ONE SEEDED NUMBER IN THIS FILE, AND THE SEED WAS CONFIRMED. With
# phase-lock skipped the anchor is "the UT the loop was enabled at"; the save restores
# UT 28,829,019.474 and a handful of fast seam verbs run at 1x before `MissionConfig`,
# so the seed was
#   **A ~ 28,829,021 (+/- 3 s)**
# and the run printed `anchorUt=28829020.913923223 phaseAnchorUt=28829020.913923223`.
# **0.086 s OUT.** CONFIRMED, not moved. The line that re-pins it is
# `startloopplayback initiated: relaunchUt=`, which is required below for exactly that
# reason, and it echoed **R1 = 28,829,620.504766811**.
# NOTE the pair does NOT share an anchor: V19M's own run measured 28,829,021.193923216
# on the same fixture, 0.280 s above this one, because its FLIGHT phase runs a
# different count of fast verbs before `MissionConfig`. A seeded anchor is a per-run
# quantity, not a fixture constant - and the two lanes still observe the SAME JUMP UT,
