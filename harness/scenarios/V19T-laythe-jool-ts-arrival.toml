# 4. THE FORTY-TICK TS DWELL IS SPAWN-THROTTLE HEADROOM, NOT CENSUS PACING
# =====================================================================================
# V16M's forty-tick block exists to push a SECOND census emission past a 5.0 s
# VerboseRateLimited window. **THAT IS NOT WHY IT IS HERE**, and copying it for that
# reason would be copying a number without its argument. V17T run 1 (2026-08-20_1917)
# measured the real mechanism on a self-overlapping TS subject:
#
#   overlap-instance creation runs **NEWEST-CYCLE-FIRST** at
#   `GhostPlayback.MaxSpawnsPerFrame = 2` per lifecycle tick, so the OLDEST live cycle
#   spawns LAST. Its two-tick TS phase gave the scene ~0.65 s = 3 ticks = 6 ghosts
#   (cycles 14-19) and FlushAndQuit ended the scene before cycle 1's turn - **6 of 20**.
#   The SAME epoch in the FLIGHT phase created all 20, so the pin was satisfiable; the
#   scene simply had to live long enough.
#
# THE ARITHMETIC FOR THIS SUBJECT, with its inputs named because it is arithmetic and
# not a measurement. RE-CHECKED 2026-08-21 against the MEASURED anchor
# 28,829,020.913923223 and the MEASURED pitch 599.59084358736868, and EVERY STEP OF IT
# SURVIVES: the observation epoch is 10,357.09 s past the anchor, instance n launches
# at `A + n * 599.59084`, so at most **17** of the 20 have launched; a Jool-framed
# instance is one whose elapsed time exceeds the 6,359.641 s seam offset, which is
# **n = 1..6**, i.e. the SIX OLDEST - therefore the LAST SIX TO SPAWN under
# newest-first ordering. At 2 per tick the first Jool-framed instance appears about
# tick 6 and cycle 1 about tick 9. **FORTY RecordingState ticks (>= 10 wall s at
# run.py's 0.25 s poll floor, V16M's proven sizing) is ~4.4x that**, and the exact live
# count is a READING this run reports rather than a number pinned anywhere below.
#
# **THE READING, MEASURED on run `2026-08-21_0750`.** The dwell bought the scene enough
# life to materialize **37** ghosts: 37 `Created ghost vessel` lines with
# `orbitSource=overlap-instance-segment` **36** and `visible-segment` **1**, so the
# DYNAMIC overlap path did essentially all of the work and the init walk contributed
# the one. 37 `phase=GhostCreated surface=ProtoIcon` lines, of which the ones carrying
# `scene=TRACKSTATION` split **Jool 8 / Laythe 11**. Both anti-vacuity tokens matched.
# NOTHING BELOW PINS ANY OF THOSE COUNTS - they are the reading this section said it
# would report, and V17T's 6-of-20 cut-off is the reason the block is sized the way it
# is rather than a number to reproduce.
#
