#     step shape IDENTICAL to its three predecessors - so the discriminating variable
#     is not the workflow, it is the SUBJECT. V17T was the first self-overlapping loop
#     AND the first nested-SOI recording whose ProtoOrbitLine fail-closes to a
#     root-frame verbatim render. **WHICH of those broke the trigger is UNDETERMINED**
#     and is recorded on the family entry as an OPEN READING with no mechanism claimed.
#
# **THIS LANE IS THE DISCRIMINATOR THAT FAMILY NEEDS.** It is SELF-OVERLAPPING like
