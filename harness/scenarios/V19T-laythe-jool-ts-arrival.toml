# 5. THE TS INIT WALK - BOTH READINGS PRE-REGISTERED, NEITHER GATED
# =====================================================================================
# V14T/V15T/V16T all required `ParsekTrackingStation initialized: created [1-9][0-9]*
# ghost vessel\(s\)` as their TS anti-vacuity gate. V17T RETIRED it, because run 1
# measured init-ZERO as the CORRECT product outcome on its subject: with the loop armed,
# the init walk evaluates the BASE recording at the entry epoch and skips it `noOrbit=1`
# when the recording's tail is segment-less (no visibleSegment / terminalOrbit /
# endpointTail / stateVector source resolves), and every real ghost then comes from the
# per-lifecycle-tick DYNAMIC overlap path instead.
#
# **THIS SUBJECT SITS ON BOTH SIDES OF THAT.** Its parked tail IS segment-less (section
# 1) - the same shape V17T measured init-zero on - but this lane's jump lands INSIDE the
# replayed Jool coast segment (section 3), where an orbit source demonstrably exists.
# Whether the init walk finds one AT THE ENTRY EPOCH therefore depends on which clock it
# evaluates the base recording against, and that is GENUINELY OPEN at this subject:
#
#   READING A - INIT-ZERO. The walk reads the base recording on its OWN unshifted
#     timeline, where the entry epoch is 10,361 s past the recording's end and the only
#     candidate source is the segment-less tail. V17T's measurement, reproduced.
#   READING B - INIT-NONZERO. The walk reads the loop-shifted clock, where the entry
#     epoch is 70% through a real Jool ORBIT_SEGMENT and a source resolves cleanly.
#     No committed lane has ever measured this on a self-overlapping subject.
#
# THE LINE THAT SETTLES IT: `ParsekTrackingStation initialized: created N ghost
# vessel(s)` against the walk's own `noOrbit=` skip counter on the same boot. **NEITHER
# READING WAS GATED** - the init line was neither required nor forbidden on the reading
# run, and the anti-vacuity duty is carried entirely by the two DYNAMIC-path tokens,
# which an empty tracking station cannot satisfy in either world.
#
# **MEASURED, AND IT IS READING B - THE OPPOSITE OF V17T's ANSWER.** Run
# `2026-08-21_0750` printed:
#   `CreateGhostVesselsFromCommittedRecordings: created=1 from 1 recordings
#    sources(visibleSegment=1 terminalOrbit=0 endpointTail=0 stateVector=0) (skipped:
#    debris=0 suppressed=0 spawned=0 terminal=0 beforeActivation=0
#    beforeTerminalOrbit=0 noOrbit=0 endpointConflict=0 terminalUnseedable=0
#    loopMemberHidden=0)`
#   `ParsekTrackingStation initialized: created 1 ghost vessel(s), fixed 0 orbit
#    renderer(s), trackingStationSuppressed=0, orbitSourceDiagnostics=aggregated`
# **`created 1` with `noOrbit=0` and the source resolving as `visibleSegment`.** The
# init walk DID find an orbit source, because this lane's jump lands INSIDE the
# SEGMENTED Jool coast rather than on V17T's segment-less tail - which is exactly the
# distinction READING B named before the flight. BOTH readings were pre-registered
# here, neither was gated, and the run picked B; that is recorded rather than the
# losing branch being deleted.
# **CONSEQUENCE FOR THE ARMING PASS:** `created 0 ghost vessel\(s\)` is now a
# MEASURED-live, FIREABLE forbid on this lane, so it IS carried below (the S1.4 rule:
# arm the bare token WITH the run that shows it, here `2026-08-21_0750`). V17T retired
# that forbid because init-zero was the CORRECT product outcome on ITS subject; on THIS
# subject init-one is the measured outcome, so the forbid guards a real regression
# instead of gating an open question. See the `forbidden` block for the full argument.
#
