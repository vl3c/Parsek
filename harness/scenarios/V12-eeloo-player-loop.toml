schema = 1
id = "V12-eeloo-player-loop"
# =====================================================================================
# V12: THE PLAYER LOOP WORKFLOW ON THE EELOO PROGRAM'S RECORDING.
#
# HISTORY, because this lane changed job exactly the way V9 did. It was authored as a
# pure MEASUREMENT flight (V8/V9-iteration-1 posture: three plumbing tokens armed, an
# ERROR floor, nothing else), and it FLEW TWICE GREEN on 2026-08-13 (`_0053` wall 48 s
# and `_0055` wall 49 s, both PASS attempt 1), BYTE-IDENTICAL on every measured token.
#
# IT IS NOW ARMED on what those two runs measured. Unlike V9 this lane measured no
# defect -- the cohesion fix V9 earned was already in the DLL, and Eeloo is the first
# fixture to exercise it from cold at interplanetary scale -- so the armed set is a
# REGRESSION FLOOR FOR A HEALTHY READING rather than the inverse of a bug. V9's two
# decline forbids come with it: they are legitimate here now that a green measured
# ENGAGED reading exists to be defended.
#
# WHAT IT DOES: boots the committed `eeloo-orbit-recorded` fixture (B21's green flight
# `2026-08-12_2239`, harvested --keep-parsek), kills the scene-entry recording stub,
# turns the three tracers on, marks the committed tree as a LOOP unit, and starts loop
# playback. That is the whole workflow a player performs when they say "replay my
# Eeloo mission". The flight found out what the loop machinery MAKES of a 47.0M
# game-second interplanetary unit -- by a wide margin the longest, and the most deeply
# span>synodic, unit any committed lane has ever handed it.
#
# -------------------------------------------------------------------------------------
# FIXTURE FACTS, measured off the COMMITTED BYTES (saveparse.parse_parsek_scenario +
# observed_structure_facets over harness/fixtures/saves/eeloo-orbit-recorded), not off
# a result JSON:
#
#   tree id           d4ce5c45adae4f3e89c4ac6bbec6b167   (single committed tree)
#   rootRecordingId   20d890f9f34b466fb8be07d83103a9a7
#   trees 1, committedTrees 1, recordings 5
#   terminalStates {Orbiting 3, Destroyed 2}, branchPoints {JointBreak 3}
#   supersedes 0, tombstones 0, rewindPoints 0, rewindRetirements 0
#   points total 1,684 largest 1,501 smallest 21, trivial 0, unparsed 0
#   schemaGeneration 4
#
#   per-recording spans (explicitStartUT -> explicitEndUT), which is what makes the
#   unit-span arithmetic below checkable rather than asserted:
#     20d890f9  Duna Rocket             26.220 -> 47,036,743.944   main orbiter, Eeloo
#     c849bbee  Duna Rocket Debris      97.080 ->        149.040   ascent booster
#     d8bfbb2c  Duna Rocket Debris      97.080 ->        148.740   ascent booster
#     34ba13d3  Duna Rocket Debris   1,697.256 ->      1,716.398   autostaged core
#     cf7ff6b8  Duna Rocket Debris   2,698.995 ->      2,703.897   jettisoned Skipper
#   ALL FOUR DEBRIS SPANS NEST INSIDE THE MAIN'S, so the unit's span envelope
#   (MissionLoopUnitBuilder.cs:227-250 takes min StartUT / max EndUT over the members)
#   is the main recording's span exactly. That is why the cadence arithmetic below can
#   be derived from one recording instead of from the whole member set.
#
#   THE COMMITTED BYTES ARE `_2239`'s, NOT `_2003`'s. B21 flew green twice on
#   2026-08-12 and the FIRST green run's produced save was destroyed 53 s after it
#   ended by a sibling scenario staging into the same `saveTemplate` leaf
#   (HARNESS-PRODUCED-SAVE-CLOBBERED-BY-SIBLING-RUN, docs/dev/todo-and-known-bugs.md).
#   Every number in this header was re-measured against `_2239` or against the
#   committed bytes. Do not cross-check this spec against `_2003`'s artifacts.
#
# -------------------------------------------------------------------------------------
# MEASURED. This block replaces the four PREDICTIONS this header used to carry; every
# question they asked is answered here with the digits the product emitted. Quoted from
# `_0053` and reproduced character-for-character by `_0055`:
#
#   ENGAGED re-aim Kerbin->Eeloo via Sun
#   D0=54007648.196326263  synodic=9776696.3265985884  tof=41843983.835473977
#   anchor=48883507.852992937  cadence=48883481.632992938
#   phaseAnchor=53969923.596983388
#   loiterCuts=1 cutSeconds=5086416  compressedSpan=41950304/47036720
#   member#1 segs=20 startBody=Kerbin supported=True target=Eeloo parking=False
#   gatheredSegs=20 transferMemberSegs=20 plan.Supported=True reason=''
#   members=2 foreignMembers=0 skipped=0 span=[26.21999999999953,47036746.303578854]
#   spanDur=47036720.083578855 overlapCadence=48883481.632992938 overlaps=no
#
# MEASUREMENT 1 -- THE CADENCE MULTIPLE IS 5, AND THIS IS THE PROGRAM'S FIRST READING
# DEEP IN THE span>synodic REGIME. The law at ReaimWindowPlanner.cs:144-146:
#
#     cadence = Max(1, Ceiling(spanDuration / synodic - 1e-9)) * synodic
#
# and the engaged branch then takes Math.Max(span, cadence) at
# MissionLoopUnitBuilder.cs:652, so the emitted `cadence=` is whichever is larger.
# THE ARITHMETIC, done on the EMITTED digits rather than on a derivation:
#
#   cadence / synodic  = 48,883,481.632992938 / 9,776,696.3265985884
#                      = 5.000000 EXACTLY -- equal to 5.0 in double, and
#                        cadence - 5*synodic evaluates to 0.0, not to a rounding crumb
#   raw span           = compressedSpan + cutSeconds = 41,950,304 + 5,086,416
#                      = 47,036,720          (`spanDur=47036720.083578855` agrees)
#   raw span / synodic = 4.8111  ->  Ceiling(4.8111 - 1e-9) = 5   -- the law, satisfied
#   Math.Max(span, cadence): 48,883,481.6 > 47,036,720.1, so the CEILING wins and the
#   emitted cadence IS the synodic multiple rather than the span. It exceeds the span
#   by 1,846,761.5 s = 3.93%, the TIGHTEST cadence-over-span margin any committed unit
#   has scheduled.
#
#   THE THREE-TARGET REGIME TABLE, which is the point of having flown three of these:
#     Eve    ratio 1.0733  ->  multiple 2
#     Dres   ratio 1.79    ->  multiple 2
#     Eeloo  ratio 4.8111  ->  multiple 5      <- the first unit past 2
#   The planner reads the RAW span, not the loiter-compressed one. Eeloo cannot prove
#   that on its own (its compressed span 41,950,304 = 4.2909 synodic still Ceilings to
#   5); EVE is the case that does, and it still stands: compressed 3,944,147 = 0.269
#   synodic, whose Ceiling would be 1, and Eve measured 2.
#
# MEASUREMENT 2 -- THE COMPRESSOR REMOVES A MUCH SMALLER FRACTION OF THIS SPAN THAN OF
# DRES'S, AND THE SPAN ITSELF IS 2.31x LARGER. The compressor found exactly one loiter
# and cut 5,086,416 s out of a 47,036,720 s span = 10.8%. It cannot do much better,
# because there is almost nothing else to cut:
#
#     tof          41,843,983.8 s  = 89.0% of the raw span   <- the heliocentric coast
#     loiter cut    5,086,416   s  = 10.8%                   <- the LKO ejection wait
#
# NO REGIME INVERSION, and an earlier draft of this header claimed one. It said Dres's
# span was WAIT-DOMINATED against Eeloo's TOF-DOMINATED, i.e. an opposite composition.
# THAT IS WRONG ON THE DRES NUMBERS: Dres cut 8,436,248 s out of a 20,393,382 s span =
# 41.4%, against a tof of 11,885,901.8 s = 58.3% (V10-dres-loop-arrival.toml:41 for the
# tof, V9-dres-player-loop.toml:193/:195 for the span and the cut). DRES WAS ALSO
# TOF-MAJORITY -- its coast was the larger share there too -- so nothing flipped. Both
# spans are essentially wait + tof (Dres 99.65%, Eeloo 99.77% of the raw span), which
# is itself the cross-check that the compressor is finding the whole ejection wait and
# nothing else.
#
# WHAT IS ACTUALLY DIFFERENT, and it is still worth arming:
#
#                  raw span        loiter cut          cut fraction   tof fraction
#     Dres       20,393,382 s     8,436,248 s              41.4%          58.3%
#     Eeloo      47,036,720 s     5,086,416 s              10.8%          89.0%
#
# The CUT FRACTION falls by 3.83x while the span grows by 2.31x -- the compressor's
# purchase on a unit shrinks as the coast lengthens, in both relative and absolute
# terms (Eeloo's cut is SMALLER in seconds than Dres's on a span more than twice as
# long). Eeloo's LKO wait is nonetheless comparable in absolute size to Dres's own
# ejection wait in the sense that matters for correctness: B21's TRANSFER-BURN span
# measured 5,093,753 game s on `_2239`, so the compressor landed 7,337 s inside the
# wait it was supposed to find. Same mechanism, same job done, a tenth of a span whose
# bulk is a 484-day coast. `compressedSpan=41950304/47036720` is armed BECAUSE it is
# that ratio in one token: a change that starts compressing the coast, or that stops
# finding the ejection wait, moves it.
#
# -------------------------------------------------------------------------------------
# ALSO MEASURED, RECORDED AS READINGS, DELIBERATELY NOT ARMED:
#
#   * PhaseLock reads `support=UnsupportedCrossParent keeping anchor=53969923.596983388`
#     -- Eeloo is not a direct child of Kerbin, exactly as at Dres (V9) and Eve (V8).
#     The normal reading for a cross-parent interplanetary unit, never part of any
#     defect, and so not in `forbidden`.
#   * THE SEAM-ENDPOINT CENSUS DOES NOT RUN. The lane quits ~1 s after
#     StartLoopPlayback and never reaches the render stage the census rides. Arming its
#     absence would pin an artifact of this lane's brevity (V9 says the same of its own
#     post-fix census).
#   * THE DESCENT TRIGGER DECLINES: `descent trigger NOT engaged (foundRun=False
#     captureShift=-7577876.6049438491 Trot=19460 seam=47036221.823492885
#     descentSet=[] setEnd=NaN contiguous=True startMatchesSeam=False
#     conicInRegion=True setMinStart=NaN)`. Unarmed for the same reason as the census:
#     downstream state this lane observes in passing rather than exercises.
#   * ZERO `tilt-correction` LINES, AND NO tof-BAND TOKENS -- confirmed on both runs,
#     and STRUCTURAL rather than a tuning question. `eTarget=` / `halfWidthFraction=`
#     are emitted from exactly two sites, both inside ReaimPlaybackResolver -- the
#     failure line at ReaimPlaybackResolver.cs:483 (`synth failed across N tof
#     candidates`) and the success line at :620 (`re-aimed transfer ready`) -- and the
#     resolver runs during PLAYBACK OF the re-aimed heliocentric leg. THIS LANE ENDS AT
#     THE RELAUNCH, so neither site is reached and the tilt gate downstream of them
#     never runs. V9 measured zero tilt lines on all four of its runs for exactly this
#     reason. Eeloo's derivable band token (`eTarget=0.2600 halfWidthFraction=0.1900`,
#     from ReaimTofSearch's HalfWidthFraction = clamp(0.06 + 0.5*e, 0.06, 0.20) at
#     e=0.26) and the derivable tilt pair (`bound=6.6500 targetInc=6.1500`) belong to
#     V12A, the lane that TimeJumps into the transfer. They are not omissions here;
#     they are out of this lane's reach.
#
# -------------------------------------------------------------------------------------
# ARMING LEDGER
#   READINGS   2026-08-13 `_0053` (PASS attempt 1, wall 48 s) and `_0055` (PASS attempt
#              1, wall 49 s) -- the two consecutive byte-identical runs the discipline
#              wants, both flown on the unarmed reading-run shape. Every token armed
#              below was verified by re.search against BOTH collected KSP.logs before
#              it was written into the list.
#   ARMED      2026-08-13, this commit.
#   CONTROL    RUN AND PASSED, not owed. `2026-08-13_0114`: ONE digit of ONE
#              genuinely-measured token inverted -- `cadence=48883481.632992938` ->
#              `48883481.632992939` in the required array ONLY, every comment copy left
#              intact so a comment match could not mask it -- and the lane went
#              PARSEK-FAIL(expectation) attempt 1 (wall 49 s, all 10 driver steps OK),
#              naming exactly that token and nothing else:
#                logContracts.required not matched: cadence=48883481.632992939
#              THE ISOLATION IS THE POINT: the other nine required tokens still
#              matched, the three forbids still held, and every other verifier stayed
#              green -- analyzer PASS red=0, anomalySweep PASS hits=[], logValidate
#              PASS, driverValidity PASS, saveParse REPORT (recordings 6, pointsTotal
#              1685, unparsed 0), unityExceptions REPORT total=0. The corruption target
#              was a MEASURED digit rather than a derivable constant: inverting one of
#              those would have proven only that a constant is a constant.
#              REVERT CONFIRMED `2026-08-13_0116`: PASS attempt 1, wall 48 s,
#              expectations mismatches=0, anomalySweep hits=[], analyzer red=0,
#              saveParse REPORT identical (recordings 6, pointsTotal 1685), so the
#              branch is left proven-green. Its unityExceptions read REPORT total=1,
#              one stock NullReferenceException -- report-only, unarmed, and inside the
#              same non-identical facet recorded below. (V9's `_0257` and V10's `_0339`
#              are the precedents.)
#
# ONE NON-IDENTICAL FACET, recorded so nobody re-discovers it as a surprise:
# `unityExceptions` read total 0 on `_0053` and 2 NullReferenceExceptions on `_0055`.
# Both REPORT-ONLY, neither Parsek-authored, and this spec declares no
# `[expectations.unityExceptions]` block -- so it is a reading, not a gate, and it is
# NOT armed. Everything the flight DECIDED was identical.
#
# renderComposition ARMING LEDGER (M-A7 Phase 3C, WAVE A - added 2026-08-26).
#   POSTURE  DECLARED BARE. NOTHING IS ARMED AND NOTHING GATES. The block's only job today
#            is to EXIST: declaring it sets `PARSEK_RENDER_MANIFEST=1` at launch, which arms
#            the C# recorder at Awake, and one `ExportRenderManifest` step immediately before
#            the teardown takes the manifest at a chosen instant.
#   TRACERS  all three (`ghostRenderTracing` / `mapRenderTracing` / `verboseLogging`)
#            were ALREADY armed by this lane, so the declaration changes NO anomaly
#            exposure and the manifest's seam capture (all of it
#            `MapRenderTrace.IsEnabled`-gated) is live from the first flight.
#   READING  PENDING. Wave B accumulates readings FOR FREE off the normal tier cadence -
#            every flight of a declared lane writes facets into its results JSON. Windows get
#            written FROM those facets at arming, by operator decision, on the established
#            three-run discipline (reading -> armed re-flight -> negative control).
#   S4.1     Nothing in the flown shape moved: no step, no jump UT, no budget and no
#            existing expectation was touched. The additions are the export step and the
#            bare block; no existing step changed.
#   NOTE     EXPECT A THIN READING, for V9's reason (quits ~1 s after
#            StartLoopPlayback): an arm-only baseline on the Eeloo fixture, not a dwell.
# =====================================================================================
tier = "operator"
description = "ARMED: the player loop workflow on the Eeloo program's committed recording -- mark the B21 tree a loop unit and start loop playback. Flown twice green 2026-08-13 (`_0053`/`_0055`, byte-identical on every measured token), and now the regression floor for a healthy ENGAGED reading at the program's deepest span>synodic ratio: the unit classifies ENGAGED re-aim Kerbin->Eeloo via Sun on a 20-segment member, its cadence 48,883,481.633 is EXACTLY 5x the 9,776,696.327 s synodic (raw span 47,036,720 = 4.8111 synodic, Ceiling 5, against Dres's and Eve's multiple 2), and the loiter compressor cuts the 5.09M s LKO ejection wait for 10.8% of the span (tof 41.84M s = 89.0%) -- against 41.4% at Dres on a span 2.31x smaller, so the compressor's purchase shrinks as the coast lengthens rather than the composition inverting (Dres was tof-majority too, 58.3%). Count pinned at the measured 6."
instanceProfile = "stock-minimal"
tags = ["V12", "eeloo", "loop", "playback", "flown", "reaim", "engaged"]

[fixture]
# B21's green flight `2026-08-12_2239`, harvested --keep-parsek (see the fixture's
# provenance block in harness/lib/test_saveparse.py). One committed tree, five
# recordings, main orbiter terminal Orbiting at Eeloo.
saveTemplate       = "fixtures/saves/eeloo-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

# `steps` MUST stay in the [driver] table (there is no missionParams sub-table here,
# but the placement rule is the same one every spec follows).
#
# THE STUB-KILL TRIPLE (steps 2-4) is not optional bookkeeping: the fixture's own
# parked craft is the active vessel, so entering FLIGHT starts a scene-entry
# recording. Left alive it becomes a sixth recording and a second tree, which would
# both pollute the count and give the loop machinery an active tree to argue with.
# StopRecording + DiscardTree + autoRecordOnLaunch=false is the V8/V9 shape verbatim.
#
# The three tracers are what made this a reading run, and they are KEPT now that it is
# armed: ghostRenderTracing and mapRenderTracing emit the per-ghost render truth,
# verboseLogging opens the classify / schedule / synth / census lines. verboseLogging is
# LOAD-BEARING -- every [ReaimDiag] / [ReaimSeam] line is Verbose, so six of the ten
# armed tokens vanish without it and the lane would red on its own configuration.
#
# THE TREE GUID IS THE ONE THING THAT CANNOT BE COPIED FROM V9. Both MissionConfig and
# StartLoopPlayback take a tree id, and a STALE id makes this lane VACUOUS RATHER THAN
# RED: both seam verbs answer OK-with-nothing-to-do, zero [ReaimDiag] lines are
# emitted, and the run goes green having proved nothing. The id below was read off the
# committed fixture's own persistent.sfs RECORDING_TREE node
# (d4ce5c45adae4f3e89c4ac6bbec6b167, rootRecordingId 20d890f9...), the same read that
# fills the RECORDED_FIXTURES facets. V9's f0c17a69... belongs to the DRES fixture.
# THE STRUCTURAL GUARD IS NOW LIVE: `ENGAGED re-aim Kerbin->Eeloo via Sun` is armed
# below, and it is a PRODUCT token a vacuous run cannot produce.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig",     args = { tree = "d4ce5c45adae4f3e89c4ac6bbec6b167", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "d4ce5c45adae4f3e89c4ac6bbec6b167" }, expect = "OK", budget = 300 },
  # M-A7 RENDER-COMPOSITION CAPTURE (Phase 3C, Wave A, 2026-08-26). PLACEMENT IS THE
  # ARGUMENT and it is pinned by `test_every_declarer_exports_immediately_before_teardown`:
  # the recorder accumulates from Awake, so the only thing placement decides is how much of
  # this lane's observation is already inside the exported file - and taking it HERE takes it
  # at a chosen instant rather than leaving the composition to the scene-exit auto-flush that
  # follows `FlushAndQuit`.
  # INERT by construction (`hlib.SEAM_VERB_TAIL_ROLE["ExportRenderManifest"]` = inert): an
  # in-memory read of the recorder plus one file write in the KSP root, touching no vessel, no
  # save and no Parsek persisted state - so it cannot perturb anything this lane already gates
  # on.
  { cmd = "ExportRenderManifest",                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# NOTHING CLAIMED. The lane's value is the measurement and the regression floor, not
# coverage cells -- V9 and V10 make the same call for the same shape.
[dimensionsCovered]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header or TOML scopes it into the sub-table.
#
# EMPTY, and it STAYS empty now that the lane is armed: both green runs swept clean
# (`anomalySweep hits=[] counts={}`), so there is nothing to exempt, and an exemption
# authored anyway would discard the next real raise. If a Tier-C detector fires, the
# run reds and the red is the finding -- the V8 precedent, where two line-blink reds
# were filed as a detector gap rather than exempted.
allowedAnomalies = []

[expectations.recordings]
# PINNED AT THE MEASURED 6 (2026-08-13), from two consecutive runs that both read 6:
# THE FIXTURE'S 5 PLUS ONE DETERMINISTIC LOAD-TIME SPLIT, and the split is identified
# rather than inferred. On both runs the load-time optimizer split the MAIN recording
# 20d890f9f34b466fb8be07d83103a9a7 ('Duna Rocket') at
#
#     splitUT = 224.5398880005275   (Optimizer: PersistedPhaseChange, sec=4,
#                                    prev=Atmospheric next=ExoBallistic)
#
# into 'surface' [26.220 .. 224.540] = 227 pts / 4 sections and 'exo'
# [224.540 .. 47,036,743.944] = 1,275 pts / 54 sections. That is the ORDINARY ASCENT
# BOUNDARY, the same "+1" V6M, V8 and V9 all record -- `Optimization pass: split 1
# recording(s)` -- and the other candidate, on the exo half, was rule-3 suppressed
# (`exoCoastBodyChangeKept=2`), which is V9's cohesion fix holding at Eeloo scale.
# The arithmetic checks out on the saveParse side too: the fixture's 1,684 points
# become 1,685 (the split duplicates its boundary point), largest drops 1,501 -> 1,275,
# and every structural facet is unchanged (trees 1, committedTrees 1, terminalStates
# {Orbiting 3, Destroyed 2}, branchPoints {JointBreak 3}, smallest 21, unparsed 0).
#
# THE EXO HALF'S RECORDING ID IS NOT PINNABLE and is deliberately not quoted as a fact:
# it is freshly generated per run (80544d95... on `_0053`, f70cbb5c... on `_0055`). The
# split UT, the two point counts and the resulting total are what reproduce.
#
# DO NOT WIDEN. A 7 means a second split appeared -- most likely the cohesion regressing
# at the Kerbin->Sun handoff, which is what V9's forbids below also watch. A 5 means the
# ascent split stopped happening. An 8 means a scene-entry promotion survived the kill
# triple. All three are findings, and a widened window would hide every one of them.
count = { min = 6, max = 6 }

[expectations.logContracts]
# ARMED 2026-08-13 on the two-consecutive-runs discipline: every token below was
# measured BYTE-IDENTICAL on `_0053` and `_0055`, and each one was verified by
# re.search against both collected KSP.logs before being written here (these patterns
# are regexes applied with re.search, not literals).
#
# WHAT IS ARMED:
#   * PLUMBING -- facts about whether the LANE RAN, not about what the product decided.
#     MissionConfig (the seam verb was accepted), StartLoopPlayback (loop playback
#     actually started), Recording stopped (the stub-kill triple fired,
#     FlightRecorder.cs:8004).
#   * CLASSIFICATION -- the ENGAGED verdict naming the route, plus the member topology
#     behind it (`supported=True target=Eeloo` on a 20-segment member). This is also
#     the ANTI-VACUITY guard described in the steps block: a stale tree id passes both
#     seam verbs while emitting none of these lines.
#   * SCHEDULE -- cadence 48,883,481.632992938 is EXACTLY 5x the synodic
#     9,776,696.3265985884. The exact digits are pinnable ONLY because they were
#     measured: the planner feeds TransferWindowMath.SynodicPeriodSeconds from KSP's
#     LIVE `orbit.period`, so an ideal-SMA derivation misses them (at Dres the
#     derivation gave 11,392,903.2808 against the emitted 11392903.305957612 -- right
#     to ~9 significant figures and WRONG as a substring). A change to either number
#     means the schedule moved.
#   * LOITER + RATIO -- `loiterCuts=1 cutSeconds=5086416` (the LKO ejection-window
#     wait, compressed) and `compressedSpan=41950304/47036720`, which is the 10.8%
#     cut-fraction measurement in a single token. V9 arms the cut alone; the ratio is
#     armed beside it here because the compressor's purchase on the span -- 10.8%
#     against Dres's 41.4% -- is the thing this deep-coast unit measures that Dres's
#     could not, and a change to either end of the fraction moves it.
#
# WHAT IS DELIBERATELY NOT ARMED, each for the reason stated in the readings block
# above: the tilt disposition and the tof band (structurally unreachable from this lane
# -- V12A is the lane that reaches them), the seam-endpoint census (never runs, for the
# same reason), the descent-trigger decline, PhaseLock's `UnsupportedCrossParent`
# (normal for a cross-parent unit, never part of any defect), `[expectations.rewind]`,
# `[expectations.recordings.structure]`, `[expectations.unityExceptions]`, and any
# anomaly ceiling.
required = [
  "MissionConfig",
  "StartLoopPlayback",
  "Recording stopped",
  # Classification: the ENGAGED verdict and the member topology behind it.
  "member#1 segs=20 startBody=Kerbin supported=True target=Eeloo",
  "transferMemberSegs=20 plan.Supported=True",
  "ENGAGED re-aim Kerbin->Eeloo via Sun",
  # Schedule: cadence == 5x synodic, to the digit.
  "synodic=9776696.3265985884",
  "cadence=48883481.632992938",
  # Loiter compression of the LKO ejection-window wait, and the 10.8% cut fraction.
  "loiterCuts=1 cutSeconds=5086416",
  "compressedSpan=41950304/47036720",
]
# The ERROR floor every committed spec carries, PLUS V9's two decline reasons. Those
# two are the POST-FIX REGRESSION FLOOR, and they are legitimate here only now: on an
# unmeasured fixture a decline is a legitimate READING, but this fixture has been
# measured twice and reads ENGAGED, so a decline is henceforth a regression. Forbidding
# them is the sharp end of the floor -- if the transfer cohesion ever breaks at Eeloo,
# the lane reds on the product's own words rather than on a count that could drift for
# other reasons. Both were confirmed ABSENT from both green logs.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "no member yields a re-aim transfer",
  "not re-aim \\(no member yields a re-aim transfer\\); faithful",
]

[expectations.renderComposition]
# M-A7 Phase 3C, WAVE A - DECLARED 2026-08-26, BARE ON PURPOSE: no `gating`, no window, no
# list. Declaring is what sets `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder
# at Awake, and `rendercompose` then records its facets UNCONDITIONALLY on a parseable
# manifest - which is how a lane earns its first honest window off a green report-only run.
# A window written today would be a PREDICTION read back as though it were a measurement,
# the mistake V14M, V8 and V6M all shipped bare through their reading runs to avoid.
# READING PENDING - see the renderComposition arming ledger in this file's header.

[runtime]
# V8/V9's 2,400 for the same seam-driven shape, and the two green runs justify it
# rather than merely inherit it: this lane has no flight -- a LoadGame, eight fast seam
# verbs and a quit -- and MEASURED 48 s and 49 s wall, dominated by the KSP boot and
# the fixture load. Left at 2,400 deliberately; a budget sized to a 49 s observation
# would red on a slow boot rather than on a defect.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
