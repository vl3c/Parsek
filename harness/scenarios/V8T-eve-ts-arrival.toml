schema = 1
id = "V8T-eve-ts-arrival"
tier = "operator"
instanceProfile = "stock-minimal"
tags = ["V8T", "tracking-station", "loop-arrival", "interplanetary", "reaim",
        "eve", "inward-transfer", "reading-iteration"]

[fixture]
saveTemplate       = "fixtures/saves/eve-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig", args = { tree = "16af6b5e546a4bef86fcd8cde1ddc924", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "16af6b5e546a4bef86fcd8cde1ddc924" }, expect = "OK", budget = 300 },
  # One jump to the post-seam Eve-framed arrival epoch (V8's third
  # arrival-bracket point). A single jump cannot form a line-blink toggle
  # pair (see V8's LINE-BLINK-JUMP-STRADDLE note), so no pacing spacers are
  # needed here.
  { cmd = "TimeJump", args = { ut = "30360400" }, expect = "OK", budget = 300 },
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "trackstation" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# D14 eve is claimed AS OF THE ARMING REVISION, gated by the required
# body=Eve TS GhostCreated token below (the V6T pattern).
[dimensionsCovered]
D14 = ["eve", "scene-ts", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# PINNED AT EXACTLY 9, measured on the reading run (observed count 9): the
# fixture's 8 + the load-time optimizer split, and the double-entry stub
# path left nothing behind. A 10 means a second-entry stub survived; an 8
# means the split stopped. Both are findings.
count = { min = 9, max = 9 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "ENGAGED re-aim Kerbin->Eve via Sun",
  "loadgame trackstation route: booting to TRACKSTATION save=",
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  "ParsekTrackingStation initialized: created [1-9][0-9]* ghost vessel\\(s\\)",
  "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Eve scene=TRACKSTATION",
  # RE-PINNED AFTER THE TILT-RETENTION FIX (plan: docs/dev/plans/
  # reaim-inclined-target-tilt-retention.md): the tilt-declined faithful
  # chain (reaimed=False, phases=15) became a genuinely re-aimed chain
  # (reaimed=True, phases=11) on the fixed DLL - baseline flights
  # 2026-08-11 red on exactly this token, live line carrying reaimed=True.
  # V5's Duna form restored, now for the honest reason.
  "factory chain rec=\\w+ idx=\\d+ inst=\\d+ phases=\\d+ reaimed=True",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "timejump refused reason=backward-jump",
  "FORCED FAITHFUL",
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
  # The inverted pre-fix shape: a faithful fallback re-appearing on this
  # ENGAGED unit is the closed defect returning.
  "faithful this window",
  "reaim window fell back faithful",
]

# ARMED off the _0836 reading measurements (all-zero rewind facets,
# committedTrees 1, trees 1); windows follow the corpus shape - the rewind
# triple at max 0, committedTrees {1,1}, trees kept at the documented
# duplicate-writer width {1,2}. Negative control shared with V8's _0830
# (see the ARMING LEDGER).
[expectations.rewind]
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
gating = true
committedTrees = { min = 1, max = 1 }
trees          = { min = 1, max = 2 }

[runtime]
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
