#   * TS host: `ParsekTrackingStation initialized: created 1 ghost
#     vessel(s)` - the anti-vacuity gate, V5's form.
#   * THE EVE-FRAMED INBOUND IS REAL: `phase=GhostCreated surface=ProtoIcon
