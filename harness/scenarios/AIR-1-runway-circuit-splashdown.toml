schema = 1
id = "AIR-1-runway-circuit-splashdown"
# =====================================================================================
# AIR-1: THE FIRST LANE THAT FLIES A PLANE. AUTHORED 2026-11-16; FIRST AND SECOND FLIGHTS
# 2026-11-16 DRIVER-INVALID ON THE TAKEOFF, THIRD FLIGHT TOOK OFF AND WAS LOST AT THE
# AUTOPILOT HAND-OVER (below); THE AUTOPILOT RETIRED, FLIGHT CONTROL ON RAW INPUTS.
# LIVE-PROVEN 2026-11-16 on the fourth flight (run 2026-11-16_2218, PASS attempt 1, 465 s),
# harvested as `air-circuit-recorded`.
# Todo NEXT-TESTS-TO-BUILD-2026-11-11 item 3 ("no lane flies a plane; BAY-1's never
# moves"). This lane is the forge half: it records and commits a real atmospheric
# flight from the Runway, and its harvest is the fixture `air-circuit-recorded` that
# AIR-2-runway-circuit-ksc-ghost replays at the Space Center.
#
# THE ROAD.
#   1. MISSION `air1_runway_circuit` (kRPC, raw inputs, NO AutoPilot): roll the stock KSP
#      1.12 `Mallard` out onto the Runway (the craft BAY-1 already proved there, in this
#      fixture's Ships/VAB), stage it where it stands with brakes on and throttle zero
#      (Parsek's first-staging-on-the-pad trigger: a runway rollout IS PRELAUNCH, so
#      `Auto-record started (first staging on pad` opens the recording, exactly BAY-1's
#      path), wait recordSettleFrames, release the brakes at full throttle with the
#      AutoPilot OFF, steer the nose wheel along the runway heading (090) captured at
#      ARM, rotate at rotateSpeed on the ELEVATOR alone (control.pitch toward
#      rotatePitch, the nose wheel still steering), call it airborne after three
#      consecutive climbing FLYING frames above 10 m, fly on from there with the
#      mission's own attitude loops on the elevator and ailerons (no AutoPilot, no
#      SAS), climb straight out at climbPitch, raise the
#      gear at 60 m, and at turnAltitude start a circuit, turning by banking: waypoint A ~6 km out east over
#      the sea, B north of it, C back west north of the Space Center, climbing to and
#      holding cruiseAltitude. After C it turns back east and glides down a 6 deg slope
#      toward the touchdown point in the sea east of KSC, flares at flareAltitude (wings
#      level, throttle zero), splashes down, brakes, and waits until the surface speed
#      stays under 1 m/s.
#   2. SEAM: StopRecording, CommitTree, StopRecording (CommitTree re-adopts a recorder on
#      the still-active vessel, H58 flight 1), FlushAndQuit. The produced save holds the
#      committed tree and the Mallard at rest in the sea: the harvest.
#
# WHY A SPLASHDOWN, NOT A RUNWAY LANDING. A runway landing needs a precise lateral
# line-up on a 70 m wide strip from a poll-rate (0.5 s) outer loop, with a 2.4 km
# runway and an overrun into buildings or the slope beyond; a miss reads as a crash
# that proves nothing about Parsek. The Mallard is a seaplane (hull, float-capable),
# and the sea east of KSC is open water: the final is flown EASTBOUND, away from land,
# so an overshoot only lands further out at sea, and a short landing still lands in
# water past the coastline (the touchdown point is ~7 km east of the pad; EVA-4's
# splash at lat 0.342 lon -74.201 is the nearest water a committed lane has proven).
# The gear stays UP for the touchdown (raised at 60 m on the climb-out): the hull
# lands. A sea landing also exercises the recorder's Splashed terminal, which no plane
# has ever produced. The terminal gate accepts Landed too (a touchdown on a beach or a
# sandbar), so the lane stays valid if the coastline is not where it is assumed.
#
# WHAT IT GATES (logContracts; every line is from a FRESH recording, not a promotion):
#   - `Auto-record started (first staging on pad`: the recording opened on the stage
#     click on the Runway;
#   - `Start location captured: ... situation=Prelaunch, launchSite=Runway`: the
#     recording names the Runway as its launch site (Verbose, Recorder);
#   - `TrackSection started: env=Atmospheric`: the recording has Atmospheric sections
#     (no committed lane has recorded powered atmospheric flight that did not come
#     from a rocket);
#   - `FinalizeTreeRecordings: ... vessel='Mallard' ... terminal=Splashed|Landed`: the
#     committed recording ends on the surface (Verbose, Flight);
#   - `committree committed=true`.
# FORBIDDEN: a Mallard recording finalized Destroyed, and any Parsek ERROR.
#
# THE OPTIMIZER. A Runway start is a launch-site start, so rule 5b keeps the takeoff
# roll inside the first recording; the surface arrival at the splashdown may split off
# a short Surface tail: up to 3 Mallard recordings. THE GATING COUNT IS {1, 40}, NOT
# {1, 3}: a splashdown that snaps a fin or a control surface off adds a debris recording
# per piece, which is a flying outcome, not a Parsek defect, and must not read as
# PARSEK-FAIL(expectation). 40 = the 3 Mallard recordings plus one per part that can
# break off the 38-part craft (37). The Mallard's OWN recording is gated by the log
# contracts below (its FinalizeTreeRecordings line must end Splashed or Landed, never
# Destroyed); the report-only structure block records what actually happened, for the
# hand-over to pin.
#
# THE FIRST FLIGHT (2026-11-16_1955 and its retry _1956_a2, PC, gs1-two-stage-pad; the two
# rolls read the same within a few tenths of a degree; diagnostics on branch
# forge-logs-2026-11-16-air1). Rollout, the stage click and the auto-record start were fine
# (the first throttle readback was 0 under a just-engaged AutoPilot; the next frame read
# 1.0). The roll accelerated 2.5-3.7 m/s^2 (0.37 -> 21.1 m/s over 8.2 s, 21.1 -> 39.9 over
# 5.1 s) under the AutoPilot holding pitch 0.5 / heading 090 / roll 0. From ~17 m/s the heading wandered LEFT and diverged
# with the wings level (roll under 2 deg): 89.7 at 17.4 m/s, 88.9 at 21.1, 86.4 at 28.6,
# 84.0 at 32.4, 79.4 at 36.2, 71.9 at 39.9, 62.2 at 43.4. It left the runway's north edge
# at ~43 m/s, below the 60 m/s rotate, ~300 m from brake release; there, still at 0.3-0.5
# deg of pitch, it rose off the ground (alt 3.13 -> 3.91 at 43.4 m/s, FLYING at 5.5 m and
# 47 m/s), hit the ground, bounced, and one FLYING frame at 10.6 m (vs +1.1) between two
# LANDED frames passed the one-frame airborne check; the CLIMB's surface check then gave up
# (MISSION-FLAKE, driver-INVALID). The retry cartwheeled.
# WHAT CHANGED (mlib.air_decide, todo NEXT-TESTS-TO-BUILD-2026-11-11 item 3):
#   - The AutoPilot steers yaw / pitch / roll but never the nose wheel. The ground roll now
#     runs with it DISENGAGED (elevator neutral; SAS read 0 on every frame already) and
#     steers `control.wheel_steering` from the heading error to the ARM heading,
#     proportional (groundSteerGain 0.1 per deg) plus damping, clamped at 0.5. Sign: the
#     pinned kRPC 0.5.4 client documents +1 as a LEFT turn (groundSteerSign = +1); the
#     machine flips it once if the error grows on three straight frames under a corrective
#     command (evidence: airborne.groundSteerFlipped).
#   - Past groundHeadingAbortDeg = 8 deg on the ground it gives up by name ("heading drift
#     on the ground roll"), throttle cut, brakes on: the first flight crossed 8 deg at
#     36 m/s, while still on the runway.
#   - rotateSpeed 60 -> 45: the plane was already lifting at near-zero pitch at 43-47 m/s,
#     so rotating to 8 deg at 45 lifts it before the 60 the spec guessed, ~350 m into the
#     2.4 km runway at the measured acceleration.
#   - "Airborne" is 3 consecutive frames FLYING, at or above 10 m and climbing at 0.5 m/s
#     or more; the first flight's bounce cannot pass it.
#   - ARM refuses to stage a craft that reads |roll| > 10 deg standing on the runway (every
#     roll target assumes level reads 0; the first flight read 0.05).
#   - The bank-sign check judges the GROUND TRACK (bearing between successive positions)
#     rather than the nose, which the AutoPilot yaws toward the target even while a wrong
#     bank slips the plane away from it.
#
# THE SECOND FLIGHT (2026-11-16_2033 and its retry _2034_a2, PC, automation DLL sha256
# 54f8f221 from 3e0a0e5e; the two read the same within a few hundredths; diagnostics on
# branch forge-logs-2026-11-16-air1b). The nose-wheel roll WORKED: heading 090.3-090.5 and
# roll 0.05 from brake release through 25 m/s to 46.9 m/s (max ground heading error under
# 0.1 deg; the wheel never needed a command past the dead band). At the 45 m/s rotate the
# AutoPilot engaged (pitch 8 / heading 090.5 / roll 0) and the wheel was released: the
# pitch rose only 0.44 -> 0.55 -> 0.84 -> 2.5 deg over 1.5 s (its pointing error 7.5 ->
# 7.7 -> 10.3 deg, consistent with the AutoPilot's rate-limited ramp, never near the 8 deg
# target), the plane stayed LANDED (alt 3.15 -> 3.23 m), the heading swung LEFT 90.5 ->
# 87.6 -> 81.9 within one second, and the ground guard gave up at 52.3 m/s, 355 m from
# brake release (MISSION-FLAKE, driver-INVALID; the retry read the same). The first
# flight had lifted off by itself around 43-47 m/s at ~0.4 deg of pitch, so lift-off is
# close. The abort's throttle cut logged "set_throttle 0.00 did not stick (readback
# 1.00)": not another controller (no MechJeb in this mission, kRPC's AutoPilot has no
# throttle, and the runner has no throttle-hold loop), but the readback straight after a
# set, which returns the PREVIOUS physics tick's value - the brake-release set read 0.00
# the same way on every flight and the next frame read 1.00.
# WHAT CHANGED (harness only, mlib.air_decide + mission_runner):
#   - The rotation is flown on the elevator: from rotateSpeed the machine sets
#     control.pitch from the pitch error (0.08 per deg, minus 0.04 per deg/s of pitch
#     rate, clamped at 0.6), the AutoPilot stays OFF, and the nose wheel keeps steering
#     (and the ground guard keeps measuring) until airborne is sustained; only then is
#     the elevator neutralised and the AutoPilot engaged for the climb. rotatePitch stays
#     8: the AutoPilot never held more than 2.5 deg, so the flight cannot say 8 is too
#     little. The elevator sign (rotatePitchSign, +1 = nose up) is unverified offline;
#     the machine flips it once if the pitch falls on two straight frames under a
#     nose-up command (evidence: airborne.rotatePitchFlipped / rotatePitchConfirmed).
#   - A take-off give-up sends the throttle cut, the brakes, an AutoPilot disengage and
#     neutral wheel / elevator, then re-sends the cut each frame until the telemetry
#     reads it (at most 6 frames) and names the readback in the flake reason.
#   - The runner's throttle readback waits one physics tick before judging, re-asserts
#     once, and warns only when the value still does not stick (naming all three reads).
#
# THE THIRD FLIGHT (2026-11-16_2126 and its retry _2128_a2, PC, the two within a degree
# of each other; diagnostics on branch forge-logs-2026-11-16-air1c, the mission stdout
# telemetry read for this entry). THE TAKEOFF WORKED: the nose wheel held the centreline
# (heading 090.33-090.38), the elevator rotated at 45 m/s (0.6, tapering 0.559 / 0.444 /
# 0.282 / 0.111 / 0.180 / 0.156 / 0.110 as the pitch rose 0.5 -> 4.9 -> 6.7 deg with no
# overshoot; rotatePitchSign +1 confirmed), lift-off at 64 m/s, and three climbing FLYING
# frames to 16.9 m at 73 m/s (vs +5.8). From lift-off to the hand-over, with no aileron,
# no rudder and SAS off, the roll stayed 0.03 .. 0.08 deg and the heading moved under
# 0.05 deg (090.35 .. 090.38; the retry 090.55 .. 090.57).
# At 58.78 the AutoPilot engaged (pitch 10 / heading 090 / roll 0, roll threshold widened
# to 180) and rolled the Mallard LEFT at once: 59.30 roll -2.0 heading 089.6, 60.28 roll
# -37.9 heading 072.6 (alt 27.9, the highest 38.7 m a second later), 61.28 roll -100 pitch
# -18, 62.32 inverted (roll 177), the vessel lost at UT ~64 (MISSION-ASSERT-FAIL
# vessel-lost in CLIMB, driver-INVALID, no Parsek verdict). The retry read the same
# within a degree (roll -2.0, -40.1, -106.0, 170.9). kRPC's AutoPilot, at its default
# tuning, cannot hold this airframe.
# WHAT CHANGED (harness only, mlib.air_decide + mission_runner):
#   - The AutoPilot is not engaged anywhere in AIR-1 (no ACTION_AP_* left in the machine;
#     an AST cell pins it). From lift-off every phase flies RAW inputs (``_air_attitude``):
#     control.pitch from a pitch-error P-D loop, the rotation's own law and gains (0.08 per
#     deg, minus 0.04 per deg/s of pitch rate) capped at 0.4, so the elevator simply carries
#     on from the rotation with no hand-over transient; control.roll from a bank-error P-D
#     loop (0.012 per deg, minus 0.004 per deg/s of roll rate, capped at 0.25), modest for a
#     0.5 s loop: stable for an aileron authority up to ~140 deg/s at full input, and the
#     AutoPilot's own roll above (36, then 62 deg/s) puts the Mallard's near 60.
#   - Heading changes by banking: the bank target is 1 deg per deg of heading error to the
#     bearing, at most maxBank (25; 10 below 150 m; 5 on the straight climb-out, which
#     holds the ARM heading), wings level in the flare; the pitch target rises 0.1 deg per
#     deg of bank (25 deg -> +2.5) for the extra lift a turn needs. The rudder stays
#     neutral: the hands-off frames show no yaw motion to damp.
#   - SAS stays OFF. The airframe held roll and heading hands-off with SAS off, and stock
#     SAS releases an axis while it carries pilot input and re-latches when the input
#     returns to zero, which would fight a continuous loop; the loop's rate terms damp.
#   - The aileron sign (new param rollInputSign, +1 = a positive control.roll raises the
#     roll reading) is self-checked: confirmed on a 1.5 deg response the commanded way,
#     flipped once on two frames of opposite response that are not the arrest of a roll
#     already under way (evidence: circuitFlown.rollSignFlipped / rollSignConfirmed). The
#     READING's sign is known: roll -38 came with the heading falling 090 -> 072, so a
#     negative roll is a left bank and bankSign +1 is right.
#   - Touchdown and every take-off give-up neutralise the elevator and ailerons.
#
# THE FOURTH FLIGHT (2026-11-16_2218, PC, automation DLL sha256 prefix 118b45ac from
# d15595d4; diagnostics on branch forge-logs-2026-11-16-air1d): PASS on the first attempt,
# 465 s. The Mallard took off from the Runway on the raw elevator / aileron loops, flew the
# three-waypoint left circuit at about 1,030 m (25 deg bank), glided east and splashed down
# near lat 0.055 lon -73.70: terminal=Splashed, `committree committed=true`, zero gear
# RoboticMotion lines. The glide came out at about 8.6 deg rather than the planned 6
# (crossing the aim point at 120 m; cosmetic for this lane, todo
# AIR1-GLIDE-SLOPE-STEEPER-THAN-PLANNED). The optimizer split the flight into 2
# recordings at the splash (tree 'Mallard'); the runway run stayed whole (rule 5b). The
# report-only structure block read trees 1, committedTrees 1, recordings 2, terminal
# Splashed 1, Destroyed 0.
#
# NOT VERIFIED OFFLINE BEFORE THE FOURTH FLIGHT (that flight was the calibration reading):
#   - The aileron sign (rollInputSign, self-checked) and authority (the bank gains), and
#     the elevator loop at cruise speed (proven only to 73 m/s in the rotation).
#   - The Mallard's climb at 10 deg on two Wheesleys past 17 m.
#   - The coastline: whether (0.05, -73.85) is open water.
#
# THE HOST FIXTURE. gs1-two-stage-pad (BAY-1's host): its GS1 booster sits on the
# LAUNCH PAD, so a Runway rollout recovers nothing, and Bill / Bob are Available for
# the Mallard's default crew.
#
# HARVEST (done 2026-11-16 from run 2026-11-16_2218; the run's own snapshot, never the
# live save):
#   cd harness
#   python tools/harvest_bdock_station.py --save-dir results/<runId>_save
#       --target-name air-circuit-recorded --expect-situation SPLASHED,LANDED --keep-parsek
# `air-circuit-recorded` is registered in test_saveparse.RECORDED_FIXTURES and AIR-2 was
# handed over in the same commit.
# =====================================================================================
tier = "operator"  # calibration discipline: first three flights 2026-11-16 driver-INVALID (takeoff twice, then the AutoPilot hand-over); LIVE-PROVEN on the fourth (2026-11-16_2218)
description = "AUTHORED 2026-11-16; first flight driver-INVALID on the takeoff roll (heading drift under the AutoPilot), second flight held the runway on the nose wheel but lost it at the rotate (the AutoPilot's yaw), third flight took off on the elevator and was rolled inverted by the AutoPilot at the climb hand-over; the AutoPilot is retired and the whole flight is flown on the elevator and ailerons; LIVE-PROVEN 2026-11-16 on the fourth flight (run 2026-11-16_2218). The first lane that flies a plane: the stock Mallard rolls out on the Runway, stages in place (Parsek's first-staging auto-record trigger), takes off east, flies a three-waypoint circuit at 1000 m within 10 km of KSC, glides east to a splashdown in the sea, comes to rest, and the tree is committed. Gates a fresh recording with launchSite=Runway, Atmospheric sections and a Splashed (or Landed) terminal. Its harvest `air-circuit-recorded` feeds AIR-2's Space Center replay."
instanceProfile = "stock-minimal"
tags = ["AIR1", "aircraft", "runway", "atmospheric", "splashdown", "fixture-forge", "flown"]

[fixture]
saveTemplate       = "fixtures/saves/gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "air1_runway_circuit"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
# verboseLogging=true is load-bearing: Start location captured, TrackSection and
# FinalizeTreeRecordings are VERBOSE.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },      expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" },   expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },       expect = "OK" },
  # Every machine timeout fires inside this budget on a typical flight (~10 min wall);
  # the sum of the worst cases is longer, so a stuck leg names itself first.
  { phase = "mission",                                                            expect = "MISSION-OK", budget = 1800 },
  { cmd = "StopRecording",                                                        expect = "OK" },
  { cmd = "CommitTree",                                                           expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                        expect = "OK" },
  { cmd = "MissionMark",  args = { label = "air1-committed" },                    expect = "OK" },
  { cmd = "FlushAndQuit",                                                         expect = "OK" },
]

[driver.missionParams]
craftName          = "Mallard"
expectedVesselName = "Mallard"
launchSite         = "Runway"
recordSettleFrames = 8
rotateSpeed        = 45.0
rotatePitch        = 8.0
rotatePitchSign    = 1.0
takeoffMaxDistance = 1500.0
climbPitch         = 10.0
turnAltitude       = 300.0
cruiseAltitude     = 1000.0
cruiseSpeed        = 90.0
waypoints          = "-0.05,-74.05;0.30,-74.05;0.30,-74.55"
captureRadius      = 800.0
legTimeoutSeconds  = 240.0
touchdownPoint     = "0.05,-73.85"
glideSlopeDeg      = 6.0
approachSpeed      = 60.0
flareAltitude      = 25.0
maxBank            = 25.0
bankSign           = 1.0
rollInputSign      = 1.0
groundSteerGain    = 0.1
groundSteerSign    = 1.0
groundHeadingAbortDeg = 8.0
stopSpeed          = 1.0
stopTimeoutSeconds = 240.0

[dimensionsCovered]
D1  = ["auto-record-launch"]
D4  = ["atmospheric"]
D14 = ["kerbin", "atmosphere", "warp-1x", "scene-flight", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# {1, 40}: see THE OPTIMIZER in the header (debris from a rough splashdown is not a defect).
count = { min = 1, max = 40 }

[expectations.recordings.structure]
# REPORT-ONLY until a reading run matches it; the first flight is that reading.
gating         = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 40 }
terminalStates = { Destroyed = { max = 0 } }
vesselNames    = { "Mallard" = { min = 1, max = 1 } }
recordingNames = { "Mallard" = { min = 1, max = 3 } }

[expectations.logContracts]
required  = ["Auto-record started \\(first staging on pad",
             "Start location captured: body=Kerbin, [^\\r\\n]*situation=Prelaunch, launchSite=Runway, ",
             "TrackSection started: env=Atmospheric ",
             "FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='Mallard' points=[1-9][0-9]* orbitSegs=0 terminal=(?:Splashed|Landed) ",
             "committree committed=true",
             "MISSIONMARK label=air1-committed "]
forbidden = ["\\[Parsek\\]\\[ERROR\\]",
             "FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='Mallard' [^\\r\\n]*terminal=Destroyed"]

[runtime]
# Boot ~300 + LoadGame 300 + mission 1800 + commit 120 + quit.
budgetSeconds = 2700

[retry]
policy = "once"

[expectedFail]
bugId = ""
