schema = 1
id = "RC-6-eva-cargo-from-foreign-container-rewind"
# =====================================================================================
# RC-6 (todo EVA-INVENTORY-MOVE-TO-FOREIGN-VESSEL-UNCLAIMED, fixed 2026-10-15 on
# `wip-eva-inventory-claim`, never flown): an EVA kerbal takes a part out of a FOREIGN
# vessel's container, the flight is committed, then Rewind-to-Launch. The foreign vessel
# must join the kerbal's tree as a member, replay as a ghost after the rewind, and spawn
# at its chain tip WITHOUT the part; the kerbal spawns WITH it. A part duplicated (on
# both) or lost (on neither) is the defect this lane exists to catch.
#
# HOST: `eva-construct-pad`, EVA-11's host (Kerbal X on the pad with Bill Kerman, an
# Engineer, aboard; a crewless `rover fuel 0`, pid 1871615455, LANDED 153 m away, 16
# parts). The rover's first ConformalStorageUnit holds an evaChute (about 1.4 m from the
# rover's root part); the second holds two evaScienceKits (one stacked slot) and a
# DeployedCentralStation.
#
# THE INVENTORY PATCH: Bill carries only an evaJetpack, so the evaChute he takes is the
# only chute anywhere and his spawn reads `[evaChute x1, evaJetpack x1]`.
#
# THE SEAM: `EvaGroundScience action=take part=evaChute` drives stock's own
# clear-then-store against the nearest loaded container holding the part (the take
# reaches GameSettings.EVA_INVENTORY_RANGE); `step anchor=<rover pid> distance=3` puts
# him within reach of a container 1.4 m off the root. An out-of-range refusal prints the
# measured distance and reds the lane before anything is recorded. The take's room check
# is stock's player-drop arithmetic (jetpack 17 L / 0.045 t + chute 10 L / 0.004 t of
# 40 L / 0.065 t): the first flight `2026-10-16_0650` was refused `over-capacity` by
# stock's public HasCapacity, which adds the kerbal's own mass instead of the part's.
#
# THE WALK AWAY: a second `step ... distance=15` before StopRecording. The first flight
# showed why: an EVA end spawn 2.4 m from the rover overlaps it (the kerbal's bounds plus
# 5 m padding) and a trajectory that only stood there leaves walkback nothing to walk
# back along, so the spawn is held, times out and never lands.
#
# THE SPAWN WITNESS (this lane's branch): both spawn lines in VesselSpawner
# (`Vessel respawned (...)` and `SpawnAtPosition: vessel spawned (...)`) now end with
# `VesselSnapshotOps.FormatStoredPartsForLog` of the spawn snapshot: `storedParts=0` or
# `storedParts=N [name xQ, ...]`, ordinal order.
#
# ACT 3 is EVA-11's flight reload: the rewind lands at the Space Center, SaveGame +
# LoadGame lands FLIGHT on Kerbal X (vessel 0), 153 m from the rover, so the chain walker,
# the ghoster and the tip spawn run in the flight scene, and 1x flight time crosses the
# member's EndUT. UT 50 is EVA-11's measured member EndUT (34.96) plus margin; this lane
# does one take and two steps (about 4 s each) instead of an attach and two detaches.
#
# THE MARKS read the committed store by position (rec0 / rec1), so the regexes find the
# member by its recording id from the join line and Bill by his spawned pid.
# =====================================================================================
tier = "nightly"
description = "RC-6: Bill Kerman takes the evaChute out of the crewless rover's storage unit on EVA, the flight commits with the rover as a member, then Rewind-to-Launch. After the rewind the rover is ghosted and spawns at its chain tip without the chute, and Bill spawns with it: the part is neither duplicated nor lost."
instanceProfile = "stock-minimal"
tags = ["eva", "inventory", "foreign-vessel", "ghost-chain", "rewind-to-launch", "RC-6"]

[fixture]
saveTemplate       = "fixtures/saves/eva-construct-pad"
injectedRecordings = "none"
craft              = []

[[fixture.crewInventory]]
kerbal    = "Bill Kerman"
inventory = "evaJetpack"

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnEva",    value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "EvaExit",    args = { kerbal = "Bill Kerman", release = "true" },  expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "1871615455", distance = "3" }, expect = "OK", budget = 120 },
  { cmd = "StartRecording",                                                  expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "EvaGroundScience", args = { action = "take", part = "evaChute" }, expect = "OK", budget = 120 },
  # Walk away before the recording ends, so Bill's end spawn clears the rover.
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "1871615455", distance = "15" }, expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "CommitTree",                                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c0", expect = "OK" },
  { cmd = "MissionMark", args = { label = "rc6-commit-count-${c0.count}" }, expect = "OK" },
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                expect = "OK", budget = 300 },
  { cmd = "SaveGame",   args = { name = "rc6-rewound" },                     expect = "OK", budget = 120 },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "rc6-rewound" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnEva",    value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "ListHandles", args = { kind = "chains" },    label = "ch", expect = "OK" },
  { cmd = "WarpToUT",   args = { ut = "50", maxRate = "1" },                 expect = "OK", budget = 200 },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c2", expect = "OK" },
  { cmd = "MissionMark", args = { label = "rc6-spawned-a-${c2.rec0}-${c2.rec0spawned}-${c2.rec0spawnedPid}-b-${c2.rec1}-${c2.rec1spawned}-${c2.rec1spawnedPid}-end" }, expect = "OK" },
  { cmd = "SaveGame",                                                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Bill's root and the rover member.
count = { min = 2, max = 2 }

[expectations.logContracts]
required = [
  "evaexit complete kerbal=Bill Kerman ",
  "evagroundscience step complete kerbal=Bill Kerman anchor=rover fuel 0 ",
  "evagroundscience take start kerbal=Bill Kerman part=evaChute source=[^\\r\\n]* sourcePart=ConformalStorageUnit sourceSlot=[0-9]+ [^\\r\\n]*inventory=0:evaJetpack ",
  "evagroundscience take complete part=evaChute [^\\r\\n]*sourceVesselPid=1871615455 ",
  # The rover joined Bill's tree on the take, as an inventory transfer out of it.
  "startrecording recordingId=([0-9a-f]+) already=false[\\s\\S]*Foreign inventory transfer: vessel joined the tree vesselPid=1871615455 name='rover fuel 0' rec=[0-9a-f]+ parentRec=\\1 bp=[0-9a-f]+ ut=[0-9.]+ event=PartRemoved details='inventory part=evaChute slot=[0-9]+ qty=0 container=[0-9]+' snapshot=True",
  "MISSIONMARK label=rc6-commit-count-2 ",
  "committree committed=true",
  "Foreign inventory transfer: vessel joined the tree vesselPid=1871615455 name='rover fuel 0' rec=([0-9a-f]+) [\\s\\S]*Chain built: vessel=1871615455 links=1 tip=\\1 ",
  "invokerewindtolaunch complete rec=[0-9a-f]{32} tree=[0-9a-f]{32} adjustedUT=",
  "Foreign inventory transfer: vessel joined the tree vesselPid=1871615455 name='rover fuel 0' rec=([0-9a-f]+) [\\s\\S]*invokerewindtolaunch complete [\\s\\S]*listhandles chain index=[0-9]+ pid=1871615455 links=1 trees=1 treeIds=[0-9a-f]{32} tip=\\1",
  # The rewind holds the rover back for its committed future (removed from the world, a
  # hold ghost in flight), then it spawns at its tip with 16 parts and without the chute:
  # the other storage unit's three parts only.
  "Rewind-to-Launch initiated to UT [\\s\\S]*\\[RewindHold\\] Rewind held vessel for its committed future: pid=1871615455 name='rover fuel 0' [^\\r\\n]*evidence=chain [^\\r\\n]*snapshot=yes",
  "invokerewindtolaunch complete [\\s\\S]*\\[Ghoster\\] Held vessel tracked without a live vessel: pid=1871615455 name=rover fuel 0[\\s\\S]*\\[Ghoster\\] Chain tip spawn: pid=1871615455 vessel=rover fuel 0 preserveIdentity=true [^\\r\\n]*parts=16",
  "invokerewindtolaunch complete [\\s\\S]*(?:Vessel respawned|SpawnAtPosition: vessel spawned) \\(sit=[A-Z_]+, pid=1871615455[,)][^\\r\\n]* storedParts=3 \\[DeployedCentralStation x1, evaScienceKit x2\\]",
  "invokerewindtolaunch complete [\\s\\S]*Chain tip spawn complete: #[0-9]+ \"rover fuel 0\" pid=1871615455",
  "Foreign inventory transfer: vessel joined the tree vesselPid=1871615455 name='rover fuel 0' rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=rc6-spawned-[^\\r\\n]*-\\1-true-1871615455-",
  # Bill spawns at his recording's end carrying the chute and his jetpack.
  "invokerewindtolaunch complete [\\s\\S]*(?:Vessel respawned|SpawnAtPosition: vessel spawned) \\(sit=[A-Z_]+, pid=([0-9]+)[,)][^\\r\\n]* storedParts=2 \\[evaChute x1, evaJetpack x1\\][\\s\\S]*MISSIONMARK label=rc6-spawned-[^\\r\\n]*-true-\\1-",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "evagroundscience failed",
  # The held rover is never a live vessel the ghoster hides.
  "\\[Ghoster\\] Vessel ghosted: pid=1871615455 ",
  "evagroundscience refused",
  "Foreign inventory transfer: no background recorder",
  "lost its member recording",
  "vessel joined the tree vesselPid=1871615455 [\\s\\S]*vessel joined the tree vesselPid=1871615455 ",
  "invokerewindtolaunch refused",
  "Stripping orphaned spawned vessel 'rover fuel 0'",
  "Chain tip spawn blocked by collision: #[0-9]+ \"rover fuel 0\"",
  "Chain tip spawn failed: #[0-9]+ \"rover fuel 0\"",
  "SpawnAtChainTip: spawn path returned pid=0",
  "Spawn RETIRED",
  "Spawn ABANDONED",
  "Spawn FAILED",
  "Chain tip spawn: pid=1871615455 [\\s\\S]*Chain tip spawn: pid=1871615455 ",
  # The chute duplicated onto a spawn, or still in the rover's.
  "storedParts=[0-9]+ \\[[^\\]\\r\\n]*evaChute x[2-9]",
  "pid=1871615455[,)][^\\r\\n]* storedParts=[0-9]+ \\[[^\\]\\r\\n]*evaChute",
]

[runtime]
# EVA-11's shape with fewer construction verbs: three deferred LoadGame / rewind steps at
# up to 660 s each plus the EVA verbs' own budgets. 1500 is EVA-11's measured-safe budget.
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
