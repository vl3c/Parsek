# Budget arithmetic: 300 LoadGame + 120 warp + 3 x (120 GoToEditor + 180 LaunchFromEditor)
# + 180 StartRecording + 120 warp + 120 CommitTree + 2 x 120 Recover + 60 KscAction + 300
# rewind + 120 EvaExit + 180 RevertToLaunch + 120 warp + 10 x 120 SaveGame + 540 RunTests
# = 4620; runtime 5600 adds the inert steps and FlushAndQuit.
steps = [
  # scene = "spacecenter": the host's three vessels are Mun debris (RW-1's boot).
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  # Clear of the fixture's last rows (185732-185734) and their 60 s rollout window.
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },

  # ---- flight H: Jeb's pad flight, recorded, committed, recovered (RW-1 verbatim) ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "h",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186000" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "Recover",        args = { pid = "${h.pid}" },                                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw2-h-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw02-01-after-h-commit" },                   expect = "OK", budget = 120 },

  # ---- the committed Space Center future: one untagged row ----
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "f1fb89dc-a471-42cf-94da-de4bb1080512" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw2-ksc-committed" },                        expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw02-02-after-ksc-accept" },                 expect = "OK", budget = 120 },

  # ---- the rewind to H's launch: Jeb re-reserved, his stand-in recreated ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw2-rewound" },                              expect = "OK" },
  # The rewind save carries the settings of H's recording start; both auto-records off so
  # nothing after the rewind records (the SurfaceEVA row must be untagged).
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw02-03-after-rtl" },                        expect = "OK", budget = 120 },

  # ---- row 13: the crewed relaunch seats the stand-in (before Jeb's hold ends) ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "r",             expect = "OK", budget = 180 },
  { cmd = "MissionMark",    args = { label = "rw2-launched" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw02-04-after-crewed-launch" },              expect = "OK", budget = 120 },

  # ---- row 14: an in-flight earning, then the stock revert ----
  # No release: the stand-in stays on the hatch ladder; the EVA itself is the world-first.
  { cmd = "EvaExit",                                                                       expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw2-eva" },                                  expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw02-05-after-eva" },                        expect = "OK", budget = 120 },
  { cmd = "RevertToLaunch",                                       label = "rv",            expect = "OK", budget = 180 },
  # inert-wait (STR-3): the post-load passes run on the first host ticks after onFlightReady.
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw2-reverted" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw02-06-after-revert" },                     expect = "OK", budget = 120 },

  # ---- the stand-in's experience: recover the reverted Flea before H's rows ----
  { cmd = "Recover",        args = { pid = "${rv.activePid}" },                            expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw2-standin-recovered" },                    expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw02-07-after-standin-recovery" },           expect = "OK", budget = 120 },

  # ---- the crossing in flight, then the save and the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "SaveGame",       args = { name = "rw02-08-before-crossing" },                  expect = "OK", budget = 120 },
  { cmd = "WarpToUT",       args = { ut = "186100" },                                      expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw2-crossed" },                              expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw02-09-after-crossing" },                   expect = "OK", budget = 120 },
  # The DEFAULT slot (persistent): the one a harvest reads; the named slots above are side files.
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

