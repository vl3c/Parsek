schema = 1
id = "RW-2-crewed-relaunch-revert"
# =====================================================================================
# RW-2: A CREWED RELAUNCH AND A STOCK REVERT INSIDE A REWOUND TIMELINE (the rewind ledger
# campaign, plan rows 13 "crewed launch after a rewind" and 14 "revert inside a rewound
# timeline").
#
# THE RULINGS UNDER TEST: a kerbal a committed flight holds is reserved; a relaunch after a
# Rewind-to-Launch seats his stand-in, and only the stand-in earns experience on it. A stock
# Revert to Launch removes only the rows the reverted flight wrote (owner ruling O2,
# game-actions design 3.13): the committed future a rewind left behind is kept.
#
# HOW THE LANE MAKES ITS PAST. RW-1's proven H verbatim: the Jumping Flea rolled out of the
# VAB, recorded on the pad, committed in flight and recovered. Stock seats Jebediah Kerman
# (RW-1 measured `crew=1` and `Stand-in generated: '...' (Pilot) for slot 'Jebediah Kerman'`
# on this host and craft), so H's KerbalAssignment row holds Jeb. A contract accept at the
# Space Center then adds one UNTAGGED committed-future row (RW-1's f1fb89dc, +37500): the
# row O2 must keep through the revert. H's own rows are tagged to H and the prune skips
# tagged rows, so only a Space Center row can test the keep.
#
# THE HOST. `cs-career-mun4`, as RW-1: Career, funds 157546.18, save UT 185734.04, roster
# Jeb Available, the Astronaut Complex at 0.5 (EVA allowed, `EVAIsPossible` needs > 0.2).
# Kerbin's ProgressTracking subtree is reached but carries no SurfaceEVA node, so the first
# EVA from a landed Kerbin vessel is a world-first stock pays (decompiled
# `KSPAchievements.SurfaceEVA.OnGoEVA`: `from.vessel.LandedOrSplashed`, home body, not yet
# complete -> Complete + AwardProgressStandard; WF-1 measured it from a PRELAUNCH pod).
#
# THE TIMELINE (UTs are the plan):
#   185800     WarpToUT at the Space Center, RW-1's reason (clear of the fixture's last rows).
#   H          VAB launch (rollout -2932), StartRecording, warp in flight to 186000, stop,
#              CommitTree, Recover on the pad (+2932). H's recovery XP row is tagged to H.
#   KSC        at ~186000: accept f1fb89dc (+37500), an untagged committed-future row.
#   rewind     InvokeRewindToLaunch tree=latest from the Space Center: clock ~185785.2 (H's
#              start minus 15 s). Jeb is re-reserved (RW-1: `Reservation re-reserved:
#              'Jebediah Kerman' endUT=185807.6`, H's recording END, the KSC-retirement
#              bound, not its 186000.2 recovery row) and his stand-in recreated.
#   row 13     The Flea from the VAB again (unrecorded; autoRecordOnEva off too): stock fills
#              the pod with Jeb, `CrewAutoAssignPatch` swaps him for the stand-in in the
#              manifest (WF-1 and KB-4 measured the swap on this load path), launch crew=1.
#   row 14     The stand-in EVAs onto the hatch ladder (no release): stock pays
#              Kerbin/SurfaceEVA, written at once as an UNTAGGED ledger row (no recorder:
#              `ShouldForwardDirectLedgerEvent` -> `OnKscSpending`). RevertToLaunch: stock
#              reloads the post-init state; `PruneRevertedFlightLedgerRows` removes the
#              untagged rows after the launch UT that the flight-entry set does not name
#              (the SurfaceEVA row) and keeps those it names (the accept).
#   XP         Recover the reverted Flea at once (~185787, before H's rows): stock archives
#              the STAND-IN's flight log (`ExperienceGained` for him). Jeb earns nothing in
#              this timeline until H's own KerbalExperience row crosses.
#   crossing   The Flea relaunched (the stand-in again: Jeb's hold runs to 185807.6),
#              WarpToUT 186100 in flight (SCI-1's live-proven shape; the in-flight Recover's
#              mission summary would hold the TIMEWARP lock at the Space Center, WF-1's
#              fourth flight): H's rows and the accept cross once each.
#   check      SaveGame to the default slot, LedgerGroundTruth in that FLIGHT scene.
#
# THE STEP SAVES (owner's ask, for after-flight bug hunting). `SaveGame name=<slot>` is a sync
# AnyScene verb (TestCommandDispatcher.cs:504) that writes the live game to
# `saves/<run save>/<slot>.sfs` through GamePersistence.SaveGame and answers `OK saved=<slot>`
# (TestCommandSaveGame.BuildPayload). Named slots are side files the harvest ignores; the
# last SaveGame writes the DEFAULT slot `persistent`, the one a harvest reads.
#   rw02-01-after-h-commit          Space Center, H committed and recovered (~186000)
#   rw02-02-after-ksc-accept        Space Center, the committed accept written
#   rw02-03-after-rtl               Space Center, rewound to ~185785, Jeb re-reserved
#   rw02-04-after-crewed-launch     FLIGHT, the stand-in's Flea on the pad
#   rw02-05-after-eva               FLIGHT, the stand-in on the ladder, SurfaceEVA row written
#   rw02-06-after-revert            FLIGHT, reverted to the launch, the row pruned
#   rw02-07-after-standin-recovery  Space Center, the stand-in's Flea recovered
#   rw02-08-before-crossing         FLIGHT, the check Flea on the pad, H's rows still ahead
#   rw02-09-after-crossing          FLIGHT at ~186100, every committed row crossed
#   persistent                      the same instant as rw02-09, the default slot
#
# DEPARTURES FROM THE PLAN (rw1-brief.md plan rows), each following the code:
#   - "XP goes only to the stand-in" holds on the ROSTER, not in the ledger: the stand-in's
#     recovery is of an unrecorded vessel, and `TryRecordRecoveryKerbalExperience` refuses a
#     null recording pick (`Recovery kerbal XP refused: ... reason=no-recovery-recording`,
#     LedgerOrchestrator.cs:7307, the fail-safe kept by design). So the lane gates stock's
#     capture (the `ExperienceGained` emit for the stand-in) and Jeb's absence from every
#     XP line after the rewind; the stand-in's ledger outcome is report-only, owed.
#   - "Revert (...): pruned N untagged" prints only when N > 0 (ParsekScenario.cs:4576), and
#     a pad flight writes no untagged row after its launch UT on its own: the rollout row and
#     stock's PostInitState share one frame (decompiled `FlightDriver.PostInit`:
#     OnVesselRollout.Fire then `PostInitState = new GameBackup(...)`), so the exclusive
#     cutoff keeps it. The EVA's SurfaceEVA world-first is the in-flight earning that gives
#     the prune a row to remove.
#   - The swap happens in the VAB manifest, not in flight: `SwapReservedCrewInFlight`'s
#     Pass 1 only catches a reserved kerbal who reached a seat, and a fresh rollout skips its
#     Pass 2. The lane forbids the in-flight swap of Jeb as the sign the manifest let him on.
#   - The committed future is a Space Center accept, not one of H's rows (tagged rows are
#     never pruned, so they cannot show the keep).
#
# LITERALS (Source/Parsek/..., verified 2026-10-28):
#   Stand-in generated: '<n>' (<trait>)      KerbalsModule.cs:3981
#   Recreated stand-in '<n>' (<trait>)       KerbalsModule.cs:3967
#   Reservation re-reserved / released       KerbalsModule.cs:2198 (transition :2224-2225)
#   Swapped reserved '<k>' -> stand-in       Patches/CrewAutoAssignPatch.cs:253 (Verbose)
#   Crew manifest adjusted:                  Patches/CrewAutoAssignPatch.cs:291
#   Cleared reserved '<k>'                   Patches/CrewAutoAssignPatch.cs:266 / :279
#   Swapped '<k>' -> '<s>' (in flight)       CrewReservationManager.cs:326 (arrow non-ASCII)
#   launchfromeditor start / complete        TestCommands/TestCommandEditorRoute.cs:499 / :517
#   evaexit start kerbal=                    TestCommands/ParsekTestCommandAddon.Eva.cs:160
#   Game state: MilestoneAchieved '<id>'     GameStateRecorder.Handlers.cs:1165
#   Milestone enriched: '<id>'               GameStateRecorder.Handlers.cs:1516
#   KSC spending recorded:                   GameActions/LedgerOrchestrator.cs:6095
#   Flight entry: remembered                 ParsekScenario.RevertLedgerSnapshot.cs:94
#   reverttolaunch start / complete          TestCommands/TestCommandRevertToLaunch.cs:99 / :108
#   Prefix: no active re-fly session         RevertInterceptor.cs:171 (dash non-ASCII)
#   armed RevertKind.Launch                  RevertDetector.cs:44
#   Load classified:                         LoadReconcilePolicy.cs:381
#   Revert (<kind>): pruned N untagged       ParsekScenario.cs:4578
#   PruneOrphanActionsAfterUT: removed       GameActions/Ledger.cs:472 (no-op form :478)
#   no revert-target ledger rows remembered  ParsekScenario.RevertLedgerSnapshot.cs:116
#   Emit: <type> key='<k>' tag=              GameStateRecorder.cs:176
#   Game state: ExperienceGained crew=       GameStateRecorder.Handlers.cs:2455
#   Recovery kerbal XP recorded / refused    GameActions/LedgerOrchestrator.cs:7388 / :7307
#   Game state: CrewStatusChanged            GameStateRecorder.Handlers.cs:1044 (arrow non-ASCII)
#   Recording started: vessel=               FlightRecorder.cs:6826
#   Clock-crossing reached                   GameActions/LedgerOrchestrator.cs:2763
#   PatchFunds: <from> -> <to>               GameActions/KspStatePatcher.cs:2494
#   savegame name=<n> folder= saved=true     TestCommands/ParsekTestCommandAddon.cs:2098 (refused
#                                            :2059 / :2074, failed :2086 / :2093)
#   and RW-1's set (its header): Game state: FundsChanged GameStateRecorder.cs:945, AddEvent:
#   GameStateStore.cs:124, kscaction ... applied=true TestCommands/TestCommandKscAction.cs:501,
#   invokerewindtolaunch ... ParsekTestCommandAddon.InvokeRewindToLaunch.cs:116 / :176,
#   Rewind-to-Launch initiated RecordingStore.cs:5651, MISSIONMARK
#   TestCommands/TestCommandMissionMark.cs:22, [LedgerTrace] phase=Structural LedgerTrace.cs:268
#   and phase=Anomaly :319, ground-truth game mode= / result: hardFailures=
#   InGameTests/LedgerGroundTruthHarness.cs:125 / :246, BATCH_COMPLETE v1
#   InGameTests/InGameTestRunner.cs:1219, ABORTING rewind ledger patch
#   GameActions/KspStatePatcher.cs:89, Took back GameActions/StockShadowTakeBack.cs:514,
#   filed StockPoolAdjustment GameActions/KspStatePatcher.cs:6117.
#
# PRE-REGISTERED READINGS (check these first if the first flight reds):
#   - no `Swapped reserved 'Jebediah Kerman'` and `evaexit start kerbal=Jebediah Kerman`: the
#     relaunch came after Jeb's hold ended. RW-1 measured that hold ending at 185807.6 (H's
#     recording end, `Reservation bounded by KSC retirement`), not at H's recovery row
#     (186000.2), so the rewound timeline frees Jeb ~190 s before the committed future
#     recovers him; read `Reservation released: 'Jebediah Kerman'` against the launch UT.
#     If the launch UT is under 185807.6 and Jeb still flew, that is a product finding.
#   - `Cleared reserved 'Jebediah Kerman'` (launch crew=0): no stand-in was registered;
#     read the `Recreated stand-in` / `Failed to recreate stand-in` lines after the rewind.
#   - no `Revert (Launch): pruned` line: read `PruneOrphanActionsAfterUT: no untagged
#     actions` and the SurfaceEVA emit's `tag=`; a tagged emit means a recorder was live
#     (autoRecordOnEva), no `KSC spending recorded: ... Kerbin/SurfaceEVA` means the row
#     never reached the ledger.
#   - `pruned 2`: the R rollout row's UT is above the post-init UT (the cutoff); read both
#     and the ground truth's funds facet (stock kept the rollout).
#   - `keptFromFlightEntry=0` or no ContractAccept@ in a crossing line: the revert dropped
#     the committed future, O2's defect; file it.
#   - `Stand-in '<n>' displaced -> deleted (unused)` for a stand-in with career entries:
#     the unrecorded flight leaves no recording, so the stand-in reads unused. Expected here
#     `retained (on live vessel)` at the crossing (he sits in the check Flea); a deletion
#     of a flown stand-in elsewhere is worth a todo.
#   - `evaexit refused reason=eva-refused`: the K2 backstop refused the stand-in.
#   - `reverttolaunch rejected reason=reverttolaunch-unavailable`: stock did not offer it.
#   - recordings 36: something recorded after the rewind (the EVA auto-record setting).
#
# STATUS: LIVE-PROVEN 2026-10-28 on the fix, `2026-10-28_0902` PASS attempt 1 (DLL b50fbc5d built from e63f0f4bf, the revert-cutoff fix): the StockRevert load walked at
# the clock (useCurrentUtCutoff=True isRevert=True; Revert budget walk cutoffScene=True
# clockReady=True), the pool held at 151682.18 through the revert, and the committed future's
# +40432 arrived only at the crossing (clock 186097.6); every other pin held; ledger_audit.py PASS.
# History: FIRST FLIGHT 2026-10-28 `2026-10-28_0837` PARSEK-FAIL attempt 1 (DLL 92b715f7) on ONE
# forbid, a real defect: the StockRevert load inside the rewound timeline ran its recalc with
# cutoffUT=null (`post-rewind current-UT cutoff decision useCurrentUtCutoff=False ... isRevert=True
# ... hasFutureLedgerActions=True`), so `PatchFunds: 151682.2 -> 192114.2 (delta=40432.0)` paid the
# committed future's gains (the +37500 advance, H's +2932 recovery) at a clock of 185786; the next
# load restored the cutoff and funds 151682.2. Every other pin held: the VAB swap of Jebediah for
# a stand-in, the stand-in's XP, the revert pruning 1 untagged row (Kerbin/SurfaceEVA, measured
# 3200 / 1.0 / 0.0) with keptFromFlightEntry=1, each committed row crossed once, 35 recordings,
# batch passed=3 failed=0 skipped=0, LedgerGroundTruth hardFailures=0. The lane is expected green
# with the cutoff fix. Original note: every pinned
# literal is derived from source (file:line above) and RW-1's flown log of the same H, not
# from a flight of this lane.
# Owed off the first flight:
#   - the batch split (`total=3` pinned from the source, `passed` / `skipped` regexed;
#     IngameBatchWiringGroupTests.INTERIM_PIN_IDS until then);
#   - N in `Revert (Launch): pruned N` (1 expected: the Kerbin/SurfaceEVA row) and the
#     `keptFromFlightEntry` count (1 expected: the accept);
#   - the SurfaceEVA reward (funds / rep / sci, not derived for this career);
#   - the stand-in's recovery XP ledger outcome (a refusal, no-recovery-recording, expected)
#     and his disposal at the crossing (retained on the live check Flea expected);
#   - the crossing lines' batching (which rows share a line);
#   - the end pools (no ledger oracle block until measured); the tier call (operator:
#     stock-tree is not in the nightly instance set).
#
# FAST-LANE CHECKLIST: (1) reuse: RW-1's H and its accept verbatim, SCI-1's
# recover-relaunch-warp tail, WF-1's pad EVA, STR-3's revert gates; (2) explicit-UT warps
# only; (3)-(5) no dwell, burn or coast, the EVA stays on the ladder; (6) retry `once`; (7)
# recordings window 35..35; (8) operator, ~5 min expected (RW-1 flew 147 s); (9)
# flight_efficiency.py after the first green flight.
tier = "operator"
description = "Rewind ledger campaign, a crewed relaunch and a stock revert inside a rewound timeline (plan rows 13 and 14): on cs-career-mun4 a crewed pad flight is recorded and committed and a contract accepted at the Space Center; after a Rewind-to-Launch the relaunch seats the reserved Jebediah's stand-in, the stand-in's pad EVA earns Kerbin's SurfaceEVA world-first, Revert to Launch prunes that untagged row and keeps the committed accept, the stand-in alone gains experience on recovery, and warping past the committed rows applies each once before LedgerGroundTruth."
instanceProfile = "stock-tree"
tags = ["RW-2", "career", "ledger", "rewind", "rewind-to-launch", "stock-revert", "crew",
        "stand-ins", "eva", "milestone", "contracts", "editor", "ground-truth",
        "ingame-batch", "timeline-ops", "reading-run"]

