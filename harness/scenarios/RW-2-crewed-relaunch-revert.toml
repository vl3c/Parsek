[expectations.logContracts]
required = [
  # ---- three Flea launches (H, the relaunch, the check), each rolled out once ----
  "\\A(?:[\\s\\S]*?launchfromeditor complete scene=FLIGHT vessel=Jumping Flea pid=[0-9]+ site=LaunchPad situation=PRELAUNCH){3}",
  "\\A(?:[\\s\\S]*?Game state: FundsChanged -2932 \\(VesselRollout\\)){3}",
  # H's pad recovery (RW-1 measured +2932) and the reverted Flea's, the same craft on the pad.
  "Game state: FundsChanged \\+2932 \\(VesselRecovery\\)[\\s\\S]*?MISSIONMARK label=rw2-h-committed ut=",
  "MISSIONMARK label=rw2-reverted ut=[\\s\\S]*?Game state: FundsChanged \\+2932 \\(VesselRecovery\\)[\\s\\S]*?MISSIONMARK label=rw2-standin-recovered ut=",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- H holds Jeb: the stand-in generated at the commit ----
  "Stand-in generated: '[^'\\r\\n]+' \\(Pilot\\) for slot 'Jebediah Kerman' depth 0[\\s\\S]*?MISSIONMARK label=rw2-h-committed ut=",
  "Emit: ExperienceGained key='Jebediah Kerman' tag=[\\s\\S]*?MISSIONMARK label=rw2-h-committed ut=",

  # ---- the committed accept (RW-1's literals) ----
  "MISSIONMARK label=rw2-h-committed ut=[\\s\\S]*?kscaction action=accept-contract target=f1fb89dc-a471-42cf-94da-de4bb1080512 applied=true manifestKind=contract-accept observedAfter=state=Active funds=[0-9.]+ contract=f1fb89dc-a471-42cf-94da-de4bb1080512",
  "Game state: FundsChanged \\+37500 \\(ContractAdvance\\)",
  "AddEvent: ContractAccepted key='f1fb89dc-a471-42cf-94da-de4bb1080512' tag=''",
  "KSC spending recorded: type=ContractAccept, UT=[0-9.]+, key=f1fb89dc-a471-42cf-94da-de4bb1080512[\\s\\S]*?MISSIONMARK label=rw2-ksc-committed ut=",

  # ---- the rewind: a plain Rewind-to-Launch onto H's tree, Jeb held again ----
  "MISSIONMARK label=rw2-ksc-committed ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT ",
  "MISSIONMARK label=rw2-ksc-committed ut=[\\s\\S]*?Load classified: early=PlainRewind refined=PlainRewind ",
  "invokerewindtolaunch invoking tree=[0-9a-f]{32} rec=[0-9a-f]{32} startUT=1858[0-9]{2}\\.[0-9] - plain Rewind-to-Launch \\(NOT a Re-Fly\\)",
  "MISSIONMARK label=rw2-ksc-committed ut=[\\s\\S]*?\\[KerbalsModule\\] Reservation re-reserved: 'Jebediah Kerman' endUT=[0-9.]+ nowUT=1857[0-9]{2}\\.[0-9] [\\s\\S]*?MISSIONMARK label=rw2-rewound ut=",
  # The stand-in the commit generated is the one recreated after the rewind.
  "Stand-in generated: '([^'\\r\\n]+)' \\(Pilot\\) for slot 'Jebediah Kerman' depth 0[\\s\\S]*?MISSIONMARK label=rw2-ksc-committed ut=[\\s\\S]*?\\[KerbalsModule\\] Recreated stand-in '\\1' \\(Pilot\\) for slot 'Jebediah Kerman' depth 0[\\s\\S]*?MISSIONMARK label=rw2-rewound ut=",

  # ---- row 13: the VAB manifest swaps Jeb for that stand-in; the launch carries one kerbal ----
  "Stand-in generated: '([^'\\r\\n]+)' \\(Pilot\\) for slot 'Jebediah Kerman' depth 0[\\s\\S]*?MISSIONMARK label=rw2-rewound ut=[\\s\\S]*?\\[CrewAutoAssign\\] Swapped reserved 'Jebediah Kerman' -> stand-in '\\1' in part 'Mk1 Command Pod' seat 0[\\s\\S]*?MISSIONMARK label=rw2-launched ut=",
  "MISSIONMARK label=rw2-rewound ut=[\\s\\S]*?\\[CrewAutoAssign\\] Crew manifest adjusted: 1 reserved crew replaced with stand-ins, 0 seats cleared[\\s\\S]*?MISSIONMARK label=rw2-launched ut=",
  "MISSIONMARK label=rw2-rewound ut=[\\s\\S]*?launchfromeditor start ship=Jumping Flea parts=8 site=LaunchPad crew=1 scene=EDITOR[\\s\\S]*?MISSIONMARK label=rw2-launched ut=",
  "MISSIONMARK label=rw2-rewound ut=[\\s\\S]*?Flight entry: remembered [0-9]+ ledger row\\(s\\) as the revert target's rows \\(reason=in-session:InSessionOther, freshLaunch=True\\)[\\s\\S]*?MISSIONMARK label=rw2-launched ut=",
  # It is the stand-in who goes out of the hatch.
  "Stand-in generated: '([^'\\r\\n]+)' \\(Pilot\\) for slot 'Jebediah Kerman' depth 0[\\s\\S]*?MISSIONMARK label=rw2-launched ut=[\\s\\S]*?evaexit start kerbal=\\1 fromPid=[0-9]+ release=false[\\s\\S]*?MISSIONMARK label=rw2-eva ut=",

  # ---- row 14: the in-flight earning, an untagged row written at once ----
  "MISSIONMARK label=rw2-launched ut=[\\s\\S]*?Game state: MilestoneAchieved 'Kerbin/SurfaceEVA' \\(awaiting reward enrichment\\)[\\s\\S]*?MISSIONMARK label=rw2-eva ut=",
  "MISSIONMARK label=rw2-launched ut=[\\s\\S]*?KSC spending recorded: type=MilestoneAchievement, UT=[0-9.]+, key=Kerbin/SurfaceEVA[\\s\\S]*?MISSIONMARK label=rw2-eva ut=",
  "MISSIONMARK label=rw2-launched ut=[\\s\\S]*?Milestone enriched: 'Kerbin/SurfaceEVA' funds=3200 rep=1\\.0 sci=0\\.0[\\s\\S]*?MISSIONMARK label=rw2-eva ut=",
  # ---- the stock revert, unrecorded ----
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?reverttolaunch start pid=[0-9]+ name='[^'\\r\\n]+' situation=\\S+ recording=false hasActiveTree=false",
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?Prefix: no active re-fly session [^\\r\\n]*allowing stock RevertToLaunch",
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?GameEvents\\.OnRevertToLaunchFlightState fired; armed RevertKind\\.Launch for next OnLoad",
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?Load classified: early=\\w+ refined=StockRevert scene=FLIGHT",
  # THE GATE: the reverted flight's untagged row goes, the committed accept stays.
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?\\[Ledger\\] PruneOrphanActionsAfterUT: removed 1 untagged action\\(s\\) after UT 1857[0-9.]+, keptFromFlightEntry=1, total=[0-9]+[\\s\\S]*?MISSIONMARK label=rw2-reverted ut=",
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?\\[Scenario\\] Revert \\(Launch\\): pruned 1 untagged ledger action\\(s\\) after launchUT=1857[0-9.]+ \\(launch-pad/PRELAUNCH currency earned before auto-record\\)[\\s\\S]*?MISSIONMARK label=rw2-reverted ut=",
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?reverttolaunch complete pid=[0-9]+ name='Jumping Flea' situation=PRELAUNCH elapsed=",

  # ---- row 13's experience half: the stand-in's recovery, Jeb untouched ----
  "Stand-in generated: '([^'\\r\\n]+)' \\(Pilot\\) for slot 'Jebediah Kerman' depth 0[\\s\\S]*?MISSIONMARK label=rw2-reverted ut=[\\s\\S]*?Emit: ExperienceGained key='\\1' tag=[\\s\\S]*?MISSIONMARK label=rw2-standin-recovered ut=",
  "MISSIONMARK label=rw2-reverted ut=[\\s\\S]*?Game state: ExperienceGained crew=1 emitted=1 noEntries=0 [\\s\\S]*?MISSIONMARK label=rw2-standin-recovered ut=",

  # ---- the crossing: H's rows and the accept reached once, Jeb freed ----
  "MISSIONMARK label=rw2-standin-recovered ut=[\\s\\S]*?\\[KerbalsModule\\] Reservation released: 'Jebediah Kerman' endUT=[0-9.]+ [\\s\\S]*?MISSIONMARK label=rw2-crossed ut=",
  "MISSIONMARK label=rw2-standin-recovered ut=[\\s\\S]*?Clock-crossing reached committed-future rows: crossed=[0-9]+ \\[[^\\]\\r\\n]*KerbalAssignment@[\\s\\S]*?MISSIONMARK label=rw2-crossed ut=",
  "MISSIONMARK label=rw2-standin-recovered ut=[\\s\\S]*?Clock-crossing reached committed-future rows: crossed=[0-9]+ \\[[^\\]\\r\\n]*KerbalExperience@[\\s\\S]*?MISSIONMARK label=rw2-crossed ut=",
  "MISSIONMARK label=rw2-standin-recovered ut=[\\s\\S]*?Clock-crossing reached committed-future rows: crossed=[0-9]+ \\[[^\\]\\r\\n]*ContractAccept@[\\s\\S]*?MISSIONMARK label=rw2-crossed ut=",

  # ---- the step saves (named side slots for after-flight reading) and the default slot ----
  "savegame name=rw02-01-after-h-commit folder=\\S+ saved=true",
  "savegame name=rw02-02-after-ksc-accept folder=\\S+ saved=true",
  "savegame name=rw02-03-after-rtl folder=\\S+ saved=true",
  "savegame name=rw02-04-after-crewed-launch folder=\\S+ saved=true",
  "savegame name=rw02-05-after-eva folder=\\S+ saved=true",
  "savegame name=rw02-06-after-revert folder=\\S+ saved=true",
  "savegame name=rw02-07-after-standin-recovery folder=\\S+ saved=true",
  "savegame name=rw02-08-before-crossing folder=\\S+ saved=true",
  "savegame name=rw02-09-after-crossing folder=\\S+ saved=true",
  "MISSIONMARK label=rw2-crossed ut=[\\s\\S]*?savegame name=persistent folder=\\S+ saved=true",

  # ---- the ground truth, in FLIGHT on the unrecorded check Flea ----
  "ground-truth game mode=CAREER pools=funds,science,reputation",
  "result: hardFailures=0 ",
  # INTERIM: total=3 from the source (the LedgerGroundTruth category's FLIGHT cells); the
  # split is owed off the first flight (RW-1 read passed=3 skipped=0 on this host).
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  # The revert-cutoff fix (REVERT-AFTER-REWIND-WALKS-PAST-THE-CLOCK, ParsekScenario.cs:839 and
  # :7545): the StockRevert load inside the rewound timeline walks at the clock.
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?post-rewind current-UT cutoff decision useCurrentUtCutoff=True [^\\r\\n]*isRevert=True[\\s\\S]*?MISSIONMARK label=rw2-reverted ut=",
  "MISSIONMARK label=rw2-eva ut=[\\s\\S]*?Revert budget walk: [^\\r\\n]*cutoffScene=True clockReady=True[\\s\\S]*?MISSIONMARK label=rw2-reverted ut=",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "GUARDED (UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=\\S+ reason=leak ",
  "\\[TakeBack\\] Took back ",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "invokerewindtolaunch refused",
  "reverttolaunch rejected",
  "reverttolaunch error",
  "savegame refused ",
  "savegame failed ",
  # ---- row 13: the reserved kerbal never flies, never boards, never earns after the rewind ----
  "MISSIONMARK label=rw2-rewound ut=[\\s\\S]*evaexit start kerbal=Jebediah Kerman ",
  # Windowed to the relaunch: the check launch may come after Jeb's hold ends (185807.6) and
  # then legitimately seats him.
  "MISSIONMARK label=rw2-rewound ut=(?:(?!MISSIONMARK label=rw2-standin-recovered )[\\s\\S])*Game state: CrewStatusChanged 'Jebediah Kerman' Available .{1,3} Assigned",
  "MISSIONMARK label=rw2-rewound ut=[\\s\\S]*Emit: ExperienceGained key='Jebediah Kerman'",
  "MISSIONMARK label=rw2-rewound ut=[\\s\\S]*Recovery kerbal XP recorded: [^\\r\\n]*kerbals='[^'\\r\\n]*Jebediah Kerman",
  # The manifest swaps him; a cleared seat (no stand-in) or the in-flight backstop catching
  # him on a launched craft means the VAB let him on.
  "\\[CrewAutoAssign\\] Cleared reserved 'Jebediah Kerman'",
  "\\[CrewReservation\\] Swapped 'Jebediah Kerman' ",
  # ---- row 14: nothing records after the rewind, the revert is no quickload, it keeps a
  # remembered target, and no patch lifts the reverted pool (a kept SurfaceEVA row would) ----
  "MISSIONMARK label=rw2-rewound ut=[\\s\\S]*Recording started: vessel=",
  "Load classified: early=\\w+ refined=QuickloadFlight ",
  "no revert-target ledger rows remembered",
  "MISSIONMARK label=rw2-eva ut=(?:(?!MISSIONMARK label=rw2-reverted )[\\s\\S])*\\[KspStatePatcher\\] PatchFunds: [0-9.]+ -> [0-9.]+ \\(delta=[1-9]",
  # Stock pays the world-first once in this lane (the revert reloads the unreached node, and
  # nothing EVAs again).
  "Game state: MilestoneAchieved 'Kerbin/SurfaceEVA'[\\s\\S]*Game state: MilestoneAchieved 'Kerbin/SurfaceEVA'",
  # ---- each committed row applies once: one accept, one crossing of H's experience ----
  "kscaction action=accept-contract target=f1fb89dc-a471-42cf-94da-de4bb1080512 applied=true[\\s\\S]*kscaction action=accept-contract target=f1fb89dc-a471-42cf-94da-de4bb1080512 applied=true",
  "AddEvent: ContractAccepted key='f1fb89dc-a471-42cf-94da-de4bb1080512'[\\s\\S]*AddEvent: ContractAccepted key='f1fb89dc-a471-42cf-94da-de4bb1080512'",
  "KSC spending recorded: type=ContractAccept, UT=[0-9.]+, key=f1fb89dc-a471-42cf-94da-de4bb1080512[\\s\\S]*KSC spending recorded: type=ContractAccept, UT=[0-9.]+, key=f1fb89dc-a471-42cf-94da-de4bb1080512",
  "Clock-crossing reached committed-future rows: [^\\r\\n]*KerbalExperience@[\\s\\S]*Clock-crossing reached committed-future rows: [^\\r\\n]*KerbalExperience@",
  "Clock-crossing reached committed-future rows: [^\\r\\n]*ContractAccept@[\\s\\S]*Clock-crossing reached committed-future rows: [^\\r\\n]*ContractAccept@",
  # Nothing completes or fails a contract in this walk.
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

