schema = 1
id = "H10-finalize-backfill"
tier = "nightly"
# BATCH-ONLY scenario, S1.4 / H6 pattern. The in-game FinalizeBackfill category has
# never been driven by any committed spec. All seven cells drive terminal-orbit
# backfill at finalization: filling terminal orbit metadata from an OrbitSegment,
# refusing to overwrite an already-populated tuple, and the four stale-cached-tuple
# cases where a same-body or changed-body cached value must be realigned to the
# recording's real endpoint instead of being trusted. That last family is the one
# that silently produces a ghost parked on last flight's orbit.
description = "Run the in-game FinalizeBackfill category unattended: terminal-orbit backfill from OrbitSegment, no-overwrite guards, and stale-cached-tuple endpoint realignment."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "finalization", "terminal-orbit", "H10"]

[fixture]
# gloops-airshow SANDBOX pod host. No injected recordings: every test builds its own
# recording + cache inline.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "FinalizeBackfill" },             expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# HONEST: the seven cells drive the finalization-cache apply path and the
# terminal-orbit metadata it writes (D1 finalization-cache,
# scene-exit-finalization). SANDBOX, FLIGHT-scene host (D14). NOT claimed: any D6
# playback token - nothing is rendered here, only the recording's terminal metadata
# is asserted.
D1  = ["finalization-cache", "scene-exit-finalization"]
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (see H7).
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY: tally pinned WHOLE.
#
# EVIDENCE STANDING - DERIVED FROM SOURCE, NEVER MEASURED. No live run of this spec
# exists; see the PENDING-OPERATOR runbook in docs/dev/autotest-status.md.
#  - total=7 is ATTRIBUTE-EXACT: RuntimeTests declares exactly 7
#    [InGameTest(Category = "FinalizeBackfill")] methods.
#  - skipped=0 is DERIVED: all 7 carry Scene = GameScenes.FLIGHT and the batch runs
#    at FLIGHT; none sets AllowBatchExecution = false; none of the 7 bodies, nor any
#    helper they call, contains an InGameAssert.Skip.
#  - failed=0 is the ASSERTION. passed=7 follows.
#  - scene=FLIGHT is INFERRED from the fixture (Focusable route) and is
#    LOAD-BEARING: at any other scene all 7 scene-skip.
required  = ["BATCH_COMPLETE v1 total=7 passed=7 failed=0 skipped=0 category=FinalizeBackfill scene=FLIGHT"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
