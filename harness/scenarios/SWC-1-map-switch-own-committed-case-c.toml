schema = 1
id = "SWC-1-map-switch-own-committed-case-c"
# =====================================================================================
# SWC-1: MAP SWITCH-TO YOUR OWN SEPARATELY COMMITTED VESSEL WHILE RECORDING (PRE-SWITCH CASE C).
# AUTHORED AND FLOWN 2026-11-23 (test-gap list 2026-11-18 batch 4; todo
# PRESWITCH-CASE-C-LANES-2026-11-23).
#
# THE GAP. Pre-switch Case C (MapFocusObjectOnSelectPatch: no switch-segment session, a live
# recording, and the LOADED target is a SEPARATE previously committed vessel, so the
# in-bubble consume would skip the committed-clone restore that needs `activeTree == null`)
# is unit-tested only (`case=C-loaded-separate-committed`). With auto-merge on (the shipping
# value) the live tree is decided without asking: merged, or discarded when it changed
# nothing, then the switch runs and the target restores through the committed-clone route.
#
# THE HOST is `eva2-lko-crewed` (S0.13's): Kerbal X in a 100 km orbit, `Kerbal X Probe`
# 16 m away, both in the physics bubble, nothing committed.
#   (a) Record Kerbal X for a few seconds and commit it (T1); the auto-resumed recorder is
#       stopped and dropped (DiscardTree), so nothing is live.
#   (b) The save reloaded with the probe focused (LoadGame focusPid); no recording is live.
#   (c) StartRecording on the probe: a second, separate tree (T2) is live.
#   (d) THE SUBJECT: SimulateStockSwitchClick vessel="Kerbal X" (the map context menu's
#       Switch To, site=map) while T2 records.
#
# FAST-LANE CHECKLIST (harness/README.md "Authoring a fast lane"):
#   1 reuse: S0.13's host and opening; GC-4's cycle press. 2 waits: explicit-UT WarpToUT
#   only. 3 dwells: none. 4 burns: none. 5 b5 coasts: none. 6 fail fast: every verb answers
#   in one frame or two. 7 count: READING (derived 2..3: T1's root, then T2 merged or
#   discarded, plus at most one committed-clone continuation on Kerbal X if the quit
#   commits it); re-pin from the first flight. 8 tier: operator by the calibration
#   discipline until the first flight. 9 run tools/flight_efficiency.py on the first
#   green flight. Takes no mouse and no focus: it can share a runner with other lanes.
# =====================================================================================
tier = "operator"
description = "AUTHORED AND FLOWN 2026-11-23 (todo PRESWITCH-CASE-C-LANES-2026-11-23). On eva2-lko-crewed: Kerbal X recorded and committed (T1), the save reloaded onto the probe, a second recording on the probe (T2), then the map's Switch To onto Kerbal X: pre-switch Case C (loaded, separately committed target) must auto-resolve T2 (merge or no-op discard), switch, and restore Kerbal X through the committed-clone route."
instanceProfile = "stock-minimal"
tags = ["SWC1", "switch", "pre-switch", "case-c", "committed-clone", "auto-merge", "flown"]

[fixture]
saveTemplate       = "fixtures/saves/eva2-lko-crewed"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnFirstModificationAfterSwitch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoMerge", value = "true" },           expect = "OK" },
  # LOAD-BEARING: the Case C detection line is Verbose.
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  # (a) T1: Kerbal X recorded and committed.
  { cmd = "WarpToUT",       args = { ut = "424", maxRate = "1" },                     expect = "OK", budget = 120 },
  { cmd = "StartRecording",                                                          expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "432", maxRate = "1" },                     expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "CommitTree",                                                              expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  # (b) To the probe with nothing live: the save reloaded with the probe focused (the seam's
  # CycleVessel leaves a cycle Parsek has no reason to take to stock, `outcome=left-to-stock`,
  # which switches nothing: the first flight).
  { cmd = "SaveGame",       args = { name = "swc1-t1" },                                expect = "OK", budget = 120 },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "swc1-t1", focusPid = "2614652043" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnFirstModificationAfterSwitch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoMerge", value = "true" },           expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  # (c) T2 on the probe.
  { cmd = "StartRecording",                                                          expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "440", maxRate = "1" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "swc1-switch" },                           expect = "OK" },
  { cmd = "SimulateStockSwitchClick", args = { vessel = "Kerbal X" },                expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                          expect = "OK" },
  { cmd = "RecordingState",                                                          expect = "OK" },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                       expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                            expect = "OK" },
]

[dimensionsCovered]
# Boot facts only until the first green flight (the H35 claim-is-not-gate rule).
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# READING (header item 7).
count = { min = 2, max = 2 }

[expectations.logContracts]
required = [
  # THE SUBJECT: Case C detected on the loaded, separately committed Kerbal X ...
  "MISSIONMARK label=swc1-switch [\\s\\S]*?(?:pre-switch|switchclick) Case C: loaded target is separate committed vessel targetPid=3620499050 matchedTreeId=[0-9a-f]+ activeTreeId=[0-9a-f]+",
  # ... decided without asking (merged, or discarded as a no-op) ...
  "MISSIONMARK label=swc1-switch [\\s\\S]*?pre-switch auto-resolve: resolution=(?:Merge|Discard) case=C-loaded-separate-committed autoMerge=True [^\\r\\n]*targetPid=3620499050",
  # ... and Kerbal X restored through the committed-clone route.
  "MISSIONMARK label=swc1-switch [\\s\\S]*?\\[SwitchSegment\\] route=committed-spawned-clone ",
  "exittospacecenter complete scene=SPACECENTER game-loaded=true",
  "switchclick complete site=map targetPid=3620499050 targetName=Kerbal X route=pre-switch-auto-(?:merge|discard) activeVesselPid=3620499050 switched=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The dialog stays closed with auto-merge on (design section 5.4).
  "pre-switch-dialog opening",
  "pre-switch Case C lookup failed",
  "pre-switch Case C skipped",
  "switchclick refused",
]

[runtime]
# Boot + LoadGame 300 + 3 warps 360 + 2 StartRecording 360 + commit 120 + the switch 120
# + ExitToSpaceCenter 120 + the fast verbs, rounded up with boot margin.
budgetSeconds = 1800

[retry]
policy = "once"

[expectedFail]
bugId = ""
