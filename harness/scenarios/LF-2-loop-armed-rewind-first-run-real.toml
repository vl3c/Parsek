# Read off `2026-09-23_1551` on the pad subject; the vessel name, the flight-seam spawn,
# the respawn situation (regexed) and the per-leg spawn guards are UNVERIFIED on the
# rover until the reading run.
[expectations.logContracts]
required  = [
  "Recording started",
  "missionconfig applied: mission='rover fuel 0' tree=\\S+ loop=True .*unitBuilt=True",
  # The commit adopts the live rover, and three cycles run over it with the pid unchanged.
  "MISSIONMARK label=lf2-commit-count-1-pid-([1-9][0-9]*)-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop1-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop2-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop3-count-1-pid-\\1-spawned-true ",
  # Rewind #1 with the loop armed strips the vessel.
  "MISSIONMARK label=lf2-rewound-count-1-pid-0-spawned-false ",
  "same-recording spawn suppression lifted for standalone rewind target rec=\\S+ vessel=\"rover fuel 0\"",
  # THE FLIGHT SEAM: the loop member's first run reaches the ordinary spawn gate and, the
  # rover parking outside the KSC exclusion zone, materializes in flight (UNVERIFIED).
  "\\[Engine\\] Loop first-run spawn: #0 \"rover fuel 0\" id=\\S+ UT=[0-9.]+ endUT=[0-9.]+ \\(the first run of a looping recording is real[\\s\\S]*PlaybackCompleted index=0 vessel=rover fuel 0 ghostWasActive=False pastEffectiveEnd=True needsSpawn=True[\\s\\S]*Vessel respawned \\(sit=[A-Z]+, pid=([0-9]+)\\)[\\s\\S]*MISSIONMARK label=lf2-flightseam-count-1-pid-\\1-spawned-true ",
  # Rewind #2 with the loop armed strips it again.
  "MISSIONMARK label=lf2-rewound2-count-1-pid-0-spawned-false ",
  # THE CLAIM: the KSC seam re-spawns the first run exactly once, and the recording keeps
  # that vessel's pid through the reload and two more cycles.
  "\\[KSCSpawn\\] Loop first-run spawn: #0 \"rover fuel 0\"[\\s\\S]*Vessel respawned \\(sit=[A-Z]+, pid=([0-9]+)\\)[\\s\\S]*MISSIONMARK label=lf2-kscspawn-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-reload-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop4-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop5-count-1-pid-\\1-spawned-true ",
  "Vessel spawned for #[0-9]+ \"rover fuel 0\" pid=",
  "startloopplayback complete:[\\s\\S]*startloopplayback complete:[\\s\\S]*startloopplayback complete:[\\s\\S]*startloopplayback complete:[\\s\\S]*startloopplayback complete:",
  # After the re-spawn a cycle frame meets the already-spawned guard (rate-limited summary).
  "MISSIONMARK label=lf2-kscspawn-count[\\s\\S]*Spawn suppressed: 1 recording\\(s\\) \\| already spawned \\(VesselSpawned=true\\)=1",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # One real spawn per leg at most, by either spawn path: none before rewind #1 (the
  # commit adopts), at most one between the rewinds (the flight seam), at most one after
  # rewind #2 (the KSC seam). A per-cycle spawn would add a second inside a leg.
  "(?:Vessel respawned|SpawnAtPosition: vessel spawned)[\\s\\S]*MISSIONMARK label=lf2-rewound-count",
  "MISSIONMARK label=lf2-rewound-count[\\s\\S]*(?:Vessel respawned|SpawnAtPosition: vessel spawned)[\\s\\S]*(?:Vessel respawned|SpawnAtPosition: vessel spawned)[\\s\\S]*MISSIONMARK label=lf2-rewound2-count",
  "MISSIONMARK label=lf2-rewound2-count[\\s\\S]*(?:Vessel respawned|SpawnAtPosition: vessel spawned)[\\s\\S]*(?:Vessel respawned|SpawnAtPosition: vessel spawned)",
  # The first-run seam fires once per rewind: a third firing is a per-cycle spawn.
  "Loop first-run spawn[\\s\\S]*Loop first-run spawn[\\s\\S]*Loop first-run spawn",
  "Spawn ABANDONED",
  # The subject parks outside the KSC exclusion zone, so it must never be retired.
  "Spawn RETIRED",
  "missionconfig error",
  "startloopplayback rejected",
]

