schema = 1
id = "LF-2-loop-armed-rewind-first-run-real"
# -------------------------------------------------------------------------------------
# D18 `loop-first-run-is-real`, FULL SCOPE (catalog section 2, the B8 additional
# assertion): "after 3 loop cycles plus one rewind re-cross of the spawn window, exactly
# ONE real vessel with the recording's spawn PID exists". LF-1 drives the same subject
# with the loop armed only AFTER the rewind; this lane arms it BEFORE, which is the
# operator ruling of 2026-09-23 on LOOP-ARMED-REWIND-LEAVES-ZERO-VESSELS: "The first time
# through should still count as the real flight, so the lander should come back after a
# rewind even while it's looping, and only the extra replays should be ghost-only."
#
# THE MEASUREMENT THAT FILED IT. Run `2026-09-23_1536` flew this subject on origin/main
# `1f90acc13` (no fix): loop armed, three cycles, Rewind-to-Launch, 1x Space Center time
# past EndUT with the loop unit live at KSC, reload and a fourth cycle - the recording
# stayed `pid-0 spawned-false` at every mark after the strip and the produced save held
# ZERO real vessels (spawnedVessels 0, vesselNames {}). Both loop dispatches (flight
# `GhostPlaybackEngine` Phase D2 + the per-recording loop gate, KSC Phase E parity)
# `continue` above the past-end completion, so nothing spawned the first run.
#
# THE SUBJECT is LF-1's (H58's road): StartRecording on the pad probe of
# `logi-cargo-pad`, StopRecording, CommitTree - a single-recording NON-CHAIN tree with a
# Landed terminal, committed with its own pid adopted (spawned=true). Non-chain matters:
# the #573 rewind lift is standalone-only and the "chain looping" rule is unchanged.
#
# TWO REWINDS, ONE PER SCENE SEAM. The fix adds the first-run spawn to BOTH loop
# dispatchers, and each rewind drives one of them:
#   rewind #1 is saved at the Space Center at once (UT is still ~15 s before launch) and
#     reloaded into FLIGHT, where a TimeJump carries UT past EndUT: the flight engine's
#     `TryFireLoopFirstRunSpawn` fires ([Engine] `Loop first-run spawn:`) and the policy
#     takes it with `needsSpawn=True`. A PAD terminal cannot materialize in flight: the
#     KSC exclusion zone (#170) blocks every spawn within 50 m of the pad, loop or not
#     (a non-looping pad recording gets the same block), so this leg witnesses that the
#     flight seam reaches the ordinary spawn gate, and the pid stays 0. Measured on the
#     first reading (`2026-09-23_1545`, with the legs in the other order).
#   rewind #2 lands at the Space Center and 1x time re-crosses EndUT there, so
#     `ParsekKSC.TryLoopFirstRunSpawnKsc` spawns the vessel ([KSCSpawn]
#     `Loop first-run spawn:` then `Vessel respawned`), exactly once.
# Each rewind strips the vessel (`pid-0 spawned-false`) and re-arms exactly one attempt;
# the rewind save predates the spawn, so the census reads exactly ONE vessel at the end.
# Five loop cycles in all: three before rewind #1 and two after the KSC re-spawn, where
# the pid is pinned unchanged.
#
# SCOPE STATED. A Space Center save carries `activeVessel = 0`, so every reload focuses
# the host asteroid at index 0 and the loop ghost sits in the `Beyond` zone: the claim
# needs the spawn decision, not a drawn ghost. The Missions window is opened before
# MissionConfig because its draw seeds the default mission of a tree committed
# mid-session (MISSIONCONFIG-UNKNOWN-TREE-AFTER-MID-SESSION-COMMIT; GUI-17's sequence).
# -------------------------------------------------------------------------------------
tier = "nightly"
description = "D18 loop-first-run-is-real, full scope: the mission loop armed BEFORE the rewind. In-run pad subject on logi-cargo-pad (StartRecording, StopRecording, CommitTree), arm the loop through the Missions window, three StartLoopPlayback cycles, loop-armed Rewind-to-Launch #1 reloaded into FLIGHT before EndUT (the flight engine seam fires and reaches the spawn gate, which the KSC pad exclusion zone blocks as for any pad terminal), loop-armed Rewind-to-Launch #2 re-spawns the vessel once at the Space Center (the KSC seam), then a reload and two more cycles; the produced save must hold exactly one real vessel behind the spawn."
instanceProfile = "stock-minimal"
tags = ["LF-2", "D18", "loop-playback", "rewind-to-launch", "spawn", "first-run-is-real",
        "R10", "runtime-handles"]

[fixture]
