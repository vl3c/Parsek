  "Recording started",
  "missionconfig applied: mission='Logi Cargo Rig' tree=\\S+ loop=True .*unitBuilt=True",
  # The commit adopts the live Rig, and three cycles run over it with the pid unchanged.
  "MISSIONMARK label=lf2-commit-count-1-pid-([1-9][0-9]*)-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop1-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop2-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop3-count-1-pid-\\1-spawned-true ",
  # Rewind #1 with the loop armed strips the vessel.
  "MISSIONMARK label=lf2-rewound-count-1-pid-0-spawned-false ",
  "same-recording spawn suppression lifted for standalone rewind target rec=\\S+ vessel=\"Logi Cargo Rig\"",
  # THE FLIGHT SEAM: the loop member's first run reaches the ordinary spawn gate, which the
  # KSC pad exclusion zone blocks (as for any pad terminal in flight).
  "\\[Engine\\] Loop first-run spawn: #0 \"Logi Cargo Rig\" id=\\S+ UT=[0-9.]+ endUT=[0-9.]+ \\(the first run of a looping recording is real[\\s\\S]*PlaybackCompleted index=0 vessel=Logi Cargo Rig ghostWasActive=False pastEffectiveEnd=True needsSpawn=True[\\s\\S]*Spawn blocked for #0 \\(Logi Cargo Rig\\): within KSC exclusion zone[\\s\\S]*MISSIONMARK label=lf2-flightseam-count-1-pid-0-spawned-false ",
  # Rewind #2 with the loop armed strips it again.
  "MISSIONMARK label=lf2-rewound2-count-1-pid-0-spawned-false ",
  # THE CLAIM: the KSC seam re-spawns the first run exactly once, and the recording keeps
  # that vessel's pid through the reload and two more cycles.
  "\\[KSCSpawn\\] Loop first-run spawn: #0 \"Logi Cargo Rig\"[\\s\\S]*Vessel respawned \\(sit=PRELAUNCH, pid=([0-9]+)\\)[\\s\\S]*MISSIONMARK label=lf2-kscspawn-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-reload-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop4-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf2-loop5-count-1-pid-\\1-spawned-true ",
  "Vessel spawned for #[0-9]+ \"Logi Cargo Rig\" pid=",
  "startloopplayback complete:[\\s\\S]*startloopplayback complete:[\\s\\S]*startloopplayback complete:[\\s\\S]*startloopplayback complete:[\\s\\S]*startloopplayback complete:",
  # After the re-spawn a cycle frame meets the already-spawned guard (rate-limited summary).
  "MISSIONMARK label=lf2-kscspawn-count[\\s\\S]*Spawn suppressed: 1 recording\\(s\\) \\| already spawned \\(VesselSpawned=true\\)=1",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # A SECOND real spawn anywhere in the run, by either spawn path.
  "(?:Vessel respawned|SpawnAtPosition: vessel spawned)[\\s\\S]*(?:Vessel respawned|SpawnAtPosition: vessel spawned)",
  # The first-run seam fires once per rewind: a third firing is a per-cycle spawn.
  "Loop first-run spawn[\\s\\S]*Loop first-run spawn[\\s\\S]*Loop first-run spawn",
  "Spawn ABANDONED",
  "missionconfig error",
  "startloopplayback rejected",
]

