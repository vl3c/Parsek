schema = 1
id = "LF-2-loop-armed-rewind-first-run-real"
# -------------------------------------------------------------------------------------
# D18 `loop-first-run-is-real`, FULL SCOPE (catalog section 2, the B8 additional
# assertion): "after 3 loop cycles plus one rewind re-cross of the spawn window, exactly
# ONE real vessel with the recording's spawn PID exists". LF-1 drives the same subject
# with the loop armed only AFTER the rewind; this lane arms it BEFORE, which is the
# operator ruling of 2026-09-23 on LOOP-ARMED-REWIND-LEAVES-ZERO-VESSELS: "The first time
# through should still count as the real flight, so the lander should come back after a
# rewind even while it's looping, and only the extra replays should be ghost-only."
#
# THE MEASUREMENT THAT FILED IT. Run `2026-09-23_1536` flew this subject on origin/main
# `1f90acc13` (no fix): loop armed, three cycles, Rewind-to-Launch, 1x Space Center time
# past EndUT with the loop unit live at KSC, reload and a fourth cycle - the recording
# stayed `pid-0 spawned-false` at every mark after the strip and the produced save held
# ZERO real vessels (spawnedVessels 0, vesselNames {}). Both loop dispatches (flight
# `GhostPlaybackEngine` Phase D2 + the per-recording loop gate, KSC Phase E parity)
# `continue` above the past-end completion, so nothing spawned the first run.
#
# THE SUBJECT is LF-1's (H58's road): StartRecording, StopRecording, CommitTree - a
# single-recording NON-CHAIN tree with a Landed terminal, committed with its own pid
# adopted (spawned=true). Non-chain matters: the #573 rewind lift is standalone-only and
# the "chain looping" rule is unchanged.
#
# SUBJECT MOVED OFF THE PAD 2026-09-23 (KSC end-of-flight retirement ruling), exactly as
# LF-1: the pad probe of `logi-cargo-pad` ends its flight inside the KSC exclusion zone and
# is now RETIRED, never spawned. The subject is `pad-runway-pair`'s `rover fuel 0`
# (VESSEL index 0, crewless Probe, PRELAUNCH 59.7 m from the runway threshold, outside
# the 50 m circle), focused by ACT 0: the boot focuses the pad Rig, ExitToSpaceCenter, and
# a Space Center SaveGame + LoadGame lands in FLIGHT on index 0 (`activeVessel = 0`,
# measured on this fixture by EX-1). NEVER FLOWN ON THIS SUBJECT: every token naming
# `rover fuel 0`, the ACT 0 road, the flight-seam SPAWN below and the two-vessel census are
# unverified until the reading run.
#
# TWO REWINDS, ONE PER SCENE SEAM. The fix adds the first-run spawn to BOTH loop
# dispatchers, and each rewind drives one of them:
#   rewind #1 is saved at the Space Center at once (UT is still ~15 s before launch) and
#     reloaded into FLIGHT, where a TimeJump carries UT past EndUT: the flight engine's
#     `TryQueueLoopFirstRunSpawn` fires ([Engine] `Loop first-run spawn:`) and the policy
#     takes it with `needsSpawn=True`. On the pad subject the KSC exclusion zone refused
#     that spawn (measured `2026-09-23_1545` / `_1551`); the runway rover parks outside it,
#     so this leg now MATERIALIZES the first run in flight (`Vessel respawned`, the pid
#     folded into the flight-seam mark) - a stronger witness than the refused spawn, and
#     UNVERIFIED until the reading run.
#   rewind #2 lands at the Space Center and 1x time re-crosses EndUT there, so
#     `ParsekKSC.TryLoopFirstRunSpawnKsc` spawns the vessel ([KSCSpawn]
#     `Loop first-run spawn:` then `Vessel respawned`), exactly once.
# Each rewind strips the vessel (`pid-0 spawned-false`) and re-arms exactly one attempt;
# rewind #2's save predates both spawns, so the census reads exactly ONE rover at the end
# (plus the untouched pad Rig of the fixture). The single-spawn guard is per leg: none
# before rewind #1, at most one between the rewinds, at most one after rewind #2.
# Five loop cycles in all: three before rewind #1 and two after the KSC re-spawn, where
# the pid is pinned unchanged.
#
# SCOPE STATED. A Space Center save carries `activeVessel = 0`, so every reload after a
# strip focuses whatever sits at index 0 (the host asteroid on the pad subject; not
# measured on this fixture): the claim needs the spawn decision, not a drawn ghost. The Missions window is opened before
# MissionConfig because its draw seeds the default mission of a tree committed
# mid-session (MISSIONCONFIG-UNKNOWN-TREE-AFTER-MID-SESSION-COMMIT; GUI-17's sequence).
# -------------------------------------------------------------------------------------
tier = "nightly"
description = "D18 loop-first-run-is-real, full scope: the mission loop armed BEFORE the rewind. In-run subject on pad-runway-pair's runway rover (rover fuel 0, 59.7 m from the runway threshold, outside the KSC exclusion zone that now retires a flight ending there), focused through a Space Center save + reload (StartRecording, StopRecording, CommitTree), arm the loop through the Missions window, three StartLoopPlayback cycles, loop-armed Rewind-to-Launch #1 reloaded into FLIGHT before EndUT (the flight engine seam fires and materializes the first run in flight), loop-armed Rewind-to-Launch #2 re-spawns the vessel once at the Space Center (the KSC seam), then a reload and two more cycles; the produced save must hold exactly one real rover behind the spawn. MOVED off the logi-cargo-pad pad probe 2026-09-23 by the KSC retirement ruling; NEVER FLOWN on the rover."
instanceProfile = "stock-minimal"
tags = ["LF-2", "D18", "loop-playback", "rewind-to-launch", "spawn", "first-run-is-real",
        "R10", "runtime-handles"]

