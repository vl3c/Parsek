  { cmd = "StartRecording", expect = "OK", budget = 180 },
  # A few seconds of pad time so the loop unit's span clears MinLoopDurationSeconds.
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
