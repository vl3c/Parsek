schema = 1
id = "SCI-1-science-reearned-after-rewind"
# WHAT IT PROVES. Science re-earned after a Rewind-to-Launch, under the OWNER RULING of
# 2026-10-26 ("Earliest recovery wins (as today)"; design sections 12.6 / 12.7 stand). A
# committed flight earns a science subject (the Mystery Goo on the pad); the player rewinds to
# before that flight's launch and earns the SAME subject again on an unrecorded re-run,
# recovered before the committed flight's own earning UT. Science is keyed by subject
# (experiment + situation): the first earning in UT order is paid the most and later earnings
# the shrinking remainder, as stock does. So the re-run is paid in full, the committed flight is
# capped to the remainder in the replay, the career total never drops, and nothing is paid twice
# or taken back.
#
# THE MECHANISM, FROM SOURCE (main 20d611f, after LEDGER-EVENT-IDENTITY steps 1-8).
#   (a) `GameActions/ScienceModule.ProcessEarning` walks earnings in UT order (capture UT since
#       step 1, cseq as the tie key) and caps each subject: headroom = maxValue - creditedTotal,
#       effective = min(awarded, headroom). Every walk logs `Earning:` or `Earning (cap hit):`
#       with awarded (float R), effective (double R) and recordingId (`ScienceModule.cs` 541 /
#       551). A recovered reading's capture UT is the recovery UT, so the committed row stays
#       near UT 338 and the re-run's near UT 200: the re-run walks first.
#   (b) The re-run is UNRECORDED (autoRecordOnLaunch off), so its recovery science is a direct
#       untagged ledger row: `KSC science recorded: subject='...' ... recordingId=(none)`. The
#       fresh launch guid keeps it from being tagged to the first flight.
#   (c) Nothing raises the subject before the re-run: the committed-future mirror counts only
#       rows at or before the clock (`CommittedMilestoneReach`), and the committed row is still
#       ahead, so stock pays the re-run the full first-reading value. No take-back fires: the
#       re-run is the first payment of the subject on this timeline (`StockShadowTakeBack`
#       takes back only what a forgotten earlier witness already covers).
#
# THE SHAPE (re-cut 2026-10-26 onto the stock tree, see STATUS). Host `cs-science-new`
# on `stock-tree` (CS-1's host: a genuine stock Science game, science 0, start node only,
# the CS Flea in its own `Ships/VAB/`, stock's asteroid in orbit, so LoadGame forces the
# Space Center). (1) CS-1's VAB launch of the CS Flea (three Goo units) and its hop, with
# ONE Goo reading on the pad before ignition (`padExperiments`) and a landed crew report
# only (`landedExperiments`: a landed Goo could roll the LaunchPad biome, L3's boundary,
# and add a second reading of the subject under test); recovery credits both and the scene
# exit auto-commits the recorded flight. (2) `InvokeRewindToLaunch tree=latest` from the
# Space Center: back to 15 s before that flight's launch
# (`RecordingStore.RewindToLaunchLeadTimeSeconds`), the Flea STRIPPED from the save
# (`PreProcessRewindSave`). (3) Recording off; a fresh CS Flea from the VAB; `PartAction
# button=experiment part=GooExperiment all=true` presses all THREE Goo units'
# DeployExperiment (the verb has no per-unit selector: `part=` is a part NAME, `pid=` a
# VESSEL, and three same-name candidates without `all=true` refuse
# `partaction-part-arg-ambiguous`); a 1x wait to UT 200 lets stock create the data (the
# deploy animation runs first) and the inspect read `exp:data=1` on all three; `Recover` of
# the pad vessel. All three readings are the pad subject `mysteryGoo@KerbinSrfLandedLaunchPad`.
# (4) A third, unrecorded VAB launch (a Science game charges nothing), a FLIGHT warp to UT
# 900 (past the committed recovery, near UT 350-450; stock's recovery summary locks warp at
# the KSC), a save, and the `LedgerGroundTruth` batch (it runs in a Science game since PR
# #2272, `pools=science`), whose at-clock walk is then a FULL walk with every earning in it
# (`RecoveredRecordingEvidence`: the recovered Flea never respawns). No funds anywhere.
#
# THE CONTRACTS AND WHY EACH IS SOUND.
#   (A) required, the first-run rule: a post-rewind untagged earning carries the SAME
#       `awarded=` string as the pre-rewind tagged earning (backreference), i.e. the re-run's
#       first reading was paid from `subject.science = 0`, in full.
#   (B) required: an untagged `Earning:` (not the cap-hit form) after `sci1-rewound`.
#   (C) required, the remainder rule: after `sci1-second-recovered`, the committed earning logs
#       in the `Earning (cap hit):` form with the pre-rewind `awarded` and recordingId
#       (backreferenced). It appears only in a FULL walk (flight 3 past UT 900, the ground
#       truth), when the committed row is behind the clock.
#   (D) forbidden: any take-back (`[TakeBack] Took back`), the over-cap forgotten-credit line,
#       and a kept `reason=leak` adjustment. Each would mean the career paid or booked the
#       subject twice. The pool must close (`result: hardFailures=0`).
#   Premise lines: flight 1's tagged Goo capture, the rewind, three VAB launches, the
#   three-unit Goo press, all three canisters holding data, the untagged KSC science row,
#   the ground truth running in SCIENCE_SANDBOX.
#
# MEASURED (reading run 2026-10-26 on DLL 2d8150c5, main with #2275, before the identity work;
# it red PARSEK-FAIL against the old pre-ruling pins, exactly in this shape): committed
# `Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=3, effective=3 ...
# recordingId=4d46922b...`; after the rewind (UT 0.08) the re-read recovered at UT 200 paid
# `awarded=3, effective=3 ... recordingId=(none)`, the second and third cans 0.69 and 0.16; at
# the crossing (UT 338) the committed flight `Earning (cap hit): ... awarded=3,
# effective=0.0479, headroom=0.0479`; LedgerGroundTruth science 10.4 / 10.4, hardFailures=0.
#
# PRE-REGISTERED READINGS. `recover-button-locked` on the second Recover (stock's experiment
# results dialog is up): a seam limit, not Parsek. `partaction-event-unavailable` on the Goo
# press: a premise miss. `partaction applied ... count=` other than 3: the craft lost a Goo unit
# at load. `backward-warp` on the UT 200 wait: raise the target, keep it below the committed
# recovery UT. (A) red with (B) green: the re-run was paid less than a first reading, so
# something raised the subject before it (read the `Applied committed science` lines). A
# `[TakeBack] Took back` line: read its identity and reason first; a take-back of the re-run is
# a product defect, one of an unrelated subject is a lane premise to re-read. An untagged row
# carrying a 32-hex recordingId: the re-run was tagged to the first flight, a second defect.
#
# STATUS: LIVE-PROVEN 2026-10-27. Authored 2026-10-25 (branch `sci1-local`) on `career-science-pad`; its
# first flight was INVALID (stock-minimal's ProbesBeforeCrew locked the Flea's parts in the VAB),
# re-cut 2026-10-26 onto `cs-science-new` / `stock-tree`. The reading run above red as predicted
# against the pre-ruling pins; RE-PINNED 2026-10-27 (branch `claude/project-thread-25edvc`) to the
# owner ruling and the identity build. First flight on them, `2026-10-27_1654` (main 4e99926, DLL
# c5ed3518): PARSEK-FAIL on one pin only. Every ruling pin matched (the re-run paid in full, the
# committed earning capped, no take-back, no leak), LedgerGroundTruth `hardFailures=0`, batch
# `passed=2 failed=0 skipped=1`; the premise pin expected flight 1's recovery capture tagged, and the
# live line reads `tag='' deployed=False directLedger=True` (the recovery runs after the scene-exit
# commit; the ledger row carries the recordingId, pin (A)). Re-pinned to the measured line and the
# batch pinned whole. LIVE-PROVEN on the re-pin: `2026-10-27_1710` PASS attempt 1 (644 s).
tier = "operator"
description = "Science re-earned after Rewind-to-Launch, in a stock Science game: a committed CS Flea hop earns the pad Goo subject, the player rewinds and re-earns it with three Goo readings on an unrecorded pad re-run before the committed earning UT; by the owner ruling the earliest recovery wins, so the re-run is paid in full, the committed flight is capped to the remainder in the replay, and nothing is paid twice or taken back."
instanceProfile = "stock-tree"
tags = ["SCI-1", "science", "science-mode", "rewind", "rewind-to-launch", "ledger",
        "ground-truth", "recovery", "editor", "flown"]

[fixture]
# CS-1's host; the CS Flea lives in the fixture's own `Ships/VAB/`.
saveTemplate = "fixtures/saves/cs-science-new"
injectedRecordings = "none"
craft = []

[driver]
kind    = "autopilot"
mission = "science_bench_recover"

# Budget arithmetic: 300 LoadGame + 3 x (120 GoToEditor + 180 LaunchFromEditor) + 1440
# mission + 300 rewind + 300 1x wait + 120 Recover + 120 warp + 120 save + 540 RunTests
# = 4140; runtime 4800 adds the inert steps and FlushAndQuit.
steps = [
  # scene = "spacecenter": the host holds stock's asteroid, which would otherwise boot the
  # load into FLIGHT on it, where GoToEditor refuses (CS-1's first flight).
  { cmd = "LoadGame",         args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",       args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  { cmd = "SetSetting",       args = { name = "autoMerge",          value = "true" }, expect = "OK" },
  { cmd = "SetSetting",       args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # ---- flight 1: the committed earning ----
  { cmd = "GoToEditor",       args = { facility = "VAB", craft = "CS Flea" },       expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                                       expect = "OK", budget = 180 },
  { phase = "mission",                                                              expect = "MISSION-OK", budget = 1440 },
  # The recovery leaves FLIGHT, so the tree auto-commits at the scene exit (L3's shape).
  { cmd = "CommitTree",                                                             expect = "REJECTED" },
  { cmd = "RecordingState",                                                         expect = "OK" },
  { cmd = "MissionMark",      args = { label = "sci1-first-committed" },            expect = "OK" },
  # ---- the rewind (from the Space Center, as L8) ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                       expect = "OK", budget = 300 },
  { cmd = "MissionMark",      args = { label = "sci1-rewound" },                    expect = "OK" },
  # The rewind save carries the settings of the recording start; the re-run is unrecorded.
  { cmd = "SetSetting",       args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",       args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  # ---- flight 2: the re-run on the pad, before the committed earning UT ----
  { cmd = "GoToEditor",       args = { facility = "VAB", craft = "CS Flea" },       expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor", label = "flea2",                                       expect = "OK", budget = 180 },
  # all=true is required: the CS Flea carries three GooExperiment parts and the verb has
  # no per-unit selector, so all three pad readings are taken (arithmetic in the header).
  { cmd = "PartAction",       args = { button = "experiment", part = "GooExperiment", all = "true" }, expect = "OK" },
  # 1x: stock's results dialog follows the data, and a 1x wait ignores a TIMEWARP lock.
  { cmd = "WarpToUT",         args = { ut = "200", maxRate = "1" },                 expect = "OK", budget = 300 },
  { cmd = "PartAction",       args = { button = "inspect", part = "GooExperiment", all = "true" }, expect = "OK" },
  { cmd = "Recover",          args = { pid = "${flea2.pid}" },                      expect = "OK", budget = 120 },
  { cmd = "MissionMark",      args = { label = "sci1-second-recovered" },           expect = "OK" },
  # ---- flight 3: past the committed recovery, then the ground truth ----
  { cmd = "GoToEditor",       args = { facility = "VAB", craft = "CS Flea" },       expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                                       expect = "OK", budget = 180 },
  { cmd = "WarpToUT",         args = { ut = "900" },                                expect = "OK", budget = 120 },
  { cmd = "MissionMark",      args = { label = "sci1-past-first-recovery" },        expect = "OK" },
  { cmd = "SaveGame",         args = { name = "persistent" },                       expect = "OK", budget = 120 },
  { cmd = "RunTests",         args = { category = "LedgerGroundTruth" },            expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                           expect = "OK" },
]

# The flight half is CS-1's, key for key (same craft, same pad, same hop), with the
# readings cut to ONE pad Goo and a landed crew report. transmit 0: the pod's INTERNAL
# antenna cannot send science, and the re-earn is about the RECOVERY credit anyway.
[driver.missionParams]
throttle                 = 1.0
apoapsisWindowMeters     = { min = 6000, max = 30000 }
chuteArmMaxRateMps       = 30
chuteFullDeployAltMeters = 2500
landedSituations         = ["LANDED", "SPLASHED"]
ascentTimeoutSeconds     = 90
coastTimeoutSeconds      = 180
descentTimeoutSeconds    = 360
padExperiments           = ["mysteryGoo"]
padCollectTimeoutSeconds = 60
# Narrowed so the landed sweep runs no Goo: the hop can come down on the LaunchPad biome
# (L3's boundary roll) and a landed Goo there would be a second reading of the subject.
landedExperiments        = ["crewReport"]
# 1 pad Goo + 1 landed crew report.
collectMinExperiments = 2
collectTimeoutSeconds = 120
transmitMaxExperiments = 0
transmitMinScienceGain = 0.5
transmitTimeoutSeconds = 120
# Science game: no funds pool. The recovery is proven by the science pool rising across
# it; the pad Goo alone is worth 3.6.
recoverCreditPool     = "science"
recoverMinScienceGain = 1.0
recoverMinFundsGain   = 0.0
recoverTimeoutSeconds = 180

[dimensionsCovered]
D8  = ["science", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "science-mode", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Flight 1 only (CS-1 measured within 1..2 on this hop); flights 2 and 3 are unrecorded.
count = { min = 1, max = 2 }

[expectations.logContracts]
required = [
  # Premise: flight 1's pad Goo credited on recovery. The recovery runs after the scene-exit
  # commit, so no recorder is live and the capture itself is untagged; it goes straight to the
  # ledger (directLedger=True), which attributes it to flight 1's recording through the
  # recovered vessel (pin (A) below reads that recordingId). Measured 2026-10-27_1654.
  "Science subject captured: mysteryGoo@KerbinSrfLandedLaunchPad amount=[0-9.]+ increment=[0-9.]+ total=[0-9.]+ gainMultiplier=[0-9.]+ reason='VesselRecovery' ut=[0-9.]+ tag='' deployed=False directLedger=True[\\s\\S]*?MISSIONMARK label=sci1-first-committed ut=",
  "MISSIONMARK label=sci1-first-committed ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=sci1-rewound ut=",
  "\\A(?:[\\s\\S]*?launchfromeditor complete scene=FLIGHT vessel=CS Flea pid=[0-9]+ site=LaunchPad situation=PRELAUNCH){3}",
  "MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?partaction applied button=experiment pid=[0-9]+ part='GooExperiment' [^\\r\\n]* count=3 ",
  "MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?partaction applied button=inspect pid=[0-9]+ part='GooExperiment' [^\\r\\n]*state='[0-9]+:[^'|\\r\\n]*exp:data=1[^'|\\r\\n]*\\| [0-9]+:[^'|\\r\\n]*exp:data=1[^'|\\r\\n]*\\| [0-9]+:[^'|\\r\\n]*exp:data=1",
  # (c) the re-run's recovery science is an untagged direct ledger row.
  "MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?KSC science recorded: subject='mysteryGoo@KerbinSrfLandedLaunchPad' science=[^ ]+ method=[A-Za-z]+ ut=[0-9.]+ recordingId=\\(none\\) vessel='[^'\\r\\n]*'[\\s\\S]*?MISSIONMARK label=sci1-second-recovered ut=",
  # (A) the first-run rule: the re-run's first reading is paid what flight 1's was.
  "\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=([^,]+), [^\\r\\n]*?recordingId=[0-9a-f]{32}[\\s\\S]*?MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=\\1, [^\\r\\n]*?recordingId=\\(none\\)",
  # (B) the re-run walks first, un-capped.
  "MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=[^,]+, [^\\r\\n]*?recordingId=\\(none\\)",
  # (C) the remainder rule: the committed earning capped once the full walk reaches it.
  "\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=([^,]+), [^\\r\\n]*?recordingId=([0-9a-f]{32})[\\s\\S]*?MISSIONMARK label=sci1-second-recovered ut=[\\s\\S]*?\\[ScienceModule\\] Earning \\(cap hit\\): subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=\\1, [^\\r\\n]*?recordingId=\\2",
  # The ground truth RAN in the Science game (not skipped), on the science pool alone.
  "ground-truth game mode=SCIENCE_SANDBOX pools=science",
  # Measured 2026-10-27_1654 (as CS-2 on the same Science game): one cell skips in Science mode.
  "BATCH_COMPLETE v1 total=3 passed=2 failed=0 skipped=1 category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  # (D) nothing paid twice, booked twice or taken back.
  "\\[TakeBack\\] Took back ",
  "Earning over the cap repeats forgotten credit: subject=mysteryGoo@KerbinSrfLandedLaunchPad",
  "filed StockPoolAdjustment amount=\\S+ reason=leak",
]

[runtime]
budgetSeconds = 4800

[retry]
policy = "once"

[expectedFail]
bugId = ""
