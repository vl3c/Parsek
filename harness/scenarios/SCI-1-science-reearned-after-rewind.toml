schema = 1
id = "SCI-1-science-reearned-after-rewind"
# WHAT IT PROVES. Science re-earned after a Rewind-to-Launch. A committed flight earns a
# science subject (the Mystery Goo on the pad), the player rewinds to before that
# flight's launch and earns the SAME subject again on an unrecorded re-run, before the
# committed flight's own earning UT. The owner rule under test (brief 2026-10-25): stock
# pays the re-run only the REMAINDER of the subject, and the committed flight keeps its
# FULL effective credit.
#
# THE MECHANISM, FROM SOURCE (main 54037b4).
#   (a) `Patches/ScienceSubjectPatch.cs` postfixes `ResearchAndDevelopment.
#       GetExperimentSubject` and `GetSubjectByID`: when the ledger has credited the
#       subject (`TryResolveCommittedScience` -> `LedgerOrchestrator.Science.
#       GetSubjectCredited`), it raises `subject.science` to that value, logging
#       `Applied committed science: <id> <old> -> <new>` (VerboseRateLimited, key
#       `apply-committed`, 30 s). Stock's value for a new reading falls as
#       `subject.science` rises, so a raised subject pays only the remainder.
#   (b) `GameActions/ScienceModule.ProcessEarning` walks earnings in UT order and caps
#       each subject: headroom = maxValue - creditedTotal, effective = min(awarded,
#       headroom). The earlier-UT earning gets priority. Every walk logs `Earning:` (or
#       `Earning (cap hit):`) with awarded (float R), effective (double R) and recordingId.
#   (c) The re-run is UNRECORDED (autoRecordOnLaunch off, nothing staged), so its
#       recovery science goes `GameStateRecorder.OnScienceReceived` ->
#       `LedgerOrchestrator.TryRecordKscScienceSubject`, a direct ledger row:
#       `KSC science recorded: subject='...' ... recordingId=(none)`. The fresh launch
#       guid keeps `ResolveKscScienceRecordingId` from tagging it to the first flight.
#   (d) PREDICTED DEFECT (todo SCIENCE-REEARN-AFTER-REWIND-TAKES-FULL-CREDIT). After the
#       rewind, `ApplyRewindResourceAdjustment` runs a CUTOFF walk (`RecalculateAndPatch(
#       adjustedUT)`), and every later recalc while committed rows lie ahead of the clock
#       is a cutoff walk too. `LedgerOrchestrator.Science` is that cutoff module, so the
#       Goo subject's credit reads 0 (its only credit is the committed recovery, still in
#       the future). The patch raises nothing, stock pays the re-run the FULL first-reading
#       value, the re-run's earlier UT takes priority in the full walk, and the committed
#       flight is capped. The lane is written to the OWNER RULE, so on main it is
#       predicted to red PARSEK-FAIL: (B) missing, (C) matching, (D) missing and the
#       cap-hit forbidden matching. NOTE: design `docs/parsek-game-actions-and-resources-
#       recorder-design.md` sections 12.6 / 12.7 describe exactly that redistribution as
#       intended ("Committing T0 retroactively reduced T1's effective from 10 to 5"), so
#       the rule this lane pins needs an owner ruling before either side is changed.
#
# THE SHAPE. Host `career-science-pad` (L3's: the Jumping Flea on the pad, UT 9.06,
# career). (1) The mission flies L3's hop with a Goo reading on the pad before ignition
# (`padExperiments`) and a landed crew report; recovery credits both and the scene exit
# auto-commits the recorded flight (the recording starts at first staging, after the pad
# reading). (2) `InvokeRewindToLaunch tree=latest` from the Space Center: back to 15 s
# before that launch (`RecordingStore.RewindToLaunchLeadTimeSeconds`), the Flea STRIPPED
# from the save (`PreProcessRewindSave`), so the re-run launches a fresh library Jumping
# Flea from the VAB (shared-ships row). (3) Recording off; launch; `PartAction
# button=experiment part=GooExperiment all=true` presses both Goo units' DeployExperiment
# (the Flea carries two, so `all=true` is required or the press refuses
# `partaction-part-arg-ambiguous`); a 1x wait to UT 200 lets stock create the data (the
# deploy animation runs first) and the inspect read `exp:data=1` on both; `Recover` of
# the pad vessel. Both readings are the pad subject `mysteryGoo@KerbinSrfLandedLaunchPad`.
# (4) A third, unrecorded launch, a FLIGHT warp to UT 900 (past the committed recovery,
# which is near UT 345-420; stock's recovery summary locks warp at the KSC), a save, and
# the `LedgerGroundTruth` batch, whose at-clock walk is then a FULL walk with both
# earnings in it (`RecoveredRecordingEvidence`: the recovered Flea never respawns).
#
# THE CONTRACTS AND WHY EACH IS SOUND.
#   (B) required: `Applied committed science: mysteryGoo@KerbinSrfLandedLaunchPad`
#       between `sci1-rewound` and `sci1-second-recovered`. On a fixed build the raise
#       runs at the Goo press and the recovery. CAVEAT: the rate-limit key is shared by
#       every subject, so a crew-report raise inside the previous 30 s would hide it; the
#       fix should key the limit per subject (todo entry).
#   (C) forbidden, the defect signature: the post-rewind untagged earning carries the
#       SAME `awarded=` string as the pre-rewind tagged earning (backreference). Stock
#       computes both from `subject.science = 0` when nothing raised it; with the raise
#       the re-run's value is strictly smaller, so the strings cannot match.
#   (D) required: after `sci1-second-recovered`, the committed earning logs again with
#       the pre-rewind `awarded`, `effective` and recordingId (all three
#       backreferenced), i.e. un-capped; and forbidden: the same earning in the
#       `Earning (cap hit):` form after that mark.
#   Premise lines: the first flight's tagged Goo capture, the rewind, two VAB launches,
#   both Goo presses, both canisters holding data, the untagged KSC science row.
#
# PREDICTED NUMBERS (measured on first flight). `mysteryGoo@KerbinSrfLandedLaunchPad`:
# HC-2 read `increment=3.60 total=3.6` on that subject, so the first reading is predicted
# 3.6 subject units, cap about 4.68 (Goo scienceCap / baseValue 13 / 10). Owner rule: re-run
# pays about 0.83 + 0.04, committed effective stays 3.6. Defect: re-run pays 3.6 + 0.83,
# committed capped to about 0.25.
#
# PRE-REGISTERED READINGS. `recover-button-locked` on the second Recover (stock's
# experiment results dialog is up): a seam limit, not Parsek. `partaction-event-unavailable`
# on the Goo press (the launch came up uncrewed and stock hides the event): a premise miss.
# `backward-warp` on the UT 200 wait (the rewound clock was later than estimated: rewind
# target about UT 5-35, plus the KSC / VAB time): raise the target, keep it below the
# committed recovery UT. (B) alone red with (C) silent and (D) green: the rate limit hid
# the line. (D) red with `headroom` within 1e-5 of `awarded`: float rounding, not the
# defect. An untagged row carrying a 32-hex recordingId: the re-run was tagged to the
# first flight, a second defect.
#
# STATUS: NOT YET FLOWN. Authored 2026-10-25 (branch `sci1-local`), never flown;
# `operator` and `pending-flight` until the first flight reads the shape. Every pin is a
# regex; nothing numeric is pinned.
tier = "operator"
description = "Science re-earned after Rewind-to-Launch: a committed hop earns the pad Goo subject, the player rewinds and re-earns it on an unrecorded pad re-run before the committed earning UT; the re-run must be paid only the remainder (ScienceSubjectPatch raise) and the committed flight must keep its full effective credit in the ledger walk."
instanceProfile = "stock-minimal"
tags = ["SCI-1", "science", "rewind", "rewind-to-launch", "career", "ledger", "recovery",
        "editor", "pending-flight"]

[fixture]
# L3's host. The library Jumping Flea for the two VAB launches arrives through
# `fixtures/shared-ships.toml`.
saveTemplate = "fixtures/saves/career-science-pad"
injectedRecordings = "none"
craft = []

[driver]
kind    = "autopilot"
mission = "science_bench_recover"

# Budget arithmetic: 300 LoadGame + 1440 mission + 300 rewind + 2 x (120 GoToEditor +
# 180 LaunchFromEditor) + 300 1x wait + 120 Recover + 120 warp + 120 save + 540 RunTests
# = 3960; runtime 4500 adds the inert steps and FlushAndQuit.
steps = [
  { cmd = "LoadGame",         args = { save = "${runSave}", name = "persistent" },    expect = "OK", budget = 300 },
  { cmd = "SetSetting",       args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  { cmd = "SetSetting",       args = { name = "autoMerge",          value = "true" }, expect = "OK" },
  { cmd = "SetSetting",       args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # ---- flight 1: the committed earning ----
  { phase = "mission",                                                              expect = "MISSION-OK", budget = 1440 },
  # The recovery leaves FLIGHT, so the tree auto-commits at the scene exit (L3's shape).
  { cmd = "CommitTree",                                                             expect = "REJECTED" },
  { cmd = "RecordingState",                                                         expect = "OK" },
  { cmd = "MissionMark",      args = { label = "sci1-first-committed" },            expect = "OK" },
  # ---- the rewind (from the Space Center, as L8) ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                       expect = "OK", budget = 300 },
  { cmd = "MissionMark",      args = { label = "sci1-rewound" },                    expect = "OK" },
  # The rewind save carries the settings of the recording start; the re-run is unrecorded.
  { cmd = "SetSetting",       args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",       args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  # ---- flight 2: the re-run on the pad, before the committed earning UT ----
  { cmd = "GoToEditor",       args = { facility = "VAB", craft = "Jumping Flea" },  expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor", label = "flea2",                                       expect = "OK", budget = 180 },
  { cmd = "PartAction",       args = { button = "experiment", part = "GooExperiment", all = "true" }, expect = "OK" },
  # 1x: stock's results dialog follows the data, and a 1x wait ignores a TIMEWARP lock.
  { cmd = "WarpToUT",         args = { ut = "200", maxRate = "1" },                 expect = "OK", budget = 300 },
  { cmd = "PartAction",       args = { button = "inspect", part = "GooExperiment", all = "true" }, expect = "OK" },
  { cmd = "Recover",          args = { pid = "${flea2.pid}" },                      expect = "OK", budget = 120 },
  { cmd = "MissionMark",      args = { label = "sci1-second-recovered" },           expect = "OK" },
  # ---- flight 3: past the committed recovery, then the ground truth ----
  { cmd = "GoToEditor",       args = { facility = "VAB", craft = "Jumping Flea" },  expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                                       expect = "OK", budget = 180 },
  { cmd = "WarpToUT",         args = { ut = "900" },                                expect = "OK", budget = 120 },
  { cmd = "MissionMark",      args = { label = "sci1-past-first-recovery" },        expect = "OK" },
  { cmd = "SaveGame",         args = { name = "persistent" },                       expect = "OK", budget = 120 },
  { cmd = "RunTests",         args = { category = "LedgerGroundTruth" },            expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                           expect = "OK" },
]

# The flight half is L3's, key for key, plus CS-1's staged pad reading. transmit 0: the
# re-earn is about the RECOVERY credit, and a transmitted Goo would credit at a
# different UT through a different path.
[driver.missionParams]
throttle                 = 1.0
apoapsisWindowMeters     = { min = 6000, max = 30000 }
chuteArmMaxRateMps       = 30
chuteFullDeployAltMeters = 2500
landedSituations         = ["LANDED", "SPLASHED"]
ascentTimeoutSeconds     = 90
coastTimeoutSeconds      = 180
descentTimeoutSeconds    = 360
padExperiments           = ["mysteryGoo"]
padCollectTimeoutSeconds = 60
landedExperiments        = ["crewReport"]
# 1 pad Goo + 1 landed crew report.
collectMinExperiments = 2
collectTimeoutSeconds = 120
transmitMaxExperiments = 0
transmitMinScienceGain = 0.5
transmitTimeoutSeconds = 120
recoverMinFundsGain   = 1.0
recoverTimeoutSeconds = 180

[dimensionsCovered]
D8  = ["science", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Flight 1 only (L3 measured 2 on this hop); flights 2 and 3 are unrecorded.
count = { min = 1, max = 2 }

[expectations.logContracts]
required = [
  # Premise: flight 1's pad Goo credited on recovery, tagged to the live recording.
  "Science subject captured: mysteryGoo@KerbinSrfLandedLaunchPad amount=[0-9.]+ increment=[0-9.]+ total=[0-9.]+ gainMultiplier=[0-9.]+ reason='VesselRecovery' ut=[0-9.]+ tag='[0-9a-f]{32}'",
  "MISSIONMARK label=sci1-first-committed ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=sci1-rewound ut=",
  "\\A(?:[\\s\\S]*?launchfromeditor complete scene=FLIGHT vessel=Jumping Flea pid=[0-9]+ site=LaunchPad situation=PRELAUNCH){2}",
  "MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?partaction applied button=experiment pid=[0-9]+ part='GooExperiment' [^\\r\\n]* count=2 ",
  "MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?partaction applied button=inspect pid=[0-9]+ part='GooExperiment' [^\\r\\n]*state='[0-9]+:[^'|\\r\\n]*exp:data=1[^'|\\r\\n]*\\| [0-9]+:[^'|\\r\\n]*exp:data=1",
  # (c) the re-run's recovery science is an untagged direct ledger row.
  "MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?KSC science recorded: subject='mysteryGoo@KerbinSrfLandedLaunchPad' science=[^ ]+ method=[A-Za-z]+ ut=[0-9.]+ recordingId=\\(none\\) vessel='[^'\\r\\n]*'[\\s\\S]*?MISSIONMARK label=sci1-second-recovered ut=",
  # (B) the raise: stock is told the subject is already credited.
  "MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?Applied committed science: mysteryGoo@KerbinSrfLandedLaunchPad [\\s\\S]*?MISSIONMARK label=sci1-second-recovered ut=",
  # (D) the committed earning keeps its pre-rewind awarded / effective, un-capped.
  "\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=([^,]+), effective=([^,]+), [^\\r\\n]*?recordingId=([0-9a-f]{32})[\\s\\S]*?MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?MISSIONMARK label=sci1-second-recovered ut=[\\s\\S]*?\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=\\1, effective=\\2, [^\\r\\n]*?recordingId=\\3",
  "BATCH_COMPLETE v1 total=3 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  # (C) the defect signature: the re-run paid the full first-reading value.
  "\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=([^,]+), [^\\r\\n]*?recordingId=[0-9a-f]{32}[\\s\\S]*?MISSIONMARK label=sci1-rewound ut=[\\s\\S]*?\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=\\1, [^\\r\\n]*?recordingId=\\(none\\)",
  # (D) the committed earning capped after the re-run.
  "\\[ScienceModule\\] Earning: subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=([^,]+), [^\\r\\n]*?recordingId=([0-9a-f]{32})[\\s\\S]*?MISSIONMARK label=sci1-second-recovered ut=[\\s\\S]*?\\[ScienceModule\\] Earning \\(cap hit\\): subject=mysteryGoo@KerbinSrfLandedLaunchPad, awarded=\\1, [^\\r\\n]*?recordingId=\\2",
]

[runtime]
budgetSeconds = 4500

[retry]
policy = "once"

[expectedFail]
bugId = ""
