schema = 1
id = "V31M-duna-ike-continuation-player-loop"
# =====================================================================================
# AUTHORED 2026-11-07, NEVER FLOWN. Committed once `duna-ike-recorded` was harvested from
# B36's first green flight (2026-11-07_2214). Order and commands:
# docs/dev/plans/moon-lane-drafts/README.md.
#
# THE PLAYER-LOOP HALF (modelled on V14M's preamble and V13's build-log reading):
# MissionConfig loop=true + StartLoopPlayback on the Kerbin -> Duna -> Ike tree,
# reading the loop unit's build lines, then the MoonArrivalHold batch at the
# Space Center. No jump table yet: its UTs come from this lane's own reading
# (`phaseAnchor=` / `cadence=` on the ENGAGED line, `hold=` / `recordedArrivalUT=`
# on the ARRIVAL HOLD line). The second revision adds the -180/-60/+140 brackets
# around the replayed Ike SOI entry and pins V17's lens there:
# `shadow .*coverage=InSegment segIdx=\d+ treatment=TracedPath visible=True .*body=Ike`
# (the Director TracedPath drive; NOT the flight-scene proto line, which
# fail-closes to the root frame for a nested-SOI recording).
#
# THE SUBJECT. `duna-ike-recorded`, harvested from `B36-duna-ike-continuation`: the Duna -> Ike hop
# appended to `duna-direct-recorded`'s committed Kerbin -> Duna tree `ccb5e4afd7974dbe9118090468ac00ae` (the forge
# resumes that tree, so the id is unchanged). One tree that crosses Duna's SOI and
# Ike's is exactly the shape PR #2468's lone-moon arrival hold engages on.
#
# WHAT THE LOG MUST SHOW (literals from Source/Parsek/MissionLoopUnitBuilder.cs):
#   `MissionLoopUnit: ... ENGAGED re-aim Kerbin->Duna via Sun` - the re-aim
#       engages on the Kerbin -> Duna member, as on the source fixture's own lanes.
#   `ARRIVAL HOLD dest=Duna kind=config Talign=<P_Ike>s moons=1 ...
#       (aligns the moon orbital phases, mode=` - the lone-moon configuration hold on
#       Ike's period (65,517.86 s; one participant, so T_config = P_Ike).
#   `BATCH_COMPLETE ... category=MoonArrivalHold scene=SPACECENTER` - the live
#       LoneMoonHoldInGameTest cell (1 test, SPACECENTER), pinned whole.
# `MOON HOLD keeps the destination loiter whole` is a CANDIDATE only (commented below):
# it logs only when the loiter compressor cut time AFTER the Duna SOI entry, i.e.
# when the forge's Duna park ran 2+ whole orbits before the hop. Read the reading's
# `ENGAGED re-aim ... loiterCuts=` and the MOON HOLD line (or its absence) first.
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-11-07, NEVER FLOWN. The player loop on the Kerbin->Duna->Ike tree harvested by B36-duna-ike-continuation: re-aim Kerbin->Duna engages and the lone-moon arrival hold (PR #2468) aligns Ike's orbital phase on its period at the Duna SOI entry; the live MoonArrivalHold cell runs at the Space Center."
instanceProfile = "stock-minimal"
tags = ["V31", "player-loop", "loop-playback", "reaim", "arrival-hold", "lone-moon-hold", "duna", "ike", "moon", "ingame-batch", "pending-flight"]

[fixture]
saveTemplate       = "fixtures/saves/duna-ike-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
# The V-lane preamble (the restore-stub kill pair, tracers, verbose), the loop
# reading, then the Space Center batch. The kill pair before the second LoadGame is
# the TS-lane rule (LoadGame refuses while a recorder is live).
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig",     args = { tree = "ccb5e4afd7974dbe9118090468ac00ae", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "ccb5e4afd7974dbe9118090468ac00ae" }, expect = "OK", budget = 300 },
  # SECOND REVISION: the bracket jump table around the replayed Ike SOI entry goes here.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "RunTests",   args = { category = "MoonArrivalHold" },             expect = "OK", budget = 300 },
  # The export sits right before teardown (RenderComposeVerifierWiringTests placement
  # rule): the recorder accumulates from Awake, so an earlier export drops later steps.
  { cmd = "ExportRenderManifest",                                            expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# Every claim is gated below: D11 arrival-hold by the ARRIVAL HOLD line, D14 the
# bodies by the dest= / Talign tokens, scene-ksc by the batch's scene=SPACECENTER.
[dimensionsCovered]
D11 = ["arrival-hold"]
D14 = ["duna", "ike", "scene-flight", "scene-ksc", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Pinned at harvest: `duna-ike-recorded` ships N = 4 `.prec` sidecars (pad head,
# Kerbin->Duna, Duna->Ike, booster debris), so {N, N + 1} (a load-time optimizer split
# adds at most one here).
count = { min = 4, max = 5 }

[expectations.logContracts]
# CANDIDATE, not required (see the header): "MOON HOLD keeps the destination loiter whole: dest=Duna moons=1 ",
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "MissionLoopUnit: mission='DD1 Duna Direct Probe' ENGAGED re-aim Kerbin->Duna via Sun",
  "ARRIVAL HOLD dest=Duna kind=config Talign=6551[78]\\.[0-9]+s moons=1 ",
  "ARRIVAL HOLD dest=Duna kind=config .*\\(aligns the moon orbital phases, mode=",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=MoonArrivalHold scene=SPACECENTER",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "FORCED FAITHFUL",
  "no member yields a re-aim transfer",
  "MOON HOLD declined",
  "Arrival amber SET: tree=ccb5e4afd7974dbe9118090468ac00ae",
  "timejump refused reason=backward-jump",
]

[expectations.rewind]
# REPORT-ONLY until a reading; the source fixture's lanes read 0 / 0 / 0.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# REPORT-ONLY: the forge's one committed tree.
committedTrees = { min = 1, max = 1 }
trees          = { min = 1, max = 2 }

[expectations.renderComposition]

[runtime]
# 2 x 300 LoadGame + 300 StartLoopPlayback + 300 RunTests + 120 manifest + margin.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
