schema = 1
id = "L12-contract-reached-outcome-blocks-fail"
tier = "nightly"
# CAREER x CONTRACTS: A REACHED COMMITTED OUTCOME CANNOT BE UNDERCUT IN FLIGHT (todo
# CONTRACT-FAIL-AFTER-REACHED-COMMITTED-OUTCOME, game-actions design 3.13 rule 1). The flight
# scene applies a committed contract outcome only at the next recalculation, so after a flight
# passes the outcome's UT stock still holds the contract Active. Before the fix stock could
# fail or expire it there: the walk then skips the late fail (the contract already ended) and
# the stock pool reference keeps the penalty stock charged as a leak, a permanent loss.
#
# THE HOST. `career-earned-pad` boots into FLIGHT on the pad Flea with PartTest 07c8e34d Active
# (the only Active contract; ST-1 / LT-3 fly the same host). The one in-game cell files a
# committed Space Center completion of that contract one second behind the clock, moves the
# contract's deadline behind the clock so stock's own ContractSystem update daemon expires it
# through Contract.Update() -> SetState(DeadlineExpired), then calls stock's public Fail(). Both
# must be refused: the contract stays Active, funds and reputation do not move. The cell
# restores the deadline and removes the row; campaign isolation reverts the save.
#
# THE STALE OFFER (todo STALE-OFFER-RE-ACCEPTABLE-AFTER-FLIGHT-PASSES-COMMITTED-RESOLUTION). The
# second cell files a committed zero-amount accept (20 s back) and completion (10 s back) for the
# first live Offered contract and runs the cutoff recalculation a scene entry runs: the walk ends
# the contract, so PatchContracts takes the Offered copy off the board (it would otherwise stay
# acceptable for a second advance). Then it removes the rows and recalculates again.
#
# A DLL WITHOUT THE FIX reds the cell: the old strict-future predicate allows the expiry
# (`allowing fail for guid=... - no committed outcome after now`), the contract leaves Active
# and stock charges the fail penalty.
#
# FAST-LANE CHECKLIST: (1) reuse - the host's boot is ST-1's, no flight; (2)-(5) n/a (no warp,
# dwell, burn or coast); (6) retry once; (7) recordings pinned exactly (the 2 fixture ones);
# (8) nightly, ST-1-sized; (9) run flight_efficiency.py after the first green flight.
#
# STATUS: the stale-offer cell added 2026-10-24 (total 1 -> 2) and flown `2026-10-24_1657` PASS
# attempt 1, 2 of 2 (head b398325, automation DLL sha256 cfca976b...8410). Before that,
# AUTHORED 2026-10-24 and LIVE-PROVEN on its first flight `2026-10-24_1624` (PASS attempt 1,
# automation DLL sha256 5c1d9b2f...a738, branch claude/project-thread-uj5p10 head ba48a1d): the
# expiry refused 16 times by the daemon (logged once), the Fail() refused once, pools unchanged.
description = "Career pad flight with an Active contract whose committed completion lies one second behind the clock: stock's own deadline expiry and its public Fail() are both refused, the contract stays Active, and funds and reputation do not move; and an Offered contract whose committed accept and completion lie behind the clock leaves the board at the next career update."
instanceProfile = "stock-minimal"
tags = ["L12", "ingame-batch", "career", "contracts", "committed-value"]

[fixture]
saveTemplate = "fixtures/saves/career-earned-pad"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "RunTests",   args = { category = "ContractReachedOutcome" },          expect = "OK", budget = 300 },
  { cmd = "FlushAndQuit",                                                        expect = "OK" },
]

[dimensionsCovered]
D14 = ["career", "scene-flight"]

[expectations]
