  # The stale offer (todo STALE-OFFER-RE-ACCEPTABLE-AFTER-FLIGHT-PASSES-COMMITTED-RESOLUTION).
  "\\[Parsek\\]\\[INFO\\]\\[TestRunner\\] contract stale offer: fixture guid=\\S+ title=\"[^\"]+\" committedAcceptUT=[0-9.]+ committedCompleteUT=[0-9.]+ now=[0-9.]+ offeredBefore=1",
  "\\[Parsek\\]\\[INFO\\]\\[KspStatePatcher\\] PatchContracts: removed 1 Offered copy\\(ies\\) of contract\\(s\\) whose committed lifecycle already ended: ",
  "\\[Parsek\\]\\[INFO\\]\\[TestRunner\\] contract stale offer: after career update offered=0 active=0 listed=0",
