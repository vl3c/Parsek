  "\\[Parsek\\]\\[INFO\\]\\[ContractEarlyFailPatch\\] refusing fail of \"[^\"]+\" guid=07c8e34d\\S* end=DeadlineExpired - committed ContractComplete ut=[0-9]+ already reached nowUT=[0-9]+ recording=\\(ksc\\); the contract stays Active until the next career update applies it",
  "\\[Parsek\\]\\[INFO\\]\\[ContractEarlyFailPatch\\] refusing fail of \"[^\"]+\" guid=07c8e34d\\S* end=Failed - committed ContractComplete ut=[0-9]+ already reached",
  "\\[Parsek\\]\\[INFO\\]\\[TestRunner\\] contract reached outcome: expiry state=Active refused=[1-9]",
  "\\[Parsek\\]\\[INFO\\]\\[TestRunner\\] contract reached outcome: fail state=Active refused=1 ",
