schema = 1
id = "FORGE-b18-dres-pad"
# =====================================================================================
# FIXTURE-FORGE for the B18 Dres-program lane. NOT a coverage flight.
#
# operator tier: like its five siblings this NEVER runs on a cadence, only under an
# explicit `--id FORGE-b18-dres-pad` / `--tier operator`. It boots the SAME committed
# bdock-forge-base every forge boots, launches the NEW committed `Duna Rocket` craft
# onto the pad with ONE named crew, waits for it to settle PRELAUNCH, and
# SaveGame + FlushAndQuit persist the pad state. Then
#
#   python harness/tools/harvest_bdock_station.py --instance <ksp-instance> \
#       --run-save bdock-forge-base --target-name b18-dres-pad \
#       --expect-situation PRELAUNCH
#
# prunes Parsek state, normalizes the title, and writes the committed
# `fixtures/saves/b18-dres-pad` fixture that B18-dres-lko-ascent consumes.
#
# NO NEW HARVEST TOOL and NO NEW MISSION, deliberately (the FORGE-gs1 / FORGE-b17
# argument verbatim): harvest_bdock_station.py is already generic over the produced
# situation and the fixture name, and `forge_station` is already generic over craft +
# launch site + crew names. This spec is the SIXTH consumer of both.
#
# THE CRAFT is `Duna Rocket` (KerbalX, author Steltuck), a PURE STOCK 92-part
# 1.12.1 craft committed VERBATIM -- byte-identical to its download, sha256
# f664d7ce27710420976e5454ccaed9c1ae872a302455e7369048ffdf8f555fc2. It is NOT
# authored by construction the way the DD1 was (build_dd1_craft.py), so it carries
# no derivation record and no drift gate: the craft file itself IS the record. It
# was NOT edited to add MechJeb -- MechJeb capability is INSTALL-side on this
# profile (the provisioner's MM patch adds MechJebCore to every pod), which is why
# a grep for `mechjeb` over this craft returns zero hits exactly like every other
# committed fixture craft.
#
# ARCHITECTURE (measured off the craft file, not the KerbalX blurb):
#   istg 7  3x liquidEngineMainsail.v2      liftoff (core + 2 radial boosters)
#   istg 6  radial booster sep (2x radialDecoupler1-2, 8x sepMotor1, 2x Rockomax64
#           + 2x Rockomax32 + 2x adapterSize2-Size1 of LFO, crossfed by 2 fuelLines)
#   istg 5  core LFO (2x Rockomax64.BW) + Decoupler.2 + fairingSize2
#   istg 4  engineLargeSkipper.v2          upper ascent
#   istg 3  Skipper LFO (Rockomax32 + 2x Rockomax8) + Decoupler.1
#   istg 2  nuclearEngine (LV-N Nerv)      transfer stage
#   istg 1  4x MK1Fuselage radial drop tanks (radialDecoupler + fuelLine each)
#   istg 0  2x MK1Fuselage core LF, chutes, solar, commDish, Decoupler.1
#   istg -1 mk1pod.v2 + HeatShield1
# Totals: LiquidFuel 19,520 / Oxidizer 21,120 / SolidFuel 64 / Ablator 200.
#
# ONE NAMED CREW IS LOAD-BEARING, the GS-1 argument verbatim and the INVERSE of
# FORGE-b17's uncrewed contract: this stack's ONLY command part is the single
# mk1pod.v2 (grep: exactly one `name = ModuleCommand` in the whole craft), whose
# ModuleCommand carries minimumCrew = 1. An EMPTY pod is an UNCONTROLLED rocket --
# kRPC could still read it, but throttle and staging would do nothing and B18 would
# burn its whole budget sitting on the pad. B17 could be uncrewed because the DD1
# is OKTO2-controlled (minimumCrew = 0); this craft has no probe core at all.
# It is a SANDBOX save, so nothing about the roster is asserted.
#
# WHAT A FAILED FIRST RUN MEANS. Unlike the B17 forge there are no A1-A8 authoring
# assumptions to fall over -- this craft was built in a real VAB and flown by a
# human, so a load failure here is an ENVIRONMENT finding (a part this profile does
# not ship, or a 1.12.1 -> 1.12.5 craft-format issue), not a craft-authoring one.
# The forge asserts nothing about Parsek and its logContracts.required list is
# empty on purpose: a failure classifies driver-INVALID (retryable), never a
# PARSEK-FAIL.
# =====================================================================================
tier = "operator"
description = "FIXTURE-FORGE: boot the committed forge base, launch the stock Duna Rocket onto the pad with one named crew, settle PRELAUNCH, SaveGame -- stamps the b18-dres-pad fixture (harvest_bdock_station.py --target-name b18-dres-pad)."
instanceProfile = "stock-minimal"
tags = ["FORGE", "fixture", "B18", "dres", "pending-flight"]

[fixture]
# The SAME committed bootable base the other five forges use. This change ADDS
# `Duna Rocket.craft` to its Ships/VAB and changes nothing else about the base, so
# every existing forge is untouched (a forge selects its craft by the craftName
# param).
saveTemplate       = "fixtures/saves/bdock-forge-base"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
# UNCHANGED mission: `forge_station` is already generic over craft + launch site +
# crew names. No mlib edit, no new mission code, no new schema for the forge half.
mission = "forge_station"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header (a
# key after the sub-table header would be TOML-scoped to driver.missionParams.steps
# and the spec would validate as having zero steps).
#
# No SetSetting: the pad craft never stages here, so no recording starts, and the
# harvest prunes any Parsek/ dir regardless.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { phase = "mission",  expect = "MISSION-OK", budget = 180 },
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[driver.missionParams]
craftName            = "Duna Rocket"
launchSite           = "LaunchPad"
# ONE named crew (see the header): the single mk1pod.v2 is the only command part and
# carries minimumCrew = 1, so an empty pod is an uncontrolled rocket.
crewNames            = ["Jebediah Kerman"]
# Game-seconds to see the new craft settle PRELAUNCH before flaking. WIDER than the
# 120 the sibling forges use: this is a 92-part, ~260 t stack (the DD1 is a fraction
# of both), and launch_vessel is a scene reload whose cost scales with part count.
launchTimeoutSeconds = 180
settleDebounceFrames = 3

# The forge is a fixture stamp, not a coverage flight: it commits no recording and
# asserts nothing about Parsek. Only the honest environment cells are cited.
[dimensionsCovered]
D14 = ["kerbin", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read (hlib.validate_spec REJECTS the misplaced form),
# so this key must stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# The pad craft never stages here, so no recording starts / commits. max 1 absorbs a
# nascent auto-record if the base's persisted setting happens to be on; the harvest
# prunes Parsek state regardless. Same window as the sibling pad forges.
count = { min = 0, max = 1 }

[expectations.logContracts]
# EMPTY required list, deliberately: a forge asserts nothing about Parsek, and a
# required token here would convert a fixture-stamping failure into a PARSEK-FAIL.
# The forbidden ERROR pattern stays - a forge that makes Parsek throw is still a
# finding, and the sibling forges have never emitted one.
required  = []
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# 240 LoadGame + 180 mission + the fast SaveGame / FlushAndQuit verbs + margin.
# The sibling pad forges size this at 500 against a 120 s mission; the extra 60 s of
# mission budget (92-part scene reload) carries straight through.
budgetSeconds = 560

[retry]
policy = "once"

[expectedFail]
bugId = ""
