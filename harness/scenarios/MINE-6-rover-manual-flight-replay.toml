[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 1 }

[expectations.logContracts]
required = [
  # --- ACT 1: the presses (TestCommandPartAction.cs:626-639 FormatAppliedLine) ---
  "partaction applied button=deploy pid=110406740 part='MiniDrill' [^\\r\\n]*count=4",
  "partaction applied button=startconverter pid=110406740 part='MiniDrill' [^\\r\\n]*converter='Surface Harvester' [^\\r\\n]*count=4",
  # The four ISRU presses and the two radiator presses landed ON RAILS (AppendWarpContext,
  # TestCommandPartAction.cs:608-615, the tail at :611).
  "partaction applied button=startconverter pid=110406740 part='MiniISRU' [^\\r\\n]*converter='Lf\\+Ox' state='[^'\\r\\n]*Lf\\+Ox:active=1[^'\\r\\n]*' count=1 packed=1 warpIndex=[1-9]",
  "partaction applied button=stopconverter pid=110406740 part='MiniISRU' [^\\r\\n]*converter='Lf\\+Ox' state='[^'\\r\\n]*Lf\\+Ox:active=0[^'\\r\\n]*' count=1 packed=1 warpIndex=[1-9]",
  "partaction applied button=startconverter pid=110406740 part='MiniISRU' [^\\r\\n]*converter='MonoPropellant' state='[^'\\r\\n]*MonoPropellant:active=1[^'\\r\\n]*' count=1 packed=1 warpIndex=[1-9]",
  "partaction applied button=stopconverter pid=110406740 part='MiniISRU' [^\\r\\n]*converter='MonoPropellant' state='[^'\\r\\n]*MonoPropellant:active=0[^'\\r\\n]*' count=1 packed=1 warpIndex=[1-9]",
  # `radiator:cooling=0|1` (TestCommandPartAction.cs:525); all four switched each way.
  "partaction applied button=radiatoroff pid=110406740 part='radPanelSm' [^\\r\\n]*state='(?:(?!cooling=1)[^'\\r\\n])*radiator:cooling=0(?:(?!cooling=1)[^'\\r\\n])*' count=4 packed=1 warpIndex=[1-9]",
  "partaction applied button=radiatoron pid=110406740 part='radPanelSm' [^\\r\\n]*state='(?:(?!cooling=0)[^'\\r\\n])*radiator:cooling=1(?:(?!cooling=0)[^'\\r\\n])*' count=4 packed=1 warpIndex=[1-9]",
  "partaction applied button=stopconverter pid=110406740 part='MiniDrill' [^\\r\\n]*converter='Surface Harvester' [^\\r\\n]*count=4",
  "partaction applied button=retract pid=110406740 part='MiniDrill' [^\\r\\n]*count=4",
  # Each mid-warp press ran inside a detached warp that a blocking WarpToUT took over
  # (ParsekTestCommandAddon.WarpToUT.cs:267 start, :370 ended + :192 detail).
  "warptout detached start id=[^\\r\\n]* ut=1800 [^\\r\\n]*maxRate=100",
  "warptout detached ended reason=superseded id=[^\\r\\n]* lowered=false elapsed=[0-9.]+s by=[^\\r\\n]* newDetach=false",
  # --- The recorder's part events (Verbose; verboseLogging is on) ---
  # Animation-group deploy / retract (FlightRecorder.cs:3231-3232, event types :2663 / :2676).
  "Part event: DeployableExtended 'MiniDrill' pid=[0-9]+ midx=[0-9]+ \\(animation-group\\)",
  "Part event: DeployableRetracted 'MiniDrill' pid=[0-9]+ midx=[0-9]+ \\(animation-group\\)",
  # Converter edges per part (FlightRecorder.cs:2303-2304; types :2261 / :2273).
  "Part event: ConverterActivated 'MiniDrill' pid=[0-9]+ \\(converter\\)",
  "Part event: ConverterDeactivated 'MiniDrill' pid=[0-9]+ \\(converter\\)",
  # THE EVENT UTs (see THE OPEN QUESTION in the header): the first flight (`2026-10-17_1348`)
  # wrote every packed ISRU edge about 10 ms after its press, still packed and long before
  # the rails exit, so each edge must sit between its press's `-before` and `-after` marks.
  "(?s)MISSIONMARK label=mine6-lfox-on-before (?:(?!MISSIONMARK label=mine6-lfox-on-after ).)*?Part event: ConverterActivated 'MiniISRU' pid=[0-9]+ \\(converter\\)(?:(?!MISSIONMARK).)*?MISSIONMARK label=mine6-lfox-on-after ",
  "(?s)MISSIONMARK label=mine6-lfox-off-before (?:(?!MISSIONMARK label=mine6-lfox-off-after ).)*?Part event: ConverterDeactivated 'MiniISRU' pid=[0-9]+ \\(converter\\)(?:(?!MISSIONMARK).)*?MISSIONMARK label=mine6-lfox-off-after ",
  "(?s)MISSIONMARK label=mine6-mono-on-before (?:(?!MISSIONMARK label=mine6-mono-on-after ).)*?Part event: ConverterActivated 'MiniISRU' pid=[0-9]+ \\(converter\\)(?:(?!MISSIONMARK).)*?MISSIONMARK label=mine6-mono-on-after ",
  "(?s)MISSIONMARK label=mine6-mono-off-before (?:(?!MISSIONMARK label=mine6-mono-off-after ).)*?Part event: ConverterDeactivated 'MiniISRU' pid=[0-9]+ \\(converter\\)(?:(?!MISSIONMARK).)*?MISSIONMARK label=mine6-mono-off-after ",
  # The harvest window opens when the drills start and closes when they stop (both at 1x;
  # FlightRecorder.cs:7894 / :7918; the stop-time close at :8095 says atStop=1).
  "Harvest window opened: window=[^ \\r\\n]+ ut=[0-9.]+ converters=\\[[^\\]\\r\\n]*\\] res=[0-9]+ atStart=0 trigger=[a-z-]+",
  "(?s)MISSIONMARK label=mine6-stop-before .*?Harvest window closed: window=[^ \\r\\n]+ ut=[0-9.]+ res=[0-9]+ atStop=0 trigger=[a-z-]+",
  # --- THE COMMIT: the scene exit and its auto-commit ---
  # ParsekTestCommandAddon.ExitToSpaceCenter.cs:67 / :128; ParsekScenario.cs:8080 (Silent) or
  # :8099 (Limbo-preserving), both "full-fidelity auto-commit (scene-exit...): tree='...'".
  "exittospacecenter start scene=FLIGHT autoMerge=true hasActiveTree=true hasPendingTree=false",
  # The rover never moves 30 m; its drill and ISRU toggles keep the exit from discarding it
  # as idle on pad (ParsekFlight.TreeHasConverterWorkForIdle; the first flight lost it).
  "IsTreeIdleOnPad: not idle - tree has (?:[7-9]|[1-9][0-9]+) converter toggle\\(s\\) tree='Mining Rover RC'",
  "exittospacecenter complete scene=SPACECENTER",
  "full-fidelity auto-commit \\(scene-exit[^\\r\\n]*\\): tree='Mining Rover RC' recordings=1 ",
  "MISSIONMARK label=mine6-committed-1-[0-9a-f]{32} ",
  "invokerewindtolaunch complete rec=[0-9a-f]{32} tree=[0-9a-f]{32} adjustedUT=",
  # --- ACT 3: the watched replay ---
  "MISSIONMARK label=mine6-ghost-live-spawned-false ",
  # The watch is on the committed miner recording (ParsekTestCommandAddon.EnterWatchMode.cs:217).
  "MISSIONMARK label=mine6-committed-1-([0-9a-f]{32}) [\\s\\S]*enterwatchmode complete: index=[0-9]+ recId=\\1",
  # The ghost applied the drill deploy, the converter loop start and stop, and the retract
  # (GhostPartEventApplyLog.cs:214 FormatLine; tallies at GhostPlaybackLogic.cs:1907-1922
  # deployable and :1936-1951 converter-loop), and drove the loop (GhostPlaybackLogic.cs:6163).
  "(?s)MISSIONMARK label=mine6-rewound-reloaded .*?apply family=DeployableExtended surface=deployable rec=[0-9]+ pid=[0-9]+ applied=[1-9][0-9]* ",
  "(?s)MISSIONMARK label=mine6-rewound-reloaded .*?apply family=ConverterActivated surface=converter-loop rec=[0-9]+ pid=[0-9]+ applied=[1-9][0-9]* ",
  "(?s)MISSIONMARK label=mine6-rewound-reloaded .*?Converter loops driven: [1-9][0-9]* \\(vessel='Mining Rover RC'\\)",
  "(?s)MISSIONMARK label=mine6-rewound-reloaded .*?apply family=ConverterDeactivated surface=converter-loop rec=[0-9]+ pid=[0-9]+ applied=[1-9][0-9]* ",
  "(?s)MISSIONMARK label=mine6-rewound-reloaded .*?apply family=DeployableRetracted surface=deployable rec=[0-9]+ pid=[0-9]+ applied=[1-9][0-9]* ",
  # The end spawn while watched hands the active vessel to the spawned rover
  # (ParsekPlaybackPolicy.cs:802-811 or the deferred :578-587 -> ParsekFlight.cs:21245), and
  # that is the vessel the store reads back as the spawn.
  "MISSIONMARK label=mine6-spawned-true-[0-9]+ ",
  "(?s)MISSIONMARK label=mine6-replay-before-end .*?Activated spawned vessel pid=([0-9]+) \\(Mining Rover RC\\).*?MISSIONMARK label=mine6-spawned-true-\\1 ",
  "(?s)MISSIONMARK label=mine6-spawned-(?:(?!cmd=ReadVesselResources start).)*?cmd=ReadVesselResources start(?:(?!cmd=ReadVesselResources start).)*?readvesselresources complete vessels=1 missing=0 uidCollisions=0 [^\\r\\n]*snapshotMatch=true",
  # The spawned rover carries the end pose and state: drills retracted, no converter running.
  "(?s)MISSIONMARK label=mine6-spawned-true-.*?partaction applied button=inspect pid=[0-9]+ part='MiniDrill' [^\\r\\n]*state='(?:(?!deployed=1)[^'\\r\\n])*deployed=0(?:(?!deployed=1)[^'\\r\\n])*' count=4 ",
  "(?s)MISSIONMARK label=mine6-spawned-true-.*?partaction applied button=inspect pid=[0-9]+ part='MiniISRU' [^\\r\\n]*state='(?:(?!:active=1)[^'\\r\\n])*' count=1 ",
]
forbidden = [
  "Idle on pad at scene exit",
  "\\[Parsek\\]\\[ERROR\\]",
  "partaction rejected",
  "warptout refused",
  # ParsekTestCommandAddon.WarpToUT.cs:330 / :345.
  "warptout detached timeout",
  "warptout detached threw",
  "invokerewindtolaunch refused",
  "enterwatchmode rejected",
  # ParsekScenario.cs:8135: a ghost-only commit nulls the snapshot, so nothing could spawn.
  "Ghost-only auto-commit",
  "Spawn RETIRED",
  "Spawn ABANDONED",
  "Spawn FAILED",
  "uidCollisions=[1-9]",
  # A part lost while recording (radiators off too long overheats the 1200 K parts).
  "Within-segment breakage",
  # ParsekFlight.cs:21241 / :21249: the camera handoff did not reach the spawned rover.
  "Spawned vessel pid=[0-9]+ not loaded",
  "Could not find spawned vessel pid=",
]

[runtime]
# Four LoadGame / rewind steps (up to 300 s each), the Space Center exit and three saves
# (120 s each), about 70 s of 1x and ladder time while recording, and the replay: 1x / 5x to
# UT 36, 100x to 1562 (~15 s) and 28 s of 1x across the end.
budgetSeconds = 2100

[retry]
policy = "once"

[expectedFail]
