schema = 1
id = "MINE-6-rover-manual-flight-replay"
tier = "nightly"
# THE MINING PROGRAM, lane MINE-6 (plan `docs/dev/research/mining-isru-test-program-2026-10-17.md`,
# closes GS-6r3 if its ghost converter-loop gate goes green). NEVER FLOWN: its first flight is
# a READING run. Every regex below matches a literal found in C# source (file:line cited where
# the line is not one the sibling lanes already pin).
#
# HOST: `miner-rover-watched` (harness/tools/build_miner_rover_watched.py), MINE-9's fixture:
# V's real "Mining Rover RC" (pid 110406740, index 0, active, radiators on, tanks empty, every
# converter clock at UT 30; 4 x `MiniDrill` with converter `Surface Harvester`, 1 x `MiniISRU`
# with `Lf+Ox` / `LiquidFuel` / `Oxidizer` / `MonoPropellant`, 4 x `radPanelSm`) and the
# crewless `Miner Watcher` (pid 3179797026) parked 120 m north. After Rewind-to-Launch strips
# the miner, a reload of the rewound save lands FLIGHT on the watcher, close enough to the
# miner's ghost to watch it and to load the spawned miner.
#
# THE STORY is V's manual flight (his collected log `logs/2026-10-17_1419_mining-rover`), step
# for step: deploy all four drills; start all four Surface Harvesters; climb the rails ladder in
# steps (5x, 10x, 50x, then 100x; never above 100x); WHILE ON RAILS switch the ISRU's `Lf+Ox`
# on and later off; flick the radiators off and straight back on while on rails (only
# briefly: radiators off through a long warp overheats the 1200 K parts, MINE-2 flight 1);
# while on rails switch `MonoPropellant` on and later off; back at 1x stop all four
# harvesters and retract the drills; exit to the Space Center (the scene-exit auto-commit
# under autoMerge, EVA-9's commit path, which also runs the optimization pass); back into
# FLIGHT on the miner (a Space Center save focuses vessel 0) for Rewind-to-Launch; save and
# reload into FLIGHT on the watcher (MINE-9); watch the miner's ghost through its whole replay
# (rails warp at 100x, then 1x across its end) until the end spawn hands the camera to the
# spawned rover; read the spawned rover's tanks against the end snapshot.
#
# THE MID-WARP TOGGLE PATTERN (seam `WarpToUT detach=true`, commit 7335f3c). There is no seam
# wait that keeps rails warp running, so every press lands a few frames after a DETACHED warp
# to a far UT (1800) starts, behind a MissionMark, a tank read and an inspect (three inert
# steps, so the vessel has packed), and a BLOCKING WarpToUT to an intermediate UT then takes
# the warp over (`warptout detached ended reason=superseded`) and drops to 1x at its target.
# Each recipe's ON and OFF therefore sit in two different rails segments with a 1x drop
# between them: ON in one detached warp, OFF in the next. That shape keeps every press
# packed (`packed=1 warpIndex=[1-9]` on the PartAction answer) and gives each recipe ~300 s
# of real running, so the spawn carries LF, Ox and Mono as V's did. The radiator flick sits
# inside ONE segment (off, inspect, on: a few frames), which is all "briefly" needs.
#
# THE OPEN QUESTION (plan doc): WHEN is a converter toggled during rails warp on a LANDED
# vessel recorded? `OnVesselGoOnRails` returns before setting `isOnRails` for a surface vessel
# (FlightRecorder.cs:11580-11611), so `OnPhysicsFrame` (FlightRecorder.cs:9382-9385) does not
# return early on it, and the harvest poll's own doc says a packed surface vessel keeps
# ticking physics frames (FlightRecorder.cs:7720-7729). If that holds, `CheckConverterState`
# (FlightRecorder.cs:2288-2307) writes the ISRU edge at the TOGGLE UT; if the hook does not
# fire packed, the edge lands at the next rails exit (the blocking warp's 1x drop). The four
# ISRU contracts below accept EITHER: each requires the edge between its press's MissionMark
# and the next window's MissionMark, which both hypotheses satisfy because every OFF / ON
# has a 1x drop after it inside that bracket. READ ON THE FIRST FLIGHT, THEN TIGHTEN: if
# `Part event: ConverterActivated 'MiniISRU'` sits before the blocking warp's
# `warptout start ut=780` line, the edge is at the toggle UT (tighten each bracket to end at
# its `-after` mark plus that warptout start); if it sits after that warp's
# `warptout rate requested=0 applied=0` line (the 1x tail), it is the rails exit, and an
# on-and-off inside ONE warp would be lost (file it). The Part event line carries no UT;
# the MISSIONMARK lines (`ut=`) bracket it. ANSWERED by the first flight (`2026-10-17_1348`):
# the edge is written at the toggle UT, so the four contracts are tightened to the press's
# own `-before` / `-after` marks.
#
# FAST-LANE CHECKLIST (harness/README.md): (1) not a prefix of MINE-2 / MINE-9 (mid-warp
# toggles and a scene-exit commit neither flies), so its own spec; (2) every game-time wait is
# an explicit-UT WarpToUT, the 1x ones only where the story is 1x (drill deploy, the stop /
# retract tail, the end crossing); (3) the replay warps at 100x to 1562, just before the
# stop at the recording's 1560, and crosses the end (retract + up to 15 s) at 1x; (4)-(5) no
# burns, no coast; (6) retry once (the pack-latency premise of the first mid-warp press is
# unmeasured); (7) count pinned 1; (8)-(9) after the first green flight.
description = "MINE-6: V's manual mining flight replayed step for step on his real rover: four drills deployed and started, a 5x / 10x / 50x / 100x rails ladder, the ISRU's Lf+Ox and then MonoPropellant each switched on and off while on rails, the radiators flicked off and on while on rails, a 1x stop and retract, a scene-exit commit at the Space Center, Rewind-to-Launch, and from a neighbouring rover the miner's ghost watched through its replay (drill deploy, converter loop) to its end spawn, the camera handed to the spawned rover, whose tanks equal its end snapshot."
instanceProfile = "stock-minimal"
tags = ["mining", "isru", "rewind", "scene-exit", "watch-mode", "MINE-6"]

