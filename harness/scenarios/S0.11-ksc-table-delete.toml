schema = 1
id = "S0.11-ksc-table-delete"
# `operator` for its first flight: a READING RUN, the first consumer of a NEW seam verb
# (`DeleteRecording`), whose single load-bearing pin depends on a timing the lane can
# only measure by flying (a KSC ghost must be ALIVE at the delete instant).
tier = "operator"
#
# WHAT THIS SPEC IS FOR. AUTOMATION-GAP-KSC-TABLE-DELETE (todo, now closed by the verb
# this lane drives): PR #1591 made every mid-list removal from the committed recording
# list raise Removing / Removed notifications, and `ParsekKSC` subscribes to them to
# shift its index-keyed ghost state (`ShiftKscIndexKeyedState`) - the fix for a Space
# Center delete that used to leave every ghost above the deleted row playing its
# neighbour's trajectory. The subscriber was pinned headlessly
# (`CommittedListNotificationTests`) and never driven in the scene it was written for,
# because the table's delete is an IMGUI button and no seam verb removed a recording.
# `DeleteRecording index=<n>` is that verb (design-autotest-command-seam.md ->
# `#### DeleteRecording`); this lane is its first flight.
#
# THE HOST. V22K's recipe VERBATIM up to and including the SPACECENTER boot, because it
# is the only KSC-scene lane ever flown green and its boot MEASURED a placed KSC ghost:
# loop armed on the fixture's one tree, warp to the loop's next departure, `TimeJump
# 22825` into the in-window landed sliver, save, reload with `scene=spacecenter`, and
# V22K's dwell then read `KSC SURFACE playback resolved` (run `2026-08-24_2053`). The
# fixture's committed list is the Kerbin-frame `Kerbal X` parent at index 0 (the loop
# member the host renders) with its shed debris above it, so `index=1` is a MID-LIST
# removal with the rendering row BELOW it - the shape the subscriber exists for. What
# sits at index 1 after the load-time optimizer pass is a `Kerbal X` half or a `Kerbal X
# Debris` row; the pins accept either (W1's lesson: the load-time pass may split the
# parent, so a name pinned off the raw sfs order is a bet).
#
# THE DWELL SPLIT, RE-DERIVED OFF RUN 1. Twenty `RecordingState` ticks before the
# delete, then thirty more so the scene keeps rendering AFTER the removal under the
# shifted indices. The subject line - `KSC ghost state reindexed after committed removal
# at #1` - is printed by `ShiftKscIndexKeyedState` ONLY when `kscGhosts.Count +
# kscOverlapGhosts.Count > 0` at the delete, so a green run cannot mean "nothing was
# rendered and the shift was a no-op".
#
# RUN 1 (`2026-09-02_0813`, PARSEK-FAIL on that one line, wall 83 s) MEASURED THE KSC
# GHOST LIFECYCLE THIS LANE SITS INSIDE, and it is not what the first draft assumed:
#   11:14:24.5  ParsekKSC initialized, 9 committed recordings, 9 eligible; looping=0
#   11:14:24.5  KSC SURFACE playback resolved: recording=rec[8e53c6df|Kerbal X|tree|2]
#               ut=1274.68  (the loop member's LANDED TAIL, resumed at the jump epoch,
#               ~1 s from its own end)
#   11:14:26.4  Ghost #2 destroyed                    (the tail finished)
#   11:14:27.4  deleterecording start index=1 ... committed=9 -> complete committedAfter=8
#   11:14:27.4  KSC SURFACE playback resolved for rec[28b6e543] targetUT=66 and
#               rec[8e53c6df] targetUT=911  (the global auto queue RESTARTED the chain
#               from its ascent, 12 ms after the delete, and kept rendering to the quit)
# The first draft's ten-tick delete (~3 s after the KSC init) landed in the ONE-SECOND
# GAP between the tail's end and the queue's restart, so no ghost was alive and the
# reindex line stayed silent - the pre-registered dwell-length reading, not a defect.
# The restarted ascent ghosts then lived until FlushAndQuit (~9 s later, `Ghost #0
# destroyed` is the teardown), so a delete at twenty ticks (~6 s) sits inside them.
# Ticks measured at ~0.3 s each. The load-time optimizer had split the parent into
# THREE chain segments (28b6e543 / a387136a / 8e53c6df), so index 1 was the middle
# `Kerbal X` segment, not a debris row - the `Kerbal X( Debris)?` class held.
#
# RUN 1 ALSO FOUND A PRODUCT DEFECT THE VERB'S WIDENING EXPOSED
# (DELETE-LEAVES-TREE-MEMBERSHIP, todo): the store removed the row from the flat list
# (OnSave wrote 8), but the committed RECORDING_TREE still held the member, so the
# FlushAndQuit save re-wrote all five of its sidecars (mtime 11:14:35, eight seconds
# after `DeleteRecordingFiles` had removed them) and saveParse read 9 recordings. Fixed
# in the same branch: `RemoveRecordingAt` now prunes the row from its committed tree.
# The report-only `recordings = 8` pin below is what proves the fix on the re-fly.
#
# WHAT THE READING DECIDES, pre-registered:
#   - GREEN: the verb works at the KSC, the store removed the row, the host shifted its
#     ghost state with a ghost alive and kept rendering. The gap is closed live.
#   - RED on the reindex line ALONE (delete complete, store lines present): no KSC ghost
#     existed at the delete instant - a DWELL-LENGTH reading (move the delete later, or
#     the sliver had closed and the jump epoch needs V22K's re-derivation), not a defect.
#   - `deleterecording error reason=delete-not-applied`: the store refused a row the verb
#     had bound-checked - a product finding on `DeleteRecordingFull`.
#   - `subscriber threw` or a `[Parsek][ERROR]`: the KSC handler failed on a live
#     removal - THE defect this lane exists to catch, filed against
#     COMMITTED-LIST-SILENT-REMOVERS's KSC host.
#   - INVALID(driver) on the DeleteRecording step with `game-not-loaded`: the
#     SPACECENTER reload had not settled a game the dispatcher recognises - a seam
#     reading about `RequiresGameLoaded` at the KSC, which no committed spec has yet
#     exercised (SealSlot / RouteCommand's rows share the requirement but have only run
#     in FLIGHT).
description = "Reading run: V22K's boot into SPACECENTER with the loop member's KSC ghost placed, then the NEW DeleteRecording seam verb removes committed index 1 under it and the scene dwells on - the first live drive of ParsekKSC's committed-list notification subscriber (AUTOMATION-GAP-KSC-TABLE-DELETE)."
instanceProfile = "stock-minimal"
tags = ["S0.11", "ksc-scene", "recordings-table", "delete", "committed-list-notifications", "seam-verb", "kerbin", "sandbox", "reading-run"]

[fixture]
# V22K's fixture verbatim: harvested from B4-reentry-splashdown, Kerbin-frame end to end.
saveTemplate       = "fixtures/saves/kerbin-splashdown-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  # V22K STEPS 1-15 VERBATIM (minus the two render tracers this lane does not read):
  # the only measured path to a SPACECENTER scene with a placed KSC ghost.
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # The subject line and V22K's KSC pins are Verbose.
  { cmd = "SetSetting", args = { name = "verboseLogging",   value = "true" }, expect = "OK" },
  { cmd = "MissionConfig", args = { tree = "c05c834cd2754892b4588e7ce9220c3f", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "c05c834cd2754892b4588e7ce9220c3f" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "22825" }, expect = "OK", budget = 300 },
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  # DWELL 1: twenty ticks (~6 s) - past the loop member's landed tail and the
  # one-second inter-cycle gap run 1 measured, into the auto queue's restarted ascent
  # ghosts, which live until the quit.
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # THE SUBJECT: a mid-list removal at the KSC under a living ghost.
  { cmd = "DeleteRecording", args = { index = "1" },                         expect = "OK" },
  # DWELL 2: thirty ticks so the host keeps rendering under the shifted indices
  # (and so the 2 s rate-limited KSC emitters get a chance to print again).
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
