[dimensionsCovered]
# V22K's, earned by the same steps. Nothing for the delete itself: no dimension value
# exists for it, and whether one should is what the reading decides.
D14 = ["kerbin", "scene-ksc", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 12 }

[expectations.logContracts]
required  = [
  # V22K's measured KSC pins: the boot reached SPACECENTER, the host found eligible
  # recordings, and a ghost was PLACED (the surface-resolved line is per-frame ghost
  # placement, the anti-vacuity floor for the subject line below).
  "loadgame spacecenter route \\(requested\\): resuming to SPACECENTER save=",
  "loadgame complete scene=SPACECENTER save=.* game-loaded=true expected=SpaceCenter",
  "ParsekKSC initialized, \\d+ committed recordings, [1-9]\\d* eligible for KSC ghost playback",
  "\\[KSCGhost\\] Eligible breakdown: looping=\\d+",
  "KSC SURFACE playback resolved: recording=.* branch=",
  # The verb's own lines: the store route at the KSC, and the read-back-verified
  # completion with the count pair (RecordingState exposes no committed count).
  "deleterecording start index=1 recId=[0-9a-f]{32} vessel='Kerbal X( Debris)?' ghostOnly=false route=store committed=[0-9]+ scene=SPACECENTER",
  "deleterecording complete index=1 recId=[0-9a-f]{32} route=store committedBefore=[0-9]+ committedAfter=[0-9]+",
  # The production path's own removal lines.
  "DeleteRecordingFull: deleting 'Kerbal X( Debris)?' at index 1",
  "Removed recording 'Kerbal X( Debris)?' \\(id=[0-9a-f]{32}\\) at index 1",
  # THE SUBJECT. ShiftKscIndexKeyedState prints this only when a KSC ghost was alive
  # at the delete, so it is the proof the subscriber shifted REAL state.
  "\\[KSCGhost\\] KSC ghost state reindexed after committed removal at #1: primary=[0-9]+ overlapSets=[0-9]+",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The notification seam's exception containment: a throwing KSC handler lands here.
  "subscriber threw",
  # The verb must neither refuse nor read back a surviving row.
  "deleterecording rejected",
  "deleterecording error",
  "DeleteRecordingFull: invalid index",
  # V22K's own forbids, verbatim.
  "timejump refused reason=backward-jump",
  "KSC point skipped: recording=.* body=",
  "KSC segment skipped: beforeBody=",
]

[expectations.recordings.structure]
# REPORT-ONLY (declaring is not arming). V22K measured 9 recordings in the produced
# save; one delete should leave 8. Run 1 read 9: the tree still held the deleted member
# (DELETE-LEAVES-TREE-MEMBERSHIP, fixed on this branch). The re-fly reads the fix.
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 8, max = 8 }

[runtime]
# V22K's budget: the same steps up to the KSC boot, a dwell of the same total length.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
