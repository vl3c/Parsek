schema = 1
id = "SE-1-editor-round-trip"
tier = "nightly"
instanceProfile = "stock-minimal"
# =====================================================================================
# D14 `scene-editor`. COVERAGE WAVE 12 (2026-09-26, branch `cov-editor`).
#
# THE DEFINITION (supervisor ruling 2026-09-25, pending operator confirmation, recorded
# in the registry comment for the cell): a player with committed recordings whose ghosts
# are pending goes to the VAB/SPH mid-timeline, then launches. Afterwards the timeline
# and ghosts are intact - no recordings lost or duplicated, ghosts still replay, the
# ledger unchanged - and the new launch records into a NEW tree.
#
# WHY IT COULD NOT BE FLOWN BEFORE: `DecideLoadRoute` reaches FLIGHT, SPACECENTER and
# TRACKSTATION only, and `StockScreen screen=editor` is CAREER-only and skips the
# building click. This lane rides the two verbs added with it:
#   GoToEditor facility=SPH craft=Kerbal X   the SPH building's own OnLeftClick (which
#       saves persistent and calls EditorDriver.StartEditor), then the craft browser's
#       Normal load (EditorLogic.LoadShipFromFile) of stock `Ships/VAB/Kerbal X.craft`.
#   LaunchFromEditor                         the Launch button (EditorLogic.launchVessel):
#       stock pre-flight checks, then FlightDriver.StartWithNewLaunch.
#
# WHY THE SPH AND NOT THE VAB: every recorded fixture carries its launch clamps as
# `Kerbal X Debris` LANDED at the LaunchPad, so a VAB launch meets stock's LaunchSiteClear
# dialog, whose proceed branch RECOVERS those vessels - a ledger change the definition
# forbids. LaunchFromEditor refuses that typed (`launchfromeditor-site-obstructed`); the
# Runway is clear.
#
# WHY THIS FIXTURE: `kerbin-splashdown-recorded` is one Kerbin-rooted committed tree (9
# recordings) flown from the STOCK Kerbal X - the same craft file this lane launches, so
# the new launch carries the craft-baked pid of the committed recording's spawned vessel
# and the NEW-tree assertion is not vacuous. V22K / V22M proved its boot recipe: loop
# the mission, StartLoopPlayback to the next faithful departure (L1 ~21,584), so its
# ghosts are replaying when the player walks into the hangar.
#
# THE ASSERTIONS:
#   - committed count unchanged across both transitions: ListHandles kind=committed
#     count=9 at the Space Center, in the editor and in flight, and ParsekScenario's own
#     `Scene load complete (EDITOR|FLIGHT): 9 recordings` on the two scene loads;
#   - no duplicate trees: `Committed tree ... Total committed: 10 recordings, 2 trees`,
#     never `Updated committed tree`; saveParse trees / committedTrees = 2;
#   - ghosts replay after the round trip: a ghost mesh created AFTER the launch
#     completes (ordered regex);
#   - the new launch starts its own tree: the commit ADDS a tree (2) with 1 recording.
#
# READING RUN 1 (`2026-09-25_2308`, and its retry `_a2`): INVALID on two gaps, both
# fixed in the same change and neither a Parsek product defect.
#   (a) GoToEditor timed out with the craft ON the stage (`parts=73`): stock craft
#       name themselves with a localization tag (`ship = #autoLOC_501232`), so the
#       readiness check compared the tag with the editor's localized "Kerbal X". The
#       applier now formats the header through the Localizer.
#   (b) LaunchFromEditor threw `UnauthorizedAccessException ... C:/Auto-Saved
#       Ship.craft.tmp`: the staged save had no `Ships/SPH`, so the editor never got a
#       default save folder (EditorDriver.SetDefaultSaveFolder needs the directory) and
#       saved the auto-saved ship to the drive root. Stock creates `Ships/VAB` and
#       `Ships/SPH` for every save (new game / Main Menu resume); the seam's LoadGame
#       bypasses the Main Menu and git cannot carry empty folders, so run.py's staging
#       now creates both.
#   Measured on the way: every scene load reads 9 recordings (FLIGHT, SPACECENTER,
#   EDITOR), `listhandles kind=committed count=9` at the Space Center and in the
#   editor, and the ledger saves `actions=16` from the loop fast-forward on - the
#   value the ledger-unchanged pins below hold across the editor walk.
# =====================================================================================
description = "Coverage wave 12 (D14 scene-editor): on kerbin-splashdown-recorded with its mission looping (ghosts replaying), boot to the Space Center, walk into the SPH through the building's own click and load the stock Kerbal X through the craft browser (new GoToEditor), press Launch (new LaunchFromEditor), then record and commit on the Runway. The committed recordings survive both transitions unchanged, ghosts replay after the launch, and the new flight commits as a second tree."
tags = ["SE1", "scene-editor", "editor-route", "loop-playback", "coverage-wave-12"]

[fixture]
saveTemplate       = "fixtures/saves/kerbin-splashdown-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",   value = "true" }, expect = "OK" },
  { cmd = "MissionConfig", args = { tree = "c05c834cd2754892b4588e7ce9220c3f", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "c05c834cd2754892b4588e7ce9220c3f" }, expect = "OK", budget = 300 },
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "ListHandles", args = { kind = "committed" },                      expect = "OK" },
  { cmd = "GoToEditor", args = { facility = "SPH", craft = "Kerbal X" },     expect = "OK", budget = 120 },
  { cmd = "ListHandles", args = { kind = "committed" },                      expect = "OK" },
  { cmd = "LaunchFromEditor",                                                expect = "OK", budget = 180 },
  { cmd = "ListHandles", args = { kind = "committed" },                      expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "StartRecording",                                                  expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "ListHandles", args = { kind = "active" },                         expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "CommitTree",                                                      expect = "OK", budget = 120 },
  { cmd = "ListHandles", args = { kind = "committed" },                      expect = "OK" },
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
D14 = ["scene-editor", "scene-ksc", "scene-flight", "sandbox", "kerbin"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 10, max = 10 }

[expectations.logContracts]
required = [
  "missionconfig applied:",
  "startloopplayback initiated:",
  "loadgame complete scene=SPACECENTER save=.* game-loaded=true expected=SpaceCenter",
  # The editor walk, through the building click and the craft browser.
  "goeditor start facility=SPH craft=Kerbal X scene=SPACECENTER craftPath=.*Ships[/\\\\]VAB[/\\\\]Kerbal X\\.craft",
  "goeditor loading craft=Kerbal X path=.* facility=SPH ",
  "goeditor complete facility=SPH craft=Kerbal X scene=EDITOR parts=[1-9][0-9]* ship=Kerbal X ",
  # The launch, onto the Runway.
  "launchfromeditor start ship=Kerbal X parts=[1-9][0-9]* site=Runway crew=[0-9]+ scene=EDITOR",
  "launchfromeditor complete scene=FLIGHT vessel=Kerbal X pid=[0-9]+ site=Runway situation=PRELAUNCH ",
  # No recording lost or duplicated across either transition.
  "(?s)goeditor start .*Scene load complete \\(EDITOR\\): 9 recordings,.*goeditor complete ",
  "(?s)goeditor complete .*Scene load complete \\(FLIGHT\\): 9 recordings,.*launchfromeditor complete ",
  "(?s)goeditor complete .*listhandles kind=committed count=9 .*launchfromeditor start ",
  "(?s)launchfromeditor complete .*listhandles kind=committed count=9 ",
  # The ledger is unchanged by the walk: the building click's save and every save
  # until the launch settles read the same action count as before it.
  "(?s)Saved ledger to [^\\r\\n]*actions=16\\r?\\n.*goeditor start .*Saved ledger to [^\\r\\n]*actions=16\\r?\\n.*goeditor complete ",
  # Ghosts replay after the round trip.
  "(?s)launchfromeditor complete .*phase=MeshSpawned .*reason=ghost-created",
  # The new flight commits as a SECOND tree.
  "Committed tree 'Kerbal X' \\(1 recordings\\)\\. Total committed: 10 recordings, 2 trees",
  "listhandles kind=committed count=10 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "goeditor rejected",
  "goeditor error",
  "launchfromeditor refused",
  "launchfromeditor timeout",
  "Updated committed tree",
  "(?s)goeditor start (?:(?!launchfromeditor complete).)*Saved ledger to [^\\r\\n]*actions=(?!16\\b)[0-9]+",
  "Scene load complete \\((EDITOR|FLIGHT)\\): (?!9 recordings,)[0-9]+ recordings,",
]

[expectations.recordings.structure]
# REPORT-ONLY until the reading run: one fixture tree plus the new launch's own tree.
trees          = { min = 2, max = 2 }
committedTrees = { min = 2, max = 2 }
recordings     = { min = 10, max = 10 }

[runtime]
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
