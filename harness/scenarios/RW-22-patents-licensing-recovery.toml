schema = 1
id = "RW-22-patents-licensing-recovery"
# =====================================================================================
# RW-22: A SCIENCE-CARRYING VESSEL RECOVERED UNDER PATENTS LICENSING (the rewind ledger campaign,
# the case RW-11 left open: todo SMALL-RECOVERY-FUNDS, "a recovery of a science-carrying vessel under
# Patents Licensing (one `VesselRecovery funds patched` at the payout, the yield as its strategy leg
# only)").
#
# THE RULE UNDER TEST. Stock pays a recovery in one place, one `AddFunds(value, VesselRecovery)`.
# Patents Licensing's converter takes a share of the science a recovery earns and pays funds for
# it, firing its own `FundsChanged(VesselRecovery)` from `Funding.OnCurrenciesModified`. That yield
# is already booked as a strategy `FundsEarning`, so the recovery pairing must take only stock's
# payout: one row for the payout, one strategy leg for the yield, nothing booked twice.
#
# THE HOST. `lab-pad-career` (LAB-12's): career, funds 500000, science 400, the LABX Orbital Lab
# (pid 2200110055) on the pad with 12.5 science in its lab. The campaign's mun hosts hold 20 to 50
# science; this rule needs 135 to activate, and the slider default costs 263.25
# (400 -> 136.75). The default factor gives share 0.05 at 84.064 funds a point, so the lab's 12.5 gives
# 0.625 science taken and ~52.5 funds, LAB-12's measured numbers, here through
# `ModuleScienceLab.RecoverScienceLabs` (LAB-14's path) under `VesselRecovery` instead of a transmit.
#
# NO REWIND. This lane closes a recovery rule, not a time-travel one. LAB-12 is the transmit twin.
#
# PLAN (UTs are the plan):
#   boot       LoadGame persistent at the Space Center: activate PatentsLicensingCfg, save.
#   pad        LoadGame that save onto the lab, no recording.
#   recover    Recover the lab: the payout, the lab's science, the strategy's cut.
#   check      an unrecorded Flea onto the pad (the shared overlay), the save, LedgerGroundTruth.
#
# STATUS: AUTHORED 2026-10-31 (branch `rw22-patents-recovery`), RED ON A FILED DEFECT, not green:
# `2026-10-31_0321` PARSEK-FAIL on the forbidden `[Parsek][ERROR]` line alone, todo
# RECOVERY-RECONCILE-ERROR-ON-TWO-SCIENCE-CREDITS. The rule under test held: one
# `VesselRecovery funds patched ... amount=204881`, the two yields (42.03, 52.54) booked as strategy
# `FundsEarning` legs only. Re-fly once fixed; the batch split is 2 passed, 1 skipped there.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, a science-carrying vessel recovered under Patents Licensing: on lab-pad-career the strategy is activated at the Space Center and the pad lab is recovered with its 12.5 science: stock's payout is booked once as the recovery, the converter's yield once as its strategy leg, nothing twice, and LedgerGroundTruth closes the career."
instanceProfile = "stock-minimal"
tags = ["RW-22", "career", "ledger", "strategies", "science-lab", "recovery", "editor",
        "ground-truth", "ingame-batch"]

[fixture]
saveTemplate = "fixtures/saves/lab-pad-career"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 2 x 300 LoadGame + 60 KscAction + 2 x 120 SaveGame + 120 Recover + 120
# GoToEditor + 180 LaunchFromEditor + 120 warp + 540 RunTests = 1980; runtime 2600 adds the inert
# steps and FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "KscAction",      args = { action = "activate-strategy", strategy = "PatentsLicensingCfg" }, expect = "OK", budget = 60 },
  { cmd = "SaveGame",       args = { name = "rw22-patents" },                              expect = "OK", budget = 120 },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "rw22-patents", focusPid = "2200110055" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "DiscardTree",                                                                   expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" },      expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw22-before-recover" },                      expect = "OK" },
  { cmd = "Recover",        args = { pid = "2200110055" },                                 expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw22-recovered" },                           expect = "OK" },
  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "520", maxRate = "50" },                         expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["funds", "science", "strategies", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Nothing records: auto-record is off and the pad lab's load discards its tree.
count = { min = 0, max = 0 }

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",
  "kscaction action=activate-strategy target=PatentsLicensingCfg applied=true",

  # ---- stock's converter takes 5 percent of the recovered lab science ----
  "MISSIONMARK label=rw22-before-recover ut=(?:(?!MISSIONMARK label=rw22-recovered )[\\s\\S])*?\\[CurrencyConverter for Patents Licensing\\]: 0\\.625 Science taken",
  "MISSIONMARK label=rw22-before-recover ut=(?:(?!MISSIONMARK label=rw22-recovered )[\\s\\S])*?Game state: strategy currency conversion - reason=VesselRecovery ",

  # ---- the yield is the strategy's leg, the payout is the recovery's row ----
  "MISSIONMARK label=rw22-before-recover ut=(?:(?!MISSIONMARK label=rw22-recovered )[\\s\\S])*?Strategy conversion recorded: type=FundsEarning, ",
  "MISSIONMARK label=rw22-before-recover ut=(?:(?!MISSIONMARK label=rw22-recovered )[\\s\\S])*?VesselRecovery funds patched: vessel='[^'\\r\\n]+' amount=[0-9]+ ",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=",
  # ---- one payout row: the yield never pairs as a second recovery ----
  "VesselRecovery funds patched: [\\s\\S]*VesselRecovery funds patched: ",
  "VesselRecovery funds patched: vessel='[^'\\r\\n]+' amount=5[0-9] ",
]

[runtime]
budgetSeconds = 2600

[retry]
policy = "once"

[expectedFail]
bugId = ""
