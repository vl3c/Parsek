  "ArmedPause: route .* BLOCKED cycle consumed the armed pause",
  "LifecycleMarker: route .* type=RoutePaused reason=blocked-then-paused",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "routecommand rejected",
  # THE REMOVED VESSEL MUST NOT BE A DESTINATION. If the patch silently did nothing this
  # is the line the run would print (it is RVR-2's own), so the forbid falsifies the
  # staging from the other side of token 6.
  "dest=rover fuel 0",
  # AND THE FALLBACK MUST NOT REFUSE. `no-vessel-within-radius` / `no-surface-candidate`
  # are unreachable with a candidate 1.03 m from the recorded coordinates and NOT the
  # transport; an EndpointLost reading here would mean the transport exclusion is
  # over-broad - i.e. RVR-19's mechanism firing on a lane where it must not.
  "BLOCKED kind=EndpointLost",
  # THE ROUTE MUST NOT TRANSFER ONTO ITSELF. `B` (pid 313889796) is the transport and the
  # focused vessel, 16.42 m from the recorded point and comfortably inside the radius, so
  # it is a live candidate the exclusion has to reject on THIS lane too - not only on
  # RVR-19, where it is the only one. A transfer naming it is a route paying itself.
  "Route endpoint transferred: .*to=313889796",
  # AND NOTHING MAY BE DELIVERED INTO IT EITHER, whatever the resolver logged.
  "dest=B pid=313889796",
]

