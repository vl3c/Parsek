# RECORDING node - the Parsek payload is outside what `savepatch.py` may write, and the
# five recordings' own `vesselPersistentId` fields are historical metadata that no
# longer needs a live vessel. The transfer rebinds a ROUTE stop, not a recording.
count = { min = 5, max = 5 }

[expectations.logContracts]
# SEVENTEEN TOKENS, ALL MEASURED GREEN on `2026-09-03_2153`. Each is a literal RUN from
# the emitting concatenation in source; the only regexed spans are the per-run route id and
# the transfer line's live `distance=` float.
#
# TOKENS 1-5 ARE RVR-2's PROLOGUE SET, this lane's control.
#
# TOKEN 6  THE EXCLUSION RAN HERE TOO, skipping the transport before any distance was
#          compared. Added after the 2026-09-03 `_2153` flight measured it: it is free
#          evidence, and it is what makes the header's corrected claim checkable. It does
#          NOT make this lane a guard for the exclusion - `A` would have won on distance
#          anyway, which is RVR-19's whole reason for existing.
#
# TOKEN 7  THE FALLBACK RAN AND PICKED `A`, from `RouteEndpointResolver`'s proximity
#          branch:
#            "Endpoint proximity step: resolved=" + ... + " pid=" + ... + " reason="
#            + ... + " body=" + endpoint.BodyName
#          `resolved=1` says the fallback matched; `pid=2875537755` says WHICH vessel, and
#          it is not the one the window names; `reason=-` is the empty-reason rendering on
#          the success path (`TrySurfaceFallbackPure` leaves `reason` empty when it returns
#          true). A run in which the removal had not taken would never print this line at
#          all, because the pid step returns before it - so this token is also the
#          staging's falsification.
#
# TOKEN 8  **THE RULING'S OWN LINE, AND THE REASON THIS LANE WAS RE-AUTHORED**, from
#          `RouteEndpointTransfer.FormatTransferLine`. Every field is a literal from the
#          shipped concatenation except `route=` (per-run) and `distance=` (MEASURED 2.01,
#          left regexed with an explicit decimal POINT because it is a live world-position
#          float and one measurement is not a contract - the decimal point is also a
#          culture guard); `at ut=` closes the token without pinning the value.
#          `from=2123618197/'<unknown>'` and `to=2875537755/'A'` are the finding and
#          neither may be loosened, and `step=proximity` may never become an alternation -
#          see the header. On a PRE-#1627 build this token is unsatisfiable, which is the
#          intended reading: the lane reds on a stale automation DLL rather than quietly
#          re-measuring the old behaviour.
#
# TOKEN 9  **THE REBIND IS DURABLE**, from `RouteEndpointResolver`'s resolved-step lines:
#            "Endpoint resolved: step=root-part rootPartUId=" + ... + " pid=" + ... + " reason=" + ...
#            "Endpoint resolved: step=pid pid=" + endpoint.VesselPersistentId
#          The rebind writes BOTH `vesselPersistentId` and `rootPartUId`, so cycle 1 takes
#          the ROOT-PART step - MEASURED, with `rootPartUId=3962694490` pinned literally
#          (it is `A`'s own root part `uid` in the committed save). The `step=pid` spelling
#          is kept in the alternation because it is what would fire if the resolved vessel
#          exposed no root flightID, and the claim is identical either way. Both branches
#          are pre-#1627 lines, unchanged - only which one fires moved. This is the token that says the rebind was written onto
#          the route rather than recomputed each dispatch, and it is the constructive
#          argument for "the transfer line fires once": once the stop carries a resolvable
#          identity, `NextEndpointStep` returns before proximity and the fallback is never
#          reached again. The evaluator is regex-only and has no occurrence count, so the
#          single-shot claim rests here rather than on a forbid.
#
# TOKEN 10 GATE 8 PASSING against the TRANSFER TARGET, `stopsResolved=1 stopsUnresolved=0`.
#          The `stopsResolved` count is what says the capacity probe was built on a vessel
#          that resolved: `DestinationHasCapacity` FAILS OPEN on an unresolved stop (null
#          probe -> skipped), so a run where proximity had missed would read
#          `stopsResolved=0 stopsUnresolved=1` and would still report "fits". Pinning the
#          pair is what stops a fail-open from reading as a pass.
#
# TOKEN 11 THE DELIVERY, and the lane's physical product: cargo written into the vessel
#          the route transferred onto. `dest=A pid=2875537755 resource=LiquidFuel` is
#          contiguous in the emitter. The requested / written / tank figures are NOT pinned
#          (the manifest's float tail is 97.59999999999843, and A's tank tail moves with
#          it); `path=loaded` IS pinned and was measured on 2026-09-03.
#
# TOKENS 12-14  ALL THREE INVENTORY STORES, also naming the transfer target, in the order
#          the 2026-09-03 run printed them (evaChute, evaScienceKit,
#          DeployedCentralStation - NOT identity-hash order, which RVR-16's cell records).
#
# TOKEN 15 CYCLE 1's REFUSAL. A's tank went 297.6 -> 395.2, leaving 4.8 against a 97.6
#          manifest, so the resource half is short and `FirstShortToken` names it before
#          any inventory line (A has three free slots left, so the inventory half is not in
#          question). This is RVR-2's cycle-1 reading reproduced on the transferred
#          endpoint, which is the second half of "the route kept working".
#
# TOKEN 16 THE ARMED PAUSE, as RVR-2 measured it. The lifecycle marker follows it.
required  = [
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "sealslot complete mode=tree tree=73e50f1e3aa24c299919016cd9e92269 total=4 sealed=0 remaining=0 alreadySealed=True",
  "routecommand create gate tree=73e50f1e3aa24c299919016cd9e92269 treeFound=True dismissed=False sealed=True eligible=True status=Eligible alreadyPromoted=False refusal=None",
  "routecommand complete action=create tree=73e50f1e3aa24c299919016cd9e92269 route=.* name='RVR18 Lost Endpoint' status=Paused",
  "PauseAfterCurrentCycle=true \\(route will dispatch one cycle when conditions allow, then transition to Paused\\)",
  "Endpoint proximity transport excluded: skipped=1 reason=route-own-transport body=Kerbin",
  "Endpoint proximity step: resolved=1 pid=2875537755 reason=- body=Kerbin",
  "Route endpoint transferred: route=[0-9a-f]{8} stop=0 role=destination from=2123618197/'<unknown>' to=2875537755/'A' step=proximity distance=[0-9]+\\.[0-9]{2} body=Kerbin at ut=",
  "Endpoint resolved: step=(root-part rootPartUId=3962694490 |pid )pid=2875537755",
  "DestinationHasCapacity: route [0-9a-f]{8} full manifest fits \\(stopsResolved=1 stopsUnresolved=0\\)",
  "Delivery write: route=.* dest=A pid=2875537755 resource=LiquidFuel .* path=loaded",
  "Inventory store: route=.* dest=A pid=2875537755 part=evaChute .* path=loaded",
  "Inventory store: route=.* dest=A pid=2875537755 part=evaScienceKit .* path=loaded",
  "Inventory store: route=.* dest=A pid=2875537755 part=DeployedCentralStation .* path=loaded",
