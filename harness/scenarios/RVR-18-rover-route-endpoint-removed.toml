# =====================================================================================
# THE ENDPOINT THE ROUTE NAMES IS GONE, ANOTHER CRAFT STANDS ON THE SPOT, AND THE ROUTE
# **TRANSFERS ITSELF ONTO IT** - REBINDING THE PERSISTED STOP, NOT JUST DELIVERING.
#
# **LIVE-PROVEN 2026-09-03: run `2026-09-03_2153`, PASS attempt 1, wall 65 s, EVERY
# VERIFIER PASS**, on the automation DLL sha256 `2414aa3a3d32d7b7` - a clean build of
# `main` at `d723cf419` (PR #1627, the endpoint-transfer ruling), IL-verified guard and
# transfer markers present. THE LANE HAS NOW FLOWN TWICE AGAINST TWO DIFFERENT CONTRACTS:
# once on 2026-09-03 (`_2011`) against the PRE-RULING behaviour, which is the census the
# ruling was decided on and is kept verbatim below as history, and once against the
# ruling itself. Every re-authored token was pinned from the merged emitters BEFORE the
# flight and every one of them matched; every report-only facet matched as declared,
# including the one the ruling moves.
#
# WHAT THE SECOND FLIGHT MEASURED, from the collected KSP.log:
#     [Stage] liveState patched pid=2123618197 name=rover fuel 0 removed=1
#     [Stage] liveState patched pid=2875537755 name=A resources=[-] inventory=clear (2 container(s))
#     Endpoint proximity transport excluded: skipped=1 reason=route-own-transport body=Kerbin
#     Endpoint proximity step: resolved=1 pid=2875537755 reason=- body=Kerbin
#     Route endpoint transferred: route=1639ce29 stop=0 role=destination
#         from=2123618197/'<unknown>' to=2875537755/'A' step=proximity distance=2.01
#         body=Kerbin at ut=1600
#     Endpoint resolved: step=root-part rootPartUId=3962694490 pid=2875537755 reason=-
#     DestinationHasCapacity: route 1639ce29 full manifest fits (stopsResolved=1 stopsUnresolved=0)
#     Delivery write: route=1639ce29... dest=A pid=2875537755 resource=LiquidFuel ... path=loaded
#     Inventory store: ... part=evaChute / evaScienceKit / DeployedCentralStation, all path=loaded
#     DestinationHasCapacity: route 1639ce29 destination FULL stop=0 short=LiquidFuel
#     cycle=cycle-1 BLOCKED kind=DestinationFull reason=LiquidFuel shortfall=0
# and the produced save read `routes count=1 dormant=0 stops=1 sourceRefs=2
# completedCycles=1 skippedCycles=1 statuses={Paused:1} holdKinds={DestinationFull:1}
# destinationVesselPids=['2875537755']` - **the pid the pre-ruling run could not write.**
#
# **TWO AUTHORED CLAIMS WERE CORRECTED BY THE FLIGHT, and both are recorded rather than
# quietly edited.** (1) The header used to say `A` wins "on DISTANCE, not by the new
# transport exclusion". The log says the EXCLUSION RUNS HERE TOO and skips the transport
# first (`skipped=1 reason=route-own-transport`), so by the time the search compares
# distances `A` is the ONLY candidate left. Both statements about `A` are true - it is
# nearer, AND it is the sole survivor of the exclusion - but the consequence for the
# matrix is unchanged and is why RVR-19 exists: this lane cannot DISCRIMINATE an exclusion
# that ran from one that did not, because `A` would have won either way. RVR-19 is the
# lane where the exclusion is the only thing that can decide. The excluded-line token is
# now REQUIRED here as well, since it flew. (2) `distance=2.01`, not the 1.03 m this
# header derived: `TrySurfaceFallbackPure` compares live WORLD positions while
# `harness/lib`'s `_surface_distance_m` is a great-circle stand-in over the committed
# lat / lon (its own docstring says so, and every cell there asserts an ORDERING or a
# margin rather than a metre). The derived figure is kept below as the derivation; 2.01 m
# is the measurement. Neither number changes any conclusion - both are 498 m inside the
# radius and both are far below the transport's 16.42 m.
#
# -------------------------------------------------------------------------------------
# THE RULING (operator, 2026-09-04). If a supply route's destination vessel is no longer
# there but another vessel stands within the 500 m surface radius, the route TRANSFERS to
# that vessel: `RouteEndpointResolver` REBINDS the persisted `RouteStop.Endpoint` to the
# resolved vessel, so the produced save's STOP names the new pid, one Info line records
# the substitution, and one ScreenMessage tells the player. The route's OWN TRANSPORT is
# never a transfer target (a route may not pay itself), and with no other candidate the
# existing `EndpointLost` hold stays. RVR-19 is the guard for that second half.
#
# WHAT THIS LANE MEASURES UNDER THE RULING, and it is three claims, not one:
#   1. THE SUBSTITUTION STILL HAPPENS. The pid step misses (the vessel is deleted), the
#      transport is excluded, the proximity step picks `A` (MEASURED `distance=2.01`), and
#      the manifest is delivered into it.
#   2. THE SUBSTITUTION IS NOW RECORDED. `Route endpoint transferred: ... from=2123618197
#      ... to=2875537755 ... step=proximity` is the line the pre-ruling build could not
#      print, and the produced save's `destinationVesselPids` reads the NEW pid. That is
#      the exact gap the 2026-09-03 census found and the ruling closed: before, the
#      substitution appeared in the log and NOWHERE ELSE.
#   3. THE REBIND IS DURABLE ACROSS CYCLES. Cycle 1 does NOT walk to proximity again: the
#      rebind stamps `rootPartUId` as well as `vesselPersistentId`, so the walk stops at
#      the FIRST step and prints `Endpoint resolved: step=root-part rootPartUId=3962694490
#      pid=2875537755 reason=-` (MEASURED; 3962694490 is `A`'s own root part `uid` in the
#      committed FLIGHTSTATE). That token is what proves the rebind was persisted onto the
#      route rather than computed per dispatch, and it is also why the transfer line
#      appears exactly ONCE by construction - the evaluator is regex-only and cannot count
#      occurrences, so the single-shot claim is carried by the resolved-step token rather
#      than by a count assertion.
#
# -------------------------------------------------------------------------------------
# THE PRE-RULING CENSUS, KEPT AS HISTORY. **LIVE-PROVEN 2026-09-03: run `2026-09-03_2011`,
# PASS attempt 1, wall 49 s, EVERY VERIFIER PASS**, on the automation DLL sha256
# `995772453f2339a2`. Every reading was DERIVED first - from the committed fixture's own
# coordinates and from `RouteEndpointResolver`'s step order - and the run confirmed the
# chain end to end, including the two claims that decided whether the lane could exist at
# all: the proximity step resolved, and it resolved to the pid this file names.
#
# WHAT FLEW, from that run's collected KSP.log:
#     [Stage] liveState patched pid=2123618197 name=rover fuel 0 removed=1
#     [Stage] liveState patched pid=2875537755 name=A resources=[-] inventory=clear (2 container(s))
#     Endpoint proximity step: resolved=1 pid=2875537755 reason=- body=Kerbin
#     Delivery write: route=68749916... dest=A pid=2875537755 resource=LiquidFuel
#         requested=97.599999999998431 written=97.599999999998431
#         tankBefore=297.59999999999843 tankAfter=395.19999999999686 capacity=400
#         path=loaded
#     Inventory store: ... part=evaChute               slot=part7/mod1/slot0 path=loaded
#     Inventory store: ... part=evaScienceKit          slot=part7/mod1/slot1 path=loaded
#     Inventory store: ... part=DeployedCentralStation slot=part7/mod1/slot2 path=loaded
#     Delivery: route 68749916 cycle=cycle-0 resources=1 inventoryUnits=3/3
#         inventoryUnitsSkipped=0 partial=0 ut=1600
#     cycle=cycle-1 BLOCKED kind=DestinationFull reason=LiquidFuel shortfall=0
# and the produced save read `destinationVesselPids: ['2123618197']` - THE ROUTE STILL
# NAMED THE VESSEL THAT NO LONGER EXISTED. That reading is the finding the ruling
# answered, filed as ROUTE-DELIVERY-PROXIMITY-RETARGETS-ANY-NEARBY-VESSEL in
# `docs/dev/todo-and-known-bugs.md`. **IT IS ALSO THE ONE TOKEN THAT FLIPS**: the same
# facet now reads `['2875537755']`, and if a flight of this lane reports the OLD pid the
# rebind did not persist even though the log said it happened.
#
# EVERYTHING ELSE FROM THAT RUN IS RE-USED UNCHANGED, because the ruling changed which
# ENDPOINT RECORD the route carries afterwards and nothing about the delivery itself.
#
# -------------------------------------------------------------------------------------
# WHY THE FALLBACK RUNS AT ALL, from the bytes rather than by assumption.
# `RouteEndpointResolver.TryResolveEndpoint` walks THREE steps - ROOT-PART id, then
# `persistentId`, then a great-circle SURFACE-PROXIMITY search bounded by
# `RouteOrchestrator.SurfaceProximityRadiusMeters = 500`. Every other committed route lane
# resolves at step 2 and stops. This lane deletes the endpoint vessel from FLIGHTSTATE so
# step 2 misses.
#
# THE ROOT-PART STEP CANNOT RUN HERE. `NextEndpointStep` tries root-part FIRST when
# `endpoint.RootPartUId != 0`, and a `RouteEndpoint` only ever gets a non-zero one from a
# `RouteOriginProof` (`RouteBuilder` sets `RootPartUId = originProof.StartDockedOriginRootPartUId`,
# on the ORIGIN endpoint only). This fixture carries NO `ROUTE_ORIGIN_PROOF` node - both
# trees start at a KSC site and the producer skips by design - and the DELIVERY stop's
# endpoint is `window.EndpointAtDock` verbatim, whose keys are pid / body / lat / lon /
# alt / isSurface and nothing else. So the walk is exactly pid -> proximity.
#
# THE GEOMETRY, computed off the committed values at Kerbin's 10471.98 m per degree of
# latitude, from the recorded `ENDPOINT_AT_DOCK` point (`lat 0.0055209707591019428
# lon -74.726196706906393 alt 65.978650289936922`, i.e. where the two rovers docked):
#     vessel `A`   pid 2875537755   LANDED       1.03 m      <- the transfer target
#     vessel `B`   pid  313889796   LANDED      16.42 m      (the transport, the focus)
#     `rover fuel 0` pid 2123618197 PRELAUNCH  567.93 m      (the named endpoint)
# So the fallback has a candidate 485 m inside its radius and 16x closer than the runner
# up - and the runner up is the TRANSPORT, which under the ruling is excluded before any
# distance is compared (MEASURED: `skipped=1 reason=route-own-transport`). So `A` wins
# here twice over - it is the nearest AND it is the only candidate the exclusion leaves -
# which is exactly why this lane cannot tell an exclusion that ran from one that did not.
# RVR-19 is the lane where the exclusion is the only thing deciding.
#
# AND `A` IS NOT ITSELF THE TRANSPORT, from the guids rather than from the names. The
# exclusion identifies the transport `VesselLaunchIdentity`-style - guid first, pid
# fallback - against the route's `SourceRefs` recordings. This fixture's transport tree
# (`73e50f1e...`) is four recordings in tree order: `cf8d06fc` (B, launch), `f2fb77ea`
# (B, the docked pair carrying the route window), `4370a799` (B, post-undock) and
# `0996f1ba` (A, the undock CHILD). Only the `[root..dock]` prefix becomes a source, which
# is why RVR-2 measured `sourceRefs = 2`, and both of those carry
# `recordedVesselGuid = 3edd6bc7967c4e2ca0feb9138d116b6d` - live `B`'s FLIGHTSTATE `pid`
# guid EXACTLY, so the exclusion matches B on a guid rather than falling back to a
# craft-baked pid. `A`'s live guid is `dec134a694674799b9faedd3af2ff2ab`: a different
# launch, not a source, and therefore a legal transfer target. Worth recording because the
# near miss is real: `0996f1ba` is A's recording and carries NO `recordedVesselGuid` at
# all, so a future change that widened the source set PAST the dock would fall to a
# pid-only match and start excluding `A` - which would red this lane on
# `BLOCKED kind=EndpointLost`. That is the forbid working, and the fix would be the source
# set, not this token. `RoverRouteEndpointMatrixTests` re-derives the whole paragraph.
#
# THE PICK IS THE PHYSICALLY CORRECT ROVER, which is why the ruling reads as "the base was
# rebuilt on the same spot" rather than as a mis-delivery. `rover fuel 0` carries the SAME
# BAKED `persistentId` as the recorded destination because KSP bakes the id into the
# `.craft` and reuses it on every launch; it is a later rollout sitting at the Runway
# 568 m away, and the rover that actually docked and took the cargo is `A`, whose
# committed containers are the window's `UNDOCK_ENDPOINT_INVENTORY` census item for item
# (2 `DeployedCentralStation`, 2 `evaChute`, 3 `evaScienceKit`). Deleting the pid-colliding
# rollout does not break the route: it makes the resolver find the vessel the recording was
# actually about.
#
# THIS ALSO STILL SETTLES THE QUESTION THE MATRIX WOULD OTHERWISE ASK NEXT: a `relocate`
# mode (patching a vessel's lat / lon) would change NOTHING for a route whose endpoint
# still carries a live pid, because step 2 is position-blind and wins before proximity is
# consulted. There is therefore no `relocate` mode, and this paragraph is the reason.
#
# -------------------------------------------------------------------------------------
# THE TRANSFER LINE IS PINNED FROM THE SHIPPED CONCATENATION, NOT PREDICTED. Confirmed
# 2026-09-04 by the `endpoint-transfer` C# author against that branch's own source,
# MERGED as PR #1627 (`d723cf419`), and MEASURED WHOLE on the `2026-09-03_2153` flight:
# `RouteEndpointTransfer.FormatTransferLine` (`Source/Parsek/Logistics/RouteEndpointTransfer.cs`),
# emitted through `ParsekLog.Info("Route", ...)`, one line per rebound endpoint, and
# pinned character-for-character by an xUnit cell there:
#
#   Route endpoint transferred: route=68749916 stop=0 role=destination
#   from=2123618197/'<unknown>' to=2875537755/'A' step=proximity distance=1.03
#   body=Kerbin at ut=1600
#
# THE THREE FIELDS THAT WOULD BITE A NAIVE PIN, each settled here rather than guessed:
#   * `from=...'<unknown>'` - `RouteEndpoint` (`Source/Parsek/RouteProofMetadata.cs`)
#     carries pid / rootPartUId / body / lat / lon / alt / isSurface and NO VESSEL NAME,
#     so the old name is only renderable while a live vessel still carries the recorded
#     pid. This lane DELETES that vessel, so `<unknown>` is the correct and REQUIRED
#     rendering here - and pinning it is a second, independent statement that the removal
#     took.
#   * `distance=` is F2 metres, InvariantCulture. The 2026-09-03 census puts `A` at
#     1.03 m so `distance=1.03` is the expected literal, but it is a LIVE float measured
#     from world positions rather than from the committed lat/lon, so the token regexes
#     `[0-9]+\.[0-9]{2}` - digits and a decimal POINT, which is also a culture guard.
#   * `at ut=` is `ToString("R")`, so the jump target prints `1600`, not `1600.0`. The
#     token stops at `at ut=` and does not pin the value.
#
# `step=proximity` IS THE ONLY LIVE-REACHABLE ARM and must not be relaxed to an
# alternation: a `RouteEndpoint` carries no launch guid today
# (RESOLVER-PID-STEP-NOT-GUID-GATED is still open), so the transfer decision's `step=pid`
# arm is unit-tested with no production caller. A lane pinning `step=(proximity|pid)`
# would be green on a build where the proximity arm had stopped firing.
#
# -------------------------------------------------------------------------------------
# THE CHAIN, END TO END.
#   step 5 (endpoints)   pid 2123618197 misses -> the transport is excluded
#                        (`skipped=1 reason=route-own-transport`) -> proximity picks `A`
#                        (derived 1.03 m, MEASURED `distance=2.01`)
#                        -> `Endpoint proximity step: resolved=1 pid=2875537755`
#                        -> `Route endpoint transferred: ... to=2875537755 step=proximity`
#                        -> the stop's persisted endpoint is now `A`
#   step 6 (origin)      KSC origin, returns true immediately (design 6.1)
#   step 7 (funds)       sandbox, not evaluated
#   step 8 (capacity)    A holds 297.6 / 400 LiquidFuel (102.4 free >= the 97.6 manifest)
#                        and, after this lane's `clear`, SIX free slots >= the three-item
#                        manifest -> fits
#   cycle 0              DELIVERS to `A`: `Delivery write: ... dest=A pid=2875537755`,
#                        tank 297.6 -> 395.2, three `Inventory store:` lines
#   cycle 1              THE REBIND WROTE BOTH IDENTITY FIELDS, so the walk stops at the
#                        FIRST step, not the second. Confirmed 2026-09-04 with the C#
#                        author: the rebind sets `vesselPersistentId` = the new pid AND
#                        `rootPartUId` = the resolved vessel's root part flightID (which is
#                        launch-unique where a pid is craft-baked), leaving the position
#                        fields as the historical dock anchor. `NextEndpointStep` tries
#                        root-part first when `RootPartUId != 0`, so cycle 1 prints
#                        `Endpoint resolved: step=root-part rootPartUId=<flightId>
#                        pid=2875537755 reason=-`, and the `step=pid` spelling only
#                        appears if the resolved vessel exposed no root flightID. The
#                        token below accepts EITHER, because which one fires is a
#                        property of the vessel rather than of the ruling. MEASURED:
#                        `rootPartUId=3962694490`, which is `A`'s own root part `uid` in
#                        the committed FLIGHTSTATE - so the token is pinned literally and
#                        a cell in `harness/lib` re-derives it from the bytes. What both
#                        branches assert is the same thing - proximity was not walked a
#                        second time and no second transfer happened. A then has 4.8 of headroom
#                        against 97.6 -> `BLOCKED kind=DestinationFull reason=LiquidFuel`,
#                        the armed pause consumed into `blocked-then-paused`
#
#   THE PRODUCED SAVE'S STOP GAINS A KEY, and it costs nothing: the rebind is an in-memory
#   mutation of `RouteStop.Endpoint` that `RouteCodec` already round-trips (unit-pinned on
#   the C# branch as `ReboundStop_RoundTripsThroughTheCodec`), no schema change and no
#   generation bump, so the STOP's `ENDPOINT` node now also carries a `rootPartUId` key
#   that was sparse before. `saveparse` reads named keys and ignores the rest, so the
#   `[expectations.routes]` facets below are unaffected. DORMANT routes are deliberately
#   NOT scanned by the transfer, so a dormant copy keeps its recorded pid - this lane has
#   `dormant = 0` and never exercises that.
#
# WHY A's CONTAINERS ARE CLEARED. Untouched, A holds FIVE of its six slots against a
# three-item manifest, so the delivery would refuse on a `stored-part:` shortfall before
# writing anything - and a lane whose whole subject is WHICH VESSEL the cargo reached
# would then have no delivery to point at. Clearing makes the substitution physical rather
# than inferred. `clear` is the mode RVR-12 and RVR-15 proved live on 2026-09-03.
#
# `path=loaded` IS PINNED AND IS MEASURED, from the 2026-09-03 run: A sits ~16.9 m from
# the focused rover, inside stock's landed UNPACK distance, so `destVessel.loaded &&
# !destVessel.packed` is TRUE. It is the OTHER writer branch from RVR-2's and RVR-4's
# `path=unloaded` (their endpoint is 568 m away: inside the LOAD distance, outside the
# PACK distance), which means this lane additionally gates
# `LiveDeliveryWriters.WriteResourceLoaded` / `WriteInventoryLoaded` and
# `LiveDeliveryCapacityProbe`'s LOADED slot walk. The ruling touches none of that, so the
# four `path=loaded` pins carry over unchanged.
#
# THE THIRD INVENTORY ITEM. The manifest is THREE stored parts, not two: RVR-16's census
# corrected that on 2026-09-03 (the window's endpoint delta gains a `DeployedCentralStation`
# under a re-hashed identity, plus the chute and the kit), and the run measured all three
# landing in A's cleared containers in that order. All three are pinned.
# =====================================================================================
description = "LIVE-PROVEN 2026-09-03: run 2026-09-03_2153, PASS attempt 1, wall 65 s, EVERY VERIFIER PASS, on the automation DLL sha256 2414aa3a3d32d7b7 - a clean build of main at d723cf419 (PR #1627, the endpoint-transfer ruling). RE-AUTHORED 2026-09-04 for that ruling and flown against it; the lane has now flown twice against two different contracts. The delivery endpoint is DELETED from FLIGHTSTATE, another craft stands 1.03 m from the recorded dock point, and under the 2026-09-04 operator ruling the route TRANSFERS ITSELF onto it: RouteEndpointResolver rebinds the persisted RouteStop.Endpoint to the resolved vessel, logs it once, and the produced save's STOP names the NEW pid. This lane was LIVE-PROVEN 2026-09-03 (run 2026-09-03_2011, PASS attempt 1, wall 49 s, DLL 995772453f2339a2) against the PRE-RULING behaviour and its census is what the ruling was decided on: the substitution happened and was recorded NOWHERE except the log (`destinationVesselPids: ['2123618197']`, the vessel that no longer existed). Re-authored, the lane makes three claims. FIRST, the substitution still happens: `remove = true` deletes `rover fuel 0` (pid 2123618197, the vessel the recorded window names), the pid step misses, and the 500 m surface search picks A (pid 2875537755) at 1.03 m against the transport's 16.42 m, with the deleted endpoint itself 567.93 m away and unreachable by proximity even before removal - so A wins on DISTANCE here and the new transport exclusion is not what decides it (RVR-19 is that lane). SECOND, the substitution is now RECORDED: `Route endpoint transferred: ... from=2123618197 ... to=2875537755 ... step=proximity` is a line the pre-ruling build cannot print, and `destinationVesselPids` flips to ['2875537755']. THIRD, the rebind is DURABLE: cycle 1 does not walk to proximity again but resolves at the FIRST step (MEASURED `Endpoint resolved: step=root-part rootPartUId=3962694490 pid=2875537755 reason=-`, and 3962694490 is A's own root part uid in the committed save, so the token is pinned literally and re-derived from the bytes in harness/lib), because the rebind writes BOTH `vesselPersistentId` and `rootPartUId` onto the stop - which is what proves it was persisted rather than recomputed, and is also why the transfer line fires exactly once by construction (the log-contract evaluator is regex-only and cannot count occurrences, so the single-shot claim rests on that positive token). The delivery itself is the 2026-09-03 measurement unchanged - `dest=A pid=2875537755 resource=LiquidFuel requested=97.599999999998431 tankBefore=297.59999999999843 tankAfter=395.19999999999686 path=loaded` plus all three stored parts, the suite's first driven path=loaded delivery, gating WriteResourceLoaded / WriteInventoryLoaded and the LOADED capacity probe - and cycle 1 still blocks DestinationFull reason=LiquidFuel on A's 4.8 of remaining headroom. THE TRANSFER LINE IS PINNED FROM THE SHIPPED CONCATENATION and MEASURED WHOLE on the flight (`Route endpoint transferred: route=1639ce29 stop=0 role=destination from=2123618197/'<unknown>' to=2875537755/'A' step=proximity distance=2.01 body=Kerbin at ut=1600`): `from=2123618197/'<unknown>'` (the old name is only renderable while a live vessel still carries the recorded pid, and this lane deletes it, so `<unknown>` is a second independent witness that the removal took), `to=2875537755/'A'`, `step=proximity` (the only live-reachable arm - the transfer decision's pid arm has no production caller while RESOLVER-PID-STEP-NOT-GUID-GATED is open, so the token must not become an alternation), and `distance=` regexed as F2 metres with an explicit decimal point (MEASURED 2.01, left regexed because it is a live world-position float and one measurement is not a contract - the harness's own 1.03 m was a great-circle stand-in over the committed lat/lon, which is what its docstring says it is). THE TRANSFER TARGET IS TRANSFERABLE AND THE TRANSPORT IS NOT, from the fixture's own guids: the route's source recordings carry `recordedVesselGuid = 3edd6bc7967c4e2ca0feb9138d116b6d`, which is live B's FLIGHTSTATE `pid` guid exactly, while A's is `dec134a694674799b9faedd3af2ff2ab` - a different launch, so the transport exclusion cannot capture it. THE FLIGHT CORRECTED ONE AUTHORED CLAIM, recorded rather than edited away: the exclusion RUNS on this lane too (`Endpoint proximity transport excluded: skipped=1 reason=route-own-transport`, now a REQUIRED token), so A is not merely the nearest candidate but the only one left - which means this lane cannot discriminate an exclusion that ran from one that did not, and RVR-19 is where that discrimination lives. Every report-only facet matched as declared: `routes count=1 dormant=0 stops=1 sourceRefs=2 completedCycles=1 skippedCycles=1 statuses={Paused:1} destinationVesselPids=['2875537755']`, with the measured-only holdKinds reading {DestinationFull:1}. THE ROOT-PART STEP CANNOT RUN and the bytes say why: only a RouteOriginProof gives an endpoint a RootPartUId, this fixture has none, and the stop's endpoint is window.EndpointAtDock verbatim. A relocate liveState mode would still change nothing while the endpoint carries a live pid, because the pid step is position-blind and wins before proximity."
instanceProfile = "stock-minimal"
tags = ["seam-verbs", "logistics", "route-create", "route-delivery", "endpoint-resolve",
        "surface-proximity", "endpoint-transfer", "live-state", "recorded-fixture",
        "RVR-18", "matrix"]

[fixture]
# `rover-route-recorded`, RVR-2's host. What this lane needs from it beyond RVR-2's list
# is the FLIGHTSTATE GEOMETRY: a recorded surface endpoint whose coordinates have a
# non-endpoint vessel parked essentially on top of them. That is a property of the
# operator's hand-flown session (the rovers never moved after the undock) and is
# re-derived from the committed bytes by `RoverRouteEndpointMatrixTests` in
# `harness/lib`, so a re-harvest that moved a rover reds there rather than on the flight.
saveTemplate       = "fixtures/saves/rover-route-recorded"
injectedRecordings = "none"
craft              = []

[[fixture.liveState]]
# THE REMOVAL. `rover fuel 0` is the vessel the route window names
# (`transferTargetPid = 2123618197`) and the one RVR-2's delivery reached. Deleting its
# whole FLIGHTSTATE `VESSEL` node is what opens the resolver's third step.
#
# THE APPLIER REFUSES A REMOVAL AT OR BEFORE `activeVessel`, and that guard is live
# here: this save's `activeVessel = 7` names the transport `B`, and `rover fuel 0` is
# the ELEVENTH vessel (index 10), so the index still names `B` after the delete. A
# removal at index <= 7 would silently re-point the focus and every token below would be
# a statement about a different scene.
pid    = 2123618197
remove = true

[[fixture.liveState]]
# THE TRANSFER TARGET'S SLOTS. Vessel `A` holds five of its six inventory slots, so an
# unmodified run would refuse the delivery on `stored-part:evaScienceKit` (RVR-16's
# subject) and this lane would have no delivery to attribute. Clearing both containers
# leaves six free slots against a three-item manifest; the LiquidFuel is deliberately left
# at the fixture's 297.6 / 400, which is what makes cycle 1 block on the RESOURCE half
# exactly as RVR-2's does.
pid       = 2875537755
inventory = "clear"

[driver]
kind = "seam"
# RVR-2's THIRTEEN STEPS, VERBATIM apart from the route name: the driver is the control
# and the two `liveState` blocks are the variable. Prologue rationale and the TimeJump
# derivation are RVR-2's; `verboseLogging = true` is REQUIRED because the resolver's
# proximity line, its `step=pid` line and both capacity lines are Verbose.
#
# THE ROUTE NAME IS UNCHANGED from the pre-ruling authoring. "Lost Endpoint" still
# describes the STAGING (the named endpoint really is deleted); what the ruling changed is
