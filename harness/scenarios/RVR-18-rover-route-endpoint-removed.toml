[dimensionsCovered]
# **NO D10 CLAIM, AND THE RULING DID NOT CREATE ONE.** The behaviour this lane gates -
# endpoint RESOLUTION, and specifically the surface-proximity fallback and the transfer
# it now performs - has no registry value, and adding one is a registry decision taken on
# its own merits (`route-map-lines-surface`'s own registry comment is the worked example
# of what that costs to justify). A value invented to fit one lane is the failure mode it
# guards. What HAS changed since the pre-ruling authoring is the second reason that stood
# here: "the ruling is open" no longer applies, the contract is decided. The claim is
# still not made, on the growth rule alone, and a future `endpoint-transfer` registry
# value would be declared by BOTH this lane and RVR-19 (the transfer and its refusal are
# two sides of one contract) or by neither.
#
# `delivery` and `inventory-cargo` are NOT claimed either, although the run drives both:
# they are BDOCK-1's and RVR-15's, and this lane adds nothing under either NAME - its
# novelty (which vessel received the cargo, and that the route rebound onto it) is
# precisely what those values do not name.
D14 = ["sandbox", "scene-flight"]

