# ARMED 2026-09-23 off reading run `2026-09-23_0000` (PASS attempt 1 on its report-only
# block): trees 1, committedTrees 1, recordings 1, Landed 1.
[expectations.recordings.structure]
gating         = true
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Landed = { min = 1, max = 1 } }

# Every token below except the two DEFECT assertions was read off `2026-09-23_0000`.
[expectations.logContracts]
required  = [
  "Recording started",
  "MISSIONMARK label=ex1-commit-count-1-pid-[1-9][0-9]*-spawned-true ",
  "invokerewindtolaunch complete rec=",
  "MISSIONMARK label=ex1-reloaded-count-1-pid-0-spawned-false ",
  "PlaybackCompleted index=[0-9]+ vessel=Logi Cargo Rig ghostWasActive=True pastEffectiveEnd=True needsSpawn=True",
  "Spawn blocked for #[0-9]+ \\(Logi Cargo Rig\\): within KSC exclusion zone",
  "Ghost held pending spawn retry: #[0-9]+ \"Logi Cargo Rig\" id=",
  "Held ghost timed out: #[0-9]+ \"Logi Cargo Rig\" id=\\S+ held=5\\.[0-9]s",
  # The vessel never spawned in the session: the exclusion zone refused every retry.
  "MISSIONMARK label=ex1-after-hold-count-1-pid-0-spawned-false ",
  # DEFECT ASSERTION 1: the held ghost is released by the timeout, i.e. it was alive
  # through the hold. Absent today (the ghost was already gone).
  "Ghost #[0-9]+ \"Logi Cargo Rig\" destroyed \\(held-spawn-timeout\\)",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "Held ghost spawn succeeded on retry",
  "Vessel spawned for #[0-9]+ \"Logi Cargo Rig\"",
  "Vessel respawned",
  # DEFECT ASSERTION 2: the engine's stale past-end cleanup destroys the ghost before the
  # hold times out. Matches today.
  "Ghost #[0-9]+ \"Logi Cargo Rig\" destroyed \\(stale past-end ghost \\(no longer held\\)\\)[\\s\\S]*?Held ghost timed out: #[0-9]+ \"Logi Cargo Rig\"",
]

