schema = 1
id = "EX-1-ghost-extension-past-endut"
# -------------------------------------------------------------------------------------
# D18 `ghost-extension-past-endut` (catalog section 2: "ghost extension past EndUT while
# blocked"; design `docs/parsek-flight-recorder-design.md` 13.5), ON THE NON-CHAIN
# HELD-GHOST PATH, SCOPED TO THE KSC EXCLUSION-ZONE HOLD (the only non-chain blocker that
# holds a ghost; see below). CLAIMS the cell since the 2026-09-23 fix of
# D18-HELD-GHOST-DESTROYED-BY-STALE-PAST-END-CLEANUP-SAME-FRAME (branch `held-ghost-fix`):
# the lane was an expectedFail witness until that fix read XPASS (`2026-09-23_1510`).
# The claim is the 5 s bounded hold the code implements, which the operator ruled to BE
# the design on 2026-09-23 (#1774, design 13.5; todo D18-GHOST-EXTENSION-DESIGN-VS-CODE).
#
# WHAT HOLDS A GHOST PAST EndUT ON THE NON-CHAIN PATH (source, 2026-09-23):
# `ParsekPlaybackPolicy.HandlePlaybackCompleted` writes "Ghost held pending spawn retry:"
# only when `SpawnVesselOrChainTip` returns with `VesselSpawned` still false AND the ghost
# was live at completion. `RetryHeldGhostSpawns` retries every 1 s and gives up at 5 s
# ("Held ghost timed out: ... destroying ghost without spawn"), whose release destroys the
# ghost with reason `held-spawn-timeout`. A loaded blocker vessel on the endpoint never
# gets there (#112 recovers a same-name blocker, #264 walkback relocates, exhaustion
# abandons with VesselSpawned = true; the active vessel is never a blocker). The KSC
# EXCLUSION ZONE (#170, a landed home-world spawn within 50 m of the pad or runway) does,
# so that is this lane's blocker. See D18-GHOST-EXTENSION-DESIGN-VS-CODE (ruled: keep the
# code) and D18-CHAIN-SPAWN-BLOCKED-GHOST-6B4-NOOP (the chain half, open).
#
# THE DEFECT THIS LANE PINNED (reading run `2026-09-23_0000`, one frame): the engine logged
# `Ghost #0 "Logi Cargo Rig" destroyed (stale past-end ghost (no longer held))` and only
# THEN delivered `PlaybackCompleted ... ghostWasActive=True`, after which the policy wrote
# "Ghost held pending spawn retry ... ghost stays visible" for a ghost already gone.
# `HandlePastEndGhost` defers the completed event, and the stale past-end cleanup in the
# same loop iteration saw `completedEventFired && !IsGhostHeld(i)`. The fix postpones that
# cleanup until the completion has reached the policy (same frame), which logs
# `Stale past-end cleanup after completion delivery: ... kept (held by the policy)`. The
# REGRESSION assertions below are the forbidden stale-destroy-before-timeout form, the
# required `destroyed (held-spawn-timeout)` release, the required post-delivery keep line,
# and the forbidden "no ghost to keep visible" wording of the policy's hold line.
#
# THE ROAD. `pad-runway-pair` (built offline by harness/tools/build_pad_runway_pair.py):
# a clone of rover-route-recorded's `rover fuel 0` on the runway at VESSEL index 0, the
# host asteroid at 1, logi-cargo-pad's `Logi Cargo Rig` on the pad at 2, focused.
#   1. Record the Rig on the pad in-run (StartRecording, StopRecording, CommitTree): a
#      single-recording NON-CHAIN tree, Landed terminal, endpoint inside the pad zone.
#   2. Rewind-to-Launch it (the Rig is stripped), then SaveGame + LoadGame at once,
#      BEFORE 1x Space Center time reaches EndUT (the KSC-scene spawn has no exclusion
#      check and would place the Rig on the pad). A Space Center save carries
#      `activeVessel = 0` (measured), so the load lands in FLIGHT on the runway rover
#      about 12 s before StartUT. (The first reading had the asteroid at index 0, focused
#      it, and the pad ghost sat in the Beyond zone, never live.)
#   3. Inert steps let 1x time run: the Rig's ghost goes live on the pad ~1.8 km away,
#      EndUT passes, the pad exclusion zone refuses the spawn, the policy holds, retries
#      and times out.
# HISTORY: expectedFail from PR #1772 until the fix; its CONTROL `2026-09-23_0012` (defect
# assertions removed) read XPASS, proving the defect was the only red. Post-fix: reading
# `2026-09-23_1510` XPASS (spec unchanged), then un-quarantined; see autotest-status.md.
# -------------------------------------------------------------------------------------
tier = "nightly"
description = "D18 ghost-extension-past-endut on the non-chain held-ghost path, SCOPED TO THE KSC EXCLUSION-ZONE HOLD (a vessel blocker never holds on the non-chain path; ruled 2026-09-23 (#1774): the bounded hold IS the design, design 13.5). Record the pad probe of pad-runway-pair in-run, Rewind-to-Launch it, reload into FLIGHT on the runway rover, and let 1x time carry the replayed ghost through EndUT, where the KSC exclusion zone refuses the spawn and ParsekPlaybackPolicy holds the ghost for the 5 s retry window. Asserts the ghost survives the hold (the engine keeps it after the completion reaches the policy, no stale past-end destroy before the timeout, then a held-spawn-timeout release) and the vessel never spawns. Regression lane for D18-HELD-GHOST-DESTROYED-BY-STALE-PAST-END-CLEANUP-SAME-FRAME (fixed 2026-09-23)."
instanceProfile = "stock-minimal"
tags = ["EX-1", "D18", "held-ghost", "spawn-blocked", "ksc-exclusion-zone",
        "rewind-to-launch", "R10", "runtime-handles"]

