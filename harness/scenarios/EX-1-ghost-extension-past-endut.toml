[dimensionsCovered]
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 1 }

# ARMED 2026-09-23 off reading run `2026-09-23_0000` (PASS attempt 1 on its report-only
# block): trees 1, committedTrees 1, recordings 1, Landed 1.
[expectations.recordings.structure]
gating         = true
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Landed = { min = 1, max = 1 } }

# Carried over from `2026-09-23_0000` / `_1510`: the commit, rewind and reload marks and
# the PlaybackCompleted line. The RETIRED line, the teardown reason and the after-end mark
# (settled with no vessel: spawned-true, pid 0) were read off `2026-09-23_1810`.
[expectations.logContracts]
required  = [
  "Recording started",
  "MISSIONMARK label=ex1-commit-count-1-pid-[1-9][0-9]*-spawned-true ",
  "invokerewindtolaunch complete rec=",
  "MISSIONMARK label=ex1-reloaded-count-1-pid-0-spawned-false ",
  "PlaybackCompleted index=[0-9]+ vessel=Logi Cargo Rig ghostWasActive=True pastEffectiveEnd=True needsSpawn=True",
  # The retirement, one Info line, pad circle (`_1810`).
  "\\[Spawner\\] Spawn RETIRED for #[0-9]+ \\(Logi Cargo Rig\\): flight ended within KSC exclusion zone \\(pad\\) - no vessel lat=-0\\.097[0-9] lon=-74\\.557[0-9] body=Kerbin terminal=Landed rec=",
  # The ghost is torn down by the completion itself, not held (`_1810`).
  "Ghost #[0-9]+ \"Logi Cargo Rig\" destroyed \\(playback completed\\)",
  # Settled with no vessel in the session, the retirement's state (`_1810`).
  "MISSIONMARK label=ex1-after-end-count-1-pid-0-spawned-true ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # No hold, no retry, no timeout: the ruling removed the pad hold.
  "Ghost held pending spawn retry",
  "Ghost held during warp-deferred spawn",
  "Held ghost timed out",
  "Held ghost spawn succeeded on retry",
  # The removed #170 block must not come back.
  "Spawn blocked for #[0-9]+ \\(Logi Cargo Rig\\): within KSC exclusion zone",
  # No vessel, by any spawn path.
  "Vessel spawned for #[0-9]+ \"Logi Cargo Rig\"",
  "Vessel respawned",
  "SpawnAtPosition: vessel spawned",
  # Exactly one retirement: a settled recording is never re-retired in the session.
  "Spawn RETIRED for #[0-9]+ \\(Logi Cargo Rig\\)[\\s\\S]*Spawn RETIRED for #[0-9]+ \\(Logi Cargo Rig\\)",
]

[runtime]
budgetSeconds = 1800

[retry]
policy = "once"
