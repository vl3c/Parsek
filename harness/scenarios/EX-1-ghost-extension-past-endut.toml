  { cmd = "SaveGame", args = { name = "ex1-rewound" }, expect = "OK", budget = 120 },
  { cmd = "LoadGame", args = { save = "${runSave}", name = "ex1-rewound" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording", expect = "OK" },
  { cmd = "DiscardTree", expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c1", expect = "OK" },
  { cmd = "MissionMark", args = { label = "ex1-reloaded-count-${c1.count}-pid-${c1.rec0spawnedPid}-spawned-${c1.rec0spawned}" }, expect = "OK" },
  # --- ACT 3: 1x flight time carries UT through StartUT (ghost goes live on the pad,
