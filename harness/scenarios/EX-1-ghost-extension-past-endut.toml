schema = 1
id = "EX-1-ghost-extension-past-endut"
# -------------------------------------------------------------------------------------
# KSC END-OF-FLIGHT RETIREMENT WITNESS (operator ruling 2026-09-23; design
# `docs/parsek-flight-recorder-design.md` 13.1 / 13.5). LIVE-PROVEN 2026-09-23: reading `2026-09-23_1810`, armed `_1820`,
# negative control `_1822`.
#
# A recording whose vessel ENDS its flight parked in the KSC exclusion zone (the 50 m
# pad-centre and runway-threshold circles, home world, non-EVA) has ended its flight: it
# is RETIRED, never spawned, in every scene, and its ghost is not held for spawn retries.
# The spawn call settles it at once (`VesselSpawned = true`, `SpawnAbandoned = true`,
# spawned pid 0) and logs one Info line:
#   `[Spawner] Spawn RETIRED for #N (Name): flight ended within KSC exclusion zone (pad)
#    - no vessel lat=... lon=... body=Kerbin terminal=Landed rec=...`
# so `ParsekPlaybackPolicy.HandlePlaybackCompleted` reads the spawn as settled and tears
# the ghost down with the ordinary completion instead of registering a hold.
#
# UNTIL 2026-09-23 this lane was the D18 `ghost-extension-past-endut` claim, riding the
# 5 s bounded hold the KSC exclusion zone used to cause (#170 refused the spawn, the
# policy held the ghost, retried every 1 s and timed out). The ruling removed that hold,
# so the claim moved off: `[dimensionsCovered] D18` is gone, and since 2026-09-24 the cell
# rides `EX-2-single-point-held-ghost` (the single-point collision hold; todo
# D18-GHOST-EXTENSION-SINGLE-POINT-HOST, closed). The id stays.
# The D18-HELD-GHOST-DESTROYED-BY-STALE-PAST-END-CLEANUP-SAME-FRAME regression this lane
# pinned (fixed 2026-09-23, reading `2026-09-23_1510`) keeps its unit cells; this road no
# longer reaches a held ghost.
#
# THE ROAD (unchanged). `pad-runway-pair` (built offline by
# harness/tools/build_pad_runway_pair.py): a clone of rover-route-recorded's `rover fuel 0`
# on the runway at VESSEL index 0, the host asteroid at 1, logi-cargo-pad's `Logi Cargo
# Rig` on the pad at 2, focused.
#   1. Record the Rig on the pad in-run (StartRecording, StopRecording, CommitTree): a
#      single-recording NON-CHAIN tree, Landed terminal, endpoint inside the pad circle
#      (1.8 m from its centre).
#   2. Rewind-to-Launch it (the Rig is stripped), then SaveGame + LoadGame at once,
#      BEFORE 1x Space Center time reaches EndUT, so the end is crossed in FLIGHT (the
#      Space Center would retire it too, now; the flight scene is the one whose ghost used
#      to be held). A Space Center save carries `activeVessel = 0` (measured), so the load
#      lands in FLIGHT on the runway rover about 12 s before StartUT.
#   3. Inert steps let 1x time run: the Rig's ghost goes live on the pad ~1.8 km away,
#      EndUT passes, the spawn call RETIRES the recording, no hold, no vessel.
#
# MEASURED: reading `2026-09-23_1810` PASS attempt 1 (DLL sha256 `3970c939...`, commit
# `0fea2d1df`) logged exactly one `Spawn RETIRED for #0 (Logi Cargo Rig): flight ended
# within KSC exclusion zone (pad) - no vessel lat=-0.0972 lon=-74.5577 body=Kerbin
# terminal=Landed`, no hold, no #170 block line, no spawn; the teardown and the after-end
# mark (`spawned-true` with pid 0, the settled-without-vessel state ListHandles reports)
# read as pinned. Armed `2026-09-23_1820` PASS attempt 1 on the fix-up DLL (sha256
# `756a9ce6...`, commit `746e6c48e`); negative control `_1822` PARSEK-FAIL on exactly its
# one seeded forbidden token (the RETIRED line), reverted. The commit / rewind / reload
# marks and the `PlaybackCompleted ... needsSpawn=True` line date from `2026-09-23_0000` /
# `_1510`: the flag pass still asks for the spawn, the retirement happens inside the call.
# HISTORY: expectedFail from PR #1772 until the held-ghost fix; reading `2026-09-23_1510`
# XPASS, then un-quarantined; retirement rewrite 2026-09-23 (reading `_1810`).
# -------------------------------------------------------------------------------------
tier = "nightly"
description = "KSC end-of-flight retirement witness (operator ruling 2026-09-23): record the pad probe of pad-runway-pair in-run, Rewind-to-Launch it, reload into FLIGHT on the runway rover, and let 1x time carry the replayed ghost through EndUT. The flight ended parked in the pad circle of the KSC exclusion zone, so the spawn call retires the recording (Spawn RETIRED ... (pad) - no vessel): no hold, no retry, no vessel, the ghost torn down with the ordinary completion. Formerly the D18 ghost-extension-past-endut claim on the pad hold the ruling removed; the claim moved off and rides EX-2-single-point-held-ghost since 2026-09-24. LIVE-PROVEN 2026-09-23: reading 2026-09-23_1810, armed _1820, negative control _1822."
instanceProfile = "stock-minimal"
tags = ["EX-1", "ksc-retirement", "ksc-exclusion-zone", "no-held-ghost",
        "rewind-to-launch", "R10", "runtime-handles"]

