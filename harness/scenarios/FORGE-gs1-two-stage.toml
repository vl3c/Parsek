schema = 1
id = "FORGE-gs1-two-stage"
# =====================================================================================
# FIXTURE-FORGE for the GS-1 auto-chute-booster lane. NOT a coverage flight.
#
# operator tier: like its three siblings this NEVER runs on a cadence
# (hlib.CADENCE_TIERS maps no cadence to `operator`), only under an explicit
# `--id FORGE-gs1-two-stage` / `--tier operator`. It boots the SAME committed
# bdock-forge-base the other three forges boot, launches the NEW committed
# `GS1 Auto-Chute Booster` craft onto the pad with one named crew via kRPC
# launch_vessel, waits for it to settle PRELAUNCH, and SaveGame + FlushAndQuit persist
# the pad state. Then
#
#   python harness/tools/harvest_bdock_station.py --instance <ksp-instance> \
#       --run-save bdock-forge-base --target-name gs1-two-stage-pad \
#       --expect-situation PRELAUNCH
#
# prunes Parsek state, normalizes the title, and writes the committed
# `fixtures/saves/gs1-two-stage-pad` fixture that GS-1-auto-chute-booster consumes.
#
# NO NEW HARVEST TOOL, deliberately. `harvest_bdock_station.py` is already generic over
# the produced situation (`--expect-situation`, added for the ORBITAL eva2 forge) and
# over the fixture name (`--target-name`), and its own docstring says so. A fourth
# copy would be three tools' worth of drift for zero new behaviour, and the next lane
# that needs a forge (an ATTACHED two-probe stack parked in orbit, say) gets it free.
#
# WHY A FORGE AT ALL, when career-pad-craft was built headlessly by a script. Because
# that script SPLICES WHOLE EXISTING NODES: it copies b1-pad-craft's Jumping Flea
# VESSEL node verbatim. GS-1 needs a craft that does not exist anywhere - a booster
# stage carrying BOTH a ModuleCommand probe core (so the staging split is
# MULTI-CONTROLLABLE and authors a RewindPoint) AND parachutes (so it lands Immutable
# instead of crashing to CommittedProvisional). Every committed fixture craft and every
# stock VAB craft was checked; not one has a chute on its booster stage. The .craft
# itself is authored BY CONSTRUCTION by `harness/tools/build_gs1_craft.py` (which is
# also the derivation record and the drift gate); this forge is what turns that craft
# into a pad save, because nothing but KSP can.
#
# FLOWN 2026-08-05 and RE-FLOWN 2026-08-12. The 2026-08-05 stamp was KNOWN-DEGRADED:
# that run passed crewNames = ["Jebediah Kerman"], who is unseatable in the base, so
# its pod was EMPTY (see the crewNames comment below). Re-flown under the corrected
# params (Valentina + minCrew=1): run 2026-08-12_1552 PASS attempt 1, the new
# crewAboard assertion read value=1 live, and the re-harvested committed fixture
# carries `crew = Valentina Kerman` / `state = Assigned`. GS-1 then flew the
# re-stamped fixture to a full PASS the same day (run 2026-08-12_1556, attempt 1,
# armed saveParse green). A failure classifies driver-INVALID (retryable), never a
# PARSEK-FAIL: the forge asserts nothing about Parsek and its logContracts.required
# list is empty on purpose.
#
# WHAT A FAILED FIRST RUN MEANS, in the order the assumptions bite. The full derivation
# and its five numbered assumptions live in `build_gs1_craft.py`'s module docstring;
# the short forms, because this is the run that falsifies them:
#   A1 root-relative origin   -> craft loads at a silly height on the pad
#   A2 radial surface radius  -> canopies visibly floating off / sunk into the tank
#   A3 staging (istg)         -> the decoupler and the booster chutes land in DIFFERENT
#                                stages, which breaks the whole "auto-chute" premise
#   A4 chute module defaults  -> a booster canopy opens at an unexpected altitude
#   A5 touchdown mass         -> only GS-1 itself can falsify this one; the forge never
#                                flies the craft
# A crash or a kraken at launch is A1/A2; a wrong staging list is A3. None of those is
# a Parsek finding.
# =====================================================================================
tier = "operator"
description = "FIXTURE-FORGE: boot the committed forge base, launch the GS-1 two-stage auto-chute booster onto the pad with one named crew, settle PRELAUNCH, SaveGame -- headlessly stamps the gs1-two-stage-pad fixture (harvest_bdock_station.py --target-name gs1-two-stage-pad)."
instanceProfile = "stock-minimal"
tags = ["FORGE", "fixture", "GS1", "rewind", "flown"]

[fixture]
# The SAME committed bootable base the other three forges use: gloops-airshow's FLIGHT
# state (an active vessel, so LoadGame's IsLoadedGameFocusable gate passes) plus a
# Ships/VAB directory kRPC launch_vessel resolves <save>/Ships/VAB/<craftName>.craft
# against. This change ADDS `GS1 Auto-Chute Booster.craft` to that directory and
# changes nothing else about the base, so the three existing forges are untouched (a
# forge selects its craft by the craftName param).
saveTemplate       = "fixtures/saves/bdock-forge-base"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
# UNCHANGED mission: `forge_station` is already generic over craft + launch site +
# crew names. No mlib edit, no new mission code, no new schema for the forge half.
mission = "forge_station"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header (a
# key after the sub-table header would be TOML-scoped to driver.missionParams.steps and
# the spec would validate as having zero steps).
#
# No SetSetting: the pad craft never stages here, so no recording starts, and the
# harvest prunes any Parsek/ dir regardless.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { phase = "mission",  expect = "MISSION-OK", budget = 120 },
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[driver.missionParams]
craftName            = "GS1 Auto-Chute Booster"
launchSite           = "LaunchPad"
# ONE named crew, and NOT Jebediah (the name this spec originally passed): in
# bdock-forge-base Jeb is ALREADY `state = Assigned` (he crews the base's own active
# vessel), and kRPC launch_vessel does NOT fail loudly on an unseatable name -- it
# launches an EMPTY pod and leaves the kerbal `Missing`. That is exactly how the
# COMMITTED gs1-two-stage-pad fixture was stamped (empty Mk1 pod, Missing Jeb);
# nobody noticed because this craft carries a probeCoreOcto2 ALONGSIDE the pod, so
# GS-1 flies probe-controlled either way. Measured 2026-08-11 on the first
# b18-dres-pad forge run, whose spec header carries the full trap write-up.
# Valentina is `Available` in the base (as are Bill and Bob); eva3-pad-3crew is the
# positive control that an Available name really does get seated. It is a SANDBOX
# save, so nothing about the roster is asserted -- the only requirement is that the
# named kerbal be seatable.
crewNames            = ["Valentina Kerman"]
# The forge-time guard for the trap above: with a positive floor, the settle gate
# also requires crew_count >= minCrew, so a silent seating failure flakes ON THE
# PAD naming the crew instead of stamping an uncrewed fixture.
minCrew              = 1
# Game-seconds to see the new craft settle PRELAUNCH before flaking. Generous:
# launch_vessel is a scene reload.
launchTimeoutSeconds = 120
settleDebounceFrames = 3

# The forge is a fixture stamp, not a coverage flight: it commits no recording and
# asserts nothing about Parsek. Only the honest environment cells are cited.
[dimensionsCovered]
D14 = ["kerbin", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read (hlib.validate_spec REJECTS the misplaced form), so
# this key must stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# The pad craft never stages here, so no recording starts / commits. max 1 absorbs a
# nascent auto-record if the base's persisted setting happens to be on; the harvest
# prunes Parsek state regardless. Same window as the sibling pad forge.
count = { min = 0, max = 1 }

[expectations.logContracts]
# EMPTY required list, deliberately: a forge asserts nothing about Parsek, and a
# required token here would convert a fixture-stamping failure into a PARSEK-FAIL.
# The forbidden ERROR pattern stays - a forge that makes Parsek throw is still a
# finding, and the sibling forges have never emitted one.
required  = []
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# 240 LoadGame + 120 mission + the fast SaveGame / FlushAndQuit verbs + margin.
# Matches the sibling pad forge, which flies the same mission against a heavier craft.
budgetSeconds = 500

[retry]
policy = "once"

[expectedFail]
bugId = ""
