# THE MATRIX'S LAST OPEN CELL: THE DESTINATION HAS EVERY UNIT OF RESOURCE ROOM IT COULD
# HAVE AND NOT ONE FREE SLOT.
#
# **LIVE-PROVEN 2026-09-06: FIRST CENSUS `2026-09-06_2027`, PASS attempt 1, wall 56 s,
# EVERY VERIFIER PASS AND `expectations mismatches=0` ON THE FIRST FLIGHT.** Flown on the
# CLEAN automation DLL sha256 `db525f5efe422d51`, built from `main` e4704e749 (PR #1629
# airborne phase anchors, #1630 undock BG-child empty section, #1631 the `fill` mode and
# this lane), with the guard bodies IL-verified before provisioning. The readings:
# `driverValidity` PASS allMet=True over all eleven steps, `analyzer` PASS `red=0`
# `failNonBaselined=0` `staleNonBaselined=0`, `logValidate` PASS, `anomalySweep` PASS with
# zero hits, `expectations` PASS `observed.recordings.count = 10`, `saveParse` REPORT
# reading `routes count=1 dormant=0 stops=2 sourceRefs=3 completedCycles=0 skippedCycles=1
# statuses={Paused:1} holdKinds={DestinationFull:1}` and `structure trees=3
# committedTrees=3 recordings=10 terminalStates={Landed:5,Docked:2}
# branchPoints={Dock:2,Undock:2}` - every declared facet as authored.
#
# **MISPREDICTION HISTORY: NONE.** This file was authored entirely from source on
# 2026-09-06 and every token it predicted matched on the first flight, which is not the
# usual outcome in this family (RVR-7 red on five authoring mispredictions, RVR-16 on
# three) and is worth stating rather than assuming.
#
# WHAT WAS A PREDICTION AND IS NOW A MEASUREMENT. The five claims listed under "WHAT IS A
# PREDICTION AND WHAT IS NOT" below were all confirmed: the cycle BLOCKED rather than
# delivering the fuel and skipping the items; the hold kind is `DestinationFull` with a
# `stored-part:` detail rather than a bare resource name; all three producers agree; the
# armed send-once was consumed into `blocked-then-paused`; nothing was debited or written.
# The two things the prediction could not reach are now measured too, and are RE-PINNED AS
# LITERALS because each is a property of THIS FIXTURE rather than of the run:
#   * the part the token names is `evaChute` (was `[A-Za-z]+` at all three producers);
#   * `stop=1` (was `[0-9]+`) - the route's TWO stops map to rover A, the full
#     destination, at capacity-walk index 1.
# `cMin=` and the route id STAY REGEXED and are not census material: `cMin` is the loop
# index the crossing resolves to, a property of the CLOCK (RVR-9's finding, and RVR-7's
# own `cMin=0` turned out to have encoded a defect), and the id is per-run.
#
# THE MEASURED LINES, from the run's own `KSP.log` (route id `2d3bc552` is per-run):
#     PickupSourcesHaveCargo: route 2d3bc552 source pid=90564594 name=B resources=1
#         inventory=3 decision=cover
#     PickupSourcesHaveCargo: route 2d3bc552 all 1 pickup source(s) cover - eligible
#     DestinationHasCapacity: route 2d3bc552 destination FULL stop=1
#         short=stored-part:evaChute (stopsResolved=1 stopsUnresolved=0) - holding cycle
#         all-or-nothing
#     Route 2d3bc552 hold recorded kind=DestinationFull detail=stored-part:evaChute
#         shortfall=0 ut=1100
#     LoopRoute(multi): route 2d3bc552 cycle=cycle-0 cMin=4 BLOCKED kind=DestinationFull
#         reason=stored-part:evaChute shortfall=0 [the shipped literal continues past a
#         NON-ASCII dash here, so every token in this family stops at the reason]
#         ... skippedCycles=1 stillDue=0
#     ArmedPause: route 2d3bc552 cycle=cycle-0 BLOCKED cycle consumed the armed pause
#         [same non-ASCII dash] Active->Paused reason=blocked-then-paused armedBy=send-once
#         hold kind=DestinationFull detail=stored-part:evaChute (kept) at ut=1100
# The staging line the harness itself wrote: `liveState patched pid=4280917262 name=A
# resources=[LiquidFuel 200->0] inventory=keep fill=evaChute x3 slots=3 [c0s1,c0s2,c1s2]
# from this vessel's own container (slot 0)`.
#
# **AND THE PRODUCED SAVE SAYS THE SAME THING, WHICH IS THE READING THAT MATTERS TO A
# PLAYER.** Read back out of the run's `persistent.sfs`: rover A (pid 4280917262) is at
# LiquidFuel `0 / 400` with SIX of six slots occupied (c0: evaChute x3; c1: evaScienceKit
# qty 2, DeployedCentralStation, evaChute), and rover B (pid 90564594) is UNTOUCHED at
# `200 / 400` with its three stored parts. Across 11,444 log lines there is not one
# `Delivery write:`, `Origin debit:` or `Inventory remove`, and zero `[Parsek][ERROR]`.
# So the whole cycle refused, the fitting resource line was refused with the items, and
# nothing was taken off the origin first.
#
# WHAT IT MEASURES, IN ONE SENTENCE. `RouteDestinationCapacityCheck` is all-or-nothing
# over TWO populations - resources and stored-part inventory slots - and `FirstShortToken`
# walks the RESOURCE lines before the inventory ones. Every relay-c lane that reaches the
# refusing direction refuses on the resource half (RVR-13 `short=LiquidFuel` at zero
# headroom, RVR-14 the same at 100 units of headroom), so on this fixture the inventory
# half has never been observed at all. This lane inverts both halves at once: the tank is
# staged EMPTY (400 of headroom against a 200 manifest, the most room it can have) and
# every slot is staged FULL, so the resource walk cannot refuse and the slot count is the
# only thing that can.
#
# THE EDGE ROADMAP ITEM 15 RECORDED AS NOT EXPRESSIBLE, NOW EXPRESSIBLE. That entry says
# the destination-slots-full cell "IS NOT EXPRESSIBLE FROM THESE BYTES" and needs "a
# FLIGHTSTATE FILL MODE (with an explicit, defensible placement rule) or a SECOND
# HARVEST". The fill mode is the one this lane uses, and its rule is stated where it is
# implemented (`harness/lib/savepatch.py`, the `fill` comment): CLONE a `STOREDPART` node
# ALREADY PRESENT IN THIS SAVE into EVERY FREE SLOT, containers in FILE order and slots
# ascending inside each, rewriting nothing but the clone's ADDRESS (`slotIndex`) and the
# one field whose uniqueness the save depends on (the nested `PART`'s `persistentId`).
# The bytes are RECORDED; only the placement is authored. RVR-16 reached the same GATE on
# the OTHER rover fixture by PLAYING it (3 of 6 slots free, one cycle consuming all
# three), which is why this mode was not built earlier; it cannot be played here, because
# rover A has three free slots and one cycle consumes at most two.
#
# -------------------------------------------------------------------------------------
# THE STAGED STATE, AND THE ARITHMETIC IT PRODUCES.
#
# ONE `[[fixture.liveState]]` ENTRY, on rover A (pid 4280917262), doing two things:
#   * `resources = { LiquidFuel = 0 }` - RVR-15's own staging, verbatim. A's tank holds
#     400 at capacity, so an emptied tank is 400 of headroom against a 200 manifest.
#   * `fill = { part = "evaChute", slots = 3 }` - A carries TWO `ConformalStorageUnit`
#     containers of three slots each and ships THREE stored parts (c0: evaChute at slot 0;
#     c1: evaScienceKit at slot 0, DeployedCentralStation at slot 1), so the free set is
#     exactly {c0s1, c0s2, c1s2} and the fill clones A's OWN `evaChute` into all three.
#     Six of six slots occupied. `harness/lib/test_savepatch.py`'s `CommittedFillTests`
#     pins those three addresses against the committed bytes, so a re-harvest that moved
#     them reds locally rather than on the instance.
#
# THE `slots = 3` IS DECLARED BECAUSE THE SAVE DOES NOT CARRY IT. `InventorySlots` is a
# PART-CONFIG property of `ConformalStorageUnit`; the string appears ZERO times in
# `persistent.sfs` and the fixture ships no readable craft file (its `.craft` sidecars are
# compressed `PSN0` blobs). The 3 is `build_rover_relay_c_recorded.INVENTORY_CONTAINER_SLOTS`,
# the builder's own measured constant, and a `harness/lib` cell asserts this spec's
# declared value against it so the two cannot drift.
#
# ROVER B IS NOT TOUCHED, exactly as RVR-13, RVR-14 and RVR-15 leave it: the builder
# already stages both endpoints at start-of-cycle from their own recorded dock windows, so
# B holds the 200 LiquidFuel and three stored parts that cover the 154.3999999999952
# pickup. That is what makes gate 6 pass and the gate-8 refusal attributable.
#
# -------------------------------------------------------------------------------------
# THE PREDICTION, DERIVED LAYER BY LAYER, WITH THE SOURCE LINES IT RESTS ON.
#
#   1. `RouteDeliveryPlanner.PrepareDelivery` builds ONE plan covering BOTH populations.
#      The resource line asks 200 against 400 of free capacity, so `available` equals
#      `requested` and `anyResourcePartial` stays FALSE
#      (`RouteDeliveryPlanner.cs:222`). The inventory loop calls
#      `probe.ProbeFirstEmptyInventorySlot()` for every stack it places; with ZERO empty
#      slots the first call returns invalid, the loop breaks, the leftover units are
#      recorded as skipped and `anyInventoryPartial` is set
#      (`RouteDeliveryPlanner.cs:259-275`).
#      **THE SLOT PROBE IS THE BREAKER, AND THAT NEEDS SAYING BECAUSE IT IS NOT THE FIRST
#      GATE IN THAT LOOP.** `probe.ProbeInventoryUnitsThatFit(item, want)` runs BEFORE
#      `ProbeFirstEmptyInventorySlot` (`RouteDeliveryPlanner.cs:257`, one line ahead of
#      `:259`) and breaks on `admitted <= 0` first, so a lane whose fill exhausted the
#      VOLUME budget would refuse on a different reading of the same `isPartial` and this
#      spec's whole story would be about volume instead. It does not happen on this
#      fixture, and the arithmetic is off the part configs rather than the save
#      (`packedVolumeLimit` / `packedVolume` are part-config properties, absent from
#      `persistent.sfs`): the budget is VESSEL-SUMMED across both containers
#      (`LiveDeliveryCapacityProbe.TryReadContainerBudget`), so 2 x `ConformalStorageUnit`
#      `packedVolumeLimit = 60` gives 120, and the staged occupancy is 4 x evaChute at 10,
#      evaScienceKit quantity 2 at 5, DeployedCentralStation at 35 = 85. THIRTY-FIVE OF
#      HEADROOM, which covers every part kind this fixture's containers carry (chute 10,
#      kit 5, station 35) - and nothing is ever consumed, because the loop breaks at the
#      slot probe before `ConsumeInventoryCapacity` runs, so each manifest item meets the
#      full 35. So `admitted > 0` on every item and the SLOT count is the only thing that
#      can refuse, which is the lane's claim. Then:
#          `bool isPartial = anyResourcePartial || anyInventoryPartial;`
#      (`RouteDeliveryPlanner.cs:279`) - TRUE on the inventory half alone.
#   2. **THE FUEL DOES NOT DELIVER, AND THAT IS THE LANE'S CENTRAL CLAIM.**
#      `RouteDestinationCapacityCheck.HasCapacityForAllStops` does exactly this
#      (`RouteDestinationCapacityCheck.cs:108-122`):
#          `if (!plan.IsPartial) { ...reserve...; continue; }`
#          `fullToken = FirstShortToken(plan); fullStopIndex = i; return false;`
#      A partial plan is the FAILURE condition, not a reduced success, so the WHOLE cycle
#      refuses - the resource line that fits is refused along with the items that do not.
#      This is RVR-14's measured reading of the same two layers, arrived at from the other
#      population: there a fitting INVENTORY half was refused because the resource half
#      was short, here a fitting RESOURCE half is refused because the inventory half is.
#      **THE ASYMMETRY IS WALKED IN BOTH DIRECTIONS BY THE PAIR**, which is the reason to
#      author this lane rather than call it a duplicate of RVR-16.
#   3. `FirstShortToken` walks the plan's RESOURCE lines first and returns the first whose
#      `Available < Requested`; with 400 of headroom there is none, so it falls through to
#      the INVENTORY lines and names the first without an assigned slot
#      (`RouteDestinationCapacityCheck.cs:206-236`). The prefix is the one constant
#      `StoredPartTokenPrefix = "stored-part:"` (`:43`), so the token is
#      `stored-part:<partName>`.
#   4. `RouteDispatchEvaluator.cs:263-266` builds
#      `new EligibilityResult(EligibilityFailureKind.DestinationFull, fullResource, 0.0)` -
#      the shortfall is a HARD-CODED zero for this kind, so `shortfall=0` carries no
#      information here and is not pinned.
#   5. `ProcessLoopRoute` takes its blocked branch, which "emit[s] NOTHING (no debit, no
#      delivery...)" (`RouteOrchestrator.cs:944-967`, and the multi-stop twin at
#      `:1368-1397`). So there is no `Origin debit:`, no `Delivery write:` and no
#      `Inventory store:` anywhere in the run, and **A's LiquidFuel is still 0 when the
#      cycle ends** - unchanged, because the gate runs before any writer and
#      `PrepareDelivery` is pure (`LiveDeliveryCapacityProbe`'s `Consume*` methods mutate
#      only their own bookkeeping sets).
#
# -------------------------------------------------------------------------------------
# WHAT WAS A PREDICTION AND WHAT WAS NOT, KEPT VERBATIM SO THE CENSUS CAN BE READ AGAINST
# IT. **EVERY ITEM IN BOTH LISTS WAS CONFIRMED BY THE 2026-09-06 FLIGHT**; the two regexed
# ones are now literals and the reasons they could not be predicted stand as written.
#
# PREDICTED (from source; nothing below had been measured on this fixture when it was
# authored, and all five held):
#   * that the cycle BLOCKS rather than delivering the fuel and skipping the items;
#   * that the hold kind is `DestinationFull` and the detail carries the `stored-part:`
#     prefix rather than a bare resource name;
#   * that all three producers agree (the capacity check, `Route.RecordHold`'s persisted
#     verdict, and `ProcessLoopRoute`'s BLOCKED line);
#   * that the armed send-once is consumed into `blocked-then-paused`, the RVR-13 reading
#     of the same blocked-cycle shape on the same route;
#   * that nothing is debited or written.
#
# NOT PREDICTABLE, AND REGEXED FOR THAT REASON WHEN AUTHORED. The first two are now
# MEASURED LITERALS (`evaChute`, `stop=1`); the third stays regexed permanently.
#   * **WHICH PART THE TOKEN NAMES.** MEASURED `evaChute`. With zero free slots EVERY
#     inventory line is short,
#     so `FirstShortToken` returns the manifest's FIRST item - and RVR-16 established, by
#     flying it, that the manifest's order is NOT the window census's identity-hash order
#     (hash-ascending would have named the station; two flights put it last). RVR-15
#     measured this fixture's manifest as FOUR inventory units and never printed their
#     order. So the part name WAS `[A-Za-z]+` at all three producers, an alternation that
#     deliberately excluded `<unknown>`, `FirstShortToken`'s blank-name fallback, because a
#     manifest item that had lost its part name would be a different finding. The census
#     named `evaChute`, which is the SAME first item RVR-16 measured on the OTHER fixture,
#     and the literal now stands at all three producers - so a manifest reordering, or the
#     blank-name fallback, reds here instead of passing a class.
#   * `stop=`. MEASURED `stop=1`. Authored regexed for RVR-13's reason exactly: this route
#     has TWO stops and the mapping from the census ordering to `fullStopIndex` had never
#     been measured here (RVR-16 pins `stop=0` because its route has one stop). The census
#     settled it - rover A, the staged destination, is the capacity walk's index 1 - and
#     the value is a property of the FIXTURE's two-stop route rather than of the run, so it
#     is pinned exactly. A regression that walked the stops in the other order now reds.
#   * `cMin=` and the route id, which are per-run.
#
# -------------------------------------------------------------------------------------
# WHAT MAKES THE REFUSAL ATTRIBUTABLE - the RVR-13 set, plus one forbid that is this
# lane's own.
#   * GATE 6 IS PROVEN TO HAVE PASSED. The required `all 1 pickup source(s) cover -
#     eligible` line says the walk reached gate 8 with the origin satisfied, so the
#     `DestinationFull` reading cannot be some other gate wearing the name.
#     `BLOCKED kind=OriginLacksCargo` is forbidden to say the same negatively.
#   * THE RESOURCE HALF IS FORBIDDEN BY NAME. `BLOCKED kind=DestinationFull
#     reason=LiquidFuel` - RVR-13's and RVR-14's reading - must not appear. With 400 of
#     headroom against a 200 manifest it arithmetically cannot, so its presence would mean
#     the resource staging reached the wrong vessel or the wrong number.
#   * **THE FILL'S OWN FALSIFICATION, and it is the sharpest line in the file.** If the
#     `fill` silently did nothing, A would sit at 0 LiquidFuel with its three committed
#     free slots - which is RVR-15's staged state exactly, and RVR-15 MEASURED that state
#     delivering: `Delivery write: route=... dest=A pid=4280917262 resource=LiquidFuel
#     requested=200 written=200 tankBefore=0 tankAfter=200 capacity=400 path=unloaded`,
#     with `inventoryUnits=4/4 inventoryUnitsSkipped=0 partial=0`. That whole line is
#     FORBIDDEN here, character for character. A no-op fill therefore reds on a measured
#     line from a green lane rather than on an authored guess - which is what makes the
#     staging falsifiable rather than merely declared.
#   * NOTHING IS DEBITED. `Origin debit:`, `Inventory remove` and `Delivery write:` are
#     forbidden bare, RVR-13's claim on the same route: a cycle that took 154.4 units off
#     B and only then found nowhere to put them would destroy the player's fuel on every
#     blocked crossing.
#
# -------------------------------------------------------------------------------------
# WHAT THIS LANE DOES NOT CLAIM.
#   * It does not claim a NEW behaviour over RVR-16. That lane already drove the inventory
#     branch and produced the suite's first `stored-part:` token; this one drives the same
#     branch on the OTHER fixture, with the resource half at MAXIMUM room rather than
#     merely sufficient room, and with a MULTI-STOP route whose origin gate must pass
#     first. That is a second sample of one behaviour, not a second behaviour, so no
#     registry row is declared (see `[dimensionsCovered]`).
#   * It does not claim the resource staging is load-bearing for the BLOCK. It is not:
#     RVR-7 measured the unstaged 200/400 destination as an EXACT FIT that delivers, so
#     the resource walk would pass at 200 as well. The `LiquidFuel = 0` is what makes the
#     lane's claim the SHARP one - maximum resource headroom, zero slot headroom - and its
#     witness is the harness's own `liveState patched ... LiquidFuel 200->0` line plus the
#     forbidden RVR-15 delivery line above.
# =====================================================================================
description = "LIVE-PROVEN 2026-09-06: FIRST CENSUS 2026-09-06_2027, PASS attempt 1, wall 56 s, EVERY VERIFIER PASS and expectations mismatches=0 on the FIRST flight, on the clean automation DLL sha256 db525f5efe422d51 (main e4704e749). Authored 2026-09-06 with every token PREDICTED from source, and MISPREDICTION HISTORY: NONE - all five predicted claims held and the two that could not be predicted are now measured literals (evaChute, stop=1), leaving only cMin= and the per-run route id as classes. MEASURED: the whole cycle BLOCKED, the fuel did NOT deliver, and the produced save reads rover A at LiquidFuel 0/400 with six of six slots occupied while rover B is untouched at 200/400 - with no Delivery write:, Origin debit: or Inventory remove anywhere in 11,444 log lines. THE MATRIX'S LAST OPEN CELL, the one roadmap item 15 recorded as NOT EXPRESSIBLE FROM THESE BYTES: the destination has every unit of resource room it could have and not one free slot. RouteDestinationCapacityCheck is all-or-nothing over TWO populations and FirstShortToken walks RESOURCES before inventory, so on rover-relay-c-recorded the inventory half has never been observed - RVR-13 refuses at zero resource headroom and RVR-14 at 100 units, both naming LiquidFuel. This lane inverts both halves through ONE [[fixture.liveState]] entry on rover A: resources = { LiquidFuel = 0 } (RVR-15's staging, 400 of headroom against a 200 manifest) plus the new fill = { part = \"evaChute\", slots = 3 }, which clones A's OWN recorded evaChute STOREDPART into its three free slots (c0s1, c0s2, c1s2, pinned against the committed bytes in harness/lib) so six of six are occupied. THE FILL MODE IS WHAT ROADMAP ITEM 15 ASKED FOR: a placement rule stated where it is implemented - clone a STOREDPART already present in this save into every free slot, containers in file order and slots ascending, rewriting nothing but the clone's slotIndex and the nested PART's persistentId. The bytes are RECORDED; only the placement is autho