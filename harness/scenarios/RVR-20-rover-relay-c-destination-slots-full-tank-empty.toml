[fixture]
saveTemplate       = "fixtures/saves/rover-relay-c-recorded"
injectedRecordings = "none"
craft              = []

[[fixture.liveState]]
# Rover A, the DELIVERY DESTINATION, inverted on both axes at once.
#
# `LiquidFuel = 0` is RVR-15's declaration verbatim, and for the same reason: it is the
# most room this endpoint can have (400 of capacity against a 200 manifest), so the
# resource walk of `FirstShortToken` cannot be what refuses. The applier refuses an amount
# above `maxAmount` rather than clamping and refuses a vessel carrying more than one
# LiquidFuel RESOURCE node - A carries exactly one - so "0" means one unambiguous thing.
#
# `fill` clones A's OWN `evaChute` STOREDPART into its three free slots. The template tier
# that wins is the vessel's own container (`savepatch.find_stored_part_template` walks
# this vessel -> any other FLIGHTSTATE vessel -> any route window's snapshot), so the
# cloned bytes are the ones this craft already carries; only `slotIndex` and the nested
# PART's `persistentId` are authored. `slots = 3` is the per-container capacity, declared
# because the save does not record it and cross-checked by the applier against every
# occupied `slotIndex` - a wrong capacity is refused pre-boot, never worked around.
pid       = 4280917262
resources = { LiquidFuel = 0 }
fill      = { part = "evaChute", slots = 3 }

[driver]
# RVR-13's ELEVEN STEPS, ARGUMENT FOR ARGUMENT, including `TimeJump ut=1100` and the route
# name. That is the whole design of a matrix lane: the driver is the control and the
# `liveState` block is the variable. The prologue is the family's - the committed-tree
# restore path resumes a promotion-stub recording ~1 s into the scene, `StopRecording` is
# idempotent-OK, `DiscardTree` answers OK with nothing-discarded when no plain tree is
# live, and `verboseLogging = true` is REQUIRED because the two
# `DestinationHasCapacity` / `hold recorded` lines are Verbose.
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                    expect = "OK" },
  { cmd = "DiscardTree",                                                      expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SealSlot",     args = { tree = "88c012a6eed94bf09ff73397a4a31410" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "create", tree = "88c012a6eed94bf09ff73397a4a31410", name = "relay-c" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "send-once", route = "relay-c" },  expect = "OK", budget = 120 },
  { cmd = "TimeJump",     args = { ut = "1100" },                             expect = "OK", budget = 300 },
  { cmd = "SaveGame",                                                         expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# NO D10 VALUE IS CLAIMED, and it is a decision rather than an omission. The row this lane
# would earn is `destination-full-gate`'s INVENTORY direction, and RVR-16 already declared
# it as a second declarer alongside RVR-13 off a green census - the first `stored-part:`
# token any driven run produced. This lane drives the SAME branch of `FirstShortToken` and
# the same `ProbeFirstEmptyInventorySlot` claim on a different fixture, with a different
# resource headroom and a multi-stop route; that is a second SAMPLE of one behaviour.
# RVR-13's own row draws the line for exactly this case - it records that RVR-14 "measures
# the same branch at a second headroom value and does NOT re-declare" - and the D1
# `commit-in-foreign-soi` precedent requires a different code path, surface or measured
# behaviour before a value splits. None of the three differs here.
#
# `inventory-cargo` is RVR-15's and is untouched: that row names a complete driven PICKUP
# AND DELIVERY with `inventoryUnitsSkipped=[1-9]` and `partial=1` forbidden, and this lane
# delivers nothing at all.
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (the H7 lesson): a bare key after an `[expectations.<sub>]`
# header is TOML-scoped to that sub-table and never read. No tracer is armed by this spec,
# so the empty list is honest, and NO render-composition block is declared - declaring one
# would set `PARSEK_RENDER_MANIFEST=1`, and a confirmed dock crossing appends
# `route-dock-crossing` CLOCK-EVENTs to that manifest.
allowedAnomalies = []

[expectations.recordings]
# The matrix's anti-data-loss floor, exact on both bounds and RVR-13's / RVR-15's measured
# value over these bytes. The route this lane creates holds `SOURCE` references into the
# committed corpus, so a recording destroyed mid-run would flip the fresh route to
# `SourceChanged` and present as a route defect rather than as data loss. The liveState
# patch adds STOREDPART lines inside one FLIGHTSTATE vessel, which no recording count
# reads.
count = { min = 10, max = 10 }

[expectations.logContracts]
# THIRTEEN TOKENS. Each is a literal RUN taken from the emitting `string.Format` /
# interpolation in source, never a line pasted from a log. Two shapes to note:
# `ProcessLoopRoute`'s BLOCKED line continues past an EM DASH after `shortfall=`, so every
# token in this family stops at the reason; and both `DestinationHasCapacity` lines are
# `VerboseRateLimited`, so a lane must not require two occurrences of one.
#
# TOKENS 1-6 ARE RVR-13's PROLOGUE SET and are this lane's CONTROL: RVR-13, RVR-14 and
# RVR-15 all measured them green over the identical payload. If one reds, the run diverged
# from the matrix baseline somewhere OTHER than the staged endpoint, and that is the first
# thing to know.
#
# TOKENS 7-8  GATE 6 PASSING, at the pickup source. `resources=1 inventory=3` is B's own
#             committed cargo, measured by RVR-13 on these bytes and untouched by this
#             lane's staging. It is what makes token 9's refusal attributable to gate 8.
#
# TOKENS 9-11 GATE 8 REFUSING, at three producers - the check
#             (`LiveRouteRuntimeEnvironment.DestinationHasCapacity`), the persisted verdict
#             (`Route.RecordHold`) and the cycle's outcome (`ProcessLoopRoute`). A fix that
#             plumbed the token into one and not the others reds on exactly one line.
#             `stored-part:evaChute` WAS THE PREDICTION `stored-part:[A-Za-z]+` and IS NOW
#             MEASURED at all three: `FirstShortToken`'s inventory branch, which nothing
#             had ever reached on this fixture, named the manifest's first item. `stop=1`
#             is measured too. Only `cMin=` stays a class, and deliberately (see above).
#
# TOKENS 12-13 THE ARMED PAUSE, RVR-13's reading of the same blocked-cycle shape on the
#             same route: a blocked cycle consumes the one-shot arm and the route lands in
#             `blocked-then-paused`.
#
# NOT PINNED, DELIBERATELY: `shortfall=`, which `RouteDispatchEvaluator` hard-codes to
# `0.0` for this kind and which therefore carries no information; and any
# `status=DestinationFull` reading, which belongs to the dead self-timer path (a blocked
# loop route ends at `Paused` with `LastHoldKind` set).
required  = [
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "sealslot complete mode=tree tree=88c012a6eed94bf09ff73397a4a31410 total=8 sealed=0 remaining=0 alreadySealed=True",
  "routecommand create gate tree=88c012a6eed94bf09ff73397a4a31410 treeFound=True dismissed=False sealed=True eligible=True status=Eligible alreadyPromoted=False refusal=None",
  "routecommand complete action=create tree=88c012a6eed94bf09ff73397a4a31410 route=.* name='relay-c' status=Paused",
  "PauseAfterCurrentCycle=true \\(route will dispatch one cycle when conditions allow, then transition to Paused\\)",
  "PostWalk: routes=0",
  "PickupSourcesHaveCargo: route [0-9a-f]{8} source pid=90564594 name=B resources=1 inventory=3 decision=cover",
  "PickupSourcesHaveCargo: route [0-9a-f]{8} all 1 pickup source\\(s\\) cover - eligible",
  "DestinationHasCapacity: route [0-9a-f]{8} destination FULL stop=1 short=stored-part:evaChute",
  "Route [0-9a-f]{8} hold recorded kind=DestinationFull detail=stored-part:evaChute",
  "LoopRoute\\(multi\\): route [0-9a-f]{8} cycle=cycle-0 cMin=[0-9]+ BLOCKED kind=DestinationFull reason=stored-part:evaChute",
  "ArmedPause: route [0-9a-f]{8} cycle=cycle-0 BLOCKED cycle consumed the armed pause",
  "reason=blocked-then-paused",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "routecommand rejected",
  "dispatch fired",
  # THE NO-DEBIT CLAIM, RVR-13's on the same route: the gate runs before any writer, so a
  # debit here would mean the cycle took B's fuel and only then discovered it had nowhere
  # to put it.
  "Origin debit:",
  "Inventory remove",
  "Delivery write:",
  # THE FILL'S OWN FALSIFICATION, and the reason it is spelled out rather than left to the
  # bare `Delivery write:` above: this is RVR-15's MEASURED line, character for character,
  # on the state a no-op fill would leave behind (A at 0 LiquidFuel with its three
  # committed free slots - RVR-15's staging exactly, which RVR-15 measured DELIVERING).
  # A fill that silently did nothing therefore reds on a green lane's measurement.
  "Delivery write: route=.* dest=A pid=4280917262 resource=LiquidFuel requested=200 written=200 tankBefore=0 tankAfter=200 capacity=400 path=unloaded",
  "inventoryUnitsSkipped=0 partial=0",
  # THE RESOURCE HALF MUST NOT BE THE REFUSER. With 400 of headroom against a 200 manifest
  # it arithmetically cannot be, so this line appearing would mean the resource staging
  # reached the wrong vessel or the wrong number.
  "BLOCKED kind=DestinationFull reason=LiquidFuel",
  # And it must not be the ORIGIN gate that failed - B is stocked exactly as the fixture
  # leaves it, so an OriginLacksCargo reading would mean the patch reached the wrong
  # vessel entirely.
  "BLOCKED kind=OriginLacksCargo",
]

[expectations.recordings.structure]
# REPORT-ONLY (no `gating` key) and identical to RVR-13's: the committed fixture's own
# structure re-read through `harness/lib/saveparse.py`. Nothing in this lane's driver
# creates or destroys a recording, and the liveState patch touches one FLIGHTSTATE vessel,
# so the produced save should read the matrix's numbers. MEASURED 2026-09-06: it does -
# `trees=3 committedTrees=3 recordings=10 terminalStates={Landed:5,Docked:2}
# branchPoints={Dock:2,Undock:2}`, every window as declared.
trees          = { min = 3, max = 3 }
committedTrees = { min = 3, max = 3 }
recordings     = { min = 10, max = 12 }
terminalStates = { Landed = { min = 5 }, Docked = { min = 2 } }
branchPoints   = { Dock = { min = 2, max = 2 }, Undock = { min = 2, max = 2 } }

[expectations.routes]
# REPORT-ONLY. Authored as a DERIVATION from RVR-13's armed-baseline shape; the
# 2026-09-06 census then read EVERY window exactly as declared - `count=1 dormant=0
# stops=2 sourceRefs=3 completedCycles=0 skippedCycles=1 statuses={Paused:1}`, plus
# `holdKinds={DestinationFull:1}` and `connectionKinds={DockingPort:2}` which this block
# does not declare. So a blocked cycle does skip rather than complete, and
# `blocked-then-paused` does leave the route `Paused`, on measured bytes.
#
# **STILL NOT ARMED, AND THAT IS DELIBERATE.** Arming is an operator decision taken after
# TWO agreeing report-only reading runs; this is ONE. Whoever arms it adds the
# `ARMED_ALLOWLIST` entry in the same commit.
count           = { min = 1, max = 1 }
dormant         = { min = 0, max = 0 }
stops           = { min = 2, max = 2 }
sourceRefs      = { min = 3, max = 3 }
completedCycles = { min = 0, max = 0 }
skippedCycles   = { min = 1, max = 1 }
statuses        = { Paused = { min = 1, max = 1 } }

[runtime]
# RVR-13's budget arithmetic, unchanged: `run.py` gives every deferred seam verb
# `required_step_wait(max(step budget, SEAM_FALLBACK_DEFERRAL_SECONDS=600))` = 660 s
# regardless of the declared step budget, and LoadGame plus the TimeJump are deferred.
budgetSeconds = 2400

[retry]
