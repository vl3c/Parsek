[expectations]
# EMPTY ON PURPOSE: NEVER FLOWN. The S1.4 rule is that a token is re-added WITH the flight
# that shows it; pre-tolerating an anomaly on a first flight destroys the count it fires
# at. This lane takes no TimeJump, so it does not carry the post-jump `icon-off-orbit`
# exposure the V14T/V15T/V16T family measured, but it DOES open the map on a scene holding
# 20 vessels and several ghosts, which is an unmeasured `line-blink` / `icon-jump` surface.
# The reading run is what settles it.
allowedAnomalies = []

[expectations.recordings]
# Same bracket and same argument as B32: the fixture ships 45, the step triple kills ONE
# promotion stub and is not a latch (so 46 is admissible), the ceiling is headroom for a
# load-time optimizer that has never been run against these bytes (two Dock, two Undock,
# twenty JointBreak branch points and a VesselSwitchContinuation give both `SplitAtUT` and
# `CanAutoMerge` candidate populations), and the FLOOR of 43 is margin for the unknown
# rather than a prediction. A reading below 45 is to be INVESTIGATED, not window-widened:
# a merge landing on any of the four Duna-route SOURCE recordings flips the route to
# `SourceChanged`, which is the one failure mode that makes this lane green and empty.
count = { min = 43, max = 60 }

[expectations.logContracts]
# THE ANTI-VACUITY FLOOR, and nothing beyond it (section 4).
#   the two `Route scope:` lines - both committed routes classified InterBody off their
#     own endpoints. `basis=Endpoints` is pinned as well as the scope: `basis=MemberBodies`
#     would mean the endpoint bodies were unreadable and the shipped v1 fallback answered,
#     a different reading of the same verdict.
#   "Route line build: route=[0-9a-f]{8} members=" - the overview line set was built. Every
#     count after `members=` is unpinned; `transferDropped` in particular is THE
#     measurement (section 1) and requiring a value either way would pre-register it.
#   "Route line draw: enabled=True routesDrawn=[1-9]" - BUILT is not DRAWN, and this lane
#     is about the draw.
#   "RevalidateSources reason=.* routes=2 transitioned=0" - both committed routes survived
#     the load and neither flipped status under the load-time optimizer.
#   the loadgame completion line and the two map-view echoes - the precondition of
#     section 2 stated as tokens. The `already=false` halves are load-bearing: they say
#     the verb DID something rather than answering OK against a map that was already in
#     that state.
required  = [
  "Route scope: route=[0-9a-f]{8} origin=Kerbin destination=Duna scope=InterBody basis=Endpoints",
  "Route scope: route=[0-9a-f]{8} origin=Kerbin destination=Mun scope=InterBody basis=Endpoints",
  "Route line build: route=[0-9a-f]{8} members=4 groups=3 legs=3 transferDropped=0",
  "Route line draw: enabled=True routesDrawn=2 legsDrawn=6 skippedOwned=0 malformed=0 other=0",
  "RevalidateSources reason=.* routes=2 transitioned=0",
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "entermapview ok mapOpen=true already=false",
  "exitmapview ok mapOpen=false already=false",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE CARRIED CONTROL, and the two halves are NOT the same kind of claim.
  # `malformed=[1-9]` is literally what this subject emitted on every drawn frame before the
  # 2026-09-02 scope fix. `scope=MalformedMixedBodies` could NOT have been emitted then -
  # the `Route scope:` line is new in the same change - so it restates the claim on the new
  # line, catching a regression that keeps the line and flips the verdict.
  "Route line draw: .* malformed=[1-9]",
  "scope=MalformedMixedBodies",
  # `other` is `NoBackingRecordings` (zero drawable groups) - a different way for the lane
  # to be green and empty. H59 carries the same pair for the same reason.
  "Route line draw: .* other=[1-9]",
]

[expectations.renderComposition]
# M-A7 Phase 4 - DECLARED BARE 2026-09-02: NO `gating`, NO window, NO list, DELIBERATELY.
#
# Declaring is what sets `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder at
# Awake, and `rendercompose` then records its facets UNCONDITIONALLY on a parseable
# manifest - which is how a lane earns its first honest window off a green report-only
# run. A window written today would be a PREDICTION read back as though it were a
# measurement, the mistake V14M, V8 and V6M all shipped bare through their reading runs to
# avoid.
#
# AND THE PREDICTION WOULD BE UNUSUALLY UNSAFE HERE, which is why this block says so
# rather than copying V18T's armed shape:
#   `routeLineBuilds` - V18T measured 1 on a ONE-route subject. This one carries TWO
#     routes, so the honest expectation is 2, but `DrawAll` builds once per route per
#     signature change and the observation instant is not pinned to a frame count. A
#     `{min = 2}` written today asserts an arithmetic nobody has run.
#   `unevaluable` - V18T's ceiling of 10 was scaled to a TS census with no closed dwell
#     and no endpoint decimation. This lane observes IN FLIGHT with 20 vessels loaded and
#     a 40-tick dwell, which is a different regime entirely; the sibling ratio-to-
#     measurement convention (~3.4x) needs a measurement first.
#   `dwells` / `cycles` - no loop is armed on this subject and no route has ever run a
#     cycle (`completedCycles = 0`, `loopAnchorUT = -1` on the Duna route), so both plausibly
#     measure 0 and a floor would red the run it was armed from. V18T's block says the same
#     thing about its own TS observation.
#   `requireSeamKinds` - `flexible-soi` is the interesting one on an inter-body subject and
#     is exactly what has never been observed here. Requiring it would be requiring an
#     unverified emitter.
#
# WHAT THE READING RUN OWES BACK, so the arming pass is mechanical rather than a fresh
# argument: `routeLineBuilds`, `routeCoDrawViolations`, `ownershipChanges`, the
# `unevaluable` reason census, the seam-kind census, and - the headline - the per-unit
# `ROUTE` node's `scope` and `transferLegsDropped` for route 71a983a1. Two readings that
# match facet for facet, then a window, then an armed re-flight, then a negative control.
#
# OBSERVED, RUN 1 (report-only, recorded not armed): `routeLineBuilds=2`,
# `routeCoDrawViolations=0`, `seamKinds={flexible-soi: 2, rigid: 15}` - the
# FIRST `flexible-soi` seam any route lane has measured, which is the inter-body
# subject showing up in the seam census exactly where it should - two INFO
# `RC-QUAL` raises, `unevaluable=1064` (`decimated-section-seam_endpoint` 748,
# `seam-endpoint-skipped` 309, remainder minor), and a per-unit `ROUTE` node
# reading `scope=InterBody dispatchWindowPeriod=0` - the first `InterBody` scope
# any manifest has ever carried, beside the stored period the fix demoted. BOTH
# `ROUTE_LINE_BUILD` records read `transferLegsDropped=0`, which is outcome B
# (see the re-pin block at the top of this file).
#
# STILL BARE, DELIBERATELY. `unevaluable=1064` against V18T's ceiling of 10 is
# the clearest possible argument for not copying a sibling's window: this is a
# FLIGHT scene with 20 vessels and a 40-tick map-open dwell, a different regime
# entirely, and the number needs a SECOND matching reading before it becomes a
# ceiling. Arming candidates for that pass: `routeLineBuilds = { min = 2 }`,
# `routeCoDrawViolations = { max = 0 }`,
# `requireSeamKinds = [rigid, flexible-soi]`.

[expectations.routes]
# M-C2 save-parse, DECLARED REPORT-ONLY: `gating` IS DELIBERATELY OMITTED. NEVER FLOWN,
# and arming is a per-scenario operator decision taken only after a report-only reading
# run whose facets match the declared windows (`ARMED_ALLOWLIST` /
# `test_no_committed_spec_arms_gating`). The windows are read offline out of the fixture's
# own persistent.sfs through `saveparse.observed_routes_facets` - not predicted - but what
# a RUN leaves behind is a different measurement, which is what a reading run is for.
#
# `originBodies` and `destinationBodies` naming DIFFERENT bodies is the inter-body claim
# expressed in the save-structure vocabulary: that pair is what `ClassifyRouteScope`
# reads, and
# `RouteFacetFixtureAgreementTests.test_the_interbody_fixture_is_the_corpus_only_cross_body_route`
# pins that this is the only committed fixture where they differ.
count = { min = 2, max = 2 }
dormant = { max = 0 }
stops = { min = 2, max = 2 }
sourceRefs = { min = 8, max = 8 }
completedCycles = { max = 0 }
skippedCycles = { max = 0 }
statuses = { Active = { min = 1, max = 1 }, Paused = { min = 1, max = 1 } }
connectionKinds = { DockingPort = { min = 2, max = 2 } }
originBodies = { Kerbin = { min = 2, max = 2 } }
destinationBodies = { Duna = { min = 1, max = 1 }, Mun = { min = 1, max = 1 } }

[runtime]
# 300 LoadGame + 120 EnterMapView + 120 export + 120 ExitMapView + the fast non-deferred
# verbs + KSP boot + collect. No TimeJump, so no game time is bought; the 40-tick dwell
# adds seconds. The budget is the family's standard rather than a tight fit.
budgetSeconds = 2400

[retry]
# One retry absorbs the V5 promotion-recorder re-arm race (which this fixture's
# committed-tree-for-the-active-craft shape makes likelier than most) and ordinary seam
# flakes. It does not absorb a missing token or an unparseable manifest: both reproduce
# exactly on attempt 2.
policy = "once"

[expectedFail]
bugId = ""
