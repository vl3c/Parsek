#   per-leg arbitration and the mesh-membership contract directly; run 3 exercised it only
#   headlessly. The OWNERSHIP arm's live proof is H59, which read `skippedOwned=1 ownedLegs=1
#   paintedLegs=0` on nine of its thirteen draw frames in this same set.
# WHY THE COUNT PINS GO LITERAL ANYWAY: they are BUILD-side, and the build is independent of
# which ghosts happen to be alive - it walked the same members, expanded the same runs and
