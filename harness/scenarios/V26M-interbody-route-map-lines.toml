#   population, not about the fix. Filed as V26M-GHOST-SPAWN-IN-MAP-WINDOW-IS-EPOCH-DEPENDENT.
#   CONSEQUENCE FOR THE EVIDENCE, stated plainly rather than papered over: the paint arm's LIVE
#   proof on this package is reading run 2's diagnosis (where it fired, and fired WRONG twice -
