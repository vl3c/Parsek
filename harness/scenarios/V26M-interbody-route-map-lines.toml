[expectations.renderComposition]
# M-A7 Phase 4 - DECLARED BARE 2026-09-02, ARMED 2026-09-07 on two windows (at the
# bottom of this block). The bare-declaration reasoning is KEPT VERBATIM below because
# it is what the arming had to discharge, and because three of its five "do not predict
# this" paragraphs still stand and are still the reason those keys are absent.
#
# Declaring is what sets `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder at
# Awake, and `rendercompose` then records its facets UNCONDITIONALLY on a parseable
# manifest - which is how a lane earns its first honest window off a green report-only
# run. A window written today would be a PREDICTION read back as though it were a
# measurement, the mistake V14M, V8 and V6M all shipped bare through their reading runs to
# avoid.
#
# AND THE PREDICTION WOULD BE UNUSUALLY UNSAFE HERE, which is why this block says so
# rather than copying V18T's armed shape:
#   `routeLineBuilds` - V18T measured 1 on a ONE-route subject. This one carries TWO
#     routes, so the honest expectation is 2, but `DrawAll` builds once per route per
#     signature change and the observation instant is not pinned to a frame count. A
#     `{min = 2}` written today asserts an arithmetic nobody has run.
#   `unevaluable` - V18T's ceiling of 10 was scaled to a TS census with no closed dwell
#     and no endpoint decimation. This lane observes IN FLIGHT with 20 vessels loaded and
#     a 40-tick dwell, which is a different regime entirely; the sibling ratio-to-
#     measurement convention (~3.4x) needs a measurement first.
#   `dwells` / `cycles` - no loop is armed on this subject and no route has ever run a
#     cycle (`completedCycles = 0`, `loopAnchorUT = -1` on the Duna route), so both plausibly
#     measure 0 and a floor would red the run it was armed from. V18T's block says the same
#     thing about its own TS observation.
#   `requireSeamKinds` - `flexible-soi` is the interesting one on an inter-body subject and
#     is exactly what has never been observed here. Requiring it would be requiring an
#     unverified emitter.
#
# WHAT THE READING RUN OWES BACK, so the arming pass is mechanical rather than a fresh
# argument: `routeLineBuilds`, `routeCoDrawViolations`, `ownershipChanges`, the
# `unevaluable` reason census, the seam-kind census, and - the headline - the per-unit
# `ROUTE` node's `scope` and `transferLegsDropped` for route 71a983a1. Two readings that
# match facet for facet, then a window, then an armed re-flight, then a negative control.
#
# OBSERVED, RUN 1 (report-only, recorded not armed): `routeLineBuilds=2`,
# `routeCoDrawViolations=0`, `seamKinds={flexible-soi: 2, rigid: 15}` - the
# FIRST `flexible-soi` seam any route lane has measured, which is the inter-body
# subject showing up in the seam census exactly where it should - two INFO
# `RC-QUAL` raises, `unevaluable=1064` (`decimated-section-seam_endpoint` 748,
# `seam-endpoint-skipped` 309, remainder minor), and a per-unit `ROUTE` node
# reading `scope=InterBody dispatchWindowPeriod=0` - the first `InterBody` scope
# any manifest has ever carried, beside the stored period the fix demoted. BOTH
# `ROUTE_LINE_BUILD` records read `transferLegsDropped=0`, which is outcome B
# (see the re-pin block at the top of this file).
#
# OBSERVED, RUN 3 (`2026-09-06_2113`, report-only): `routeLineBuilds=2`,
# `routeCoDrawViolations=0`, `routeLegDefers=0`, `ownershipChanges=0`,
# `seamKinds={flexible-soi: 2, rigid: 15}`, two INFO `RC-QUAL` raises and nothing
# at WARN or FAIL, `unevaluable=1065` (`decimated-section-seam_endpoint` 750,
# `seam-endpoint-skipped` 309, six minor). Run 1 read 1064 at the same shape.
#
# ARMED 2026-09-07, ON EXACTLY TWO WINDOWS, and the restraint is the point.
#   `routeLineBuilds = { min = 2 }` - the anti-vacuity floor, and it is now an
#     ARITHMETIC THAT HAS BEEN RUN rather than the one the bare block refused to
#     assert: two committed routes, two builds, on three readings. It is what says
#     the route-line pass RAN at all; without it every other window here is
#     satisfiable by a manifest from a lane that never opened the map.
#   `routeCoDrawViolations = { max = 0 }` - the arbitration's own instrument, and
#     the reason this package exists: run 1 read 1024 (the cap), run 2 read 403,
#     run 3 reads 0. IT GATES ONLY WHEN A GHOST PAINTS, and that is stated rather
#     than assumed: the probe records a violation only where the route line
#     actually DREW a leg while a ghost mesh of the same recording was live across
#     that leg's span, so on a run with no ghost in the map window (which is what
#     run 3 was - `spawned=0`; see the re-pin block above and the lane todo
#     V26M-GHOST-SPAWN-IN-MAP-WINDOW-IS-EPOCH-DEPENDENT) the window is trivially
#     satisfied. It is armed anyway because it costs nothing on such a run and is
#     the ONLY mechanical catch on the epoch where a ghost IS present.
# NOT ARMED, each for its own measured reason:
#   `unevaluable` - NO CEILING, deliberately. 1065 here against V18T's 10 is the
#     clearest argument against copying a sibling's window: this is a FLIGHT scene
#     with 20 vessels and a 40-tick map-open dwell, and 750 of the 1065 are
#     DECIMATION of the seam-endpoint section, i.e. a number that tracks how many
#     endpoint records the run produced and how the census thinned them. A ceiling
#     over it would red on session length, not on composition, and a ceiling loose
#     enough not to would assert nothing.
#   `dwells` / `cycles` - no loop is armed on this subject and no route has run a
#     cycle, so both read 0 and any floor would red the runs it was armed from.
#   `ownershipChanges` - measured 0 three times and correctly so (no TracedPath
#     ownership on this subject); `{max = 0}` would assert the absence of a
#     surface this lane does not exercise.
#   `requireSeamKinds` - `flexible-soi` has now been measured twice at 2, but the
#     seam census is a property of which recordings the ghost pass walked, which
#     run 3 showed is epoch-dependent here. It stays out until a reading measures
#     it on a ghost-free epoch too.
gating = true
routeLineBuilds = { min = 2 }
routeCoDrawViolations = { max = 0 }

