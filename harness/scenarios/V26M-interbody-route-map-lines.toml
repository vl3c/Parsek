#     frames 7272+ (suppressed=118)
# TWO DEFECTS IN THAT READING, BOTH FIXED IN THE SAME BRANCH, and they are why the pins are STILL
# interim. (1) The violations start FIFTY frames AFTER the last stand-down frame: the paint set
# was frame-stamped, the ghost's draw pass early-returns whenever its -50 decide walk did not run,
