[dimensionsCovered]
# Same basis as B32 - identical gated tokens on the same surface.
# `route-transfer-leg-drop` ADDED 2026-09-07 (package P16), CLAIMED CONDITIONAL ON THE
# ARMED RE-FLIGHT (the H59 precedent): the drop is gated here by the required literal
# `Route line build: route=71a983a1 ... transferDropped=2` against the same-subject control
# `8f644e71 ... transferDropped=0`, and the demonstration owed is the armed run plus
# `B32X-legdrop-negative-control`. The registry entry carries the distinctness argument.
# STILL DELIBERATELY NOT CLAIMED: any renderComposition-specific cell. This lane's block
# IS armed as of the same commit (`routeLineBuilds`, `routeCoDrawViolations`), but D10 has
# no manifest-facet value and inventing one to mark the arming would be a claim about an
# instrument rather than about a behaviour - which is what H35 CLAIM-IS-NOT-GATE refuses.
D10 = ["route-map-lines-inter-body", "route-transfer-leg-drop"]
D14 = ["kerbin", "duna", "scene-map", "sandbox"]

[expectations]
# EMPTY, AND THAT IS NOW A MEASUREMENT RATHER THAN A POSTURE: two runs took the
# sweep fully armed and neither raised a single anomaly, so there is nothing to
# tolerate. The S1.4 rule is that a token is re-added WITH the flight that shows
# it, and no flight has shown one.
# It opens the map on a scene holding 20 vessels and several ghosts - the
# `line-blink` / `icon-jump` surface that was unmeasured at authoring time - and the two
# runs settled it clean.
allowedAnomalies = []

[expectations.recordings]
# Same bracket and same argument as B32: the fixture ships 45, the step triple kills ONE
# promotion stub and is not a latch (so 46 is admissible), the ceiling is headroom for a
# load-time optimizer that has never been run against these bytes (two Dock, two Undock,
# twenty JointBreak branch points and a VesselSwitchContinuation give both `SplitAtUT` and
# `CanAutoMerge` candidate populations), and the FLOOR of 43 is margin for the unknown
# rather than a prediction. A reading below 45 is to be INVESTIGATED, not window-widened:
# a merge landing on any of the four Duna-route SOURCE recordings flips the route to
# `SourceChanged`, which is the one failure mode that makes this lane green and empty.
