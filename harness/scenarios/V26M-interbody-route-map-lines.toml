schema = 1
id = "V26M-interbody-route-map-lines"
# =====================================================================================
# 0. WHAT THIS LANE IS, IN ONE SENTENCE
#
# The RENDER-COMPOSITION half of G10: drive the flight-map OPEN/CLOSE pair over the
# `interbody-route-recorded` harvest and take a manifest CENSUS of what an INTER-BODY
# route's overview line actually composed - the first non-SameBody reading of the M-A7
# route surfaces anywhere in the suite.
#
# B32 is the LOG reading of the same subject and asks a different question ("what did the
# classifier decide, and on what authority"). This lane asks "what did the renderer
# BUILD", which only the manifest can answer, and it is the reason the
# `[expectations.renderComposition]` block is here and not there.
#
# =====================================================================================
# 1. THE CENSUS THIS LANE IS FOR, AND THE TWO OUTCOMES IT IS PREPARED TO READ
#
# `RC-ROUTE`'s per-unit half and the `ROUTE_LINE_BUILD` record carry a
# `transferLegsDropped` count. On V18T's SameBody subject that count is ZERO BY SCOPE -
# `FilterLegsToEndpointBodies` does not run at all for a same-body route - so the ratified
# transfer-leg DROP has never been evaluated against non-vacuous data. On THIS subject the
# filter runs (that is half the 2026-09-02 product fix). BOTH of the following are
# READINGS, not failures, and the lane is authored to survive either:
#
#   OUTCOME A - transferDropped >= 1. The recorded members carry a non-orbital leg in a
#   THIRD body frame (the Sun-frame mid-course stretch of the Kerbin -> Duna coast), the
#   leg-derived `ResolveEndpointBodies` resolves origin Kerbin != destination Duna, and
#   the filter drops it. This is the shape the M6 follow-up was built for and the one the
#   G10 entry predicts. It would be the FIRST non-zero `transferLegsDropped` in the suite.
#
#   OUTCOME B - transferDropped = 0, for either of two honest reasons. (i) The recorded
#   members carry no non-orbital leg outside the two endpoint bodies: the transfer member
#   (`5ca48c99...`, `Duna Supply 1 Probe`, which carries NO startBodyName) may be entirely
#   ORBITAL, and `GhostTrajectoryPolylineRenderer.BuildLegsForRecording` emits polyline
#   legs only for non-orbital stretches - a heliocentric coast recorded as `OrbitSegment`s
#   produces no leg to drop. (ii) The ROUND-TRIP STAND-DOWN fires: if the clipped legs
#   resolve earliest-body == latest-body, `FilterLegsToEndpointBodies` returns 0 rather
#   than dropping the entire far-body arc (a documented, deliberate lesser error).
#
# Which one this subject produces IS THE MEASUREMENT. Pre-registering a window either way
# would be a prediction read back as though it were a measurement - the mistake V14M, V8
# and V6M all shipped bare through their reading runs to avoid - so
# `[expectations.renderComposition]` is DECLARED BARE below and NOTHING about the drop is
# required or forbidden in `logContracts` either.
#
# =====================================================================================
# 2. WHY THE MAP-OPEN PAIR, AND WHY IT IS THIS LANE'S AND NOT B32's
#
# The G10 roadmap entry says V26M "owes the map-open pair since it asserts ghost polyline
# facets". `RouteTrajectoryLineRenderer.DrawAll`'s only call site is the polyline Driver's
# map-camera `onPreCull` hook, guarded by `cam == PlanetariumCamera.Camera` and
# `scene in {TRACKSTATION, FLIGHT}` (`GhostTrajectoryPolylineRenderer.cs:3942-3952`), and
# in FLIGHT that camera renders only while the map is open. So the pair is not
# scene-setting: OPEN is what makes the composition happen, and CLOSE is what makes the
# lane a PAIR rather than a one-way trip - the deactivation sweep, the cache lifetime and
# the ownership publish/retract all have a closing half, and a lane that never closes the
# map cannot say it observed one.
#
# THE EXPORT IS TAKEN AFTER THE CLOSE, and the placement is PINNED rather than chosen:
# `test_every_declarer_exports_immediately_before_teardown` requires the export verb to be
# the step immediately before `FlushAndQuit`, which puts `ExitMapView` ahead of it. That
# costs this lane nothing, and the reason is worth stating because it is the exact
# distinction the per-scene clobber entry turns on: `RenderCompositionRecorder` resets on
# a SCENE SWITCH (`OnGameSceneSwitchRequested` -> auto-flush + `Reset()`), NOT on a map
# toggle, so closing the map ends the observation without discarding it and the file
# written afterwards still carries every record the open window accumulated. What the
# close DOES change is the instant: the deactivation sweep has run by then, so any facet
# that reads a LIVE line count rather than an accumulated event count reads the closed
# state. Every facet this lane names (`routeLineBuilds`, `routeCoDrawViolations`,
# `ownershipChanges`, the seam and unevaluable censuses) is an accumulated count, so this
# is a statement about what the reading means rather than a caveat on it.
#
# THIS LANE STAYS IN ONE SCENE ON PURPOSE. `RENDER-MANIFEST-VERB-EXPORT-IN-A-SECOND-SCENE-CLOBBERS-THE-FIRST-SCENE-ACCUMULATION`
# (todo, measured by H59's `2026-09-02_0947` census): the recorder accumulates PER SCENE
# and the export verb writes unconditionally, so a lane that observes in FLIGHT and then
# exports from SPACECENTER reads zeroes for everything FLIGHT measured. H59 is exactly
# that shape and its manifest reported `routeLineBuilds=0` off a run whose KSP.log carried
# a real route build. This lane has no second scene, so the trap cannot fire; V26T is the
# TS observation and takes its own export in TS.
#
# =====================================================================================
# 3. THE SUBJECT
#
# `interbody-route-recorded` - the 2026-09-02 harvest of the operator's own hand-played
# `orbital supply route` campaign. TWO committed routes, BOTH inter-body under the
# endpoint scope rule and both still carrying `dispatchWindowPeriod = 0`:
#
#   71a983a1  Route: KSC -> Duna   Active   Kerbin -> Duna, DockingPort,
#             recordedDockUT 72353218.8197432, 4 members, completedCycles 0
#   8f644e71  Route: KSC -> Mun    Paused   Kerbin -> Mun,  DockingPort
#
# So the census counts TWO route line builds where V18T's counts one, and the manifest's
# per-unit `ROUTE` node can carry `scope = InterBody` for the first time.
#
# =====================================================================================
# 4. WHAT IS REQUIRED, AND WHY THE LIST IS SHORT
#
# CLAIM-IS-NOT-GATE, and on a reading run the list is short for that reason. The tokens
# below are the ANTI-VACUITY floor - the map pass ran, both routes were classified
# InterBody, both were built, at least one was drawn - and nothing else. Every count in
# the build line is left unpinned (never flown), route ids are classed `[0-9a-f]{8}`
# rather than pinned as literals (the H59 `2026-09-02_1017` arming defect), and the two
# skip-counter FORBIDS carry the pre-fix reading as a control the lane brings with it.
#
# DELIBERATELY NOT REQUIRED: `transferDropped=` in either direction (section 1), any
# cadence / dispatch / anchor token (no TimeJump is taken - see B32 section 4 for the
# arithmetic), `Polyline frame:` (whether the GHOST polyline draws anything on this
# subject is a separate unmeasured question, and requiring an unverified emitter is
# V22K's stated trap), and every probe/lens summary - those are re-pinned from what this
# run reads.
#
# NO `[dimensionsCovered]` CLAIM. Nothing is armed, so nothing is earned. D10 has no
# `inter-body-scope` value today; the registry growth rule puts it in the PR that first
# gates on it.
#
# ================= RE-PINNED 2026-09-02 OFF READING RUN 1 =================
# The lane FLEW on the pre-F1 build and every route reading came back IDENTICAL
# across B32, V26M and V26T, so the counts below are MEASURED and no longer
# classes. What run 1 read, verbatim and the same in all three:
#
#   Route scope: route=8f644e71 origin=Kerbin destination=Mun  scope=InterBody basis=Endpoints
#   Route scope: route=71a983a1 origin=Kerbin destination=Duna scope=InterBody basis=Endpoints
#   Route line build: route=8f644e71 members=4 groups=3 legs=3 transferDropped=0
#   Route line build: route=71a983a1 members=4 groups=3 legs=3 transferDropped=0
#   Route line draw: enabled=True routesDrawn=2 legsDrawn=6 skippedOwned=0
#                    malformed=0 other=0 deact=0 cache=2
#
# THE HEADLINE IS `transferDropped=0`, and it is OUTCOME B of the two this
# package pre-registered rather than a disappointment: the endpoint-leg filter
# RUNS now (that was half the product fix) and finds nothing to drop, because
# `groups=3` out of `members=4` already says one member contributed no drawable
# leg at all - the transfer member `5ca48c99` carries no `startBodyName` and its
# heliocentric coast is recorded as OrbitSegments, which `BuildLegsForRecording`
# never emits as a polyline leg. There is no third-body leg to drop. The
# ratified transfer GAP is therefore real on this subject and visible as an
# absence, which is a weaker reading than a measured drop and is recorded as such
# rather than dressed up: G10's "FilterLegsToEndpointBodies has never dropped a
# leg on a driven run" is STILL TRUE after this lane, and closing it needs a
# subject whose transfer stretch was recorded in the physics frame.
#
# `legsDrawn=6` = two routes x three groups x one leg each, and `routesDrawn=2`
# with `malformed=0 other=0` is the whole pre-fix failure inverted in one line.
#
# THE RUNS DID NOT REACH THESE PINS. All three classified
# `PARSEK-FAIL subkind=analyzer` on `INV2-NO-DOUBLE-COVER` over the fixture's own
# recorded sections, which short-circuits every expectation behind it - so the
# readings above come from the KSP.log, not from a green verifier chain. The
# fixture has since been repaired at build time (twelve contained sections
# dropped across four recordings, coverage invariant, `RED=0` after; see
# INTERBODY-SAVE-CARRIES-INV2-DOUBLE-COVER), so run 2 is expected to reach them.
# ==========================================================================#
# TRACER LEAK AT TEARDOWN, OBSERVED ON ALL THREE RUNS and recorded here so the
# next reader does not re-diagnose it: the run tail prints
# `cleared leaked: ghostRenderTracing,mapRenderTracing`. Those are the two
# tracers this lane arms ON PURPOSE through `SetSetting`, and the harness's
# settings-sidecar teardown clears anything left non-default. It is the teardown
# doing its job, not this lane leaking - a spec that arms a tracer and does not
# disarm it is the normal shape (V18T, V14M and H59 all do the same) - and the
# line is expected on every future run of these three.
#
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-09-02, NEVER FLOWN. THE RENDER-COMPOSITION HALF OF G10 and the first non-SameBody reading of the M-A7 route surfaces: drive the flight-map OPEN/CLOSE pair over the `interbody-route-recorded` harvest and take a manifest CENSUS of what an INTER-BODY route's overview line composed. B32 is the LOG reading of the same subject (what the classifier decided, and on what authority); this lane asks what the RENDERER BUILT, which only the manifest answers. THE HEADLINE UNKNOWN IS `transferLegsDropped`, and the spec is authored to survive BOTH readings rather than predicting one: OUTCOME A is a non-zero drop - the recorded members carry a Sun-frame non-orbital leg, `ResolveEndpointBodies` resolves Kerbin != Duna, and `FilterLegsToEndpointBodies` (which now RUNS, that being half the 2026-09-02 product fix) drops it, the suite's first non-zero reading of that census; OUTCOME B is zero, honestly, because the transfer member `5ca48c99` carries no startBodyName and may be entirely ORBITAL - a heliocentric coast recorded as OrbitSegments emits no polyline leg to drop - or because the documented ROUND-TRIP STAND-DOWN fires when the clipped legs resolve earliest-body == latest-body. Which one it is IS the measurement, so `[expectations.renderComposition]` is DECLARED BARE and nothing about the drop is required or forbidden. The map-open PAIR is the lane's own obligation (the G10 entry names it) and it is a HARD precondition rather than scene-setting: `DrawAll`'s only call site is a map-camera onPreCull hook (`GhostTrajectoryPolylineRenderer.cs:3942-3952`) and in FLIGHT that camera renders only while the map is open. The export placement is PINNED by `test_every_declarer_exports_immediately_before_teardown` to the step immediately before `FlushAndQuit`, so it sits after `ExitMapView` - which costs nothing, because the recorder resets on a SCENE SWITCH and not on a map toggle, and every facet this lane names is an accumulated count rather than a live one; and the lane stays in ONE scene on purpose, because `RENDER-MANIFEST-VERB-EXPORT-IN-A-SECOND-SCENE-CLOBBERS-THE-FIRST-SCENE-ACCUMULATION` (measured by H59's `2026-09-02_0947`) makes a FLIGHT-observe / elsewhere-export lane read zeroes for everything FLIGHT measured. The subject carries TWO routes, both inter-body, so the census counts two builds where V18T's counts one. Anti-vacuity is the map pass running, both routes classifying `scope=InterBody basis=Endpoints`, both building, and at least one drawing; the pre-fix reading (`malformed=[1-9]`, `scope=MalformedMixedBodies`) is FORBIDDEN as a control carried in the spec. Counts are regexed and route ids classed `[0-9a-f]{8}` (the H59 `2026-09-02_1017` lesson). Nothing armed, so `[dimensionsCovered]` claims nothing."
instanceProfile = "stock-minimal"
tags = ["V26", "route", "logistics", "inter-body", "kerbin", "duna", "map-render",
        "scene-map", "render-composition", "rc-route", "route-map-lines"]

[fixture]
# The 2026-09-02 harvest of the operator's `orbital supply route` campaign: FOUR committed
# trees, 45 recordings, TWO ROUTES, 20 VESSEL nodes, SANDBOX, active vessel `Depot`
# (ORBITING, FLIGHTSTATE index 0 - a Kerbin-orbit depot, i.e. the routes' ORIGIN body, so
# the map opens on the origin side of both journeys). Payload pinned in
# `test_saveparse.RECORDED_FIXTURES`; the route shape, seal state, dock/undock pair and
# endpoint bodies in `harness/tools/build_interbody_route_recorded.py`.
saveTemplate       = "fixtures/saves/interbody-route-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # Kill the scene-entry auto-recorder: this fixture's active vessel is a parked craft
  # whose tree is committed, the shape that re-arms a promotion stub ~1 s into the scene
  # (V2 flight 4 / V5 run 1 / B23 flight 1).
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # The three tracers every render-composition declarer must arm
  # (`test_every_declarer_arms_the_tracers_the_seam_capture_needs`): mapRenderTracing arms
  # the map/TS tracer + probe AND gates every seam capture predicate the manifest reads;
  # ghostRenderTracing is the FLIGHT-scene Tier-C raise gate, which this lane actually
  # uses because it observes IN FLIGHT; verboseLogging is LOAD-BEARING beside both because
  # the tracer emits its Tier-B truth at Verbose (the V1 lesson) and because this lane's
  # own `Route scope:` / `Route line build:` tokens are Verbose.
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # ARMED EXPLICITLY rather than relied on: `showRouteLines` is the ONLY gate inside
  # `DrawAll` and it defaults true - but a lane whose whole subject is that pass must not
  # depend on a default it does not state.
  { cmd = "SetSetting", args = { name = "showRouteLines",     value = "true" }, expect = "OK" },
  # OPEN. Section 2: this is what makes the composition happen at all.
  { cmd = "EnterMapView",                                    expect = "OK", budget = 120 },
  # THE DWELL, 40 ticks - the V22K / H59 map-open dwell length, kept whole here rather
  # than halved as in B32 because this lane reads a CENSUS rather than a first emission:
  # the manifest aggregates per-frame, so a longer dwell is a larger sample of the same
  # composition and makes an intermittent build/draw visible as a count rather than as an
  # absence. RecordingState is AnyScene and side-effect-free.
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
