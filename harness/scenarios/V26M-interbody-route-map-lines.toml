  # explains why that costs this lane nothing). INERT by construction
  # (`hlib.SEAM_VERB_TAIL_ROLE["ExportRenderManifest"]` = inert): an in-memory read plus
  # one file write in the KSP root, touching no vessel, no save and no Parsek state.
