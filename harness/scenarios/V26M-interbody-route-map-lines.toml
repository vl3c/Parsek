# READING - the run measures it, it does not assert it.
# MEASURED, reading run 2 (2026-09-06, same five lanes, all PASS; the fix's first cut in flight):
#   build / members lines BYTE-IDENTICAL to run 1 (`71a983a1 ... legs=16 transferDropped=2`,
#     `8f644e71 ... legs=17 transferDropped=0`, `heads=4 segments=3`)
#   V26M draw: `routesDrawn=2 legsDrawn=33 skippedOwned=0` on 3 frames,
#              `routesDrawn=2 legsDrawn=20 skippedOwned=1` on 5 of 7 (f6746-7222)
