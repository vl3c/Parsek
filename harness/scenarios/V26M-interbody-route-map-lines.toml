# WHY THE COUNTS STAY INTERIM ANYWAY: run 1's manifest ALSO raised
# `routeCoDrawViolations=1024` (the cap) on V26M / V26T with one distinct finding -
# `ROUTE_CODRAW_VIOLATION[71a983a1 recId=36c7688b...]` - because the ghost polyline's FORWARD
# RUN-LEG pass paints a continuation segment under its OWN recording id and never publishes
# ownership, so the route line's ownership-only arbitration painted a second identical line over
# it. The fix stands a group down when the ghost either OWNS its recording's phase or PAINTED a
# leg of it THIS FRAME, so `skippedOwned` is expected to leave 0 in the map scene and
# `legsDrawn` to fall by the painted segments' legs on those frames - hence `skippedOwned` is
# now a regex too. `members=4` STAYS pinned: the declared member set is untouched and the
