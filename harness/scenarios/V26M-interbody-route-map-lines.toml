#   Route line build: route=71a983a1 members=4 groups=4 legs=16 transferDropped=2
#   Route line build: route=8f644e71 members=4 groups=4 legs=17 transferDropped=0
#   Route line members: route=71a983a1 heads=4 segments=3 groups=4 legs=16   (also segments=3
