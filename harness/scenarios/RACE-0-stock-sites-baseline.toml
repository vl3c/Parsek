schema = 1
id = "RACE-0-stock-sites-baseline"
tier = "operator"
# =====================================================================================
# THE STOCK SITE BASELINE (multiplayer T-07, plan docs/dev/plans/multiplayer/
# test-and-harness.md section T-07; design docs/dev/design-competitive-multiplayer.md
# section 7.3). AUTHORED 2026-11-16 on branch `mp/t-07-listhandles-sites`; FIRST FLOWN
# 2026-11-17, run `2026-11-17_0035` (PASS attempt 1, 46 s wall, scratch merge d813e6cba,
# Parsek.dll sha256
# af72b66c463126aef3da6d7a325290620462ce9690c3fe8cc99c7cc8f3d2e644), and re-pinned
# from that flight's KSP.log. The confirming flight `2026-11-17_0317` (scratch build
# ca454c963) read PARSEK-FAIL on ONE row: Crater_Launch_Site alt=169.751 against a
# window pinned at 169.78-169.879 from the first flight's 169.834. The cause was the pin
# (sized from one boot), not Parsek: the alt windows and the two high-latitude
# longitude windows were re-sized from both flights (see "WHY THE SITE VALUES MOVE"
# below; todo RACE-0-ALT-PIN-FROM-ONE-FLIGHT). The third flight `2026-11-17_0340` (same
# install and build as 0317) read PASS attempt 1 in 52 s on the re-sized windows.
#
# WHAT IT READS. `ListHandles kind=sites` in a fresh single-player career at the Space
# Center, one Info line per fact:
#   listhandles sites spaceCenter body=Kerbin lat=.. lon=.. alt=..
#       the working space center's position, from its live transform;
#   listhandles sites recovery lat=.. lon=..
#       the latitude / longitude the space center cached at its start, which stock's
#       recovery distance is measured from;
#   listhandles sites launchSite index=<i> name='..' point='..' kind=.. editor=.. lat=..
#       lon=.. alt=.. src=..
#       every spawn point of every stock launch site: the KSC's own facilities
#       (kind=facility) first, then the stock alternate sites set up in this game
#       (kind=alternate; Making History is junctioned into every instance), each group
#       ordinal by site name, then by point name;
#   listhandles sites terrain index=<j> name=.. lat=.. lon=.. height=..
#       the PQS terrain height at the fixed sample points (pad, runwayWest, runwayEast).
# Degrees carry seven decimals and metres three, invariant. The Verbose
# `listhandles sites read:` line counts the two groups and the measured samples.
#
# WHY IT EXISTS. These are the stock values a race save moves (design 7.3: the space
# center object, the launch-site spawn points, the recovery point, the terrain under the
# patches). SITES-2 (R2-13) reads the same kind after a race save and compares it with
# THIS lane's pins; SITES-1 to SITES-3 read their per-site values with the kind, not with
# extra batches (OV-03). R2-12 adds the four race patches to the sample table and re-pins
# the terrain lines here.
#
# WHAT THE FIRST FLIGHT MEASURED (run 2026-11-17_0035). Eleven spawn points, count=11:
# three facility points (LaunchPad / VAB; the Runway site's TWO points, `Runway` and
# `Runway27`, both SPH) and eight alternate sites of one point each (Cove, Crater,
# Desert_Airfield, Desert_Launch_Site, GlacierLake, Island_Airfield, MahiMahi,
# Woomerang), every one `src=cache`. Both values the authoring feared negative read
# positive: the space center transform at 67.524 m, runwayEast's terrain at 60.363 m.
# runwayEast IS on the strip (its latitude is the Runway27 spawn point's within 4e-5 deg,
# about 0.4 m, and it lies about 77 m inside that point, between the two runway points'
# longitudes, 2.43 km apart); its 60.4 m is the terrain under the
# runway building, below the strip's 68.8 m spawn altitude, as the pad's terrain (64.8 m)
# is below the pad spawn (72.5 m). The authoring's "expect about 68 m" compared a terrain
# height with a surface altitude; no table fix follows.
#
# WHAT IS PINNED, AND HOW. Exact: the summary (count=11 truncated=false body=Kerbin
# samples=3), the read line (facilityPoints=3 alternatePoints=8 samplesMeasured=3/3),
# every spawn point's index, name, point, kind, editor and src, and every sample point's
# name and coordinates (this lane's own inputs). Measured values are pinned as WINDOWS
# at the precision below, because a regex cannot compare numbers and T-46's `tolerance=`
# comparator does not exist yet (it replaces these windows when it lands):
#   - lat / lon (spaceCenter, recovery, every spawn point): to four decimals, as a window
#     one unit of the fourth decimal wide (1e-4 deg, about 1.05 m on Kerbin's 600 km
#     radius) placed on the 0035 value, with at least 4e-5 deg (0.4 m) of margin each
#     side; except the two high-latitude longitudes (GlacierLake at 73.6 deg, MahiMahi
#     at -49.8 deg), where 1e-4 deg of longitude is only 0.30 m / 0.68 m on the ground:
#     those are the two-run midpoint +-0.5 m on the ground (+-1.69e-4 / +-7.4e-5 deg),
#     snapped outward to 1e-5 deg;
#   - alt (spaceCenter, every spawn point): the two-run midpoint (0035 and 0317)
#     +-0.30 m, snapped outward to whole centimetres (the printed millimetre is free);
#   - terrain height: to one decimal, a 0.1 m window with at least 0.04 m of margin
#     each side.
# WHY THE SITE VALUES MOVE BETWEEN RUNS AND THE TERRAIN DOES NOT. Every launchSite row
# is `src=cache`: stock's `LaunchSite.SpawnPoint.SetSpawnPointLatLonAlt` (called from
# `PQSCity.Orientate` / `PQSCity2.Orientate` through `SetSpawnPointsLatLonAlt`) fills
# the cache with `body.GetLatLonAlt((Vector3d)spawnPointTransform.position)`, and the
# spaceCenter row reads its own transform the same way. Orientate first writes the site
# as `transform.localPosition = (Vector3)planetRelativePosition`, a float32 vector about
# 600 km long (step 0.0625 m per axis), rotated through float32 quaternions under the
# rotating body; the world position read back is float32 again. The double
# lat/lon/alt conversion is exact, so each value carries a few float32 roundings at
# 600 km (a few centimetres each, up to about 0.15 m together), and where they fall
# depends on the body's rotation and the world origin at the instant Orientate ran.
# Measured between 0035 and 0317: alt up to 0.083 m (Crater), along the ground up to
# 0.10 m (spaceCenter longitude). The terrain rows are `PQS` height evaluated in double
# at fixed lat/lon inputs and were byte-identical. OBSERVED, NOT EXPLAINED: 0317 and
# 0340, two boots of one provisioned install and one build, read every value
# byte-identical; only 0035 (an earlier provisioning, another build) differs. So the
# values did not move between those two boots, and what changed between 0035 and the
# later pair is not established. The +-0.30 m alt windows hold both measured sets with
# at least 0.26 m to an edge; a 1 m shift, a moved site or a wrong site list still reds.
# Window, not truncation: a truncated prefix can sit a few millimetres from its edge
# (LaunchPad's alt=72.497 truncates to 72.4 with 3 mm left), and a window placed on the
# value cannot. The windows sit well inside the 50 m / 2 m tolerances R2-03 / R2-05
# compare with. Each window was generated from the measured lines, never typed.
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse - considered B10 / CS-0 (the same
# fresh-career boot) and not applied: a race lane is selected by the `race` tag
# (`--tag race`, T-45) and RaceTagConventionTests refuses that tag on a non-race spec,
# and SITES-2 names this lane as its baseline; the cost is the seam-only boot floor
# (46 s on the first flight, as the PPB lanes). (2) no waits; (3)-(5) no dwells, burns or coasts; (6) the
# read is deterministic, so `[retry] policy = "none"`; (7) recordings pinned {0,0} and
# the spawn-point count to the measured 11; (8) operator per the plan (a race lane);
# (9) flight_efficiency.py on run 2026-11-17_0035 is OWED: it reads the PC's results
# archive, which a cloud session cannot reach (a seam-only lane with no waits, so little
# is expected).
# =====================================================================================
description = "Stock site baseline (multiplayer T-07, LIVE-PROVEN 2026-11-17, run 2026-11-17_0035; confirming flight 2026-11-17_0317 red on the one-flight Crater alt pin, windows re-sized from both flights): in a fresh single-player career at the Space Center, ListHandles kind=sites reads the working space center, the recovery point, all eleven stock launch-site spawn points (three KSC facility points, eight Making History sites) and the terrain height at the pad and both runway ends, pinned as windows (lat / lon about +-0.5 m on the ground, alt +-0.30 m around the two-flight midpoint, terrain height to 0.1 m); SITES-2 compares a restored stock Kerbin against these pins."
instanceProfile = "stock-minimal"
tags = ["race", "RACE-0", "sites", "career", "cold-load", "runtime-handles"]

[fixture]
saveTemplate       = "fixtures/saves/fresh-career"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",    args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "ListHandles", args = { kind = "sites" }, label = "sites", expect = "OK" },
  { cmd = "FlushAndQuit",                                                                           expect = "OK" },
]

[dimensionsCovered]
#   stock-sites <- the listhandles sites lines below
D14 = ["career", "cold-load-ut0", "scene-ksc"]
D19 = ["stock-sites"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# A fresh career; this lane records nothing.
count = { min = 0, max = 0 }

[expectations.logContracts]
required = [
  # The summary line: count is the number of launch-site spawn points (3 facility + 8
  # alternate on the first flight), and the Verbose read line that splits it.
  "listhandles kind=sites count=11 truncated=false body=Kerbin samples=3",
  "listhandles sites read: spaceCenter=True recovery=True facilityPoints=3 alternatePoints=8 samplesMeasured=3/3",
  # The working space center and the recovery reference point (lat / lon windows placed
  # on the 2026-11-17_0035 values, alt on the 0035 / 0317 midpoint; see the header).
  "listhandles sites spaceCenter body=Kerbin lat=-0\\.0917[0-9]{3} lon=-74\\.629(6[4-9]|7[0-3])[0-9]{2} alt=(67\\.2[2-9][0-9]|67\\.[3-7][0-9]{2}|67\\.8[0-3][0-9])",
  "listhandles sites recovery lat=-0\\.0917[0-9]{3} lon=-74\\.629(6[4-9]|7[0-3])[0-9]{2}",
  # The KSC's own facility points first (the Runway site has two), ordinal by name.
  "listhandles sites launchSite index=0 name='LaunchPad' point='LaunchPad' kind=facility editor=VAB lat=-0\\.097(1[5-9]|2[0-4])[0-9]{2} lon=-74\\.557(6[2-9]|7[0-1])[0-9]{2} alt=(72\\.2[1-9][0-9]|72\\.[3-7][0-9]{2}|72\\.8[0-2][0-9]) src=cache",
  "listhandles sites launchSite index=1 name='Runway' point='Runway' kind=facility editor=SPH lat=-0\\.048(5[4-9]|6[0-3])[0-9]{2} lon=-74\\.724(4[2-9]|5[0-1])[0-9]{2} alt=(68\\.89[0-9]|68\\.9[0-9]{2}|69\\.[0-4][0-9]{2}|69\\.50[0-9]) src=cache",
  "listhandles sites launchSite index=2 name='Runway' point='Runway27' kind=facility editor=SPH lat=-0\\.050(1[8-9]|2[0-7])[0-9]{2} lon=-74\\.492(6[2-9]|7[0-1])[0-9]{2} alt=(68\\.4[8-9][0-9]|68\\.[5-9][0-9]{2}|69\\.0[0-8][0-9]) src=cache",
  # The eight stock alternate sites (Making History), ordinal by name.
  "listhandles sites launchSite index=3 name='Cove_Launch_Site' point='Cove_Launch_Site' kind=alternate editor=VAB lat=3\\.747(7[3-9]|8[0-2])[0-9]{2} lon=-72\\.213(2[7-9]|3[0-6])[0-9]{2} alt=(4\\.6[1-9][0-9]|4\\.[7-9][0-9]{2}|5\\.[0-1][0-9]{2}|5\\.2[0-2][0-9]) src=cache",
  "listhandles sites launchSite index=4 name='Crater_Launch_Site' point='Crater_Launch_Site' kind=alternate editor=VAB lat=8\\.385(7[8-9]|8[0-7])[0-9]{2} lon=-179\\.697(6[6-9]|7[0-5])[0-9]{2} alt=(169\\.49[0-9]|169\\.[5-9][0-9]{2}|170\\.0[0-9]{2}|170\\.10[0-9]) src=cache",
  "listhandles sites launchSite index=5 name='Desert_Airfield' point='Desert_Airfield' kind=alternate editor=SPH lat=-6\\.599(6[5-9]|7[0-4])[0-9]{2} lon=-144\\.040(8[1-9]|90)[0-9]{2} alt=(820\\.6[7-9][0-9]|820\\.[7-9][0-9]{2}|821\\.[0-1][0-9]{2}|821\\.2[0-8][0-9]) src=cache",
  "listhandles sites launchSite index=6 name='Desert_Launch_Site' point='Desert_Launch_Site' kind=alternate editor=VAB lat=-6\\.560(3[3-9]|4[0-2])[0-9]{2} lon=-143\\.9(499[5-9]|500[0-4])[0-9]{2} alt=(823\\.7[5-9][0-9]|823\\.[8-9][0-9]{2}|824\\.[0-2][0-9]{2}|824\\.3[0-6][0-9]) src=cache",
  "listhandles sites launchSite index=7 name='GlacierLake_Launch_Site' point='GlacierLake_Launch_Site' kind=alternate editor=VAB lat=73\\.561(4[4-9]|5[0-3])[0-9]{2} lon=(84\\.24779[0-9]{2}|84\\.247[8-9][0-9]{3}|84\\.2480[0-9]{3}|84\\.2481[0-4][0-9]{2}) alt=(60\\.9[5-9][0-9]|61\\.[0-4][0-9]{2}|61\\.5[0-6][0-9]) src=cache",
  "listhandles sites launchSite index=8 name='Island_Airfield' point='Island_Airfield' kind=alternate editor=SPH lat=-1\\.529(2[2-9]|3[0-1])[0-9]{2} lon=-71\\.885(2[5-9]|3[0-4])[0-9]{2} alt=(132\\.9[2-9][0-9]|133\\.[0-4][0-9]{2}|133\\.5[0-3][0-9]) src=cache",
