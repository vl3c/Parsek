  "listhandles sites launchSite index=10 name='Woomerang_Launch_Site' point='Woomerang_Launch_Site' kind=alternate editor=VAB lat=45\\.289(5[6-9]|6[0-5])[0-9]{2} lon=136\\.1(099[3-9]|100[0-2])[0-9]{2} alt=(736\\.1[1-9][0-9]|736\\.[2-6][0-9]{2}|736\\.7[0-2][0-9]) src=cache",
  # The fixed sample points: coordinates exact (the table's own inputs), the PQS terrain
  # height to one decimal.
  "listhandles sites terrain index=0 name=pad lat=-0\\.0972000 lon=-74\\.5575000 height=64\\.(7[3-9]|8[0-2])[0-9]",
  "listhandles sites terrain index=1 name=runwayWest lat=-0\\.0502000 lon=-74\\.7300000 height=64\\.(7[3-9]|8[0-2])[0-9]",
  "listhandles sites terrain index=2 name=runwayEast lat=-0\\.0502000 lon=-74\\.5000000 height=60\\.(3[1-9]|40)[0-9]",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "listhandles rejected",
  # Nothing the baseline needs may read `none`. The rule is kept for the facility points
  # only, as authored: every alternate site read a cached value on the first flight, and
  # the required lines above already hold their values.
  "listhandles sites (spaceCenter|recovery|terrain) [^\\n]*=none",
  "listhandles sites launchSite index=[0-9]+ name='[^']*' point='[^']*' kind=facility [^\\n]*=none",
  # A facility site listed after an alternate one would break the order SITES-2 indexes by.
  "kind=alternate [^\\n]*\\n[\\s\\S]*?listhandles sites launchSite index=[0-9]+ name='[^']*' point='[^']*' kind=facility",
]

[runtime]
budgetSeconds = 600

[retry]
policy = "none"

