schema = 1
id = "SPW-1-laythe-orbit-end-spawn-flight"
# =====================================================================================
# SPW-1: A TRUE END SPAWN AT LAYTHE, IN FLIGHT, WITH THE PLAYER IN KERBIN ORBIT.
# (End-spawn program, 2026-11-17: far-body ends, high warp and a busy player. Todo
# END-SPAWN-LANES-2026-11-17. AUTHORED, NEVER FLOWN: tag `pending-flight`.)
#
# WHY. No green lane spawns a vessel at the end of a recording that ends at a far body.
# FAR-1 and FAR-2 read vessels their saves already held (the rewind strip kept the
# claimed vessel), FAR-3 / FAR-5 read a vessel that was kept live, and LAY-1's Space
# Center spawn waits on a re-flight of the KSC-END-SPAWN-SKIPS-OFF-KERBIN fix. In FLIGHT,
# a far-body end goes through `VesselSpawner.SpawnOrRecoverIfTooClose` with the body
# resolved by name and no loaded-vessel collision check; nothing has ever exercised it.
#
# HOW THE SPAWN IS MADE TRUE. The host `laythe-park-nerv` is Parsek-stripped: the crewed
# Duna Rocket (pid 807470910) ORBITING Laythe is nobody's committed leaf. A segment of its
# orbit is recorded and committed, then Rewind-to-Launch goes back to the segment's start;
# the owner strip removes the Duna Rocket (it owns the only tree, LAY-1 flight 1 measured
# `Stripped 1 vessel(s) ... [Duna Rocket]` on this very host), so nothing stands in its
# place and the end spawn has to CREATE it.
#
# THE FLIGHT:
#   boot    LoadGame (FLIGHT on the Duna Rocket, Laythe orbit, UT 28,817,025.3), stop and
#           discard any promotion (none expected on a stripped host; LAY-1's hygiene).
#   R       StartRecording, WarpToUT 28817330 (rails, ~300 s, a sixth of a Laythe orbit),
#           stop, CommitTree, stop (the auto-resumed recorder, EVA-15).
#   rewind  InvokeRewindToLaunch tree=latest: the Space Center at R's start - 15 s.
#   reload  SaveGame + LoadGame at once: a Space Center save focuses vessel 0, and the
#           asteroid at index 0 is removed at staging (`[[fixture.liveState]]`), so the
#           reload boots FLIGHT on the first `Duna Rocket Debris` (pid 1165394793, Kerbin
#           orbit, ~500 km). The Laythe spawn is therefore UNLOADED and far.
#   cross   WarpToUT 28817600 (rails; the ladder picks <= 100x on a ~580 s span).
#   read    ListHandles before / after, LeafVesselPlacement in FLIGHT (the spawned Duna
#           Rocket on its recorded Laythe orbit and phase), SaveGame, quit.
#
# WHAT IS GATED: the commit names an Orbiting terminal at Laythe; the strip; the reload
# lands BEFORE the end (the recording unspawned, pid 0); exactly ONE spawn of the Duna
# Rocket through the Orbital (recorded terminal orbit) path; the committed store reads it
# back spawned with that pid; LeafVesselPlacement compares it on Laythe with verdict ok
# and no pid on two vessels.
#
# PRE-REGISTERED READINGS (check these first if the first flight reds):
#   - `Deferred spawn during warp` may or may not print: the end is crossed at <= 100x in
#     flight view, so the completion is delivered during warp and queued, OR the ladder
#     was already back at 1x. Either road is accepted; the spawn line is the gate.
#   - `Vessel spawn for #N (Duna Rocket) ... sit=ORBITING` instead of the Orbital line:
#     the commit stored no terminal orbit and the spawn took the snapshot respawn path
#     (forbidden here; a finding, not a spec bug, if the orbit then reads ok).
#   - `kind=orbit ... verdict=phase|sma`: the vessel was spawned on Laythe but not at the
#     clock's phase on the recorded orbit (the #475 family, off Kerbin).
#   - no `[Rewind] Stripped` line: the rewind save kept the Duna Rocket and nothing was
#     owed a spawn; read `Rewind strip scope:`.
#
# FAST-LANE CHECKLIST: (1) reuse: LAY-1's host and boot, EVA-15's rewind-and-reload road,
# FAR-5's in-FLIGHT LeafVesselPlacement read; no mission. (2) every wait is an explicit-UT
# WarpToUT. (3) R is the shortest segment that crosses a rails warp; the cross margin is
# 270 s past the end. (4)/(5) no burn, no coast. (6) retry `once` (a rewind and a reload).
# (7) count pinned exactly (1: one orbit-only recording, no optimizer pass on a seam
# commit). (8) operator until measured. (9) flight_efficiency.py after the first green
# flight.
# =====================================================================================
tier = "operator"
description = "Far-body end spawn in FLIGHT (Laythe): on laythe-park-nerv (asteroid removed) ~300 s of the Duna Rocket's Laythe orbit is recorded and committed, Rewound-to-Launch (the strip removes the Duna Rocket), reloaded into FLIGHT on a debris in Kerbin orbit, and a rails warp past the end must create the Duna Rocket once at Laythe through the recorded-terminal-orbit path, read back spawned with that pid and on its recorded orbit and phase (LeafVesselPlacement in FLIGHT)."
instanceProfile = "stock-minimal"
tags = ["SPW-1", "end-spawn", "far-body", "laythe", "jool", "orbital", "rewind-to-launch",
        "leaf-placement", "ingame-batch", "warp", "sandbox", "pending-flight"]

[fixture]
saveTemplate       = "fixtures/saves/laythe-park-nerv"
injectedRecordings = "none"
craft              = []

# Ast. VPA-167, FLIGHTSTATE index 0: removed so a Space Center save's `activeVessel = 0`
# names a debris instead of a heliocentric asteroid (EVA-15's recipe).
[[fixture.liveState]]
pid    = 1490391000
remove = true

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },          expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                            expect = "OK" },
  { cmd = "DiscardTree",                                                              expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" },      expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },           expect = "OK" },
  { cmd = "MissionMark", args = { label = "spw1-boot" },                              expect = "OK" },
  # R: a segment of the Laythe orbit.
  { cmd = "StartRecording",                                                           expect = "OK", budget = 180 },
  { cmd = "WarpToUT",   args = { ut = "28817330" },                                   expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                            expect = "OK" },
  { cmd = "CommitTree",                                                               expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                            expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c0",                 expect = "OK" },
  { cmd = "MissionMark", args = { label = "spw1-commit-count-${c0.count}" },          expect = "OK" },
  # The rewind, then at once back into FLIGHT on the Kerbin-orbit debris.
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                         expect = "OK", budget = 300 },
  { cmd = "SaveGame",   args = { name = "spw1-rewound" },                             expect = "OK", budget = 120 },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "spw1-rewound" },        expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                            expect = "OK" },
  { cmd = "DiscardTree",                                                              expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" },      expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },           expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c1",                 expect = "OK" },
  { cmd = "MissionMark", args = { label = "spw1-reloaded-count-${c1.count}-a-${c1.rec0}-${c1.rec0spawned}-${c1.rec0spawnedPid}-end" }, expect = "OK" },
  # THE SUBJECT: past the end, with the player in Kerbin orbit.
  { cmd = "WarpToUT",   args = { ut = "28817600" },                                   expect = "OK", budget = 300 },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c2",                 expect = "OK" },
  { cmd = "MissionMark", args = { label = "spw1-spawned-count-${c2.count}-a-${c2.rec0}-${c2.rec0spawned}-${c2.rec0spawnedPid}-end" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "LeafVesselPlacement" },                  expect = "OK", budget = 300 },
  { cmd = "SaveGame",                                                                 expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                             expect = "OK" },
]

[dimensionsCovered]
# Boot facts only until the first green flight (the H35 claim-is-not-gate rule).
D14 = ["laythe", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 1 }

# REPORT-ONLY until a reading run: one tree, one Orbiting recording, one spawned vessel,
# the Duna Rocket once in the produced save beside its two debris.
[expectations.recordings.structure]
gating         = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1, max = 1 } }
spawnedVessels = { min = 1, max = 1 }
vesselNames    = { "Duna Rocket" = 1, "Duna Rocket Debris" = 2 }

[expectations.logContracts]
required = [
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "startrecording recordingId=[0-9a-f]+ already=false",
  "Captured rewind save at UT ([0-9.]+): vessel \"Duna Rocket\" in ORBITING \\(save: (parsek_rw_[0-9a-f]+)\\)[\\s\\S]*Rewind-to-Launch initiated to UT \\1 \\(save: \\2\\)",
  "CommitTreeFlight terminal: rec=[0-9a-f]+ terminalState=Orbiting terminalOrbitBody=Laythe",
  "committree committed=true",
  "MISSIONMARK label=spw1-commit-count-1 ",
  "invokerewindtolaunch target resolved tree=[0-9a-f]{32} resolvedBy=LatestKeyword arg=latest committedTrees=1",
  "\\[Rewind\\] Stripped [1-9][0-9]* vessel\\(s\\) from save",
  "invokerewindtolaunch complete rec=[0-9a-f]{32} tree=[0-9a-f]{32} adjustedUT=",
  # The reload lands before the end: unspawned, no pid.
  "MISSIONMARK label=spw1-reloaded-count-1-a-[0-9a-f-]+-false-0-end ",
  # THE SPAWN: once, at Laythe, from the recorded terminal orbit.
  "Spawn #[0-9]+ \\(Duna Rocket\\): using recorded terminal orbit propagated to current UT \\(ut=[0-9.]+, body=Laythe,",
  "\\[Spawner\\] Orbital vessel spawn for #[0-9]+ \\(Duna Rocket\\) pid=([0-9]+) [^\\r\\n]*terminal=Orbiting[\\s\\S]*MISSIONMARK label=spw1-spawned-count-1-a-[0-9a-f-]+-true-\\1-end ",
  # Placement: on Laythe, on its recorded orbit and phase, no pid on two vessels.
  "LeafPlacement: rec=[0-9a-f]+ vessel='Duna Rocket' pid=[0-9]+ kind=orbit body=Laythe liveBody=Laythe [^\\r\\n]*verdict=ok",
  "MISSIONMARK label=spw1-spawned-count-[\\s\\S]*?LeafPlacement summary: scene=FLIGHT compared=[1-9][0-9]* ok=[1-9][0-9]* bad=0 absent=[0-9]+ duplicate=0 unsupported=[0-9]+ bodies=\\[Laythe\\]",
  "BATCH_COMPLETE v1 total=1 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LeafVesselPlacement scene=FLIGHT",
  "savegame name=persistent folder=\\S+ saved=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "invokerewindtolaunch refused",
  "invokerewindtolaunch failed",
  "warptout refused",
  "timejump ",
  # Exactly one spawn, and never the snapshot fallback for an Orbiting end.
  "(?:Orbital|EVA|Breakup) vessel spawn for #[0-9]+ \\(Duna Rocket\\)[\\s\\S]*(?:(?:Orbital|EVA|Breakup) vessel|Vessel) spawn for #[0-9]+ \\(Duna Rocket\\)",
  "Vessel spawn for #[0-9]+ \\(Duna Rocket\\)",
  "Spawn ABANDONED for #[0-9]+ \\(Duna Rocket\\)",
  "Spawn RETIRED for #[0-9]+ \\(Duna Rocket\\)",
  "Vessel spawn failed[^\\r\\n]*\\(Duna Rocket\\)",
  "SpawnAtPosition returned 0",
  "Spawn-death detected",
  "Cannot spawn terminal orbit safely",
  "LeafPlacement: [^\\r\\n]*verdict=(?!ok)",
]

[runtime]
# 3 x 300 LoadGame + 180 StartRecording + 2 x 300 warps + 120 CommitTree + 300 rewind +
# 2 x 120 SaveGame + 300 RunTests = 2640, plus the inert steps.
budgetSeconds = 3000

[retry]
policy = "once"

[expectedFail]
bugId = ""
