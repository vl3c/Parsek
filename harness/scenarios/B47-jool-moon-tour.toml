schema = 1
id = "B47-jool-moon-tour"
# =====================================================================================
# B47: the Jool multi-moon tour forge. AUTHORED 2026-11-14, NEVER FLOWN.
#
# WHAT IT IS FOR. Todo NEXT-TESTS-TO-BUILD-2026-11-11 item 1 (Group C, M-MIS-6). The
# multi-moon configuration hold (`ArrivalHoldPlanner.ComputeMultiMoonConfigHold`,
# docs/dev/design-mission-multimoon-alignment.md) is built and unit-tested but has
# never had a subject: it engages only on a tree that enters TWO OR MORE moon SOIs of
# one planet. This lane makes that tree: from the UNSTRIPPED `jool-orbit-recorded`
# (B22's harvest, B38's start) it parks at LAYTHE, then VALL, then TYLO, and commits
# once, at Tylo. With no StopRecording / DiscardTree the committed-spawned restore
# resumes B22's tree (`already=true`), so all three hops are appended to the
# Kerbin -> Jool tree `6ec68e87b782476f970a71df8c8b4685`. V38M replays it.
#
# ID. B43-B46 are named for todo item 2 (the moon-to-moon pairs), so the tour takes
# B47 and its Bop variant B48.
#
# THE MACHINE: `b47_jool_moon_tour` (mlib `mtour_decide`), a composition of three
# b5_decide legs, each a full B5 param table below. The composer drops the
# mid-mission CommitTree on legs 1 and 2's park exit and hands the next leg a fresh
# B5 machine that enters through the ORBIT-START door. `mtour_params_from_dict`
# refuses a spec whose park band does not nest inside the next leg's entry gate.
#   leg 1  Jool -> Laythe   B38's params (B25's, live-proven on B25 and B38) with
#                           the park band TIGHTENED to leg 2's entry gate
#                           (parkMaxApoapsisMeters 900,000 -> 300,000,
#                           parkMaxEccentricity 0.25 -> 0.10). B25 parked at
#                           87,931 x 56,240 m, ecc 0.028, well inside.
#   leg 2  Laythe -> Vall   B26's params (live-proven flight 3) plus an ELLIPTICAL
#                           Vall capture (captureEllipticalApoapsisMeters
#                           1,000,000, B29's key) to save delta-v for leg 3; the
#                           park ceiling opens to 1,600,000 m / ecc 0.65 to admit
#                           it (delivered ecc at the 250 km request 0.405).
#   leg 3  Vall -> Tylo     the same parent relay one moon further out. Entry gate
#                           = leg 2's park band. Escape at 250 m/s SOI speed (the
#                           Vall -> Tylo Hohmann needs 276 m/s in Jool's frame);
#                           stage-2 evidence: the Jool-frame apoapsis reaches
#                           61 Mm (Tylo's orbit is at 62.5 Mm altitude). Elliptical
#                           Tylo capture to 6,000 km (ecc 0.714 at the 500 km
#                           request); corrections time-triggered inside the ~78,000 s
#                           half-transfer.
#
# DELTA-V (missions/lib/test_b47_jool_moon_tour.py re-derives it). The craft starts
# with 3,967 m/s. Leg 1 is B38's hop; B26's fixture measured ~2,484 m/s left after
# it. Leg 2 nominal: escape 587 + stage 2 ~415 (B26 flight 3) + corrections ~75 +
# elliptical capture ~175 = ~1,250. Leg 3 nominal: escape ~75 (from the Vall
# ellipse's periapsis) + stage 2 up to 2 x 250 + corrections up to 2 x 100 +
# capture ~180 = ~650 worst-of-band. Nominal margin about 580 m/s; a worst case on
# every band (B26's 900 m/s stage-2 ceiling plus full corrections on both legs)
# goes negative, which the first flight measures.
#
# WHAT IS NOT KNOWN UNTIL IT FLIES: whether the leg-1 Laythe park lands under the
# 300 km ceiling (B25's did), whether the relay escape from an ELLIPTICAL moon park
# behaves as from B26's near-circular one, whether MechJeb's moon-path
# OperationTransfer plans Vall -> Tylo from the delivered Jool orbit, an early
# Laythe / Vall re-encounter on the stage-2 coasts (poisoned below as a Bop / Pol
# SOI entry is), and the total delta-v.
#
# HARVEST after a green flight, from the run's own snapshot, never `--force`:
#   python tools/harvest_bdock_station.py --save-dir results/<runId>_save
#       --target-name jool-tour-recorded --expect-situation ORBITING --keep-parsek
# then commit the fixture and drop V38M from PENDING_FIXTURE_LANES
# (harness/lib/test_hlib.py), re-pinning its count window from the harvest.
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-11-14, NEVER FLOWN. The Jool multi-moon tour forge (M-MIS-6): from the UNSTRIPPED `jool-orbit-recorded`, one composed machine (b47_jool_moon_tour) parks at Laythe (B25's leg), Vall (B26's parent relay with an elliptical capture) and Tylo (the relay again), dropping the mid-mission commit on the first two parks and committing once at Tylo. No StopRecording/DiscardTree, so all three hops join the Kerbin->Jool tree 6ec68e87. Produces `jool-tour-recorded`, the multi-moon configuration hold's first subject, for V38M."
instanceProfile = "stock-minimal"
tags = ["B47", "laythe", "vall", "tylo", "jool", "moon", "jool-moon", "moon-tour", "moon-to-moon", "orbit", "mechjeb", "cross-soi", "capture", "commit-in-foreign-soi", "orbit-start", "tree-continuation", "multi-moon-hold", "pending-flight"]

[fixture]
saveTemplate       = "fixtures/saves/jool-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "b47_jool_moon_tour"

# `steps` MUST stay above the [driver.missionParams] header. B38's preamble.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },   expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "StartRecording",                                                    expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 9000 },
  { cmd = "FlushAndQuit",                                                      expect = "OK" },
]

