count = { min = 1, max = 1 }

[expectations.logContracts]
# THE CHAIN, in order:
#   "missionconfig applied:" / "SetLoopEnabled: loop ON" - the loop is ARMED
#     through the production path, in FLIGHT, before the save; the first also
#     echoes phaseAnchorUt, THE number to read when re-calibrating the jump.
#   "startloopplayback initiated:" - the clock work entered the production door and
#     echoed the resolved relaunchUt.
#   "Orbital\(Laythe\) same-parent" - the extraction classified the destination as
#     a direct child of the launch body, which is what keeps Support=Supported and
#     makes re-aim structurally unreachable. STRUCTURAL (Laythe IS a child of
#     Jool) rather than measured, so it is safe to require on a first run.
#   "PhaseLock APPLIED: mission=" - the VALUE-FREE prefix. `support=Supported` and
#     the `method=single-orbital ... zeroDrift=no` conjunction are DEFERRED to the
#     arming pass: `method=` is exactly what this pair measures at a k > 1 cadence
#     (V16M section 1(B)), and V14M's header records what pre-pinning a predicted
#     method costs.
#   "factory chain ... reaimed=False" - V6T/V14T/V15T's sharpest single line: what
#     TS rendered is the FAITHFUL chain, not a re-aimed one. Structural on a
#     same-parent subject, hence required from the start.
# THE TWO R12 ROUTE LINES - the trackstation BRANCH was taken and the load
#     COMPLETED against the TrackingStation expected scene (H23's pins verbatim;
#     this fixture has a focusable vessel and would otherwise route to FLIGHT, so a
#     TRACKSTATION landing can only mean the requested scene overrode the
#     save-derived route - the claim is falsifiable).
# THE TWO TS ANTI-VACUITY GATES:
#   "ParsekTrackingStation initialized: created [1-9][0-9]* ghost vessel\(s\)" -
#     the TS host's OWN line, emitted only in that scene. A TS boot that
#     materializes ZERO ghosts is an empty tracking station, and reading that as a
#     pass is the V1/V2 vacuity failure. A zero here is a FINDING to diagnose,
#     never a token to relax. Routing-agnostic by design.
#   "phase=GhostCreated surface=ProtoIcon pid=\d+ .*body=Laythe scene=TRACKSTATION"
#     - V6T's `body=Mun` / V14T's `body=Ike` / V15T's `body=Gilly` pin with the
#     body swapped. This is what turns the D14 `laythe` claim from an EPOCH claim
#     into a RENDERED-FRAME claim, and it is armed from the start rather than after
#     an iteration (V14T's own note said to).
# THE PROBE / LENS PRESENCE PINS (V6T/V14T/V15T's, verbatim, and for their
# reasons):
#   "faithful-parity summary sampled=\d+ overTolerance=\d+" - emitted only when the
#     per-pid parity pass touched the lens, so PRESENCE cannot be produced by a
#     frame with no resolved ghost. `sampled=[1-9]` is NOT pinned: V6T/V14T/V15M/V15T
#     all read `sampled=0 skip.reaimed-or-foreign-seed=1`
#     (docs/dev/todo-and-known-bugs.md -> FAITHFUL-PARITY-SEED-FRAGMENT-REBASE).
#   "seam-endpoint summary evaluated=\d+ outsideSoi=\d+" - the PRESENCE form, and
#     deliberately NOT V16M's stricter value form: V6T/V7T/V14T/V15T all measured
#     the structural `evaluated=0 outsideSoi=0 skip.no-cross-body-successor=1`,
#     because the TS dwell parks the drive clock inside the recording's LAST
#     segment and the forward scan finds no different-body successor. `\d+` on both
#     counters keeps the pin honest in both directions: it catches the lens going
#     silent without freezing a structural zero into a contract. THE CENSUS VERDICT
#     FOR THIS PAIR LIVES ON V16M, which is the lane that actually reaches the lens
#     - and which carries the forty-tick pacing block that is supposed to make it
#     readable TWICE for the first time.
# ---------------------------------------------------------------------------
# ARMED 2026-08-19 OFF THIS LANE'S OWN READING RUN `2026-08-19_2115`. Every regex
# below was grepped in its EXACT form (Python semantics, the harness's) against
# that run's KSP.log before being written here; match counts are quoted so a
# reader can tell a thin pin from a fat one.
#   "Orbital\(Laythe\) same-parent" (6) + "support=Supported" (12) - same-parent,
#     not demoted. `support=Supported` is NEW at arming (the reading run did not
#     require it), matching V15T's arming exactly.
#   "PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no" (6) - ONE
#     regex over ONE line, pinning the whole routing verdict as a conjunction.
#     THE PRE-FLIGHT POSTURE IS DISCHARGED: the reading run deliberately required
#     only the VALUE-FREE prefix, because `method=` was the thing being measured at
#     a k > 1 cadence; it came back `single-orbital`, so the conjunction is armed
#     FROM the measurement. Three separate tokens would pass on a log carrying them
#     on three different lines.
#   "factory chain ... reaimed=False" (27) - V6T/V14T/V15T's sharpest single line,
#     same value here: what TS rendered is the FAITHFUL chain, not a re-aimed one.
#   THE TWO R12 ROUTE LINES (1 each) - the trackstation BRANCH was taken and the
#     load COMPLETED against the TrackingStation expected scene.
#   "ParsekTrackingStation initialized: created [1-9][0-9]* ghost vessel\(s\)" (1)
#     - MEASURED `created 1 ghost vessel(s), fixed 0 orbit renderer(s),
#     trackingStationSuppressed=0`. A TS boot that materializes ZERO ghosts is an
#     empty tracking station, and reading that as a pass is the V1/V2 vacuity
#     failure.
#   "phase=GhostCreated surface=ProtoIcon pid=\d+ .*body=Laythe scene=TRACKSTATION"
#     (1) - V6T's `body=Mun` / V14T's `body=Ike` / V15T's `body=Gilly` pin with the
#     body swapped, which is what turns the D14 `laythe` claim from an EPOCH claim
#     into a RENDERED-FRAME claim. MEASURED at pid=3891391468,
#     `worldPos=(-1100998.42,-1126007.77,-3766773.70)`, i.e. 4.09 Mm from Laythe's
#     centre. NOTE the run ALSO created a second proto at `body=Jool` with a
#     heliocentric-scale worldPos on the same frame (11827) - that is the
#     unshifted-epoch artifact the header describes, and it is precisely why this
#     token names the BODY rather than merely counting creations.
#   "faithful-parity summary sampled=\d+ overTolerance=\d+" (1) - the PRESENCE
#     form. `sampled=[1-9]` is NOT pinned (the standing
#     FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\d+ outsideSoi=\d+" (2) - THE PRESENCE FORM,
#     AND IT MUST STAY THAT WAY ON THIS LANE. This run measured
#     `evaluated=0 outsideSoi=0 skip.body-mismatch=2` (10846) and
#     `evaluated=2 outsideSoi=1` (11875). V16M's stricter
#     `evaluated=[1-9]\d* outsideSoi=0` would RED here - correctly, in the sense
#     that the reading really is nonzero, and wrongly, in the sense that the
#     nonzero is the creation-frame lens artifact rather than a phase-lock drift
#     (header). The census VERDICT for this pair therefore lives on V16M, which
#     takes its readings at stepped epochs where the loop shift has bound and
#     measured `outsideSoi=0` at BOTH cycles. `\d+` on both counters here keeps the
#     pin honest in both directions: it catches the lens going silent without
#     freezing today's artifact into a contract.
# ---------------------------------------------------------------------------
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "Orbital\\(Laythe\\) same-parent",
  "support=Supported",
  "PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no",
  "loadgame trackstation route: booting to TRACKSTATION save=",
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  "ParsekTrackingStation initialized: created [1-9][0-9]* ghost vessel\\(s\\)",
  "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Laythe scene=TRACKSTATION",
  "factory chain rec=\\w+ idx=\\d+ inst=\\d+ phases=\\d+ reaimed=False",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# V14T/V15T'S FULL SIX. Every one guards a PREMISE rather than deferring a
# MEASUREMENT, so there is nothing to learn by letting any of them pass.
# NOTE what is NOT here: the `icon-off-orbit` raise this lane is EXPECTED to
# produce is the anomaly sweep's surface, not logContracts', and it is handled (by
# being deliberately untolerated) in `allowedAnomalies` above. Nor is the benign
# skip-only `seam-endpoint summary evaluated=0 ... skip.no-cross-body-successor=1`
# forbidden - it is the honest reading of a TS dwell, not a defect.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The re-aim forbid trio - the falsifiable half of the same-parent routing
  # claim, and the reason this spec is not just "V5 with a different fixture".
  "\\[ReaimDiag\\]",
  "ENGAGED re-aim",
  "FORCED FAITHFUL",
  # The V3C run-3 self-detection guard: a refused backward jump is only a WARN, so
  # without this token a mis-seeded jump can green while dwelling nowhere. On a
  # CALIBRATION-SEED table that is the likeliest failure of all.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance
  # is a rendered-vs-recorded drift.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# ARMED 2026-08-19 (the V2/B17/V4/V14T/V15T arming discipline) off this lane's OWN
# reading run `2026-08-19_2115`, whose saveParse REPORT measured rewindPoints=0,
# supersedeRows=0, tombstones=0, rewindRetirements=0 - every declared window
# already met, so the arming re-pinned nothing and moved no verdict. (The run's
# PARSEK-FAIL verdict is the anomaly sweep's, on a different verifier; the
# save-structure facets were clean.)
#
# The claim being armed - a FLIGHT-arm / SaveGame / TS-re-entry observation
# authors NOTHING durable - is worth more on this shape than on a single-scene
# dwell, for V5's reason: this spec writes a save mid-run and reads it back
# through a SECOND scene load, the shape in which a stray durable write is easiest
# to miss.
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# ARMED 2026-08-19, same reading run: trees=1, committedTrees=1, recordings=1,
# terminalStates {Orbiting: 1}, branchPoints {} - i.e. the DOUBLE scene entry
# produced no second committed tree and the mid-run SaveGame persisted no stub.
# `trees` keeps V2's max = 2 (the documented duplicate-writer hazard) rather than
# being pinned to the single measurement; everything else is pinned at the
# measured value, and `recordings = {1,1}` doubles as the FIXTURE CONTRACT (see
# [fixture]).
gating = true
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1 } }

[runtime]
# 300 LoadGame + 300 StartLoopPlayback + 300 TimeJump + 300 LoadGame(TS) + the
# fast non-deferred verbs + KSP boot + collect. Every jump is instantaneous, so
# the ~2.1 Ms of game time costs no wall clock; V6T's identical 16-step shape
# measured 50 s end to end and V14T's and V15T's measured the same.
budgetSeconds = 2400

[retry]
# One retry absorbs the V5 promotion-recorder re-arm race (which this fixture's
# shape makes more likely than most, per the header) and ordinary seam flakes. It
# does NOT absorb a mis-seeded anchor: that reproduces exactly on attempt 2, which
# is the point.
#
# AND ON THE READING RUN IT IS BUDGETED TO SPEND ITSELF: the `icon-off-orbit`
# raise is deliberately untolerated (see allowedAnomalies), so the expected red
# will consume the retry and the run will report PARSEK-FAIL(anomaly) on attempt
# 2 as well. That is the correct, pre-registered outcome and it is priced here
# rather than discovered.
policy = "once"

[expectedFail]
bugId = ""
