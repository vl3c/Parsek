ired and 6 forbidden met, count {1,1}, both gated save-structure blocks PASS, and the NRE storm reproducing at 443 against 447 - a 0.9% spread on a byte-identical shape, which is what a pacing-dependent per-frame rate looks like); negative control 2026-08-19_1810, the pair's SINGLE shared inversion (a temporary supersedeRows={min=1}, correctly PARSEK-FAIL(save-structure) on mismatches=['rewind.supersedeRows 0 < min 1'], reverted). ONE BONUS FINDING from the control run, kept strict: it also swept hits=['line-blink'] - NOT icon-off-orbit, so this lane's stepped-shape control claim is untouched - at the cycle-2 park epoch on the ghost's Gilly proto orbit line, dark edge, sinceFrames=8 with the OFF decided by director-traced-path-suppress, a case the window-exit exemption deliberately does not cover. It is INTERMITTENT 1-of-3 (the reading and armed runs swept clean). allowedAnomalies STAYS [], so a future red on line-blink is a real reading to be read rather than retried away, and retry=once will spend an attempt when it fires - priced, not dodged."
