schema = 1
id = "V15M-gilly-player-loop"
# =====================================================================================
# !!! THIS SPEC IS NOT FLYABLE UNTIL THE POST-B24-HARVEST CALIBRATION PASS !!!
#
# Two classes of value below are PLACEHOLDERS, both marked at every site:
#   (1) the TREE ID in the MissionConfig / StartLoopPlayback args, written as
#       `00000000000000000000000000000000` because B24-gilly-orbit has not flown
#       and its committed tree does not exist yet;
#   (2) the EIGHT TimeJump UTs, which are CALIBRATION SEEDS derived from B24's
#       PLANNED numbers (its header's derivation) rather than from a flight.
# The derivation for every seed is written out below as arithmetic a reader can
# re-run, so the calibration pass is a substitution and not a re-invention. Fly
# B24 first, harvest its produced save into `fixtures/saves/gilly-orbit-recorded`,
# read the tree id / `explicitStartUT` / `explicitEndUT` / the ORBIT_SEGMENT seam
# off the committed bytes, and re-pin. NOTHING ELSE in the flown shape should move.
# =====================================================================================
#
# V15M: THE PLAYER WORKFLOW ON A **SAME-PARENT TRANSFER TO AN ECCENTRIC, INCLINED,
# TINY-SOI MOON** - the first loop subject where the phase-lock TOLERANCE is small
# enough to be worth measuring.
#
# ---------------------------------------------------------------------------------
# 1. WHAT THIS LANE ADDS OVER V14M, STATED AS THE ONE THING IT IS
# ---------------------------------------------------------------------------------
# V14M flew this exact workflow on B23's Duna->Ike recording and MEASURED the
# routing (log line 10571 / 10574 of run `2026-08-18_2336`):
#
#   ExtractConstraints: tree=f55918af... members=1 launchBody=Duna
#     ut0=9160398.06 support=Supported constraints=1
#     [Orbital(Ike) same-parent P=65517.862134808071 off=17082.834318690002]
#   PhaseLock APPLIED: ... method=single-orbital cadence 21212.07->65517.86
#     fixedCadenceResidual=0 fixedCadenceWithinTol=yes zeroDrift=no
#
# The GENERAL fact that buys, propagated to
# `docs/dev/research/same-parent-reaim-jool-system.md` section 3.5: an ORBIT-ROOTED
# recording emits NO Rotation constraint (the extraction emits one for a
# SURFACE/PAD-ROOTED launch, and a recording that begins in orbit has no surface
# phase), so a park-rooted single-moon subject reaches `single-orbital` BY
# CONSTRUCTION and its phase lock is EXACT - residual literally 0, cadence one
# moon period, no schedule.
#
# THIS LANE DOES NOT RE-ASK THAT. It PREDICTS the identical routing (section 2)
# and treats it as the control. What it asks instead is the question V14M could
# not: **when the phase lock is exact, is the REPLAY still inside the moon's SOI
# at the shifted epoch?** On Mun / Minmus / Ike that question is unaskable, because
# the tolerance is thousands of seconds wide and any residual disappears into it:
#
#   body    SOI (m)      v_orb (m/s)   tol = SOI/v_orb   SOI/SMA
#   Mun     2,429,559.1      542.49        4,479 s        20.25%
#   Minmus  2,247,428.0      274.2         8,197 s        (n/a here)
#   Ike     1,049,598.9      306.9         3,420 s        32.80%
#   Bop     1,221,060.9    1,482.8           823 s         0.95%   (Jool doc)
#   Pol     1,042,138.9    1,253.2           832 s         0.58%   (Jool doc)
#   GILLY     126,123.27     509.3           248 s         0.40%
#
# Gilly's `tol` is 13.8x tighter than Ike's and its duty cycle (tol/period =
# 247.6/388,587.4 = 6.37e-4) is tighter than Pol's 9.22e-4 - the tightest in the
# stock system. AND THE ECCENTRICITY MOVES THE TOLERANCE ITSELF: Gilly's true
# orbital speed swings 274.4 m/s (apoapsis) to 945.3 m/s (periapsis), so `tol`
# swings **460 s -> 133 s** depending on WHERE in Gilly's orbit B24's encounter
# landed. That is exactly the caveat the Jool research doc attaches to every
# Bop/Pol conclusion ("`v_orb` is the circular `sqrt(mu/a)` ... for an e = 0.235
# orbit the true speed swings +-24%"), at e = 0.55.
#
# SO THIS LANE'S OWN SENSITIVITY IS SET BY B24'S FLIGHT, and the calibration pass
# must record it: read the intercept radius off the committed `.prec.txt`
# ORBIT_SEGMENT chain and write the resulting `tol` here. A periapsis-side
# encounter makes this lane 3.4x more sensitive than an apoapsis-side one.
#
# ---------------------------------------------------------------------------------
# 2. THE PREDICTION - the routing (control), and the open question (the reading)
# ---------------------------------------------------------------------------------
# THE ROUTING, PREDICTED AND NOT GATED. B24's recording is orbit-rooted at Eve and
# targets exactly one moon, so by V14M's measured general fact:
#
#   ExtractConstraints: tree=<B24 tree> members=1 launchBody=Eve
#     ut0=<explicitStartUT> support=Supported constraints=1
#     [Orbital(Gilly) same-parent P=388587.378... off=<seam offset>]
#   PhaseLock APPLIED: mission='<B24 mission name>' tree=<B24 tree>
#     anchor <base>-><anchor> P=388587.378... method=single-orbital
#     cadence <span>->388587.378... fixedCadenceResidual=0
#     fixedCadenceWithinTol=yes zeroDrift=no
#
#   P DERIVED FROM STOCK ELEMENTS, digits shown so the calibration pass can check
#   the product against arithmetic rather than against another log:
#     a = 31,500,000 m, mu_Eve = 8,171,730,229,210.87 m^3/s^2
#     a^3        = 3.1255875e22
#     a^3 / mu   = 3.824971e9
#     sqrt       = 61,846.35
#     x 2*pi     = 388,587.378 s
#   CADENCE: `QuantizeCadenceToMultipleOfP` takes the smallest k*P >= the raw
#   cadence, and the raw cadence is floored at the recording's SPAN. B24's span is
#   planned at ~122,000 game s (band ~36,000-190,000), all of which is < P, so
#   k = 1 and the effective cadence is EXACTLY ONE GILLY PERIOD. Cycle N = A1 +
#   (N-1)*P, exactly - the same arithmetic progression V14M measured, for the same
#   reason.
#
#   NOTE WHAT GILLY'S ECCENTRICITY DOES **NOT** DO, because it is easy to expect
#   the wrong thing here. A cadence of exactly one orbital period returns the moon
#   to the SAME TRUE ANOMALY whatever the eccentricity - the lock does not care
#   that the orbit is not circular. What the eccentricity changes is the SIZE OF
#   THE ERROR BUDGET (section 1) and the SPEED at which any residual translates
#   into a position error: at 945 m/s a 133-second slip walks the moon clean out
#   of its own SOI, where the same slip at Ike (307 m/s, 1,050 km SOI) moves it
#   4% of the way across.
#
# THE OPEN QUESTION, AND THE TWO INSTRUMENTS THAT ANSWER IT. Faithful playback
# replays the RECORDED trajectory verbatim - it does not re-solve the encounter -
# so the replayed SOI-entry point is a fixed body-frame position replayed at a
# shifted epoch. Two lens summaries measure whether that still lines up:
#
#   `seam-endpoint summary evaluated=N outsideSoi=M` - the census that asks, per
#     evaluated cross-body seam, whether the replayed endpoint still lies INSIDE
#     the destination SOI at the replay epoch. WHAT `outsideSoi > 0` WOULD MEAN
#     HERE: the ghost's recorded Eve->Gilly entry point is no longer within
#     126,123 m of Gilly at the re-anchored time - i.e. the replay arrives where
#     the moon USED to be. That is precisely the eccentric-moon failure mode the
#     Jool doc predicts for Bop/Pol, observed on a flyable subject for the first
#     time. All three proven moon lanes read the STRUCTURAL zero here, and V14M
#     measured `evaluated=1 outsideSoi=0` - a real measurement, at a tolerance
#     13.8x looser than this one.
#   `faithful-parity summary sampled=N overTolerance=M` - the per-pid
#     rendered-vs-recorded parity pass. A nonzero `overTolerance` is a drift
#     between what was recorded and what is being drawn, independent of the moon.
#
# ON A READING RUN BOTH ARE **OBSERVED, NOT GATED**: `outsideSoi` is required only
# in its PRESENCE form (`\d+` on both counters), so the lens going silent is
# caught while today's value is not frozen into a contract. A nonzero reading is
# the finding this lane was built to look for and must not be a red on the run
# that first shows it (the S1.4 rule). Arm the value AFTER a reading run, with the
# run cited, per the ARMED_ALLOWLIST discipline.
#
# ---------------------------------------------------------------------------------
# 3. THE SCHEDULE - CALIBRATION SEEDS, and the arithmetic that produces them
# ---------------------------------------------------------------------------------
# THIS IS THE SUBSTITUTION RECIPE. With no zero-drift schedule the anchor is the
# plain Tier-1 window snap:
#   `phaseAnchorUT = solution.NextWindowUT = NextWindow(extraction.UT0, P, referenceUT)`
#   (MissionLoopUnitBuilder.cs:386), where
#   `referenceUT = max(mission.LoopAnchorUT, spanEndUT)` (:295 + :378),
#   i.e. `phaseAnchorUT = UT0 + k*P` with
#   `k = ceil((referenceUT - UT0)/P - 1e-9)`.
#
# THE FOUR INPUTS, and where each comes from AFTER B24 flies:
#   UT0        the main recording's `explicitStartUT` (NOT segment 0's startUT -
#              the V6M convention, settled twice: V6M's measured
#              `Orbital(Mun) same-parent ... off=` equals seam minus
#              `explicitStartUT` exactly, and V14M's agreed to 0.04 s. Using the
#              first ORBIT_SEGMENT instead put every bracket 2.5 s off.)
#   spanEndUT  the same recording's `explicitEndUT`
#   save UT    the produced save's FLIGHTSTATE `UT` (the loop is armed on the
#              first frames after LoadGame, so LoopAnchorUT ~ the save clock)
#   seam       the adjacent `endUT == startUT` BODY-CHANGE pair in the committed
#              `.prec.txt` ORBIT_SEGMENT chain (the Eve->Gilly SOI entry); the
#              offset is `seam - UT0`, and the product echoes it as
#              `Orbital(Gilly) same-parent ... off=`.
#
# THE SEEDS BELOW, derived from B24's PLANNED numbers (its header):
#   UT0        ~ 15,764,032       (the fixture's save clock 15,764,031.825 plus
#                                  the seam preamble; the recording opens on the
#                                  StartRecording step)
#   span       ~   122,000        (window wait ~16,000 + transfer coast 88,108 +
#                                  capture/park ~2,000; the BAND is 36,000-190,000
#                                  because the intercept radius is free)
#   spanEndUT  ~ 15,886,032
#   referenceUT= max(save clock, spanEndUT) ~ 15,886,032
#   k          = ceil((15,886,032 - 15,764,032)/388,587.378) = ceil(0.3140) = 1
#   => phaseAnchorUt = relaunchUt ~ **16,152,619**
#   seam offset~   104,000        (window wait ~16,000 + transfer coast 88,108)
#   => cycle-1 seam ~ 16,152,619 + 104,000 = **16,256,619**
#      cycle-1 park ~ 16,152,619 + 120,000 = **16,272,619**   (deep in the Gilly
#                                  tail, ~2,000 s before span end - V14M's
#                                  "+20,000 into a 21,211 s recording" position,
#                                  scaled)
#   cadence    = one P (span < P), so
#      cycle-2 anchor ~ 16,152,619 + 388,587 = **16,541,206**
#      cycle-2 seam   ~ 16,645,206
#      cycle-2 park   ~ 16,661,206
#
# EVERY ONE OF THOSE IS A SEED. The span term alone carries a 5x band, so the
# seam seed can be wrong by tens of thousands of seconds - which is why this spec
# is marked NOT FLYABLE above rather than "probably fine". THE FAILURE IS
# SELF-DETECTING IN ONE DIRECTION ONLY: a jump that lands BACKWARD of the live
# clock answers `REJECTED reason=backward-jump`, which is only a WARN, so that
# token is FORBIDDEN below. A jump that lands FORWARD but at the wrong epoch
# greens while dwelling nowhere, and nothing catches it but a human reading
# `missionconfig applied:` / `startloopplayback initiated:`.
#
# (THE CALIBRATION RECIPE, V2-sense: read `phaseAnchorUt=` off `missionconfig
# applied:` and each cycle's `relaunchUt=` off `startloopplayback initiated:`.)
#
# ---------------------------------------------------------------------------------
# 4. THE DESYNC HUNT - what the second cycle is for (V6M/V14M's shape, unchanged)
# ---------------------------------------------------------------------------------
# Cycle 1 cannot show a cumulative arrival desync by definition, so this lane
# crosses cycle 1's arrival, presses "Warp to..." AGAIN (a real player action;
# mechanically `StartLoopPlayback` rebuilds the unit and resolves
# `NextLaunchAfter(now)`), and crosses cycle 2's arrival with the identical
# instrument set. Three legs, every one a MEASUREMENT and not a gate:
#   (a) does the ghost's map surface still rebind to a **Gilly-framed** orbit at
#       the cycle-2 arrival, as at cycle 1's?
#   (b) does the armed `loop-seam-teleport` Tier-C instrument raise on cycle 2
#       where it stayed silent on cycle 1?
#   (c) how far is the ghost from the parked observer at each cycle's park epoch
#       (the engine's own `engine-frame-iter [... zone= rdist=]` line)?
# With a uniform one-P cadence the geometry should repeat, exactly as V14M
# measured (no detectable desync on either cycle). WHAT IS DIFFERENT HERE is only
# the tolerance the repeat is measured against - see section 1.
#
# ---------------------------------------------------------------------------------
# 5. THE WATCH PREDICTION - AND IT INVERTS V6M/V7M/V14M's
# ---------------------------------------------------------------------------------
# Every prior loop lane predicted and measured **REJECTED**. THIS ONE PREDICTS
# **OK**, and the reason is arithmetic rather than optimism.
#
# The observer is the fixture's OWN parked craft - the player who watches a replay
# is standing where the flight ended - and at its park epoch the ghost flies that
# same recorded orbit, so the body test passes and only the separation decides.
# The measured boundary (docs/dev/todo-and-known-bugs.md ->
# WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE, the SINGLE authority) is the open
# interval **(51.5 km, 144.3 km)**: V7M ENTERED at 51,503 m with `zone=Visual` and
# was REFUSED at 144,349 / 191,497 / 198,711 m, every refusal carrying
# `zone=Beyond`. The render-zone hide is the plausible shared DRIVER of the
# refusals (the range term itself is EXCLUDED - it compares against
# `WatchEnterCutoffMeters = 300,000 m` and provably returned true at all four
# readings), and the zone boundary is `GhostVisualRangeMeters = 120,000 m`.
#
# NOW THE GEOMETRY. B24 aims its corrected arrival at a 30 km Gilly periapsis and
# MechJeb circularizes there, so the expected park is ~30 km altitude = 43,000 m
# RADIUS about a 13 km body. Two co-orbiting objects on that orbit are at most
# `2a = 86 km` apart at ANY phase:
#   max separation 86,000 m  <  120,000 m zone boundary  <  300,000 m range term
# So on the leading mechanism the ghost is `zone=Visual` at every phase and the
# conjunction has nothing left to fail on. THIS IS THE FIRST LOOP SUBJECT WHOSE
# ENTIRE ORBIT FITS INSIDE THE MEASURED BRACKET (V14M's Ike park is 2a = 340.9 km,
# V6M's Mun park 679 km, V7M's Minmus park 197 km).
#
# THREE HONEST CAVEATS, because this is the riskiest single call in the file:
#   (i) 86 km sits INSIDE the (51.5, 144.3) bracket, so a boundary at the low end
#       would still refuse at ~59% of phases. The prediction leans on the
#       MECHANISM (zone=Visual) rather than on the bracket alone.
#   (ii) The prediction is CONDITIONAL ON B24'S DELIVERED PARK. B24's window
#       admits up to 60 km altitude (73 km radius, 2a = 146 km), which is ABOVE
#       the zone boundary and would flip this verdict. RE-READ THE DELIVERED PARK
#       BEFORE FLYING THIS SPEC - it is part of the calibration pass.
#   (iii) `retry = once` does NOT absorb an unlucky phase. Both craft advance on
#       the same orbit, so the separation is a fixed per-cycle geometric fact that
#       moves only when the phase anchor does (V6M's superseded-arithmetic banner,
#       applied from the start here). A REJECTED reproduces exactly on attempt 2.
# The grammar has ONE `expect` per step, so the likelier verdict is what is
# pinned; a REJECTED lands as driver-INVALID and IS THE INTERESTING FINDING (it
# would put the real entry boundary below 86 km, or move the refusing conjunct off
# the zone hypothesis, which is a sharper reading than the four V7M points gave).
# If the step comes back INVALID, re-shape it per the finding - NEVER re-roll for
# the pinned verdict.
#
# ---------------------------------------------------------------------------------
# 6. POSTURE - READING RUN, NOTHING ARMED
# ---------------------------------------------------------------------------------
# No `gating = true` block anywhere; `[expectations.rewind]` and
# `[expectations.recordings.structure]` are DELIBERATELY ABSENT (a report-only
# block of PREDICTED numbers reads like a measurement - V14M shipped its reading
# run the same way and wrote both blocks FROM the measurement at arming). The
# recordings count is the DERIVED range {1,2}, not V14M's armed pin. `forbidden`
# carries the ERROR floor, the re-aim trio and the backward-jump guard and nothing
# else. `allowedAnomalies` is EMPTY so the Tier-C sweep MEASURES whatever this
# subject produces.
#
# THE THREE-RUN DISCIPLINE this lane owes, in order: this reading run; an armed
# re-flight after the expectations are written FROM its bytes; and one negative
# control shared with V15T (the V4/V5/V14 precedent - the pair gates through the
# one shared saveParse evaluator, so one inversion across both, not two).
# =====================================================================================
tier = "operator"
description = "NOT YET FLYABLE - CALIBRATION SEEDS (tree id + eight TimeJump UTs) pending B24-gilly-orbit's first flight and harvest; see the banner at the top of the spec. The player workflow (arm -> Warp-to -> cross the arrival -> Watch), twice over, on B24's Eve->Gilly recording. The routing is PREDICTED to be V14M's exactly (`constraints=1`, `method=single-orbital`, `zeroDrift=no`, cadence one moon period) because an orbit-rooted single-moon subject reaches that road by construction - that half is the control. What is NEW is the TOLERANCE: Gilly's SOI is 126,123 m against an orbital speed of 274-945 m/s, so tol = SOI/v_orb is 133-460 s (Ike ~3,420 s, Mun ~4,479 s), the tightest duty cycle in the stock system, tighter than Pol's. This is the first loop subject where an exact phase lock's residual is measurable at all, and the `seam-endpoint summary ... outsideSoi=` census is the instrument: a nonzero reading would mean the replayed SOI-entry point no longer sits inside the moon's SOI at the shifted epoch - the eccentric-moon failure mode the Jool research doc predicts for Bop/Pol. OBSERVED, not gated. It also inverts every prior loop lane's watch prediction: a ~30 km Gilly park puts the co-orbiting observer and ghost at most 86 km apart, inside the 120 km render-zone boundary that drives the measured refusals, so watch entry is predicted to SUCCEED."
instanceProfile = "stock-minimal"
tags = ["V15", "player-loop", "watch-mode", "loop-playback", "phase-lock", "single-orbital",
        "gilly", "eve", "same-parent", "moon", "eccentric-moon", "pending-calibration"]

[fixture]
# !!! DOES NOT EXIST YET !!! `gilly-orbit-recorded` is the planned `--keep-parsek`
# harvest of B24-gilly-orbit's produced save. Predicted payload: ONE committed
# tree, ONE recording (B24's `[expectations.recordings]` block derives the count
# and predicts 1), zero durable rows, terminal Orbiting at Gilly. The crewed
# Kerbal X upper stage starts already parked in Eve orbit at ~4,986 km,
# Hohmann-transfers to Gilly and commits in a Gilly park.
#
# THE ONE-RECORDING TOPOLOGY WILL BE THE CONTRACT, not an accident: B23 flight 1
# produced a mechanically green run whose hop was APPENDED to another tree's
# Kerbin-rooted committed recording (its seam StartRecording answered
# `already=true` onto a re-resumed committed tree), and B24 avoids that only by
# pointing at the Parsek-stripped `eve-park-kerbalx` fixture. If the harvest reads
# 2 or 8 recordings here, that defect is back - docs/dev/todo-and-known-bugs.md ->
# SEAM-STARTRECORDING-JOINS-COMMITTED-TREE. (8 is the specific number to watch
# for: it is what `eve-orbit-recorded`, the save `eve-park-kerbalx` was stripped
# from, carries.)
#
# AT HARVEST TIME, the calibration pass owes four things:
#   (1) pin the payload byte-for-byte in
#       `harness/lib/test_saveparse.py::CommittedFixtureSweepTests.RECORDED_FIXTURES`;
#   (2) substitute the tree id below and the eight TimeJump UTs (section 3);
#   (3) record the DELIVERED Gilly park - it decides the watch prediction
#       (section 5, caveat ii);
#   (4) record the INTERCEPT RADIUS off the ORBIT_SEGMENT chain - it decides this
#       lane's own tolerance (section 1).
#
# Its PARKED upper stage is the OBSERVER for both watch attempts. Also expected in
# the save, inherited and inert: the stock asteroid Ast. MII-526 and five
# `Kerbal X Debris` vessels (B16 ascent leftovers, carried through B24 unchanged).
# THE SUBJECT IS CREWED (Jebediah Kerman in the mk1-3pod) - the first crewed
# same-parent loop subject; V8's `eve-orbit-recorded` is the standing precedent
# that a crewed loop subject works end to end.
saveTemplate       = "fixtures/saves/gilly-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, measured and
  # structural rather than fixture-specific): loading a save whose own parked craft
  # is active makes the committed-tree restore path resume a promotion-stub
  # recording ~1 s into the scene, BEFORE any step can run. StopRecording is
  # idempotent-OK and DiscardTree answers OK with nothing-discarded when no plain
  # tree is live, so the pair is safe on any entry state; the SetSetting stops a
  # later one.
  #
  # AND DO NOT READ IT AS A LATCH: B23 flight 1 MEASURED the committed-restore path
  # re-arming 11 ms after DiscardTree on a save carrying a committed tree for its
  # own parked craft, which is exactly this fixture's shape. That does not hurt
  # HERE - this lane starts no recording of its own and only observes - but the
  # pair does not guarantee no recorder is live afterwards.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins, same rationale as V4/V6M/V14M: ghostRenderTracing is the
  # FLIGHT-scene raise gate for the loop-seam-teleport Tier-C instrument;
  # mapRenderTracing arms the map/TS tracer + probe (the source of the
  # `surface=Proto*` truth lines the arrival evidence is read off); verboseLogging
  # is LOAD-BEARING for both (Tier-B truth is at Verbose - the V1 lesson).
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # STEP 1 OF THE WORKFLOW: the Missions window loop checkbox (production
  # MissionStore.SetLoopEnabled). Its Info line echoes phaseAnchorUt - THE number
  # the whole bracket arithmetic is anchored to, and the first thing to read when
  # calibrating.
  # TREE ID: PLACEHOLDER pending B24's flight (banner at the top of this spec).
  { cmd = "MissionConfig", args = { tree = "00000000000000000000000000000000", loop = "true" }, expect = "OK" },
  # STEP 2: "Warp to..." -> ComputeNextRelaunchUT -> FastForwardToEventUT, an
  # INSTANTANEOUS Planetarium clock set (no rails warp to budget). CYCLE 1.
  { cmd = "StartLoopPlayback", args = { tree = "00000000000000000000000000000000" }, expect = "OK", budget = 300 },
  # CYCLE-1 ARRIVAL BRACKET, strictly forward, straddling the SEEDED Eve->Gilly SOI
  # seam 16,256,619 at -180 / -60 / +140 s (V14M's offsets, whole seconds).
  # Instantaneous, so the seam is CROSSED by the third jump rather than dwelled
  # through. CALIBRATION SEEDS - see header section 3.
  { cmd = "TimeJump", args = { ut = "16256439" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "16256559" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "16256759" }, expect = "OK", budget = 300 },
  # CYCLE-1 PARK EPOCH: phaseAnchor + 120,000, deep inside the recorded Gilly phase
  # and ~2,000 s before the span end - the only epoch where the auto-select's body
  # test can pass for a Gilly-parked observer, so the only place the watchable
  # question can be asked at all. CALIBRATION SEED.
  { cmd = "TimeJump", args = { ut = "16272619" }, expect = "OK", budget = 300 },
  # STEP 3: "Watch", auto-select over all committed recordings. PREDICTED **OK**,
  # inverting every prior loop lane - a ~30 km Gilly park puts the observer and the
  # ghost at most 2a = 86 km apart, inside the 120 km render-zone boundary that
  # drives the measured refusals. Full argument + three caveats in header section 5.
  { cmd = "EnterWatchMode",                                                  expect = "OK" },
  # STEP 4: "Warp to..." AGAIN - the desync hunt's second half. The verb rebuilds
  # the unit and resolves NextLaunchAfter(now); with `now` past cycle 1's park it
  # should land on CYCLE 2 (seeded anchor + one P = 16,541,206).
  { cmd = "StartLoopPlayback", args = { tree = "00000000000000000000000000000000" }, expect = "OK", budget = 300 },
  # CYCLE-2 ARRIVAL BRACKET, the same -180 / -60 / +140 offsets about the seeded
  # cycle-2 seam 16,645,206. Identical instrument set: whatever differs from cycle
  # 1 is the desync signal. CALIBRATION SEEDS.
  { cmd = "TimeJump", args = { ut = "16645026" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "16645146" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "16645346" }, expect = "OK", budget = 300 },
  # CYCLE-2 PARK EPOCH: the same +120,000 offset off the cycle-2 anchor.
  { cmd = "TimeJump", args = { ut = "16661206" }, expect = "OK", budget = 300 },
  # STEP 5: "Watch" again. The cadence is EXACTLY one Gilly orbital period, so the
  # cycle-2 separation should be very close to cycle 1's; same pinned verdict, and a
  # DIFFERENT verdict between the two watch steps would itself be the reading.
  { cmd = "EnterWatchMode",                                                  expect = "OK" },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# CLAIM-IS-NOT-GATE, and on a reading run the list is short for that reason.
#   D9  `fast-forward`  is gated by the PRODUCT's own `FastForwardToEventUT: jumping
#       to UT=` line (V4/V6M/V14M's precedent), NOT by the seam verb's OK - a seam
#       that reported OK without the product jumping fails it.
#   D11 `phase-lock`    is gated by the Info-level `PhaseLock APPLIED: mission=`
#       line. That token is VALUE-FREE and therefore survives EITHER outcome of the
#       routing prediction: it fires whenever `solution.ShouldPhaseLock` held,
#       whatever `method=` and `zeroDrift=` then read. If the lock does NOT apply
#       this reds - which is the correct outcome, because the claim would be false.
#   D14 `gilly` / `scene-flight` / `sandbox` are the environment axes this lane runs
#       on; `gilly` is gated by the `body=Gilly` map-render truth line below rather
#       than by the epoch alone (V14T's iteration-1 lesson, applied up front).
#
# NOT CLAIMED, DELIBERATELY:
#   D11 `zero-drift-schedule` - V6M's cell, gated there by `zeroDrift=yes` +
#       `scheduleWithinTol=yes`. This lane PREDICTS `zeroDrift=no` (one constraint,
#       so `TryBuildRelaunchSchedule` returns false on `rawCount < 2`), so claiming
#       it would be claiming the opposite of what the run is expected to measure.
#   ANY WATCH-MODE CELL - and note this lane is the first that might EARN one. V4's
#       rule is that a measured REFUSAL is not evidence of watch behaviour; a
#       measured SUCCESS would be, and header section 5 predicts one. It is still
#       not claimed HERE, because the reading has not happened: claiming coverage
#       off a prediction is exactly the error the claim-is-not-gate rule exists to
#       prevent. IT IS THE OBVIOUS ARMING CANDIDATE if the two EnterWatchMode steps
#       come back OK.
#   D11 any arrival cell - this OBSERVES an arrival epoch; it asserts no arrival
#       geometry.
#   D6 `time-jump`, and `eve` on D14 - the jumps are the instrument rather than the
#       subject, and although the recording's early ORBIT_SEGMENTs are Eve-framed
#       nothing in THIS spec's contract gates an Eve-framed render.
[dimensionsCovered]
D9  = ["fast-forward"]
D11 = ["phase-lock"]
D14 = ["gilly", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every [expectations.<sub>]
# header or TOML scopes it into the sub-table (hlib.validate_spec rejects that form).
#
# EMPTY, deliberately: the loop-seam-teleport instrument is armed with no budget so
# a raise is REPORTED as the finding it would be rather than pre-budgeted away.
# That instrument is half of the desync hunt, and on the tightest-tolerance subject
# in the suite it is the one most likely to have something to say.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir, and the planned fixture ships exactly ONE (B24's
# single-piece product - its own count block derives that). This lane starts no
# recording of its own - it arms, warps, watches and jumps - so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +1  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split. The PREDICTION IS NO
#       SPLIT. This recording has no atmospheric phase at all (it starts in orbit)
#       and its ONE body change is the Eve->Gilly seam, where section-3 rule 3 of
#       `IsSplittableEnvOrBodyBoundary` keeps a same-class Exo body change COHESIVE
#       for transfer coasts - explicitly including the OrbitalCheckpoint-framed
#       on-rails variant, which this crossing is (B24 flies the whole approach
#       under its warp clamp, never under physics). V14M MEASURED that rule firing
#       at the equivalent Duna->Ike crossing (`Split summary: rec=...
#       exoCoastBodyChangeKept=1`) and counted 1. The 2 is admitted because the
#       load-time walk fires for the FIRST time on this lane's LoadGame - B24's own
#       run commits and flushes without re-loading - so this is where it would show.
# => { min = 1, max = 2 }, a DERIVED RANGE and NOT A PIN. Re-pin from this lane's
# own reading run, the way V14M pinned 1.
count = { min = 1, max = 2 }

[expectations.logContracts]
# THE LIFECYCLE CHAIN (each the product's own line except the two seam-verb Info
# lines):
#   "missionconfig applied:"       - the arm verb ran; ALSO echoes phaseAnchorUt,
#                                    the single most important number to read when
#                                    calibrating the brackets.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired, not
#                                    just the seam.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door
#                                    and echoed the resolved relaunchUt (read this
#                                    per cycle).
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line. This is
#                                    what makes the D9 claim GATED rather than
#                                    asserted.
#   "PhaseLock APPLIED: mission="   - Info, from the builder. Gates D11
#                                    `phase-lock`, and is deliberately the
#                                    VALUE-FREE prefix so the claim does not depend
#                                    on the routing prediction being right.
#
# THE ROUTING PIN, in its VALUE-FREE half only. `Orbital\(Gilly\) same-parent` is
# required because it is what keeps Support=Supported and makes re-aim structurally
# unreachable - and because it is DERIVABLE FROM THE FIXTURE rather than from a
# flight, so requiring it costs nothing a reading run has not already established.
# V14M's sharper conjunction pin
# (`PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no`) is
# DELIBERATELY NOT required here: it is the exact thing this run is meant to
# MEASURE on a new moon, and pinning a predicted value before the reading is the
# error V14M's own header records (its pre-flight `tidal-collapse` prediction was
# REFUTED, and a spec that had required it would have red'd on a correct product).
# Add it at arming, with the measured method.
#
# THE ANTI-VACUITY / ARRIVAL PIN:
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Gilly" - a map-render TRUTH
#       line showing the ghost's proto orbit surface REBOUND onto a GILLY body
#       frame. A run that never gets the ghost to Gilly has measured nothing about
#       a Gilly arrival, and reading that as a pass is the V1/V2 vacuity failure.
#       This is the STRONG form (V14M's, not V6M's weaker
#       `Proto(Icon|OrbitLine)` which also matches a creation line); a fresh lane
#       pays nothing for it, so it starts with it.
#
# THE PROBE / LENS PRESENCE PINS, and the SECOND is this lane's whole point:
#   "faithful-parity summary sampled=\d+ overTolerance=\d+" - emitted only when the
#       per-pid parity pass touched the lens, so its PRESENCE cannot be produced by
#       a frame with no resolved ghost. `sampled=[1-9]` is NOT pinned: V6M/V14T
#       measured `sampled=0 skip.reaimed-or-foreign-seed=1` on strictly faithful
#       members and the cause is a real blind spot
#       (docs/dev/todo-and-known-bugs.md -> FAITHFUL-PARITY-SEED-FRAGMENT-REBASE).
#   "seam-endpoint summary evaluated=\d+ outsideSoi=\d+" - the PRESENCE form on
#       BOTH counters, deliberately. This is the instrument header section 2 is
#       built around, and the presence form is the honest posture for it: it
#       catches the lens going silent (which would make the whole reading vacuous)
#       WITHOUT freezing either counter's value, so a nonzero `outsideSoi` - the
#       finding this lane exists to look for - is REPORTED rather than red. V14M
#       could afford the stricter `evaluated=[1-9]` because it had already measured
#       `evaluated=1`; this lane has measured nothing yet, and a Gilly seam that
#       skips with `skip.body-mismatch` or `skip.no-cross-body-successor` at the
#       chosen epoch is a legitimate reading rather than a defect.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "PhaseLock APPLIED: mission=",
  "Orbital\\(Gilly\\) same-parent",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Gilly",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE RE-AIM FORBID TRIO - the falsifiable half of the routing claim. Each is a
  # token V4's re-aim lane either requires or guards; here every one of them
  # appearing would mean the same-parent mission took the interplanetary road,
  # which `!phaseLocked` says it cannot. Measured 0/0/0 on V14M and V14T.
  "\\[ReaimDiag\\]",
  "ENGAGED re-aim",
  "FORCED FAITHFUL",
  # THE V3C RUN-3 SELF-DETECTION GUARD, and on a lane whose jump UTs are
  # CALIBRATION SEEDS rather than measurements this is the single most load-bearing
  # forbid in the file: a refused backward jump is only a WARN, so without this
  # token a mis-seeded bracket can green while dwelling nowhere.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is
  # a rendered-vs-recorded drift, which is a defect in the RENDER rather than a
  # reading about the moon - so unlike `outsideSoi` it IS forbidden even on the
  # reading run.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

# [expectations.rewind] and [expectations.recordings.structure] ARE DELIBERATELY
# ABSENT - the V14M reading-run posture verbatim. A report-only block of PREDICTED
# numbers reads like a measurement; author both FROM this lane's own reading run at
# arming, and register them in `ARMED_ALLOWLIST` (harness/lib/test_hlib.py) with
# that run cited.

[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 8x300 TimeJump + the fast non-deferred
# verbs (2 watch attempts at the 60 s default, 6 settings/recorder verbs) + KSP
# boot + collect. Every jump is an instantaneous clock set, so the ~900 ks of game
# time costs no wall clock; V6M's identical 21-step shape measured 54 s end to end
# and V14M's measured 50 s.
budgetSeconds = 2400

[retry]
# One retry absorbs a transient seam flake. It does NOT absorb a mis-seeded anchor
# (that reproduces exactly on attempt 2, which is the point - a calibration miss
# must self-detect, not be retried away) and it does NOT absorb an unlucky watch
# geometry either, because the separation is a fixed geometric fact rather than a
# draw (header section 5, caveat iii).
policy = "once"

[expectedFail]
bugId = ""
