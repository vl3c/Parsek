# =====================================================================================
# CALIBRATED 2026-08-19 FROM THE HARVESTED BYTES. This spec shipped with
# PLACEHOLDER values (a zero tree id and eight seed jump UTs derived from B24's
# PLANNED numbers) because it was committed BEFORE its subject existed. B24-gilly-orbit
# then flew - run `2026-08-19_1655`, PASS attempt 1 - and its produced save is now the
# committed `gilly-orbit-recorded` fixture, so every placeholder has been REPLACED with
# a value read off or derived from those bytes:
#   * the tree id is `355840bc81bf45f8868b7d2508ca6de4` (the RECORDING_TREE node);
#   * the eight TimeJump UTs are derived in header section 3 from the recording's own
#     `explicitStartUT` / `explicitEndUT` / ORBIT_SEGMENT seam and the stock Gilly
#     period, with every step of the arithmetic written out.
# NOTHING ELSE MOVED: the step shape, the budgets, the expectations and the retry
# policy are exactly what was committed pre-flight, which is what keeps the pre-flight
# PREDICTIONS below falsifiable.
#
# THE CALIBRATION HELD, MEASURED ON RUN 1 (`2026-08-19_1736`, PASS attempt 1):
#   derived phaseAnchorUt 16,152,620.423  vs  product 16,152,620.3818632   (0.041 s)
#   derived seam offset      114,979.397  vs  product     114,979.43693914 (0.040 s)
#   derived P                388,587.3775 vs  product     388,587.37684793 (0.0007 s)
#   cycle-2 relaunchUt 16,541,207.758711128 = cycle 1 + exactly one P
# All eight jumps landed forward and answered OK; NO jump UT moved at arming. The 0.04 s
# residue is the same one V14M measured and comes from the product's `ut0=` reading the
# recording's start as 15,764,033.005015271 against the fixture node's
# 15,764,033.04501527.
# =====================================================================================
#
# V15M: THE PLAYER WORKFLOW ON A **SAME-PARENT TRANSFER TO AN ECCENTRIC, INCLINED,
# TINY-SOI MOON** - the first loop subject where the phase-lock TOLERANCE is small
# enough to be worth measuring.
#
# ---------------------------------------------------------------------------------
# 1. WHAT THIS LANE ADDS OVER V14M, STATED AS THE ONE THING IT IS
# ---------------------------------------------------------------------------------
# V14M flew this exact workflow on B23's Duna->Ike recording and MEASURED the
# routing (log line 10571 / 10574 of run `2026-08-18_2336`):
#
#   ExtractConstraints: tree=f55918af... members=1 launchBody=Duna
#     ut0=9160398.06 support=Supported constraints=1
#     [Orbital(Ike) same-parent P=65517.862134808071 off=17082.834318690002]
#   PhaseLock APPLIED: ... method=single-orbital cadence 21212.07->65517.86
#     fixedCadenceResidual=0 fixedCadenceWithinTol=yes zeroDrift=no
#
# The GENERAL fact that buys, propagated to
# `docs/dev/research/same-parent-reaim-jool-system.md` section 3.5: an ORBIT-ROOTED
# recording emits NO Rotation constraint (the extraction emits one for a
# SURFACE/PAD-ROOTED launch, and a recording that begins in orbit has no surface
# phase), so a park-rooted single-moon subject reaches `single-orbital` BY
# CONSTRUCTION and its phase lock is EXACT - residual literally 0, cadence one
# moon period, no schedule.
#
# THIS LANE DOES NOT RE-ASK THAT. It PREDICTS the identical routing (section 2)
# and treats it as the control. What it asks instead is the question V14M could
# not: **when the phase lock is exact, is the REPLAY still inside the moon's SOI
# at the shifted epoch?** On Mun / Minmus / Ike that question is unaskable, because
# the tolerance is thousands of seconds wide and any residual disappears into it:
#
#   body    SOI (m)      v_orb (m/s)   tol = SOI/v_orb   SOI/SMA
#   Mun     2,429,559.1      542.49        4,479 s        20.25%
#   Minmus  2,247,428.0      274.2         8,197 s        (n/a here)
#   Ike     1,049,598.9      306.9         3,420 s        32.80%
#   Bop     1,221,060.9    1,482.8           823 s         0.95%   (Jool doc)
#   Pol     1,042,138.9    1,253.2           832 s         0.58%   (Jool doc)
#   GILLY     126,123.27     509.3           248 s         0.40%
#
# Gilly's `tol` is 13.8x tighter than Ike's and its duty cycle (tol/period =
# 247.6/388,587.4 = 6.37e-4) is tighter than Pol's 9.22e-4 - the tightest in the
# stock system. AND THE ECCENTRICITY MOVES THE TOLERANCE ITSELF: Gilly's true
# orbital speed swings 274.4 m/s (apoapsis) to 945.3 m/s (periapsis), so `tol`
# swings **460 s -> 133 s** depending on WHERE in Gilly's orbit B24's encounter
# landed. That is exactly the caveat the Jool research doc attaches to every
# Bop/Pol conclusion ("`v_orb` is the circular `sqrt(mu/a)` ... for an e = 0.235
# orbit the true speed swings +-24%"), at e = 0.55.
#
# SO THIS LANE'S OWN SENSITIVITY IS SET BY B24'S FLIGHT - AND B24 HAS NOW FLOWN, so
# the number is MEASURED rather than owed. From the committed `.prec.txt` ORBIT_SEGMENT
# chain (run `2026-08-19_1655`), the transfer's last Eve-framed segments read
# `sma = 15,385,793.566 ecc = 0.618627`, i.e. an apoapsis radius of **24,903,858 m** -
# the INTERCEPT RADIUS, which sits in the upper-middle of Gilly's 14,175,000 ->
# 48,825,000 m band - 31.0% of the way up it ((24.904 - 14.175) / (48.825 - 14.175)).
# At that radius Gilly's true orbital speed is **630.0 m/s**, so:
#
#   tol = SOI / v_orb = 126,123.27 / 630.0 = **200.2 s**
#
# TIGHTER THAN THE CIRCULAR 247.6 s, and 17.1x tighter than Ike's ~3,420 s. The
# encounter landed on the FAST side of Gilly's orbit, which is the more sensitive half:
# an apoapsis-side encounter would have given 460 s. Nothing was tuned to get that - it
# is where MechJeb's transfer window put the intercept - but it means this lane is
# reading at close to the best sensitivity Gilly can offer.
#
# ---------------------------------------------------------------------------------
# 2. THE PREDICTION - the routing (control), and the open question (the reading)
# ---------------------------------------------------------------------------------
# THE ROUTING, PREDICTED AND NOT GATED. B24's recording is orbit-rooted at Eve and
# targets exactly one moon, so by V14M's measured general fact:
#
#   ExtractConstraints: tree=<B24 tree> members=1 launchBody=Eve
#     ut0=<explicitStartUT> support=Supported constraints=1
#     [Orbital(Gilly) same-parent P=388587.378... off=<seam offset>]
#   PhaseLock APPLIED: mission='<B24 mission name>' tree=<B24 tree>
#     anchor <base>-><anchor> P=388587.378... method=single-orbital
#     cadence <span>->388587.378... fixedCadenceResidual=0
#     fixedCadenceWithinTol=yes zeroDrift=no
#
#   P DERIVED FROM STOCK ELEMENTS, digits shown so the calibration pass can check
#   the product against arithmetic rather than against another log:
#     a = 31,500,000 m, mu_Eve = 8,171,730,229,210.87 m^3/s^2
#     a^3        = 3.1255875e22
#     a^3 / mu   = 3.824971e9
#     sqrt       = 61,846.35
#     x 2*pi     = 388,587.378 s
#   CADENCE: `QuantizeCadenceToMultipleOfP` takes the smallest k*P >= the raw
#   cadence, and the raw cadence is floored at the recording's SPAN. B24's span is
#   now MEASURED at 115,360.886 s (explicitEndUT 15,879,393.931458754 minus
#   explicitStartUT 15,764,033.04501527), which is 0.297 of P, so k = 1 and the
#   effective cadence is EXACTLY ONE GILLY PERIOD. Cycle N = A1 + (N-1)*P, exactly -
#   the same arithmetic progression V14M measured, for the same reason. VERIFIED
#   rather than assumed: 115,360.886 < 388,587.378, so the smallest multiple that
#   clears the span is the first one.
#
#   NOTE WHAT GILLY'S ECCENTRICITY DOES **NOT** DO, because it is easy to expect
#   the wrong thing here. A cadence of exactly one orbital period returns the moon
#   to the SAME TRUE ANOMALY whatever the eccentricity - the lock does not care
#   that the orbit is not circular. What the eccentricity changes is the SIZE OF
#   THE ERROR BUDGET (section 1) and the SPEED at which any residual translates
#   into a position error: at 945 m/s a 133-second slip walks the moon clean out
#   of its own SOI, where the same slip at Ike (307 m/s, 1,050 km SOI) moves it
#   4% of the way across.
#
# THE OPEN QUESTION, AND THE TWO INSTRUMENTS THAT ANSWER IT. Faithful playback
# replays the RECORDED trajectory verbatim - it does not re-solve the encounter -
# so the replayed SOI-entry point is a fixed body-frame position replayed at a
# shifted epoch. Two lens summaries measure whether that still lines up:
#
#   `seam-endpoint summary evaluated=N outsideSoi=M` - the census that asks, per
#     evaluated cross-body seam, whether the replayed endpoint still lies INSIDE
#     the destination SOI at the replay epoch. WHAT `outsideSoi > 0` WOULD MEAN
#     HERE: the ghost's recorded Eve->Gilly entry point is no longer within
#     126,123 m of Gilly at the re-anchored time - i.e. the replay arrives where
#     the moon USED to be. That is precisely the eccentric-moon failure mode the
#     Jool doc predicts for Bop/Pol, observed on a flyable subject for the first
#     time. All three proven moon lanes read the STRUCTURAL zero here, and V14M
#     measured `evaluated=1 outsideSoi=0` - a real measurement, at a tolerance
#     13.8x looser than this one.
#   `faithful-parity summary sampled=N overTolerance=M` - the per-pid
#     rendered-vs-recorded parity pass. A nonzero `overTolerance` is a drift
#     between what was recorded and what is being drawn, independent of the moon.
#
# MEASURED ON RUN 1, AND ARMED FROM IT: `seam-endpoint summary evaluated=1
# outsideSoi=0` at cycle 1 (line 10831), plus one benign
# `evaluated=0 outsideSoi=0 skip.body-mismatch=1` at an Eve-framed epoch (11016). The
# parity lens read `sampled=0 overTolerance=0 skip.reaimed-or-foreign-seed=1` (10830) -
# the FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot, which this spec's own pre-flight
# comment anticipated, and DIFFERENT from V14M's `sampled=1` on the identical shape.
# The census is now REQUIRED in the `evaluated=[1-9]\d* outsideSoi=0` form: a GS-3-style
# regression floor rather than a value pin for its own sake - a change that starts
# putting the replayed SOI-entry point outside the moon reds this lane and forces a
# re-read, which is precisely what this lane exists to catch.
#
# ---------------------------------------------------------------------------------
# 2b. THE INSTRUMENT GAP THIS RUN MEASURED - READ BEFORE TRUSTING THE TWO-CYCLE STORY
# ---------------------------------------------------------------------------------
# THE CYCLE-1-vs-CYCLE-2 CENSUS COMPARISON THIS LANE WAS DESIGNED AROUND IS NOT
# READABLE FROM ONE RUN AT THIS STEP PACING, and that is a MEASUREMENT rather than a
# disappointment. Run 1 emitted the seam-endpoint (and faithful-parity) summary exactly
# ONCE, at cycle 1. There is no cycle-2 summary in the log at all.
#
# THE MECHANISM, named precisely, because a coarser version of it was already FOUND AND
# FIXED and this is NOT a regression of that fix. Both summaries ride
# `ParsekLog.VerboseRateLimited(..., 5.0)`. The 2026-08-14 `line-blink-census` work
# CLASS-SPLIT the census key into `seam-endpoint-summary-measured` /
# `-skip-only` so a skip-only pass can no longer shadow a measuring one
# (docs/dev/todo-and-known-bugs.md -> SEAM-ENDPOINT-CENSUS-UNREADABLE-ON-A-SHORT-LANE),
# and THAT SPLIT IS VISIBLY WORKING HERE: this run prints BOTH classes
# (`evaluated=1 outsideSoi=0` at 10831 and `evaluated=0 ... skip.body-mismatch=1` at
# 11016). What the split deliberately did NOT change is the 5.0 s limiter WITHIN a
# class - correct for every lane that has ONE arrival, and this lane has TWO. Both
# cycles' measuring passes fall in the same class inside one window, so the second is
# dropped.
# WHY THE WINDOW IS SO EASY TO HIT HERE: the two arrival brackets are ~1.4 WALL-seconds
# apart (cycle-1 summaries at 20:37:42.015, the cycle-2 bracket at 20:37:43.4) because
# every TimeJump is an INSTANTANEOUS clock set - the 388,587 GAME-seconds between the
# cycles cost no wall time whatsoever. This is the V6M `probe frame summary is NOT
# pinnable` precedent one layer in: a per-pass summary on a per-class key is unreadable
# TWICE inside one fast-stepped run.
# MEASURED ON ALL THREE RUNS of this lane (`_1736` reading, `_1808` armed, `_1810`
# control): exactly two census lines each, byte-identically, never a cycle-2 measuring
# pass. Filed as a second case under the entry above.
#
# WHAT THAT COSTS, stated exactly: the `outsideSoi` reading below is a CYCLE-1 reading.
# The k=2 half of section 2's argument - where the error budget halves and a residual
# amplified linearly in k would first show - IS UNMEASURED. Do not read the armed
# `outsideSoi=0` token as a two-cycle result.
#
# THE OPERATOR RECOURSE, in increasing cost, for whoever wants the k=2 reading:
#   (1) SPACE THE BRACKETS. A variant inserting >5 wall-seconds (10 for margin) between
#       the cycle-1 and cycle-2 arrival brackets (RecordingState spacers are the
#       established instrument - V8 used them to re-pace a bracket for the line-blink
#       straddle) puts the second emission outside the limiter window. Cheapest, it
#       changes no measurement - only its pacing - and it costs log volume on NO other
#       lane, which is why it is preferred over a per-cycle key.
#   (2) READ THE ENGINE'S OWN PER-FRAME LINES instead of the summary. The
#       `engine-frame-iter` / map-render truth lines are emitted per ghost per cycle and
#       are what this run's 775 m -> 115.6 km separation reading came off; they carry
#       position rather than the census verdict, so this is a reconstruction rather
#       than a read.
#   (3) TWO RUNS, one per cycle, with the second lane jumping straight to the cycle-2
#       bracket. Most expensive and the least comparable, since the two runs differ in
#       more than k.
# NO PRODUCT CHANGE IS PROPOSED. The rate limiter is doing its job; what is recorded
# here is that a fast-stepped two-cycle lane cannot read a shared-key summary twice.
#
# WHAT B24'S FLIGHT SHARPENED, and it is why the CYCLE-1 vs CYCLE-2 comparison is the
# direct instrument rather than a nicety. The measured recording is:
#
#   span                     115,360.886 s
#   transfer coast (seg 1)   15,769,979.845 -> 15,876,617.870  =  106,638.025 s
#   Eve->Gilly seam          15,879,012.441954412  (offset +114,979.397 from UT0)
#   GILLY PHASE               explicitEndUT - seam  =  **381.490 s**, 0.33% of the span
#
# So 92% of this recording is ONE coast and the destination phase is SIX MINUTES - by
# far the shortest destination tail of any loop subject (V14M's Ike phase is 4,128 s,
# 10.8x longer in a recording 5.4x shorter). THE CONSEQUENCE FOR THE MEASUREMENT:
# faithful playback shifts the replayed SOI-entry EPOCH by exactly k*P and replays a
# FIXED body-frame position, so whether that position is still inside Gilly's SOI
# depends entirely on whether Gilly itself returns to the same place after k*P. It
# does IF AND ONLY IF the P the product locks to is the moon's true period; any error
# `dP` walks the moon `630.0 * k * dP` metres along its orbit, and 126,123 m of SOI
# buys only `dP < 200.2/k` seconds. AT CYCLE 2 THE BUDGET IS HALVED (k = 2), which is
# exactly why the two cycles are compared rather than one being read alone:
#
#   `seam-endpoint summary ... outsideSoi=` at CYCLE 1 vs at CYCLE 2 is the direct
#   instrument. Equal zeros = the lock is exact at this tolerance. A zero at cycle 1
#   and a nonzero at cycle 2 = a residual that is being AMPLIFIED linearly in k, which
#   is the eccentric-moon failure mode the Jool doc predicts for Bop/Pol and the
#   sharpest result this lane can produce. A nonzero at BOTH = a fixed offset rather
#   than a drift, which points at the seam extraction rather than at the period.
#
# The 381 s destination phase is ALSO what bounds where the park epoch may sit
# (section 3): there are only ~380 s of recorded Gilly coverage to place it in.
#
# ---------------------------------------------------------------------------------
# 3. THE SCHEDULE - DERIVED FROM THE HARVESTED BYTES, with every step shown
# ---------------------------------------------------------------------------------
# With no zero-drift schedule the anchor is the plain Tier-1 window snap:
#   `phaseAnchorUT = solution.NextWindowUT = NextWindow(extraction.UT0, P, referenceUT)`
#   (MissionLoopUnitBuilder.cs:386), where
#   `referenceUT = max(mission.LoopAnchorUT, spanEndUT)` (:295 + :378),
#   i.e. `phaseAnchorUT = UT0 + k*P` with `k = ceil((referenceUT - UT0)/P - 1e-9)`.
#
# THE FOUR INPUTS, ALL READ OFF THE COMMITTED `gilly-orbit-recorded` FIXTURE
# (B24 run `2026-08-19_1655`, --keep-parsek):
#   UT0        = 15,764,033.04501527   the recording's `explicitStartUT`.
#                NOT segment 0's startUT, which is 15,764,035.545015214 - a 2.500 s
#                difference, so using it would put EVERY bracket 2.5 s off. The V6M
#                convention, settled three times now: V6M's measured `Orbital(Mun)
#                same-parent ... off=` equals seam minus `explicitStartUT` exactly,
#                V14M's agreed to 0.04 s, and this fixture reproduces the same 2.5 s
#                gap between the two candidates.
#   spanEndUT  = 15,879,393.931458754  the recording's `explicitEndUT`
#   save UT    = 15,879,396.751458691  the produced save's FLIGHTSTATE `UT` (the loop
#                is armed on the first frames after LoadGame, so LoopAnchorUT ~ this)
#   seam       = 15,879,012.441954412  the adjacent `endUT == startUT` BODY-CHANGE
#                pair in the `.prec.txt` ORBIT_SEGMENT chain (seven segments, Eve 0-3
#                then Gilly 4-6). The product should echo the offset as
#                `Orbital(Gilly) same-parent ... off=114979.397`.
#
# THE ARITHMETIC:
#   P            = 2*pi*sqrt(31,500,000^3 / 8.1717302e12)
#                    a^3 = 3.1255875e22 ; /mu = 3.824971e9 ; sqrt = 61,846.35
#                = 388,587.377542 s
#   span         = 15,879,393.931458754 - 15,764,033.04501527 = 115,360.886443 s
#   seam offset  = 15,879,012.441954412 - 15,764,033.04501527 = 114,979.396939 s
#   Gilly phase  = span - seam offset                          =     381.489504 s
#   referenceUT  = max(15,879,396.751459 , 15,879,393.931459)  = 15,879,396.751459
#   k            = ceil((15,879,396.751459 - 15,764,033.045015)/388,587.377542 - 1e-9)
#                = ceil(0.296880) = 1
#   phaseAnchorUt= 15,764,033.045015 + 388,587.377542 = **16,152,620.422558**
#   cadence      = QuantizeCadenceToMultipleOfP(raw floored at span 115,360.886)
#                = 1 * P = 388,587.377542   (VERIFIED: span/P = 0.297, so the first
#                  multiple already clears it; k = 1, cycle N = A1 + (N-1)*P exactly)
#
# THE JUMP TABLE, and every value in `steps` below is one of these rounded to the
# nearest whole second (V14M's convention):
#
#   cycle-1 anchor (relaunchUt)  16,152,620.423
#   cycle-1 seam   anchor + 114,979.397  = 16,267,599.819
#     bracket -180 / -60 / +140          = 16,267,419.819 / 16,267,539.819 / 16,267,739.819
#                                        -> 16267420 / 16267540 / 16267740
#   cycle-1 park   anchor + 115,249.110  = 16,267,869.533  -> 16267870
#   cycle-2 anchor cycle-1 + one P       = 16,541,207.800
#   cycle-2 seam   anchor + 114,979.397  = 16,656,187.197
#     bracket -180 / -60 / +140          -> 16656007 / 16656127 / 16656327
#   cycle-2 park   anchor + 115,249.110  = 16,656,456.911  -> 16656457
#
# WHERE THE PARK OFFSET COMES FROM, because it is the one value with a judgement in
# it. The destination phase is only 381.490 s long (section 2), so there is no
# `+20,000 into a 21,211 s recording` room here. The offset places the epoch 70.7% of
# the way through the Gilly phase - V14M's own fraction (its park sat 2,917 s into a
# 4,128 s Ike phase) - i.e. seam + 269.71 s, which lands in the PARKED TAIL: the last
# ORBIT_SEGMENT ends at seam + 170.29 s and the recording runs 211.20 s past it, so
# everything after seam + 170 is the held park. It is also 111.8 s clear of the
# recording's end, so the ghost is still inside its own span.
#
# WHAT IS STILL DERIVED RATHER THAN OBSERVED, and it is the whole reason run 1 is a
# CALIBRATION RUN: `phaseAnchorUt` and the cadence are computed here from the
# recording's bytes and the stock elements, not read from a product line. V14M's
# equivalent derivation held to 0.04 s against the product's own value, which is
# encouraging and is not a guarantee. THE FAILURE IS SELF-DETECTING IN ONE DIRECTION
# ONLY: a jump that lands BACKWARD of the live clock answers `REJECTED
# reason=backward-jump`, which is only a WARN, so that token is FORBIDDEN below. A
# jump that lands FORWARD but at the wrong epoch greens while dwelling nowhere, and
# nothing catches it but a human reading the two echo lines.
#
# (THE RE-PIN RECIPE, V2-sense: read `phaseAnchorUt=` off `missionconfig applied:`
# and each cycle's `relaunchUt=` off `startloopplayback initiated:`. If either differs
# from the derived value by more than a second, re-pin the whole table from it - the
# offsets above are all relative to the anchor, so one substitution fixes eight jumps.)
#
# ---------------------------------------------------------------------------------
# 4. THE DESYNC HUNT - what the second cycle is for (V6M/V14M's shape, unchanged)
# ---------------------------------------------------------------------------------
# Cycle 1 cannot show a cumulative arrival desync by definition, so this lane
# crosses cycle 1's arrival, presses "Warp to..." AGAIN (a real player action;
# mechanically `StartLoopPlayback` rebuilds the unit and resolves
# `NextLaunchAfter(now)`), and crosses cycle 2's arrival with the identical
# instrument set. Three legs, every one a MEASUREMENT and not a gate:
#   (a) does the ghost's map surface still rebind to a **Gilly-framed** orbit at
#       the cycle-2 arrival, as at cycle 1's?
#   (b) does the armed `loop-seam-teleport` Tier-C instrument raise on cycle 2
#       where it stayed silent on cycle 1?
#   (c) how far is the ghost from the parked observer at each cycle's park epoch
#       (the engine's own `engine-frame-iter [... zone= rdist=]` line)?
# MEASURED ON RUN 1, AND (c) IS THE SURPRISE. The engine's own per-frame line at each
# park epoch reads:
#   cycle-1 park (line 11247)  `zone=Physics rdist=775m`
#   cycle-2 park (line 12147)  `zone=Visual  rdist=115640m`
# i.e. the ghost sits 775 METRES from the parked observer at cycle 1 and 115.6 KM at
# cycle 2. THAT IS NOT A GHOST-vs-MOON DESYNC and must not be read as one: it is the
# CO-ORBITAL PHASE walking, and it is expected arithmetic. The loop cadence is one
# GILLY period (388,587 s); the observer's own Gilly park has a period of ~17,244 s and
# Gilly's rotation is 28,255 s, and neither is commensurate with the cadence - so the
# observer is at a different point in its own orbit each time the ghost is replayed.
# V6M's "the separation is not a draw" banner, now measured at scale: it is a fixed
# per-cycle geometric fact, it moves only when the phase anchor does, and a retry
# reproduces it exactly.
# (a) HELD ON BOTH CYCLES: the `phase=body-orbit ... body=Gilly` rebind fired twice, one
#     per cycle, both on the `from=[Eve|15385794|0.6186]` body-frame flip.
# (b) SILENT ON BOTH: `anomalySweep hits=[] hitCounts={}` with ghostRenderTracing armed
#     across both cycles - no `loop-seam-teleport` raise.
# WHAT IS STILL UNMEASURED is the census half of the comparison - see section 2b. The
# separation walk above is a POSITION reading, not an outsideSoi reading, and the two
# must not be conflated.
#
# ---------------------------------------------------------------------------------
# 5. THE WATCH PREDICTION - AND IT INVERTS V6M/V7M/V14M's
# ---------------------------------------------------------------------------------
# Every prior loop lane predicted and measured **REJECTED**. THIS ONE PREDICTS
# **OK**, and the reason is arithmetic rather than optimism.
#
# The observer is the fixture's OWN parked craft - the player who watches a replay
# is standing where the flight ended - and at its park epoch the ghost flies that
# same recorded orbit, so the body test passes and only the separation decides.
# The measured boundary (docs/dev/todo-and-known-bugs.md ->
# WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE, the SINGLE authority) is the open
# interval **(51.5 km, 144.3 km)**: V7M ENTERED at 51,503 m with `zone=Visual` and
# was REFUSED at 144,349 / 191,497 / 198,711 m, every refusal carrying
# `zone=Beyond`. The render-zone hide is the plausible shared DRIVER of the
# refusals (the range term itself is EXCLUDED - it compares against
# `WatchEnterCutoffMeters = 300,000 m` and provably returned true at all four
# readings), and the zone boundary is `GhostVisualRangeMeters = 120,000 m`.
#
# NOW THE GEOMETRY, AND IT IS NO LONGER A PREDICTION ABOUT THE PARK. B24 flew and
# delivered a **27,024 x 26,321 m** Gilly park (ecc 0.009), i.e. a semi-major axis of
# 26,672.5 m of altitude = **39,672.5 m of RADIUS** about a 13 km body - lower than
# the ~30 km this lane pre-registered against, which moves the call the SAFE way. Two
