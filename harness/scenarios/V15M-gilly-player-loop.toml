[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir, and the committed fixture ships exactly ONE
# (77f724bb1d4844c3b132a1ccc00a7df3.prec - B24 flew its hop as one piece, as its own
# count block derived and its flight then measured). This lane starts no
# recording of its own - it arms, warps, watches and jumps - so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +1  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split. The PREDICTION IS NO
#       SPLIT. This recording has no atmospheric phase at all (it starts in orbit)
#       and its ONE body change is the Eve->Gilly seam, where section-3 rule 3 of
#       `IsSplittableEnvOrBodyBoundary` keeps a same-class Exo body change COHESIVE
#       for transfer coasts - explicitly including the OrbitalCheckpoint-framed
#       on-rails variant, which this crossing is (B24 flies the whole approach
#       under its warp clamp, never under physics - and B24's own run confirmed the
#       shape: seven ORBIT_SEGMENTs, Eve 0-3 then Gilly 4-6, with segment 1 a single
#       106,638 s rails coast). V14M MEASURED that rule firing
#       at the equivalent Duna->Ike crossing (`Split summary: rec=...
#       exoCoastBodyChangeKept=1`) and counted 1. The 2 is admitted because the
#       load-time walk fires for the FIRST time on this lane's LoadGame - B24's own
#       run commits and flushes without re-loading - so this is where it would show.
# => the pre-flight window was { min = 1, max = 2 }, a derived range.
#
# MEASURED 1, AND THE PREDICTION'S REASON WAS CONFIRMED RATHER THAN ONLY ITS VALUE.
# Reading run `2026-08-19_1736` counted 1, and the optimizer said WHY in its own words
# at log line 10139:
#   Split summary: rec=77f724bb... evaluated=1 grazeForward=0 grazeBackward=0
#     surfaceGrazeForward=0 surfaceGrazeBackward=0 seamSkipped=0
#     exoCoastBodyChangeKept=1 splittableButRejected=0
# `exoCoastBodyChangeKept=1` is section-3 rule 3 firing at the Eve->Gilly crossing: the
# LOAD-TIME pass evaluated exactly one boundary and KEPT IT COHESIVE - the same answer
# V14M got at Duna->Ike, now at a second body pair. That token is REQUIRED below so the
# answer cannot silently regress into a split.
# PINNED EXACTLY AT 1: a 2 means the cohesion rule stopped firing (or a promotion stub
# survived the StopRecording/DiscardTree pair), and a 0 means the fixture lost its
# recording. Both are findings, which is what a tight window is for.
count = { min = 1, max = 1 }

[expectations.logContracts]
# THE LIFECYCLE CHAIN (each the product's own line except the two seam-verb Info
# lines):
#   "missionconfig applied:"       - the arm verb ran; ALSO echoes phaseAnchorUt,
#                                    the single most important number to read when
#                                    calibrating the brackets.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired, not
#                                    just the seam.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door
#                                    and echoed the resolved relaunchUt (read this
#                                    per cycle).
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line. This is
#                                    what makes the D9 claim GATED rather than
#                                    asserted.
#   "PhaseLock APPLIED: mission="   - Info, from the builder. Gates D11
#                                    `phase-lock`, and is deliberately the
#                                    VALUE-FREE prefix so the claim does not depend
#                                    on the routing prediction being right.
#
# THE ROUTING PINS, ARMED 2026-08-19 OFF THIS LANE'S OWN READING RUN. Every one was
# grepped against `results/2026-08-19_1736_V15M-gilly-player-loop_shots/KSP.log` in its
# EXACT regex form before being written here; the match count is quoted per token so a
# future reader can tell a thin pin from a fat one.
#   "Orbital\(Gilly\) same-parent"  (4) - the extraction classified the destination as
#       a direct child of the launch body, which is what keeps Support=Supported and
#       makes re-aim structurally unreachable. MEASURED line:
#       `ExtractConstraints: tree=355840bc... members=1 launchBody=Eve
#        ut0=15764033.005015271 support=Supported constraints=1
#        [Orbital(Gilly) same-parent P=388587.37684792886 off=114979.43693914078]`
#   "support=Supported"            (8) - and it was NOT demoted.
#   "PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no"  (4) - ONE regex
#       over ONE line, deliberately, rather than three independent presence checks. It
#       pins the whole routing verdict as a conjunction: the lock APPLIED, it took the
#       SINGLE-CONSTRAINT road, and it built NO zero-drift schedule. Three separate
#       tokens would pass on a log carrying them on three different lines.
#       THE PRE-FLIGHT POSTURE IS DISCHARGED BY THIS ARMING, and the reason it was
#       deferred is worth keeping: this token was DELIBERATELY NOT required on the
#       reading run, because `method=` was the exact thing the run existed to MEASURE
#       on a new moon and V14M's own header records what pre-pinning a predicted method
#       costs (its `tidal-collapse` prediction was REFUTED). The prediction held this
#       time - MEASURED line 10598:
#       `PhaseLock APPLIED: mission='Kerbal X' tree=355840bc...
#        anchor 15879398.351458656->16152620.3818632 P=388587.37684792886
#        method=single-orbital cadence 115362.42644345015->388587.37684792886
#        fixedCadenceResidual=0 fixedCadenceWithinTol=yes zeroDrift=no`
#       - so it is armed FROM the measurement, which is the only order that is honest.
#   "factory chain ... reaimed=False"  (2) - the RENDER-side mode pin, the exact
#       inversion of V5's `reaimed=True`: what the map pipeline assembled is the
#       faithful chain, not a re-aimed one. MEASURED `phases=7`,
#       `window=[15764033.0,15879395.4]`, `faithfulFallback=False` - i.e. faithful by
#       ROUTE rather than by fallback, which is the stronger reading.
# THE ANTI-VACUITY / ARRIVAL PIN:
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Gilly"  (2, one per cycle) - a
#       map-render TRUTH line showing the ghost's proto orbit surface REBOUND onto a
#       GILLY body frame. A run that never gets the ghost to Gilly has measured nothing
#       about a Gilly arrival, and reading that as a pass is the V1/V2 vacuity failure.
#       This is the STRONG form (V14M's, not V6M's weaker `Proto(Icon|OrbitLine)` which
#       also matches a creation line). MEASURED twice, once per cycle, both on the
#       body-frame flip `from=[Eve|15385794|0.6186]` at the seam crossing - structural,
#       and it is what proves BOTH cycles reached Gilly.
# THE COHESION PIN:
#   "Split summary: rec=\w+ .*exoCoastBodyChangeKept=1"  (1) - the LOAD-TIME optimizer
#       evaluated the Eve->Gilly boundary and KEPT IT COHESIVE (section-3 rule 3,
#       same-class Exo body change on a transfer coast). This is where B24 handed the
#       question off: its own run commits and flushes without re-loading, so this
#       lane's LoadGame is the first load-time evaluation the crossing ever gets. It
#       came back cohesive, exactly as at Duna->Ike, and is required so the answer
#       cannot silently regress into a split - the recordings count would move too, but
#       the count cannot say WHY and this token can.
# THE PROBE / LENS PINS, and the SECOND is this lane's whole point:
#   "faithful-parity summary sampled=\d+ overTolerance=\d+"  (1) - the PRESENCE form,
#       emitted only when the per-pid parity pass touched the lens, so it cannot be
#       produced by a frame with no resolved ghost. `sampled=[1-9]` is DELIBERATELY NOT
#       pinned: this lane measured `sampled=0 skip.reaimed-or-foreign-seed=1` - the
#       SAME blind spot V6M/V14T read and DIFFERENT from V14M's `sampled=1` on the same
#       shape (docs/dev/todo-and-known-bugs.md -> FAITHFUL-PARITY-SEED-FRAGMENT-REBASE).
#       The spec's own pre-flight comment anticipated exactly this skip form, so the
#       arming pins what these bytes show rather than what V14M's showed. Note the
#       `overTolerance=0` variant would ALSO match here (count 1) and is deliberately
#       NOT used: the zero is already guarded from the other side by the forbid below,
#       and a required-plus-forbidden pair on the same counter is one obligation too
#       many.
#   "seam-endpoint summary evaluated=[1-9]\d* outsideSoi=0"  (1) - THE HEADLINE PIN,
#       and the one place this lane deliberately arms a VALUE rather than a presence.
#       It says: at least one seam-endpoint evaluation actually MEASURED (rather than
#       skipped), and every endpoint it measured was still INSIDE Gilly's SOI at the
#       re-anchored epoch. That is the phase-lock claim in its falsifiable form at the
#       tightest tolerance in the stock system (200.2 s), and it is a GS-3-style
#       regression floor: a change that starts putting the replayed SOI-entry point
#       outside the moon reds THIS LANE and forces a re-read, which is exactly what
#       arming is for. MEASURED at cycle 1 (line 10831). CAREFUL - the same run also
#       emits a benign `seam-endpoint summary evaluated=0 outsideSoi=0
#       skip.body-mismatch=1` at an Eve-framed epoch (line 11016); the regex matches
#       the MEASURING line and ignores the skip-only one, and the skip-only form is
#       deliberately NOT forbidden.
#       READ THE CENSUS LIMITATION IN HEADER SECTION 2 BEFORE STRENGTHENING THIS.
#       The cycle-1-vs-cycle-2 comparison this lane was designed around is NOT
#       readable from one run at this step pacing - the shared rate-limiter swallows
#       the cycle-2 summary - so this token is a floor on the cycle-1 reading and must
#       not be mistaken for a two-cycle result.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "Orbital\\(Gilly\\) same-parent",
  "support=Supported",
  "PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no",
  "factory chain rec=\\w+ idx=\\d+ inst=\\d+ phases=\\d+ reaimed=False",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Gilly",
  "Split summary: rec=\\w+ .*exoCoastBodyChangeKept=1",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=[1-9]\\d* outsideSoi=0",
]
# V14M'S FULL SIX, armed 2026-08-19. Every one measured ZERO on the reading run.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE RE-AIM FORBID TRIO - the falsifiable half of the routing claim. Each is a
  # token V4's re-aim lane either requires or guards; here every one of them
  # appearing would mean the same-parent mission took the interplanetary road,
  # which `!phaseLocked` says it cannot. Measured 0/0/0.
  "\\[ReaimDiag\\]",
  "ENGAGED re-aim",
  "FORCED FAITHFUL",
  # THE V3C RUN-3 SELF-DETECTION GUARD, and on a lane whose eight jump UTs are DERIVED
  # from the fixture's bytes rather than read off a product line this is the single
  # most load-bearing forbid in the file: a refused backward jump is only a WARN, so
  # without this token a mis-derived bracket can green while dwelling nowhere. Measured
  # 0 - all eight jumps landed forward, and the derived anchor agreed with the
  # product's own `16152620.3818632` to 0.041 s.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a defect in the RENDER rather than a reading
  # about the moon. Measured `sampled=0 overTolerance=0`.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# ARMED 2026-08-19 (the V2/B17/V4/V14M arming discipline) off this lane's OWN reading
# run `2026-08-19_1736` (PASS attempt 1), whose saveParse REPORT measured
# rewindPoints=0, supersedeRows=0, tombstones=0, rewindRetirements=0 - every window
# below already met, so the arming re-pinned nothing and moved no verdict. The claim
# being armed is V4/V6M/V14M's on a new axis: a pure replay-observation workflow (arm
# -> warp -> watch -> two cycles of forward jumps) must author NOTHING durable, and a
# future change that starts writing an RP / supersede row / tombstone out of it reds
# here instead of passing as a REPORT footnote.
#
# NOTE THIS LANE DECLARED NO SUCH BLOCK BEFORE, which is the one way its arming is not
# a pure `gating` flip: the reading run shipped with neither save-structure block,
# because a report-only block of PREDICTED numbers reads like a measurement. The
# windows below are therefore written FROM the measurement, not flipped onto it.
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# ARMED 2026-08-19, same reading run, which measured trees=1, committedTrees=1,
# recordings=1, terminalStates {Orbiting: 1}, branchPoints {} - i.e. exactly one
# committed tree survives the workflow: the scene-entry promotion stub never commits,
# and the StopRecording/DiscardTree pair leaves nothing behind.
#
# `trees` keeps V2's max = 2 - the documented duplicate-tree writer hazard (OnSave
# re-writes a still-active tree on ~3% of production saves) - deliberately WIDER than
# the single measurement rather than pinned to it. Everything else is pinned at the
# measured value, and `recordings = {1,1}` is doing double duty: it is also the FIXTURE
# CONTRACT (see [fixture] - a 2 or 8 would mean B23 flight 1's seam-StartRecording
# defect was back).
#
# NOT armed here: `[expectations.recordings] count`, which is a separate already-gating
# window, and the points facets, which this lane never declared.
gating = true
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1 } }


[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 8x300 TimeJump + the fast non-deferred
# verbs (2 watch attempts at the 60 s default, 6 settings/recorder verbs) + KSP
# boot + collect. Every jump is an instantaneous clock set, so the ~900 ks of game
# time costs no wall clock; V6M's identical 21-step shape measured 54 s end to end
# and V14M's measured 50 s.
budgetSeconds = 2400

[retry]
# One retry absorbs a transient seam flake. It does NOT absorb a mis-derived anchor
# (that reproduces exactly on attempt 2, which is the point - a calibration miss
# must self-detect, not be retried away) and it does NOT absorb an unlucky watch
# geometry either, because the separation is a fixed geometric fact rather than a
# draw (header section 5, caveat iii).
policy = "once"

[expectedFail]
bugId = ""
