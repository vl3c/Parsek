[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, measured and
  # structural rather than fixture-specific): loading a save whose own parked craft
  # is active makes the committed-tree restore path resume a promotion-stub
  # recording ~1 s into the scene, BEFORE any step can run. StopRecording is
  # idempotent-OK and DiscardTree answers OK with nothing-discarded when no plain
  # tree is live, so the pair is safe on any entry state; the SetSetting stops a
  # later one.
  #
  # AND DO NOT READ IT AS A LATCH: B23 flight 1 MEASURED the committed-restore path
  # re-arming 11 ms after DiscardTree on a save carrying a committed tree for its
  # own parked craft, which is exactly this fixture's shape. That does not hurt
  # HERE - this lane starts no recording of its own and only observes - but the
  # pair does not guarantee no recorder is live afterwards.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins, same rationale as V4/V6M/V14M: ghostRenderTracing is the
  # FLIGHT-scene raise gate for the loop-seam-teleport Tier-C instrument;
  # mapRenderTracing arms the map/TS tracer + probe (the source of the
  # `surface=Proto*` truth lines the arrival evidence is read off); verboseLogging
  # is LOAD-BEARING for both (Tier-B truth is at Verbose - the V1 lesson).
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # STEP 1 OF THE WORKFLOW: the Missions window loop checkbox (production
  # MissionStore.SetLoopEnabled). Its Info line echoes phaseAnchorUt - THE number
  # the whole bracket arithmetic is anchored to, and the first thing to read when
  # calibrating.
  # TREE ID: B24's committed tree, read off the harvested fixture's RECORDING_TREE.
  { cmd = "MissionConfig", args = { tree = "355840bc81bf45f8868b7d2508ca6de4", loop = "true" }, expect = "OK" },
  # STEP 2: "Warp to..." -> ComputeNextRelaunchUT -> FastForwardToEventUT, an
  # INSTANTANEOUS Planetarium clock set (no rails warp to budget). CYCLE 1.
  { cmd = "StartLoopPlayback", args = { tree = "355840bc81bf45f8868b7d2508ca6de4" }, expect = "OK", budget = 300 },
  # CYCLE-1 ARRIVAL BRACKET, strictly forward, straddling the DERIVED Eve->Gilly SOI
  # seam 16,267,599.819 at -180 / -60 / +140 s (V14M's offsets, whole seconds).
  # Instantaneous, so the seam is CROSSED by the third jump rather than dwelled
  # through. DERIVED FROM THE HARVESTED BYTES - see header section 3 for the full
  # arithmetic and the jump table these three come from.
  { cmd = "TimeJump", args = { ut = "16267420" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "16267540" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "16267740" }, expect = "OK", budget = 300 },
  # CYCLE-1 PARK EPOCH: phaseAnchor + 115,249.110, deep inside the recorded Gilly
  # phase - the only epoch where the auto-select's body test can pass for a
  # Gilly-parked observer, so the only place the watchable question can be asked at
  # all. DERIVED: 70.7% into the MEASURED 381.490 s Gilly phase and 111.8 s clear of
  # the recording's end. There is no more room than that - the destination tail is six
  # minutes long.
  { cmd = "TimeJump", args = { ut = "16267870" }, expect = "OK", budget = 300 },
  # STEP 3: "Watch", auto-select over all committed recordings. PINNED **OK**, inverting
  # every prior loop lane: the DELIVERED 27,024 x 26,321 m park puts the observer and the
  # ghost at most 2a = 79,345 m apart, 1.51x inside the 120 km render-zone boundary that
  # drives the measured refusals. MEASURED: a GENUINE ENTRY (`enterwatchmode complete:`)
  # at a 775 m separation - the suite's second ever, after V7M's. Full argument + the two
  # remaining caveats in header section 5.
  { cmd = "EnterWatchMode",                                                  expect = "OK" },
  # STEP 4: "Warp to..." AGAIN - the desync hunt's second half. The verb rebuilds
  # the unit and resolves NextLaunchAfter(now); with `now` past cycle 1's park it
  # should land on CYCLE 2 (derived anchor + one P = 16,541,207.800).
  { cmd = "StartLoopPlayback", args = { tree = "355840bc81bf45f8868b7d2508ca6de4" }, expect = "OK", budget = 300 },
  # CYCLE-2 ARRIVAL BRACKET, the same -180 / -60 / +140 offsets about the derived
  # cycle-2 seam 16,656,187.197. Identical instrument set: whatever differs from
  # cycle 1 is the desync signal - and the `seam-endpoint ... outsideSoi=` reading
  # HERE against cycle 1's is this lane's headline comparison (header section 2).
  { cmd = "TimeJump", args = { ut = "16656007" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "16656127" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "16656327" }, expect = "OK", budget = 300 },
  # CYCLE-2 PARK EPOCH: the same +115,249.110 offset off the cycle-2 anchor.
  { cmd = "TimeJump", args = { ut = "16656457" }, expect = "OK", budget = 300 },
  # STEP 5: "Watch" again - and READ WHAT IT ACTUALLY MEASURES, which is not a second
  # entry. It answers `enterwatchmode already-watching`, i.e. watch mode SURVIVED the
