(total=2 passed=2) with ONE unmet token - the adoption path, now re-pinned to the measured alternation because this cell undocks mid-recording and the split reaches the shared helper before the stop flush does. It ALSO retired the produced-save instrument: neither cell recording id is in the produced save at all (2026-09-02_1622 collection), because both cells restore the batch flight baseline and the run ends on save-suppressed - so ROUTE_ORIGIN_PROOF=0 there is campaign isolation, not a serialization gap, and the headless tree-record-codec round trip confirms the node is written and read back. Persistence is now pinned by the in-cell StartDockedOriginPersist: token instead. No tally moves: no [InGameTest] attribute changed, total=2 stands. PRIOR: FLOWN TWICE. Flight 2 (2026-09-02_1027) PARSEK-FAIL(results) again but with the failure RESHAPED and located: both instrument lines emitted exactly as predicted (subject proofCaptured=True originPid=313889796 body=Kerbin surface=1 windows=1 treeProof=no; StartDockedOriginForward: treeRecordingWithProof=<none>; control unchanged), then the cell died 20 ms later on a bare NRE with no site, because InGameTestRunner records only ex.Message. THE SITE WAS A RIG LEFTOVER, not a product fault: the RunAnalysisAndPass detail: argument still dereferenced the tree-lookup result (proof.StartDockedOriginVesselPid), which is null BY CONSTRUCTION while ROUTE-ORIGIN-PROOF-NEVER-REACHES-A-TREE-RECORDING stands - a survivor of the version that asserted the read-back. It now reports recordedPid / treeProof instead. Two hardenings came with it so a next failure names itself: the post-measurement tail is wrapped in a try/catch that Warn-logs a RouteDockCapture FAILURE SITE: line carrying the exception type, message and first stack frame before rethrowing, and RunAnalysisAndPass re-derives its tree handle from the live active tree (a cell that splits twice can outlive the handle bound at StartRecordingAndWait) and names a null tree instead of dereferencing it. The produced save's ROUTE_ORIGIN_PROOF count was 0 on both H56 and H57, corroborating the forwarding defect from the save side. RE-FLY PENDING. Flight 1 (2026-09-02_1005) PARSEK-FAIL(results) - total=2 passed=1 failed=1: the NEGATIVE CONTROL passed with the exact expected line, and the SUBJECT red on its read-the-proof-back-off-a-committed-recording assertion, which is a real PRODUCT finding (ROUTE-ORIGIN-PROOF-NEVER-REACHES-A-TREE-RECORDING: the proof is produced and attached to FlightRecorder.CaptureAtStop, and in always-tree mode nothing forwards it onto a Recording). The subject cell now asserts the descriptor off the producer's own captured line and REPORTS what the tree holds; the forwarding defect is filed, not papered over. AUTHORED 2026-09-02. Tier B item 4, the start-docked origin subject, self-provisioned instead of hand-flown: two RouteStartDockedOrigin cells over the LANDED rover-route-recorded host. Cell 1 docks a spawned partner rig into the active vessel with NO recording running, starts the recording docked (the start-docked origin producer's only live entry point), asserts RouteOriginProof captured, undocks the depot, then docks a SECOND partner and delivers LiquidFuel across a real window - and after the stop asserts the M1 endpoint descriptor - a real body name and surface=1, so the origin endpoint gets its proximity rebuild - off the PRODUCER'S OWN RouteOriginProof captured: line plus the seam-scan pairing, and REPORTS what the tree holds through a StartDockedOriginForward: line rather than asserting it (flight 1 red on that read-back, and the caller set says the proof never reaches a Recording in always-tree mode - ROUTE-ORIGIN-PROOF-NEVER-REACHES-A-TREE-RECORDING). Cell 2 is the negative control that makes cell 1 mean something: the same rig docks and UNDOCKS before the start, so the node keeps its vesselInfo but its partner part is on another vessel, and IsSettledDockSeam's partner-resolves conjunct must reject it (outcome=no-external-coupling). THE CAVEAT: the cells couple with a raw Part.Couple, which writes no docking-node bookkeeping, so each stamps it first from the decompiled DockToVessel contract - half this gate is a stock-contract emulation, and what it buys is the whole LIVE producer path (walk parts, find the node, resolve the partner on this vessel, build the merged-vessel candidate, populate the descriptor and manifests, forward through BuildCaptureRecording across an undock split), which no headless test can drive. The host is landed because the resolver short-circuits on PRELAUNCH before it walks candidates, which is why H55's pad rig could never reach this branch. total=2 is attribute-exact and source-synced; passed=/skipped= are a regex class until the first census, registered in IsolatedBatchWiringGroupTests.INTERIM_PIN_IDS; failed=0 is a literal. The recordings count is pinned exactly at the staged 5, the anti-data-loss floor and the campaign-isolation ceiling in one row, measured on these bytes by RVR-1 on both its flights."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "isolated-batch", "logistics", "route", "dock", "origin-proof",
        "tier-b", "landed", "recorded-fixture", "H57"]

[fixture]
# `rover-route-recorded`, the RVR harvest, shared with RVR-1 / RVR-2 / RVR-3 / H56 and
# stamped into career for RVR-4. Full provenance lives in
# `harness/lib/test_saveparse.py::RECORDED_FIXTURES` and
# `harness/tools/build_rover_route_recorded.py`; only what THIS lane needs is restated.
#
# WHAT THE TWO CELLS NEED OF IT, read off their shared preconditions
# (`CellContext.Begin`, inherited whole from the `RouteDockCapture` family):
#   * a live `ParsekFlight` and a loaded+unpacked ACTIVE VESSEL to spawn beside and
#     couple into. `B` is a 17-part LANDED rover, `type = Rover`, active vessel index 7.
#   * NOT an EVA kerbal, and NOT landed within 5 degrees of a pole. The Runway sits at
#     latitude ~0.0055 degrees.
#   * NOT PRELAUNCH - and this one is a REQUIREMENT of this lane rather than of the
#     shared rig. `sit = LANDED` is what makes the Captured branch reachable at all.
#   * a part on the ACTIVE vessel carrying a `LiquidFuel` RESOURCE with positive amount,
#     because cell 1 delivers 20 units from it. `B` carries ONE tank at 102.4 / 400.
# NO INVENTORY REQUIREMENT: neither cell moves a stored cargo item, so the `evaChute` /
# `evaScienceKit` question that shapes H56's skip hypothesis does not arise here.
#
# The PARTNER side is entirely self-provisioned (`probeCoreOcto2.v2`, `dockingPort2`,
# `fuelTank` - stock-install properties already proven to resolve on `stock-minimal` by
# H55 flight 1), so nothing here asks the shared fixture to change, which matters: the
# committed lanes that boot these exact bytes are pinned by RoverRouteSpecFixtureSyncTests.
#
# `injectedRecordings = "none"` is REQUIRED rather than chosen: the corpus is carried by
# the TEMPLATE, so injecting on top would make the pinned count un-attributable.
saveTemplate       = "fixtures/saves/rover-route-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
# THE PROLOGUE IS H56's, WHICH IS RVR-1's, step for step and arg for arg - the same host
# needs the same prologue. The KILL TRIPLE is load-bearing: this save carries TWO
# committed trees and the committed-tree restore path resumes a promotion-stub recording
# roughly 1 s into the scene, BEFORE any step can run. `StopRecording` is idempotent-OK
# and `DiscardTree` answers OK with nothing-discarded when no plain tree is live, so the
# pair is safe on any entry state; the `SetSetting` stops a later one.
#
# autoRecordOnLaunch=false matters doubly here. Both cells spawn vessels and drive
# couples, and BOTH start a recording of their own at a moment they choose - an
# auto-record firing first would put a tree in front of the producer and destroy the one
# measurement this lane exists for.
#
# verboseLogging=true is REQUIRED, not cosmetic: the runner writes each cell's per-test
# PASSED / SKIPPED line at Verbose, AND the producer's own skip branches
# (`RouteOriginProof skipped: ...`) and the new seam-scan line are Verbose. A census
# without them cannot separate "no seam was found" from "the seam was found and the
# resolver rejected the partner", and those call for opposite fixes.
#
# THE RunTests BUDGET IS 540, the schema cap (`hlib.MAX_DEFERRED_STEP_BUDGET_SECONDS`).
# Two cells against H56's six, on the same host and the same spawn machinery, so the wall
# should be well inside; the budget stays at the family convention rather than being
# trimmed to hug an expectation, because trimming converts a slow-restore run into a
# KILLED run with NO TALLY - which on a first census destroys the product of the flight.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                    expect = "OK" },
  { cmd = "DiscardTree",                                                      expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "RunTests",   args = { category = "RouteStartDockedOrigin", isolated = "true" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

