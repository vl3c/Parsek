# -------------------------------------------------------------------------------------
# THE THREE CELLS, category `RouteStartDockedOrigin`
# (`Source/Parsek/InGameTests/RouteDockCaptureInGameTest.cs`).
#
# 1 `StartDockedOrigin_StartsDockedThenUndocksAndDelivers` - the subject. Spawns a
#   `dockingPort2` and couples it into the ACTIVE vessel, assembles a partner rig rooted
#   on a `probeCoreOcto2.v2` (the depot), COUPLES THE TWO WITH NO RECORDING RUNNING, then
#   starts the recording. That start is the producer's only live entry point, and it must
#   emit `RouteOriginProof captured:`. The depot then undocks (a plain `Part.Undock` - no
#   window was ever opened, so there is nothing to complete), a SECOND partner rig is
#   assembled, and LiquidFuel is delivered across a real docked window to that different
#   endpoint vessel. It asserts the M1 endpoint descriptor - a real body name and
#   `surface=1`, which is what gives a surface-base origin the same proximity rebuild
#   destinations get - OFF THE PRODUCER'S OWN `RouteOriginProof captured:` LINE, together
#   with the seam-scan pairing that proves the capture came from the dock seam and not
#   from the retired reading.
#
# 2 `StartDockedOrigin_PartnerUndockedBeforeStart_CapturesNoOriginProof` - the negative
#   control, and it is what makes cell 1 mean something. The SAME rig docks and then
#   UNDOCKS before the recording starts. The docking node keeps its `vesselInfo` (stock
#   never clears it on this path), but its docked partner part is on another vessel now,
#   so `RouteProofCapture.IsSettledDockSeam`'s partner-resolves conjunct must reject it
#   and the producer must take `NoExternalCoupling`. Without this cell a green run could
#   not distinguish "the seam producer works" from "any craft that ever docked gets an
#   origin", which is the exact false-positive population the predicate exists to exclude.
#
# 3 `StartDockedOrigin_PredecessorWindowValidatesThePickup` - the RE-ENTRY shape (stock
#   Fly / Switch-To back onto a craft left docked, NOT a plain quit / reload, which
#   resumes the same recording in place), added
#   2026-09-06 with ROUTE-ORIGIN-PROOF-PICKUP-PREDATING-THE-RECORDING. The transport
#   starts docked and TAKES NOTHING while this recording runs, so its own pickup reads
#   `Carried` and, before this pass, the run could never become a route. A PREVIOUS
#   recording is injected into the LIVE tree with a real `VesselSwitchContinuation` branch
#   point and part-pid sets read off the merged craft, carrying an OPEN connection window
#   that brackets the load. WHAT IS SYNTHESISED IS ONLY THE OTHER SESSION - a chain-boundary
#   stop plus a stock Fly re-entry cannot be driven inside one batch cell without a scene
#   change. Everything the cell asserts is production code: the predecessor WALK (branch
#   point -> launch-guid gate), the partner match against the live seam halves, the
#   launch-unique root-`flightID` check, and the bind. It then runs an IN-CELL CONTROL on
#   the same real manifests with the window's dock baseline left UNREDUCED, which must read
#   `NoRise` - so a green cell says the classifier read the seeded deficit and not a
#   partial manifest. `predecessorUndockUT=NaN` on its bind line is the OPEN-window
#   evidence: the predecessor ended still docked, which is WHY this recording starts docked.
#
# -------------------------------------------------------------------------------------
# THE CAVEAT THIS LANE CARRIES, STATED UP FRONT RATHER THAN DISCOVERED LATER.
#
# The cells couple with a RAW `Part.Couple`. That is deliberate and inherited from the
# `RouteDockCapture` family - it is what lets the real `onPartCouple` classify a
# port-to-port pair with no docking FSM in the way, and there is no magnetic acquire to
# drive between two parts spawned 15 m apart. But `Part.Couple` writes NO docking-node
# bookkeeping, so each cell first stamps it (`StampStockDockBookkeeping`: `vesselInfo` +
# `dockedPartUId` per half, the three assignments quoted from the decompiled
# `ModuleDockingNode.DockToVessel` plus the FSM's own
# `dockedPartUId = otherNode.part.flightID`; `otherNode` and the FSM state are
# deliberately NOT written, because arming the node-distance event nulls `vesselInfo`
# straight back out).
#
# SO HALF OF THIS GATE IS A STOCK-CONTRACT EMULATION, NOT AN INDEPENDENT MEASUREMENT: the
# cell writes the two fields the predicate reads. What the lane still buys, and what no
# headless test can: the whole LIVE producer path - walk `v.parts`, find the node, resolve
# the docked partner ON THIS vessel, build the merged-vessel candidate, run the resolver,
# populate the endpoint descriptor and the start manifests, forward the proof onto the
# captured recording through `BuildCaptureRecording`, and survive an undock split on the
# way there. The non-emulated confirmation is a real player dock; that remains unbought
# and is recorded as such in the todo entry.
#
# -------------------------------------------------------------------------------------
# WHY THE HOST IS `rover-route-recorded` AND NOT THE PAD RIG.
#
# `RouteProofCapture.TryResolveStartDockedOriginPartner` returns `ActiveVesselPrelaunch`
# BEFORE it walks candidates, so on `logi-cargo-pad` (situation 4, clamped) the Captured
# branch is unreachable by construction - H55's own probe line is the standing evidence.
# This host is `sit = LANDED` (situation 1), which is also what makes cell 1's
# `surface=1` assertion a real assertion rather than a tautology: `IsSurfaceOriginSituation`
# admits LANDED and SPLASHED only.
#
