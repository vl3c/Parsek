# =====================================================================================
# V25M: THE **HELIOCENTRIC-PARKING DEPARTURE** LOOP - the second of re-aim's two
# departure classes, and the first live subject either of them has ever had that is not
# the direct-ejection one.
#
# `V25` IS RESERVED HERE AND NEW, and it takes the ORDINARY `M` suffix (the player
# flight map). It is a new NUMBER rather than a suffix on V24 because what makes it a
# distinct subject is the RECORDING - a mission that escapes Kerbin immediately, phases
# on the SUN for ~156 Kerbin days, and only then burns for Duna - not the drive shape and
# not the host. The register in `docs/dev/autotest-roadmap.md` reserves V25 across
# suffixes; `V25T` / `V25K` / `V25W` are reserved alongside and unused.
#
# ---------------------------------------------------------------------------------
# 1. WHY THIS IS A DIFFERENT SUBJECT FROM ITS SIBLING, MECHANICALLY
# ---------------------------------------------------------------------------------
# `duna-park-recorded` and `duna-one-recorded` come out of the SAME operator save (s15,
# visually validated 2026-08-25) and are disjoint payloads of one harvest. Their
# saveparse facets barely separate them - both are crewed Duna missions with a
# multi-segment chain, ascent debris, a decoupled probe and an EVA. What separates them
# lives in the transfer recording's ORBIT_SEGMENT list, which no saveparse facet reads:
#
#   `duna-one-recorded` (tree 1ccdb192, V2 / V24W's subject) is a DIRECT transfer. It
#   parks in KERBIN orbit and ejects; the departure burn happens inside Kerbin's SOI.
#
#   THIS ONE (tree ced78481, "Kerbal X #2") ejects from Kerbin almost immediately
#   (segment 1 = a Kerbin escape ellipse, sma 55,427,165.82 / ecc 0.97577) and then
#   coasts on ONE SUN ORBIT across THREE consecutive segments agreeing to ten significant
#   figures (sma 14,072,049,898.09 / ecc 0.0326934) for 13,502,219.94 s - 3.47 % outside
#   Kerbin's own heliocentric sma, i.e. a PHASING orbit, not a transfer. The departure
#   burn is an ELEMENT STEP at 2,561,070,900.0315204 (sma +27 %, ecc +488 %).
#
# THE PRODUCT KNOWS THIS SUBJECT BY NAME. `ReaimClassifier.cs`'s partial-transfer
# departure branch carries the comment "EXCEPTION (s15 Kerbal X #2): a HELIOCENTRIC
# PARKING departure is re-aimable", and `IsHeliocentricParkingDeparture`'s own doc quotes
# this recording's numbers ("park ecc 0.0327, sma 3.5 % off Kerbin's -> admissible"). So
# the code path exists BECAUSE of these bytes and has never been driven by a committed
# lane. That is the gap this lane closes.
#
# ---------------------------------------------------------------------------------
# 2. RE-AIM vs FAITHFUL: THE PRE-REGISTRATION, AND THE DRY DERIVATION BEHIND IT
# ---------------------------------------------------------------------------------
# **PRE-REGISTERED PREDICTION: RE-AIM ENGAGES, via the heliocentric-parking-departure
# exception, with `parking=True`.** Not faithful. The whole derivation is replayed below
# off the committed `aa48920e...prec.txt` bytes so the prediction is checkable rather
# than asserted; each step names the `ReaimClassifier` clause it replays.
#
#   segments (the transfer member's fourteen, all isPredicted=False):
#     0 Kerbin [2,547,277,750.99 , 2,547,281,403.37]  sma 1,370,041.54   ecc 0.53825
#     1 Kerbin [2,547,281,458.63 , 2,547,568,544.06]  sma 55,427,165.82  ecc 0.97577
#     2 Sun    [2,547,568,544.06 , 2,560,670,336.90]  sma 14,072,049,898.090191 ecc 0.0326934
#     3 Sun    [2,560,670,342.60 , 2,560,985,257.38]  sma 14,072,049,898.089064 ecc 0.0326934
#     4 Sun    [2,560,985,293.24 , 2,561,070,763.99]  sma 14,072,049,898.090006 ecc 0.0326934
#     5 Sun    [2,561,070,900.03 , 2,570,454,935.62]  sma 17,908,765,008.46     ecc 0.19216
#     6 Duna   [2,570,454,935.62 , 2,570,490,859.06]  sma -188,090.82   ecc 3.60252  (hyperbolic)
#     ... 7-10 the same hyperbola re-clipped ...
#     11 Duna  [2,570,492,255.34 , 2,570,538,747.26]  sma 495,883.112   ecc 0.042042 (CAPTURED)
#     12 Duna  [2,570,538,761.92 , 2,570,541,341.79]  sma 495,883.113   ecc 0.042042
#     13 Duna  [2,570,541,360.41 , 2,570,542,380.99]  sma 407,581.62    ecc 0.26771
#
#   launchBody = Kerbin (segs[0]); helioIdx = seg 2 (first strict ancestor of Kerbin),
#     so commonAncestor = Sun and RecordedSoiExitUT = 2,547,568,544.056056.
#   parkingIdx = seg 1 (last Kerbin before the heliocentric leg).
#   arrivalIdx = seg 6 -> targetBody = Duna. ReferenceBody(Duna) == Sun == commonAncestor,
#     so the single-hop guard passes; the LCA test confirms cross-parent; no SECOND
#     heliocentric leg follows the arrival.
#   lastCoastIdx: the Sun segment whose endUT is within 1 s of arrival.startUT -> seg 5.
#     firstA = 17,908,765,008.46. Walking back, seg 4's sma is 21.4 % off firstA, past the
#     5 % `AStepRelThreshold`, so THE RUN ENDS AT SEG 5:
#       RecordedDepartureUT = 2,561,070,900.0315204   (the departure burn, NOT the SOI exit)
#       RecordedArrivalUT   = 2,570,454,935.6223264
#       tof                 = 9,384,035.590805769 s
