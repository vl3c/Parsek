#     same segments and finds the Sun park as ONE run [2,547,568,544.056056,
#     2,561,070,763.99165] (segs 2-4 merge: their sma agree to ~1e-13 relative, inside the
#     0.001 sameOrbit tolerance, so the 5.7 s and 35.9 s gaps do not break it), period
#     9,687,025.90 s, dur 13,502,219.94 s -> **WholeRevs = 1**. `DefaultKeepRevs` is 1, so
#     `WholeRevs > keepRevs` is FALSE for every common-ancestor run and the empty-cut scope
#     gate passes. Admissibility: anchor ecc 0.0326934 and burn-segment ecc 0.0326934 are
#     both <= 0.1; Kerbin's heliocentric sma from Kepler III is 13,599,840,256 m and
#     |14,072,049,898.09 - 13,599,840,256| / 13,599,840,256 = **0.034722** <= 0.1.
#     -> parkingDeparture = TRUE, plan.Supported = TRUE, DepartedFromHeliocentricPark = TRUE.
#
# THE PIN THAT MAKES THIS FALSIFIABLE is a single ReaimDiag line carrying the whole
# conjunction (`MissionLoopUnitBuilder.cs:700-709`):
#     plan.Supported=True reason='' departUT=2561070900 arrivalUT=2570454936
#       tof=9384036 ancestor=Sun parking=True
# It is REQUIRED below as one regex over one line, because three separate tokens would
# pass on a log carrying them on three different lines. Its exact inverse - the decline
# string this subject must not hit - is FORBIDDEN.
