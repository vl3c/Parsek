# ---------------------------------------------------------------------------------
# 3. THE LOITER CUTS - THE ANSWER IS "ONE, AND IT IS DOWNSTREAM OF EVERY WINDOW"
# ---------------------------------------------------------------------------------
# The obvious worry on a subject whose whole shape is a 156-day park is that the loiter
# compressor eats it and every recorded-UT offset has to be re-mapped through the
# compressed clock (the PR #1534 seam-payload cut-mapping). REPLAYED, and the answer is
# the opposite of the worry:
#
#   `ComputeCuts(transferSegments, keepRevs=1)` over the fourteen segments detects TWO
#   loiter runs and cuts exactly ONE:
#     Sun  [2,547,568,544.056056 , 2,561,070,763.99165]  T 9,687,025.90  revs 1  -> NO CUT
#     Duna [2,570,492,255.336010 , 2,570,541,341.793343] T 3,996.72     revs 12 -> CUT
#            length (12 - 1) * 3,996.7200485941084 = **43,963.920534535195 s**
#   (The two Kerbin runs are sub-revolution and produce no LoiterRun at all: seg 0 is
#   3,652 s against a 5,362 s period, seg 1 is 287,085 s against a 1,379,700 s period.)
#
#   THE SUN PARK IS NOT CUT, and that is not luck - it is the engage condition. The
#   exception's scope gate returns false the moment ANY common-ancestor run exceeds
#   keepRevs, so "re-aim engaged" and "the heliocentric park was not compressed" are the
#   SAME fact stated twice. A future subject whose solar park ran two revolutions would
#   decline to faithful instead of being cut.
#
#   THE ONE CUT STARTS AT THE DUNA CAPTURE, 2,570,492,255.336010. `cutBeforeDeparture` is
#   therefore `RecordedDepartureUT - CompressSpanUT(RecordedDepartureUT) = 0`, so the
#   phase anchor is NOT shifted (`MissionLoopUnitBuilder.cs:794-796` adds zero) even
#   though `loiterCuts` is set. **EVERY WINDOW THIS LANE JUMPS TO IS AT OR BEFORE THE
#   ARRIVAL SOI ENTRY, which is 37,319.71 s BEFORE the cut start**, so all three map
#   UNCOMPRESSED and the cut-mapping is moot for this drive shape. That is a deliberate
#   window choice, not an accident: the capture epoch is exactly where the compressed and
#   uncompressed clocks part company, and a first flight should not straddle it.
#   (The M-MIS-2 P4 destination-loiter trim may REASSIGN `loiterCuts` to
#   `launchSideCuts` + a joint trim. `BuildLaunchSideKeepOneCuts` filters to runs with
#   `EndUT <= RecordedArrivalUT`, and neither run qualifies - the Sun run has revs 1 and
#   the Duna run ends after the arrival - so launchSideCuts is EMPTY here and the
#   reassignment can only move post-capture UTs either way.)
#
# ---------------------------------------------------------------------------------
# 4. WINDOW ARITHMETIC (V8's recipe, V24W's discipline)
# ---------------------------------------------------------------------------------
# Cross-parent means `PhaseLock SKIPPED support=UnsupportedCrossParent`, so the anchor
# comes from `ReaimWindowPlanner.Plan` and nothing else.
#
#   spanStartUT = 2,547,277,477.4306364  (chain head 8538d9e1, the pad launch)
#   spanEndUT   = 2,570,562,894.315805   (the decoupled probe ed76396d, the LAST end)
#   span        = 23,285,416.885169 s
#   T_Kerbin    = 9,203,544.617627 s     T_Duna = 17,315,400.142807 s   (Kepler III off
#                 the stock sma 13,599,840,256 / 20,726,155,264 and mu_Sun)
#   synodic     = 1 / |1/T_K - 1/T_D| = **19,645,697.250367 s**
#   span/synodic = **1.185268** -> Ceiling(1.185268 - 1e-9) = 2, so
#   cadence     = 2 * synodic = **39,291,394.500734 s**
#     - the span>synodic regime, the SECOND subject ever to reach it (V8/Eve was the
#       first). It also matches the ratio `ReaimWindowPlanner.Plan`'s own comment quotes
#       for "the s15 ratio ~1.185", which is these bytes.
#     - and it means `PadAlignLaunch` DECLINES (it refuses whenever
#       |cadence - synodic| > 1.0), so the LAUNCH HOLD engages instead - V8's measured
#       shape, reproduced here for a structural reason rather than by coincidence.
#   `MissionConfig` stamps `LoopAnchorUT = currentUT` (MissionStore.cs:522), so
#   referenceUT = the live clock at arming ~= the save clock **5,336,112,610.6518345**
#   (floored at spanEndUT, which it dwarfs).
#     k = ceil((5,336,112,610.6518345 - 2,561,070,900.0315204) / 19,645,697.250367)
#       = ceil(141.254427) = **142**
#   D0 (FirstDepartureUT) = 2,561,070,900.0315204 + 142 * 19,645,697.250367
#                         = **5,350,759,909.583645**
#   phaseAnchorUT = D0 - (RecordedDepartureUT - spanStartUT)
#                 = D0 - 13,793,422.600884 = **5,336,966,486.982761**
#
#   THE k IS ROBUST TO THE FEW SECONDS OF SCENE TIME BETWEEN LoadGame AND MissionConfig,
#   which matters because `LoopAnchorUT` is stamped from the LIVE clock and not from the
#   save: k flips to 143 only above 5,350,759,909.58, and the arming clock sits
#   14,647,299 s below that. It also cannot fall to 141 (that boundary is 5,004,979 s
#   below). So the anchor is derived, not raced.
#
#   MAP: windowUT(recordedUT) = phaseAnchorUT + (recordedUT - spanStartUT), valid for
#   every recordedUT at or before the cut start (section 3).
#     Sun park       [2,547,568,544.06 , 2,561,070,763.99] -> [5,337,257,553.61 , 5,350,759,773.54]
#     departure burn  2,561,070,900.03                     ->  5,350,759,909.58  (== D0, by construction)
#     Duna SOI entry  2,570,454,935.62                     ->  5,360,143,945.17
#     Duna capture    2,570,492,255.34                     ->  5,360,181,264.89  (the cut start; NOT visited)
#
#   THE THREE WINDOWS AND THEIR JUMP UTs:
#     W1 SUN PARK INTERIOR - one jump at **5,344,008,664**, the arithmetic midpoint of the
#        13,502,219.94 s park run (recorded 2,554,319,654.02, ~0.70 rev in). Deep
#        interior by design: the nearest internal segment seam is 6,350 ks away, so this
#        observes a HELIOCENTRIC PARKING CONIC with no seam in the frame - a render
#        subject no committed lane has ever put on the map.
#     W2 DEPARTURE BURN - a -180 / -60 / +140 straddle of D0, i.e.
#        **5,350,759,730 / 5,350,759,850 / 5,350,760,050**. The straddle is unusually
#        informative here because the recorded gap between the park's end
#        (2,561,070,763.99) and the burn's start (2,561,070,900.03) is 136.04 s of
#        OFF-RAILS burn: the three jumps land inside the park's last segment, inside the
#        burn gap, and inside the transfer conic respectively.
#     W3 DUNA ARRIVAL - the same -180 / -60 / +140 straddle of the SOI entry,
#        **5,360,143,765 / 5,360,143,885 / 5,360,144,085**. Under a re-aimed window the
#        ARRIVAL is `D0 + usedTof`, which equals the recorded-map arrival iff
#        `usedTof == recordedTof`; the bracket covers both candidates (V8's construction).
#   Every jump is strictly forward of the save clock and of its predecessor. A backward
#   one answers `REJECTED reason=backward-jump`, only a WARN - FORBIDDEN below.
#
#   RE-PIN RECIPE (V2/V8, unchanged): read `phaseAnchorUt=` off `missionconfig applied:`
#   and `relaunchUt=` off `startloopplayback initiated:`, then re-map. Note the LAUNCH
#   HOLD puts `relaunchUt` slightly BEFORE `phaseAnchorUt` (V8 measured -1,091.3 s); the
#   window map rides `phaseAnchorUt`, not `relaunchUt`.
#
# ---------------------------------------------------------------------------------
# 5. WHY SEAM-DRIVEN AND 1x
# ---------------------------------------------------------------------------------
# `kind = "seam"` for the V4/V5/V6/V7/V8 reason: every step verdict gates driver
# validity, so a missed arm or a refused jump reads INVALID rather than greening. The
