description = "AUTHORED 2026-08-26; READING FLIGHT 1 FLEW THE SAME DAY (`2026-08-26_1744`, PARSEK-FAIL(anomaly) attempt 1 - the outcome this spec pre-registered in writing, raised by the anomalySweep against an empty allowedAnomalies and by no composition rule). THE CLASSIFIER REPLAY IS VINDICATED IN FULL: the unit exports `isReaim = True` against `launchBodyName = Kerbin` and the product's own conjunction line reads `plan.Supported=True reason='' departUT=2561070900 arrivalUT=2570454936 tof=9384036 ancestor=Sun parking=True` - the park-departure class engages re-aim live, exactly as derived dry. It also produced THE PROGRAM'S FIRST NON-EMPTY CUT RATIO AND IT IS EXACTLY WHOLE (`cutWholeRatios = [2.0]`), so RC-CUT's whole-multiple clause finally had a subject; the exported cut is 7,993.44 s at the Duna capture, which is the arrival hold's re-timed `keepRevs=10/12` value and NOT the 43,964 s keepRevs=1 derivation in section 3 - a round-2 window must be written off the exported 2.0. Census: dwells 3 (+2 open), treatments StockConic 2 / TracedPath 1, seams rigid 8 / flexible-soi 2, anomalies icon-teleport 4 / icon-off-orbit 2 (now tolerated BARE with that run id beside them; ceilings 8 / 4 at 2x measured, argued as prose because the inert-budget invariant blocks declaring them), unevaluable 384 of which the notable positives are reaimed-seam-instant-absent 69, plan-primitive-body-unidentified 1 (Sun is not in the stock body table - expected for a heliocentric subject) and hold-observed-evidence-absent 1 (the plan holds 3,918.25 s and all three windows sit at or before the arrival SOI entry by design). The run's single RC-SEAM [FAIL] was diagnosed as A VERIFIER MISREAD, NOT A RENDERER DEFECT, and the verifier is fixed: the arrival straddle warped across an interior segment so the transition spanned boundaries 7 (Sun->Duna, correctly flexible-soi) and 8 (Duna->Duna, correctly rigid), and wave-1 keyed the seam table on toSegmentIndex; re-evaluated offline this manifest now reads zero findings and all sixteen other archived manifests are byte-identical. ARMING STILL OWED - reading 2, which must come back clean. The HELIOCENTRIC-PARKING DEPARTURE subject - re-aim's second departure class, which until now had no live lane. Over `duna-park-recorded` (tree ced78481 'Kerbal X #2', harvested from the same visually-validated s15 save as `duna-one-recorded` and disjoint from it): a mission that escapes Kerbin immediately, PHASES ON THE SUN for 13,502,219.94 s on one near-circular orbit 3.47 % outside Kerbin's own, and only then burns for Duna. `ReaimClassifier` knows this recording by name - its partial-transfer decline carries an EXCEPTION whose comment reads 'EXCEPTION (s15 Kerbal X #2)' and whose admissibility doc quotes these exact numbers - and no committed lane has ever driven that path. PRE-REGISTERED PREDICTION, derived in full in the header off the committed .prec bytes: RE-AIM ENGAGES with `parking=True`, pinned as one conjunction regex over the ReaimDiag line and with its exact inverse (the 'transfer departs from a heliocentric parking orbit' decline) FORBIDDEN. The loiter question is answered too, and the answer is the opposite of the worry: the Sun park is NOT cut (WholeRevs 1 against keepRevs 1 - which IS the engage condition, so 're-aim engaged' and 'the park was not compressed' are one fact), the single cut is a DESTINATION one of 43,963.92 s starting at the Duna capture, and all three windows sit at or before the arrival SOI entry so every offset maps uncompressed. Three TimeJump windows on the derived cycle: deep inside the Sun phasing orbit, a -180/-60/+140 straddle of the departure burn (which lands one jump inside the 136 s off-rails burn gap), and the same straddle of the Duna SOI entry. Span/synodic is 1.185268, so cadence = 2x synodic and PadAlignLaunch declines - the span>synodic regime, only the second subject ever to reach it after V8/Eve."
instanceProfile = "stock-minimal"
tags = ["V25", "player-loop", "reaim", "heliocentric-parking-departure", "loiter-compression",
        "duna", "kerbin", "sun", "cross-parent", "render-composition", "map-render"]

[fixture]
# `duna-park-recorded`: ONE committed tree `ced7848157674b8ea19311377c0f6fbc`, 14
# recordings (pointCount total 2706; the largest, 856, is the park transfer `aa48920e`),
# zero durable rows, 13 VESSEL nodes, SANDBOX, save clock 5,336,112,610.6518345, active
# vessel 8 (`Jumping Flea`, PRELAUNCH). Payload pinned byte-for-byte in
# `harness/lib/test_saveparse.py::CommittedFixtureSweepTests.RECORDED_FIXTURES`, whose
# provenance entry also records the four-TrackSection INV2 repair (52 -> 48 on
# `aa48920e`, the 14-entry top-level ORBIT_SEGMENT list byte-untouched) and the resulting
# `FAIL=0 WARN=16 RED=0` analyzer reading.
saveTemplate       = "fixtures/saves/duna-park-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, structural rather
  # than fixture-specific). StopRecording is idempotent-OK by construction and DiscardTree
  # answers OK with nothing-discarded when no plain tree is live, so the pair is safe on
  # any entry state; the SetSetting stops a later one. The pair kills ONE stub and is not
  # a latch - which is why the recordings window below admits a stub rather than
  # forbidding it.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins, all LOAD-BEARING for the manifest and not just for log evidence:
  # the seam tangent/endpoint capture predicates behind RC-SEAM are `mapRenderTracing`-
  # gated, so a manifest taken with that tracer off carries no seam numbers at all;
  # `ghostRenderTracing` is the FLIGHT-scene raise gate for the loop-seam-teleport Tier-C
  # instrument; `verboseLogging` is load-bearing beside both because every `[ReaimDiag]`
  # line this lane's prediction is pinned on is VERBOSE (the V1 lesson).
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # STEP 1: the Missions window loop checkbox (production MissionStore.SetLoopEnabled).
  # It also STAMPS `LoopAnchorUT = currentUT`, which is the referenceUT the whole header
  # section 4 derivation is anchored to, and its Info line echoes the resolved
  # phaseAnchorUt - READ IT WHEN RE-PINNING.
  { cmd = "MissionConfig", args = { tree = "ced7848157674b8ea19311377c0f6fbc", loop = "true" }, expect = "OK" },
  # STEP 2: "Warp to..." -> ComputeNextRelaunchUT -> FastForwardToEventUT, an
  # INSTANTANEOUS Planetarium clock set (no rails warp to budget). Under the LAUNCH HOLD
  # this lands slightly BEFORE phaseAnchorUt (V8 measured -1,091.3 s on the same
  # PadAlignLaunch-declined shape).
  { cmd = "StartLoopPlayback", args = { tree = "ced7848157674b8ea19311377c0f6fbc" }, expect = "OK", budget = 300 },
  # W1 - DEEP INSIDE THE SUN PHASING ORBIT (header section 4). The arithmetic midpoint of
  # the 13,502,219.94 s park run, ~0.70 rev in, with the nearest internal segment seam
  # 6,350 ks away. This is the frame no committed lane has ever rendered: a near-circular
  # HELIOCENTRIC parking conic with no seam in it.
  { cmd = "TimeJump", args = { ut = "5344008664" }, expect = "OK", budget = 300 },
  # PACING SPACERS, and they are LOAD-BEARING for the same reason V8's are:
  # `MapRenderTrace.IsLineBlink` raises when a proto line's ON/OFF toggle pair lands
  # within 8 visual frames, and two back-to-back seam TimeJumps execute ~4-7 WALL frames
  # apart regardless of the game seconds between them. V8 runs _0810 and _0814 both
  # PARSEK-FAILed on exactly that shape at exactly these boundary-straddling pairs.
  # RecordingState is AnyScene and side-effect-free.
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # W2 - THE DEPARTURE BURN, straddled -180 / -60 / +140 about D0 = 5,350,759,909.58.
  # The three land, respectively, inside the park's LAST segment, inside the 136.04 s
  # off-rails burn gap between the park end and the transfer start, and inside the
  # transfer conic. That middle jump is the one no other subject has: on a direct
  # ejection the equivalent instant is inside the launch body's SOI.
  { cmd = "TimeJump", args = { ut = "5350759730" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "5350759850" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "TimeJump", args = { ut = "5350760050" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # W3 - THE DUNA ARRIVAL, the same -180 / -60 / +140 straddle of the recorded-map SOI
  # entry 5,360,143,945.17. Under a re-aimed window the arrival is `D0 + usedTof`, equal
  # to the recorded-map instant iff `usedTof == recordedTof`; the bracket covers both
  # candidates. It deliberately stops SHORT of the Duna capture (5,360,181,264.89), which
  # is where the one loiter cut starts and where the compressed and uncompressed clocks
  # part company - see header section 3.
  { cmd = "TimeJump", args = { ut = "5360143765" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "5360143885" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "TimeJump", args = { ut = "5360144085" }, expect = "OK", budget = 300 },
  # M-A7 RENDER-COMPOSITION CAPTURE (Phase 4). PLACEMENT IS THE ARGUMENT and it is pinned
  # by `test_every_declarer_exports_immediately_before_teardown`: the recorder accumulates
  # from Awake, so placement decides only how much of this lane's observation is already
  # inside the exported file - and here that is all three windows and every jump between
  # them, taken at a CHOSEN instant rather than provoked by the scene-exit auto-flush that
  # follows `FlushAndQuit`.
  # INERT by construction (`hlib.SEAM_VERB_TAIL_ROLE` = inert): an in-memory read of the
  # recorder plus one file write in the KSP root, touching no vessel, no save and no
  # Parsek persisted state.
  { cmd = "ExportRenderManifest",                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# CLAIM-IS-NOT-GATE.
#   D11 `heliocentric-parking-departure` - CLAIMED AND GATED, by the single conjunction
#       regex `plan\.Supported=True .*ancestor=Sun parking=True` in the required list. The
#       cell already carries M2-periodicity-solver's claim, which is the PURE-SOLVER half
#       (unit-level, over synthetic inputs); this is the first claim from a LIVE LOOP UNIT
#       built over recorded bytes, and the two are complementary rather than duplicate.
#   D14 `duna` - gated by the ENGAGED line naming `Kerbin->Duna via Sun`, i.e. the target
#       body is asserted by the routing verdict rather than by the epoch.
#   D14 `scene-flight` / `sandbox` - the environment axes this lane runs on (V6M's
#       precedent; sandbox is the fixture's Mode).
#
# DELIBERATELY NOT CLAIMED:
#   D11 `loiter-compression` - V8 owns that cell, and this lane's cut is a DESTINATION one
#       rather than a launch-side one. The distinction is worth a claim only once a window
#       gates it; today the count is recorded and asserted on by nothing.
#   D11 `reaim-lambert` / `arrival-hold` - measured here, gated by nothing on a reading
#       run.
#   D14 `warp-1x` / `warp-rails` - the histogram is 1x-only by construction (header
#       section 5) and nothing in the bare block gates a bucket.
[dimensionsCovered]
D11 = ["heliocentric-parking-departure"]
D14 = ["duna", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING (hlib.validate_spec rejects a bare allowedAnomalies written
# after any [expectations.<sub>] header).
#
# THE SWEEP SHIPPED FULLY ARMED, ON PURPOSE, AND THIS LANE RED BECAUSE OF IT. V24W -
# same fixture family, same tracers, a multi-window drive - measured
# `hitCounts {icon-teleport: 65, icon-off-orbit: 2, loop-seam-teleport: 2}` and red on a
# list that had shipped empty; that red is the reason those three counts are known at all.
# Pre-tolerating anything here would have destroyed the same measurement on a subject whose
# geometry (a heliocentric park, then a 136 s burn gap, then a cross-parent arrival) had
# never been sampled. The S1.4 rule is explicit: a token is re-added WITH the flight that
# shows it - and `2026-08-26_1744` is that flight. It measured
# `hitCounts = {icon-teleport: 4, icon-off-orbit: 2}` and NOTHING ELSE: this shape does
# NOT raise `loop-seam-teleport` at all, which is a real difference from V24W and is why
# that token is deliberately absent below rather than copied across from a sibling.
#
# THE COUNTS ARE TINY - 4 and 2, against V24W's 65 - and that is the expected direction:
# this lane's clock moves in three instantaneous TimeJumps rather than a commanded rails
# stair, so the probe's filed above-warp1000 over-sensitivity is barely exercised.
#
# CEILING ARITHMETIC, recorded as prose per the V24W convention because the ceilings
# CANNOT BE DECLARED while the whole-suite inert-budget invariant stands (V24W header
# section 6 carries that argument in full and it is unchanged): at 2x measured the
# ceilings would be `icon-teleport` 8 and `icon-off-orbit` 4. 2x, not V24W's 4x on the
# small tokens, precisely BECAUSE these counts are small and single-sourced - a 4x band
# on a count of 2 tolerates almost any regression, whereas 2x still reds a doubling.
# Reading 2 either reproduces 4 / 2 or the ceiling arithmetic is re-derived off the pair.
allowedAnomalies = [
  # 4 raises, `2026-08-26_1744`. The probe's icon-jump/icon-teleport threshold has a
  # FILED, unfixed over-sensitivity above warp1000; this lane reaches it only through
  # its three TimeJump windows, hence 4 rather than V24W's 65. Ceiling 8 (2x measured)
  # pending the budget-mechanism allowlist move.
  "icon-teleport",
  # 2 raises, `2026-08-26_1744`. The ghost-proto creation-frame trigger the
  # V14T/V15T/V16T family measured as parent-independent - and this lane measures the
  # SAME count of 2 as V24W on a completely different departure class, which is the
  # first cross-class corroboration that the trigger is per-creation and not per-shape.
  # Ceiling 4 (2x measured) pending the same move.
  "icon-off-orbit",
]

[expectations.recordings]
# A BRACKET, NOT A PIN. The fixture ships 14 `.prec` sidecars and 14 RECORDING nodes,
# this lane starts no recording of its own, and the step triple above kills the
# scene-entry promotion stub - but that pair kills ONE stub and is not a latch, so 15 is
# admissible. The ceiling adds headroom for the LOAD-TIME OPTIMIZER at this subject's TWO
# cross-body seams (Kerbin->Sun at 2,547,568,544.06 and Sun->Duna at 2,570,454,935.62):
# V8 measured exactly this mechanism on the Eve fixture (8 -> 9), and §3 rule 3 of
# `IsSplittableEnvOrBodyBoundary` keeps a same-class Exo body change COHESIVE, so the
# prediction is few or none - but "few or none" is a prediction, and 22 is a runaway guard
# rather than a pin (a per-frame recording leak would be in the hundreds).
#
# THE FLOOR IS 12, BELOW the fixture's own 14, as margin for the unknown on a first
# flight - NOT as a prediction that anything merges. A reading below 14 is to be
# INVESTIGATED, not window-widened. The anti-vacuity half is what the floor really buys:
# a run that observed one or two recordings has stopped being a loop over this subject.
count = { min = 12, max = 22 }

[expectations.logContracts]
# THE PLUMBING TRIO, in order:
#   "missionconfig applied:" / "SetLoopEnabled: loop ON" - the loop is ARMED through the
#     production path; the first also echoes phaseAnchorUt, the number to read when
#     re-pinning.
#   "startloopplayback initiated:" - the clock work entered the production door and echoed
#     the resolved relaunchUt.
#
# THE ROUTING VERDICT - the three tokens this lane exists to buy, and the reason it is not
# just "V8 with a different fixture":
#   "ENGAGED re-aim Kerbin->Duna via Sun" - re-aim engaged, and on the expected pair. On
#     a faithful outcome this line is absent and the lane reds here first, which is the
#     loud direction.
#   "PhaseLock SKIPPED: mission=.*support=UnsupportedCrossParent" - the NEGATIVE half: the
#     periodicity solver stood down for the documented reason (cross-parent is the only
#     thing that demotes Support), so what placed the launches is the synodic window
#     planner and not a phase lock. Requiring both directions is what makes "this really
#     is the re-aim road" falsifiable rather than assumed.
#   "plan\.Supported=True .*ancestor=Sun parking=True" - **THE HEADLINE PIN.** ONE regex
#     over ONE line, carrying the whole classifier verdict as a conjunction: supported,
#     common ancestor Sun, and DepartedFromHeliocentricPark true. Three separate tokens
#     would pass on a log carrying them on three different lines. This is the token that
#     gates D11 `heliocentric-parking-departure`, and it is the entire content of the
#     header's pre-registered prediction. The float digits (departUT / arrivalUT / tof) are
#     deliberately NOT pinned: they are re-derivable from committed bytes and a token
#     carrying them is a re-pin waiting to happen.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "ENGAGED re-aim Kerbin->Duna via Sun",
  "PhaseLock SKIPPED: mission=.*support=UnsupportedCrossParent",
  "plan\\.Supported=True .*ancestor=Sun parking=True",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE EXACT INVERSE OF THE PREDICTION, verbatim from
  # `ReaimClassifier.cs`'s partial-transfer branch. If the heliocentric-parking exception
  # does NOT open - a keepRevs re-tune, an ecc/sma tolerance move, a DetectRuns change
  # that stops merging the three same-sma Sun segments into one run - this is the string
  # the log carries instead, and this lane must red on it rather than quietly measure a
  # faithful replay. It is the sharpest single regression floor this subject has.
  "transfer departs from a heliocentric parking orbit or mid-course correction \\(deferred\\); staying faithful",
  # The other decline this subject must never reach: it has FOUR consecutive Sun segments,
  # so a change that stopped merging them would absorb the park into the transfer run and
  # trip the >1-revolution guard instead.
  "transfer run spans >1 revolution \\(heliocentric loiter absorbed\\); staying faithful",
  # The V3C run-3 self-detection guard: a refused backward jump is only a WARN, so without
  # this token a mis-derived anchor can green while dwelling nowhere. Nine derived jump UTs
  # is exactly when this earns its place.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift. PRESENCE of the summary is not required here (V14M/V6M
  # measured the seed-fragment blind spot at `sampled=0`), only a non-zero over-tolerance
  # count is forbidden.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.renderComposition]
# M-A7 Phase 4 / Wave B - DECLARED 2026-08-26, BARE ON PURPOSE: no `gating`, no window,
# no list. Declaring is what sets `PARSEK_RENDER_MANIFEST=1` at launch and arms the C#
# recorder at Awake, and `rendercompose` then records its facets UNCONDITIONALLY on a
# parseable manifest - which is how a lane earns its first honest window off a green
# report-only run. A window written today would be a PREDICTION read back as though it
# were a measurement, the mistake V14M, V8, V6M and V24W all shipped bare through their
# reading runs to avoid.
#
# `warpBuckets` MUST NEVER BE DECLARED HERE (header section 5): the clock moves with
# instantaneous TimeJumps, so the histogram is 1x-only by construction and a bucket
# window would gate on the drive shape rather than on the product. V24W is the only lane
# in the suite entitled to that key.
# READING PENDING - see the renderComposition arming ledger in this file's header.

[runtime]
# 300 LoadGame + 300 StartLoopPlayback + 9 x 300 TimeJump + 120 export + the fast
# non-deferred verbs + KSP boot + collect. Every jump is instantaneous, so the ~24 Ms of
# game time costs no wall clock; V8's structurally identical 25-step shape measured well
# under 2 minutes end to end.
budgetSeconds = 3000

[retry]
# One retry absorbs the V2/V5 promotion-recorder re-arm race and ordinary seam flakes. It
# does NOT absorb a mis-derived anchor or a refuted routing prediction: both reproduce
# exactly on attempt 2, which is the point.
policy = "once"

[expectedFail]
bugId = ""
