schema = 1
id = "ST-2-rewind-point-quicksave"
tier = "nightly"
# WHAT THIS IS. D16 `rp-quicksaves` on a quicksave the product writes IN THIS RUN. GS-2's
# road: StartRecording on the ATTACHED docking Kerbal X parked at ~100 km
# (`gs2-orbital-stack`), then the `gs2_orbital_probe_deploy` mission fires the istg=2
# decoupler once. Both halves carry a ModuleCommand (the crewed pod stack and the RC-L01
# "Kerbal X Probe" core), so the split is multi-controllable and the coalescer's
# `TryAuthorRewindPointForBreakup` authors a real rewind point - RewindPointAuthor saves to the
# save root and SafeMoves the file into Parsek/RewindPoints/<rpId>.sfs, logging
# `[RewindSave] Wrote rp=... path=... bytes=N`. Then RunTests drives the `Storage` category,
# whose RewindPointQuicksavesOnDisk cell reads every live RP's quicksave back: present at the
# production path, non-empty, parses as a KSP save with a GAME / FLIGHTSTATE and at least one
# VESSEL, its UT within 5 s of the RP's UT, and no `Parsek_TempRP_<id>.sfs` left in the save
# root. The path cell also validates the live RP id. The mirror cell self-skips (this sandbox
# save has no committed recording); ST-1 runs it on the earned career.
#
# RE-HOSTED 2026-09-27 (branch `refly-separations-only`). The lane used to ride CI-1's EVA
# split on `eva2-lko-crewed` (reading `2026-09-25_2051`, armed `_2053`). The owner ruling of
# 2026-09-27 (Re-Fly is for vessel separations only; an EVA never gets a Rewind Point) removed
# that RP, so the lane moved to the decoupler road GS-2 has flown green since 2026-08-05. The
# Storage batch and its tally are unchanged. READING RUN `2026-09-27_1127` (automation DLL sha256
# `ecad1a0e...`, PASS attempt 1, MISSION-OK) re-measured the save-side pins: one RP
# (`slots=2 controllablePids=2 focusSlot=0`, `bytes=290141`, which varies per flight and stays a
# regex), `vessels=7` (the fixture's six VESSEL nodes plus the released "Kerbal X Probe"), and TWO
# recordings (the pod stack keeps its recording across the tree-branching split, plus the probe's).
# The tightened pins below were checked offline against that run's log and save, not re-flown.
#
# WHY A SECOND LANE. ST-1's host (`career-earned-pad`) cannot author an RP: its pad pod
# has no decoupler, and stock spawnEVA refuses the Parsek stand-in sitting in it (ST-1
# runs `2026-09-25_2039` / `_2043`: `evaexit refused reason=eva-refused (spawnEVA
# returned null)`, with the vessel already unpacked on the second).
description = "Author a rewind point through an in-orbit decoupler split on the attached Kerbal X (GS-2's road), then run the Storage in-game category: the RP quicksave is read back from Parsek/RewindPoints/<rpId>.sfs, loads as a KSP save at the RP's UT with no temp file left, and the live RP id passes path validation."
instanceProfile = "stock-minimal"
tags = ["ST-2", "ingame-batch", "storage", "rewind", "staging", "orbital", "kerbin", "sandbox"]

[fixture]
saveTemplate = "fixtures/saves/gs2-orbital-stack"
injectedRecordings = "none"
craft = []

[driver]
kind    = "autopilot"
mission = "gs2_orbital_probe_deploy"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
# The mission is GS-2's, unchanged: settle ORBITING, ONE stage activation, dwell. RunTests,
# StopRecording and FlushAndQuit are post-mission RECORDING-role seam steps
# (hlib.SEAM_VERB_POST_MISSION_ROLE), so the batch's verdict is carried by the pinned
# BATCH_COMPLETE and cell tokens below.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva",    value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "StartRecording",                                                          expect = "OK" },
  { phase = "mission",                                                               expect = "MISSION-OK", budget = 300 },
  { cmd = "RunTests",       args = { category = "Storage" },                         expect = "OK", budget = 540 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "FlushAndQuit",                                                            expect = "OK" },
]

[driver.missionParams]
settleSituations = ["ORBITING"]
settleDebounceFrames = 3
settleTimeoutSeconds = 120
deployTimeoutSeconds = 60
deployDebounceFrames = 2
postDeployDwellSeconds = 45
postDeployDebounceFrames = 3
postDeployTimeoutSeconds = 180
minSafePeriapsisMeters = 75000
siblingVesselName = "Kerbal X Probe"

[dimensionsCovered]
D16 = ["rp-quicksaves"]
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 2, max = 2 }

[expectations.logContracts]
required = [
  "Controllable split children: \\[[0-9]+,[0-9]+\\]",
  "RewindPoint begin: rp=\\S+ bp=\\S+ slots=2 controllablePids=2",
  "\\[RewindSave\\] Wrote rp=rp_[0-9a-f]{32} path=Parsek/RewindPoints[\\\\/]rp_[0-9a-f]{32}\\.sfs bytes=[1-9][0-9]*",
  "BATCH_COMPLETE v1 total=3 passed=2 failed=0 skipped=1 category=Storage scene=FLIGHT",
  "rewind point quicksaves: checked=1 vessels=7 bytes=[1-9][0-9]*",
  "path validation on live save: rejected=47 invalidCharIds=39 acceptedRecordings=0 resolvedOnDisk=0 acceptedRewindPoints=1",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]",
             "Split type=EVA: no Rewind Point"]

[runtime]
# 300 LoadGame + 300 mission + 540 RunTests + fast verbs + boot and margin.
budgetSeconds = 1400

[retry]
policy = "once"

[expectedFail]
bugId = ""
