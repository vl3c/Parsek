# =====================================================================================
# THE SAME TEN `AutoRecord` CELLS AS H61, ON A THREE-CREW PAD HOST. LIVE-PROVEN
# 2026-09-07, run `2026-09-07_1621` (PASS attempt 1, wall 91 s, every verifier PASS or
# SKIPPED), measuring `BATCH_COMPLETE v1 total=10 passed=5 failed=0 skipped=5
# category=AutoRecord scene=FLIGHT` - the predicted line EXACTLY, with EVERY PREDICTION
# IN THIS HEADER CONFIRMED cell for cell. The lane's reason to exist,
# `EvaTwiceFromSameCapsuleProducesTwoBranches`, EXECUTED AND PASSED for the first time
# anywhere: `source='Kerbal X' first='Valentina Kerman' second='Bob Kerman'
# evaBranches=2`. None of its six escape hatches fired.
#
# IT FLEW TWICE, AND BOTH FLIGHTS PASSED WITH THE IDENTICAL TALLY - which is itself a
# measurement rather than a formality. Flight 1 (`2026-09-07_1612`) read the same
# `10/5/0/5` on the PRE-FIX DLL, where the ORBITING (H68) and LANDED (H69) siblings both
# red on a runner defect: the isolated batch's per-cell baseline restore handed the next
# cell control about 160 ms after the reload's level-load, while KSP's
# `GameEvents.onFlightReady` for the RELOADED scene fired about 130 ms INTO that cell, and
# `ParsekFlight`'s handler for that event resets the post-switch watch (`Post-switch
# auto-record disarmed: ... reason=flight ready reset`). THIS PAD HOST WON THAT RACE ON
# BOTH FLIGHTS and H61's pad host had won it on 2026-09-06, which is exactly why the
# defect survived a green census and surfaced only when the host set widened - a
# same-category, different-host lane is the instrument that found it. Filed as
# `ISOLATED-RESTORE-HANDS-OFF-BEFORE-ONFLIGHTREADY` and fixed in `Source/`
# (`ParsekFlight.FlightReadyObserved` plus the `QuickloadResumeHelpers` readiness
# predicates). The pin below cites FLIGHT 2, on the fixed DLL, because a pin should name
# the build the suite ships.
#
# H61 flies this category over `gs1-two-stage-pad` and went green on 2026-09-06
# (`2026-09-06_2010`, `total=10 passed=5 failed=0 skipped=5`). One of its five measured
# skips is a CREW property rather than a situation one:
#   * `EvaTwiceFromSameCapsuleProducesTwoBranches` - "requires at least two crew in the
#     active vessel, got 1"
# and H61's own header names the host that would buy it, in so many words: "`eva3-pad-3crew`
# is the obvious candidate ... deliberately left to a follow-up lane rather than swapped in
# here, because this host is the one that satisfies the other nine."
#
# THIS IS THAT FOLLOW-UP LANE. It changes exactly one thing about H61: the fixture.
# `H68-autorecord-orbiting` and `H69-autorecord-landed` buy the situation half of the same
# residue.
#
# -------------------------------------------------------------------------------------
# WHY IT IS A SIBLING RATHER THAN A REPLACEMENT FOR H61, and H61's header already says it:
# swapping this host in "trades one cell for another rather than closing the lane".
# `eva3-pad-3crew` carries THREE LAUNCH CLAMPS, and
# `RealSpawnControl_WarpToRecordingEnd_OnPad_DoesNotAutoStartLaunchRecording` carries an
# explicit `ActiveVesselHasLaunchClamps()` skip whose own comment says why: a clamped pad
# craft never leaves PRELAUNCH, so a forward time-jump produces no active-vessel situation
# transition for the suppression path to skip, and the cell's `skipCount` assertion would
# fail for an environmental reason rather than a product regression. So this lane pays one
# cell (the RSC canary) to buy another (the two-EVA branch cell), which is why H61 keeps
# its unclamped host and this lane is added beside it rather than in place of it.
#
# -------------------------------------------------------------------------------------
# WHAT THIS LANE BUYS, and it is ONE cell nothing has ever executed.
#
# `EvaTwiceFromSameCapsuleProducesTwoBranches` is the regression gate for the
# background-parent EVA branch path: EVA one kerbal, let KSP auto-switch focus to it (which
# parks the capsule's recording into the tree BackgroundMap), walk that kerbal 12 m clear of
# the hatch, switch BACK to the capsule, disarm the post-switch watch so the capsule stays
# idle-but-active, then EVA a SECOND kerbal and assert the branch was created through
# `path=background-parent` rather than through an orphan auto-record. It also asserts NO
# recorder data was dropped and that the second recorder started against a valid tree
# recording. That is the shape of the original reproducer (the first kerbal had walked away
# to plant a flag before the user EVA'd the second), and no committed lane has run it.
#
# THE HOST IS THE REPRODUCER'S OWN SHAPE. `eva3-pad-3crew` is a PRELAUNCH Kerbal X with
# Valentina, Bob and Bill aboard - the same fixture `EVA-3-multi-kerbal` flies - so the
# EVA / auto-switch / walk-clear / switch-back sequence happens on the pad, where KSP's
# hatch obstruction check and its focus hand-off behave the way the bug report describes.
# H68 also satisfies the 2-crew guard, in ORBIT, where the walk-clear step has no committed
# precedent; between the two this is the surer host and H68 is the interesting one.
# THE CENSUS SETTLED THAT PAIR, and not the way "surer" suggests: this host PASSED the
# cell, and H68 SKIPPED it on `capsule hatch still obstructed after moving the first EVA
# kerbal clear` - in microgravity the first kerbal floats where `MoveVesselClearOfAnchor`
# put it instead of falling away, so `spawnEVA` refuses the second EVA. The pad is not the
# surer host for this cell, it is the ONLY committed one, and H70 is therefore the sole
# claimant rather than a redundant second.
#
# -------------------------------------------------------------------------------------
# WHAT THIS LANE DOES **NOT** BUY:
#   * D1 `auto-record-first-mod-switch`. Same as H61: all three POSITIVE post-switch cells
#     want LANDED or ORBITING, so the only one that executes here is the NEGATIVE
#     `AutoRecordOnPostSwitch_NoOp_DoesNotStart`, and a negative case is not the token.
#     H68 and H69 are where it is claimed.
#   * `EvaKerbalGhostHasVesselSnapshot`, whose PRELAUNCH/LANDED/SPLASHED skip refuses any
#     pad host by construction - H61 measured that skip and this lane reproduces it.
#   * `RealSpawnControl_WarpToRecordingEnd_OnPad_*`, per the clamp argument above.
# =====================================================================================
description = "LIVE-PROVEN 2026-09-07, run 2026-09-07_1621 (PASS attempt 1, wall 91 s), total=10 passed=5 failed=0 skipped=5 - the predicted line exactly, every prediction confirmed cell for cell, and EvaTwiceFromSameCapsuleProducesTwoBranches EXECUTED AND PASSED for the first time anywhere (source='Kerbal X' first='Valentina Kerman' second='Bob Kerman' evaBranches=2, none of its six escape hatches fired). H61's ten AutoRecord cells over eva3-pad-3crew, the 86-part PRELAUNCH Kerbal X carrying Valentina, Bob and Bill - the host H61's own header names as the one that would buy its CREW skip. THE HEADLINE IS ONE CELL NOTHING HAS EVER EXECUTED: EvaTwiceFromSameCapsuleProducesTwoBranches, which H61's census measured skipping with 'requires at least two crew in the active vessel, got 1'. It is the regression gate for the background-parent EVA branch path - EVA one kerbal, let KSP auto-switch focus to it (parking the capsule's recording into the tree BackgroundMap), walk that kerbal 12 m clear of the hatch, switch back to the capsule, keep it idle-but-active, then EVA a SECOND kerbal and assert the branch came through `path=background-parent` rather than an orphan auto-record, with no dropped recorder data. That is the original reproducer's shape and this host is the original reproducer's shape. IT IS A SIBLING RATHER THAN A REPLACEMENT FOR H61, exactly as H61's header predicted: eva3-pad-3crew carries THREE LAUNCH CLAMPS, and RealSpawnControl_WarpToRecordingEnd_OnPad_* carries an explicit ActiveVesselHasLaunchClamps() skip (a clamped craft never produces the launch situation transition whose suppression the cell asserts), so the swap trades one cell for another. The launch cell is unaffected: WaitForLaunchAutoRecordStart calls ReleaseLaunchClampsOnActiveVessel() before it waits, and a craft that then fails to lift off classifies to a Skip rather than a Fail. PREDICTED 5 EXECUTE / 5 SKIP - the same count as H61 with a different membership, which is the point - AND MEASURED AS EXACTLY THAT: the five predicted executions passed (the two-EVA cell, launch, EVA-from-pad, the post-switch no-op, the FF canary) and the five predicted skips named the five predicted reasons, the Real Spawn Control cell on the CLAMP string rather than a situation string. This lane flew twice and read the identical tally on both the pre-fix and the fixed DLL, unlike its ORBITING and LANDED siblings, which red on the ISOLATED-RESTORE-HANDS-OFF-BEFORE-ONFLIGHTREADY runner defect a pad host wins the race against; the pin cites the second, fixed-DLL flight. The recordings count is pinned {0,0} as the campaign-isolation assertion."
