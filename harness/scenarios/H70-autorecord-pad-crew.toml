#  - `auto-record-first-mod-switch` is NOT claimed, for H61's reason exactly: all three
#    POSITIVE post-switch cells want LANDED or ORBITING and only the NEGATIVE no-op one
#    executes on a pad. H68 and H69 claim it.
#
# SANDBOX on a FLIGHT-scene pad craft (D14).
#
# NOT CLAIMED, deliberately: D9 `fast-forward`, even though the FF canary executes. Its
# SUBJECT is auto-record SUPPRESSION - it asserts the FF does not start a bogus recording -
