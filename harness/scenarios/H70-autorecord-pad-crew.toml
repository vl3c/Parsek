# cell that asserts the playback and the spawn. Same ruling H61 made.
D1  = ["auto-record-launch", "auto-record-eva"]
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (the H7 lesson, restated by H21 and H61): run.py reads
# `expectations.allowedAnomalies` as a BARE key, and a bare key written AFTER an
# `[expectations.<sub>]` header is TOML-scoped to that sub-table and never read.
# `hlib.validate_spec` rejects the misplaced form, so this must stay ahead of the
# sub-tables.
allowedAnomalies = []

[expectations.recordings]
# ZERO, AND IT DOUBLES AS THE CAMPAIGN-ISOLATION ASSERTION - H61's row unchanged, because
# what it asserts is a property of the ISOLATED PATH rather than of the host. Every
# executing cell creates a real live recording (a launch tree, one or TWO EVA branches, a
# synthetic keep-vessel tree); each cell restores a quickloaded flight baseline afterwards
# and the batch teardown then reverts persistent.sfs from the clean `.bak`
# `CaptureBatchBaseline` wrote before the marker. `eva3-pad-3crew` stages an EMPTY corpus
# (0 `.prec` sidecars) and injects nothing, so the produced save must carry no recordings
# at all. A non-zero count does not mean "a cell leaked" - it means the isolated path's
# restore contract did not hold, which is exactly the property R5 is betting on and should
# red loudly. THIS LANE LEANS ON IT HARDER THAN H61 DOES: the two-EVA cell is the only
# committed cell that creates TWO branches and switches focus twice inside one restore
# window.
# (`test_each_pins_the_recordings_count_its_fixture_implies` requires this exact {0, 0} for
# an empty-corpus template; a window would accept a leaked tree or a failed baseline
# revert.)
count = { min = 0, max = 0 }

