[fixture]
# `eva3-pad-3crew`, the `EVA-3-multi-kerbal` host, and the ONLY committed fixture with
# three crew aboard a PRELAUNCH craft. Active vessel index 1 of 2: the 86-part `Kerbal X`,
# `type = Ship`, `sit = PRELAUNCH`, SANDBOX, with Valentina Kerman, Bob Kerman and Bill
# Kerman in its crewed parts.
#
# READ OFF THE COMMITTED BYTES, one line per thing a cell reads or is refused by:
#   * `sit = PRELAUNCH` + 8 `ModuleEngines` - the `staging` fixture requirement in full, so
#     this lane needs NO override (H68 and H69 do). `AutoRecordOnLaunch_StartsExactlyOnce`
#     throttles to 1, calls `StageManager.ActivateNextStage()` and waits 30 s for the craft
#     to leave PRELAUNCH.
#   * 3 CREW IN PARTS - `CountCrewInParts(vessel) >= 2` is the guard
#     `EvaTwiceFromSameCapsuleProducesTwoBranches` refuses on, and the cell needs a SECOND
#     `TryGetEvaSource` hit after the first kerbal has left, which three aboard makes
#     comfortable rather than marginal.
#   * 3 LAUNCH CLAMPS, and they cut both ways, which is why they are stated rather than
#     glossed:
#       - `RealSpawnControl_WarpToRecordingEnd_OnPad_*` SKIPS on them by its own guard.
#         That is the price of this host and it is paid deliberately (see the header).
#       - `AutoRecordOnLaunch_*` is NOT affected: `WaitForLaunchAutoRecordStart` calls
#         `ReleaseLaunchClampsOnActiveVessel()` as its FIRST statement, "so a clamped pad
#         craft can actually lift off". Its timeout then classifies through
#         `ClassifyLaunchWaitTimeout` into `SkipNoThrust` / `SkipNeverLiftedOff` rather
#         than a Fail, so even a TWR surprise on an 86-part stack costs a skip, not a red.
#       - `TimelineFastForward_OnPad_*` carries NO clamp guard, and reading its body says
#         why that is correct rather than an oversight: it counts the FORWARD suppression
#         ARM lines and asserts zero auto-record starts, and it reads `skipCount` without
#         asserting on it. The RSC cell is the one whose `skipCount` assertion needs the
#         transition.
#   * 86 PART nodes - the largest host in the isolated family. See the runtime block for
#     why that does not threaten the budget.
#
# `injectedRecordings = "none"` and an EMPTY corpus (0 `.prec` sidecars), which is what
# makes the `{0, 0}` count pin below a real assertion rather than a formality.
saveTemplate = "fixtures/saves/eva3-pad-3crew"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# H61's SHAPE, WITH ONE ADDITION, and the addition is `verboseLogging` rather than
# anything that touches the batch.
#
# WHY THE `autoRecordOnLaunch = false` PIN STAYS - H61's reasoning, which holds unchanged
# because the cells are the same cells: this lane tests auto-record, so pinning the flag
# false looks like it would disable the subject. It does not. EVERY `AutoRecord` cell that
# needs a flag ON sets that flag ITSELF inside a `try` and restores the captured original
# in `finally` - `AutoRecordOnLaunch_*` sets `autoRecordOnLaunch`, `AutoRecordOnEvaFromPad_*`
# sets `autoRecordOnEva`, `EvaTwiceFromSameCapsuleProducesTwoBranches` sets
# `autoRecordOnEva` too, the post-switch cells set
# `autoRecordOnFirstModificationAfterSwitch`, and both #526 canaries set
# `autoRecordOnLaunch`. So the driver's pin cannot reach any cell's subject. What it DOES
# buy is a KNOWN IDLE start: six of the ten cells carry an `if (flight.IsRecording)
# InGameAssert.Skip(...)` guard, and a load-time auto-record firing on scene entry would
# self-skip them for an environmental reason that looks exactly like a product defect.
#
# `verboseLogging = true` is REQUIRED, not cosmetic. The runner writes each cell's per-test
# `SKIPPED: <name> - <reason>` line at VERBOSE (`InGameTestRunner.cs:3610`), and this
# lane's whole product is a cell-by-cell roster: it matters WHICH of
# `EvaTwiceFromSameCapsuleProducesTwoBranches`'s SIX run-time escape hatches fires if the
# cell does not execute to completion, because they call for opposite fixes (KSP never
# auto-switched vs the hatch is still obstructed vs the capsule would not settle idle). A
# bare `skipped=N` cannot be turned into a roster afterwards, and inferring a name from a
# count is the guess `MEASURED_SKIPPED` exists to forbid.
#
# NOTE on the recording-rules suppression, same as H61: `hlib.spec_expects_live_recording`
# reads the DRIVER (a StartRecording step, or an `autoRecordOnLaunch = true` pin) and so
# returns False here, suppressing REC-001/REC-003 even though this run genuinely records
# from inside the test bodies. That is a suppression, so it can only under-detect; the
# BATCH_COMPLETE pin is the real gate.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "RunTests",   args = { category = "AutoRecord", isolated = "true" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

