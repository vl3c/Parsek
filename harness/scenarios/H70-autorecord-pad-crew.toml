#    harness flies the `automation/stock-minimal` instance, NOT the one `dotnet build`
#    deploys to, so its ABSENCE means a stale `Parsek.dll` rather than a Parsek regression.
#  - `Using batch baseline slot ... for 10 restore-after-run test(s)` - emitted ONLY by
#    `InGameTestRunner.PrepareBatchFlightRestoreExecution`, which `RunCategory` never
#    calls, so it proves the ISOLATED entry point INDEPENDENTLY of the tally. The literal
#    10 is DERIVED and must stay a literal: a `[0-9]+` there is satisfied by a batch that
#    admitted a different population.
#  - THE CELL TOKEN, which is what an interim `passed=` cannot give, and here it carries
#    more weight than on either sibling: this lane exists for ONE cell that has never run,
#    that cell has no registry value, and an interim `passed=5` would be satisfied by the
#    same five H61 already runs. `EvaTwiceFromSameCapsuleProducesTwoBranches:` is written
#    only AFTER the cell has asserted the second branch came through `path=background-parent`,
#    that no recorder data was dropped, and that the second recorder started against a valid
#    tree recording. The crew names are regexed (KSP's roster order is not a fixture
#    guarantee) but `evaBranches=` is pinned to at least 2, which is the assertion in a
#    number. THE CENSUS MEASURED `first='Valentina Kerman' second='Bob Kerman'
#    evaBranches=2`, and the name classes STAY classes for the reason above: the roster
#    order KSP hands the cell is not a property this fixture pins.
required  = [
  "runtests start category=AutoRecord isolated=true",
  "Using batch baseline slot .* for 10 restore-after-run test\\(s\\)",
  "BATCH_COMPLETE v1 total=10 passed=5 failed=0 skipped=5 category=AutoRecord scene=FLIGHT",
  "EvaTwiceFromSameCapsuleProducesTwoBranches: source='.*' first='.*' second='.*' evaBranches=(?:[2-9]|[1-9][0-9]+)",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# Budget arithmetic (M-A5 S8), H61's shape unchanged: `LoadGame` is ITSELF in
# `hlib.DEFERRED_SEAM_VERBS`, so run.py gives EVERY deferred step
# `required_step_wait(max(step budget, SEAM_FALLBACK_DEFERRAL_SECONDS=600))` = 660 s
# regardless of the declared budget. Worst case is 660 + 660 = 1320, and 1400 clears it so
# a genuine seam TIMEOUT surfaces as a retryable driver-INVALID rather than a harness KILL
# that prints no tally. Enforced by
# `IsolatedBatchWiringGroupTests.test_the_budget_clears_the_deferred_worst_case`.
#
# IS 1400 ENOUGH FOR THE LARGEST HOST IN THE FAMILY? MEASURED: 91 s WALL on run
# `2026-09-07_1621` (and the same order on flight 1), against the ~150 s of batch the
# projection below allowed for - so the part-count scaling argument was conservative
# rather than wrong. The projection is kept because it is what sizes the next host.
# This is an 86-part craft where H61's
# was 15, and the ten quickload baseline restores are the cost that scales with part count.
# The bracketing measurements: H61 took 80 s WALL for this exact ten-cell batch on 15
# parts; H21 measured a two-cell isolated batch at 29.6 s of batch time inside a 101 s wall
# on a 73-PART launcher, i.e. ~15 s per launch-and-restore cycle at roughly this size. Ten
# such cycles project to ~150 s of batch, and the two-EVA cell adds its own waits (a 10 s
# branch wait, a 10 s focus wait, two 0.5 s settles, then the second branch wait). That is
# well inside the 540 s `RunTests` cap (`hlib.MAX_DEFERRED_STEP_BUDGET_SECONDS`, a schema
# ceiling rather than a preference) with room for the difference between 73 and 86 parts.
# If a census ever times out INSIDE the batch, the fix is to split the category across two
# lanes by situation, not to raise that number.
budgetSeconds = 1400

[retry]
policy = "once"

[expectedFail]
bugId = ""
