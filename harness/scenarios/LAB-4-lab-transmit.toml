schema = 1
id = "LAB-4-lab-transmit"
tier = "operator"
# THE SCIENCE-LAB PROGRAM, lane LAB-4 (plan `docs/dev/research/lab-test-program-2026-10-17.md`,
# "LAB-4 transmit, twice, and a scene change mid-transmission"). NEVER FLOWN: its first flight
# is a READING run, so it is `operator` and tagged `pending-flight` until that run pins the
# measured values.
#
# DEPENDENCY: PR #2136 (`claude/lab-idle-veto`, merged to main 2026-10-17, NOT in this branch's
# DLL until main is merged): the phase-2 scene exit must log `IsTreeIdleOnPad: not idle - tree
# has 1 lab payout(s)` and commit the tree. On a DLL without it that pad tree is idle and the
# exit discards it (`Idle on pad at scene exit`), which reds this lane on purpose.
#
# HOST: `lab-pad-seeded` (harness/tools/build_lab_seeded_variants.py): SCIENCE_SANDBOX, science
# 100, the LABX Orbital Lab (vessel persistentId 2200110055) PRELAUNCH on the KSC pad, its
# Large.Crewed.Lab seeded with dataStored 204 (all sixteen subjects) and storedScience 12.5,
# Research off, Valentina in the pod, Bob (Scientist, level 0) in the lab, a Communotron 16-S
# (SurfAntenna: DIRECT, packetSize 2, packetInterval 0.6, 12 EC per packet) as the only
# antenna stock can transmit through (the pod and Octo internals cannot), ground stations on.
# Fixture UT 355.8; the smoke load `2026-10-17_2023` settled at UT 357.4 and read the lab as
# `lab:storedScience=12.50 dataStored=204.00;Research:active=0`.
#
# STOCK (decompiled 1.12.5 ModuleScienceLab): Transmit Science sends
# ScienceData(floor(storedScience), "sciencelab@Kerbin", triggered) through the best
# transmitter; it is refused with a screen message only while transmitting, below
# storedScience 1 and with no transmitter. At transmission complete it calls
# AddScience(storedScience, ScienceTransmission) and then subtracts only floor(storedScience):
# the fraction stays in the lab and is paid AGAIN by the next transmit. The decrement lands at
# completion, never at the press, and `transmittingData` is not persistent. The seam's
# `labtransmit` presses the KSPEvent and answers OK either way (it does not read the outcome),
# so a refused press is proved by its EFFECTS: no credit and an unchanged lab.
# Parsek (Patches/ScienceLabCreditCapturePatch.cs -> GameStateRecorder.OnScienceLabCredited):
# `Game state: ScienceLabCredited +<gross F2> reason='ScienceTransmission' vessel='..' ut=..
# recordingId='<live recording or empty>'`, beside stock's own pool move
# `Game state: ScienceChanged +<F1> (ScienceTransmission) <U+2192> <pool F1>` (matched with
# `[^0-9\r\n]+` across the arrow). An untagged credit goes straight to the ledger
# (`KSC spending recorded: type=ScienceLabEarning, UT=.., key=ScienceTransmission`).
#
# THE STORY, three phases on the same craft.
#   PHASE 1, the interrupted transmission (recording A). Record 14 s at 1x, press Transmit
#   (12 Mits = 6 packets, about 3.6 s at the 16-S rate) and drive ExitToSpaceCenter on the
#   very next step. The scene change drops the transmission: no credit, no stock gain. The
#   press line still reads 12.50 (the decrement is at completion). A pad recording whose only
#   event is an interrupted transmit is idle on the pad, so the exit DISCARDS it: the negative
#   control for the lab-payout veto (no payout landed, so nothing vetoes).
#   PHASE 2, the first transmit and the refused second (recording B). Reload the exit's save
#   flying the lab: it still holds 12.50 / 204.00 (the dropped transmission took nothing).
#   Record, transmit: exactly one credit +12.50 tagged to recording B (backreference to the
#   `startrecording` id), stock's +12.5 to 112.5, the lab at 0.50. Transmit again at 0.50:
#   stock refuses (below 1), no credit, the lab unchanged. Exit: the tree is NOT idle, its one
#   lab payout vetoes the discard (PR #2136), and the scene exit auto-commits it (autoMerge).
#   PHASE 3, the refill and the fraction paid again (no recording). Reload flying the lab
#   (0.50 persisted), Start Research, rails-warp to UT 20400 at up to 1000x, Stop Research at
#   1x, read the lab (S2), transmit, read again. The credit equals S2 exactly (the same F2
#   reading of the same float; research is stopped), so it includes the 0.50 the first
#   transmit left behind; the lab keeps S2 - 1 (the same two decimals). With no recorder the
#   credit is untagged and booked at once as a KSC ledger row. Stock's gain is +1.3 .. +1.7
#   and the pool reads 113.x .. 114.x (112.5 + S2).
#
# THE RATE (decompiled ModuleScienceConverter.PostProcess, lab cfg researchTime 7,
# dataProcessingMultiplier 0.5, scienceMultiplier 5, Bob = 1 scientist): science per second
# = 5 * 0.5 * 1 * dataStored / 1e7 = 5.1e-5 at 204 data, about 1.1 per Kerbin day. Phase 3
# researches from about UT 414 to 20400 (19,986 s): +1.02, so S2 is about 1.52 and dataStored
# about 203.80. Float effects: at 1x and 10x the per-step data use is under half an ulp of
# 204 and rounds to nothing, so dataStored may read a little high. EC: 8 RTGs give 6 EC/s
# against Research's 5 EC/s and 1,900 EC stored; at 1000x each step is 20 s, well inside the
# battery. Windows: S2 1.30 .. 1.70, dataStored 203.70 .. 203.99. BELIEF until the first
# flight reads them; a converter that does not run on rails on the pad reads 0.50 and the
# second transmit is refused (the T2 contracts red).
#
# NOT HERE: the S2 `transmitting=1` reading the plan names (not built; phase 1's transmission
# is proved in flight only by phase 2's transmit through the same link); LedgerGroundTruth
# (`RunTests category=LedgerGroundTruth` in SCIENCE_SANDBOX is unproven - a later lane or a
# separate step after the first green flight); the strategy take (LAB-12).
#
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse - no flown lane boots lab-pad-seeded
# yet; LAB-9b and LAB-14 share the host but each ends the flight differently (revert,
# recover). (2) no idle waits - every wait is an explicit-UT `WarpToUT`, 1x only for the
# recordings and the transmissions (the 16-S is 0.6 s per packet), the refill at rails warp.
# (3) no dwells. (4) no burns. (5) no coast. (6) fail fast - a refused verb is a step failure
# at once; retry `once` because the first flight is not yet known to be deterministic.
# (7) count window - recording A is discarded, recording B committed: {1,1}. (8) tier -
# operator until the reading run; promote by the measured p50 (expected about 4 min).
# (9) flight_efficiency.py after the first green flight.
#
# WHAT A FIRST FLIGHT CAN FALSIFY: the link (no credit at phase 2's transmit means stock found
# no transmitter or no connection on the pad); phase 1's drop (a credit after the exit means
# the transmission outlived the scene change, or the exit took longer than 3.6 s); the idle
# discard of recording A and the payout veto of recording B (PR #2136); the tag (a credit
# carrying another id or none while B was live); the refill window (EC, rails catch-up); the
# fraction paid again (a credit below S2); the UT margins (phase 2 assumes the exit's save at
# about UT 373 and phase 3 about UT 411).
description = "LAB-4: on the KSC pad, a science lab holding 12.5 science transmits through the Communotron 16-S; a transmission cut by a scene change books nothing and its idle pad recording is discarded, the next transmit books exactly 12.50 tagged to the live recording beside stock's +12.5, a second transmit below 1 is refused with the lab unchanged, the lab payout keeps the pad recording at the scene exit, and after rails-warp research the next transmit pays the whole stored science including the fraction left by the first."
instanceProfile = "stock-minimal"
tags = ["science-lab", "science", "transmit", "scene-exit", "rails-warp", "LAB-4", "pending-flight"]

[fixture]
saveTemplate = "fixtures/saves/lab-pad-seeded"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                              expect = "OK" },
  { cmd = "DiscardTree",                                                                expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  # The scene exits commit (or idle-discard) the pad tree; without autoMerge they refuse
  # `dialog-required`.
  { cmd = "SetSetting",        args = { name = "autoMerge", value = "true" },           expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  # PHASE 1: record 14 s, press Transmit, exit on the very next step (mid-transmission).
  { cmd = "StartRecording",                                                             expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                             expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "372", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab4-interrupt-before" },              expect = "OK" },
  { cmd = "PartAction",        args = { button = "labtransmit", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                          expect = "OK", budget = 120 },
  # PHASE 2: fly the lab again; transmit (12.50), then a refused transmit at 0.50; exit.
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent", focusPid = "2200110055" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                              expect = "OK" },
  { cmd = "DiscardTree",                                                                expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoMerge", value = "true" },           expect = "OK" },
  { cmd = "MissionMark",       args = { label = "lab4-reloaded-1" },                    expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "StartRecording",                                                             expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                             expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "390", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab4-t1-before" },                     expect = "OK" },
  { cmd = "PartAction",        args = { button = "labtransmit", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "402", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab4-t1-after" },                      expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "PartAction",        args = { button = "labtransmit", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "410", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab4-refused-after" },                 expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                          expect = "OK", budget = 120 },
  # PHASE 3: fly the lab again (no recording); research to about 1.5; transmit it all.
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent", focusPid = "2200110055" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                              expect = "OK" },
  { cmd = "DiscardTree",                                                                expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "MissionMark",       args = { label = "lab4-reloaded-2" },                    expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "PartAction",        args = { button = "startconverter", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "20400", maxRate = "1000" },               expect = "OK", budget = 540 },
  { cmd = "PartAction",        args = { button = "stopconverter", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "MissionMark",       args = { label = "lab4-t2-before" },                     expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "PartAction",        args = { button = "labtransmit", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "20412", maxRate = "1" },                  expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab4-t2-after" },                      expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "FlushAndQuit",                                                               expect = "OK" },
]

[dimensionsCovered]
D1  = ["commit-scene-exit", "auto-merge"]
D8  = ["science"]
D14 = ["kerbin", "science-mode", "scene-flight", "scene-ksc", "warp-1x", "warp-rails"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Recording A is discarded idle at the first exit; recording B is committed at the second.
count = { min = 1, max = 1 }

[expectations.logContracts]
required = [
  # The seeded lab, as the fixture builder wrote it.
  "partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=204\\.00;Research:active=0'",
  # --- PHASE 1: the interrupted transmission ---
  # The press reads the lab unchanged: the decrement lands at completion, not at the press.
  "(?s)MISSIONMARK label=lab4-interrupt-before (?:(?!partaction applied button=).)*?partaction applied button=labtransmit pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*event=TransmitScience [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=204\\.00;",
  # The exit is the very next verb after the press.
  "(?s)partaction applied button=labtransmit pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=12\\.50 (?:(?!recv id=[0-9]+ cmd=(?!ExitToSpaceCenter )).)*?exittospacecenter start ",
  "exittospacecenter start scene=FLIGHT autoMerge=true hasActiveTree=true hasPendingTree=false ",
  # Nothing was paid between the press and the reload, by Parsek or by stock.
  "(?s)MISSIONMARK label=lab4-interrupt-before (?:(?!ScienceLabCredited)(?!\\(ScienceTransmission\\)).)*?MISSIONMARK label=lab4-reloaded-1 ",
  # The pad recording whose only event was the cut transmission is idle, and is discarded.
  "(?s)MISSIONMARK label=lab4-interrupt-before (?:(?!MISSIONMARK label=lab4-reloaded-1 ).)*?Idle on pad[^\\r\\n]*auto-discarding",
  # ... and after the reload the lab still holds everything (the cut transmission took nothing).
  "(?s)MISSIONMARK label=lab4-reloaded-1 (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=204\\.00;Research:active=0'",
  # --- PHASE 2: the first transmit ---
  # Exactly one credit of the whole 12.50, tagged to the recording started after the reload, ...
  "(?s)MISSIONMARK label=lab4-reloaded-1 (?:(?!MISSIONMARK label=lab4-t1-after ).)*?startrecording recordingId=([0-9a-f]{32}) already=false(?:(?!MISSIONMARK label=lab4-t1-after ).)*?MISSIONMARK label=lab4-t1-before (?:(?!MISSIONMARK label=lab4-t1-after ).)*?Game state: ScienceLabCredited \\+12\\.50 reason='ScienceTransmission' vessel='LABX Orbital Lab' ut=[0-9.]+ recordingId='\\1'",
  # ... beside stock's own gain of the same 12.5, 100 -> 112.5, ...
  "(?s)MISSIONMARK label=lab4-t1-before (?:(?!MISSIONMARK label=lab4-t1-after ).)*?Game state: ScienceChanged \\+12\\.5 \\(ScienceTransmission\\)[^0-9\\r\\n]+112\\.5(?![0-9])",
  # ... and the lab keeps the fraction (12.5 - floor 12.5).
  "(?s)MISSIONMARK label=lab4-t1-after (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.50 dataStored=204\\.00;",
  # The second press at 0.50: stock refuses below 1. The press answers OK, the lab is unchanged
  # after the wait, and nothing is paid (below).
  "(?s)MISSIONMARK label=lab4-t1-after (?:(?!MISSIONMARK label=lab4-refused-after ).)*?partaction applied button=labtransmit pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*event=TransmitScience [^\\r\\n]*state='lab:storedScience=0\\.50 ",
  "(?s)MISSIONMARK label=lab4-refused-after (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.50 dataStored=204\\.00;",
  "(?s)MISSIONMARK label=lab4-t1-after (?:(?!ScienceLabCredited)(?!\\(ScienceTransmission\\)).)*?MISSIONMARK label=lab4-refused-after ",
  # The exit: the lab payout vetoes idle-on-pad (PR #2136) and the tree auto-commits.
  "(?s)MISSIONMARK label=lab4-refused-after (?:(?!MISSIONMARK label=lab4-reloaded-2 ).)*?(?:IsTreeIdleOnPad|IsActiveTreeIdleOnPad): not idle - tree has 1 lab payout\\(s\\) tree='LABX Orbital Lab'",
  "(?s)MISSIONMARK label=lab4-refused-after (?:(?!MISSIONMARK label=lab4-reloaded-2 ).)*?full-fidelity auto-commit \\(scene-exit[^\\r\\n]*\\): tree='LABX Orbital Lab' recordings=1 ",
  # --- PHASE 3: the refill and the second paid transmit ---
  # The fraction persisted across the exit and the reload; Research is off.
  "(?s)MISSIONMARK label=lab4-reloaded-2 (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.50 dataStored=204\\.00;Research:active=0'",
  "(?s)MISSIONMARK label=lab4-reloaded-2 (?:(?!MISSIONMARK ).)*?partaction applied button=startconverter pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*event=StartResourceConverter [^\\r\\n]*Research:active=1",
  "partaction applied button=stopconverter pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*event=StopResourceConverter [^\\r\\n]*Research:active=0",
  # One stock day of research at 204 data: S2 in 1.30 .. 1.70, dataStored 203.70 .. 203.99.
  "(?s)MISSIONMARK label=lab4-t2-before (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=1\\.(?:[3-6][0-9]|70) dataStored=203\\.[7-9][0-9];Research:active=0'",
  # The credit is the WHOLE stored amount read just before the press (the 0.50 the first
  # transmit left, paid again), untagged with no recorder live ...
  "(?s)MISSIONMARK label=lab4-t2-before (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=([0-9]+\\.[0-9]{2}) (?:(?!MISSIONMARK label=lab4-t2-after ).)*?Game state: ScienceLabCredited \\+\\1 reason='ScienceTransmission' vessel='LABX Orbital Lab' ut=[0-9.]+ recordingId=''",
  # ... booked at once as a KSC ledger row ...
  "(?s)MISSIONMARK label=lab4-t2-before (?:(?!MISSIONMARK label=lab4-t2-after ).)*?KSC spending recorded: type=ScienceLabEarning, UT=[0-9.]+, key=ScienceTransmission",
  # ... beside stock's own gain (1.3 .. 1.7), the pool 112.5 + S2.
  "(?s)MISSIONMARK label=lab4-t2-before (?:(?!MISSIONMARK label=lab4-t2-after ).)*?Game state: ScienceChanged \\+1\\.[3-7] \\(ScienceTransmission\\)[^0-9\\r\\n]+11[34]\\.[0-9](?![0-9])",
  # The lab keeps S2 - floor(S2) = S2 - 1: the same two decimals.
  "(?s)MISSIONMARK label=lab4-t2-before (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=1\\.([0-9]{2}) (?:(?!MISSIONMARK label=lab4-t2-after ).)*?MISSIONMARK label=lab4-t2-after (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.\\1 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "partaction rejected",
  "partaction error ",
  "warptout refused",
  "exittospacecenter rejected",
  # Exactly two lab credits in the whole run (phase 2's first transmit, phase 3's), each once.
  "(?s)(?:Game state: ScienceLabCredited .*?){3}",
  "(?s)MISSIONMARK label=lab4-t1-before (?:(?!MISSIONMARK label=lab4-t1-after ).)*?ScienceLabCredited(?:(?!MISSIONMARK label=lab4-t1-after ).)*?ScienceLabCredited",
  "(?s)MISSIONMARK label=lab4-t2-before (?:(?!MISSIONMARK label=lab4-t2-after ).)*?ScienceLabCredited(?:(?!MISSIONMARK label=lab4-t2-after ).)*?ScienceLabCredited",
  # No lab credit outside the two transmit windows (the reloads, the warp, the exits).
  "(?s)MISSIONMARK label=lab4-t1-after (?:(?!MISSIONMARK label=lab4-t2-before ).)*?ScienceLabCredited",
  "(?s)MISSIONMARK label=lab4-t2-after .*?ScienceLabCredited",
  # The interrupted pad recording is no payout; the paying one is never idle.
  "(?s)MISSIONMARK label=lab4-interrupt-before (?:(?!MISSIONMARK label=lab4-reloaded-1 ).)*?not idle - tree has [0-9]+ lab payout",
  "(?s)MISSIONMARK label=lab4-refused-after (?:(?!MISSIONMARK label=lab4-reloaded-2 ).)*?Idle on pad[^\\r\\n]*auto-discarding",
  # The lab never paid less than its stored science (a strategy take would show here).
  "Lab payout net of a strategy take",
  "Exploded!!",
]

[runtime]
# Three LoadGame steps (up to 300 s each, about 10 s typical after the boot), two scene exits,
# about 60 s of 1x game time, and one rails warp of about 20,000 s at up to 1000x (about 30 s).
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
