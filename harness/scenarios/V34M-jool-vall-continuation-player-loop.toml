schema = 1
id = "V34M-jool-vall-continuation-player-loop"
# =====================================================================================
# AUTHORED 2026-11-14. Fixture `jool-vall-recorded` harvested --keep-parsek from
# B39-jool-vall-continuation run `2026-11-14_1857` (PASS, 8d4e8b01c); this lane flew green
# on its first flight `2026-11-14_1906` and its count window is re-pinned to {6, 7} off
# the fixture's 6 sidecars (the flight read 6). Order and commands:
# docs/dev/plans/moon-lane-drafts/README.md.
#
# THE PLAYER-LOOP HALF, V33M's shape exactly (live-proven 2026-11-07 on Laythe):
# MissionConfig loop=true + StartLoopPlayback on the Kerbin -> Jool -> Vall tree,
# reading the loop unit's build lines, then the MoonArrivalHold batch at the Space
# Center. No jump table: its UTs come from this lane's own reading, and a Tracking
# Station lane (V33T's shape) follows once it is green.
#
# THE SUBJECT. `jool-vall-recorded`, harvested from `B39-jool-vall-continuation`: the Jool -> Vall hop
# appended to `jool-orbit-recorded`'s committed Kerbin -> Jool tree
# `6ec68e87b782476f970a71df8c8b4685` (the forge resumes that tree, so the id is unchanged).
#
# WHAT THE LOG MUST SHOW (literals from Source/Parsek/MissionLoopUnitBuilder.cs):
#   `ENGAGED re-aim Kerbin->Jool via Sun`, as on V33M.
#   `ARRIVAL HOLD dest=Jool kind=config Talign=<P_Vall>s moons=1 ...
#       (aligns the moon orbital phases, mode=` - the lone-moon hold on Vall's
#       period (105,962.09 s, mu_Jool 2.82528e14; one participant, so T_config = P).
#   `BATCH_COMPLETE ... category=MoonArrivalHold scene=SPACECENTER`, pinned whole.
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-11-14. On `jool-vall-recorded` (harvested from B39-jool-vall-continuation). The player loop on the Kerbin->Jool->Vall tree, V33M's shape: re-aim Kerbin->Jool engages and the lone-moon arrival hold aligns Vall's orbital phase on its period at the Jool SOI entry; the live MoonArrivalHold cell runs at the Space Center."
instanceProfile = "stock-minimal"
tags = ["V34", "player-loop", "loop-playback", "reaim", "arrival-hold", "lone-moon-hold", "jool", "vall", "moon", "ingame-batch"]

[fixture]
saveTemplate       = "fixtures/saves/jool-vall-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
# V33M's steps verbatim (the restore-stub kill pair, tracers, verbose, the loop
# reading, then the Space Center batch).
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig",     args = { tree = "6ec68e87b782476f970a71df8c8b4685", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "6ec68e87b782476f970a71df8c8b4685" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "RunTests",   args = { category = "MoonArrivalHold" },             expect = "OK", budget = 300 },
  # The export sits right before teardown (RenderComposeVerifierWiringTests placement
  # rule): the recorder accumulates from Awake, so an earlier export drops later steps.
  { cmd = "ExportRenderManifest",                                            expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
D11 = ["arrival-hold"]
D14 = ["jool", "vall", "scene-flight", "scene-ksc", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# {N, N + 1} off the harvested fixture's 6 sidecars (first flight read 6).
count = { min = 6, max = 7 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "ENGAGED re-aim Kerbin->Jool via Sun",
  "ARRIVAL HOLD dest=Jool kind=config Talign=10596[12]\\.[0-9]+s moons=1 ",
  "ARRIVAL HOLD dest=Jool kind=config .*\\(aligns the moon orbital phases, mode=",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=MoonArrivalHold scene=SPACECENTER",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "FORCED FAITHFUL",
  "no member yields a re-aim transfer",
  "MOON HOLD declined",
  "Arrival amber SET: tree=6ec68e87b782476f970a71df8c8b4685",
  "timejump refused reason=backward-jump",
]

[expectations.rewind]
# REPORT-ONLY until a reading.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# REPORT-ONLY: the forge's one committed tree.
committedTrees = { min = 1, max = 1 }
trees          = { min = 1, max = 2 }

[expectations.renderComposition]

[runtime]
# 2 x 300 LoadGame + 300 StartLoopPlayback + 300 RunTests + 120 manifest + margin.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
