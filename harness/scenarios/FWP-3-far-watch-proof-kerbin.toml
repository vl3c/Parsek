schema = 1
id = "FWP-3-far-watch-proof-kerbin"
# ====================================================================================
# THROWAWAY: the far-watch step 1 proof (docs/dev/design-far-watch.md section 18.1).
# Never merged. Every FarWatchProof step answers OK with `result=` (ok, or why it did
# nothing); the observations are the `[FarWatchProof] obs=<name> k=v ...` log lines,
# read by hand from the collected KSP.log. Nothing here gates on what the proof saw.
#
# Unattended: python harness/run.py --id FWP-3-far-watch-proof-kerbin
# Attended:   python harness/run.py --id FWP-3-far-watch-proof-kerbin --hold   (close KSP to end it).
# Host: the real pod landed on Kerbin; the ghost is the same flight's loop, launched
# about 1,070 km away. Timings off W1-watch-distance-cutoff's measured loop clock.
# ====================================================================================
tier = "operator"
description = "THROWAWAY far-watch step 1 proof on kerbin-splashdown-recorded: a surface-held camera drone beside the Kerbin-landed pod jumps 1,000 km along Kerbin to the loop ghost, follows ascent, coast and descent by orbit rewrite with the terrain floor, hands back on Kerbin and dies while active with the ship loaded. Observations are the [FarWatchProof] obs= lines."
instanceProfile = "stock-minimal"
tags = ["far-watch-proof", "throwaway", "screenshots", "loop-playback"]

[fixture]
saveTemplate       = "fixtures/saves/kerbin-splashdown-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame", args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording", expect = "OK" },
  { cmd = "DiscardTree", expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "MissionConfig", args = { tree = "c05c834cd2754892b4588e7ce9220c3f", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "c05c834cd2754892b4588e7ce9220c3f" }, expect = "OK", budget = 300 },
  # StartLoopPlayback leaves now at L1 - 15 s (L1 = 21,583.965, W1's measured anchor;
  # loopUT = UT - L1 + 34.54). The ascent ghost launches about 1,070 km from the pod.
  { cmd = "FarWatchProof", args = { op = "arm" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "report", label = "before" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "build", variant = "auto" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "fwp3-built" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "switch", target = "drone" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "advance", untilUT = "21590", maxRate = "1" }, expect = "OK" },
  # 1000 km on the same body: the drone jumps to the ascent ghost.
  { cmd = "FarWatchProof", args = { op = "follow", tree = "c05c834cd2754892b4588e7ce9220c3f", watch = "true", seconds = "15" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "fwp3-ascent" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "control", alt = "15000" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "advance", untilUT = "21700", maxRate = "4" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "solver", state = "detached" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "advance", untilUT = "21800", maxRate = "4" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "solver", state = "attached" }, expect = "OK" },
  # Coast (member 1), then the descent member (from UT 22,403) over terrain and sea.
  { cmd = "FarWatchProof", args = { op = "advance", untilUT = "22410", maxRate = "50" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "advance", untilUT = "22700", maxRate = "10" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "fwp3-descent" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "advance", untilUT = "22800", maxRate = "1" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "fwp3-touchdown" }, expect = "OK" },
  # Proof 15: beside the landed pod at 1x and under a warp request.
  { cmd = "FarWatchProof", args = { op = "park" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "advance", untilUT = "22900", maxRate = "100000", seconds = "120" }, expect = "OK" },
  # Proof 9: the hand-back on Kerbin and the landed pod's unpack.
  { cmd = "FarWatchProof", args = { op = "switch", target = "ship" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "destroy" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "fwp3-handback" }, expect = "OK" },
  # Proof 14: a second drone dies while active with the ship loaded.
  { cmd = "FarWatchProof", args = { op = "build", variant = "surface" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "switch", target = "drone" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "kill", mode = "crash", seconds = "20" }, expect = "OK" },
  { cmd = "FarWatchProof", args = { op = "report", label = "after" }, expect = "OK" },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]

[expectations]
allowedAnomalies = []

[expectations.recordings.structure]
# Report-only (no `gating`): the save keeps the fixture's committed trees.
committedTrees = { min = 1, max = 1 }

[expectations.logContracts]
required = [
  "\\[FarWatchProof\\] obs=arm ",
  "\\[FarWatchProof\\] obs=build ",
  "\\[FarWatchProof\\] obs=switch to=drone ",
  "\\[FarWatchProof\\] obs=follow ",
  "\\[FarWatchProof\\] obs=switch to=ship ",
  "\\[FarWatchProof\\] obs=kill ",
  "\\[FarWatchProof\\] obs=report ",
]
forbidden = [
  "farwatchproof rejected reason=",
  "\\[FarWatchProof\\] op threw ",
]

[runtime]
budgetSeconds = 3600

[retry]
policy = "none"

[expectedFail]
bugId = ""
