schema = 1
id = "L1-dismiss-kerbal-career"
# The header here used to say "pending-fixture: fixtures/saves/fresh-career is not committed yet ...
# Re-tier to 'daily' once the fixture lands". BOTH are long done - the fixture is
# committed and `tier` below has read "daily" since 2026-07-23 - and the line was left
# standing anyway. Cleared 2026-08-01 alongside the same residue in L1-hire.
tier = "daily"
description = "Career: dismiss one roster kerbal; NO career pool moves (pool-neutral non-economic action)."
instanceProfile = "stock-minimal"
# `pending-operator` DROPPED 2026-07-31. The marker below asked the operator to CONFIRM
# a fixture constant and RECORD it; both halves are done: `fixtures/saves/README.md` records the chosen
# kerbal (`Bill Kerman`) and this spec's step arg IS `Bill Kerman`, with the constants row
# reading pool-neutral rather than pending. LIVE-PROVEN `2026-07-23_1914`.
# The oracle hard-gates scalar pools (`oracle.py`: a drift reds `PARSEK-FAIL(ledger)`),
# so the green run IS that confirmation - the same argument used to drop S4.1's tag.
tags = ["ledger", "L1", "R7"]

[fixture]
saveTemplate = "fixtures/saves/fresh-career"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# dismiss-kerbal drives KerbalRoster.Remove (a Parsek-managed kerbal pre-declines
# kerbal-parsek-managed). OPERATOR-VERIFIED 2026-07-31 (was VERIFY-PENDING-OPERATOR: name a
# dismissable stock kerbal the fixture roster carries, and record it in the fixture README).
# BOTH halves are done: `fixtures/saves/README.md` records `Bill Kerman` and this spec's
# step arg is `Bill Kerman`. Dismissing one is pool-neutral because stock does not refund a
# hire, which is what the README constants row says. LIVE-PROVEN `2026-07-23_1914`.
steps = [
  { cmd = "LoadGame",     args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",   args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "KscAction",    args = { action = "dismiss-kerbal", kerbal = "Bill Kerman" }, expect = "OK", budget = 60 },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "FlushAndQuit",   expect = "OK" },
]

[dimensionsCovered]
D8  = ["kerbals", "recalc-engine", "orchestrator", "ksp-state-patcher", "action-blocking"]
D12 = ["hire-dismiss-patches"]
D14 = ["career", "scene-ksc"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# "kscaction action=dismiss-kerbal target=... applied=true manifestKind=kerbal-dismiss ...";
# the stock removal reaches Parsek's recorder-observer (GameStateRecorder.Handlers
# OnKerbalRemoved: "Game state: CrewRemoved '<name>'").
required  = ["kscaction action=dismiss-kerbal .* applied=true", "Game state: CrewRemoved"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

# The dismiss L1 script is a passive-safety cross-check scoped to a roster mutation: it
# proves a KSC roster action does not perturb the economy (the R6/R7-adjacent "no phantom
# economy movement on a non-economic action" guard). Unlike the nonzero economic scripts,
# the unmatched_captured_awards-empty leg IS trusted here (a dismiss fires NO economic
# award, so the captured set is empty and the any-captured-award-reds signal is sound for
# any seq_key -- the B10 empty-manifest case scoped to a roster mutation). The ROSTER-changed
# assertion is DEFERRED with the M-B2 world roster sub-facet (CareerSaveSnapshot has no
# roster parse); the POOL-neutrality assertion is drivable today.
[expectations.ledger]
seedFrom     = "template"
tolerances   = "default"
rec3CarveOut = false

[[expectations.ledger.manifest]]
  ut         = 0.0
  kind       = "kerbal-dismiss"
  # ALL pool deltas 0: a dismissal moves no career pool (stock does not refund a hire). The
  # entry exists to record the roster change and to assert VIA the zero-delta cross-check
  # that NO pool moved -- a stray funds/science/rep capture would be unmatched and red.
  funds      = 0.0
  science    = 0.0
  reputation = 0.0
  provenance = "seam-declared"

[runtime]
# Happy path: LoadGame ~300 + KscAction ~60 + light verbs, under 600. (Used to add
# "Pending-fixture -> never scheduled unattended"; false since 2026-07-23.)
budgetSeconds = 600

[retry]
policy = "once"

[expectedFail]
bugId = ""
