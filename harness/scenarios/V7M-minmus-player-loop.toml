# =====================================================================================
tier = "operator"
description = "THE MINMUS PLAYER-LOOP LANE, and the spec that CORRECTED the watch-entry threshold and then became the suite's FIRST watch-mode entry. Observer and ghost share a 98,463.595 m Minmus park, so their separation is constant within a cycle and moves only when the phase anchor does; cycles 1 and 2 measured 144,356 m and 191,499 m on the archived V7Mc calibration run `_1607` (144,349 m / 191,497 m on run `_1600`'s own archived log) - both INSIDE the 300 km number V4's header calls the watch entry cutoff, both REFUSED, because `IsGhostWithinVisualRange` is really `currentZone != Beyond`, i.e. the 120 km render-zone gate (305 km is the EXIT cutoff and only that). Minmus is the one park whose separations land between the two thresholds, so it could falsify the wrong one by measurement. Cycle 3 then parks INSIDE the gate - 51,503 m on the archived calibration, `zone=Visual rdist=51603m` on the committed green run - and watch mode ENTERS, gated by the product's own `enterwatchmode complete:` line. Same-parent routing pinned positively (no re-aim, phase-lock + zero-drift, factory chain reaimed=False); three cycles feed the arrival-desync hunt."
instanceProfile = "stock-minimal"
tags = ["V7", "player-loop", "watch-mode", "loop-playback", "phase-lock", "zero-drift", "minmus", "moon", "flown"]

[fixture]
# The B12-minmus-orbit harvest (run 2026-08-08_1441, PASS attempt 1, --keep-parsek):
# ONE committed tree aa435745..., EIGHT recordings (the Minmus-parked Kerbal X + six
# radial boosters + the flameout-staged remnant this profile leaves in KERBIN ORBIT -
# the one topological difference from the Mun fixture, and a real profile difference,
# not a defect), save UT ~277,205. Its PARKED KERBAL X is the OBSERVER for both watch
# attempts.
saveTemplate       = "fixtures/saves/minmus-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # Kill the scene-entry auto-recorder before anything else (V2 flight 4 / V5 run 1:
  # a save whose own parked craft is active resumes a promotion-stub recording ~1 s
  # into the scene). Both verbs are idempotent-OK on a clean entry state.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # ghostRenderTracing = the loop-seam-teleport raise gate; mapRenderTracing = the
  # map/TS tracer + probe (the `surface=Proto*` truth lines the arrival evidence is
  # read off); verboseLogging is LOAD-BEARING for both Tier-B streams.
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # ARM: the Missions window loop checkbox (production MissionStore.SetLoopEnabled).
  # Its Info line echoes phaseAnchorUt - read it when re-pinning.
  { cmd = "MissionConfig", args = { tree = "aa435745816e46b381cadb4fdcef7038", loop = "true" }, expect = "OK" },
  # "Warp to...", CYCLE 1: an instantaneous Planetarium clock set through the product's
  # FastForwardToEventUT.
  { cmd = "StartLoopPlayback", args = { tree = "aa435745816e46b381cadb4fdcef7038" }, expect = "OK", budget = 300 },
  # CYCLE-1 ARRIVAL BRACKET, strictly forward, straddling the predicted Kerbin->Minmus
  # SOI seam 1,345,212.6 at -177.6 / -57.6 / +142.4 s.
  { cmd = "TimeJump", args = { ut = "1345035" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "1345155" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "1345355" }, expect = "OK", budget = 300 },
  # CYCLE-1 PARK EPOCH: phaseAnchor + 276,900, deep inside the recorded Minmus park.
  { cmd = "TimeJump", args = { ut = "1354406" }, expect = "OK", budget = 300 },
  # "Watch". MEASURED REJECTED: the separation here is ~144.35 km - inside the 300 km
  # number V4's header calls the entry cutoff, but OUTSIDE the 120 km render-zone gate
  # that `IsGhostWithinVisualRange` actually tests. Archived readings, per flight:
  # `rdist=144349m` (run `_1600`), `144356m` / `144365m` (the two V7Mc attempts). This
  # step and its cycle-2 twin ARE the measurement that discriminates the two
  # thresholds; see the header.
  { cmd = "EnterWatchMode",                                                  expect = "REJECTED" },
  # "Warp to..." AGAIN -> CYCLE 2 (predicted k=100, 2,154,976.940). The desync hunt's
  # second half.
  { cmd = "StartLoopPlayback", args = { tree = "aa435745816e46b381cadb4fdcef7038" }, expect = "OK", budget = 300 },
  # CYCLE-2 ARRIVAL BRACKET, same offsets about the predicted seam 2,422,683.8.
  { cmd = "TimeJump", args = { ut = "2422505" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "2422625" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "2422825" }, expect = "OK", budget = 300 },
  # CYCLE-2 PARK EPOCH: the same +276,900 offset off the cycle-2 anchor.
  { cmd = "TimeJump", args = { ut = "2431877" }, expect = "OK", budget = 300 },
  # "Watch" again, an INDEPENDENT separation (the anchor moved, so the constant-within-
  # a-cycle phase difference changes). MEASURED REJECTED at ~191.5 km (`rdist=191497m`
  # on run `_1600`, `191499m` / `191493m` on the two V7Mc attempts) - the second half of
  # the threshold discrimination: also inside 300 km, also outside 120 km, also refused.
  { cmd = "EnterWatchMode",                                                  expect = "REJECTED" },
  # CYCLE 3 - THE ONE THAT ENTERS WATCH MODE, and the reason this lane keeps a third
  # cycle. The calibration run 2026-08-08_1607 walked cycles 3/4/5 and measured the
  # cycle-3 park at 51,503 m (`FX suppressed: ... anchorDist=51503m`) - Visual, i.e.
  # inside the 120 km gate, which is all the auto-select needs. Predicted relaunch:
  # k=150, 3,232,448.190 (= 34.44 + 150*21,549.425; the MEASURED value is
  # 3,232,448.2174634738, and an earlier draft quoted that truncated as the
  # prediction). The bracket and park UTs below are built on the .190 prediction.
  { cmd = "StartLoopPlayback", args = { tree = "aa435745816e46b381cadb4fdcef7038" }, expect = "OK", budget = 300 },
  # CYCLE-3 ARRIVAL BRACKET about the predicted seam 3,500,155.1 - a THIRD arrival
  # sample for the desync hunt, which is what turns a two-point comparison into a
  # trend.
  { cmd = "TimeJump", args = { ut = "3499977" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "3500097" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "3500297" }, expect = "OK", budget = 300 },
  # CYCLE-3 PARK EPOCH: same +276,900 offset off the cycle-3 anchor.
  { cmd = "TimeJump", args = { ut = "3509348" }, expect = "OK", budget = 300 },
  # "Watch" - PINNED OK ON A MEASUREMENT, not a hope. This is the suite's first
  # watch-mode entry on a looped ghost; the required `enterwatchmode complete: index=`
  # token below is what gates the claim (a bare OK would also be satisfied by the
  # idempotent already-watching path).
  { cmd = "EnterWatchMode",                                                  expect = "OK" },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# CLAIM-IS-NOT-GATE - identical structure to V6M's, on the Minmus axis.
#   D11 `phase-lock`          <- `PhaseLock APPLIED:` + `Orbital(Minmus) same-parent`
#                                + `support=Supported` (applied, and to THIS config).
#   D11 `zero-drift-schedule` <- `zeroDrift=yes` + `scheduleWithinTol=yes` on that line.
#   D9  `fast-forward`        <- the PRODUCT's `FastForwardToEventUT: jumping to UT=`.
#   D14 `minmus` / `scene-flight` / `sandbox` - the environment axes.
# NOT claimed: a watch-mode cell, and this is the deliberate one. The cycle-3 step DOES
# enter watch mode - measured, not hoped - but D6's
# `watch-mode-retarget-explosion-hold` cell describes RETARGET and EXPLOSION-HOLD
# behaviour, and an ENTRY is evidence of neither; claiming it off a successful entry
# would be a claim with no gate behind it. Also not claimed: any D11 arrival cell (an
# arrival epoch is observed, no arrival geometry is asserted).
[dimensionsCovered]
D9  = ["fast-forward"]
D11 = ["phase-lock", "zero-drift-schedule"]
D14 = ["minmus", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING (hlib.validate_spec rejects a bare allowedAnomalies written
# after any [expectations.<sub>] header).
allowedAnomalies = []

[expectations.recordings]
# NINE, MEASURED ON THIS LANE. It began as a prediction carried over from the Mun
# lane, and the prediction held: run `2026-08-08_1613` reported
# `observed.recordings.count = 9` (as did the armed re-flight `_1642`), so this is a
# measured pin now, not a borrowed one.
# WHY 9 AND NOT 8: V6M run 2026-08-08_1554 measured that `RecordingOptimizer` splits
# the Mun fixture's main recording at LOAD, at the UT 212.2 atmospheric->exo boundary,
# into a chained ascent + everything-after pair (`Split summary: ...
# exoCoastBodyChangeKept=1` - the Kerbin->Mun body change is deliberately kept cohesive
# by the §3 rule-3 predicate). This fixture is the SAME launcher on the same ascent
# profile (its first orbit segment starts at 230.05 against Mun's 230.03), and it
# produced the same single split.
# PINNED EXACTLY, not widened: if the longer Minmus profile ever splits somewhere else
# too the count reads 10 and this lane reds ON THAT - a real finding about the
# optimizer's predicate across two near-identical profiles, and cheap to re-pin. A
# window wide enough to absorb it would measure nothing.
count = { min = 9, max = 9 }

[expectations.rewind]
# ARMED 2026-08-08 (the V2/B17/V4 arming discipline) off the reading run
# `2026-08-08_1613` (PASS attempt 1, the 27-step shape committed here), whose saveParse
# REPORT measured rewindPoints=0, supersedeRows=0, tombstones=0, rewindRetirements=0 -
# every declared window already met, so the arming moved no verdict. This lane arms the
# same claim as V6M over a THREE-cycle workflow that also ENTERS WATCH MODE and ends
# inside it: entering watch, retargeting the camera and tearing the scene down from
# inside watch must still author nothing durable. WINDOWS UNTOUCHED (S4.1's rule).
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# ARMED 2026-08-08, same reading run (`2026-08-08_1613`), which measured
# committedTrees=1 and trees=1. `trees` keeps V2's max = 2 (the documented
# duplicate-writer hazard) rather than being re-pinned to the single measurement.
# Worth noting what this does NOT cover: the teardown NRE this lane files is a Unity
# exception, not a save-structure facet, and `unityExceptions` stays unarmed here.
gating = true
committedTrees = { min = 1, max = 1 }
trees          = { min = 1, max = 2 }

[expectations.logContracts]
# The workflow chain + the routing pins are V6M's, on Minmus. The ONE pin unique to
# this lane is the last:
#   "enterwatchmode complete: index=" - the PRODUCT's own watch-entry completion line.
#     This is what makes "the suite entered watch mode on a looped ghost" a GATED claim
#     rather than a step verdict: `expect = "OK"` alone would also be satisfied by the
#     idempotent already-watching short-circuit, and by pinning the completion line the
#     spec requires that at least one real entry completed. If this token is the only
#     mismatch on an otherwise-green run, READ IT - it means both calls took the
#     already-watching path, which is itself a finding about watch persistence.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "Orbital\\(Minmus\\) same-parent",
  "support=Supported",
  "PhaseLock APPLIED: mission=",
  "zeroDrift=yes",
  "scheduleWithinTol=yes",
  "factory chain rec=\\w+ idx=\\d+ inst=\\d+ phases=\\d+ reaimed=False",
  # ANTI-VACUITY / ARRIVAL: a map-render truth line showing a ghost proto surface framed
  # on MINMUS. A run that never gets the ghost to Minmus has measured nothing about a
  # Minmus arrival. A zero here is a FINDING, never a token to relax.
  #
  # KNOWN WEAKNESS, LEFT IN PLACE DELIBERATELY (2026-08-08 review). This pattern also
  # matches a `surface=ProtoIcon` line, which is CREATION evidence, not arrival-rebind
  # evidence; the line the reading ledger actually quotes for the arrival is the
  # stronger `phase=body-orbit surface=ProtoOrbitLine ... body=Minmus`. That stronger
  # form was VERIFIED present in every archived flight of this shape (2 matches in
  # `_1600` and `_1601`, 5 in `_1607`), so hardening the pin to it would be safe - but
  # changing a REQUIRED token obliges a re-flight, and the weaker pin has never
  # green-lit a vacuous run. Harden it the next time this lane flies for another
  # reason, not on its own.
  "surface=Proto(Icon|OrbitLine) .*body=Minmus",
  "enterwatchmode complete: index=",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The re-aim forbid trio: the falsifiable half of the same-parent routing claim.
  "\\[ReaimDiag\\]",
  "ENGAGED re-aim",
  "FORCED FAITHFUL",
  # The V3C run-3 self-detection guard - most load-bearing forbid in a calibration lane
  # whose jump UTs are predictions.
  "timejump refused reason=backward-jump",
]

[runtime]
# V6M's shape plus a third cycle: 300 LoadGame + 3x300 StartLoopPlayback + 12x300
# TimeJump + the fast verbs + KSP boot + collect. Every jump is instantaneous, so the
# ~3.51 Ms of game time costs no wall clock; the committed 27-step shape measured 53 s
# end to end on run 2026-08-08_1613.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
