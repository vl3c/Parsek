#     already-watching path, which is itself a finding about watch persistence.
#     UNCHANGED BY THE 2026-08-28 WATCH-ENTRY MIGRATION, and worth spelling out because
#     the migration moves WHICH step buys it: with all three calls now expected OK, the
#     CYCLE-1 attempt is the real entry and cycles 2/3 take the short-circuit. The token
#     is emitted only by `TryCompleteEnterWatchMode`'s CompleteOk branch and never by
#     the short-circuit (which logs `enterwatchmode already-watching:`), so the pin
#     still requires exactly what it always required: one genuine entry.
#
# THE MAP-PROBE ANTI-VACUITY PIN (added 2026-08-09), and WHY IT IS NOT THE PROBE LINE.
# The `surface=Proto*` pin below proves the TRACER saw a Minmus-framed ghost surface; it
# does NOT prove the PROBE's per-pid lens - the thing `allowedAnomalies = []` arms a
# Tier-C sweep over - ever reached a resolved ghost. The obvious pin for that,
# `probe frame summary frame=\d+ ghosts=[1-9][0-9]* sampled=[1-9][0-9]*` (V1's and V2's
# token), is UNBUYABLE AT THIS SPEC SHAPE:
#   `ParsekLog.VerboseRateLimited` holds the probe summary on a 5.0 s WALL-CLOCK,
#   process-global shared key ("MapRenderTrace|probe-frame-summary"), so the FIRST call
#   after the tracer flips owns the window - and it lands before any ghost is resolved.
#   MEASURED on `2026-08-08_1901`: `setting name=mapRenderTracing ... new=true` at
#   19:01:09.262 -> `probe frame summary frame=7363 ghosts=0 sampled=0 resolveMisses=0`
#   at 19:01:09.263 (+1 ms) -> `FlushAndQuit` at 19:01:13.034, a 3.772 s tracer-on dwell
#   inside a 5.0 s window (`_1902` reads the same shape: +6 ms, 3.769 s). No second
#   probe line can exist. All SEVEN archived tracer-on runs of this family (V4 `_1457`,
#   V5 `_1440`, V6M `_1945`, V7M `_1901`/`_1902`, V7T `_1915`/`_1917`) read
#   `ghosts=0 sampled=0` on dwells of 2.246-3.772 s. V1 buys the token honestly only
#   through a 33-minute dwell (399 probe lines, 131 with ghosts>=1). SPEC-SHAPE fact.
#   THE HONEST SUBSTITUTE: `faithful-parity summary` is emitted ONLY when the per-pid
#   parity pass touched the lens - the `faithful-parity summary` emit in
#   `MapRenderProbe.LateUpdate` is gated on
#   `sampled > 0 || skipCounts.Count > 0`, both counters per-frame (reset at the top of
#   the same pass, just before the per-ghost loop) - so its PRESENCE cannot be produced
#   by a frame with no resolved ghost. Both archived runs read
#   `faithful-parity summary sampled=1
#   overTolerance=0`; the `overTolerance>=1` form is FORBIDDEN below (the S1.6/S1.7 pin
#   verbatim, measured 0 on all seven).
#   NOT PINNED: `sampled=[1-9]`, EVEN THOUGH THIS LANE MEASURED 1 TWICE. That 1 is the
#   gate passing on a frame whose drive clock is still inside the SEED fragment, so seed
#   == covering there; frames later in the same coalesced window skip. (CORRECTED
#   2026-08-09: this used to say the seed was NOT fresh on that frame, nulling
#   `intendedSeed` and bypassing the gate. FALSE - the drive line's `fresh=` is stamped
#   at execution order 0, before the shadow stamps the seed mid-frame, while the probe
#   fetches the seed itself at order 10000; V4's frame 6464 pairs `fresh=False` with a
#   `skip.reaimed-or-foreign-seed=1` that is only reachable with a non-null seed, so the
#   indicator does not support the claim. On this lane's own summary frames the
#   post-shadow `director-stockconic-visible` line is present, i.e. the seed WAS fresh at
#   probe time.) The conclusion is unchanged and now rests on the fragment geometry:
#   frames past the seed fragment skip exactly as V6M's do, because this fixture's
#   Minmus segments 6-9 are ONE conic
#   (sma -32530.7485, ecc 4.02686086) fragmented into four, the seed carries fragment 6's
#   epoch (267736.679, confirmed by `epoch+shift=1345207.9` against `shift=1077471.3`)
#   and the raw covering at effUT 276,934.7 is fragment 9 (epoch 276411.273) - written up
#   in V6M's header and filed as docs/dev/todo-and-known-bugs.md ->
#   FAITHFUL-PARITY-SEED-FRAGMENT-REBASE. Pinning a nonzero sample count would therefore
#   gate on a frame-timing coincidence.
#
# RE-FLIGHT `2026-08-09_0930` (PASS attempt 1, wall 54 s), the run that armed this pin -
# AND IT PARTLY FALSIFIED THE "UNBUYABLE" CLAIM ABOVE, so read this before quoting it.
# This lane's tracer-on dwell is the LONGEST in the family and it STRADDLES the 5.0 s
# limiter window: 12:31:22.259 flip -> 12:31:27.516 quit = 5.257 s. So the run bought a
# SECOND probe line, 14 ms past the window:
#   probe frame summary frame=7000 ghosts=0 sampled=0 resolveMisses=0        (+2 ms)
#   probe frame summary frame=7289 ghosts=1 sampled=1 resolveMisses=0 | suppressed=288
# The honest statement is therefore NOT "the probe token is unbuyable here" but "it is a
# RATE-LIMITER RACE this lane's dwell sits on the boundary of" - its two archived runs
# (3.772 s / 3.769 s) lost it, this one won it by 14 ms, and `suppressed=288` is the
# limiter's own count of the frames it swallowed in between. That is precisely why the
# token is not pinned: a required token whose presence turns on a 14 ms margin is a
# flake generator, while `faithful-parity summary` PRESENCE is emitted the moment the
# lens resolves a ghost and does not depend on the limiter at all. The rest of the run:
# parity `sampled=1 overTolerance=0`; expectations PASS mismatches=0 with the new token
# met; anomalySweep PASS `hits=[] counts={}`; saveParse PASS armed, mismatches=0;
# unityExceptions REPORT total=0 (the end-inside-watch teardown NRE did not recur).
# THE `seam-endpoint-outside-soi` ENCOUNTER LENS READ ZERO RAISES, and the paragraph that
# stood here explained that away as structural - the sampled frames park the drive clock
# inside the recording's LAST segment (raw 9, [276411.27, 277001.13]), so the forward scan
# returns `Skip("no-cross-body-successor")`.
# ==> THE CENSUS FLIGHT FALSIFIED THAT ON THIS LANE. The derivation was assembled offline
# from covering-segment lines and the fixture's ORBIT_SEGMENT chain, because the lens could
# not report on itself, and it named the wrong frame. Census run `2026-08-09_1018` (PASS
# attempt 1, wall 54 s) measured, verbatim:
#     seam-endpoint summary evaluated=1 outsideSoi=0
# NO skip bucket. One ghost-frame offered, one EVALUATION - a real destination-approach
# ratio, INSIDE the destination sphere.
# WHICH SEAM, off that same frame's own lines (frame 7777, currentUT 1,345,035,
# driveUT 267,563.741): `shadow pid=3464317505 coverage=InSegment segIdx=7
# treatment=StockConic visible=True driveUT=267563.741 body=Kerbin` on a 10-phase
# `reaimed=False` chain, with `Cached body-frame bounds ... rawBodyFrameUT=230.05-267741.32
# segIndices=0-5` - so the covering leg is a KERBIN leg ending 267,741.32 and the successor
# is the Minmus approach: THE KERBIN->MINMUS ARRIVAL SEAM, measured on the faithful,
# phase-locked, same-parent road. Note what this ALSO settles: the instrument's documented
# benign population ("a FAITHFUL loop replay raises by design") is about an INTERPLANETARY
# transfer whose destination moves on in inertial space by the loop shift; a same-parent
# moon replay is phase-locked, and this reading is the first evidence that such a lane
# reads healthy rather than raising. One lane, one frame - not yet a general result.
# THIS LANE AND V4 ARE THE TWO OF THE FIVE THAT BUY THE INSTRUMENT. V6M / V6T / V7T all
# read `evaluated=0 skip.no-cross-body-successor=1` and confirm the old derivation for
# themselves - the difference is the dwell epoch, not the fixture family.
# WHAT THE CENSUS STILL CANNOT TELL YOU: `outsideSoi=0` says the evaluation came in at or
# under the 1.005 tolerance, but the RATIO is printed only on a raise, so the MARGIN is
# unmeasured - this lane proves the arc reaches the sphere, not by how much. Named as the
# next step in docs/dev/todo-and-known-bugs.md; it is a census-format change (carry the
# pass max ratio), not a spec change, so it is not fixable from here.
#
# PINNED FROM THE CENSUS (2026-08-09), TWO TOKENS, and the second is the stronger claim:
#   (1) `seam-endpoint summary evaluated=\d+ outsideSoi=\d+` - PRESENCE. The lens ran and
#       reported. The emit guard (`SeamEndpointOracle.ShouldEmitPassSummary`) is reachable
#       only from inside the per-ghost capture, so presence cannot be faked by a ghostless
#       frame - the trap that makes `probe frame summary` unpinnable at this dwell length.
#   (2) `seam-endpoint summary evaluated=[1-9]` - the lens actually PERFORMED a
#       destination-approach check. Presence alone is also satisfied by a pass that skipped
#       everything, which is exactly what V6M / V6T / V7T emit; this token is what
#       separates the two populations. Pinned under the two-consecutive-flights rule -
#       `_1018` and `_1031` both read `evaluated=1 outsideSoi=0`, bit-identical, no skip
#       bucket - and not before it. A THIRD census flight, `_1036` (PASS attempt 1), read
#       the same thing bit-identically, and a FOURTH, `_1159` (PASS attempt 1, wall 55 s),
#       re-flew the lane AFTER the capture gained the re-timed-arrival refusal and still
#       read `evaluated=1 outsideSoi=0` - so the refusal cost this lane nothing.
#       READ `_1036` CAREFULLY: V4 carries a run stamped `_1036` too. That is not the same
#       run and not a typo - run ids are scenario-qualified, and the tier flew the two
#       lanes back to back inside one minute (`2026-08-09_1036_V4-player-loop-workflow`
#       10:36:03-10:36:54, then `2026-08-09_1036_V7M-minmus-player-loop` 10:36:54-10:37:49).
#       Quote the full run id, not the `_HHMM` stub, whenever the two lanes are cited side
#       by side.
#       WHY IT IS DETERMINISTIC HERE: the summary rides a shared 5 s rate-limited key, so
#       the first pass to clear the guard owns the window, and here that is the ghost's
#       creation frame at a FIXED jump epoch (currentUT 1,345,035 -> driveUT 267,563.741,
#       inside the Kerbin leg that ends 267,741.32). If this reds, ask first whether a
#       different frame won the limiter, not whether the geometry moved.
# NOT pinned: `outsideSoi=0`, per the instrument's own documented benign population; the
# RAISE stays report-only by design and must not gate here.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "Orbital\\(Minmus\\) same-parent",
  "support=Supported",
  "PhaseLock APPLIED: mission=",
  "zeroDrift=yes",
  "scheduleWithinTol=yes",
  "factory chain rec=\\w+ idx=\\d+ inst=\\d+ phases=\\d+ reaimed=False",
  # ANTI-VACUITY / ARRIVAL: a map-render truth line showing a ghost proto surface framed
  # on MINMUS. A run that never gets the ghost to Minmus has measured nothing about a
  # Minmus arrival. A zero here is a FINDING, never a token to relax.
  #
  # KNOWN WEAKNESS, LEFT IN PLACE DELIBERATELY (2026-08-08 review). This pattern also
  # matches a `surface=ProtoIcon` line, which is CREATION evidence, not arrival-rebind
  # evidence; the line the reading ledger actually quotes for the arrival is the
  # stronger `phase=body-orbit surface=ProtoOrbitLine ... body=Minmus`. That stronger
  # form was VERIFIED present in every archived flight of this shape (2 matches in
  # `_1600` and `_1601`, 5 in `_1607`), so hardening the pin to it would be safe - but
  # changing a REQUIRED token obliges a re-flight, and the weaker pin has never
  # green-lit a vacuous run. Harden it the next time this lane flies for another
  # reason, not on its own.
  "surface=Proto(Icon|OrbitLine) .*body=Minmus",
  "enterwatchmode complete: index=",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
  "seam-endpoint summary evaluated=[1-9]",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The re-aim forbid trio: the falsifiable half of the same-parent routing claim.
  "\\[ReaimDiag\\]",
  "ENGAGED re-aim",
  "FORCED FAITHFUL",
  # The V3C run-3 self-detection guard - most load-bearing forbid in a calibration lane
  # whose jump UTs are predictions.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim (added 2026-08-09 alongside the presence pin
  # above): any faithful-parity sample OVER tolerance is a rendered-vs-recorded drift.
  # Measured 0 on all seven archived tracer-on runs of this family.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.renderComposition]
# M-A7 Phase 3C, WAVE A - DECLARED 2026-08-26, BARE ON PURPOSE: no `gating`, no window, no
# list. Declaring is what sets `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder
# at Awake, and `rendercompose` then records its facets UNCONDITIONALLY on a parseable
# manifest - which is how a lane earns its first honest window off a green report-only run.
# A window written today would be a PREDICTION read back as though it were a measurement,
# the mistake V14M, V8 and V6M all shipped bare through their reading runs to avoid.
# READING PENDING - see the renderComposition arming ledger in this file's header.

[runtime]
# V6M's shape plus a third cycle: 300 LoadGame + 3x300 StartLoopPlayback + 12x300
# TimeJump + the fast verbs + KSP boot + collect. Every jump is instantaneous, so the
# ~3.51 Ms of game time costs no wall clock; the committed 27-step shape measured 53 s
# end to end on run 2026-08-08_1613.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
