# 2. THE WATCH THRESHOLD: A PREDICTION THAT WAS FALSIFIED, AND THE CORRECTION
# ---------------------------------------------------------------------------------
# THE PREDICTION THIS SPEC WAS WRITTEN ON (kept verbatim, because the correction is
# only legible against it): watch-mode auto-select is
# `HasActiveGhost && IsGhostOnSameBody && IsGhostWithinVisualRange` "with a 300 km
# entry cutoff" (V4's header), and observer and ghost are the SAME CRAFT ON THE SAME
# RECORDED ORBIT - this fixture's live Kerbal X is parked at Minmus with SMA
# **98,463.595 m**, so two points on that common circle are at most 2a = **196.9 km**
# apart, comfortably inside 300 km. Hence: OK, guaranteed by geometry, no phase draw
# to lose.
#
# RUN 1 (2026-08-08_1600) MEASURED **REJECTED, TWICE**, AND THE 300 KM NUMBER IS
# THEREFORE NOT SUFFICIENT FOR ENTRY. That is what this lane proved, and it is all it
# proved; the boundary it brackets is in section 2's table below.
#
# =====================================================================================
# WATCH-ENTRY MIGRATION (2026-08-28) - THE TWO REFUSAL PINS ARE NOW **PREDICTED OK**
# =====================================================================================
# THE PRODUCT CHANGED UNDER THIS LANE. The refusing term this lane's four flights
# bracketed - `IsGhostOnSameBody`, answering from a STALE SPAWN SEED - was fixed, by a
# coordinated decision TAKEN after this spec's readings were what established the term.
# The single authority is unchanged: docs/dev/todo-and-known-bugs.md ->
# WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE. In one line: the term now resolves the
# ghost's body POSITIONING-FREE from its own recorded trajectory at the loop-mapped
# playback UT whenever the cached reading is not current, so a same-body ghost inside
# the 300 km cutoff is ACCEPTED - which is what design `docs/dev/done/
# design-camera-follow-ghost.md` E5 meant to accept all along (the same-body term is
# there to refuse GENUINELY cross-body watch for float-precision reasons; distance is a
# separate term, and at <= 300 km the float-grid step is centimetres).
#
# SO THE CYCLE-1 AND CYCLE-2 `EnterWatchMode` PINS FLIP `REJECTED` -> `OK`, AND THEY
# ARE **PREDICTED, NOT MEASURED**. Nothing in this file is a reading of the new product
# until this lane flies again. The readings in section 2's table are NOT deleted and
# NOT weakened: every distance in it stands, every verdict in it was true of the code
# that produced it, and the table is exactly why the flipped pins are a prediction
# worth making rather than a guess (all three separations sit inside 300 km, and all
# three ghosts were provably at Minmus while being reported at Kerbin).
