# =====================================================================================
# V7M: THE MINMUS HALF OF THE MOON PLAYER-LOOP PAIR - the lane that CORRECTED the
# watch-entry threshold and then became THE FIRST WATCH-MODE ENTRY IN THE SUITE.
#
# It did not get there the way this file was first written. The spec was authored
# predicting an OK from a 300 km cutoff, measured REJECTED twice, and the refusal
# turned out to falsify the threshold rather than the geometry - section 2 keeps both
# the prediction and the correction, because the correction is only legible against
# what it replaced.
#
# Structurally this is V6M with the target body swapped. Everything in V6M's header
# about the routing (a Kerbin->Minmus mission is same-parent, therefore ALWAYS
# phaseLocked, therefore `ApplyReaim` at MissionLoopUnitBuilder.cs:453-466 is
# unreachable, therefore no [ReaimDiag] / no ENGAGED / no FORCED FAITHFUL and the
# positive pins are `Orbital(Minmus) same-parent` + `support=Supported` +
# `PhaseLock APPLIED` with `zeroDrift=yes` / `scheduleWithinTol=yes` + the Director's
# `factory chain ... reaimed=False`) applies here verbatim and is not repeated.
# What IS different is worth the file: the schedule, and the watch prediction.
#
# ---------------------------------------------------------------------------------
# 1. THE SCHEDULE (derived pre-flight; the prediction this run measures)
# ---------------------------------------------------------------------------------
#   anchor  = Rotation(Kerbin), T = 21,549.425 s (tightest duty cycle, as ever)
#   other   = Orbital(Minmus), T = 1,077,311 s, tol = SOI/orbitalVelocity
#             = 2,247,428.4 / 274.12 = 8,198.8 s
#   ut0     = trimmed span start = this fixture's main recording start, 34.44
#   floorUT = max(LoopAnchorUT, spanEndUT) ~ 277,205 (the fixture's save UT), so
#             kFloor = ceil((277,205 - 34.44)/21,549.425) = 13
# The first k >= 13 that satisfies `CircularPhaseError(k*21,549.425, 1,077,311) <=
# 8,198.8` is **k = 50** (residual 160.7 s - a very tight window, because 50 pad
# rotations is 1,077,471.25 s against a 1,077,311 s Minmus year: the two periods are
# nearly commensurate at 50:1, which is WHY Minmus schedules so much more sparsely than
# Mun and why the residual is two orders of magnitude smaller):
#   PREDICTED phaseAnchorUt = relaunchUt = 34.44 + 50*21,549.425 = **1,077,505.690**
# Cycle 2 is again NOT anchor + P. The throttle skips to
# `ceil((L0 + span - ut0)/T_anchor)` = k >= 63, and the next k passing the same filter
# is **k = 100** (residual 321.5 s - the near-commensurability means the faithful k's
# are essentially the multiples of 50):
#   PREDICTED cycle-2 relaunchUt = 34.44 + 100*21,549.425 = **2,154,976.940**
#
# WINDOW ARITHMETIC (V2's recipe): window = phaseAnchorUt + (recordedUT - startUT).
# Off the main recording's own ORBIT_SEGMENT chain
# (`882cb2239abb49558599c3b1291f851d.prec.txt`):
#     ... Kerbin  [267,707.04 , 267,741.32] ]
#         Minmus  [267,741.32 , 273,833.00]   <- Kerbin->Minmus SOI entry
#         Minmus  [273,834.77 , 276,404.21]   <- the circular park (SMA 98,464, ecc 2.9e-4)
#         Minmus  [276,411.27 , 277,001.13]
#   recording: start 34.43999999999978, end 277,201.79410160834
#   seam offset = 267,741.32144 - 34.44 = **267,706.881**
#   park offset (deep in the park, ~267 s before the recording ends) = **276,900**
# so, on the PREDICTED anchors:
#   cycle-1 seam = 1,077,505.690 + 267,706.881 = 1,345,212.6
#   cycle-1 park = 1,077,505.690 + 276,900     = 1,354,405.7
#   cycle-2 seam = 2,154,976.940 + 267,706.881 = 2,422,683.8
#   cycle-2 park = 2,154,976.940 + 276,900     = 2,431,876.9
# NOTE THE SPAN: this mission is 277 ks long (3.2 Kerbin days) against Mun's 21.7 ks,
# so the seam sits 96.5% of the way through the replay, not 75% of the way. The jump
# UTs below are those PREDICTIONS; run 1 is a CALIBRATION run (read `phaseAnchorUt=`
# off `missionconfig applied:` and each `relaunchUt=` off `startloopplayback
# initiated:`, then re-pin). `timejump refused reason=backward-jump` is FORBIDDEN so a
# mis-predicted anchor self-detects instead of dwelling nowhere under a green verdict.
#
# ---------------------------------------------------------------------------------
# 2. THE WATCH THRESHOLD: A PREDICTION THAT WAS FALSIFIED, AND THE CORRECTION
# ---------------------------------------------------------------------------------
# THE PREDICTION THIS SPEC WAS WRITTEN ON (kept verbatim, because the correction is
# only legible against it): watch-mode auto-select is
# `HasActiveGhost && IsGhostOnSameBody && IsGhostWithinVisualRange` "with a 300 km
# entry cutoff" (V4's header), and observer and ghost are the SAME CRAFT ON THE SAME
# RECORDED ORBIT - this fixture's live Kerbal X is parked at Minmus with SMA
# **98,463.595 m**, so two points on that common circle are at most 2a = **196.9 km**
# apart, comfortably inside 300 km. Hence: OK, guaranteed by geometry, no phase draw
# to lose.
#
# RUN 1 (2026-08-08_1600) MEASURED **REJECTED, TWICE**, AND THE REASON IS THAT THE
# 300 KM NUMBER IS NOT THE ENTRY GATE. `IsGhostWithinVisualRange` does not compare a
# distance to 300 km at all - it is
#     GhostPlaybackEngine.cs:6325  ->  state.currentZone != RenderingZone.Beyond
# and `RenderingZoneManager.ClassifyDistance` puts a ghost in `Beyond` at
# `DistanceThresholds.GhostVisualRangeMeters` = **120,000 m** (Physics < 5 km, Visual
# 5-120 km, Beyond 120 km+). The 305,000 m constant is
# `WatchModeController.WatchExitCutoffMeters` - the EXIT cutoff, and only that. So the
# effective watch-ENTRY range is the 120 km render-zone gate, 2.5x tighter than the
# number the V4 header quotes.
#
# MINMUS IS THE CASE THAT COULD TELL THEM APART, which is exactly why this lane was
# worth flying rather than inferring. The engine's own per-member frame line printed
# the separations. ATTRIBUTION MATTERS HERE and an earlier draft got it wrong: the
# 144,356 / 191,499 pair quoted below and elsewhere in this file is the V7Mc
# CALIBRATION run `_1607` (archived: `logs/2026-08-08_1908_V7Mc-watch-calibration`,
# attempt 1; its attempt 2 is run `_1608`, archived at
# `logs/2026-08-08_1909_V7Mc-watch-calibration` - the log-folder stamps run ~3h01
# ahead of the run ids, so `_1909` is a FOLDER, never a run id). Run 1 `_1600`
# measured its own, very slightly different pair (archived:
# `logs/2026-08-08_1901_V7M-minmus-player-loop`):
#     cycle 1 park:  `i=1 ... zone=Beyond rdist=144349m`  (_1600) / `144356m` (_1607)
#     cycle 2 park:  `i=1 ... zone=Beyond rdist=191497m`  (_1600), and see the
#                    ATTRIBUTION note in the reading ledger: `_1607`'s `191499m` was
#                    NOT sampled at the cycle-2 park.
# Both sit BETWEEN 120 km and 300 km. A 300 km entry cutoff predicts OK at both; a
# 120 km zone gate predicts REJECTED at both. Measured: REJECTED at both. The 300 km
# entry hypothesis is falsified by measurement, not merely by code reading. (V4 could
# not have caught this: its parked-tail draw read 643,913 m, which fails BOTH
# thresholds, so its REJECTED was consistent with either.)
# The corrected entry CONDITION is a chord < 120 km on a shared circle of radius a,
# i.e. `theta < 2*asin(60/a)`:  Minmus 75.1 deg, Mun 20.3 deg, V4's Duna park
# 6.6 deg. Those are geometric ANGLES, and this file no longer converts them into
# "~42% / ~11% / ~3.7% of a draw": these separations are not drawn per run at all -
# both craft advance at the same rate on the same orbit, so the separation is a fixed
# per-cycle geometric fact and changes only when the phase anchor moves. (What IS
# per-run, and is a separate matter, is how faithfully the instrument REPORTS that
# fact; see the `_1601` outlier in the reading ledger.)
#
# WHICH IS WHY THIS LANE STILL ENTERS WATCH MODE - AT CYCLE 3, MEASURED. A calibration
# run (2026-08-08_1607) walked cycles 3, 4 and 5 and found the cycle-3 park INSIDE the
# 120 km gate. Its own log carries no `engine-frame-iter` sample inside the cycle-3
# park window (that line is rate-limited to ~1/s and the window is ~0.4 s wide); the
# separation there is read off the Zone subsystem's line at the same instant,
#     `FX suppressed: ghost #1 "Kerbal X" cycle=2 anchorDist=51503m renderDist=51503m`
# i.e. 51.5 km - Visual, not Beyond. THE `cycle=2` IN THAT LINE IS THE CYCLE-3 PARK,
# and the quote must not be "corrected" to match the prose: `state.loopCycleIndex`
# (`GhostPlaybackEngine.cs:3649`) is the 0-BASED schedule index the span clock
# resolved - `MissionPeriodicity.TryResolveActiveLaunch` returns the index of the
# largest scheduled launch <= now - so the third launch prints `cycle=2`. Prose in
# this file counts cycles from 1. The verb answered
#     `enterwatchmode initiated: index=1 recId=775188aff66f4c06928e97f2b94e6f0b
#      tree= auto=true`
#     `enterwatchmode complete: index=1 recId=775188aff66f4c06928e97f2b94e6f0b`
# A PRIOR DRAFT OF THIS PARAGRAPH QUOTED `zone=Physics rdist=7m` FOR CYCLE 3. That
# reading is real but it is the CYCLE-5 park, and it is not a live-craft-to-ghost
# separation at all: by then the run is already watching, and `rdist` is the RENDER
# distance, which follows the live scene camera - the camera watch mode has anchored
# on the ghost itself. Cycle 4's frame reads `zone=Physics rdist=unresolved` for the
# same reason. Only the pre-entry cycles (1, 2 and 3) measure the observer-to-ghost
# geometry this section argues from.
# THE FIRST WATCH-MODE ENTRY IN THE SUITE, on a looped ghost, chosen off a measured
# separation curve rather than hoped for. Cycles 4 and 5 then answered
# `already-watching` on the same index - so watch mode SURVIVED two further
# `StartLoopPlayback` unit rebuilds and two ~1.08 Ms forward jumps, which is a second
# reading the calibration bought for free. The cycle-3 step below therefore pins
# `expect = "OK"` on a MEASUREMENT, and the product's own
# `enterwatchmode complete: index=` line is a REQUIRED token so the claim is gated by
# the completion rather than by a step verdict (the idempotent already-watching path
# also answers OK, and would otherwise satisfy the step vacuously).
#
# ---------------------------------------------------------------------------------
# 3. THE DESYNC HUNT - THREE cycles here, not V6M's two
# ---------------------------------------------------------------------------------
# Cycle 1, then a second "Warp to..." (StartLoopPlayback rebuilds the unit and resolves
# `NextLaunchAfter(now)`, so a press after an arrival lands on the next cycle), then a
# third - each with the same arrival bracket and the same instruments. Compare across
# all three: (a) does the ghost's map surface still rebind to a MINMUS-framed orbit at
# the arrival; (b) does the armed loop-seam-teleport instrument raise where it was
# silent; (c) how do the engine's own per-member `zone=/rdist=` park-epoch separations
# compare. None is armed as a threshold - a desync big enough to break (a) reds on the
# required `body=Minmus` token, anything subtler is READ and written back here.
# THE THIRD CYCLE IS WHAT MAKES (c) A TREND RATHER THAN A DIFFERENCE, and it is not
# free of interpretation: because both craft advance at the same rate on the same
# orbit, the separation is CONSTANT inside a cycle and moves only with the phase
# anchor, so the cycle-to-cycle series (144,356 m -> 191,499 m -> 51,503 m on the
# calibration run) is a measurement of how the anchor lands against the park period,
# NOT of drift within a replay. A genuine cumulative desync would show up in (a) or
# (b) instead. NOTE that (c) only reads the observer-to-ghost geometry BEFORE watch
# mode engages; after entry `rdist` follows the watch camera, so cycles 4 and 5 of the
# calibration measure nothing about separation.
#
# ---------------------------------------------------------------------------------
# 4. POSTURE
# ---------------------------------------------------------------------------------
# POSTURE (as flown and armed, 2026-08-08): FLOWN GREEN, ARMED. Both save-structure
# blocks now carry `gating = true`, taken off this lane's OWN reading run
