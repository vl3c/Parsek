#   REPRODUCIBILITY, RE-DERIVED FROM SURVIVING LOGS ONLY - AND THERE ARE FOUR OF THEM,
#   not three. The fourth is run `_1601` (V7M run 1's attempt 2, archived at
#   logs/2026-08-08_1902_V7M-minmus-player-loop): same spec shape, same
#   `firstLaunch=1077505.6991544911`, same jump targets, and the same cycle-1 park
#   epoch (`currentUT=1354406.000` against the others' `...406.020`). Cycle-1 park:
#     `_1600` 144,349 m   (logs/2026-08-08_1901)
#     `_1601` 198,711 m   (logs/2026-08-08_1902)   <- THE OUTLIER
#     `_1607` 144,356 m   (logs/2026-08-08_1908)
#     `_1608` 144,365 m   (logs/2026-08-08_1909)
#   THREE agree to 16 m; the fourth is 54 km high and, worse, sits ABOVE the
#   2a = 196.9 km maximum separation section 2 derives for this shared circle - so it
#   cannot be a valid observer-to-ghost chord at all. IT IS STATED, NOT DISCARDED. A
#   BENIGN MECHANISM IS AVAILABLE BUT NOT ESTABLISHED: in the three agreeing flights
#   the `[FlightIntegrator]: Vessel Kerbal X has been unloaded 9050.7x` line (9050.76
#   on `_1600`/`_1601`, 9050.78 on the two V7Mc attempts) PRECEDES
#   the frame sample carrying the reading (log lines 11512/11520, 11521/11529,
#   11526/11534) while in `_1601` it FOLLOWS it (11534 after the 11533 sample), i.e.
#   `_1601` sampled one frame earlier in the post-jump settle; and `rdist` resolves
#   through `ParsekFlight.ResolveCameraAnchorWorldPosition`, which returns null when
#   no anchor resolves and lets the caller fall back to the scene CAMERA. A pre-settle
#   frame reading the camera would produce exactly this. THAT IS A HYPOTHESIS; it has
#   not been confirmed by instrumenting the frame.
#   WHAT IT DOES AND DOES NOT TOUCH. The conclusion is UNTOUCHED: all four readings
#   are above the boundary bracket's upper end and below 300 km, and all four were
#   REFUSED, so the sufficiency of the 300 km figure is falsified four times over. It
#   equally does not identify the refusing term - four refusals at four distances are
#   four data points about the BOUNDARY and none about which conjunct produced it (see
#   the mechanism banner in section 2).
#   What it DOES soften is section 2's determinism sentence - the geometric
#   separation is still constant within a cycle and moves only with the phase anchor,
#   but the REPORTED number is evidently not reproducible run to run to the metre,
#   because one archived flight of the identical shape reported a number the geometry
#   cannot produce.
#   Cycle 2 reads 191,497 / 191,494 / 191,499 / 191,493 m in the same run order, and
#   ATTRIBUTION MATTERS AGAIN: only `_1600` (`currentUT=2431877.520`) and `_1601`
#   (`currentUT=2431877.500`) sampled at the CYCLE-2 PARK. `_1607`'s and `_1608`'s
#   were both taken at `currentUT=3232433.217` - the CYCLE-3 JUMP LEAD, the k=150
#   anchor minus the 15 s launch lead - where the ghost carries
#   `GuardSkip ... reason=mission-loop-unit-inactive` and an icon `reason=past-window`.
#   The near-equality is explicable (a past-window ghost clamped at the end of the
#   cycle-2 replay, against an observer epoch-shifted with `dMeanAnomaly=0.000000`),
#   but neither calibration attempt contributes a cycle-2-park frame sample, and
#   quoting the trio as three cycle-2 measurements over-counts the evidence.
#
#   THE DESYNC ANSWER - NO DETECTABLE DESYNC ACROSS THREE CYCLES:
#   (a) The Minmus-framed proto rebind (`phase=body-orbit surface=ProtoOrbitLine ...
#       body=Minmus`) fired at currentUT 1,345,355.020 / 2,422,825.020 / 3,500,297.020,
#       i.e. at offsets 267,849.32 / 267,848.06 / 267,848.80 s from their own anchors
#       (UN-ARCHIVED, run 2's log not collected on PASS).
#       All three agree to 1.3 s, which is exactly the spread of the rounded jump
#       targets this spec pins - so the handoff repeated at the same replay offset to
#       within the bracket's own resolution, three cycles running.
#       (a) is UN-ARCHIVED - see the provenance note above.
#   (b) Zero `loop-seam-teleport` raises and zero Tier-C anomalies of any reason across
#       all three cycles, with `ghostRenderTracing` armed. READ THIS INSTRUMENT AT ITS
#       OWN SENSITIVITY: `GhostRenderTrace.LoopSeamTeleportFloorMeters` is 1,000,000 m,
#       and the raise threshold is `max(that floor, expected motion * dt * multiplier)`
#       on a SINGLE-FRAME world delta. Silence therefore excludes ghost discontinuities
#       larger than 1,000 km between consecutive frames and nothing finer - it is the
#       COARSEST of the three instruments here, not the sharpest.
#       AND IT IS BLIND AT THE SEAM ITSELF, which is exactly where this paragraph
#       cites its silence. `GhostRenderTrace.IsLoopSeamTeleport`
#       (`GhostRenderTrace.cs:936-940`) returns false when
#       `playbackClockDeltaSeconds <= 0` or when it exceeds
#       `max(LoopSeamMaxPlaybackClockStepSeconds = 60, dt * 4)` - so the REBIND FRAME,
#       where the playback clock jumps a full loop period, is EXEMPT BY CONSTRUCTION.
#       "Silent across the seam" therefore means "silent on the frames either side of
#       it", never "the seam frame itself was measured and found clean".
#       (a) and (c) are what carry the sub-kilometre reading.
#   (c) The park separations (144,352 -> 191,498 -> 51,603 m, run 2's un-archived
#       readings; 144,356 -> 191,499 -> 51,503 m on the archived calibration) DO move
#       cycle to cycle, and that is not drift: it is where each phase anchor lands
#       against the 4,620 s park period. See section 3.
#
#   ONE REPORT-ONLY PRODUCT FINDING, filed not fixed (and filed as finding (2) of
#   `MOON-LOOP-FINDINGS` in docs/dev/todo-and-known-bugs.md, which is where the
#   quartet's two product observations live). Run 2 read
#   `unityExceptions total=1 (NullReferenceException)`, and it is not noise - it is a
#   deterministic teardown NRE this lane is the first to reach, because it is the first
#   run that ENDS while watch mode is active:
#     `NullReferenceException: FlightGlobals.get_ActiveVessel ()
#        Parsek.WatchModeController.GetActiveVesselSafe ()
#        Parsek.WatchModeController.RestoreCameraAfterWatchExit (Boolean)
#        Parsek.WatchModeController.ExitWatchMode (Boolean, Boolean)
#        Parsek.ParsekFlight.OnDestroy ()`
#   i.e. `GetActiveVesselSafe` is not safe during scene teardown - `FlightGlobals` is
#   already gone by the time `OnDestroy` runs the watch-exit camera restore. Harmless
#   at shutdown, one line, report-only here; NOT armed, and NOT worked around by
#   exiting watch mode before FlushAndQuit, because that would hide the only run shape
#   that reaches it.
#   WHY NO `unityExceptions` CEILING IS ARMED ON THIS LANE: the count is not stable
#   across two GREEN flights of the identical shape - reading run `_1613` read
#   `total=1`, the armed re-flight `_1642` read `total=5`, where only one of the five is
#   Parsek's and the other four are stock/MechJeb teardown NREs knocked on by the same
#   end-inside-watch shape in the same 40 ms window. A ceiling armed off either single
#   observation would have been wrong in one direction or the other.
#
# renderComposition ARMING LEDGER (M-A7 Phase 3C, WAVE A - added 2026-08-26).
#   POSTURE  DECLARED BARE. NOTHING IS ARMED AND NOTHING GATES. The block's only job today
#            is to EXIST: declaring it sets `PARSEK_RENDER_MANIFEST=1` at launch, which arms
#            the C# recorder at Awake, and one `ExportRenderManifest` step immediately before
#            the teardown takes the manifest at a chosen instant.
#   TRACERS  all three (`ghostRenderTracing` / `mapRenderTracing` / `verboseLogging`)
#            were ALREADY armed by this lane, so the declaration changes NO anomaly
#            exposure and the manifest's seam capture (all of it
#            `MapRenderTrace.IsEnabled`-gated) is live from the first flight.
#   READING  PENDING. Wave B accumulates readings FOR FREE off the normal tier cadence -
#            every flight of a declared lane writes facets into its results JSON. Windows get
#            written FROM those facets at arming, by operator decision, on the established
#            three-run discipline (reading -> armed re-flight -> negative control).
#   S4.1     Nothing in the flown shape moved: no step, no jump UT, no budget and no
#            existing expectation was touched. The additions are the export step and the
#            bare block; no existing step changed.
#   NOTE     SUBJECT: the suite's first watch-mode entry, on a Kerbin->Minmus
#            same-parent loop whose observer and ghost share a Minmus park. The
#            flight-host dwell/treatment census across a watch-entry boundary is what
#            this lane's manifest is for.
# =====================================================================================
tier = "operator"
description = "THE MINMUS PLAYER-LOOP LANE, the spec that BRACKETED the watch-entry boundary and then became the suite's FIRST watch-mode entry. Observer and ghost share a 98,463.595 m Minmus park, so their separation is constant within a cycle and moves only when the phase anchor does; cycles 1 and 2 measured 144,356 m and 191,499 m on the archived V7Mc calibration run `_1607` (144,349 m / 191,497 m on run `_1600`'s own archived log, 198,711 m on `_1601`) - all INSIDE the 300 km cutoff the production range term really uses (`WatchEnterCutoffMeters`, ParsekFlight.cs:19580 -> WatchModeController.cs:698), all REFUSED under the pre-2026-08-28 product - while cycle 3 at 51,503 m ENTERED, so the entry boundary was bracketed in (51.5 km, 144.3 km) and the range term was NOT what refused. THE REFUSING TERM WAS ESTABLISHED (`IsGhostOnSameBody`, answering from a stale spawn seed) AND THEN FIXED: the coordinated decision was TAKEN 2026-08-28, the term now resolves the ghost's body from its own trajectory, and THE CYCLE-1 AND CYCLE-2 PINS ARE NOW **PREDICTED OK, PENDING A READING FLIGHT** - see the header's WATCH-ENTRY MIGRATION banner and docs/dev/todo-and-known-bugs.md -> WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE, the single authority. Minmus is the one park whose separations land inside the quoted range and outside the old boundary, which is what made the measurement possible at all. At least one real entry is gated by the product's own `enterwatchmode complete:` line (measured at cycle 3, `zone=Visual rdist=51603m`, on the committed green run; predicted to move to cycle 1). Same-parent routing pinned positively (no re-aim, phase-lock + zero-drift, factory chain reaimed=False); three cycles feed the arrival-desync hunt."
instanceProfile = "stock-minimal"
tags = ["V7", "player-loop", "watch-mode", "loop-playback", "phase-lock", "zero-drift", "minmus", "moon", "flown"]

