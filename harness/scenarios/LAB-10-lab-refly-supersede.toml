schema = 1
id = "LAB-10-lab-refly-supersede"
tier = "operator"
# THE SCIENCE-LAB PROGRAM, lane LAB-10 (plan `docs/dev/research/lab-test-program-2026-10-17.md`,
# "LAB-10 Re-Fly, supersede and Discard Re-fly").
#
# RESHAPED 2026-10-20 FOR DESIGN SECTION 2.12 (owner ruling 2026-10-19, "a Re-Fly may take back
# only what was lost"), NOT RE-FLOWN. LAB-10 is now the NEGATIVE lane: act A is unchanged (the
# lab separates its tender, transmits 12.5 science tagged to its own recording, and the scene
# exit commits), and act B proves the lab's slot is NOT offered for a Re-Fly any more. The lab
# payout is a ScienceLabEarning row tagged to the slot's origin at UT ~2285, after the rewind
# point's UT ~368, untombstoned and tombstone-eligible, so it sits in the slot's RETIRE SET; it
# is not a loss row (a lost kerbal, a death penalty, a destroyed facility), so it SEALS the
# slot (Rule 1, the value gate). The player's Stash press is refused by
# `UnfinishedFlightStashHandler.TryStash` with the reason `recordingAction:ScienceLabEarning:
# <ActionId>`, and the Fly press (InvokeRewind) is refused by `RewindInvoker.CanInvoke`'s
# precondition 7 with the same reason. Nothing is rewound, stashed, split or tombstoned; the
# earning stays banked. The old merge half (stash, re-fly, transmit again, split, retag,
# tombstone) described a flow the ruling forbids; R7c (in-game) keeps seal-stash-fly and
# head-tip-split, and RF-L4 carries a Re-Fly of this lab whose OWN slot holds no earning.
# The old shape flew green on `2026-10-18_0100` (PASS attempt 1, PR #2140's build) after the
# reading run `2026-10-17_2337` found the Rendezvous milestone booked outside CAREER and the
# reconcile dump against a pruned capture; those findings were all in the removed merge half,
# and the act A tokens both flights matched are kept verbatim.
#
# HOST: `lab-lko-seeded-transmit` (harness/tools/build_lab_lko_transmit.py): `lab-lko-science`
# with 12.5 science in the lab. SCIENCE_SANDBOX, science 100, the LABX Orbital Lab (vessel
# persistentId 2200110055) ORBITING at about 107 x 92 km, Valentina in the pod, Bob in the lab,
# the Communotron 16-S on the pod, and the probe TENDER (OKTO + Z-200) joined above the pod by
# two editor-joined Clamp-O-Tron Jr ports (craft note A12). Fixture UT 355.8.
#
# THE SEPARATION (decompiled ModuleDockingNode, KSP 1.12.5). Editor-joined ports load in the
# PreAttached state, so `PartAction button=undock` (no part=: the vessel's one docked pair)
# folds both ports into one candidate; Undock() on a PreAttached port calls Decouple(), the
# original Vessel keeps pid 2200110055 and the focus, Parsek reads the split as cause UNDOCK,
# the coalescer emits ONE JointBreak with one controlled child (the tender), and a Rewind Point
# is authored with the lab as slot 0 and the focus slot (RF-20's measured shape).
#
# THE TRANSMIT WINDOW. The 16-S needs KSC in view: from the fixture's orbit (period 1957.1 s,
# near-equatorial) KSC sees the vessel from about UT 2105 to 2480. The press is at UT 2280; it
# pays floor(12.5) = 12 Mits and stock credits the whole 12.5 (LAB-4).
#
# THE STORY.
#   ACT A (unchanged). Record, undock the tender at UT ~368 (the Rewind Point), rails-warp to
#   the KSC pass, transmit: one credit `+12.50` tagged to the LAB'S recording, stock's +12.5 to
#   112.5. ExitToSpaceCenter auto-commits the tree: the lab slot is the focus slot ending
#   Orbiting, closed by `stableTerminalFocusSlot`; the tender slot opens
#   (`stableLeafUnconcluded`) and keeps the point alive. SaveGame persistent after the exit is
#   LOAD-BEARING (RF-20 run 1: the commit lands on arrival, after the exit's own save).
#   ACT B, the refusal. Fly the lab again, press Stash on its slot: REFUSED, ERROR
#   `stash-refused recordingAction:ScienceLabEarning:act_<32 hex>`. Press Fly (InvokeRewind)
#   on the same slot: REJECTED `refly-gate recordingAction:ScienceLabEarning:act_<32 hex>`.
#   The point is still listed (the tender slot is open and unsealed: the tender earned
#   nothing), and the load-time sweep reports no slot it had to seal on this save (the slot
#   was already closed by the classifier, so it is not an OPEN slot the migration sweep seals).
#
# WHAT IS GATED ON BELIEF (each a reading-run pin a first flight can falsify): the act A
# shape (measured on `2026-10-17_2337`); that the stash handler reaches the value gate for a
# slot the classifier already closed as stableTerminalFocusSlot (design 2.12: the gate is
# applied at the Stash resolver, before any write); that the seam's `RewindInvoker.CanInvoke`
# call reaches the slot-level precondition 7 (TODAY the seam passes only the rewind point, see
# the gap list in the PR body); the action id pattern `act_<32 hex>` (every committed ledger).
#
# NOT HERE: the Re-Fly itself (removed; RF-L4); LedgerGroundTruth (unproven in
# SCIENCE_SANDBOX).
#
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse - act A is LAB-10b's and RF-L1's act A.
# (2) no idle waits - every wait is an explicit-UT WarpToUT, 1x only around the separation and
# the transmit. (3) no dwells. (4) no burns. (5) no coast beyond the warp to the KSC pass.
# (6) fail fast - the two refusals are synchronous; retry `once`. (7) count window exact {2,2}.
# (8) tier - operator until a green flight (expected about 6 min). (9) flight_efficiency.py
# after the first green flight.
#
# WHAT A FIRST FLIGHT CAN FALSIFY: a stash OK or an InvokeRewind OK (the value gate missing at
# that site); a refusal naming another reason (`stableTerminalFocusSlot`-shaped or a different
# row type would mean the gate read a different retire set); any StartInvoke, split or
# tombstone line.
description = "LAB-10 (negative, design 2.12 Rule 1): an orbiting science lab separates its probe tender (a pre-attached port undock: a JointBreak split with a Rewind Point, the lab the focus slot) and transmits 12.5 science tagged to its own recording; after the commit the lab's slot is not offered for a Re-Fly: both the Stash press and the Fly press are refused with the reason recordingAction:ScienceLabEarning:<ActionId>, nothing is rewound or tombstoned, and the earning stays banked."
instanceProfile = "stock-minimal"
tags = ["science-lab", "science", "transmit", "refly", "refly-gate", "value-gate",
        "unfinished-flights", "stash", "docking-port", "scene-exit", "rails-warp", "LAB-10",
        "pending-flight"]

[fixture]
saveTemplate = "fixtures/saves/lab-lko-seeded-transmit"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                              expect = "OK" },
  { cmd = "DiscardTree",                                                                expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # The scene exit commits the tree; without autoMerge it refuses `dialog-required`.
  { cmd = "SetSetting",        args = { name = "autoMerge", value = "true" },           expect = "OK" },
  # LOAD-BEARING: the intent, classifier, LabEarning and tomb= lines are Verbose.
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  # ---- ACT A: record, separate the tender, transmit at the KSC pass, commit ----
  { cmd = "StartRecording",                                                             expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                             expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "368", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab10-undock" },                       expect = "OK" },
  { cmd = "PartAction",        args = { button = "undock" }, label = "und",             expect = "OK" },
  # The coalescer's 0.5 s window and the rewind point's deferred quicksave, at 1x.
  { cmd = "WarpToUT",          args = { ut = "380", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab10-split" },                        expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "2270", maxRate = "50" },                  expect = "OK", budget = 540 },
  { cmd = "WarpToUT",          args = { ut = "2280", maxRate = "1" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab10-t1-before" },                    expect = "OK" },
  { cmd = "PartAction",        args = { button = "labtransmit", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "2292", maxRate = "1" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab10-t1-after" },                     expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                          expect = "OK", budget = 120 },
  # LOAD-BEARING (RF-20 run 1): the commit lands on arrival, after the exit's own save.
  { cmd = "SaveGame",          args = { name = "persistent" },                          expect = "OK", budget = 120 },
  # ---- ACT B: fly the lab, press Stash and Fly on its slot: both refused ----
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent", focusPid = "2200110055" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  # InvokeRewind REJECTs `recording-active` before it reaches the gate under test.
  { cmd = "StopRecording",                                                              expect = "OK" },
  { cmd = "ListHandles",       args = { kind = "rewindpoints" }, label = "handles",     expect = "OK" },
  { cmd = "MissionMark",       args = { label = "lab10-gate" },                         expect = "OK" },
  # Slot 0 is the lab: RewindPointAuthor lists the surviving parent first (RF-20 measured).
  { cmd = "StashSlot",         args = { rp = "${handles.rp0}", slot = "0" },            expect = "ERROR" },
  { cmd = "InvokeRewind",      args = { rp = "${handles.rp0}", slot = "0" },            expect = "REJECTED", budget = 60 },
  { cmd = "MissionMark",       args = { label = "lab10-refused" },                      expect = "OK" },
  { cmd = "ListHandles",       args = { kind = "rewindpoints" }, label = "after",       expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "RecordingState",                                                             expect = "OK" },
  { cmd = "FlushAndQuit",                                                               expect = "OK" },
]

[dimensionsCovered]
# Every value is backed by a REQUIRED token below.
#   commit-scene-exit / auto-merge  <- `full-fidelity auto-commit (scene-exit...)` + exittospacecenter
#   controlled-decoupled-child      <- `ProcessBreakupEvent: controlled child created: pid=<tender>`
#   refly-gate                      <- `invokerewind refused: refly-gate recordingAction:ScienceLabEarning:`
#   load-time-sweep                 <- `Value-sealed slots (section 2.12): found=... sealed=...`
D1  = ["commit-scene-exit", "auto-merge"]
D5  = ["controlled-decoupled-child"]
D8  = ["science"]
D9  = ["refly-gate", "load-time-sweep"]
D14 = ["kerbin", "science-mode", "scene-flight", "scene-ksc", "warp-1x", "warp-rails"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The lab's recording and the tender's; nothing is split or re-flown. A reading-run pin.
count = { min = 2, max = 2 }

[expectations.logContracts]
required = [
  # The seeded lab, as the builder wrote it.
  "partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=0\\.00;Research:active=0'",
  # --- ACT A: THE SEPARATION ---
  # One press undocks the one pre-attached pair: the lab keeps pid 2200110055 and the focus.
  "(?s)MISSIONMARK label=lab10-undock (?:(?!partaction applied button=).)*?partaction applied button=undock pid=2200110055 part='dockingPort3' partId=[0-9]+ event=Undock newPid=[1-9][0-9]* newName='[^'\\r\\n]*' vessels=1->2 activePid=2200110055 ",
  # The click intent is armed and consumed as an UNDOCK, not a staging decouple ...
  "Armed pre-attached Undock intent: portPid=[0-9]+ otherPid=[0-9]+ ut=",
  "=> UNDOCK \\(consumed\\)",
  "OnPartDeCouple: pre-attached docking-port undock part='dockingPort3' pid=[0-9]+ vesselPid=2200110055 => split cause UNDOCK",
  # ... the coalescer emits one JointBreak with cause UNDOCK and one controlled child ...
  "SEPARATION emitted: ut=[0-9.]+ type=JointBreak splitCause=UNDOCK decouplerPartId=[0-9]+ controlledChildren=1 debris=0 ",
  # ... the tender (the press's newPid) gets its own controlled-child recording, both sides
  # read controllable, and the Rewind Point is authored with the lab as the focus slot.
  "(?s)partaction applied button=undock [^\\r\\n]*newPid=([0-9]+) .*?ProcessBreakupEvent: controlled child created: pid=\\1, name='[^'\\r\\n]*', recId=[0-9a-f]{32}, alive=True, bgRecorder=True",
  "(?s)partaction applied button=undock [^\\r\\n]*newPid=([0-9]+) .*?Controllable split children: \\[(?:2200110055,\\1|\\1,2200110055)\\] \\(orig=2200110055, checked=2, unresolved=0\\)",
  "(?s)Controllable split children: \\[[0-9,]+\\] \\(orig=2200110055, .*?RewindPoint begin: rp=(rp_[0-9a-f]{32}) bp=[0-9a-f]{32} slots=2 controllablePids=2 focusSlot=0 ut=[0-9.]+.*?RewindPoint slot capture: rp=\\1 populated=2/2 disabled=0",
  # The lab after the separation: same pid, the 12.5 still aboard.
  "(?s)MISSIONMARK label=lab10-split (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=0\\.00;",
  # --- ACT A: THE TRANSMIT ---
  # Exactly the whole 12.50, tagged to the LAB'S recording (it kept the startrecording id) ...
  "(?s)startrecording recordingId=([0-9a-f]{32}) already=false(?:(?!MISSIONMARK label=lab10-t1-after ).)*?MISSIONMARK label=lab10-t1-before (?:(?!MISSIONMARK label=lab10-t1-after ).)*?Game state: ScienceLabCredited \\+12\\.50 reason='ScienceTransmission' vessel='LABX Orbital Lab' ut=[0-9.]+ recordingId='\\1'",
  # ... beside stock's own +12.5, 100 -> 112.5, and the lab keeps the fraction.
  "(?s)MISSIONMARK label=lab10-t1-before (?:(?!MISSIONMARK label=lab10-t1-after ).)*?Game state: ScienceChanged \\+12\\.5 \\(ScienceTransmission\\)[^0-9\\r\\n]+112\\.5(?![0-9])",
  "(?s)MISSIONMARK label=lab10-t1-after (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.50 dataStored=0\\.00;",
  # --- ACT A: THE COMMIT ---
  "exittospacecenter start scene=FLIGHT autoMerge=true hasActiveTree=true hasPendingTree=false",
  "full-fidelity auto-commit \\(scene-exit[^\\r\\n]*\\): tree='LABX Orbital Lab' recordings=2 ",
  # The lab slot is the focus leaf ending Orbiting (closed); the tender slot opens.
  "(?s)startrecording recordingId=([0-9a-f]{32}) already=false.*?IsUnfinishedFlight=false rec=\\1 reason=stableTerminalFocusSlot slot=0 focusSlot=0 terminal=Orbiting",
  "CommitTree promoted rec=[0-9a-f]{32} vessel='[^'\\r\\n]*' slot=1 rp=rp_[0-9a-f]{32} reason=stableLeafUnconcluded to CommittedProvisional",
  "CommitTree: promoted 1 normal staging RP\\(s\\)",
  # The commit books the first credit as a ledger row on the lab's recording.
  "(?s)startrecording recordingId=([0-9a-f]{32}) already=false.*?exittospacecenter start .*?LabEarning: credit=12\\.5, method=Transmitted, runningScience=112\\.5, recordingId=\\1(?![0-9a-f])",
  "exittospacecenter complete scene=SPACECENTER game-loaded=true elapsed=",
  # --- ACT B: THE VALUE GATE (design 2.12 Rule 1) ---
  "listhandles kind=rewindpoints count=1 truncated=false",
  # The migration sweep runs on every load and prints one summary (Info).
  "Value-sealed slots \\(section 2\\.12\\): found=[0-9]+ sealed=[0-9]+",
  "stashslot start rp=rp_[0-9a-f]{32} slot=0",
  # The Stash press is refused naming the lab earning (handler reason, verbatim) ...
  "(?s)MISSIONMARK label=lab10-gate (?:(?!MISSIONMARK label=lab10-refused ).)*?stashslot refused rp=rp_[0-9a-f]{32} slot=0 tip=\\S+ msg=stash-refused recordingAction:ScienceLabEarning:act_[0-9a-f]{32}",
  # ... and so is the Fly press, with the same reason (CanInvoke precondition 7).
  "(?s)MISSIONMARK label=lab10-gate (?:(?!MISSIONMARK label=lab10-refused ).)*?invokerewind refused: refly-gate recordingAction:ScienceLabEarning:act_[0-9a-f]{32}",
  # Both name the SAME row: the one act A's transmit booked.
  "(?s)stashslot refused [^\\r\\n]*recordingAction:ScienceLabEarning:(act_[0-9a-f]{32}).*?invokerewind refused: refly-gate recordingAction:ScienceLabEarning:\\1(?![0-9a-f])",
  # The point survives (the tender slot holds no earning), the lab keeps the fraction.
  "(?s)MISSIONMARK label=lab10-refused .*?listhandles kind=rewindpoints count=1 truncated=false",
  "(?s)MISSIONMARK label=lab10-refused (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.50 dataStored=0\\.00;",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "partaction rejected",
  "partaction error ",
  "warptout refused",
  "exittospacecenter rejected",
  "stashslot readback-failed",
  "Single-controllable split: no RP",
  "OnVesselsUndocking:entry",
  "Tree branch created: type=Undock",
  # Nothing is stashed, rewound, split or tombstoned.
  "Stashed slot=0 ",
  "StartInvoke: sess=",
  "Invocation complete: sess=",
  "Split origin [0-9a-f]{32} at UT=",
  "Tombstoned [1-9][0-9]* career actions",
  "Reaped rp=",
  # The refusal names the lab earning, never another row type.
  "(?:stash-refused|refly-gate) recordingAction:(?!ScienceLabEarning:)",
  # Exactly one lab credit, inside its window.
  "(?s)(?:Game state: ScienceLabCredited .*?){2}",
  "(?s)\\A(?:(?!MISSIONMARK label=lab10-t1-before ).)*?Game state: ScienceLabCredited",
  # The earning stays banked: no walk after the refusal retires it (100 is the pre-transmit pool).
  "(?s)MISSIONMARK label=lab10-gate .*?PatchScience: [^\\r\\n]*target=100\\.0\\)",
  "Exploded!!",
]

# REPORT-ONLY until the reading run: the point survives, no supersede row, no tombstone.
[expectations.rewind]
gating        = false
rewindPoints  = { min = 1, max = 1 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[runtime]
# Two LoadGame steps (up to 300 s each; about 7-90 s measured on the LAB lanes), one rails warp
# of about 1,900 s at the 50x cap (about 40 s), about 40 s of 1x game time, one scene exit, a
# save and two synchronous refusals. Sum of the step budgets plus the inert steps: about
# 2,100 s.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
