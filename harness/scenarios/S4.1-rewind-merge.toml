schema = 1
id = "S4.1-rewind-merge"
# tier = "nightly" (RE-TIERED 2026-07-26, rewind-loop lane). It was "operator" on the
# claim that "InvokeRewind + AnswerMergeDialog are RequiresFlight / conclude-a-flight
# and the seam has NO flight-entry verb, so from the gloops SPACECENTER host every verb
# only DEFERS to a TIMEOUT". That claim is FALSE at HEAD, and was never true:
#
#   `LoadGame` IS the flight-entry verb. It realizes the .sfs and, when
#   `game.flightState.activeVesselIdx` names a focusable vessel, takes the FOCUS route -
#   FlightCameraReloadPin.Arm + StartAndFocusVessel - landing in FLIGHT
#   (ParsekTestCommandAddon.LoadGameImpl + TestCommandLoadGame.DecideLoadRoute; the
#   SPACECENTER route is only the NO-VESSEL fallback). This spec's template is NOT a
#   SPACECENTER host: fixtures/saves/gloops-airshow carries `activeVessel = 1` over two
#   VESSEL nodes, so step 0 lands in FLIGHT and step 2's InvokeRewind executes rather
#   than defers.
#
#   LIVE EVIDENCE, not just code reading: EVA-1 (tier nightly, FULL PASS 2026-07-24)
#   drives six RequiresFlight verbs from this exact template every run, and EVA-2 /
#   EVA-3 / S0.5 / S0.6 do the same.
#
# The other operator-tier reason, (b) "EXPENSIVE AND UNFLOWN", needs BOTH: this is a
# flight-free seam run whose happy path is ~700 s, an order below the B16-class lane the
# reason exists for. COST OF A FIRST-FLIGHT FAILURE, since that is what reason (b)
# actually weighs: the 1680 s budget below bounds the DEFER path, and the defer path is
# exactly what the correction above removes. With the verbs EXECUTING, a bad run ends on
# a fast terminal verdict (`REJECTED unknown-rp` / `refly-gate <reason>` / an unmet step)
# within seconds of the boot, so the real repeated cost is ~2 short KSP boots a night,
# not 2 x 1680 s. nightly rather than daily because it is still UNFLOWN: its first
# scheduled run IS its live-prove, and a failure there classifies driver-INVALID
# (retryable), never a false PARSEK-FAIL. The pending-operator TAG stays until that
# first green run; the tag alone is non-gating.
#
# NOT VERIFIED BY A RUN: this re-tier is derived from the code + EVA-1's live precedent,
# not from an S4.1 flight (the rewind-loop lane was headless by constraint). If the first
# nightly reds on something structural rather than a real Parsek finding, put it back.
tier = "nightly"
# The B9 re-fly cycle (catalog B9 / S4.1): inject a committed tree whose ascent
# split into a surviving upper stage + a CRASHED booster, plus a Rewind-to-
# Separation RewindPoint at the split. Drive the whole cycle through the M-C1
# verbs: InvokeRewind spawns and settles the fresh re-fly attempt in FLIGHT, then
# the folded AnswerMergeDialog DRIVES the conclusion scene-exit (surfacing the
# pre-transition merge dialog) and answers it with Commit. There is deliberately NO
# separate scene-changing conclusion step between them: a blocking LoadGame
# conclusion would starve the very AnswerMergeDialog that unblocks it (the
# AnswerMergeDialog FIFO-starvation deadlock, design finding A-B1).
#
# PENDING-VERIFIER (this used to say PENDING-OPERATOR for a flight-entry reason that
# no longer holds - see the tier note): the cycle itself is now fully unattended, but
# the supersede-relation / tombstone asserts still have no verifier. They are RESERVED
# (see [expectations.rewind]; hlib.evaluate_expectations records them SKIPPED until the
# M-C2 rewind save-parse verifier lands), so what this spec actually gates today is the
# headless-checkable set: the four re-fly log contracts + the recording-count floor.
# Both are named in the coordinator runbook.
description = "B9 re-fly cycle: InvokeRewind a crashed-booster slot, AnswerMergeDialog merge folds the scene-exit conclusion, corpus survives, re-fly log contracts fire."
instanceProfile = "stock-minimal"
tags = ["rewind", "refly", "merge", "S4.1", "B9", "D9", "pending-operator"]

[fixture]
# rewind-b9 injects the B9 rewindable-tree fixture (RewindB9Fixture via
# `dotnet test --filter InjectRewindB9`): a committed tree (root ascent + surviving
# upper stage + crashed booster, TerminalState.Destroyed) and a RewindPoint
# rp_b9_root with two child slots (upper=0, booster=1). The RP quicksave sidecar is
# written self-referentially to Parsek/RewindPoints/rp_b9_root.sfs so CanInvoke's
# on-disk probe passes; CreatingSessionId is null so LoadTimeSweep keeps it. The
# gloops-airshow save is the injection host, and it loads INTO FLIGHT (activeVessel = 1;
# see the tier note) - it is not a SPACECENTER host.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "rewind-b9"
craft = []

[driver]
kind = "seam"
# The worked example (design "Example scenario spec fragments"). rp/slot are the
# fixed identifiers RewindB9Fixture bakes (rp_b9_root, slot 1 = the crashed
# booster). autoRecordOnLaunch OFF pins determinism (no save-setting-triggered live
# recording racing the re-fly). AnswerMergeDialog merge leaves the run in
# SPACECENTER with the fork merged + committed, so the following RecordingState
# (AnyScene) confirms the merged tree - a CommitTree here would ERROR no-active-tree
# because the merge already committed the fork.
steps = [
  { cmd = "LoadGame",         args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting",       args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "InvokeRewind",     args = { rp = "rp_b9_root", slot = "1" },             expect = "OK", budget = 300 },
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },                         expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                         expect = "OK" },
  { cmd = "FlushAndQuit",                                                           expect = "OK" },
]

[dimensionsCovered]
# HONEST: the cycle drives a real Rewind-to-Separation on a chosen slot past the
# five-precondition gate (rewind-to-separation, refly-gate), which captures the
# reconciliation bundle (reconciliation-bundle) and runs the read-back guard over
# it (read-back-guard); the merge commit splits the origin at the rewind UT
# (head-tip-split), writes the supersede row (supersede-relation), classifies the
# terminal kind (terminal-kind-classify), and opens the merge journal
# (merge-journal). D8 recalc-engine: the re-fly recalcs the ledger at merge. NOT
# claimed: tombstones (the crashed sibling is an uncrewed booster, no kerbal-death
# tombstone) and revert-during-refly-dialog (we merge, not discard).
D9 = ["rewind-to-separation", "refly-gate", "reconciliation-bundle", "read-back-guard",
      "head-tip-split", "supersede-relation", "terminal-kind-classify", "merge-journal"]
D8 = ["recalc-engine"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# Floor only: the merged fork must leave at least the surviving tree visible. A
# re-fly that lost the committed corpus would sink below 1 and red. (No ceiling:
# the merge adds the re-fly fork's recording(s), a count the headless path does not
# pin.)
count = { min = 1 }

[expectations.logContracts]
# The two grep-stable re-fly milestones (RewindInvoker.cs:536 / :963): StartInvoke
# entered the pre-load phase and the post-load ConsumePostLoad completed. Both
# firing proves the re-fly actually ran end-to-end, not just that the verb returned.
#
# Route-rewind timeline wave additions: the post-load path
# runs ReconciliationBundle.Restore(cutoff), so the cutoff-carrying restore line
# and the "Restored:" summary's unconditional pendingScience= count must fire on
# every successful invoke. Conditional lines (retired route rows / dormanted
# routes / dropped science) stay un-required: rewind-b9 carries no routes or
# pending science - the unattended H6-route-rewind-timeline scenario owns those.
required  = ["Re-Fly \\(Rewind-to-Separation\\) StartInvoke", "Invocation complete",
             "ConsumePostLoad: restoring bundle with route-retire cutoffUT=",
             "Restored: recs=.* pendingScience="]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

# RESERVED block (hlib evaluate_expectations records these SKIPPED until the M-C2
# rewind verifier lands). Documents the re-fly-specific asserts a save-parse
# verifier will check: exactly one supersede row for the superseded booster
# subtree, and no phantom tombstone (uncrewed booster). PENDING-OPERATOR /
# PENDING-VERIFIER; named in the coordinator runbook.
[expectations.rewind]
supersedeRows = { min = 1 }
tombstones    = { max = 0 }

[runtime]
# Budget arithmetic (M-A5 S8): sized so the WORST DEFER path surfaces a clean per-step
# TIMEOUT (driver-INVALID) for every step instead of a run-budget KILL. run.py waits
# max(step_budget, 600) + 60 per DEFERRED verb (LoadGame/InvokeRewind) and step_budget
# for the rest, and the run-budget ceiling must exceed the SUM so no step-wait is capped:
#   LoadGame        max(240,600)+60 = 660
#   SetSetting      (default)       =  60
#   InvokeRewind    max(300,600)+60 = 660
#   AnswerMergeDialog (budget)      = 120
#   RecordingState  (default)       =  60
#   FlushAndQuit    (default)       =  60   -> sum 1620; +60 margin = 1680.
# On the happy path (verbs execute in FLIGHT) the real wall-clock is ~700s,
# far under this ceiling; the ceiling only governs the unattended defer path.
budgetSeconds = 1680

[retry]
policy = "once"

[expectedFail]
# S4.1 IS the dedicated rewind-then-teardown case: LoadGame -> InvokeRewind ->
# AnswerMergeDialog -> RecordingState -> FlushAndQuit, with NO flying between,
# which is exactly the reproduction for R1-EMPTY-PROVISIONAL (found by R1 flight
# 2, 2026-07-26; written up in docs/dev/todo-and-known-bugs.md). The re-fly
# session's provisional accumulates zero Points, so
# `SupersedeCommit.ValidateSupersedeTarget` refuses the supersede batch and - on
# a DEBUG DLL, which is what the automation instance runs - `AppendRelations`
# THROWS, `MergeDialog` catches it and logs at ERROR, and this spec's
# `logContracts.forbidden = ["\[Parsek\]\[ERROR\]"]` reds the run.
#
# That contract is CORRECT and stays. Marking the known finding here is what
# keeps S4.1 on the nightly as the standing regression test instead of either
# redding the sweep every night or - much worse - being "fixed" by relaxing the
# forbidden-ERROR pattern, which would have hidden the find in the first place.
#
# subkind pins the SIGNATURE: only a PARSEK-FAIL(expectation) demotes to
# EXPECTED-FAIL. A different failure still reds as PARSEK-FAIL, and the day the
# finding is fixed this run reports XPASS ("expected-fail bugId=... unexpectedly
# passed") - at which point DELETE both keys below.
bugId   = "R1-EMPTY-PROVISIONAL"
subkind = "expectation"
