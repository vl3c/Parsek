schema = 1
id = "QL-4c-quickload-after-in-flight-save"
# RESHAPED 2026-10-20 FOR "LOAD RESTORES THE SAVE" PHASE 2 (design
# docs/dev/design-load-restores-the-save.md 4.1 / 4.2 / 5 S2 / 8; plan Phase 2 step 7). NOT
# FLOWN in this shape. The F9 carries `playerLoad=true`, a Cold save-file load. The F9's
# scene change still stashes the copy-on-write clone the recorder resumed after CommitTree;
# the session reset now drops it from memory only (`pendingTreeDropped=true`, no discard)
# together with the committed copy and the restore attempt. The cold branch restores the
# quicksave's active tree; both rewrites after the F5 (CommitTree's flush, the later
# persistent save) moved the F5 bytes into `_versions`, which resolve by hash and are
# promoted. NO COMMITTED-COPY RULE LINE, no detach, no restore-attempt clear line, no
# reconcile (skip by policy, kind=Cold). OUTCOME unchanged: the booster recorded again and
# committed Landed. The mechanism paragraphs below describe the in-session route this lane
# flew before Phase 2; kept as history, this block is authoritative.
# READING RUN 2026-10-07 (branch `f9-verify`, automation DLL sha256 prefix bd97e6a7):
# attempt 1 PARSEK-FAIL on two PREMISE misses, not a product defect. Every F9 token
# fired (the committed-copy restore line, the detach, the abandoned-future reconcile
# with endStatesCleared=2, `listhandles kind=active count=1`). (1) The post-F9
# `WarpToUT ut=400` went out 0.16-0.21 s after OnFlightReady and was refused
# `warptout refused reason=warp-locked ut=400 holders=physicsHold`: stock holds physics
# until the active vessel unpacks, which these logs place 1.0-1.2 s after OnFlightReady,
# and the 12 inert settle steps took about 0.4 s (one per frame, not the 0.25 s SS-1
# measured). No time passed, so the booster correctly finalized SubOrbital at the exit.
# The fix was a second settle pad of 150 inert steps between ListHandles and the warp
# (flown green on `f9-verify`); TC-1 (branch `scene-wait`) made the hold a WarpToUT
# defer and removed the pad. Spec changed, not re-flown.
# (2) The phys-ladder `WarpToUT ut=150` stops one tick short (reachedUT=149.77-149.80
# on all three QL-4 lanes), so the in-flight commit logs `at UT=149.9`; the commit-UT
# token now accepts 149.
# =====================================================================================
# QL-4c: AN F9 IN FLIGHT BACK INTO A FLIGHT COMMITTED IN FLIGHT, WITH A SAVE BETWEEN THE
# COMMIT AND THE LOAD, RESUMES THAT FLIGHT AND RETIRES ITS ABANDONED FUTURE. The in-flight
# variant of QL-4 and the live proof of todo
# QUICKLOAD-INTO-COMMITTED-FLIGHT-AFTER-A-SAVE-KEEPS-ABANDONED-FUTURE (in-flight route;
# roadmap "The timeline-operation coverage program", Lanes table, row QL-4c).
#
# In gameplay terms: QL-4's player (quicksave with the booster under canopy, fly on, commit
# the flight in flight) lets the game save once more before quickloading - KSP's own
# in-flight autosave, or a switch to a far vessel. Before the fix the quickload kept the
# post-commit copy of the flight, the commit stayed in the timeline with its abandoned future
# (endings, career events, ledger rows), every member read as still committed and nothing
# was retired. After the fix it behaves as QL-4 does with no save in between.
#
# THE MECHANISM UNDER TEST (ParsekScenario.TryRestoreActiveTreeNode,
# ParsekScenario.HydrationRepair.cs DecideCommittedCopyRestore / ResolveCommittedCopyRestore).
#   1. CommitTree commits the tree and flushes its sidecars without advancing their epochs
#      (RecordingStore.ShouldAdvanceSidecarEpochOnFlush); a recorder resumes on the still-active
#      vessel through a same-id copy-on-write clone (H58 flight 1), with the committed-tree
#      restore attempt armed.
#   2. SaveGame persistent (an OnSave in FLIGHT) rewrites the committed recordings with the
#      deferred epoch advance (`SidecarEpochAdvancePending`), past the quicksave's epochs.
#   3. The F9's scene change stashes the clone as pending Limbo; the quicksave's members read
#      `stale-sidecar-epoch`. Before the fix the stale-epoch keep
#      (ShouldKeepPendingTreeAfterHydrationFailure) held the clone and returned before the
#      splice and the detach: `keeping in-memory pending tree`, then the reconcile logged
#      `reason=empty-plan skippedCommitted=N`. Now the committed copy is in memory and the
#      quicksave holds no committed node for the tree, so the rule salvages the stale members
#      from the committed copy, does not keep the clone (`replacesStaleKeep=true`), detaches
#      the committed copy, clears the restore attempt, and the quicksave's tree resumes.
#
# THE ROUTE TAKEN: QL-4 verbatim, plus `SaveGame persistent` after the second StopRecording.
# QL-4's seam deviation stands (the recorder is stopped before the load because the LoadGame
# seam refuses `recording-active`); the clone stays the live tree, so the scene change still
# stashes it.
#
# BEFORE-FIX CONVENTION: PLAIN (lands with the fix). On a pre-fix DLL the prediction is
# PARSEK-FAIL(expectation): forbidden `keeping in-memory pending tree` and `reason=empty-plan`
# match; the decision line, the restore-attempt clear, the detach, the reconcile line and the
# 1-entry background attach are missing (the booster keeps its abandoned-future SubOrbital,
# so the post-F9 SubOrbital forbidden token matches too).
#
# READING-RUN NOTES:
#   - `route=space-center` on the decision line means the clone was not the live tree at the
#     F9 (nothing stashed it): a premise miss for the in-flight route; the rule still applies.
#   - No `Sidecar epoch mismatch` after the load means the SaveGame did not advance the
#     committed recordings' epochs; the lane then reads as QL-4 (staleMembers=0).
#   - The TC-1 `Quickload` verb would remove the StopRecording deviation
#     (todo HARNESS-VERBS-FOR-TIMELINE-OPS).
#
# THE TIMELINE: QL-4's (UTs from GS-1 / RF-1 / CA-1 readings, not measured on this lane), the
# SaveGame at ~UT 150 right after the commit.
#
# STATUS: AUTHORED 2026-10-06 (PR #2030); LIVE-PROVEN 2026-10-07 `2026-10-07_1942` (PASS attempt 1 on the
# settle fix). Report-only reading then: `rewind.rewindPoints 1 > max 0` - the replayed
# booster kept the abandoned future's CommittedProvisional merge state, so its rewind point
# was never reaped (todo QUICKLOAD-RESUMED-MEMBER-KEEPS-ABANDONED-FUTURE-MERGE-STATE). Fixed
# by PR #2049 and re-flown PASS `2026-10-07_2027` / `_2049`: `mergeStatesReset=1`, rewind point reaped,
# the window reads clean at 0. Every token is
# quoted from its emitting source line or from QL-4's header; saveParse blocks REPORT-ONLY.
# =====================================================================================
tier = "nightly"
description = "QL-4c: the in-flight variant of QL-4 with a save between the commit and the load. Quicksave with the booster under canopy, fly on, commit in flight, save the game, then the player's F9 back, a Cold save-file load. The reset drops the resumed clone and the commit, the quicksave's sidecar versions resolve and are promoted, no committed-copy rule runs, and the booster is recorded again and commits Landed."
instanceProfile = "stock-minimal"
tags = ["QL-4c", "QL-4", "TA-4", "quickload", "timeline-ops", "GS1", "staging", "controlled-child",
        "in-flight-commit", "scene-exit", "auto-merge", "stale-sidecar-epoch", "reading-run"]

[fixture]
saveTemplate       = "fixtures/saves/gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "gs1_auto_chute_booster"
# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },       expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "true" },    expect = "OK" },
  # The final commit is the scene-exit auto-merge (no merge modal can stand at the exit).
  { cmd = "SetSetting",     args = { name = "autoMerge", value = "true" },             expect = "OK" },
  # LOAD-BEARING: FinalizeTreeRecordings' per-recording line and the background-recorder
  # attach line are Verbose.
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },        expect = "OK" },
  # RF-1's mission: the pod lands, the booster is still airborne at the exit of the phase.
  { phase = "mission",                                                                 expect = "MISSION-OK", budget = 900 },
  # THE F5. The cutoff UT of the later quickload.
  { cmd = "SaveGame",       args = { name = "quicksave" },                             expect = "OK", budget = 120 },
  # The abandoned future: about 30 s, the booster still descending. CA-1's ladder and cap.
  { cmd = "WarpToUT",       args = { ut = "150", maxRate = "2", ladder = "phys" },     expect = "OK", budget = 300 },
  # Commit in flight (CA-1's order).
  { cmd = "StopRecording",                                                             expect = "OK" },
  { cmd = "CommitTree",                                                                expect = "OK", budget = 120 },
  # CommitTree auto-resumes a recorder on the still-active vessel (H58 flight 1).
  { cmd = "StopRecording",                                                             expect = "OK" },
  # THE SAVE THIS LANE ADDS: the committed recordings are rewritten with their epochs
  # advanced past the quicksave's (the autosave / far-switch OnSave of the todo).
  { cmd = "SaveGame",       args = { name = "persistent" },                            expect = "OK", budget = 120 },
  # THE F9, in FLIGHT: the player's load of the quicksave (playerLoad=true), a Cold
  # save-file load.
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "quicksave", playerLoad = "true" }, expect = "OK", budget = 300 },
  # Settle, as QL-4.
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "active" },                                expect = "OK" },
  # No settle pad before the warp: the post-load physics hold (reading run 2026-10-07:
  # sent 0.2 s after OnFlightReady it read `warp-locked holders=physicsHold`; the unpack
  # lands 1.0-1.2 s after it) is WarpToUT's own bounded defer since TC-1
  # (`warp-physics-hold`), which replaced the 150-step pad here.
  # The replay: the booster lands (CA-1's verb, target and cap).
  { cmd = "WarpToUT",       args = { ut = "400", maxRate = "2", ladder = "phys" },     expect = "OK", budget = 540 },
  # THE COMMIT: the scene-exit auto-merge of the resumed tree.
  { cmd = "ExitToSpaceCenter",                                                         expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                              expect = "OK" },
]

[driver.missionParams]
# RF-1's values VERBATIM (GS-1's plus siblingAirborneAtExit), as QL-4.
throttle = 1.0
stagingApoapsisMeters = 700
stagingMaxAltMeters = 1500
apoapsisWindowMeters = { min = 600, max = 1600 }
stageSettleFrames = 2
chuteArmMaxRateMps = 30
chuteFullDeployAltMeters = 600
landedSituations = ["LANDED", "SPLASHED"]
ascentTimeoutSeconds = 90
coastTimeoutSeconds = 120
stageTimeoutSeconds = 60
descentTimeoutSeconds = 300
siblingVesselName = "GS1 Auto-Chute Booster Probe"
siblingAirborneAtExit = true
siblingDownTimeoutSeconds = 240

[dimensionsCovered]
# D14 values only (each already covered elsewhere). No new claim.
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 2, max = 8 }

# REPORT-ONLY until a reading run; QL-4's prediction.
[expectations.recordings.structure]
gating         = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 2, max = 8 }
terminalStates = { Landed = { min = 2 }, SubOrbital = { max = 0 } }
branchPoints   = { JointBreak = { min = 1 } }

[expectations.rewind]
gating        = false
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.logContracts]
required = [
  # GROUP 1 - THE FLIGHT AND THE SPLIT (GS-1 / RF-1 / CA-1 measured).
  "Recording started",
  "ProcessBreakupEvent: controlled child created: pid=[0-9]+",

  # GROUP 2 - THE QUICKSAVE, THE ABANDONED FUTURE, THE COMMIT AND THE LATER SAVE.
  "savegame name=quicksave folder=.+ saved=true",
  "warptout complete",
  "CommitTreeFlight: starting tree commit at UT=(149|1[5-9][0-9]|[2-9][0-9]{2})\\.[0-9]",
  "committree committed=true",
  "committree committed=true[\\s\\S]*savegame name=persistent folder=.+ saved=true",

  # GROUP 3 - THE F9 IS A SAVE-FILE LOAD (design 4.1).
  "loadgame start save=\\S+ name=quicksave scene=FLIGHT requestedScene=Unspecified allowLiveRecorder=\\(none\\) recorderLive=false playerLoad=true",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave route=Focusable",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*\\[LoadPolicy\\] Save-file load intent armed: nodeUT=[0-9.]+ scene=FLIGHT",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave (?:(?!Load classified: )[\\s\\S])*Load classified: early=Cold refined=Cold scene=FLIGHT [^\\r\\n]*\\bcoldReason=save-file\\b",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*Save-scoped session state reset: reason=save-file ",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*OnLoad game state from save node: ledgerRows=[0-9]+ ",
  # The clone the F9's scene change stashed is dropped from memory only
  # (RecordingStore.ResetSaveScopedStateForLoad; ResetSaveScopedSessionState's two lines).
  "loadgame player-load: firing [\\s\\S]*Save-scoped reset dropped the pending tree from memory only \\(no discard, no purge, sidecars kept\\)",
  "loadgame player-load: firing [\\s\\S]*Save-scoped session state reset: reason=save-file pendingTreeDropped=true ",
  # The premise, read through the hashes: two rewrites after the F5 (the commit's flush, the
  # persistent save) put the F5 bytes in _versions; they resolve and are promoted.
  "loadgame player-load: firing [\\s\\S]*Sidecar version resolved: rec=[0-9a-f]{32} kind=prec hash=[0-9a-f]{16} source=version promoted=True",
  "loadgame player-load: firing [\\s\\S]*Sidecar version resolution summary: reason=cold-onload (?=[^\\r\\n]*\\bversion=[1-9])",
  # NO COMMITTED-COPY RULE: no committed copy in the save, nothing to detach.
  "loadgame player-load: firing [\\s\\S]*Quickload committed-copy restore skipped: tree='GS1 Auto-Chute Booster' id=\\S+ reason=no-committed-copy staleMembers=0",
  "loadgame player-load: firing [\\s\\S]*TryRestoreActiveTreeNode: no committed copy of tree 'GS1 Auto-Chute Booster' \\(id=\\S+\\) needed detaching",
  "OnLoad: cold-start active tree detected \\(state=Limbo\\) . deferred to OnFlightReady as Quickload",
  "Quickload resume prep: activeRec='[0-9a-f]{32}' cutoffUT=[0-9.]+ preTrimEndUT=[0-9.]+ trimScope=TreeWide [^\\r\\n]*\\bloadKind=Cold\\b",
  "RestoreActiveTreeFromPending: resumed recording tree 'GS1 Auto-Chute Booster' activeRec='[0-9a-f]{32}'",
  "\\[Scenario\\] Quickload abandoned-future reconcile skipped: tree='GS1 Auto-Chute Booster' kind=Cold scope=TreeWide reason=policy",

  # GROUP 4 - THE BOOSTER IS RECORDED AGAIN (QL-4's tokens).
  "RestoreActiveTreeFromPending: attached BackgroundRecorder for tree 'GS1 Auto-Chute Booster' \\([1-9][0-9]* background entry\\(ies\\)\\)",
  "listhandles kind=active count=[1-9][0-9]* truncated=false",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='GS1 Auto-Chute Booster Probe' points=[1-9][0-9]* orbitSegs=0 terminal=Landed maxDist=[0-9]+m snapshot=True leaf=True",
  "exittospacecenter start scene=FLIGHT autoMerge=true hasActiveTree=true hasPendingTree=false",
  "Silent full-fidelity auto-commit \\(scene-exit\\): tree='GS1 Auto-Chute Booster' recordings=[1-9][0-9]*",
  "exittospacecenter complete scene=SPACECENTER game-loaded=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE OLD IN-SESSION MACHINERY (design 8), unreachable on a save-file load.
  "loadgame player-load: firing [\\s\\S]*Load classified: early=InSession refined=QuickloadFlight",
  "Quickload committed-copy restore: tree='GS1 Auto-Chute Booster'",
  "Quickload committed-copy restore: cleared the committed-tree restore attempt",
  "loadgame player-load: firing [\\s\\S]*TryRestoreActiveTreeNode: removed committed tree 'GS1 Auto-Chute Booster'",
  "\\[Scenario\\] Quickload abandoned-future reconcile: tree='GS1 Auto-Chute Booster'",
  "loadgame player-load: firing (?:(?!exittospacecenter start)[\\s\\S])*Sidecar epoch mismatch",
  # THE DEFECT (pre-fix reading): the clone kept, nothing detached, an empty plan.
  "keeping in-memory pending tree 'GS1 Auto-Chute Booster'",
  "Quickload abandoned-future reconcile skipped: tree='GS1 Auto-Chute Booster' .*reason=empty-plan",
  "dropped entire tree 'GS1 Auto-Chute Booster'",
  "TryRestoreActiveTreeNode: skipped active tree 'GS1 Auto-Chute Booster'",
  "Quickload resume prep skipped",
  "RestoreActiveTreeFromPending: attached BackgroundRecorder for tree 'GS1 Auto-Chute Booster' \\(0 background entry\\(ies\\)\\)",
  "listhandles kind=active count=0 truncated=false",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='GS1 Auto-Chute Booster Probe' points=[0-9]+ orbitSegs=0 terminal=SubOrbital",
]

[runtime]
# QL-4's budget plus one SaveGame (180): two LoadGame 1320, SetSetting x3 360, mission 900,
# SaveGame x2 360, the two warps 300 + 540, StopRecording / CommitTree / StopRecording 420,
# ListHandles / ExitToSpaceCenter / FlushAndQuit 420. Expected wall about 10 minutes.
budgetSeconds = 3600

[retry]
policy = "once"

[expectedFail]
bugId = ""
