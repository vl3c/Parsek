schema = 1
id = "QL-4c-quickload-after-in-flight-save"
# READING RUN 2026-10-07 (branch `f9-verify`, automation DLL sha256 prefix bd97e6a7):
# attempt 1 PARSEK-FAIL on two PREMISE misses, not a product defect. Every F9 token
# fired (the committed-copy restore line, the detach, the abandoned-future reconcile
# with endStatesCleared=2, `listhandles kind=active count=1`). (1) The post-F9
# `WarpToUT ut=400` went out 0.16-0.21 s after OnFlightReady and was refused
# `warptout refused reason=warp-locked ut=400 holders=physicsHold`: stock holds physics
# until the active vessel unpacks, which these logs place 1.0-1.2 s after OnFlightReady,
# and the 12 inert settle steps took about 0.4 s (one per frame, not the 0.25 s SS-1
# measured). No time passed, so the booster correctly finalized SubOrbital at the exit.
# The fix is a second settle pad of 150 inert steps between ListHandles and the warp.
# (2) The phys-ladder `WarpToUT ut=150` stops one tick short (reachedUT=149.77-149.80
# on all three QL-4 lanes), so the in-flight commit logs `at UT=149.9`; the commit-UT
# token now accepts 149.
# =====================================================================================
# QL-4c: AN F9 IN FLIGHT BACK INTO A FLIGHT COMMITTED IN FLIGHT, WITH A SAVE BETWEEN THE
# COMMIT AND THE LOAD, RESUMES THAT FLIGHT AND RETIRES ITS ABANDONED FUTURE. The in-flight
# variant of QL-4 and the live proof of todo
# QUICKLOAD-INTO-COMMITTED-FLIGHT-AFTER-A-SAVE-KEEPS-ABANDONED-FUTURE (in-flight route;
# roadmap "The timeline-operation coverage program", Lanes table, row QL-4c).
#
# In gameplay terms: QL-4's player (quicksave with the booster under canopy, fly on, commit
# the flight in flight) lets the game save once more before quickloading - KSP's own
# in-flight autosave, or a switch to a far vessel. Before the fix the quickload kept the
# post-commit copy of the flight, the commit stayed in the timeline with its abandoned future
# (endings, career events, ledger rows), every member read as still committed and nothing
# was retired. After the fix it behaves as QL-4 does with no save in between.
#
# THE MECHANISM UNDER TEST (ParsekScenario.TryRestoreActiveTreeNode,
# ParsekScenario.HydrationRepair.cs DecideCommittedCopyRestore / ResolveCommittedCopyRestore).
#   1. CommitTree commits the tree and flushes its sidecars without advancing their epochs
#      (RecordingStore.ShouldAdvanceSidecarEpochOnFlush); a recorder resumes on the still-active
#      vessel through a same-id copy-on-write clone (H58 flight 1), with the committed-tree
#      restore attempt armed.
#   2. SaveGame persistent (an OnSave in FLIGHT) rewrites the committed recordings with the
#      deferred epoch advance (`SidecarEpochAdvancePending`), past the quicksave's epochs.
#   3. The F9's scene change stashes the clone as pending Limbo; the quicksave's members read
#      `stale-sidecar-epoch`. Before the fix the stale-epoch keep
#      (ShouldKeepPendingTreeAfterHydrationFailure) held the clone and returned before the
#      splice and the detach: `keeping in-memory pending tree`, then the reconcile logged
#      `reason=empty-plan skippedCommitted=N`. Now the committed copy is in memory and the
#      quicksave holds no committed node for the tree, so the rule salvages the stale members
#      from the committed copy, does not keep the clone (`replacesStaleKeep=true`), detaches
#      the committed copy, clears the restore attempt, and the quicksave's tree resumes.
#
# THE ROUTE TAKEN: QL-4 verbatim, plus `SaveGame persistent` after the second StopRecording.
# QL-4's seam deviation stands (the recorder is stopped before the load because the LoadGame
# seam refuses `recording-active`); the clone stays the live tree, so the scene change still
# stashes it.
#
# BEFORE-FIX CONVENTION: PLAIN (lands with the fix). On a pre-fix DLL the prediction is
# PARSEK-FAIL(expectation): forbidden `keeping in-memory pending tree` and `reason=empty-plan`
# match; the decision line, the restore-attempt clear, the detach, the reconcile line and the
# 1-entry background attach are missing (the booster keeps its abandoned-future SubOrbital,
# so the post-F9 SubOrbital forbidden token matches too).
#
# READING-RUN NOTES:
#   - `route=space-center` on the decision line means the clone was not the live tree at the
#     F9 (nothing stashed it): a premise miss for the in-flight route; the rule still applies.
#   - No `Sidecar epoch mismatch` after the load means the SaveGame did not advance the
#     committed recordings' epochs; the lane then reads as QL-4 (staleMembers=0).
#   - The TC-1 `Quickload` verb would remove the StopRecording deviation
#     (todo HARNESS-VERBS-FOR-TIMELINE-OPS).
#
# THE TIMELINE: QL-4's (UTs from GS-1 / RF-1 / CA-1 readings, not measured on this lane), the
# SaveGame at ~UT 150 right after the commit.
#
# STATUS: AUTHORED 2026-10-06 (PR #2030); LIVE-PROVEN 2026-10-07 `2026-10-07_1942` (PASS attempt 1 on the
# settle fix). Report-only reading: `rewind.rewindPoints 1 > max 0` - the replayed booster
# lands but keeps the abandoned future's CommittedProvisional merge state, so its rewind
# point is never reaped (todo QUICKLOAD-RESUMED-MEMBER-KEEPS-ABANDONED-FUTURE-MERGE-STATE);
# the window stays at 0, the post-fix prediction. Every token is
# quoted from its emitting source line or from QL-4's header; saveParse blocks REPORT-ONLY.
# =====================================================================================
tier = "nightly"
description = "QL-4c: the in-flight variant of QL-4 with a save between the commit and the load. Quicksave with the booster under canopy, fly on, commit in flight, save the game, then F9 back. The stale members are salvaged from the committed copy, the resumed copy-on-write clone is not kept, the committed copy is detached and its restore attempt cleared, the abandoned future is retired, and the booster is recorded again and commits Landed."
instanceProfile = "stock-minimal"
tags = ["QL-4c", "QL-4", "TA-4", "quickload", "timeline-ops", "GS1", "staging", "controlled-child",
        "in-flight-commit", "scene-exit", "auto-merge", "stale-sidecar-epoch", "reading-run"]

[fixture]
saveTemplate       = "fixtures/saves/gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "gs1_auto_chute_booster"
# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },       expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "true" },    expect = "OK" },
  # The final commit is the scene-exit auto-merge (no merge modal can stand at the exit).
  { cmd = "SetSetting",     args = { name = "autoMerge", value = "true" },             expect = "OK" },
  # LOAD-BEARING: FinalizeTreeRecordings' per-recording line and the background-recorder
  # attach line are Verbose.
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },        expect = "OK" },
  # RF-1's mission: the pod lands, the booster is still airborne at the exit of the phase.
  { phase = "mission",                                                                 expect = "MISSION-OK", budget = 900 },
  # THE F5. The cutoff UT of the later quickload.
  { cmd = "SaveGame",       args = { name = "quicksave" },                             expect = "OK", budget = 120 },
  # The abandoned future: about 30 s, the booster still descending. CA-1's ladder and cap.
  { cmd = "WarpToUT",       args = { ut = "150", maxRate = "2", ladder = "phys" },     expect = "OK", budget = 300 },
  # Commit in flight (CA-1's order).
  { cmd = "StopRecording",                                                             expect = "OK" },
  { cmd = "CommitTree",                                                                expect = "OK", budget = 120 },
  # CommitTree auto-resumes a recorder on the still-active vessel (H58 flight 1).
  { cmd = "StopRecording",                                                             expect = "OK" },
  # THE SAVE THIS LANE ADDS: the committed recordings are rewritten with their epochs
  # advanced past the quicksave's (the autosave / far-switch OnSave of the todo).
  { cmd = "SaveGame",       args = { name = "persistent" },                            expect = "OK", budget = 120 },
  # THE F9, in FLIGHT (refined load kind QuickloadFlight).
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "quicksave" },        expect = "OK", budget = 300 },
  # Settle, as QL-4.
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
