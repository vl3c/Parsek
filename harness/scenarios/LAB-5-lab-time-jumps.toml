schema = 1
id = "LAB-5-lab-time-jumps"
tier = "operator"
# THE SCIENCE-LAB PROGRAM, lane LAB-5 (plan `docs/dev/research/lab-test-program-2026-10-17.md`,
# "LAB-5 time jumps"). NEVER FLOWN: its first flight is a READING run, so it is `operator` and
# tagged `pending-flight` until that run pins the measured values.
#
# HOST: `lab-lko-science` (the LAB-2 / LAB-3 host): SCIENCE_SANDBOX, the LABX Orbital Lab (vessel
# persistentId 2200110055) ORBITING Kerbin at about 107 x 92 km, Valentina in the Mk1 pod, Bob
# (Scientist, level 0) in the Large.Crewed.Lab (part persistentId 1700054019, flightID
# 1270217782), 1,900 EC in full batteries, 8 RTGs (6 EC/s against Research's 5 EC/s). The lab
# loads empty with Research off. Fixture UT 355.8; the flown lab lanes settle near UT 357. The
# shared-ships overlay gives the save `Settings Probe` (a lone Stayputnik) for the pad half.
#
# THE STORY. A Parsek time jump is not production time (TA-6, ConverterJumpPolicy), loaded or
# unloaded. Process the four experiments (no recording; LAB-2's live values 5 / 15 / 22 / 8 =
# 50 data), start Research at 1x, then:
#   (a) LOADED: TimeJump 21,603 s forward with the lab active and researching. The policy shifts
#       the live converter clock (`Converter jump policy (epoch-shift): ... loadedShifted=1`),
#       so the lab reads the same afterwards, and 4,000 s of rails warp then show research
#       still running (about +0.05).
#   (b) UNLOADED: leave to the Space Center, launch `Settings Probe` from the VAB (the seam
#       TimeJump is FLIGHT-only, and the KSC has no jump verb, so a second vessel must hold
#       FLIGHT while the lab is unloaded), TimeJump about 21,980 s from the pad
#       (`unloadedShifted=1 unloadedVessels=1`, the proto snapshot's clock), save, and fly the
#       lab again (LoadGame focusPid, the Tracking Station Fly shape: SimulateStockSwitchClick
#       refuses an unloaded target). Only the short real time spent outside the jump may be
#       caught up.
#
# THE WITNESS IS ELECTRIC CHARGE, NOT STORED SCIENCE (decompiled BaseConverter.GetDeltaTime /
# GetBestDeltaTime and ModuleScienceConverter.PostProcess). A converter that missed the shift
# would catch up `now - lastUpdateTime` on its next step, but stock cuts the first catch-up
# slices to what the inputs can pay: 1,900 EC / 5 EC/s = 380 s of research, about 0.0048
# science. That is under half of the inspect's F2 step, so `storedScience` CANNOT tell a
# shifted clock from a missed one at this resolution (an unshifted jump moves 0.05 to 0.0548,
# still "0.05"). The same catch-up drains the vessel's 1,900 EC to about 0, which
# ReadVesselResources reads at F4. So each half gates EC against the reading before the jump:
# within 50 EC after the loaded jump (the batteries stay full: the RTGs out-produce Research),
# within 600 EC after the unloaded one (the real seconds outside the jump cost 5 EC each; 600
# allows 120 s). The F2 storedScience equality the plan asks for is still pinned (a lab that
# lost its science, or a jump that ran a full day of production, would break it), but it is
# the weaker check.
#
# STOCK UNITS (lab cfg researchTime 7, dataProcessingMultiplier 0.5, scienceMultiplier 5; Bob
# level 0): science/s = 5 * 0.5 * dataStored / 1e7 = 1.25e-5 at 50 data, measured 1.2494e-5 by
# LAB-3 (0.2700 after 21,610 s). After the 4,000 s warp: about 0.0502, dataStored 49.98 (one
# float ulp of 50 per 1 s rails step, LAB-3's 49.9187 after a day).
#
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse - LAB-6 takes the same pad route for a
# real-time absence; folding the jump into it would make the catch-up there ambiguous (an
# EC-limited catch-up looks the same for any absence over 380 s), so the jumps stay here.
# (2) no idle waits - every wait is an explicit-UT WarpToUT; the first experiment wait is UT
# 370 (13 s over the measured settle; the flown lanes' 385 left 15 s of slack). (3) the
# research warp is 4,000 s (about 86 s at the measured 46.7x), enough for a clear F2 rise.
# (4) no burns. (5) no coast. (6) fail fast - a refused verb fails its step at once; retry
# `once` until the first flight shows the lane deterministic. (7) count window - no recording
# is made, pinned {0,0}. (8) tier - operator until the reading run; promote by the measured p50
# (expected about 4 min). (9) flight_efficiency.py after the first green flight.
#
# WHAT A FIRST FLIGHT CAN FALSIFY: the policy on a live, crewed, researching lab
# (`loadedShifted=1`, the lab's own `Converter timestamp shifted (loaded)` line) and on its
# proto snapshot (`unloadedShifted=1 unloadedVessels=1`, `modules=1`); the EC catch-up premise
# (EC after either jump below its window means a missed shift and is a Parsek finding; EC
# below the window with the shift lines present would mean stock catches up something else);
# the editor route in SCIENCE_SANDBOX (`goeditor-craft-not-found` = the overlay row is
# missing; a launch refusal names its gate); the UT margins (`pre=` / `delta=` windows assume
# under 100 s between the exit and the jump); research still on after both jumps.
description = "LAB-5: in a crewed science lab in low Kerbin orbit researching after four experiments, a Parsek time jump of six hours with the lab loaded shifts the lab's converter clock so it produces nothing over the jumped span (electric charge and stored science unchanged) and research continues afterwards; after leaving to the Space Center and launching a probe from the pad, a second jump with the lab unloaded shifts its saved clock, and flying the lab again catches up only the real seconds outside the jump."
instanceProfile = "stock-minimal"
tags = ["science-lab", "science", "converter", "time-jump", "LAB-5", "pending-flight"]

[fixture]
saveTemplate = "fixtures/saves/lab-lko-science"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  # 1. The four experiments into the lab (50 data), no recording.
  { cmd = "PartAction",     args = { button = "experiment", part = "sensorThermometer" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "370", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "labprocess", part = "sensorThermometer" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "GooExperiment" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "376", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "labprocess", part = "GooExperiment" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "science.module" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "382", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "labprocess", part = "science.module" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "sensorBarometer" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "388", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "labprocess", part = "sensorBarometer" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  # 2. Research on at 1x; read the lab (j0) and the vessel's charge (e0).
  { cmd = "MissionMark",    args = { label = "lab5-research-on-before" },            expect = "OK" },
  { cmd = "PartAction",     args = { button = "startconverter", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "397", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge" }, label = "e0", expect = "OK" },
  # 3. (a) THE LOADED JUMP, about 21,603 s, the lab active and researching.
  { cmd = "MissionMark",    args = { label = "lab5-loaded-jump-before" },            expect = "OK" },
  { cmd = "TimeJump",       args = { ut = "22000" },                                 expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "lab5-loaded-jumped" },                 expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge", expect = "ElectricCharge:${e0.ElectricCharge}", tolerance = "50" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  # ... and research continues: 4,000 s of rails warp, back to 1x, read (about 0.05).
  { cmd = "WarpToUT",       args = { ut = "26000", maxRate = "50" },                 expect = "OK", budget = 300 },
  { cmd = "WarpToUT",       args = { ut = "26010", maxRate = "1" },                  expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge" }, label = "e1", expect = "OK" },
  # 4. (b) Leave the lab: the Space Center, then a probe on the pad holds FLIGHT.
  { cmd = "MissionMark",    args = { label = "lab5-leaving" },                       expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                       expect = "OK", budget = 120 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Settings Probe" },   expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                                        expect = "OK", budget = 180 },
  # THE UNLOADED JUMP, about 21,980 s, from the pad.
  { cmd = "MissionMark",    args = { label = "lab5-unloaded-jump-before" },          expect = "OK" },
  { cmd = "TimeJump",       args = { ut = "48000" },                                 expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "lab5-unloaded-jumped" },               expect = "OK" },
  # 5. Fly the lab again (the save holds the shifted proto clock), 10 s at 1x, read.
  { cmd = "SaveGame",       args = { name = "lab5-jumped" },                         expect = "OK", budget = 120 },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "lab5-jumped", focusPid = "2200110055" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "48010", maxRate = "1" },                  expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "lab5-back" },                          expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge", expect = "ElectricCharge:${e1.ElectricCharge}", tolerance = "600" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "MissionMark",    args = { label = "lab5-done" },                          expect = "OK" },
  { cmd = "SaveGame",                                                                expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                            expect = "OK" },
]

[dimensionsCovered]
D8  = ["science"]
D9  = ["fast-forward"]
D14 = ["kerbin", "science-mode", "scene-flight", "scene-ksc", "scene-editor", "warp-1x", "warp-rails"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# No recording is started; autoRecordOnLaunch is off for the probe's launch.
count = { min = 0, max = 0 }

[expectations.logContracts]
required = [
  # The four processes at the live stock lab values (LAB-2), the lab at 50 data, Research on.
  "partaction applied button=labprocess pid=2200110055 part='sensorThermometer' [^\\r\\n]*event=OnSendToLab [^\\r\\n]* labRoute=(?:page|review) labValue=5\\.00",
  "partaction applied button=labprocess pid=2200110055 part='GooExperiment' [^\\r\\n]*event=OnSendToLab [^\\r\\n]* labRoute=(?:page|review) labValue=15\\.00",
  "partaction applied button=labprocess pid=2200110055 part='science\\.module' [^\\r\\n]*event=OnSendToLab [^\\r\\n]* labRoute=(?:page|review) labValue=22\\.00",
  "partaction applied button=labprocess pid=2200110055 part='sensorBarometer' [^\\r\\n]*event=OnSendToLab [^\\r\\n]* labRoute=(?:page|review) labValue=8\\.00",
  "(?s)labprocess pid=2200110055 part='sensorBarometer' (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.00 dataStored=50\\.00;Research:active=0'",
  "partaction applied button=startconverter pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*event=StartResourceConverter [^\\r\\n]*state='lab:storedScience=0\\.00 dataStored=50\\.00;Research:active=1'",
  # j0: researching at 1x before the jump; e0: the batteries full.
  "(?s)MISSIONMARK label=lab5-research-on-before (?:(?!MISSIONMARK label=lab5-loaded-jump-before ).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.00 dataStored=50\\.00;Research:active=1'",
  "(?s)MISSIONMARK label=lab5-research-on-before (?:(?!MISSIONMARK label=lab5-loaded-jump-before ).)*?readvesselresources vessel index=0 rec=- found=true pid=2200110055 name='LABX Orbital Lab' loaded=true parts=26 ElectricCharge=1[89][0-9]{2}\\.[0-9]{4}/1900\\.0000",
  # (a) THE LOADED JUMP shifted the lab's live converter clock ...
  "timejump start target=22000 delta=",
  "Converter jump policy \\(epoch-shift\\): pre=39[0-9]\\.[0-9] post=22000\\.0 loadedShifted=1 unloadedShifted=0 unloadedVessels=0 neverRan=0 unreadable=0",
  "Converter timestamp shifted \\(loaded\\): vessel=LABX Orbital Lab part=Large\\.Crewed\\.Lab module=ModuleScienceConverter old=39[0-9]\\.[0-9] new=22000\\.0",
  # ... so no catch-up drained the charge (a missed shift costs all 1,900 EC) ...
  "(?s)MISSIONMARK label=lab5-loaded-jumped (?:(?!partaction applied button=).)*?readvesselresources expect resource=ElectricCharge expected=1[89][0-9]{2}\\.[0-9]{4} actual=1[89][0-9]{2}\\.[0-9]{4} diff=-?[0-9]+\\.[0-9]{4} tolerance=50\\.0000 match=true",
  # ... and the lab reads the same at F2, still researching (j1 == j0).
  "(?s)partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=([0-9]+\\.[0-9]{2}) dataStored=([0-9]+\\.[0-9]{2});Research:active=1'(?:(?!partaction applied button=).)*?MISSIONMARK label=lab5-loaded-jump-before (?:(?!partaction applied button=).)*?MISSIONMARK label=lab5-loaded-jumped (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=\\1 dataStored=\\2;Research:active=1'",
  # Research continues after the jump: 4,000 s of real rails warp add about 0.05.
  "warptout complete reachedUT=[0-9.]+ ut=26000 rate=[0-9.]+ maxRate=(?:[5-9]|[1-9][0-9]+)(?:\\.[0-9]+)? ",
  "(?s)warptout complete reachedUT=[0-9.]+ ut=26010 (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.0[4-6] dataStored=49\\.9[0-9];Research:active=1'",
  # (b) Out to the Space Center with nothing recording, a probe launched from the VAB.
  "exittospacecenter start scene=FLIGHT autoMerge=(?:true|false) hasActiveTree=false hasPendingTree=false",
  "exittospacecenter complete scene=SPACECENTER game-loaded=true",
  "goeditor complete facility=VAB craft=Settings Probe scene=EDITOR parts=1 ship=Settings Probe",
  "launchfromeditor complete scene=FLIGHT vessel=Settings Probe pid=[0-9]+ site=LaunchPad situation=PRELAUNCH",
  # THE UNLOADED JUMP shifted the lab's saved converter clock (the probe has no converter).
  "timejump start target=48000 delta=",
  "Converter jump policy \\(epoch-shift\\): pre=260[0-9]{2}\\.[0-9] post=48000\\.0 loadedShifted=0 unloadedShifted=1 unloadedVessels=1 neverRan=0 unreadable=0",
  "Converter timestamps shifted \\(unloaded\\): vessel=LABX Orbital Lab pid=2200110055 modules=1 delta=219[0-9]{2}\\.[0-9]",
  # Flying the lab again: only the real seconds outside the jump were caught up ...
  "loadgame start save=\\S+ name=lab5-jumped scene=FLIGHT requestedScene=Unspecified allowLiveRecorder=\\(none\\) recorderLive=false",
  "(?s)MISSIONMARK label=lab5-back (?:(?!partaction applied button=).)*?readvesselresources vessel index=0 rec=- found=true pid=2200110055 name='LABX Orbital Lab' loaded=true ",
  "(?s)MISSIONMARK label=lab5-back (?:(?!partaction applied button=).)*?readvesselresources expect resource=ElectricCharge expected=1[89][0-9]{2}\\.[0-9]{4} actual=1[3-9][0-9]{2}\\.[0-9]{4} diff=-?[0-9]+\\.[0-9]{4} tolerance=600\\.0000 match=true",
  # ... and the lab, active again, holds its science and is still researching.
  "(?s)MISSIONMARK label=lab5-back (?:(?!MISSIONMARK).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*activePid=2200110055 [^\\r\\n]*state='lab:storedScience=0\\.0[5-6] dataStored=49\\.9[0-9];Research:active=1'",
  # Research stores science in the lab; nothing moves the R&D pool.
  "(?s)MISSIONMARK label=lab5-research-on-before (?:(?!Game state: ScienceChanged).)*?MISSIONMARK label=lab5-done ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "partaction rejected ",
  "partaction-lab-value-zero",
  "partaction error ",
  "readvesselresources rejected",
  "timejump refused",
  "ScienceLabCredited",
  "Exploded!!",
  # Nothing spawns in this lane (no committed recording).
  "Converter jump policy \\(spawn\\)",
  # Research must never switch off: Bob stays in the lab throughout.
  "partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.0[1-9][^\\r\\n]*Research:active=0'",
]

[runtime]
# Two LoadGame steps (up to 300 s each, about 7 s measured), about 40 s of 1x game time, a
# 4,000 s rails warp (about 86 s at 50x), the Space Center, the editor and a launch (about 10 s
# measured on HC-2), two TimeJumps, a save and the reload.
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
