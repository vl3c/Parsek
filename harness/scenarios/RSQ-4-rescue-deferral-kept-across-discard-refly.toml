[expectations.recordings.structure]
crewAboard = { "Rayvan Kerman" = 1 }

[expectations.logContracts]
required = [
  # ---- the live accept, then the rewind ----
  "MISSIONMARK label=rsq4-before-accept ut=(?:(?!MISSIONMARK label=rsq4-accepted )[\\s\\S])*?kscaction action=accept-contract target=e8ba5ea6-570c-4b7f-99b4-44c9dee51030 applied=true",
  "MISSIONMARK label=rsq4-accepted ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rsq4-rewound ut=1857[0-9]{2}\\.",
  "MISSIONMARK label=rsq4-rewound ut=[\\s\\S]*?launchfromeditor complete scene=FLIGHT vessel=CS Flea Probe pid=[0-9]+ site=LaunchPad situation=PRELAUNCH[\\s\\S]*?MISSIONMARK label=rsq4-in-flight ut=1858[0-9]{2}\\.",

  # ---- the jump in FLIGHT: the rebuild deferred and listed ----
  "MISSIONMARK label=rsq4-in-flight ut=1858[0-9]{2}\\.(?:(?!MISSIONMARK label=rsq4-jumped )[\\s\\S])*?PatchContracts: accept-side world effect not run on rebuild: contractId='e8ba5ea6-570c-4b7f-99b4-44c9dee51030' type='RecoverAsset' effect=StrandedAsset outcome=Regenerate worldMissing=True repair=DeferStrandedAsset skip=scene=FLIGHT \\(orbit kerbal='Rayvan Kerman'; vessels=[0-9]+ scene=FLIGHT\\)",
  "MISSIONMARK label=rsq4-in-flight ut=(?:(?!MISSIONMARK label=rsq4-jumped )[\\s\\S])*?Rescue accept deferral listed: contractId='e8ba5ea6-570c-4b7f-99b4-44c9dee51030' \\(rebuild scene=FLIGHT\\); its stranded vessel is regenerated at the next Space Center or Tracking Station visit; pending=1",

  # ---- G split on the pad after the jump: the rewind point is authored with the list listed ----
  "MISSIONMARK label=rsq4-jumped ut=1859[0-9]{2}\\.(?:(?!MISSIONMARK label=rsq4-g-committed )[\\s\\S])*?partaction applied button=decouple pid=[0-9]+ part='radialDecoupler' partId=[0-9]+ event=Decouple newPid=[1-9][0-9]* ",
