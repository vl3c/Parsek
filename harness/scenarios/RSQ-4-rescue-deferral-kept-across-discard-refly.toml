  "regenerated stranded asset for rebuilt contract 'e8ba5ea6-570c-4b7f-99b4-44c9dee51030'[\\s\\S]*regenerated stranded asset for rebuilt contract 'e8ba5ea6-570c-4b7f-99b4-44c9dee51030'",
  # Listed once (the rewind point holds the contract Active, so it is not rebuilt again).
  "MISSIONMARK label=rsq4-jumped ut=[\\s\\S]*Rescue accept deferral listed: ",
  # The discard never lands without the rewind point's list, and never clears it (the pre-fix cell).
  "MISSIONMARK label=rsq4-discard ut=[\\s\\S]*splice kept the landed save's own RESCUE_ACCEPT_DEFERRALS: landed=0",
  "Rescue accept deferrals cleared \\(load DiscardReFly",
  # After the landed drain the list stays empty: no later load installs a pending id, no drain
  # evaluates.
  "MISSIONMARK label=rsq4-landed-visit ut=[\\s\\S]*Rescue accept deferrals installed \\(load \\w+\\): pending=[1-9]",
  "MISSIONMARK label=rsq4-landed-visit ut=[\\s\\S]*Rescue accept deferral evaluated: ",
  # The id is never dropped unevaluated, and the shell never fails.
  "Rescue accept deferral removed: contractId='e8ba5ea6-570c-4b7f-99b4-44c9dee51030' \\((?:drain Drop|rebuilt again)",
  "Rescue accept deferrals: drain [^\\r\\n]*threw",
  "Rescue accept deferrals: drain subscription failed",
  "stranded asset not regenerated for 'e8ba5ea6-570c-4b7f-99b4-44c9dee51030'",
  "RecoverAsset\\.Generate\\w+ threw for rebuilt contract 'e8ba5ea6-570c-4b7f-99b4-44c9dee51030'",
  "accept-side world effect check for 'e8ba5ea6-570c-4b7f-99b4-44c9dee51030' threw",
  "DiscardReFly: kept the session's persistent\\.sfs",
  # One rewind to launch only, onto H; the decouple authors the point; no seam refusal.
  "\\A(?:[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT ){2}",
  "Single-controllable split: no RP",
  "invokerewindtolaunch refused",
  "invokerewind refused",
  "stashslot rejected",
  "stashslot readback-failed",
  "partaction rejected",
  "partaction error ",
  "reflyrevert rejected",
  "reflyrevert error",
  "warptout refused",
  "kscaction refused",
  "savegame refused ",
  "savegame failed ",
  # A discard is not a merge.
  "End reason=merged ",
  "Added [1-9][0-9]* supersede relations",
  "Game state: ContractFailed ",
]

