  "repair=RegenerateStrandedAsset [^\\r\\n]*scene=FLIGHT\\)",
  "MISSIONMARK label=rsq4-rewound ut=(?:(?!MISSIONMARK label=rsq4-discard )[\\s\\S])*?regenerated stranded asset for rebuilt contract",
