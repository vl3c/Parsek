schema = 1
id = "H18-pipeline-smoothing"
tier = "daily"
# THE ONE MEMBER OF H7-H20 PROMOTED TO DAILY, and the reason is the failure mode, not
# the cost. All 14 are cheap (49-71 s; the group is 805 s against B13's 2,825 s alone),
# so cost does not discriminate between them. What discriminates is that this spec is
# the only guard anywhere in the suite for the GameEvents subscription contract, and a
# dropped `GameEvents.X.Add(...)` is SILENT: it compiles, every xUnit cell stays green,
# and Parsek simply stops recording docks / undocks / EVAs from that moment. A day of
# latency on that is materially worse than a day of latency on an arithmetic category
# whose regression would red the build anyway.
# The other 13 stay nightly deliberately. They have flown ONCE; the house convention
# (see the EVA rows in autotest-status.md) is to promote on flake data rather than on a
# single green, and nothing about them is urgent enough to override it. Revisit after
# roughly three nightly runs.
# BATCH-ONLY scenario, S1.4 / H6 pattern. The in-game Pipeline-Smoothing category
# has never been driven by any committed spec. Four cells: a coasting trajectory
# shows no smoothing jitter, a structural event's flag sample is aligned to the
# branch point, the child seed's flag parity matches at the branch, and - the one
# worth the launch - the GameEvents WIRING CONTRACT: onPartCouple, onPartUndock,
# onVesselsUndocking, onCrewOnEva and onPartJointBreak each carry at least one
# delegate owned by ParsekFlight or FlightRecorder.
#
# That wiring cell is reflection over EventData<T>'s internal listener list on the
# LIVE GameEvents singletons. There is no headless equivalent: a regression that
# drops one GameEvents.X.Add(...) call compiles, unit-tests green, and silently
# stops recording docks or undocks. Nothing else in the suite guards it.
#
# BUT IT ONLY GUARDS FOUR OF THE FIVE, and the fifth is a commanded-vs-observed
# assertion that FAILS OPEN. Read this before trusting the `asserted=5 of 5` pin
# below. onPartCouple / onPartUndock / onVesselsUndocking / onCrewOnEva are wired by
# PRODUCTION code (ParsekFlight.Start) and are genuinely OBSERVED by the reflection
# walk. onPartJointBreak is NOT: the test itself constructs a throwaway
# `new FlightRecorder()` and reflection-invokes SubscribePartEvents (which subscribes
# exactly onPartDie + onPartJointBreak) immediately before asserting, so that one
# binding is SEEDED BY THE TEST and then found by the test. If a refactor stops
# calling FlightRecorder.SubscribePartEvents on the recording lifecycle, joint-break
# part events silently stop being recorded, and this cell still logs
# `asserted=5 of 5` and still passes. The seeding is deliberate on the test's part
# (the hook is recorder-scoped, so an idle FLIGHT scene has no live subscription to
# observe) - it is the CLAIM that was overstated, not the test. Treat this spec as
# guarding four production bindings; closing the fifth needs a test that observes a
# recorder wired by the real lifecycle, which is a C# change and is NOT done here.
description = "Run the in-game Pipeline-Smoothing category unattended: coast-jitter suppression, structural-event flag alignment and child-seed parity, and the live GameEvents dock/undock/EVA/joint-break subscription contract."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "smoothing", "gameevents-wiring", "H18"]

[fixture]
# gloops-airshow SANDBOX pod host. No injected recordings: each cell builds its own
# trajectory / branch fixture, and the wiring cell installs and removes one
# transient FlightRecorder subscription inside a finally.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "Pipeline-Smoothing" },           expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# HONEST: the two structural-event cells assert the branch-point flag sample and
# child-seed parity that structural-event snapshotting produces (D2). SANDBOX,
# FLIGHT-scene host (D14). NOT claimed: D5 undock-split / dock-merge - the wiring
# cell proves the SUBSCRIPTION exists, not that a split is recorded correctly; and
# no D7 token - no part event is actually fired.
D2  = ["structural-event-snapshots"]
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (see H7).
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY: tally pinned WHOLE.
#
# EVIDENCE STANDING: MEASURED. Flown 2026-07-27 in the `--tag ingame-batch` sweep
# (result harness/results/2026-07-27_*_H18-pipeline-smoothing.json: PASS on attempt 1,
# 50 s wall, every verifier PASS or SKIPPED, batchComplete found=True failed=0
# perCategory=1). The pin below is a LITERAL pattern and evaluate_expectations
# requires it to match, so a PASS means the runner printed this line TOKEN FOR
# TOKEN: total, passed, failed, skipped, category and scene are all confirmed
# against a live batch, not just failed=0. The pre-flight derivation recorded
# below predicted every one of them correctly.
#  - total=4 is ATTRIBUTE-EXACT: RuntimeTests declares exactly 4
#    [InGameTest(Category = "Pipeline-Smoothing")] methods.
#  - skipped=0 is DERIVED, with ONE stated caveat. All 4 carry
#    Scene = GameScenes.FLIGHT and the batch runs at FLIGHT; none sets
#    AllowBatchExecution = false; and no cell body contains an InGameAssert.Skip.
#    The CAVEAT: the wiring cell's private helper AssertHandlerRegistered DOES call
#    InGameAssert.Skip, on exactly one branch - EventData<T>'s internal `events`
#    field missing by reflection, i.e. a KSP version renaming it. On the pinned
#    KSP 1.12.5 that branch is unreachable, so skipped=0 holds; if a KSP upgrade
#    ever renames the field this reds with skipped=1 and the log names the event,
#    which is the correct and intended signal, not a flake.
#  - failed=0 is the ASSERTION. passed=4 follows.
#  - scene=FLIGHT is INFERRED from the fixture (Focusable route) and is
#    LOAD-BEARING: at any other scene all 4 scene-skip.
#
# The wiring cell logs its own count line, pinned here so a partially-wired run
# (say 3 of 5 events resolving) reds even if the cell's own assertions are later
# loosened. "of 5" is the literal the test formats. NOTE the header caveat: one of
# those five (onPartJointBreak) is seeded by the test itself, so this line proves
# four production bindings, not five.
required  = [
  "Pipeline_Smoothing_StructuralEvent_HandlersRegistered: asserted=5 of 5 GameEvents bindings",
  "BATCH_COMPLETE v1 total=4 passed=4 failed=0 skipped=0 category=Pipeline-Smoothing scene=FLIGHT",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
