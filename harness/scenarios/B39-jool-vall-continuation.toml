rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# REPORT-ONLY. One committed tree is the save-side proof the hop joined B22's tree.
committedTrees = { min = 1, max = 1 }

[runtime]
