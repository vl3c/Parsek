maxAttitudeErrorDeg        = 30
frozenTelemetrySamples     = 10
maxCorrectionDvMps         = 200

# B38's claims, gated by the same tokens below.
[dimensionsCovered]
D1  = ["commit-in-foreign-soi"]
D14 = ["jool", "vall", "warp-rails", "scene-flight", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# DERIVED from B38, not measured: B38 read 7 recordings in the one tree (the pad
# head, Kerbin->Jool and the hop after the commit-time re-split). Re-pin from the
# first reading.
count = { min = 5, max = 9 }

[expectations.logContracts]
# Tree identity, as B38: the restore took B22's tree back, the seam found the
# recorder already live, and the Vall crossing was recorded INTO tree 6ec68e87.
# Every other Jool moon is a poison (the inward transfer crosses their shells).
required  = [
  "Recording started",
  "Recording stopped",
  "TryRestoreCommittedTreeForSpawnedActiveVessel: restored tree 'Duna Rocket'",
  "startrecording recordingId=\\w+ already=true",
  "SOI change boundary suppressed in tree mode: Jool to Vall \\(tree=6ec68e87b782476f970a71df8c8b4685,",
  "CommitTreeFlight: starting tree commit at UT=",
  "CommitTreeFlight terminal: rec=\\w+ terminalState=Orbiting terminalOrbitBody=Vall",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "startrecording recordingId=\\w+ already=false",
  "discardtree discarded=true",
  "SOI change boundary suppressed in tree mode: \\w+ to Laythe",
  "SOI change boundary suppressed in tree mode: Laythe to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Tylo",
  "SOI change boundary suppressed in tree mode: Tylo to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Bop",
  "SOI change boundary suppressed in tree mode: Bop to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Pol",
  "SOI change boundary suppressed in tree mode: Pol to \\w+",
]

[expectations.rewind]
