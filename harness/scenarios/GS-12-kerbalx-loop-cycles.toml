schema = 1
id = "GS-12-kerbalx-loop-cycles"
# =====================================================================================
# GHOST-REPLAY TIER C ITEM 12: LOOP-CYCLE RENDERING ON THE GS-4 SUBJECT.
#
# GS-4's whole flight, unchanged (staged Kerbal X, fueled-core discard, commit,
# Rewind-to-Launch, Jumping Flea on the pad, map open + closed, watch the first run),
# and THEN the kx machine's new loop-arm opt-in (`loopStages`, mlib section "THE
# LOOP-ARM OPT-IN"): a ListHandles census, then per stage `MissionConfig tree=<the
# captured tree> loop=true unit=<sec|auto> [intervalSeconds=<s>]`, one EnterWatchMode
# (recorded, never judged), and a walk of `watchSeconds` GAME seconds under 10x rails
# warp. It loops the whole MISSION, never a single recording (operator ruling
# 2026-09-24).
#
# THE THREE STAGES ARE THE THREE BEHAVIOURS OF D6 `loop-period-modes` (registry
# comment, redefined 2026-09-24), plus the cap:
#   1. sec / 150 s  - period >= the ~109 s span: ONE copy at a time
#                     (`MissionLoopUnit: ... overlaps=no`).
#   2. auto         - `LoopTimeUnit.Auto`: the overlap cadence reads the GLOBAL
#                     auto-loop interval (MissionLoopUnitBuilder step 6b), shorter than
#                     the span, so copies overlap. Unreachable by seam before this
#                     lane: MissionConfig hard-coded Sec (added `unit=` with GS-12).
#   3. sec / 5 s    - below span/20, so the MISSION-loop 20-instance cap
#                     (GhostPlayback.MaxOverlapMissionInstances,
#                     MissionLoopUnitBuilder step 6b) RAISES the cadence to span/20.
#                     The builder applies that cap before the engine sees the period,
#                     so the engine's `Loop cadence #N` line reads `requested=10.00s`
#                     (the PRIMARY playback-side witness: the engine is flying 10 s,
#                     not the 5 s asked for) with `no adjustment`; the MissionConfig
#                     reply's `overlapCadenceSeconds=10` beside `intervalSeconds=5` is
#                     the supporting witness. The PER-RECORDING cap
#                     (MaxOverlapGhostsPerRecording, whose `auto-adjusted (cap
#                     reached)` verdict this lane never prints) is NOT covered here:
#                     todo OVERLAP-CAP-PER-RECORDING-HAS-NO-LANE.
# Stages 2 and 3 run long enough past their arm UT (> the span) for the first copies
# to finish their flights: ghostlife v2's `MeshDestroyed reason=overlap expired`.
#
# WHY THE LOOP IS ARMED AFTER THE FIRST RUN. It began as a workaround: with a mission
# loop armed, a Rewind-to-Launch showed NO ghost for the whole first run (the engine
# skipped the member as `SpanClockUnresolved` before the loop anchor). FIXED 2026-09-25
# (todo LOOP-ARMED-REWIND-FIRST-RUN-NOT-RENDERED, operator ruling 2026-09-24): until its
# anchor a loop unit is left out of every scene's published set, so the first run plays
# as an ordinary ghost; `LF-2-loop-armed-rewind-first-run-real` flies that shape (loop
# armed, rewind, 1x first run drawn, then the copies). The arm-after order is kept here
# on purpose as the MIRROR shape: a loop armed after its first run is live from the
# arm UT, so its playback is unchanged by the fix, and GS-4's first run (and its
# rewind-point census) stays intact.
#
# WHAT MUST NOT RED THIS LANE (known, filed): LOOPING-CHAIN-FIRST-RUN-TIP-NEVER-SPAWNS
# (this tree has no chain), LOOP-ANCHOR-ACTIVE-VESSEL-NEVER-MARKED-LOADED (the loop is
# not anchored to the watcher), and booster debris does not loop.
#
# THE WARP IS 10x, NEVER HIGHER: past 50x the flight engine hides every overlap copy
# (WarpThresholds.GhostHide). The kx shell permits rails warp only inside the
# loop-arm phases, so GS-4's no-warp contract still holds everywhere else.
#
# NOTHING INVOKES A RE-FLY. The core-discard RewindPoint survives the rewind (#1788)
# and its Re-Fly becomes enabled once the clock passes the RP UT; supersedeRows and
# tombstones stay pinned at 0.
#
# STATUS (automation DLL sha256 2b7214fd, branch `gs12-loop`):
#   READING `2026-09-24_1911`: MISSION-OK (all 37 phases, 9/9 rows, every stage armed,
#   watched and walked at 10x), PARSEK-FAIL(expectations) on exactly ONE interim token,
#   the cap witness, which had assumed span/20 = 5.455 would come back verbatim. It
#   came back 10: the unconstrained phase lock (P = 5 s) rounds every cadence up to a
#   multiple of 5 s (span-clock 109.1 -> 110, cap 5.455 -> 10). Every loop token and
#   window below is re-cut from that run, and the blocks are armed off it.
#   The watch camera stayed on the looping ghost across both stage-1 seams and exited
#   only when the next stage's MissionConfig re-anchored the loop (report-only in v1).
#   ARMED `2026-09-24_1924`: PARSEK-FAIL on one token only, a SPAN over-pin (the
#   flown span moved 109.10 -> 109.46 s); the span-derived fields were loosened (see
#   the logContracts comment). ARMED RE-FLIGHT `2026-09-24_1934`: PASS attempt 1,
#   ghostLifecycle / saveParse / unityExceptions gating PASS (57/57 lines, 27
#   `overlap expired`, cycleLines 40, unity total 3 / parsekFrames 0).
#   NEGATIVE CONTROLS, OFFLINE (the BDOCK-1 / GS-4 precedent), over `_1911` and
#   `_1924`: the no-cap mutation `overlapCadenceSeconds=5` reds on exactly that token,
#   a mutated `destroyedReasons.required` reds on exactly that clause, and this spec
#   over GS-4's non-loop log `2026-09-23_2012` reds on every loop token plus
#   `cycleLines 0 < min 10` and the missing `overlap expired`.
# =====================================================================================
tier = "operator"
description = "Ghost-replay Tier C item 12: GS-4's Kerbal X rewind-and-watch flight, then the committed mission looped in three stages (one copy at a time, the global Auto period, and a 5 s period the 20-copy cap stretches) under 10x rails warp, read through ghostlife v2 (LoopCycle, overlap expired) and the MissionConfig loop-mode reply."
instanceProfile = "stock-minimal"
tags = ["GS12", "loop-playback", "self-overlap", "ghost-lifecycle", "rewind-to-launch", "watch-mode"]

[fixture]
# GS-4's fixture, reused as-is (see GS-4's [fixture] comment for the Flea edit).
saveTemplate       = "fixtures/saves/gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "kx_rewind_watch"

# GS-4's six seam steps, verbatim (see GS-4 for why each is load-bearing).
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },      expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" },   expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoMerge", value = "true" },            expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },       expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" },   expect = "OK" },
  { phase = "mission",                                                            expect = "MISSION-OK", budget = 2000 },
  { cmd = "FlushAndQuit",                                                         expect = "OK" },
]

[driver.missionParams]
craftName        = "Kerbal X"
launchSite       = "LaunchPad"
watcherCraftName = "Jumping Flea"
# Game seconds per stage: stage 1 covers two seams at a 150 s period; stages 2 and 3
# run 200 s, past the ~109 s span, so copies launched at the arm UT finish.
loopStages = [
  { unit = "sec",  intervalSeconds = 150, watchSeconds = 330 },
  { unit = "auto",                        watchSeconds = 200 },
  { unit = "sec",  intervalSeconds = 5,   watchSeconds = 200 },
]
loopWarpIndex = 2

[dimensionsCovered]
# CLAIM-IS-NOT-GATE: every value is backed by a REQUIRED token below, each re-cut from
# the reading run `2026-09-24_1911`.
# `auto-record-launch` <- "Auto-record started (...", GS-4's trigger line.
D1 = ["auto-record-launch"]
# `basic-playback` / `mesh-lifecycle-derender` <- the first run's MeshSpawned /
#   MeshDestroyed tokens (GS-4's populations) and the armed ghostLifecycle balance.
# `loop-period-modes`, ALL THREE MODES of the 2026-09-24 definition:
#   (1) one copy at a time  <- "MissionLoopUnit: ... unit=Sec cadence=150
#       overlapCadence=150 overlaps=no" (period 150 >= the 109.1 s span);
#   (2) overlapping copies  <- "unit=Sec cadence=<span up to P> overlapCadence=10 overlaps=yes"
#       and the engine's `Loop cadence ... (cycles=11)`;
#   (3) the global Auto period <- the MissionConfig reply `unit=auto
#       overlapCadenceSeconds=X autoLoopIntervalSeconds=X` (the SAME number, by
#       backreference: Auto's overlap cadence IS the global interval) and
#       "unit=Auto ... overlapCadence=30 overlaps=yes".
# `self-overlap` <- mode (2)'s tokens (the whole mission relaunching over itself).
# `overlap-expiry-soft-caps`, SCOPED TO THE MISSION-LOOP CAP
#   (MaxOverlapMissionInstances; the per-recording cap MaxOverlapGhostsPerRecording has
#   no lane, todo OVERLAP-CAP-PER-RECORDING-HAS-NO-LANE) <- BOTH halves: `MeshDestroyed
#   ... vessel=Kerbal X reason=overlap expired` (copies vanish when their own flight
#   ends) and the cap. PRIMARY witness, playback side: the engine's `Loop cadence #N
#   "Kerbal X": requested=10.00s ... (cycles=1[01])` - the period the engine is flying,
#   against the 5 s the stage asked for. SUPPORTING: the MissionConfig reply
#   `intervalSeconds=5 ... overlapCadenceSeconds=10`. The attribution is exact: the phase
#   lock (`PhaseLock APPLIED ... P=5 method=unconstrained`, required below) only
#   quantizes to multiples of 5 s, and 5 already is one, so the raise is the cap
#   (span / 20 = 5.455-5.473 s) rounded up to the next P. The engine line reads
#   `no adjustment` because the builder applied the cap first (see the header).
D6 = ["basic-playback", "mesh-lifecycle-derender", "loop-period-modes", "self-overlap",
      "overlap-expiry-soft-caps"]
# `whole-mission-loop` (claimed 2026-09-25, coverage wave 1b) <- the WHOLE mission loops
#   as one unit, never one recording: `SetLoopEnabled: loop ON for 'Kerbal X' (tree=...)`
#   (MissionStore.SetLoopEnabled, the same store call the Missions tab's Loop toggle makes
#   at MissionsWindowUI.cs:3012; the seam's MissionConfig reaches it through the tree's
#   ORIGINAL mission), the unit lines' `members=2` above (the pod stack and the probe core
#   share one span clock), and the playback-side witness `Watch UT resolved via Mission
#   span clock: rec #0` (WatchModeController: a unit member carries no per-recording loop
#   flag, so the watched ghost's UT comes off the mission's shared span clock). All three
#   read on every archived run (`_1911`, `_1924`, `_1934`).
#   NOT claimed here: D11 `default-mission`. This lane's only default-mission creation is
#   the seam's own seeding (`missionconfig seeded 1 default mission(s)`, required above):
#   the tree is committed in flight and no production path (OnLoad, the Missions tab
#   draw) runs before MissionConfig. V15T owns that cell off the OnLoad path.
# ARMED RE-FLIGHT `2026-09-25_1951` PASS attempt 1 (automation DLL `f506f059...`, origin/main `7c90492bd`);
# negative control offline (hlib.evaluate_expectations over that log, loop OFF / a non-span-clock watch each red exactly one new token).
D11 = ["whole-mission-loop"]
# `rewind-to-launch` <- "Rewind-to-Launch initiated to UT" + the seam terminal.
D9 = ["rewind-to-launch"]
# `scene-ksc` <- "invokerewindtolaunch complete" (emitted only back in SPACECENTER).
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 8, max = 8 }

[expectations.logContracts]
# GS-4's first-run tokens, then the loop half. Every loop token was measured on the
# reading run `2026-09-24_1911`:
#   "missionconfig applied: ..."   ParsekTestCommandAddon.MissionConfig.cs (Info), one
#       per stage; `loop=` / `unitBuilt=` are C# bools.
#   "MissionLoopUnit: ..."         MissionLoopUnitBuilder (VERBOSE; verboseLogging is
#       on). NOTE: the seam's own MissionConfig builds the unit too, so a
#       `MissionLoopUnit:` line may come from that run rather than the flight engine's;
#       the engine-side witness is the `Loop cadence` line. Measured: span=[30.36,
#       139.46] spanDur=109.1, members=2 (the pod stack and the
#       probe core; booster debris is not a member).
#   "PhaseLock APPLIED ... P=5 method=unconstrained" - the unconstrained phase lock
#       snaps the anchor and every cadence to a multiple of 5 s (span-clock cadence
#       109.1 -> 110), which is why the numbers read 110 / 30 / 10.
#   "Loop cadence #N ..."          GhostPlaybackEngine (Info), one per cadence change.
#   THE SPAN IS NOT A PIN: it is the flown recording's length and moved between flights
#   (109.10 s on `_1911`, 109.46 s on `_1924`), so every token that would restate it -
#   the span-clock cadence (the span rounded up to P), the engine's `duration=` and
#   `cycles=` - is a character class. The numbers that ARE pinned hold for any span in
#   (100, 150): 150 (stage 1's own period), 30 (the global Auto interval, a multiple of
#   P) and 10 (span/20 rounded up to P).
#   "reason=overlap expired"       ghostlife v2 (tracing-gated).
required  = ["Auto-record started \\((?:PRELAUNCH|LANDED|first staging on pad)",
             "Committed tree '.+' \\([1-9][0-9]* recordings\\)",
             "Rewind-to-Launch initiated to UT",
             "RewindPoints carried across rewind: installed=1 ",
             "invokerewindtolaunch complete rec=",
             "enterwatchmode complete: index=",
             "phase=MeshSpawned [^\\r\\n]*vessel=Kerbal X reason=ghost-created",
             "phase=MeshSpawned [^\\r\\n]*vessel=Kerbal X Probe reason=ghost-created",
             "phase=MeshSpawned [^\\r\\n]*vessel=Kerbal X Debris",
             "phase=MeshDestroyed [^\\r\\n]*vessel=Kerbal X Debris",
             "missionconfig seeded 1 default mission\\(s\\) before resolving tree=",
             "missionconfig applied: [^\\r\\n]*loop=True intervalSeconds=150 [^\\r\\n]*unitBuilt=True [^\\r\\n]*unit=sec overlapCadenceSeconds=150 ",
             "MissionLoopUnit: [^\\r\\n]*members=2 [^\\r\\n]*unit=Sec cadence=150 overlapCadence=150 overlaps=no",
             "missionconfig applied: [^\\r\\n]*loop=True [^\\r\\n]*unitBuilt=True [^\\r\\n]*unit=auto overlapCadenceSeconds=([0-9]+(?:\\.[0-9]+)?) autoLoopIntervalSeconds=\\1\\b",
             "MissionLoopUnit: [^\\r\\n]*members=2 [^\\r\\n]*unit=Auto cadence=[0-9]+ overlapCadence=30 overlaps=yes",
             "missionconfig applied: [^\\r\\n]*loop=True intervalSeconds=5 [^\\r\\n]*unitBuilt=True [^\\r\\n]*unit=sec overlapCadenceSeconds=10 ",
             "PhaseLock APPLIED: [^\\r\\n]*P=5 method=unconstrained",
             "MissionLoopUnit: [^\\r\\n]*members=2 [^\\r\\n]*unit=Sec cadence=[0-9]+ overlapCadence=10 overlaps=yes",
             "Loop cadence #[0-9]+ \"Kerbal X\": requested=10\\.00s duration=[0-9.]+s cap=20 effective=10\\.00s \\(cycles=1[01]\\) no adjustment",
             "phase=MeshDestroyed [^\\r\\n]*vessel=Kerbal X reason=overlap expired",
             "SetLoopEnabled: loop ON for 'Kerbal X' \\(tree=[0-9a-f]{32}\\); anchorUT=",
             "Watch UT resolved via Mission span clock: rec #0 rawUT=[0-9.]+ loopUT="]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

# ARMED off the reading run `2026-09-24_1911` (spawned 8, spawnLines 57 = destroyLines
# 57, unbalanced 0; destroyedReasons included `overlap expired` x27 - 14 Kerbal X, 13
# Kerbal X Probe - and `engine teardown` x13 for copies alive at quit; cycleLines 40,
# every one `mode=overlap-demote`; perVessel Kerbal X Debris spawned 6). The line
# counts ride warp sampling, so they are floors, not pins; the per-recording balance
# ledger is the leak check.
[expectations.ghostLifecycle]
gating = true
spawned = { min = 8 }
cycleLines = { min = 10 }
requireBalanced = true
destroyedReasons = { required = ["overlap expired"] }
vessels = { "Kerbal X Debris" = { spawned = { min = 6 } } }

# ARMED (read 1 / 0 / 0 on `_1911`): the one core-discard RP survives the rewind and
# no Re-Fly machinery runs, although the loop walks the clock past the RP UT.
[expectations.rewind]
gating        = true
rewindPoints  = { min = 1, max = 1 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# ARMED. EXACTLY ONE REAL VESSEL after the rewind (operator ruling), measured: the
# Jumping Flea. Both Kerbal X terminals are SubOrbital, which the spawn gate refuses
# (`Spawn suppressed: ... terminal state SubOrbital`), so nothing materializes at the
# first run's end, and neither loop risk the scoping named can arise here: no real
# same-pid vessel exists to trigger the external-vessel skip
# (`externalVesselSuppressed=0` on every engine frame line) and no suborbital pod is
# ever put on rails to be deleted.
[expectations.recordings.structure]
gating         = true
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 8, max = 8 }
spawnedVessels = { max = 0 }
branchPoints   = { JointBreak = { min = 4 } }
terminalStates = { SubOrbital = { min = 2, max = 2 }, Destroyed = { min = 4 } }
vesselNames    = { "Jumping Flea" = { min = 1, max = 1 }, "Kerbal X" = { max = 0 }, "Kerbal X Probe" = { max = 0 } }

# GS-4's ceilings (the same subject and teardown; `_1911` read total 0, parsekFrames 0).
[expectations.unityExceptions]
maxTotal = 6
maxParsekFrames = 0

[runtime]
# GS-4's 2400 plus the loop block (the reading run's whole wall was ~450 s).
budgetSeconds = 2800

[retry]
policy = "once"

[expectedFail]
bugId = ""
