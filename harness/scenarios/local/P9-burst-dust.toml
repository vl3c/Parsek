schema = 1
id = "P9-burst-dust"
tier = "operator"
# Throwaway (gitignored): the X4 burst wave's decouple family (every stock decoupler's `decouple`
# case plus the `joint-break` cases on fuelTank / trussPiece1x), photographed real vs ghost at
# 1600 m over the KSC band from the b1-pad-craft pad host. Fly once on main, once on p9-y4.
description = "P9 Y2/Y3/Y4/Y7 before/after pictures: every burst case in air, then dust on the ground, stock-minimal, report-only."
instanceProfile = "stock-minimal"
tags = ["part-parity", "ghost-visual", "local"]

[fixture]
saveTemplate = "fixtures/saves/b1-pad-craft"
injectedRecordings = "none"
craft = []

