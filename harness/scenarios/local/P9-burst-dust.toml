  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnEva", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnFirstModificationAfterSwitch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "PartParitySweep", args = { label = "pb", op = "reset", contexts = "air", fx = "explode,vessel-explode,burst-custom,decouple" }, expect = "OK", budget = 120 },
  { cmd = "PartParitySweep", args = { label = "pb", op = "run", contexts = "air", fx = "explode,vessel-explode,burst-custom,decouple", controls = "false", maxSeconds = "480" }, expect = "OK", budget = 540 },
