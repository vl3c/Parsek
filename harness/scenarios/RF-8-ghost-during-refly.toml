schema = 1
id = "RF-8-ghost-during-refly"
# =====================================================================================
# THE RE-FLY CONTINUATION PROGRAM, LANE 8. WHAT THE PLAYER SEES WHILE RE-FLYING.
#
# A re-fly puts the player back in the cockpit at the separation, with the committed
# SIBLING - the half that already flew - alongside them as a ghost. Two things must be true
# for that to be watchable, and NO LANE ASSERTS EITHER during a live re-fly session:
#
#   1. THE SIBLING'S GHOST RENDERS. It is a committed recording, the re-fly is live, and
#      the whole point of Rewind-to-Separation is to fly against what happened.
#   2. THE LIVE VESSEL DOES NOT GHOST ITSELF. The recording being re-flown is superseded
#      by the attempt in progress; spawning a ghost of the vessel the player is flying is
#      the paradox `GhostSuppressionDuringReFly` exists to prevent - and that in-game cell
#      is one of the TWELVE that have never executed (RF-6's header).
#
# NO REWIND LANE ARMS A RENDER TRACER TODAY. `ghostRenderTracing` is armed only by
# GS-4/6/7/8, all of which are rewind-to-LAUNCH lanes with no session; `mapRenderTracing`
# by no rewind lane at all; `EnterWatchMode` and `EnterMapView` by no rewind lane at all.
# So the entire visual half of the headline feature is unobserved. This lane is the first
# look, and it is deliberately a LOOK: `[expectations.ghostLifecycle]` is declared
# REPORT-ONLY, because a lifecycle window authored before anything measured one is a
# description of a guess.
#
# =====================================================================================
# THE ORDER IS THE EXPERIMENT.
#
#   InvokeRewind          arms the session and puts the scene at the separation.
#   TimeJump              flies the attempt far enough that the sibling ghost has a reason
#                         to be positioned somewhere - a re-fly frozen at t=0 would show a
#                         ghost coincident with the live vessel and prove nothing about
#                         either half. CI-2 measured `TimeJump` accepted under a live
#                         session; 500 is ~117 s past rp0's UT 382.73.
#   EnterWatchMode        the camera follows the SIBLING's ghost. `index` and `tree` are
#                         both optional and both deliberately omitted: the verb picks a
#                         watchable ghost itself and REJECTs `no-watchable-ghost` with a
#                         `candidates=` diagnostic when there is none - which is a far more
#                         useful failure than a wrong index, because it prints what WAS
#                         available.
#   EnterMapView          the second surface, where the sibling's committed trajectory and
#                         the live re-fly must both be legible.
#
# THE PARADOX HALF IS ASSERTED AS AN ABSENCE, and it has to be: a ghost that was correctly
# NOT spawned emits nothing. What CAN be pinned is the suppression's own token when it
# fires and the anomaly tokens if the render goes wrong, so the forbidden list carries the
# two Tier-C tracer anomalies and the ERROR surface, and the required list carries the
# positive half (a ghost was created, watch mode entered, the map drew something).
#
# =====================================================================================
# RE-TARGETED 2026-09-09, FROM rp0 TO rp1, AND THE RE-TARGET IS THE ANSWER TO THIS LANE'S
# OWN FINDING. Read this before moving the rewind point back.
#
# Reading run 1 (`2026-09-08_2323`) refused at `EnterWatchMode`:
#   `enterwatchmode rejected reason=no-watchable-ghost committed=22 tree=(any)
#    candidates=[0 ghost=F body=F range=F],...,[9 ghost=T body=T range=F],...`
# and was filed as RF8-NO-WATCHABLE-GHOST-DURING-A-REFLY-ON-BDOCK with the cause named but
# the subject unreached: of 22 committed recordings exactly one had a live ghost and it
# failed the RANGE term.
#
# THE COLLECTED LOG SETTLES IT, and the answer is that the lane was jumping past its own
# sibling. Four lines above the refusal the same log prints the committed census with each
# recording's UT span (`logs/2026-09-09_0224_RF-8-ghost-during-refly/KSP.log:13087-13108`):
#
#   #0  "Kerbal X"        UT   26-196   chain idx=0     #8  "Kerbal X Probe"  UT  382-387
#   #1  "Kerbal X"        UT  196-387   chain idx=1     #9  "Kerbal X"        UT  391-568
#   #17 "Kerbal X Probe"  UT  693-8952                  #10 "Kerbal X"        UT  568-8949
#
# `rp0` sits at UT 382.73 and its SIBLING is slot 0's `a32f62f5` - the Kerbal X whose chain
# (#0 + #1) ENDS AT UT 387. The lane then jumped to UT 500, which is 113 s past the last
# frame that recording has. There was no sibling ghost to watch because the sibling's
# recording was over; index 9 is a DIFFERENT launch's chain and is genuinely far away, so
# `range=F` is the gate answering correctly about the wrong object. Nothing was wrong with
# the watch gate, the tracers, or the session.
#
# `rp1` HAS THE SPAN THIS LANE NEEDED ALL ALONG. It sits at UT 693.29; its slot 1 is the
# Probe `500c0ba9` (#17, UT 693-8952, the OPEN slot) and its slot 0 is `5157d655`, whose
# chain is #9 + #10 and runs to UT 8949. So at UT 800 - 107 s after the separation, the
# same margin RF-2 uses on rp0 - the re-flown Probe and the committed sibling's ghost are
# both live, both on Kerbin, and 107 s of post-separation drift apart, which is three
# orders of magnitude inside `WatchModeController.WatchEnterCutoffMeters` (300 km).
#
# READING RUN 2 (2026-09-09) CONFIRMED THE RE-TARGET AND COST TWO SPEC-SIDE RE-PINS.
# `EnterWatchMode` was ACCEPTED - `enterwatchmode initiated: index=10
# recId=3e0207a4... auto=true`, and index 10 is the sibling chain (`Kerbal X`,
# UT 568-8949) the header above predicts - `EnterMapView` opened, a ghost was created
# (`Created ghost vessel 'Ghost: Kerbal X' ... orbitSource=endpoint-terminal-orbit`), and
# every driver step met. So the subject is REACHED and the finding is closed.
#
# The two re-pins are both the same class and both came off the run's own log rather than
# a re-derivation: the watch-completion token was written against the verb's PAYLOAD keys
# instead of its log line, and the polyline token was `drawn=[1-9]` - the exact token
# RF-7M's run 1 had already refuted, because it counts REDRAWS and reads `drawn=0
# staticSkip=13` on a static scene. This lane inherited the mistake without inheriting the
# correction, which is worth one line: a token copied between lanes carries its own
# history, and RF-7M's was already written down.
#
# THE FINDING IS THEREFORE A LANE FINDING AND IS CLOSED BY THIS EDIT, not by a product
# change. It is also the program-wide-claim rule in miniature for a second time in this
# family: "a ghost resolves during a re-fly" needed a data point about the SIBLING's own
# coverage window, and the first run took one about whatever happened to be spawned.
# FORMERLY: NEVER FLOWN. `tier = "operator"`. NOTHING ARMED - `ghostLifecycle` is declared
# with no `gating` key precisely so the first run MEASURES a lifecycle rather than being
# judged against one. GS-4's own header records that a lifecycle block is armed only after
# a reading run whose facets match the declared windows; this lane has no facets yet.
# =====================================================================================
tier = "operator"
description = "Reading run: what renders DURING a live re-fly. Rewind the open slot of the MIDDLE bdock-recorded RewindPoint - the one whose committed sibling still has trajectory coverage when the attempt is flown - fly the attempt with a TimeJump, then enter watch mode on the committed sibling's ghost and open the map - the first lane to arm either render tracer with a re-fly session live, with ghostLifecycle declared report-only."
instanceProfile = "stock-minimal"
tags = ["RF-8", "rewind", "refly", "ghost", "watch-mode", "map", "render-tracing",
        "runtime-handles", "kerbin", "sandbox", "reading-run"]

[fixture]
# bdock-recorded: 19 committed recordings, so the flight scene has plenty for the ghost
# engine to hold slots for while the session is open, and three RewindPoints whose ids the
# run reads at runtime. S4.3 chose its host for the same property (a POPULATED scene) and
# had to inject one; this harvest carries it.
saveTemplate       = "fixtures/saves/bdock-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "StopRecording",                                                        expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "rewindpoints" }, label = "handles",  expect = "OK" },
  # rp1, NOT rp0. `ListHandles` walks `ParsekScenario.RewindPoints` in APPEND order, so
  # `rp1` is the middle of the harvest's three points - UT 693.29, the one whose SIBLING
  # chain (#9 + #10, UT 391-8949) still has coverage when the attempt is flown. See the
  # RE-TARGETED block at the top: rp0's sibling recording ends at UT 387 and there is
  # nothing there to watch.
  { cmd = "InvokeRewind",   args = { rp = "${handles.rp1}", slot = "1" },         expect = "OK", budget = 300 },
  # 800 is ~107 s past rp1's UT 693.29 - RF-2's own margin on rp0 - and far short of the
  # tree's Dock branch point at 8949.27, so this lane does not drag CI-2's chain-tip spawn
  # into its own measurement. Two vessels 107 s past a separation are hundreds of metres
  # apart, not hundreds of kilometres.
  { cmd = "TimeJump",       args = { ut = "800" },                                expect = "OK", budget = 120 },
  # Pacing before each visual step: `IsLineBlink` raises if two seam events land within
  # eight visual frames, which would make the Tier-C reading noise rather than truth.
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "EnterWatchMode",                                                       expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "EnterMapView",                                                         expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "RecordingState",                                                       expect = "OK" },
  { cmd = "ExitMapView",                                                          expect = "OK" },
  # The session is concluded rather than abandoned, so the run leaves a save a later lane
  # can read and the merge tail is exercised once more on this host.
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },                       expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                         expect = "OK" },
]

[dimensionsCovered]
# BASICS ONLY, and `scene-map` IS among them - the earlier wording said it was "NOT
# claimed in advance" while the row below claimed it, which the review panel caught. The
# four D14 values are host / scene properties that hold the moment the boot lands and the
# map opens, and `EnterMapView` is a driven step with `expect = "OK"`. What is NOT claimed
# in advance, and is what the reading run earns: D6 `ghost-map-presence` and
# `mesh-lifecycle-derender` off the ghost tokens. Taking those moves
# `hlib.compute_coverage` and belongs to a deliberate pass.
D14 = ["kerbin", "sandbox", "scene-flight", "scene-map"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 2, max = 30 }

[expectations.logContracts]
# THE POSITIVE HALF: a ghost exists, the camera took it, and the map drew something. Each
# is a different subsystem, so a run that satisfied only one has told us where it broke.
#
# `enterwatchmode complete ... watching=true` is the verb's own OK line; the `recId=` field
# names WHICH ghost the camera took, which is what the reading run records for the
# lifecycle window a later arming would use.
required = [
  "listhandles kind=rewindpoints count=3 truncated=false",
  "Re-Fly \\(Rewind-to-Separation\\) StartInvoke: sess=.* rp=rp_[0-9a-f]{32}",
  "Invocation complete",
  "timejump complete reachedUT=80[0-9]",
  "Created ghost vessel ",
  # RE-PINNED FROM READING RUN 2's OWN LOG (2026-09-09). The token was
  # `enterwatchmode complete .*watching=true`, derived from the verb's PAYLOAD key set
  # (`index`, `recId`, `watching`) rather than from a log line. The Info line carries
  # only two of those: `enterwatchmode complete: index=10 recId=3e0207a4...`. Pinning
  # `index=` and `recId=` keeps everything the line can actually say, and the step's own
  # `expect = "OK"` already carries the payload half.
  "enterwatchmode complete: index=[0-9]+ recId=\\S+",
  # RE-PINNED FOR RF-7M's REASON, which this lane inherited without inheriting the
  # correction. `Polyline frame: ... drawn=N` counts REDRAWS, and a static scene reads
  # `drawn=0 ... staticSkip=13` because every leg is cached - RF-7M's run 1 measured the
  # identical shape and replaced the token with the LEG CENSUS, which is a statement
  # about what was BUILT rather than about what was re-uploaded this frame. The sibling's
  # own census on this run is `Polyline legs: rec=3e0207a4... count=3`.
  "Polyline legs: rec=\\S+ count=[1-9]",
  "answermergedialog choice=merge result=committed",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The verb's own refusal, which carries a `candidates=` diagnostic. Forbidden rather
  # than merely unrequired because "no watchable ghost during a re-fly" is a FINDING, not
  # a driver accident - it would mean the sibling the player is supposed to fly against
  # was not renderable at all.
  "no-watchable-ghost",
  # `icon-jump` and `line-blink` were forbidden here as "the two Tier-C anomalies". BOTH
  # clauses are removed (2026-09-09, review panel) and neither removal loses coverage.
  # `icon-jump` is in `hlib.ANOMALY_TOKENS_DEAD` - "gated once, raised by nothing, REMOVED
  # from ANOMALY_TOKENS (2026-07-29)" - so the clause could never fail; the live tokens are
  # `icon-teleport` / `icon-off-orbit`. And a bare substring is the wrong instrument for
  # either: `_anomaly_reasons` says so by name ("an anomaly RAISE is identified by the
  # phase marker plus the reason field - never by the bare token appearing somewhere in
  # KSP.log"), and `allowedAnomalies = []` above already arms the phase-anchored sweep over
  # every LIVE token, which read `hits=[] counts={}` on the green run. The sweep is the
  # assertion; these two were a decorative copy of part of it, one of them inert.
  # The seed session's closure token, carried across the RF family as a standing guard.
  "reason=sealedTipClosed",
]

# REPORT-ONLY BY OMISSION OF `gating`, and that is the point of the lane rather than a
# concession. Every window below is a WIDE first-look bound whose only job is to make the
# reading run's measured facets land somewhere legible; none is a claim. GS-4's header
# states the arming discipline this follows: a lifecycle block is armed only after a
# reading run whose facets match, and this lane has no facets yet.
[expectations.ghostLifecycle]

[runtime]
# LoadGame 660 + SetSetting x4 480 + StopRecording 120 + ListHandles 120 +
# InvokeRewind 660 + TimeJump 660 + RecordingState x15 1800 + EnterWatchMode 120 +
# EnterMapView 120 + ExitMapView 120 + AnswerMergeDialog 180 + FlushAndQuit 120 = 5160.
# 5600 clears it by 440. (`EnterWatchMode` / `EnterMapView` are NOT in
# `DEFERRED_SEAM_VERBS`, so they ride the 60 s dispatch default -> 120, not the 180 the
# first cut priced them at; corrected by the review panel. The ceiling is unchanged
# because it only ever has to EXCEED the sum.)
budgetSeconds = 5600

[retry]
policy = "once"

[expectedFail]
bugId = ""
