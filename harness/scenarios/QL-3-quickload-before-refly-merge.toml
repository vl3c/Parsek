schema = 1
id = "QL-3-quickload-before-refly-merge"
# RESHAPED 2026-10-20 FOR "LOAD RESTORES THE SAVE" PHASE 2 (design
# docs/dev/design-load-restores-the-save.md 4.1 / 4.7 / 5 S4 / 8; plan Phase 2 step 7). NOT
# FLOWN in this shape. THE EXPECTED OUTCOME FLIPS. The load of `ql3-before-refly` now
# carries `playerLoad=true`, so it is a Cold save-file load: the session reset forgets
# memory and every list comes from the named save, which was written before the Re-Fly.
# A Re-Fly merged after the save is simply not in the save (design 5 S4, 8: the OQ-3 owner
# partition, step B and the in-session handoff install are unreachable on a save-file load):
#   - no supersede row and no tombstone after the load: every ERS rebuild after the save's
#     ledger read skips nothing as superseded, and the ELS rebuild has no tombstone;
#   - the original crashed pod is visible again (the Space Center ghost breakdown no longer
#     leaves the Destroyed pod out) and its crew death counts again (the walk keeps a
#     permanent, death-derived reservation, as the save had it);
#   - `rp_cl_root` is back: the save lists it, the merge's reaper only unlisted it and its
#     file stays while a save names it (design 4.5), so the report-only `rewindPoints`
#     window is 1.
# The pre-load half (the Re-Fly, the merge's supersede row and tombstone) is unchanged and
# still required. The token list below is authoritative; the SPEC CHANGED note and the
# THE MECHANISM UNDER TEST text after it describe the in-session route this lane flew before
# Phase 2, kept as history.
# SPEC CHANGED 2026-10-07 (branch `ql-lanes`), NOT RE-FLOWN. Two changes:
#   1. THE FIXTURE IS PRODUCTION-SHAPED (todo REWIND-CREW-LOSS-FIXTURE-RP-HAS-NO-BRANCH-POINT,
#      FIXED): the `rewind-crew-loss` tree now carries the split branch point `bp_cl_root`
#      (JointBreak, root -> probe + pod, `rewindPointId = rp_cl_root`) and the point is
#      persistent (SessionProvisional false, as `RecordingStore.PromoteNormalStagingRewindPoints`
#      leaves a committed tree's staging point). Step B of the QL-3 load therefore claims the
#      point for the committed tree and drops the save's copy: required
#      `rp_cl_root:CommittedOwner:dropped-save-only`, forbidden `rp_cl_root:FollowSave:`, and
#      the report-only `rewindPoints` window is back at the production prediction `max = 0`.
#   2. THE OBSERVABLE HALVES of the manual check ("the replaced flight does not reappear, and
#      a crew death the re-fly undid stays undone"), all after the QL-3 load:
#      - not visible: an ERS rebuild skips the superseded pod
#        (`[ERS] Rebuilt: ... skippedSuperseded=[1-9]`, EffectiveState.ComputeERS) and the
#        Space Center's ghost eligibility leaves exactly the Destroyed pod out
#        (`[KSCGhost] Eligible breakdown: ... ineligible(Destroyed=1)`, ParsekKSC.Start: a
#        Destroyed recording is structurally eligible, so only the supersede row hides it);
#      - still undone: the ELS rebuild skips every tombstoned action
#        (`[ELS] Rebuilt: ... (skippedTombstoned=N tombstonesTotal=N)`, the death row and its
#        KerbalDeath reputation penalty) and the crew walk keeps no permanent (death-derived)
#        reservation (`Recomputed ...: N reservations remain (permanent=0 `, forbidden
#        `permanent=[1-9]` on that line and on the KerbalsModule PostWalk summary).
#   Offline against `2026-10-07_1920`: every new token reads as predicted except the two
#   rewind-point tokens, which name the old fixture (`rp_cl_root:FollowSave:kept-loaded` on
#   that run); seeded mutations (permanent=1, skippedTombstoned=0, skippedSuperseded=0,
#   ineligible((none))) each red. Pre-registered red readings: `rp_cl_root:FollowSave` = the
#   injector ran a stale test build (the fixture is built from Source/Parsek.Tests);
#   `ineligible((none))` or `skippedSuperseded=0` on every rebuild after the load = the
#   supersede row did not survive the load (TA-1 regression); `permanent=1` or
#   `skippedTombstoned=0` = the death counts again (TA-1 regression).
# =====================================================================================
# QL-3: A QUICKLOAD TO A SAVE FROM BEFORE A RE-FLY MERGE KEEPS THE MERGE. The live proof of
# todo QUICKLOAD-REFLY-LISTS-REVERT-WHILE-RECORDINGS-STAY (roadmap "The timeline-operation
# coverage program", Phase A row TA-1, Lanes table row QL-3).
#
# In gameplay terms: the player saves the game, re-flies an Unfinished Flight (a crewed pod
# that crashed) so the pod survives, merges, and then loads that save from before the Re-Fly.
# The recordings and the career ledger stay as the session has them (the re-fly committed),
# so the Re-Fly bookkeeping must too: the original flight stays replaced (its supersede row)
# and the crew death the re-fly undid stays retired (its tombstone). Before the fix the load
# rebuilt both from the save, which has neither: the original crashed pod played back next to
# its re-fly and the death counted again.
#
# WHY A NAMED SAVE AND NOT `quicksave`: every merge-dialog merge overwrites quicksave.sfs with
# the post-merge game (`MergeDialog.MergeCommit` -> `RecordingStore.RefreshQuicksaveAfterMerge`,
# `refreshQuicksaveAfterCommit` defaults true), so after `AnswerMergeDialog merge` the slot
# named `quicksave` already holds the merge's rows and could not tell a fixed build from a
# pre-fix one. The lane saves to `ql3-before-refly`, which nothing but this lane writes (the
# named-slot pattern of EVA-9 and EVA-10); that is the player's "load a save from before the
# Re-Fly" from the Load menu.
#
# THE MECHANISM UNDER TEST (ParsekScenario.OnDestroy -> InSessionStagedStateHandoff ->
# ParsekScenario.ApplyInSessionStagedStateHandoffStepA / ApplyInSessionStagedStateHandoffStepB).
#   1. The scene change the load makes destroys the scenario instance; OnDestroy captures its
#      rewind points, supersede rows, retirements, tombstones, journal and marker
#      (`Staged-list handoff captured reason=OnDestroy`).
#   2. The Space Center's OnLoad (an in-session load: InSessionOther) installs memory's rows
#      and tombstones over the save's: `In-session staged lists from memory: ...
#      supersedes installed=1 loadedFromSave=0 restored=1 ... tombstones installed=N
#      loadedFromSave=0 restored=N` - loadedFromSave=0 is the named save's own count, which is
#      what makes the token specific to THIS load (the merge's own exit load reads rows the
#      merge's durable save already wrote).
#   3. Step B partitions the rewind points: the merge reaped `rp_cl_root` (CL-3's measured
#      rewindPoints 0) and the save still has it. A production rewind point is claimed by its
#      committed tree through the tree's branch point and is NOT resurrected
#      (`rp_cl_root:CommittedOwner:dropped-save-only`; the fixture carries the branch point
#      since 2026-10-07, see the reading below for the run before). The save holds the re-flown tree as committed
#      history (the fixture's) and no active tree, so no tree is detached and resumed: the
#      resumed-tree row rule finds nothing to hand back to the save (`no tree detached`).
#
# THE HOST: CL-3 verbatim (career-pad-craft + the injected `rewind-crew-loss` corpus, the
# cl3 mission's re-fly of the crewed pod, `AnswerMergeDialog merge`), the only lane whose
# merge writes a supersede row AND a tombstone with existing verbs (S4.2, the host the
# roadmap row first named, merges an unflown provisional and writes no row at all). Plus
# two steps: `SaveGame ql3-before-refly` right after the fixture load (before anything
# records, so the save holds no active tree), and after the merge `LoadGame ql3-before-refly
# scene=spacecenter` (the verb's requested Space Center route: it writes the loaded game to
# persistent.sfs and boots the Space Center, which reloads it, as stock does for a load that
# starts outside flight).
#
# BEFORE-FIX CONVENTION: PLAIN (lands with the fix). On a pre-fix DLL the prediction is
# PARSEK-FAIL(expectation): the handoff tokens are missing (`handoff=present` on the
# classification line, the `In-session staged lists from memory` line), and the report-only
# rewind block reads supersedeRows 0, tombstones 0, rewindPoints 1.
#
# READING-RUN NOTES:
#   - A `TryRestoreActiveTreeNode` line restoring a tree from `ql3-before-refly` means a
#     recorder was live at the SaveGame (premise miss: the save then carries an active tree
#     the Space Center load stashes and auto-commits); move the SaveGame earlier.
#   - `loadedFromSave=1` on the in-session line of the QL-3 load means the named save already
#     had a row (premise miss: the fixture or an earlier step wrote one, or something wrote
#     the slot after the merge).
#   - The rewind block is REPORT-ONLY; predicted supersedeRows 1, tombstones 2 (CL-3's
#     2026-09-29 reading), rewindPoints 0. Arm it after a reading run whose facets match.
#   - READING RUN 2026-10-07 `2026-10-07_1920` (branch `f9-verify`, automation DLL sha256
#     prefix bd97e6a7): PASS attempt 1. The QL-3 load read `supersedes installed=1
#     loadedFromSave=0 restored=1` and `tombstones installed=2 loadedFromSave=0 restored=2`;
#     the merge's own exit load read loadedFromSave=1 / 2 (its durable save), as predicted.
#     Report-only facets: supersedeRows 1 and tombstones 2 as predicted, rewindPoints 1, not
#     0. The merge reaped `rp_cl_root` (`Reaped rp=rp_cl_root`, quicksave file deleted) and
#     step B logged `rp_cl_root:FollowSave:kept-loaded`: the `rewind-crew-loss` corpus builds
#     the point SessionProvisional with no creating session and its tree carries NO branch
#     point (saveParse `branchPoints: {}`; `RewindCrewLossFixture.BranchPointId` is a
#     diagnostic-only weak link), so the committed-owner predicate, which matches a tree's
#     branch-point ids and branch-point rewind-point ids, cannot claim it. A fixture shape,
#     not a product defect (todo REWIND-CREW-LOSS-FIXTURE-RP-HAS-NO-BRANCH-POINT); the window
#     was re-pinned to the measured 1 for that run, and is back at 0 since the fixture fix.
#
# STATUS: AUTHORED 2026-10-06 (PR #2038); LIVE-PROVEN 2026-10-07 `2026-10-07_1920` (PASS
# attempt 1); SPEC CHANGED 2026-10-07 (fixture fix + observable halves, see the top), NOT
# RE-FLOWN. Every new
# token is quoted from its emitting source line (ParsekScenario.InSessionHandoff.cs,
# InSessionStagedStateHandoff.cs, LoadReconcilePolicy.FormatClassificationLine,
# ParsekTestCommandAddon.LoadGameImpl); the rest are CL-3's.
# =====================================================================================
tier = "nightly"
description = "QL-3: save to a named slot, re-fly the crewed pod of CL-3's crash and merge it, then the player loads that save from before the Re-Fly at the Space Center (playerLoad=true, a Cold save-file load). The career is the save's: no supersede row, no tombstone, the original crashed pod visible and its crew death counted again, rp_cl_root listed."
instanceProfile = "stock-minimal"
tags = ["QL-3", "TA-1", "quickload", "timeline-ops", "rewind", "refly", "merge", "tombstone",
        "crew-loss", "CL3", "D9", "scene-ksc", "reading-run"]

[fixture]
saveTemplate       = "fixtures/saves/career-pad-craft"
injectedRecordings = "rewind-crew-loss"
craft              = []

[driver]
kind    = "autopilot"
mission = "cl3_refly_crew_tombstone"
# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  # THE SAVE from before the Re-Fly, in a named slot the merge's quicksave refresh does not
  # touch: no supersede row, no tombstone, `rp_cl_root` listed.
  { cmd = "SaveGame",          args = { name = "ql3-before-refly" },                expect = "OK", budget = 120 },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  # CL-3's future-RP gate step, verbatim (rp_cl_root sits 60 s after the template's UT).
  { cmd = "TimeJump",          args = { deltaSeconds = "61.0" },                    expect = "OK", budget = 120 },
  { phase = "mission",                                                    expect = "MISSION-OK", budget = 600 },
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },               expect = "OK", budget = 240 },
  { cmd = "RecordingState",                                               expect = "OK" },
  # THE LOAD: the player's load of the save from before the Re-Fly (playerLoad=true), booted
  # at the Space Center; a Cold save-file load.
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "ql3-before-refly", scene = "spacecenter", playerLoad = "true" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                               expect = "OK" },
  { cmd = "FlushAndQuit",                                                 expect = "OK" },
]

[driver.missionParams]
# CL-3's values VERBATIM.
rewindPointId             = "rp_cl_root"
rewindSlot                = 1

stopFrames                = 40
idleFrames                = 40
rewindFrames              = 40
verifyFrames              = 40

minUtRegressionSeconds    = 1.0

relaunchThrottle              = 1.0
relaunchMinAltitudeGainMeters = 100.0
relaunchFrames                = 240
loopPointsFrames              = 40

[dimensionsCovered]
D9  = ["rewind-to-separation", "supersede-relation", "tombstones"]
D14 = ["kerbin", "career", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1 }

[expectations.logContracts]
required  = ["Re-Fly \\(Rewind-to-Separation\\) StartInvoke", "Invocation complete",
             # The merge writes its rows before the load (unchanged).
             "Added [1-9][0-9]* supersede relations for subtree rooted at",
             "Tombstoned [1-9][0-9]* career actions \\(.*Kerbal=[1-9]",
             "loadgame spacecenter route \\(requested\\): resuming to SPACECENTER",
             # THE LOAD IS A SAVE-FILE LOAD (design 4.1). The scene it fires from is the one
             # the merge left (not pinned).
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly route=NoVesselSpaceCenter",
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly [\\s\\S]*\\[LoadPolicy\\] Save-file load intent armed: nodeUT=[0-9.]+ scene=\\S+",
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly (?:(?!Load classified: )[\\s\\S])*Load classified: early=Cold refined=Cold scene=SPACECENTER [^\\r\\n]*\\bcoldReason=save-file\\b",
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly [\\s\\S]*Save-scoped session state reset: reason=save-file ",
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly [\\s\\S]*OnLoad game state from save node: ledgerRows=[0-9]+ ",
             # THE REPLACED FLIGHT IS BACK: the save has no supersede row, so an ERS rebuild
             # after the save's ledger read skips nothing as superseded (EffectiveState
             # .ComputeERS), and the Space Center breakdown (ParsekKSC.Start) has the
             # structurally eligible Destroyed pod in (forbidden below).
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly [\\s\\S]*OnLoad game state from save node: [\\s\\S]*\\[ERS\\] Rebuilt: [0-9]+ entries from [0-9]+ committed \\(skippedNotCommitted=[0-9]+ skippedSuperseded=0 ",
             "loadgame player-load: firing [\\s\\S]*\\[KSCGhost\\] Eligible breakdown: looping=0 terminal\\(",
             # THE CREW DEATH COUNTS AGAIN: the save has no tombstone (EffectiveState
             # .ComputeELS), and the walk keeps the death-derived permanent reservation
             # (KerbalsModule's PostWalk summary).
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly [\\s\\S]*OnLoad game state from save node: [\\s\\S]*\\[ELS\\] Rebuilt: [0-9]+ entries from [0-9]+ actions \\(skippedTombstoned=0 tombstonesTotal=0\\)",
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly [\\s\\S]*OnLoad game state from save node: [\\s\\S]*\\[KerbalsModule\\] PostWalk summary: reservations=[0-9]+ permanent=[1-9]"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]",
             # THE OLD IN-SESSION ROUTE (design 8): no in-session classification, no install
             # of memory's lists, no owner partition.
             "loadgame player-load: firing [\\s\\S]*Load classified: early=InSession refined=InSessionOther scene=SPACECENTER",
             "loadgame player-load: firing [\\s\\S]*In-session staged lists from memory: ",
             "loadgame player-load: firing [\\s\\S]*In-session RP owner partition decisions: ",
             # The merge's rows must not survive the load.
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly [\\s\\S]*OnLoad game state from save node: [\\s\\S]*\\[ERS\\] Rebuilt: [^\\r\\n]*skippedSuperseded=[1-9]",
             "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=ql3-before-refly [\\s\\S]*OnLoad game state from save node: [\\s\\S]*\\[ELS\\] Rebuilt: [^\\r\\n]*tombstonesTotal=[1-9]",
             "loadgame player-load: firing [\\s\\S]*\\[KSCGhost\\] Eligible breakdown: [^\\r\\n]*ineligible\\([^()\\r\\n]*Destroyed="]

[expectations.rewind]
gating        = false
# Phase 2 prediction: the end save is the named save's lists (no row, no tombstone of the
# merge) with rp_cl_root listed again (its file kept while a save names it).
supersedeRows = { max = 0 }
tombstones    = { max = 0 }
rewindPoints  = { min = 1, max = 1 }

[expectations.recordings.structure]
gating         = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
# The corpus's own recordings; the Re-Fly's are not in the save (the run before read 4+).
recordings     = { min = 3 }
# The corpus's split branch point (since 2026-10-07; the run before read `branchPoints: {}`).
branchPoints   = { JointBreak = { min = 1 } }

[runtime]
budgetSeconds = 2700

[retry]
policy = "once"

[expectedFail]
bugId = ""
