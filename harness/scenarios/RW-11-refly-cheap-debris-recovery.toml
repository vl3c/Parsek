schema = 1
id = "RW-11-refly-cheap-debris-recovery"
# =====================================================================================
# RW-11: A RECOVERY WORTH UNDER 100 FUNDS, MADE IN A MERGED RE-FLY AND CARRIED ACROSS A
# REWIND-TO-LAUNCH (the rewind ledger campaign; the live proof of #2317, todo
# SMALL-RECOVERY-FUNDS-ERASED-IN-REFLY).
#
# THE DEFECT #2317 FIXED: a vessel recovery that paid under 100 funds got no ledger row
# (`GameStateRecorder`'s 100-funds threshold dropped the event and the recovery pairing skipped
# it too), so the money lived only as a measured-patch adjustment, and every authoritative patch
# (each patch in a Re-Fly session, a merge, a rewind) erased it. The fix keeps a positive
# VesselRecovery funds change of ANY size inside stock's payout scope
# (`Funding.onVesselRecoveryProcessing`, RecoveryPayoutScopePatches.cs) and pairs it as one
# FundsEarning(Recovery) row at stock's own amount.
#
# THE CHEAP DEBRIS. Stock's cheapest part on the CS Flea Probe is the basic fin (basicFin.cfg
# `cost = 25`); the pod side carries three on its RT-5 booster. A fin cannot be decoupled, so
# the Re-Fly destroys the booster instead: `PartAction button=explode part=solidBooster.sm.v2`
# (stock `Part.explode`, then `Die()`, which decouples every child into its own vessel), and
# each fin falls the few centimetres onto the pad as a debris vessel worth 25. Stock's own
# Space Center debris cleanup (`ProtoVessel.Clean`, route `proto-vessel-clean`, the path #2325
# pairs) recovers them through the payout scope when the merge lands at the Space Center.
#
# PLAN (cs-career-mun4 = CS-6c's produced save, UT ~185734):
#   boot       LoadGame persistent at the Space Center; warp to 185800.
#   G          CS Flea Probe on the pad, recorded, its stand decoupled there (a rewind point),
#              committed in flight with the pod's Landed slot stashed.
#   refly      Re-Fly slot 0 (the Flea with its pod): the booster exploded on the pad, the fins
#              fall free as debris, then the merge (the Space Center exit and the merge dialog).
#   cleanup    at the Space Center the fins are recovered, each under 100 funds, booked once.
#   rewind     Rewind-to-Launch onto G's tree: the recovery rows are committed future.
#   crossing   warp to 185900: each recovery crosses once and the pools come back to the ones
#              held before the rewind.
#   check      an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# PATENTS LICENSING IS LEFT FOR ITS OWN LANE: it costs 135 to 2700 science to activate
# (Strategies.cfg initialCostScienceMin = 135.0) and the host holds about 20.
#
# STEP SAVES (temporary analysis artifacts): rw11-01-after-g-commit, rw11-02-after-explode,
# rw11-03-after-merge, rw11-04-after-rtl, rw11-05-after-crossing.
#
# PINNED LITERALS (read 2026-10-28 on main 7c5c58126):
#   VesselRecovery funds patched: vessel= amount= ut=   GameActions/LedgerRecoveryFundsPairing.cs:724
#   Game state: FundsChanged +N (VesselRecovery)        GameStateRecorder.cs (the payout scope keep)
#   Recovery scope opened: route=proto-vessel-clean     RecoveryDispatchScope.cs
#   Clock-crossing reached committed-future rows:       GameActions/LedgerOrchestrator.cs
#   partaction applied button=explode                   TestCommands/TestCommandPartAction.cs
#
# STATUS: AUTHORED 2026-10-28 (branch `rw11-cheap-debris`), NEVER FLOWN. The number of fins
# that fall free and are recovered, the recovery UT, the recordings count and the batch split
# are interim until measured.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, a recovery worth under 100 funds in a merged Re-Fly (#2317): on cs-career-mun4 a CS Flea Probe decoupled on the pad is committed with its pod slot stashed, a Re-Fly of that slot explodes the Flea's booster so its 25-funds fins fall free as debris, the merge lands at the Space Center whose debris cleanup recovers each fin through stock's payout, booked once as a FundsEarning(Recovery) row at stock's amount; after a Rewind-to-Launch the warp crosses each recovery once and the pools come back; LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-11", "career", "ledger", "rewind", "rewind-to-launch", "refly", "recovery",
        "small-recovery", "debris", "ksc-debris-cleanup", "editor", "ground-truth",
        "ingame-batch", "timeline-ops", "reading-run"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 2 x 120 warps + 2 x (120 GoToEditor + 180 LaunchFromEditor)
# + 180 StartRecording + 120 warp + 120 CommitTree + 300 InvokeRewind + 120 warp + 240 merge
# + 300 rewind + 120 crossing warp + 120 check warp + 6 x 120 SaveGame + 540 RunTests = 4320;
# runtime 5400 adds the inert steps and FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },

  # ---- G: the CS Flea Probe decoupled on the pad (a rewind point), committed in flight ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "CS Flea Probe" },          expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "g",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "PartAction",     args = { button = "decouple", part = "radialDecoupler" }, label = "dec", expect = "OK" },
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185812", maxRate = "1" },                       expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c1",                   expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "rewindpoints" }, label = "handles",           expect = "OK" },
  # The pod's Landed slot stashed into Unfinished Flights, so it can be Re-Flown.
  { cmd = "StashSlot",      args = { rp = "${handles.rp0}", slot = "0" },                  expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw11-g-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw11-01-after-g-commit" },                   expect = "OK", budget = 120 },

  # ---- the Re-Fly: the booster exploded on the pad, the fins fall free as debris ----
  { cmd = "MissionMark",    args = { label = "rw11-refly-armed" },                         expect = "OK" },
  { cmd = "InvokeRewind",   args = { rp = "${handles.rp0}", slot = "0" },                  expect = "OK", budget = 300 },
  { cmd = "ListHandles",    args = { kind = "chains" },                                    expect = "OK" },
  { cmd = "RecordingState", args = { awaitRecorderLive = "refly" },                        expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "solidBooster.sm.v2" },    expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw11-refly-started" },                       expect = "OK" },
  { cmd = "PartAction",     args = { button = "explode", part = "solidBooster.sm.v2" }, label = "ex", expect = "OK" },
  # The pod drops the booster's length onto the pad and the fins settle.
  { cmd = "WarpToUT",       args = { ut = "185815", maxRate = "1" },                       expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "mk1pod.v2" },             expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw11-exploded" },                            expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw11-02-after-explode" },                    expect = "OK", budget = 120 },

  # ---- the merge: the Space Center exit and the merge dialog; the debris cleanup there ----
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },                                expect = "OK", budget = 240 },
  { cmd = "MissionMark",    args = { label = "rw11-merged" },                              expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c2",                   expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw11-03-after-merge" },                      expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw11-before-rewind" },                       expect = "OK" },

  # ---- the rewind onto G's tree: the recovery rows are committed future ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw11-rewound" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw11-04-after-rtl" },                        expect = "OK", budget = 120 },

  # ---- the crossing ----
  { cmd = "WarpToUT",       args = { ut = "185900", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw11-crossed" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw11-05-after-crossing" },                   expect = "OK", budget = 120 },

  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "185930" },                                      expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D5  = ["controlled-decoupled-child"]
D8  = ["funds", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch", "rewind-to-separation", "unfinished-flights-stash", "supersede-relation"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 34, G's launch recording and its stand, the TIP the merge's split cuts, the merged
# attempt's recording, and the debris recordings of the exploded booster's fins. INTERIM window.
count = { min = 38, max = 44 }

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- G: launched, decoupled on the pad into a second controllable vessel ----
  "launchfromeditor complete scene=FLIGHT vessel=CS Flea Probe pid=([0-9]+) [\\s\\S]*?partaction applied button=decouple pid=\\1 part='radialDecoupler' partId=[0-9]+ event=Decouple newPid=[1-9][0-9]* ",
  "RewindPoint begin: rp=(rp_[0-9a-f]{32}) bp=[0-9a-f]{32} slots=2 controllablePids=2 focusSlot=0 ut=1858[0-9]{2}\\.[0-9]{2}[\\s\\S]*?RewindPoint slot capture: rp=\\1 populated=2/2 disabled=0",

  # ---- the Re-Fly: the booster destroyed on the pad, a fin split off as debris ----
  "MISSIONMARK label=rw11-refly-started ut=(?:(?!MISSIONMARK label=rw11-exploded )[\\s\\S])*?partaction applied button=explode pid=[0-9]+ part='solidBooster\\.sm\\.v2' partId=[0-9]+ event=explode newPid=[1-9][0-9]* ",
  # The pod survives its drop onto the pad.
  "MISSIONMARK label=rw11-refly-started ut=(?:(?!MISSIONMARK label=rw11-exploded )[\\s\\S])*?partaction applied button=inspect pid=[0-9]+ part='mk1pod\\.v2' ",

  # ---- the merge and the cheap recovery: under 100 funds, kept and booked once ----
  "MISSIONMARK label=rw11-exploded ut=[\\s\\S]*?MISSIONMARK label=rw11-merged ut=",
  "MISSIONMARK label=rw11-exploded ut=(?:(?!MISSIONMARK label=rw11-before-rewind )[\\s\\S])*?Game state: FundsChanged \\+[1-9][0-9]?(?:\\.[0-9]+)? \\(VesselRecovery\\)",
  "MISSIONMARK label=rw11-exploded ut=(?:(?!MISSIONMARK label=rw11-before-rewind )[\\s\\S])*?VesselRecovery funds patched: vessel='[^'\\r\\n]*' amount=[1-9][0-9]? ut=",

  # ---- the rewind and the crossing: the recovery crosses, the pools come back ----
  "MISSIONMARK label=rw11-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw11-rewound ut=",
  "MISSIONMARK label=rw11-rewound ut=(?:(?!MISSIONMARK label=rw11-crossed )[\\s\\S])*?Clock-crossing reached committed-future rows: [^\\r\\n]*FundsEarning@",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw11-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw11-crossed ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  # The pre-#2317 shape: a recovery change dropped, or its pairing skipped.
  "skipping deferred recovery-funds pairing",
  "Recovery dispatch closed with no payout for deferred debris request",
  # No pool adjustment, no guard clamp.
  "filed StockPoolAdjustment amount=",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

[runtime]
budgetSeconds = 5400

[retry]
policy = "once"

[expectedFail]
bugId = ""
