# =====================================================================================
# V20T: THE TRACKING-STATION OBSERVATION OF A LOOPED **KERBIN ARRIVAL** - the TS half of
# the V20 pair, and the first TS loop subject whose recording arrives at KERBIN FROM
# ANOTHER PLANET.
#
# ITS SUBJECT EXISTS AND WAS FLOWN BEFORE THIS SPEC WAS WRITTEN.
# `B29-jool-kerbin-return` FLIGHT 3 came back PASS attempt 1 on 2026-08-27 (MISSION-OK,
# wall 2,103 s, all eight assertions met), and its produced save is the committed
# `fixtures/saves/kerbin-return-recorded` harvest. So there is no `PENDING_FIXTURE_LANES`
# exemption here and no zero tree id: EVERY number below is read off those bytes, and the
# ones that are arithmetic say so.
#
# NOTHING IN THIS FILE IS ARMED. It is a READING-RUN spec: no `gating = true` anywhere,
# no routing token in `required`, every window derived rather than measured. **THIS LANE
# HAS NEVER FLOWN.**
#
# **TWO READING RUNS HAVE FLOWN AND THE SECOND IS GREEN.**
# RUN 1 `2026-08-27_1857`: PARSEK-FAIL(anomaly), attempt 1, wall 61 s - A PRE-REGISTERED
# CORRECT CATCH RATHER THAN A LANE DEFECT.
# **RUN 2 `2026-08-27_1913`: PASS ATTEMPT 1, wall 61 s, EVERY VERIFIER PASS OR SKIPPED**
# with the tolerated token - `anomalySweep status=PASS hits=[] allowed=['icon-teleport']
# hitCounts={'icon-teleport': 3}`, `expectations PASS mismatches=0` over all THIRTEEN
# required tokens, analyzer red=0, logValidate PASS, saveParse REPORT 739/739/739 with
# every rewind facet 0, renderCompose REPORT 0 FAIL. **THE ANOMALY COUNT RECURRED AT THE
# IDENTICAL 3**, so the ceiling arithmetic in `allowedAnomalies` now stands off a PAIR
# rather than a single sample - which is exactly what that block said reading 2 was for.
# **THIS LANE IS ARM-READY** (not armed; arming is a separate operator decision).
# RUN 1's ledger: Section 10 is
# the full ledger. The short form: driverValidity PASS with ALL THIRTEEN required tokens
# matched, analyzer red=0, logValidate PASS, saveParse clean, renderCompose 0 FAIL, and
# the ONLY hit is `icon-teleport x3` - now tolerated BY NAME with that run beside it.
# **THREE THINGS THIS LANE PRE-REGISTERED WERE ANSWERED AT ONCE**: the endpoint-tail seed
# is NOT FLIGHT-only (45 hits in TS), the TS init walk took READING B (`created 1`,
# `noOrbit=0`), and - the one that cost a correction - **THE PRE-EMPTIVE RE-PIN BELOW WAS
# WRONG AND ITS PIN IS RESTORED** (section 5A).
#
# **AND ITS SIBLING FLEW FIRST, WHICH IS WHERE THE PRE-EMPTIVE RE-PIN CAME FROM.**
# V20M reading run `2026-08-27_1828` (PARSEK-FAIL(expectation), attempt 1, wall 74 s,
# ONE mismatch - its own destination-frame render token) measured, over the SAME
# `GhostMapPresence` proto-creation path this lane uses, that a ghost proto's rendered
# body frame on this subject is NEVER Kerbin at any epoch. **SECTION 5A CARRIES THE
# PRE-EMPTIVE RE-PIN**: the `phase=GhostCreated surface=ProtoIcon ... body=Kerbin
# scene=TRACKSTATION` token this file shipped with is KEPT VERBATIM there and REMOVED
# from `required`, replaced by a body-free TS proto floor plus the same seed-side arrival
# token V20M re-pinned onto. **RE-PINNING A LANE OFF ITS SIBLING'S MEASUREMENT RATHER
# THAN FLYING A KNOWN-DEAD PIN IS THE POINT OF AUTHORING THEM AS A PAIR** - and the
# honest cost is that the replacement's reachability IN THE TRACKING STATION is itself
# unmeasured, which section 5A pre-registers as one of the things this lane's first run
# now measures.
#
# ---------------------------------------------------------------------------------
# WHY THE STEP CHAIN LOOKS LIKE THIS - V5's precondition, unchanged and still binding.
# MissionConfig, StartLoopPlayback and TimeJump are ALL `RequiresFlight` in
# `TestCommandDispatcher.Preconditions`: in TRACKSTATION each would DEFER `not-in-flight`
# until its budget expired and the run would die on a timeout having armed nothing. So
# arming and clock work happen in FLIGHT, are PERSISTED, and only then re-entered in TS:
#   FLIGHT: kill the entry stub -> arm tracers -> MissionConfig (loop ON)
#           -> StartLoopPlayback -> ONE TimeJump into the cycle-1 Kerbin arrival coast
#   SaveGame (persists the armed MissionStore state AND the jumped clock; ghost
#             ProtoVessels are stripped by GhostMapPresence.StripFromSave)
#   TRACKSTATION: LoadGame scene=trackstation, then the forty-tick dwell block.
# There is no shorter honest chain. The V19T/V17T/V16T/V15T/V14T shape is reproduced
# VERBATIM in SHAPE - same verbs, same order, same re-kill pair - and only the tree id,
# the one jump UT and the pinned body differ.
#
# THE RE-KILL PAIR BEFORE THE TS LOAD IS NOT BELT-AND-BRACES: V5 run 1 attempt 1 died
# there on `reject cmd=LoadGame reason=recording-active`, because the scene-entry
# promotion recorder RE-ARMS on some entry orderings and not others. Running the pair
# immediately before the load the guard rejects is the only placement that makes the
# outcome deterministic.
#
