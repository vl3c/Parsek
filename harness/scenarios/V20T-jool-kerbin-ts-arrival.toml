# CLAIM-IS-NOT-GATE, and this is the thin TS list a reading run owes.
#   D14 `scene-ts` is gated by the two R12 route tokens; `sandbox` by the fixture;
#     `kerbin` by the TS host materializing a ghost IN A KERBIN FRAME at the observed
#     epoch - gated from the START by `phase=GhostCreated surface=ProtoIcon ...
#     body=Kerbin scene=TRACKSTATION` (V6T's `body=Mun` pin with the body swapped), which
#     is what makes it a RENDERED-FRAME claim rather than an EPOCH claim. THIS IS THE
#     FIRST TIME A TS LOOP LANE CLAIMS `kerbin` AS AN ARRIVAL FRAME rather than as a
#     departure environment.
# DELIBERATELY NOT CLAIMED: `jool` and `sun`. The recording HAS long Jool and Sun phases
#   and nineteen of the twenty live instances are in them at the observed epoch, but this
#   lane pins no Jool- or Sun-framed token, and a claim whose gate is somebody else's
#   token is a claim about a coincidence. Also not claimed: any D11 cell (routing is what
#   this pair MEASURES - V20M's header walks the classifier to a decline string no
#   committed lane has printed, and claiming a cell would be claiming that answer before
#   the reading), D6 `ghost-map-presence` (the TS ProtoVessel lifecycle is H23/H28's
#   contract), and D9 `fast-forward` (V20M owns it).
[dimensionsCovered]
D14 = ["kerbin", "scene-ts", "sandbox"]

[expectations]
