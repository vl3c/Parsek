# 4. THE FORTY-TICK TS DWELL IS SPAWN-THROTTLE HEADROOM, AND ON THIS SUBJECT IT IS
#    LOAD-BEARING IN A WAY IT WAS NOT ON V19T
# =====================================================================================
# V16M's forty-tick block exists to push a SECOND census emission past a 5.0 s
# VerboseRateLimited window. **THAT IS NOT WHY IT IS HERE**, and copying it for that
# reason would be copying a number without its argument. V17T run 1 (2026-08-20_1917)
# measured the real mechanism on a self-overlapping TS subject:
#
#   overlap-instance creation runs **NEWEST-CYCLE-FIRST** at
#   `GhostPlayback.MaxSpawnsPerFrame = 2` per lifecycle tick, so the OLDEST live cycle
#   spawns LAST. Its two-tick TS phase gave the scene ~0.65 s = 3 ticks = 6 ghosts
#   (cycles 14-19) and FlushAndQuit ended the scene before cycle 1's turn - **6 of 20**.
#   The SAME epoch in the FLIGHT phase created all 20, so the pin was satisfiable; the
#   scene simply had to live long enough.
#
# THE ARITHMETIC FOR THIS SUBJECT, with its inputs named because it is arithmetic and not
# a measurement. Instance k is alive at the observation epoch when `(t - A) - k*pitch`
# lies in [0, spanDur]; at t = 94,621,776 that resolves to **k = 1..20**, i.e. all twenty
# have launched and none has expired. A KERBIN-framed instance is one whose replay offset
# exceeds the 32,578,749.192 s arrival-seam offset, and since the Kerbin window is only
# **27,826.583 s** against a **1,630,328.8 s** pitch - the pitch is **58.6x WIDER than the
# window** - **AT MOST ONE INSTANCE CAN EVER BE KERBIN-FRAMED.** The derived census is:
#     **Kerbin 1 / Sun 14 / Jool-escape 3 / Jool-park 2**
# and the Kerbin one is **INSTANCE 1, THE OLDEST - THEREFORE THE VERY LAST TO SPAWN**
# under newest-first ordering. At 2 per tick it appears at about **tick 10 of 10**, i.e.
# dead last. **FORTY RecordingState ticks (>= 10 wall s at run.py's 0.25 s poll floor,
# V16M's proven sizing) is ~4x that.**
#
# **AND THAT IS WHY THIS BLOCK IS LOAD-BEARING HERE IN A WAY IT WAS NOT ON V19T.** V19T's
# subject had EIGHT Jool-framed instances spread through the spawn order, so a short TS
# phase that read only 6 of 20 would still probably have caught one. **HERE THERE IS
# EXACTLY ONE, AND IT SPAWNS LAST.** A TS phase cut off at 6 of 20 - the V17T measurement,
# on this exact throttle - would read six Sun-framed and Jool-framed ghosts and MISS THE
# ARRIVAL-LEG INSTANCE ENTIRELY, and the `body=Kerbin` pin would go unmet with no other
# error in the log. The dwell is the whole reason the pin is reachable.
# THE EXACT LIVE COUNT IS A READING this run reports rather than a number pinned anywhere
# below (V19T measured 37 ghosts on its own dwell, against 20 instances, because the
# lifecycle also re-materializes; nothing here predicts that number).
#
# =====================================================================================
# 5. THE TS INIT WALK - BOTH READINGS PRE-REGISTERED, NEITHER GATED
# =====================================================================================
# V14T/V15T/V16T all required `ParsekTrackingStation initialized: created [1-9][0-9]*
# ghost vessel\(s\)` as their TS anti-vacuity gate. V17T RETIRED it, because run 1
# measured init-ZERO as the CORRECT product outcome on its subject: with the loop armed,
# the init walk evaluates the BASE recording at the entry epoch and skips it `noOrbit=1`
# when the recording's tail is segment-less (no visibleSegment / terminalOrbit /
# endpointTail / stateVector source resolves), and every real ghost then comes from the
# per-lifecycle-tick DYNAMIC overlap path instead. V19T then measured the OPPOSITE -
# `created 1` with `noOrbit=0` and `visibleSegment=1` - on a subject whose jump landed
# inside a segmented coast.
#
# **THIS SUBJECT SITS ON BOTH SIDES OF THAT, EXACTLY AS V19T's DID.** Its parked tail IS
# segment-less (section 1) - the same shape V17T measured init-zero on - but this lane's
# jump lands INSIDE the replayed Kerbin arrival coast (section 3), where an orbit source
# demonstrably exists. Whether the init walk finds one AT THE ENTRY EPOCH depends on which
# clock it evaluates the base recording against, and that is GENUINELY OPEN at this
# subject:
#
#   READING A - INIT-ZERO. The walk reads the base recording on its OWN unshifted
#     timeline, where the entry epoch is 34,227,879 s past the recording's end and the
#     only candidate source is the segment-less tail. V17T's measurement.
#   READING B - INIT-NONZERO. The walk reads the loop-shifted clock, where the entry
#     epoch is 70% through a real Kerbin ORBIT_SEGMENT and a source resolves cleanly.
#     V19T's measurement, on a subject shaped the same way this one is.
#
# **B IS THE RANKED PREDICTION** on the V19T precedent, and it is deliberately NOT gated:
# a ranking over two enumerated readings is not a measurement.
#
# **MEASURED ON RUN 1 (`2026-08-27_1857`): IT IS READING B.**
#   `CreateGhostVesselsFromCommittedRecordings: created=1 from 1 recordings
#    sources(visibleSegment=1 terminalOrbit=0 endpointTail=0 stateVector=0) (skipped:
#    ... noOrbit=0 ...)`
#   `ParsekTrackingStation initialized: created 1 ghost vessel(s), fixed 0 orbit
#    renderer(s), trackingStationSuppressed=0, orbitSourceDiagnostics=aggregated`
# `created 1` with `noOrbit=0` and the source resolving as `visibleSegment` - the walk DID
# find an orbit source, because this lane's jump lands INSIDE the SEGMENTED Kerbin arrival
# coast rather than on the segment-less tail. Exactly the distinction READING B named
# before the flight, and the same answer V19T's own subject gave. BOTH readings were
# pre-registered here, NEITHER was gated, and the losing branch stays on the record.
# **CONSEQUENCE, AND IT IS DELIBERATELY NOT TAKEN YET:** `created 0 ghost vessel\(s\)` is
# now a MEASURED-live, FIREABLE forbid on this lane, exactly as it became on V19T - but
# V19T added it at its ARMING pass, not at its reading pass, and this lane is still at the
# reading pass (run 1 red on the anomaly). It is ARM-READY and recorded as such. THE LINE THAT SETTLES IT:
# `ParsekTrackingStation initialized: created N ghost vessel(s)` against the walk's own
# `noOrbit=` skip counter on the same boot. **NEITHER READING IS GATED** - the init line
# is neither required nor forbidden, and the anti-vacuity duty is carried entirely by the
# two DYNAMIC-path tokens, which an empty tracking station cannot satisfy in either world.
# **AND `created 0 ghost vessel\(s\)` IS THEREFORE NOT IN `forbidden`**, exactly as it was
# not on V19T's own reading run: a forbid on the init line would gate one branch of a
# question this spec declares open. If the run measures `created 1`, the S1.4 rule says
# arm the bare token WITH the run that shows it - at the arming pass, not here.
#
# =====================================================================================
# 5A. THE PRE-EMPTIVE RE-PIN, OFF V20M's RUN 1 AND BEFORE THIS LANE FLIES
# =====================================================================================
# **THE PIN THIS FILE SHIPPED WITH, KEPT VERBATIM AND NOT DELETED:**
#
#     phase=GhostCreated surface=ProtoIcon pid=\d+ .*body=Kerbin scene=TRACKSTATION
#
# It was V6T's `body=Mun` pin with the body swapped, and its LENS ARGUMENT was and
# remains correct - the visited set {Jool, Sun, Kerbin} looks nested-SOI and is not, so
# the fail-closed root-frame render that made V17T's `body=Vall` pin structurally
# unsatisfiable cannot arise here (V20M header section 5).
#
# **IT IS REFUTED ANYWAY, AND THE REFUTATION IS MEASURED - ON V20M's RUN, IN FLIGHT, OVER
# THE PROTO-CREATION PATH BOTH SCENES SHARE.** Run `2026-08-27_1828`:
#   * 41 `phase=GhostCreated surface=ProtoIcon` lines, body distribution **Jool 11 /
#     Sun 30. ZERO Kerbin.** The ProtoIcon `body=` reads the ghost VESSEL's main body, and
#     for a heliocentric-framed proto that is the Sun.
#   * 41 `Created ghost vessel ... orbitSource=overlap-instance-segment` lines, with
#     `referenceBody=` Jool 11 / Sun 30 - **NO instance was ever created on a Kerbin
#     segment**, not even the one whose replay clock sat inside the Kerbin arrival coast.
#     Cycles 1 and 21 were created on seg#13 (the last SUN coast, ending AT the arrival
#     seam), which is exactly where section 3's arithmetic puts them at the epoch they
#     were created.
#   * 41 `phase=body-orbit surface=ProtoOrbitLine` reads, ALL on the recording's FIRST
#     segment (`body=Jool sma=590325785`), each pid emitting exactly one sample.
# **THE TS SCENE CANNOT ESCAPE THIS, BECAUSE IT IS THE SAME CODE.** The TS host
# materializes overlap instances through the same `CreateOverlapInstanceVessel` ->
# `BuildAndLoadGhostProtoVessel` path (that is why V19T's own anti-vacuity token is the
# `orbitSource=overlap-instance-segment` line), and the TS INIT walk creates protos from
# the same `GhostMapPresence` seeding. **FLYING THIS LANE WITH A KNOWN-DEAD PIN WOULD BUY
# A SECOND PARSEK-FAIL AND NO NEW INFORMATION**, so the pin is re-cut here rather than
# after the fact. Nothing else in the flown shape moves: no step, no jump, no budget, no
# setting.
#
# **THE REPLACEMENTS, AND WHAT EACH ONE HONESTLY CLAIMS.**
#   (1) `phase=GhostCreated surface=ProtoIcon pid=\d+ .*scene=TRACKSTATION` - THE SAME
#       TOKEN WITH THE BODY CLAUSE REMOVED. It keeps the TS-specific proto floor (an
#       empty tracking station cannot green it; V19T measured 37 of these) and drops
#       exactly the clause that is unreachable. It is a PRESENCE claim, not a
#       destination claim, and it is labelled as one.
#   (2) `OrbitReseed\] TryFromHistoricalLatLonAltAndRecordedVelocityWithEpoch: body=Kerbin`
#       - THE DESTINATION TOKEN, the same one V20M re-pinned onto, and for the same
#       argued reason: `OrbitSeedResolver.TryDeriveTailOrbitSeed(..., MapPresence)`
#       resolves the ghost proto's ENDPOINT-TAIL orbit from the RECORDING's own latest
#       coast frame in the recording's endpoint body's frame, `body` being
#       `FindBodyByName(RecordingEndpointResolver.TryGetPreferredEndpointBodyName(traj))`
#       = KERBIN because this is the corpus's first Kerbin arrival. Both call sites are
#       in `GhostMapPresence.cs` (`:4673`, `:10594`), so nothing but ghost-proto
#       machinery reaches the emitter and the produced save's own Kerbin-parked craft
#       cannot satisfy it; the emitter is `ParsekLog.Verbose`, NOT rate-limited.
#       **IT IS A SEED-SIDE CLAIM WHERE THE REFUTED ONE WAS A RENDERED-FRAME CLAIM.**
#       That is a DEMOTION, it is NOT what roadmap G2's TS third asks for, and the
#       rendered-frame Kerbin claim on this host STAYS OWED.
#   (3) `ShouldPopulateTerminalOrbitFromLastSegment: .*explicit endpoint body=Kerbin` -
#       the LOAD-TIME structural premise (measured once on V20M's run), that the
#       recording's KERBIN endpoint survives the load and its cached terminal orbit stays
#       authoritative over the hyperbolic approach segment.
#
# **THE ONE THING THIS RE-PIN CANNOT SETTLE FROM A SIBLING'S LOG, PRE-REGISTERED AS A
# READING RATHER THAN ASSUMED AWAY.** Token (2) was measured 41 times IN FLIGHT. Both its
# call sites are scene-agnostic `GhostMapPresence` code and it fired once per proto
# creation, and the TS host creates protos - so the expectation is that it fires there
# too. **BUT NO COMMITTED RUN HAS SEEN IT IN TRACKSTATION**, and if it does not print
# there the reading is "the endpoint-tail map-presence seed is FLIGHT-only", which is a
# real finding about the TS host and worth the run. That is stated here BEFORE the flight
# so it cannot be written afterwards.
# **ANSWERED BY RUN 1: NO, IT IS NOT FLIGHT-ONLY.** `2026-08-27_1857` printed
# `OrbitReseed] ... body=Kerbin` **45 times** with the tracking station up, so the
# endpoint-tail map-presence seed is scene-agnostic exactly as the code walk said. The
# pre-registered alternative is refuted and recorded rather than deleted.
#
# ---------------------------------------------------------------------------------
# **AND THE PRE-EMPTIVE REMOVAL WAS WRONG. THIS LANE'S OWN RUN REFUTED IT, AND THE PIN IS
# RESTORED.**
