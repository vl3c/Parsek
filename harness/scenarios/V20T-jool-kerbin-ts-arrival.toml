# **EMPTY ON PURPOSE, AND THE OUTCOME IS GATED IN NEITHER DIRECTION** - section 6.
# `icon-off-orbit` on the ghost-proto creation frame fired on ALL SIX runs of V14T, V15T
# and V16T at three parents while the stepped-bracket controls stayed silent on all six of
# theirs; V17T's two runs then swept CLEAN, and V19T's clean sweep EXCLUDED nested-SOI and
# left SELF-OVERLAP as the surviving candidate with no mechanism claimed. This lane is
# self-overlapping at the same `span/20` ratio but with the instances spread 2,719x
# further apart in recorded time and only ONE of twenty destination-framed, so silence is
# a third confirmation at an extreme parameter value and a RAISE would knock out the
# surviving candidate. Both are worth exactly nothing if the token is pre-tolerated.
# A PARSEK-FAIL(anomaly) with every step green is the pre-registered correct catch; a
# clean sweep is an equally load-bearing reading.
# THE ARMING RECIPE if it fires: add the BARE token (not a count budget - the whole-set
# invariant `MisplacedAllowedAnomaliesRejectionTests.test_no_committed_spec_arms_a_count_budget`
# ships that mechanism INERT) WITH the run that shows it, per the S1.4 rule.
allowedAnomalies = []

[expectations.recordings]
# TWO body-change seams, so ONE recording is the prediction and the window admits a
# LOAD-TIME optimizer split at EITHER of them - which is why this is {1,3} where V19T's
# one-seam subject used {1,2}. This lane starts no recording of its own, and the fixture
# ships exactly ONE `.prec` sidecar, so the count can move only through that walk - which
# fires on THIS lane's LoadGame, not on B29's flight.
#
# THE CODE-READ PREDICTION IS COHESION AT BOTH, by DIFFERENT disjuncts of
# `ShouldKeepCohesiveCrossBodyExoCoast` - the detail is in V20M's `[expectations.recordings]`
# comment and is not duplicated here beyond the headline, so the pair cannot drift: the
# JOOL->SUN seam is both-sides-ExoBallistic (clause (a), the ordinary rule every earlier
# loop lane measured), while the **SUN->KERBIN seam is the FIRST IN THE CORPUS to depend on
# clause (b)** - its left side is `env=1` ExoPropulsive and its right `env=2` ExoBallistic,
# so only the on-rails disjunct (both sections `ReferenceFrame.OrbitalCheckpoint`) keeps it
# whole. **NOTHING HERE PINS THAT.** V19T pinned the COUNT and V19M pinned the MECHANISM,
# one gate per fact across the pair; on a READING run neither is armed at all, and the
# `Split summary: .*exoCoastBodyChangeKept=2` token belongs to V20M's arming pass if and
# when its run measures it.
count = { min = 1, max = 3 }

[expectations.logContracts]
# TEN TOKENS. What a reader will notice missing is missing on purpose:
# `Orbital(...) same-parent`, `support=Supported`, any `PhaseLock APPLIED` form and the
# whole re-aim trio are the ROUTING, and this pair is where the INBOUND interplanetary
# routing is READ rather than asserted - requiring or forbidding any of them would gate on
# an answer this pair exists to measure.
#   "missionconfig applied:" / "SetLoopEnabled: loop ON" - the loop is ARMED through the
#     production path, in FLIGHT, before the save; the first also echoes the anchor, which
#     is the number to read when re-calibrating the jump.
#   "startloopplayback initiated:" - the clock work entered the production door and echoed
#     the resolved relaunchUt. ROAD-INDEPENDENT and the single most important line in this
#     log for the re-pin, because the anchor is the ONE seeded number.
#   "FastForwardToEventUT: jumping to UT=" - the jump entered the production door.
# THE TWO R12 ROUTE LINES, verbatim from V19T with nothing changed - the trackstation
#     BRANCH was taken and the load COMPLETED against the TrackingStation expected scene
#     (H23's pins; this fixture has a focusable vessel and would otherwise route to
#     FLIGHT, so a TRACKSTATION landing can only mean the requested scene overrode the
#     save-derived route - the claim is falsifiable).
# THE TWO TS ANTI-VACUITY GATES, both on the DYNAMIC overlap path (section 5), because the
# init walk's answer at this subject is PRE-REGISTERED IN BOTH DIRECTIONS and must not be
# gated:
#   "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION"
#     - the dynamic overlap path actually materializing a loop instance IN the TS. An
#     empty tracking station cannot green this in either init-walk world.
#   "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Kerbin scene=TRACKSTATION" -
#     V6T's `body=Mun` pin with the body swapped, which turns the D14 `kerbin` claim from
#     an EPOCH claim into a RENDERED-FRAME claim. **EXACTLY ONE of the twenty live
#     instances is Kerbin-framed at this epoch and it is the OLDEST, hence the LAST to
#     spawn** - which is exactly what the forty-tick dwell block buys, and which makes
#     this the most falsifiable destination pin the TS half of the program has carried.
#     It is STRUCTURALLY SATISFIABLE for the reason V20M's header section 5 derives: the
#     visited set is not nested-SOI despite the Sun having two visited children, so the
#     fail-closed root-frame render that made V17T's `body=Vall` pin unsatisfiable cannot
#     happen here.
# THE PROBE / LENS PRESENCE PINS (V6T/V14T/V15T/V16T/V17T/V19T's, verbatim):
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - emitted only when the
#     per-pid parity pass touched the lens, so PRESENCE cannot be produced by a frame with
#     no resolved ghost. `sampled=[1-9]` is NOT pinned (the standing
#     FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and it
#     STAYS presence-only: a TS dwell characteristically reads the structural
#     `evaluated=0 skip.no-cross-body-successor=1`, and V16T MEASURED that this lens can
#     raise a nonzero from a creation-frame binding artifact rather than from real drift,
#     so the VALUE is a reading and not a contract - doubly so here, where the subject has
#     TWO seams rather than one.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "loadgame trackstation route: booting to TRACKSTATION save=",
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION",
  "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Kerbin scene=TRACKSTATION",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, and each guards a PREMISE rather than deferring a MEASUREMENT.
# NOTE what is NOT here, in both directions:
#   * the re-aim trio (`[ReaimDiag]` / `ENGAGED re-aim` / `FORCED FAITHFUL`) and every
#     phase-lock artifact - V19M's posture for V19M's reason, sharper here because this is
#     the FIRST subject in the corpus whose arrival scan succeeds and which therefore has a
#     real chance of engaging.
#   * `created 0 ghost vessel\(s\)` - section 5 pre-registers BOTH init-walk readings and
#     gates on NEITHER, so a forbid on the init line would gate exactly one branch of a
#     question this spec declares open. V19T's own reading run did not carry it either;
#     it was armed only after that run measured `created 1`, which is the S1.4 rule.
#   * the `icon-off-orbit` raise this lane may or may not produce is the anomaly sweep's
#     surface, not logContracts', and it is handled - by being deliberately untolerated -
#     in `allowedAnomalies` above.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 MARKER, a REDUNDANT grep-stable echo rather than a load-bearing guard:
  # `ParsekTestCommandAddon.TimeJumpKscAction.cs:55-57` logs the Warn AND calls
  # `SetExecResult("REJECTED", null, "backward-jump")`, and the TimeJump step carries
  # `expect = "OK"`, so the STEP itself goes unmet and the run is driver-INVALID on both
  # attempts. Kept for family convention. The case NOTHING catches is a jump that lands
  # FORWARD at the WRONG epoch: read `anchorUt=` and `relaunchUt=` (section 2).
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a RENDER defect rather than a reading about the
  # routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# **REPORT-ONLY. NOT ARMED.** This is a reading run: arming these three windows here would
# transcribe B29's PRODUCER-side facets and read like a measurement of THIS lane, which is
# the exact mistake V17T's header records leaving the block out to avoid and which V19T
# then corrected by arming off its OWN run. The arming pass belongs to a later commit
# written off this lane's own saveParse REPORT.
# The CLAIM being predicted is that a FLIGHT-arm / SaveGame / TS-re-entry observation
# authors NOTHING durable, and it is worth more on this shape than on a single-scene dwell
# for V5's reason - this spec writes a save mid-run and reads it back through a SECOND
# scene load, the shape in which a stray durable write is easiest to miss, and here the
# second load additionally drives the dynamic overlap path through a full fill-in across a
# 34.23 Ms clock hop.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# **REPORT-ONLY. NOT ARMED**, same reason as the rewind block above. The numbers below are
# what the HARVESTED FIXTURE carries (trees 1, committedTrees 1, recordings 1,
# terminalStates {Orbiting: 1}, branchPoints {}, duplicateRecordingIds [], points
# 739/739/739 unparsed 0), i.e. B29's numbers - what this block will eventually CLAIM is
# what THIS lane's double-entry chain leaves behind, which has not been run.
# `recordings` is deliberately WIDE at {1,3}, matching the `count` window above and its
# TWO-seam arithmetic; `trees` keeps V2's max = 2, the documented duplicate-tree writer
# hazard.
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 3 }
terminalStates = { Orbiting = { min = 1 } }

[expectations.renderComposition]
# M-A7 - DECLARED BARE ON PURPOSE: no `gating`, no window, no list. Declaring is what sets
# `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder at Awake, and
# `rendercompose` then records its facets UNCONDITIONALLY on a parseable manifest - which
# is how a lane earns its first honest window off a green report-only run. A window
# written today would be a PREDICTION read back as though it were a measurement.
# TRACERS: all three are armed by this lane's settings block. `ghostRenderTracing` is NEW
# relative to V19T, which did not carry it (and is not a declarer); V14T's TS-host
# manifest set that precedent and its exposure note applies here unchanged.
# READING PENDING.

[runtime]
# 300 LoadGame + 300 StartLoopPlayback + 300 TimeJump + 300 LoadGame(TS) + the fast
# non-deferred verbs + the forty-tick dwell (>= 10 wall s at run.py's 0.25 s poll floor) +
# KSP boot + collect. V6T, V14T, V15T and V16T all measured 50 s end to end on the
# sixteen-step form, and V19T's 54-step shape measured 60 s.
# **BUT THE ONE JUMP HERE TRAVERSES 34.23 Ms OF GAME TIME AGAINST V19T's 9.77 ks** - and
# KSP must on-rails-propagate every vessel and SpaceObject in the save across it. That
# cost is UNMEASURED at this magnitude (section 3 prices it explicitly), so the family's
# 2,400 is carried unchanged as the watchdog it is, with the note that a TimeJump budget
# death is a READING about propagation cost and not a calibration failure.
budgetSeconds = 2400

[retry]
# One retry absorbs the V5 promotion-recorder re-arm race and the transient TS-re-entry
# `LoadGame REJECTED` deferred-save busy class V17T's attempt 1 hit. It does NOT absorb a
# mis-seeded anchor: that reproduces exactly on attempt 2, which is the point. NOTE it is
# ALSO budgeted to spend itself if the `icon-off-orbit` token fires, since it is
# deliberately un-tolerated so the sweep can measure it - in that case the run reports
# PARSEK-FAIL(anomaly) on both attempts, and that is a pre-registered outcome priced here
# rather than discovered.
policy = "once"

[expectedFail]
bugId = ""
