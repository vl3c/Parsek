# =====================================================================================
# V20T: THE TRACKING-STATION OBSERVATION OF A LOOPED **KERBIN ARRIVAL** - the TS half of
# the V20 pair, and the first TS loop subject whose recording arrives at KERBIN FROM
# ANOTHER PLANET.
#
# ITS SUBJECT EXISTS AND WAS FLOWN BEFORE THIS SPEC WAS WRITTEN.
# `B29-jool-kerbin-return` FLIGHT 3 came back PASS attempt 1 on 2026-08-27 (MISSION-OK,
# wall 2,103 s, all eight assertions met), and its produced save is the committed
# `fixtures/saves/kerbin-return-recorded` harvest. So there is no `PENDING_FIXTURE_LANES`
# exemption here and no zero tree id: EVERY number below is read off those bytes, and the
# ones that are arithmetic say so.
#
# NOTHING IN THIS FILE IS ARMED. It is a READING-RUN spec: no `gating = true` anywhere,
# no routing token in `required`, every window derived rather than measured. **THIS LANE
# HAS NEVER FLOWN.**
#
# ---------------------------------------------------------------------------------
# WHY THE STEP CHAIN LOOKS LIKE THIS - V5's precondition, unchanged and still binding.
# MissionConfig, StartLoopPlayback and TimeJump are ALL `RequiresFlight` in
# `TestCommandDispatcher.Preconditions`: in TRACKSTATION each would DEFER `not-in-flight`
# until its budget expired and the run would die on a timeout having armed nothing. So
# arming and clock work happen in FLIGHT, are PERSISTED, and only then re-entered in TS:
#   FLIGHT: kill the entry stub -> arm tracers -> MissionConfig (loop ON)
#           -> StartLoopPlayback -> ONE TimeJump into the cycle-1 Kerbin arrival coast
#   SaveGame (persists the armed MissionStore state AND the jumped clock; ghost
#             ProtoVessels are stripped by GhostMapPresence.StripFromSave)
#   TRACKSTATION: LoadGame scene=trackstation, then the forty-tick dwell block.
# There is no shorter honest chain. The V19T/V17T/V16T/V15T/V14T shape is reproduced
# VERBATIM in SHAPE - same verbs, same order, same re-kill pair - and only the tree id,
# the one jump UT and the pinned body differ.
#
# THE RE-KILL PAIR BEFORE THE TS LOAD IS NOT BELT-AND-BRACES: V5 run 1 attempt 1 died
# there on `reject cmd=LoadGame reason=recording-active`, because the scene-entry
# promotion recorder RE-ARMS on some entry orderings and not others. Running the pair
# immediately before the load the guard rejects is the only placement that makes the
# outcome deterministic.
#
# =====================================================================================
# 1. THE SUBJECT, MEASURED OFF THE COMMITTED BYTES
# =====================================================================================
#   tree id      = 6c0002fea2134f688e2c3e9252026543   ("Duna Rocket", persistent.sfs)
#   recording id = 6d171d14ef474fbf95c69ada863bda12   (ONE member, ONE .prec sidecar)
#   save UT      = 60,393,898.254155263
#   POINT span   = 27,787,321.159510821 -> 60,393,894.394154631 (32,606,573.234643809 s)
# **THE UNIT DOES NOT USE THE POINT SPAN.** The loop unit uses the TRACK_SECTION
# envelope, and the trap is DERIVED FRESH for this subject rather than inherited:
#   ut0     = **27,787,321.139510822**  (0.020000000 s BEFORE the first POINT)
#   spanEnd = **60,393,896.914155044**  (**2.520000413 s PAST** the last POINT)
#   spanDur = **32,606,575.774644222 s** (2.540000413 s longer than the POINT span)
# V17M measured 0.020 / 1.060 s on its own subject and V19M 0.020 / 1.360 s on its own,
# so the deltas are a property of the SURFACE and must be re-measured per subject rather
# than copied. Anything sized against the POINT span is short by 2.520 s at the tail end.
# NOTE THE TWO POINT COUNTS ARE DIFFERENT SURFACES AND BOTH ARE RIGHT: the sidecar
# carries **749** POINT nodes while the `.sfs` metadata the C# codec writes reads
# `pointCount = 739`. Nothing below pins either.
#
# **EIGHTEEN ORBIT_SEGMENTs, every one `isPredicted=False`**, Jool 0-4 then Sun 5-13 then
# Kerbin 14-17, so exactly TWO body-change seams:
#   seg#4  end / seg#5  start = **36,198,519.425954551**  (the Jool->Sun seam)
#   seg#13 end / seg#14 start = **60,366,070.331327148**  (the SUN->KERBIN ARRIVAL seam)
#   seg#16 Kerbin arrival coast 60,366,107.016874090 -> 60,392,908.239061728
#   seg#17 end                  60,393,505.214090839     <- THE LAST ORBIT SOURCE
#   segment-less tail           60,393,505.214 -> 60,393,896.914  (**391.700 s**; the
#                               206.300 s `env=1` capture burn sits inside it)
# The Kerbin conics are HYPERBOLIC (sma -392,274.880 m, ecc 2.7877, inc 16.4427 deg) -
# the approach hyperbola - because the capture burn fires AFTER the last ORBIT_SEGMENT
# ends. The Kerbin-frame stretch of the recording is **27,826.582828 s** long.
#
# **42 TRACK_SECTIONs**, counted off the committed sidecar: **24 at `ref=0`** (Absolute,
# point-carrying) and **18 at `ref=2`** (`TrackSection.ReferenceFrame.OrbitalCheckpoint`,
# one wrapping each ORBIT_SEGMENT), and **ZERO at `ref=1`** - so no Relative-frame
# resolution anywhere in this subject. The `ref=2` sections are exactly the ones that
# carry an orbit SOURCE, which is the surface section 3's jump placement and section 5's
# init-walk question both turn on.
# **THE PARKED TAIL IS SEGMENT-LESS.** That is the B25/V16M/V19M shape, and it is the
# exact shape V17T run 1 measured a TS init walk doing something specific with - section 5.
#
# =====================================================================================
# 2. THE LOOP CLOCK, AND WHY THIS LANE SELF-OVERLAPS BY A FACTOR OF 54,344
# =====================================================================================
# Cadence is `Auto` -> `max(spanDur, LoopTiming.MinCycleDuration = 5.0)` = spanDur. The
# per-instance launch cadence is then
#   ComputeEffectiveLaunchCadence(30.0, spanDur, 20)
#     = max(ParsekSettings.autoLoopIntervalSeconds default 30.0, spanDur / 20)
#     = **1,630,328.788732211 s**        <- THE CAP DOMINATES BY 54,344x
# (`GhostPlayback.MaxOverlapMissionInstances = 20`,
# `LoopTiming.DefaultLoopIntervalSeconds = 30.0`, `LoopTiming.MinCycleDuration = 5.0`,
# all in `Source/Parsek/ParsekConfig.cs`.)
#
# So the loop SELF-OVERLAPS - up to 20 concurrent instances launched 1,630,328.8 s apart
# - and because `overlapCadence` is EXACTLY `spanDur / 20`, instance 21 is exactly one
# span after instance 1. That is V17M's identity, third subject.
# **THIS IS BY FAR THE LONGEST-SPAN LOOP SUBJECT THE PROGRAM HAS CARRIED**: 32,606,575.8 s
# is 3.54 Kerbin years and 2,719x V19T's 11,991.8 s span. Section 4 is where that changes
# what the forty-tick dwell has to buy.
#
# THE ANCHOR IS THE ONE SEEDED NUMBER IN THIS FILE AND IT IS NOT A BYTE FACT. With
# phase-lock skipped the anchor is "the UT the loop was enabled at"; the save restores UT
# **60,393,898.254155263** and a handful of fast seam verbs run at 1x before
# `MissionConfig`, so the seed is
#   **A ~ 60,393,900 (+/- 3 s)**   i.e. saveUT + 1.746 s
# The line that re-pins it is `startloopplayback initiated: relaunchUt=`, which is
# required below for exactly that reason.
# **THE PAIR WILL NOT SHARE AN ANCHOR AND THAT IS EXPECTED, NOT A DEFECT.** V19M and
# V19T measured 28,829,021.194 and 28,829,020.914 on ONE fixture - 0.280 s apart -
# because their FLIGHT phases run a different count of fast verbs before `MissionConfig`.
# A seeded anchor is a per-run quantity, not a fixture constant. **THE TWO LANES STILL
# OBSERVE THE SAME JUMP UT, WHICH IS WHAT THE PAIR IS FOR.** A 3 s anchor error moves the
# ghost's replay clock by 3 s against margins of 8,039.888 s and 8,636.863 s at the one
# jump (section 3) - 0.037% of the nearest one.
#
# =====================================================================================
# 3. THE ONE JUMP, AND WHY IT IS THE COAST-DWELL EPOCH RATHER THAN THE TAIL
# =====================================================================================
#   cycle-1 relaunch  R1 = A + 1 * 1,630,328.788732211 = **62,024,228.788732**
#   **THE JUMP        R1 + 32,597,547.211               = 94,621,776**
#
# IT IS V20M's CYCLE-1 COAST-DWELL EPOCH, REUSED VERBATIM, so the two lanes observe the
# SAME INSTANT from the two scenes. That is the whole reason a pair is authored as a pair
# rather than as two specs about one fixture: any difference the reading turns up is then
# a SCENE difference, because the clock is byte-identical.
#
# **AND THE EPOCH IS CHOSEN TO LAND INSIDE THE KERBIN ARRIVAL COAST SEGMENT, WHERE AN
# ORBIT SOURCE EXISTS.** The replay shift is `R1 - ut0` = **34,236,907.649221 s**, so
# seg#16 replays over
#   [**94,603,014.666**, **94,629,815.888**]
# and 94,621,776 sits **70.0018% through it**, **8,039.888 s** inside its far end and
# **8,636.863 s** short of the replayed segment-less tail onset at 94,630,412.863.
# THE SEEDED ALTERNATIVE from V20M's own table - the TAIL READ at R1 + 32,606,430.211 =
# 94,630,659 - falls inside the replayed SEGMENT-LESS tail. **THIS LANE DOES NOT TAKE
# IT**, deliberately: a TS lane whose whole anti-vacuity duty is "a ghost was materialized
# in a KERBIN frame" must not park its single observation on the one stretch of the
# recording that carries no orbit source at all. Section 1 records that tail as a measured
# property of the subject and section 5 records what it may do to the init walk; parking
# ON it is a different experiment and it is not this one.
#
# THE JUMP IS STRICTLY FORWARD, and the delta is DERIVED rather than measured: the
# restored clock is 60,393,898.254 and `StartLoopPlayback` first advances it to about
# `R1 - 15` = 62,024,213.789 (the product's `FastForwardToEventUT` targets the relaunch
# epoch MINUS 15 s, which V19T MEASURED on its own run), so the TimeJump's own forward
# delta is about **+32,597,562.2 s**. Both the raw +34,227,877.7 s from the restored
# clock and the post-warp figure are strictly forward and the conclusion is unchanged;
# the smaller one is the one a reader should use.
# **A NON-FORWARD JUMP ANSWERS `REJECTED` WITH REASON `backward-jump`, AND THAT REDS THE
# STEP**: `ParsekTestCommandAddon.TimeJumpKscAction.cs:55-57` logs the Warn AND calls
# `SetExecResult("REJECTED", null, "backward-jump")`, and this step carries
# `expect = "OK"`, so the step goes unmet and the run is driver-INVALID on both attempts.
# The forbid below is a redundant grep-stable marker of that catch, kept for family
# convention. The case NOTHING catches is a jump that lands FORWARD at the WRONG epoch:
# read `anchorUt=` and `relaunchUt=`.
#
# **ONE COST NO PRIOR V-T LANE CARRIED.** This single jump traverses **34.23 Ms of game
# time** (about 3.7 Kerbin years) in one instantaneous `Planetarium` clock set, and KSP
# must on-rails-propagate every vessel and SpaceObject in the produced save across it -
# including the asteroid and the two debris vessels the save carries. That cost is
# UNMEASURED at this magnitude. The step budget is a 300 s watchdog; if the run dies
# there rather than on a verdict, THAT is the reading and the fix is a budget, not a
# re-seeded jump.
#
# =====================================================================================
# 4. THE FORTY-TICK TS DWELL IS SPAWN-THROTTLE HEADROOM, AND ON THIS SUBJECT IT IS
#    LOAD-BEARING IN A WAY IT WAS NOT ON V19T
# =====================================================================================
# V16M's forty-tick block exists to push a SECOND census emission past a 5.0 s
# VerboseRateLimited window. **THAT IS NOT WHY IT IS HERE**, and copying it for that
# reason would be copying a number without its argument. V17T run 1 (2026-08-20_1917)
# measured the real mechanism on a self-overlapping TS subject:
#
#   overlap-instance creation runs **NEWEST-CYCLE-FIRST** at
#   `GhostPlayback.MaxSpawnsPerFrame = 2` per lifecycle tick, so the OLDEST live cycle
#   spawns LAST. Its two-tick TS phase gave the scene ~0.65 s = 3 ticks = 6 ghosts
#   (cycles 14-19) and FlushAndQuit ended the scene before cycle 1's turn - **6 of 20**.
#   The SAME epoch in the FLIGHT phase created all 20, so the pin was satisfiable; the
#   scene simply had to live long enough.
#
# THE ARITHMETIC FOR THIS SUBJECT, with its inputs named because it is arithmetic and not
# a measurement. Instance k is alive at the observation epoch when `(t - A) - k*pitch`
# lies in [0, spanDur]; at t = 94,621,776 that resolves to **k = 1..20**, i.e. all twenty
# have launched and none has expired. A KERBIN-framed instance is one whose replay offset
# exceeds the 32,578,749.192 s arrival-seam offset, and since the Kerbin window is only
# **27,826.583 s** against a **1,630,328.8 s** pitch - the pitch is **58.6x WIDER than the
# window** - **AT MOST ONE INSTANCE CAN EVER BE KERBIN-FRAMED.** The derived census is:
#     **Kerbin 1 / Sun 14 / Jool-escape 3 / Jool-park 2**
# and the Kerbin one is **INSTANCE 1, THE OLDEST - THEREFORE THE VERY LAST TO SPAWN**
# under newest-first ordering. At 2 per tick it appears at about **tick 10 of 10**, i.e.
# dead last. **FORTY RecordingState ticks (>= 10 wall s at run.py's 0.25 s poll floor,
# V16M's proven sizing) is ~4x that.**
#
# **AND THAT IS WHY THIS BLOCK IS LOAD-BEARING HERE IN A WAY IT WAS NOT ON V19T.** V19T's
# subject had EIGHT Jool-framed instances spread through the spawn order, so a short TS
# phase that read only 6 of 20 would still probably have caught one. **HERE THERE IS
# EXACTLY ONE, AND IT SPAWNS LAST.** A TS phase cut off at 6 of 20 - the V17T measurement,
# on this exact throttle - would read six Sun-framed and Jool-framed ghosts and MISS THE
# ARRIVAL-LEG INSTANCE ENTIRELY, and the `body=Kerbin` pin would go unmet with no other
# error in the log. The dwell is the whole reason the pin is reachable.
# THE EXACT LIVE COUNT IS A READING this run reports rather than a number pinned anywhere
# below (V19T measured 37 ghosts on its own dwell, against 20 instances, because the
# lifecycle also re-materializes; nothing here predicts that number).
#
# =====================================================================================
# 5. THE TS INIT WALK - BOTH READINGS PRE-REGISTERED, NEITHER GATED
# =====================================================================================
# V14T/V15T/V16T all required `ParsekTrackingStation initialized: created [1-9][0-9]*
# ghost vessel\(s\)` as their TS anti-vacuity gate. V17T RETIRED it, because run 1
# measured init-ZERO as the CORRECT product outcome on its subject: with the loop armed,
# the init walk evaluates the BASE recording at the entry epoch and skips it `noOrbit=1`
# when the recording's tail is segment-less (no visibleSegment / terminalOrbit /
# endpointTail / stateVector source resolves), and every real ghost then comes from the
# per-lifecycle-tick DYNAMIC overlap path instead. V19T then measured the OPPOSITE -
# `created 1` with `noOrbit=0` and `visibleSegment=1` - on a subject whose jump landed
# inside a segmented coast.
#
# **THIS SUBJECT SITS ON BOTH SIDES OF THAT, EXACTLY AS V19T's DID.** Its parked tail IS
# segment-less (section 1) - the same shape V17T measured init-zero on - but this lane's
# jump lands INSIDE the replayed Kerbin arrival coast (section 3), where an orbit source
# demonstrably exists. Whether the init walk finds one AT THE ENTRY EPOCH depends on which
# clock it evaluates the base recording against, and that is GENUINELY OPEN at this
# subject:
#
#   READING A - INIT-ZERO. The walk reads the base recording on its OWN unshifted
#     timeline, where the entry epoch is 34,227,879 s past the recording's end and the
#     only candidate source is the segment-less tail. V17T's measurement.
#   READING B - INIT-NONZERO. The walk reads the loop-shifted clock, where the entry
#     epoch is 70% through a real Kerbin ORBIT_SEGMENT and a source resolves cleanly.
#     V19T's measurement, on a subject shaped the same way this one is.
#
# **B IS THE RANKED PREDICTION** on the V19T precedent, and it is deliberately NOT gated:
# a ranking over two enumerated readings is not a measurement. THE LINE THAT SETTLES IT:
# `ParsekTrackingStation initialized: created N ghost vessel(s)` against the walk's own
# `noOrbit=` skip counter on the same boot. **NEITHER READING IS GATED** - the init line
# is neither required nor forbidden, and the anti-vacuity duty is carried entirely by the
# two DYNAMIC-path tokens, which an empty tracking station cannot satisfy in either world.
# **AND `created 0 ghost vessel\(s\)` IS THEREFORE NOT IN `forbidden`**, exactly as it was
# not on V19T's own reading run: a forbid on the init line would gate one branch of a
# question this spec declares open. If the run measures `created 1`, the S1.4 rule says
# arm the bare token WITH the run that shows it - at the arming pass, not here.
#
# =====================================================================================
# 6. THE PRE-REGISTERED ANOMALY, AND WHAT THIS LANE ADDS TO THE FAMILY
# =====================================================================================
# `docs/dev/todo-and-known-bugs.md` -> MAPRENDER-ICON-OFF-ORBIT-CREATION-FRAME-AFTER-JUMP.
# THE HISTORY, STATED EXACTLY:
#   * `icon-off-orbit` on the ghost-proto CREATION frame fired on **ALL SIX RUNS** of
#     V14T, V15T and V16T, at THREE parents (Duna/Ike 94.05 deg, Eve/Gilly 26.49,
#     Jool/Laythe 129.15), while the stepped-bracket V14M/V15M/V16M controls stayed
#     silent on all six of theirs. V16T additionally measured the first count > 1.
#   * **V17T BROKE THE STREAK** (self-overlapping YES, nested-SOI YES: silent), and
#     **V19T NARROWED IT** (self-overlapping YES, nested-SOI NO: silent), which EXCLUDED
#     nested-SOI as the cause and left SELF-OVERLAP as the surviving candidate - present
#     in both silent cases, absent in all six raising ones. **NO MECHANISM WAS CLAIMED**
#     and the honest qualifier stands: a third variable nobody has named would defeat it.
#
# **WHAT THIS LANE ADDS IS A THIRD, MUCH MORE EXTREME POINT ON THE SELF-OVERLAP AXIS.**
# V17T and V19T were both self-overlapping at a pitch of `span/20` where the span was
# ~12 ks. Here the same ratio holds but the span is 32.6 Ms, so the instances are spread
# **2,719x further apart in recorded time** and only ONE of twenty is destination-framed
# (section 4). If self-overlap really is what suppresses the trigger, silence here is a
# third confirmation at an extreme parameter value; **if it RAISES here, self-overlap
# alone is not sufficient and the surviving candidate falls too**, which would reopen the
# family entry to a variable nobody has yet named. Either outcome is a real reading.
# HONEST QUALIFIER, inherited unchanged: that is a RANKING over enumerated candidates,
# not a proof.
#
# **SO THIS LANE SHIPS `allowedAnomalies = []` ON PURPOSE AND GATES ON NEITHER OUTCOME.**
# Pre-tolerating the token would swallow the only measurement this pair can make about the
# family; a PARSEK-FAIL(anomaly) with every step green is a pre-registered correct catch,
# and a clean sweep is an equally load-bearing reading. If it fires, arm the BARE token
# WITH the run that shows it (the S1.4 rule), and note V16T's reading already moved the
# deferred ceiling from `maxCount = 1` to 2.
#
# =====================================================================================
# 7. POSTURE - READING RUN, NOTHING ARMED
# =====================================================================================
# `required` is TEN tokens, V19T's set with the body swapped. The re-aim trio and every
# phase-lock artifact stay OUT of BOTH lists, for V19M's reason and for a sharper one
# here: this pair is where the INBOUND interplanetary routing is READ, and V20M's header
# section 2 walks the classifier to a decline string - `transfer departs from a
# heliocentric parking orbit or mid-course correction (deferred); staying faithful` - that
# NO COMMITTED LANE HAS EVER PRINTED, reached only because this is the FIRST subject whose
# arrival scan succeeds at all. Requiring or forbidding any of those tokens would gate on
# an answer this pair exists to measure. `factory chain rec=... reaimed=True|False` is the
# single sharpest discriminator and is therefore left UNREQUIRED and UNFORBIDDEN. (If you
# grep for it, grep `reaimed=` ALONE: `MapRender/PhaseFactory.cs:118` interposes
# `window=[...]` between `reaimed=` and `faithfulFallback=`, so a longer literal quote
# matches nothing and reads like "no factory chain line at all".)
#
# The PROTO-ORBIT-LINE pin that coverage criterion (a) owes this subject
# (`docs/dev/autotest-roadmap.md` -> "The loop-render coverage program" -> "Confirmation
# criteria" -> (a)) belongs to V20M and is deliberately NOT duplicated here, so the pair
# cannot drift. **THE LENS DECISION ITSELF IS V20M's HEADER SECTION 5 AND IT IS THE MOST
# IMPORTANT DERIVATION IN THE PAIR**, so its conclusion is restated once here because this
# lane's own pin depends on it: the visited set {Jool, Sun, Kerbin} LOOKS nested (the Sun
# has TWO visited children) and is NOT, because `NestedSoiSubtree.FindNestedRoot`
# (`NestedSoiSubtree.cs:202-219`) requires the shared parent to be NON-ROOT and detects
# the root both when the delegate reports its parent as null and when it reports it as
# ITSELF (live KSP `Sun.referenceBody == Sun`). The comment at `:212-214` names this exact
# shape - live `["Kerbin","Sun","Duna"]`, the mirror of ours - as the reason that guard
# exists. So there is NO fail-closed root-frame render here, the proto lenses are intact,
# and a `body=Kerbin` pin is structurally satisfiable rather than unsatisfiable the way
# V17T/V17M's `body=Vall` was. This lane's TS anti-vacuity is the two dynamic-path tokens
# in section 5's sense - the overlap-instance creation line and the ProtoIcon body frame.
#
# **NOTHING IS ARMED.** `[expectations.rewind]` and `[expectations.recordings.structure]`
# are REPORT-ONLY, `[expectations.recordings] count` is deliberately WIDE at {1,3} (TWO
# splittable body-change seams, not one), `created 0 ghost vessel\(s\)` is NOT forbidden
# (section 5), and no D11 cell is claimed. The arming pass belongs to a future commit
# written off THIS lane's OWN green reading run, never off B29's producer-side numbers -
# that is the S4.1 rule, and V5's rule that a DOUBLE-ENTRY spec owes the tighter pin is
# what will make the rewind arm worth most here: this spec writes a save mid-run and reads
# it back through a SECOND scene load, the shape in which a stray durable write is easiest
# to miss.
#
