kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # Kill the scene-entry auto-recorder. HARD precondition, not hygiene: the SECOND
  # LoadGame below is REJECTED `recording-active` by the dispatch guard if a recorder is
  # live, and SaveGame would persist a half-recorded stub into the save the TS half then
  # reads.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # mapRenderTracing arms the map/TS tracer + probe; verboseLogging is LOAD-BEARING (the
  # Tier-B truth lines are Verbose - the V1 lesson); ghostRenderTracing is carried because
  # `[expectations.renderComposition]` requires all three of a declarer and because the
  # manifest's seam capture is tracer-gated (V14T's precedent, the first TS-host
  # manifest). Settings are process-global, so all three survive the LoadGame into TS.
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # ARM (FLIGHT-only): the production MissionStore.SetLoopEnabled path. THIS is where an
  # INBOUND INTERPLANETARY tree either reaches ApplyReaim or does not - V20M's header
  # section 2 walks the classifier all the way to the partial-transfer departure gate,
  # which is the deepest any committed subject has ever reached. TREE ID read off the
  # harvested fixture's RECORDING_TREE node.
  { cmd = "MissionConfig", args = { tree = "6c0002fea2134f688e2c3e9252026543", loop = "true" }, expect = "OK" },
  # WARP TO CYCLE 1's LAUNCH (FLIGHT-only): an instantaneous Planetarium clock set. Its
  # `relaunchUt=` echo is the number the whole seed table hangs off (section 2).
  { cmd = "StartLoopPlayback", args = { tree = "6c0002fea2134f688e2c3e9252026543" }, expect = "OK", budget = 300 },
  # THE ONE JUMP (FLIGHT-only): V20M's cycle-1 COAST-DWELL epoch, reused VERBATIM so the
