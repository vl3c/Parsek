# 8. THE NEGATIVE CONTROL owed by coverage criterion (b) - **NOT YET FLOWN**
# =====================================================================================
# Criterion (b) requires the control to invert a REQUIRED **RENDER** TOKEN. The standing
# shared inversion every pre-V19 pair used - a temporary `rewind.supersedeRows` minimum -
# proves the `saveParse` EVALUATOR can red and proves nothing about whether the render
# pins can.
#
# THE INVERSION, pre-registered here so it cannot be written after the fact. One
# character-run inside ONE array and nothing else changed - no step, no jump, no budget,
# no setting:
#
#     [expectations.logContracts].required
#         phase=GhostCreated surface=ProtoIcon pid=\d+ .*body=Kerbin scene=TRACKSTATION
#     becomes
#         phase=GhostCreated surface=ProtoIcon pid=\d+ .*body=Duna scene=TRACKSTATION
#
# `Duna` because this recording never visits it (the eighteen ORBIT_SEGMENTs are Jool,
# Sun and Kerbin only), this lane never enters its SOI, and it is a SIBLING PLANET of both
# the origin and the destination - so the inverted token reds precisely because the render
# never puts this ghost in a Duna body frame.
#
# **THE PAIR MUST RUN TWO CONTROLS, NOT ONE SHARED.** V20M inverts
# `surface=ProtoOrbitLine ... body=Kerbin` on the flight map; this lane inverts
# `surface=ProtoIcon ... scene=TRACKSTATION`. The halves pin DIFFERENT LENSES, so a single
# shared inversion would have proven exactly one of them. That is the V19 pair's own
# lesson, applied from the start rather than discovered.
# **AND A CONTROL THAT PASSES IS A FAILED CONTROL, NOT A GOOD SIGN** - V19T's
# `2026-08-21_0857` was attempted as one and PASSED because a mis-escaped regex in the
# editing script silently made no edit, so what flew was the unmodified spec. Verify the
# edit landed before crediting the run.
#
