# 9. SCOPE LIMIT - THE KSC THIRD IS NOT THIS LANE'S AND IS NOT SETTLED BY IT
# =====================================================================================
# `docs/dev/autotest-roadmap.md` -> G2 states the bar as "destination-frame render tokens
# at derived epochs on the flight map, the TS, and the KSC host". **THIS LANE OWNS THE TS
# THIRD AND V20M OWNS THE FLIGHT-MAP THIRD.** The KSC third is `V20K`, reserved BY THAT
# NAME by the roadmap's G2 correction over exactly these bytes.
#
# **AND UNLIKE B28's SUBJECT, THE KSC QUESTION HERE IS OPEN RATHER THAN CLOSED - WHICH IS
# PRECISELY WHY NOTHING MAY BE WRITTEN UP ABOUT IT YET.** `ParsekKSC.Playback` hard-gates
# every point and every segment on `bodyName != "Kerbin"` with skip reason `non-kerbin`
# (`ParsekKSC.Playback.cs:288-297` and `:362-372`), and one level above that
# `ParsekKSC.IsKscStructurallyEligible` (`ParsekKSC.cs:1488`) rejects a recording OUTRIGHT
# on `rec.Points[0].bodyName != "Kerbin"` - **the FIRST point, not the arrival body**.
# MEASURED on the committed sidecar: this recording's first POINT reads `body = Jool`
# (the Jool park it departs from), so the outright-rejection gate LOOKS like it fires
# here too - but this is also the first recording in the corpus that HAS Kerbin-bodied
# points at all (56 of them in the final section alone), which is a genuinely different
# input to the playback gate than B28's zero-occurrences-of-`Kerbin` subject presented.
# **WHETHER THAT MATTERS IS A V20K MEASUREMENT AND NOT A V20M/V20T ONE. UNDER
# CONFIRMATION CRITERION (c) NO LIMITATION MAY BE WRITTEN UP BEFORE A V20K RUN EXISTS**,
# so this pair claims exactly two of G2's three hosts and asserts nothing about the third.
# Two green armed V20 runs are NOT G2 closed.
