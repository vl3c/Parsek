description = "**THE TRACKING-STATION HALF OF THE V20 PAIR - THE FIRST TS LOOP SUBJECT THAT ARRIVES AT KERBIN FROM ANOTHER PLANET - AUTHORED OFF HARVESTED BYTES AND NOT YET FLOWN.** READING-RUN POSTURE: nothing armed, no `gating = true` anywhere, no routing token in `required`, every window derived rather than measured. Its subject was flown first: `B29-jool-kerbin-return` FLIGHT 3 (2026-08-27, PASS attempt 1, MISSION-OK, wall 2,103 s), harvested as `kerbin-return-recorded` - tree 6c0002fea2134f688e2c3e9252026543 (\"Duna Rocket\"), ONE recording 6d171d14ef474fbf95c69ada863bda12, save UT 60,393,898.254155263, **EIGHTEEN non-predicted ORBIT_SEGMENTs (Jool 0-4, Sun 5-13, Kerbin 14-17) and therefore TWO body-change seams** at 36,198,519.425954551 (Jool->Sun) and **60,366,070.331327148 (the SUN->KERBIN arrival)**, plus **42 TRACK_SECTIONs - 24 `ref=0` Absolute, 18 `ref=2` OrbitalCheckpoint (one per ORBIT_SEGMENT), ZERO `ref=1`**, so no Relative-frame resolution anywhere and the `ref=2` sections are exactly the ones carrying an orbit SOURCE. The Kerbin conics are HYPERBOLIC (sma -392,274.880 m, ecc 2.7877, inc 16.4427) because the capture burn fires AFTER the last ORBIT_SEGMENT ends at 60,393,505.214090839, leaving a **391.700 s SEGMENT-LESS parked tail** with the 206.300 s `env=1` capture burn inside it; the Kerbin-frame stretch of the recording is **27,826.583 s** long. The sidecar carries 749 POINT nodes against the `.sfs` `pointCount = 739`; both are right and neither is pinned. **THE SPAN-END TRAP IS RE-DERIVED FRESH RATHER THAN INHERITED**: POINT span [27,787,321.159510821, 60,393,894.394154631] = 32,606,573.234643809 s, but the unit uses the TRACK_SECTION envelope [**27,787,321.139510822**, **60,393,896.914155044**] = **32,606,575.774644222 s** - ut0 0.020 s BEFORE the first POINT and spanEnd **2.520 s PAST** the last (V17M measured 0.020 / 1.060 and V19M 0.020 / 1.360 on their own subjects, so the deltas belong to the surface and must be re-measured per subject). Cadence is Auto -> spanDur; `ComputeEffectiveLaunchCadence(30.0, spanDur, 20)` = **1,630,328.788732211 s**, so the 20x cap dominates `DefaultLoopIntervalSeconds` by **54,344x**, up to 20 concurrent instances run 1,630,328.8 s apart, and instance 21 lands exactly one span after instance 1. **THIS IS BY FAR THE LONGEST-SPAN LOOP SUBJECT THE PROGRAM HAS CARRIED - 3.54 Kerbin years, 2,719x V19T's span.** The ONE seeded number is the anchor: **A ~ 60,393,900 (+/- 3 s)**, i.e. saveUT + 1.746 s; the pair will NOT share it and that is expected, since V19M and V19T measured 0.280 s apart on ONE fixture because their FLIGHT phases run a different count of fast verbs before `MissionConfig` - the two lanes still observe the SAME JUMP UT, which is what the pair is for. **THE ONE JUMP IS 94,621,776 = V20M's cycle-1 COAST-DWELL epoch reused VERBATIM** so the two lanes observe the same instant from the two scenes: with R1 = 62,024,228.788732 the replay shift is 34,236,907.649221 s, seg#16 replays over [94,603,014.666, 94,629,815.888], and the jump sits **70.0018% through it, 8,039.888 s inside its far end and 8,636.863 s short of the replayed segment-less tail onset at 94,630,412.863**. The seeded TAIL READ at 94,630,659 is deliberately NOT taken: a TS lane whose anti-vacuity duty is a materialized Kerbin-frame ghost must not park its single observation on the one stretch carrying no orbit source. The jump is strictly forward (about +32,597,562 s at the verb, because StartLoopPlayback has already advanced the clock to ~R1 minus 15 s - the `FastForwardToEventUT` offset V19T measured). **THE FORTY-TICK TS DWELL IS SPAWN-THROTTLE HEADROOM AND ON THIS SUBJECT IT IS LOAD-BEARING IN A WAY IT WAS NOT ON V19T.** V17T run 1 measured overlap-instance creation running NEWEST-CYCLE-FIRST at `MaxSpawnsPerFrame = 2` per lifecycle tick, so the OLDEST live cycle spawns LAST, and its two-tick TS phase was cut off at 6 of 20 before cycle 1's turn. Here all twenty instances are alive at the observation epoch, but the Kerbin window is **27,826.583 s of a 32,606,575.8 s span (0.0853%)** against a launch pitch **58.6x wider than the window**, so **AT MOST ONE INSTANCE CAN EVER BE KERBIN-FRAMED** - the derived census is **Kerbin 1 / Sun 14 / Jool-escape 3 / Jool-park 2** and the Kerbin one is INSTANCE 1, the OLDEST, therefore THE VERY LAST TO SPAWN, arriving about tick 10. **A TS phase cut off at 6 of 20 would miss the arrival-leg instance entirely and the `body=Kerbin` pin would go unmet with no other error in the log**; forty ticks (>= 10 wall s at run.py's 0.25 s poll floor, V16M's proven sizing) is ~4x the headroom that needs, and the exact live count is a reading this run reports rather than a number pinned anywhere. **THE TS INIT WALK IS PRE-REGISTERED IN BOTH DIRECTIONS AND GATED IN NEITHER**: READING A is init-ZERO (V17T's measurement on a segment-less-tail subject) and READING B is init-NONZERO (V19T's, on a jump landing inside a segmented coast). This subject sits on both sides - segment-less tail, but a jump inside the Kerbin arrival coast - so **B is the RANKED prediction and deliberately not a gate**, and `created 0 ghost vessel(s)` is correspondingly NOT in `forbidden`, exactly as it was not on V19T's own reading run; the S1.4 rule says arm it WITH the run that shows `created 1`, at the arming pass. **THE `icon-off-orbit` FAMILY GETS A THIRD, MORE EXTREME POINT.** V14T/V15T/V16T raised it on 6 of 6 runs at three parents (self-overlapping NO, nested-SOI NO); V17T was silent (YES/YES); V19T was silent (YES/NO), which EXCLUDED nested-SOI and left SELF-OVERLAP as the surviving candidate with no mechanism claimed. This lane is self-overlapping at the same `span/20` ratio but with instances spread **2,719x further apart in recorded time** and only ONE of twenty destination-framed: silence is a third confirmation at an extreme parameter value, and **a RAISE would show self-overlap alone is not sufficient and knock out the surviving candidate too**. Either outcome is a real reading, so `allowedAnomalies` STAYS EMPTY and neither outcome is gated. TEN required tokens, V19T's set with the body swapped, including the two R12 route lines and the two dynamic-path anti-vacuity gates (`GhostMap] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION` and `phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Kerbin scene=TRACKSTATION`). **THAT SECOND PIN IS STRUCTURALLY SATISFIABLE AND THE ARGUMENT IS V20M's HEADER SECTION 5, RESTATED ONCE HERE BECAUSE THIS LANE DEPENDS ON IT**: the visited set {Jool, Sun, Kerbin} LOOKS nested (the Sun has TWO visited children) and is NOT, because `NestedSoiSubtree.FindNestedRoot` (`NestedSoiSubtree.cs:202-219`) requires the shared parent to be NON-ROOT and detects the root both when its parent reports null and when it reports ITSELF (live KSP `Sun.referenceBody == Sun`) - and the comment at `:212-214` names live `[\"Kerbin\",\"Sun\",\"Duna\"]`, the exact mirror of our sequence, as the reason that guard exists. So there is no fail-closed root-frame render, the proto lenses are intact, and a `body=Kerbin` pin is satisfiable rather than unsatisfiable the way V17T's `body=Vall` was. FORBIDDEN IS THREE - the ERROR floor, the parity over-tolerance pin, and the backward-jump marker, which is a REDUNDANT grep-stable echo rather than a load-bearing guard because `SetExecResult(\"REJECTED\", null, \"backward-jump\")` makes the STEP itself go unmet and the run driver-INVALID. **ONE COST NO PRIOR V-T LANE CARRIED**: the single jump traverses 34.23 Ms of game time (~3.7 Kerbin years) in one instantaneous `Planetarium` clock set, and KSP must on-rails-propagate every vessel and SpaceObject in the save - including an asteroid and two debris vessels - across it; that cost is UNMEASURED at this magnitude, so a death on the 300 s step watchdog is a READING about propagation cost rather than a calibration failure. `[expectations.recordings] count` is WIDE at {1,3} because there are TWO splittable candidates; the code-read prediction is COHESION at both, and the Sun->Kerbin seam is the **FIRST in the corpus to depend on `ShouldKeepCohesiveCrossBodyExoCoast`'s SECOND disjunct** (left side `env=1` ExoPropulsive, right side `env=2` ExoBallistic, so only the on-rails clause - both sides `ReferenceFrame.OrbitalCheckpoint` - keeps it whole). THE NEGATIVE CONTROL owed by criterion (b) is pre-registered and NOT yet flown: invert `body=Kerbin` -> `body=Duna` inside the required array only, `Duna` chosen as a sibling planet of both origin and destination that this recording never visits; the PAIR must run TWO controls because the halves pin different lenses; and **a control that PASSES is a FAILED control**, as V19T's `2026-08-21_0857` demonstrated when a mis-escaped regex silently made no edit. **SCOPE LIMIT: THIS LANE OWNS THE TS THIRD OF G2's BAR AND V20M THE FLIGHT-MAP THIRD; THE KSC THIRD IS `V20K` OVER THESE SAME BYTES AND IS OPEN RATHER THAN CLOSED.** `IsKscStructurallyEligible` (`ParsekKSC.cs:1488`) rejects on `rec.Points[0].bodyName != \"Kerbin\"` and this recording's first POINT reads `body = Jool`, so the gate LOOKS like it fires - but this is also the first recording in the corpus that HAS Kerbin-bodied points at all (56 in the final section alone), a genuinely different input to the playback gate than B28's zero-occurrences subject. **Under confirmation criterion (c) no limitation may be written up before a V20K run exists**, so this pair claims exactly two of the three hosts and asserts nothing about the third. NO D11 CELL IS CLAIMED: the routing is what this pair MEASURES, and V20M's header walks the classifier to a decline string no committed lane has ever printed. Retry once."
