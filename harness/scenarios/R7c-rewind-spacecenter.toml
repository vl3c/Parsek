schema = 1
id = "R7c-rewind-spacecenter"
tier = "nightly"
# ROADMAP R7, SPEC 3 OF 3 - the six SPACECENTER-scoped Rewind members, which no
# FLIGHT boot can reach at all.
#
# This is the split the roadmap's R7 entry actually anticipated ("One or two specs
# (split FLIGHT / SPACECENTER)"). It is the CHEAPEST of the three and the most
# certain: five of its six cells build every object they touch in-body, so the
# fixture has one job - land the batch in SPACECENTER - and a vessel-less save does
# that by construction (TestCommandLoadGame.DecideLoadRoute returns
# NoVesselSpaceCenter when the save has no focusable vessel).
#
# WHY IT IS A SEPARATE SPEC AND NOT A THIRD STEP IN ONE: a batch names ONE category
# and runs in ONE scene (hlib.SINGLE_BATCH_SELECTOR_RULE), and the seam has no verb
# that transitions FLIGHT -> SPACECENTER mid-run. R12's `scene=` LoadGame argument
# picks the LANDING scene, not a transition.
description = "Run the in-game Rewind category unattended at SPACECENTER: the unfinished-flight seal-dialog pair (confirm and cancel), the stable-leaf group seal + last-slot reap, and the spanned-recording re-fly launch-row/tombstone cell, and the recovery-bundle re-fly retirement cell - six members that scene-skip in every FLIGHT batch."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "rewind", "spacecenter", "R7", "R7c"]

[fixture]
# fresh-career: zero VESSEL nodes, activeVessel = -1, so DecideLoadRoute takes the
# NoVesselSpaceCenter branch and the batch runs at SPACECENTER. This is the same
# vessel-less shape B10 / L1 / M2 already boot to SPACECENTER, so the route is
# MEASURED rather than assumed - and the `scene=SPACECENTER` token in the pin below
# is what makes a silently-wrong route red instead of passing.
#
# CAREER rather than fresh-sandbox: none of the six cells needs career state, but
# SealPopupConfirmSealsSlotAndClearsLock has a LIVE SIDE EFFECT - clicking "Seal
# Permanently" reaches UnfinishedFlightsGroup's real seal path, which writes through
# GamePersistence.SaveGame - and a career save exercises that write against the same
# ScenarioModule set the product ships. Sandbox would work; career is the stricter
# of the two at identical cost.
#
# injectedRecordings = "rewind-b9", and it exists for exactly ONE of the six
# cells. UnfinishedFlightsRenderingAndNoHide is the only one that does not
# self-set-up: it needs a recording satisfying EffectiveState.IsUnfinishedFlight.
# The first R7 wave shipped this spec with "none" because no preset COULD satisfy
# it - ScenarioWriter emitted no `mergeState` key, so every injected recording
# deserialised to Immutable, and IsUnfinishedFlight's tip predicate
# (`IsSlotEffectiveTipOpen`) admits ONLY CommittedProvisional; Immutable is the
# actively-CLOSED state, not a second open one (the original R7-FIXTURE-GAPS
# entry was one predicate short on this). The generator gap is now closed:
# RecordingBuilder.WithMergeState stamps the field, the production codec emits
# the key, and rewind-b9's slot-1 crashed booster authors CommittedProvisional -
# unit-proven by RewindB9FixtureTests.Inject_CrashedBoosterClassifiesAsOpen-
# UnfinishedFlight, whose negative control (flip the loaded booster back to
# Immutable -> classifies false) shows the authored key is load-bearing.
saveTemplate = "fixtures/saves/fresh-career"
injectedRecordings = "rewind-b9"
craft = []

[driver]
kind = "seam"
# ORDINARY batch path. All six SPACECENTER-scoped Rewind declarations carry
# AllowBatchExecution = true and no restore flag, so the isolated filter admits
# exactly the same six and the arg would be pure decoration - which
# IsolatedBatchWiringGroupTests.test_the_ordinary_path_could_not_run_this_category
# would (correctly) red on.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "Rewind" },                      expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
# HONEST and deliberately thin. SIX cells execute here (the whole SPACECENTER-scoped
# slice of the Rewind category - mechanically: `hlib.parse_ingame_test_declarations`
# over Source/Parsek counts 38 Rewind declarations, 32 FLIGHT and 6 SPACECENTER, and
# all six SPACECENTER ones carry AllowBatchExecution=true). Two of the six drive the
# unfinished-flight SEAL dialog end to end (confirm seals the slot and clears the lock;
# cancel clears the lock without sealing), and a third drives the stable-leaf group seal
# plus the last-slot RP reap - that is D9 `seal-stash-fly` and `rp-disk-reaper`
# executed rather than decided.
# `unfinished-flights-stash` is claimed off UnfinishedFlightsRenderingAndNoHide,
# which EXECUTES now that the injected b9 booster satisfies IsUnfinishedFlight
# (see the fixture note) - the first R7 wave left this cell skipped and the value
# unclaimed for exactly that reason.
#
# THE FIFTH CELL, AND THE THREE VALUES ADDED 2026-08-20. The fifth executing member is
# `ReFlyFromSpannedRecording_PreservesLaunchRowAndTombstonesPostRewindCrew`
# (Source/Parsek/InGameTests/IncompleteBallisticRuntimeTests.cs, Category="Rewind",
# Scene=SPACECENTER). It forges a production-shaped spanning origin + BranchPoint +
# RewindPoint + re-fly marker IN-BODY and drives `MergeJournalOrchestrator.RunMerge`
# end to end inside a real KSP process, then asserts on the RESULT with hard
# in-process assertions. Its coverage was entirely unclaimed until now.
#
# STATE THE SHAPE PLAINLY SO NOBODY OVERREADS IT: the split here is reached because an
# IN-GAME TEST forges a spanning origin, NOT because a seam-driven re-fly flew one.
# S4.1 / CL-3 remain structurally incapable of the split (their closure roots BEGIN at
# the separation the RewindPoint marks) and correctly do not claim it. What this spec
# adds is that the splitting branch of `RecordingTreeSplitter.SplitOriginAtRewindUT`
# and the ERS/ELS consequences of the split are EXECUTED live, in the shipped DLL,
# under a gate - not merely unit-proven headless.
#
# ONE MEASUREMENT PER VALUE (no double-labelling of a single assertion):
#  - D9 `head-tip-split` <- the split-SHAPE assertions (step 1 of the cell): HEAD keeps
#    origin's id with bounds [originStartUT..rewindUT], TIP is a NEW id with bounds
#    [rewindUT..originEndUT], both share a ChainId at ChainIndex 0 and 1. A skipped
#    split leaves `tip == null` and the cell reds. BACKED IN THE LOG by the new
#    required `Split origin ... HEAD=[..] (kept, id unchanged), TIP=... (will be
#    superseded)` token (`RecordingTreeSplitter` Step 2.13 summary), plus the two
#    forbidden skip tokens that make a fallback-to-whole-recording-supersede red
#    instead of quietly passing the tally.
#  - D8 `ers-els-routing` <- the ROUTING assertions: the cell calls
#    `EffectiveState.ComputeERS()` directly and requires ERS to include HEAD, EXCLUDE
#    TIP (superseded by the fork) and include the fork (step 3); and it calls
#    `EffectiveState.EffectiveTipRecordingId` and requires the composite walker to
#    chase HEAD -> chain -> TIP -> supersede -> fork (step 7). Those are the two
#    EffectiveState entry points every ERS/ELS consumer routes through.
#  - D8 `tombstones` <- the TOMBSTONE-EXCLUSION assertion (step 4): the post-rewind
#    Dead crew action is retagged onto TIP, `SupersedeCommit` writes a
#    `LedgerTombstone` for its ActionId, and `EffectiveState.ComputeELS()` - called
#    directly - must NOT credit that action. The tombstone is written AND observed to
#    take effect on the effective ledger, which is the whole point of the value.
#
# THE RECOVERY-BUNDLE CELL CLAIMS NOTHING NEW, and that is deliberate. Its subject is
# the composite retirement of a stock recovery bundle across a re-fly merge - the
# first time that path has ever been composed live - but every dimension value it
# would name is already claimed fleet-wide on evidence: D8 `tombstones` and
# `ers-els-routing` by this spec (above), D9 `tombstones` by CL-3, D9 `head-tip-split`
# by this spec, D8 `kerbals` by CL-2 / both L1 kerbal specs / L4, and D8 `funds` /
# `science` by B10 and the L-series. Claim-is-not-gate: the cell's value is its hard
# assertions and the BATCH_COMPLETE tally that proves it ran, not a registry row, and
# re-labelling an already-covered value would make the coverage map read as growth
# where there is none.
# NOT claimed off this cell, deliberately: `supersede-relation` (R1 owns it on a real
# re-flight), `merge-journal` and `terminal-kind-classify` (S4.1 owns them off a
# seam-driven cycle; this cell installs test hooks over the durable barriers, so its
# journal is not the shipped save path), `refly-gate` / `reconciliation-bundle` /
# `read-back-guard` (no invoke happens here - the marker is forged).
D9  = ["seal-stash-fly", "rp-disk-reaper", "unfinished-flights-stash", "head-tip-split"]
D8  = ["tombstones", "ers-els-routing"]
D14 = ["career", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# EXACT, and it is the CAMPAIGN-ISOLATION assertion the first revision's {0,0}
# carried, restored at the injected corpus's size. The b9 preset is exactly 3
# recordings, the batch teardown reverts persistent.sfs from the pre-batch .bak
# (which already contains them), and the 2026-08-04_1617 flight MEASURED the
# produced save at exactly 3. The seal-confirm cell's mid-test SaveGame is why a
# loose min=1 was first written here - but whatever that save persisted is
# overwritten by the teardown revert, so on a healthy run the count cannot move.
# A deviation therefore means the isolation contract failed (a leaked synthetic
# row surviving a failed .bak revert) or the corpus size changed - both findings
# to FILE, not to widen away. Note the min=1 precedent (S4.1 / CL-3 / S1.5) does
# NOT apply: those are seam-driven runs with no batch teardown, so their produced
# saves legitimately vary; this one is a batch run with the revert contract.
count = { min = 3, max = 3 }

[expectations.logContracts]
# ANTI-VACUITY: tally pinned WHOLE.
#
# EVIDENCE STANDING: MEASURED. Run `2026-08-04_1617_R7c-rewind-spacecenter`: FULL
# PASS on attempt 1, 55 s, every verifier green, expectations mismatches=0, ZERO
# `[Parsek][ERROR]` lines. The pin is a LITERAL pattern, so the PASS means the
# runner printed it token for token.
#
# THE HISTORY IS THREE FLIGHTS AND EACH ONE EARNED ITS KEEP:
#  - `2026-08-04_1329` (injectedRecordings="none"): tally `passed=4 skipped=33`
#    matched the derivation exactly, but PARSEK-FAIL on the forbidden-ERROR
#    contract - the Site B-1 finding (R7C-SITE-B1-ERROR), fixed by
#    production-shaping the spanned-recording test's RP fixture; ERROR severity
#    in the product unchanged.
#  - `2026-08-04_1914` (first cut of that fixture fix): caught the fix
#    over-shooting - it gave the LAUNCH-ROOT origin a ParentBranchPointId too,
#    which TimelineBuilder reads as "staging child, not a launch" and suppressed
#    the very launch row the test asserts. failed=1 on the launch-row assertion,
#    ERROR count already 0. See the fixture comment in the test.
#  - `2026-08-04_1617`: the pin below, whole.
# If a future run reds with a different split, read the skip/fail messages and
# correct the derivation, never the pattern.
#
# WHAT EACH TOKEN RESTS ON:
#  - total=38 is ATTRIBUTE-EXACT (see R7a); the token counts the whole category, not
#    the scene-eligible slice.
#  - skipped=32, ALL ATTRIBUTE-FORCED: every FLIGHT-scoped Rewind declaration
#    scene-skips here. That is the mirror image of R7a/R7b's 5, and it is why
#    `scene=SPACECENTER` in this pin is load-bearing rather than cosmetic - at
#    FLIGHT this line would be impossible. The former 33rd (run-time) skip was
#    UnfinishedFlightsRenderingAndNoHide on "No Unfinished Flight member in current
#    save"; the injected b9 booster now satisfies IsUnfinishedFlight (unit-proven,
#    see the fixture note), so it is predicted to EXECUTE.
#  - failed=0 is the ASSERTION.
#  - passed=6:
#      ReFlyFromSpannedRecording_PreservesLaunchRowAndTombstonesPostRewindCrew - its
#        ONLY precondition is the SPACECENTER scene; everything else is built
#        in-body (now including a production-shaped RP, per the Site B-1 fix).
#      ReFlyMergeRetiresRecoveryBundleAndStopsCareerLogReassert - added 2026-08-20 by
#        the recovery-bundle wave. Same shape as the cell above and the same single
#        precondition (the SPACECENTER scene): it forges a production-shaped recovery
#        BUNDLE (FundsEarning(Recovery) + ScienceEarning(Recovered) + KerbalAssignment
#        + KerbalExperience, one RecordingId, fields read off the committed
#        Source/Parsek.Tests/Fixtures/C2CareerPostFix ledger) on an origin that SPANS
#        the rewind UT, drives RunMerge, and asserts on ComputeERS/ComputeELS plus the
#        shipping Funds/Science/Kerbals modules. Its origin spans DELIBERATELY: a
#        non-spanning fixture would emit `SplitOriginAtRewindUT: skip`, which the
#        forbidden list below reds on - the split branch is this spec's contract, so a
#        new cell has to honour it rather than route around it.
#      StableLeafGroupSealAndLastSlotReap - SPACECENTER + no live marker + no active
#        merge journal, all true on this save.
#      SealPopupCancelClearsLockWithoutSealing and
#        SealPopupConfirmSealsSlotAndClearsLock - SPACECENTER + a live UI so
#        PopupDialog.SpawnPopupDialog and HighLogic.UISkin resolve. The UI is a
#        genuinely run-time-decided guard; a headless-UI regression would drop this
#        to passed=3 and name itself in the log.
#      UnfinishedFlightsRenderingAndNoHide - the newly-unblocked cell, and the least
#        certain of the six: its member resolution is unit-proven headless, but its
#        rendering/no-hide assertions over a live KSC scene are exactly what only
#        this flight measures.
#  - scene=SPACECENTER is the fresh-career NoVesselSpaceCenter route.
#
# NOTE on the anti-vacuity gate: passed=6 with skipped=32 is a lopsided but
# NON-vacuous line - hlib.batch_contract_vacuity_gap rejects passed == 0, and a
# 32-skip floor that is entirely ATTRIBUTE-forced is exactly what a whole-category
# token looks like when the category is 86% scoped to another scene. The
# alternative - pinning only the six-member slice - is not expressible:
# BATCH_COMPLETE's total counts filtered tests too.
#
# THE SPLITTER TOKEN (added 2026-08-20 with the D9 `head-tip-split` claim). The tally
# alone would let the split cell pass while the splitter took its FALLBACK branch: the
# batch counts pass/fail, and a fallback would red the cell's own assertions, but the
# tally cannot say WHICH branch ran, and a future fixture drift that stops the origin
# spanning the rewind UT would change the failure mode without changing the pin's shape.
# So the branch is pinned positively and its two escape hatches negatively.
#
#  - REQUIRED, the Step 2.13 success summary from `RecordingTreeSplitter`
#    (`Source/Parsek/RecordingTreeSplitter.cs`, the `Split origin {id} at UT=...`
#    ParsekLog.Info). The regex is derived from that interpolated format string and was
#    VALIDATED against the archived KSP.log of run `2026-08-04_1914_R7c-rewind-
#    spacecenter` (line 11682) before it was committed - it matches, token for token:
#      Split origin spanned_split_origin_9da5f2e7 at UT=34.24: HEAD=[8.42..34.24]
#      (kept, id unchanged), TIP=1c8fe8192a114a609d97d5634720a109 [34.24..52.70]
#      (will be superseded). ...
#    The 2026-08-04_1630 collection carries the same line with different ids, so the
#    only volatile parts are the ids and the UTs, which is exactly what the pattern
#    leaves free.
#  - FORBIDDEN, the two ways the splitter declines to split, both of which fall back to
#    whole-recording supersede: `SplitOriginAtRewindUT: skip` (the origin's actual
#    trajectory bounds do not strictly span rewindUT) and `SplitAtUT returned null for
#    origin` (SplitAtUT's remaining guards). Both tokens stop deliberately SHORT of the
#    em dash the product's messages carry, so these patterns stay plain ASCII while
#    remaining substrings unique to those two sites. Both were confirmed ABSENT (0
#    occurrences) in both archived R7c logs, which is what makes them a live
#    discriminator rather than a hopeful negative.
required  = [
  "BATCH_COMPLETE v1 total=38 passed=6 failed=0 skipped=32 category=Rewind scene=SPACECENTER",
  "Split origin \\S+ at UT=[0-9.]+: HEAD=\\[[0-9.]+\\.\\.[0-9.]+\\] \\(kept, id unchanged\\), TIP=\\S+ \\[[0-9.]+\\.\\.[0-9.]+\\] \\(will be superseded\\)",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "SplitOriginAtRewindUT: skip",
  "SplitAtUT returned null for origin",
]

[runtime]
# 660 (LoadGame) + 660 (RunTests) = 1320 worst case; 1400 clears it. The batch
# itself is four short cells with no quickload, so the measured wall should sit with
# the H-series' 50-70 s.
budgetSeconds = 1400

[retry]
policy = "once"

[expectedFail]
bugId = ""
