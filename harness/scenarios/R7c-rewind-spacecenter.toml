schema = 1
id = "R7c-rewind-spacecenter"
tier = "nightly"
# ROADMAP R7, SPEC 3 OF 3 - the five SPACECENTER-scoped Rewind members, which no
# FLIGHT boot can reach at all.
#
# This is the split the roadmap's R7 entry actually anticipated ("One or two specs
# (split FLIGHT / SPACECENTER)"). It is the CHEAPEST of the three and the most
# certain: four of its five cells build every object they touch in-body, so the
# fixture has one job - land the batch in SPACECENTER - and a vessel-less save does
# that by construction (TestCommandLoadGame.DecideLoadRoute returns
# NoVesselSpaceCenter when the save has no focusable vessel).
#
# WHY IT IS A SEPARATE SPEC AND NOT A THIRD STEP IN ONE: a batch names ONE category
# and runs in ONE scene (hlib.SINGLE_BATCH_SELECTOR_RULE), and the seam has no verb
# that transitions FLIGHT -> SPACECENTER mid-run. R12's `scene=` LoadGame argument
# picks the LANDING scene, not a transition.
description = "Run the in-game Rewind category unattended at SPACECENTER: the unfinished-flight seal-dialog pair (confirm and cancel), the stable-leaf group seal + last-slot reap, and the spanned-recording re-fly launch-row/tombstone cell - five members that scene-skip in every FLIGHT batch."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "rewind", "spacecenter", "R7", "R7c"]

[fixture]
# fresh-career: zero VESSEL nodes, activeVessel = -1, so DecideLoadRoute takes the
# NoVesselSpaceCenter branch and the batch runs at SPACECENTER. This is the same
# vessel-less shape B10 / L1 / M2 already boot to SPACECENTER, so the route is
# MEASURED rather than assumed - and the `scene=SPACECENTER` token in the pin below
# is what makes a silently-wrong route red instead of passing.
#
# CAREER rather than fresh-sandbox: none of the five cells needs career state, but
# SealPopupConfirmSealsSlotAndClearsLock has a LIVE SIDE EFFECT - clicking "Seal
# Permanently" reaches UnfinishedFlightsGroup's real seal path, which writes through
# GamePersistence.SaveGame - and a career save exercises that write against the same
# ScenarioModule set the product ships. Sandbox would work; career is the stricter
# of the two at identical cost.
#
# injectedRecordings = "none", and this is the one place R7 leaves a cell on the
# table KNOWINGLY. UnfinishedFlightsRenderingAndNoHide is the only one of the five
# that does not self-set-up: it needs a recording satisfying
# EffectiveState.IsUnfinishedFlight, which requires MergeState Immutable or
# CommittedProvisional. `ScenarioWriter` emits NO `mergeState` key at all (zero hits
# for MergeState / CommittedProvisional across Source/Parsek.Tests/Generators/), so
# EVERY injected recording deserialises to the default and NONE of the three presets
# can satisfy it - injecting the crew-loss or b9 corpus here would add a fixture
# dependency and still leave the cell skipped. Closing it is a fixture-GENERATOR
# change (teach ScenarioWriter to author mergeState), filed in
# docs/dev/todo-and-known-bugs.md, not a spec change.
saveTemplate = "fixtures/saves/fresh-career"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# ORDINARY batch path. All five SPACECENTER-scoped Rewind declarations carry
# AllowBatchExecution = true and no restore flag, so the isolated filter admits
# exactly the same five and the arg would be pure decoration - which
# IsolatedBatchWiringGroupTests.test_the_ordinary_path_could_not_run_this_category
# would (correctly) red on.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "Rewind" },                      expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
# HONEST and deliberately thin. Two of the four executing cells drive the unfinished
# -flight SEAL dialog end to end (confirm seals the slot and clears the lock; cancel
# clears the lock without sealing), and a third drives the stable-leaf group seal
# plus the last-slot RP reap - that is D9 `seal-stash-fly` and `rp-disk-reaper`
# executed rather than decided.
# NOT claimed: `unfinished-flights-stash`. The cell that would carry it
# (UnfinishedFlightsRenderingAndNoHide) is the one that SKIPS here, per the fixture
# note - claiming the value off the seal cells would be exactly the over-claim the
# registry's coverage report exists to prevent.
D9  = ["seal-stash-fly", "rp-disk-reaper"]
D14 = ["career", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Zero. Nothing is injected and every executing cell replaces the scenario's
# rewind/supersede/tombstone lists only for its own duration. A non-zero count means
# a cell leaked its synthetic recording into the produced save, which is a genuine
# campaign-isolation finding to FILE, not to widen away.
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY: tally pinned WHOLE.
#
# EVIDENCE STANDING: DERIVED FROM SOURCE, NEVER MEASURED. The most confident of
# R7's three derivations - four of the five cells have only self-satisfiable guards
# - but still a prediction until flown. Replace with MEASURED + the run id.
#
# WHAT EACH TOKEN RESTS ON:
#  - total=37 is ATTRIBUTE-EXACT (see R7a); the token counts the whole category, not
#    the scene-eligible slice.
#  - skipped=33 = 32 ATTRIBUTE-FORCED + 1 RUN-TIME.
#      32 attribute-forced: every FLIGHT-scoped Rewind declaration scene-skips here.
#      That is the mirror image of R7a/R7b's 5, and it is why `scene=SPACECENTER` in
#      this pin is load-bearing rather than cosmetic - at FLIGHT this line would be
#      impossible.
#      1 run-time: UnfinishedFlightsRenderingAndNoHide, on "No Unfinished Flight
#      member in current save", for the ScenarioWriter mergeState reason above.
#  - failed=0 is the ASSERTION.
#  - passed=4, and the four are:
#      ReFlyFromSpannedRecording_PreservesLaunchRowAndTombstonesPostRewindCrew - its
#        ONLY precondition is the SPACECENTER scene; everything else is built
#        in-body.
#      StableLeafGroupSealAndLastSlotReap - SPACECENTER + no live marker + no active
#        merge journal, all true on a fresh career save.
#      SealPopupCancelClearsLockWithoutSealing and
#        SealPopupConfirmSealsSlotAndClearsLock - SPACECENTER + a live UI so
#        PopupDialog.SpawnPopupDialog and HighLogic.UISkin resolve. The UI is the one
#        genuinely run-time-decided guard in this spec; a headless-UI regression
#        would move this to passed=2 and name itself in the log.
#  - scene=SPACECENTER is the fresh-career NoVesselSpaceCenter route.
#
# NOTE on the anti-vacuity gate: passed=4 with skipped=33 is a lopsided but
# NON-vacuous line - hlib.batch_contract_vacuity_gap rejects passed == 0, and a
# 33-skip floor that is 32 ATTRIBUTE-forced is exactly what a whole-category token
# looks like when the category is 86% scoped to another scene. The alternative -
# pinning only the five-member slice - is not expressible: BATCH_COMPLETE's total
# counts filtered tests too.
required  = ["BATCH_COMPLETE v1 total=37 passed=4 failed=0 skipped=33 category=Rewind scene=SPACECENTER"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# 660 (LoadGame) + 660 (RunTests) = 1320 worst case; 1400 clears it. The batch
# itself is four short cells with no quickload, so the measured wall should sit with
# the H-series' 50-70 s.
budgetSeconds = 1400

[retry]
policy = "once"

[expectedFail]
bugId = ""
