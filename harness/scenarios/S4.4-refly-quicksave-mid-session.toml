schema = 1
id = "S4.4-refly-quicksave-mid-session"
# `operator` for its first flight: this WAS the deliberate experiment the todo entry
# REFLY-BATCH-BASELINE-DISCARDS-LIVE-SESSION asked for - a real quicksave AND quickload
# taken WHILE a Re-Fly session is live, OUTSIDE any in-game batch. READING RUN 1
# (`2026-09-02_1118`) established that the seam CANNOT drive the F9 half, and the lane is
# now the record of WHY: it asserts the guard-block and concludes the session by merge.
tier = "operator"
#
# WHAT RUN 1 MEASURED, and it re-shaped this lane. The SaveGame worked (a live-session
# persist is inert - the save-only draft's GREEN-by-construction reading, now confirmed),
# but the second LoadGame (the F9 half) was REJECTED at dispatch:
#     [Parsek][WARN][TestCommands] reject id=0005 cmd=LoadGame reason=recording-active
# THE READING: after InvokeRewind restores the pre-rewind world, a recorder is LIVE (the
# restored flight RESUMES recording; autoRecordOnLaunch=false does not stop a resumed
# one), and the seam's LoadGame carries a `recording-active` guard (TestCommandDispatcher)
# so a seam reload never silently discards a live recorder. A player's F9 quickload does
# NOT pass through that guard - stock GamePersistence.LoadGame rebuilds the scene and the
# recorder with it - so the seam cannot reproduce F9-mid-refly without either stopping the
# recorder first (which changes the experiment: the session must stay live across the
# load) or a guard-bypass the seam deliberately does not offer. This is a HARNESS
# LIMITATION, not a product finding: it says nothing about whether a real F9 ends the
# session, which is the open question the todo entry still holds - now with the note that
# its deciding experiment needs a MANUAL F5/F9 playtest or a new seam affordance.
#
# WHAT THIS LANE NOW ASSERTS (all GREEN-able through the seam): (1) the mid-session
# SaveGame is accepted and inert - the save half does NOT end the session; (2) the
# seam's LoadGame REFUSES `recording-active` mid-refly (`expect = "REJECTED"` makes that
# the PASS condition, and the reject log line is pinned as well - the GS-3 shape); (3)
# the session, untouched by the rejected reload, still concludes cleanly by merge with
# S4.2's three conclusion tokens. `End reason=treeDiscarded` stays forbidden as a live
# negative: nothing on this step list should end the session, and if the merge somehow
# discarded the tree instead of concluding it, that reds.
#
# THE QUESTION. S4.2's attempt 1 (run `2026-08-11_2111`) lost its live Re-Fly session
# ~1.2 s after the in-game batch started: `[ReFlySession] End reason=treeDiscarded` fired
# inside the batch's baseline handling (`CaptureBatchBaseline` classifies a FLIGHT scene
# with a live vessel as InMemoryAndDisk and QUICKSAVES it; the batch's "save-scoped state"
# preparation then discarded the tree), so the AnswerMergeDialog step deferred on
# `no-refly-dialog` to its budget. Attempt 2 ran clean; `flake.json` quarantines S4.2 at
# rate=0.50. The open question the entry leaves is whether a player's F5/F9 mid-session
# ends it - which would make the entry a product bug - or only the batch's own
# save-scoped preparation does, which is harness isolation (R7's family).
#
# THE SAVE HALF IS INERT BY CONSTRUCTION, and run 1 confirmed it. `End reason=treeDiscarded`
# has ONE emitter (`TreeDiscardPurge.ClearMarkerIfScopedToTree`, reached only through
# `RecordingStore.DiscardPendingTree`), and every production caller of that is a LOAD path
# (`DiscardStashedOnQuickload`, the revert cleanup, the initial-load stale-tree sweep) or
# the merge dialog's own Discard; `SaveGameImpl` is `GamePersistence.SaveGame` and nothing
# else. So the SaveGame step could never end the session, and it did not.
#
# THE LOAD HALF IS WHERE THE PRODUCT SURFACE IS - the quickload classifier
# (`ShouldRunQuickloadDiscard`, meant to be gated OFF by
# `IsReFlySessionActiveForQuickloadDiscard`), the marker's OnSave/OnLoad round trip,
# `LoadTimeSweep`'s marker validation - and it is exactly the half the seam cannot reach:
# the `recording-active` dispatch guard refuses the reload before any of it runs (run 1's
# measurement above). The in-game cell `F5MidReFlyResume` SIMULATES the sweep step
# directly for the same reason - its own header says a real F5+F9 is destructive - so no
# harness path drives a real reload of a live session, and this lane records that
# boundary rather than pretending past it.
#
# THE LANE AS FLOWN. LoadGame -> InvokeRewind -> SaveGame name=quicksave (accepted,
# inert) -> LoadGame name=quicksave (REJECTED recording-active, the asserted finding) ->
# AnswerMergeDialog merge (the session, untouched by the refused reload, concludes with
# S4.2's three tokens). S1.9 is the committed precedent for a second LoadGame mid-run;
# GS-3 is the precedent for an `expect = "REJECTED"` step pinned as a finding.
#
# WHAT A RED WOULD MEAN NOW, pre-registered:
#   - the reload OK instead of REJECTED: the recorder was not live after the rewind
#     (contradicts run 1) - re-read whether a resumed recorder still tags, and the F9
#     experiment may then be seam-drivable after all.
#   - `End reason=treeDiscarded` present: the merge discarded the tree instead of
#     concluding it - a product finding on the conclusion route, not on the save/load.
#   - a conclusion token missing: the session did not conclude cleanly by merge - a
#     reading against `ReFlyConclusionRouteTests`.
#
# THE CONCLUSION TOKENS are S4.2's three, verbatim: the conclusion route of a session
# that flew nothing between rewind and merge is `retired-empty-provisional` ->
# `refused-unflown-provisional` -> `concluded-no-supersede`.
#
# =====================================================================================
# RE-SHAPED 2026-09-09 INTO THE EXPERIMENT IT WAS AUTHORED AS. The seam affordance this
# file spent two paragraphs describing the absence of now exists.
#
# `LoadGame` takes ONE new optional argument, `allowLiveRecorder=refly` (RF-3/A1, contract
# in `docs/dev/design-autotest-command-seam.md`). It lets a load past the
# `recording-active` dispatch guard, and ONLY while a re-fly session marker is live. Both
# halves of that sentence are load-bearing and both are exercised HERE, in one flight:
#
#   step 5  LoadGame WITHOUT the arg  -> REJECTED `recording-active`   (the guard, intact)
#   step 6  LoadGame WITH the arg     -> OK                            (the F9 half, at last)
#
# So the lane carries its own mutation test: a change that widened the guard would make
# step 5 answer OK and red the lane, and a change that broke the opt-in would red step 6.
# Neither can be read as the other.
#
# WHY THE ARG AND NOT `StopRecording` FIRST, since that needs no C# at all. Because it
# changes what the experiment observes, which this file already said before the affordance
# existed: "the seam cannot reproduce F9-mid-refly without either stopping the recorder
# first (which changes the experiment: the session must stay live across the load) or a
# guard-bypass the seam deliberately does not offer". A load WITH a live recorder is the
# event the guard exists to describe; a load after the recorder was stopped is a different
# event that happens to reach the same disk.
#
# WHAT THIS RUN NOW DECIDES - the question the todo entry
# REFLY-BATCH-BASELINE-DISCARDS-LIVE-SESSION has held open since 2026-08-11: does a real
# reload mid-session END the session, or does only the in-game batch's own save-scoped
# preparation do that? Two things answer it and NEITHER is a new token:
#
#   `End reason=treeDiscarded` stays FORBIDDEN. It is the quickload classifier's own
#   emitter (`TreeDiscardPurge.ClearMarkerIfScopedToTree`, reached through
#   `RecordingStore.DiscardPendingTree`), and `ShouldRunQuickloadDiscard` is supposed to be
#   gated OFF by `IsReFlySessionActiveForQuickloadDiscard`. If it fires on step 6 the gate
#   does not hold and the entry becomes a product bug.
#
#   `AnswerMergeDialog` at step 7 keeps `expect = "OK"`. Its dispatch DEFERS
#   `no-refly-dialog` while there is neither a live dialog NOR a marker, so a session the
#   reload killed makes that step defer to its budget and the lane reds on a step verdict
#   rather than on a pattern. That is the sharper of the two: an absence cannot be
#   asserted by a required token, but it can be asserted by a step that cannot complete
#   without the thing being present.
#
# RF-6's forensics observed the marker surviving a batch teardown reload
# (`Marker loaded: sess_...`); this is the first run to put a DELIBERATE reload under it.
description = "The real F5+F9 mid-re-fly experiment this lane was authored as: InvokeRewind a crashed-booster slot, take an inert mid-session SaveGame, prove the seam still REFUSES a bare reload recording-active, then reload FOR REAL through the RF-3/A1 opt-in allowLiveRecorder=refly and answer the question REFLY-BATCH-BASELINE-DISCARDS-LIVE-SESSION has held open - whether a genuine reload ends a live re-fly session - through a forbidden treeDiscarded and a merge step that cannot complete without the session."
instanceProfile = "stock-minimal"
tags = ["rewind", "refly", "quicksave", "quickload", "session-isolation", "S4.4", "D9", "reading-run"]

[fixture]
# S4.2's fixture verbatim: loads into FLIGHT (the Focusable route) with the injected
# world-preservation rewindable tree under `rp_wp_root`.
saveTemplate       = "fixtures/saves/gloops-airshow"
injectedRecordings = "refly-world-preservation"
craft              = []

[driver]
kind = "seam"
# THE ORDERING: SaveGame and the reload sit AFTER InvokeRewind (the session is live) and
# BEFORE AnswerMergeDialog (the session must still be live to conclude). The SaveGame is
# accepted and inert; the reload is REJECTED `recording-active` (run 1's finding), which
# `expect = "REJECTED"` makes the PASS condition - the session is unchanged by it, so the
# merge then concludes it. The reload's `budget` is dropped to the default: a dispatch
# reject is immediate, not a two-phase wait. FlushAndQuit writes `persistent`, so the
# produced save the verifiers read is the post-merge world as in S4.2.
steps = [
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "InvokeRewind",      args = { rp = "rp_wp_root", slot = "1" },            expect = "OK", budget = 300 },
  { cmd = "SaveGame",          args = { name = "quicksave" },                       expect = "OK" },
  # THE GUARD, UNCHANGED. No opt-in arg, a live recorder, so the seam refuses exactly as
  # it did on reading run 1. Kept as the live negative control for step 6: without it, a
  # regression that widened the guard for everyone would make step 6 pass for the wrong
  # reason and nothing would notice.
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "quicksave" },  expect = "REJECTED" },
  # THE F9 HALF (RF-3/A1). The opt-in is scoped to LoadGame and admits only while a re-fly
  # session marker is live, which is exactly this state. Two-phase like every other load,
  # so it takes the LoadGame budget.
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "quicksave", allowLiveRecorder = "refly" }, expect = "OK", budget = 300 },
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },                         expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                         expect = "OK" },
  { cmd = "FlushAndQuit",                                                           expect = "OK" },
]

[dimensionsCovered]
# S4.1's seam half, claimed as such. The mid-session save/load reached no new D9 value:
# the reload was guard-blocked, so nothing new about the rewind machinery was exercised.
D9  = ["rewind-to-separation", "refly-gate", "reconciliation-bundle", "read-back-guard"]
D14 = ["sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# S4.2's floor: the merged fork leaves at least the surviving tree visible.
count = { min = 1 }

[expectations.logContracts]
required  = [
  "Re-Fly \\(Rewind-to-Separation\\) StartInvoke", "Invocation complete",
  "ConsumePostLoad: restoring bundle with route-retire cutoffUT=",
  "Restored: recs=.* pendingScience=",
  # THE FINDING, PINNED AS A LOG TOKEN AS WELL AS the step's `expect = "REJECTED"` (the
  # GS-3 shape): the seam's LoadGame refuses the reload because a recorder is live after
  # the rewind. The reject fires at DISPATCH, before any `loadgame start`, so this line -
  # not a `loadgame start ... name=quicksave` - is what a green run carries.
  "reject id=\\S+ cmd=LoadGame reason=recording-active",
  # THE F9 HALF ACTUALLY RAN. `loadgame complete` is the verb's own terminal line and it
  # can only be reached past the guard step 5 just proved is still closed, so the pair
  # (reject, then complete) is the whole RF-3/A1 contract read off one log.
  "loadgame complete",
  "outcome=retired-empty-provisional",
  "AppendRelations outcome=refused-unflown-provisional",
  # THE CLEAN-CONCLUSION TOKEN. S4.2 (via the batch) ended `outcome=concluded-no-supersede`;
  # this lane's merge of the surviving world-preservation tree ends `End reason=merged`
  # (measured run `2026-09-02_1141`: `TryCommitReFlySupersede -> MergeJournalOrchestrator`
  # then `End reason=merged`, marker cleared, zero rows, no error, no treeDiscarded). Both
  # are clean conclusions of an unflown provisional - the empty provisional was retired and
  # refused above - so the alternation accepts either route.
  "(outcome=concluded-no-supersede|End reason=merged sess=)",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE SESSION-END TOKEN, kept as a live negative: nothing on this step list should end
  # the session (the reload was refused, so its quickload-discard path never ran). If the
  # merge discarded the tree instead of concluding it, this reds - a conclusion-route
  # finding, not a save/load one.
  "End reason=treeDiscarded",
  "not found in committed list after tree commit",
  "Marker invalid field=ActiveReFlyRecordingId",
]

[runtime]
# S4.2's arithmetic with BOTH reloads: the guard-blocked one is a dispatch reject
# (default 60, no two-phase wait), the opt-in one is a real two-phase load.
# LoadGame 660 + SetSetting 60 + InvokeRewind 660 + SaveGame 60 + LoadGame(reject) 60
# + LoadGame(opt-in) 660 + AnswerMergeDialog 120 + RecordingState 60 + FlushAndQuit 60
# = 2400; +150 margin.
budgetSeconds = 2550

[retry]
policy = "once"

[expectedFail]
bugId = ""
