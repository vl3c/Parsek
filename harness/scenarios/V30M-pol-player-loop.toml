[dimensionsCovered]
D9  = ["fast-forward"]
D14 = ["pol", "scene-flight", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 1 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "Orbital\\(Pol\\) same-parent",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Pol",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=[1-9]\\d* outsideSoi=0",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "\\[ReaimDiag\\]",
  "ENGAGED re-aim",
  "FORCED FAITHFUL",
  "timejump refused reason=backward-jump",
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
