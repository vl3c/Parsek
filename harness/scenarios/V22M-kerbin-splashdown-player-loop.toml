# =====================================================================================
# *** ITS SUBJECT EXISTS. RE-PINNED 2026-08-24 OFF THE HARVESTED BYTES. ***
# `fixtures/saves/kerbin-splashdown-recorded` was harvested `--keep-parsek` from
# `B4-reentry-splashdown` run **2026-08-24_1431**, PASS attempt 1 (wall 1,065 s,
# mission wall 989.2 s, MISSION-OK across PRELAUNCH -> MJ-ASCENT -> CIRCULARIZE ->
# ORBIT -> DEORBIT -> REENTRY -> SPLASHDOWN, both telemetry assertions met, zero
# anomaly hits, analyzer RED=0). The tree id below is REAL, the zero placeholder is
# gone, and the `PENDING_FIXTURE_LANES` exemption was deleted in the same commit -
# it fired red first, as designed, in all three of its arms. The V15 and V17 pairs
# shipped this way before it.
#
# WHAT COULD NOT BE RE-PINNED TO A MEASUREMENT, and section 3 says so at the point
# of use: the LOOP CLOCK. The anchor is resolved at run time by
# `MissionLoopUnitBuilder`, the harvest flight does not loop, and its KSP.log
# carries zero `missionconfig applied:` / `PhaseLock APPLIED` lines (grepped). The
# eight jump UTs are therefore still CALIBRATION SEEDS - but now seeded off this
# fixture's REAL UT0, span and save clock instead of off a guessed profile.
# =====================================================================================
#
# -------------------------------------------------------------------------------------
# 0. WHAT THIS LANE MEASURES
# -------------------------------------------------------------------------------------
# **THE FIRST LOOP SUBJECT IN THE SUITE THAT DOES NOT END AT AN ORBIT**, and the
# flight-map half of roadmap gap G3a (`docs/dev/autotest-roadmap.md` -> "The
# loop-render coverage program" -> G3, which is this lane's authority).
#
# Every committed V lane loops a recording that ends in orbit, so every one of them
# reads its arrival through a conic. A recording that ends SPLASHED has no conic at
# the arrival at all: below atmosphere the proto orbit line is suppressed and the map
# truth is the OWNED DESCENT POLYLINE, with the marker riding the suppressed-icon
# fallback. The product claims (v0.10.1) that "looped landings after destination
# parking render connected". No lane has ever checked it.
#
# -------------------------------------------------------------------------------------
# 1. THE ROUTING PRE-REGISTRATION - AND THIS LANE GATES ON NONE OF IT
# -------------------------------------------------------------------------------------
# This subject is a LAUNCH-BODY-ONLY loop: a Kerbin ascent, a Kerbin orbit, a deorbit
# and a Kerbin splashdown. There is no transfer and no second body anywhere in it.
# That is a shape no committed V lane has looped before, and it starves BOTH roads:
#
#   phase-lock  needs a same-parent TARGET to quantize the cadence against
#               (`Orbital(<target>) same-parent`, `support=Supported`). There is no
#               target. Expect `support=Unsupported...` or no phase-lock line at all.
#   re-aim      needs a transfer RUN for the classifier to admit. There is no
#               transfer run to gather, so expect `plan.Supported=False` with a
#               "no member yields a re-aim transfer"-shaped reason, or silence.
#
# **SO THE PRE-REGISTERED PLAUSIBLE OUTCOME IS FAITHFUL FIXED CADENCE** - verbatim
# replay on the raw span, the V9-dres / V17 shape. That is a PREDICTION, not a pin.
# Both roads are left UNREQUIRED AND UNFORBIDDEN below, for V17M's reason: when the
# routing is the thing you are reading, requiring either road's artifacts gates the
# reading on the answer. If a road engages anyway, that is a finding this lane should
# RECORD rather than red on.
#
# -------------------------------------------------------------------------------------
# 2. WHICH LENS CARRIES THE ARRIVAL, AND WHY IT IS NOT THE PROTO LINE
# -------------------------------------------------------------------------------------
# Confirmation criterion (a) requires a spec to name its lens and justify it for its
# subject's SHAPE. V17M learned this the expensive way across four reading runs: its
# `body=Vall` proto-line pin was STRUCTURALLY UNSATISFIABLE on a nested-SOI subject.
#
# **HERE THE FAILURE MODE IS DIFFERENT AND SUBTLER, AND IT IS WORTH STATING PRECISELY
# BECAUSE IT WOULD NOT LOOK LIKE A FAILURE.** A `surface=Proto(Icon|OrbitLine)
# .*body=Kerbin` pin - V6M's arrival pin - WOULD match here. It would just not mean
# what a reader thinks. The harness matches `re.search(pat, WHOLE log text)` with no
# flags (`hlib.py:3897`), so ANY occurrence anywhere in the run satisfies a required
# pin, and this loop spends most of every cycle in a Kerbin ORBIT that draws a proto
# line perfectly well. The pin would therefore be satisfied by the COAST and say
# nothing whatever about the SPLASHDOWN. Not unsatisfiable: VACUOUS. That is the
# harder mistake to catch, because it goes green.
#
# The arrival claim therefore rests only on tokens that the below-atmosphere state
# ALONE can emit:
#
#   `Polyline frame: scene=FLIGHT drawn=[1-9]\d* warp=`
#       `GhostTrajectoryPolylineRenderer`, VerboseRateLimited 5.0 s on a SHARED key,
#       so it prints throughout a dwell regardless of pid churn. A nonzero `drawn=`
#       is the anti-vacuity floor: a polyline was actually drawn this frame.
#   `TracedPath OWNS leg pid=\d+ .*body=Kerbin drawn=True`
#       `TracedPathTreatment.TryDrawOwnedLeg` (`TracedPathTreatment.cs:74`),
#       VerboseRateLimited 2.0 s per pid, emitted on the OWNED-leg draw. This is the
#       descent leg being drawn in the Kerbin frame, which is the destination frame.
#   `Director TracedPath suppress pid=\d+ frame=\d+ \(polyline owns the leg, proto icon hidden\)`
#       `GhostOrbitLinePatch.cs:180`, VerboseRateLimited 1.0 s per pid. THE MARKER
#       LENS. Chosen over the `phase=MarkerDecision` tracer line and over the
#       `Orbit line decision:` line because both of those are CHANGE-ONLY (they fire
#       at onset and then go silent), whereas this one repeats every second and so
#       survives a forty-tick dwell that lands after the transition.
#   `Orbit line decision: pid=\d+ reason=below-atmosphere .*iconSuppressed=True belowAtmosphere=True`
#       The reason token, carrying WHY the icon is suppressed.
#
# **THE REASON TOKEN IS BODY-DEPENDENT AND THIS IS THE ATMOSPHERIC BRANCH.**
# `belowAtmosphere = body != null && body.atmosphere && orbit.altitude <
# body.atmosphereDepth` (`GhostOrbitLinePatch.cs:903-906`). Kerbin HAS an atmosphere,
# so this subject takes the `below-atmosphere` branch with `belowAtmosphere=True`.
# The V23 Mun pair CANNOT share this pin - an airless body never reaches that branch
# and suppresses under `polyline-owns-phase` with `belowAtmosphere=False` instead.
# Copying this line into an airless lane would be structurally unsatisfiable; the two
# specs differ here on purpose.
#
# NOT PINNED, DELIBERATELY: `AssertDrawnRecordingsAccounted` /
# `unaccounted-drawn-recording`. It is tempting as an anti-vacuity line and it is the
# wrong one - `GhostMapPresence.cs:9724` invokes its callback ONLY per UNACCOUNTED
# recording and emits NOTHING on the clean path, and the raise itself is report-only
# (`hlib.py:344`). Requiring it would demand an instrumentation gap in order to pass.
#
# -------------------------------------------------------------------------------------
# 3. THE MEASURED BYTES, AND WHAT IS STILL A SEED
# -------------------------------------------------------------------------------------
# **RE-PINNED 2026-08-24 OFF `kerbin-splashdown-recorded`'s REAL BYTES.** Everything
# in the first block below is READ FROM THE FIXTURE. Everything in the second block
# is still DERIVED, because the loop clock does not exist until a loop runs.
#
# MEASURED (persistent.sfs `RECORDING_TREE` + the main recording's `.prec.txt`):
#
#     tree             c05c834cd2754892b4588e7ce9220c3f
#     main recording   28b6e543d67c4d1c9e4763b451c01df5
#     UT0              34.5399999999998        (`explicitStartUT` - V6M convention)
#     explicitEndUT    1,274.6835614006252
#     span             **1,240.143561401 s**
#     pointCount       1285   terminalState 1 = Landed   endpointBodyName Kerbin
#     save clock       1,276.6235614006234     (FLIGHTSTATE UT)
#     ORBIT_SEGMENTs   FOUR, ALL `Kerbin`, **ZERO body-change seams** - the
#                      launch-body-only shape section 1 pre-registers, now measured
#                      rather than assumed. Segments (startUT -> endUT):
#                        0  229.953741 ->  266.353766
#                        1  653.093766 ->  771.292629
#                        2  773.612629 ->  790.538942
#                        3  773.612629 ->  853.723561
#                      The chain ENDS at 853.723561, so the recording closes with a
#                      **420.960 s SEGMENT-LESS DESCENT TAIL**. That tail is the
#                      whole subject of this lane, and it is 34% of the replay.
#
# TWO MEASUREMENTS WORTH NAMING BECAUSE THEY WERE OPEN QUESTIONS:
#   (a) **THE TERMINAL IS `Landed`, NOT `Splashed`.** Section 6 declined to declare
#       `terminalStates` precisely because B4's `landedSituations` accepts either and
#       nobody had seen the bytes. The mission asserted `landedSituation value=LANDED
#       met=True` at alt 0.687 m; `TERMINAL_POSITION` reads lat -0.120 / lon 86.698 /
#       alt 152.476 against `terrainHeightAtEnd = 151.923`, and the save's active
#       Ship VESSEL reads `sit = LANDED splashed = False`. A DRY-LAND touchdown on
#       Kerbin's equatorial continent east of KSC - a legal B4 pass, and the window
#       is declared from it below rather than left open.
#   (b) **THE TREE CARRIES SEVEN RECORDINGS, NOT THE 8-9 THIS HEADER PREDICTED.**
#       The commit-blind `run.py count_recordings` did read 9 (B4's own window is
#       {8,9} and it passed), but the COMMITTED tree is 1 subject + 6 booster debris
#       over 3 JointBreak branch points. The difference is two UNCOMMITTED
#       single-POINT sidecar stubs at UT 649.414 / 650.254 that the harvest brought
#       across and persistent.sfs names nowhere. Section 6's induction caveat is
#       therefore restated with the measured number: two dimensions still move at
#       once, and the second one is SEVEN members rather than 8-9.
#
# STILL A SEED - THE LOOP CLOCK, AND WHY IT COULD NOT BE MEASURED HERE. The anchor
# is `max(LoopAnchorUT, spanEndUT)` resolved at run time; the harvest flight never
# loops, so its KSP.log carries no `missionconfig applied:` and no `PhaseLock
# APPLIED` line to read one off (grepped: zero occurrences). The table below is
# DERIVED from the measured bytes under the pre-registered FAITHFUL road, using
# V6M's press-driven model (each `StartLoopPlayback` press resolves
# `NextLaunchAfter(now)` to a relaunch epoch L; the jump target is L + offset):
#
#     anchor / launch 1  L1 = 1,276.62   (the save clock - the live UT at load, and
#                                         the floor no relaunch can precede)
#     cadence            P  = span = 1,240.14  (faithful: the span itself)
#     launches           1,276.62 / 2,516.77 / 3,756.91 / 4,997.06 / ...
#     arrival offset     = span (this recording ENDS at the touchdown)
#     cycle-1 arrival    L1 + span            = **2,516.77**
#     press 2 at ~2,957 -> L2 = NextLaunchAfter(2,957) = **3,756.91**
#     cycle-2 arrival    L2 + span            = **4,997.06**
#
# ONE CORRECTION TO THE OLD SEED TABLE'S ARITHMETIC, recorded rather than silently
# fixed: it read cycle 2 as `anchor + 2*span`, which under the press-driven model is
# launch 3's START, not an arrival. The rows above bracket ARRIVALS on both cycles.
#
# THE BRACKET is the family's -180 / -60 / +140, off V6M's committed table
# (296,370 / 296,490 / 296,690 around a 296,550 seam). THE SETTLE DWELL IS RESCALED
# FROM +1,200 TO +300 s AND THAT IS FORCED, not a preference: the measured span is
# 1,240 s where the seed assumed 6,000, so a +1,200 settle would overrun the next
# cycle's first bracket and answer `timejump refused reason=backward-jump` - a
# forbidden token on this very spec. +300 keeps every jump strictly increasing
# (2,337 < 2,457 < 2,657 < 2,957 < 4,817 < 4,937 < 5,137 < 5,437) while still
# holding the ghost in the landed state clear of the onset.
#
# A RUN-1 THAT DWELLS NOWHERE IS AN ACCEPTED OUTCOME, NOT A LANE FAILURE. V17M's
# first reading run put every bracket in the wrong leg because its seeded anchor sat
# 97 ks from the real one, and that run still carried the measurement it was flown
# for. Read `phaseAnchorUt=` off `missionconfig applied:` and each cycle's
# `relaunchUt=` off `startloopplayback initiated:`, re-pin, and re-fly.
#
# -------------------------------------------------------------------------------------
# 4. THE FORTY-TICK CENSUS-PACING BLOCK
# -------------------------------------------------------------------------------------
# Carried forward from V16M, where it is PROVEN machinery rather than a precaution:
# it measured both cycles 11.502 wall-seconds apart where V15M's three runs printed
# one. The mechanism it defeats is the 5.0 s `ParsekLog.VerboseRateLimited` window.
# A short dwell issues its census, the window swallows the second emission, and the
# lane reads a single sample as though it were the steady state.
#
# IT MATTERS MORE HERE THAN ON ANY PREDECESSOR, because three of this lane's four
# render pins are rate-limited per pid (2.0 s on the owned-leg draw, 1.0 s on the
# suppressed-icon line) and one is change-only. Forty seam round-trips at run.py's
# ~0.25 s pacing is ~10 wall-seconds of dwell, which clears the 5.0 s shared window
# twice and gives every per-pid limiter room to print.
#
# -------------------------------------------------------------------------------------
# 5. THE NEGATIVE CONTROL - IT MUST INVERT A REQUIRED RENDER TOKEN
# -------------------------------------------------------------------------------------
# **CRITERION (b) WAS FIRST DISCHARGED BY THE V19 PAIR ON 2026-08-21, AND IT
# ESTABLISHED A RULE THIS LANE FOLLOWS: THE CONTROL IS PER-LANE, NOT PER-PAIR.**
# Every V pair BEFORE V19 shared one inversion - a temporary `rewind.supersedeRows`
# minimum - which proves the saveParse EVALUATOR can red and NOTHING about whether
# the render pins can. V19M and V19T each ran their OWN control on their OWN lens
# (`2026-08-21_0855` red on `surface=ProtoOrbitLine .*body=Vall`, `_0858` on
# `surface=ProtoIcon pid=\d+ .*body=Vall scene=TRACKSTATION`), BECAUSE the two
# halves pin different lenses and a shared control would have proven exactly one of
# them. G3a's lanes diverge FURTHER than V19's did, so each of the five owes its own.
# Designed at ARMING off the reading run's own bytes, then REVERTED.
#
# THE INVERSION OF RECORD FOR THIS LANE:
#
#     required: "TracedPath OWNS leg pid=\\d+ .*body=Kerbin drawn=True"
#     inverted: "TracedPath OWNS leg pid=\\d+ .*body=Eeloo drawn=True"
#
# `Eeloo` is chosen because this subject can never visit it, so the inverted pin is
# unsatisfiable for a REASON rather than by a typo, and the run must red on EXACTLY
# that token and nothing else. A control that reds on two tokens has changed
# something structural and is not a control.
#
# -------------------------------------------------------------------------------------
# 6. POSTURE - FIRST-RUN READING, AND TWO DIMENSIONS MOVE AT ONCE
# -------------------------------------------------------------------------------------
# NOTHING IS ARMED. No `gating = true` on any block; the `rewind` and `structure`
# blocks are declared REPORT-ONLY so the reading run measures and prints their facets
# without gating on values nobody has seen. Arming is a separate, post-flight
# operator decision that also owes an `ARMED_ALLOWLIST` entry citing the run id.
#
# **TWO SHAPE DIMENSIONS MOVE AT ONCE AND THAT IS PRE-REGISTERED RATHER THAN HIDDEN.**
# The induction caveat asks a new lane to extend ONE dimension where possible, and
# names V17T as the cautionary case: it changed two at once and its icon-off-orbit
# non-recurrence is consequently UNATTRIBUTABLE. Here it is not possible. This lane
# changes (i) the endpoint type, orbit -> surface, and (ii) the recording count, from
# the family's single-recording subjects to this tree's **SEVEN** members including
# debris children (MEASURED 2026-08-24; this paragraph predicted 8-9, which is what
# the commit-blind count reads - see section 3(b)). There is no single-recording
# landed subject in existence to avoid (ii) with, and manufacturing one would cost
# its own flight. So both are declared up front: if this lane surprises, the surprise
# is attributable to at most these two, and the V23 Mun pair - which moves ONE
# dimension against V6M - is the control that separates them.
#
# `terminalStates` WAS DELIBERATELY NOT DECLARED, AND NOW IS - because the ambiguity
# it was protecting has been MEASURED. B4's own
# `landedSituations = ["LANDED", "SPLASHED"]` accepts EITHER, so the terminal this
# harvest would carry was genuinely unknown when this spec was authored; the phase is
# named SPLASHDOWN and a water landing was expected, but a shoreline touchdown is a
# legal B4 pass. **IT CAME BACK `Landed`** (section 3(a): dry land at lat -0.120 /
# lon 86.698, alt 152.476 against terrain 151.923, `splashed = False`), so the
# window below states the measured value instead of a guess. Declaring is NOT arming:
# the block stays REPORT-ONLY like every other facet on this lane.
#
# `allowedAnomalies = []` ON PURPOSE, AND ONE RAISE IS EXPECTED. Tier-C
# `rigid-seam-tangent-discontinuity` raises at the owned descent draw
# (`CrossMemberSeamStitcher.cs:409`) and IS in the gated set (`hlib.py:247`, position
# 5 of `ANOMALY_TOKENS`), so a raise reds this spec `PARSEK-FAIL(anomaly)` with every
# step green - the PRE-REGISTERED CORRECT CATCH. It fires ONCE PER ONSET per
# (pid, signature) per scene session, so expect a single line rather than a stream.
# If it raises, the token is added BARE, with the flight that showed it - never as a
# count budget, which would let a second, different raise hide behind the first.
#
# -------------------------------------------------------------------------------------
# 7. FLIGHT LEDGER
# -------------------------------------------------------------------------------------
# THIS LANE HAS NOT FLOWN. What is ledgered here is the PRODUCER flight that made its
# subject exist, recorded verdict-neutrally because it is the provenance every number
# in section 3 rests on.
#
#   `B4-reentry-splashdown` run **2026-08-24_1431** - **PASS, attempt 1**.
#     wall 1,065 s (mission wall 989.2 s), tier nightly, instance stock-minimal,
#     kspExit clean. MISSION-OK: PRELAUNCH -> MJ-ASCENT -> CIRCULARIZE -> ORBIT ->
#     DEORBIT -> REENTRY -> SPLASHDOWN, `reachedOrbit value=SPLASHDOWN met=True` and
#     `landedSituation value=LANDED met=True`. Verifier chain all PASS/SKIPPED:
#     analyzer RED=0 / failNonBaselined 0, `anomalySweep hits=[]`, driverValidity
#     PASS, expectations `recordings.count = 9` inside B4's own {8,9} window,
#     ledgerOracle, logValidate, missionOutcome, saveParse REPORT (non-gating:
#     supersedeRows 0, tombstones 0, rewindPoints 0, pointsTotal 1618, largest 1285,
#     smallest 44, unparsed 0, mismatches 0), testResults, unityExceptions.
#     Produced save harvested `--keep-parsek` as
#     `fixtures/saves/kerbin-splashdown-recorded` and registered in
#     `test_saveparse.RECORDED_FIXTURES` with its full provenance.
#     DLL provenance: the post-#1523 auto-merge-ON build, deployed hash prefix
#     27f5f31907efce27.
#
#   ONE OBSERVATION FROM THE HARVEST, recorded because it is new and because nothing
#   in the pipeline catches it: the produced save carried TWO sidecar sets
#   (91c0ea09... at UT 650.254, fc56a5b8... at UT 649.414) that persistent.sfs names
#   nowhere - single-POINT, `sectionAuthoritative = False`, one of them without the
#   `_vessel.craft` every committed trajectory is supposed to keep. Those seven files
#   were PRUNED BY HAND before the fixture was committed, because
#   `CommittedFixtureMirrorTests` requires the pairing and an orphan stub cannot
#   satisfy it. `harvest_bdock_station.py` prunes readable mirrors, backup dirs and
#   `Parsek/Saves` but has no "sidecar with no RECORDING row" prune, because no prior
#   recorded fixture carried more than two recordings - worth adding there before the
#   next multi-recording harvest. VERDICT-NEUTRAL: it is harvest exhaust, not a
#   Parsek finding, and it touches nothing this lane loops.
# -------------------------------------------------------------------------------------
tier = "operator"
description = "**RE-PINNED 2026-08-24 OFF ITS FIXTURE'S REAL BYTES**, with its `PENDING_FIXTURE_LANES` exemption (the V15 / V17 precedent) retired in the same commit. `fixtures/saves/kerbin-splashdown-recorded` EXISTS - harvested `--keep-parsek` from `B4-reentry-splashdown` run 2026-08-24_1431, PASS attempt 1 (wall 1,065 s, mission wall 989.2 s, MISSION-OK through SPLASHDOWN, zero anomaly hits, analyzer RED=0) - and it is THE SUITE'S FIRST HARVESTED SURFACE SAVE, against fourteen committed orbit and transfer fixtures, which is exactly why every loop subject in the suite until now ends at an ORBIT. The tree id is REAL; the eight jump UTs REMAIN CALIBRATION SEEDS by design, because the loop anchor is a run-time artifact and a harvest flight does not loop (zero `PhaseLock APPLIED` / `missionconfig applied:` lines in its KSP.log) - they are now derived off the fixture's MEASURED UT0 34.540 / span 1,240.144 / save clock 1,276.624 rather than off a guessed profile, and the settle dwell is rescaled +1,200 -> +300 s because the real span is a fifth of the seeded one and +1,200 would have answered `backward-jump`. **THE FIRST LOOP SUBJECT THAT DOES NOT END AT AN ORBIT**, and the flight-map half of roadmap gap G3a. ROUTING IS ITSELF A READING AND THE LANE GATES ON NONE OF IT: a LAUNCH-BODY-ONLY loop starves both roads - phase-lock has no same-parent TARGET to quantize against and the re-aim classifier has no transfer RUN to admit - so FAITHFUL FIXED CADENCE is the pre-registered plausible outcome, with both roads left UNREQUIRED AND UNFORBIDDEN on V17M's reasoning that requiring either gates the reading on its own answer. WHY THE LENS MOVES, and the failure mode here is subtler than V17M's: a `surface=Proto(Icon|OrbitLine) .*body=Kerbin` pin (V6M's arrival pin) would MATCH - the harness searches the WHOLE log, and this loop spends most of every cycle in a Kerbin orbit drawing a proto line perfectly well - so it would be satisfied by the COAST and say nothing about the SPLASHDOWN. Not unsatisfiable: VACUOUS, which is the harder mistake because it goes green. The arrival claim therefore rests only on tokens the below-atmosphere state alone emits: the shared-key `Polyline frame: ... drawn=[1-9]` floor, the owned-leg `TracedPath OWNS leg ... body=Kerbin drawn=True` draw, the per-second `Director TracedPath suppress` marker line (chosen over the change-only `MarkerDecision` and `Orbit line decision` lines because it repeats through a dwell), and the ATMOSPHERIC reason token `below-atmosphere` with `belowAtmosphere=True` - which the V23 Mun pair CANNOT share, since an airless body never reaches that branch and suppresses under `polyline-owns-phase` instead. `AssertDrawnRecordingsAccounted` is deliberately NOT pinned: it emits nothing on the clean path, so requiring it would demand an instrumentation gap in order to pass. TWO SHAPE DIMENSIONS MOVE AT ONCE - endpoint type AND, for the first time, a multi-recording debris tree of SEVEN members (MEASURED; the commit-blind `count` reads 9 and the two uncommitted single-POINT stubs behind that difference are named in section 3) - which the induction caveat asks to be PRE-REGISTERED rather than avoided, because no single-recording landed subject exists to avoid it with; the V23 pair, which moves ONE dimension against V6M, is the control that separates them. `terminalStates` WAS deliberately NOT declared while B4's `landedSituations = [\"LANDED\", \"SPLASHED\"]` left the terminal genuinely unknown; THE HARVEST MEASURED `Landed` - a DRY-LAND shoreline touchdown east of KSC (lat -0.120 / lon 86.698, alt 152.476 against terrain 151.923, `splashed = False`), not the water landing the phase name suggests - so the window is now declared from the bytes and stays REPORT-ONLY. Ships `allowedAnomalies = []` on purpose and EXPECTS to read the gated Tier-C `rigid-seam-tangent-discontinuity` raise at the owned descent draw - once per onset, so a single line, added BARE with the flight that shows it and never as a count budget. Watch mode is NOT driven: the program scopes it out, and `EnterWatchMode`'s outcome is a separation-dependent prediction this subject cannot make. NOTHING IS ARMED."
