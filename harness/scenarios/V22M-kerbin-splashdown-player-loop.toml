[dimensionsCovered]
D9  = ["fast-forward"]
D14 = ["kerbin", "scene-flight", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 12 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "Polyline frame: scene=FLIGHT drawn=[1-9]\\d* warp=",
  "TracedPath OWNS leg pid=\\d+ .*body=Kerbin drawn=True",
  "Director TracedPath suppress pid=\\d+ frame=\\d+ \\(polyline owns the leg, proto icon hidden\\)",
  "Orbit line decision: pid=\\d+ reason=below-atmosphere .*iconSuppressed=True belowAtmosphere=True",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "timejump refused reason=backward-jump",
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 12 }
# DECLARED 2026-08-24 FROM THE HARVESTED BYTES, and it is the ONE facet this spec
# deliberately left open until the subject existed: B4's `landedSituations` accepts
# LANDED or SPLASHED and the harvest came back **Landed** (a dry-land touchdown at
# lat -0.120 / lon 86.698, terrain 151.923 m). Still REPORT-ONLY - declaring is not
# arming. `Destroyed` (measured 6, the three shed booster pairs) is left to the
# arming pass, which sharpens every window off its own green reading run.
terminalStates = { Landed = { min = 1, max = 1 } }

[runtime]
budgetSeconds = 2400

[retry]
policy = "once"

