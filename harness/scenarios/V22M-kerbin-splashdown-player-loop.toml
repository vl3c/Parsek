#   `Parsek/Saves` but has no "sidecar with no RECORDING row" prune, because no prior
#   recorded fixture carried more than two recordings - worth adding there before the
#   next multi-recording harvest. VERDICT-NEUTRAL: it is harvest exhaust, not a
#   Parsek finding, and it touches nothing this lane loops.
# -------------------------------------------------------------------------------------
tier = "operator"
description = "**RE-PINNED 2026-08-24 OFF ITS FIXTURE'S REAL BYTES**, with its `PENDING_FIXTURE_LANES` exemption (the V15 / V17 precedent) retired in the same commit. `fixtures/saves/kerbin-splashdown-recorded` EXISTS - harvested `--keep-parsek` from `B4-reentry-splashdown` run 2026-08-24_1431, PASS attempt 1 (wall 1,065 s, mission wall 989.2 s, MISSION-OK through SPLASHDOWN, zero anomaly hits, analyzer RED=0) - and it is THE SUITE'S FIRST HARVESTED SURFACE SAVE, against fourteen committed orbit and transfer fixtures, which is exactly why every loop subject in the suite until now ends at an ORBIT. The tree id is REAL, and the eight jump UTs were **RE-DERIVED IN ROUND 2 OFF THE MEASURED LOOP CLOCK** after reading run 1 (`2026-08-24_1616`, retry `_1618`) red INVALID(driver-rewind) on `timejump refused reason=backward-jump` at all eight - the spec's own forbid working exactly as pre-registered, with no render pin reached and nothing about the lens measured yet. Round 2 pins L1 = 21,583.965183089826 and L2 = 43,133.39036617965 straight off `startloopplayback initiated: relaunchUt=`, arrivals at relaunch + the 1,240.1436 s touchdown offset. Run 1 also measured two mechanics no byte table could give: the loop unit's span is the TRACK_SECTION ENVELOPE (1,241.8836, 1.740 s past `explicitEndUT`), and `StartLoopPlayback` issues its OWN forward jump to relaunch-15 s, which is why every bracket must clear that. **THE FIRST LOOP SUBJECT THAT DOES NOT END AT AN ORBIT**, and the flight-map half of roadmap gap G3a. **ROUTING WAS ITSELF A READING, AND THE READING IS IN: THE PRE-REGISTERED `FAITHFUL FIXED CADENCE` HYPOTHESIS IS REFUTED.** A launch-body-only loop starves only the TARGET side; the LAUNCH SITE supplies its own constraint, and run 1 measured `constraints=1 [Rotation(Kerbin) P=21549.425183089825 off=0]` with `method=single-rotation`, `fixedCadenceResidual=0`, `fixedCadenceWithinTol=yes`, `zeroDrift=no` - the cadence quantized to Kerbin's ROTATION period so every replay launches from the same pad position under the sky. NO GATE FIRED ON THAT REFUTATION, because both roads were left UNREQUIRED AND UNFORBIDDEN on V17M's reasoning that requiring either gates the reading on its own answer - which is that reasoning vindicated on the first subject able to test it, and they stay unrequired and unforbidden for run 2. WHY THE LENS MOVES, and the failure mode here is subtler than V17M's: a `surface=Proto(Icon|OrbitLine) .*body=Kerbin` pin (V6M's arrival pin) would MATCH - the harness searches the WHOLE log, and this loop spends most of every cycle in a Kerbin orbit drawing a proto line perfectly well - so it would be satisfied by the COAST and say nothing about the SPLASHDOWN. Not unsatisfiable: VACUOUS, which is the harder mistake because it goes green. The arrival claim therefore rests only on tokens the below-atmosphere state alone emits: the shared-key `Polyline frame: ... drawn=[1-9]` floor, the owned-leg `TracedPath OWNS leg ... body=Kerbin drawn=True` draw, the per-second `Director TracedPath suppress` marker line (chosen over the change-only `MarkerDecision` and `Orbit line decision` lines because it repeats through a dwell), and the ATMOSPHERIC reason token `below-atmosphere` with `belowAtmosphere=True` - which the V23 Mun pair CANNOT share, since an airless body never reaches that branch and suppresses under `polyline-owns-phase` instead. `AssertDrawnRecordingsAccounted` is deliberately NOT pinned: it emits nothing on the clean path, so requiring it would demand an instrumentation gap in order to pass. TWO SHAPE DIMENSIONS MOVE AT ONCE - endpoint type AND, for the first time, a multi-recording debris tree of SEVEN members (MEASURED; the commit-blind `count` reads 9 and the two uncommitted single-POINT stubs behind that difference are named in section 3) - which the induction caveat asks to be PRE-REGISTERED rather than avoided, because no single-recording landed subject exists to avoid it with; the V23 pair, which moves ONE dimension against V6M, is the control that separates them. `terminalStates` WAS deliberately NOT declared while B4's `landedSituations = [\"LANDED\", \"SPLASHED\"]` left the terminal genuinely unknown; THE HARVEST MEASURED `Landed` - a DRY-LAND shoreline touchdown east of KSC (lat -0.120 / lon 86.698, alt 152.476 against terrain 151.923, `splashed = False`), not the water landing the phase name suggests - so the window is now declared from the bytes and stays REPORT-ONLY. Ships `allowedAnomalies = []` on purpose and EXPECTS to read the gated Tier-C `rigid-seam-tangent-discontinuity` raise at the owned descent draw - once per onset, so a single line, added BARE with the flight that shows it and never as a count budget. Watch mode is NOT driven: the program scopes it out, and `EnterWatchMode`'s outcome is a separation-dependent prediction this subject cannot make. NOTHING IS ARMED."
