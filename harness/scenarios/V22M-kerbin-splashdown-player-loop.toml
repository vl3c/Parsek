# -------------------------------------------------------------------------------------
# 0. WHAT THIS LANE MEASURES
# -------------------------------------------------------------------------------------
# **THE FIRST LOOP SUBJECT IN THE SUITE THAT DOES NOT END AT AN ORBIT**, and the
# flight-map half of roadmap gap G3a (`docs/dev/autotest-roadmap.md` -> "The
# loop-render coverage program" -> G3, which is this lane's authority).
#
# Every committed V lane loops a recording that ends in orbit, so every one of them
# reads its arrival through a conic. A recording that ends SPLASHED has no conic at
# the arrival at all: below atmosphere the proto orbit line is suppressed and the map
# truth is the OWNED DESCENT POLYLINE, with the marker riding the suppressed-icon
# fallback. The product claims (v0.10.1) that "looped landings after destination
# parking render connected". No lane has ever checked it.
#
# -------------------------------------------------------------------------------------
# 1. THE ROUTING - PRE-REGISTERED AS FAITHFUL, **MEASURED AS PHASE-LOCK**
# -------------------------------------------------------------------------------------
# **THE READING IS IN. RUN 1 (2026-08-24_1616) REFUTED THIS LANE'S PRE-REGISTERED
# HYPOTHESIS, AND NO GATE FIRED - WHICH IS THE PRE-REGISTRATION EARNING ITS KEEP.**
#
# THE MEASURED ROAD:
#     ExtractConstraints: ... launchBody=Kerbin support=Supported
#       constraints=1 [Rotation(Kerbin) P=21549.425183089825 off=0]
#     PhaseLock APPLIED: ... P=21549.425183089825 **method=single-rotation**
#       cadence 1241.8835614006239->21549.425183089825
#       fixedCadenceResidual=0 fixedCadenceWithinTol=yes zeroDrift=no
#
# A launch-body-only loop does NOT starve the periodicity solver. It starves the
# TARGET side only - there is no `Orbital(<target>) same-parent` constraint, exactly
# as predicted - but the LAUNCH SITE itself supplies one: `Rotation(Kerbin)`, off=0.
# The cadence is quantized to KERBIN'S ROTATION PERIOD so that every replay launches
# from the SAME PAD POSITION under the sky. `support=Supported` with a single
# constraint, so `method=single-rotation` and the fixed cadence is EXACT (residual 0,
# `fixedCadenceWithinTol=yes`) - which is why `zeroDrift=no` here is the right answer
# rather than a fallback: with one constraint there is nothing to drift against and
# no per-window reschedule is needed.
#
# WHAT IT COST AND DID NOT COST: nothing. Because both roads were left UNREQUIRED AND
# UNFORBIDDEN, run 1's verdict was INVALID(driver-rewind) on the jump table alone -
# no routing pin fired in either direction. Had this lane required faithful (or
# forbidden phase-lock) on the strength of the prediction, it would have red
# `PARSEK-FAIL` on a correct product. That is V17M's reasoning vindicated on the
# first subject that could test it.
#
# ---- THE PRE-REGISTRATION AS WRITTEN BEFORE THE FLIGHT (HISTORICAL, REFUTED) ------
# | This subject is a LAUNCH-BODY-ONLY loop: a Kerbin ascent, a Kerbin orbit, a
# | deorbit and a Kerbin splashdown. There is no transfer and no second body anywhere
# | in it. That is a shape no committed V lane has looped before, and it starves BOTH
# | roads:
# |   phase-lock  needs a same-parent TARGET to quantize the cadence against
# |               (`Orbital(<target>) same-parent`, `support=Supported`). There is no
# |               target. Expect `support=Unsupported...` or no phase-lock line at
# |               all.
# |   re-aim      needs a transfer RUN for the classifier to admit. There is no
# |               transfer run to gather, so expect `plan.Supported=False` with a
# |               "no member yields a re-aim transfer"-shaped reason, or silence.
# | **SO THE PRE-REGISTERED PLAUSIBLE OUTCOME IS FAITHFUL FIXED CADENCE** - verbatim
# | replay on the raw span, the V9-dres / V17 shape. That is a PREDICTION, not a pin.
# ----------------------------------------------------------------------------------
#
# THE RE-AIM HALF OF THAT PREDICTION IS NOT REFUTED - it is simply not the road taken,
# and this lane still says nothing about it. Both roads REMAIN unrequired AND
# unforbidden below, unchanged: run 2 reads the RENDER, and re-arming the routing as a
# gate off a single observation would convert a measurement into an assumption.
