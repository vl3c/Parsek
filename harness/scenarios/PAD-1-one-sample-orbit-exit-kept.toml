schema = 1
id = "PAD-1-one-sample-orbit-exit-kept"
tier = "nightly"
# PAD-1: A RECORDING STARTED ON AN ORBITING VESSEL AND LEFT AT ONCE IS KEPT, NOT DISCARDED AS
# IDLE ON THE PAD. The live proof of todo IDLE-ON-PAD-READS-ONE-SAMPLE-ORBITING-RECORDING-AS-IDLE
# (fixed 2026-10-18 on branch `idle-on-pad-one-sample`, headless only, never flown).
#
# THE DEFECT. `ParsekFlight.IsTreeIdleOnPad` / `IsActiveTreeIdleOnPad` read a tree as idle when
# every recording stays within 30 m of its launch point. A recording with ONE trajectory sample
# has `MaxDistanceFromLaunch` 0 by construction, so a recording started on an orbiting vessel
# and taken out of FLIGHT before the recorder's max-interval backstop sample (3 s at Medium
# density) was discarded at the scene exit whatever the vessel was doing. H67's in-game cell
# met exactly this shape (todo H67-AUTOMERGE-DWELL-ENDS-BEFORE-BACKSTOP-SAMPLE) before its dwell
# was lengthened. THE FIX: pad evidence is a tree-level requirement
# (`TreeHasPadEvidenceForIdle`): a launch site, a Prelaunch / Landed / Splashed start or a
# surface terminal on at least one recording. An orbiting one-sample flight shows none and is
# committed.
#
# HOST: `gs2-orbital-stack` (H67's): the 41-part Kerbal X ORBITING Kerbin, SANDBOX, no
# recordings. ROUTE: StartRecording, then ExitToSpaceCenter in the next seam step (one frame
# since PR #2017, far inside the 3 s backstop), with autoMerge ON so the commit is silent.
#
# GATES. The idle-on-pad check answers not idle in either of its two forms, no idle discard,
# the tree auto-commits, and the committed store holds the one recording.
#   - `pad evidence=none` prints only when the distance walk has already read the tree as idle
#     (every recording within 30 m), so it is the one-sample shape;
#   - `'Kerbal X' maxDist=40.7m <dash> not idle` prints when a second sample moved it.
# THE SECOND FORM IS NORMAL SINCE 4727b505f (2026-11-20, todo STOP-TAKES-NO-FINAL-SAMPLE): the
# exit's forced stop takes a final sample at the stop UT, so any exit that lands one physics
# tick (0.02 s, 41 m at orbital speed) or more after the first sample records two points. Until
# then no sample followed the first. `2026-11-23_1554` red on the evidence token alone for that
# reason (points=2 maxDist=41m, the tree committed); the greens `2026-11-08_0219`,
# `2026-11-14_1441` and `2026-11-15_0717` exited on the first sample's own tick, which still
# prints the evidence form. So this lane now proves the outcome
# (an orbiting flight left at once is kept and committed), and the one-sample pad-evidence
# decision is proven by xUnit `IdleOnPadPadEvidenceTests`:
# `IsTreeIdleOnPad_OneSampleOrbitingSingleRecording_NotIdle` (the case and its log line),
# `IsTreeIdleOnPad_NoRecordingShowsEvidence_NotIdle`,
# `IsTreeIdleOnPad_DistanceGuardFiresBeforeTheEvidenceCheck`,
# `IsTreeIdleOnPad_OneSamplePrelaunchSingleRecording_StaysIdle` (the mirror) and
# `IsActiveTreeIdleOnPad_EvidenceCheckRunsAfterTheRecorderFlush`.
#
# FAST-LANE CHECKLIST (harness/README.md): (1) no host flight is a prefix (H67 runs an in-game
# cell, not a seam route); (2) no waits at all, the shape needs the exit at once; (3) no dwells;
# (4) / (5) no burns, no coast; (6) seam-only, every refusal is immediate, retry `none` would
# hide a timing flake, so `once`; (7) the committed count is pinned exactly; (8) nightly until
# measured; (9) flight_efficiency.py after the first green flight.
#
# STATUS: AUTHORED 2026-10-22 (branch `claude/project-thread-77b92l`); LIVE-PROVEN on its first
# flight `2026-10-22_1212` (PASS attempt 1). Token widened 2026-11-23 off `2026-11-23_1554`,
# re-flight owed.
description = "PAD-1: on gs2-orbital-stack (an orbiting Kerbal X), start a recording and leave FLIGHT for the Space Center in the next step, under autoMerge, so the recording has one or two trajectory samples: the idle-on-pad check must answer not idle (no pad evidence, or moved past the idle distance) and the flight must be committed, not discarded."
instanceProfile = "stock-minimal"
tags = ["PAD-1", "idle-on-pad", "scene-exit", "auto-merge", "commit", "orbit", "kerbin", "sandbox"]

[fixture]
saveTemplate       = "fixtures/saves/gs2-orbital-stack"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoMerge", value = "true" },           expect = "OK" },
  # LOAD-BEARING: the pad-evidence verdict is a Verbose line.
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "StartRecording",                                                             expect = "OK", budget = 180 },
  { cmd = "ExitToSpaceCenter",                                                          expect = "OK", budget = 120 },
  { cmd = "ListHandles",       args = { kind = "committed" }, label = "c1",             expect = "OK" },
  { cmd = "MissionMark",       args = { label = "pad1-committed-${c1.count}" },         expect = "OK" },
  { cmd = "FlushAndQuit",                                                               expect = "OK" },
]

[dimensionsCovered]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 1 }

[expectations.logContracts]
required = [
  "startrecording recordingId=[0-9a-f]+ already=false",
  # Either not-idle form (see GATES): the distance walk read the tree as idle (one sample) and
  # the tree-level gate found no pad evidence (ParsekFlight.TreeHasPadEvidenceForIdle), or the
  # walk itself read it as moved. The dash before "not idle" can be a non-ASCII character.
  "startrecording recordingId=[0-9a-f]+ already=false[\\s\\S]*(?:IsActiveTreeIdleOnPad|IsTreeIdleOnPad): (?:tree='[^']*' id=[0-9a-f]+ pad evidence=none|'Kerbal X' maxDist=[0-9.]+m \\S+ not idle)",
  # Kept and committed, not only not discarded.
  "Silent full-fidelity auto-commit \\(scene-exit\\): tree='Kerbal X' recordings=1 ",
  "exittospacecenter complete scene=SPACECENTER",
  "MISSIONMARK label=pad1-committed-1 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "pad evidence=(?!none)",
  "Is(?:Active)?TreeIdleOnPad: all [0-9]+ recordings",
  "TryAutoDiscardIdleActiveTree: idle detected",
  "Idle on pad at scene exit",
  "startrecording rejected",
]

[runtime]
# LoadGame 300, StartRecording 180, ExitToSpaceCenter 120, five default-budget steps at 120,
# plus boot and quit margin.
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
