schema = 1
id = "AST-3-klaw-mine-route"
tier = "nightly"
# =====================================================================================
# AST-3 (owner rulings V 2026-11-15, the Klaw lanes). AUTHORED 2026-11-15 on branch
# `ast-lanes`. MINE-5b's route shape with an asteroid for the ground. FLOWN GREEN 2026-11-15 on
# its fifth flight: reading run `2026-11-15_2130_AST-3-klaw-mine-route` (61e36bd8, PASS attempt
# 1, wall 658 s, mission 558 s; results on branch `ast-flights-2026-11-15`, folder
# `ast-klaw-2026-11-15e`). Every window below is re-pinned off that run and the tier promoted
# operator -> nightly by its measured wall (under the 1,800 s longhaul bar).
#
# WHAT IT TOOK TO FLY. First flight (main 63b5759): kRPC never listed the rock (fixture and
# mission fixes shared with AST-1). Second (fcceccd, folder `ast-klaw-2026-11-15b`): the drill
# mined nothing, its bit pointed sideways; the fixture builder now hangs the MiniDrill on the
# Z-200 with the bit facing the held rock. Third (4c6915a7, folder `ast-klaw-2026-11-15c`):
# monopropellant ran out on MechJeb's dock; the builder adds a second mono pair. Fourth
# (8fb6d08d, folder `ast-klaw-2026-11-15d`): MISSION-OK, but `RouteCommand create` was refused
# `delivered-exceeds-harvested ... harvested=0`, a Parsek defect (todo
# ROUTE-HELD-ROCK-HARVEST-UNCOUNTED: the harvest anchor never crossed the grab and release),
# fixed in 61e36bd8. Fifth: green.
#
# THE RULING UNDER TEST. A route that mines a rock treats the rock's ore like ground ore: the
# drill on a held rock opens a harvest window, the grab itself is an empty grapple window (a
# structural grab, never a route stop), the recording's start is a harvest origin, and the
# harvest window's plausible rate is capped by the drill, not unbounded.
#
# HOST: `ast-miner-lko` (harness/tools/build_ast_klaw_fixtures.py): `AST Miner` (active, pid
# 2710402000: the Klaw probe plus a MiniDrill hung on the Z-200 with its bit facing the held
# rock, an EMPTY RadialOreTank, two Z-400 packs and a second mono pair) at UT 355.83, the rock
# `Ast. VPA-167` (pid 1490391000) 60 m ahead, `AST Depot` (pid 2710404000: an OKTO, a Ready Jr
# port, an EMPTY RadialOreTank of part pid 2710004003, a Z-200) 150 m behind.
#
# THE FLIGHT, while recording on the miner alone:
#   1. GRAB (mission): AST-1's grab of the rock.
#   2. DRILL (mission, three mid-mission seam PartActions on the MiniDrill, all=true): deploy,
#      a 6 s dwell, `startconverter` with NO converter= (every harvester on the drill is pressed;
#      the asteroid one is the one a held rock feeds), 30 s of 1x mining, `stopconverter`.
#   3. RELEASE (mission): the Klaw's `Release`, a 10 s back-off toward the depot, a 10 s coast.
#   4. DOCK (mission): control from the miner's Jr port, target `AST Depot`, MechJeb's docking
#      autopilot (B-DOCK's DOCK phase, as LAB-13b's re-dock).
#   5. TRANSFER (seam): the mined Ore into the depot's tank (part pid 2710004003); Ore conserved
#      (ReadVesselResources before and after).
#   6. UNDOCK (seam) and a rails warp past the mission's bound; Ore still conserved over both
#      halves.
#   7. COMMIT, SEAL, a route created from the recording (a HARVEST-origin route), one cycle sent
#      and a TimeJump past its delivery.
#
# THE MISSION'S GAME-TIME BOUND: UT 370 + settle 5 + arm 5 + target 30 + approach 300 + hold 15
# + drill (3 x seam 60 + deploy 6 + drill 30) + release 30 + back-off 10 + coast 10 + dock
# target 30 + dock 900 + settle 5 = UT 1926 on OK. The first post-mission wait (WarpToUT 2000 at
# 50x) is past it, so it can never be a backward warp.
#
# SIBLING FIXES, both read in the green run: the harvest window carries a capped rate
# (`Harvest window opened: ... converters=[2710002010:ModuleAsteroidDrill:] ... trigger=toggle
# plausibleRates=[Ore:0.0457...]`, not `unbounded`), and the release is a single-controllable
# split (`Controllable split children: [2710402000]`, `Single-controllable split: no RP (...
# type=Undock controllable=1)`).
#
# WHAT THE READING RUN ANSWERED: AST-1's and AST-2's, plus: the converter-less
# `startconverter` presses the MiniDrill once (count=1) and of its three harvester modules only
# the asteroid one (`ModuleAsteroidDrill`) goes active; it runs on the Klaw-held rock and 30 s
# of it yields 0.7477 Ore (window UT 527.79 -> 557.81); the released rock leaves under pid
# 964232981 as a recording of its own named `Ast. VPA-167`; MechJeb docks the miner in 343 s
# of game time (DOCK UT 580.6 -> 923.2); the depot is DOMINANT after the dock
# (`ast3-merged-2710404000`) and the undock gives the miner the new pid 1465541813; the
# transfer moved 0.7477 Ore into the depot's tank. The route: 2 dock windows ordered, the
# grab's skipped as an empty grapple window, `RouteAnalysis harvest: gains covered ...
# lineage=4 resources=1 harvestedTotal=0.74685 edgeSlackUsed=1` (0.00086 Ore of the gain fell
# in the window's edge slack), a harvest origin, `stops=1`, the route `AST3 Ore Run` Paused,
# transit 565.84 s; one send-once cycle delivered 0.74685 Ore (`path=loaded parts=whole`,
# depot 0.7477 -> 1.4945).
# The depot undock authors a two-slot rewind point (`RewindPoint begin: ... slots=2`), and
# the SealSlot step the route needs reaps it (`Reaped rp=... slots=2`), so the produced save
# holds none.
#
# FAST-LANE CHECKLIST: (1) MINE-5b flies the route half on a landed rover; no committed flight
# mines a rock, so no prefix is reusable; (2) explicit-UT waits only; (3) 30 s of mining, the
# dock's own minimum back-off and coast; (4) the long waits are rails (the post-undock warp)
# or a TimeJump; (5) none; (6) every mission phase has a named give-up, retry once; (7) count
# 7..7 and the structure / rewind / routes windows pinned to the reading run; (8) nightly,
# 658 s measured; (9) flight_efficiency.py on the reading run: 558 s of mission wall, 343 s
# MechJeb's 1x dock at 0.5 m/s, 125 s the RCS approach to the rock, 39 s the drill; the 76 s
# it ranks recoverable are 1x coasts inside the approach, the drill and the dock, none of
# which can warp.
# =====================================================================================
description = "AST-3: a mining probe grabs a real asteroid with the Klaw, drills it for 30 s (a harvest window on the held rock, its plausible rate capped by the drill), releases it, docks with a depot under MechJeb, moves the Ore into the depot, undocks and commits; a supply route created from the recording is a HARVEST-origin route whose empty grapple window is no stop, and its one dispatched cycle delivers Ore into the depot. Ore is conserved through the dock, the transfer and the undock."
instanceProfile = "stock-minimal"
tags = ["asteroid", "klaw", "grapple", "mining", "harvest", "logistics", "route", "dock",
        "undock", "mechjeb", "rcs", "AST-3", "reading-run", "flown"]

[fixture]
saveTemplate = "fixtures/saves/ast-miner-lko"
injectedRecordings = "none"
craft = []

[driver]
kind = "autopilot"
mission = "ast_klaw_grab"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",            args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                                expect = "OK" },
  { cmd = "DiscardTree",                                                                  expect = "OK" },
  { cmd = "SetSetting",          args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",          args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  # Miner and depot start with no Ore.
  { cmd = "ReadVesselResources", args = { pid = "2710402000,2710404000", resources = "Ore", expect = "Ore:0", tolerance = "0.01" }, label = "r0", expect = "OK" },
  { cmd = "StartRecording",                                                               expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                               expect = "OK" },
  { cmd = "WarpToUT",            args = { ut = "370", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",         args = { label = "ast3-grab" },                          expect = "OK" },
  # 1-4: grab, drill, release, dock with the depot.
  { phase = "mission",           expect = "MISSION-OK", budget = 2400 },
  { cmd = "MissionMark",         args = { label = "ast3-docked" },                        expect = "OK" },
  { cmd = "ListHandles",         args = { kind = "active" }, label = "dk",                expect = "OK" },
  { cmd = "MissionMark",         args = { label = "ast3-merged-${dk.activePid}" },        expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "${dk.activePid}", resources = "Ore,ElectricCharge" }, label = "rm", expect = "OK" },
  # 5: the mined Ore into the depot's tank, conserved.
  { cmd = "PartAction",          args = { button = "transfer", part = "RadialOreTank", partPid = "2710004003", resource = "Ore" }, label = "tr", expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "${dk.activePid}", resources = "Ore", expect = "Ore:${rm.Ore}", tolerance = "0.01" }, expect = "OK" },
  # 6: undock, then a rails warp past the mission's game-time bound.
  { cmd = "MissionMark",         args = { label = "ast3-undock" },                        expect = "OK" },
  { cmd = "PartAction",          args = { button = "undock" }, label = "und",             expect = "OK" },
  { cmd = "WarpToUT",            args = { ut = "2000", maxRate = "50" },                  expect = "OK", budget = 300 },
  { cmd = "ReadVesselResources", args = { pid = "${dk.activePid},${und.newPid}", resources = "Ore", expect = "Ore:${rm.Ore}", tolerance = "0.01" }, label = "rsum", expect = "OK" },
  # 7: commit; CommitTree on the still-active vessel re-takes the committed tree (a
  # copy-on-write clone); stop and discard the clone, the committed original stays.
  { cmd = "StopRecording",                                                                expect = "OK" },
  { cmd = "CommitTree",                                                                   expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                expect = "OK" },
  { cmd = "DiscardTree",                                                                  expect = "OK" },
  { cmd = "ListHandles",         args = { kind = "committed" }, label = "c0",             expect = "OK" },
  { cmd = "MissionMark",         args = { label = "ast3-committed-${c0.count}" },         expect = "OK" },
  { cmd = "SealSlot",            args = { tree = "${c0.rec0tree}" },                      expect = "OK", budget = 120 },
  { cmd = "RouteCommand",        args = { action = "create", tree = "${c0.rec0tree}", name = "AST3 Ore Run" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand",        args = { action = "send-once", route = "AST3 Ore Run" }, expect = "OK", budget = 120 },
  { cmd = "TimeJump",            args = { ut = "9000" },                                  expect = "OK", budget = 300 },
  { cmd = "ListHandles",         args = { kind = "routes" },                              expect = "OK" },
  { cmd = "MissionMark",         args = { label = "ast3-delivered" },                     expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "${dk.activePid},${und.newPid}", resources = "Ore" }, label = "rdel", expect = "OK" },
  { cmd = "SaveGame",                                                                     expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                                 expect = "OK" },
]

[driver.missionParams]
rockName               = "Ast. VPA-167"
startSettleSeconds     = 5
armSeconds             = 5
targetTimeoutSeconds   = 30
standoffMeters         = 2
approachTimeoutSeconds = 300
holdSeconds            = 15
drillSeconds           = 30
drillPart              = "MiniDrill"
drillDeploySeconds     = 6
seamTimeoutSeconds     = 60
release                = true
releaseTimeoutSeconds  = 30
backoffSeconds         = 10
backoffTranslation     = 0.3
coastSeconds           = 10
dockTargetName         = "AST Depot"
# bdock_dock_transfer's DOCK keys (as LAB-13b's re-dock).
dockSpeedMetersPerSec  = 0.5
dockTimeoutSeconds     = 900
dockNoProgressSeconds  = 120
settleSeconds          = 5

[dimensionsCovered]
# claw-producer       <- `OnPartCouple producer classified: kind=Grapple`
# harvest-provenance  <- `Harvest window opened:` + `harvest origin`
# dock-producer       <- `OnPartCouple producer classified: kind=DockingPort` (the depot)
D5  = ["cross-tree-foreign-dock", "undock-split"]
D7  = ["dock-undock"]
D10 = ["claw-producer", "harvest-provenance", "dock-producer", "delivery", "resource-cargo"]
D14 = ["kerbin", "sandbox", "scene-flight", "warp-1x", "warp-rails"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The root, the grab child, the release's miner and rock children, the depot dock child, the
# depot undock's two children (the depot and the miner); the reading run read 7.
count = { min = 7, max = 7 }

[expectations.recordings.structure]
# REPORT-ONLY. The reading run of 2026-11-15 (`2026-11-15_2130_AST-3-klaw-mine-route`) matched
# every window below; arming is the operator's call. Two docks (the grab, the depot), two
# undocks (the release, the depot), the rock a recording of its own, three spawned tips (the
# depot, the miner, the rock), one rock part in the produced save.
gating            = false
trees             = { min = 1, max = 1 }
committedTrees    = { min = 1, max = 1 }
branchPoints      = { Dock = { min = 2, max = 2 }, Undock = { min = 2, max = 2 } }
spawnedVessels    = { min = 3, max = 3 }
spaceObjectParts  = { "Ast. VPA-167" = { min = 1, max = 1 } }
vesselNames       = { "AST Depot" = { min = 1, max = 1 }, "AST Miner" = { min = 1, max = 1 } }
recordingNames    = { "AST Depot" = { min = 2, max = 2 }, "AST Miner" = { min = 4, max = 4 }, "Ast. VPA-167" = { min = 1, max = 1 } }

[expectations.rewind]
# REPORT-ONLY. The release authors no point (the rock is not controllable). The depot undock
# authors one (`RewindPoint begin: rp=... slots=2`, UT 928.83), but the produced save is read
# after the SealSlot step the route needs: sealing the last open slot makes both Immutable and
# the reaper takes the point (`Sealed slot=1 ... reaperImpact=willReap reaped=1`, `Reaped rp=...
# slots=2`). The reading run of 2026-11-15 (`2026-11-15_2130_AST-3-klaw-mine-route`) read 0
# points (the authored guess, 1, did not see the reap), no supersede row and no tombstone.
gating        = false
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.routes]
# REPORT-ONLY. The reading run of 2026-11-15 (`2026-11-15_2130_AST-3-klaw-mine-route`) matched:
# one route of one DockingPort stop at the depot, one completed cycle, none skipped, paused
# after it.
gating                = false
count                 = { min = 1, max = 1 }
dormant               = { max = 0 }
stops                 = { min = 1, max = 1 }
completedCycles       = { min = 1, max = 1 }
skippedCycles         = { max = 0 }
statuses              = { Paused = { min = 1, max = 1 } }
connectionKinds       = { DockingPort = { min = 1, max = 1 } }
destinationVesselPids = ["2710404000"]

[expectations.logContracts]
required = [
  "readvesselresources complete vessels=2 missing=0 uidCollisions=0 [^\\r\\n]*match=true",
  # 1. THE GRAB.
  "MISSIONMARK label=ast3-grab [\\s\\S]*OnPartCouple producer classified: kind=Grapple (?:fromPart=PotatoRoid toPart=GrapplingDevice|fromPart=GrapplingDevice toPart=PotatoRoid) involvesEva=False",
  "Route proof dock window captured: child=[0-9a-f]+ window=[^ \\r\\n]+ targetPid=1490391000 kind=Grapple ",
  # 2. THE DRILL on the held rock (the mission's mid-mission seam presses).
  "partaction applied button=deploy pid=2710402000 part='MiniDrill' [^\\r\\n]*count=[1-9]",
  "partaction applied button=startconverter pid=2710402000 part='MiniDrill' [^\\r\\n]*count=[1-9]",
  # The asteroid harvester's window carries a capped Ore rate, not `unbounded` (sibling fix,
  # read in the green run as `plausibleRates=[Ore:0.0457...]`).
  "Harvest window opened: window=[^ \\r\\n]+ ut=[0-9.]+ converters=\\[[^\\]\\r\\n]+\\] res=[0-9]+ atStart=0 trigger=[a-z]+ plausibleRates=\\[Ore:[0-9]",
  # 3. THE RELEASE: an Undock split authoring no rewind point (sibling fix, as AST-2; read in
  # the green run).
  "Tree branch created: type=Undock, bp=[0-9a-f]+, activeChild=[0-9a-f]+ \\(pid=2710402000\\), bgChild=[0-9a-f]+ \\(pid=[1-9][0-9]*\\)",
  "Single-controllable split: no RP \\(bp=[0-9a-f]+ type=Undock controllable=1\\)",
  # 4. THE DOCK with the depot: a docking-port couple, a cross-tree single-parent merge.
  "OnPartCouple producer classified: kind=DockingPort ",
  "Route proof dock window captured: child=[0-9a-f]+ window=[^ \\r\\n]+ targetPid=2710404000 kind=DockingPort ",
  # 5. THE TRANSFER into the depot's tank, and Ore conserved through it.
  "partaction applied button=transfer pid=[0-9]+ part='RadialOreTank' [^\\r\\n]* resource=Ore moved=[0-9]+\\.[0-9]{4} sources=1 destBefore=0\\.0000 destAfter=[0-9]+\\.[0-9]{4} destMax=75\\.0000",
  "(?s)MISSIONMARK label=ast3-docked (?:(?!MISSIONMARK label=ast3-undock).)*?readvesselresources expect resource=Ore expected=[0-9]+\\.[0-9]{4} actual=[0-9]+\\.[0-9]{4} diff=-?0\\.00[0-9]{2} tolerance=0\\.0100 match=true",
  # 6. THE UNDOCK, and Ore conserved over both halves.
  "(?s)MISSIONMARK label=ast3-undock (?:(?!partaction applied button=).)*?partaction applied button=undock pid=[0-9]+ part='dockingPort3' partId=[0-9]+ event=Undock newPid=[1-9][0-9]* ",
  "(?s)MISSIONMARK label=ast3-undock (?:(?!MISSIONMARK label=ast3-committed).)*?readvesselresources complete vessels=2 missing=0 uidCollisions=0 [^\\r\\n]*match=true",
  "committree committed=true",
  # 7. THE ROUTE: a harvest origin, the grab an empty grapple window (no stop), one cycle
  # delivering into the depot.
  "sealslot complete mode=tree tree=[0-9a-f]{32} ",
  "routecommand create gate tree=[0-9a-f]{32} treeFound=True dismissed=False sealed=True eligible=True status=Eligible alreadyPromoted=False refusal=None",
  "RouteAnalysis: skipped 1 empty grapple window\\(s\\) as non-stops ",
  "RouteAnalysis: undocked start fully harvest-covered -> harvest origin originRec=[0-9a-f]{32} resources=1",
  "RouteAnalysis eligible: source=[0-9a-f]{32} window=[^ \\r\\n]+ stops=1 resources=1 [^\\r\\n]*harvestData=1 harvestOrigin=1 midTreeOrigin=0",
  "routecommand complete action=create tree=[0-9a-f]{32} route=[^ \\r\\n]+ name='AST3 Ore Run' status=Paused ",
  "Delivery write: route=[^ \\r\\n]+ dest=[^\\r\\n]+ pid=[0-9]+ resource=Ore requested=[0-9][0-9.E+-]* written=[0-9][0-9.E+-]* [^\\r\\n]*path=[a-z-]+",
  "MISSIONMARK label=ast3-delivered ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "partaction rejected",
  "routecommand rejected",
  "warptout refused",
  "BLOCKED kind=DestinationFull",
  "Built route .* mode=CAREER",
  # The harvest window's plausible rate must bound the delivery, never be reported as a cap
  # on an honest harvest (MINE-5b's mirror pin).
  "harvest-origin delivery capped to plausible harvest",
]

[runtime]
# One LoadGame (300 s), the mission (up to 2,400 s wall: grab, 30 s of mining and a MechJeb dock
# at 1x), a rails warp (up to about 1,600 game s at 50x), a commit, a seal, a route create, a
# TimeJump and a save. The reading run took 658 s; the budget stays the step-budget envelope.
budgetSeconds = 4200

[retry]
policy = "once"
