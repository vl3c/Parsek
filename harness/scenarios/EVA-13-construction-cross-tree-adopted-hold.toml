forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "evagroundscience failed",
  "evagroundscience refused",
  "switchclick refused",
  "switchclick failed",
  "Foreign inventory transfer: no background recorder",
  "lost its member recording",
  "vessel joined the tree vesselPid=1871615455 [\\s\\S]*vessel joined the tree vesselPid=1871615455 ",
  "invokerewindtolaunch refused",
  # The old bug shape: the rover's pid in the strip set (pre-fix route
