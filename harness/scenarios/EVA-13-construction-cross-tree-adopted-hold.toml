[runtime]
# RC-6's measured-safe 1500 plus tree A: two switch clicks (120 each), a 1x wait of about
# 15 s, a commit (120) and a 10x warp of about 55 s, and a 1x tail of about 35 s more than
# RC-6's. 1500 + 600 = 2100.
budgetSeconds = 2100

[retry]
policy = "once"

[expectedFail]
bugId = ""
