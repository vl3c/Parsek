# THE BACKWARD-JUMP FORBID is the V3C run-3 self-detection guard: a refused jump is only a
# WARN, so without it a mis-derived UT would let this lane dwell twice at ONE epoch and
# report it as two. The UT is RVR-2's and was driven forward on these exact bytes on
# 2026-09-01, so this is a guard on a measured value rather than on a derivation.
#
# V18T's VACUITY FORBID IS DELIBERATELY **NOT** COPIED, and the reason is structural
# rather than a preference. That lane forbids
# `SelectGhostDrivingBackingMissions: .*skippedByStatus=[1-9]` on the argument that its one
# committed route being skipped by status would empty the whole reading - true THERE,
# because its route arrives Active in the fixture and is never anything else. HERE the route
# is CREATED at step 9 and ACTIVATED at step 10, so between those two steps it is genuinely
# Paused and the selector genuinely emits `ghostDriving=0 skippedByStatus=1 ... totalRoutes=1`
# (the emitter is `VerboseOnChange`, so that transition prints exactly once). The forbid
# would therefore be UNSATISFIABLE BY CONSTRUCTION and would red every correct run.
# WHAT CARRIES THE CLAIM INSTEAD is required token 6 plus the fact that there is exactly ONE
# committed route: `ghostDriving=[1-9]` cannot be satisfied unless THIS route reached
# GhostDriving, and token 7 says the flight host then took it.
#
# THE TWO SKIP-COUNTER FORBIDS, ADDED AT ARMING (2026-09-02) OFF THE CENSUS. `malformed`
# is `RouteLineSkipReason.MalformedMixedBodies` (period 0 with mixed member bodies) and
# `other` is `NoBackingRecordings` (zero drawable groups). BOTH measured 0 on every one of
# the run's thirteen draw lines, and on a Kerbin-only rover route either would be a genuine
# product finding rather than an epoch or a timing artifact - which is exactly the class of
# reading a forbid should carry. `skippedOwned` is deliberately NOT forbidden: it measured
# 1 on nine of the thirteen lines and is the ownership HANDOFF, not a skip.
#
# STILL NO FORBID ON `Route line draw: .* routesDrawn=0`. The census measured that reading
# as the ghost-owned half of a legitimate handoff, so forbidding it would forbid the
# product's own correct behaviour - and required token 12 asserts that exact line.
#
# THE BACKWARD-JUMP FORBID is the V3C run-3 self-detection guard: a refused jump is only a
# WARN, so without it a mis-derived UT would let this lane dwell twice at ONE epoch and
# report it as two. Silent on the census, as the RVR-2-measured UT predicted.
#
# THE TWO KSC NEGATIVES ARE V22K's, AND THEY ARE SAFE HERE FOR ITS REASON: the per-frame
# pose resolvers gate EVERY point on `bodyName != "Kerbin"` and return false BEFORE their
# success line, so on a subject that is Kerbin-frame end to end (every recording in this
# fixture is a KSC Runway subject) neither skip line can appear - and the census confirms
# it, zero occurrences of either. They are what make required token 17 sharp rather than
# merely satisfied. Note that neither MESSAGE contains the literal token `non-kerbin` -
# that is the internal `KscPoseResolution.Failure` reason, not the log text.
#
# V18T's VACUITY FORBID IS STILL DELIBERATELY **NOT** COPIED, and the census PROVED the
# reasoning above rather than leaving it an argument: the log carries
# `SelectGhostDrivingBackingMissions: ghostDriving=0 skippedByStatus=1 skippedNull=0
# totalRoutes=1` between the create and the activate, exactly once, exactly as predicted.
# Copying that forbid would have red every correct run of this lane.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "timejump refused reason=backward-jump",
  "Route line draw: .* malformed=[1-9]",
  "Route line draw: .* other=[1-9]",
  "KSC point skipped: recording=.* body=",
  "KSC segment skipped: beforeBody=",
]

[expectations.renderComposition]
# M-A7 - DECLARED BARE, 2026-09-02. No `gating`, no window, no list. Declaring is what
# sets `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder at Awake, and
# `rendercompose` then records its facets UNCONDITIONALLY on a parseable manifest - which
# is how a lane earns its first honest window off a green report-only run. A window
# written today would be a PREDICTION read back as though it were a measurement, which is
# the mistake V14M, V8, V6M and V18T all shipped bare through their reading runs to avoid.
#
# WHAT THIS MANIFEST IS FOR ON THIS LANE, and it is two things no committed manifest has:
#   * `routeLineBuilds` / `routeCoDrawViolations` / `routeLegDefers` on a SURFACE route.
#     V18T is the only lane that has ever put a non-zero number in the first
#     (`routeLineBuilds = 1`, measured 2026-08-26 IN THE TRACKING STATION) and its subject
#     is a Kerbin-ORBIT depot route. A surface reading is a second data point on a census
#     that has exactly one.
#   * `ownershipChanges` on a map-open landed / route subject. V6M closed
#     RC-OWN-DRAW-HALF-IS-MAP-GATED with `ownershipChanges = 6` on a MUN ORBIT subject and
#     its closure text carries the qualifier explicitly, so this facet is unmeasured on
#     this class. A zero here alongside a present `Polyline frame:` would be a real
#     finding rather than the old instrument gap - which is precisely what the debt's
#     `ownership-publish-surface-never-ran` stand-down was built to stop hiding.
#
# ONE EXPECTED MANIFEST DIFFERENCE FROM RVR-2, NAMED SO IT IS NOT READ AS A SURPRISE.
# RVR-2 runs the same create-and-dispatch shape over the same host and deliberately does
# NOT declare this block, its stated reason being that "a confirmed dock crossing appends
# `route-dock-crossing` CLOCK-EVENTs to that manifest". This lane DOES declare it and its
# route IS Active, so if the jump fires a cycle those CLOCK-EVENTs land in the manifest.
# That is not a defect and nothing gates on it; it is the cost of taking the manifest on a
# live route, and RVR-2 keeps its own posture unchanged.
