# TOKEN 18 THE ROUTE SURVIVED THE SAVE/LOAD, from `RouteStore.RevalidateSources`
#          (`:1488`). `routes=1` says exactly this lane's route is in the reloaded store
#          and `transitioned=0` says it did NOT flip to `SourceChanged` under the
#          load-time optimizer - V18T's token, and it is the only thing standing between
#          a quiet source-drift and a KSC half that measures an empty store.
#          **IT IS NOT SCENE-ANCHORED, AND NO CLEAN ANCHOR EXISTS.** The line's own fields
#          are `reason` / `routes` / `transitioned` / `caughtUp` / `ersIndexed` /
#          `ersTotal` - no scene, no UT - and this run emits it TWICE (the FLIGHT boot and
#          the SPACECENTER boot both reach `ParsekScenario.OnLoad`'s
#          `RevalidateSources("OnLoad")`), so a match proves only that SOME load saw one
#          route that did not transition. Anchoring on `reason=OnLoad` does not
#          discriminate either, since both emissions carry it. The token is kept as
#          written because the claim it is used for - the route exists and is not
#          source-drifted - is true at both epochs and the FLIGHT emission alone would
