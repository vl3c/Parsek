# Budget arithmetic (M-A5 S8): run.py gives EVERY deferred seam verb
# `required_step_wait(max(step budget, SEAM_FALLBACK_DEFERRAL_SECONDS=600))` = 660 s
# regardless of the declared step budget. THREE steps are deferred here - both `LoadGame`s
# and the `TimeJump` - so the deferred worst case alone is 3 x 660 = 1980. On top of it sit
# the synchronous verbs (SealSlot 120, two RouteCommands 240, the map-view pair 240,
# SaveGame 120, ExportRenderManifest 120) and 120 `RecordingState` ticks. 3000 clears the
# worst case with headroom.
#
# THE WALL FIGURE COVERS THE DEFERRED WORST CASE, not an observed wall, and it stays at
# 3000 regardless of how fast the first run turns out to be: trimming it to hug the
# expectation would convert a slow load into a KILLED run with NO CENSUS, which on a first
# reading destroys the entire product of the flight.
