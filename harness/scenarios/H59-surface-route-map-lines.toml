# reason (`no-new-observation`) is precisely about not clobbering a populated manifest
# with an empty one. The verb bypasses it by design, and the placement rule
# `test_every_declarer_exports_immediately_before_teardown` FORCES the verb to be the
# second-to-last step - which on any two-scene lane forces it into the second scene. That
# tension is a real one, it is not this package's to resolve, and it is filed as
# RENDER-MANIFEST-VERB-EXPORT-IN-A-SECOND-SCENE-CLOBBERS-THE-FIRST-SCENE-ACCUMULATION in
# `docs/dev/todo-and-known-bugs.md` (REPORT-ONLY; the per-scene partition is deliberate,
# what is undocumented is the consequence for a multi-scene lane). THAT ENTRY IS THE
# SECOND FACE OF THE OLDER `M-A7-ONE-MANIFEST-PER-PROCESS`, not a new defect: same root
# cause (one fixed path, last-flush-wins), and the two cross-reference each other. What
# is new is the VERB bypass plus a placement rule that forces the export into the last
# scene, which is why that entry's "fine for harness lanes (one scene, one export)"
# scoping stopped holding the moment a lane had two scenes.
