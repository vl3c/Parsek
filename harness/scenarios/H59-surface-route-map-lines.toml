#   * ~~`KSC SURFACE playback resolved`~~ - PROMOTED TO REQUIRED TOKEN 17 at arming;
#     section 3 carries the determinism argument and what a red on it alone would mean.
#   * every dispatch token (`Delivery write:`, `BLOCKED kind=`, `ArmedPause:`). Those are
#     RVR-2's assertions over the same bytes and they stay RVR-2's; an Active route may
#     fire a cycle at the jump and this lane neither requires nor forbids it.
#   * `faithful-parity summary` / `seam-endpoint summary`. Requiring an emitter no lane
#     has verified on THIS host is how a flight is spent discovering a pin was
#     unsatisfiable (V22K's rule, kept).
#   * any `Skipped ghost map for #N ... terminal=` line. The landed pin measured it on a
#     LOOP MEMBER of a landed-terminal recording; this lane's subject is a route, and
#     predicting which of the pin's three gates a route reaches is the prediction the
