description = "**CENSUS FLOWN, READ AND ARMED 2026-09-02: run `2026-09-02_0947`, PASS attempt 1, wall 99 s, every verifier green (anomalySweep `hits=[]`, analyzer PASS, saveParse REPORT `mismatches=0`, recordings 5 against the pinned 5). OUTCOME A IS MEASURED AND IT CAME BACK RICHER THAN EITHER PRE-REGISTERED OUTCOME.** The thirteen `Route line draw:` lines: two pre-create frames at `routesDrawn=0 cache=0`, then frame 5310 `routesDrawn=1 legsDrawn=1 skippedOwned=0 malformed=0 other=0 deact=0 cache=1`, then nine frames (5426..6383) at `routesDrawn=0 legsDrawn=0 skippedOwned=1`, then frame 6502 back to `routesDrawn=1 legsDrawn=1`. **THE ANSWER TO D11: a surface route's path IS on the flight map, and BOTH producers draw it** - the static overview when the ghost is not on that leg, and the ghost when it is (`skippedOwned=1` with `Polyline frame: scene=FLIGHT drawn=1 ... hidden=0` in the same window). Said precisely, because the loose version overclaims: the first drawn frame and all nine handoff frames fall inside the map-open window (12:48:23.415 to 12:48:44.007), while the second drawn frame is 140 ms AFTER `exitmapview` - the route-draw slot gates on the planetarium camera and the scene, not on `MapView.MapIsEnabled` - so what the run establishes is CO-PRESENCE of both producers with the handoff observed map-open, not a strict alternation inside one window. Outcome B never happened and its two diagnoses stayed at zero on all thirteen frames, so `malformed=[1-9]` and `other=[1-9]` are FORBIDS now rather than possibilities. The pre-registration's warning that `skippedOwned=1` is NOT an absence is the half that carried the result: read naively, nine of thirteen lines say no route line, and the correct reading is that the ghost had the leg. **IT DOES NOT CONTRADICT THE LANDED PIN** `LANDED-TERMINAL-LOOP-HAS-NO-MAP-PRESENCE-OUTSIDE-THE-FLIGHT-SCENE`: that pin is about proto-driven presence for a loop MEMBER and the member still gets no proto; what the census adds is that proto presence and route-overview presence are INDEPENDENT, exactly as the producer split predicted (`RouteTrajectoryLineRenderer.DrawAll` walks `RouteStore.CommittedRoutes` from its own cache and consults no proto, no `GhostMapPresence` entry and no terminal state, and publishes no ownership by design). **THE TWO DRAW LINES ARE PINNED AS A PAIR AND THAT IS THE POINT**: requiring only the `routesDrawn=1` line would pass on a run where the ghost never drew, requiring only the `skippedOwned=1` line would pass on a run where the overview never drew, and together they assert CO-PRESENCE - not order, and not map-openness, which tokens 8, 9 and 13 carry. **RC-OWN-DRAW-HALF-IS-MAP-GATED IS MEASURED ON A SURFACE-ROUTE SUBJECT, ON A SECOND INSTRUMENT THAN THIS LANE EXPECTED.** The log half landed as designed (four `Polyline frame: scene=FLIGHT drawn=1` summaries, where that debt's own evidence rule is that ZERO summaries means every map-gated LateUpdate bailed early). The PUBLISH half is proven by the route-draw line rather than by the manifest: `skippedOwned` increments only when `GhostTrajectoryPolylineRenderer.IsRenderingNonOrbitalLeg` returns true, and that method's whole body is a read of `drewNonOrbitalLegRecordings` - the SAME set `RenderCompositionRecorder.NoteOwnershipPublish` is fed from, on the same epilogue - so nine `skippedOwned=1` frames are nine frames on which the publish surface ran AND was populated with this route's member. V6M closed that debt on a MUN ORBIT subject with the qualifier written into the entry; the qualifier is now discharged for this class too, on log evidence. **THE KSC POSE PIN IS ARMED, and the epoch determinism is argued rather than assumed**: every input to the phase is a literal (committed fixture, one `TimeJump ut=1600`, a `SaveGame` right after it), the exported PLAN UNIT gives `spanStartUT` 468.50 / `spanEndUT` 513.54 against `cadenceSeconds=50` so the out-of-window dead zone is 4.96 s per cycle, the measured KSC dwell is 10.274 s of wall clock (`ParsekKSC initialized` 12:48:47.550 -> `exportrendermanifest ok` 12:48:57.824) for a 2.07x margin, and - the load-bearing half - THE DWELL IS POLL-BOUND RATHER THAN MACHINE-BOUND: `run.py`'s fixed `POLL_INTERVAL_SECONDS = 0.25` x 40 ticks is a 10 s floor no matter how fast the machine is (0.257 s/tick measured), so a faster machine cannot shrink it and a slower one only lengthens it. A future red on that token ALONE is an epoch reading and the fix is a longer dwell, never unpinning. The two `KSC point skipped` / `KSC segment skipped` negatives are forbidden, V22K's reason verbatim. **WHAT IS DELIBERATELY NOT ARMED: `[expectations.renderComposition]`, which stays BARE.** Its route counters read `routeLineBuilds=0 routeLegDefers=0 routeCoDrawViolations=0 ownershipChanges=0` while the log shows one build and nine handoffs, and both are correct: the recorder Resets on `OnGameSceneSwitchRequested` (per-scene BY DESIGN), the file has ONE fixed path, and a VERB export is never routed through the anti-clobber guard - so this lane's SPACECENTER export overwrote the FLIGHT manifest the scene-exit auto-flush had already written. The exported file proves it (`scene = SPACECENTER`, one PLAN UNIT `host = KSC`, one CLOCK_EVENT, zero route records). A `routeLineBuilds = { min = 1 }` window would therefore be STRUCTURALLY UNSATISFIABLE on this lane's own step list - the V17M mistake in a fourth costume - and the three log-side instruments carry those facts instead. Filed as RENDER-MANIFEST-VERB-EXPORT-IN-A-SECOND-SCENE-CLOBBERS-THE-FIRST-SCENE-ACCUMULATION (REPORT-ONLY, out of package). **ONE AUTHORING JUDGEMENT WAS CONFIRMED RATHER THAN LUCKY**: V18T's vacuity forbid `SelectGhostDrivingBackingMissions: .*skippedByStatus=[1-9]` was deliberately not copied because this lane CREATES then ACTIVATES, so its route is genuinely Paused for a window; the log carries `ghostDriving=0 skippedByStatus=1 skippedNull=0 totalRoutes=1` exactly once, and copying that forbid would have red the run. The route is created rather than loaded because the fixture carries no `ROUTES` node (the property RVR-2 exploits) and a created route is `Paused`, which is not GhostDriving. Jump UT 1600 is RVR-2's, measured forward on these exact bytes on 2026-09-01. No dispatch token is required or forbidden - those are RVR-2's assertions. `allowedAnomalies = []` held with zero hits. **ARMED ATTEMPT 1 (`2026-09-02_1017`) red PARSEK-FAIL(expectation) on EXACTLY ONE token, zero forbids, and it was an ARMING DEFECT IN THIS FILE rather than a product finding**: the build line had been pinned at the census run's `route=de65a95d` while that run emitted `route=b4380253`, because the route is CREATED by step 9 and its id is generated per run. EVERYTHING ELSE REPRODUCED IDENTICALLY - the same 2 pre-create / 2 drawn / 9 handed-off split, six KSC pose lines, five Polyline summaries, recordings 5 - which turns the census from one reading into a repeatable measurement and corroborates the KSC epoch argument by repeat rather than by argument. The id is now the character class `[0-9a-f]{8}` (`RouteIds.Short`'s own shape); the one id still pinned as a literal is the TREE, which the fixture ships. Both logs replay 18/18 required met and 0/6 forbids tripped. OWED: the ARMED RE-FLIGHT on the corrected set and then the negative control; the D10 `route-map-lines-surface` flavor is claimed CONDITIONAL on that re-flight."
