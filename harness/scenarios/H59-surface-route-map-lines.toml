# declarer, and it earned that off FIVE offline reads plus an armed re-flight and
# a negative control; this lane has none of that yet.
#
# WHY THE BLOCK IS WORTH DECLARING HERE AT ALL. This is the only committed lane
# that CREATES its route rather than loading one, so its produced save is the only
# place the create -> activate -> one-dispatch chain is visible as BYTES. The log
# contracts above assert that chain from lines the run printed; this block will
# assert the state those lines left behind. A route that flipped status after the
# last log line, or one the next load would DROP, is invisible to a token and
# visible here.
#
# **NEVER EVALUATED ON A RUN. NOT ONE FLIGHT HAS READ THIS BLOCK.** It was added
