# 6. HOW TO READ A RUN
# -------------------------------------------------------------------------------------
# THE CENSUS IS TAKEN. What follows is how to read the ARMED re-flight and anything after
# it, and the authoring-time census guidance is kept below it because a future re-harvest
# puts this lane back in census posture.
#
# RED ON EITHER DRAW LINE IS A PRODUCT READING, and which one moved says what changed.
# Losing `routesDrawn=1` means the static overview stopped drawing; losing
# `skippedOwned=1` means the ghost stopped claiming the leg (check `Polyline frame:` in
# the same window - if `drawn=0` there too, the map-gated walk is the suspect, not the
# route). Both together is a `showRouteLines` or a map-camera regression.
#
# GREEN was the expected verdict of the census and it was NOT the result. The result was
# the numbers, and a green run reading `routesDrawn=0 other=1` would have been as
# informative as the one that read `routesDrawn=1`. The three-run discipline
# (reading -> armed re-flight -> negative control) is where this lane is: the reading is
# DONE, the arming is THIS COMMIT, and the re-flight plus the control are owed.
#
# RED ON `Polyline frame:` OR `Route line draw:` IS AN INSTRUMENT RED, NOT AN ANSWER. It
# means the map-gated slot never ran (a refused `EnterMapView`, a dwell too short for the
# 5.0 s / 2.0 s rate-limit windows, or a Driver early return upstream of the gate), and
# the fix is the lane, not a product filing. The dwells are FORTY ticks each for V16M's
# proven reason: a five-second `VerboseRateLimited` window swallows a short dwell's second
# emission, and `polyline.frame.summary` is exactly 5.0 s.
#
# RED ON `\[Parsek\]\[ERROR\]` or a gated anomaly IS a finding. `allowedAnomalies = []`
# is deliberate and follows V22M / V23M, whose headers pre-register the same risk on the
# same class: Tier-C `rigid-seam-tangent-discontinuity` raises at an owned descent draw
# and IS in the gated set, so a raise reds this spec with every step green - the correct
# catch. Both landed lanes shipped `[]` and both read PASS on their first green run, so
# the risk is pre-registered rather than predicted to fire.
#
# ANYTHING THIS RUN FINDS THAT IS NOT THE CENSUS becomes a `docs/dev/todo-and-known-bugs.md`
# entry, never a re-run. It found one; section 7.
#
# -------------------------------------------------------------------------------------
# 7. WHY THE MANIFEST'S ROUTE COUNTERS READ ZERO, AND WHY THEY ARE NOT PINNED
# -------------------------------------------------------------------------------------
# THE CONTRADICTION, stated first because it is what a reader will notice: the KSP.log
# carries ONE `Route line build:` line and NINE owned-handoff frames, and the manifest
# reports `routeLineBuilds=0 routeLegDefers=0 routeCoDrawViolations=0
# ownershipChanges=0`. Both are correct.
#
# THE MECHANISM, read from source rather than inferred. `RenderCompositionRecorder`
# subscribes `OnGameSceneSwitchRequested`, which calls `TryAutoFlush(ReasonSceneExit)` and
# then `Reset()` - so the accumulation is PER SCENE BY DESIGN, and the FLIGHT records were
# flushed to the manifest file at the scene switch. The file is then written to ONE FIXED
# PATH, and this lane's `ExportRenderManifest` runs in SPACECENTER: the verb export is
# NEVER routed through the anti-clobber guard (`ShouldSkipAutoFlush`'s own docstring says
# so verbatim - "The VERB export is never routed through here; an explicit export always
