[dimensionsCovered]
# NOTHING CLAIMED, stated rather than left implicit.
#
# NO D10 / D11 ROW: this lane has never flown, and the CLAIM-IS-NOT-GATE rule
# (autotest-roadmap.md, "Trust and fail-open risks", item 5) is what the whole RVR wave
# held itself to. The row this lane would eventually earn is the SURFACE flavor of
# `route-map-lines`, and it is earned by an ARMED gating token off a green census - which
# is exactly how V18T earned the orbital flavor (`routeLineBuilds = { min = 1 }`, armed
# 2026-08-26, negative control red on `routeLineBuilds 1 < min 5`). A census that reads
# outcome B earns no row at all and instead re-words the roadmap item, which is a
# legitimate result and not a failure.
#
# NO D14 ROW EITHER: the boot facts (`sandbox`, `scene-flight`) ride RVR-1's row on this
# same host, and re-claiming a covered row inflates the coverage count without gating a
# new behaviour (the H34 rule). `scene-ksc` is V22K's.

[expectations]
# PLACEMENT IS LOAD-BEARING (the H7 lesson): run.py reads `expectations.allowedAnomalies`,
# and a bare key written AFTER an `[expectations.<sub>]` header is TOML-scoped to that
# sub-table and never read. `hlib.validate_spec` rejects the misplaced form, so this must
# stay ahead of the sub-tables.
#
# `[]` ON PURPOSE, following V22M / V23M's pre-registration on this class: Tier-C
# `rigid-seam-tangent-discontinuity` raises at an owned descent draw and IS in the gated
# set, so a raise reds this spec with every step green - the correct catch. Both landed
# lanes shipped `[]` and both read PASS on their first green run. This lane additionally
# opens the map, which is the first time any lane has done so on a landed or a route
# subject, so a raise from the newly reachable draw path is a reading to record rather
# than a budget to widen.
allowedAnomalies = []

[expectations.recordings]
# EXACT AT 5, THE ANTI-DATA-LOSS FLOOR, and it is MEASURED rather than predicted: RVR-1
# read `verifiers.expectations.observed.recordings.count = 5` on these bytes on both of
# its flights and RVR-2 confirmed it on a driven run that also saved. The staged set
# exactly, with NO load-time optimizer split - a property of the BYTES, not of which lane
# walks them - so a window here would be a weakening rather than a hedge.
#
# WHY IT IS AN INSTRUMENT AND NOT DECORATION (H39's census 2 is the standing example): a
# recording destroyed mid-run would flip the fresh route to `SourceChanged`, which never
# auto-recovers, and the failure would present as a route-render defect rather than as
# data loss. This lane drives a TimeJump, a SaveGame and a full scene change over a
# committed corpus, so the row is pointed at exactly the window that could lose one.
#
# A COUNT OTHER THAN 5 IS A FINDING TO FILE, not a pin to relax.
count = { min = 5, max = 5 }

[expectations.logContracts]
# EVIDENCE STANDING: AUTHORED, NEVER FLOWN. Every token is a literal RUN taken from the
# emitting `string.Format` / interpolation in SOURCE, never a line pasted from a log - an
# interpolated string is not stored the way it renders, and a token spanning a hole cannot
# match. Where a numeric field appears inside a required token it is regexed as a VALUE
# CLASS, on the H56 probe-token rule: an instrument whose token pins one outcome stops
# being an instrument.
#
# TOKEN 1  the FLIGHT boot. Pins `scene=FLIGHT` one layer earlier than anything else,
#          where a failure is legible as a boot fault.
#
# TOKEN 2  THE SEAL NO-OP, RVR-2's token verbatim (`ParsekTestCommandAddon.SealSlot.cs`,
#          `SealWholeTree` OK branch). `remaining=0` is a LITERAL in the format string, so
#          `remaining=0 alreadySealed=True` is one contiguous run and is the whole
#          assertion: `sealed=0` says nothing was sealed and `alreadySealed=True` says the
#          verb recognised that as success. `total=4` is the transport tree's recording
#          count, so a tree that lost a member reds here rather than at the create.
#
# TOKEN 3  THE CREATE GATE WALK, RVR-2's token verbatim. It is pinned SEPARATELY from the
#          create ACK because it is the only line that names WHY a create was allowed:
#          `sealed=True eligible=True` is the pair the two fixture links rest on, and
#          `refusal=None` is the classifier agreeing.
#
# TOKEN 4  THE CREATE ACK. `status=Paused` is the service's `initialStatus: Paused` and is
#          what makes token 5 necessary rather than decorative. The interval / transit /
#          cadence values are deliberately NOT pinned - `ComputeRootToUndockSpan` yields a
#          computed float and pinning one on a never-flown spec is how a correct run reds
#          on a rounding difference (RVR-2's stated reason, kept).
#
# TOKEN 5  THE ACTIVATE ACK, from the shared route-operation OK branch
#          (`ParsekTestCommandAddon.RouteCommand.cs:281`). `statusBefore=Paused
#          status=Active` is the transition, and Active is the FIRST status for which
#          `RouteStatusPolicy.GhostDriving` is true - so this token is the precondition of
#          tokens 6 and 7 and of the ghost half of the census. A refusal would print
#          `routecommand refused action=activate` and fail the step's own `expect = "OK"`
#          first, so this token is the positive confirmation rather than the only guard.
#
# TOKEN 6  THE SELECTOR, from `RouteGhostDriverSelector` (`VerboseOnChange`, so it emits
#          when a count MOVES - which is exactly at the activate). `ghostDriving=[1-9]` is
#          the front-door anti-vacuity floor: without it a green run could mean the
#          selector skipped the subject and every render surface below was honestly empty.
#
# TOKEN 7  THE FLIGHT HOST UNION, from `ParsekFlight`'s signature-gated rebuild line.
#          `routeMissions=[1-9]` says the FLIGHT host actually unioned the route's backing
#          mission into its loop-unit build. Token 6 says the selector chose it; this says
#          the host took it. Two different failures, two tokens - V18T's shape, moved from
#          the TS line to the flight one.
#
# TOKEN 8  THE MAP OPEN. Reaching this line IS the read-back proof: the applier only takes
#          the OK branch when `TestCommandMapViewVerbs.DecideToggleOutcome` agreed that
#          the sampled `MapView.MapIsEnabled` - the very property the polyline Driver
#          gates on - equals the requested state. `already=` is left unpinned because a
#          flight boot has the map closed and asserting that would be asserting the boot.
#
# TOKEN 9  **THE RC-OWN INSTRUMENT.** `Polyline frame:` is emitted at the END of the
#          Driver's LateUpdate decide walk (`GhostTrajectoryPolylineRenderer.cs:4691`),
#          and the walk's second gate is `if (!MapView.MapIsEnabled) return;` (`:4060`).
#          RC-OWN-DRAW-HALF-IS-MAP-GATED's own evidence rule is that ZERO such summaries
#          means every LateUpdate bailed early; V6M's closing reading is that they are
#          present. Requiring the line asserts the map-gated half RAN on this class for
#          the first time. `drawn=` is regexed: how many ghosts drew is the census.
#
# TOKEN 10 THE ROUTE CACHE BUILD (`RouteTrajectoryLineRenderer.cs:553`, `VerboseRateLimited`
#          keyed per route at 5.0 s, and signature-gated so it fires on an actual rebuild).
#          EVERY field is a value class: `members` / `groups` / `legs` / `transferDropped`
#          are the WHY behind whatever token 11 reads, and pinning any of them would be
#          pinning the answer.
#
# TOKEN 11 **THE CENSUS TOKEN.** `Route line draw:` is emitted unconditionally at the end
#          of every `DrawAll` (`:487`), so requiring it asserts the map-camera onPreCull
#          slot RAN - `OnRouteLinePreCull` fires only for the PlanetariumCamera in
#          FLIGHT / TRACKSTATION, so its absence is an instrument red and not an outcome.
#          `enabled=True` is pinned because `showRouteLines` defaults on and a False there
#          would mean the run measured the toggle rather than the product. The five
#          counters are ALL regexed: they ARE the two pre-registered outcomes (header
#          section 1) and this lane must not decide between them.
#
# TOKEN 12 THE MAP CLOSE, the mirror of token 8 and the precondition of the scene change
#          (`ExitMapView` is `RequiresFlight`).
#
# TOKEN 13 THE KSC BOOT.
#
# TOKEN 14 THE KSC HOST, `ParsekKSC.cs:186`. BOTH counts regexed. V22K pins
#          `[1-9]\d* eligible` because its subject's eligibility is a proven byte fact;
#          here the eligible count is part of the census (this is the first route subject
#          the host has ever seen), so a zero reading must be READABLE rather than red.
#
# TOKEN 15 THE ELIGIBILITY BREAKDOWN, `ParsekKSC.cs:197`, emitted whenever there are
#          committed recordings. It is the primary diagnostic for "why is nothing showing
#          in KSC" and is what makes a `0 eligible` reading legible instead of blank.
#
# TOKEN 16 THE ROUTE SURVIVED THE SAVE/LOAD, from `RouteStore.RevalidateSources`
#          (`:1488`). `routes=1` says exactly this lane's route is in the reloaded store
#          and `transitioned=0` says it did NOT flip to `SourceChanged` under the
#          load-time optimizer - V18T's token, and it is the only thing standing between
#          a quiet source-drift and a KSC half that measures an empty store.
#
# DELIBERATELY NOT REQUIRED, and each absence is a decision:
#   * `KSC SURFACE playback resolved: recording=.* branch=` - THE KSC HEADLINE
#     OBSERVATION. Whether the KSC dwell lands inside a replay window is a run-time
#     artifact of the loop clock; V22K needed three rounds to find an in-window epoch on a
#     clock it had already measured, and this lane cannot derive one. Requiring it would
#     gate the census on an epoch rather than on a behaviour. Read it from the log.
#   * every dispatch token (`Delivery write:`, `BLOCKED kind=`, `ArmedPause:`). Those are
#     RVR-2's assertions over the same bytes and they stay RVR-2's; an Active route may
#     fire a cycle at the jump and this lane neither requires nor forbids it.
#   * `faithful-parity summary` / `seam-endpoint summary`. Requiring an emitter no lane
#     has verified on THIS host is how a flight is spent discovering a pin was
#     unsatisfiable (V22K's rule, kept).
#   * any `Skipped ghost map for #N ... terminal=` line. The landed pin measured it on a
#     LOOP MEMBER of a landed-terminal recording; this lane's subject is a route, and
#     predicting which of the pin's three gates a route reaches is the prediction the
#     census exists to replace.
required  = [
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "sealslot complete mode=tree tree=73e50f1e3aa24c299919016cd9e92269 total=4 sealed=0 remaining=0 alreadySealed=True",
  "routecommand create gate tree=73e50f1e3aa24c299919016cd9e92269 treeFound=True dismissed=False sealed=True eligible=True status=Eligible alreadyPromoted=False refusal=None",
  "routecommand complete action=create tree=73e50f1e3aa24c299919016cd9e92269 route=.* name='H59 Surface Route' status=Paused",
  "routecommand complete action=activate route=.* name='H59 Surface Route' match=.* statusBefore=Paused status=Active",
  "SelectGhostDrivingBackingMissions: ghostDriving=[1-9]",
  "\\[Mission\\] Mission loop units rebuilt \\(signature changed\\): committed=[0-9]+ routeMissions=[1-9]",
  "entermapview ok mapOpen=true",
  "Polyline frame: scene=FLIGHT drawn=[0-9]+",
  "Route line build: route=\\S+ members=[0-9]+ groups=[0-9]+ legs=[0-9]+ transferDropped=[0-9]+",
  "Route line draw: enabled=True routesDrawn=[0-9]+ legsDrawn=[0-9]+ skippedOwned=[0-9]+ malformed=[0-9]+ other=[0-9]+",
  "exitmapview ok mapOpen=false",
  "loadgame complete scene=SPACECENTER save=.* game-loaded=true expected=SpaceCenter",
  "ParsekKSC initialized, [0-9]+ committed recordings, [0-9]+ eligible for KSC ghost playback",
  "\\[KSCGhost\\] Eligible breakdown: looping=[0-9]+",
  "RevalidateSources reason=.* routes=1 transitioned=0",
]
# THE BACKWARD-JUMP FORBID is the V3C run-3 self-detection guard: a refused jump is only a
# WARN, so without it a mis-derived UT would let this lane dwell twice at ONE epoch and
# report it as two. The UT is RVR-2's and was driven forward on these exact bytes on
# 2026-09-01, so this is a guard on a measured value rather than on a derivation.
#
# V18T's VACUITY FORBID IS DELIBERATELY **NOT** COPIED, and the reason is structural
# rather than a preference. That lane forbids
# `SelectGhostDrivingBackingMissions: .*skippedByStatus=[1-9]` on the argument that its one
# committed route being skipped by status would empty the whole reading - true THERE,
# because its route arrives Active in the fixture and is never anything else. HERE the route
# is CREATED at step 9 and ACTIVATED at step 10, so between those two steps it is genuinely
# Paused and the selector genuinely emits `ghostDriving=0 skippedByStatus=1 ... totalRoutes=1`
# (the emitter is `VerboseOnChange`, so that transition prints exactly once). The forbid
# would therefore be UNSATISFIABLE BY CONSTRUCTION and would red every correct run.
# WHAT CARRIES THE CLAIM INSTEAD is required token 6 plus the fact that there is exactly ONE
# committed route: `ghostDriving=[1-9]` cannot be satisfied unless THIS route reached
# GhostDriving, and token 7 says the flight host then took it.
#
# NO FORBID ON `Route line draw: .* routesDrawn=0`, and its absence is the whole posture of
# this lane: that reading is OUTCOME B, a legitimate census result, not a failure.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "timejump refused reason=backward-jump",
]

[expectations.renderComposition]
# M-A7 - DECLARED BARE, 2026-09-02. No `gating`, no window, no list. Declaring is what
# sets `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder at Awake, and
# `rendercompose` then records its facets UNCONDITIONALLY on a parseable manifest - which
# is how a lane earns its first honest window off a green report-only run. A window
# written today would be a PREDICTION read back as though it were a measurement, which is
# the mistake V14M, V8, V6M and V18T all shipped bare through their reading runs to avoid.
#
# WHAT THIS MANIFEST IS FOR ON THIS LANE, and it is two things no committed manifest has:
#   * `routeLineBuilds` / `routeCoDrawViolations` / `routeLegDefers` on a SURFACE route.
#     V18T is the only lane that has ever put a non-zero number in the first
#     (`routeLineBuilds = 1`, measured 2026-08-26 IN THE TRACKING STATION) and its subject
#     is a Kerbin-ORBIT depot route. A surface reading is a second data point on a census
#     that has exactly one.
#   * `ownershipChanges` on a map-open landed / route subject. V6M closed
#     RC-OWN-DRAW-HALF-IS-MAP-GATED with `ownershipChanges = 6` on a MUN ORBIT subject and
#     its closure text carries the qualifier explicitly, so this facet is unmeasured on
#     this class. A zero here alongside a present `Polyline frame:` would be a real
#     finding rather than the old instrument gap - which is precisely what the debt's
#     `ownership-publish-surface-never-ran` stand-down was built to stop hiding.
#
# ONE EXPECTED MANIFEST DIFFERENCE FROM RVR-2, NAMED SO IT IS NOT READ AS A SURPRISE.
# RVR-2 runs the same create-and-dispatch shape over the same host and deliberately does
# NOT declare this block, its stated reason being that "a confirmed dock crossing appends
# `route-dock-crossing` CLOCK-EVENTs to that manifest". This lane DOES declare it and its
# route IS Active, so if the jump fires a cycle those CLOCK-EVENTs land in the manifest.
# That is not a defect and nothing gates on it; it is the cost of taking the manifest on a
# live route, and RVR-2 keeps its own posture unchanged.
#
# READING PENDING. The arming candidate, if the census reads outcome A, is
# `routeLineBuilds = { min = 1 }` - V18T's armed shape, earned on this lane's own two
# readings and never copied.

[runtime]
# Budget arithmetic (M-A5 S8): run.py gives EVERY deferred seam verb
# `required_step_wait(max(step budget, SEAM_FALLBACK_DEFERRAL_SECONDS=600))` = 660 s
# regardless of the declared step budget. THREE steps are deferred here - both `LoadGame`s
# and the `TimeJump` - so the deferred worst case alone is 3 x 660 = 1980. On top of it sit
# the synchronous verbs (SealSlot 120, two RouteCommands 240, the map-view pair 240,
# SaveGame 120, ExportRenderManifest 120) and 120 `RecordingState` ticks. 3000 clears the
# worst case with headroom.
#
# THE WALL FIGURE COVERS THE DEFERRED WORST CASE, not an observed wall, and it stays at
# 3000 regardless of how fast the first run turns out to be: trimming it to hug the
# expectation would convert a slow load into a KILLED run with NO CENSUS, which on a first
# reading destroys the entire product of the flight.
budgetSeconds = 3000

[retry]
policy = "once"

[expectedFail]
bugId = ""
