# SO NOTHING IN `[expectations.renderComposition]` IS ARMED. A `routeLineBuilds = { min = 1 }`
# window - V18T's shape and this lane's authoring-time arming candidate - would be
# STRUCTURALLY UNSATISFIABLE on the lane's own committed step list, which is the V17M
# mistake in a fourth costume. The route counters keep their log-side instruments (required
# tokens 10, 11 and 12), which measured the same three facts the manifest could not carry.
