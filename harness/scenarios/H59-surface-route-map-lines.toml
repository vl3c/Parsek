# 8. FLIGHT LEDGER
# -------------------------------------------------------------------------------------
#   **CENSUS RUN 1** - `2026-09-02_0947`, **PASS attempt 1**, wall 99 s. Every verifier
#     green: anomalySweep PASS `hits=[]` (so `allowedAnomalies = []` held and the
