# 3. THE KSC HALF - V22K's PATTERN, FOR THE ONE SURFACE THE PIN MEASURED POSITIVE ON
# -------------------------------------------------------------------------------------
# V22K is the only committed lane that has ever read a KSC render line, and the shape is
# taken from it whole: `SaveGame` -> kill pair -> `LoadGame scene=spacecenter` -> a forty
# tick `RecordingState` dwell. Two things make the host non-vacuous for THIS subject and
# both are byte facts rather than predictions:
#
#   * `ParsekKSC.IsKscStructurallyEligible` rejects outright on
#     `rec.Points[0].bodyName != "Kerbin"` (the FIRST point, terminal state not consulted).
#     Every recording in `rover-route-recorded` is a KSC Runway subject, Kerbin-rooted and
#     Kerbin-framed end to end, so the structural gate admits them - the same argument
#     V22K makes for its splashdown subject, and the reason V20K's payoff is unproven.
#   * `ParsekKSC.cs:890` unions the route's backing missions into the loop-unit build
#     exactly as `ParsekFlight` and `ParsekTrackingStation` do, so a GhostDriving route
#     reaches this host through the same front door.
#
# AT AUTHORING, ONLY THE STRUCTURAL LINES WERE REQUIRED and `KSC SURFACE playback
# resolved` was left an OBSERVATION, because whether the dwell lands INSIDE a replay
# window is a run-time artifact of the loop clock and V22K spent THREE rounds finding an
# in-window epoch on a subject whose clock it had already measured.
#
# **THE ARMING DECISION (2026-09-02): PIN IT. The epoch is deterministic on this subject,
# and the margin is 4x rather than marginal.** The reasoning, in the order it has to be
# checked rather than the order that flatters the conclusion:
#
#   1. EVERY INPUT TO THE PHASE IS FIXED. The fixture bytes are committed, the single
#      `TimeJump ut=1600` is a literal, and the `SaveGame` the KSC boot reloads is taken
#      immediately after it. Nothing here is a seed or a derivation.
#   2. THE DEAD ZONE IS 4.96 s PER CYCLE, read off the exported manifest's own PLAN UNIT:
#      `spanStartUT=468.4999...` / `spanEndUT=513.5399...` (a 45.04 s replay window) with
#      `cadenceSeconds=50`. So the ghost is out of window for 4.96 s of every 50, i.e.
#      9.9% of the time - the opposite of the long-coast loops that made V22K's epoch hard.
#   3. THE DWELL IS ~10 s AND ITS LENGTH IS POLL-BOUND, NOT MACHINE-BOUND - which is the
#      load-bearing half, and it is a stronger argument than the margin. `harness/run.py`
#      drives every seam step through a fixed `POLL_INTERVAL_SECONDS = 0.25` (`:145`), so
#      40 `RecordingState` ticks cost AT LEAST 10 s of wall clock no matter how fast the
#      machine is; the census measured 0.257 s/tick, i.e. the floor plus round-trip. A
#      FASTER MACHINE THEREFORE CANNOT SHRINK THIS DWELL, and a slower one only lengthens
#      it, so the failure direction is closed on both sides rather than merely improbable.
#   4. THE MEASURED MARGIN IS 2.07x, NOT 4x. Corrected 2026-09-02 by an adversarial
#      review of an earlier draft of this section, which had asserted ~21 s from the
#      manifest's `exportUT` without checking the wall clock. The real dwell is
#      `ParsekKSC initialized` at 12:48:47.550 to `exportrendermanifest ok` at
#      12:48:57.824 = 10.274 s, against the 4.96 s dead zone. The six resolved lines span
#      `targetUT` 495.54..505.56, i.e. ~10 s of in-window observation under a 2.0 s
#      per-recording rate limit, which agrees. 2.07x with a hard floor under it is a
#      sound pin; 4x from an unchecked number was not, even though it happened to point
#      the same way.
#
# THE PIN IS `KSC SURFACE playback resolved: recording=.* body=Kerbin branch=absolute` -
# body-agnostic on the RECORDING but not on the FRAME, which is now available because
# KSC-SURFACE-RESOLVED-TWO-EMITTERS-SHARE-ONE-RATE-LIMIT-KEY was fixed on 2026-09-02 and
# BOTH emitters carry `body=` today. The run's six lines are all the point-path variant
# (`targetUT=` absent, `ut=`-less form with `body=Kerbin branch=absolute`), and the two
# skip lines are FORBIDDEN, which is what makes the positive pin sharp.
#
# IF A FUTURE RUN REDS **ONLY** ON THIS TOKEN, IT IS AN EPOCH READING AND NOT A PRODUCT
# FINDING: the dwell fell inside the 4.96 s inter-cycle gap. The fix is to lengthen the
# KSC dwell, never to unpin the token - unpinning would silently give the KSC half back
# its pre-flight vacuity.
#
