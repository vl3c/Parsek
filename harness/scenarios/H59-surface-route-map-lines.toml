# `status=REPORT gating=False blocks=-` - `blocks=-` being the proof: at run time
# this lane declared no save-structure block at all, so 1038 is NOT this block's
# reading run and must never be cited as one. What the windows below rest on is
# (a) the log evidence listed next, and (b) ONE OFFLINE READ, described honestly
# below. Arming requires this block's OWN report-only reading run - a flight that
# declares it and comes back with the facets in its result JSON.
#
# **THE OFFLINE READ, and what it is worth.** An
# `saveparse.observed_routes_facets` call over the automation instance's
# `saves/rover-route-recorded/persistent.sfs`, taken while it carried
# `name = H59 Surface Route` with `id = ec9c0743...` - the route id run 1038
# generated, so those bytes ARE that run's output - returned:
#     count 1 / dormant 0 / statuses {Active: 1} / originBodies {Kerbin: 1} /
#     destinationBodies {Kerbin: 1} - every declared window, exact - plus
#     stops 1 / sourceRefs 2 / completedCycles 1 /
#     connectionKinds {DockingPort: 1} / codecRejects 0 / unparsed 0.
# THAT IS CORROBORATION OF A DERIVATION, NOT A MEASUREMENT OF RECORD, and it is
# why the block stays report-only rather than being armed on the spot. The
# automation instance is shared and a sibling run over the same `saveTemplate`
# re-stages that path within seconds (CLAUDE.md, "the produced-save clobber
# race"): the same file was observed at three different sizes and mtimes inside
# four minutes, and one of those reads returned `count 0 promptedCandidates 1` -
# the staged fixture rather than any run's output. A window may not be armed on
# bytes that cannot be re-read on demand, and a facet that never travelled through
# the verifier chain has not been tested end to end.
#
# WHAT THE LOGS DO ESTABLISH, identically on BOTH runs (`2026-09-02_0947` and
# `2026-09-02_1017`), which is what makes these windows a derivation rather than a
# guess:
#   * exactly one route is created - `routecommand complete action=create ...
