[runtime]
# Budget arithmetic (M-A5 S8). `run.py` gives EVERY deferred seam verb
# `required_step_wait(max(step budget, SEAM_FALLBACK_DEFERRAL_SECONDS=600))` = 660 s
# regardless of the declared step budget. Three steps are deferred verbs here - LoadGame
# and the two InvokeRewindToLaunch probes - so the worst case is 660 x 3 = 1980; the
# synchronous seal / route / save verbs add their own budgets on top. 2400 clears it with
# headroom, same figure and same derivation as RVR-2.
#
# BOTH REWIND PROBES REFUSE SYNCHRONOUSLY, inside Execute, before `InitiateRewind` is ever
# called - `ResolveTarget` and the `CanRewind` gate both run ahead of it - so neither can
# be the slow step in practice and neither reaches the two-phase completion decider. The
# 660 s wait is the CAP the deferred-verb rule imposes, not an expected cost; the run
# should land near RVR-2's measured 50 s.
budgetSeconds = 2400

[retry]
policy = "once"

