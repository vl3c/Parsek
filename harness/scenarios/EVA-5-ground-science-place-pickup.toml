schema = 1
id = "EVA-5-ground-science-place-pickup"
# COVERAGE WAVE 10 producer, RE-ARMED 2026-09-26 on the placed-part tree member (D7
# `inventory-place-remove` CLAIMED here).
#
# HISTORY. The reading run `2026-09-25_2341` flew every step OK and reddened
# PARSEK-FAIL(analyzer) on `INV4-PARTEVENT-PID unresolved-pid`: the recorder keyed the event to
# the placed part's pid on the KERBAL's recording, but stock makes a placed part its OWN vessel.
# Owner ruling 2026-09-26 (todo EVA-GROUND-SCIENCE-PLACED-PART-PID-NOT-ON-VESSEL, option 1): the
# placed part gets its own recording and ghost, a tree member created at the placement
# (docs/parsek-flight-recorder-design.md section 4.11). The `[expectedFail]` table is gone.
#
# THE SUBJECT. The placement is detected from stock's `onDeployGroundPart(partName)`, matched to
# the vessel `onNewVesselCreated` announced in the same frame (Game.AddVessel), while the active
# vessel is the recorded EVA kerbal - never from `onGroundSciencePartDeployed`, which also fires
# when an old unlinked experiment merely loads (todo
# INVENTORY-PLACED-FIRES-ON-ANY-LANDED-EXPERIMENT-LOAD). One frame later a GroundPartPlaced
# branch point (parent = the kerbal's recording, which keeps recording) adds the member:
# `Ground part placed: tree member created ...`, with `InventoryPartPlaced` on the MEMBER keyed
# by the part's own pid. The pick-up's first `onGroundSciencePartRemoved` records ONE
# `InventoryPartRemoved` on the member (the second, from OnRetractCompleted, is deduplicated),
# and the vessel's Die() stamps the member `Disassembled reason=ground-part-retrieved`.
#
# THE DRIVER. kRPC 0.5.4 has no inventory or construction API, so the lane is seam-driven
# through the EvaGroundScience verb, which fires NO GameEvent itself:
#   action=place  - ModuleInventoryPart.DeployInventoryItem(slot), the inventory PAW slot
#                   icon's own call (UIPartActionInventory.StartPartPlacement), then ONE
#                   frame of GameSettings.EVA_Jump, the binding ModuleInventoryPart.OnUpdate
#                   confirms a placement with (a scoped Harmony prefix on
#                   KeyBinding.GetKeyDown, installed only for the press). Stock then runs
#                   DeployGroundPart -> HighLogic.CurrentGame.AddVessel -> onNewVesselCreated,
#                   then fires onDeployGroundPart. faceAway=true first turns the kerbal away
#                   from the pod: a kerbal just off the ladder faces the hull, and stock puts
#                   the preview straight ahead of it.
#   action=pickup - the ground part's RetrievePart KSPEvent invoked through its BaseEvent,
#                   exactly as the PAW button does.
#
# THE FIXTURE. gloops-airshow (EVA-1's pod: Jebediah, PRELAUNCH on the pad, SANDBOX so the
# part is available) with ONE [[fixture.crewInventory]] patch: Jebediah's roster inventory
# becomes `evaChute,DeployedSeismicSensor` in stock's own compact form (STOREDPARTS dropped,
# so ModuleInventoryPart.OnLoad builds both snapshots from the prefabs, the form the
# stock-shipped Butterfly Rover craft uses). The jetpack is the part that goes: the kerbal's
# 40 L cap holds chute 10 + seismometer 25 but not jetpack 17 + seismometer 25. The place
# step's `start ... inventory=` line is the proof the patch landed, because stock silently
# drops an unavailable CSV name.
#
# THE GHOST EVIDENCE. After the commit the tree's mission loop is armed and StartLoopPlayback
# replays it with ghostRenderTracing on; TimeJump steps walk the clock across the placement and
# the pick-up. The member's ghost is built (`phase=MeshSpawned ... recId=<member>
# reason=ghost-created`), and its own two events apply to a part the ghost CARRIES
# (`applied=1 ... reason=applied`, pid = the placed part's pid), so the replay shows the
# seismometer standing where it was placed until the pick-up. A `no-info-for-part` inventory
# line is now forbidden: nothing records an inventory event against a ghost that lacks the part.
#
# SPAWN AT END is not witnessed here: this member is picked up (Disassembled, never spawned),
# and a part left on the pad would be retired by the KSC exclusion zone rather than spawned.
# The still-placed spawnable-leaf answer is pinned headlessly (GroundPartPlacementTests); the
# off-pad spawn-after-rewind lane is todo EVA-PLACED-PART-SPAWN-AFTER-REWIND-LANE.
tier = "nightly"
description = "Ground EVA on the pad with a Breaking Ground seismometer in the kerbal's inventory: exit, place it through the stock inventory slot + confirm key, pick it back up through its own Pick Up event, board, commit, then replay the tree's mission loop. The placed part becomes its own tree member (GroundPartPlaced branch point, ends Disassembled on the pick-up), and its ghost is built and shows / hides the part through its own InventoryPartPlaced / InventoryPartRemoved events."
instanceProfile = "stock-minimal"
tags = ["eva", "inventory", "ground-science", "breaking-ground", "loop-playback", "D7"]

[fixture]
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "none"
craft = []

[[fixture.crewInventory]]
kerbal    = "Jebediah Kerman"
inventory = "evaChute,DeployedSeismicSensor"

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",         args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",       args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",       args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "SetSetting",       args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "StartRecording",                                                       expect = "OK" },
  { cmd = "MissionMark",      args = { label = "eva5 exit" },                     expect = "OK" },
  { cmd = "EvaExit",          args = { release = "true" },                        expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedSeismicSensor", faceAway = "true" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "pickup", part = "DeployedSeismicSensor" }, expect = "OK", budget = 120 },
  { cmd = "EvaBoard",                                                             expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                        expect = "OK" },
  { cmd = "CommitTree",                                                           expect = "OK", budget = 120 },
  { cmd = "ListHandles",      args = { kind = "committed" }, label = "c0",        expect = "OK" },
  { cmd = "UiAction",         args = { op = "complexity", mode = "advanced" },    expect = "OK" },
  { cmd = "UiAction",         args = { op = "open", window = "main" },            expect = "OK" },
  { cmd = "UiAction",         args = { op = "open", window = "missions" },        expect = "OK" },
  { cmd = "UiAction",         args = { op = "tab", window = "missions", tab = "missions" }, expect = "OK" },
  { cmd = "MissionConfig",    args = { tree = "${c0.rec0tree}", loop = "true" },  expect = "OK" },
  { cmd = "UiAction",         args = { op = "close", window = "missions" },       expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "${c0.rec0tree}" },                expect = "OK", budget = 300 },
  { cmd = "MissionMark",      args = { label = "eva5 replay" },                   expect = "OK" },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "TimeJump",         args = { deltaSeconds = "10" },                     expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                         expect = "OK" },
]

[dimensionsCovered]
D7  = ["inventory-place-remove"]
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# EVA-1's topology (root pod 1, + 2 for the EVA split, + 1 for the board merge) plus the
# placed seismometer's own member (GroundPartPlaced). The kerbal's recording does NOT split
# at the placement.
count = { min = 5, max = 5 }

[expectations.logContracts]
required  = [
  "Recording started",
  "Tree branch created: type=EVA",
  # The patch landed: the kerbal carries the seismometer in slot 1.
  "evagroundscience place start kerbal=Jebediah Kerman part=DeployedSeismicSensor slot=1 inventory=0:evaChute,1:DeployedSeismicSensor",
  "evagroundscience place confirmed part=DeployedSeismicSensor presses=[1-9]",
  # THE PLACEMENT: stock's onDeployGroundPart matched to the same-frame created vessel.
  "Ground part placement detected: part='DeployedSeismicSensor' vesselPid=[0-9]+ kerbalRec=[0-9a-f]+ ",
  # THE MEMBER, tied by vessel pid / part pid / recording id across its creation, the
  # pick-up the seam drives, the ONE Removed capture and the Disassembled stamp at Die().
  "Ground part placed: tree member created part='DeployedSeismicSensor' vesselPid=([0-9]+) partPid=([0-9]+) rec=([0-9a-f]+) parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True[\\s\\S]*evagroundscience pickup start kerbal=Jebediah Kerman part=DeployedSeismicSensor partPid=\\2 vesselPid=\\1 [\\s\\S]*Part event captured: InventoryPartRemoved 'DeployedSeismicSensor' pid=\\2 via onGroundSciencePartRemoved rec=\\3[\\s\\S]*Recording terminal: kind=Disassembled reason=ground-part-retrieved vessel='[^'\\r\\n]*' pid=\\1 parts=1 rec=\\3 ",
  "Ground part placed: tree member created [^\\r\\n]*partPid=([0-9]+) rec=([0-9a-f]+) [\\s\\S]*Part event captured: InventoryPartPlaced 'DeployedSeismicSensor' pid=\\1 via onDeployGroundPart rec=\\2",
  "evagroundscience place complete part=DeployedSeismicSensor partPid=[0-9]+ ",
  # The second stock Removed signal (OnRetractCompleted) is deduplicated, not recorded.
  "repeat pick-up signal for part='DeployedSeismicSensor' [^\\r\\n]*deduplicated",
  "evagroundscience pickup complete part=DeployedSeismicSensor",
  "Tree board merge completed",
  "committree committed=true",
  "missionconfig applied: .* loop=True .*unitBuilt=True",
  "startloopplayback complete:",
  # THE GHOST EVIDENCE: the member's ghost is built, and its own events apply to the part it
  # carries (pid = the placed part's pid), so the replay shows the part until the pick-up.
  "Ground part placed: tree member created [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*startloopplayback complete:[\\s\\S]*phase=MeshSpawned rec=\\S+ recId=\\1 [^\\r\\n]*reason=ghost-created",
  "Ground part placed: tree member created [^\\r\\n]*partPid=([0-9]+) [\\s\\S]*startloopplayback complete:[\\s\\S]*\\[GhostPartEvents\\] apply family=InventoryPartPlaced surface=inventory rec=[0-9]+ pid=\\1 applied=1 skipped=0 reason=applied",
  "Ground part placed: tree member created [^\\r\\n]*partPid=([0-9]+) [\\s\\S]*startloopplayback complete:[\\s\\S]*\\[GhostPartEvents\\] apply family=InventoryPartRemoved surface=inventory rec=[0-9]+ pid=\\1 applied=1 skipped=0 reason=applied",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "evagroundscience failed",
  "evagroundscience refused",
  "Ground part placement not recorded",
  "Ground part placement dropped",
  # ONE Removed capture per pick-up.
  "Part event captured: InventoryPartRemoved[^\\r\\n]*[\\s\\S]*Part event captured: InventoryPartRemoved",
  # Nothing records an inventory event against a ghost that lacks the part any more.
  "apply family=InventoryPart(?:Placed|Removed) surface=inventory [^\\r\\n]*reason=no-info-for-part",
]

[runtime]
# 300 LoadGame + 120 EvaExit + 2 x 120 EvaGroundScience + 120 EvaBoard + 120 CommitTree
# + 300 StartLoopPlayback + 12 fast TimeJumps + the single-phase verbs + margin.
budgetSeconds = 1800

[retry]
policy = "once"
