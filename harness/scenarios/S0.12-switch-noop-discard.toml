schema = 1
id = "S0.12-switch-noop-discard"
# =====================================================================================
# THE NO-OP SWITCH-SEGMENT AUTO-DISCARD, driven end to end: a map-site Switch-To click
# onto a co-orbiting loaded vessel opens a STANDALONE continuation segment in a FRESH
# tree, nothing happens on it, and the scene exit to the Space Center discards the
# whole throwaway tree before any commit routing runs. D1
# `switch-segment-noop-discard` (roadmap Tier D item 13) - UNCOVERED until this lane
# flies: H12 declines the cell (it drives only the arming decision), and GS-3 reaches
# only the DEFERRED shape (`disposition=BgMemberOrMixed is deferred`, report-only
# there).
#
# AUTHORED 2026-09-10 (`ghost-replay-tier-b`) and READ the same day: reading run
# `2026-09-10_1942` flew PASS attempt 1, OUTCOME (P1) (the STATUS block below). Every
# token is RE-CUT to the measured line; the CONFIRM re-flight `2026-09-10_2056` PASSED
# on the re-cut spec and the NEGATIVE CONTROL `2026-09-11_0044` red on exactly the
# inverted claim token (the RUN LEDGER at the end of this file). LIVE-PROVEN: D1
# `switch-segment-noop-discard` is CLAIMED and the tier is daily (the S0.8 precedent).
#
# =====================================================================================
# THE CODE FACTS THIS SPEC RESTS ON - read, not assumed.
#
# (1) THE DISCARD IS SCENE-EXIT PREFIX STEP 3.5. `HighLogic_LoadScene_Patch.Prefix`
#     calls `SceneExitInterceptor.TryAutoDiscardNoOpSwitchSegment` BEFORE the
#     active-tree commit routing. It classifies through
#     `RecordingStore.TryClassifyActiveSwitchSegmentNoOp`: disposition `Standalone`
#     iff the session tree's recording count equals the segment's subtree count,
#     `BgMemberOrMixed` otherwise, and ONLY Standalone / CommittedRestoreClone are
#     discarded - BgMemberOrMixed is DEFERRED to the normal commit.
# (2) WHY S0.8 WITHOUT `StartRecording`. S0.8 (same fixture, same click) runs WITH a
#     live recording, and the standalone segment then attaches to that SAME live tree
#     (S0.8 measured count = 2, and `createdFreshTree=False` on its route line), so
#     the disposition is BgMemberOrMixed and the discard defers. With NO live tree,
#     `ParsekFlight.StartStandaloneContinuationSegment` builds a FRESH tree
#     (`createdFreshTree = true`) holding only the segment - the Standalone
#     disposition, and the one this lane needs.
# (3) THE SEGMENT STILL RECORDS. `BindLiveRecorderToSwitchSegment` starts a recorder
#     on the target even with no prior one, either ON RAILS (an orbit segment: S0.8's
#     log and this lane's reading) or in PHYSICS (an ExoBallistic Absolute TrackSection:
#     this lane's confirm re-flight - the start frame varies run to run), so the
#     classifier's `insufficient-data` keep path (fewer than 2 points AND no sections
#     AND no orbit segments) does not bite on either. GS-3 measured the SAME core
#     classifying `noOp=True reason=no-op` 0.6 s after its click (`2026-08-05_1448`,
#     line 11723), with its disposition the deferred one.
# (4) THE EXIT IS ALLOWED. ExitToSpaceCenter's wedge guard refuses only a RegularMerge
#     (autoMerge OFF), a Re-Fly attempt, or a SwitchSegmentSession with NO live
#     active tree. With `autoMerge = true` and the fresh tree live, none applies.
# (5) THE TARGET IS ORBITING, which avoids the verb's surface trap
#     (`Refused_OnSurfaceTarget`), and LOADED, which avoids `target-unloaded` - the
#     two properties S0.8's header spells out for `eva2-lko-crewed`.
# (6) REC-001 / REC-003 ARE SUPPRESSED HERE: no `StartRecording` step and
#     `autoRecordOnLaunch = false`, so `hlib.spec_expects_live_recording` is False and
#     the recorder pairing rules do not gate this run (the segment recorder's start
#     has no scene-exit stop line by design - the discard tears the tree down).
#
# =====================================================================================
# PRE-REGISTERED OUTCOMES (the reading classifies into exactly one):
#
#   (P1) STANDALONE NO-OP DISCARD - the expected shape. The gate line with
#        `hasActiveRecording=false`, the route line with `createdFreshTree=True`, the
#        classifier line `disposition=Standalone subtreeCount=1 hasDescendants=False
#        noOp=True reason=no-op`, the claim token, the `AutoDiscardActiveTreeCore`
#        teardown with `ledgerRecalcReason='noop-switch-segment-discard'`, NO
#        `Committed tree '` line, and recordings.count = 0 (sidecars reaped).
#   (P2) THE CLASSIFIER KEEPS THE SEGMENT (`noOp=False reason=<keepReason>`): no
#        discard, the fresh tree auto-merges at the exit and a `Committed tree '`
#        line appears. `insufficient-data` = the dwell was too short (lengthen it -
#        not a finding); `part-event:<type>` / `non-boring-section:<env>` on a
#        segment that did nothing = a PRODUCT question about the classifier's
#        definition of meaningful, filed in docs/dev/todo-and-known-bugs.md.
#   (P3) NOT A FRESH TREE: `createdFreshTree=False` or a `route=` other than
#        standalone - something was live at boot that S0.8's fixture reading did not
#        predict; the disposition then defers. Re-derive the premise from the bytes.
#   (P4) THE EXIT IS REFUSED (`ExitToSpaceCenter` REJECTED `dialog-required ...`):
#        the wedge-guard reading of fact (4) was wrong; re-derive from the refusal's
#        own variant.
#   (P5) recordings.count > 0 WITH the claim token present: the discard ran but a
#        sidecar survived `reapSidecars: true` - an orphaned-sidecar FINDING.
#
# STATUS - READING RUN `2026-09-10_1942` (wave DLL, PASS attempt 1, 50 s wall), OUTCOME
# (P1). Every INTERIM token matched and each is re-cut below to its measured line:
#   - the gate read `hasActiveRecording=false hasActiveSession=false
#     priorFocusedPid=0 ... dialogDecision=NoPriorSession`, and the route read
#     `route=standalone ... sourcePid=0 ... fallthroughReason=<none>
#     createdFreshTree=True`: a FRESH tree, the Standalone premise (fact 2) held;
#   - the segment recorder started `on rails` on an orbit segment (fact 3 held), and
#     2.8 s after the click the classifier read `disposition=Standalone
#     subtreeCount=1 hasDescendants=False noOp=True reason=no-op`. The claim token and
#     the `AutoDiscardActiveTreeCore` teardown followed within 1 ms, and
#     `exittospacecenter complete` landed 1.7 s after the exit began (fact 4 held);
#   - 0 `Committed tree '`, 0 `[Parsek][ERROR]`, 0 of the deferred line; the produced
#     save's `Parsek/Recordings` directory was EMPTY (recordings.count 0), and
#     logValidate PASSed with REC-001/003 suppressed (fact 6).
#
# THE CONTROLS (flown 2026-09-11 on uncommitted edits, never committed; the RUN LEDGER
# at the end of this file has both results):
#   - THE NEGATIVE CONTROL (the counting one, one mismatch): the claim token's
#     disposition word inverted to one this run never prints; it must red
#     PARSEK-FAIL(expectation) on exactly that token, with the original matching >= 1
#     line in the control's own log and the inverted one 0.
#   - THE MIRROR MEASUREMENT: S0.8's `StartRecording` in place of the
#     autoRecordOnLaunch setting. The segment then joins the live tree, the disposition
#     is BgMemberOrMixed, and `TryAutoDiscardNoOpSwitchSegment: no-op detected but
#     disposition=BgMemberOrMixed is deferred` is the mirror-direction line (only
#     GS-3's collected log carries it today). The run must red naming the missing
#     `(Standalone)` claim token. A red that is ONLY the REC-rule flip the insertion
#     also causes does not discharge it.
# =====================================================================================
tier = "daily"
description = "The no-op switch-segment auto-discard end to end (D1 switch-segment-noop-discard, roadmap Tier D item 13): S0.8's map-site Switch-To click onto the co-orbiting loaded probe core WITHOUT a live recording, so the standalone consume builds a FRESH tree holding only the segment (disposition Standalone); a short dwell in which nothing happens; then ExitToSpaceCenter, whose scene-exit prefix (step 3.5) must classify the segment no-op and discard the whole throwaway tree before any commit routing. READ 2026-09-10 (`2026-09-10_1942`, PASS attempt 1, outcome P1) and every token re-cut to its measured line; the confirm re-flight `2026-09-10_2056` PASSED on the re-cut spec, and the negative control `2026-09-11_0044` red on exactly the inverted claim token. D1 switch-segment-noop-discard CLAIMED 2026-09-11; tier daily."
instanceProfile = "stock-minimal"
tags = ["switch-segment", "stock-click", "S0.12", "noop-discard", "D1"]

[fixture]
# eva2-lko-crewed, S0.8's fixture verbatim: TWO LOADED, ORBITING vessels ~16.4 m apart
# ("Kerbal X", the active crewed stack, and "Kerbal X Probe", the 21-part spent core,
# pid 2614652043 baked into the fixture), and NO committed recordings (S0.8's count of
# 2 was the live root plus its segment, nothing committed).
saveTemplate = "fixtures/saves/eva2-lko-crewed"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# NO `StartRecording` - fact (2): a live tree is exactly what defers the discard.
# `autoMerge = true` is LOAD-BEARING: autoMerge OFF refuses ExitToSpaceCenter
# `dialog-required variant=RegularMerge` (fact 4). `verboseLogging = true` is
# MANDATORY: the classifier line is Verbose. The vessel arg is the RAW name (run.py
# percent-encodes on the wire; S0.8's note). The RecordingState dwell is ~10 poll
# round-trips of game time at 1x with nothing commanded - enough for the segment
# recorder to author its on-rails coverage (fact 3), and a knob the reading re-sizes
# only if it measures `insufficient-data`.
steps = [
  { cmd = "LoadGame",                 args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting",               args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",               args = { name = "autoMerge", value = "true" },           expect = "OK" },
  { cmd = "SetSetting",               args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "SimulateStockSwitchClick", args = { vessel = "Kerbal X Probe" },                    expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "RecordingState",                                                                    expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                                 expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                                      expect = "OK" },
]

[dimensionsCovered]
# CLAIM-IS-NOT-GATE. Every value below is backed by a REQUIRED token in this spec's own
# logContracts, entered 2026-09-11 after the confirm run `2026-09-10_2056` (PASS) and
# the negative control `2026-09-11_0044` (valid; the RUN LEDGER below).
#
# `switch-segment-noop-discard` <- THE CLAIM TOKEN "TryAutoDiscardNoOpSwitchSegment:
#   no-op switch segment \(Standalone\) detected dest=SPACECENTER - discarding without
#   commit", the token the negative control inverted, with the classifier line
#   (`disposition=Standalone ... noOp=True reason=no-op`), the
#   `AutoDiscardActiveTreeCore` teardown and recordings.count {0,0} beside it. FIRST
#   CLAIMANT: GS-3 reaches only the deferred shape, H12 only the arming decision.
# `switch-segment` <- the "[SwitchSegment] created ... reason=MapSwitchTo" line AND
#   "[SwitchIntent] cleared: ... reason=consumed-into-segment", S0.8's basis. A
#   re-claim: S0.8, GS-3, H12 and CI-1 claim the same value.
D1 = ["switch-segment", "switch-segment-noop-discard"]
# `scene-ksc` <- "exittospacecenter complete scene=SPACECENTER game-loaded=true", the
#   exit terminal after the discard. A re-claim; the discard runs in the scene-exit
#   prefix, so reaching the Space Center is part of the subject.
D14 = ["scene-ksc"]

[expectations]
# PLACEMENT IS LOAD-BEARING: `allowedAnomalies` must precede every
# [expectations.<sub>] header.
allowedAnomalies = []

[expectations.recordings]
# PRE-REGISTERED (P1): ZERO. The fixture carries no committed recording, the only
# recording this run authors is the no-op segment, and `AutoDiscardActiveTreeCore`
# runs with `reapSidecars: true`. The NUMERIC guard on the discard: every token below
# is a presence check, so a discard that logged and then left a sidecar behind would
# satisfy them all and move only this number (P5).
count = { min = 0, max = 0 }

[expectations.logContracts]
# [MEASURED] throughout - re-cut 2026-09-10 from the reading run `2026-09-10_1942`,
# each the whole measured line with ONLY the per-run values regexed (the intent /
# session / tree / segment GUIDs, the captured UT and the exit's elapsed time); the
# target pid and name are baked into the fixture and stay literal. Ordered as the
# mechanism runs: verb gate -> marker armed -> consume opens the segment in a FRESH
# tree -> marker consumed -> verb terminal -> scene exit -> classifier -> discard ->
# teardown -> exit terminal.
#
# Token 1 is the gate with its WHOLE input set (the no-live-recording state S0.8 never
# measured). Token 4 carries `createdFreshTree=True`, the Info-level witness of the
# variable the mirror measurement flips. Token 7 is the classifier (Verbose, which is
# why verboseLogging is mandatory). Token 8 is THE CLAIM TOKEN (SceneExitInterceptor,
# Info). Token 9 is the teardown (`ParsekFlight.AutoDiscardActiveTreeCore` via
# `AutoDiscardNoOpStandaloneSwitchSegment`, whose reason string is the interceptor's
# `scene-exit no-op switch-segment auto-discard dest=SPACECENTER`). Token 10 is the verb
# terminal. Token 11 ties the chain by BACKREFERENCE: the session and segment the
# click's `created` line opened are the SAME ones the route line names and the
# classifier judged Standalone no-op, so the classifier cannot be reading some other
# segment.
required  = [
  "switchclick gate targetPid=2614652043 targetName=Kerbal X Probe scenarioReady=true canSwitchVesselsFar=true targetIsActiveVessel=false targetIsUnloaded=false hasActiveRecording=false hasActiveSession=false priorFocusedPid=0 anotherDialogOpen=false targetIsSeparateCommittedVessel=false dialogDecision=NoPriorSession",
  "switchclick armed intent: intentId=[0-9a-f-]{36} action=MapSwitchTo targetPid=2614652043 sourceScene=Flight capturedUT=[0-9.]+ ttl=2s route=plain-arm-and-switch",
  "\\[SwitchSegment\\] created intentId=[0-9a-f-]{36} sessionId=[0-9a-f-]{36} treeId=[0-9a-f-]{36} parentRecId=<standalone> segmentRecId=[0-9a-f-]{36} branchPointId=<none> sourcePid=0 focusedPid=2614652043 focusedName='Kerbal X Probe' reason=MapSwitchTo ut=[0-9.]+",
  "\\[SwitchSegment\\] route=standalone intentId=[0-9a-f-]{36} sessionId=[0-9a-f-]{36} treeId=[0-9a-f-]{36} segmentRecId=[0-9a-f-]{36} sourcePid=0 focusedPid=2614652043 fallthroughReason=<none> createdFreshTree=True",
  "\\[SwitchIntent\\] cleared: intentId=[0-9a-f-]{36} action=MapSwitchTo targetPid=2614652043 reason=consumed-into-segment",
  "switchclick complete site=map targetPid=2614652043 targetName=Kerbal X Probe intentId=[0-9a-f-]{36} route=plain-arm-and-switch activeVesselPid=2614652043 switched=true",
  "TryClassifyActiveSwitchSegmentNoOp: sessionId=[0-9a-f-]{36} segId=[0-9a-f-]{36} disposition=Standalone subtreeCount=1 hasDescendants=False noOp=True reason=no-op",
  "TryAutoDiscardNoOpSwitchSegment: no-op switch segment \\(Standalone\\) detected dest=SPACECENTER - discarding without commit",
  "AutoDiscardActiveTreeCore: discarding live tree reason='scene-exit no-op switch-segment auto-discard dest=SPACECENTER' ledgerRecalcReason='noop-switch-segment-discard'",
  "exittospacecenter complete scene=SPACECENTER game-loaded=true elapsed=[0-9.]+s",
  "\\[SwitchSegment\\] created [^\\n]*sessionId=([0-9a-f-]{36}) [^\\n]*segmentRecId=([0-9a-f-]{36}) [\\s\\S]*?\\[SwitchSegment\\] route=standalone [^\\n]*sessionId=\\1 [^\\n]*segmentRecId=\\2 [\\s\\S]*?TryClassifyActiveSwitchSegmentNoOp: sessionId=\\1 segId=\\2 disposition=Standalone subtreeCount=1 hasDescendants=False noOp=True reason=no-op",
]
# The suite-wide ERROR pattern; the DEFERRED shape (P3, the line the mirror
# measurement produces); and any commit at all - the discard must pre-empt commit routing.
forbidden = ["\\[Parsek\\]\\[ERROR\\]",
             "TryAutoDiscardNoOpSwitchSegment: no-op detected but disposition=",
             "Committed tree '"]

[runtime]
# Budget arithmetic (M-A5 S8): 300 LoadGame + 120 SimulateStockSwitchClick + 120
# ExitToSpaceCenter + ten fast RecordingState polls + the fast SetSetting /
# FlushAndQuit verbs + KSP boot and margin. S0.8 flies at p50 46 s and S0.7's exit
# lane at 48 s; 900 is a kill backstop, not a target.
budgetSeconds = 900

[retry]
policy = "once"

[expectedFail]
bugId = ""

