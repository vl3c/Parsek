description = "**RE-PINNED 2026-08-24 OFF ITS FIXTURE'S REAL BYTES, NOT YET FLOWN.** The tracking-station half of the SECOND moon-to-moon loop pair, at a SECOND parent, and it is a REPLICATION - roadmap gap G4. Committed AHEAD of its subject exactly as V17T was, and RE-PINNED the day its subject flew: `saveTemplate` names `fixtures/saves/mun-minmus-recorded`, which `B30-mun-minmus-transfer` produced on 2026-08-24 (run `2026-08-24_1536`, PASS attempt 1) and which is now committed and registered in `test_saveparse.RECORDED_FIXTURES`. The tree id is that fixture's own `029afab30803454894b02be12567af81` - the ZERO PLACEHOLDER IS GONE - and both `PENDING_FIXTURE_LANES` entries are DELETED, that map empty again. THE SINGLE TimeJump UT is **587226**, still V21M's third cycle-1 bracket jump reused verbatim so the two lanes observe the SAME instant from the two scenes, and STILL A CALIBRATION SEED: the SEAM OFFSET behind it is now a byte fact (**+267,230.864 s** from ut0 = 21,747.100307940530, read off the committed ORBIT_SEGMENT list, against a seeded 364,133.4), but the ANCHOR `A` is not - it is seeded at 305,660 off the fixture's 305,655.666 save clock, so the UT moves rigidly with whatever run 1 measures. The measured span is **283,907.446 s** against S1's 383,810.4 (-26.0%), so the error term on this jump is now SECONDS rather than the ~100 Ms the seed carried. THE DERIVATION LIVES IN V21M's HEADER SECTION 3 and is deliberately not duplicated, so the pair cannot drift: the seed hypothesis S1, the eight-UT table, the four-number re-pin recipe, and V19M's **SPAN-END TRAP** (the unit's span is the TRACK_SECTION ENVELOPE, not the first/last POINT - V17M measured 0.020 s / 1.060 s, V19M 0.020 s / 1.360 s). The one thing worth repeating: V17M's seeds were weak because the ROUTING was unknown, and V21's are weak because the FLIGHT DURATION is - the dominant error term is the stage-2 transfer-window wait, uniform on [0, 159,570.7 s] and seeded at its midpoint - so RUN 1 IS A CLOCK READ FIRST and a dwell-nowhere run 1 is the accepted pre-registered outcome. **WHAT THIS LANE ADDS OVER V21M** is the other scene: the FLIGHT-scene proto orbit line FAIL-CLOSES to the ROOT frame on a nested-SOI subject, while the TS overlap-instance protos are a DIFFERENT LENS built PER SEGMENT (`orbitSource=overlap-instance-segment`) rather than through the nested-SOI walk - which is why V17T's logs printed a destination-framed line where V17M's did not. **THAT ASYMMETRY IS A MEASUREMENT, NOT A DERIVATION**, and it is the disproof of the causal story V21M's first cut told: a property of the recording's body set cannot be true in one scene and false in the other, so the flight-scene silence is a property of that lens rather than of the nested-SOI classification - whose emit site both `PhaseFactory.cs:122-127` and `MapRenderTrace.cs:99-111` document as DEFINE-ONLY and GEOMETRY-NEUTRAL, and which does not execute at all with tracing off. The re-aim trio stays BOTH unrequired and unforbidden and NO D11 cell is claimed: this is a replication lane, and a lane that required the measured answer could not report a NON-replication. **THE FORTY-TICK TS DWELL IS SPAWN-THROTTLE HEADROOM, NOT CENSUS PACING**, carried from V17T where it was grown from two ticks on a measured mechanism: with the loop armed the init walk may skip the base recording (`noOrbit=1` on a segment-less tail) and every real ghost comes from the DYNAMIC overlap path, whose creation runs **NEWEST-CYCLE-FIRST at `MaxSpawnsPerFrame = 2` per lifecycle tick** - so cycle 1, the one instance in its MINMUS leg at this epoch and the one both anti-vacuity pins need, is the LAST of 20 to spawn (~10 ticks in). V17T run 1's two-tick TS phase gave ~0.65 s = 3 ticks = 6 ghosts and FlushAndQuit cut cycle 1 off; forty ticks (>= 10 wall s at run.py's 0.25 s poll floor) give the fill-in loop ~4x the headroom, and V17T run 2 then measured all 20 cycles spawned in-scene. No count is pinned. **THE TWO ANTI-VACUITY GATES ARE V17T's FINAL PAIR WITH MINMUS SUBSTITUTED**, both targeting the dynamic path: `GhostMap] Created ghost vessel ... orbitSource=overlap-instance-segment ... scene=TRACKSTATION` (an empty TS cannot green) and `phase=GhostCreated surface=ProtoIcon pid=\\d+ ... body=Minmus scene=TRACKSTATION` (V6T's `body=Mun` pin with the body swapped, which turns the D14 `minmus` claim from an EPOCH claim into a RENDERED-FRAME one, and which is the ONLY thing here that catches a mis-seeded FORWARD jump - the backward-jump forbid is near-inert on a seed sitting ~767 ks past **ut0** and ~383 ks past the **save epoch** the LoadGame lands on, the 767 ks figure having been mis-attributed to the save epoch in the first cut without changing the conclusion that the jump stays forward). **`created 0 ghost vessel(s)` IS DELIBERATELY NOT FORBIDDEN, AND THAT IS A MEASURED DECISION** - with one mechanical correction recorded before anyone re-arms it: **the `ghost vessel(s)` shape has TWO emitters, not one.** `ParsekTrackingStation.cs:229` emits the init-walk line the token is aimed at, and `Patches/GhostTrackingStationPatch.cs:615` emits `Pre-created {n} ghost vessel(s) before SpaceTracking.Awake`, which an unanchored regex would match as a SUBSTRING - so the pair's original claim that `ParsekTrackingStation` is its only emitter was false (V21M is corrected in the same pass), though the conclusion (both emitters are TRACKSTATION-only, so the token is structurally inert in a FLIGHT-only lane) survives. The overlap is latent today only because the Prefix wraps its log in `if (created > 0)`. As for the decision: V17T retired that forbid at its run-1 re-pin because init-zero is the CORRECT product outcome on a loop-armed subject whose tail is segment-less, and B30 commits at Minmus after a capture + circularization, so this subject is the same B25/V16M/V17M shape. The contrast with V19T - which RE-ADDED the forbid after its own run measured `created 1` with `noOrbit=0 visibleSegment=1` inside a segmented coast - is drawn explicitly, because it shows the rule is evidence-driven: no such run exists here, and the forbid can be added at arming if run 1 measures init-nonzero. **THE `icon-off-orbit` OPEN READING IS THIS LANE'S SHARPEST CONTRIBUTION AND BOTH OUTCOMES ARE PRE-REGISTERED.** The ledger: V14T/V15T/V16T raised it on 6 of 6 runs at three parents on an IDENTICAL step shape, with the stepped-bracket M-lane controls silent on all six of theirs; V17T was SILENT, the first silent single-jump run, but its subject differed in TWO ways at once (first self-overlapping loop AND first nested-SOI fail-closed subject) so WHICH one breaks the trigger was left an OPEN READING with no mechanism claimed; V19T was then silent with self-overlapping YES and nested-SOI NO, which EXCLUDED nested-SOI and left SELF-OVERLAP as the surviving candidate. **V21T is a second self-overlapping AND nested-SOI subject at a new parent, so it tests the SURVIVING candidate rather than re-confirming the excluded one.** SILENT strengthens the self-overlap reading to 3-silent/6-raising; a RAISE would BREAK it outright, since self-overlap is present here - and that is the more informative outcome, which is exactly why `allowedAnomalies` is EMPTY. A raise is DATA, reported as PARSEK-FAIL(anomaly) with every step green; pre-tolerating the token would swallow the discriminating measurement. NO MECHANISM IS CLAIMED IN EITHER DIRECTION and a fourth unnamed variable would defeat both readings. A second, sharper prediction is pre-registered and expected NEGATIVE: V16T's `seam-endpoint-outside-soi` raise came from a creation-frame binding gap whose displacement SCALES WITH THE CADENCE MULTIPLE, and this lane's cadence is ONE SPAN (k = 1, the H3 shape) rather than 20 moon periods, so it should not recur - V17T's identically-argued negative held. **THE TS CONIC IS ARITHMETIC AND NOT A PIN** (V14T's standing rule about six-figure floats): v_inf 99.287 m/s against mu_Minmus 1.7658e9 gives a = -179,127 m and e ~ 1.45-3.57 across the admissible park window - and the CONTRAST is the interesting part, because V17T's Vall arithmetic gave e ~ 1.15-1.28, a NEARLY PARABOLIC approach, while Minmus's is STRONGLY hyperbolic: Minmus's well is 117x shallower than Vall's while the arrival v_inf is only 3.1x smaller, so the rendered conic should look qualitatively unlike its predecessor's even though the flight profile replicates. **THE NEGATIVE CONTROL OWED BY CRITERION (b) IS OWED AND NOT YET FLOWN, AND THIS PAIR OWES TWO, NOT ONE SHARED** - a sharper reason than V19's, whose halves pinned different LENSES: this pair's halves pin different lenses AND different PRODUCERS AND different SCENES (the nested-SOI fail-closed declaration plus the FLIGHT-scene Director TracedPath drive on V21M, the Tracking Station's dynamic overlap-path proto ICON here), so one shared inversion would prove one of four things at most. The design is pre-registered - invert one character-run inside the required array only, `body=Minmus` -> `body=Vall`, a body this recording never visits - but is deliberately CUT AT ARMING off the reading bytes rather than now, because inverting a token whose measured text does not yet exist would be inverting a guess; and a control that PASSES is a FAILED control (V19T's `_0857` passed on a mis-escaped regex that made no edit at all, and had to be re-cut). NOTHING IS ARMED: `[expectations.rewind]` is REPORT-ONLY, `[expectations.recordings.structure]` is ABSENT, and the recordings count window {1,4} is a DERIVED RANGE matching B30's and V21M's - the load-time optimizer walk fires for the first time on this pair's LoadGame, so a split at either body-change seam or at the stage-2 propulsive sandwich would show there. **THE WINDOW'S COST IS STATED RATHER THAN SILENT:** a split at either seam leaves each resulting recording seeing ONE body, `NestedSoiSubtree` returns null on `distinct.Count < 2`, and V21M's `bodies=Mun/Kerbin/Minmus` form and `segIdx=\\d+` shadow pin both go unsatisfiable - so a green count with a red render pin on the pair's flight half IS the reading (the optimizer split a subject the family has twice measured it keeping cohesive), and neither the window nor the pins should be widened to absorb it. Both body-change seams are ON RAILS, which is the case `IsSplittableEnvOrBodyBoundary` rule 3 keeps cohesive: the Mun->Kerbin crossing sits 13,759 s of coast past the periapsis escape burn, beyond `soiLeadSeconds` and into native warp, and the Kerbin->Minmus arrival is a rails coast - the 'under thrust' both halves of the pair carried for the escape seam asserted rule 3's PHYSICS-frame-burn exception exactly where the profile says the rule applies. V5's rule that a DOUBLE-ENTRY spec owes the tighter pin applies at the arming pass: this lane writes a save mid-run and reads it back through a SECOND scene load."
