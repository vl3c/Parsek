# CLAIM-IS-NOT-GATE, and this is a short TS list because the routing is what the run
# READS rather than asserts.
#   D14 `scene-ts` is gated by the two R12 route tokens plus the TS host's own
#     initialization line; `sandbox` by the fixture; `minmus` by the TS host
#     materializing a ghost AT the Minmus arrival epoch - gated from the START by
#     `phase=GhostCreated surface=ProtoIcon ... body=Minmus scene=TRACKSTATION`
#     (V6T's `body=Mun` pin with the body swapped), which is what makes it a
#     RENDERED-FRAME claim rather than an EPOCH claim, and which is ROAD-INDEPENDENT.
# DELIBERATELY NOT CLAIMED: D11 `phase-lock` (V6T/V14T/V15T/V16T all claim it, gated
#   by `PhaseLock APPLIED: mission=` - but on the predicted road that line does not
#   fire for this tree, so the claim would be a coin flip), any D11 re-aim or
#   `fail-closed-to-faithful` cell (claiming one would promote a routing/render-policy
#   token from a READING into a GATE, and a non-replication is the one outcome worth
#   the flight), any D11 arrival cell (this OBSERVES an arrival epoch, it asserts no
#   arrival geometry), D6 `ghost-map-presence` (the TS ProtoVessel lifecycle is
#   H23/H28's contract), and D9 `fast-forward` (V21M owns it).
