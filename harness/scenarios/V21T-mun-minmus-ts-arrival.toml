#
# =====================================================================================
#
# V21T: THE TRACKING-STATION OBSERVATION OF A LOOPED **MOON-TO-MOON** ARRIVAL AT A
# SECOND PARENT - the TS half of the V21 pair. Roadmap gap G4.
#
# ---------------------------------------------------------------------------------
# 1. WHAT THIS LANE ADDS THAT V21M DOES NOT
# ---------------------------------------------------------------------------------
# The routing question was answered ONCE by V17M's reading run (H3 - Parsek neither
# re-aims nor phase-locks a moon-to-moon hop; the classifier DECLINES on the
# PARKING-ORBIT / MID-COURSE structural check at `ReaimClassifier.cs:270-277` and
# phase-lock declines on `support=UnsupportedCrossParent`), and V21M re-asks it at
# a second parent from the FLIGHT scene. **THIS LANE ASKS THE RENDER-SIDE HALF FROM
# THE OTHER SCENE**, and the two scenes assemble the chain differently enough that
# the pair has never been redundant:
#   * V17M's FLIGHT-scene proto orbit line FAIL-CLOSES on a nested-SOI subject and
#     renders the recorded path verbatim in the ROOT frame. V17T's TS
#     overlap-instance protos are a DIFFERENT LENS - built PER SEGMENT
#     (`orbitSource=overlap-instance-segment`) rather than through the nested-SOI
#     fail-closed walk - and V17T's collected logs DID print
#     `phase=body-orbit ... body=Vall` where V17M's could not.
#   * `factory chain rec=... reaimed=True|False` is a TS-side truth as well as a
#     FLIGHT-side one, and V5 is the only TS lane that ever pinned `reaimed=True`.
# **THE RE-AIM TRIO STAYS UNREQUIRED AND UNFORBIDDEN** for V21M section 1's reason,
# sharper here: this is a REPLICATION lane, and a lane that required the measured
# answer could not report a non-replication.
#
# ---------------------------------------------------------------------------------
# 2. WHY THE STEP CHAIN LOOKS LIKE THIS - V5's precondition, unchanged and binding
# ---------------------------------------------------------------------------------
# `MissionConfig`, `StartLoopPlayback` and `TimeJump` are ALL `RequiresFlight` in
# `TestCommandDispatcher.Preconditions`: in TRACKSTATION each would DEFER
# `not-in-flight` until its budget expired and the run would die on a timeout having
# armed nothing. So arming and clock work happen in FLIGHT, are PERSISTED, and only
# then re-entered in TS:
#   FLIGHT: kill the entry stub -> arm tracers -> MissionConfig (loop ON)
#           -> StartLoopPlayback -> TimeJump past the cycle-1 Kerbin->Minmus seam
#   SaveGame (persists the armed MissionStore state AND the jumped clock; ghost
#             ProtoVessels are stripped by GhostMapPresence.StripFromSave)
#   TRACKSTATION: LoadGame scene=trackstation, then the forty-tick dwell (section 4)
# There is no shorter honest chain.
#
# THE RE-KILL PAIR BEFORE THE TS LOAD IS NOT BELT-AND-BRACES: V5 run 1 attempt 1
# died there on `reject cmd=LoadGame reason=recording-active`, because the
# scene-entry promotion recorder RE-ARMS on some entry orderings and not others.
# Running the pair immediately before the load the guard rejects is the only
# placement that makes the outcome deterministic.
#
# **AND NOTE WHAT THIS LANE DELIBERATELY DOES NOT CARRY**: V21M's census-pacing
# block at a park epoch. A single-arrival shape has exactly one census emission to
# make and no second one to rescue. Its forty ticks are here for a DIFFERENT and
# measured reason - section 4.
#
# ---------------------------------------------------------------------------------
# 3. WHERE THE CLOCK IS PARKED, AND WHAT CATCHES A MIS-SEED
# ---------------------------------------------------------------------------------
# **587226** is V21M's third cycle-1 bracket jump, reused verbatim. It sits ~140 s
# past the cycle-1 REPLAY of the Kerbin -> Minmus SOI entry (587,086.24 under the
# re-pin). **THE RECORDED SEAM OFFSET IS NOW A BYTE FACT - 267,230.863859202 s from
# ut0 = 21,747.100307940530**, read off the committed sidecar's ORBIT_SEGMENT list
# (the seed was 364,133.4). WHAT IS STILL A SEED is the ANCHOR `A`, seeded at
# 305,660 off the fixture's own 305,655.666 save clock, so this UT moves rigidly
# with whatever run 1 measures. V21M header 3.7 owns the arithmetic.
#
# **WHAT CATCHES A MIS-SEEDED RUN HERE IS NOT THE BACKWARD-JUMP FORBID.** V19T
# corrected the family on that token: the verb also calls
# `SetExecResult("REJECTED", null, "backward-jump")`, so a refused jump makes the
# STEP go unmet and the run driver-INVALID, and the forbid is a redundant
# grep-stable echo. **ON THIS LANE IT IS NEARLY INERT**, because the seeded UT sits
# ~565 ks past **ut0** (21,747.100 - where the RECORDING starts) and **~282 ks past
# the SAVE EPOCH the LoadGame actually lands on** (A seeded 305,660 against the
# fixture's 305,655.666 save clock). An earlier cut described the larger figure as
# the distance past the save epoch, which is the wrong baseline by the whole span of
# the recording; the CONCLUSION is unaffected, since an anchor error leaves the jump
# forward against either baseline and nothing refuses. The case that catches a forward jump at the WRONG epoch is
# the section-5 anti-vacuity pin `... body=Minmus scene=TRACKSTATION`, and that is
# why it earns its place here more than on any predecessor.
#
# ---------------------------------------------------------------------------------
# 4. THE FORTY-TICK TS DWELL IS **SPAWN-THROTTLE HEADROOM**, NOT CENSUS PACING
# ---------------------------------------------------------------------------------
# Carried from V17T, where it was GROWN FROM TWO TICKS at that lane's run-1 re-pin
# (`2026-08-20_1917`) on a measured mechanism, and it is the single most important
# structural inheritance in this file:
#
#   * With the loop ARMED, the TS INIT WALK evaluates the BASE recording at the
#     entry epoch and may skip it (`noOrbit=1`) - so the real ghosts come from the
#     DYNAMIC OVERLAP PATH instead.
#   * Overlap-instance creation runs **NEWEST-CYCLE-FIRST at
#     `MaxSpawnsPerFrame = 2` per lifecycle tick**. So **CYCLE 1 - THE ONE INSTANCE
#     IN ITS MINMUS LEG AT THIS EPOCH, AND THE ONE BOTH SECTION-5 PINS NEED - IS
#     THE LAST OF 20 TO SPAWN** (~10 ticks in).
#   * V17T run 1's TS phase lasted ~0.65 s = 3 ticks = 6 ghosts (cycles 14-19) and
#     `FlushAndQuit` ended the scene before cycle 1's turn. **THE PINS WERE
#     SATISFIABLE; THE SCENE JUST HAD TO LIVE LONG ENOUGH.** The SAME epoch in the
#     FLIGHT phase created all 20 including the destination-framed one.
#
# Forty `RecordingState` ticks (>= 10 wall s at `run.py`'s 0.25 s
# `POLL_INTERVAL_SECONDS` floor - V16M's proven sizing) give the fill-in loop ~4x
# the headroom it needs. V17T run 2 then measured all 20 cycles spawned in-scene
# with NINE destination-framed `GhostCreated` lines; V19T's forty ticks bought 37
# ghosts. **NO COUNT IS PINNED HERE** - the dwell buys the OPPORTUNITY, and the
# section-5 tokens ask only that at least one instance materialize in a Minmus
# frame.
#
# ---------------------------------------------------------------------------------
# 5. THE LENS - coverage criterion (a) for the TS scene, and the `created 0` question
# ---------------------------------------------------------------------------------
# THE TWO ANTI-VACUITY GATES ARE V17T's FINAL PAIR WITH MINMUS SUBSTITUTED, and
# both target the **DYNAMIC OVERLAP PATH** rather than the init walk:
#
#   (1) `GhostMap\] Created ghost vessel .*orbitSource=overlap-instance-segment
#        .*scene=TRACKSTATION`
#       - the dynamic path actually materializing a loop instance IN THE TS. An
#       empty TS still cannot green: this token requires the dynamic path to have
#       created at least one instance in-scene.
#
#   (2) `phase=GhostCreated surface=ProtoIcon pid=\d+ .*body=Minmus
#        scene=TRACKSTATION`
#       - V6T's `body=Mun` pin with the body swapped, which turns the D14 `minmus`
#       claim from an EPOCH claim into a **RENDERED-FRAME** claim. This is the
#       epoch-sensitive half and the thing that catches a mis-seeded forward jump
#       (section 3).
#
# **AND `created 0 ghost vessel(s)` IS DELIBERATELY *NOT* FORBIDDEN, WHICH IS A
# MEASURED DECISION RATHER THAN A CAUTIOUS ONE.**
#
# **FIRST, A MECHANICAL CORRECTION THAT MATTERS BEFORE ANYONE RE-ARMS IT: THE `ghost
# vessel(s)` SHAPE HAS TWO EMITTERS, NOT ONE.** Both halves of this pair used to say
# its only emitter is `ParsekTrackingStation`; that was false, and V21M is corrected in
# the same pass. `ParsekTrackingStation.cs:229` emits
# `ParsekTrackingStation initialized: created {created} ghost vessel(s), ...` - the
# init walk this token is aimed at - and `Patches/GhostTrackingStationPatch.cs:615`
# emits `Pre-created {created} ghost vessel(s) before SpaceTracking.Awake` from the
# `SpaceTracking.Awake` Prefix. **A BARE, UNANCHORED REGEX MATCHES THE SECOND AS A
# SUBSTRING OF THE FIRST'S TEXT** ("created 0 ghost vessel(s)" is a suffix of
# "Pre-created 0 ghost vessel(s)"), so re-arming this forbid without a leading anchor
# would forbid two different product decisions at once - the init walk's skip AND the
# Awake-time pre-create. The overlap is LATENT rather than live today, because the
# Prefix wraps its log in `if (created > 0)` and so cannot currently print the zero
# form; that guard is exactly the kind of thing that changes without anyone re-reading
# a spec, which is why it is written down here rather than rediscovered at arming.
# Both emitters are TRACKSTATION-only, so V21M's conclusion that the token is
# structurally inert in a FLIGHT-only lane survives the correction intact.
#
# **SECOND, THE DECISION ITSELF.** The family carried that forbid through
# V14T/V15T/V16T; **V17T RETIRED IT AT ITS RUN-1 RE-PIN BECAUSE INIT-ZERO IS THE
# CORRECT PRODUCT OUTCOME ON THIS CLASS OF SUBJECT**: with the loop armed,
# the init walk evaluates the base recording at the entry epoch and skips it
# `noOrbit=1` when the tail is SEGMENT-LESS (no visibleSegment / terminalOrbit /
# endpointTail / stateVector source resolves), and every real ghost comes from the
# per-lifecycle-tick overlap path instead. **THIS SUBJECT IS THE SAME SHAPE**: B30
# commits at Minmus after a capture + circularization, so its parked tail is the
# B25/V16M/V17M segment-less shape and the entry epoch is the arrival bracket
# rather than a segmented coast. Forbidding the init line would forbid a behavior
# V17T's run 1 proved deliberate.
# **NOTE THE CONTRAST WITH V19T, WHICH RE-ADDED THE FORBID** - and it is the right
# contrast to draw, because it shows the rule is evidence-driven rather than
# fashion: V19T's entry epoch sits inside a real segmented Jool coast, its run
# `2026-08-21_0750` MEASURED `created 1 ghost vessel(s)` with `noOrbit=0` and
# `visibleSegment=1`, and a forbid there guards a MEASURED outcome against
# regression (the S1.4 rule - arm the bare token WITH the run that shows it). **NO
# SUCH RUN EXISTS HERE.** If run 1 measures init-nonzero on this subject, the forbid
# can be added at the arming pass, citing that run.
#
# ---------------------------------------------------------------------------------
# 6. **THE `icon-off-orbit` OPEN READING - AND THIS LANE IS THE DISCRIMINATOR**
# ---------------------------------------------------------------------------------
# `docs/dev/todo-and-known-bugs.md` ->
# MAPRENDER-ICON-OFF-ORBIT-CREATION-FRAME-AFTER-JUMP. THE LEDGER AS IT STANDS:
#   V14T / V15T / V16T   raised it on **6 of 6** runs at three parents (Duna/Ike
#                        94.05 deg, Eve/Gilly 26.49, Jool/Laythe 129.15), on a step
#                        shape IDENTICAL to this one, while the stepped-bracket
#                        V14M/V15M/V16M controls stayed SILENT on all six of theirs.
#   V17T                 **SILENT** - the first silent single-jump run after six
#                        raising ones. Its subject differed in **TWO** ways at once:
#                        FIRST self-overlapping loop **AND** first nested-SOI
#                        fail-closed-to-root subject. WHICH ONE breaks the trigger
#                        was NOT determined, and no mechanism was claimed.
#   V19T                 **SILENT** with self-overlapping YES and nested-SOI **NO**
#                        (visited {Laythe, Jool}, no sibling pair, `FindNestedRoot`
#                        returns null). **THAT EXCLUDED NESTED-SOI AS THE CAUSE and
#                        left SELF-OVERLAP as the surviving candidate.**
#
# **V21T IS A SECOND SELF-OVERLAPPING *AND* NESTED-SOI SUBJECT, AT A NEW PARENT, SO
# IT IS THE CELL THAT TESTS THE SURVIVING CANDIDATE RATHER THAN RE-CONFIRMING THE
# EXCLUDED ONE.** BOTH OUTCOMES ARE PRE-REGISTERED HERE AND NEITHER IS GATED:
#   * **SILENT** - a third silent run, second at a self-overlapping nested-SOI
#     subject and now at a second parent, strengthening the self-overlap reading to
#     3-silent / 6-raising with the raising six all non-self-overlapping. Still a
#     correlation over four subjects, and still no mechanism.
#   * **RAISES** - the reading that would BREAK the self-overlap hypothesis
#     outright, since self-overlap is present here. That would be the more
#     informative outcome and it must be reportable, which is exactly why
#     `allowedAnomalies` is EMPTY: a raise is DATA, reported as a
#     PARSEK-FAIL(anomaly) with every step green, and pre-tolerating the token would
#     swallow the discriminating measurement.
# **NO MECHANISM IS CLAIMED IN EITHER DIRECTION**, and a fourth variable nobody has
# named would defeat both readings. The narrowing belongs on the todo entry, not in
# a gate.
#
# **A SECOND, SHARPER PREDICTION IS PRE-REGISTERED AND EXPECTED NEGATIVE.** V16T
# measured `seam-endpoint-outside-soi` on a different lens - the seam-endpoint lens
# evaluating the recording's UN-SHIFTED epoch on the proto's creation frame, filed
# as MAPRENDER-SEAM-LENS-EVALUATES-UNSHIFTED-EPOCH-ON-CREATION-FRAME - and the
# mechanism it names **SCALES WITH THE CADENCE MULTIPLE**. This lane's cadence is
# ONE SPAN (k = 1, the H3 shape), not 20 moon periods, so the displacement is small
# and the raise should NOT recur; V17T's identically-argued negative HELD. If it
# fires anyway that is a finding about the mechanism rather than about the lane.
# Neither outcome is gated.
#
# ---------------------------------------------------------------------------------
# 7. WHAT THE TS HOST SHOULD MATERIALIZE - THE CONIC IS ARITHMETIC, NOT A PIN
# ---------------------------------------------------------------------------------
# V6T's TS ghost printed the fixture's own recorded Mun approach hyperbola, V14T's
# Ike's, V15T's Gilly's, V16T's Laythe's, V17T's Vall's. V15T PREDICTED its conic
# and was WRONG BY THREE ORDERS OF MAGNITUDE through a factor-1000 slip; V16T landed
# within a factor of 1.7. The arithmetic here, from the G4 number set:
#     v_inf at Minmus = 99.287 m/s ; mu_Minmus = 1.7658e9
#     a = -mu / v_inf^2 = **-179,127 m** ; e = 1 + r_p/|a|
#     over the admissible park window (periapsis alt 20 km -> 400 km, r_p 80 km ->
#     460 km) that is **e ~ 1.45 to 3.57**.
#
# **AND THE CONTRAST WITH VALL IS THE INTERESTING PART, SO IT IS WRITTEN DOWN
# RATHER THAN LEFT IMPLICIT**: V17T's Vall arithmetic gave e ~ 1.15-1.28, i.e. a
# NEARLY PARABOLIC approach; Minmus's is STRONGLY hyperbolic, because Minmus's well
# is **117x shallower** than Vall's (1.7658e9 against 2.074e11) while the arrival
# v_inf is only **3.1x smaller** (99.287 against 309.12). So the TS conic this lane
# renders should look qualitatively unlike its predecessor's even though the flight
# profile replicates. **THAT IS WRITTEN AS ARITHMETIC AND NOT AS A PIN** (V14T's
# standing rule about six-figure floats), and it is a READING to take off the
# collected log.
#
# What IS required below is the `body=Minmus scene=TRACKSTATION` half, which is
# road-independent: any chain that materializes this instance at this epoch puts it
# in a Minmus frame.
#
# ---------------------------------------------------------------------------------
# 8. THE NEGATIVE CONTROL owed by coverage criterion (b) - **OWED, NOT YET FLOWN**
# ---------------------------------------------------------------------------------
# Criterion (b) requires the control to invert a REQUIRED **RENDER** TOKEN. The
# standing shared inversion the V program used before V19 - a temporary
# `rewind.supersedeRows = { min = 1 }` - proves the `saveParse` EVALUATOR can red
# and proves NOTHING about whether the render pins can. V19 retired it: V19M
# inverted its proto-ORBIT-LINE body token (`2026-08-21_0855`) and V19T inverted its
# proto-ICON body token (`2026-08-21_0858`), each coming back PARSEK-FAIL(expectation)
# with ONE mismatch naming the pin, `saveParse` still PASS and `driverValidity` /
# `anomalySweep` clean.
#
# **THIS PAIR OWES TWO CONTROLS, NOT ONE SHARED, AND THE REASON IS SHARPER THAN
# V19's.** V19's halves pinned different LENSES. **THIS PAIR'S HALVES PIN DIFFERENT
# LENSES *AND* DIFFERENT PRODUCERS *AND* DIFFERENT SCENES**: V21M pins the
# nested-SOI FAIL-CLOSED declaration plus the FLIGHT-scene Director TracedPath
# shadow drive; this lane pins the TRACKING STATION's **DYNAMIC OVERLAP-PATH** proto
# ICON. Those share no code path, no producer, no scene and no frame convention, so
# one shared inversion would prove one of four things at most.
#
# THE DESIGN FOR THIS LANE'S CONTROL, to be CUT OFF THE READING BYTES AT ARMING
# (not now - inverting a token whose measured text does not yet exist would be
# inverting a guess):
#   invert ONE character-run inside `[expectations.logContracts].required`, in the
#   ARRAY ONLY, leaving every COMMENT copy and every step / jump / budget / setting
#   untouched: `phase=GhostCreated surface=ProtoIcon pid=\d+ .*body=Minmus
#   scene=TRACKSTATION` -> `... body=Vall scene=TRACKSTATION`. Vall is chosen
#   because this recording never visits it and this lane never enters its SOI, so
#   the inverted token reds precisely because the TS render never puts this ghost in
#   a Vall body frame - which proves the pin measures the RENDERED BODY FRAME rather
#   than proving the evaluator works.
#   **A CONTROL THAT PASSES IS A FAILED CONTROL, NOT A GOOD SIGN.** V19T's
#   `2026-08-21_0857` was attempted as its control and PASSED, because a mis-escaped
#   regex silently made no edit at all - it is the UNMODIFIED spec passing a second
#   time, recorded honestly as an extra confirmation and NOT as a control, and the
#   inversion had to be re-cut. Revert the spec in the same session and record the
#   revert-confirmation run.
#
# ---------------------------------------------------------------------------------
# 9. POSTURE - FIRST-RUN READING, NOTHING ARMED, NO D11 CELL
# ---------------------------------------------------------------------------------
# `required` is TEN tokens: the four FLIGHT-side arm/warp/jump plumbing lines, the
# two R12 TS route lines, the two dynamic-path anti-vacuity gates, and the two lens
# PRESENCE forms. What is absent is absent on purpose - `Orbital(...) same-parent`,
# `support=Supported` and any `PhaseLock APPLIED` form are ALL phase-lock-road
# artifacts, and `factory chain ... reaimed=False` is exactly the render-side half
