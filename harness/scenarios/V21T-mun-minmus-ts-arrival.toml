[expectations]
# PLACEMENT IS LOAD-BEARING (hlib.validate_spec rejects a bare allowedAnomalies
# written after any [expectations.<sub>] header).
#
# **EMPTY ON PURPOSE, AND SECTION 6 IS THE WHOLE REASON.** This lane is the
# DISCRIMINATOR for the `icon-off-orbit` open reading: the family raised it on 6 of
# 6 runs at three parents on an identical step shape, V17T was silent with TWO
# candidate causes present at once, and V19T's silence with nested-SOI ABSENT
# excluded that one and left SELF-OVERLAP surviving. **THIS SUBJECT HAS BOTH
# self-overlap AND nested-SOI**, so a RAISE here would BREAK the surviving candidate
# outright - the more informative of the two outcomes, and the one that a
# pre-tolerated token would silently swallow. A PARSEK-FAIL(anomaly) with every step
