#
# `forbidden` is THREE: the ERROR floor, the backward-jump marker (section 3 -
# carried for family convention, near-inert here), and the faithful-parity
# over-tolerance pin. The re-aim trio is in NEITHER list, and `created 0 ghost
# vessel(s)` is NOT carried for section 5's measured reason. NOTE also that the
# `icon-off-orbit` raise this lane may or may not produce is the ANOMALY SWEEP's
# surface, not logContracts' - it is handled, by being deliberately untolerated, in
# `allowedAnomalies`.
#
# `allowedAnomalies = []`, declared BEFORE any `[expectations.<sub>]` header
# (`hlib.validate_spec` rejects a bare one written after). Section 6 is the reason.
#
# `[expectations.rewind]` is REPORT-ONLY and `[expectations.recordings.structure]`
# is ABSENT. Arm both from this lane's own bytes - and note V5's rule that a
