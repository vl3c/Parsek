# attempt on it if it fires. Priced, not dodged. The S1.4 rule stands: a token is
# added WITH the flight that shows it.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC, identical to V21M's - read that spec's block, which is not
# restated here so the pair cannot drift. In brief: the (not yet harvested) fixture
# is PREDICTED to ship ONE `.prec` sidecar, this lane starts no recording of its
# own, and the count can move only through a LOAD-TIME optimizer split at either of
# the recording's TWO body-change seams - **BOTH ON RAILS**, which is the case rule 3
# keeps cohesive (the Mun->Kerbin escape crossing is 13,759 s of coast past the
# periapsis burn, so no PHYSICS-frame burn crosses it; the Kerbin->Minmus arrival is a
# rails coast) - or at B30's third candidate, the stage-2 ExoBallistic ->
# ExoPropulsive -> ExoBallistic sandwich. The load-time walk fires for the FIRST time
# on this pair's LoadGame, so a split B30's own count never saw can show up here.
# **AND THE WINDOW'S COST IS NOT SILENT.** A split at either body-change seam leaves
# each resulting recording seeing ONE body; `NestedSoiSubtree` then returns null on its
# `distinct.Count < 2` guard, so the nested-SOI render policy this pair's FLIGHT half
# reads no longer applies to either piece, and V21M's `bodies=Mun/Kerbin/Minmus` form
# and its `segIdx=\\d+` shadow pin both go unsatisfiable. This lane's own two TS gates
# survive a split - they ask only that the dynamic overlap path materialize an instance
# in a Minmus frame - so the PAIR would report the split as a red on V21M and a green
# here, which is the diagnostic shape rather than a contradiction. **A GREEN COUNT WITH
# A RED RENDER PIN IS ITSELF THE READING** (the optimizer split a subject the family has
# twice measured it keeping cohesive); do not widen the window or the pins to absorb it.
# => { min = 1, max = 4 }, matching V21M's and B30's. A DERIVED RANGE, not a pin.
count = { min = 1, max = 4 }

[expectations.logContracts]
# TEN TOKENS, and the ones a reader will notice missing are missing on purpose
# (header section 9): `Orbital(...) same-parent`, `support=Supported` and any
# `PhaseLock APPLIED` form are ALL phase-lock-road artifacts, and
# `factory chain ... reaimed=False` is exactly the render-side half of the thing
# this replication lane is re-measuring.
#   "missionconfig applied:" / "SetLoopEnabled: loop ON" - the loop is ARMED through
#     the production path, in FLIGHT, before the save; the first also echoes the
#     anchor, the number to read when re-calibrating the jump.
#   "startloopplayback initiated:" - the clock work entered the production door and
#     echoed the resolved relaunchUt. ROAD-INDEPENDENT and the single most important
#     line in this log for the re-pin.
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line.
# THE TWO R12 ROUTE LINES - the trackstation BRANCH was taken and the load COMPLETED
#     against the TrackingStation expected scene (H23's pins verbatim; this fixture
#     has a focusable vessel and would otherwise route to FLIGHT, so a TRACKSTATION
#     landing can only mean the requested scene overrode the save-derived route -
#     the claim is falsifiable).
# THE TWO TS ANTI-VACUITY GATES, V17T's FINAL PAIR with Minmus substituted - BOTH on
#     the DYNAMIC OVERLAP PATH rather than on the init walk, because V17T run 1
#     measured that the family's init-line pin does not apply to a self-overlapping
#     subject whose base recording ends in a segment-less park:
#   "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION"
#     - the DYNAMIC overlap path actually materializing a loop instance in the TS.
#     An empty TS still cannot green: this token requires the dynamic path to have
#     created at least one instance IN-SCENE.
#   "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Minmus scene=TRACKSTATION"
#     - V6T's `body=Mun` pin with the body swapped, which turns the D14 `minmus`
#     claim from an EPOCH claim into a RENDERED-FRAME claim. **THIS IS THE ONLY
#     TOKEN HERE THAT CATCHES A MIS-SEEDED FORWARD JUMP** (header section 3), and it
#     is the one the forty-tick dwell exists to make reachable (section 4): cycle 1
#     is the LAST of 20 to spawn at `MaxSpawnsPerFrame = 2` newest-cycle-first.
# THE PROBE / LENS PRESENCE PINS (V6T/V14T/V15T/V16T/V17T's, verbatim):
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - emitted only when the
#     per-pid parity pass touched the lens, so PRESENCE cannot be produced by a frame
#     with no resolved ghost. `sampled=[1-9]` is NOT pinned (the standing
#     FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot). NOTE this lens is
#     road-sensitive in a way worth reading: its `skip.reaimed-or-foreign-seed`
#     counter names re-aim explicitly.
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and
#     it must stay presence-only on a first run for THREE reasons: the value is
#     unmeasured at this subject, a TS dwell characteristically reads the structural
#     `evaluated=0 skip.no-cross-body-successor=1` (V6T/V7T/V14T/V15T all did), and
#     V16T MEASURED that this lens can raise a nonzero from a creation-frame binding
#     artifact rather than from real drift (header section 6's second prediction).
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "loadgame trackstation route: booting to TRACKSTATION save=",
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  "GhostMap\\] Created ghost vessel .*orbitSource=overlap-instance-segment .*scene=TRACKSTATION",
  "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Minmus scene=TRACKSTATION",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, NOT V14T's SIX. The re-aim trio is REMOVED for V21M section 1's reason:
# this is a REPLICATION lane, so re-aim is the thing that might legitimately differ
# from the measured answer, and forbidding those tokens would red the one outcome
# worth the flight.
# NOTE what is also NOT here, in two directions:
#   * the `icon-off-orbit` raise this lane may or may not produce is the ANOMALY
#     SWEEP's surface, not logContracts', and it is handled - by being deliberately
#     untolerated - in `allowedAnomalies` above.
#   * **`created 0 ghost vessel(s)` IS NOT CARRIED**, and that is a MEASURED
#     decision rather than a cautious one (header section 5, which also corrects the
#     claim that `ParsekTrackingStation` is its only emitter - `GhostTrackingStationPatch`'s
#     `Pre-created {n} ghost vessel(s)` line would be matched as a SUBSTRING by an
#     unanchored regex, so read that before re-arming this). V17T RETIRED this
#     forbid at its run-1 re-pin because init-zero is the CORRECT product outcome on
#     a loop-armed subject whose tail is SEGMENT-LESS: the init walk evaluates the
#     base recording at the entry epoch, no visibleSegment / terminalOrbit /
#     endpointTail / stateVector source resolves, it skips `noOrbit=1`, and every
#     real ghost comes from the overlap path instead. B30 commits at Minmus after a
#     capture + circularization, so this subject is PREDICTED to be that same shape.
#     Forbidding the init line would forbid a behavior V17T's run 1 proved
#     deliberate. **THE CONTRAST WITH V19T IS THE PROOF THE RULE IS EVIDENCE-DRIVEN**:
#     V19T RE-ADDED the forbid after its own run `2026-08-21_0750` measured
#     `created 1 ghost vessel(s)` with `noOrbit=0` and `visibleSegment=1`, because
#     its entry epoch sits inside a segmented coast. NO SUCH RUN EXISTS HERE. If run
#     1 measures init-nonzero on this subject, add the bare token at the arming pass
#     CITING that run (the S1.4 rule).
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 SELF-DETECTION MARKER, carried for family convention and
  # DELIBERATELY NOT OVERSOLD (V19T's correction): the verb also calls
  # `SetExecResult("REJECTED", null, "backward-jump")`, so a refused jump makes the
  # STEP go unmet and the run driver-INVALID; this token is a redundant grep-stable
  # echo. **AND ON THIS LANE IT IS NEARLY INERT**, because the seeded UT sits ~565 ks
  # past **ut0** and ~282 ks past the **SAVE EPOCH** the LoadGame lands on (A seeded
  # 305,660) - an earlier cut attributed the larger figure to the save epoch, which is
  # the wrong baseline by the recording's whole span. An anchor error leaves the jump
  # forward against either baseline and nothing refuses. What catches a forward jump at
  # the WRONG epoch is the `body=Minmus scene=TRACKSTATION` pin above (header 3).
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a RENDER defect rather than a reading about
  # the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# REPORT-ONLY (the ARMED_ALLOWLIST discipline). The claim is the family's: a pure
# replay-observation workflow must author NOTHING durable. It is worth MORE on this
# shape than on a single-scene dwell, for V5's reason - this spec writes a save
# mid-run and reads it back through a SECOND scene load, the shape in which a stray
# durable write is easiest to miss, and here the second load also drives the dynamic
# overlap path through a full 20-instance fill-in. Arm it at the arming pass, off
# THIS lane's own bytes.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# [expectations.recordings.structure] and the points facets are DELIBERATELY ABSENT
# on a first run: a report-only block of PREDICTED numbers reads like a measurement,
# and this pair's predicted topology is unmeasured. Author it from run 1's own
# saveParse facets and arm it there - and note V5's rule that a DOUBLE-ENTRY spec
# owes the TIGHTER pin.

[runtime]
# 300 LoadGame + 300 StartLoopPlayback + 300 TimeJump + 300 LoadGame(TS) + 40
# RecordingState ticks (~10-22 wall s) + the fast non-deferred verbs + KSP boot +
# collect. TWO ATTRIBUTIONS CORRECTED HERE:
#   * **V17T IS 54 STEPS, NOT 55** - and so is this lane, so "identical shape" is
#     right while the count that qualified it was not. V17T's shape measured well
#     inside this budget.
#   * **THE GAME TIME TRAVERSED IS ~282 ks, NOT ~565 ks.** The run starts at the
#     produced save's own UT (305,655.666; A seeded 305,660) and the single jump
#     lands at 587,226, so the traversal is 281,570 s. The ~565 ks figure is the
#     distance from **ut0** (21,747.100), i.e. from where the RECORDING starts
#     rather than from where the LoadGame lands.
# The point survives both: the jump is an instantaneous clock set, so whichever
# baseline is used the traversed game time costs no wall clock.
budgetSeconds = 2400

[retry]
# One retry absorbs the V5 promotion-recorder re-arm race, the transient
# TS-re-entry `LoadGame REJECTED` deferred-save busy class (V17T's armed re-flight
# `_1939_a2` spent exactly that), and ordinary seam flakes. It does NOT absorb a
# mis-seeded clock: that reproduces exactly on attempt 2, which is the point, and on
# this lane it is the LIKELY outcome of run 1 rather than an edge case. NOTE the
# retry is ALSO budgeted to spend itself on an `icon-off-orbit` raise if section 6's
# more informative branch happens, since the token is deliberately un-tolerated so
# the sweep can measure it - both attempts would then report PARSEK-FAIL(anomaly).
# That is a pre-registered outcome, priced here rather than discovered.
policy = "once"

[expectedFail]
bugId = ""
