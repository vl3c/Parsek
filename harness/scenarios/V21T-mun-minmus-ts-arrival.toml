[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # Kill the scene-entry auto-recorder. HARD precondition, not hygiene: the SECOND
  # LoadGame below is REJECTED `recording-active` by the dispatch guard if a
  # recorder is live, and SaveGame would persist a half-recorded stub into the save
  # the TS half then reads.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # mapRenderTracing arms the map/TS tracer + probe (and is what makes BOTH
  # section-5 gates emit at all); verboseLogging is LOAD-BEARING (the Tier-B truth
  # lines are Verbose - the V1 lesson). Settings are process-global, so both survive
  # the LoadGame into TS.
  { cmd = "SetSetting", args = { name = "mapRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",   value = "true" }, expect = "OK" },
  # ARM (FLIGHT-only): the production MissionStore.SetLoopEnabled path. THIS is
  # where a CROSS-PARENT tree either reaches ApplyReaim or does not, and its Info
  # line echoes the anchor the re-pin needs.
  # TREE ID: **B30's COMMITTED TREE**, re-pinned 2026-08-24 off `mun-minmus-recorded`.
  { cmd = "MissionConfig", args = { tree = "029afab30803454894b02be12567af81", loop = "true" }, expect = "OK" },
  # WARP TO CYCLE 1's LAUNCH (FLIGHT-only): an instantaneous Planetarium clock set.
  # Its `relaunchUt=` echo is the number the whole seed table hangs off, and it is
  # emitted whichever road the unit took.
  { cmd = "StartLoopPlayback", args = { tree = "029afab30803454894b02be12567af81" }, expect = "OK", budget = 300 },
  # FORWARD TO ~140 s PAST THE CYCLE-1 Kerbin->Minmus SEAM (FLIGHT-only), which the
  # re-pin puts at 587,086.24. V21M's third cycle-1 bracket jump, reused verbatim so
  # the two lanes observe the SAME instant from the two scenes. STILL A CALIBRATION
  # SEED, because the anchor `A` is (V21M header 3.7); see section 3 above for why
  # the backward-jump forbid will NOT catch a mis-seed here and the section-5 body
  # pin will.
  { cmd = "TimeJump", args = { ut = "587226" }, expect = "OK", budget = 300 },
  # PERSIST the armed mission state + the jumped clock.
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  # RE-KILL THE RECORDER immediately before the load the guard rejects (V5's
  # measured re-arm race - see header section 2).
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  # RE-ENTER IN THE TRACKING STATION (R12's additive `scene=` arg, the H23 route).
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "trackstation" }, expect = "OK", budget = 300 },
  # ============================================================================
  # FORTY DWELL TICKS - **SPAWN-THROTTLE HEADROOM, NOT CENSUS PACING** (header
