# off B26's measured count, CREWED (Jebediah Kerman in the mk1-3pod). The
# "under thrust" both halves of the pair used to carry for the escape seam is
# corrected in both: `IsSplittableEnvOrBodyBoundary` rule 3 keeps a same-class Exo
# body change cohesive EXCEPT when a PHYSICS-frame burn crosses it, so writing the
# seam as thrust-bearing asserted the exception where the profile says the rule
# applies. **EVERY ONE OF THOSE IS A PREDICTION**, written down so the harvest can
# falsify it rather than be described after the fact.
#
# THE ONE THING THIS LANE CARES ABOUT THAT V21M DOES NOT: **THE PARKED TAIL IS
# PREDICTED TO BE SEGMENT-LESS.** B30 commits after a capture burn and a
# circularization at Minmus, so the last ORBIT_SEGMENT should end before the
# recording does - the B25 / V16M / V17M shape. That is what drives section 5's
# `created 0` decision, and it is the ONE structural prediction in this file whose
