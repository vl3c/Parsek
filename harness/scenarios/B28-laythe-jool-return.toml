#   eccentricity ceiling 0.10 - 3.61x the measured 0.0277. B26 kept 0.10 over
#     B23/B24/B25's 0.05 because this park is the delivered product of a finite
#     capture burn rather than a rounded-out circularization. NOTE WHAT IS GONE
#     HERE THAT B26 HAD: there is no MechJeb transfer plan anywhere on this lane,
#     so the sma-vs-radius ejection error B26 quantified at ~37 m/s does not
#     exist - the escape node is sized by vis-viva AT the periapsis radius it is
#     applied at, and there is no stage 2. The ceiling's only remaining job is
#     to say "this is not the fixture this spec sized".
startInOrbitMinPeriapsisMeters  = 52000
startInOrbitMaxApoapsisMeters   = 300000
startInOrbitMaxEccentricity     = 0.10
startInOrbitSituations          = ["ORBITING"]
startInOrbitDebounceFrames      = 3
