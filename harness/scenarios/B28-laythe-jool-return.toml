# =====================================================================================
# B28: THE FIRST RETURN-DIRECTION SUBJECT IN THE SUITE. The crewed Duna Rocket starts
# ALREADY PARKED in the 87,931 x 56,240 m Laythe orbit B25 delivered, fires ONE prograde
# escape node out of Laythe's SOI, and CIRCULARIZES INTO A JOOL PARK -- its own parent --
# committing the tree there. THE RECORDING IS THE PRODUCT.
#
# **LIVE-PROVEN 2026-08-20, run `2026-08-20_2330`, PASS attempt 1, mission wall
# 474.597 s, run wall 527 s.** The full ELEVEN-phase chain through ORBIT-COMMITTED, all
# EIGHT assertions met, every verifier green, and THE PRODUCT NOW EXISTS: harvested
# `--keep-parsek` as `fixtures/saves/jool-return-recorded`, the subject V19M/V19T read
# the routing off. READ THE FLIGHT LEDGER BEFORE TRUSTING ANY DERIVED NUMBER BELOW.
# Four pre-registrations held exactly. ONE DID NOT, and it is the interesting reading:
# the delivered-orbit BAND in the delta-v section is an OUTER ENVELOPE, not a prediction
# of this delivery -- the flight circularized for **20.39 m/s** against a band whose
# stated MINIMUM was 178.08 and whose worst case was 844.15. The band is not wrong; it
# was never a delivery predictor, and the section below now says so where it stands.
#
# WHY THIS LANE EXISTS, and it is NOT "a seventh moon". Every committed loop subject in
# the suite is OUTBOUND: Kerbin->Mun, Kerbin->Minmus, Duna->Ike, Eve->Gilly, Jool->Laythe,
# Laythe->Vall, and eight Kerbin->planet transfers. A supply run is a ROUND TRIP, and
# nobody has ever produced a recording that goes the other way.
# **[AS OF 2026-08-20 SOMEBODY HAS: this lane's own flight. Everything ELSE in that
# sentence still stands -- `fixtures/saves/jool-return-recorded` is the only inbound
# subject in the suite.]**
#
# **THE ROUTING IS THE MEASUREMENT AND THE INVERSION IS THE POINT.** A Laythe-rooted
# recording whose target is JOOL is the INVERTED same-parent direction: the target is the
# origin's PARENT, not its child. `IsSameParentTarget(target, launch)` asks exactly one
# question -- is the target a direct CHILD of the launch body -- so the relation is
# DIRECTIONAL by construction, and whether the rest of the routing stack treats the
# inversion symmetrically has never been measured on a real recording. The mirror-direction
# lesson (PRs #1474/#1475) says walk the mirror rather than assume it.
#
# **THIS SPEC ASSERTS NOTHING ABOUT THAT.** B28's job is to fly the return and commit the
# recording. `V19M-laythe-jool-player-loop` and `V19T-laythe-jool-ts-arrival` are the lanes
# that read the routing off it; they carry the pre-registered roads with their
# discriminating log lines and they gate on none of them. Nothing below requires, forbids
# or predicts a routing outcome. (B26's header made the same promise for the moon-to-moon
# question and kept it; this is that promise again, one class over.)
#
# PHASE-0 DOOR: existing fixture, NO FORGE FLIGHT -- `laythe-park-nerv`, the Parsek-stripped
# derived copy B26 already departs. This lane is its SECOND consumer. The fixture is a
# read-only `saveTemplate` and carries no committed tree, so sharing it costs nothing and
# couples nothing: what the strip buys (a `startrecording ... already=false` that mints a
# fresh standalone Laythe-rooted tree instead of appending to a committed one) is a property
# of the BYTES, not of who reads them. See docs/dev/todo-and-known-bugs.md ->
# SEAM-STARTRECORDING-JOINS-COMMITTED-TREE for the failure it prevents.
#
# =====================================================================================
# FLIGHT LEDGER. ONE FLIGHT, GREEN ON ATTEMPT 1, AND THE READING WORTH HAVING IS THE
# PRE-REGISTRATION THAT DID NOT HOLD.
# =====================================================================================
#
# FLIGHT 1, run `2026-08-20_2330`: **PASS attempt 1, MISSION-OK, mission wall
# 474.597 s, run wall 527 s against a 6,000 s budget.**
