schema = 1
id = "B28-laythe-jool-return"
# =====================================================================================
# B28: THE FIRST RETURN-DIRECTION SUBJECT IN THE SUITE. The crewed Duna Rocket starts
# ALREADY PARKED in the 87,931 x 56,240 m Laythe orbit B25 delivered, fires ONE prograde
# escape node out of Laythe's SOI, and CIRCULARIZES INTO A JOOL PARK -- its own parent --
# committing the tree there. THE RECORDING IS THE PRODUCT.
#
# WHY THIS LANE EXISTS, and it is NOT "a seventh moon". Every committed loop subject in
# the suite is OUTBOUND: Kerbin->Mun, Kerbin->Minmus, Duna->Ike, Eve->Gilly, Jool->Laythe,
# Laythe->Vall, and eight Kerbin->planet transfers. A supply run is a ROUND TRIP, and
# nobody has ever produced a recording that goes the other way.
#
# **THE ROUTING IS THE MEASUREMENT AND THE INVERSION IS THE POINT.** A Laythe-rooted
# recording whose target is JOOL is the INVERTED same-parent direction: the target is the
# origin's PARENT, not its child. `IsSameParentTarget(target, launch)` asks exactly one
# question -- is the target a direct CHILD of the launch body -- so the relation is
# DIRECTIONAL by construction, and whether the rest of the routing stack treats the
# inversion symmetrically has never been measured on a real recording. The mirror-direction
# lesson (PRs #1474/#1475) says walk the mirror rather than assume it.
#
# **THIS SPEC ASSERTS NOTHING ABOUT THAT.** B28's job is to fly the return and commit the
# recording. `V19M-laythe-jool-player-loop` and `V19T-laythe-jool-ts-arrival` are the lanes
# that read the routing off it; they carry the pre-registered roads with their
# discriminating log lines and they gate on none of them. Nothing below requires, forbids
# or predicts a routing outcome. (B26's header made the same promise for the moon-to-moon
# question and kept it; this is that promise again, one class over.)
#
# PHASE-0 DOOR: existing fixture, NO FORGE FLIGHT -- `laythe-park-nerv`, the Parsek-stripped
# derived copy B26 already departs. This lane is its SECOND consumer. The fixture is a
# read-only `saveTemplate` and carries no committed tree, so sharing it costs nothing and
# couples nothing: what the strip buys (a `startrecording ... already=false` that mints a
# fresh standalone Laythe-rooted tree instead of appending to a committed one) is a property
# of the BYTES, not of who reads them. See docs/dev/todo-and-known-bugs.md ->
# SEAM-STARTRECORDING-JOINS-COMMITTED-TREE for the failure it prevents.
#
# =====================================================================================
# THE MACHINE CHANGE, AND IT IS ONE INERT-BY-DEFAULT FLAG
# =====================================================================================
# `relayParkAtParent`, a sub-shape of B26's `parentRelayTransfer` mode. NO new phase, NO
# new phase graph, NO new burn machinery, NO new runner seam. What the flag buys is that
# the "there is no stage 2" claim becomes STRUCTURAL instead of incidental:
#
#   * WITHOUT the flag the claim rests on BRANCH ORDERING. In `B5_COAST_TO_TARGET` the
#     target-body branch (`snapshot.body == params.target_body` -> `B5_TARGET_FLYBY`) runs
#     BEFORE the parent-relay stage-2 hand-off, so pointing `targetBodyName` at the parent
#     happens to take the flyby branch first. That is a property of two adjacent branches
#     that a future edit can silently reorder -- exactly the kind of load-bearing accident
#     this suite has been bitten by before.
#   * WITH the flag the stage-2 hand-off carries `and not params.relay_park_at_parent`, so
#     `relay_stage` provably never leaves `RELAY_STAGE_ESCAPE` on this lane, and the
#     `transferMinApoapsisMeters` requirement inverts from "must be positive" to "must be
#     exactly 0" -- a spec cannot carry a stage-2 burn-done floor that can never be read.
#   * And the `escapedHomeSoi` assertion row gains a SECOND, POSITIVE disjunct. Its only
#     evidence today is `relay_stage >= RELAY_STAGE_TRANSFER`, which is written at exactly
#     one site inside the stage-2 hand-off; on a lane with no stage 2 the row would read
#     met=False forever and `resolve_flight_verdict` would turn a clean flight into
#     MISSION-ASSERT-FAIL. The new disjunct is ESCAPE ran AND TARGET-FLYBY was reached --
#     and reaching TARGET-FLYBY means `snapshot.body == target_body` was OBSERVED, which
#     on this lane IS the parent, so the home SOI was demonstrably left. Positive evidence,
#     not an exemption.
#
# The flag-off contract is PAD-ALIGN's, ORBIT-START's and PARENT-RELAY's verbatim: with
# `relayParkAtParent` absent every decision, every action and every assertion row is
# byte-identical, pinned by `RelayParkAtParentInertnessTests`.
#
# **WHY `returnBodyName` IS "Sun" AND NOT "Jool", AND IT IS NOT A STYLE CALL -- SPELLING
# IT "Jool" WOULD KILL THE MISSION ON THE ARRIVAL FRAME.** The obvious reading is that a
# lane whose target IS the parent should name the parent in both keys. It is wrong, and
# the reason is a branch. TARGET-FLYBY's FIRST test is
#     `if state.params.capture_enabled and snapshot.body == return_body:`
#         -> ASSERT-FAIL "left the target SOI without capturing"
# and the capture-ARMING test on `target_body` is the NEXT branch down. With
# `returnBodyName = "Jool"` those two strings are equal, so the machine ASSERT-FAILs on
# the very frame the craft ARRIVES in Jool's SOI -- deterministically, every attempt,
# before the capture can arm. This was found at the handler, not reasoned about: two
# independent derivations of this param block disagreed on the key, and the branch is what
# settled it.
# With "Sun" all three readers get the right answer:
#   (1) TARGET-FLYBY's accepted body set is {Jool, Sun} and leaving Jool really does read
#       "Sun", so the not-captured ASSERT-FAIL fires on the thing it names.
#   (2) It is B22-jool-orbit's LIVE-PROVEN pairing for a Jool target with the same capture
#       tail (`targetBodyName = "Jool"`, `returnBodyName = "Sun"`, `viaBodyNames = ["Sun"]`).
#   (3) It satisfies the precondition
#       `test_the_return_body_is_a_member_of_the_via_bodies_on_every_lane` pins -- the
#       subset claim `_b5_correction_via_bodies` rests on -- with `viaBodyNames = ["Sun"]`.
# The correction machinery is off on this lane anyway (see the correction keys), so (3) is
# an invariant kept rather than a behaviour used. NOTE ALSO what `relayParkAtParent`
# deliberately does NOT assert: `targetBodyName == returnBodyName`. That equality is
# exactly the spelling that kills the lane.
#
# =====================================================================================
# THE DELTA-V, DERIVED END TO END. Every input is read off the fixture's own bytes or off
# stock constants; nothing is ratio-scaled from another lane.
# =====================================================================================
# WHAT THE CRAFT HAS. `laythe-park-nerv` carries B25 flight 2's delivered state verbatim:
# LiquidFuel 534.8686 / 2400 on the six LF-only MK1Fuselage tanks, NERV (Isp 800 s vac,
# 60 kN, 3.0 t), Valentina Kerman in the mk1pod.v2.
#   => **~2,483.9 m/s of dv remaining** (B26's derivation off the same bytes; that lane
#      then SPENT 1,368.1 m/s of it and finished with 1,116.6 to spare, which is the
#      independent check that the figure is right rather than optimistic).
#
# WHAT THE ESCAPE COSTS, and it is a number this fixture has already FLOWN. mlib's
# `escape_node_plan` sizes the node at the park's next periapsis:
#   mu_Laythe = 1.962e12, r_soi = 3,723,645.81113302, r_p = 500,000 + 56,240.3 = 556,240.3,
#   a_park = 572,085.80370560708
#   v_now    = sqrt(mu*(2/r_p - 1/a))                              = **1,903.930 m/s**
#   v_needed = sqrt(450^2 + 2*mu*(1/r_p - 1/r_soi))                = **2,490.622 m/s**
#   dv       = v_needed - v_now                                    = **586.692 m/s**
# B26 flight 3 logged `escapeNodeDvMps 586.6922211372255` on this exact fixture at this
# exact `escapeSoiSpeedMps`. The escape leg of this lane is therefore not a new burn -- it
# is a burn that has already been planned, executed to within 1%, and measured.
#
# **WHY 450 AND NOT LESS, WHICH IS THE QUESTION A READER SHOULD ASK.** A smaller escape
# speed tames the delivered Jool orbit (see the band table). It is REFUSED, and the refusal
# is geometric rather than a preference. `escape_node_plan`'s reachability floor is
#   v_floor = sqrt(2*mu*r_soi / (r_p*(r_soi + r_p))) = **2,477.430 m/s** at r_p,
# and its own docstring states the equivalent in the units this key is written in: the
# smallest SOI-crossing relative speed is `v_floor * r_p / r_soi` = **370.08 m/s at this
# exact park**. (Re-derived independently from the other side -- requiring `v_needed` to
# clear `v_floor` gives `escapeSoiSpeedMps >= sqrt(2477.430^2 - 2*mu*(1/r_p - 1/r_soi))` =
# 370.1 m/s -- so the two forms agree, which is the check worth having.)
#
# **AND THE FIXTURE'S OWN FLOOR IS NOT THE BINDING ONE.** `startInOrbit` admits ANY park
# inside its gate, so the value has to clear the WORST CORNER of that gate, not the park
# that happens to be committed today. Swept over `pe >= 52,000` / `0 < ap <= 300,000` the
# worst corner is a CIRCULAR park sitting on the apoapsis ceiling and it needs
# **431.70 m/s** -- so 450 clears the whole admissible window by 18.30 m/s, and the two
# keys are LOCKED TO EACH OTHER: raising the ceiling to 500,000 would push the corner to
# 472.33 and `escape_node_plan` would REFUSE a park this spec's own gate called legal.
# 450 sits 21.6% above the committed park's floor and 4.2% above the gate's. Anything that
# would meaningfully narrow the delivered band (200-300 m/s) is REFUSED by name at the node
# computation, and the refusal costs a whole ESCAPE budget. Lowering to 400 was priced and
# rejected: it buys ~80 m/s out of a 1,053 m/s margin and COSTS THE GATE, forcing the
# apoapsis ceiling down to 106,542 m -- 1.21x the fixture's own measured 87,931.3 m, which
# is a fingerprint rather than a sanity bound (B25's stated rule). The band is a property
# of an unaimed escape, not a knob.
#
# WHAT THE JOOL ORBIT COMES OUT AS. The escape is NOT AIMED -- a prograde burn at whatever
# periapsis comes next sends the outgoing asymptote wherever the park's orientation points
# it, which is the parent-relay mode's stated v1 limitation. So the delivered orbit is a
# BAND, swept here over every departure direction (0-180 deg) and every SOI-exit radius
# (a_Laythe -/+ SOI), the same sweep `test_b26_laythe_vall.py` pins for the escape contract:
#
#   escapeSoiSpeedMps   a (Mm)            periapsis (Mm)   apoapsis (Mm)    worst circ dv
#   450 (FLOWN)         17.24 - 59.05     11.01 - 30.91    23.46 - 87.18    **844.1 m/s**
#   300 (REFUSED)       18.18 - 48.18     12.91 - 30.91    23.46 - 65.44        635.5
#   250 (REFUSED)       18.54 - 45.46     13.61 - 30.91    23.46 - 60.02        569.5
#   200 (REFUSED)       18.91 - 43.07     14.36 - 30.91    23.46 - 55.24        505.2
#
# ZERO of the swept samples ESCAPE JOOL at 450 (the same assertion B26's committed sweep
# makes), and the worst periapsis 11.01 Mm clears Jool's 6.2 Mm atmosphere top by 4.81 Mm.
# Radii above are from JOOL'S CENTRE; Jool's own radius is 6,000,000 m, so the ALTITUDE
# band the park keys compare against is periapsis 5.01 - 24.91 Mm.
#
# WHAT THE WHOLE LANE COSTS, and the median is worth writing beside the worst case
# because an unaimed escape delivers a DISTRIBUTION rather than a number:
#   WORST   escape 586.7 + circularize 844.15 = **1,430.84 m/s**, leaving **1,053.06 m/s**
#           of the 2,483.9 available => **73.6% margin against the worst hop** (the B25
#           convention), i.e. 42.4% of the tank still unspent.
#   MEDIAN  941.66 m/s (circularize 354.97), leaving 1,542.2.
#   BEST    764.77 m/s (circularize 178.08).
# Cheaper and shorter than B26's flown 1,368.1 m/s hop on the same craft, because there is
# no stage-2 transfer burn, no correction rounds and no Vall approach.
#
# **THE BINDING LEG IS SOI-ENTRY -> FIRST PERIAPSIS, AND IT IS A FULL PERIOD RATHER THAN
# HALF OF ONE.** The tempting bound is half a period; it is wrong, and the reason is the
# shape of the departure. Solving the true anomaly AT the exit radius with the SIGN of the
# radial velocity gives 55.7 s (p0) / 1,414.9 (p5) / 18,064 (p50) / 117,939 (p95) /
# **169,600 (p100)**, and the worst case is a whole period of the largest delivered orbit
# because a near-tangential PROGRADE departure leaves Laythe's SOI AT its own Jool-frame
# periapsis -- it has just missed the apsis it is waiting for and must go all the way
# round. `P at a = 59.05 Mm = 2*pi*sqrt(a^3/mu_Jool) = 169,600 s`.
# Every flyby / capture budget below is sized against THAT, not against half of it, and not
# against B26's Vall values (Vall's whole SOI traverse is smaller than this lane's error
# bar). `captureBurnTimeoutSeconds` additionally clears the 339,200 s bound in which the
# first periapsis is missed inside the 900 s capture lead and `MAX_CAPTURE_REPLANS = 1`
# re-plans one full period later.
#
# =====================================================================================
# THE MOON-SHELL AUDIT, because the apoapsis band is what decides the forbidden list
# =====================================================================================
# Jool's moon shells, from Jool's centre: Laythe 27.184 Mm, Vall 43.152, Tylo 68.500,
# Bop 128.500, Pol 179.890. The delivered apoapsis band reaches **87.18 Mm**, and the
# craft traverses to apoapsis whenever the SOI exit puts it on the outbound leg. So:
#
#   Laythe  27.184  -- the departure body; a RE-ENTRY is an ASSERT-FAIL by construction
#                      (`viaBodyNames = ["Sun"]` makes Laythe an illegal coast body, and
#                      TARGET-FLYBY's off-course guard names anything that is neither the
#                      target nor the return body). The window is bounded: the craft leaves
#                      Laythe's SOI drifting away at ~450 m/s and circularizes at the FIRST
#                      periapsis, which puts the final park INSIDE Laythe's orbit and
#                      decoupled from it.
#   Vall    43.152  -- **CROSSED**, by **25.4%** of the swept cases (their periapsis-to-
#                      apoapsis annulus contains Vall's shell). Its poison tokens are LIVE.
#   Tylo    68.500  -- **CROSSED**, by **8.8%** of the swept cases. LIVE.
#   Bop    128.500  -- NOT crossed by any case; 47.4% beyond the band's apoapsis.
#   Pol    179.890  -- NOT crossed by any case; 106.3% beyond it.
#
# CROSSING A SHELL IS NOT TOUCHING AN SOI -- B25 crossed all four and touched none -- so
# the percentages above are the size of the OPPORTUNITY, not of the risk.
#
# All eight tokens are forbidden below, but they are NOT equal and the comment says which
# is which: Vall's and Tylo's are live gates on a shell the band actually reaches, while
# Bop's and Pol's are OUTER INSURANCE against a band derivation that is wrong. Labelling
# them is the point -- V17M's lesson is that an un-fireable forbid presented as assurance
# is a false one, and the honest form is to fire the four that can fire and to say out loud
# that the other four are a cheap bet on my own arithmetic being wrong.
#
# =====================================================================================
# WHAT THE RECORDING SHOULD LOOK LIKE, stated so a surprise is legible
# =====================================================================================
# ONE committed tree, ONE recording, ONE body-change seam (Laythe -> Jool), terminal
# Orbiting at JOOL, crewed. Two things are genuinely uncertain and the windows below admit
# both:
#   * THE COUNT. B26's recording carried TWO body-change seams and the optimizer kept BOTH
#     cohesive (`exoCoastBodyChangeKept`), so one seam should also stay cohesive -- but
#     that boundary is an ESCAPE boundary reached under a coast after a burn, and the
#     load-time optimizer walk fires for the first time on the CONSUMING lane's LoadGame,
#     not here. `count = { min = 1, max = 2 }`.
#   * THE DESTINATION-PHASE LENGTH. The Jool leg runs from the SOI crossing to the capture
#     and then a 180 s park dwell; the SOI-entry -> periapsis coast alone is 0 - 84,800 game
#     seconds depending on where the unaimed escape put the craft. V19M/V19T size their
#     census dwells off the harvested bytes, not off this range.
#
# =====================================================================================
# POSTURE: FIRST FLIGHT, NOTHING ARMED
# =====================================================================================
# `[expectations.rewind]` is REPORT-ONLY and there is no
# `[expectations.recordings.structure]` block, which is B24's and B25's disposition
# verbatim and for their reason: this lane's PRODUCT is a fixture, and a fixture's
# structure is pinned where it is CONSUMED (`test_saveparse.py`'s committed-fixture sweep,
# plus V19M/V19T's own windows). A report-only block of PREDICTED numbers reads like a
# measurement.
#
# `tier = "operator"` on the calibration discipline (the whole B18-B26 family's tier).
# =====================================================================================
tier = "operator"
description = "**THE FIRST RETURN-DIRECTION SUBJECT IN THE SUITE, and the routing inversion is the point.** The crewed Duna Rocket starts already parked in the 87,931 x 56,240 m Laythe orbit B25 delivered, fires ONE prograde escape node out of Laythe's SOI and circularizes into a JOOL park - its own PARENT - committing the tree there. Every committed loop subject to date is OUTBOUND; a supply run is a round trip and nobody has produced a recording that goes the other way. `IsSameParentTarget(target, launch)` asks exactly one question - is the target a direct CHILD of the launch body - so the relation is DIRECTIONAL by construction, and whether the rest of the routing stack treats the inversion symmetrically has never been measured on a real recording (the mirror-direction lesson, PRs #1474/#1475). THIS SPEC ASSERTS NOTHING ABOUT THAT: V19M/V19T carry the pre-registered roads with their discriminating lines and gate on none of them. PHASE-0 DOOR: existing fixture, no forge flight - `laythe-park-nerv`, the Parsek-stripped copy B26 already departs, here taking its second consumer (a read-only saveTemplate with no committed tree couples nothing). THE MACHINE CHANGE IS ONE INERT-BY-DEFAULT FLAG, `relayParkAtParent`, a sub-shape of B26's parent-relay mode with NO new phase, NO new phase graph, NO new burn machinery and NO new runner seam: it makes the no-stage-2 claim STRUCTURAL (the stage-2 hand-off carries `and not relay_park_at_parent`, so relay_stage provably never leaves RELAY_STAGE_ESCAPE) rather than a property of two adjacent branches' ordering; it INVERTS the `transferMinApoapsisMeters` requirement from must-be-positive to must-be-zero, so a spec cannot carry a stage-2 burn-done floor that can never be read; and it gives the `escapedHomeSoi` row a second POSITIVE disjunct (ESCAPE ran AND TARGET-FLYBY was reached, i.e. `snapshot.body == target_body` was observed and on this lane the target IS the parent) instead of the stage-2-only `relay_stage >= RELAY_STAGE_TRANSFER`, which would otherwise read met=False forever and turn a clean flight into MISSION-ASSERT-FAIL. Flag-off is byte-identical, pinned by `RelayParkAtParentInertnessTests`. `returnBodyName` IS \"Sun\" AND NOT \"Jool\", AND THAT IS NOT A STYLE CALL: TARGET-FLYBY's FIRST test is `capture_enabled and snapshot.body == return_body` -> ASSERT-FAIL 'left the target SOI without capturing', with the capture-ARMING test on `target_body` the next branch DOWN, so naming the parent in both keys makes those two strings equal and the machine ASSERT-FAILs on the very frame the craft ARRIVES in Jool's SOI - deterministically, every attempt, before the capture can arm. Two independent derivations of this param block disagreed on the key and the branch is what settled it. \"Sun\" additionally keeps that ASSERT-FAIL semantically correct (leaving Jool really does read Sun), is B22-jool-orbit's live-proven pairing for a Jool target with the same capture tail, and satisfies the pinned return-body-in-via-bodies precondition. THE DELTA-V IS DERIVED, NOT SCALED: 2,483.9 m/s available on the NERV (Isp 800, LF 534.8686/2400); the escape node is 586.692 m/s by mlib's own formula and B26 flight 3 LOGGED `escapeNodeDvMps 586.6922211372255` on this exact fixture at this exact escapeSoiSpeedMps, so the escape leg is a burn that has already been planned, flown and measured. 450 is not a preference: `escape_node_plan`'s geometric reachability floor v_floor = sqrt(2*mu*soi/(r_p*(soi+r_p))) = 2,477.430 m/s at r_p makes anything below ~370.1 m/s a NAMED REFUSAL, so the 200-300 m/s values that would tame the delivered band are unreachable and the band is a property of an unaimed escape rather than a knob. Swept over every departure direction and every SOI-exit radius at 450: a 17.24-59.05 Mm, periapsis 11.01-30.91 Mm, apoapsis 23.46-87.18 Mm, worst circularize-at-periapsis 844.1 m/s, ZERO samples escaping Jool and the worst periapsis clearing Jool's 6.2 Mm atmosphere top by 4.81 Mm. Worst-case total 1,430.84 m/s leaving 1,053.06 m/s unspent = a 73.6% margin against the worst hop (median hop 941.66, best 764.77), cheaper and shorter than B26's flown 1,368.1 m/s hop because there is no stage-2 burn, no correction rounds and no approach. THE BINDING LEG IS SOI-ENTRY -> FIRST PERIAPSIS AND IT IS A FULL PERIOD RATHER THAN HALF OF ONE - solving the true anomaly at the exit radius with the SIGN of the radial velocity gives 55.7 s (p0) / 1,414.9 (p5) / 18,064 (p50) / 117,939 (p95) / 169,600 (p100), the worst being a whole period of the largest delivered orbit because a near-tangential PROGRADE departure leaves Laythe's SOI AT its own Jool-frame periapsis and must go all the way round. Every flyby/capture budget is sized against THAT (and `captureBurnTimeoutSeconds` additionally clears the 339,200 s missed-first-periapsis-plus-one-replan bound), not against half of it and not against B26's Vall values. THE MOON-SHELL AUDIT DECIDES THE FORBIDDEN LIST: the apoapsis band reaches 87.18 Mm, so Vall (43.152) and Tylo (68.500) ARE crossed and their poison tokens are LIVE gates, while Bop (128.500, +47.4%) and Pol (179.890, +106.3%) are not crossed and are labelled OUTER INSURANCE against my own arithmetic - all eight are forbidden but the comment says which four can fire, because an un-fireable forbid presented as assurance is a false one. A Laythe RE-ENTRY is an ASSERT-FAIL by construction (`viaBodyNames = [\"Sun\"]` makes it an illegal coast body) and the window is bounded: the craft drifts away at ~450 m/s and circularizes at the FIRST periapsis, which puts the final park INSIDE Laythe's orbit and decoupled from it. NOTHING ARMED: count window {1,2}, `[expectations.rewind]` report-only and no save-structure block, because this lane's product is a FIXTURE whose structure is pinned where it is CONSUMED (the B24/B25 disposition verbatim)."
instanceProfile = "stock-minimal"
tags = ["B28", "laythe", "jool", "jool-moon", "return-leg", "inverted-direction",
        "parent-relay", "relay-park-at-parent", "orbit", "mechjeb", "cross-soi",
        "capture", "commit-in-foreign-soi", "orbit-start", "crewed"]

[fixture]
# `laythe-park-nerv`: the Parsek-stripped derived copy of B25's `laythe-orbit-recorded`,
# the FOURTH of its kind after `duna-park-probe` (B23), `eve-park-kerbalx` (B24) and
# `jool-park-nerv` (B25). B26 is its first consumer and this lane is its second.
#
# WHAT IT CARRIES, measured off the bytes: ONE subject vessel `Duna Rocket`
# (pid 5384d5f4fe8244d782aaa5cb79345562, type Ship, sit ORBITING, activeVessel), crewed
# with Valentina Kerman, on SMA 572,085.80370560708 / ECC 0.027697758715375592 /
# INC 16.372447690149517 about Laythe (REF 9) = 87,931.3 x 56,240.3 m altitude, at
# UT 28,817,025.337051559; LiquidFuel 534.8686 / 2400. Three inert ride-alongs (the stock
# asteroid and two Kerbin-orbiting `Duna Rocket Debris`) are carried unchanged from B18-B22.
# The `ParsekScenario` node is present but CHILDLESS -- which is the whole point of the
# strip, and what makes `startrecording ... already=false` mint a fresh standalone
# Laythe-rooted tree instead of appending to a committed one.
#
# It needs NO shared-ships row: this lane launches nothing and enters at the ORBIT waypoint
# through `startInOrbit`.
saveTemplate       = "fixtures/saves/laythe-park-nerv"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "b28_laythe_jool"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },   expect = "OK", budget = 300 },
  # Kill the scene-entry auto-recorder before starting our own: the promotion recorder
  # re-arms on some entry orderings (B23 flight 1 measured a re-arm 11 ms after
  # DiscardTree on this fixture's shape), and the SetSetting stops a later one.
  { cmd = "StopRecording",                                                     expect = "OK" },
  { cmd = "DiscardTree",                                                       expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "StartRecording",                                                    expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 5400 },
  { cmd = "FlushAndQuit",                                                      expect = "OK" },
]

[driver.missionParams]
# --- ORBIT-START: the entry door and its gate --------------------------------
# The four ASCENT keys and the two ascent budgets are DELIBERATELY ABSENT (B25's
# disposition, schema-demoted to optional): PRELAUNCH hands straight to the ORBIT
# waypoint and no ascent is ever flown.
startInOrbit                    = true
# THE GATE, stated against the fixture's MEASURED Laythe park (periapsis alt
# 56,240.3 m, apoapsis alt 87,931.3 m, ecc 0.0277). All three bounds are B26's
# and all three are RE-CONFIRMED rather than inherited, because this lane fires
# the same escape node from the same fixture.
#   periapsis floor 52,000 m - 2,000 m (1.04x) above Laythe's 50,000 m
#     atmosphere top, and 4,240.3 m BELOW the measured periapsis. A start park
#     that had decayed toward the air is refused before an escape is sized
#     against a drag-perturbed orbit.
#   apoapsis ceiling 300,000 m - AND IT IS THE KEY THAT `escapeSoiSpeedMps`
#     IS LOCKED TO. The escape's SOI-crossing speed has a geometric FLOOR that
#     rises with the park: swept over this window the worst corner (a CIRCULAR
