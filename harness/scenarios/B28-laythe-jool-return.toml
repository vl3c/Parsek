# ---------------------------------------------------------------------------------
# WHAT DID NOT HOLD: THE DELIVERED-ORBIT BAND IS AN OUTER ENVELOPE, NOT A PREDICTION
# ---------------------------------------------------------------------------------
#
# THE PRE-REGISTRATION, kept verbatim below in the delta-v section: at
# `escapeSoiSpeedMps = 450` the delivered Jool orbit was swept to a = 17.24 - 59.05 Mm,
# periapsis 11.01 - 30.91 Mm, apoapsis 23.46 - 87.18 Mm, with a WORST circularization of
# 844.15 m/s, a MEDIAN of 354.97 and a stated BEST of **178.08**.
#
# THE MEASUREMENT. Split by propellant across the two burns, using the mission log's own
# `lf=` channel at the phase boundaries (LF density 0.005 t/unit, NERV Isp 800 s vac):
#   ESCAPE   LF 534.869 -> 394.558 = 140.311 units = 0.70156 t; 9.8540 -> 9.1524 t
#            => `800*9.80665*ln(9.8540/9.1524)` = **579.43 m/s**, i.e. the executor cut
#            **1.24%** off its 586.6922 node (B26 flight 3's executor cut 1.8% off its
#            stage-2 node; this is the ordinary cut, not a finding).
#   CAPTURE  LF 394.558 -> 389.806 =   4.752 units = 0.02376 t; 9.1524 -> 9.1287 t
#            => **20.39 m/s**.
#   TOTAL    **599.82 m/s**, leaving **1,884.2 m/s** of the 2,483.9 available.
# INDEPENDENT CHECK ON THE 20.39, because a four-significant-figure propellant delta is
# the kind of number that deserves one: the delivered arrival orbit was
# a 26,056,049.851 m / ecc 0.01256524, whose ideal impulsive circularization at its own
# periapsis (r_p 25.728650 Mm, v_p 3,334.523, v_circ 3,313.769) is **20.754 m/s**. The
# burn came in at 98.2% of the geometric ideal. The two derivations do not share an input.
#
# **SO THE FLIGHT CIRCULARIZED FOR 20.39 m/s AGAINST A BAND WHOSE FLOOR WAS 178.08 -- A
# FACTOR OF 8.7 BELOW THE CHEAPEST CASE THE SWEEP ADMITS.** That is not a small miss at
# the edge of a range; it is outside the range, and the honest thing is to say why rather
# than to quietly widen the band.
#
# WHY, READ OFF THE COMMITTED SWEEP'S OWN PARAMETRIZATION. The band comes from
# `harness/missions/lib/test_b26_laythe_vall.py` -- `Flight2DefectATests._band`
# (:2441-2455) and `test_the_flown_contract_admitted_two_lane_ending_outcomes`
# (:2456-2482), with a third copy at :277-291. All three do the same thing:
#     v_moon = math.sqrt(MU_JOOL / A_LAYTHE)                        # computed ONCE
#     for deg in range(0, 181):
#         for r in (A_LAYTHE - SOI_LAYTHE, A_LAYTHE, A_LAYTHE + SOI_LAYTHE):
#             vt = v_moon + v_rel * cos(th);  vr = v_rel * sin(th)
# `v_moon` is HOISTED OUT of the radius loop. At the two off-A radii it therefore pairs a
# position with a speed that does not belong to it: the local circular speed at
# A - SOI is 3,470.27 m/s and at A + SOI is 3,023.42 m/s, against v_moon = 3,223.84 --
# **246.43 m/s too slow at the inner corner and 200.43 m/s too fast at the outer one**.
# MEASURE WHAT THAT ALONE COSTS: set `v_rel = 0` (a craft leaving with NO relative speed
# at all) and the on-A case reads e = 0 to eight decimals (a 0.8 m apsis spread, pure
# float noise), while BOTH off-A cases read **e = 0.13698** -- semi-major axes of 20.63 Mm
# at the inner radius and 35.81 Mm at the outer, manufactured out of the pairing before
# any departure direction is applied. The 181 directions are then swept INDEPENDENTLY of
# the exit radius, so the product admits combinations (maximum radial offset one way,
# v_rel the other) that no single departure produces.
#
# THE CONSEQUENCE, MEASURED RATHER THAN ASSERTED. Re-running the sweep at 450 reproduces
# the delta-v section's table to the digits it prints (543 bound samples: a 17.2364 -
# 59.0452 Mm, pe 11.0124 - 30.9076, ap 23.4604 - 87.1827, circ dv 178.08 / 355.01 median
# / 844.15 -- the header's 354.97 median is a 0.04 m/s grid difference and nothing else),
# and its **MINIMUM ECCENTRICITY OVER ALL 543 SAMPLES IS 0.102496**. The flight delivered
# **0.01256524**, EIGHT TIMES more circular than anything the sweep contains. The
# delivery is not merely under the band's circularization floor; it is outside the band's
# eccentricity range entirely, which is the sharpest available statement that these are
# not the same quantity.
#
# **THE SWEEP'S CORRECT STANDING IS A SAFETY ENVELOPE, AND IT IS SOUND AS ONE.** Read
# what `test_the_flown_contract_admitted_two_lane_ending_outcomes` actually asserts: at
# 450 ZERO of the 543 samples reach energy >= 0 (nothing leaves Jool) and the worst
# periapsis is 11.0124 Mm, clearing Jool's 6.2 Mm atmosphere top by 4.81 Mm. Those two
# claims are exactly what B26 built the sweep for, and the hoisted `v_moon` makes them
# CONSERVATIVE rather than wrong: too slow at the inner radius drives periapsis DOWN, too
# fast at the outer radius drives energy UP, so the envelope over-states the spread in
# both of the directions the two safety claims care about. What it cannot do -- and never
# claimed to do -- is predict where inside the envelope a given departure lands.
#
# WHAT ACTUALLY DETERMINED THE OUTCOME, and it is a determinism reading rather than a
# lucky draw. B28's delivered Jool orbit at SOI entry was **a 26,056,049.851 m ecc
# 0.01256524**. B26 FLIGHT 3 measured **a = 26,056,055 m ecc 0.013** off the SAME fixture
# at the SAME `escapeSoiSpeedMps`, on a mission that then went on to Vall rather than
# circularizing. **AGREEMENT TO ABOUT 5 m IN SMA, out of 26.06 Mm.** Two flights, two
# different missions, one repeated arrival orbit: what sets the delivery here is the
# fixture's FIXED PARK ORIENTATION (SMA 572,085.804 / ECC 0.0277 / INC 16.372 about
# Laythe), which fixes where the next periapsis is and therefore which way the unaimed
# prograde escape points. The band enumerates the orientations this lane does NOT have.
# A CONSEQUENCE WORTH STATING FOR ANYONE RE-POINTING THIS LANE: change the entry fixture
# and the delivery moves anywhere in the envelope; keep it and the delivery is repeatable
# to metres. The band is the right tool for the first case and the wrong one for the
# second.
#
