#     Orbiting at JOOL, crewed. saveParse: `trees 1 committedTrees 1 recordings 1
#     terminalStates {Orbiting: 1} branchPoints {} duplicateRecordingIds []`, points
#     201/201/201 with 0 unparsed. **THE COUNT WINDOW CAME BACK AT 1, THE BOTTOM OF ITS
#     {1,2} RANGE** -- the ESCAPE boundary stayed cohesive, which is the second data
#     point anyone has on that boundary after B26 flight 3's (which also read the bottom
#     of its own {1,4}). And a byte-level corroboration that costs nothing: the harvested
#     `.prec`'s string table carries **exactly one `Laythe` and exactly one `Jool`, and
#     ZERO occurrences of `Vall`, `Tylo`, `Bop` or `Pol`** -- the two-body shape and the
#     poison absence proven in the PRODUCT, not only in the log.
#
# (4) THE `escapedHomeSoi` ROW, PROVEN BY THE NEW DISJUNCT. `provenBy=
#     parkAtParentTargetSoiReached` with `relayStage 0` and `relayParkAtParent true`:
#     the row was carried by ESCAPE-ran-AND-TARGET-FLYBY-reached, and `relay_stage`
#     provably never left RELAY_STAGE_ESCAPE, so the stage-2-only
#     `relay_stage >= RELAY_STAGE_TRANSFER` evidence would indeed have read met=False
#     forever and turned this clean flight into MISSION-ASSERT-FAIL. **THIS IS THE FIRST
#     LIVE EXERCISE OF THAT CODE PATH**; before this run it existed only in
