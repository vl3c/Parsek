forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "SOI change boundary suppressed in tree mode: \\w+ to Vall",
  "SOI change boundary suppressed in tree mode: Vall to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Tylo",
  "SOI change boundary suppressed in tree mode: Tylo to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Bop",
  "SOI change boundary suppressed in tree mode: Bop to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Pol",
  "SOI change boundary suppressed in tree mode: Pol to \\w+",
]

[expectations.rewind]
# REPORT-ONLY on a first flight, and NOT armed even though every window is expected to be
# met: this lane's product is a FIXTURE, and a fixture's structure is pinned where it is
# CONSUMED (the B24/B25 disposition verbatim). A single-launch flight that authors no
# rewind point, no supersede row and no tombstone is the claim; the reading records it.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[runtime]
# 300 LoadGame + the fast non-deferred verbs + a 5,400 s mission phase + KSP boot + collect.
# The mission is B26's minus the stage-2 plan, the transfer burn, both correction rounds and
# the Vall approach; B26 measured 1,456 s wall end to end and 1,408 s of mission.
budgetSeconds = 6000

[retry]
# One retry absorbs a transient seam or autopilot flake. It does NOT absorb a mis-sized
# window -- that reproduces exactly on attempt 2, which is the point.
policy = "once"

[expectedFail]
bugId = ""
