# 5,909.3 m/s, 844.15 m/s over 122.0 s on a 9.144 t stack at 60 kN) gives 4,003 m
# raw = 6,007 m calibrated. The collapse is the swept true-anomaly arc: 45.88 deg
# at B25 against 3.75 deg here, 12.2x less, so the drop falls from 2.695% of the
# periapsis radius to 0.0545%. The wedge used is the WORST-CORNER one rather than
# the sweep's minimum (82 m, at the 178 m/s cheapest circularization) because
# that cheap corner delivers a 16.4 Mm periapsis, 16x above the floor, and can
