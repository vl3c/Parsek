# =====================================================================================
# THE MACHINE CHANGE, AND IT IS ONE INERT-BY-DEFAULT FLAG
# =====================================================================================
# `relayParkAtParent`, a sub-shape of B26's `parentRelayTransfer` mode. NO new phase, NO
# new phase graph, NO new burn machinery, NO new runner seam. What the flag buys is that
# the "there is no stage 2" claim becomes STRUCTURAL instead of incidental:
#
#   * WITHOUT the flag the claim rests on BRANCH ORDERING. In `B5_COAST_TO_TARGET` the
#     target-body branch (`snapshot.body == params.target_body` -> `B5_TARGET_FLYBY`) runs
#     BEFORE the parent-relay stage-2 hand-off, so pointing `targetBodyName` at the parent
#     happens to take the flyby branch first. That is a property of two adjacent branches
#     that a future edit can silently reorder -- exactly the kind of load-bearing accident
#     this suite has been bitten by before.
#   * WITH the flag the stage-2 hand-off carries `and not params.relay_park_at_parent`, so
#     `relay_stage` provably never leaves `RELAY_STAGE_ESCAPE` on this lane, and the
#     `transferMinApoapsisMeters` requirement inverts from "must be positive" to "must be
#     exactly 0" -- a spec cannot carry a stage-2 burn-done floor that can never be read.
#   * And the `escapedHomeSoi` assertion row gains a SECOND, POSITIVE disjunct. Its only
#     evidence today is `relay_stage >= RELAY_STAGE_TRANSFER`, which is written at exactly
#     one site inside the stage-2 hand-off; on a lane with no stage 2 the row would read
#     met=False forever and `resolve_flight_verdict` would turn a clean flight into
#     MISSION-ASSERT-FAIL. The new disjunct is ESCAPE ran AND TARGET-FLYBY was reached --
#     and reaching TARGET-FLYBY means `snapshot.body == target_body` was OBSERVED, which
#     on this lane IS the parent, so the home SOI was demonstrably left. Positive evidence,
#     not an exemption.
#
# The flag-off contract is PAD-ALIGN's, ORBIT-START's and PARENT-RELAY's verbatim: with
# `relayParkAtParent` absent every decision, every action and every assertion row is
# byte-identical, pinned by `RelayParkAtParentInertnessTests`.
#
# **WHY `returnBodyName` IS "Sun" AND NOT "Jool", AND IT IS NOT A STYLE CALL -- SPELLING
# IT "Jool" WOULD KILL THE MISSION ON THE ARRIVAL FRAME.** The obvious reading is that a
# lane whose target IS the parent should name the parent in both keys. It is wrong, and
# the reason is a branch. TARGET-FLYBY's FIRST test is
#     `if state.params.capture_enabled and snapshot.body == return_body:`
#         -> ASSERT-FAIL "left the target SOI without capturing"
# and the capture-ARMING test on `target_body` is the NEXT branch down. With
# `returnBodyName = "Jool"` those two strings are equal, so the machine ASSERT-FAILs on
# the very frame the craft ARRIVES in Jool's SOI -- deterministically, every attempt,
# before the capture can arm. This was found at the handler, not reasoned about: two
# independent derivations of this param block disagreed on the key, and the branch is what
# settled it.
# With "Sun" all three readers get the right answer:
#   (1) TARGET-FLYBY's accepted body set is {Jool, Sun} and leaving Jool really does read
#       "Sun", so the not-captured ASSERT-FAIL fires on the thing it names.
#   (2) It is B22-jool-orbit's LIVE-PROVEN pairing for a Jool target with the same capture
#       tail (`targetBodyName = "Jool"`, `returnBodyName = "Sun"`, `viaBodyNames = ["Sun"]`).
#   (3) It satisfies the precondition
#       `test_the_return_body_is_a_member_of_the_via_bodies_on_every_lane` pins -- the
#       subset claim `_b5_correction_via_bodies` rests on -- with `viaBodyNames = ["Sun"]`.
# The correction machinery is off on this lane anyway (see the correction keys), so (3) is
# an invariant kept rather than a behaviour used. NOTE ALSO what `relayParkAtParent`
# deliberately does NOT assert: `targetBodyName == returnBodyName`. That equality is
# exactly the spelling that kills the lane.
#
# =====================================================================================
# THE DELTA-V, DERIVED END TO END. Every input is read off the fixture's own bytes or off
# stock constants; nothing is ratio-scaled from another lane.
# =====================================================================================
# WHAT THE CRAFT HAS. `laythe-park-nerv` carries B25 flight 2's delivered state verbatim:
# LiquidFuel 534.8686 / 2400 on the six LF-only MK1Fuselage tanks, NERV (Isp 800 s vac,
# 60 kN, 3.0 t), Valentina Kerman in the mk1pod.v2.
#   => **~2,483.9 m/s of dv remaining** (B26's derivation off the same bytes; that lane
#      then SPENT 1,368.1 m/s of it and finished with 1,116.6 to spare, which is the
#      independent check that the figure is right rather than optimistic).
#
# WHAT THE ESCAPE COSTS, and it is a number this fixture has already FLOWN. mlib's
# `escape_node_plan` sizes the node at the park's next periapsis:
#   mu_Laythe = 1.962e12, r_soi = 3,723,645.81113302, r_p = 500,000 + 56,240.3 = 556,240.3,
#   a_park = 572,085.80370560708
#   v_now    = sqrt(mu*(2/r_p - 1/a))                              = **1,903.930 m/s**
#   v_needed = sqrt(450^2 + 2*mu*(1/r_p - 1/r_soi))                = **2,490.622 m/s**
#   dv       = v_needed - v_now                                    = **586.692 m/s**
# B26 flight 3 logged `escapeNodeDvMps 586.6922211372255` on this exact fixture at this
# exact `escapeSoiSpeedMps`. The escape leg of this lane is therefore not a new burn -- it
# is a burn that has already been planned, executed to within 1%, and measured.
