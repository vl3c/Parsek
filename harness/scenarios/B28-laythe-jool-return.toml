# arms in ~3 polls, so MechJeb's NodeExecutor autowarps the ENTIRE SOI-entry ->
# periapsis coast INSIDE THIS PHASE. That coast is NOT half a period: solving the
# true anomaly at the exit radius with the sign of the radial velocity gives
# 55.7 s (p0) / 1,414.9 (p5) / 18,064 (p50) / 117,939 (p95) / **169,600 (p100)**,
# the worst being a FULL period of the largest delivered orbit, because a
