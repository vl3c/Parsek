# Three rules, B21's contract:
#   RULE 3 -> approachMaxWarpFactor 3 (x50). Budget = (in-SOI coast)/5, taken at
#     the sweep's p5 coast of 1,414.9 s = 283 game s per frame. x1,000 FAILS on
#     the nominal 0.5 s form alone (500 game s); x100 fails the PESSIMISTIC 4 s
#     form (400 vs 283, 0.71x); x50 passes both (25 nominal = 11.3x, 200
#     pessimistic = 1.41x). This is a DEPARTURE FROM B22's factor 5 and the
#     reason is arithmetic: at Jool B22's budget was 258,000 game s per frame.
