# to ("Jool",). The correction machinery is dark here (see below), but the flag
# is still the relay's own precondition.
interplanetaryTransfer     = true

parentRelayTransfer        = true
# **THE NEW KEY, AND IT IS A CODE REQUIREMENT BEFORE IT IS A VALUE.** With the
# parent as the destination there is NO stage-2 sibling transfer, so
# `transferMinApoapsisMeters` has nothing to be evidence for - and the relay
# validator would otherwise REFUSE a relay spec that carries it at 0. AS BUILT
# the flag does three things, all of them load-bearing and none of them a
# relaxation: it INVERTS that gate (0 becomes REQUIRED, and stated explicitly,
# because an absent key parses to the positive 10,000,000 default); it carries
# `and not relay_park_at_parent` on the COAST-TO-TARGET stage-2 hand-off, so
# `relay_stage` provably never leaves RELAY_STAGE_ESCAPE instead of that resting
# on the order of two adjacent branches; and it gives the `escapedHomeSoi`
# assertion row a second POSITIVE disjunct (ESCAPE ran AND TARGET-FLYBY was
# reached), which the row reports as `provenBy=parkAtParentTargetSoiReached`.
# It also REQUIRES `captureEnabled`: with capture off, TARGET-FLYBY's
# not-capture_enabled exit goes straight to RETURN - terminal, verdict None, no
# tree-commit seam anywhere on the path - so the craft would coast back out
# having committed NOTHING while every flyby assertion row still read met.
# NOTE what it does NOT assert: `targetBodyName == returnBodyName`. That equality
# is exactly the spelling that kills this lane at the arrival frame; see
# `returnBodyName` below.
relayParkAtParent          = true
# The relative speed the escape carries ACROSS LAYTHE'S SOI BOUNDARY - the only
# departure quantity a patched-conic game lets this mode aim at (B26 flight 2's
# defect A). UNCHANGED FROM B26 AND THE REASON IS THE ENTRY GATE, NOT INERTIA:
#   fixture floor            370.08 m/s   (450 is 21.6% clear)
#   whole-gate worst corner  431.70 m/s   (450 is 18.30 m/s clear)
#   node at the fixture      586.6922 m/s (mlib's own escape_node_plan; flight 3
#                            measured 586.6922211372255)
