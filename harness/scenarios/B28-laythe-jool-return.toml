# WHAT HELD, and all four were written down before the flight
# ---------------------------------------------------------------------------------
#
# (1) THE ESCAPE NODE. The delta-v section derives 586.692 m/s from mlib's own
#     `escape_node_plan` and notes that B26 flight 3 had already LOGGED
#     `escapeNodeDvMps 586.6922211372255` on this exact fixture at this exact
#     `escapeSoiSpeedMps`. B28's assertion row reads **586.6922240394342** -- the two
#     independent flights agree to **2.9e-6 m/s**, which is the strongest form the claim
#     could take: not "the derivation is right" but "the derivation, the planner and two
#     separate missions all produce the same number off the same bytes".
#
# (2) THE FINAL PARK SITS INSIDE LAYTHE'S ORBIT AND IS DECOUPLED FROM IT. The header
#     predicted exactly that as the bound on a Laythe re-entry. Measured: 19,728,666.573
#     x 19,728,628.891 m ALTITUDE = a **25.728648 Mm-radius circular Jool orbit at ecc
#     7.32e-07**, sitting **1.455 Mm inside** Laythe's 27.184 Mm shell. The delivered
#     arrival apoapsis before circularization was 26.383 Mm radius, so the craft never
#     reached Laythe's shell at any point after the escape either.
