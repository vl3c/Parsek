# --- The RETURN LEG: escape Laythe, park at the PARENT ------------------------
homeBodyName               = "Laythe"
# THE DESTINATION IS THE PARENT ITSELF. This is what makes the lane a one-burn
# return leg: `_b5_transfer_burn_done` takes the relay's stage-1 arm, the escape
# delivers the craft into JOOL's SOI, and because `targetBodyName` IS that SOI
# the COAST-TO-TARGET arrival branch (mlib.py:12456) fires before the stage-2
# hand-off (mlib.py:12491) ever gets a frame. TARGET-FLYBY -> PLAN-CAPTURE ->
# CAPTURE-BURN -> PARK -> ORBIT-COMMIT is then the ordinary capture tail,
