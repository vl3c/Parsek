# 1,003,000 / 200,000 = 5.015x Jool's atmosphere top, and the sweep's LOWEST
# delivered arrival periapsis (5.012 Mm altitude, at the retrograde corner) is
# 5.00x above it - so it stays a FLOOR that catches a trajectory heading into the
# air, never a certification of the park (B23's rule, B25's demonstration).
#
# IT IS NOT EQUAL TO `parkMinPeriapsisMeters`, AND B25's INEQUALITY IS WHY:
#   park floor 1,000,000 < THIS 1,003,000 < 1,000,000 + wedge 6,007 = 1,006,007
# THE WEDGE IS 6,007 m AND IT IS DERIVED, NOT COPIED. B25 measured 15,382 /
# 15,385 / 15,415 m for a 937 m/s / 163.5 s burn straddling a periapsis crossed
