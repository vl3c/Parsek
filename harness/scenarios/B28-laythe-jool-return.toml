# WHAT THE FLIGHT SAID ABOUT THE FORBIDDEN LIST, and it is less than the header hoped
# ---------------------------------------------------------------------------------
# The moon-shell audit labels Vall's four and Tylo's four poison tokens LIVE GATES on
# shells the band reaches (25.4% and 8.8% of the swept cases -- both re-measured here and
# both exact), against Bop's and Pol's OUTER INSURANCE. **ON THIS FLIGHT ALL EIGHT WERE
# SATISFIED TRIVIALLY.** The delivered apoapsis was 26.383 Mm radius, so Vall's 43.152 Mm
# shell was missed by 16.77 Mm and Tylo's 68.500 Mm by 42.12 Mm; after circularization
# the whole orbit sat at 25.729 Mm. Neither shell was approached, let alone crossed, and
# no SOI could have been entered from an orbit that never reaches the shell.
# THE LABELS STAY AS WRITTEN because they describe the SPEC'S ADMISSIBLE DIRECTION SPACE,
# which is what a forbid must be sized against. What this flight adds is that a single
# delivery samples ONE direction out of that space, and this one put Vall's and Tylo's
# tokens in the same un-fireable class as Bop's and Pol's. The 25.4% / 8.8% figures are
# properties of the sweep, NOT of this flight, and quoting them as evidence that this run
# exercised those gates would be false.
