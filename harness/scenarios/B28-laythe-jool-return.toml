# COSTS THE GATE: 400 with B26's clearance forces the apoapsis ceiling from
# 300,000 down to 106,542 m, i.e. 1.21x the fixture's own measured 87,931.3 m,
# which is a fingerprint rather than a sanity bound (B25's stated rule). 450 also
