#     2-3.2 Mm, where x50's 60,000 m floor is 33x clear.
#   RULE 1 -> coastWarpFactor 5 (x1,000), soiLeadSeconds 3,000 (6x one nominal
#     poll at that rate). NOTE THE CONSEQUENCE, stated rather than hidden: the
#     10,000 s approach window covers the WHOLE 5,181 s coast, so the clamp
