#   RULE 2 -> approachWindowSeconds 10,000: 3.3x the lead and >= 2x one
#     PESSIMISTIC 4 s coast frame at x1,000 (8,000 game s), the binding form.
#   IN-SOI PAIR: flybyWarpFactor 3 / flybyMaxWarpFactor 4, B22's Jool values.
#     Both are INERT in capture mode by construction - the `elif capture_enabled`
