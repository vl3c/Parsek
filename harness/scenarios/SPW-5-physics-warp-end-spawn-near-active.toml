schema = 1
id = "SPW-5-physics-warp-end-spawn-near-active"
# =====================================================================================
# SPW-5: AN END SPAWN INSIDE THE PHYSICS BUBBLE, ~30 M FROM THE ACTIVE VESSEL, CROSSED
# UNDER 4X PHYSICS WARP.
# (End-spawn program, 2026-11-17. Todo END-SPAWN-LANES-2026-11-17. AUTHORED, FLOWN:
# LIVE-PROVEN, see below.)
#
# LIVE-PROVEN 2026-11-17 on its first flight: run 2026-11-17_2314, PASS attempt 1, 147 s
# (parallel runner run spawn-flight-2026-11-18, main 64c68379, Debug DLL bd950021...).
# The LeafVesselPlacement batch is pinned whole (passed=1 failed=0 skipped=0) and left
# INTERIM_PIN_IDS.
#
# WHY. Every committed end-spawn lane crosses its end on rails, with the spawn far from the
# player (EVA-15's header names the in-bubble follow-up this is). Physics warp keeps the
# bubble loaded, so the spawn is LOADED next to the player: the loaded-vessel collision
# check (`CheckSpawnCollisions`), the walkback, and the deferred flush at 1x all run for
# real. Physics warp is also a warp to `ParsekPlaybackPolicy` (`isWarp`), so the end must
# be queued (`Deferred spawn during warp`), not spawned mid-warp under a 4x physics step.
#
# THE HOST: `eva2-lko-crewed`. `[[fixture.liveState]]` removes the index-0 asteroid AND the
# four pad `Kerbal X Debris`, so the FLIGHTSTATE list is [Kerbal X, Kerbal X Probe]. The
# boot still focuses Kerbal X (savepatch re-points the index past the removed asteroid).
# After the rewind strips Kerbal X, the Space Center save's `activeVessel = 0` is the spent
# core `Kerbal X Probe` (pid 2614652043), co-orbiting ~16-30 m from where Kerbal X flew.
#
# THE FLIGHT:
#   R       1x wait to UT 424 (CI-1's LoadGame-race wait), StartRecording on Kerbal X, 1x
#           wait to UT 470 (~46 s of formation beside the probe), stop, CommitTree, stop.
#   rewind  InvokeRewindToLaunch tree=latest (Space Center, ~409), SaveGame + LoadGame at
#           once: FLIGHT on the probe, the Kerbal X ghost ~30 m away from ~424.
#   cross   WarpToUT ut=540 ladder=phys: 4x physics warp (rung 3 needs 10 game-seconds left)
#           across EndUT ~470, so the end is crossed at 4x and queued; the ladder drops to
#           1x ~10 s before 540 and the queue flushes.
#   read    ListHandles before / after, LeafVesselPlacement in FLIGHT, SaveGame, quit.
#
# WHAT IS GATED: count 1; the strip; the reload before the end (unspawned); the physics
# ladder engaged (`warptout complete ... ladder=phys`); `Deferred spawn during warp:
# #N "Kerbal X"` and THEN exactly one Orbital spawn of #N (backreference); the store reads
# it spawned with that pid; LeafVesselPlacement ok on Kerbin, no duplicate.
#
# PRE-REGISTERED READINGS (the first flight decides; none is a spec bug):
#   - the loaded collision check finds the probe inside Kerbal X's bounds at the end
#     point: `Ghost held pending spawn retry` / a walkback line, then a later spawn. The
#     single-spawn pin still holds; a walkback that moves the spawn off the recorded orbit
#     reads `verdict=phase` (along-track) in LeafVesselPlacement, which this lane forbids:
#     that would be a finding (the T57 exemption covers only the recording's own parent).
#   - `Spawn ABANDONED` after the collision retries: the in-bubble neighbour never leaves;
#     a finding against the end-spawn contract, filed, not re-run.
#   - `warptout refused reason=physics-warp-unavailable` (or similar): stock disallowed
#     physics warp on the probe; re-read the probe's situation before re-authoring.
#
# FAST-LANE CHECKLIST: (1) EVA-15's host and road minus the EVA. (2) explicit-UT waits.
# (3)/(4)/(5) none. (6) retry once. (7) count exact 1 (one recording, no split). (8)
# operator until measured. (9) flight_efficiency.py after the first green flight.
# =====================================================================================
tier = "operator"
description = "LIVE-PROVEN 2026-11-17 (run 2026-11-17_2314, first flight). Physics warp across an in-bubble end spawn: on eva2-lko-crewed (asteroid and pad debris removed) ~46 s of Kerbal X's low Kerbin orbit is recorded beside its spent probe core and committed; Rewind-to-Launch and a reload into FLIGHT on that probe put the ghost ~30 m away, and a 4x physics-ladder WarpToUT crosses the end. Pins that the spawn is deferred during the physics warp and then made exactly once on the recorded orbit, beside the player."
instanceProfile = "stock-minimal"
tags = ["SPW-5", "spawn", "end-spawn", "deferred-spawn", "terminal-orbit", "warp", "physics-warp",
        "collision", "rewind-to-launch", "kerbin", "sandbox", "flown"]

[fixture]
saveTemplate       = "fixtures/saves/eva2-lko-crewed"
injectedRecordings = "none"
craft              = []

