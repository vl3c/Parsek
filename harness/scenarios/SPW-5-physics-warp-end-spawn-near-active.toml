[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "MissionMark", args = { label = "spw5-boot" },                     expect = "OK" },
  { cmd = "WarpToUT",   args = { ut = "424", maxRate = "1" },                 expect = "OK", budget = 120 },
  { cmd = "StartRecording",                                                  expect = "OK", budget = 180 },
  { cmd = "WarpToUT",   args = { ut = "470", maxRate = "1" },                 expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "CommitTree",                                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c0",        expect = "OK" },
  { cmd = "MissionMark", args = { label = "spw5-commit-count-${c0.count}" }, expect = "OK" },
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                expect = "OK", budget = 300 },
  { cmd = "SaveGame",   args = { name = "spw5-rewound" },                    expect = "OK", budget = 120 },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "spw5-rewound" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c1",        expect = "OK" },
  { cmd = "MissionMark", args = { label = "spw5-reloaded-count-${c1.count}-a-${c1.rec0}-${c1.rec0spawned}-${c1.rec0spawnedPid}-end" }, expect = "OK" },
  # THE SUBJECT: 4x physics warp across the end (header).
  { cmd = "WarpToUT",   args = { ut = "540", ladder = "phys" },              expect = "OK", budget = 300 },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c2",        expect = "OK" },
  { cmd = "MissionMark", args = { label = "spw5-spawned-count-${c2.count}-a-${c2.rec0}-${c2.rec0spawned}-${c2.rec0spawnedPid}-end" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "LeafVesselPlacement" },         expect = "OK", budget = 300 },
  { cmd = "SaveGame",                                                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
# Boot facts only until the first green flight (the H35 claim-is-not-gate rule).
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 1 }

[expectations.recordings.structure]
gating         = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1, max = 1 } }
spawnedVessels = { min = 1, max = 1 }
vesselNames    = { "Kerbal X" = 1, "Kerbal X Probe" = 1 }

[expectations.logContracts]
required = [
  "startrecording recordingId=[0-9a-f]+ already=false",
  "committree committed=true",
  "MISSIONMARK label=spw5-commit-count-1 ",
  "\\[Rewind\\] Stripped [1-9][0-9]* vessel\\(s\\) from save",
  "invokerewindtolaunch complete rec=[0-9a-f]{32} tree=[0-9a-f]{32} adjustedUT=",
  # The reload focuses the probe (the only vessel left) before the end.
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "MISSIONMARK label=spw5-reloaded-count-1-a-[0-9a-f-]+-false-0-end ",
  # The physics ladder engaged.
  "warptout rate requested=3 applied=3 rate=\\S+ mode=LOW ceilingIndex=3 clamped=false remaining=\\S+ ut=540 ",
  "warptout complete reachedUT=[0-9.]+ ut=540 rate=[0-9.]+ maxRate=4 ladder=phys ",
  # Deferred under physics warp, then made once, read back spawned with that pid.
  "\\[Policy\\] Deferred spawn during warp: #([0-9]+) \"Kerbal X\"[\\s\\S]*\\[Spawner\\] Orbital vessel spawn for #\\1 \\(Kerbal X\\) pid=[0-9]+ [^\\r\\n]*terminal=Orbiting",
  "\\[Spawner\\] Orbital vessel spawn for #[0-9]+ \\(Kerbal X\\) pid=([0-9]+) [^\\r\\n]*terminal=Orbiting[\\s\\S]*MISSIONMARK label=spw5-spawned-count-1-a-[0-9a-f-]+-true-\\1-end ",
  "LeafPlacement: rec=[0-9a-f]+ vessel='Kerbal X' pid=[0-9]+ kind=orbit body=Kerbin liveBody=Kerbin [^\\r\\n]*verdict=ok",
  "MISSIONMARK label=spw5-spawned-count-[\\s\\S]*?LeafPlacement summary: scene=FLIGHT compared=[1-9][0-9]* ok=[1-9][0-9]* bad=0 absent=[0-9]+ duplicate=0 unsupported=[0-9]+ bodies=\\[Kerbin\\]",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=LeafVesselPlacement scene=FLIGHT",
  "savegame name=persistent folder=\\S+ saved=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "invokerewindtolaunch refused",
  "invokerewindtolaunch failed",
  "warptout refused",
  "timejump ",
  # A spawn while the physics warp is still up: the end must be queued, not spawned under
  # a 4x step (the deferred line is required; a spawn line before it is the old shape).
  "MISSIONMARK label=spw5-reloaded-count-(?:(?!Deferred spawn during warp)[\\s\\S])*?(?:Orbital|EVA|Breakup) vessel spawn for #[0-9]+ \\(Kerbal X\\)",
  "(?:Orbital|EVA|Breakup) vessel spawn for #[0-9]+ \\(Kerbal X\\)[\\s\\S]*(?:(?:Orbital|EVA|Breakup) vessel|Vessel) spawn for #[0-9]+ \\(Kerbal X\\)",
  "Spawn ABANDONED",
  "Spawn RETIRED",
  "Vessel spawn failed",
  "SpawnAtPosition returned 0",
  "Spawn-death detected",
  "Deferred spawn cannot execute safely",
  "LeafPlacement: [^\\r\\n]*verdict=(?!ok)",
]

[runtime]
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
