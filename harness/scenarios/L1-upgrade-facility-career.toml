schema = 1
id = "L1-upgrade-facility-career"
# pending-fixture: fixtures/saves/fresh-career is not committed yet (M-B3 operator
# runbook creates it). Re-tier to "daily" once the fixture lands.
tier = "daily"
description = "Career: upgrade one non-R&D facility; the funds pool drops by exactly the per-level cost, no other drift."
instanceProfile = "stock-minimal"
# `pending-operator` DROPPED 2026-07-31. The marker below asked the operator to CONFIRM
# a fixture constant and RECORD it; the constant was PROVEN LIVE: the first run's ledger math
# passed at exactly -150,000 with hardDivergences=0 (that run red'd only on a
# `FacilityUpgraded` logContract, since fixed). LIVE-PROVEN `2026-07-23_1955`.
# The oracle hard-gates scalar pools (`oracle.py`: a drift reds `PARSEK-FAIL(ledger)`),
# so the green run IS that confirmation - the same argument used to drop S4.1's tag.
tags = ["ledger", "L1"]

[fixture]
saveTemplate = "fixtures/saves/fresh-career"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# upgrade-facility requires SPACECENTER (the funds debit lives in the scene
# SpaceCenterBuilding instance, FacilityUpgradeSpendPatch.cs); the fresh-career fixture
# loads to SPACECENTER. NIT A-N1: upgrade a NON-R&D facility (Tracking Station), originally
# to keep the funds-debit line clear of a science-transmit capture regex keyed on
# ResearchAndDevelopment. That regex no longer exists (deleted 2026-07-29 with the pattern
# rewrite) and KSP logs no funds or science award anyway, so the separation is now
# incidental rather than load-bearing. The chosen facility is pinned in the fixture README.
steps = [
  { cmd = "LoadGame",     args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",   args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "KscAction",    args = { action = "upgrade-facility", facility = "SpaceCenter/TrackingStation" }, expect = "OK", budget = 60 },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "FlushAndQuit",   expect = "OK" },
]

[dimensionsCovered]
D8  = ["facilities", "funds", "recalc-engine", "orchestrator", "ksp-state-patcher", "action-blocking"]
D14 = ["career", "scene-ksc"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# The M-C1 verb logs "kscaction action=upgrade-facility target=... applied=true
# manifestKind=facility-upgrade observedAfter=<cost>"; the stock upgrade reaches Parsek's
# facility-polling observer (GameStateFacilityRecorder.PollFacilityState:
# "Game state: FacilityUpgraded '<key>' <old> -> <new>").
required  = ["kscaction action=upgrade-facility .* applied=true", "Game state: FacilityUpgraded"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[expectations.ledger]
seedFrom     = "template"
tolerances   = "default"
rec3CarveOut = false

[[expectations.ledger.manifest]]
  ut         = 0.0
  kind       = "facility-upgrade"
  # AUTHOR CONSTANT (DETERMINISTIC PER LEVEL: a facility's upgrade cost is fixed data per
  # (facility, level) in the building config, the value SpaceCenterBuilding.GetUpgradeCost
  # returns for level 0 -> 1; state-INDEPENDENT, so an author constant is valid, OQ4).
  # funds is the fill-eligible pool-only facet, but an author constant is REQUIRED here in
  # practice: fill-from-capture would need a stock funds award line, and KSP emits none, so
  # a null funds amount always fails ambiguous (known-gate 3). Not "deferred" - impossible.
  # Tracking Station level 0 -> 1, stock KSP 1.12.5.
  # OPERATOR-VERIFIED (was VERIFY-PENDING-OPERATOR: read GetUpgradeCost off the observedAfter=
  # field of the "kscaction action=upgrade-facility applied=true" line and record it in the
  # fixture README). PROVEN LIVE instead: the first run's ledger math passed at exactly
  # -150,000 with hardDivergences=0, and `2026-07-23_1955` is the green run. If the chosen facility's cost turns out
  # GameVariables-scaled rather than fixed, treat it as fixture-pinned like hire (Edge 3).
  funds      = -150000.0
  provenance = "seam-declared"

[runtime]
# Happy path: LoadGame ~300 + KscAction ~60 + light verbs, under 600. Pending-fixture ->
# never scheduled unattended.
# Budget check (seed funds 500000 affords the spend): 500000 + (-150000) = 350000 >= 0.
budgetSeconds = 600

[retry]
policy = "once"

[expectedFail]
bugId = ""
