schema = 1
id = "H9-incomplete-ballistic"
tier = "nightly"
# BATCH-ONLY scenario, S1.4 / H6 pattern. The in-game IncompleteBallistic category
# has never been driven by any committed spec. It covers the scene-exit tail
# extrapolator end to end: a plane leaving mid-flight, a suborbital exit at
# apoapsis, a hyperbolic exit handing off to Kepler, a Mun-flyby patched-conic
# snapshot, a stripped maneuver node, and the three map-rendering cells that assert
# the ghost draws a line from the extrapolated segment, continues past the recorded
# end, and does NOT render foreign-SOI segments.
#
# TWO MORE CELLS JOINED THE CATEGORY as the FRAME-CALIBRATION INSTRUMENT for
# docs/dev/todo-and-known-bugs.md "BallisticExtrapolator frame mismatches"
# (FrameCalibration_Site1_* and FrameCalibration_Site4_*). Unlike the eight above
# they read the LIVE vessel. They flew as MEASUREMENT cells on run
# `2026-08-04_2142` (PARSEK-FAIL failed=2 BY DESIGN - the red carried the
# measurement: Site1 dLat=34.30 dLon=34.32 deg, Site4 angleError=133.1 deg,
# confirming the pinned axis-swap arithmetically). The four finalizer sites are
# now FIXED to the calibrated convention, and both cells are permanent FRAME
# REGRESSION guards expected to PASS.
#
# CONFIRM RUN `2026-08-04_2224` SPLIT THEM. Site 1 came back EXACT (dLat=0.000000
# dLon=-0.000001) - fixed, and now a live guard. Site 4 stayed red at
# angleError=131.066 deg. That residual was DIAGNOSED HEADLESSLY rather than by a
# third measurement flight: decomposing the two runs' logged quaternions showed the
# producer's whole state rotated 230.01 deg about the POLAR AXIS from the
# consumer's, which a transcription of stock's own element-to-state chain
# (Parsek.Tests StockOrbitElementFrameParityTests) reduced to one call stock makes
# and the extrapolator's element-seeded propagator does not -
# `Planetarium.Zup.WorldToLocal`. Fixed as SITE 5 (ELEMENT FRAME) 2026-08-05, and
# proven headlessly end to end by StockOrbitFrameSeamTests, which installs a real
# non-identity `Planetarium.Zup` and drives the production producer through it.
# BOTH CELLS ARE PERMANENT GUARDS, and the SECOND confirm re-fly PROVED them:
# run `2026-08-04_2323` PASS attempt 1, Site1 dLat=0.000000 and Site4
# angleError=0.000 with the resolved quaternion bit-identical to the vessel's.
#
# AN ELEVENTH CELL JOINED 2026-08-05 on branch `orbital-rotation-frame`, closing the
# FIFTH FRAME MISMATCH (docs/dev/todo-and-known-bugs.md
# "ComputeOrbitalRotation mixes a Zup velocity with a world radial"):
# RecorderEncodedOrbitalFrameRotationResolvesToTheVesselAttitude. It exists because
# the site-4 probe CANNOT see that defect - it runs the finalizer producer against
# the playback consumer, and a mismatch shared by both cancels inside it. The new
# cell encodes through the RECORDER's seam instead
# (FlightRecorder.StampVesselOrbitalFrameRotation: v.obt_velocity + v.CoMD, a
# world/world frame fixed by KSP's own API and unmovable) and decodes through the
# same consumer, so a consumer that drifts off world/world reds HERE while site 4
# stays green. NOT YET FLOWN as of the pin bump - see the tally block below.
description = "Run the in-game IncompleteBallistic category unattended: ballistic tail extrapolation through atmosphere/terrain/SOI events, patched-conic snapshot integration, the extrapolated-segment map line, and the three live-vessel frame-calibration probes."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "ballistic", "extrapolation", "scene-exit", "H9"]

[fixture]
# gloops-airshow SANDBOX pod host. No injected recordings: every test builds its own
# ExtrapolationBody dictionary and BallisticStateVector inline.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "IncompleteBallistic" },          expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# HONEST: the five extrapolation / patched-conic cells drive
# BallisticExtrapolator + PatchedConicSnapshot, the two production components the
# scene-exit finalizer chains (D1 ballistic-extrapolation,
# scene-exit-finalization). The run is SANDBOX on the FLIGHT-scene pod host (D14).
# NOT claimed: a D3 reference-frame token (the fixtures are synthetic state
# vectors, not authored TrackSections) and no D6 playback token - the three
# MapRendering_V1_* cells assert over the renderer's INPUT segments, not a live
# ghost draw, which is S1.7's job.
D1  = ["ballistic-extrapolation", "scene-exit-finalization"]
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (see H7).
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY: tally pinned WHOLE.
#
# EVIDENCE STANDING: MEASURED FOR THE ORIGINAL EIGHT, DERIVED FOR THE TWO ADDED.
# The eight flew 2026-07-27 in the `--tag ingame-batch` sweep (result
# harness/results/2026-07-27_*_H9-incomplete-ballistic.json: PASS on attempt 1, 49 s
# wall, every verifier PASS or SKIPPED, batchComplete found=True failed=0
# perCategory=1) and the pre-flight derivation predicted every token of that line
# correctly. The pin is a LITERAL pattern and evaluate_expectations requires it to
# match, so a PASS means the runner printed the line TOKEN FOR TOKEN.
#  - total=11 is ATTRIBUTE-EXACT: IncompleteBallisticRuntimeTests declares exactly 11
#    [InGameTest(Category = "IncompleteBallistic")] methods (the original 8, the two
#    frame-calibration probes, and the recorder attitude round trip added
#    2026-08-05). NOTE the file also hosts Ledger, Rewind,
#    RouteLiveAnchor, TestRunnerIsolation and SwitchSegment declarations, and it DOES
#    contain InGameAssert.Skip call sites in those - a per-file grep would mislead;
#    the derivation is per-method-body. Kept in sync by
#    IngameBatchWiringGroupTests.test_each_pinned_total_equals_the_source_derivation.
#  - skipped=0 is ATTRIBUTE-DERIVED for all 11 (every one carries
#    Scene = GameScenes.FLIGHT, the batch runs at FLIGHT, none sets
#    AllowBatchExecution = false) and, for the original 8, ALSO a reachable-Skip
#    derivation - none of those bodies or their helpers contains an
#    InGameAssert.Skip.
#    IT IS NO LONGER A PURE DERIVATION FOR THE THREE ADDED CELLS. All three carry
#    run-time InGameAssert.Skip guards (no active vessel / no orbit / no main body /
#    FlightGlobals.Bodies unavailable / a live orbit whose elements are not
#    propagatable / a degenerate recorder encode), so skipped=0 is a claim about the
#    gloops-airshow FIXTURE - the same standing H20 and H22 carry, and the same
#    reading rule: a skip there is a fixture question, not an extrapolator
#    regression. The gloops pod is a landed/prelaunch vessel whose orbit is the
#    surface-rotation ellipse: site 4 already measured 0.000 on it, so its live
#    orbit propagates and its orbital frame is non-degenerate, which is exactly what
#    the eleventh cell's two guards ask for.
#  - failed=0 is the ASSERTION. The two frame-calibration probes flew as
#    deliberate-red measurement cells on run `2026-08-04_2142` (failed=2, the failure
#    text and the `Site1FrameProbe:` / `Site4AttitudeRoundTrip:` Info lines carrying
#    the readings that calibrated the fix) and again on the confirm run
#    `2026-08-04_2224` (failed=1: site 1 exact, site 4 still 131.066 deg - the
#    residual now fixed as SITE 5, see the header); with all five sites corrected
#    they are permanent frame-regression guards and failed=0 is a live assertion
#    again. A future red on either probe is a FRAME REGRESSION, not noise: read the
#    printed deltas before touching anything, and never clear it by loosening the
#    probes' tolerances (0.01 deg / 5 deg) - the measured defect signatures were
#    dLat=34.3 deg and angleError=133 / 131 deg, orders of magnitude above tolerance.
#    Site 4 in particular has now red TWICE, so a third red there says the closed
#    form is incomplete and wants reading, not a relaxed cell.
#    THE ELEVENTH CELL IS DERIVED, NOT MEASURED. It has not flown: the pin was bumped
#    with the fix that added it (branch `orbital-rotation-frame`) so the tally-sync
#    cell stays green, and its total/skipped standing is the same derivation the two
#    2026-08-04 probes carried before THEIR first flight. Its failed=0 rests on the
#    headless closed-form half (Parsek.Tests
#    StockOrbitElementFrameParityTests.RecorderStyleWorldWorldEncode_*) plus the
#    lockstep argument that keeps site 4 at 0.000. Read a first red there as the
#    measurement it is, not as noise.
#  - passed=11 follows.
#  - scene=FLIGHT is INFERRED from the fixture (Focusable route, as H5/S1.4
#    MEASURED on it) and is LOAD-BEARING: at any other scene all 11 scene-skip.
required  = ["BATCH_COMPLETE v1 total=11 passed=11 failed=0 skipped=0 category=IncompleteBallistic scene=FLIGHT"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
