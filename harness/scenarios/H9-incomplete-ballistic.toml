schema = 1
id = "H9-incomplete-ballistic"
tier = "nightly"
# BATCH-ONLY scenario, S1.4 / H6 pattern. The in-game IncompleteBallistic category
# has never been driven by any committed spec. It covers the scene-exit tail
# extrapolator end to end: a plane leaving mid-flight, a suborbital exit at
# apoapsis, a hyperbolic exit handing off to Kepler, a Mun-flyby patched-conic
# snapshot, a stripped maneuver node, and the three map-rendering cells that assert
# the ghost draws a line from the extrapolated segment, continues past the recorded
# end, and does NOT render foreign-SOI segments.
#
# TWO MORE CELLS JOINED THE CATEGORY as the FRAME-CALIBRATION INSTRUMENT for
# docs/dev/todo-and-known-bugs.md "BallisticExtrapolator frame mismatches"
# (FrameCalibration_Site1_* and FrameCalibration_Site4_*). Unlike the eight above
# they read the LIVE vessel, and they are MEASUREMENT cells: they are EXPECTED TO
# FAIL until the in-game calibration that entry is waiting on has been flown and the
# four pinned finalizer sites corrected. See the tally block below - this spec reds
# on that failure BY DESIGN, and the red carries the measurement.
description = "Run the in-game IncompleteBallistic category unattended: ballistic tail extrapolation through atmosphere/terrain/SOI events, patched-conic snapshot integration, the extrapolated-segment map line, and the two live-vessel frame-calibration probes."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "ballistic", "extrapolation", "scene-exit", "H9"]

[fixture]
# gloops-airshow SANDBOX pod host. No injected recordings: every test builds its own
# ExtrapolationBody dictionary and BallisticStateVector inline.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "IncompleteBallistic" },          expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# HONEST: the five extrapolation / patched-conic cells drive
# BallisticExtrapolator + PatchedConicSnapshot, the two production components the
# scene-exit finalizer chains (D1 ballistic-extrapolation,
# scene-exit-finalization). The run is SANDBOX on the FLIGHT-scene pod host (D14).
# NOT claimed: a D3 reference-frame token (the fixtures are synthetic state
# vectors, not authored TrackSections) and no D6 playback token - the three
# MapRendering_V1_* cells assert over the renderer's INPUT segments, not a live
# ghost draw, which is S1.7's job.
D1  = ["ballistic-extrapolation", "scene-exit-finalization"]
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (see H7).
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY: tally pinned WHOLE.
#
# EVIDENCE STANDING: MEASURED FOR THE ORIGINAL EIGHT, DERIVED FOR THE TWO ADDED.
# The eight flew 2026-07-27 in the `--tag ingame-batch` sweep (result
# harness/results/2026-07-27_*_H9-incomplete-ballistic.json: PASS on attempt 1, 49 s
# wall, every verifier PASS or SKIPPED, batchComplete found=True failed=0
# perCategory=1) and the pre-flight derivation predicted every token of that line
# correctly. The pin is a LITERAL pattern and evaluate_expectations requires it to
# match, so a PASS means the runner printed the line TOKEN FOR TOKEN.
#  - total=10 is ATTRIBUTE-EXACT: IncompleteBallisticRuntimeTests declares exactly 10
#    [InGameTest(Category = "IncompleteBallistic")] methods (the original 8 plus the
#    two frame-calibration probes). NOTE the file also hosts Ledger, Rewind,
#    RouteLiveAnchor, TestRunnerIsolation and SwitchSegment declarations, and it DOES
#    contain InGameAssert.Skip call sites in those - a per-file grep would mislead;
#    the derivation is per-method-body. Kept in sync by
#    IngameBatchWiringGroupTests.test_each_pinned_total_equals_the_source_derivation.
#  - skipped=0 is ATTRIBUTE-DERIVED for all 10 (every one carries
#    Scene = GameScenes.FLIGHT, the batch runs at FLIGHT, none sets
#    AllowBatchExecution = false) and, for the original 8, ALSO a reachable-Skip
#    derivation - none of those bodies or their helpers contains an
#    InGameAssert.Skip.
#    IT IS NO LONGER A PURE DERIVATION FOR THE TWO ADDED CELLS. Both carry run-time
#    InGameAssert.Skip guards (no active vessel / no orbit / no main body /
#    FlightGlobals.Bodies unavailable / a live orbit whose elements are not
#    propagatable), so skipped=0 is a claim about the gloops-airshow FIXTURE - the
#    same standing H20 and H22 carry, and the same reading rule: a skip there is a
#    fixture question, not an extrapolator regression.
#  - failed=0 is the ASSERTION, and IT IS EXPECTED TO FAIL RIGHT NOW. The two
#    frame-calibration probes measure the mismatch pinned in
#    docs/dev/todo-and-known-bugs.md "BallisticExtrapolator frame mismatches" at
#    sites 1 and 4, which SHIP UNFIXED by that entry's standing instruction (the
#    axis/sign convention must be calibrated in-game, never re-derived on paper). So
#    this spec reds until that calibration lands, and the red is the instrument
#    reporting: the failure text prints both coordinate pairs / the attitude angle
#    and the deltas, and the same numbers appear as `Site1FrameProbe:` /
#    `Site4AttitudeRoundTrip:` Info lines in KSP.log. DO NOT "fix" the red by
#    loosening the probes' tolerances or by pinning failed=2 - the harness derives
#    passed = total - attribute_skipped with failed=0 and would reject the latter
#    anyway. It clears when the frame fix lands.
#  - passed=10 follows.
#  - scene=FLIGHT is INFERRED from the fixture (Focusable route, as H5/S1.4
#    MEASURED on it) and is LOAD-BEARING: at any other scene all 10 scene-skip.
required  = ["BATCH_COMPLETE v1 total=10 passed=10 failed=0 skipped=0 category=IncompleteBallistic scene=FLIGHT"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
