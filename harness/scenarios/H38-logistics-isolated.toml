schema = 1
id = "H38-logistics-isolated"
tier = "operator"
# THE THIRD SLICE OF `Logistics`, AND THE ONE THAT IS ACTUALLY THE CATEGORY.
#
# `Logistics` is the largest in-game category in the tree - 47 declarations - and
# until now the harness drove 10 of them across two specs, both on the ORDINARY
# batch path:
#   H34-logistics-inter-body  - the 2 SPACECENTER-eligible declarations.
#   H35-logistics-route-proof - the 8 FLIGHT-eligible ones on the ordinary filter.
# The other 38 are `AllowBatchExecution = false` + `RestoreBatchFlightBaselineAfter-
# Execution = true`. They are the inventory doc's bucket B4 in its purest form: 38
# already-written tests whose authors decided a per-test quickload baseline makes
# them batch-safe, and which NO unattended path could reach until R5 added the seam's
# `isolated` argument. H38 is the spec that reaches them.
#
# THE ARG IS NOT DECORATION HERE, and the arithmetic is stated because
# IsolatedBatchWiringGroupTests checks it both ways:
#   hlib.derive_batch_tally(decls, "Logistics", "FLIGHT")                -> executable 8
#   hlib.derive_batch_tally(decls, "Logistics", "FLIGHT", isolated=True) -> executable 46
# So the isolated filter admits 46 where the ordinary one admits 8. `Logistics` is
# only PARTLY batch-disabled, exactly like R7a's `Rewind` and unlike H21's
# `SceneExitMerge`, so this spec is declared in
# IsolatedBatchWiringGroupTests.PARTLY_BATCH_DISABLED_IDS: the arg earns its place by
# admitting STRICTLY MORE, not by being the only way to run anything.
#
# =====================================================================================
# READING-RUN HISTORY - THE LANE'S DERIVATION RECORD. Every number and every string
# pinned below is quoted from run 2's `KSP.log`; nothing here is derived from an
# attribute any more except `total=`, which the source sync still owns.
#
# RUN 1  `2026-08-28_1802`, PARSEK-FAIL(results), attempt 1, wall 170 s.
#        CENSUS: `BATCH_COMPLETE v1 total=47 passed=36 failed=2 skipped=9
#        category=Logistics scene=FLIGHT`. The isolated route ran (36 > the ordinary
#        path's ceiling of 8), the rig cleared every precondition it was built for,
#        and the run produced THREE findings - which is what a reading run is for:
#
#          1. A PRODUCT DEFECT, fixed at commit f98d5477a:
#             D4-HARVEST-POLL-IS-NOT-RAILS-GATED-ON-SURFACE-VESSELS. The harvest poll
#             was not rails-gated for LANDED / SPLASHED / PRELAUNCH vessels
#             (`OnVesselGoOnRails` early-returns before `isOnRails` is set), and the
#             rails-exit funnel flag was consumed by ANY no-transition poll and never
#             re-armed at rails exit. `PollHarvestActivity` now gates on the vessel's
#             own `packed` flag (`ShouldRunHarvestPoll`), consumes the funnel only
#             when a transition is actually emitted (`ShouldConsumeRailsExitFunnel`),
#             and `OnVesselGoOffRails` arms the funnel on BOTH exit branches. Pure
#             predicates unit-tested in `RouteHarvestCaptureTests` (+3 cells). This is
#             what red `HarvestCapture_WarpToggle_RebaselinesAtRailsTransitions`.
#          2. A TEST DEFECT: `LogisticsHarvestRuntimeTests` read
#             `RouteHarvestWindows` / `RouteRunManifest` off the tree recording
#             WITHOUT flushing the stopped recorder into it first (all three sites).
#             This is what red `HarvestCapture_ConverterToggle_OpensAndClosesWindow`.
#          3. A TEST DEFECT: `LogisticsRouteProofRuntimeTests`' stored-part finder
#             reflected on the internal `KeysList`, which resolves SILENTLY NULL under
#             Public-only binding - so the cell self-skipped rather than failing. This
#             is the SILENT-EMPTY class, and it is why token 5 below exists.
#
# RUN 2  `2026-08-28_1833`, PASS attempt 1, wall 250 s, over the f98d5477a DLL.
#        MEASURED: `BATCH_COMPLETE v1 total=47 passed=39 failed=0 skipped=8
#        category=Logistics scene=FLIGHT`. Every verifier green or REPORT
#        (analyzer PASS red=0, batchComplete PASS, driverValidity PASS, expectations
#        PASS with recordings count 0, logValidate PASS; ghostLifecycle / renderCompose
#        / saveParse REPORT; ledgerOracle SKIPPED no-ledger-block-declared).
#        DELTA FROM RUN 1: +3 passed (the two harvest cells now pass, and
#        `InventoryPayloadIdentityHash_LiveStockMove_PreservesIdentity` moved from
#        SKIPPED to PASSED - the only skip-set difference between the two runs).
#        THE TALLY IS NOW PINNED WHOLE off these bytes and the id has LEFT
#        IsolatedBatchWiringGroupTests.INTERIM_PIN_IDS, with `MEASURED_SKIPPED = 8`
#        declared there (the attribute floor is 1; the other 7 are run-time
#        `InGameAssert.Skip` guards, rostered below).
#        CONFIRM RUNS PENDING - the pin is measured once, not yet re-proven.
#
# -------------------------------------------------------------------------------------
# THE SKIP ROSTER - all 8, each with the reason it gave, quoted from run 2's log.
# This is the debt ledger for the category: it is what a future fixture or a future
# lane has to answer, and it is deliberately written out rather than summarised as a
# count, because `skipped=8` on its own is indistinguishable from a rig that stopped
# working.
#
#   1 SCENE-FILTERED (the attribute floor, no per-test line - the runner logs
#     `Scene eligibility skip summary: skipped=1 currentScene=FLIGHT
#     byRequiredScene=SPACECENTER:1`):
#       InterBodyRoute_RealBuilder_ClassifiesReaimWindows_AndModuloFires
#       -> SPACECENTER-scoped; OWNED BY H34's slice, not a gap here.
#
#   7 RUN-TIME `InGameAssert.Skip` guards, all seven a MISSING RECORDED SUBJECT
#     rather than a rig defect - no craft property fixes any of them:
#
#       2 LogisticsRouteProducerRuntimeTests.RouteOriginProof_StartedDockedToNonKsc_
#         ProducerLandsProof - "No recording with a captured RouteOriginProof. Set up:
#         record a mission that started with the active vessel docked to a
#         non-PRELAUNCH partner, commit the tree, then run this test."
#       3 LogisticsRouteProducerRuntimeTests.RouteOriginProof_StartedOnRunway_
#         ProducerSkipsProof - "No committed recording started in PRELAUNCH. Set up:
#         launch a vessel from the pad / runway, record + commit a short flight, then
#         run this test."
#       4 LogisticsRouteProofRuntimeTests.RouteProof_ActiveAsInitiatorDockWindow_
#         HasEndpointProof - "No active-as-initiator logistics dock route window found.
#         Record a route where the active vessel docks into another vessel, then run
#         this test."
#       5 LogisticsRouteProofRuntimeTests.RouteProof_ActiveAsTargetDockWindow_
#         HasEndpointProof - "No active-as-target logistics dock route window found.
#         Record a route where the active vessel is the dock target, then run this
#         test."
#       6 LogisticsRouteProofRuntimeTests.RouteProof_CrossTreeCommittedPartner_
#         HasEndpointProof - "No cross-tree-committed-partner dock route window found.
#         Repro: commit one tree on vessel A, then launch vessel B in a fresh tree and
#         dock B into A; the merged child on B's tree should carry a route window whose
#         TransferTargetVesselPid matches A's committed recording."
#         -> 4, 5 and 6 are ONE debt: a dock-window RECORDED fixture. That is the
#            planned H39 `bdock-recorded` lane, not something `logi-cargo-pad` can
#            answer - this host records nothing by design (see [expectations.recordings]).
#       7 LogisticsHarvestRuntimeTests.HarvestCapture_CatchUpOnLoad_
#         AttributesInsideWindowOrBridges - "Active vessel 'Logi Cargo Rig' carries no
#         BaseDrill-derived module (stock surface drills / asteroid+comet drills); the
#         catch-up investigation needs real harvest production - load a drill-equipped
#         save to run this test."
#         -> NOT fixable by adding a drill to the rig: the cell wants a drill rig
#            LANDED ON ORE, i.e. a mined-surface fixture, and the FuelCell that
#            satisfies the other two HarvestCapture cells deliberately does not.
#       8 LogisticsHarvestRuntimeTests.HarvestRoute_AnalyzesEligible_
#         FromSyntheticRecording - "Synthetic drill tree 'tree-drill-harvest-m2' is not
#         in this save; run 'dotnet test --filter InjectAllRecordings' (KSP closed) and
#         load the injected save to run this test."
#         -> wants an INJECTED corpus. `injectedRecordings = "none"` is this spec's
#            measured choice (see [fixture]); flipping it to buy one cell would add
#            store noise to 38 others and break the zero-recordings assertion.
# =====================================================================================
description = "Run the in-game Logistics category through the ISOLATED batch entry point over the purpose-built logi-cargo-pad rig: the 38 restore-after-run declarations - unloaded-depot origin debit, pickup, loaded and multi-module delivery, harvest capture, multi-stop and multi-origin escrow, round-trip pairing - that no unattended path could execute before this spec. FLOWN TWICE 2026-08-28: reading run 1 found one product defect (the D4 harvest rails funnel, fixed at f98d5477a) plus two test defects, and run 2 over the fixed DLL measured 39 passed / 0 failed / 8 skipped, now pinned whole."
instanceProfile = "stock-minimal"
# `flown` replaced `pending-flight` on 2026-08-28 (the BDOCK-1 / CL-3 / H35 precedent):
# the lane has flown twice, the second green, and the tally is pinned off those bytes,
# so `pending-flight` had stopped describing it. `reading-iteration` is the V5 tag for a
# lane whose pins came out of a measured reading pass rather than a derivation.
tags = ["ingame-batch", "isolated-batch", "logistics", "H38", "flown", "reading-iteration"]

[fixture]
# NOT gloops-airshow, NOT bdock-recorded, NOT depot-route-recorded, and this is the
# single most important line in the spec - the H21 lesson applied to a category with
# five preconditions instead of one.
#
# The isolated-group fixture predicate (IsolatedBatchWiringGroupTests::
# test_the_fixture_can_actually_fly_the_category) demands only two properties of the
# ACTIVE vessel: `sit = PRELAUNCH` and at least one `ModuleEngines`. That predicate is
# a FLOOR, not the requirement - it exists because H21's engineless host would have
# produced a green-looking all-skipped tally. `Logistics` needs four more properties
# on top of it, and the reason each committed candidate fails is worth writing down
# once so it is not rediscovered:
#
#   * `bdock-recorded` (H35's host) - its active vessel is a PARKED Kerbal X in
#     ORBIT, not a PRELAUNCH pad rocket, so it fails the group predicate outright.
#     `UnloadedFuelVesselFixture` snapshots the ACTIVE vessel and re-spawns the copy
#     into a 250 km parking orbit as the UNLOADED depot the origin-debit / pickup /
#     multi-stop cells need, and it wants a pad rocket to snapshot.
#   * `depot-route-recorded` - same shape and the same failure: a recorded
#     mid-mission state, not a pad state. Neither recorded fixture carries a craft
#     with two `ModuleInventoryPart` containers in the order the multi-module cell
#     needs, and neither carries a `BaseConverter`-derived module at all.
#   * `b2-lko-craft` (H21's host) - PRELAUNCH with 8 engines, so it clears the group
#     predicate, and it still fails `Logistics`: no `BaseConverter`, and its cargo
#     inventory shape is whatever the stock launcher happens to have rather than the
#     first-full / later-free pair the handoff cell requires.
#
# WHAT THE RIG CARRIES, named against the skip strings that demanded it (the full
# derivation is `harness/tools/build_logi_craft.py`'s module docstring, L1-L5):
#   L1 PRELAUNCH pad rocket + `liquidEngine2` (LV-T45)  -> `UnloadedFuelVesselFixture`
#      has an active pad vessel to snapshot and re-spawn as the unloaded depot.
#   L2 a `LiquidFuel` RESOURCE node                     -> without one that fixture
#      returns `reason = "no-liquidfuel-resource"` and EVERY unloaded-depot cell
#      skips.
#   L3 an FL-T400 at LF 100/180 + Ox 122/220, flowState=True -> the loaded-path
#      `Delivery_LoadedVessel_AppliesResourceTransfer` pre-drains the first LF tank
#      and asserts a +5.0 LF top-up, so it needs debitable fuel AND free capacity at
#      once. A full tank fails it as surely as an empty one.
#   L4 a stock `FuelCell` (BaseConverter-derived)       -> the two HarvestCapture
#      cells skip with the literal advice "a stock fuel cell suffices - add one to
#      the test craft". A drill cannot substitute: it wants ground contact and ore.
#   L5 TWO `ModuleInventoryPart` containers in PROBE ORDER - a 3-slot
#      `smallCargoContainer` FIRST holding an `evaRepairKit` + an `evaScienceKit`
#      with one slot free, then a 9-slot `cargoContainer` empty. The multi-module
#      cell fills every empty slot of the FIRST module and then needs a LATER one
#      with a slot free, or it skips "No later inventory module has an empty slot
#      left". The root is a `probeCoreOcto2.v2` and NOT a pod precisely because every
#      stock command pod carries its own `ModuleInventoryPart` and would displace the
#      small container from first place in probe order.
#
# MEASURED on the committed fixture: 6-part active vessel `Logi Cargo Rig`, PRELAUNCH,
# 1 `ModuleEngines`, 1 BaseConverter, 2 `ModuleInventoryPart` (the save's part-node
# count reads higher because inventory STOREDPART nodes are parts too). SANDBOX, so no
# career state is at risk. Two VESSEL nodes: the rig (activeVessel) and the stock
# asteroid `Ast. VPA-167`, a `SpaceObject` carrying no LiquidFuel - so the rig's tank
# is the save's ONLY LF resource node and nothing can shadow it.
#
# PROVENANCE: stamped by `FORGE-logi-pad` (boots `bdock-forge-base`, launches the
# committed `Logi Cargo Rig.craft` uncrewed onto the LaunchPad, settles PRELAUNCH,
# SaveGame) and harvested with `harvest_bdock_station.py --run-save bdock-forge-base
# --target-name logi-cargo-pad --expect-situation PRELAUNCH`. The craft itself is
# authored BY CONSTRUCTION by `build_logi_craft.py` and drift-gated byte-for-byte by
# `harness/lib/test_logi_cargo_rig.py`, so a hand edit to the rig reds the unit suite
# rather than this flight.
#
# injectedRecordings = "none" is a MEASURED choice, not a default. Every one of the 38
# restore-flagged cells BUILDS the state it needs in-body (a snapshot-derived unloaded
# depot, a forged route, an escrow ledger) and reaps it; an injected corpus would add
# store noise and buy nothing. It also keeps the produced-save assertion below sharp.
saveTemplate = "fixtures/saves/logi-cargo-pad"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# MIRRORS R7a's shape exactly, with ONE addition (verboseLogging) and ONE deliberate
# omission (the kill triple).
#
# NO KILL TRIPLE, and the contrast with H35 is the point. H35 carries
# StopRecording / DiscardTree immediately after LoadGame because it loads a RECORDED
# save whose own parked craft is active, and the committed-tree restore path resumes a
# promotion-stub recording ~1 s into the scene before any step can run (the V-corpus
# lesson). `logi-cargo-pad` is a FRESH, UN-RECORDED pad fixture - zero trees, zero
# recordings, zero sidecars, verified by test_saveparse's committed-fixture sweep - so
# there is nothing to stop and nothing to discard. The pair would be a harmless no-op,
# but writing steps that assert nothing is how a driver stops being readable.
#
# autoRecordOnLaunch=false: the standard pin every H-spec carries. Nothing here stages
# the rig, so auto-record has no trigger, but pinning it removes the possibility
# outright rather than resting on that - and a recording started mid-batch would break
# the zero-recordings assertion below, which is this spec's campaign-isolation proof.
#
# verboseLogging=true is REQUIRED, not cosmetic, and for the same reason H35 carries
# it: `InGameTestRunner` writes each cell's per-test PASSED / SKIPPED line at Verbose.
# A reading run whose whole purpose is to census WHICH of the 46 admitted cells passed
# and which self-skipped is blind without it - the BATCH_COMPLETE tally would give the
# totals and nothing else, and correcting the interim pin needs the names.
#
# The 540 s RunTests budget is hlib.MAX_DEFERRED_STEP_BUDGET_SECONDS, the cap, and it
# is not padding: the isolated path is a real quickload per restore-flagged test, so
# this batch costs on the order of 38 FLIGHT scene reloads plus a baseline prime. That
# is what runtime.budgetSeconds below is sized against.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "RunTests",   args = { category = "Logistics", isolated = "true" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# CLAIM-IS-NOT-GATE (the H35 rule): a value is declarable only when a REQUIRED token
# would red if the behaviour stopped. What changed between the authored form of this
# block and this one is not the spec's subject matter - it is that the tally is now
# PINNED WHOLE, which turns it from a floor into a gate.
#
# WHY THE TALLY GATES, spelled out because claiming five cells off one token deserves
# the argument rather than an assertion. `passed=39 failed=0 skipped=8` is pinned with
# LITERALS on all three, so there are exactly three ways a cell can stop asserting its
# behaviour and every one of them reds:
#   * it FAILS            -> `failed=0` reds (and `passed=39` reds too);
#   * it self-SKIPS       -> `passed=38 skipped=9`, both literals red;
#   * it is DELETED       -> `total=47` moves, and CommittedBatchTallySourceSyncTests
#                            reds LOCALLY in `harness/lib` before any flight, forcing
#                            the pin to move in the same commit.
# There is no fourth. A compensating swap cannot hide either, because `failed=0` is
# absolute rather than a budget. What the tally does NOT do is NAME the cell - the
# reading is "these 39 all passed", not "this one passed" - so a red points at the
# category rather than at a behaviour. That is a DIAGNOSTIC weakness, not a gating one,
# and H34's standard is gating.
#
# WHY THESE FOUR AND NOT THE SUBJECT MATTER. H35 declined every D10 row on the ground
# that "nothing in THIS run drives a production route emitter at all" - measured, zero
# occurrences. That fact has INVERTED here, and the evidence is run 2's log, not the
# cell names: the production `[Parsek][*][Route]` emitters fire throughout
# (`ReserveCargo`, `ReserveCycleEscrow`, `ReleaseWindowEscrow`, `DropRouteEscrow`,
# `PickupSourcesHaveCargo ... short-cause=escrow`, `PartnerGate: ... HOLD
# WaitingForPartner` / `CLEAR` / `dispatched - consumed partner`, `Route ... hold
# recorded kind=OriginLacksCargo`, `DispatchDebit`, `LoopRoute ... FIRED full cycle
# (dispatch+debit+delivered)`, `Delivery write: ... path=loaded`). These are the real
# units, driven live in FLIGHT, and the cells assert on their output - so a unit that
# stopped doing the behaviour reds a cell, which reds the tally.
#
#  - D10 `multi-stop`: LogisticsMultiStopRuntimeTests `LoadedEndpoint_DeliversAtBothDocks`
#    / `UnloadedEndpoint_DeliversAtBothDocks` / `PartialCycleResume_SurvivesSaveRoundTrip`,
#    plus RouteOnMissions `MultiStop_KeptMembersLoop_PostLastDockNonMembers`. Four cells,
#    all in the 39; two-dock delivery that stopped happening fails them.
#  - D10 `multi-origin-escrow`: LogisticsMultiOriginRuntimeTests
#    `TwoSources_BothDebitedAndConsolidated`, `OneSourceShort_HoldsNamingSource`,
#    `Escrow_CompetingRouteSeesReservation_Holds`, `SaveRoundTrip_ResumesAndReEstablishesEscrow`.
#    Four cells, all in the 39, and the reservation ledger is exercised in both
#    directions - a route reserves (`ReserveCycleEscrow ... reservedSources=2`) and a
#    COMPETING route is held BY that reservation (`short-cause=escrow ... raw=5
#    netted=1 reservingRouteId=esc-A-23 reservedByRoute=4`), then re-established across
#    a save round trip (`context=resume-reestablish`).
#  - D10 `round-trip-pair`: LogisticsRoundTripRuntimeTests `DeadlockSeed_SeedDispatchesFirst`,
#    `PausedPartner_BypassesAndDispatches`, `StaggeredDocks_AlternatesAcrossTicks`,
#    `SaveReload_PreservesAlternation`. The PartnerGate alternation is asserted in all
#    four of its branches (seed break, hold, clear, paused bypass).
#  - D10 `hold-reasons`: `OriginGate_EmptyOrigin_HoldsWaitingForResources` (production
#    emits `hold recorded kind=OriginLacksCargo`), `MultiOrigin_OneSourceShort_
#    HoldsNamingSource` (the hold must NAME its source), `Escrow_CompetingRouteSees
#    Reservation_Holds` (`short-cause=escrow`), `PausedPartner_BypassesAndDispatches`
#    (`WaitingForPartner`). Three distinct hold kinds, each asserted.
#
# NOT CLAIMED, and this is the honest half of the decision:
#  - D10 `destination-full-gate`. The gate IS reached - `DestinationHasCapacity: route
#    ingame-m full manifest fits (stopsResolved=1 stopsUnresolved=0)` appears three
#    times - but ONLY on the permissive branch. `RouteStatus.DestinationFull` /
#    `WaitDestinationFull` never fire in run 2 (zero occurrences of either, and the
#    only `hold recorded kind=` value in the whole log is `OriginLacksCargo`). A gate
#    observed exclusively in the "yes" direction is not gated: the unit could stop
#    refusing a full destination entirely and every one of the 39 would still pass.
#    This value stays a zero-declarer row and stays honest.
#  - The other five zero-declarer D10 rows (docked-depot-origin, claw-producer,
#    inventory-cargo, harvest-provenance, route-map-lines) for the ordinary reason:
#    nothing in the 39 asserts them, or the cell that would is in the skip roster.
#  - D10 `delivery` / `pickup` / `resource-cargo` are NOT re-declared here even though
#    the run drives them: they already carry declarers, and re-claiming a covered row
#    inflates the count without gating anything new (the H34 rule).
#
# D14 - the boot facts, both riding the loadgame line: `scene-flight` is gated by the
# fixture's Focusable route (a fixture that stopped being focusable would land at the
# KSC and red the pinned scene token ON the tally), `sandbox` is its `Mode = SANDBOX`.
D10 = ["multi-stop", "multi-origin-escrow", "round-trip-pair", "hold-reasons"]
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (the H7 lesson): run.py reads
# `expectations.allowedAnomalies`, and a bare key written AFTER an
# `[expectations.<sub>]` header is TOML-scoped to that sub-table and never read.
# hlib.validate_spec rejects the misplaced form, so this must stay ahead of the
# sub-tables. No tracer is armed by this spec, so the empty list is the honest
# declaration.
allowedAnomalies = []

[expectations.recordings]
# Zero, and it doubles as the CAMPAIGN-ISOLATION assertion exactly as H21's and R7a's
# do. The staged fixture carries no recordings, nothing in the driver records, and
# several of the 38 cells build real trees and route state mid-run. The isolated path's
# per-test baseline restore plus the batch teardown revert from the pre-batch `.bak`
# must leave the produced save clean. A non-zero count here is NOT "a test leaked" - it
# is the restore contract failing, which is the property the whole isolated path rests
# on, and it should red loudly.
count = { min = 0, max = 0 }

[expectations.logContracts]
# EVIDENCE STANDING: FLOWN AND PINNED WHOLE. `total=` is still attribute-derived (and
# source-synced); `passed=39 skipped=8` and both cell tokens are MEASURED, quoted from
# `harness/results/2026-08-28_1833_H38-logistics-isolated_shots/KSP.log`.
#
# ---------------------------------------------------------------------------------
# DERIVED, NOT GUESSED. The commands, so the next reader re-runs them rather than
# trusting this block:
#   decls = hlib.parse_ingame_test_declarations(<each file under Source/Parsek>)
#   hlib.derive_batch_tally(decls, "Logistics", "FLIGHT", isolated=True)
#     -> total=47  scene_skipped=1  batch_skipped=0  executable=46
#   hlib.derive_batch_tally(decls, "Logistics", "FLIGHT")
#     -> total=47  scene_skipped=1  batch_skipped=38  executable=8
# The `isolated` argument is REQUIRED to reproduce the first line: this driver sends
# `isolated = "true"`, and the call WITHOUT it models the ordinary entry point that
# H35 flies.
#
# WHAT EACH TOKEN RESTS ON:
#
#  - total=47 is ATTRIBUTE-EXACT and the only statically certain token: 47
#    `[InGameTest(Category = "Logistics")]` declarations across 18 files.
#    BATCH_COMPLETE's `total` is `allTests.Count(Status != NotRun)` over the single
#    batch, so it counts FILTERED tests too - which is why H34 (SPACECENTER), H35
#    (FLIGHT ordinary) and this spec all pin the same 47 while executing 2, 8 and 46
#    respectively. Kept in sync with the source by CommittedBatchTallySourceSyncTests:
#    adding one Logistics `[InGameTest]` moves ALL THREE pins, in the same commit.
#
#  - The ATTRIBUTE FLOOR for `skipped` is 1, and only 1. Exactly one declaration is
#    scene-ineligible at FLIGHT - `InterBodyRoute_RealBuilder_ClassifiesReaimWindows_
#    AndModuloFires` (RouteInterBodyBuilderShapeInGameTest.cs), the SPACECENTER cell
#    H34 owns. On the ISOLATED path NOTHING is batch-skipped: the filter is
#    `AllowBatchExecution || RestoreBatchFlightBaselineAfterExecution`, and all 38
#    batch-disabled Logistics declarations carry the restore flag, so all 38 are
#    admitted. (That is also why the baseline-slot literal below is 38 and not 47 -
#    see its own note.)
#
#  - passed=39 and skipped=8 are MEASURED AND PINNED AS LITERALS, replacing the
#    authored interim form `passed=(?:9|[1-9][0-9]+) ... skipped=[0-9]+`. The measuring
#    line, verbatim from run 2 (`KSP.log:28117`):
#      [LOG 21:36:47.028] [Parsek][INFO][TestRunner] BATCH_COMPLETE v1 total=47
#      passed=39 failed=0 skipped=8 category=Logistics scene=FLIGHT
#    39 + 8 = 47 exactly, and the 39 are named: the log carries 39 distinct
#    `PASSED: <Class>.<Method>` lines and 7 `SKIPPED:` lines, the 8th skip being the
#    scene filter (`Scene eligibility skip summary: skipped=1 currentScene=FLIGHT
#    byRequiredScene=SPACECENTER:1`). The full skip roster with each guard's stated
#    reason is in the header block at the top of this file - that roster IS the
#    category's remaining debt, and `skipped=8` alone would not say what it is.
#
#    WHAT THE LITERAL PIN BUYS OVER THE INTERIM FORM. The interim `passed >= 9` was a
#    FLOOR whose only job was to reject the ordinary path's ceiling of 8; it accepted
#    every degradation above that, including a rig that stopped satisfying two of its
#    five preconditions and self-skipped eight more cells. The literal rejects all of
#    them, and it makes the tally the gate the [dimensionsCovered] D10 claims rest on:
#    a cell that FAILS reds `failed=0`, a cell that SKIPS reds both `passed=39` and
#    `skipped=8`, and a cell that is DELETED reds `total=47` locally in `harness/lib`
#    via CommittedBatchTallySourceSyncTests before it can reach a flight.
#
#    `skipped=8` is ABOVE the attribute floor of 1, so it is declared in
#    IsolatedBatchWiringGroupTests.MEASURED_SKIPPED - the attributes cannot see the 7
#    run-time `InGameAssert.Skip` guards, and that table is where a measured number is
#    allowed to exceed the derivation. The id has correspondingly LEFT
#    INTERIM_PIN_IDS: an interim pin that outlives its first flight is a weakening.
#
#    RE-MEASURE, DO NOT RE-GUESS. Both numbers are properties of the RIG plus the
#    guards. If `build_logi_craft.py`'s assumptions A4 (inventory probe order) or A5
#    (resource floors) ever move, or a guard is added, this pin and the MEASURED_SKIPPED
#    entry move TOGETHER and only off a fresh log.
#
#  - failed=0 is the ASSERTION, pinned hard as on every batch spec. A reading run may
#    legitimately discover that a cell SKIPS; a cell that FAILS is a finding either
#    way.
#
#  - scene=FLIGHT is the fixture's Focusable route (the rig is the active vessel and
#    LoadGame carries no `scene=` argument) and is LOAD-BEARING: at SPACECENTER the
#    split inverts entirely and the batch would run H34's 2-cell slice. Pinning the
#    scene ON the tally line is the B10 fail-open guard.
#
# THE BASELINE-SLOT LITERAL IS 38, NOT 47 and NOT 46. The runner logs
# `ordered.Count(t => t.RestoreBatchFlightBaselineAfterExecution)` over the ADMITTED
# batch (InGameTestRunner.PrepareBatchFlightRestoreExecution) - the 38 restore-flagged
# Logistics declarations, every one of them Scene = FLIGHT, so all 38 survive scene
# eligibility. The other 8 admitted cells are batch-eligible outright and carry no
# restore flag. That line is emitted ONLY by PrepareBatchFlightRestoreExecution, which
# RunCategory never calls at all, so it is proof of the ISOLATED entry point
# INDEPENDENT of the tally - and only if N is a LITERAL: a `[0-9]+` there is satisfied
# by a batch that admitted a completely different population, which is why the group
# test demands the literal.
#
# THE SEAM ECHO is the third pin and the canary for the provisioning trap: the harness
# flies the `automation/stock-minimal` instance, NOT the one `dotnet build` deploys to,
# so this line's ABSENCE means a stale Parsek.dll rather than a Parsek regression. It
# is emitted by ParsekTestCommandAddon.RunTestsImpl on the exact step this driver
# sends.
#
# TWO CELL TOKENS, AND ONLY TWO. The reading run produced 39 `PASSED:` lines and it
# would be easy to pin all 39; that would be a MIRROR OF THE TALLY, not extra evidence
# - `passed=39 failed=0` already reds if any one of them stops passing, so 39 more
# tokens buy exactly one thing the tally lacks (naming WHICH cell) at the cost of 39
# lines that must be re-verified on every source touch. The two below are pinned
# because each names a MECHANISM that a green-looking tally could plausibly reach
# without, and both are quoted from run 2's bytes:
#
#  - THE D4-FIX GUARD. Run 1's product defect was the harvest poll not being
#    rails-gated for surface vessels, plus the rails-exit funnel flag being consumed
#    by any no-transition poll and never re-armed. The fix (f98d5477a) is only
#    OBSERVABLE as a funnel close whose trigger is the rails exit itself. Run 2 emits
#    it (`KSP.log:14803`, and it is the ONLY `trigger=rails-exit` line in the log -
#    the other three funnel consumptions all read `trigger=toggle`):
#      [LOG 21:34:40.073] [Parsek][VERBOSE][Recorder] Harvest funnel consumed at
#      transition: trigger=rails-exit transition=Close anyActive=0 vessel='Logi Cargo
#      Rig' pid=2200110038 recVessel=2200110038 ut=27.78
#    The pinned prefix stops before `vessel=` because pid and ut are per-run. STRICTLY
#    REDUNDANT WITH THE TALLY - if the funnel regresses,
#    `HarvestCapture_WarpToggle_RebaselinesAtRailsTransitions` fails and `failed=0`
#    reds - and pinned anyway, because it is the one token that says WHY. A regression
#    here reads as "the rails funnel is gone", not as "something in Logistics broke".
#    This token requires `verboseLogging=true` (the driver sets it): the line is Verbose.
#
#  - THE SILENT-EMPTY GUARD. `InventoryPayloadIdentityHash_LiveStockMove_
#    PreservesIdentity` is the ONE cell whose state differs between the two runs
#    (SKIPPED in run 1, PASSED in run 2) and the reason is a failure MODE rather than a
#    behaviour: its stored-part finder reflected on the internal `KeysList`, which
#    resolves silently null under Public-only binding, so the cell self-skipped and the
#    tally simply read one lower. That whole class - a reflection probe that degrades
#    to empty instead of throwing - is invisible to `failed=0`. Pinning the PASS echo
#    makes the skip direction red. Verbatim (`KSP.log:26409`):
#      [LOG 21:36:33.383] [Parsek][VERBOSE][TestRunner] PASSED:
#      LogisticsRouteProofRuntimeTests.InventoryPayloadIdentityHash_
#      LiveStockMove_PreservesIdentity (36.4ms)
#    The `(36.4ms)` duration is deliberately NOT pinned.
#
# NEGATIVE CONTROL, and it is free because run 1's log is committed alongside run 2's.
# Re-run the five patterns against
# `harness/results/2026-08-28_1802_H38-logistics-isolated_shots/KSP.log` (the PRE-fix
# run): the two structural tokens still match once each - they are properties of the
# entry point, not of the fix - and the tally plus BOTH cell tokens match ZERO times.
# So each of the three tokens this commit tightened or added genuinely discriminates
# the fixed state from the state run 1 measured, rather than matching whatever a
# Logistics batch happens to print.
required  = [
  "runtests start category=Logistics isolated=true",
  "Using batch baseline slot .* for 38 restore-after-run test\\(s\\)",
  "BATCH_COMPLETE v1 total=47 passed=39 failed=0 skipped=8 category=Logistics scene=FLIGHT",
  "Harvest funnel consumed at transition: trigger=rails-exit transition=Close anyActive=0",
  "PASSED: LogisticsRouteProofRuntimeTests\\.InventoryPayloadIdentityHash_LiveStockMove_PreservesIdentity",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# Budget arithmetic (M-A5 S8), and it is the deferred worst case rather than an
# estimate of the batch. run.py gives EVERY deferred seam verb
# `required_step_wait(max(step budget, SEAM_FALLBACK_DEFERRAL_SECONDS=600))` = 660 s
# regardless of the declared step budget, and BOTH LoadGame and RunTests are deferred -
# so the worst case is 660 + 660 = 1320. 1400 clears it.
#
# The headroom matters more here than on any prior isolated spec. H21's batch was 2
# quickloads and measured 29.6 s; R7a's was 6 and measured ~68 s wall. This one admits
# 38 restore-flagged cells, i.e. ~38 real FLIGHT scene reloads plus a baseline prime,
# on a 6-part craft. A slow or wedged restore is the plausible failure mode, and a
# KILLED run prints NO tally at all - which is strictly worse than waiting, because
# the tally is the entire product of a reading run.
#
# MEASURED AND KEPT: run 1 wall 170 s, run 2 wall 250 s (the run that executed the full
# 39; run 1's two failures short-circuited earlier cells' restores). Both are far under
# 1400, so the number is now known-generous rather than a guess - and it stays where it
# is. The budget covers the DEFERRED WORST CASE (660 + 660), not the observed wall, and
# trimming it to hug 250 s would convert a slow-restore run into a KILLED run with no
# tally, which is exactly the outcome this arithmetic exists to avoid.
budgetSeconds = 1400

[retry]
policy = "once"

[expectedFail]
bugId = ""
