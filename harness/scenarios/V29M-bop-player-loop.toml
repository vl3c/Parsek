schema = 1
id = "V29M-bop-player-loop"
# =====================================================================================
# V29M-bop-player-loop: THE BOP REPLAY LANE (roadmap G9, coverage wave 11). The V16M player-loop
# shape, one cycle, on `bop-orbit-recorded` - the B34 harvest (run `2026-09-25_2346`): a Jool-rooted
# recording that transfers inward from B22's 584,321 km park and captures around
# Bop. The lane arms loop playback on that tree, jumps across the replayed
# Jool->Bop seam and into the replayed park, dwells, and requires the two replay
# witnesses V16M uses on Laythe: the ghost's map orbit line drawn in Bop's frame
# (`phase=body-orbit surface=ProtoOrbitLine ... body=Bop`) and the seam-endpoint
# census finding every replayed SOI-entry endpoint inside Bop's sphere
# (`outsideSoi=0`). That pair is what "a recording replays correctly around Bop"
# means here, and it is what claims D14 `bop`.
#
# THE JUMP TABLE, derived off the fixture's own bytes with V16M's recipe (the same
# derivation reproduces V16M's committed jumps to the second on `laythe-orbit-recorded`):
#   UT0 (explicitStartUT)  27,787,320.680
#   explicitEndUT          29,537,422.363      span 1,750,101.684 s
#   save UT (FLIGHTSTATE)  29,537,424.843
#   Jool->Bop seam      29,535,228.746      offset 1,747,908.067
#   last Bop segment end 29,537,134.143  (parked tail 288.220 s)
#   P(Bop)              544,507.433 s
#   phaseAnchorUt = UT0 + k*P, k = ceil((max(saveUT, endUT) - UT0)/P) = 4
#                 = 29,965,350.410
#   seam bracket -180 / -60 / +140  -> 31713078 / 31713198 / 31713398
#   park epoch   anchor + seam offset + (last segment end - seam) + 0.707 * tail
#                -> 31715368  (84.4 s clear of the recording's end)
# THE RE-PIN RECIPE: read `phaseAnchorUt=` off `missionconfig applied:` and
# `relaunchUt=` off `startloopplayback initiated:`; every jump is anchor-relative.
# ARMED off reading run `2026-09-26_0012`: PASS attempt 1. The product
#   echoed phaseAnchorUt=29,965,350.354 against the derived 29,965,350.410 (0.056 s),
#   cadence 1,750,103 -> 2,178,030 = 4*P, and printed `[Orbital(Bop) same-parent ...
#   off=1747908.107]`, `PhaseLock APPLIED ... method=single-orbital ... zeroDrift=no`
#   (the inclined, eccentric moon still routes single-orbital, as Gilly did),
#   `factory chain ... reaimed=False`, `Split summary ... seamSkipped=0
#   exoCoastBodyChangeKept=1`, seven ProtoOrbitLine lines with body=Bop and
#   `seam-endpoint summary evaluated=2 outsideSoi=0`; saveParse read 1 recording, 396
#   points, every rewind facet 0.
# =====================================================================================
tier = "operator"
description = "THE BOP REPLAY LANE (G9, coverage wave 11): V16M's player-loop shape, one cycle, on `bop-orbit-recorded` (B34 run `2026-09-25_2346`, a Jool-rooted recording captured around Bop). Arms loop playback, jumps across the replayed Jool->Bop seam and into the replayed park, dwells, and requires V16M's two replay witnesses on Bop: the ghost's map orbit line drawn in Bop's frame and the seam-endpoint census with every replayed SOI-entry endpoint inside Bop's sphere. Claims D14 `bop`."
instanceProfile = "stock-minimal"
tags = ["V29", "player-loop", "loop-playback", "bop", "jool", "same-parent", "moon",
        "jool-moon"]

[fixture]
saveTemplate       = "fixtures/saves/bop-orbit-recorded"
injectedRecordings = "none"
craft              = []

