# CI-10: the player spawns a ghost chain's tip through Real Spawn Control, goes back to the
# Space Center and recovers the spawned vessel from its SPACE CENTER VESSEL MARKER (open the
# marker, press Recover) without entering the Tracking Station; the recovered vessel must not
# come back. The third player recovery route, beside CI-6 (flight Recover after a Switch-To)
# and CI-7 (Tracking Station Recover).
#
# WHAT IT PROVES: the KSC marker route (stock KSCVesselMarkers.RecoverVessel ->
# ShipConstruction.RecoverVesselFromFlight, onVesselRecovered with quick=false, no confirm, no
# scene change) reaches the same non-economic VesselRecovered ledger row for the committed tip,
# and the next flight's spawn-death pass reads that row and clears the spawn claim instead of
# respawning the lander. Todo SPAWNED-VESSEL-RECOVERED-OUTSIDE-FLIGHT-RESPAWNS-ON-SANDBOX.
#
# FLOWN 2026-10-04 (branch `recover-mirror-flights`): reading `2026-10-04_1349` PASS attempt 1
# (every verifier PASS); the census block was armed off its facets.
#
# HOST: `gloops-airshow` + the `chain-tip-recovery` preset, exactly CI-6's / CI-7's:
# `ctr-tip-rec`, `CTR Lander`, pid 1344998135, a live chain tip ~130 m from the pad vessel,
# landed on Kerbin, so stock gives it a Space Center marker.
#
# ACT 1 (flight): RealSpawn the chain tip (chain-tip spawn keeps the original pid and launch
# guid), then ExitToSpaceCenter (no active tree: autoRecordOnLaunch is off).
# ACT 2 (Space Center): KscMarkerRecover pid=${spawn.pid} - find the lander's marker, open it,
# press its Recover; close the recovery summary if stock opens one.
# ACT 3: GoToEditor SPH + LaunchFromEditor; the new flight's spawn-death pass meets the tip
# whose spawned vessel is gone.

schema = 1
id = "CI-10-chain-tip-ksc-marker-recover-no-respawn"
# 2026-10-07 (todo HARNESS-FAST-POLLS-SHRINK-INERT-STEP-WAITS, branch `scene-wait`): the
# 1x waits this lane sized in inert seam steps (0.25 s each at the old poll; one frame
# since PR #2017) are `WarpToUT maxRate=1` waits to explicit UTs, deterministic in
# FLIGHT, the Space Center and the Tracking Station since TC-1. Spec changed, not
# re-flown.
tier = "nightly"
description = "The Space Center marker half of a recovered chain tip: over gloops-airshow plus the chain-tip-recovery preset, RealSpawn the tip, exit to the Space Center, recover the spawned uncrewed lander through its stock KSC vessel marker (sandbox: no funds row, no crew row), then launch a new flight from the SPH and require that the recovered lander does not spawn again."
instanceProfile = "stock-minimal"
tags = ["CI-10", "D18", "chain-interaction", "ghost-chain", "real-spawn", "recover",
        "ksc-marker", "injected-recordings", "R10", "runtime-handles", "kerbin", "sandbox"]

[fixture]
saveTemplate       = "fixtures/saves/gloops-airshow"
injectedRecordings = "chain-tip-recovery"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # The supported shape for a scene-exit verb: no merge modal can stand at the exit.
  { cmd = "SetSetting", args = { name = "autoMerge", value = "true" }, expect = "OK" },
  { cmd = "ListHandles", args = { kind = "chains" }, label = "chains", expect = "OK" },
  # THE SETTLE: the proximity scan admits a row only on its second sighting, 1.5 s apart.
  # Eight inert steps (~2 s) were too few on the first reading run (`realspawn-not-a-candidate
  # candidates=0` 130 ms before the `Proximity notification`); twenty buy ~5 s.
  # 1x FLIGHT time to UT 27: the proximity scan admits a row on its second sighting 1.5 s apart; ~5 s after the save UT 21.16 (20 inert steps before 2026-10-07: since PR #2017 one costs a
  # frame, not the 0.25 s poll; todo HARNESS-FAST-POLLS-SHRINK-INERT-STEP-WAITS).
  { cmd = "WarpToUT", args = { ut = "27", maxRate = "1" }, expect = "OK", budget = 120 },
  # ACT 1: RealSpawn, then back to the Space Center.
  { cmd = "RealSpawn", args = { rec = "${chains.chain0tip}" }, label = "spawn", expect = "OK", budget = 120 },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "ExitToSpaceCenter", expect = "OK", budget = 120 },
  # ACT 2: the stock Space Center marker recovery. The verb polls for the marker itself
  # (stock spawns the markers 15 frames after the scene loads).
  { cmd = "KscMarkerRecover", args = { pid = "${spawn.pid}" }, expect = "OK", budget = 60 },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c1", expect = "OK" },
  { cmd = "MissionMark", args = { label = "ctr-ksc-recovered-count-${c1.count}" }, expect = "OK" },
  # ACT 3.
  { cmd = "GoToEditor", args = { facility = "SPH", craft = "Kerbal X" }, expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor", expect = "OK", budget = 180 },
  { cmd = "ListHandles", args = { kind = "chains" }, label = "chains2", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c2", expect = "OK" },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# D14 values only (each already covered elsewhere). No D18 claim: the chain is NOT terminated
# here (the committed tip keeps Landed; the recovery lives in the ledger row), so this lane is
# not a `chain-terminated-destruction-recovery` witness - CI-6 holds that half.
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

# The two injected recordings; the committed tip keeps Landed (a live event never re-stamps a
# committed recording), the recovery lives in the ledger row.
[expectations.recordings]
count = { min = 2, max = 2 }

# ARMED 2026-10-04 off the reading `2026-10-04_1349` (trees / committedTrees 1, recordings 2,
# Landed 1 / SubOrbital 1, spawnedVessels 0, no `CTR Lander` in the save; CI-7's windows).
[expectations.recordings.structure]
gating         = true
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 2, max = 2 }
terminalStates = { Landed = { min = 1, max = 1 }, SubOrbital = { min = 1, max = 1 } }
spawnedVessels = { min = 0, max = 0 }
vesselNames    = { "CTR Lander" = { min = 0, max = 0 }, "mk1-capsule" = { min = 1, max = 1 } }

[expectations.logContracts]
required  = [
  # Boot: the walker claims the lander via BACKGROUND_EVENT and builds a live chain.
  "\\[ChainWalker\\] Chain built: vessel=1344998135 links=1 tip=ctr-tip-rec spawnUT=622\\.2 terminated=False",
  # Act 1: Real Spawn Control spawns the chain tip with its original pid.
  "\\[Ghoster\\] Chain tip spawn: pid=1344998135 vessel=CTR Lander preserveIdentity=true",
  "realspawn complete rec=ctr-tip-rec pid=1344998135 vessel=CTR Lander ",
  # Act 2: the stock KSC marker recovery (stock fires onVesselRecovered with quick=false).
  "kscrecover pressed pid=1344998135 vessel=CTR Lander ",
  "kscrecover observed onVesselRecovered pid=1344998135 vessel=CTR Lander quick=false",
  "kscrecover complete pid=1344998135 vessel=CTR Lander scene=SPACECENTER quick=false ",
  # THE FIX, half 1: the recovery is recorded against the committed tip.
  "\\[LedgerOrchestrator\\] Vessel recovered recorded: vessel='CTR Lander' pid=1344998135 recoveryUT=[0-9.]+ recordingId=ctr-tip-rec terminal=Landed ",
  # Act 3: a new flight scene.
  "launchfromeditor complete scene=FLIGHT vessel=Kerbal X ",
  # THE FIX, half 2: the spawn-death pass reads the recovery, not a death.
  "\\[Policy\\] Spawned vessel recovered: #[0-9]+ \"CTR Lander\" pid=1344998135 evidence=recovery-row - spawn claim cleared, no respawn",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "realspawn rejected",
  "kscrecover rejected",
  # The vessel's recovery must reach the ledger, not be skipped as programmatic.
  "Vessel recovery row skipped: vessel='CTR Lander'",
  # THE DEFECT: the recovered lander read as dead and spawned again.
  "\\[Policy\\] Spawn-death detected: #[0-9]+ \"CTR Lander\"",
  "\\[Spawner\\] Vessel spawn for #[0-9]+ \\(CTR Lander\\)",
]

[runtime]
budgetSeconds = 1800

[retry]
policy = "once"
