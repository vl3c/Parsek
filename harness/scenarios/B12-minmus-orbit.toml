# =============================================================================
# MISSION PROFILE - full ordered step list with the per-phase VEHICLE
# CONFIGURATION contract. IDENTICAL to B11-mun-orbit.toml's profile (the same
# mlib.b5_decide machine with captureEnabled, the same craft, the same phase
# order); only the target body and the numbers below differ. Read the B11 spec
# header for the full per-phase vehicle-configuration contract - it is not
# duplicated here so the two cannot drift.
#
#   PRELAUNCH -> MJ-ASCENT -> CIRCULARIZE -> ORBIT -> PLAN-TRANSFER ->
#   TRANSFER-BURN -> COAST-TO-TARGET (2 correction rounds) -> TARGET-FLYBY
#   (capture arming; SOI-exit warp SUPPRESSED) -> PLAN-CAPTURE -> CAPTURE-BURN
#   -> PARK (throttle cut, nodes cleared, SAS + RCS held, rails 1x, held dwell)
#   -> ORBIT-COMMIT (mid-mission seam CommitTree) -> ORBIT-COMMITTED
#
# VEHICLE CONFIGURATION, same as B11: the stock Kerbal X flies as one stack with
# no deliberate separation phase; the flameout-staging watchdog (B5 finding 15)
# is the only staging, and it fires only on OBSERVED zero available thrust under
# a commanded burn, capped at MAX_FLAMEOUT_STAGES. Leaving the Minmus SOI from
# TARGET-FLYBY onward is an ASSERT-FAIL, never a RETURN terminal.
#
# CAPTURE-BURN EXECUTOR SUPERVISION + MECHJEB'S PRE-IGNITION HOLD, inherited
# VERBATIM from B11 (the fix landed in the shared mlib machine, so it is body
# -independent - read the B11 spec's CAPTURE-BURN block for the full decompile
# citation). The short version: MechJeb's NodeExecutor deliberately holds at 1x
# with a ZERO throttle and an UNCHANGED orbit for up to 600 GAME seconds before
# ignition when the craft is not AlignedAndSettled, which is byte-for-byte the
# static-at-1x no-start signature; the node's own clock disambiguates it, and
# an OBSERVED NodeExecutor.Enabled channel (readNodeExecutor=True on this
# mission's control) is what actually proves the executor engaged. Named
# fast-fails: capture-executor-not-enabled, capture-window-missed,
# capture-executor-no-start, capture under-burn.
#
# CORRECTION-BURN IS WARP-DOMINATED HERE, AND THAT IS NOT BUDGET TIME (B12
# flight 1, 2026-07-25 - the defect this mission FOUND, in the SHARED B5/B6
# machine). The DIY burner aims first, then natively warps to
# node_ut - nodeArrivalMarginSeconds before throttling, so the phase's length is
# set by where MechJeb put the node. On the Mun that is ~3,000 game seconds; on
# MINMUS flight 1 measured 73,733 (phase entry ut 475.3, node ut 74,208.3)
# against a 4,000 s transferBurnTimeoutSeconds, so the phase timed out mid-warp
# EVERY time by construction. The budget now bounds the BURN: it is suppressed
# while the aim-warp is in flight and re-anchors at the warp ARRIVAL (the same
# seam that already re-anchored the no-start clock), leaving ~22 game seconds of
# real work against 4,000. Expiry is NAMED (correction-burner-no-start /
# correction-burn-incomplete) and every round give-up carries a corrGiveup
# reason. NOTE for the operator reading this spec: B6-minmus-flyby shares the
# machine, the correction params AND this budget, and its live proof predates
# the change that broke them - it owes a confirmation re-fly.
#
# THE COAST WARPS CONTINUOUSLY, ONCE (B12 flight 2, 2026-07-25 - the second
# defect this mission FOUND, again in the SHARED B5/B6/B7 machine). The coast
# derives its native warp target from time_to_soi every poll, and KSP cannot
# read the patched-conic SOI time while it is re-patching under a warp ramp,
# so the machine kept cancelling its own warp on the blind read and re-arming
# on the next (unwarped) poll: 3,603 warp_to_ut issues, 3,602 cancels, a rails
# rate that never escaped ~2.7x, and ~40 game-seconds per wall-second for a
# coast that needs 193,416 of them. The target is an ABSOLUTE UT, so a blind
# read UNDER WARP now HOLDS the armed command; only a blind read with the game
# NOT warping is evidence the encounter is gone. A coast that fights itself
# past MAX_COAST_WARP_ISSUES fast-fails NAMED (coast-warp-thrash). The mission
# result also carries a per-phase warpUtilisation block whose
# gameSecondsPerWallSecond names this class in one line.
#
# TARGET-FLYBY MAY NOT WARP PAST PERIAPSIS (B12 flight 3, 2026-07-25 - the third
# defect this mission FOUND, again SHARED). Capture mode suppresses the SOI-EXIT
# native warp and used to fall through to the rails flyby stair, whose factor is
# floored at flybyWarpFactor and whose distance term is (altitude - periapsis) -
# nothing in it is bounded by the periapsis CLOCK. Compounded by a COAST ->
# TARGET-FLYBY handoff that emitted no warp cleanup, flight 3 crossed into the
# Minmus SOI still running the coast's RAILSx10000 warp: its FIRST flyby poll
# advanced 3,907 game seconds (alt 1,902 km -> 977 km), the 3-frame arming
# debounce cost ~8,000 more, and PLAN-CAPTURE was entered at alt 41,609 m with
# vertical speed +92 m/s - already CLIMBING AWAY. The late burn produced a bound
# but wildly eccentric 325 x 5.3 km orbit grazing Minmus, correctly rejected by
# the capture window. FIXED: the only legitimate warp target inside the target
# SOI is periapsis_ut - CAPTURE_PERIAPSIS_WARP_LEAD_SECONDS (900, sized to cover
# our arming + plan, MechJeb's halfBurnTime ignition lead AND its 600 s
# pre-ignition hold), read from Orbit.TimeToPeriapsis; past the bound or with the
# clock unreadable the machine does not warp at all; and the handoff stops the
# inherited coast warp on the transition frame.
# =============================================================================
schema = 1
id = "B12-minmus-orbit"
# FLIGHT 3 (2026-07-25) - the coast fix WORKED SPECTACULARLY and the mission
# reached a capture burn. The warp-utilisation block diagnosed the next defect at
# a glance: COAST-TO-TARGET 26 wall / 194,704 game (ratio 7,543, 3 warp commands,
# down from never-finishing), CORRECTION-BURN 40 wall / 73,723 game (ratio 1,834,
# 1 command) - but TARGET-FLYBY 2 wall / 8,213 game (ratio 5,341, 2 commands),
# which is the phase blowing through periapsis. Result: ASSERT-level capture
# under-burn (ap=324,973 pe=5,267 ecc=0.710), correctly rejected. Fixed by the
# periapsis bound above.
#
# FLIGHT 2 (2026-07-25) - the correction fix WORKED (both rounds cleared,
# rounds=2, round 1's 73,720 game-second aim-warp ran as one continuous warp
# from ut 475.3 to 74,195.7 with no cancel), and the run then died on the WALL
# budget inside COAST-TO-TARGET at ut 225,990 with 41,655 game seconds still to
# go - the warp-thrash defect described above. Fixed; flight 3 is the first run
# whose coast actually warps.
#
# FLIGHT 1 (2026-07-25) - FLAKE at CORRECTION-BURN, wall 286 s, UPSTREAM of the
# capture tail: PRELAUNCH, MJ-ASCENT, CIRCULARIZE, ORBIT, PLAN-TRANSFER,
# TRANSFER-BURN (clean, ap 48,823,627 m), COAST-TO-TARGET, PLAN-CORRECTION,
# CORRECTION-BURN. The correction node planned fine and TINY (nodeDv 13.301) and
# was never burned - the flake was the shared aim-then-warp budget defect
# described above, fixed in mlib. The capture / park / commit tail is STILL
# unproven on this body; flight 2 is its first real attempt. Fly B11 FIRST when
# re-baselining - it is the shorter coast, so it prices the capture tail in ~20
# wall-minutes instead of ~30, and every B11 finding transfers here unchanged
# (the B5 -> B6 relationship, repeated). B11 is LIVE-PROVEN as of 2026-07-25.
#
# ID NOTE: see B11-mun-orbit.toml. The roadmap's informal "B8" label for this
# lane collides with the catalog's existing B8/B9/B10 rows, so the ORBIT lane is
# B11 (Mun) + B12 (Minmus).
tier = "nightly"
description = "Minmus ORBIT / commit-in-target-orbit: the B11 machine and craft with targetBodyName=Minmus -- MechJeb ascent, Hohmann transfer, autowarped burn, dv-capped corrections, ~9-day cross-SOI coast, CAPTURE burn inside the Minmus SOI, a held stable park, and a mid-mission command-seam CommitTree that closes the tree WHILE PARKED IN THE FOREIGN SOI."
instanceProfile = "stock-minimal"
tags = ["B12", "orbit", "mechjeb", "minmus", "cross-soi", "capture", "commit-in-foreign-soi", "pending-flight"]

[fixture]
# Same committed Kerbal X fixture as B2/B4/B5/B6/B11.
#
# DELTA-V FEASIBILITY: ~1500-1600 m/s after the 80 km circularization. Minmus
# transfer ~930 m/s + up to ~340 m/s of corrections + the capture. Minmus
# capture is CHEAP (mu 1.766e9, R 60 km): from a v_inf ~100 m/s arrival it is
# ~80 m/s at a 30 km periapsis and ~70 m/s at B6's observed 512 km arrival.
# Worst case ~1,350 m/s - the same margin B11 has, and B6 already flew the
# transfer half of it. PROVISIONAL: flight 1 measures the real margin.
saveTemplate       = "fixtures/saves/b2-lko-craft"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
# Thin alias over the body-parameterized B5 machine with captureEnabled (see
# b12_minmus_orbit.py); the flight differs from B11 only in these params.
mission = "b12_minmus_orbit"

# `steps` MUST stay in the [driver] table (above the [driver.missionParams]
# header).
#
# COMMIT ACCOUNTING: exactly ONE commit, the MID-MISSION seam CommitTree the
# machine fires from ORBIT-COMMIT. NO post-mission CommitTree - the seam's
# CommitTreeImpl returns ERROR `no-active-tree` when no tree is live, which is
# the expected post-commit state. Same FIRST-FLIGHT-TO-CONFIRM as B11: only add
# one if the flight shows Parsek opening a fresh tree after the commit.
#
# BUDGET ARITHMETIC. Base = the MEASURED B6 flight on this same machine and
# fixture (wall 1167 s; the ~46,400 km Minmus transfer is ~9 days of game time,
# so it costs more rails hops than the Mun's ~1-2 days). The ORBIT tail adds
# roughly the B11 amounts, EXCEPT the capture coast: Minmus's SOI edge is
# ~2,187 km up but its arrival speeds are ~5x lower than the Mun's, so the
# SOI-entry -> periapsis coast is ~10-20 GAME hours instead of 1-3 - more warp,
# but the executor's autowarp covers it in comparable wall time (~200 s).
#   2x CORRECTION-BURN             ~255 wall (MEASURED spans from flight 2: round
#                                   1 covers ut 475.3 -> 74,195.7 = 73,720 game
#                                   seconds of aim-warp plus a ~20 s burn; round 2
#                                   is 32 game seconds. Priced at a conservative
#                                   250-400 game-s per wall-second)
#   COAST-TO-TARGET                ~700 wall (MEASURED span: ut 74,228 -> the
#                                   267,645 SOI-lead target = 193,416 game
#                                   seconds. At Kerbin altitudes of 8,000-49,000
#                                   km the 100,000x rails tier is legal, so a
#                                   CONTINUOUS native warp_to costs seconds of
#                                   steady state; priced pessimistically at
#                                   250-400 game-s per wall-second = 484-774 wall.
#                                   Flight 2's THRASHING coast managed ~40 and
#                                   would have needed ~5,240 wall for the same
#                                   span, which is what killed it.)
#   capture arming + PLAN-CAPTURE  ~30 wall
#   CAPTURE-BURN                   ~800 wall (~200 for the autowarped coast PLUS
#                                   the ~600 wall MechJeb pre-ignition hold that
#                                   B11 flight 1 MEASURED; the old ~200 estimate
#                                   predates that discovery)
#   PARK                           ~200 wall (180 game-s at 1x)
#   ORBIT-COMMIT                   <1 wall typical, 120 worst (seam poll bound)
# => 286 (ascent + transfer, MEASURED flight 1) + 255 + 700 + 30 + 800 + 200 + 5
# = ~2,280 wall expected nominal, RE-DERIVED bottom-up from flight 2's measured
# phase spans rather than from B6's pre-fix 1167 s. WORST case adds one bounded
# stale-node capture re-plan (+90 wall grace, a re-planned coast, a SECOND ~600
# wall pre-ignition hold) => ~3,100. missionBudget stays 4200 (WALL) - ~1.8x
# nominal, ~1.35x worst - and runtime stays 4700 (>= 240 LoadGame + ~5
# SetSetting + 4200 mission + ~60 FlushAndQuit + ~195 margin, SF-5). The budget
# is deliberately NOT raised for the warp defect: the defect was the warp, not
# the budget, and with a continuous coast warp the two 1x HOLDS (MechJeb's
# ~600 s pre-ignition WARPALIGN and the 180 s park dwell) are now the dominant
# wall cost, not the coast. Phase budgets in missionParams are GAME time.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 4200 },
  { cmd = "FlushAndQuit",                                        expect = "OK" },
]

# Ascent half = B2's proven tolerances verbatim; transfer half = B6's proven
# shape (validated against b12_minmus_orbit.schema.toml).
[driver.missionParams]
targetApoapsisMeters       = 80000
targetPeriapsisMeters      = 80000
apoErrorMeters             = 5000
periErrorMeters            = 5000
ascentTimeoutSeconds       = 420
circularizeTimeoutSeconds  = 300
targetBodyName             = "Minmus"
homeBodyName               = "Kerbin"
# Minmus orbits at ~46,400 km; a transfer burn that raised apoapsis past
# 40,000 km is unambiguous burn evidence (floor, not a window).
transferMinApoapsisMeters  = 40000000
# B6's LIVE-PROVEN value, deliberately unchanged. B6's status row flags 20 km as
# predating finding 16d and names ~150 km as the re-target IF it reds - but B6
# has not red, and its measured arrival was 512 km, which is a fine capture
# altitude (well clear of the ~5.7 km peaks and cheap to circularize at). Reuse
# the proven number; re-target only on measured evidence, never speculatively.
courseCorrectPeriapsisMeters = 20000
maxCorrectionDvMps         = 300
# Two rounds: post-TLI + a mid-coast refinement at 20,000 km.
correctionTriggerAltsMeters = [0, 20000000]
planTimeoutSeconds         = 300
planRetrySeconds           = 10
transferBurnTimeoutSeconds = 4000
coastTimeoutSeconds        = 2000000
flybyTimeoutSeconds        = 400000
coastWarpFactor            = 6
flybyWarpFactor            = 5
flybyMaxWarpFactor         = 6
nodeArrivalMarginSeconds   = 15
planWarpFactor             = 2
soiLeadSeconds             = 30
flipPhysicsWarpFactor      = 1
# Min-altitude floor across the WHOLE in-SOI stay (arrival AND park). B6's 6 km
# value: Minmus has ~5.7 km peaks.
targetPeriapsisFloorMeters = 6000

# --- ORBIT TAIL -------------------------------------------------------------
captureEnabled             = true
capturePlanTimeoutSeconds  = 300
# CAPTURE-BURN budget (GAME seconds), MUCH larger than B11's: Minmus's SOI edge
# is ~2,187 km up and its arrival / orbital speeds are ~5x lower than the Mun's,
# so the executor's SOI-entry -> periapsis autowarp coast is ~10-20 GAME hours
# (36,000-72,000 s), not 1-3. 200,000 is ~3x the worst case - a SLOW bound; the
# executor-not-enabled, window-missed, no-start and under-burn watchdogs bound
# BROKEN. PROVISIONAL pending flight 1.
captureBurnTimeoutSeconds  = 200000
# THE CAPTURE WINDOW (also the PARK gate). Wide, same rationale as B11, sized
# for Minmus: the observed B6 arrival was 512 km, the peaks are ~5.7 km, and the
# SOI edge is ~2,187 km up - so 10 km to 1,500 km altitude is a legitimate
# captured Minmus orbit, with the ceiling keeping the park clear of the SOI edge.
# The apoapsis ceiling is the load-bearing conjunct (a hyperbolic approach reads
# a NEGATIVE apoapsis).
parkMinPeriapsisMeters     = 10000
parkMaxApoapsisMeters      = 1500000
parkMaxEccentricity        = 0.25
parkMaxAngularVelocityRadPerSec = 0.05
parkSituations             = ["ORBITING"]
# Same 180 game-s held dwell as B11 (the recorded in-foreign-SOI coverage).
parkDwellSeconds           = 180
parkDebounceFrames         = 3
parkTimeoutSeconds         = 600
commitTimeoutSeconds       = 300

# Coverage: B11's cell set on the minmus axis. D1 commit-in-foreign-soi is the
# NEW registry value this lane adds (harness/coverage/registry.toml, same
# change).
[dimensionsCovered]
D1  = ["auto-record-launch", "commit-in-foreign-soi"]
D3  = ["orbital-checkpoint"]
D4  = ["atmospheric", "exo-propulsive", "exo-ballistic", "cohesive-cross-body-coast"]
D5  = ["bg-recording"]
D14 = ["kerbin", "minmus", "warp-rails"]

[expectations.recordings]
# STILL PROVISIONAL, but TIGHTENED 10 -> 9 on the SAME part-level derivation B11
# carries (2026-07-25); B12 flies the same fixture, the same craft and the same
# machine, so the topology is identical and only the target body differs. This
# window is the ONLY numeric guard on the run (logContracts are presence-only
# re.search), so it is the sum of enumerated sources and nothing more.
#
# DERIVATION (fixture fixtures/saves/b2-lko-craft, stock Kerbal X; part list read
# out of the fixture's persistent.sfs):
#   +1  root/main recording (mandatory - autoRecordOnLaunch true, and the
#       "Recording started" logContract already fails without it)
#   +6  the six radial boosters as parent-anchored debris children. LIVE-ESTABLISHED
#       by the first live B2 flight (2026-07-20): exactly 7 sidecars, analyzer RED=0.
#   +1  MARGIN for the ascent core stack separation surfacing as one more debris
#       child (B5 live finding 15, the zero-thrust stage pop). It did NOT record on
#       the B2 flight.
#   +1  MARGIN for a fresh post-commit recording for the still-orbiting vessel IF
#       Parsek opens one after the mid-mission CommitTree. Unestablished either way.
#   = 9
# RULED OUT: no launchEscapeSystem / escape-tower part exists anywhere in this
# fixture's part list, so the +1 LES margin B2/B4/B5/B6 carry is dead weight here -
# dropping it is exactly what takes 10 down to 9. The 3 launchClamp1 parts
# contribute 0 (they release on every flight and the B2 count was 7). The second
# Decoupler.2 (upper stage -> pod) never fires: B12 has NO separation phase and
# ends parked in the Minmus SOI with the stack intact.
#
# min stays 1 (the B2/B4/B5/B6 family rule): the main recording must exist even if
# debris ADMISSION varies flight to flight.
#
# PIN EXACTLY on the next green flight - the measured count now lands in
# results/<runId>.json at verifiers.expectations.observed.recordings.count
# (harness/lib/hlib.py observed_expectation_facets), so it no longer dies with the
# transient save a PASS never collects. The 2026-07-25 FULL-PASS flight predates
# that field, so it only establishes "<= 10".
count = { min = 8, max = 8 }  # PINNED from the measured green run:
# flight 5 (2026-07-25, wall 580 s) reported observed.recordings.count = 8 in its result JSON
# (the new expectations-observed field). Matches the derivation exactly: root 1
# + 6 radial boosters as parent-anchored debris children + 1 for the ascent core
# stack-sep surfacing as a debris child. Exact, not a window: the craft, the
# ascent and the step list are all fixed, there is no separation phase, and the
# single commit closes the tree in the target SOI. logContracts are presence-only
# (hlib.evaluate_expectations uses re.search), so this count is the ONLY numeric
# guard that the flight produced its full recording topology. Re-pin from a
# measured observed.recordings.count if a later run legitimately differs; never
# widen it blindly.

[expectations.logContracts]
# Same four tokens as B11, each sourced from its ACTUAL emitting ParsekLog call
# site (lifecycle pair; ParsekFlight.cs:13136 "CommitTreeFlight: starting tree
# commit at UT="; ParsekTestCommandAddon.cs:1520 "committree committed=true").
# Same FIRST-FLIGHT-TO-CONFIRM: no foreground SOI-change token could be sourced
# with certainty, so none is asserted.
required = [
  "Recording started",
  "Recording stopped",
  "CommitTreeFlight: starting tree commit at UT=",
  "committree committed=true",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

allowedAnomalies = []

[runtime]
budgetSeconds = 4700

[retry]
policy = "once"

[expectedFail]
bugId = ""
