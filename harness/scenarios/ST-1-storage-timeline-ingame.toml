schema = 1
id = "ST-1-storage-timeline-ingame"
tier = "nightly"
# WHAT THIS IS. The storage / timeline lane: one seam run on the earned career that
# drives two in-game categories as ONE multi-category batch:
#
#   Timeline  TimelineProjectionTests.TimelineProjectsEffectiveLedger - builds the
#             timeline from the Timeline window's exact inputs (ERS, ELS, milestones,
#             legacy visibility, live game mode) and checks it against the ELS: every
#             action is one row or a named design exclusion (route types only), no row
#             lacks a ledger action, UT-sorted, ineffective rows never T1, and every
#             action row is humanized into its own bucket (never LegacyEvent, never the
#             raw enum name).  (D15 timeline-projection)
#   Storage   StorageRuntimeTests - recording-id path validation on the live save's
#             ids (D16 path-validation) and the readable `.prec.txt` mirrors removed and
#             rewritten by the product's own reconcile pass, decoded back to the
#             recording's shape (D16 txt-mirrors). Its third cell, the rewind-point
#             quicksave read-back, self-skips here (this save has no RP) and runs on
#             ST-2-rewind-point-quicksave, which authors one.
#
# WHY THIS HOST. `career-earned-pad` (L4's host) is the richest committed ledger with a
# focusable FLIGHT craft: 16 ELS rows across science, funds, milestones, contracts, crew
# and one KerbalExperience row, plus two committed recordings whose sidecars and mirrors
# are on disk.
#
# NEGATIVE CONTROL, FLOWN. Run `2026-09-25_2039` (attempt 1) booted this host on the
# PRE-FIX DLL (sha256 69e5403b..., the same cells without the Timeline fix): the Timeline
# cell FAILED on exactly the defect it was written for - `unhumanizedRows=1`,
# `KerbalExperience@348.08 as LegacyEvent 'KerbalExperience'`, with the product's
# `Unknown GameActionType 'KerbalExperience'` WARN beside it - so its batch line read
# `total=1 passed=0 failed=1`, which the pin below rejects. (That run's own verdict was
# INVALID on an EvaExit step this spec no longer carries: stock spawnEVA refuses the
# Parsek stand-in on this pad, so the RP subject moved to ST-2.)
#
# READING RUN `2026-09-25_2043` (fix DLL sha256 ea2d667b..., same INVALID EvaExit step,
# batch executed whole) measured every token below; the pins are those numbers.
#
# writeReadableSidecarMirrors is set explicitly even though the harness settings
# baseline stamps it ON (players default OFF since 2026-09-26): the mirror cell must
# not depend on the baseline, and it restores whatever value it found.
description = "Run the Timeline and Storage in-game categories on the earned career: the timeline projects the effective ledger (every action one humanized row or a route exclusion, UT-sorted), recording-id path validation on the save's live ids, and the readable .txt mirrors reconciled off and on and decoded back."
instanceProfile = "stock-minimal"
tags = ["ST-1", "ingame-batch", "multi-category", "storage", "timeline", "career"]

[fixture]
saveTemplate = "fixtures/saves/career-earned-pad"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },            expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },        expect = "OK" },
  { cmd = "SetSetting",     args = { name = "writeReadableSidecarMirrors", value = "true" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },             expect = "OK" },
  { cmd = "RunTests",       args = { category = "Timeline,Storage" },                       expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                   expect = "OK" },
]

[dimensionsCovered]
D15 = ["timeline-projection"]
D16 = ["path-validation", "txt-mirrors"]
D14 = ["career", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 2, max = 2 }

[expectations.logContracts]
required = [
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=Timeline scene=FLIGHT",
  "BATCH_COMPLETE v1 total=3 passed=2 failed=0 skipped=1 category=Storage scene=FLIGHT",
  "timeline projection: els=16 expected=16 entries=19 actionRows=16 matched=16 foldedFacility=0 foldedMilestone=0 excludedRoute=0 excludedModeSeed=0 excludedZeroSpend=0 excludedEvaCrew=0 missing=0 unmatchedRows=0 orderBreaks=0 demotionBreaks=0 unhumanizedRows=0 mode=CAREER",
  "path validation on live save: rejected=47 invalidCharIds=39 acceptedRecordings=2 resolvedOnDisk=2 acceptedRewindPoints=0",
  "readable mirror round trip: recordings=2 deletedWhenOff=2 writtenWhenOn=2 roundTripped=2 vesselMirrors=2 settingRestored=True",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "Unknown GameActionType",
]

[runtime]
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
