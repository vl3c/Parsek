  "logContracts.required not matched: Ground part placed: tree member created part='DeployedSeismicSensor' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-14-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "logContracts.required not matched: Ground part placed: tree member created part='DeployedGoExOb' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-14-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "logContracts.required not matched: startrecording recordingId=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-14-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "logContracts.required not matched: \\[SpawnCollision\\] Overlap exempt: co-existing tree sibling spawn: site=",
  "logContracts.forbidden matched: Trajectory walkback EXHAUSTED",
  "logContracts.forbidden matched: Spawn ABANDONED",
  "logContracts.forbidden matched: Ground part placed: tree member created [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-[^\\r\\n]*-\\1-false-",
