[expectations.logContracts]
required = [
  "evaexit complete",
  "startrecording recordingId=[0-9a-f]+ already=false",
  "evagroundscience place start kerbal=Jebediah Kerman part=DeployedCentralStation slot=0 inventory=0:DeployedCentralStation",
  "evagroundscience take start kerbal=Jebediah Kerman part=DeployedRTG source=[^\\r\\n]* sourcePart=mk1-3pod sourceSlot=0 sourceInventory=0:DeployedRTG,1:DeployedSeismicSensor,2:DeployedGoExOb kerbalSlot=0 inventory=<empty> ",
  "evagroundscience take complete part=DeployedGoExOb [^\\r\\n]*sourceInventory=<empty>",
  "Ground part placed: tree member created part='DeployedCentralStation' vesselPid=[0-9]+ partPid=[0-9]+ rec=[0-9a-f]+ parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True",
  "Ground part placed: tree member created part='DeployedRTG' vesselPid=[0-9]+ partPid=[0-9]+ rec=[0-9a-f]+ parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True",
  "Ground part placed: tree member created part='DeployedSeismicSensor' vesselPid=[0-9]+ partPid=[0-9]+ rec=[0-9a-f]+ parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True",
  "Ground part placed: tree member created part='DeployedGoExOb' vesselPid=[0-9]+ partPid=[0-9]+ rec=[0-9a-f]+ parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True",
  # Every step move told the kerbal's CollisionEnhancer to skip its next frames (EVA-8
  # `2026-09-29_1618`: without it the anti-tunnelling guard put him straight back).
  "evagroundscience step move kerbal=Jebediah Kerman move=1 collisionEnhancersSkipped=[1-9][0-9]* skipFrames=[0-9]+ method=anchor-release\\+rb-pose ",
  # Every settled step stands with its feet on the ground collider (the operator watched a
  # step end half inside the ground on `_1931`): the set-down is a raycast onto layer 15.
  "evagroundscience step ground kerbal=Jebediah Kerman feetClearance=-?[0-9.]+ [^\\r\\n]*groundSource=raycast ok=true",
  # THE LAYOUT: every spot at its own compass bearing from the capsule (the bearing arg
  # reached the DLL; a build without it would walk Jeb along his own bearing instead).
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=13\\.00 [^\\r\\n]*bearing=60\\.0",
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=13\\.00 [^\\r\\n]*bearing=80\\.0",
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=13\\.00 [^\\r\\n]*bearing=100\\.0",
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=13\\.00 [^\\r\\n]*bearing=120\\.0",
  "evagroundscience step start kerbal=Jebediah Kerman anchor=[^\\r\\n]* to=4\\.00 [^\\r\\n]*bearing=270\\.0",
  # THE COMMIT: the player's scene exit, whose auto-commit runs the optimization pass.
  "exittospacecenter complete scene=SPACECENTER",
  "full-fidelity auto-commit \\(scene-exit[^\\r\\n]*\\): tree='Jebediah Kerman' recordings=5 ",
  # THE STAGGER: every member but the last was long enough to trim, so it ends ~10 s after
  # its own placement (or its last settle) rather than at the commit.
  "Ground part placed: tree member created part='DeployedCentralStation' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*TrimBoringTail: trimmed '[^'\\r\\n]*' \\(\\1\\) from endUT=",
  "Ground part placed: tree member created part='DeployedRTG' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*TrimBoringTail: trimmed '[^'\\r\\n]*' \\(\\1\\) from endUT=",
  "Ground part placed: tree member created part='DeployedSeismicSensor' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*TrimBoringTail: trimmed '[^'\\r\\n]*' \\(\\1\\) from endUT=",
  # Not required for the Go-ob, the LAST placement: its settle can outlast the buffer
  # (NEGCTL `_1944`: `buffer-not-met`); ending at the commit it still spawns last.
  "MISSIONMARK label=eva9-commit-count-14(?:\\s|$)",
  "Rewind-to-Launch initiated to UT",
  "invokerewindtolaunch complete rec=[0-9a-f]{32} tree=[0-9a-f]{32} adjustedUT=",
  # The capsule is kept across the rewind (PR #1891), which is what the reload focuses.
  "\\[Parsek\\]\\[INFO\\]\\[Rewind\\] Rewind strip scope: adjustedUT=[0-9.]+ stripPids=[0-9]+ keptHistoryPids=1 keptHolders=[0-9]+",
  # Right after the reload no member is spawned yet (the reload beat every EndUT).
  "Ground part placed: tree member created part='DeployedCentralStation' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-reloaded-count-14-[^\\r\\n]*-\\1-false(?:-|\\s)",
  # EVERY member spawned, read back from the committed store (spawned=true, a real pid).
  "Ground part placed: tree member created part='DeployedCentralStation' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-14-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "Ground part placed: tree member created part='DeployedRTG' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-14-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "Ground part placed: tree member created part='DeployedSeismicSensor' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-14-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  "Ground part placed: tree member created part='DeployedGoExOb' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-14-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  # And the kerbal who placed them (the tree root, the rewound recording).
  "startrecording recordingId=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-14-[^\\r\\n]*-\\1-true-[1-9][0-9]*-",
  # The fix's own witness (#1920), once per member placed after the first: each spawned
  # while an earlier sibling already stood inside its overlap box, and was exempted.
  "Ground part placed: tree member created part='DeployedRTG' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-reloaded-count[\\s\\S]*Overlap exempt: co-existing tree sibling (?:spawn|original): site=[^\\r\\n]* rec=\\1 blocker=",
  "Ground part placed: tree member created part='DeployedSeismicSensor' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-reloaded-count[\\s\\S]*Overlap exempt: co-existing tree sibling (?:spawn|original): site=[^\\r\\n]* rec=\\1 blocker=",
  "Ground part placed: tree member created part='DeployedGoExOb' [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-reloaded-count[\\s\\S]*Overlap exempt: co-existing tree sibling (?:spawn|original): site=[^\\r\\n]* rec=\\1 blocker=",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "evagroundscience failed",
  "evagroundscience refused",
  # A step that settled off the ground, or fell back to the PQS height.
  "evagroundscience step ground [^\\r\\n]*ok=false",
  "evagroundscience step move [^\\r\\n]*groundSource=pqs",
  # A step set down lower than the stale cached terrain of the spot he left killed him (EVA-8 flight 1).
  "Vessel Jebediah Kerman crashed through terrain",
  "Ground part placement not recorded",
  "Ground part placement dropped",
  "Part event captured: InventoryPartRemoved",
  "invokerewindtolaunch refused",
  # A ghost-only commit would null the members' snapshots: nothing could spawn.
  "Ghost-only auto-commit",
  # THE DEFECT.
  "Trajectory walkback EXHAUSTED",
  "Spawn ABANDONED",
  "Spawn RETIRED",
  "Spawn FAILED",
  "Overlap not exempt: tree sibling (?:spawn|original)",
  "Ground part placed: tree member created [^\\r\\n]*rec=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva9-spawned-count-[^\\r\\n]*-\\1-false-",
  # Nothing of this tree spawns at the Space Center (the reload beat every EndUT), so no
  # Space Center de-overlap nudge either.
  "De-overlap for #[0-9]+ \\\"[^\\\"\\r\\n]*\\\": nudged",
  "Spawn not needed for #[0-9]+ \\\"Jebediah Kerman\\\": non-leaf in tree",
]

[runtime]
# EVA-8's act budget (without the pick-up) + 7 steps + ~60 s of idle + 120 ExitToSpaceCenter
# + 120 SaveGame + 300 LoadGame + 300 rewind + 120 SaveGame + 300 LoadGame + ~160 s of 1x
# flight wait + 120 SaveGame + margin.
budgetSeconds = 2700

[retry]
policy = "once"
