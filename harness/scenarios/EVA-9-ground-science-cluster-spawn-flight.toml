schema = 1
id = "EVA-9-ground-science-cluster-spawn-flight"
# NIGHTLY (seam lane on a recorded fixture). The regression lane for todo
# PLACED-PART-CLUSTER-SPAWN-BLOCKED-BY-SIBLING, fixed by PR #1920 (`placed-part-cluster-spawn`).
# A plain lane: it must PASS on a DLL carrying #1920.
#
# THE DEFECT, from the operator's manual run `logs/2026-09-28_2231_deployables`: after a
# Rewind-to-Launch the replayed placed-part cluster came back in FLIGHT one member at a
# time, and every member after the first was refused by the spawn collision check against
# its own already-spawned sibling - `[SpawnCollision] Trajectory walkback EXHAUSTED:
# vessel=OX-Stat-PD Photovoltaic Panel - entire trajectory overlaps with Mini-NUK-PD
# Radioisotope Thermoelectric Generator` for ten of eleven parts - and the kerbal who placed
# them was abandoned the same way (`Spawn ABANDONED for #2 (Bob Kerman): entire trajectory
# overlaps with loaded vessels - walkback exhausted`). A placed part cannot walk back: its
# whole trajectory is the spot it was placed on, beside the others.
#
# WHY THE MEMBERS MUST END AT STAGGERED TIMES (first flight `2026-09-28_2044`, integration
# DLL = main + #1920 + #1921 + #1923: every token matched except the exemption line). That
# flight committed ~2 s after the last placement, so every member ENDED at the commit
# (endUT 1293.0 for all four; TrimBoringTail skips a recording of 30 s or less,
# RecordingOptimizer.MinDurationForTrimSeconds), and after the rewind all four spawned in
# ONE frame (`Chain tip spawn complete: #10..#13` within 9 ms): no member was standing yet
# when the next spawned, so nothing overlapped a sibling and the fix path never ran. The
# operator's members were each trimmed to about 13 s after their placement (the deploy
# event + DefaultTailBufferSeconds 10: `trimmed ... from endUT=337.5 to 133.4 ...
# lastInterestingUT=123.5`) because he kept recording for minutes, so they ended - and
# spawned - one after another, each beside a sibling already standing. This lane now
# reproduces THAT: each placement is a walk back to the pod, a take and a walk out to the
# part's own spot (several seconds of 1x time per part), and about 60 s of idle after the
# last one (240 MissionMarks), so every member records more than 30 s, TrimBoringTail cuts
# each to its own placement + ~10 s (required per member below), and the four ends are
# staggered by the placement spacing.
#
# WHY THE COMMIT IS A SCENE EXIT (second flight `2026-09-29_1528`, same integration DLL:
# PARSEK-FAIL on the four trim tokens and the three exemption tokens). The members lived
# 41-65 s, yet no `TrimBoringTail: trimmed` line printed and all four spawned within 5 ms.
# The seam's `CommitTree` is ParsekFlight.CommitTreeFlight, which never calls
# RecordingStore.RunOptimizationPass (the only caller of the boring-tail trim), and the
# in-session scene loads that followed return before OnLoad's optimization phase (it runs on
# a cold load only). The operator's trim ran inside the SCENE-EXIT auto-commit at the Space
# Center (MergeDialog.MergeCommit runs the pass). So this lane now commits the way a player
# does: `autoMerge=true` and `ExitToSpaceCenter` with the recording running, then SaveGame +
# LoadGame back into FLIGHT on the capsule (a Space Center save focuses vessel 0) for the
# rewind verb, which needs FLIGHT. The in-flight path's missing pass is filed as todo
# IN-FLIGHT-COMMIT-SKIPS-OPTIMIZATION-PASS.
#
# LAYOUT (operator directive 2026-09-29: "place the parts farther away" and "space them out
# more"). `EvaGroundScience action=step ... bearing=<deg>` sets Jeb down at a compass
# bearing from the capsule. Spots on a 13 m ring at bearings 60 / 80 / 100 / 120: every part
# at least ~12 m from the capsule, neighbours 2 * 13 * sin(10 deg) = 4.5 m apart (plus up to
# ~0.9 m of placement preview offset each). Between placements Jeb steps to 3 m from the pod
# on the next part's bearing (a take reaches GameSettings.EVA_INVENTORY_RANGE, 5 m, measured
# to the pod's colliders) and back out; after the last one he steps to 4 m on bearing 270,
# the far side of the capsule, clear of every part. Steps inside the recording are teleports:
# the kerbal's ghost slides between spots, which no recorder path or analyzer rule reads as
# a defect; each hop lands from 0.5 m, a brief airborne run the optimizer's surface-graze
# rule should suppress (a split of Jeb's recording would read as count 15, not 14).
#
# DO NOT SPREAD THE PARTS PAST ~6 m APART. The FLIGHT spawn check
# (SpawnCollisionDetector.CheckOverlapAgainstLoadedVessels) pads a one-part vessel's bounds
# by 5 m per side: `Physics.OverlapBox ... halfExtents=(6.3,6.3,6.3) padding=5.0m`. Parts
# ~4.5-5.5 m apart therefore still stand INSIDE each other's box, so each later member's
# spawn finds its earlier neighbour as a blocker - the co-existing-sibling exemption of
# PR #1920 is what lets it spawn. Past ~6 m the neighbours stop overlapping and this lane
# stops testing #1920 at all while still reading green.
#
# HOW THE CHAIN GETS BACK TO THE CLUSTER. A Rewind-to-Launch lands at the Space Center, and
# a Space Center save focuses vessel 0 (`activeVessel = 0`, measured in EX-1). The fixture's
# vessel 0 is an asteroid a million kilometres out, so `[[fixture.liveState]]` REMOVES it at
# staging: the capsule becomes vessel 0 (savepatch re-points `activeVessel` 1 -> 0 so the
# boot still focuses it), and SaveGame + LoadGame straight after the rewind boots FLIGHT on
# the capsule, beside the cluster site, 15 s (RewindToLaunchLeadTimeSeconds) before the
# kerbal recording started (measured: the reload beat every EndUT). The capsule is the
# active vessel, which the spawn overlap check skips, so the only blockers are the cluster's
# own members and the kerbal: the defect's shape exactly.
#
# WITNESSES. Per member: the trim line tied to its rec id, its store read-back after the
# wait (ListHandles `rec<i>` / `rec<i>spawned` / `rec<i>spawnedPid`, rows rec9..rec13: the
# fixture's nine rows list first, EVA-6's measured order; the first flight read the
# members at rec10..rec13 and Jeb at rec9) and, for each of the three members placed after
# the Central Station, #1920's exemption line naming THAT member as the spawning recording
# (`Overlap exempt: co-existing tree sibling spawn: site=... rec=<member> blocker=...`, or
# `... sibling original:` when the blocker is the unstamped live vessel a sibling's recording
# made, the #1920 follow-up's form; the tokens accept either), the proof the fix path ran for
# it (the line is rate-limited per spawning rec + blocker pid, so one per member is what to
# require).
#
# ON A PRE-#1920 DLL this lane reds PARSEK-FAIL(expectation) on: the three per-member
# exemption tokens (never printed), the three later members' `-true-<pid>` read-backs (they
# read `-false-0`: blocked, never spawned), plus the forbidden `Trajectory walkback
# EXHAUSTED` and member-row-false tokens (the operator's pre-#1920 log prints the walkback
# line for ten of eleven parts). The Central Station, placed first, ends first and spawns
# clear on either DLL; Jeb, who now ends ~13 m from every part beside the (active, skipped)
# capsule, spawns clear on either DLL too.
#
# THE SPACE CENTER TWIN (EVA-10's subject). At the Space Center the spawn does not refuse a
# cluster member, it NUDGES it: ParsekKSC's landed de-overlap moves any non-EVA surface
# spawn 15 m clear of every existing landed vessel (EVA-6's green run `2026-09-27_1815`:
# `De-overlap for #10 "Grand Slam Passive Seismometer": nudged 15.0m`); #1920 also exempts
# co-existing tree siblings there. Nothing of this tree spawns at the Space Center here.
#
# KNOWN PREAMBLE FLAKE (shared with EVA-6, whose `2026-09-28_2059` attempt 1 hit it):
# after the boot's DiscardTree, ParsekFlight's 1 Hz committed-spawned restore retry
# (`HandleMissedVesselSwitchRecovery`, no tree and no recorder) can re-adopt the fixture's
# capsule as its committed tip within the same second, and the kerbal's StartRecording is
# then refused `active-recording-id-missing` (INVALID, retried once).
tier = "nightly"
description = "Regression for PLACED-PART-CLUSTER-SPAWN-BLOCKED-BY-SIBLING (fix #1920): on kerbin-splashdown-recorded (asteroid removed so the landed capsule is vessel 0) Jeb places a four-part Breaking Ground cluster on a 13 m ring round the capsule, neighbours ~4.5 m apart (Central Station from his own inventory, RTG / seismometer / Go-ob each taken out of the capsule's pod, action=step walking him between the pod and each part's own bearing) and idles ~60 s; he leaves for the Space Center, whose scene-exit auto-commit trims every member to a staggered end; back into FLIGHT, Rewind-to-Launch, SaveGame + LoadGame straight back into FLIGHT on the capsule, and 1x flight time crosses every end. Each later member spawns while an earlier sibling already stands inside its overlap box and is EXEMPTED (the fix's line per member), every member and the kerbal read back spawned with a pid, and nothing is refused (no walkback exhaustion, no abandoned spawn)."
instanceProfile = "stock-minimal"
tags = ["eva", "inventory", "ground-science", "breaking-ground", "cluster", "rewind-to-launch", "spawn", "spawn-collision", "EVA-9"]

[fixture]
saveTemplate       = "fixtures/saves/kerbin-splashdown-recorded"
injectedRecordings = "none"
craft              = []

# The index-0 asteroid (Ast. MII-526) goes, so the capsule is what a Space Center save
# focuses; savepatch keeps the boot focus on the capsule (activeVessel 1 -> 0).
[[fixture.liveState]]
pid    = 2815888106
remove = true

[[fixture.crewInventory]]
kerbal    = "Jebediah Kerman"
inventory = "DeployedCentralStation"

[[fixture.partInventory]]
pid       = 2708531065
part      = "mk1-3pod"
inventory = "DeployedRTG,DeployedSeismicSensor,DeployedGoExOb"

[driver]
kind = "seam"
steps = [
  # ACT 0: EVA-6's boot hygiene.
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnEva",    value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoMerge",          value = "true" },  expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva9-boot" },                     expect = "OK" },
  # ACT 1: the cluster, spread out on a 13 m ring round the capsule (see LAYOUT in the header).
  { cmd = "EvaExit",    args = { release = "true" },                         expect = "OK", budget = 120 },
  # Out to the Central Station's spot before the recording starts.
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "13", bearing = "60" }, expect = "OK", budget = 120 },
  { cmd = "StartRecording",                                                  expect = "OK", budget = 180 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedCentralStation", faceAway = "true" }, expect = "OK", budget = 120 },
  # Per part: back to the pod (a take reaches 5 m), take it, out to its own spot, place it.
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "3", bearing = "80" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedRTG" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "13", bearing = "80" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedRTG", faceAway = "true" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "3", bearing = "100" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedSeismicSensor" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "13", bearing = "100" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedSeismicSensor", faceAway = "true" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "3", bearing = "120" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedGoExOb" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "13", bearing = "120" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedGoExOb", faceAway = "true" }, expect = "OK", budget = 120 },
  # Jeb walks back to the far side of the capsule, clear of every part.
  { cmd = "EvaGroundScience", args = { action = "step", anchor = "2708531065", distance = "4", bearing = "270" }, expect = "OK", budget = 120 },
  # ~60 s of idle (240 steps): every member records well over 30 s (MinDurationForTrimSeconds)
  # and past its last interesting moment + the 10 s buffer, so the scene-exit commit's
  # optimization pass cuts each to a staggered end. NEGCTL `2026-09-29_1944` (40 s of idle, a
  # stumble delaying the last placement): the Go-ob skipped `buffer-not-met` and the
  # seismometer's last interesting moment came 33 s after its placement.
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva9-idle" }, expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva9-idle" }, expect = "OK" },
