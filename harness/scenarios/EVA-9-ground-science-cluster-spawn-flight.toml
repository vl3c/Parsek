  # THE COMMIT, the way a player makes it: leave for the Space Center with the recording
  # running, and the scene-exit auto-commit (MergeDialog.MergeCommit) commits the tree and
  # runs RecordingStore.RunOptimizationPass, which trims the members' boring tails. The seam
  # CommitTree (ParsekFlight.CommitTreeFlight) runs no optimization pass (todo
  # IN-FLIGHT-COMMIT-SKIPS-OPTIMIZATION-PASS), which is why flight `2026-09-29_1528` never trimmed.
  { cmd = "ExitToSpaceCenter",                                               expect = "OK", budget = 120 },
  # Back into FLIGHT for the rewind verb: a Space Center save focuses vessel 0, the capsule.
  { cmd = "SaveGame",   args = { name = "eva9-committed" },                  expect = "OK", budget = 120 },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "eva9-committed" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c0",        expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva9-commit-count-${c0.count}" }, expect = "OK" },
  # The 1 Hz committed-tip restore retry can re-adopt the capsule after the DiscardTree
  # (EVA-6's preamble flake); a live recorder would refuse the rewind `recording-active`.
  { cmd = "StopRecording",                                                   expect = "OK" },
