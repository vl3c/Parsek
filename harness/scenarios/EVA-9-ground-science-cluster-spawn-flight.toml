schema = 1
id = "EVA-9-ground-science-cluster-spawn-flight"
# NIGHTLY (seam lane on a recorded fixture). NEVER FLOWN: authored 2026-09-28 as the
# regression lane for todo PLACED-PART-CLUSTER-SPAWN-BLOCKED-BY-SIBLING (fix PR #1920,
# branch `placed-part-cluster-spawn`, not merged when this was written).
#
# THE DEFECT, from the operator's manual run `logs/2026-09-28_2231_deployables`: after a
# Rewind-to-Launch the replayed placed-part cluster came back in FLIGHT one member at a
# time, and every member after the first was refused by the spawn collision check against
# its own already-spawned sibling - `[SpawnCollision] Trajectory walkback EXHAUSTED:
# vessel=OX-Stat-PD Photovoltaic Panel - entire trajectory overlaps with Mini-NUK-PD
# Radioisotope Thermoelectric Generator` for ten of eleven parts - and the kerbal who placed
# them was abandoned the same way (`Spawn ABANDONED for #2 (Bob Kerman): entire trajectory
# overlaps with loaded vessels - walkback exhausted`). A placed part cannot walk back: its
# whole trajectory is the spot it was placed on, beside the others.
#
# THE CHAIN is EVA-8's placements without the pick-up (the Central Station from Jeb's own
# inventory, then the RTG, the seismometer and the Go-ob taken one at a time out of the
# capsule's pod container), then EVA-6's rewind, then ONE step EVA-6 does not take: the
# lane leaves the Space Center for FLIGHT before any member ends, so the members end - and
# spawn - inside the physics bubble, against the collision checks that refused them.
#
# HOW THE LANE GETS BACK TO THE CLUSTER. A Rewind-to-Launch lands at the Space Center, and
# a Space Center save focuses vessel 0 (`activeVessel = 0`, measured in EX-1). The fixture's
# vessel 0 is an asteroid a million kilometres out, so `[[fixture.liveState]]` REMOVES it at
# staging: the capsule becomes vessel 0 (savepatch re-points `activeVessel` 1 -> 0 so the
# boot still focuses it), and SaveGame + LoadGame straight after the rewind boots FLIGHT on
# the capsule, beside the cluster site, about 15 s (RewindToLaunchLeadTimeSeconds) before
# the kerbal recording started. EVA-6 measured the capsule kept as committed history across
# the rewind (`keptHistoryPids=1`, PR #1891), which is what makes it the one vessel there.
# The capsule is the active vessel, and the spawn overlap check skips the active vessel, so
# the only blockers left are the cluster's own members and the kerbal: the defect's shape
# exactly. After the reload, 1x flight time crosses every member's EndUT (each member's
# stationary tail is trimmed about 10-13 s after its placement, measured in the operator's
# run: `TrimBoringTail: trimmed ... from endUT=337.5 to 133.4`) and then the kerbal's.
#
# WITNESSES. Per member: its creation line ties its rec id to the committed store's
# read-back after the wait (ListHandles `rec<i>` / `rec<i>spawned` / `rec<i>spawnedPid`,
# rows rec9..rec13: the fixture's nine rows list first, EVA-6's measured order), so a
# member reads spawned=true with a real pid, whichever spawn path took it. The fix's own
# line (`Overlap exempt: co-existing tree sibling spawn: site=...`, #1920's literal) is
# required once. Forbidden: any walkback exhaustion, any abandoned / retired / failed spawn,
# #1920's `Overlap not exempt: tree sibling spawn` refusal, and any member row that reads
# spawned=false after the wait.
#
# EXPECTED-FAIL until #1920 is on the flown DLL. The signature is the PREDICTED pre-fix
# mismatch set (never read off a run - this lane has not flown): the Central Station, placed
# first, ends first and spawns clear; the RTG, seismometer and Go-ob each hit an
# already-spawned sibling (their three per-member tokens miss, the walkback and member-false
# forbidden tokens hit), the kerbal is abandoned among them, and the fix's line never
# prints. On a DLL carrying #1920 the run is XPASS: confirm, then delete the
# `[expectedFail]` keys. On a pre-fix DLL whose mismatch set differs, run.py Warn-logs the
# `unexpected=` / `missing=` difference; read it before re-pinning anything.
#
# THE SPACE CENTER TWIN (not this lane's subject; EVA-10's). At the Space Center the spawn
# does not refuse a cluster member, it NUDGES it: ParsekKSC's landed de-overlap moves any
# non-EVA surface spawn 15 m clear of every existing landed vessel (measured on EVA-6's
# green run `2026-09-27_1815`: `De-overlap for #10 "Grand Slam Passive Seismometer": nudged
# 15.0m`), which scatters a cluster. #1920 also exempts co-existing tree siblings there.
tier = "nightly"
description = "Regression for PLACED-PART-CLUSTER-SPAWN-BLOCKED-BY-SIBLING: on kerbin-splashdown-recorded (asteroid removed so the landed capsule is vessel 0) Jeb places a four-part Breaking Ground cluster (Central Station from his own inventory, RTG / seismometer / Go-ob taken one at a time out of the capsule's pod), commit, Rewind-to-Launch, SaveGame + LoadGame straight back into FLIGHT on the capsule before any member ends, and 1x flight time crosses every member's end. Every member must spawn as a real vessel inside the physics bubble (store read-back spawned=true, pid set), none refused by its sibling (no walkback exhaustion, no abandoned spawn), the kerbal too. EXPECTED-FAIL until fix PR #1920 is on the flown DLL."
instanceProfile = "stock-minimal"
tags = ["eva", "inventory", "ground-science", "breaking-ground", "cluster", "rewind-to-launch", "spawn", "spawn-collision", "EVA-9"]

[fixture]
saveTemplate       = "fixtures/saves/kerbin-splashdown-recorded"
injectedRecordings = "none"
craft              = []

# The index-0 asteroid (Ast. MII-526) goes, so the capsule is what a Space Center save
# focuses; savepatch keeps the boot focus on the capsule (activeVessel 1 -> 0).
[[fixture.liveState]]
pid    = 2815888106
remove = true

[[fixture.crewInventory]]
kerbal    = "Jebediah Kerman"
inventory = "DeployedCentralStation"

[[fixture.partInventory]]
pid       = 2708531065
part      = "mk1-3pod"
inventory = "DeployedRTG,DeployedSeismicSensor,DeployedGoExOb"

[driver]
kind = "seam"
steps = [
  # ACT 0: EVA-6's boot hygiene.
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnEva",    value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva9-boot" },                     expect = "OK" },
  # ACT 1: the cluster (EVA-8's placements, no pick-up).
  { cmd = "EvaExit",    args = { release = "true" },                         expect = "OK", budget = 120 },
  { cmd = "StartRecording",                                                  expect = "OK", budget = 180 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedCentralStation", faceAway = "true" }, expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedRTG" },                                expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedRTG", faceAway = "true" },             expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedSeismicSensor" },                      expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedSeismicSensor", faceAway = "true" },   expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "take",  part = "DeployedGoExOb" },                             expect = "OK", budget = 120 },
  { cmd = "EvaGroundScience", args = { action = "place", part = "DeployedGoExOb", faceAway = "true" },          expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "CommitTree",                                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c0",        expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva9-commit-count-${c0.count}" }, expect = "OK" },
  # ACT 2: rewind, then straight back into FLIGHT on the capsule (EX-1's reload recipe).
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                expect = "OK", budget = 300 },
  { cmd = "SaveGame",   args = { name = "eva9-rewound" },                    expect = "OK", budget = 120 },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "eva9-rewound" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c1",        expect = "OK" },
  { cmd = "MissionMark", args = { label = "eva9-reloaded-count-${c1.count}-a-${c1.rec9}-${c1.rec9spawned}-b-${c1.rec10}-${c1.rec10spawned}-c-${c1.rec11}-${c1.rec11spawned}-d-${c1.rec12}-${c1.rec12spawned}-e-${c1.rec13}-${c1.rec13spawned}" }, expect = "OK" },
  # ACT 3: 1x flight time past every member's end and the kerbal's (~0.25 s per step, 480
  # steps, ~120 s: 15 s of rewind lead + the placement act + a member's ~13 s trimmed tail).
