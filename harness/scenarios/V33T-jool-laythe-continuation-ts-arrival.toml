schema = 1
id = "V33T-jool-laythe-continuation-ts-arrival"
# =====================================================================================
# AUTHORED 2026-11-14, NEVER FLOWN. The missing Tracking Station half of V33M (todo
# NEXT-TESTS-TO-BUILD-2026-11-11 item 4), on the committed `jool-laythe-recorded`.
# V31T's shape (live-proven 2026-11-07, icon body=Ike in the TS): one TimeJump to
# just past the replayed Laythe SOI entry, SaveGame, reload into the Tracking
# Station, and read the ghost's TS icon on Laythe, then the MoonArrivalHold batch at
# the Space Center.
#
# THE JUMP, filled from V33M's reading `2026-11-07_2254` (PASS attempt 1), by V31T's
# formula:
#   encounterUT = phaseAnchor + (recordedMoonEntryUT - spanStartUT - cutsBeforeIt) + hold + 140
#   phaseAnchor = 34,378,351.11 from the ENGAGED line; its one loiter cut
#   (`loiterCuts=1 cutSeconds=4105620`) sits before the moon entry (no MOON HOLD line
#   printed, so nothing was cut after the Jool SOI entry), so cutsBeforeIt =
#   4,105,620; hold = 32,357.69 at recordedArrivalUT = 26,472,701.681 (the Jool SOI
#   entry) from the ARRIVAL HOLD line; spanStartUT = 26.30 (the root recording
#   ddcc6d00's explicitStartUT); recordedMoonEntryUT = 28,814,457.1362, the startUT
#   of the first TRACK_SECTION reading `body = Laythe` in 96d1d5b9...prec.txt (the
#   Jool->Laythe hop, which stays in Laythe's SOI ~2,446 s to its recorded end).
#   -> 34,378,351.11 + 24,708,810.8362 + 32,357.69 + 140 = 59,119,659.6
# The cut length is logged rounded to a second; the +140 s lead absorbs it.
#
# THE FIXTURE CARRIES COMMITTED-RESTORE-APPENDS-TO-ROOT's stray Laythe tail on the
# root (fixed 2026-11-14, re-harvest open). This lane discards the restore stub
# first and replays the committed tree, whose playback reads the root only to its
# explicitEndUT, so the tail should not show; if B38 is re-harvested, re-derive the
# jump from that fixture (the hop's UTs move) and re-read V33M first.
#
# WHAT THE LOG MUST SHOW: V33M's build lines and batch, plus V31T's TS route and
# `phase=GhostCreated surface=ProtoIcon pid=<n> ... body=Laythe scene=TRACKSTATION`.
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-11-14, NEVER FLOWN. The Tracking Station half of the Kerbin->Jool->Laythe loop (the `jool-laythe-recorded` tree V33M reads): after a jump past the replayed Laythe SOI entry, the TS ghost icon sits on Laythe with the lone-moon arrival hold engaged; the live MoonArrivalHold cell runs at the Space Center."
instanceProfile = "stock-minimal"
tags = ["V33", "tracking-station", "loop-arrival", "reaim", "arrival-hold", "lone-moon-hold", "jool", "laythe", "moon", "map-render", "ingame-batch", "flown"]

[fixture]
saveTemplate       = "fixtures/saves/jool-laythe-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig",     args = { tree = "6ec68e87b782476f970a71df8c8b4685", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "6ec68e87b782476f970a71df8c8b4685" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump",   args = { ut = "59119659.6" },                       expect = "OK", budget = 300 },
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "trackstation" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "RunTests",   args = { category = "MoonArrivalHold" },             expect = "OK", budget = 300 },
  # The export sits right before teardown (RenderComposeVerifierWiringTests placement
  # rule): the recorder accumulates from Awake, so an earlier export drops later steps.
  { cmd = "ExportRenderManifest",                                            expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
D11 = ["arrival-hold"]
D14 = ["jool", "laythe", "scene-ts", "scene-ksc", "sandbox"]

[expectations]
# V14T / V15T / V16T measured `icon-off-orbit` after a single jump; if the reading
# raises it, read it before allowing it (V14T's precedent), never allow it blind.
allowedAnomalies = []

[expectations.recordings]
# As V33M: `jool-laythe-recorded` ships N = 7 `.prec` sidecars, so {N, N + 1}.
count = { min = 7, max = 8 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "ENGAGED re-aim Kerbin->Jool via Sun",
  "ARRIVAL HOLD dest=Jool kind=config Talign=5298[01]\\.[0-9]+s moons=1 ",
  "ARRIVAL HOLD dest=Jool kind=config .*\\(aligns the moon orbital phases, mode=",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=MoonArrivalHold scene=SPACECENTER",
  "loadgame trackstation route: booting to TRACKSTATION save=",
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  "phase=GhostCreated surface=ProtoIcon pid=\\d+ .*body=Laythe scene=TRACKSTATION",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "FORCED FAITHFUL",
  "no member yields a re-aim transfer",
  "MOON HOLD declined",
  "Arrival amber SET: tree=6ec68e87b782476f970a71df8c8b4685",
  "timejump refused reason=backward-jump",
]

[expectations.rewind]
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
committedTrees = { min = 1, max = 1 }
trees          = { min = 1, max = 2 }

[expectations.renderComposition]

[runtime]
# 3 x 300 LoadGame + 300 StartLoopPlayback + 300 TimeJump + 300 RunTests + margin.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
