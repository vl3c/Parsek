  "\\[Parsek\\]\\[ERROR\\]",
  "goeditor rejected",
  "goeditor error",
  "launchfromeditor refused",
  "launchfromeditor timeout",
  "invokerewindtolaunch refused",
  "invokerewindtolaunch failed",
  "Updated committed tree",
  "Rewind strip scope: strip spawned pid=(?:567464503|2798211014|753981973) ",
  "Stripping orphaned spawned vessel '(?:Kerbal X|Merger Kerman|Kerbal X Probe)'",
  "Stripped [0-9]+ vessel\\(s\\) from save \\((?!1 by name)[0-9]+ by name \\[Kerbal X\\]",
  "kept [01] other launch\\(es\\) of the owner's craft",
  "LeafPlacement: [^\\r\\n]*verdict=(?!ok)",
]

[runtime]
budgetSeconds = 2400

[retry]
policy = "once"

