id = "V18T-depot-route-ts-arrival"
# =====================================================================================
# V18T: **THE SUITE'S FIRST ROUTE LANE.** A tracking-station observation of a COMMITTED,
# ACTIVE, GHOST-DRIVING SUPPLY ROUTE - the front door G1 has named as its top-ranked gap
# since the register was written, and the first lane anywhere that can put a non-zero
# number in the render-composition manifest's `routeLineBuilds` census.
#
# ---------------------------------------------------------------------------------
# 0. THE G1 DISCHARGE LEDGER - what this lane closes and what it explicitly does not
# ---------------------------------------------------------------------------------
# G1 (`docs/dev/autotest-roadmap.md` -> "The gap register, ranked") names FIVE things one
# route lane measures at once. This lane's POSTURE against each, stated before any run
# exists so the reading cannot be graded against a moving target:
#
#   (1) THE ROUTE FRONT DOOR (`SelectGhostDrivingBackingMissions` -> `BuildMission` ->
#       the host union). GATED HERE, and it is the one thing this lane cannot be vacuous
#       about: `SelectGhostDrivingBackingMissions: ghostDriving=[1-9]` plus
#       `TS startup loop units: ... routeMissions=[1-9]` are both REQUIRED below. The TS
#       host's `BuildStartupTrackingStationLoopUnits` folds route-driving backing
#       missions onto `MissionStore.Missions` before the one-shot startup create
#       (`GhostMapPresence.cs:9114-9166`), which is exactly why this lane arms NO mission
#       loop of its own - the route drives, and arming a mission would measure the
#       mission path instead.
#   (2) THE `RouteStatusPolicy.GhostDriving` SUPPRESSION GATE. GATED, in the falsifiable
#       direction: `RevalidateSources reason=.* routes=1 transitioned=0` is REQUIRED. A
#       route that flipped to `SourceChanged` / `MissingSourceRecording` / `EndpointLost`
#       on load would still let (1)'s selector line print `ghostDriving=0`, and this
#       token is what separates "the gate held" from "the gate ate the subject" - see
#       section 3.
#   (3) THE ROUTE-OWNED CADENCE (`RouteLoopClock`, `DispatchInterval`, the floored
#       anchor). READ, NOT GATED. Section 2 derives the dock instant under the two
#       branch hypotheses the product can take and finds they differ by ~10.8 ks, which
#       is precisely why no cadence token is pinned on a first flight.
#   (4) THE ROUTE OVERVIEW LINE (registry D10 `route-map-lines`). MEASURED, NOT CLAIMED.
#       `routeLineBuilds >= 1` in the manifest is THE headline facet of this lane - the
#       first non-zero occurrence of that census anywhere in the suite - and
#       `routeCoDrawViolations = 0` is its arbitration half. Both are recorded through
#       the BARE `[expectations.renderComposition]` block and gate nothing yet, so per
#       H35 CLAIM-IS-NOT-GATE (and supervisor decision 9 of `.scout/route-harvest-plan.md`)
#       D10 `route-map-lines` IS NOT DECLARED in `[dimensionsCovered]`. It gets declared
#       in the arming pass that writes the first window, not before.
#   (5) THE DOCK / STATION ENDPOINT. PARTIALLY READ - section 4.
#
# NOT CLOSED BY THIS LANE, and named so nobody books it: the `IsCareer && IsKscOrigin`
# funds check (this fixture is SANDBOX), G3b's surface `RouteEndpointResolver`
# nearest-vessel fallback (a DockingPort STOP, not a surface one), and the FLIGHT-MAP
# half V18M owes.
#
# ---------------------------------------------------------------------------------
# 1. WHY THE TRACKING STATION FIRST, AND WHY THAT IS A MEASURED FACT
# ---------------------------------------------------------------------------------
# Supervisor decision 3 made V18T-before-V18M conditional on an inspection, and the
# inspection came back positive. `RouteTrajectoryLineRenderer.DrawAll` has exactly ONE
# production call site - `GhostTrajectoryPolylineRenderer.Driver.OnRouteLinePreCull`, an
# independent map-camera `Camera.onPreCull` slot at
# `Source/Parsek/Display/GhostTrajectoryPolylineRenderer.cs:3894-3906` - and its COMPLETE
# guard chain is:
#     PlanetariumCamera.fetch != null && cam == PlanetariumCamera.Camera
#     scene is TRACKSTATION or FLIGHT
#     a per-frame de-dupe (routePrecullDrawnFrame)
# There is NO `MapView.MapIsEnabled` anywhere on that path - not in the host
# (`[KSPAddon(Instantly, once)]` + DDOL), not in the hook, and not inside `DrawAll`
# (whose only gate is the `showRouteLines` setting, default true). The method's own
# summary says it "does NOT gate on pendingDrawsFrame: a committed route draws its static
# path whether or not a ghost was decided this frame." The GHOST polyline pass IS
# map-gated, one structure further down at `:4014`.
#
# CONSEQUENCE, and it shapes every step below: in the TRACKING STATION the planetarium
# camera renders unconditionally, so the route line draws. In the FLIGHT scene it does
# NOT, because with the map closed the planetarium camera never culls. **THIS LANE'S
# FLIGHT PRELUDE THEREFORE DRAWS NO ROUTE LINE BY CONSTRUCTION** - it is clock work and
# nothing else, and the ENTIRE route-line observation lives in the TS dwell. That is the
# whole content of "V18T can fly first"; V18M is the lane that owes `EnterMapView` (R12,
# PR #1539), and it owes it precisely because it also asserts GHOST polyline facets.
#
# ---------------------------------------------------------------------------------
# 2. THE CLOCK, DERIVED - AND THE BRANCH THIS DERIVATION CANNOT SETTLE
# ---------------------------------------------------------------------------------
# All arithmetic below is off the COMMITTED fixture bytes (`persistent.sfs`), quoted to
# the digit so a re-derivation can check it rather than trust it.
#
#   route 5420f805...    recordedDockUT      17,478.248634212287
#                        dispatchInterval    16,058.001895760137  (= transitDuration)
#                        dispatchWindowPeriod 0 (SameBody: no synodic window)
#                        loopAnchorUT        -1        (UNSET)
#                        lastObservedLoopCycleIndex 0, completedCycles 1
#   its four SOURCE rows span, in recorded UT:
#                        44129e52 [ 1,420.246738452149 ,  1,734.5198414792137]
#                        8b036c83 [ 2,554.2070300253936,  2,889.8156530721844]
#                        0c8ec58d [17,265.722696710152 , 17,478.268634212287]
#                        70667ab4 [17,478.248634212287 , 17,594.508634214824]  <- DOCK
#   so  spanStartUT = 1,420.246738452149   spanEndUT = 17,594.508634214824
#       span        = 16,174.261895762675
#       dockOffset  = recordedDockUT - spanStartUT = 16,058.001895760138
#                     - i.e. the route's `transitDuration` IS the dock's span offset, to
#                       the last digit. That identity is not decoration: it is what makes
#                       the route's dispatch cadence and the render clock's dock phase the
#                       same number measured two ways.
#   save clock (FLIGHTSTATE UT) = 36,138.111257421704
#
# `RouteBackingMission.BuildMission` sets `LoopPlayback = true`,
# `LoopIntervalSeconds = route.DispatchInterval`, `LoopTimeUnit = Sec` and
# `LoopAnchorUT = route.LoopAnchorUT` (= -1). `MissionLoopUnitBuilder` then floors both
# the anchor and the phase-lock search reference at `spanEndUT` (the first-play floor,
# `MissionLoopUnitBuilder.cs:288-294`), so the -1 is silently overridden - which the
# file's own header calls out - and the CADENCE is
#     max(max(LoopIntervalSeconds, span), MinCycleDuration) = 16,174.261895762675
# i.e. THE SPAN FLOOR BITES: the render cadence is 116.26 s LONGER than the route's
# dispatch interval, because the dock member's 116 s tail runs past the dock instant.
#
# **THE BRANCH THIS LANE CANNOT SETTLE PRE-FLIGHT.** Which phase anchor the unit ends up
# with depends on what `MissionPeriodicity.ExtractConstraints` emits for a KSC-origin
# mission that ENDS IN A DOCKING, and that is a live measurement, not an arithmetic one:
#
#   H-A  UNLOCKED / FAITHFUL. The extraction reports no lockable config, `ShouldPhaseLock`
#        is false, and the builder keeps `baseAnchorUT` and the raw cadence:
#            phaseAnchor = spanEnd = 17,594.508634214824   cadence = 16,174.261895762675
#            dock_n = phaseAnchor + n*cadence + 16,058.001895760138
#              n=0 -> 33,652.510529974962   (already PAST the save clock)
#              n=1 -> 49,826.772425737637   <- the current forward cycle
#
#   H-B  SINGLE-ROTATION PHASE LOCK. The extraction emits ONLY `Rotation(Kerbin)` (the
#        pad-rooted launch constraint V14T's reading measured the emission rule for), the
#        single-constraint branch at `MissionPeriodicity.cs:726-733` returns
#        `method=single-rotation`, `ShouldPhaseLock=true`, P = 21,549.425183 s:
#            phaseAnchor = NextWindow(1,420.2467, P, >= 17,594.5086)
#                        = 1,420.246738 + 1*21,549.425183 = 22,969.671922
#            cadence     = QuantizeCadenceToMultipleOfP(16,174.2619, P) = 21,549.425183
#            dock_n = 22,969.671922 + n*21,549.425183 + 16,058.001896
#              n=0 -> 39,027.673818   <- the current forward cycle
#              n=1 -> 60,577.099001
#
#   H-C  VESSEL-ORBITAL DOMINANT. The extraction ALSO emits a `VesselOrbital` constraint
#        for the Depot rendezvous. `MissionPeriodicity.cs:890-895` ranks VesselOrbital
#        WITH Orbital, i.e. ABOVE Rotation, so the Depot's own park period would dominate
#        (its orbit is alt 215,032.70 m -> sma 815,032.70 m -> T ~ 2,459.9 s) and the two
#        constraints are incommensurate, which routes to `joint-best-fit` /
#        `dominant-intercept` AND makes a zero-drift `RelaunchSchedule` buildable. The
#        anchor is then NOT computable from these bytes at all. H-C is the reason this
#        section stops at "read it off the run" instead of pinning a third table.
#
# **THE JUMP UTs ARE CHOSEN TO BE HONEST UNDER ALL THREE.** Both are strictly forward of
# the save clock 36,138.111 and of each other, and the second is past the dock instant of
# BOTH computable hypotheses:
#       38,600  -  428.7 s BEFORE H-B's cycle-0 dock; 11,226.8 s before H-A's cycle-1
#                  dock; a forward clock position under H-C whatever its anchor.
#       50,200  -  373.2 s AFTER H-A's cycle-1 dock and 11,172.3 s after H-B's cycle-0
#                  dock. THIS is the epoch the save is taken at, so it is the epoch the
#                  TS dwell observes.
# A non-forward jump answers `REJECTED reason=backward-jump`, which is only a WARN; that
# token is FORBIDDEN below so a mis-derived anchor self-detects instead of greening a run
# that dwelled nowhere (the V3C run-3 guard).
#
# CALIBRATION RECIPE FOR ROUND 2, so the re-pin is mechanical rather than another
# derivation: read `ExtractConstraints: ... constraints=N [...]` (which of H-A / H-B / H-C
# the extraction took), then `PhaseLock APPLIED: mission=... method=...` or
# `PhaseLock SKIPPED: mission=... support=...` (which anchor branch), then the anchor
# itself off whichever of those two lines printed. The dock phase is then
# `phaseAnchor + n*cadence + 16,058.001895760138` with the cadence off the same line.
#
# ---------------------------------------------------------------------------------
# 3. WHAT COULD MAKE THIS LANE VACUOUS, AND THE TOKEN THAT CATCHES IT
# ---------------------------------------------------------------------------------
# `RouteStore.RevalidateSources` compares NINE `SOURCE` fields (recordingId / treeId /
# treeOrder / startUT / endUT / sidecarEpoch / format / generation / routeProofHash)
# against a live rebuild, and ANY drift flips the route to `SourceChanged`, which NEVER
# auto-recovers. `RouteStatusPolicy.GhostDriving` is false for that status, so the
# selector would return zero missions, the TS host would union nothing, and the whole
# lane would green while measuring an empty tracking station - the V1/V2 vacuity shape.
#
# The realistic trigger is not corruption but the LOAD-TIME OPTIMIZER: a split or a merge
# landing on any of the four source recordings moves `startUT` / `endUT` and flips the
# route. That is why the anti-vacuity set here is THREE tokens rather than one
# (`transitioned=0`, `ghostDriving=[1-9]`, `routeMissions=[1-9]`) and why the recordings
# window below is a bracket rather than a pin: the optimizer's verdict on this fixture's
# 22 recordings has never been observed.
#
# ---------------------------------------------------------------------------------
# 4. THE DOCK CLIP - THE SHARPEST THING THIS LANE MIGHT MEASURE, PRE-REGISTERED
# ---------------------------------------------------------------------------------
# `rendercompose._rule_route`'s last clause transcribes
# `RouteTrajectoryLineRenderer.LegWithinDockClip` exactly: a route member that a dwell
# RENDERED must satisfy `legStartUT < dockClipUT`, a STRICT inequality. This fixture's
# dock member `70667ab4` starts at 17,478.248634212287 and `recordedDockUT` is
# 17,478.248634212287 - THE SAME DOUBLE. So `<` is false, and if any dwell in the export
# renders that member, RC-ROUTE raises one FAIL-level finding.
#
# THAT IS A MEASUREMENT, NOT A BUG TO PRE-EMPT. Under the bare block below it is
# report-only, and it is the first time the clause has had a subject at all. To render
# the dock member the loop clock has to land inside its 116.26 s window out of a >= 16 ks
# cycle, which section 2 says cannot be aimed at until the anchor is measured - so a
# reading that never renders it is the EXPECTED outcome and a reading that does is the
# more interesting one. Either way the number goes in the ledger; neither reds this run.
#
# ---------------------------------------------------------------------------------
# 5. B27 IS A STAMP, NOT A FLIGHT - the provenance this lane stands on
# ---------------------------------------------------------------------------------
# `fixtures/saves/depot-route-recorded` is a HARVEST of the operator's own free-play
# sandbox save, not a forged fixture, because route candidacy is gated on
# `IsTreeFullySealed` and both verbs that could satisfy it (`SealSlot`, `RouteCommand`)
# are RESERVED - H35 ROUTE-CANDIDACY-GATED-ON-SEAL-NO-SEAM-PATH. No driven run can create
# a ROUTE today. The full provenance, the pinned route shape, the two-recording INV2
# repair and the analyzer reading (`FAIL=0 WARN=0 INFO=0 STALE=0 RED=0` - the only
# zero-WARN RECORDED fixture in the suite) live in
# `harness/lib/test_saveparse.py::CommittedFixtureSweepTests.RECORDED_FIXTURES`, and the
# register amendment is in `docs/dev/autotest-roadmap.md` under G1.
#
# ---------------------------------------------------------------------------------
# 6. renderComposition ARMING LEDGER (M-A7 Phase 4 / Wave B)
# ---------------------------------------------------------------------------------
#   POSTURE  **ARMED 2026-08-26** (was DECLARED BARE). Declaring is what sets
#            `PARSEK_RENDER_MANIFEST=1` at launch and arms the C# recorder at Awake; the
#            single `ExportRenderManifest` step immediately before teardown takes the
#            composition at a chosen instant rather than at the scene-exit auto-flush.
#            The armed block and the arithmetic behind each window are at
#            `[expectations.renderComposition]`; the flight record is at the end of this
#            section.
#   HEADLINE `routeLineBuilds >= 1` - and it would be the FIRST NON-ZERO READING OF THAT
#            CENSUS ANYWHERE IN THE SUITE. Every committed declarer to date measures it at
#            zero for the same structural reason: no fixture carries a ROUTE. Its
#            arbitration half is `routeCoDrawViolations = 0` (DrawAll skips a member the
#            ghost polyline owns, via `IsRenderingNonOrbitalLeg`).
#   PLAN     The manifest's per-unit `ROUTE` node is the plan-ROUTE JOIN this lane exists
#            to exercise: `_rule_route` reads `unit.route.scope` + `recorded_dock_ut` and
#            joins them against the unit's own members. No other subject can produce that
#            node, so RC-ROUTE's per-unit half has never executed.
#   SCOPE    Expected `SameBody` (both endpoints Kerbin). Under that scope
#            `transferLegsDropped > 0` is a FAIL by rule - the endpoint filter runs only
#            for InterBody - so a non-zero drop count here is a real finding.
#   READING  **FLIGHT 1 FLEW 2026-08-26 AND MEASURED THE FRONT DOOR. Attempt 1
#            (`2026-08-26_1741`) INVALID, attempt 2 (`2026-08-26_1742_a2`) PASS - the run
#            classifies `flakedThenPassed`.** Every headline above came back non-vacuous:
#              routeLineBuilds        1     <- THE SUITE'S FIRST NON-ZERO READING OF THIS
#                                              CENSUS, and it was taken IN THE TRACKING
#                                              STATION with no `EnterMapView` verb driven,
#                                              which is exactly what the guard-chain
#                                              inspection in section 1 predicted.
#              routeCoDrawViolations  0     (the arbitration half; DrawAll deferred to
#                                              nothing because no ghost polyline owned)
#              routeLegDefers         0
#              planUnits              1     host = TrackingStation, ownerIndex 9
#              seamKinds              rigid 12  (no flexible-soi: SameBody, as scoped)
#            and the per-unit `ROUTE` node - the plan-ROUTE JOIN no other subject in the
#            suite can emit, so RC-ROUTE's per-unit half EXECUTED AGAINST LIVE DATA for
#            the first time - carried the committed route verbatim:
#              routeId                5420f805fcbb453b8d5928b71393f14b
#              backingMissionTreeId   c9ef80ee91b34de2b3717a4fb8bd1226
#              recordedDockUT         17478.248634212287   (= the fixture byte, to the digit)
#              scope                  SameBody             (as scoped; transferLegsDropped 0)
#              excludedIntervalKeys   44129e52.../seg3;efb9be71...
#            Census remainder: dwells 0 (+1 open), transitions 0, chainBuilds 1,
#            lineBranches 1, ownershipChanges 0, warp 1x-only (56 frames), zero findings
#            at any level, unevaluable 3 (`no-dwells-attributable-to-unit` 1,
#            `no-cycle-rollover-events` 1, `warp-hold-traversal-evidence-absent` 1 - all
#            three are the honest reading of a single-epoch TS observation with no closed
#            dwell and no rails warp). Clean sweep on every other verifier row.
#
#            **THE ANCHOR BRANCH SECTION 2 COULD NOT SETTLE IS NOW SETTLED: H-B.** The
#            unit came back with
#                phaseAnchorUT = 22,969.671921541973   cadenceSeconds = 21,549.4251830898
#            against H-B's derivation `1,420.246738 + 1*21,549.425183 = 22,969.671922` and
#            `QuantizeCadenceToMultipleOfP -> 21,549.425183`. That is H-B to the digit;
#            H-A (17,594.508634 / 16,174.261896) and H-C (no `RelaunchSchedule`-free
#            anchor at all) are both ruled out - though note `hasRelaunchSchedule = True`
#            on the unit, so the extraction did emit more than the single Rotation and the
#            single-rotation branch still won the anchor. Round 2 re-pins off THIS run, no
#            re-derivation needed. One correction the flight makes to section 2's
#            arithmetic: the exported `spanEndUT` is 17,478.268634212287, not the derived
#            17,594.508634214824 - the dock member (70667ab4) is CLIPPED to a 20 ms
#            interval at the dock instant, so the measured span is 16,058.021896 s
#            (= dispatchInterval + 20 ms) rather than the 16,174.261896 s that assumed the
#            untrimmed 116.26 s dock tail. The clip is the RC-ROUTE dock-clip clause
#            working, and under H-B the cadence is P-quantized anyway so the span floor
#            never bit.
#
#            THE FLAKE, NAMED PRECISELY so it is not re-diagnosed next time: attempt 1
#            died at drive step 15, the MID-RUN `LoadGame` (id=0016), on
#            `reject id=0016 cmd=LoadGame reason=recording-active` - the preceding
#            `StopRecording` (step 13) answered OK but the recorder was still active one
#            step later. It is a STOP/LOAD RACE, not a route or a scene fault: steps 0-14
#            were all OK and attempt 2 ran the identical script clean. `coverage/flake.json`
#            carries it at rate 0.50 (1/2), quarantined. It says nothing about this lane's
#            subject and must not be read as one.
#
#            ARMING STILL OWED: reading 2. Windows get written FROM the measured facets,
#            at arming, by operator decision, on the three-run discipline (reading ->
#            armed re-flight -> negative control), and a single reading of a census is a
#            sample. NOTHING IS ARMED BY THIS FLIGHT.
#
#   READING 2 `2026-08-26_1958` - PASS ATTEMPT 1, the unchanged spec re-flown. THE TWO
#            READINGS MATCH FACET FOR FACET, which is what the arming rests on:
#              routeLineBuilds 1 / routeCoDrawViolations 0 / routeLegDefers 0 BOTH
#              planUnits 1 BOTH, chainBuilds 1 BOTH, lineBranches 1 BOTH
#              dwells 0 (+1 open) BOTH, transitions 0 BOTH, cycles 0 BOTH
#              ownershipChanges 0 BOTH, seamKinds {rigid 12} BOTH, seamTangents 0 BOTH
#              clockEvents {cycle-rollover 1} BOTH
#              unevaluable 3 BOTH, the SAME three reasons at the same counts
#                (no-cycle-rollover-events 1, no-dwells-attributable-to-unit 1,
#                 warp-hold-traversal-evidence-absent 1)
#              findings 0 at every level BOTH
#            THE ONLY FACET THAT MOVED is the 1x warp frame count, 56 -> 59 - the export
#            instant's frame budget, not the subject. Nothing here is a sample of one.
#
#   ARMED    Written FROM the pair above, not from the pre-registration (which predicted
#            the two route windows and got them right):
#              gating = true
#              routeLineBuilds       { min = 1 }    THE SUITE'S FIRST ROUTE WINDOW
#              routeCoDrawViolations { max = 0 }
#              unevaluable           { max = 10 }   ~3.4x measured 3, the siblings' ratio
#              requireSeamKinds      ["rigid"]      both readings rigid-only, by SCOPE
#            NO dwells / cycles floors: both read 0 by construction on a single-epoch TS
#            observation, so the suite's shared `dwells {1,32}` convention does NOT fit
#            this lane and copying it would red the runs it was armed off. Per-window
#            arithmetic and every NOT-DECLARED decision are at the block itself.
#            The three route/ownership window KEYS did not exist before this change:
#            `RENDER_COMPOSITION_WINDOW_KEYS` was exactly ("dwells","cycles",
#            "unevaluable") and the validator refused anything else pre-launch. The
#            schema extension (todo RENDERCOMPOSE-OWNERSHIPCHANGES-IS-NOT-WINDOWABLE)
#            ships in the same change, and this lane's armed flights are its live proof.
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-08-26; READING FLIGHT 1 FLEW THE SAME DAY (`2026-08-26_1741` INVALID on a mid-run `LoadGame reason=recording-active` stop/load race, `2026-08-26_1742_a2` PASS - flakedThenPassed, quarantined at rate 0.50) AND MEASURED G1'S FRONT DOOR: `routeLineBuilds = 1`, THE SUITE'S FIRST NON-ZERO READING OF THAT CENSUS ANYWHERE, taken IN THE TRACKING STATION with no `EnterMapView` verb driven exactly as the guard-chain inspection predicted, alongside `routeCoDrawViolations = 0`, `planUnits = 1` (host TrackingStation), seamKinds rigid 12, and the per-unit `ROUTE` node no other subject can emit - routeId 5420f805, backingMissionTreeId c9ef80ee, recordedDockUT 17478.248634212287 to the fixture digit, scope SameBody, excludedIntervalKeys present - so RC-ROUTE's per-unit half executed against live data for the first time, with zero findings at any level. The flight also SETTLED THE ANCHOR BRANCH section 2 could not: phaseAnchorUT 22,969.671921541973 / cadence 21,549.4251830898 is hypothesis H-B (single-rotation phase lock on Rotation(Kerbin)) to the digit, ruling out H-A and H-C. ARMING STILL OWED - reading 2 before any window. THE SUITE'S FIRST ROUTE LANE and the first subject that can put a non-zero number in the render-composition manifest's `routeLineBuilds` census. A tracking-station observation of the committed, Active, GhostDriving SameBody supply route `5420f805...` (Kerbin -> Kerbin, DockingPort STOP onto the `Depot`) carried by the B27 harvest `depot-route-recorded`. NO mission loop is armed: the ROUTE drives, through `SelectGhostDrivingBackingMissions` -> `RouteBackingMission.BuildMission` -> the TS host union, and arming a mission would measure the mission path instead. It flies the TS half FIRST on a MEASURED fact rather than a preference - `RouteTrajectoryLineRenderer.DrawAll`'s only call site is a map-camera onPreCull hook whose guard chain carries no `MapView.MapIsEnabled` (GhostTrajectoryPolylineRenderer.cs:3894-3906), so the tracking station draws route lines with no `EnterMapView` verb while the FLIGHT prelude draws none at all. Two forward TimeJumps park the clock either side of the dock instant of BOTH computable anchor hypotheses (the phase-anchor branch is genuinely unresolvable pre-flight and all three candidates are derived in the header); the save is taken at the later one, so the TS dwell observes the post-dock side. Anti-vacuity is three tokens, not one: `RevalidateSources ... transitioned=0` (the route did not flip to SourceChanged under the load-time optimizer), `ghostDriving=[1-9]` (the front door selected it) and `routeMissions=[1-9]` (the TS host unioned it), on top of the TS host's own `created N ghost vessel(s)`. `[expectations.renderComposition]` is DECLARED BARE - D10 `route-map-lines` stays UNDECLARED until a gating token earns it (H35 CLAIM-IS-NOT-GATE, supervisor decision 9)."
instanceProfile = "stock-minimal"
tags = ["V18", "route", "logistics", "tracking-station", "same-body", "kerbin", "depot",
