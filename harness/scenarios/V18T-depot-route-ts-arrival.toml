[fixture]
# The B27 harvest: TWO committed trees (`c9ef80ee...` the route's backing tree, kept
# WHOLE because RevalidateSources compares nine SOURCE fields against a live rebuild;
# `af5628b4...` the `Depot`'s own launch lineage, proven NOT independent by the shared
