steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # Kill the scene-entry auto-recorder. HARD precondition, not hygiene: the SECOND
  # LoadGame below is REJECTED `recording-active` by the dispatch guard if a recorder is
  # live, and SaveGame would persist a half-recorded stub into the save the TS half then
  # reads. This fixture's own parked craft (`Depot`) is the active vessel, which is
  # exactly the committed-tree-restore shape that re-arms a promotion stub ~1 s into the
  # scene (V2 flight 4 / V5 run 1 / B23 flight 1).
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # The three tracers every render-composition declarer must arm
  # (`test_every_declarer_arms_the_tracers_the_seam_capture_needs`): mapRenderTracing
  # arms the map/TS tracer + probe AND gates every seam capture predicate the manifest
  # reads; ghostRenderTracing is the FLIGHT-scene Tier-C raise gate; verboseLogging is
  # LOAD-BEARING beside both because the tracer emits its Tier-B truth at Verbose (the V1
  # lesson). Settings are process-global, so all three survive the LoadGame into TS.
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # ARMED EXPLICITLY rather than relied on: `showRouteLines` is the ONLY gate inside
  # `RouteTrajectoryLineRenderer.DrawAll`, and it defaults true - but a lane whose entire
  # subject is the route overview line must not depend on a default it does not state.
  { cmd = "SetSetting", args = { name = "showRouteLines",     value = "true" }, expect = "OK" },
  # PRE-DOCK CLOCK POSITION (header section 2): 428.7 s before H-B's cycle-0 dock,
  # 11,226.8 s before H-A's cycle-1 dock. In FLIGHT with the map closed this draws NO
  # route line (section 1) - it is a clock position and a forward-jump proof, not a render
  # observation. The TS observation of the pre-dock side is a SECOND-ROUND pin, owed once
  # this run measures which anchor branch the unit took.
  { cmd = "TimeJump", args = { ut = "38600" }, expect = "OK", budget = 300 },
  # PACING SPACERS. `MapRenderTrace.IsLineBlink` raises when a proto line's ON/OFF pair
  # lands within 8 visual frames, and two back-to-back seam TimeJumps execute ~4-7 WALL
  # frames apart regardless of the game seconds between them (V8 runs _0810 / _0814 both
  # PARSEK-FAILed on exactly that shape). RecordingState is AnyScene and side-effect-free.
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # POST-DOCK CLOCK POSITION: 373.2 s past H-A's cycle-1 dock and 11,172.3 s past H-B's
  # cycle-0 dock. THE SAVE IS TAKEN HERE, so this is the epoch the TS dwell observes.
  { cmd = "TimeJump", args = { ut = "50200" }, expect = "OK", budget = 300 },
  # PERSIST the jumped clock. No mission state to persist - the route is already
  # committed in the fixture and drives from its own store.
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  # RE-KILL THE RECORDER immediately before the load the guard rejects (V5's measured
  # re-arm race: start 50.294 -> StopRecording 50.599 -> a SECOND start 50.842).
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  # RE-ENTER IN THE TRACKING STATION (R12's additive `scene=` arg, the H23 route). This
  # fixture has a focusable vessel and would otherwise route to FLIGHT, so a TRACKSTATION
  # landing can only mean the requested scene overrode the save-derived route.
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "trackstation" }, expect = "OK", budget = 300 },
  # TWO DWELL TICKS. No seam verb passes time in TS (every clock verb is RequiresFlight),
  # so these are the only time-passing instrument the scene has - named as ticks, not as
  # a dwell window. V5 measured the equivalent pair at 1.08 s of 1x TS time. That is
  # enough for the question this lane asks: the planetarium camera culls every frame, so
  # ONE frame is enough for `DrawAll` to build and draw, and the manifest's
  # `NoteRouteLineBuild` hook is signature-gated rather than rate-limited.
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # M-A7 RENDER-COMPOSITION CAPTURE. PLACEMENT IS THE ARGUMENT and it is pinned by
  # `test_every_declarer_exports_immediately_before_teardown`: the recorder accumulates
  # from Awake, so placement decides only how much of this lane's observation is already
  # inside the file - and taking it HERE takes it at a chosen instant rather than leaving
  # the composition to the scene-exit auto-flush that follows `FlushAndQuit`.
  # INERT by construction (`hlib.SEAM_VERB_TAIL_ROLE["ExportRenderManifest"]` = inert):
  # an in-memory read plus one file write in the KSP root, touching no vessel, no save and
  # no Parsek persisted state.
  { cmd = "ExportRenderManifest",                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# CLAIM-IS-NOT-GATE, and on a reading run the list is short for that reason.
#   D14 `scene-ts`  gated by the two R12 route tokens plus the TS host's own
#       initialization line - the same three V14T claims it on.
#   D14 `sandbox`   gated by the fixture (Mode = SANDBOX in the committed bytes).
#   D14 `kerbin`    gated by the route being a Kerbin -> Kerbin SameBody route whose STOP
#       endpoint resolves to a Kerbin-orbiting vessel, and by the TS host materializing a
#       ghost for it. It is the WEAKEST of the three and is claimed anyway because the
#       body is structural here rather than incidental: the route's scope resolution walks
#       every member's recording body and a non-Kerbin member would change the scope.
#
# DELIBERATELY NOT CLAIMED:
#   D10 `route-map-lines` - THE ONE THIS LANE IS ABOUT, and the whole point of not
#       claiming it. Supervisor decision 9 and H35 CLAIM-IS-NOT-GATE: the block below is
#       BARE, so `routeLineBuilds` is RECORDED and asserted on by nothing. A coverage
#       claim backed by no gate is exactly the vacuity this register exists to refuse.
#       It gets declared in the same commit that arms `routeLineBuilds`, citing the run.
#   D10 `dispatch-cadence` - section 2 could not settle the anchor branch, so this lane
#       reads the cadence and asserts nothing about it.
#   D10 `dock-producer` / `delivery` - this lane OBSERVES a route mid-cycle; it produces
#       no dock and delivers no cargo.
#   D11 anything - no mission loop is armed here.
[dimensionsCovered]
D14 = ["kerbin", "scene-ts", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING (hlib.validate_spec rejects a bare allowedAnomalies written
# after any [expectations.<sub>] header).
#
# THE SWEEP SHIPS FULLY ARMED, ON PURPOSE, AND THIS LANE MAY WELL RED BECAUSE OF IT.
# Every sibling TS lane in the V14T/V15T/V16T family measured `icon-off-orbit` on the
# ghost-proto creation frame after a single large TimeJump, deterministically, at three
# different parents - and this lane takes two such jumps. Pre-tolerating it would destroy
# the only thing worth having on a first flight: the COUNT it fires at. The S1.4 rule is
# explicit that a token is re-added WITH the flight that shows it, so the list stays
# empty until a run exists.
allowedAnomalies = []

[expectations.recordings]
# A BRACKET, NOT A PIN - and deliberately wider than it looks like it needs to be.
# The fixture ships 22 `.prec` sidecars and 22 RECORDING nodes. This lane starts no
# recording of its own and the step triple above kills the scene-entry promotion stub,
# but that pair kills ONE stub and is not a latch, so 23 is admissible. The ceiling adds
# headroom for the LOAD-TIME OPTIMIZER, which has never been observed on these bytes:
# this save carries a Dock and an Undock branch point (the suite's first of each) and two
# multi-member chains, so both `SplitAtUT` and `CanAutoMerge` have candidate populations
# here that no prior fixture presented.
#
# THE FLOOR IS 20, i.e. BELOW the fixture's own 22, and that is margin for the unknown
# rather than a prediction that something merges. A reading BELOW 22 is to be
# INVESTIGATED, not window-widened - and it is doubly load-bearing here, because a merge
# landing on any of the four ROUTE SOURCE recordings moves a `startUT` / `endUT` and flips
# the route to `SourceChanged` (header section 3), which is the one failure mode that
# would make this lane green and empty at the same time.
count = { min = 20, max = 30 }

[expectations.logContracts]
# THE ROUTE FRONT-DOOR CHAIN, in order, and every one of these is an ANTI-VACUITY gate
# rather than a nicety - a TS boot that unions no route mission observes an empty
# tracking station, and reading that as a pass is the V1/V2 failure this suite exists to
# refuse.
#   "RevalidateSources reason=.* routes=1 transitioned=0" - Info, from RouteStore, once
#       per revalidate pass. `routes=1` proves the committed ROUTE survived the load;
#       `transitioned=0` proves it did NOT flip out of Active (SourceChanged /
#       MissingSourceRecording / EndpointLost) under the load-time optimizer. This is the
#       falsifiable half of the whole lane - see header section 3.
#   "SelectGhostDrivingBackingMissions: ghostDriving=[1-9]" - the route front door
#       selected at least one GhostDriving route and materialized its backing mission.
#       VerboseOnChange on a per-state key, so the first pass always prints.
#   "TS startup loop units: .*routeMissions=[1-9]" - the TS host's OWN union line
#       (`GhostMapPresence.BuildStartupTrackingStationLoopUnits`). It says the route
#       mission reached the builder input for the one-shot startup create, which is the
#       difference between "a route exists" and "the tracking station is rendering it".
#   "Route line build: route=" - `RouteTrajectoryLineRenderer` built the overview line
#       set. Signature-gated (it fires only on an actual rebuild), which is the same hook
#       the manifest's `routeLineBuilds` census sits behind, so this token and that facet
#       are two readings of one event. VerboseRateLimited at 5.0 s on a per-route key -
#       the FIRST emission is never suppressed, which is the only one this dwell needs.
#   "Route line draw: enabled=True routesDrawn=[1-9]" - the per-frame draw summary, and
#       the token that separates BUILT from DRAWN. Rate-limited at 2.0 s on a shared key;
#       again only the first emission is required.
# THE TS SCENE CHAIN (H23's pins verbatim, as V14T uses them):
#   the two loadgame lines - the R12 trackstation BRANCH was taken and the load COMPLETED
#       against the TrackingStation expected scene. Falsifiable: this fixture has a
#       focusable vessel and would otherwise route to FLIGHT.
#   "ParsekTrackingStation initialized: created [1-9][0-9]* ghost vessel\(s\)" - the TS
#       host's own line, emitted only in that scene, and routing-agnostic by design: it
#       says a ghost was materialized without asserting which road built it.
#
# DELIBERATELY NOT REQUIRED ON A READING RUN: any cadence / anchor / dock-phase token
# (header section 2 could not settle the branch), any `body=` proto pin (which body frame
# the TS ghost lands in depends on where in the mission the loop clock parks, which is the
# same unmeasured quantity), and the probe/lens summaries V14T pins - those are re-pinned
# from what this run reads, not predicted.
required  = [
  "RevalidateSources reason=.* routes=1 transitioned=0",
  "SelectGhostDrivingBackingMissions: ghostDriving=[1-9]",
  "TS startup loop units: .*routeMissions=[1-9]",
  "Route line build: route=",
  "Route line draw: enabled=True routesDrawn=[1-9]",
  "loadgame trackstation route: booting to TRACKSTATION save=",
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  "ParsekTrackingStation initialized: created [1-9][0-9]* ghost vessel\\(s\\)",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The V3C run-3 self-detection guard: a refused backward jump is only a WARN, so
  # without this token a mis-derived anchor can green while dwelling nowhere. Both jumps
  # here are derived rather than measured (header section 2), which is exactly when this
  # guard earns its place.
  "timejump refused reason=backward-jump",
  # THE VACUITY FORBID, and the mirror of the three required front-door tokens: a route
  # the selector skipped by status is the one shape that makes this whole lane empty.
  # `skippedByStatus` prints on the SAME line as `ghostDriving`, so requiring
  # `ghostDriving=[1-9]` does not by itself exclude a second route being skipped - here
  # there is exactly ONE committed route, so a non-zero skip count means THE subject was
  # skipped.
  "SelectGhostDrivingBackingMissions: .*skippedByStatus=[1-9]",
]

[expectations.renderComposition]
# M-A7 Phase 4 / Wave B - DECLARED BARE 2026-08-26, **ARMED 2026-08-26** off TWO
# report-only readings that measure the census FACET FOR FACET: `2026-08-26_1741`
# (INVALID attempt 1 on the LoadGame stop/load race) + `2026-08-26_1742_a2` PASS, and
# `2026-08-26_1958` PASS attempt 1. Full ledger in section 6 of this file's header.
#
# WHAT THIS LANE IS FOR, restated at the block it is armed on: this is the FIRST subject
# in the suite that can produce a `ROUTE_LINE_BUILD` record or a per-unit `ROUTE` node at
# all. `routeLineBuilds = { min = 1 }` below is THE SUITE'S FIRST ROUTE WINDOW and the
# headline of the whole lane - and it only became expressible in the same change as this
# arming: `rendercompose.RENDER_COMPOSITION_WINDOW_KEYS` carried exactly
# ("dwells", "cycles", "unevaluable") until the three route/ownership facets were
# promoted (todo RENDERCOMPOSE-OWNERSHIPCHANGES-IS-NOT-WINDOWABLE). The window is
# written FROM the readings, not from the pre-registration - both measured 1.
#
# THE WINDOWS AND THEIR ARITHMETIC:
#   routeLineBuilds { min = 1 }   measured 1 twice. THE ANTI-VACUITY FLOOR of this lane:
#                                 without it a run whose route silently stopped drawing
#                                 stands `_rule_route` down to unevaluable and greens.
#                                 No ceiling: DrawAll builds once per member per draw
#                                 pass and the observation instant is not pinned to a
#                                 frame count, so a ceiling would pin sampling, not the
#                                 subject.
#   routeCoDrawViolations {max 0} measured 0 twice. The arbitration half: DrawAll must
#                                 skip a member the ghost polyline already owns
#                                 (`IsRenderingNonOrbitalLeg`). A violation is a real
#                                 finding, so the ceiling is exact rather than loose.
#   unevaluable { max = 10 }      measured 3 twice (`no-dwells-attributable-to-unit`,
#                                 `no-cycle-rollover-events`,
#                                 `warp-hold-traversal-evidence-absent`). 10 is ~3.4x
#                                 the measurement - the SAME ratio-to-measurement the
#                                 siblings carry (V14M 200/56 = 3.6x, V8 250/76 = 3.3x,
#                                 V25M 1400/410 = 3.4x, V6M 300/84 = 3.6x), SCALED to
#                                 this census rather than copied. It is a small integer
#                                 here only because the census IS small: this lane holds
#                                 no closed dwell and decimates no endpoint population,
#                                 so there is no seam-endpoint regime to absorb.
#   requireSeamKinds ["rigid"]    measured rigid 12 on BOTH readings and NOTHING else.
#                                 `flexible-soi` is absent BY SCOPE, not by chance: the
#                                 route is SameBody (Kerbin -> Kerbin), so requiring it
#                                 would red the readings it was armed off.
#
# NO `dwells` AND NO `cycles` FLOOR, and the suite's shared `dwells = {min = 1, max = 32}`
# convention DOES NOT FIT THIS LANE - said explicitly rather than copied. Both readings
# measure dwells 0 (+1 open) and cycles 0: a single-epoch tracking-station observation
# closes no dwell and rolls over no cycle, by construction. A floor on either would red
# the two green runs this block was armed from, and a `{min = 0}` pin can never red at
# all (`_validate_armed_unreddable` refuses it pre-launch). The anti-vacuity job those
# keys do on a LOOP lane is done here by `routeLineBuilds` - a floor on the surface this
# lane exists to observe.
#
# `warpBuckets` NEVER: the clock moves by two instantaneous TimeJumps, so the histogram
# is 1x-only by construction (56 / 59 frames, every other bucket 0).
# `ownershipChanges` NOT DECLARED although it is now windowable: measured 0 twice, which
# is correct - the TS host publishes no TracedPath ownership on this subject - and a
# `{max = 0}` there would assert the ABSENCE of a surface this lane does not exercise.
# V6M is the lane that owns that clause.
gating = true
routeLineBuilds = { min = 1 }
routeCoDrawViolations = { max = 0 }
unevaluable = { max = 10 }
requireSeamKinds = ["rigid"]

[runtime]
# 300 LoadGame + 300 TimeJump + 300 TimeJump + 300 LoadGame(TS) + 120 export + the fast
# non-deferred verbs + KSP boot + collect. Every jump is instantaneous, so the ~14 ks of
# game time costs no wall clock; V14T's structurally identical 18-step shape measured
# ~50 s end to end.
budgetSeconds = 2400

[retry]
# One retry absorbs the V5 promotion-recorder re-arm race (which this fixture's
# committed-tree-for-the-active-craft shape makes more likely than most) and ordinary
# seam flakes. It does NOT absorb a mis-derived anchor: that reproduces exactly on
# attempt 2.
policy = "once"

[expectedFail]
bugId = ""
