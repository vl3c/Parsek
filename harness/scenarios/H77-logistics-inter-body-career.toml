schema = 1
id = "H77-logistics-inter-body-career"
tier = "nightly"
# H34-logistics-inter-body, CAREER STYLE. H34's driver steps verbatim (boot straight to
# the Space Center, run the `Logistics` category's SPACECENTER slice: the inter-body
# builder-shape cell and its one sibling) over `gloops-airshow-career`; the only variable
# moved is the fixture's game mode.
#
# THE FIXTURE. `gloops-airshow-career` is built by construction from H34's own
# `gloops-airshow` by `harness/tools/build_route_career.py` (drift gate
# `harness/lib/test_route_career.py`): `Mode = CAREER`, `fresh-career`'s PARAMETERS (the
# source's ParsekSettings child kept), Funding 500000 / R&D 100 / Reputation 0, the
# 29 + 3 granted tech nodes H73's host carries and every facility at its TOP level.
# The source has no Parsek GameState directory, so there is no ledger to edit; the
# vessels, roster, the ParsekScenario node and `Ships/` are the source's bytes.
#
# NOT FIT FOR LEDGER GROUND TRUTH (L2-style) CHECKS: the source was a SANDBOX save.
#
# WHAT IT PROVES, beyond H34's tokens (kept verbatim): the inter-body cell's real
# committed Kerbin -> Duna route fires a full cycle and skips a modulo window in a
# career with live Funding / R&D / Reputation singletons, and moves no pool doing so.
#   REQUIRED  `Seeded initial funds: amount=500000,` / `Seeded initial science:
#             amount=100,` - the ledger seeded off the career save's own pools, which
#             a SANDBOX host never does (the patcher skips with no Funding singleton).
#   FORBIDDEN any `PatchFunds/PatchScience/PatchReputation: <old> -> <new>` pool WRITE
#             (Info, logged only when the patcher actually moves a pool), any
#             drawdown-guard clamp, the seed refusal, and `Built route .* mode=SANDBOX`.
#             The FIRED line is a dispatch + debit + delivery; any of the three that
#             moved a pool through Parsek reds on the write line.
# NO LEDGER ORACLE BLOCK: `FlushAndQuit` of a non-isolated SPACECENTER batch is not a
# pinned save point on this lane, and the pool-write forbids carry the gate. No D8 claim
# for the same reason (CLAIM-IS-NOT-GATE: the forbids alone gate nothing positive).
#
# THE TALLY WAS AUTHORED INTERIM (`total=47` literal, `passed=` and `skipped=` free) with
# H34's split, 2 / 0 / 45 (45 scene-skipped FLIGHT cells, 2 executable, both passing),
# written as the PREDICTION, since neither SPACECENTER cell reads the game mode.
#
# FLIGHT 1  `2026-10-21_2022`, PASS attempt 1, wall 44 s, automation DLL sha256 prefix
#           7bdd8016 (worktree 4772612, C# = main 92f3a15). MEASURED: `BATCH_COMPLETE v1
#           total=47 passed=2 failed=0 skipped=45 category=Logistics scene=SPACECENTER`,
#           the FIRED and modulo SKIPPED lines, both career seed lines (and, on this
#           lane only, the reputation seed at 0), zero `[Parsek][ERROR]`, no
#           `Patch<Pool>: <old> -> <new>` write, no drawdown clamp. saveParse
#           (report-only): no route in the produced save, 0 supersede rows, 0
#           tombstones, 0 rewind points. THE PREDICTION HELD EXACTLY: H34's split, so
#           the tally is now PINNED WHOLE off this flight and the id has LEFT
#           IngameBatchWiringGroupTests.INTERIM_PIN_IDS. `skipped=45` is the attribute
#           floor (H34's), so it needs no RUNTIME_SKIPS entry.
#
# THE SKIP ROSTER - all 45 scene-filtered, none at run time: `Scene eligibility skip
# summary: skipped=45 currentScene=SPACECENTER byRequiredScene=FLIGHT:45`. The two that
# ran and passed: LogisticsTooltipEchoImguiTest.TooltipEchoBox_StableControlCount_
# NoImguiException and RouteInterBodyBuilderShapeInGameTest.InterBodyRoute_RealBuilder_
# ClassifiesReaimWindows_AndModuloFires.
#
# FAST-LANE CHECKLIST item 9, flight_efficiency.py (flight 1, `2026-10-21_2022`):
# pre-launch 3.0 s, boot 24.7 s, seam steps 6.2 s (LoadGame 5.86 s, RunTests 0.33 s),
# gaps 1.0 s, quit 0.7 s, post-quit 8.5 s, retries 0. Nothing to trim: boot and the
# load are the cost.
description = "H34-logistics-inter-body-career style: boot to the Space Center over gloops-airshow-career, H34's host save converted to CAREER by build_route_career.py, and run the Logistics category's SPACECENTER slice, gating that the inter-body route's fired cycle and modulo skip happen with the ledger seeded off the career save (funds 500000, science 100) and with no Parsek pool write or drawdown clamp. FLOWN GREEN 2026-10-21 on its first flight (2026-10-21_2022): 2 passed / 0 failed / 45 skipped, H34's split, pinned whole."
instanceProfile = "stock-minimal"
tags = ["logistics", "route", "inter-body", "reaim", "scene-routing", "career", "H77",
        "flown", "reading-iteration"]

[fixture]
saveTemplate = "fixtures/saves/gloops-airshow-career"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" },                    expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },                     expect = "OK" },
  { cmd = "RunTests",   args = { category = "Logistics" },                                          expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                           expect = "OK" },
]

[dimensionsCovered]
# D14 career is pinned to the fixture's `Mode = CAREER` by test_d14_game_mode.py and to
# the run by the two career seed lines. H34's D10 rows are not re-claimed (the H34 rule).
D14 = ["career", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
required  = [
  "loadgame spacecenter route \\(requested\\): resuming to SPACECENTER save=",
  "loadgame complete scene=SPACECENTER save=.* game-loaded=true expected=SpaceCenter",
  "LoopRoute: route .* cycle=cycle-0 FIRED full cycle \\(dispatch\\+debit\\+delivered\\) at ut=",
  "LoopRoute: route .* window 1 SKIPPED by cadence modulo \\(N=2 anchor=0 basis=ReaimWindows\\) - marker advanced, nothing emitted",
  "BATCH_COMPLETE v1 total=47 passed=2 failed=0 skipped=45 category=Logistics scene=SPACECENTER",
  "Seeded initial funds: amount=500000,",
  "Seeded initial science: amount=100,",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "Built route .* mode=SANDBOX",
  "refusing to treat current (funds|science|reputation) as initial",
  "Patch(Funds|Science): -?[0-9]+\\.[0-9] -> ",
  "PatchReputation: -?[0-9]+\\.[0-9]+ -> ",
  "GUARDED (DRAWDOWN|UPLIFT) clamped resource=",
]

[runtime]
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
