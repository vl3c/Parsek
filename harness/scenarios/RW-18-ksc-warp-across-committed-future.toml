schema = 1
id = "RW-18-ksc-warp-across-committed-future"
# =====================================================================================
# RW-18: A WARP AT THE SPACE CENTER ACROSS A STRETCH OF COMMITTED ROWS (the rewind ledger campaign,
# plan row 17).
#
# THE RULING UNDER TEST: a plain Rewind-to-Launch only moves the clock, committed costs are
# reserved, and each committed row applies once when the clock reaches it. RW-1 and RW-3 cross
# their rows in one warp and read the end. QL-14 / QL-14T cross them in flight and in the Tracking
# Station. This lane stops inside the stretch and reads the pools at each stop.
#
# WHAT THE CODE DOES (read 2026-10-31, main e96d2c9bb, RW-1's header, the committed-value rule):
# after the rewind the Runway's cost stays reserved, so the live funds already read the pool net of
# it; the crossing of the upgrade moves no pool and raises the level. Each accept then pays its
# advance as the clock reaches it. So a spend FIRST makes every stop equal to the pool the career
# held at that row before the rewind, with no reservation left to subtract.
#
# PLAN (cs-career-mun4, UT ~185734; UTs are the plan):
#   boot       LoadGame persistent at the Space Center; warp to 185800.
#   H          a Jumping Flea on the pad, recorded to 185840, committed, recovered at its marker.
#   R1 185900  Runway upgrade (75000).
#   R2 185940  accept f1fb89dc (+37500).
#   R3 185980  accept 8ea47e1c (+9450).
#   R4 186020  accept f89d782a (+31920).
#   rewind     Rewind-to-Launch onto H: clock ~185785, the four rows committed future.
#   stop 1     warp to 185920: R1 crossed, the level up, the pools as they stood at R1.
#   stop 2     warp to 186000: R2 and R3 crossed in one warp, the pools as they stood at R3.
#   stop 3     warp to 186040: R4 crossed, the pools as they stood at R4.
#   check      an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# STATUS: LIVE-PROVEN 2026-10-31, `2026-10-31_0232` PASS attempt 1 (DLL c39bde83, main e96d2c9bb). The rewind read funds 82546.18 with the
# Runway's 75000 reserved. Stop 1 at 185920 crossed the upgrade: pool unchanged, equal to R1. Stop 2 at 185999.9
# crossed two accepts one row at a time: 129046.18, equal to R3. Stop 3 at 186039.9 crossed the last: 160966.18,
# equal to R4. Each row logged one `Clock-crossing reached committed-future rows: crossed=1`; no pool adjustment,
# no guard clamp, no take-back; LedgerGroundTruth 3/3 hardFailures=0; ledger_audit PASS.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, a warp at the Space Center across a stretch of committed rows (plan row 17): on cs-career-mun4 a committed pad Flea, a Runway upgrade and three contract accepts at the Space Center, a Rewind-to-Launch before them, and a warp in three stops: at each stop the crossed rows have applied once and the pools equal what the career held at that row before the rewind; LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-18", "career", "ledger", "rewind", "rewind-to-launch", "facility-upgrade", "contracts",
        "ksc-marker", "editor", "ground-truth", "ingame-batch", "timeline-ops"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 9 x 120 warps + 2 x (120 GoToEditor + 180 LaunchFromEditor)
# + 180 StartRecording + 120 CommitTree + 120 ExitToSpaceCenter + 60 KscMarkerRecover + 4 x 60
# KscAction + 300 rewind + 5 x 120 SaveGame + 540 RunTests = 3920; runtime 4700 adds the inert steps
# and FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },
  # ---- H: the Flea on the pad, recorded, committed, recovered at its marker ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "h",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "185840" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw18-h-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw18-01-after-h-commit" },                   expect = "OK", budget = 120 },
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${h.pid}" },                                 expect = "OK", budget = 60 },
  # ---- the four committed Space Center rows, the spend first ----
  { cmd = "WarpToUT",       args = { ut = "185900", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "KscAction",      args = { action = "upgrade-facility", facility = "SpaceCenter/Runway" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw18-r1" },                                  expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185940", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "f1fb89dc-a471-42cf-94da-de4bb1080512" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw18-r2" },                                  expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185980", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "8ea47e1c-ef7d-4a0a-9134-7bf70b442250" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw18-r3" },                                  expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "186020", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "f89d782a-39ce-42a8-bd07-646c93de1a14" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw18-r4" },                                  expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw18-02-after-rows" },                       expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw18-before-rewind" },                       expect = "OK" },
  # ---- the rewind onto H's launch ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw18-rewound" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw18-03-after-rtl" },                        expect = "OK", budget = 120 },
  # ---- the warp, in three stops ----
  { cmd = "WarpToUT",       args = { ut = "185920", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw18-stop1" },                               expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "186000", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw18-stop2" },                               expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "186040", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw18-stop3" },                               expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw18-04-after-crossing" },                   expect = "OK", budget = 120 },
  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186070" },                                      expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

