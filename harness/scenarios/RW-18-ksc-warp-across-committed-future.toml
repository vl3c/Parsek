[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",
  "MISSIONMARK label=rw18-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw18-rewound ut=1857[0-9]{2}\\.",

  # ---- stop 1: the upgrade crossed, the level up ----
  "MISSIONMARK label=rw18-rewound ut=(?:(?!MISSIONMARK label=rw18-stop1 )[\\s\\S])*?Clock-crossing reached committed-future rows: crossed=[1-9][0-9]* ",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw18-r1 ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw18-stop1 ut=",

  # ---- stop 2: two accepts crossed in one warp ----
  "MISSIONMARK label=rw18-stop1 ut=(?:(?!MISSIONMARK label=rw18-stop2 )[\\s\\S])*?Clock-crossing reached committed-future rows: crossed=[1-9][0-9]* ",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw18-r3 ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw18-stop2 ut=",

  # ---- stop 3: the last accept ----
  "MISSIONMARK label=rw18-stop2 ut=(?:(?!MISSIONMARK label=rw18-stop3 )[\\s\\S])*?Clock-crossing reached committed-future rows: crossed=[1-9][0-9]* ",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw18-r4 ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw18-stop3 ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=",
  "invokerewindtolaunch refused",
  "\\[TakeBack\\] Took back ",
  "take-back shortfall",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
  # ---- nothing applies twice: after the rewind stock pays no accept of its own ----
  "MISSIONMARK label=rw18-rewound ut=[\\s\\S]*Game state: ContractAccepted ",
]

[runtime]
budgetSeconds = 4700

[retry]
policy = "once"

