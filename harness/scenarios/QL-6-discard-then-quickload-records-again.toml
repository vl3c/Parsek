schema = 1
id = "QL-6-discard-then-quickload-records-again"
# RESHAPED 2026-10-20 FOR "LOAD RESTORES THE SAVE" PHASE 2 (design
# docs/dev/design-load-restores-the-save.md 4.2 / 4.4 / 5 S5 / 8; plan Phase 2 step 7). NOT
# FLOWN in this shape. THE EXPECTED OUTCOME FLIPS (design 8 reverses QL-R1 for save-file
# loads): the F9 carries `playerLoad=true`, a Cold save-file load, so the discarded flight
# RESUMES WITH ITS RECORDING, as a KSP restart into the quicksave would. The session reset
# forgets the discarded-tree set, the discard's reap no longer destroys the bytes
# (`RecordingStore.DeleteRecordingFiles` files each hashed head into `_versions`, design
# 4.4), and the quicksave names those hashes, so the restore resolves the trajectory from
# `_versions` and promotes it back to the head (`Sidecar version resolved ... source=version
# promoted=True`). The recorder resumes into the SAME tree id the discard noted (a
# backreference now REQUIRES the equal id), and the decline / fresh-tree lines of the
# old ruling are forbidden. The lane id keeps its old name; the description is current.
# The text below the rule is the QL-R1 shape this lane flew before Phase 2, kept as
# history; this block is authoritative.
# =====================================================================================
# QL-6 (todo QUICKLOAD-INTO-DISCARDED-FLIGHT-RECORDS-AGAIN, owner ruling 2026-10-06): F5
# during a recorded flight, Discard that flight, then F9 back into the quicksave. The
# quicksave still names the discarded tree as its active tree, but the discard deleted
# every sidecar, so the load must NOT resume the recorder into the deleted ids; it must
# start a FRESH tree for the loaded vessel ("as if it had never been discarded").
#
# WHICH DISCARD. The TA-15 fix (2026-10-07) noted only `DiscardPendingTree` (the merge
# dialog's Discard). The in-flight discards that tear the LIVE tree down through
# `ParsekFlight.AutoDiscardActiveTreeCore` (the pre-switch dialog's Discard, the
# scene-exit no-op and idle-on-pad discards) and the `DiscardTree` verb never noted the
# tree, so an F9 after one of them still resumed into the deleted ids. This lane's
# branch makes both reaps note the tree; the `DiscardTree` verb is the seam stand-in for
# the in-flight discard (the merge dialog's Discard is not seam-drivable; before Phase 2 it
# also rewrote quicksave.sfs, which design 4.6 stops).
#
# FLOW (gloops-airshow, the pad pod, save clock UT 21.16):
#   record to UT 40, F5 (`SaveGame name=quicksave`), stop + DiscardTree (the verb's reap
#   deletes the one sidecar set and notes the tree), F9 (`LoadGame name=quicksave`, an
#   in-session load into FLIGHT), fly on to UT 60, then read the recorder and commit.
#
# WHAT GATES IT. The tree id the discard noted is captured once and threaded through
# the decline line, the flight-ready start line and the recorder read, which must name a
# DIFFERENT tree (a negative lookahead on the backreference). The recordings count does
# not discriminate (the pre-fix resume also commits one recording), so the logs do.
# Every `Noted tree` line is Verbose, hence `verboseLogging=true` before the discard.
# =====================================================================================
tier = "nightly"
description = "QL-6: F5 during a recorded flight of the pad pod, Discard the flight in flight, then the player's F9 back into the quicksave (playerLoad=true, a Cold save-file load). The discarded flight resumes with its recording: the trajectory resolves from the version the discard retained, the recorder resumes the same tree, and it commits."
instanceProfile = "stock-minimal"
tags = ["QL-6", "TA-15", "timeline-ops", "quickload", "discard", "live-recording", "D1"]

[fixture]
saveTemplate       = "fixtures/saves/gloops-airshow"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },       expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },  expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging",     value = "true" },   expect = "OK" },
  { cmd = "StartRecording",                                                           expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "40", maxRate = "1" },                      expect = "OK", budget = 120 },
  # F5 with the recorder live: the quicksave holds the tree as its active tree and the
  # OnSave writes its sidecars.
  { cmd = "SaveGame",       args = { name = "quicksave" },                            expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                            expect = "OK" },
  { cmd = "DiscardTree",                                                              expect = "OK" },
  # F9: the player's load of the quicksave (playerLoad=true), a Cold save-file load.
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "quicksave", playerLoad = "true" }, expect = "OK", budget = 300 },
  { cmd = "WarpToUT",       args = { ut = "60", maxRate = "1" },                      expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                           expect = "OK" },
  { cmd = "StopRecording",                                                            expect = "OK" },
  { cmd = "CommitTree",                                                               expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                             expect = "OK" },
]

[dimensionsCovered]
D1  = ["discard-rollback"]
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The resumed tree's one recording, committed (its head promoted back from `_versions`).
count = { min = 1, max = 1 }

[expectations.logContracts]
required = [
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "startrecording recordingId=[0-9a-f]+ already=false",
  "discardtree sidecar-reap: treeRecordings=1 knownAfterDiscard=0 reaped=1 failed=0\\b",
  "discardtree discarded=true",
  # The reap keeps the bytes: the hashed head is filed as a version (Verbose).
  "discardtree sidecar-reap: [\\s\\S]*Retained head as version: ",
  "loadgame start save=\\S+ name=quicksave scene=FLIGHT [^\\r\\n]* playerLoad=true",
  # THE F9 IS A SAVE-FILE LOAD (design 4.1).
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave route=Focusable",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*\\[LoadPolicy\\] Save-file load intent armed: nodeUT=[0-9.]+ scene=FLIGHT",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave (?:(?!Load classified: )[\\s\\S])*Load classified: early=Cold refined=Cold scene=FLIGHT [^\\r\\n]*\\bcoldReason=save-file\\b",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*Save-scoped session state reset: reason=save-file ",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*OnLoad game state from save node: ledgerRows=[0-9]+ ",
  # The trajectory resolves from the retained version and is promoted back to the head.
  "loadgame player-load: firing [\\s\\S]*Sidecar version resolved: rec=[0-9a-f]{32} kind=prec hash=[0-9a-f]{16} source=version promoted=True",
  "loadgame player-load: firing [\\s\\S]*Sidecar version resolution summary: reason=cold-onload files=[1-9][0-9]* head=[0-9]+ version=[1-9][0-9]* promoted=[1-9][0-9]* ",
  "OnLoad: cold-start active tree detected \\(state=Limbo\\) . deferred to OnFlightReady as Quickload",
  # THE DISCARDED FLIGHT RESUMES, into the SAME tree the discard noted.
  "Noted tree '[^']*' id=([0-9a-f]+) as discarded this session \\(removedSidecarSets=1, new=true\\)[\\s\\S]*RestoreActiveTreeFromPending: resumed recording tree '[^']*' activeRec='[0-9a-f]{32}'[\\s\\S]*recordingstate recording=true tree=\\1 ",
  "committree committed=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "sidecar hydration failure",
  # THE OLD RULING (QL-R1, design 8): no decline, no fresh tree.
  "TryRestoreActiveTreeNode: saved active tree '[^']*' id=[0-9a-f]+ was discarded this session",
  "Fresh recording after discarded restore",
  "loadgame player-load: firing [\\s\\S]*Load classified: early=InSession refined=QuickloadFlight",
  # The F9 must reach the resume.
  "TryRestoreActiveTreeNode: skipped active tree",
  "Quickload resume prep skipped",
]

[runtime]
# Budget arithmetic (M-A5 S8): every deferred verb waits max(step budget, 600) + 60 =
# 660 s at worst. The two LoadGames and the two WarpToUTs are deferred (2640); the
# StartRecording scene wait (180), CommitTree (120), SaveGame (120) and the fast verbs
# add their own. 3300 clears it.
budgetSeconds = 3300

[retry]
policy = "once"

[expectedFail]
bugId = ""
