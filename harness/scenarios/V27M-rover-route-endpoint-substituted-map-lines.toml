  "Route line members: route=[0-9a-f]{8} heads=2 segments=2 groups=1 legs=1",
  "Route line build: route=[0-9a-f]{8} members=2 groups=1 legs=1 transferDropped=0",
  "Route line draw: enabled=True routesDrawn=0 legsDrawn=0 skippedOwned=1 malformed=0 other=0 deact=0 cache=1 frame=[0-9]+ ownedLegs=1 paintedLegs=0",
  "Polyline frame: scene=FLIGHT drawn=1 warp=1x suppressed=0 hidden=0",
  "exitmapview ok mapOpen=false already=false",
