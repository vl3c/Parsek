  "routecommand complete action=activate route=.* name='V27M Substituted Endpoint' match=.* statusBefore=Paused status=Active",
  # ---- the rebind (RVR-18's chain, on this run's own bytes) ----
  "Endpoint proximity transport excluded: skipped=1 reason=route-own-transport body=Kerbin",
  "Endpoint proximity step: resolved=1 pid=2875537755 reason=- body=Kerbin",
  "Route endpoint transferred: route=[0-9a-f]{8} stop=0 role=destination from=2123618197/'<unknown>' to=2875537755/'A' step=proximity distance=[0-9]+\\.[0-9]{2} body=Kerbin at ut=",
  "Endpoint resolved: step=root-part rootPartUId=3962694490 pid=2875537755 reason=-",
  "Delivery: route [0-9a-f]{8} cycle=cycle-0 resources=1 inventoryUnits=3/3 inventoryUnitsSkipped=0 partial=0",
  # ---- the route still ghost-drives after it ----
  "SelectGhostDrivingBackingMissions: ghostDriving=1 skippedByStatus=0 skippedNull=0 totalRoutes=1",
  "\\[Mission\\] Mission loop units rebuilt \\(signature changed\\): committed=5 routeMissions=1",
