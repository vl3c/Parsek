  "\\[KSCGhost\\] Eligible breakdown: looping=0 terminal\\(Landed=3, <null>=1, Docked=1\\) ineligible\\(\\(none\\)\\)",
  "KSC SURFACE playback resolved: recording=.* body=Kerbin branch=absolute",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "routecommand rejected",
  "timejump refused reason=backward-jump",
  # the mirror refusal (RVR-19's shape) must not fire: `A` is a candidate here
  "Endpoint proximity step: resolved=0",
  "reason=no-candidate-after-transport-exclusion",
  "BLOCKED kind=EndpointLost",
  "Route line draw: .* malformed=[1-9]",
  "Route line draw: .* other=[1-9]",
  "KSC point skipped: recording=.* body=",
  "KSC segment skipped: beforeBody=",
]

# GATING since the armed re-flight: the measured shape of the reading run's produced save,
# plus the identity facet that flips if the rebind ever stops persisting.
[expectations.routes]
gating                = true
count                 = { min = 1, max = 1 }
dormant               = { min = 0, max = 0 }
stops                 = { min = 1, max = 1 }
sourceRefs            = { min = 2, max = 2 }
completedCycles       = { min = 1, max = 1 }
skippedCycles         = { min = 0, max = 0 }
statuses              = { Active = { min = 1, max = 1 } }
originBodies          = { Kerbin = { min = 1, max = 1 } }
destinationBodies     = { Kerbin = { min = 1, max = 1 } }
destinationVesselPids = ["2875537755"]

# Bare by measurement, not by omission: the export runs from the SPACECENTER scene and reads
# `routeLineBuilds=0` there (header, correction 2); the flight-map evidence is the log.
[expectations.renderComposition]

[runtime]
budgetSeconds = 3000

[retry]
policy = "once"

[expectedFail]
bugId = ""
