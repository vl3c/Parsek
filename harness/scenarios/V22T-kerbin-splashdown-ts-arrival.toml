# ---------------------------------------------------------------------------------
# RUN 2 LEDGER (2026-08-24, PARSEK-FAIL(expectations) attempt 1, driver green).
# The TS entered at the +140 epoch - PAST the replay window end (touchdown
# offset 1,240.14, window 1,241.88) - and the init walk read `created=0 ...
# skipped: debris=6 ... loopMemberHidden=3`: the three mains were HIDDEN as
# out-of-window, so nothing could render and every map-lens pin was
# unreachable. ROUND 3 MOVES THE JUMP INTO THE IN-WINDOW LANDED SLIVER
# (22,825 = L1 + 1,241.0; the window ends 22,825.85) so TS entry lands with
# the member in-window and landed, keeps the GhostCreated pin as THE open
# question (can the TS materialize a proto for an in-window LANDED member at
# all - unmeasured either way), adds the init-walk presence pin, and drops
# the polyline/TracedPath family + the parity/census presence pins with
# V22M's structural documentation (no map camera; summaries ride map protos).
# ---------------------------------------------------------------------------------
