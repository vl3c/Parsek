description = "**RE-PINNED 2026-08-24 OFF ITS FIXTURE'S REAL BYTES**, `PENDING_FIXTURE_LANES` entry retired in the same commit. `fixtures/saves/kerbin-splashdown-recorded` EXISTS, harvested `--keep-parsek` from `B4-reentry-splashdown` run 2026-08-24_1431 (PASS attempt 1). Real tree id; ONE jump UT, **RE-DERIVED IN ROUND 2 TO 22,964 OFF THE MEASURED LOOP CLOCK** after reading run 1 (`2026-08-24_1619`, retry `_1620`) red INVALID(driver-rewind) on `timejump refused reason=backward-jump` - the spec's own forbid working as pre-registered, with no TS render pin reached and nothing about the lens measured yet. It is L1 = 21,583.965183089826 (`startloopplayback initiated: relaunchUt=`) plus the 1,240.1436 s touchdown offset plus the family's +140 bracket, reused verbatim from V22M's third cycle-1 bracket so the two lanes observe the SAME INSTANT of the same loop from two scenes - which is what makes a divergence attributable to the HOST rather than the epoch. **THE ROUTING PRE-REGISTRATION THIS LANE INHERITED IS REFUTED**: run 1 measured `constraints=1 [Rotation(Kerbin) P=21549.425183089825 off=0]` with `method=single-rotation` - a launch-body-only loop starves only the TARGET side while the launch SITE supplies its own constraint, quantizing the cadence to Kerbin's ROTATION period, not the faithful span. No gate fired on it, because both roads were left unrequired AND unforbidden, and they stay that way. Run 1 also measured two mechanics this half must respect: the loop unit's span is the TRACK_SECTION ENVELOPE (1,241.8836, 1.740 s past `explicitEndUT`), and `StartLoopPlayback` issues its OWN forward jump to relaunch-15 s. THE TERMINAL MEASURED `Landed`, NOT `Splashed` - a dry-land shoreline touchdown east of KSC - so the previously-open `terminalStates` facet is declared from the bytes and stays report-only; the tree measures SEVEN recordings against the 8-9 this pair predicted. The Tracking-Station half of the Kerbin surface-arrival pair (roadmap gap G3a); V22M's header carries the seed derivation, the re-pin recipe and the routing pre-registration and they are not restated. TWO TS-SPECIFIC LENS CHOICES, both of which would cost a flight if got wrong: (a) `Polyline frame:` is SCENE-STAMPED, so this lane pins `scene=TRACKSTATION` and copying V22M's `scene=FLIGHT` form would be unsatisfiable; (b) the `phase=MarkerDecision surface=AtmosphericMarker` tracer line is deliberately NOT required, because it is emitted CHANGE-ONLY and this lane enters TS already PAST the descent onset on a single dwell, so it may legitimately never fire - the per-second `Director TracedPath suppress` line carries the same claim and repeats, so it is required instead (that emitter is also the one place `MapRenderTrace.Bool()` lowercases its bools, another reason not to reach for it casually). The TS destination-frame pin is the Tier-A structural `phase=GhostCreated surface=ProtoIcon ... body=Kerbin scene=TRACKSTATION`, emitted at Info; note what it does NOT say - a proto icon being CREATED is not a claim that a proto LINE is drawn at the arrival, and the suppression pins carry that separately. THE FORTY-TICK TS DWELL IS NOT OPTIONAL and V17T paid for the lesson: on a loop-armed subject the init walk contributes zero ghosts when the tail is segment-less, the real ghosts arrive on the DYNAMIC overlap path at `MaxSpawnsPerFrame = 2` newest-cycle-first, and V17T's two-tick phase cut the census off at 6 of 20 instances. It matters more here because a splashdown recording ENDS below atmosphere - exactly the tail the init walk has no orbit source for - so `ParsekTrackingStation initialized: created N` is NOT required with a nonzero N (V17T retired that forbid and repeating it would re-litigate a settled reading). The V5 re-kill pair before the TS load is kept verbatim. THIS LANE RUNS ITS OWN CONTROL rather than sharing V22M's, per the rule the V19 pair established on 2026-08-21 when it first discharged criterion (b): each half inverts a token on its OWN lens (`_0855` / `_0858`), because the halves pin different lenses and one shared control proves exactly one of them. `allowedAnomalies = []` on purpose with TWO possible raises pre-registered and neither pre-tolerated - `rigid-seam-tangent-discontinuity` at the owned descent draw, and `icon-off-orbit`, whose family V19T has since NARROWED: six raises at three parents, then V17T silent with two variables moving at once, then V19T silent with self-overlap YES and nested-SOI NO - which EXCLUDES nested-SOI and leaves self-overlap the surviving candidate, with no mechanism claimed. This lane is a further data point on that open reading, not a test of a settled one. NOTHING IS ARMED."
