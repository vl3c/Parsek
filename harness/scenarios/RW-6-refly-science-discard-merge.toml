#   (FlightRecorder.cs:6826), End reason=retry (RevertInterceptor.cs:294).
#
# PRE-REGISTERED READINGS (check these first if the first flight reds):
#   - RW-5's own readings for the shared prefix (no RP, focus moved, stash refused, the
#     check launch obstructed): this lane flies RW-5's first 60 steps.
#   - `partaction rejected reason=partaction-event-unavailable` on the experiment press: the
#     crew report's DeployExperiment is not live (no crew aboard: read `Cleared reserved` /
#     `Swapped reserved` against G's launch).
#   - attempt 1 or 2 inspect reads `exp:data=0` after the 1x wait: stock had not stored the
#     report yet; raise the wait (keep it under 185797, the stand's recording end).
#   - the attempt 2 pod inspect reads `exp:data=1` right after the invoke: the discarded report
#     came back with the rewind point's world, a real "trace" (a product finding).
#   - `reflyrevert rejected` with the experiment results dialog up: stock's ExperimentsResultDialog
#     held the pause menu; the verb opens it through PauseMenu.Display.
#   - `AppendRelations outcome=refused-unflown-provisional`: the pad attempt recorded no point
#     (read the `recordingstate ... points=` before the merge).
#   - `Merge dominance check ... result=refuse`: read pool / ut; the attempt filed nothing that
#     lowers a balance, so a refuse is a product finding.
#   - the post-merge funds forbid fires (`PatchFunds: <x> -> <y>` with y not 150632.2): the
#     RW-5 leak mis-read on the merge road (same fix).
#   - `KSC science recorded: ... recordingId=` not the merged attempt's rec: the recovery picker
#     filed the science under HEAD, TIP or none; the sealed-slot probe then answers OK (it would
#     start a third session). Read `PickRecoveryRecordingId` / `ResolveKscScienceRecordingId`.
#   - the re-entry LoadGame lands anywhere but `scene=FLIGHT`, or classifies Cold: read
#     `loadgame start ... requestedScene=` and the save's FLIGHTSTATE activeVessel; a pool
#     move there (the discard-window forbids span it) is a load defect, not the lane's.
#   - the probe refused with a different reason (`unknown-rp`): the merge reaped the point
#     (slot 1 was predicted open, RW-5 measured `stableLeafUnconcluded ... terminal=SubOrbital`).
#   - recordings 38 or 40: the split did not run, or the optimizer split a recording; read
#     `Split origin` and `listhandles kind=committed count=`.
#
# Owed off the first flight:
#   - the crew report's value (1.5 cfg / 3 L3-measured; the alternation collapses to one) and
#     the science pool after it (21.67 / 23.17);
#   - the Tracking Station recovery's funds payout (regexed `[1-9][0-9]*`) and the end pools;
#   - the auto-seal reason suffix, terminalKind, qualifies, the Loss swap variant (A predicted);
#   - the sealed probe's named row (ScienceEarning, VesselRecovered or a recovery FundsEarning);
#   - the recordings count (39 pinned: RW-5 measured 37 + the TIP of the split + the merged
#     attempt; attempt 1's recording is pruned), the rewind point count after the merge (1
#     predicted), the saveParse rewind block (report-only);
#   - the batch split (`total=3` pinned from the source, `passed` / `skipped` regexed;
#     IngameBatchWiringGroupTests.INTERIM_PIN_IDS until then); the tier call (operator:
#     stock-tree is not in the nightly instance set).
#
# FAST-LANE CHECKLIST: (1) reuse: RW-5's prefix verbatim and its Esc discard, L13 / STR-2's
# post-merge Tracking Station recovery, RF-L1 / LAB-10's REJECTED gate probe, RW-1's close.
# Not merged INTO RW-5: RW-5 gates a world-first earned and discarded, this lane a capped
# subject across a discard and a merge, and RW-5 has not flown green; folding the two is a
# post-first-flight efficiency call. (2) explicit-UT warps only; (3)-(5) no dwell, burn or coast
# beyond the 11 s pad recording and two ~3 s 1x waits for the report; (6) retry `once`;
# (7) recordings window 39..39; (8) operator, ~18 min expected; (9) flight_efficiency.py after
# the first green flight.
#
# STATUS: LIVE-PROVEN 2026-10-28 on the Discard Re-fly fix, `2026-10-28_1214` PASS attempt 1 (DLL 0216c8e5 built from 530e783, the Discard Re-fly pool fix). Attempt 1's crew
# report was discarded without a trace (attempt 2's pod read exp:data=0, no capture); attempt 2's
# report merged and, recovered at the Tracking Station (+2932), was credited once at its full value
# (crewReport@KerbinSrfLandedLaunchPad 1.5 of cap 1.5; science 20.17 -> 21.67); the merged slot
# auto-sealed and the probe re-invoke was refused; the crossing applied the committed +2932 and
# +37500 once; 39 recordings; batch passed=3 skipped=0; LedgerGroundTruth hardFailures=0;
# ledger_audit.py PASS but for the by-design unbound-refly-provisional lines. History: the reading
# run `2026-10-28_1145` stalled at the second InvokeRewind (FLIGHT-only after a SPACECENTER discard),
# fixed by the step-save re-entry. Original note: AUTHORED 2026-10-28 (branch `rw6-refly-science`,
# stacked on `rw5-refly-discard`),
# First flight 2026-10-28_1145: steps 1-57 met (H, F, the rewind, G and its stash, attempt 1
# with `exp:data=0` on G's pod and `exp:data=1` after the report, the Discard and both discard
# gates), then the second InvokeRewind deferred `not-in-flight` at the Space Center to TIMEOUT;
# re-cut with the FLIGHT re-entry above and the sealed-slot probe moved into the check flight.
# Every pinned literal is derived from source (file:line above), the host and the flown RW-1 /
# RW-3 / RW-5 / RW-6 (1145, steps 1-57) logs.
tier = "operator"
description = "Rewind ledger campaign, science across a discarded and a merged Re-Fly of one slot (plan row 7): on cs-career-mun4, RW-5's committed pad flight and contract accept, a Rewind-to-Launch and a CS Flea Probe flight decoupled on the pad (a rewind point) and committed without science; a first Re-Fly of the pod slot takes the crew report and is discarded (the report never reaches the ledger, the next attempt's pod starts empty, the pools and rows return to their pre-invoke values); a second Re-Fly takes the same report and merges (split, supersede rows, no tombstone, auto-sealed), and the pod's Tracking Station recovery credits the subject once at full value under the merged flight, after which the value gate refuses that slot; then a warp across the committed rows and LedgerGroundTruth."
instanceProfile = "stock-tree"
tags = ["RW-6", "career", "ledger", "science", "crew-report", "rewind", "rewind-to-launch",
        "refly", "discard-refly", "refly-merge", "refly-gate", "value-gate", "supersede",
        "head-tip-split", "revert-dialog", "stash", "unfinished-flights", "controlled-child",
        "editor", "tracking-station", "recover", "ground-truth", "ingame-batch",
        "timeline-ops", "reading-run"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 7 x 120 warps + 3 x (120 GoToEditor + 180 LaunchFromEditor)
# + 2 x 180 StartRecording + 2 x 120 CommitTree + 120 Recover + 60 KscAction + 300 rewind
# + 2 x 300 InvokeRewind + 60 refused InvokeRewind + 300 ReFlyRevert + 300 re-entry LoadGame
# + 240 AnswerMergeDialog + 120 TS recover + 10 x 120 SaveGame + 540 RunTests = 6480; runtime
# 7700 adds the inert steps and FlushAndQuit.
steps = [
  # scene = "spacecenter": the host's three vessels are Mun debris (RW-1's boot).
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  # Clear of the fixture's last rows (185732-185734) and their 60 s rollout window.
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },

  # ---- flight H: recorded on the pad, committed, recovered (RW-1 / RW-5 verbatim) ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "h",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186000" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "Recover",        args = { pid = "${h.pid}" },                                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw6-h-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw06-01-after-h-commit" },                   expect = "OK", budget = 120 },

  # ---- F: the committed future, a contract accept at the Space Center ----
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "f1fb89dc-a471-42cf-94da-de4bb1080512" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw6-f-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw06-02-after-f-accept" },                   expect = "OK", budget = 120 },

  # ---- the rewind to H's launch ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw6-rewound" },                              expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw06-03-after-rtl" },                        expect = "OK", budget = 120 },

  # ---- flight G: recorded on the pad, the stand decoupled (a rewind point), committed ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "CS Flea Probe" },          expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "g",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "PartAction",     args = { button = "decouple", part = "radialDecoupler" }, label = "dec", expect = "OK" },
  { cmd = "RecordingState",                                                                expect = "OK" },
  # Held under 185800, where H's ghost starts on the same pad.
  { cmd = "WarpToUT",       args = { ut = "185797", maxRate = "1" },                       expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c1",                   expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "rewindpoints" }, label = "handles",           expect = "OK" },
  # Both slots end Landed / SubOrbital on a pad split; the stash keeps the pod's slot open.
  { cmd = "StashSlot",      args = { rp = "${handles.rp0}", slot = "0" },                  expect = "OK" },
  # G took no science: the slot holds no counted gain.
  { cmd = "PartAction",     args = { button = "inspect", part = "mk1pod.v2" },             expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw6-g-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw06-04-after-g-commit" },                   expect = "OK", budget = 120 },

  # ---- attempt 1: the crew report taken, then Discard Re-fly ----
  { cmd = "MissionMark",    args = { label = "rw6-refly1-armed" },                         expect = "OK" },
  { cmd = "InvokeRewind",   args = { rp = "${handles.rp0}", slot = "0" },                  expect = "OK", budget = 300 },
  # THE FLIGHT-READY WAIT (REFLY-LANES-JUMP-BEFORE-FLIGHT-READY, RF-3's order).
  { cmd = "ListHandles",    args = { kind = "chains" },                                    expect = "OK" },
  { cmd = "RecordingState", args = { awaitRecorderLive = "refly" },                        expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw6-refly1-started" },                       expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "mk1pod.v2" },          expect = "OK" },
  # 1x: stock stores the report and opens its results dialog (a 1x wait ignores its lock).
  { cmd = "WarpToUT",       args = { ut = "185790", maxRate = "1" },                       expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "inspect", part = "mk1pod.v2" },             expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw6-refly1-report" },                        expect = "OK" },
  # Esc > Revert Flight > Revert to Launch > Discard Re-Fly (RW-5's measured route).
  { cmd = "ReFlyRevert",    args = { choice = "discard", target = "launch" },              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw6-discarded1" },                           expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "rewindpoints" }, label = "after1",            expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c2",                   expect = "OK" },
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw06-05-after-discard" },                    expect = "OK", budget = 120 },

  # ---- back into FLIGHT: InvokeRewind is FLIGHT-only and the Discard lands at the Space Center
  # (first flight 2026-10-28_1145: `dispatch id=0058 -> DEFER reason=not-in-flight` to TIMEOUT).
  # RF-3's re-entry: a mid-session LoadGame with NO scene arg (an InSession load, the ledger and
  # the staged lists stay memory's), of the step save just written at the Space Center: its
  # FLIGHTSTATE holds only the host's three debris with activeVessel=0, so the save-derived route
  # is FLIGHT on `CS Mun Flyby Debris` (pid 3430425143) coasting ~11000 km over Kerbin. Not
  # `persistent`: at this point that file holds the rewind point's game the discard wrote there.
  { cmd = "MissionMark",    args = { label = "rw6-reenter" },                              expect = "OK" },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "rw06-05-after-discard" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "rewindpoints" }, label = "handles2",          expect = "OK" },

  # ---- attempt 2: the same report, merged ----
  { cmd = "MissionMark",    args = { label = "rw6-refly2-armed" },                         expect = "OK" },
  { cmd = "InvokeRewind",   args = { rp = "${handles2.rp0}", slot = "0" },                 expect = "OK", budget = 300 },
  { cmd = "ListHandles",    args = { kind = "chains" },                                    expect = "OK" },
  { cmd = "RecordingState", args = { awaitRecorderLive = "refly" },                        expect = "OK" },
  # The pod's VESSEL pid for the recovery (the invoke payload's activePid is a root part's),
  # and the proof that attempt 1's report did not come back with the rewind point.
  { cmd = "PartAction",     args = { button = "inspect", part = "mk1pod.v2" }, label = "p2", expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw6-refly2-started" },                       expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "mk1pod.v2" },          expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185791", maxRate = "1" },                       expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "inspect", part = "mk1pod.v2" },             expect = "OK" },
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw6-refly2-report" },                        expect = "OK" },
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },                                expect = "OK", budget = 240 },
  { cmd = "MissionMark",    args = { label = "rw6-merged" },                               expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "rewindpoints" }, label = "after2",            expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c3",                   expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw06-06-after-merge" },                      expect = "OK", budget = 120 },

  # ---- the merged science credited: the pod recovered from the Tracking Station ----
  # The merge leaves FLIGHT (L13 / RF-C1 measured), so no ExitToSpaceCenter.
  { cmd = "MissionMark",    args = { label = "rw6-recover-start" },                        expect = "OK" },
  { cmd = "TrackingStationRecover", args = { pid = "${p2.pid}" },                          expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw6-recovered" },                            expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw06-07-after-recovery" },                   expect = "OK", budget = 120 },

  # ---- the crossing: every committed row reached at the Space Center ----
  { cmd = "MissionMark",    args = { label = "rw6-before-crossing" },                      expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "186100", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw6-crossed" },                              expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw06-08-after-crossing" },                   expect = "OK", budget = 120 },

  # ---- the check: an unrecorded launch, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186130" },                                      expect = "OK", budget = 120 },
  # The slot now holds a counted gain: the value gate refuses it (precondition 7). In this
  # flight because InvokeRewind is FLIGHT-only; a refusal starts nothing.
  { cmd = "MissionMark",    args = { label = "rw6-sealed-probe" },                         expect = "OK" },
  { cmd = "InvokeRewind",   args = { rp = "${handles2.rp0}", slot = "0" },                 expect = "REJECTED", budget = 60 },
  { cmd = "SaveGame",       args = { name = "rw06-09-check-flight" },                     expect = "OK", budget = 120 },
  # The DEFAULT slot (persistent): the one a harvest reads; the named slots above are side files.
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
# Every value is backed by a REQUIRED token below.
#   science                     <- the recovery capture + `Earning:` of crewReport@KerbinSrfLandedLaunchPad
#   controlled-decoupled-child  <- `ProcessBreakupEvent: controlled child created: pid=<stand>`
#   rewind-to-separation        <- two StartInvoke + Invocation complete
#   refly-gate                  <- `invokerewind refused: refly-gate recordingAction:`
#   unfinished-flights-stash    <- `Stashed slot=0 ...` + `reflyrevert complete ... slotListed=true`
#   revert-during-refly-dialog  <- `Revert dialog shown` + `reflyrevert pressed dialog button='Discard Re-Fly'`
#   supersede-relation          <- `Added N supersede relations`
#   head-tip-split              <- `Split origin <id> at UT=`
#   scene-ts                    <- `tsrecover complete pid=<pod>`
D5  = ["controlled-decoupled-child"]
D8  = ["science", "funds", "contracts", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch", "rewind-to-separation", "refly-gate", "unfinished-flights-stash",
       "revert-during-refly-dialog", "supersede-relation", "head-tip-split"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight", "scene-ts"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# RW-5's measured 37 (the host's 34, H, G's launch recording and its stand), plus the TIP the
# merge's split cuts from G's launch recording and the merged attempt's recording. Attempt 1's
# recording is pruned by its discard; the check Flea is unrecorded.
count = { min = 39, max = 39 }

[expectations.logContracts]
required = [
  # ---- three Flea-family launches: H and the check (the Jumping Flea), G (CS Flea Probe) ----
  "\\A(?:[\\s\\S]*?launchfromeditor complete scene=FLIGHT vessel=Jumping Flea pid=[0-9]+ site=LaunchPad situation=PRELAUNCH){2}",
  "\\A(?:[\\s\\S]*?Game state: FundsChanged -2932 \\(VesselRollout\\)){2}",
  "Game state: FundsChanged \\+2932 \\(VesselRecovery\\)[\\s\\S]*?MISSIONMARK label=rw6-h-committed ut=",

  # ---- F: the accept, its own untagged row (RW-1 measured) ----
  "MISSIONMARK label=rw6-h-committed ut=[\\s\\S]*?kscaction action=accept-contract target=f1fb89dc-a471-42cf-94da-de4bb1080512 applied=true manifestKind=contract-accept observedAfter=state=Active ",
  "MISSIONMARK label=rw6-h-committed ut=[\\s\\S]*?Game state: FundsChanged \\+37500 \\(ContractAdvance\\)[\\s\\S]*?MISSIONMARK label=rw6-f-committed ut=",
  "MISSIONMARK label=rw6-h-committed ut=[\\s\\S]*?KSC spending recorded: type=ContractAccept, UT=[0-9.]+, key=f1fb89dc-a471-42cf-94da-de4bb1080512[\\s\\S]*?MISSIONMARK label=rw6-f-committed ut=",

  # ---- the rewind: a plain Rewind-to-Launch onto H's tree ----
  "MISSIONMARK label=rw6-f-committed ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw6-rewound ut=",
  "MISSIONMARK label=rw6-f-committed ut=[\\s\\S]*?Load classified: early=PlainRewind refined=PlainRewind [\\s\\S]*?MISSIONMARK label=rw6-rewound ut=",
  "invokerewindtolaunch invoking tree=[0-9a-f]{32} rec=[0-9a-f]{32} startUT=1858[0-9]{2}\\.[0-9] - plain Rewind-to-Launch \\(NOT a Re-Fly\\)",

  # ---- G: launched, decoupled on the pad into a second controllable vessel (RW-5 measured) ----
  "MISSIONMARK label=rw6-rewound ut=[\\s\\S]*?launchfromeditor complete scene=FLIGHT vessel=CS Flea Probe pid=[0-9]+ site=LaunchPad situation=PRELAUNCH",
  "MISSIONMARK label=rw6-rewound ut=[\\s\\S]*?Game state: FundsChanged -3982 \\(VesselRollout\\)[\\s\\S]*?MISSIONMARK label=rw6-g-committed ut=",
  "launchfromeditor complete scene=FLIGHT vessel=CS Flea Probe pid=([0-9]+) [\\s\\S]*?partaction applied button=decouple pid=\\1 part='radialDecoupler' partId=[0-9]+ event=Decouple newPid=[1-9][0-9]* newName='[^'\\r\\n]*' vessels=[0-9]+->[0-9]+ activePid=\\1 ",
  "partaction applied button=decouple pid=[0-9]+ part='radialDecoupler' [^\\r\\n]*newPid=([0-9]+) [\\s\\S]*?ProcessBreakupEvent: controlled child created: pid=\\1, name='[^'\\r\\n]*', recId=[0-9a-f]{32}, alive=True, bgRecorder=True",
  "DECOUPLE emitted: ut=[0-9.]+ type=JointBreak splitCause=DECOUPLE decouplerPartId=[0-9]+ controlledChildren=1 debris=0 ",
  "Controllable split children: \\[[0-9]+,[0-9]+\\] \\(orig=[0-9]+, ",
  "RewindPoint begin: rp=(rp_[0-9a-f]{32}) bp=[0-9a-f]{32} slots=2 controllablePids=2 focusSlot=0 ut=1857[0-9]{2}\\.[0-9]{2}[\\s\\S]*?RewindPoint slot capture: rp=\\1 populated=2/2 disabled=0",
  "MISSIONMARK label=rw6-rewound ut=[\\s\\S]*?committree committed=true[\\s\\S]*?MISSIONMARK label=rw6-g-committed ut=",
  "MISSIONMARK label=rw6-rewound ut=[\\s\\S]*?Current-UT ledger recalculation: reason=flight-tree-commit cutoffUT=1857[0-9]{2}[\\s\\S]*?MISSIONMARK label=rw6-g-committed ut=",
  "MISSIONMARK label=rw6-rewound ut=[\\s\\S]*?CommitTree: promoted normal staging rp=rp_[0-9a-f]{32} tree=\\S+ to persistent[\\s\\S]*?MISSIONMARK label=rw6-g-committed ut=",
  "Stashed slot=0 rec=\\S+ bp=\\S+ rp=rp_[0-9a-f]{32} tip=\\S+ tipMergeState=CommittedProvisional tipDemoted=True terminal=Landed reaperBlocked=True",
  "stashslot complete rp=rp_[0-9a-f]{32} slot=0 tip=\\S+ tipMergeState=Immutable->CommittedProvisional stashed=true unfinishedFlight=true unfinishedRow=\\S+",
  "IsUnfinishedFlight=true rec=\\S+ reason=stashedStableLeaf slot=0 ",

  # ---- THE ORIGINAL SLOT HOLDS NO COUNTED GAIN: the value gate opens it, G's pod is empty ----
  "MISSIONMARK label=rw6-rewound ut=[\\s\\S]*?RetireSet gate \\(section 2\\.12 Rule 1\\): rp=rp_[0-9a-f]{32} slot=0 [^\\r\\n]*sealingRows=0 [^\\r\\n]*-> nothing to give back[\\s\\S]*?MISSIONMARK label=rw6-refly1-started ut=",
  "stashslot complete rp=[\\s\\S]*?partaction applied button=inspect pid=[0-9]+ part='mk1pod\\.v2' [^\\r\\n]*state='exp:data=0'[\\s\\S]*?MISSIONMARK label=rw6-g-committed ut=",

  # ---- attempt 1: invoked, the crew report taken (data aboard) ----
  "MISSIONMARK label=rw6-refly1-armed ut=[\\s\\S]*?Re-Fly \\(Rewind-to-Separation\\) StartInvoke: sess=\\S+ rp=rp_[0-9a-f]{32} slot=0",
  "MISSIONMARK label=rw6-refly1-armed ut=[\\s\\S]*?Load classified: early=ReFlyStart refined=ReFlyStart scene=FLIGHT [\\s\\S]*?MISSIONMARK label=rw6-refly1-started ut=",
  # The invocation walk is the full ledger (cutoff double.MaxValue, by design).
  "Re-Fly \\(Rewind-to-Separation\\) StartInvoke: (?:(?!Invocation complete: )[\\s\\S])*RecalculateAndPatch: actionsTotal=[0-9]+, actionsAfterCutoff=[0-9]+, cutoffUT=1\\.7976931348623157E\\+308",
  "\\A(?:[\\s\\S]*?Invocation complete: sess=\\S+ rp=rp_[0-9a-f]{32} slot=0 activePid=[0-9]+){2}",
  "\\A(?:[\\s\\S]*?recordingstate recording=true tree=\\S+ points=[0-9]+ scene=FLIGHT awaitRecorderLive=refly reFlyMarker=true){2}",
  "MISSIONMARK label=rw6-refly1-started ut=[\\s\\S]*?partaction applied button=experiment pid=[0-9]+ part='mk1pod\\.v2' partId=[0-9]+ event=DeployExperiment [\\s\\S]*?partaction applied button=inspect pid=[0-9]+ part='mk1pod\\.v2' [^\\r\\n]*state='exp:data=1'[\\s\\S]*?MISSIONMARK label=rw6-refly1-report ut=",

  # ---- Discard Re-fly (RW-5 / RF-L4 / LAB-10b's tokens; slot= is the slot origin) ----
  "MISSIONMARK label=rw6-refly1-report ut=[\\s\\S]*?reflyrevert start choice=discard target=launch sess=\\S+ rp=rp_[0-9a-f]{32} slot=[0-9a-f]{32} ",
  "reflyrevert pressed revert-option button='[^'\\r\\n]*' target=launch launchOffered=true",
  "Revert dialog shown sess=\\S+ target=Launch",
  "reflyrevert pressed dialog button='Discard Re-Fly' choice=discard",
  "PurgeEventsForRecordings \\(RevertInterceptor:DiscardReFly sess=\\S+\\): live=[0-9]+, ",
  "PruneActiveReFlyAttemptOwnedTopology callSite=RevertInterceptor:DiscardReFly sess=\\S+ tree=\\S+ attemptIds=[1-9][0-9]* [^\\r\\n]*purgedEvents=[0-9]+ [^\\r\\n]*ledgerRowsRemoved=[0-9]+ ",
  "Origin RP (?:promoted to persistent|already persistent) rp=rp_[0-9a-f]{32}",
  "DiscardReFly: rewind point game written to persistent\\.sfs rp=rp_[0-9a-f]{32} sess=\\S+ ",
  "End reason=discardReFly sess=\\S+ target=Launch facility=-- dispatched=true persistentWritten=true ",
  "Load classified: early=DiscardReFly refined=DiscardReFly scene=SPACECENTER [^\\r\\n]*discardReFly=Launch handoff=present",
  "In-session staged lists from memory: kind=DiscardReFly captured=\\S+; supersedes installed=0 loadedFromSave=[0-9]+ restored=0 staleDropped=0; retirements installed=0 [^;\\r\\n]*; tombstones installed=0 [^;\\r\\n]*; journal installed=none ",
  "Load classified: early=DiscardReFly [\\s\\S]*?\\[LoadSweep\\] Marker valid=False; spare=0 discarded=0 selfSupersedes=0 orphanSupersedes=0 removedFullyOrphanSupersedes=0 removedOrphanRewindRetirements=0 orphanTombstones=0 strayFields=0 discardedRps=0 ",
  "Load classified: early=DiscardReFly [\\s\\S]*?OnLoad: post-rewind current-UT cutoff decision useCurrentUtCutoff=True loadedUT=1857[0-9]{2}(?:\\.[0-9]+)? [^\\r\\n]*loadedScene=SPACECENTER [^\\r\\n]*hasFutureLedgerActions=True",
  "reflyrevert complete choice=discard target=launch scene=SPACECENTER sess=\\S+ rp=rp_[0-9a-f]{32} rpKept=true slot=[0-9a-f]{32} slotListed=true unfinishedFlights=[1-9][0-9]* marker=none",
  "MISSIONMARK label=rw6-discarded1 ut=[\\s\\S]*?listhandles kind=rewindpoints count=1 truncated=false",

  # ---- THE DISCARD GATE: the ledger exactly as just before the first Re-Fly started ----
  # The pre-invoke pools (RW-5 measured on the same history): 157546.18 - 2932 - 3982.
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=150632\\.18 science=20\\.17 rep=115\\.00 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw6-refly1-armed ut=",
  # Pools, facilities and active contracts after the discard read back by backreference.
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) facilities=\\[([^\\]\\r\\n]*)\\] targetTechNodes=[0-9]+ contracts=([0-9]+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw6-refly1-armed ut=[\\s\\S]*?Load classified: early=DiscardReFly refined=DiscardReFly [\\s\\S]*?\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 facilities=\\[\\4\\] targetTechNodes=[0-9]+ contracts=\\5 ",
  # Rows: the same ledger row count before the invoke and after the discard.
  "RecalculateAndPatch: actionsTotal=([0-9]+), (?:(?!RecalculateAndPatch: actionsTotal=)[\\s\\S])*?MISSIONMARK label=rw6-refly1-armed ut=[\\s\\S]*?Load classified: early=DiscardReFly refined=DiscardReFly (?:(?!RecalculateAndPatch: actionsTotal=)[\\s\\S])*RecalculateAndPatch: actionsTotal=\\1, ",
  # Recordings: G's tree as committed, the attempt's recording gone (RW-5 and the 1145 flight
  # read `count=37 truncated=true`).
  "listhandles kind=committed count=([0-9]+) truncated=(?:true|false)[\\s\\S]*?MISSIONMARK label=rw6-g-committed ut=[\\s\\S]*?MISSIONMARK label=rw6-discarded1 ut=[\\s\\S]*?listhandles kind=committed count=\\1 truncated=(?:true|false)",

  # ---- back into FLIGHT: an InSession load of the discard's step save (RF-3's measured
  # classification for a mid-session no-scene LoadGame), onto the host's debris, moving no pool ----
  "MISSIONMARK label=rw6-reenter ut=[\\s\\S]*?loadgame start save=\\S+ name=rw06-05-after-discard scene=SPACECENTER requestedScene=Unspecified [\\s\\S]*?Load classified: early=InSession refined=InSessionOther scene=FLIGHT [\\s\\S]*?loadgame complete scene=FLIGHT save=\\S+ game-loaded=true expected=Flight[\\s\\S]*?MISSIONMARK label=rw6-refly2-armed ut=",
  "MISSIONMARK label=rw6-reenter ut=[\\s\\S]*?Load classified: early=InSession refined=InSessionOther scene=FLIGHT [\\s\\S]*?\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=150632\\.18 science=20\\.17 rep=115\\.00 [\\s\\S]*?MISSIONMARK label=rw6-refly2-armed ut=",
  "MISSIONMARK label=rw6-reenter ut=[\\s\\S]*?listhandles kind=rewindpoints count=1 truncated=false[\\s\\S]*?MISSIONMARK label=rw6-refly2-armed ut=",

  # ---- attempt 2: a NEW session on the same point and slot; the pod starts empty ----
  "StartInvoke: sess=(\\S+) rp=(rp_[0-9a-f]{32}) slot=0[\\s\\S]*?MISSIONMARK label=rw6-refly2-armed ut=[\\s\\S]*?Re-Fly \\(Rewind-to-Separation\\) StartInvoke: sess=(?!\\1 )\\S+ rp=\\2 slot=0",
  "MISSIONMARK label=rw6-refly2-armed ut=[\\s\\S]*?Load classified: early=ReFlyStart refined=ReFlyStart scene=FLIGHT [\\s\\S]*?MISSIONMARK label=rw6-refly2-started ut=",
  # THE DISCARDED SCIENCE LEFT NO TRACE: the second attempt's pod holds no report.
  "MISSIONMARK label=rw6-refly2-armed ut=[\\s\\S]*?partaction applied button=inspect pid=[0-9]+ part='mk1pod\\.v2' [^\\r\\n]*state='exp:data=0'[\\s\\S]*?MISSIONMARK label=rw6-refly2-started ut=",
  "MISSIONMARK label=rw6-refly2-started ut=[\\s\\S]*?partaction applied button=experiment pid=[0-9]+ part='mk1pod\\.v2' partId=[0-9]+ event=DeployExperiment [\\s\\S]*?partaction applied button=inspect pid=[0-9]+ part='mk1pod\\.v2' [^\\r\\n]*state='exp:data=1'[\\s\\S]*?MISSIONMARK label=rw6-refly2-report ut=",
  # The attempt recorded a trajectory (a pointless provisional cannot supersede).
  "MISSIONMARK label=rw6-refly2-started ut=[\\s\\S]*?recordingstate recording=true tree=\\S+ points=[1-9][0-9]* scene=FLIGHT[\\s\\S]*?MISSIONMARK label=rw6-refly2-report ut=",

  # ---- THE MERGE: dominance, split, supersede, no tombstone, sealed Immutable ----
  "MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*?Merge dominance check sess=\\S+ result=pass pool=\\S+ ut=\\S+ before=\\S+ after=\\S+ ",
  "MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*?Loss swap sess=\\S+ variant=A repLossOld=\\S+ repLossNew=\\S+",
  "MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*?Split origin [0-9a-f]{32} at UT=1857[0-9]{2}\\.[0-9]{2}: HEAD=\\[",
  "MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*?Added [1-9][0-9]* supersede relations for subtree rooted at ",
  "MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*?Tombstoned 0 career actions ",
  "MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*?mergeState=Immutable terminalKind=\\S+ qualifies=\\S+ slot=0 rp=rp_[0-9a-f]{32} focusSlot=0 focusSlotOverride=0 classifierReason=stableTerminalFocusSlot autoSeal=True ",
  "MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*?Auto-sealed re-fly slot=0 rec=\\S+ rp=rp_[0-9a-f]{32} mergeState=Immutable terminal=Landed reason=classifierClosed:\\S+",
  "MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*?End reason=merged sess=\\S+ ",
  "answermergedialog complete choice=merge result=committed",
  # The walk hands the session's lift back: the last walk before the recovery reads the
  # pre-invoke pools.
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw6-refly1-armed ut=[\\s\\S]*MISSIONMARK label=rw6-refly2-report ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw6-recover-start ut=",

  # ---- THE MERGED SCIENCE, CREDITED ONCE: the pod recovered from the Tracking Station ----
  "MISSIONMARK label=rw6-refly2-armed ut=[\\s\\S]*?partaction applied button=inspect pid=([0-9]+) part='mk1pod\\.v2' [\\s\\S]*?tsrecover complete pid=\\1 vessel=CS Flea Probe scene=SPACECENTER ",
  # A first reading of a fresh subject: the stock total equals this amount.
  "MISSIONMARK label=rw6-recover-start ut=[\\s\\S]*?Science subject captured: crewReport@KerbinSrfLandedLaunchPad amount=([0-9.]+) increment=[0-9.]+ total=\\1 gainMultiplier=1 reason='VesselRecovery' ut=1857[0-9]{2}\\.[0-9] tag='' deployed=False directLedger=True[\\s\\S]*?MISSIONMARK label=rw6-recovered ut=",
  # Filed under the merged attempt's recording (design 2.12 Rule 3: under the vessel that caused it).
  "Auto-sealed re-fly slot=0 rec=(\\S+) [\\s\\S]*?KSC science recorded: subject='crewReport@KerbinSrfLandedLaunchPad' science=[0-9.]+ method=\\S+ ut=1857[0-9]{2}\\.[0-9] recordingId=\\1 vessel='CS Flea Probe'",
  "MISSIONMARK label=rw6-recover-start ut=[\\s\\S]*?VesselRecovery funds patched: vessel='CS Flea Probe' amount=2932 ut=1857[0-9]{2}\\.[0-9] recordingId=\\S+ quick=\\S+[\\s\\S]*?MISSIONMARK label=rw6-recovered ut=",
  # Credited in full, at its cap, and the pool is the pre-invoke 20.17 plus that value
  # (1.5 from the cfgs, 3 as L3 measured; owed off the first flight).
  "MISSIONMARK label=rw6-recover-start ut=[\\s\\S]*?Earning: subject=crewReport@KerbinSrfLandedLaunchPad, awarded=1\\.5, effective=1\\.5, creditedTotal=1\\.5, maxValue=1\\.5, [^\\r\\n]*(?:(?!MISSIONMARK label=rw6-before-crossing )[\\s\\S])*?\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\S+ science=21\\.67 ",

  # ---- THE SLOT NOW HOLDS A COUNTED GAIN: Re-Fly is not offered ----
  "MISSIONMARK label=rw6-recovered ut=[\\s\\S]*?RetireSet gate \\(section 2\\.12 Rule 1\\): rp=rp_[0-9a-f]{32} slot=0 [^\\r\\n]*sealingRows=[1-9][0-9]* [^\\r\\n]*-> sealed by ",
  "MISSIONMARK label=rw6-sealed-probe ut=[\\s\\S]*?invokerewind refused: refly-gate recordingAction:[A-Za-z]+:act_[0-9a-f]{32}[\\s\\S]*?savegame name=rw06-09-check-flight ",

  # ---- the crossing: the rows reached at the Space Center, F's accept among them ----
  "MISSIONMARK label=rw6-before-crossing ut=[\\s\\S]*?Clock-crossing reached committed-future rows: crossed=[1-9][0-9]* [\\s\\S]*?MISSIONMARK label=rw6-crossed ut=",
  "MISSIONMARK label=rw6-before-crossing ut=[\\s\\S]*?Clock-crossing reached committed-future rows: crossed=[0-9]+ \\[[^\\]]*ContractAccept@[\\s\\S]*?MISSIONMARK label=rw6-crossed ut=",

  # ---- the step saves (named side slots for after-flight reading) and the default slot ----
  "savegame name=rw06-01-after-h-commit folder=\\S+ saved=true",
  "savegame name=rw06-02-after-f-accept folder=\\S+ saved=true",
  "savegame name=rw06-03-after-rtl folder=\\S+ saved=true",
  "savegame name=rw06-04-after-g-commit folder=\\S+ saved=true",
  "savegame name=rw06-05-after-discard folder=\\S+ saved=true",
  "savegame name=rw06-06-after-merge folder=\\S+ saved=true",
  "savegame name=rw06-07-after-recovery folder=\\S+ saved=true",
  "savegame name=rw06-08-after-crossing folder=\\S+ saved=true",
  "savegame name=rw06-09-check-flight folder=\\S+ saved=true",
  "MISSIONMARK label=rw6-crossed ut=[\\s\\S]*?savegame name=persistent folder=\\S+ saved=true",

  # ---- the ground truth, in FLIGHT on the unrecorded check Flea ----
  "ground-truth game mode=CAREER pools=funds,science,reputation",
  "result: hardFailures=0 ",
  # INTERIM: total=3 from the source (the LedgerGroundTruth category's FLIGHT cells); the
  # split is owed off the first flight (RW-1 / RW-3 read passed=3 skipped=0 on this host).
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "GUARDED (UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=\\S+ reason=leak ",
  "Debt charge:",
  "\\[TakeBack\\] Took back ",
  "invokerewindtolaunch refused",
  "stashslot (?:refused|rejected)",
  "stashslot readback-failed",
  "partaction rejected",
  "partaction error ",
  "reflyrevert rejected",
  "reflyrevert error",
  "answermergedialog refused",
  "answermergedialog failed",
  "tsrecover rejected",
  "warptout refused",
  "kscaction refused",
  "savegame refused ",
  "savegame failed ",
  # The only refused invoke is the sealed-slot probe, and it names the value gate.
  "\\A(?:(?!MISSIONMARK label=rw6-sealed-probe )[\\s\\S])*?invokerewind refused",
  "\\A(?:[\\s\\S]*?invokerewind refused){2}",
  "invokerewind refused: (?!refly-gate recordingAction:)",
  # One rewind to launch only, onto H.
  "\\A(?:[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT ){2}",
  # The decouple authors the point (two controllable outputs).
  "Single-controllable split: no RP",
  "OnVesselRolloutSpending: skipping duplicate rollout",
  # ---- the RW-2 symptom: no pool lift while the committed rows are ahead, from the rewind
  # to the first invoke (the invocation walk's lift inside a session is by design) ----
  "MISSIONMARK label=rw6-rewound ut=(?:(?!MISSIONMARK label=rw6-refly1-armed )[\\s\\S])*\\[KspStatePatcher\\] PatchFunds: [0-9.]+ -> [0-9.]+ \\(delta=[1-9]",
  # ---- the RW-5 symptom: the discard load needs no live funds patch at all (the rewind
  # point's quicksave holds the pre-invoke pool), and the merge hands the lift back to the
  # pre-invoke 150632.2, never below it ----
  "Load classified: early=DiscardReFly (?:(?!MISSIONMARK label=rw6-refly2-armed )[\\s\\S])*\\[KspStatePatcher\\] PatchFunds: [0-9.]+ -> [0-9.]+ \\(delta=",
  "answermergedialog choice=merge result=committed(?:(?!MISSIONMARK label=rw6-recover-start )[\\s\\S])*\\[KspStatePatcher\\] PatchFunds: [0-9.]+ -> (?!150632\\.2 )[0-9.]+ \\(delta=",
  # Every structural walk from the discard to the second invoke reads the pre-invoke pools.
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw6-refly1-armed ut=[\\s\\S]*?Load classified: early=DiscardReFly refined=DiscardReFly (?:(?!MISSIONMARK label=rw6-refly2-armed )[\\s\\S])*?\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ (?!funds=\\1 science=\\2 rep=\\3 )",
  # ---- THE DISCARDED SCIENCE: never captured, never filed, before the merged recovery ----
  "\\A(?:(?!MISSIONMARK label=rw6-recover-start )[\\s\\S])*?Science subject captured: crewReport@KerbinSrfLandedLaunchPad ",
  "\\A(?:(?!MISSIONMARK label=rw6-recover-start )[\\s\\S])*?KSC science recorded: subject='crewReport@KerbinSrfLandedLaunchPad'",
  "\\A(?:(?!MISSIONMARK label=rw6-recover-start )[\\s\\S])*?Earning(?: \\(cap hit\\))?: subject=crewReport@KerbinSrfLandedLaunchPad,",
  # ---- THE MERGED SCIENCE: captured and filed once, never capped, never partial, never
  # credited past its own value ----
  "\\A(?:[\\s\\S]*?Science subject captured: crewReport@KerbinSrfLandedLaunchPad ){2}",
  "\\A(?:[\\s\\S]*?KSC science recorded: subject='crewReport@KerbinSrfLandedLaunchPad'){2}",
  "Earning \\(cap hit\\): subject=crewReport@KerbinSrfLandedLaunchPad,",
  "Earning: subject=crewReport@KerbinSrfLandedLaunchPad, awarded=([0-9.]+), effective=(?!\\1,)",
  "Earning: subject=crewReport@KerbinSrfLandedLaunchPad, awarded=([0-9.]+), effective=\\S+, creditedTotal=(?!\\1,)",
  "MISSIONMARK label=rw6-recovered ut=(?:(?!MISSIONMARK label=rw6-crossed )[\\s\\S])*?\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\S+ science=(?!21\\.67 |23\\.17 )",
  # ---- the discard untags nothing and re-homes nothing ----
  "ClearRecordingTagForRecordings: cleared=[1-9]",
  "PreserveIrreversibleLiveGameplayOnDiscard \\([^)\\r\\n]*\\): re-homed",
  # ---- the discard is not a merge; the merge runs once and retires nothing ----
  "\\A(?:(?!MISSIONMARK label=rw6-refly2-armed )[\\s\\S])*?Split origin \\S+ at UT=",
  "\\A(?:(?!MISSIONMARK label=rw6-refly2-armed )[\\s\\S])*?Added [1-9][0-9]* supersede relations",
  "\\A(?:(?!MISSIONMARK label=rw6-refly2-armed )[\\s\\S])*?End reason=merged ",
  "\\A(?:[\\s\\S]*?End reason=merged ){2}",
  "Tombstoned [1-9][0-9]* career actions",
  "Merge dominance check sess=\\S+ result=refuse",
  "AppendRelations outcome=refused-unflown-provisional",
  "End reason=concluded-no-supersede",
  "End reason=retry ",
  "End reason=discardReFlyAttemptFromMergeDialog",
  # ---- no Re-Fly leftovers ----
  "outcome=retired-empty-provisional",
  "In-session load found no staged-list handoff",
  "DiscardReFly load intent dropped as stale",
  # G's point survives from its commit to the sealed-slot probe (slot 1 stays open).
  "MISSIONMARK label=rw6-rewound ut=(?:(?!savegame name=rw06-09-check-flight )[\\s\\S])*Reaped rp=",
  "MISSIONMARK label=rw6-rewound ut=(?:(?!savegame name=rw06-09-check-flight )[\\s\\S])*Purged rp=",
  # ---- F's accept applies once at the crossing ----
  "Clock-crossing reached committed-future rows: [^\\r\\n]*ContractAccept@[\\s\\S]*Clock-crossing reached committed-future rows: [^\\r\\n]*ContractAccept@",
  "kscaction action=accept-contract target=f1fb89dc-a471-42cf-94da-de4bb1080512 applied=true[\\s\\S]*kscaction action=accept-contract target=f1fb89dc-a471-42cf-94da-de4bb1080512 applied=true",
  # ---- nothing records after the merge ----
  "MISSIONMARK label=rw6-merged ut=[\\s\\S]*Recording started: vessel=",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

# REPORT-ONLY until the reading run: the point survives (the stand's slot stays open), the
# merge writes its supersede rows and no tombstone.
[expectations.rewind]
gating        = false
rewindPoints  = { min = 1, max = 1 }
supersedeRows = { min = 1 }
tombstones    = { max = 0 }

[runtime]
budgetSeconds = 7700

[retry]
policy = "once"

[expectedFail]
bugId = ""
