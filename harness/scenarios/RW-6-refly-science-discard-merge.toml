#   (ParsekFlight.TerminalOrbit.cs:227), Reaped rp= (RewindPointReaper.cs:174), Purged rp=
#   (TreeDiscardPurge.cs:366), In-session load found no staged-list handoff
#   (ParsekScenario.InSessionHandoff.cs:89), DiscardReFly load intent dropped as stale
#   (DiscardReFlyLoadIntent.cs:73), Took back (GameActions/StockShadowTakeBack.cs:514),
#   ABORTING rewind ledger patch (GameActions/KspStatePatcher.cs:89), GUARDED clamps
#   (KspStatePatcher.cs:6287), filed StockPoolAdjustment (KspStatePatcher.cs:6117), Debt
#   charge: (GameActions/FundsModule.cs:245), skipping duplicate rollout
