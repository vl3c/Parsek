id = "RW-6-refly-science-discard-merge"
# =====================================================================================
# RW-6: SCIENCE ACROSS A DISCARDED AND A MERGED RE-FLY OF ONE SLOT (the rewind ledger
# campaign, plan row 7: "Re-Fly a stage that carries science. Discard one attempt, merge
# another. The discarded science is gone without a trace, and the merged science is credited
# once. The original slot must hold no counted gain, or Re-Fly is not offered.").
#
# THE RULINGS UNDER TEST: Re-Fly is losses-only and any gain seals (design
# docs/parsek-rewind-to-separation-design.md section 2.12 Rule 1); science goes to the earliest
# recovery, capped per subject (ScienceModule's cap walk); DISCARD RESTORES THE LEDGER TO JUST
# BEFORE THE RE-FLY STARTED (2.12 Rule 3: "Invocation, the live session, Retry and every
# Discard leave L exactly as it was before the invocation").
#
# THE PREDICATE THE ROW NAMES ("or Re-Fly is not offered"): SupersedeCommit.RetireSetHoldsSealingRow
# (SupersedeCommit.RetireSet.cs:786), logged as `RetireSet gate (section 2.12 Rule 1): ... ->
# nothing to give back | sealed by <row>` (:847, VerboseOnChange), read by Unfinished Flights,
# the Stash resolver and RewindInvoker.CanInvoke precondition 7 (RewindInvoker.cs:141-147, the
# refusal reason `recordingAction:<Type>:<ActionId>`, UnfinishedFlightClassifier.cs:14, which the
# seam answers `invokerewind refused: refly-gate <reason>`, ParsekTestCommandAddon.cs:2816 /
# TestCommandInvokeRewind.cs:69). Both halves are driven: G's slot holds no gain, so both
# invokes pass it; after the merged attempt's science is recovered the same slot is refused.
#
# THE SHAPE: RW-5's prefix verbatim (H, the Jumping Flea recorded on the pad, committed,
# recovered; F, the survey contract f1fb89dc accepted at the Space Center, +37500; a
# Rewind-to-Launch to H; G, the CS Flea Probe recorded on the pad, its stand decoupled there
# into a second controllable vessel so the split authors a rewind point, committed in flight
# and its Landed pod slot stashed). H and F stay because the committed future they put ahead
# of the rewound clock (H's rollout and recovery, F's accept) is what the invocation walk lifts
# (+40432 in RW-5's flight) and what every discard and merge must hand back: without it the
# RW-5 symptom below cannot show. G's pod carries the Mk1 pod's crew report
# (ModuleScienceExperiment crewReport); the subject crewReport@KerbinSrfLandedLaunchPad is not
# in the host's R&D list (only mysteryGoo@KerbinSrfLandedLaunchPad is, sci=3 of cap 3.9), so it
# is a first reading. G takes no science (`exp:data=0` on G's pod after its commit).
#   Attempt 1: InvokeRewind slot 0, `PartAction button=experiment part=mk1pod.v2` (the crew
#     report, the stand-in aboard), a 1x wait, `exp:data=1`, then Discard Re-fly
#     (ReFlyRevert discard target=launch, RW-5's measured route).
#   Back into FLIGHT: InvokeRewind is FLIGHT-only (TestCommandDispatcher.cs:497) and the
#     Discard lands at the Space Center, so the lane re-enters RF-3's way: a mid-session
#     LoadGame with no scene arg of the step save `rw06-05-after-discard` (written at the Space
#     Center right after the discard; its FLIGHTSTATE holds only the host's three Kerbin
#     debris, activeVessel=0, so the save-derived route, TestCommandLoadGame.DecideLoadRoute,
#     is FLIGHT on `CS Mun Flyby Debris` ~11000 km up). Mid-session and without playerLoad it
#     classifies `early=InSession refined=InSessionOther` (RF-3's archived 2026-10-16_1130
#     flight, LoadReconcilePolicy.ClassifyEarly): the ledger and the staged lists stay memory's,
#     and the pools must not move (pinned). Not `persistent`: at this point that file holds the
#     rewind point's game the discard wrote there (RevertInterceptor.cs:785).
#   Attempt 2: InvokeRewind slot 0 again from that flight; the pod comes back EMPTY
#     (`exp:data=0`: the discarded report is gone with its attempt); the same crew report,
#     `exp:data=1`, then AnswerMergeDialog merge (the HEAD / TIP split of G's launch recording,
#     supersede rows, no tombstone, the slot auto-sealed Immutable on its Landed ending); then
#     the pod is recovered from the Tracking Station (L13 / STR-2 / RF-L2's live-proven
#     route), which is when stock pays the report and the ledger files it under the merged
#     recording.
#   Close: WarpToUT 186100 at the Space Center across the committed rows, an unrecorded check
#   Flea; in that flight InvokeRewind slot 0 once more must be REFUSED by the value gate (a
#   refusal starts nothing); the default-slot save and LedgerGroundTruth (RW-1 / RW-5's close).
#
# THE GATES:
#   - the discarded science never reaches the ledger: no `Science subject captured:
#     crewReport@KerbinSrfLandedLaunchPad` before the merged recovery, and the second attempt's
#     pod reads `exp:data=0`;
#   - after the discard the walk's pools and the ledger row count equal those just before the
#     first invoke (backreferences, RW-5's shape), and the live funds are not patched at all
#     (the rewind point's quicksave already holds the pre-invoke pool); after the merge the walk
#     again reads the pre-invoke pools until the recovery, and any live funds patch lands on the
#     pre-invoke value 150632.2 (RW-5 measured: 157546.18 fixture - 2932 H's reserved rollout -
#     3982 G's rollout);
#   - the merged science is credited ONCE at full value and never over its cap: one capture, one
#     KSC science row tagged to the merged attempt's recording, every walk's `Earning:` line
#     with awarded = effective = creditedTotal = maxValue, no `Earning (cap hit):`, and the
#     science pool after it equals the pre-invoke 20.17 plus that value;
#   - the merge: dominance pass, variant A, the split, supersede rows, 0 tombstones,
#     mergeState=Immutable by stableTerminalFocusSlot, End reason=merged once;
#   - the sealed slot: `invokerewind refused: refly-gate recordingAction:` after the recovery.
#
# THE RW-5 SYMPTOM (RW-5's first flight 2026-10-28_1056, KSP.log line 27043-27049): after the
# Discard load the patcher read the in-session lifted lastWritten (191064.2) as a leak, filed a
# StockPoolAdjustment of -40432 and clamped funds `PatchFunds: 150632.2 -> 110200.2`, while the
# walk's Structural line read the correct 150632.18. A fix is coming; this lane gates the
# correct behaviour and reds until it lands: no `GUARDED ... clamped`, no `reason=leak`
# adjustment, no live `PatchFunds: a -> b` after the Discard load, and none to a target other
# than 150632.2 after the merge (the merge's own Space Center load must hand the same lift back).
#
# DEPARTURES FROM THE PLAN (each following the code):
#   - "takes science ... and recovers or transmits it so the ledger would credit it" cannot be
#     driven inside a Re-Fly session on this craft. Transmit: the pod's only antenna is
#     INTERNAL (stock-tree GameData/Squad/Parts/Command/mk1pod_v2/mk1Pod_v2.cfg:184) and stock
#     sends no science over an internal antenna (SCI-1's header, measured on the CS Flea).
#     Recover: in a live session the scene-exit variant is ReFlyAttempt
#     (SceneExitInterceptor.cs:172-173), the Recover verb's wedge guard refuses it
#     (TestCommandExitToSpaceCenter.cs:108-109 -> `recover rejected reason=dialog-required`,
#     TestCommands/ParsekTestCommandAddon.Recover.cs:139) because the Re-Fly merge modal it
#     raises is not one Recover can answer. So attempt 1's report stays aboard as data and is
#     discarded with the attempt (gated by the empty pod of attempt 2 and the absent capture),
#     and attempt 2's report is credited by the post-merge Tracking Station recovery.
#   - The "not offered" half is the post-recovery InvokeRewind REJECTED (RF-L1 / LAB-10's
#     probe shape), not an Unfinished Flights listing: the merged slot is also sealed by its
#     Landed ending, so the value gate is the only thing the probe can name.
#   - The crew report's value: 1.5 from the cfgs (ScienceDefs crewReport baseValue 5 /
#     scienceCap 5, the host's sbv 0.3 at LaunchPad, ScienceGainMultiplier 1 at persistent.sfs
#     line 105), but L3 measured `crewReport@KerbinSrfLandedLaunchPad amount=3.0 ...
#     maxValue=3` on stock-minimal (results-archive 2026-10-16_2221). Both are pinned as an
#     alternation with their matching pool (21.67 or 23.17); owed off the first flight.
#   - RW-5's `outcome=unbound-refly-provisional` forbid is NOT copied: RW-5's own first flight
#     logged it once at the invoke's first save, before the recorder bound (KSP.log line
#     25144), a transient; this lane forbids the merge-time refusal
#     (`AppendRelations outcome=refused-unflown-provisional`) and requires the supersede rows.
#
# LITERALS (Source/Parsek/..., verified 2026-10-28 by grep in this worktree):
#   launchfromeditor complete scene=FLIGHT    TestCommands/TestCommandEditorRoute.cs:517
#   Game state: FundsChanged                  GameStateRecorder.cs:945 (arrow non-ASCII)
#   MISSIONMARK label=                        TestCommands/TestCommandMissionMark.cs:22
#   kscaction ... applied=true manifestKind=  TestCommands/TestCommandKscAction.cs:501
#   KSC spending recorded: type=              GameActions/LedgerOrchestrator.cs:6095
#   Rewind-to-Launch initiated to UT          RecordingStore.cs:5651
