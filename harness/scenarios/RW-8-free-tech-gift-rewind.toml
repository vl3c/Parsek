schema = 1
id = "RW-8-free-tech-gift-rewind"
# =====================================================================================
# RW-8: A FREE TECH NODE, GIFTED INSIDE A COMMITTED TIMELINE, ACROSS A REWIND-TO-LAUNCH
# AND A COLD RELOAD (the rewind ledger campaign; the live proof of #2312, todo
# FREE-TECH-NODE-LOST-AFTER-REWIND).
#
# THE RULE UNDER TEST (game-actions design 12.4, user guide "Resources"): a tech node the
# game gives for free (stock's point-of-interest tech gift, the debug menu) is part of the
# timeline like a researched node, at no science cost. A rewind to before the gift locks it
# until the clock reaches the gift again; then it unlocks again; it is never lost for good,
# and no science is ever charged for it.
#
# THE SEAM: `KscAction gift-tech node=aviation` (new with this lane, design
# design-autotest-seam-verbs-c1.md "Update (2026-10-28, lane RW-8)") makes the anomaly gift's
# calls, `ResearchAndDevelopment.UnlockProtoTechNode` then `RefreshTechTreeUI`, on a named
# node. Parsek's FreeTechUnlockCapturePatch files it as a TechResearched row with cost 0.
#
# THE PROBE: `KscAction research-node node=aviation` is used only as a READ. Aviation costs
# 45 science and the host holds 20.17, so the pure decide refuses before any stock call:
# `insufficient-science` while the node is locked, `node-already-unlocked` while it is open.
# Neither answer changes the career.
#
# PLAN (cs-career-mun4 = CS-6c's produced save, UT ~185734, science 20.17, aviation locked):
#   boot       LoadGame persistent at the Space Center; warp to 185800.
#   probe0     research-node aviation -> REJECTED insufficient-science (locked at the start).
#   V          Jumping Flea on the pad, recorded 185800..185840, committed, recovered at its
#              Space Center marker (RW-4's shape): the tree a Rewind-to-Launch returns to,
#              with a committed future that leaves the pad clear.
#   gift       warp to 185900 (T1); gift-tech aviation -> OK, science unchanged; a second
#              read refuses node-already-unlocked.
#   rewind     InvokeRewindToLaunch tree=latest: back to V's launch, before T1.
#   probe1     research-node aviation -> REJECTED insufficient-science: locked, as the
#              timeline says.
#   crossing   warp to 185960: the clock reaches the gift; the tech patch makes aviation
#              available again; probe2 refuses node-already-unlocked.
#   reload     SaveGame rw08-04-reload-source, LoadGame playerLoad=true (a Cold save-file
#              load); probe3 refuses node-already-unlocked.
#   check      an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# STEP SAVES (temporary analysis artifacts, copied with the run under logs/):
#   rw08-01-after-v-commit, rw08-02-after-gift, rw08-03-after-rtl, rw08-04-reload-source,
#   rw08-05-after-cold-reload.
#
# PINNED LITERALS (all read 2026-10-28):
#   kscaction action=... applied=true manifestKind=  TestCommandKscAction.cs LogApplied
#   kscaction refused action=... reason=... target=  TestCommandKscAction.cs Refuse
#   Game state: TechResearched '<id>' free unlock    GameStateRecorder.Handlers.cs:768
#   Game state: ScienceChanged                       GameStateRecorder.cs:1122
#   PatchTechTree: available=... madeUnavailableIds= KspStatePatcher.cs:906
#   PatchCommittedTechUnlocks: madeAvailable=        KspStatePatcher.cs:1293 (the crossing)
#   PatchTechTree: relock-refusal-summary            KspStatePatcher.cs:926
#
# STATUS: LIVE-PROVEN 2026-10-28, `2026-10-28_1505` PASS attempt 1 (DLL 05786c53 built from 9942f128f, main plus the KscAction gift-tech seam). The gift ran at UT 185899.94
# (`free unlock (cost=0, nodeCost=45 ...)`, science 20.166671752929688 before and after);
# the rewind to V's launch re-locked it (`PatchTechTree: ... madeUnavailable=1 ...
# madeUnavailableIds=[aviation]`, probe insufficient-science); the warp unlocked it again on
# the first frame past the gift (`PatchCommittedTechUnlocks: madeAvailable=1 ... liveUT=185900.14
# ... [aviation]`, probe node-already-unlocked); the cold save-file reload kept it (probe
# node-already-unlocked). No ScienceChanged line; every [LedgerTrace] Structural line reads
# science=20.17. 35 recordings; batch passed=3 skipped=0; LedgerGroundTruth hardFailures=0;
# ledger_audit.py PASS. History: `2026-10-28_1457` and `_1502` PARSEK-FAIL on lane pins only
# (UT digit windows and the crossing line's name); every assertion held in both logs.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, free tech gift (#2312): on cs-career-mun4 a Jumping Flea V is recorded on the pad, committed and recovered; at UT 185900 the Space Center gifts the Aviation node for free through stock's UnlockProtoTechNode (the anomaly gift's call); a Rewind-to-Launch to V's launch locks the node again, the warp past the gift unlocks it again with no science spent, and a cold reload keeps it; LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-8", "career", "ledger", "rewind", "rewind-to-launch", "tech", "free-tech",
        "ksc-marker", "editor", "cold-load", "ground-truth", "ingame-batch", "timeline-ops",
        "reading-run"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 2 x 300 LoadGame + 4 x 120 KSC warps + 2 x (120 GoToEditor + 180
# LaunchFromEditor) + 180 StartRecording + 120 warp + 120 CommitTree + 120
# ExitToSpaceCenter + 60 KscMarkerRecover + 300 rewind + 120 check warp + 6 x 120 SaveGame
# + 6 x 60 KscAction + 540 RunTests = 4400; runtime 5400 adds the inert steps and
# FlushAndQuit.
steps = [
  # scene = "spacecenter": the host's three vessels are Mun debris (RW-1's boot).
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  # Clear of the fixture's last rows (185732-185734) and their 60 s rollout window.
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },
  # ---- probe0: aviation is locked on the host ----
  { cmd = "KscAction",      args = { action = "research-node", node = "aviation" },        expect = "REJECTED", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw8-probe0" },                               expect = "OK" },
  # ---- V: the Flea on the pad, recorded, committed, recovered at its marker ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "v",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "185840" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw8-v-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw08-01-after-v-commit" },                   expect = "OK", budget = 120 },
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${v.pid}" },                                 expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw8-v-recovered" },                          expect = "OK" },
  # ---- the gift at T1 = 185900, then a read that it is open ----
  { cmd = "WarpToUT",       args = { ut = "185900", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw8-before-gift" },                          expect = "OK" },
  { cmd = "KscAction",      args = { action = "gift-tech", node = "aviation" },            expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw8-gifted" },                               expect = "OK" },
  { cmd = "KscAction",      args = { action = "research-node", node = "aviation" },        expect = "REJECTED", budget = 60 },
  { cmd = "SaveGame",       args = { name = "rw08-02-after-gift" },                       expect = "OK", budget = 120 },
  # ---- the rewind to V's launch, before the gift ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw8-rewound" },                              expect = "OK" },
  # The rewind save carries the settings of V's recording start; asserted so the check
  # launch stays unrecorded (the ground truth skips with a live tree).
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw08-03-after-rtl" },                        expect = "OK", budget = 120 },
  # ---- probe1: locked again, as the timeline says ----
  { cmd = "KscAction",      args = { action = "research-node", node = "aviation" },        expect = "REJECTED", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw8-locked-probed" },                        expect = "OK" },
  # ---- the crossing: the clock reaches the gift ----
  { cmd = "WarpToUT",       args = { ut = "185960", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw8-crossed" },                              expect = "OK" },
  { cmd = "KscAction",      args = { action = "research-node", node = "aviation" },        expect = "REJECTED", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw8-unlocked-probed" },                      expect = "OK" },
  # ---- the cold reload ----
  { cmd = "SaveGame",       args = { name = "rw08-04-reload-source" },                    expect = "OK", budget = 120 },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "rw08-04-reload-source", scene = "spacecenter", playerLoad = "true" }, expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw8-cold-reloaded" },                        expect = "OK" },
  { cmd = "KscAction",      args = { action = "research-node", node = "aviation" },        expect = "REJECTED", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw8-reload-probed" },                        expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw08-05-after-cold-reload" },                expect = "OK", budget = 120 },
  # ---- the check: an unrecorded launch onto the (clear) pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186000" },                                      expect = "OK", budget = 120 },
  # The DEFAULT slot (persistent): the one a harvest reads; the named slots above are side files.
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 34 recordings plus V; the check launch is unrecorded and the rewind removes
# none. Measured 35 on `2026-10-28_1505`.
count = { min = 35, max = 35 }

[expectations.logContracts]
required = [
  # The ledger tracer is on (the gated Tier-A line, once per recalc).
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- probe0: locked on the host ----
  "kscaction refused action=research-node reason=insufficient-science target=aviation[\\s\\S]*?MISSIONMARK label=rw8-probe0 ut=",

  # ---- V committed and recovered (RW-4's pad shape) ----
  "launchfromeditor complete scene=FLIGHT vessel=Jumping Flea pid=[0-9]+ site=LaunchPad situation=PRELAUNCH [\\s\\S]*?MISSIONMARK label=rw8-v-committed ut=",
  "MISSIONMARK label=rw8-v-committed ut=[\\s\\S]*?kscrecover complete pid=[0-9]+ vessel=Jumping Flea scene=SPACECENTER quick=false elapsed=[\\s\\S]*?MISSIONMARK label=rw8-v-recovered ut=",

  # ---- the gift: stock's free unlock, captured once as a cost-0 TechResearched row, no
  # science moved ----
  "MISSIONMARK label=rw8-before-gift ut=18589[0-9]\\.",
  "MISSIONMARK label=rw8-before-gift ut=[\\s\\S]*?Game state: TechResearched 'aviation' free unlock \\(cost=0, nodeCost=45, ut=18589[0-9]\\.[0-9]+, parts=[1-9][0-9]*, tag='', reason=stock UnlockProtoTechNode\\)[\\s\\S]*?MISSIONMARK label=rw8-gifted ut=",
  "MISSIONMARK label=rw8-before-gift ut=[\\s\\S]*?kscaction action=gift-tech target=aviation applied=true manifestKind=tech-unlock observedAfter=science=20\\.166[0-9]*[\\s\\S]*?MISSIONMARK label=rw8-gifted ut=",
  "MISSIONMARK label=rw8-gifted ut=[\\s\\S]*?kscaction refused action=research-node reason=node-already-unlocked target=aviation",

  # ---- after the rewind: locked again ----
  "MISSIONMARK label=rw8-rewound ut=18578[0-9]\\.",
  # The rewind's own walk (cutoff at V's launch) re-locks the gifted node.
  "MISSIONMARK label=rw8-gifted ut=(?:(?!MISSIONMARK label=rw8-rewound )[\\s\\S])*?PatchTechTree: available=[0-9]+, madeAvailable=0, madeUnavailable=1, [^\\r\\n]*madeUnavailableIds=\\[aviation\\]",
  "MISSIONMARK label=rw8-rewound ut=(?:(?!MISSIONMARK label=rw8-locked-probed )[\\s\\S])*?kscaction refused action=research-node reason=insufficient-science target=aviation",

  # ---- the crossing: the committed unlock makes aviation available again at the gift's UT ----
  "MISSIONMARK label=rw8-locked-probed ut=(?:(?!MISSIONMARK label=rw8-crossed )[\\s\\S])*?PatchCommittedTechUnlocks: madeAvailable=[1-9][0-9]*, [^\\r\\n]*liveUT=(?:18589|18590)[0-9]\\.[0-9]+, madeAvailableIds=\\[[^\\]\\r\\n]*aviation",
  "MISSIONMARK label=rw8-crossed ut=(?:(?!MISSIONMARK label=rw8-unlocked-probed )[\\s\\S])*?kscaction refused action=research-node reason=node-already-unlocked target=aviation",

  # ---- the cold reload keeps it ----
  "MISSIONMARK label=rw8-unlocked-probed ut=[\\s\\S]*?Load classified: early=Cold [\\s\\S]*?MISSIONMARK label=rw8-cold-reloaded ut=",
  "MISSIONMARK label=rw8-cold-reloaded ut=(?:(?!MISSIONMARK label=rw8-reload-probed )[\\s\\S])*?kscaction refused action=research-node reason=node-already-unlocked target=aviation",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
]
forbidden = [
  # The gift is captured exactly once: the crossing and the reload replay it, never re-file it.
  "\\A(?:[\\s\\S]*?Game state: TechResearched 'aviation' free unlock){2}",
  # Aviation is never paid for.
  "Game state: TechResearched 'aviation' \\(cost=",
  # No science moves anywhere in the lane (no experiment, no research, no gift charge).
  "Game state: ScienceChanged ",
  # A reconstructed pool too small for a kept unlock row.
  "PatchTechTree: relock-refusal-summary",
  # The gift is never re-locked after the clock has passed it.
  "MISSIONMARK label=rw8-crossed ut=[\\s\\S]*madeUnavailableIds=\\[[^\\]\\r\\n]*aviation",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

[runtime]
budgetSeconds = 5400

[retry]
policy = "once"

[expectedFail]
bugId = ""
