schema = 1
id = "L3-strategy-currency-conversion"
# nightly. This spec shipped `operator` for exactly as long as its BATCH_COMPLETE
# tally was a PREDICTION - the reading-run hold, the L2 pattern - and is promoted here
# by the flight that measured the pin, in the same commit that replaces it:
# `2026-08-19_L3` (result id `2026-08-18_2039_L3-strategy-currency-conversion`), PASS
# attempt 1, 57 s wall, fully unattended, seam driver with no RequiresFlight verb and
# no human judgement in the loop. Nothing operator-shaped was ever owed; only the
# measurement was.
tier = "nightly"
# WHAT THIS IS. The career-ledger lane's D8 `strategies` scenario, and the LIVE PROOF
# the two open todo entries STRATEGY-SCIENCE-CONVERSION-LEAK (door 2) and
# STRATEGY-FUNDS-YIELD-DRIFT are waiting on.
#
# KSP has TWO stock strategy currency-conversion mechanisms and they leave completely
# different traces. `Strategies.CurrencyExchanger` (Research Rights Sell-Out) does a
# one-shot direct Add* under TransactionReasons.StrategyInput / StrategyOutput; the
# c2 save's Parsek/GameState/events.pgse carries that pair verbatim at ut=8599.8755,
# so the reason-keyed doors that capture it are OBSERVED and are NOT this spec's
# subject. `Strategies.Effects.CurrencyConverter` (Patents Licensing and 7 siblings)
# instead mutates a CurrencyModifierQuery IN PLACE, and the Changed events that follow
# are already NET, under the ORIGINAL reason - no StrategyInput event exists at all.
# That family is what the query-family door captures and what this spec drives.
#
# THE SEAM HAS NO STRATEGY VERB. `TestCommandKscAction` maps only research-node /
# upgrade-facility / hire-kerbal / dismiss-kerbal, so the only drivable strategy
# surface is the in-game `StrategyLifecycle` category - i.e. the L2 shape
# (LoadGame -> SetSetting -> RunTests -> FlushAndQuit), with no flight at all.
description = "Drive the StrategyLifecycle category against a fresh career and assert a stock CurrencyConverter's in-place query mutation lands in the ledger as a science debit + a strategy funds earning, with no GUARDED clamp."
instanceProfile = "stock-minimal"
tags = ["ledger", "L3", "ingame-batch", "strategies", "reading-run"]

[fixture]
# strategy-career, which IS `fresh-career` with a reputation seed and nothing else -
# two lines of the save differ (the `Title` and the `Reputation` SCENARIO's `rep`),
# and `harness/tools/build_strategy_career.py` derives it with
# `StrategyCareerFixtureDriftTests` asserting byte-identity against the current base.
# It shipped `fresh-career` until 2026-08-20; the swap is what lets the category's
# NEGATIVE CONTROL run, at the measured cost of the exchanger arm (the two cannot
# coexist at one reputation value - see the tally block), and the paragraphs below are
# the whole argument.
#
# THE BASE CHOICE IS FORCED BY THE SCENE, and the sibling inherits it. All SEVEN
# StrategyLifecycle declarations are Scene = GameScenes.SPACECENTER. `fresh-career`
# carries ZERO VESSEL nodes, so TestCommandLoadGame.DecideLoadRoute takes the
# NoVesselSpaceCenter route and the batch runs where all nine are eligible (the same
# route B10 and the L1 career family measure). career-pad-craft would route to FLIGHT
# and scene-skip every one of them - the exact vacuity defect B10 was re-flown to fix.
#
# THE SEED IS WHAT USED TO LIMIT THE MATRIX. funds=500000 science=100 rep=25: the
# funds seed affords every funds-costing strategy the cells activate, the science seed
# does NOT afford the two science-costing setup charges (both cells top science up
# ledger-visibly), and the reputation seed - 0 on the base - is what
# OperationStrategy_RewardMultiplier_IsNotCaptured needs to activate
# `LeadershipInitiative` at all - MEASURED on run `2026-08-20_1817`, whose activation
# charged `Added -14.50262 (-14.5) reputation: 'StrategySetup'`. 25 is solved for, not
# chosen: stock's
# `initialCostReputation` lerps 10..100 at `factorSliderDefault = 0.05` to 14.5 and
# `Strategy.CanBeActivated` compares the CURRENT pool against it, while the next stock
# reputation threshold up is `UnpaidResearchProgramCfg`'s 35.0 - so [14.5, 35.0) is
# the band that clears the gate while moving the activatable-strategy set (and with it
# whatever `ProbeActivatableStockStrategy` hands the two probe-driven cells) as little
# as the requirement allows. 25 is the whole number nearest its centre. The builder's
# `verify` re-derives both bounds; `StrategyCareerSeedBandTests` re-asserts them.
#
# WHY A SIBLING RATHER THAN SEEDING `fresh-career`. Six other committed specs stage
# `fresh-career` directly and six more stage `career-pad-craft`, which
# `build_career_pad_craft.py` DERIVES from it. KSP's granular reputation curve is
# STATE-DEPENDENT, and `CL-2-pod-impact-ledger` pins its output as an EXACT-DIGIT
# logContract regex on KSP's OWN line - the crew-loss hit
# `Added -9.999828 (-10) reputation: 'VesselLoss'` and the two `+1` Progression awards
# `Added 0.9999995 (1) reputation: 'Progression'`. Measured against
# `oracle.apply_rep_curve` as of PR #1508's residual-step port - which now reproduces
# that Progression pin to all seven printed digits at rep 0, so it is a calibrated
# instrument and not an analogy - a -10 nominal lands at -9.9996061 from rep 0 against
# -10.0001546 from rep 25. That 5.5e-4 shift is ~500x the last printed digit, so the
# exact-digit regex would stop matching, and seeding the base would have re-opened it
# for a gap that belongs to this spec alone. NOTE WHICH SURFACE BINDS: the oracle's own
# reputation FACET would NOT red (5.5e-4 sits far inside its 0.1 tolerance), so the cost
# is a re-flown logContract pin rather than a manifest amount. This is the
# `career-science-pad` precedent applied to the other base fixture.
#
# The fixture also satisfies the cells' own guards: career mode, Funding /
# ResearchAndDevelopment / Reputation singletons all present, an EMPTY `STRATEGIES`
# node (so every strategy is built fresh from config at `factorSliderDefault`, which
# is what pins the 14.5), and - because nothing is injected and auto-record is off
# below - no live recorder and no pending tree, which the cells require because the
# door's recalc defers its KSP patch while one exists.
saveTemplate = "fixtures/saves/strategy-career"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# SetSetting mirrors B10 / the L1 family on this same fixture. It is not cosmetic
# here: a live recorder makes CurrencyConverterStrategy_LedgerMatchesNetCredit Skip
# rather than run, so auto-record must be off for the batch to have a subject.
#
# No `isolated` arg: all nine StrategyLifecycle declarations are batch-allowed, so
# the isolated filter would admit exactly the same set and
# CommittedBatchTallySourceSyncTests would (rightly) demand a seam-echo discriminator
# for a route this spec does not need.
#
# No `strict` arg: that seam belongs to the LedgerGroundTruth diff and this batch does
# not run it.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "StrategyLifecycle" },          expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                   expect = "OK" },
]

[dimensionsCovered]
# `strategies` CLAIMED, and what the claim means is narrow on purpose: the stock
# strategy lifecycle and its currency conversion are OBSERVED end to end by a driven
# batch. It is NOT a claim about the exchanger family (that one is evidenced by the
# c2 events.pgse pair quoted above, not by this run) and NOT a claim about reputation
# conversion (the query-family door deliberately observes and drops reputation - the
# query delta is pre-curve while AddReputation applies KSP's curve on top).
#
# The reputation caveat above is now OBSERVED rather than merely asserted: as of the
# capture matrix this batch drives a converter whose OUTPUT leg is reputation, and
# measures the drop rather than assuming it.
#
# CLAIM-IS-NOT-GATE: backed by the pinned tally below plus the forbidden GUARDED
# tokens - and the tally is MEASURED (passed=8 skipped=1 as of the rep-debit-capture
# wave), so the claim rests on cells that all actually ran rather than on a predicted
# split. WHICH six changed on
# 2026-08-20: the reputation seed swapped the exchanger arm out and the negative
# control in, because the two cannot coexist at one reputation value. The EXCHANGER
# half of the D8 `strategies` claim therefore rests on `2026-08-18_2140`s measurement
# plus the c2 `events.pgse` pair, NOT on this spec's current standing run; see the
# tally block.
D8 = ["strategies", "science", "funds", "orchestrator", "ksp-state-patcher"]
D14 = ["career", "scene-ksc"]

[expectations]
# PLACEMENT IS LOAD-BEARING: a bare key written after an [expectations.<sub>] header
# is TOML-scoped to that sub-table and silently never read. hlib.validate_spec rejects
# the misplaced form, so this must stay ahead of the sub-tables.
allowedAnomalies = []

[expectations.recordings]
# Zero. Auto-record is off, the fixture injects nothing, and no cell in this category
# records. count.max == 0 also selects the B1 recording-rules log-validation
# suppression so a legitimately recording-free run does not red on REC-001/REC-003.
count = { min = 0, max = 0 }

