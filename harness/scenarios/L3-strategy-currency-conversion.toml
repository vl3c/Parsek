required  = ["BATCH_COMPLETE v1 total=9 passed=8 failed=0 skipped=1 category=StrategyLifecycle scene=SPACECENTER"]
# The GUARDED pair is the whole point of the lane. `GUARDED UPLIFT clamped` is the
# reconstruction running ABOVE live (the science take not captured - measured 0.72000
# against a 0.7200818 gap) and `GUARDED DRAWDOWN clamped` is it running BELOW (the
# funds yields not captured - measured 60.526316 against a 60.525981 gap). Either one
# on this run means a door did not close. The Parsek ERROR forbid is the house floor.
#
# MEASURED ZERO on 2026-08-18_2039 - the whole KSP.log carries no `GUARDED` line of
# any kind. The first reading (2026-08-18_2019) carried six, and what they were is
# recorded above.
forbidden = ["\\[Parsek\\]\\[ERROR\\]",
             "GUARDED UPLIFT clamped",
             "GUARDED DRAWDOWN clamped"]

# THE M-B2 ORACLE WITH AN EMPTY MANIFEST - the B10 / L1-passive-sandbox / L2
# precedent, and here it is a REAL assertion rather than a formality. The cell
# deliberately moves all three pools: it tops science up, activates a strategy that
# charges a setup cost, awards science, lets the door write ledger rows and run a
# recalc that PATCHES the live singletons, then restores everything in a finally. The
# empty manifest states that the whole of that comes back to the seed - i.e. the
# restore is complete and the batch is save-neutral. A leak in the teardown, or a
# recalc that patches to something other than the pre-test pools, classifies
# PARSEK-FAIL(ledger).
#
# The oracle has no report-only mode, so this IS armed from day one - which is a
# deliberate departure from "measure first" and is justified by WHAT it asserts: not a
# product behaviour under test, but the cell's own restore discipline, which is
# entirely within this branch's control and is unit-mirrored by the try/finally shape
# the two existing StrategyLifecycle cells already fly green.
#
# captureCrossCheck is NOT declared, so it stays report-only (the armed set is
# CL-2-only).
[expectations.ledger]
seedFrom     = "template"
tolerances   = "default"
rec3CarveOut = false
# No [[expectations.ledger.manifest]] entries: empty manifest = zero expected delta.

# The raw-Unity-exception scan (hlib.scan_unity_exceptions), ARMED AT ZERO on the
# eleven-spec zero-armed family that shares this exact boot profile: B10 and the six
# L1 specs boot the same LoadGame -> SetSetting -> RunTests -> FlushAndQuit shape on
# the same stock-minimal profile over `fresh-career`, and every driver-valid reading of
# all of them is 0. This spec now stages `strategy-career`, which is that same save
# with a two-line reputation seed, so the borrowed evidence still applies verbatim -
# and it now has readings of its own on top (2026-08-18_2039 and 2026-08-18_2140 both
# read 0 on the unseeded template).
#
# What this spec adds beyond that family is a hidden Administration canvas
# (StrategyLifecycle's readiness idiom instantiates one and destroys it), which is a
# GUI surface the L1 family does not raise - and `ArgumentException: GUILayout` is one
# of the four counted classes. The two existing StrategyLifecycle cells have never
# been flown by any committed spec, so whether that canvas raises is UNMEASURED. A
# nonzero first reading here is therefore a FINDING about the Administration
# hydration, not a flake to be papered over with a ceiling - and if it reads nonzero
# the honest response is to record the count and decide, not to raise the number.
[expectations.unityExceptions]
maxTotal = 0

[runtime]
# 720 matches the L2 batch-only shape on a career fixture: the per-step ceilings above
# exceed it on paper, but the measured wall for a one-category batch on this template
# is ~50-60 s and this category adds only a few settle frames.
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
