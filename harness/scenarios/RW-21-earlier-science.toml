schema = 1
id = "RW-21-earlier-science"
# =====================================================================================
# RW-21: A SUBJECT RECOVERED EARLIER AFTER A REWIND, IN A CAREER (the rewind ledger campaign, plan
# row 1, "Earlier science").
#
# THE RULING UNDER TEST: science goes to the earliest earning in UT order, capped per subject
# (owner ruling 2026-10-26, design 12.6 / 12.7). SCI-1 flies this in a Science game, where only the
# science pool moves. This lane is the career leg: recovery against recovery with funds and
# reputation moving beside it. RW-16 is transmission against recovery on the same host.
#
# WHAT THE CODE DOES (read 2026-10-31, main e96d2c9bb, ScienceModule.ProcessEarning, SCI-1's header):
# nothing raises the subject before G: the committed row is still ahead of the clock, so stock
# pays G's recovery the full value. G's row walks first and takes it; F's committed row walks
# second as `Earning (cap hit)` with the remainder, here 0. Nothing is taken back: G's is the first
# payment of the subject on this timeline.
#
# THE SUBJECT: crewReport@KerbinSrfLandedLaunchPad, 1.5 science, unearned on cs-career-mun4 (RW-16
# measured the value and the cap). The pod's own report, kept aboard and recovered.
#
# PLAN (UTs are the plan):
#   boot       LoadGame persistent at the Space Center; warp to 185800.
#   F          Flea, recorded; the crew report on the pad; warp to 185900; commit; recover at the
#              pad: the report is credited at ~185900.
#   rewind     Rewind-to-Launch onto F: clock ~185785, before F's rows.
#   G          Flea again, unrecorded (the stand-in aboard): the same report, recovered at its
#              Space Center marker at ~185805 (stock's recovery summary after a flight Recover
#              holds warp).
#   crossing   warp to 186000: the walk gives G's recovery the full value and F's the remainder.
#   check      an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# THE POOLS. G's recovery earns what F's gives up and refunds G's launch in full, so every pool ends
# where it was before the rewind.
#
# STATUS: LIVE-PROVEN 2026-10-31, `2026-10-31_0318` PASS attempt 1 (DLL c39bde83, main e96d2c9bb). F recovered its pad crew report at UT 185900.1 (1.5
# science); the rewind landed at 185785.6; G's stand-in recovered the same report at 185805.2, an untagged row. The walk
# gave G's recovery the full 1.5 and logged F's `Earning (cap hit) ... effective=0, headroom=0, creditedTotal=1.5,
# maxValue=1.5`. Funds 157546.18, science 21.67 and rep 115 ended as before the rewind; no take-back, no pool
# adjustment; LedgerGroundTruth 3/3 hardFailures=0; ledger_audit PASS.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, a subject recovered earlier after a rewind in a career (plan row 1): on cs-career-mun4 a committed Flea recovers its pad crew report, a Rewind-to-Launch onto it, and a second Flea recovers the same report first: the walk gives the earlier recovery the full value and the committed one the remainder, credited science stays within the subject's cap, the pools end where the rewind began and LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-21", "career", "ledger", "rewind", "rewind-to-launch", "science", "recovery",
        "ksc-marker", "editor", "ground-truth", "ingame-batch", "timeline-ops"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 5 x 120 warps + 3 x (120 GoToEditor + 180 LaunchFromEditor)
# + 180 StartRecording + 120 CommitTree + 120 Recover + 120 ExitToSpaceCenter + 60 KscMarkerRecover
# + 300 rewind + 5 x 120 SaveGame + 540 RunTests = 3840; runtime 4600 adds the inert steps and
# FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },
  # ---- F: the crew report kept aboard and recovered 100 s after launch ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "f",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "PartAction",     args = { button = "experiment", part = "mk1pod.v2" },          expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185900" },                                      expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "inspect", part = "mk1pod.v2" },             expect = "OK" },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "Recover",        args = { pid = "${f.pid}" },                                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw21-f-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw21-01-after-f-commit" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw21-before-rewind" },                       expect = "OK" },
  # ---- the rewind onto F's launch ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw21-rewound" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw21-02-after-rtl" },                        expect = "OK", budget = 120 },
  # ---- G: the same report, recovered before F's row ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "g",             expect = "OK", budget = 180 },
  { cmd = "PartAction",     args = { button = "experiment", part = "mk1pod.v2" },          expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185805", maxRate = "1" },                       expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "inspect", part = "mk1pod.v2" },             expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${g.pid}" },                                 expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw21-g-recovered" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw21-03-after-g-recovery" },                 expect = "OK", budget = 120 },
  # ---- the crossing of F's rows ----
  { cmd = "MissionMark",    args = { label = "rw21-before-crossing" },                     expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "186000", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw21-crossed" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw21-04-after-crossing" },                   expect = "OK", budget = 120 },
  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186030" },                                      expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["funds", "science", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 34 recordings plus F; G and the check launch are unrecorded. Measured on `2026-10-31_0318`.
count = 35

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- before the rewind F's recovery is the earning ----
  "\\[ScienceModule\\] Earning: subject=crewReport@KerbinSrfLandedLaunchPad, awarded=1\\.5, effective=1\\.5, [^\\r\\n]*[\\s\\S]*?MISSIONMARK label=rw21-before-rewind ut=",

  # ---- the rewind lands before F's rows ----
  "MISSIONMARK label=rw21-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw21-rewound ut=1857[0-9]{2}\\.",

  # ---- G's recovery earns it first, an untagged row ----
  "MISSIONMARK label=rw21-rewound ut=(?:(?!MISSIONMARK label=rw21-g-recovered )[\\s\\S])*?KSC science recorded: subject='crewReport@KerbinSrfLandedLaunchPad' science=1\\.5 method=Recovered ut=1858",

  # ---- the walk: the earlier recovery has the full value, the committed one the remainder ----
  "MISSIONMARK label=rw21-before-crossing ut=[\\s\\S]*\\[ScienceModule\\] Earning: subject=crewReport@KerbinSrfLandedLaunchPad, awarded=1\\.5, effective=1\\.5, creditedTotal=1\\.5, maxValue=1\\.5,",
  "MISSIONMARK label=rw21-before-crossing ut=[\\s\\S]*\\[ScienceModule\\] Earning \\(cap hit\\): subject=crewReport@KerbinSrfLandedLaunchPad, awarded=1\\.5, effective=0, headroom=0, creditedTotal=1\\.5, maxValue=1\\.5,",

  # ---- the pools end where the rewind began ----
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw21-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw21-crossed ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=",
  "invokerewindtolaunch refused",
  "\\[TakeBack\\] Took back ",
  "take-back shortfall",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

[runtime]
budgetSeconds = 4600

[retry]
policy = "once"

[expectedFail]
bugId = ""
