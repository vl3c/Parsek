[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },

  # ---- L9's prefix: the contract accepted before the launch ----
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "8a2b7d40-4ee9-4f98-8290-7052ca24afd0" }, expect = "OK", budget = 60 },
  { cmd = "SaveGame",       args = { name = "persistent" },                                expect = "OK", budget = 120 },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },           expect = "OK", budget = 300 },

  # ---- flight A: L9's, held on the pad to UT 1040 so the rewound clock has room ----
  { cmd = "WarpToUT",       args = { ut = "440" },                                         expect = "OK", budget = 120 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "1040" },                                        expect = "OK", budget = 180 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "Recover",        args = { pid = "1846203977" },                                 expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "l10-a-committed" },                          expect = "OK" },

  # ---- KSC 1: L9's committed purchases (C = 546082.03125) ----
  { cmd = "KscAction",      args = { action = "upgrade-facility", facility = "SpaceCenter/Administration" },   expect = "OK", budget = 60 },
  { cmd = "KscAction",      args = { action = "upgrade-facility", facility = "SpaceCenter/TrackingStation" },  expect = "OK", budget = 60 },
  { cmd = "KscAction",      args = { action = "upgrade-facility", facility = "SpaceCenter/MissionControl" },   expect = "OK", budget = 60 },
  { cmd = "KscAction",      args = { action = "activate-strategy", strategy = "AppreciationCampaignCfg", factor = "0.06640625" }, expect = "OK", budget = 60 },
  { cmd = "KscAction",      args = { action = "activate-strategy", strategy = "OutsourcedResearchCfg", factor = "0.06640625" },   expect = "OK", budget = 60 },

  # ---- rewind: A's launch, from the Space Center (clock ~425, every cost ahead) ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "l10-rewound" },                              expect = "OK" },

  # ---- a purchase the live pool covers and the reservation does not: the dish repair ----
  { cmd = "KscAction",      args = { action = "demolish-building", building = "OuterDish" }, expect = "OK", budget = 60 },
  # Defers until the collapse settles, then makes the menu's RepairFacility(true) call.
  { cmd = "KscAction",      args = { action = "repair-facility", facility = "SpaceCenter/TrackingStation" }, expect = "REJECTED", budget = 60 },
  { cmd = "CaptureScreenshot", args = { label = "l10-repair-refused" },                    expect = "OK" },
  { cmd = "UiAction",       args = { op = "dismiss", popup = "actionblocked", press = "OK" }, expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "facilitymenu", act = "open", item = "SpaceCenter/TrackingStation" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "l10-facility-menu" },                     expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "facilitymenu", act = "close" },             expect = "OK" },

  # ---- the Cancel that releases its own reserve: not greyed, not refused ----
  { cmd = "StockScreen",    args = { screen = "missioncontrol", act = "open", pane = "active" }, expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "missioncontrol", act = "select", item = "8a2b7d40-4ee9-4f98-8290-7052ca24afd0", pane = "active" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "l10-mc-cancel" },                         expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "missioncontrol", act = "close" },           expect = "OK" },
  { cmd = "KscAction",      args = { action = "cancel-contract", contract = "8a2b7d40-4ee9-4f98-8290-7052ca24afd0" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "l10-cancelled" },                            expect = "OK" },

  # ---- Mission Control Accept: one refused, one allowed, read on the screen first ----
  { cmd = "StockScreen",    args = { screen = "missioncontrol", act = "open", pane = "available" }, expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "missioncontrol", act = "select", item = "7692d51a-1548-4aaa-8ba2-795cbbc269cf", pane = "available" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "l10-mc-refused" },                        expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "missioncontrol", act = "select", item = "375b4446-c861-4b4d-bf97-ef38407246a4", pane = "available" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "l10-mc-allowed" },                        expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "missioncontrol", act = "close" },           expect = "OK" },
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "7692d51a-1548-4aaa-8ba2-795cbbc269cf" }, expect = "REJECTED", budget = 60 },
  { cmd = "CaptureScreenshot", args = { label = "l10-accept-refused" },                    expect = "OK" },
  { cmd = "UiAction",       args = { op = "dismiss", popup = "actionblocked", press = "OK" }, expect = "OK" },
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "375b4446-c861-4b4d-bf97-ef38407246a4" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "l10-accepted" },                             expect = "OK" },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

