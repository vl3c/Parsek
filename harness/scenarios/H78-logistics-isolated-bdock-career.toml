description = "H39-logistics-isolated-bdock-career style: the isolated Logistics batch over bdock-recorded-career, H39's recorded dock/undock save converted to CAREER by build_route_career.py, so RouteRewindRedeliveryInGameTest's funds-flat assertion runs on a recorded host with a live Funding singleton, gating its funds-unchanged line, mode=CAREER on the shuttle cell's route build and the career-save seeds. FLOWN GREEN 2026-10-21 on its first flight (2026-10-21_2022, funds unchanged net=0): 34 passed / 0 failed / 13 skipped, H39's split, pinned whole."
