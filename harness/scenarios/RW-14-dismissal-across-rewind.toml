schema = 1
id = "RW-14-dismissal-across-rewind"
# =====================================================================================
# RW-14: A KERBAL DISMISSED AT THE SPACE CENTER, ACROSS A REWIND-TO-LAUNCH (the rewind ledger
# campaign, owner ruling 2026-10-28, option A: a dismissal stays on the timeline like a hire;
# design section 9.12.1, todo KERBAL-DISMISSAL-ON-THE-TIMELINE).
#
# THE KERBAL: Bob Kerman, Crew, Available on the host, named by no ledger row and in no
# recording, and not aboard this lane's Flea (stock seats Jebediah first). `sack-kerbal` is the
# Astronaut Complex's own path (`KerbalRoster.SackAvailable`).
#
# PLAN (cs-career-mun4 = CS-6c's produced save, UT ~185734):
#   boot       LoadGame persistent at the Space Center; warp to 185800.
#   H          a Jumping Flea on the pad, recorded to 185840, committed, recovered at its marker.
#   sack       warp to 186000 (T1, outside H's lead window): Bob dismissed, one KerbalDismissal row.
#   rewind     Rewind-to-Launch to ~185785, before T1: Bob is Crew again until the clock reaches T1.
#   probes     his Astronaut Complex row reads "Dismissed on DATE" and greys Dismiss; a second
#              dismissal is refused and books nothing; the VAB crew dialog greys him and refuses
#              the seat. T1 sits 215 s past the rewind so the Space Center clock, which runs at
#              1x through these screens, cannot reach it first.
#   crossing   warp to 186100: `Committed dismissal applied:` once, Crew -> Applicant, no stock
#              sack event, so no second row; funds and reputation unmoved.
#   after      a dismissal of the Applicant is refused by the seam's own pre-check.
#   check      an unrecorded Flea onto the pad (a later walk names him `already type=Applicant`),
#              the default save, LedgerGroundTruth.
#
# PINNED LITERALS (read 2026-10-31 on origin/claude/project-thread-25edvc 5491c45, NOT on main
# until the feature lands):
#   Game state: CrewDismissed '<name>'                  GameStateRecorder.Handlers.cs
#   Blocked dismissal of ... already dismissed by timeline at UT=   Patches/KerbalDismissalPatch.cs
#   Committed dismissal applied: / reached: ... already type=       KerbalsModule.cs
#   Blocked crew assignment of ... (kind=KerbalDismissal)   StockUiCrewDialogDecoration.cs
#   kind=KerbalDismissal on the hover records           StockUiDecorationQuery.cs
#
# STATUS: AUTHORED 2026-10-31 (branch `rw14-dismiss`), NEVER FLOWN: it needs the feature build.
# The recordings count and the batch split are interim until measured.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, a kerbal dismissed at the Space Center across a Rewind-to-Launch: on cs-career-mun4 a committed pad Flea, Bob Kerman dismissed at T1, a rewind before T1; he stays Crew with his Astronaut Complex row reading Dismissed on DATE, a second dismissal and a VAB seat are refused, the warp past T1 turns him into an Applicant exactly once, funds and reputation never move and LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-14", "career", "ledger", "rewind", "rewind-to-launch", "kerbal-dismissal", "kerbals",
        "ksc-marker", "editor", "ground-truth", "ingame-batch", "timeline-ops"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 5 x 120 warps + 3 x 120 editor entries + 2 x 180 launches
# + 180 StartRecording + 120 CommitTree + 120 ExitToSpaceCenter + 60 KscMarkerRecover
# + 300 rewind + 6 x 120 SaveGame + 3 x 60 KscAction + 60 assign-crew + 120 editor close
# + 540 RunTests = 3960; runtime 4800 adds the inert steps and FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },
  # ---- H: the Flea on the pad, recorded, committed, recovered at its marker ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "h",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "185840" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw14-h-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw14-01-after-h-commit" },                   expect = "OK", budget = 120 },
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${h.pid}" },                                 expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw14-h-recovered" },                         expect = "OK" },
  # ---- the dismissal at T1 = 186000 ----
  { cmd = "WarpToUT",       args = { ut = "186000", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw14-before-sack" },                         expect = "OK" },
  { cmd = "KscAction",      args = { action = "sack-kerbal", kerbal = "Bob Kerman" },      expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw14-sacked" },                              expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw14-02-after-sack" },                       expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw14-before-rewind" },                       expect = "OK" },
  # ---- the rewind: Bob is Crew until T1, and held ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw14-rewound" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw14-03-after-rtl" },                        expect = "OK", budget = 120 },
  { cmd = "StockScreen",    args = { screen = "astronaut", act = "open" },                 expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "astronaut", act = "hover", item = "Bob Kerman" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "rw14-ac-bob" },                           expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "astronaut", act = "close" },                expect = "OK" },
  { cmd = "KscAction",      args = { action = "sack-kerbal", kerbal = "Bob Kerman" },      expect = "REJECTED", budget = 60 },
  { cmd = "UiAction",       args = { op = "dismiss", popup = "actionblocked", press = "OK" }, expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw14-resack-refused" },                      expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "editor", act = "open", item = "Jumping Flea" }, expect = "OK", budget = 120 },
  { cmd = "StockScreen",    args = { screen = "crewdialog", act = "open" },                expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "crewdialog", act = "hover", item = "Bob Kerman" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "rw14-crew-bob" },                         expect = "OK" },
  { cmd = "KscAction",      args = { action = "assign-crew", kerbal = "Bob Kerman" },      expect = "REJECTED", budget = 60 },
  { cmd = "UiAction",       args = { op = "dismiss", popup = "actionblocked", press = "OK" }, expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "editor", act = "close" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw14-before-crossing" },                     expect = "OK" },
  # ---- the crossing ----
  { cmd = "WarpToUT",       args = { ut = "186100", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw14-crossed" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw14-04-after-crossing" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw14-crossed-saved" },                       expect = "OK" },
  { cmd = "KscAction",      args = { action = "sack-kerbal", kerbal = "Bob Kerman" },      expect = "REJECTED", budget = 60 },
  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186130" },                                      expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["funds", "kerbals", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 34 recordings plus H; the check launch is unrecorded. INTERIM window.
count = { min = 35, max = 36 }

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- the dismissal at T1: stock's own event, on the ledger ----
  "MISSIONMARK label=rw14-before-sack ut=(?:(?!MISSIONMARK label=rw14-sacked )[\\s\\S])*?Game state: CrewDismissed 'Bob Kerman'",
  "MISSIONMARK label=rw14-before-sack ut=(?:(?!MISSIONMARK label=rw14-sacked )[\\s\\S])*?kscaction action=sack-kerbal target=Bob Kerman applied=true",

  # ---- the rewind ----
  "MISSIONMARK label=rw14-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw14-rewound ut=1857[0-9]{2}\\.",

  # ---- after the rewind: the row reads Dismissed on DATE, and the same words refuse him ----
  "MISSIONMARK label=rw14-rewound ut=[\\s\\S]*?record label=rw14-ac-bob screen=AstronautComplex tab=Available item=Bob Kerman kind=KerbalDismissal marked=true blocked=true why=\"(Dismissed on [^\"]+)\"[\\s\\S]*?\\[Parsek\\]\\[INFO\\]\\[CommittedAction\\] Blocked action: Cannot dismiss \"Bob Kerman\" - \\1\\r?\\n",
  "MISSIONMARK label=rw14-rewound ut=(?:(?!MISSIONMARK label=rw14-resack-refused )[\\s\\S])*?\\[Parsek\\]\\[INFO\\]\\[KerbalDismissal\\] Blocked dismissal of 'Bob Kerman' via KerbalRoster\\.SackAvailable - already dismissed by timeline at UT=18(?:5999|6000)",
  "MISSIONMARK label=rw14-rewound ut=(?:(?!MISSIONMARK label=rw14-resack-refused )[\\s\\S])*?kscaction sack-kerbal not applied: target=Bob_Kerman typeBefore=Crew typeAfter=Crew fundsBefore=(\\S+) fundsAfter=\\1 fundsDelta=0 scienceBefore=(\\S+) scienceAfter=\\2 scienceDelta=0",
  "MISSIONMARK label=rw14-rewound ut=(?:(?!MISSIONMARK label=rw14-resack-refused )[\\s\\S])*?kscaction refused action=sack-kerbal reason=blocked-committed target=Bob Kerman",
  "MISSIONMARK label=rw14-resack-refused ut=(?:(?!MISSIONMARK label=rw14-before-crossing )[\\s\\S])*?record label=rw14-crew-bob screen=CrewAssignment tab=Available item=Bob Kerman kind=KerbalDismissal marked=true blocked=true why=\"Dismissed on ",
  "MISSIONMARK label=rw14-resack-refused ut=(?:(?!MISSIONMARK label=rw14-before-crossing )[\\s\\S])*?\\[Parsek\\]\\[INFO\\]\\[CrewDialog\\] Blocked crew assignment of 'Bob Kerman' via MoveCrewToEmptySeat - reserved by the committed timeline \\(kind=KerbalDismissal\\)",
  "MISSIONMARK label=rw14-resack-refused ut=(?:(?!MISSIONMARK label=rw14-before-crossing )[\\s\\S])*?kscaction refused action=assign-crew reason=blocked-committed target=Bob Kerman",

  # ---- the crossing fires him through the row, and the Applicant cannot be fired again ----
  "MISSIONMARK label=rw14-before-crossing ut=(?:(?!MISSIONMARK label=rw14-crossed )[\\s\\S])*?Committed dismissal applied: 'Bob Kerman' Crew -> Applicant as the clock reached its row",
  "MISSIONMARK label=rw14-crossed-saved ut=[\\s\\S]*?kscaction refused action=sack-kerbal reason=kerbal-not-dismissable target=Bob Kerman",
  "MISSIONMARK label=rw14-crossed-saved ut=[\\s\\S]*Committed dismissal reached: 'Bob Kerman' already type=Applicant; nothing to do",

  # ---- nothing booked twice: the row count and the pools end where the rewind began ----
  "Saved ledger to '[^']*': version=[0-9]+, actions=([0-9]+)\\r?\\n(?:(?!Saved ledger to )[\\s\\S])*?MISSIONMARK label=rw14-before-rewind ut=[\\s\\S]*Saved ledger to '[^']*': version=[0-9]+, actions=\\1\\r?\\n(?:(?!Saved ledger to )[\\s\\S])*?MISSIONMARK label=rw14-crossed-saved ut=",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw14-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw14-crossed ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  # One firing, one row: stock's event fires once and the crossing writes the roster once.
  "Game state: CrewDismissed 'Bob Kerman'[\\s\\S]*Game state: CrewDismissed 'Bob Kerman'",
  "Committed dismissal applied: 'Bob Kerman'[\\s\\S]*Committed dismissal applied: 'Bob Kerman'",
  "Committed dismissal reached but",
  "filed StockPoolAdjustment amount=",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

[runtime]
budgetSeconds = 4800

[retry]
policy = "once"

[expectedFail]
bugId = ""
