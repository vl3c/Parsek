schema = 1
id = "GUI-4-census-missions-docked"
tier = "operator"
# THE GUI CENSUS, WAVE 2: THE DOCKED-CORPUS MISSIONS HOST. Its sibling GUI-3 opens the
# Logistics half of the populated-body problem; this lane opens the MISSIONS half, on the
# one committed corpus that carries a recorded DOCK and a set of live RewindPoints.
# Every target it claims is a named row in `docs/dev/design-gui-inventory.md` section 6.1
# or section 6.2; what it cannot reach is at the bottom of this header.
#
# WHY THIS FIXTURE. `fixtures/saves/bdock-recorded` is a 19-sidecar harvest of a station
# interception, and three whole families of Missions-tab and Recordings-tab cells exist
# only over a corpus shaped like it. Read off its own `persistent.sfs`:
#   - 19 `.prec` sidecars across TWO trees (`autoGeneratedRootGroupName` = `Kerbal X` and
#     `Kerbal X #2`), which is what draws the grouped blocks, the chain blocks and the
#     tree connectors the Recordings tab's 21 leaf-row cells live in;
#   - a recorded DOCK, which is what draws `Docked with <partner>` in the Start event
#     cell, the chapter header rows and the `Docked partner:` rows - none of which needs
#     a click and none of which has ever been photographed;
#   - THREE `REWIND_POINTS/POINT` entries. That is the load-bearing one: the Timeline
#     window's `Rewind/FF` and `Re-Fly` filter modes are two of its four views, and on
#     every host the census has photographed so far both were EMPTY lists. This is the
#     only committed fixture that populates them without flying anything, which
#     `RH-1-live-rp-handle-rewind` already proves by enumerating the same three.
#
# WHAT IT PHOTOGRAPHS (16 PNGs, each with a `<label>.gui.json` dump beside it):
#   - the Missions tab and the Recordings tab COLLAPSED and then fully EXPANDED, and then
#     the Recordings tab collapsed again. The collapse is not decoration: `key=none` is
#     the only way to photograph the tab's DEFAULT leaf-row form over a corpus big enough
#     to have one, and the pair either side of the expansion is what a reviewer diffs;
#   - all four Timeline filter modes over a corpus with three RewindPoints, so `Rewind/FF`
#     and `Re-Fly` carry ROWS rather than an empty-state sentence;
#   - the Timeline at its own MINIMUM SIZE (520x150, `TimelineWindowUI`'s floor). Section 7
#     of the inventory lists that floor and nothing has ever drawn at it; a column set
#     pinned wider than its own window is the class of defect the Milestones `Rewards`
#     overflow belongs to, and the only way to see it is to command the floor;
#   - the Structure window on a MISSION over a docked tree;
#   - both group-picker titles, `Manage Groups` and `Set Parent Group`;
#   - the BASIC forms of the main, Missions and Timeline windows over the same corpus.
#     The Basic Timeline capture carries an explicit `op=tab tab=overview` first, which is
#     the inventory's own 6.1 row: GUI-1's Basic Timeline label inherits whatever filter
#     the Advanced pass left selected, so it is a picture of the Re-Fly view under a label
#     that does not say so.
#
# STEP ORDER IS DEFENSIVE, the GUI-3 rule: a step whose answer is a QUESTION goes as late
# as its own capture allows, because a driver-INVALID run still harvests every picture
# taken before it (GUI-1 and GUI-2 both proved that on their first flights). The two
# questions here are `op=target window=structure mission=Kerbal X #2` and
# `op=picker window=missions group=Kerbal X` - this fixture carries NO `MISSION` node of
# its own, so both names come from `MissionStore.EnsureDefaultsForTrees` seeding the
# mission and group name from each tree's `autoGeneratedRootGroupName` at load. That
# seeding is production behaviour and the names are read off the fixture's bytes, but no
# committed run has ever addressed either by name, so both sit in the last third and both
# refusals would LIST what does exist.
#
# THE GROUP PICKER IS NOT CLOSED BY A SEAM OP, and does not need to be: the
# Advanced -> Basic complexity switch closes the gated, lock-owning windows, the group
# picker included, so the Basic pass starts from a clean screen.
#
# `op=open window=main` FIRST IS A PRECONDITION (the settle for a non-`main` `open` /
# `rect` refuses while the host's `showUI` is false), and `scene = "spacecenter"` is
# REQUIRED because this host's `activeVessel = 1` is focusable and the default LoadGame
# route would boot into FLIGHT.
#
# THE ANALYZER ROW IS LEFT GATING. This is a COMMITTED fixture that three committed lanes
# already fly (`RH-1`, `RF-8`, `H39-logistics-isolated-bdock`), so there is nothing to
# exempt and `ANALYZER_REPORT_ONLY_ALLOWLIST` stays as it is.
#
# WHAT THIS LANE CANNOT PHOTOGRAPH:
#   - the Re-Fly CONFIRM dialog, and by extension all 21 Parsek `PopupDialog`s. This is
#     the host that gets CLOSEST - it has the RewindPoints an `InvokeRewind` needs - and
#     it still cannot: `AnswerMergeDialog` DRIVES the conclusion and invokes the button in
#     one call (`DriveReFlyConclusion` -> `TryInvokeMergeButton`), leaving no frame in
#     which a capture could stand, `ExitToSpaceCenter` REFUSES `dialog-required
#     variant=ReFlyAttempt` rather than driving an exit into the modal, and no other verb
#     raises one. Section 6.2 of the inventory names the two prerequisites a dialog capture
#     needs; neither shipped with `gui-census-ops`. This lane therefore drives no rewind at
#     all - a rewind whose dialog cannot be photographed would only mutate the fixture's
#     tree under a census - and asserts the NEGATIVE through one `op=dialog` step instead.
#   - the `Timeline R greyed` state and the `FF` countdown. Both are section 6.1 rows and
#     both want a DIFFERENT staged save (a deleted `RewindPoints/<id>.sfs` for the first,
#     a recording whose `StartUT` is ahead of the save clock for the second). Naming them
#     here rather than faking them: this lane photographs the populated Rewind/FF list,
#     which is the row above them.
#   - the Missions window's right-hand columns. `RecordingsTableUI` is laid out for 1355 px
#     against a 1280x720 instance, so the window is commanded at its own floor (`op=rect`
#     clamps to it anyway) and honestly clipped at the client edge. Residue
#     GUI-CENSUS-TWO-WINDOWS-EXCEED-THE-INSTANCE-WIDTH, unchanged.
#   - any tint or phase colour: a GUI tree carries no colour field (section 6.3), so those
#     claims live in the PNG alone and this lane asserts on none of them.
#
# FLOWN 2026-09-11: reading run `2026-09-11_1551`, PASS on attempt 1, 67 s wall, all 80 steps
# met, 16 PNGs + 16 dumps (every dump `patched=17/17`), every verifier PASS or REPORT,
# `expectations mismatches=0`. Every `[expectations.logContracts]` line is one of this lane's
# OWN seam records.
#
# WHAT THE RUN MEASURED:
#   - THE DOCKED CORPUS IS FULLY EXPANDED, the fact this lane exists for.
#     `bd-missions-missions-expanded-advanced` (402 nodes against the collapsed 212) carries
#     both missions with their whole separation lineage - `Kerbal X   Launch -> Decoupled
#     (Kerbal X Probe) -> Orbiting`, `Kerbal X #2   Launch -> Decoupled (Kerbal X Probe) ->
#     Docked -> Undocked (Kerbal X) -> Orbiting`, the `Docked partner: Kerbal X (loiter,
#     2h 25m - not recorded)` row, and `Events (4)` / `Events (7)` digests. `op=expand
#     key=all` answered `changed=13 expanded=22 total=22`, and the `key=none` mirror
#     `changed=22 expanded=0 total=22`; the Recordings pair is 513 nodes against 111.
#   - BOTH PICKERS OPENED, both titles (`Manage Groups` over four group rows, `Set Parent
#     Group` over the non-self rows plus `(None / Root level)`), and BOTH QUESTIONS answered
#     yes: `mission=Kerbal X #2` and `group=Kerbal X` resolved off
#     `MissionStore.EnsureDefaultsForTrees`' seeding, with the Structure opener reporting
#     `steps=31`.
#
# WHAT THE RUN REFUTED, and this header claimed it: the THREE `REWIND_POINTS/POINT` entries
# do NOT populate `Rewind/FF`. They are SEPARATION RewindPoints and they populate `Re-Fly`
# (`bd-timeline-refly-advanced`, 93 nodes, two `Unfinished Flight:` rows with `Fly` / `Seal`
# / `GoTo`); `Rewind/FF` needs `TimelineWindowUI.ShouldShowRewindButton`, which wants a
# recording that OWNS a launch rewind save, and this fixture has zero `rewindSaveFileName`
# keys. So `bd-timeline-rewindff-advanced` (75 nodes) is the EMPTY form and no committed
# fixture populates that view - recorded in `design-gui-inventory.md` section 6.1.
#
# AND ONE READING THE MINIMUM-SIZE CAPTURE PRODUCED: the seam applied the commanded
# 520x150 unclamped (`want=270,8,520,150 applied=270,8,520,150 clamped=false min=520,150`)
# and the window DREW at `270,8,606,245`. `TimelineWindowUI`'s 520x150 is the resize-DRAG
# floor, not a size the window can occupy - GUILayout expands it to its content - so
# `bd-timeline-refly-minsize-advanced` is the smallest the Re-Fly view actually renders at.
description = "GUI census wave 2, the docked-corpus Missions host: photograph the Missions and Recordings tabs collapsed and fully expanded over a 19-sidecar two-tree dock harvest, all four Timeline filter modes with three live RewindPoints, the Timeline at its own minimum size, the Structure window on a mission and both group-picker titles."
instanceProfile = "stock-minimal"
tags = ["gui-census", "screenshots", "ui", "missions", "GUI-4", "pending-operator"]

[fixture]
saveTemplate = "fixtures/saves/bdock-recorded"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  # --- boot, forced to the Space Center ---
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },

  # --- Advanced pass ---
  { cmd = "UiAction", args = { op = "complexity", mode = "advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "open", window = "main" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "main", x = "8", y = "8", w = "250", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-main-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-main-advanced" }, expect = "OK" },

  # --- the Missions window, the subject ---
  # Commanded at its OWN MinWindowWidth (1355): `op=rect` clamps to that floor, so a
  # smaller number would produce the same rect with `clamped=true` and a spec that lies
  # about what it asked for.
  { cmd = "UiAction", args = { op = "open", window = "missions" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "missions", x = "0", y = "8", w = "1355", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "missions" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-missions-missions-collapsed-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-missions-missions-collapsed-advanced" }, expect = "OK" },
  # All five of the window's independent expansion sets at once - group names, chain block
  # ids, `missionId:headId` vessel rows, the INVERTED leg set and the mission-id digest
  # set - each enumerated by the window class through the same flattened row model the
  # draw walks. Over a DOCKED corpus that is what opens the per-vessel interval rows, the
  # `Events (N)` digests and the partner-journey subtrees in one step.
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "all" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-missions-missions-expanded-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-missions-missions-expanded-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "recordings" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-missions-recordings-expanded-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-missions-recordings-expanded-advanced" }, expect = "OK" },
  # The DEFAULT leaf-row form, taken second rather than first on purpose: `key=none` is a
  # positive act, and its payload's `changed=` says how much the expansion above had
  # actually opened. A pair either side of one expansion is what a reviewer diffs.
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "none" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-missions-recordings-collapsed-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-missions-recordings-collapsed-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "missions" }, expect = "OK" },

  # --- the Timeline, all four views, over a corpus with three RewindPoints ---
  { cmd = "UiAction", args = { op = "open", window = "timeline" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "timeline", x = "270", y = "8", w = "1000", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "overview" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-timeline-overview-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-timeline-overview-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "details" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-timeline-details-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-timeline-details-advanced" }, expect = "OK" },
  # THE TWO THAT HAVE NEVER HAD ROWS. Three `REWIND_POINTS/POINT` entries in this
  # fixture's ParsekScenario are what put them there.
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "rewindff" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-timeline-rewindff-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-timeline-rewindff-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "refly" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-timeline-refly-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-timeline-refly-advanced" }, expect = "OK" },
  # THE MINIMUM-SIZE RENDER. 520x150 is `TimelineWindowUI`'s own floor (inventory section
  # 7), so `op=rect` applies it unclamped and the window draws at the smallest size a
  # resize drag can produce. The Re-Fly view is the one under it because it is the view
  # already selected; the subject is the LAYOUT at the floor, not the filter.
  { cmd = "UiAction", args = { op = "rect", window = "timeline", x = "270", y = "8", w = "520", h = "150" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-timeline-refly-minsize-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-timeline-refly-minsize-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "timeline" }, expect = "OK" },

  # --- the Structure window on a mission (a QUESTION; see the header) ---
  # This fixture carries no MISSION node, so the name below is the one
  # `MissionStore.EnsureDefaultsForTrees` seeds from the tree's own
  # `autoGeneratedRootGroupName` at load. `Kerbal X #2` rather than `Kerbal X` because the
  # mission rung matches on EXACT equality and the second name is the distinctive one.
  { cmd = "UiAction", args = { op = "target", window = "structure", mission = "Kerbal X #2" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "structure", x = "270", y = "8", w = "1000", h = "520" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-structure-mission-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-structure-mission-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "structure" }, expect = "OK" },

  # --- both group-picker titles, over the Recordings tab that arms them ---
  { cmd = "UiAction", args = { op = "open", window = "missions" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "missions", x = "0", y = "8", w = "1355", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "recordings" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "picker", window = "missions", recording = "first" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-missions-grouppicker-manage-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-missions-grouppicker-manage-advanced" }, expect = "OK" },
  # THE SECOND QUESTION: `group=` resolves through `EnumerateGroupNamesForTesting`, which
  # walks the PRODUCTION `GroupPickerPresentation.BuildTreeModel`. A refusal LISTS the
  # names that exist, which is the reading, and every capture above it is already on disk.
  { cmd = "UiAction", args = { op = "picker", window = "missions", group = "Kerbal X" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-missions-grouppicker-setparent-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-missions-grouppicker-setparent-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "missions" }, expect = "OK" },

  # The negative dialog assertion: no Parsek modal stands over this census. See the header
  # for why that is the only thing `op=dialog` can prove on a capture lane today.
  { cmd = "UiAction", args = { op = "dialog" }, expect = "OK" },

  # --- Basic pass ---
  # The switch closes the group picker along with the other gated windows.
  { cmd = "UiAction", args = { op = "complexity", mode = "basic" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-main-basic" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-main-basic" }, expect = "OK" },

  # No `op=tab` on missions here, deliberately: Basic draws no tab bar and clamps the
  # selection to the Missions tab, so `tab=recordings` would be an honest ERROR
  # (`tab-not-applied`) rather than a capture.
  { cmd = "UiAction", args = { op = "open", window = "missions" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "missions", x = "0", y = "8", w = "1355", h = "700" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-missions-basic" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-missions-basic" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "missions" }, expect = "OK" },

  # THE TIMELINE'S BASIC CAPTURE NAMES ITS OWN VIEW. Inventory section 6.1: the filter
  # mode is a persistent field, so a Basic capture with no `op=tab` inherits whatever the
  # Advanced pass left selected - which on this lane is Re-Fly - and the label then says
  # something the picture does not. One op fixes it.
  { cmd = "UiAction", args = { op = "open", window = "timeline" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "timeline", x = "270", y = "8", w = "1000", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "overview" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "bd-timeline-overview-basic" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "bd-timeline-overview-basic" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "timeline" }, expect = "OK" },

  # Leave the install in Advanced.
  { cmd = "UiAction", args = { op = "complexity", mode = "advanced" }, expect = "OK" },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# BASICS ONLY, the GUI-3 discipline. This lane opens windows over a docked corpus and
# photographs them; it drives no dock, no undock and no rewind, so no D5 / D9 value is
# EXERCISED here even though the corpus carries the results of all three. `RH-1` and
# `H39-logistics-isolated-bdock` are the lanes that claim those on this same host.
D14 = ["sandbox", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.logContracts]
# This lane's OWN seam records only, the GUI-1 discipline. The describe echoes are the
# in-run check that each window token is wired to the window it names: `open=<n>
# openWindows=<names>` paired with the count is an EXACT claim, because a third open
# window would move the count.
required = [
  # --- describe echoes, in step order ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=1 openWindows=main",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,missions",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,timeline",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,structure",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=basic windows=11 open=1 openWindows=main",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=basic windows=11 open=2 openWindows=main,missions",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=basic windows=11 open=2 openWindows=main,timeline",
  # --- the expansion pair. `state=` carries the direction, which is what makes the two
  # captures either side of them a diff rather than two pictures of the same thing.
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction expand window=missions key=all state=true changed=[0-9]+ expanded=[0-9]+ total=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction expand window=missions key=none state=false changed=[0-9]+ expanded=[0-9]+ total=[0-9]+",
  # --- the targeted Structure open (`steps=` is the row count the rebuild produced) ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction target window=structure target=mission id=.* steps=[0-9]+",
  # --- both group-picker titles ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction picker window=missions picker=manage target=.* open=true",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction picker window=missions picker=setparent target=Kerbal X open=true",
  # --- the negative dialog assertion (see the header) ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction dialog open=false count=0",
  # --- one capture, proving the write-and-settle path end to end ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] capturescreenshot ok label=bd-main-advanced",
  # --- every dump, each pinning the arm-time funnel reading for its own frame ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-main-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-missions-missions-collapsed-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-missions-missions-expanded-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-missions-recordings-expanded-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-missions-recordings-collapsed-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-timeline-overview-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-timeline-details-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-timeline-rewindff-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-timeline-refly-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=bd-timeline-refly-minsize-advanced .*patched=17/17",
