#
# TWO INSTRUMENT OBSERVATIONS THE ARMING PASS MUST CARRY, both measured rather than
# argued, and neither a defect in this lane:
#   (a) THE HEADER'S `mapRenderTracingOn` BIT READS THE EXPORT INSTANT, NOT THE RUN.
#       This manifest says `mapRenderTracingOn=false` while carrying 107 seam
#       endpoint records - which only exist because tracing WAS on in flight (the
#       lane's `mapRenderTracing` SetSetting step logged `[TestCommands] setting
#       name=mapRenderTracing old=false new=true` and the run never turned it back
#       off). `RenderCompositionRecorder.TryExportNow` stamps the bit
#       from `MapRenderTrace.IsEnabled` at the export instant, and the file the
#       verifier read is the teardown one (`exportReason=process-teardown`). The
#       V8 sibling, same drive shape, read `true` - so the bit disagrees with itself
#       across two runs that both flew with the tracer on. It COSTS something: the
#       false reading is what put `seam-data-unavailable-tracing-off: 1` in the
#       unevaluable census above. The fix is a STICKY was-ever-on bit in the C#
#       recorder, filed as a small follow-up in
#       `docs/dev/todo-and-known-bugs.md` -> M-A7-RENDER-COMPOSITION-PHASES-3-AND-4.
#       Until it lands, do NOT read this bit as evidence about a lane's tracer arming.
#   (b) `exportReason=process-teardown`, not the chosen-instant export the step
#       placement below is argued for. The `ExportRenderManifest` step answered OK;
#       the teardown flush that follows `FlushAndQuit` then rewrote the same path, so
#       the verifier reads the LATER file. Benign here - the recorder accumulates from
#       Awake, so the teardown manifest is a superset of the chosen-instant one (minus
#       open-dwell close state) - but whether the placement rule still buys what it
#       claims is an arming-pass question worth asking once, not a reading-run defect.
#
# WHAT THE DECLARATION DOES, and it is the entire mechanism: declaring the block (NOT
# arming it) is what sets `PARSEK_RENDER_MANIFEST=1` at launch
# (`rendercompose.declared_composition_blocks` -> run.py's env build), which arms the
# C# recorder at Awake. Without the declaration the export verb answers
# `REJECTED msg=manifest-not-armed` and the run reads a manifest nobody wrote - which
# is exactly the quiet failure `hlib.validate_spec`'s verb/block coupling rule refuses
# pre-launch. The block is deliberately BARE: `rendercompose`'s own docstring says the
# facets are "Recorded UNCONDITIONALLY on a parseable manifest: that is how a lane
# earns its first honest window off a green report-only run", so declaring a window
# here would be declaring a PREDICTION and then reading it back as a measurement - the
# same mistake this lane's §5 note refuses for the save-structure blocks. The windows
# get written FROM the first reading run's facets, at arming, in a later pass.
#
# WHY THE THREE TRACERS ALREADY ABOVE ARE LOAD-BEARING FOR THIS ROW TOO: the
# tangent/endpoint capture predicates behind RC-SEAM are `mapRenderTracing`-gated
# (SPEC decision 2), so a manifest taken with the tracer off carries no seam numbers
# at all and every RC-SEAM numeric clause counts as
# `seam-data-unavailable-tracing-off` unevaluable. This lane already arms all three
# (steps 5-7) for the arrival-evidence lines, so the row costs nothing extra here.
#
# WHAT THIS LANE CANNOT MEASURE, stated so the reading run is not over-read: RC-WARP is
# satisfiable only by a REAL rails-warp ladder (the V1/autopilot shape). Every clock
# move in this spec is an INSTANTANEOUS `TimeJump`, so the warp histogram will be
# 1x-only and `warpBuckets` must never be declared here. That is a property of the
# lane's drive shape, not a defect, and the design's "warp schedule" bullet is
# deliberately NOT honoured in this pass (RC-WARP assertions come at arming, on a lane
# whose drive shape can carry them).
# =====================================================================================
tier = "operator"
description = "LIVE-PROVEN AND ARMED on the full three-run discipline: reading 2026-08-18_2336 (PASS attempt 1, 50 s), armed re-flight 2026-08-19_0001 (PASS attempt 1, 51 s, every gated window green), negative control 2026-08-19_0003 (correctly PARSEK-FAIL(save-structure), reverted). The player workflow (arm -> Warp-to -> cross the arrival -> Watch), twice over, on B23's Duna->Ike recording - the suite's first loop subject whose LAUNCH BODY is not Kerbin. Ike is tidally locked to Duna, so Rotation(Duna) 65,517.859 s and Orbital(Ike) 65,517.862 s are equal to 3 ms, 22x inside MissionPeriodicity's 1e-6 relative equality band: the sharpest pre-flight prediction is that the product takes a THIRD road - `method=tidal-collapse` with `zeroDrift=no` and a UNIFORM one-P cadence - distinct from both V4's re-aim and V6M's non-uniform zero-drift schedule. MEASURED: the OUTCOMES held (`zeroDrift=no`, cadence exactly one P) but the MECHANISM did not - `method=single-orbital`, because `ExtractConstraints` emits `constraints=1` with NO Rotation(Duna) at all. An ORBIT-ROOTED recording has no surface phase, so the tidal-collapse branch never gets a second constraint to collapse and phase-lock is EXACT rather than within-tolerance. The predicted anchor held to 0.04 s and the load-time optimizer kept the same-parent crossing cohesive (`exoCoastBodyChangeKept=1`)."
instanceProfile = "stock-minimal"
tags = ["V14", "player-loop", "watch-mode", "loop-playback", "phase-lock", "single-orbital", "ike", "duna", "same-parent", "moon", "flown"]

[fixture]
# The B23-ike-orbit harvest (run 2026-08-18_2308, PASS attempt 1, mission wall 370.5 s,
# --keep-parsek): ONE committed tree f55918af..., ONE recording 05ceee33... (200
# points), zero durable rows. The DD1 starts already parked in Duna orbit, transfers to
# Ike and commits in a 40.5 x 40.4 km Ike park.
#
# WHY THE ONE-RECORDING TOPOLOGY IS THE CONTRACT AND NOT AN ACCIDENT: B23 flight 1
# produced a mechanically green run whose hop was appended to B17's KERBIN-rooted
# committed recording (its seam StartRecording answered `already=true` onto a
# re-resumed committed tree). Flight 2 ran against the Parsek-stripped
# `duna-park-probe` and answered `already=false`, minting this standalone Duna-rooted
# tree. If a future re-harvest reads 2 or 3 recordings here, that defect is back -
# docs/dev/todo-and-known-bugs.md -> SEAM-STARTRECORDING-JOINS-COMMITTED-TREE. The
# payload is pinned byte-for-byte in
# `harness/lib/test_saveparse.py::CommittedFixtureSweepTests.RECORDED_FIXTURES`.
#
# Its PARKED DD1 is the OBSERVER for both watch attempts - the player who watches a
# replay is standing where the flight ended: ORBITING Ike, SMA 170,444.391 m, ecc
# 1.2e-4, inc 11.886 deg. Also in the save, inherited and inert: the stock asteroid
# Ast. VPA-167 on a heliocentric orbit.
saveTemplate       = "fixtures/saves/ike-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, measured on the
  # duna fixture and structural, not fixture-specific): loading a save whose own parked
  # craft is active makes the committed-tree restore path resume a promotion-stub
  # recording ~1 s into the scene, BEFORE any step can run. StopRecording is
  # idempotent-OK and DiscardTree answers OK with nothing-discarded when no plain tree
  # is live, so the pair is safe on any entry state; the SetSetting stops a later one.
  #
  # READ THIS ONE HERE, BECAUSE THIS FIXTURE IS EXACTLY THE SHAPE THAT PROVOKES IT:
  # B23 flight 1 MEASURED the committed-restore path re-arming 11 ms after DiscardTree
  # on a save carrying a committed tree for its own parked craft. The pair kills ONE
  # stub and is not a latch. That does not hurt HERE - this lane starts no recording of
  # its own and only observes - but do not read the pair as a guarantee that no
  # recorder is live afterwards.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins, same rationale as V4/V6M: ghostRenderTracing is the FLIGHT-scene
  # raise gate for the loop-seam-teleport Tier-C instrument; mapRenderTracing arms the
  # map/TS tracer + probe (the source of the `surface=Proto*` truth lines this lane's
  # arrival evidence is read off); verboseLogging is LOAD-BEARING for both (the tracer
  # emits Tier-B truth at Verbose - the V1 lesson).
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # STEP 1 OF THE WORKFLOW: the Missions window loop checkbox (production
  # MissionStore.SetLoopEnabled). Its Info line echoes phaseAnchorUt - THE number the
  # whole bracket arithmetic is anchored to, and the first thing to read when re-pinning.
  { cmd = "MissionConfig", args = { tree = "f55918afd70b45e284006e01729d9e9a", loop = "true" }, expect = "OK" },
  # STEP 2: "Warp to..." -> ComputeNextRelaunchUT -> FastForwardToEventUT, an
  # INSTANTANEOUS Planetarium clock set (no rails warp to budget). CYCLE 1.
  { cmd = "StartLoopPlayback", args = { tree = "f55918afd70b45e284006e01729d9e9a" }, expect = "OK", budget = 300 },
  # CYCLE-1 ARRIVAL BRACKET, strictly forward, straddling the PREDICTED Duna->Ike SOI
  # seam 9,242,998.760 at -180 / -60 / +140 s. Instantaneous, so the seam is CROSSED by
  # the third jump rather than dwelled through. (V6M's offsets were -177.5/-57.5/+142.5
  # about a seam that landed on a round number; these are the same shape rounded to
  # whole seconds against a seam that does not.)
  { cmd = "TimeJump", args = { ut = "9242819" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "9242939" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "9243139" }, expect = "OK", budget = 300 },
  # CYCLE-1 PARK EPOCH: phaseAnchor + 20,000, which is 2,917 s past the seam and inside
  # the recorded Ike phase - the only epoch where the auto-select's body test can pass
  # for an Ike-parked observer, so the only place the watchable-chord question can be
  # asked at all. (V6M used +20,800 into a 21,708 s recording; +20,000 into this
  # 21,211 s one is the same "deep in the destination tail" position.)
  { cmd = "TimeJump", args = { ut = "9245916" }, expect = "OK", budget = 300 },
  # STEP 3: "Watch", auto-select over all committed recordings. PREDICTED REJECTED on
  # the chord arithmetic in header section 4 (2a = 340.9 km against a MEASURED entry
  # boundary of ~120 km); an OK is the finding, not a spec bug.
  { cmd = "EnterWatchMode",                                                  expect = "REJECTED" },
  # STEP 4: "Warp to..." AGAIN - the desync hunt's second half. The verb rebuilds the
  # unit and resolves NextLaunchAfter(now); with `now` past cycle 1's park it should
  # land on CYCLE 2 (predicted A1 + one P = 9,291,433.828).
  { cmd = "StartLoopPlayback", args = { tree = "f55918afd70b45e284006e01729d9e9a" }, expect = "OK", budget = 300 },
  # CYCLE-2 ARRIVAL BRACKET, the same -180 / -60 / +140 offsets about the predicted
  # cycle-2 seam 9,308,516.623. Identical instrument set: whatever differs from cycle 1
  # is the desync signal.
  { cmd = "TimeJump", args = { ut = "9308337" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "9308457" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "9308657" }, expect = "OK", budget = 300 },
  # CYCLE-2 PARK EPOCH: the same +20,000 offset off the cycle-2 anchor.
  { cmd = "TimeJump", args = { ut = "9311434" }, expect = "OK", budget = 300 },
  # STEP 5: "Watch" again. If the tidal-collapse prediction holds the cadence is
  # EXACTLY one Ike orbital period, so - unlike V6M, where the anchor moved by a
  # non-uniform schedule step - the cycle-2 separation should be very close to
  # cycle 1's. Same pinned verdict, and a DIFFERENT verdict between the two watch
  # steps would itself be the reading.
  { cmd = "EnterWatchMode",                                                  expect = "REJECTED" },
  # M-A7 RENDER-COMPOSITION CAPTURE (Phase 3), and the position is the whole argument.
  # The recorder accumulates from Awake, so the manifest is a picture of everything the
  # render pipeline composed since scene entry - which means the ONLY thing placement
  # decides is how much of this lane's observation is already inside it. Here that
  # argument points at exactly one slot: AFTER the cycle-2 watch attempt (so both
  # cycles' arrival brackets, both park epochs and both watch decisions are in the
  # accumulation) and BEFORE FlushAndQuit (so the export is taken at a CHOSEN instant
  # rather than provoked by the scene-exit auto-flush - `hlib`'s own rationale for the
  # verb existing at all, and the flush is a teardown moment whose composition differs
  # from the one the twenty steps above it built). Placing it earlier - say after
  # cycle 1 - would export a manifest with no second cycle in it, and RC-CYCLE cannot
  # compare anything until two cycles are observed.
  # INERT by construction (`hlib.SEAM_VERB_TAIL_ROLE` = inert): it reads the recorder's
  # in-memory accumulation and writes one file in the KSP root, touching no vessel, no
  # save and no Parsek persisted state - so it cannot perturb the two save-structure
  # blocks this lane already gates on.
  { cmd = "ExportRenderManifest",                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# CLAIM-IS-NOT-GATE, and on a reading run the list is short for that reason.
#   D9  `fast-forward`  is gated by the PRODUCT's own `FastForwardToEventUT: jumping to
#       UT=` line (V4/V6M's precedent), NOT by the seam verb's OK - a seam that
#       reported OK without the product jumping fails it.
#   D11 `phase-lock`    is gated by the Info-level `PhaseLock APPLIED: mission=` line.
#       That token is VALUE-FREE and therefore survives EITHER outcome of the
#       tidal-collapse prediction: it fires whenever `solution.ShouldPhaseLock` held,
#       whatever `method=` and `zeroDrift=` then read. If the lock does NOT apply
#       (Support demoted for an orbit-departing mission, say) this reds - which is the
#       correct outcome, because the claim would be false.
#   D14 `ike` / `scene-flight` / `sandbox` are the environment axes this lane runs on.
#
# NOT CLAIMED, DELIBERATELY:
#   D11 `zero-drift-schedule` - V6M's cell, gated there by `zeroDrift=yes` +
#       `scheduleWithinTol=yes`. This lane PREDICTS `zeroDrift=no`, so claiming it
#       would be claiming the opposite of what the run is expected to measure. If the
#       reading run surprises us and a schedule IS built, add the cell AT ARMING with
#       the two tokens, never on speculation.
#   D11 any arrival cell - this OBSERVES an arrival epoch; it asserts no arrival
#       geometry.
#   any watch-mode cell - a measured REFUSAL to enter watch mode is not evidence of
#       watch behaviour (V4's rule).
#   D6 `time-jump`, and `duna` on D14 - the jumps are the instrument rather than the
#       subject, and although the recording's first six ORBIT_SEGMENTs are Duna-framed
#       nothing in THIS spec's contract gates a Duna-framed render. Claim it at arming
#       if the reading shows a gateable Duna token.
[dimensionsCovered]
D9  = ["fast-forward"]
D11 = ["phase-lock"]
D14 = ["ike", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every [expectations.<sub>]
# header or TOML scopes it into the sub-table (hlib.validate_spec rejects that form).
#
# EMPTY, deliberately: the loop-seam-teleport instrument is armed with no budget so a
# raise is REPORTED as the finding it would be rather than pre-budgeted away. That
# instrument is half of the desync hunt.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir, and this fixture ships exactly ONE
# (05ceee33806d4079a1d9d125a1359115.prec). This lane starts no recording of its own -
# it arms, warps, watches and jumps - so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +1  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split. This is the named
#       observation target of the whole V14 pair, so it is worth stating precisely.
#       V6M's fixture reads NINE because `RecordingOptimizer` splits its main
#       recording at load at the UT 212.2 atmospheric->exo boundary. THIS recording
#       has no atmospheric phase at all (it starts in orbit), and its ONE body change
#       is the Duna->Ike seam - where §3 rule 3 of `IsSplittableEnvOrBodyBoundary`
#       keeps a same-class Exo body change COHESIVE for transfer coasts, with the
#       OrbitalCheckpoint-framed variant called out explicitly (an on-rails SOI
#       traversal, which this crossing is: segments 5 and 6 are both rails coast).
#       So the PREDICTION IS NO SPLIT, i.e. a reading of 1.
#       Corroborating evidence, and its limit: the optimizer did NOT split this seam
#       during the PRODUCING run (B23 flight 2, commit time). That is not the same
#       pass - the load-time walk fires for the first time on THIS lane's LoadGame,
#       which is exactly why the window admits 2 rather than pinning 1.
# => the pre-flight window was { min = 1, max = 2 }, a derived range.
#
# MEASURED 1, AND THE PREDICTION'S REASON WAS CONFIRMED RATHER THAN ONLY ITS VALUE.
# Reading run `2026-08-18_2336` counted 1, and the optimizer said WHY in its own words
# at log line 10131:
#   Split summary: rec=05ceee33... evaluated=1 grazeForward=0 grazeBackward=0
#     surfaceGrazeForward=0 surfaceGrazeBackward=0 seamSkipped=0
#     exoCoastBodyChangeKept=1 splittableButRejected=0
# `exoCoastBodyChangeKept=1` is rule 3 firing at the Duna->Ike crossing: the
# LOAD-TIME pass evaluated exactly one boundary and KEPT IT COHESIVE. That is the
# named observation target of the V14 pair, answered, and it is now REQUIRED as a
# token below so the answer cannot silently regress into a split.
# PINNED EXACTLY AT 1: a 2 means the cohesion rule stopped firing (or a promotion stub
# survived the StopRecording/DiscardTree pair), and a 0 means the fixture lost its
# recording. Both are findings, which is what a tight window is for.
count = { min = 1, max = 1 }

[expectations.logContracts]
# THE LIFECYCLE CHAIN (each the product's own line except the two seam-verb Info lines):
#   "missionconfig applied:"       - the arm verb ran; ALSO echoes phaseAnchorUt, the
#                                    single most important number to read when
#                                    re-pinning the brackets.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired, not just
#                                    the seam.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door and
#                                    echoed the resolved relaunchUt (read this per
#                                    cycle).
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line. This is what
#                                    makes the D9 claim GATED rather than asserted.
#   "PhaseLock APPLIED: mission="   - Info, from the builder. Gates D11 `phase-lock`,
#                                    and is deliberately the VALUE-FREE prefix: it
#                                    holds whether the run comes back tidal-collapse
#                                    or something else.
#
# THE ROUTING PINS, ARMED 2026-08-18 OFF THIS LANE'S OWN READING RUN. Every one was
# grepped against `results/2026-08-18_2336_V14M-ike-player-loop_shots/KSP.log` in its
# EXACT regex form before being written here; the match count is quoted per token so a
# future reader can tell a thin pin from a fat one.
#   "Orbital\(Ike\) same-parent"  (4) - the extraction classified the destination as
#       a direct child of the launch body, which is what keeps Support=Supported and
#       makes re-aim structurally unreachable.
#   "support=Supported"            (8) - and it was NOT demoted. Worth pinning for a
#       reason peculiar to this lane: it is the first loop subject that departs from
#       ORBIT, and a future change that stopped modelling an orbit departure as
#       same-parent would surface here first.
#   "PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no"  (4) - ONE
#       regex over ONE line, deliberately, rather than three independent presence
#       checks. It pins the whole routing verdict as a conjunction: the lock APPLIED,
#       it took the SINGLE-CONSTRAINT road, and it built NO zero-drift schedule. Three
#       separate tokens would pass on a log that carried them on three different
#       lines, which is exactly the drift a re-tiered mission could produce. This is
#       the sharpest single line in the file and the one that would have caught the
#       refuted prediction: `zeroDrift=no` alone reads identically under
#       tidal-collapse and single-orbital.
#   "factory chain ... reaimed=False"  (2) - the RENDER-side mode pin, the exact
#       inversion of V5's `reaimed=True`: what the map pipeline assembled is the
#       faithful chain, not a re-aimed one.
# THE ANTI-VACUITY / ARRIVAL PIN:
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Ike"  (2, one per cycle) - a
#       map-render TRUTH line showing the ghost's proto orbit surface REBOUND onto an
#       IKE body frame. A run that never gets the ghost to Ike has measured nothing
#       about an Ike arrival, and reading that as a pass is the V1/V2 vacuity failure.
#       THIS IS THE STRONG FORM V6M ASKED FOR AND COULD NOT AFFORD: that spec pins the
#       weaker `surface=Proto(Icon|OrbitLine) .*body=Mun`, which also matches a
#       ProtoIcon CREATION line, and its own comment says "harden it the next time this
#       lane flies anyway". A fresh lane arming off its first reading run pays nothing
#       for the stronger form, so it starts with it. (The weak form matches 14x here;
#       the strong form 2x - once per cycle, on the body-frame flip
#       `from=[Duna|1932474|0.6323]` at the seam crossing, which is structural.)
# THE COHESION PIN, and it is this lane's headline measurement:
#   "Split summary: rec=\w+ .*exoCoastBodyChangeKept=1"  (1) - the LOAD-TIME optimizer
#       evaluated the Duna->Ike boundary and KEPT IT COHESIVE (§3 rule 3, same-class
#       Exo body change on a transfer coast). See the count block for why this is the
#       named observation target of the V14 pair. Required so the answer cannot
#       silently regress into a split - the recordings count would move too, but the
#       count cannot say WHY and this token can.
# THE PROBE / LENS PRESENCE PINS (V6M's, verbatim, and for V6M's reasons):
#   "faithful-parity summary sampled=\d+ overTolerance=\d+"  (1) - emitted only when
#       the per-pid parity pass touched the lens, so its PRESENCE cannot be produced by
#       a frame with no resolved ghost. `sampled=[1-9]` is NOT pinned: V6M measured
#       `sampled=0 skip.reaimed-or-foreign-seed=1` on a strictly faithful member and
#       the cause is a real blind spot (docs/dev/todo-and-known-bugs.md ->
#       FAITHFUL-PARITY-SEED-FRAGMENT-REBASE). THIS lane measured `sampled=1
#       overTolerance=0` - it does NOT hit that skip - but pinning the count would gate
#       on unresolved behaviour for no coverage gain.
#   "seam-endpoint summary evaluated=[1-9]\d* outsideSoi=\d+"  (1) - and note this is
#       the STRICT form, unlike V6M/V6T which pin `evaluated=\d+`. THIS LANE ACTUALLY
#       REACHES THE LENS: it measured `evaluated=1 outsideSoi=0` at the seam, where all
#       three moon lanes read the structural zero. Pinning `[1-9]` keeps that reach
#       rather than freezing a zero. CAREFUL - the same run ALSO emits a benign
#       `seam-endpoint summary evaluated=0 outsideSoi=0 skip.body-mismatch=1` at a
#       Duna-framed epoch (line 10935); the regex above matches the MEASURING line and
#       ignores the skip-only one, and the skip-only form is deliberately NOT forbidden.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "Orbital\\(Ike\\) same-parent",
  "support=Supported",
  "PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no",
  "factory chain rec=\\w+ idx=\\d+ inst=\\d+ phases=\\d+ reaimed=False",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Ike",
  "Split summary: rec=\\w+ .*exoCoastBodyChangeKept=1",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=[1-9]\\d* outsideSoi=\\d+",
]
# V6M'S FULL SIX, armed 2026-08-18. Every one measured ZERO on the reading run.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE RE-AIM FORBID TRIO - the falsifiable half of the routing claim. Each is a token
  # V4's re-aim lane either requires or guards; here every one of them appearing would
  # mean the same-parent mission took the interplanetary road, which `!phaseLocked`
  # says it cannot. Measured 0 / 0 / 0.
  "\\[ReaimDiag\\]",
  "ENGAGED re-aim",
  "FORCED FAITHFUL",
  # The V3C run-3 self-detection guard, and on a lane whose jump UTs are DERIVED
  # PREDICTIONS this is the single most load-bearing forbid in the file (V6M's words):
  # a refused backward jump is only a WARN, so without this token a mis-pinned bracket
  # can green while dwelling nowhere. Measured 0 - all eight jumps landed forward.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift. Measured `sampled=1 overTolerance=0`.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# ARMED 2026-08-18 (the V2/B17/V4 arming discipline) off this lane's OWN reading run
# `2026-08-18_2336` (PASS attempt 1), whose saveParse REPORT measured rewindPoints=0,
# supersedeRows=0, tombstones=0, rewindRetirements=0 - every declared window already
# met, so the arming re-pinned nothing and moved no verdict. The claim being armed is
# V4/V6M's on a new axis: a pure replay-observation workflow (arm -> warp -> watch ->
# two cycles of forward jumps) must author NOTHING durable, and a future change that
# starts writing an RP / supersede row / tombstone out of it reds here instead of
# passing as a REPORT footnote.
#
# NOTE THIS LANE DECLARED NO SUCH BLOCK BEFORE, which is the one way its arming is not
# a pure `gating` flip: the reading run shipped with neither save-structure block,
# because a report-only block of PREDICTED numbers reads like a measurement. The
# windows below are therefore written FROM the measurement, not flipped onto it.
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# ARMED 2026-08-18, same reading run, which measured trees=1, committedTrees=1,
# recordings=1, terminalStates {Orbiting: 1}. Exactly one committed tree survives the
# workflow: the scene-entry promotion stub never commits, and the
# StopRecording/DiscardTree pair leaves nothing behind.
#
# `trees` keeps V2's max = 2 - the documented duplicate-tree writer hazard (OnSave
# re-writes a still-active tree on ~3% of production saves) - deliberately WIDER than
# the single measurement rather than pinned to it. Everything else is pinned at the
# measured value, and `recordings = {1,1}` is doing double duty here: it is also the
# FIXTURE CONTRACT (see the [fixture] note - a 2 or 3 would mean B23's
# seam-StartRecording defect was back).
#
# NOT armed here: `[expectations.recordings] count`, which is a separate already-gating
# window, and the points facets, which this lane never declared.
gating = true
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1 } }

[expectations.renderComposition]
# M-A7 Phase 3, DECLARED REPORT-ONLY. See header §6 for the full rationale; the two
# facts that matter at the point of reading are:
#
#   1. NO `gating` KEY. The block is declared and NOT armed, so `renderCompose`
#      (verifier row 7c) records its facets and findings into the run JSON and can
#      move NO verdict - `run.py` only writes `verifiers["render_composition_mismatch"]`
#      under `if rc.gating`. `test_no_committed_spec_arms_render_composition_gating`
#      pins that this lane is absent from `RENDERCOMPOSE_ARMED_SPECS`.
#   2. NO ASSERTION KEY, DELIBERATELY. `hlib.validate_spec` accepts a bare declaration
#      and emits an inert-declaration WARNING for it, which is the reading-run state
#      the arming workflow MANDATES (`test_unarmed_assertionless_block_is_a_warning_not_an_error`).
#      A `dwells` / `cycles` / `unevaluable` window written before the first flight
#      would be a PREDICTION read back as a measurement; the windows get authored FROM
#      this lane's first report-only manifest, at arming, in a later pass. That
#      manifest HAS now flown - reading run 2026-08-25_0953, facets in header §6 - and
#      the block is still bare on purpose: authoring the windows is the operator's
#      arming call, not a consequence of the run coming back green.
#
# `warpBuckets` must never be declared on THIS lane whatever the reading shows: every
# clock move here is an instantaneous TimeJump, so RC-WARP's histogram is 1x-only by
# construction (header §6, last paragraph).

[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 8x300 TimeJump + the fast non-deferred verbs
# (2 watch attempts at the 60 s default, 6 settings/recorder verbs) + KSP boot +
# collect. Every jump is an instantaneous clock set, so the ~86 ks of game time costs
# no wall clock; V6M's identical 21-step shape measured 54 s end to end, and THIS
# lane measured 50 s on its reading run.
budgetSeconds = 2400

[retry]
# One retry absorbs an unlucky watch geometry (header §4) or a transient seam flake. It
# does NOT absorb a mis-predicted anchor: that reproduces exactly on attempt 2, which
# is the point - a calibration miss must self-detect, not be retried away.
policy = "once"

[expectedFail]
bugId = ""
