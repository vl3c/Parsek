#   quality: maxEndpointRatio 0.999975253, maxUtStepSeconds 2776.78,
#     holdsAboveOneX 0, seamsAboveOneX 0, no cut ratios, no descent residuals, no
#     hold seconds, maxTangentAngleRad null, maxInteriorGapSeconds null.
#   findings: ONE INFO only - RC-QUAL "max FlexibleSoi endpoint/SOI ratio 0.999975253
