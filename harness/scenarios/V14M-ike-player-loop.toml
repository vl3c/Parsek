# 6. RENDER COMPOSITION (M-A7 Phase 3) - DECLARED REPORT-ONLY, NOTHING GATES
# ---------------------------------------------------------------------------------
# ARMING LEDGER, renderComposition:
#   READING  2026-08-25_0953 PASS attempt 1, wall 68 s, all 22 steps met (both
#            EnterWatchMode REJECTED as pinned, `ExportRenderManifest` OK).
#            renderCompose status=REPORT gating=false armedBlocks=[] mismatches=[] -
#            the row read the manifest and could move no verdict, which is the whole
#            point of a reading run. Facets in "WHAT THE READING RUN MEASURED" below.
#   ARMING DECISION PENDING OPERATOR. The three-run workflow still owes the ARMED
#            re-flight and the NEGATIVE CONTROL; no window is declared off these
#            numbers yet, and the block below stays BARE until an operator takes that
#            call (the same discipline §5's save-structure blocks were armed under).
#
# WHY THIS LANE AT ALL: it is one of the two Phase-3 subjects named by
# `docs/dev/design-autotest-render-composition.md` -> "Harness integration and lanes"
# ("First subjects ... a phase-lock moon loop (V6/V14 class)"), and it is the CHEAPEST
# possible extension of a lane that is already armed on two save-structure blocks: ONE
# `ExportRenderManifest` step plus a BARE `[expectations.renderComposition]`
# declaration. Nothing about the flown shape moves - no jump UT, no budget, no
# expectation - which is the S4.1 rule applied to a lane that is not being armed but
# EXTENDED.
#
# WHAT THE READING RUN MEASURED (run 2026-08-25_0953, every number off
# `verifiers.renderCompose.observed.renderComposition` in the run JSON; these are
# CANDIDATE windows for an arming pass, and not one of them is declared today):
