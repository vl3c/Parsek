# 8. POSTURE - FIRST-RUN READING, NOTHING ARMED, NO D11 CELL
# ---------------------------------------------------------------------------------
# `required` is EIGHT tokens: the four arm/warp/jump plumbing lines that fire on
# ANY road, the two section-5 render pins, and the two lens PRESENCE forms. What is
