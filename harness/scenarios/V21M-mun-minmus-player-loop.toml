# 3. THE SCHEDULE - **EIGHT CALIBRATION SEEDS**, and what they are seeded under
# ---------------------------------------------------------------------------------
# **EVERY UT BELOW IS A SEED. NONE OF THEM IS DERIVED FROM A FLIGHT.** Run 1 is a
# CLOCK READ first and a bracket calibration second; a dwell-nowhere run 1 is the
# ACCEPTED, PRE-REGISTERED outcome, not a lane failure. V17M's run 1 landed its
# cycle-1 bracket **21,967 s** past the real arrival seam and its cycle-2 bracket
# 128 ks past, and that run still carried the measurement the whole pair existed
# for.
#
# ### 3.1 THE CLOCK SHAPE IS PREDICTED, BECAUSE V17M MEASURED IT
#   cadence        = span                        (`LoopTimeUnit.Auto` ->
#                    `max(span, MinCycleDuration)`, `MissionLoopUnitBuilder.cs:251`;
#                    no phase-lock quantization, because phase-lock skips on a
#                    cross-parent tree)
#   overlapCadence = span / `MaxOverlapMissionInstances` = span / 20
#                    (`GhostPlaybackLogic.ComputeEffectiveLaunchCadence`'s
#                    `cadenceFloor = duration / maxCycles` dominating the
#                    `DefaultLoopIntervalSeconds` floor; `ParsekConfig.cs:168`)
#   => the loop SELF-OVERLAPS: twenty concurrent instances launched span/20 apart,
#      and because the divisor is exact, **INSTANCE 21 IS EXACTLY ONE SPAN AFTER
#      INSTANCE 1**. "Cycle 2" is therefore both a full-cycle-later observation and
#      a real relaunch epoch, which is why the table below uses instance 21 rather
#      than instance 2 (consecutive instances would be span/20 apart - far too
#      close together to say anything about recurrence).
#
# ### 3.2 **THE SPAN-END TRAP** - carried from V19M, because it is real and recurs
# The unit's span is **the TRACK_SECTION envelope, NOT the first/last POINT.**
# V17M measured its span start 0.020 s BEFORE the first point and its span end
# **1.060 s PAST** the last point; V19M measured 0.020 s / **1.360 s** on its own
# subject. Anything sized against the POINT span is short by that much at the tail
# end, and the re-pin below MUST read `span=[...]` off the product's own
# `MissionLoopUnit:` line rather than off the harvested sidecar's point list.
# The offsets in 3.4 are measured from **ut0 = the span START**, on that rule.
#
# ### 3.3 THE SEED HYPOTHESIS **S1**: every wait at its EXPECTED value
# **SUPERSEDED BY 3.7 (the 2026-08-24 re-pin). KEPT AS THE PRE-FLIGHT RECORD,
# because which terms S1 got right and which it missed is itself a reading.**
# The fixture `mun-park-kerbalx` sits at UT **21,745.960307940506** and B30 opens
# its recording within a frame of the seam `StartRecording`, so:
#   ut0 (seed)                                            **21,746**
# Then, from the G4 derived number set (sections 3, 5 and 8 there):
#   +  2,735.7  ESCAPE NODE. The node is placed at the park's NEXT PERIAPSIS with
#               `escapeNodeMinLeadSeconds = 300`. The park period is 4,871.395 s
#               and the phase at load is arbitrary, so the wait is uniform on
#               [300, 5,171] and is seeded at its midpoint. **BOX +/- 2,436 s.**
#   + 13,759    ESCAPE COAST, periapsis -> Mun SOI exit. Derived, tight.
#   + 79,785.3  **STAGE-2 TRANSFER WINDOW WAIT** - half the 159,570.670 s
#               Mun-Minmus synodic. **THIS IS THE DOMINANT ERROR TERM: BOX
#               +/- 79,785 s**, and it is uniform rather than peaked, because
#               MechJeb's moon-path `OperationTransfer` takes the NEXT window from
#               wherever the unaimed escape delivered the craft.
#   +267,853.4  TRANSFER LEG - half the period of the a = 29.5 Mm, e = 0.59322
#               transfer ellipse. Derived, tight IF the burn happens at the seeded
#               epoch.
#   + 19,077    ARRIVAL COAST, Minmus SOI entry -> periapsis at a 30 km periapsis.
#               Derived; moves with the delivered periapsis (10 km -> 400 km spans
#               a modest range at Minmus's scale).
#   +    600    PARK TAIL - capture burn + circularization + the commit's own
