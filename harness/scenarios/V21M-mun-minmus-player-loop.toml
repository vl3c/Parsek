#     body changes. **Kerbin -> Minmus** (the arrival) is a rails coast too.
#     `IsSplittableEnvOrBodyBoundary` rule 3 keeps a same-class Exo body change
#     COHESIVE **except** when a PHYSICS-frame burn crosses it, so calling either seam
#     "under thrust" asserts the exception at the exact moment the profile says the
#     rule applies. B26 flight 3 measured BOTH of its seams kept cohesive and B28
#     measured its single escape boundary kept cohesive, so ONE recording is the
#     expectation - but two data points on an escape boundary is not a rule.
#   ~13 ORBIT_SEGMENTs, seeded from B26's measured count on the argument in header
#     section 5 (same phase sequence, same declared correction-trigger count;
#     segments are cut by thrust and SOI crossings, not by elapsed time).
#   CREWED - Jebediah Kerman, Pilot, in the mk1-3pod, on the Poodle upper stage of
#     B11's Kerbal X. The fourth crewed loop subject after B24's, B25's and B26's.
#
# THE SOURCE HAS NO `Ships/VAB`, so B30's harvest drops nothing and this lane needs
# NO `fixtures/shared-ships.toml` row and gets none.
#
# WHY THE PARSEK-STRIPPED DONOR MATTERS TO **THIS** LANE, one step removed: B30
# starts from `mun-park-kerbalx` rather than from `mun-orbit-recorded` precisely so
# its recording is a FRESH STANDALONE TREE and not an append onto a committed one
# (docs/dev/todo-and-known-bugs.md -> SEAM-STARTRECORDING-JOINS-COMMITTED-TREE,
# measured on B23 flight 1). A subject with the wrong topology would make every
# reading below meaningless in a way no verifier here could see.
