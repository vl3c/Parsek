# 7. **NO `EnterWatchMode` STEP, AND THAT IS A DELIBERATE DEPARTURE FROM THE FAMILY**
# ---------------------------------------------------------------------------------
# V6M, V7M, V15M, V16M, V17M and V19M all carry two watch steps. THIS LANE CARRIES
# NONE, because at MINMUS SPECIFICALLY the verdict is a coin flip on an unmeasured
# phase, and a coin-flip `expect` is a driver-INVALID waiting to happen on a run
# whose entire purpose is calibration.
#
# THE EVIDENCE IS V7M's, AND IT IS MEASURED AT THIS EXACT BODY. V7M pinned REJECTED
# at two park epochs and got it (`rdist=144349m`, `rdist=191497m`) - but its
# CALIBRATION run `2026-08-08_1607` walked cycles 3/4/5 and **ALL THREE ENTERED
# WATCH**, the cycle-3 park measuring `anchorDist=51503m zone=Visual`. So both
# verdicts are on the record at Minmus, on the same subject, differing only in
# co-orbital PHASE. The refusing boundary is an OPEN INTERVAL (51.5 km, 144.3 km) -
# `docs/dev/todo-and-known-bugs.md` -> WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE - and
# the term that refuses has never been identified.
#
# THE ARITHMETIC AGREES THAT IT CANNOT BE PINNED. B30 delivers a Minmus park with a
# periapsis in [10,000 m, 800,000 m] about a 60,000 m body, and its requested
# 250,000 m arrival periapsis should deliver 125-175 km at finding-16d's k ~ 0.5-0.7
# - so r ~ 210 km and two co-orbiting objects are at most `2a` = 420 km apart, i.e.
# **BELOW** the 300,000 m `WatchEnterCutoffMeters` gate (`WatchModeController.cs:71`,
# the gate V19M corrected the family onto) for any phase difference under ~91 deg.
# Roughly a fifth of the phase circle is inside the boundary. **THAT IS NOT A
# PREDICTION, IT IS A DIE ROLL** - about a 1-in-3 chance that at least one of two
# pinned steps mismatches and discards the whole reading.
#
# AND NOTHING IS LOST BY DROPPING THEM: the watch question AT MINMUS is already
# measured by V7M in both directions, so this pair is not the lane that would learn
# something new from a third reading of it. A watch step can be ADDED at the arming
# pass, with its verdict derived from the MEASURED park radius and the MEASURED
# separation the reading run's own `anchorDist=` / `rdist=` lines print. The two
# park-epoch jumps STAY - they are the census block's site (section 4) and the
# cycle-2 counterpart sample, and they never needed the watch to earn their place.
#
