# ---------------------------------------------------------------------------------
# 1. THE MEASUREMENT - a REPLICATION, which is a different thing from a discovery
# ---------------------------------------------------------------------------------
# `B26-laythe-vall-transfer` + `V17M`/`V17T` answered M-MIS-7 ONCE, at ONE parent,
# on ONE pair of moons: the classifier is reached, DECLINES on the PARKING-ORBIT /
# MID-COURSE structural check (`Source/Parsek/Reaim/ReaimClassifier.cs:270-277`),
# phase-lock declines too (`support=UnsupportedCrossParent`), and the loop runs
# PLAIN FIXED-CADENCE FAITHFUL - the V9-dres shape.
#
# `docs/dev/research/same-parent-reaim-jool-system.md` section 11.3 states the
# mechanism as a property of the FLIGHT PROFILE rather than of the pair - "THE
# MECHANISM IS THE FLIGHT PROFILE'S, NOT THE PAIR'S". **THAT IS A PREDICTION.**
# G4 exists to convert it into a measurement at a second parent, and this lane is
# the flight-map half of the reading.
#
# THE STRUCTURAL PREDICTION, stated so it can be falsified:
#   * Mun and Minmus are SIBLING moons of Kerbin, so `IsSameParentTarget` is FALSE
#     for a Mun-rooted recording targeting Minmus and the unit should reach
#     `ApplyReaim` exactly as B26's did.
#   * B30 flies the SAME flag-gated PARENT-RELAY mode, which is two-burn BY
#     CONSTRUCTION (escape, coast in the parent frame, then plan the transfer), so
#     the same DIFFERENT-ORBIT common-ancestor segment sits immediately before the
#     transfer run and `sunPredecessor` is TRUE again. The decline should recur.
#   * The re-admitting exception `IsHeliocentricParkingDeparture` needs the
#     pre-transfer parent coast to close >= 1 revolution. At Laythe it missed by
#     15.13% (0.8686 rev of a 49,717.82 s period). **AT KERBIN THE COAST IS A
#     DIFFERENT SHAPE ENTIRELY** - the delivered Kerbin orbit has a of 6.41 to
#     ~30 Mm (G4 numbers section 6), i.e. a period of ~51 ks to ~517 ks, against a
#     stage-2 wait seeded at half the 159,570.7 s synodic. So whether the coast
#     closes a whole revolution here is NOT the same near-miss it was at Laythe;
#     it is genuinely open, and if it CLOSES one, this subject takes the
#     `DepartedFromHeliocentricPark` path and re-aims. **THAT WOULD BE THE FINDING
#     OF THE LANE.**
#
# **NOTHING BELOW GATES ON WHICH ROAD THE UNIT TAKES - AND THAT CLAIM IS NOW TRUE OF
# WHAT `required` ACTUALLY CARRIES, WHICH IT WAS NOT IN THE FIRST CUT.** The re-aim
# trio (`[ReaimDiag]`, `ENGAGED re-aim`, `FORCED FAITHFUL`) is left BOTH unrequired
# AND unforbidden - V17M/V17T/V19M/V19T's posture, and sharper here than anywhere,
# because this lane exists to check whether a measured answer REPLICATES and a lane
# that required the answer would be unable to report a non-replication.
#
# **THE FIRST CUT CONTRADICTED ITS OWN POSTURE INSIDE ITS `required` ARRAY**, and the
# contradiction is fixed rather than argued away. It pinned the
# `fail-closed-to-faithful ...` token, and
# `PhaseFactory.EmitFailClosedDecisionTraceIfEnabled` returns early on
# `if (isReaimedMember) return;` - a re-aimed member is a SUPPORTED producer and is
# never the fail-closed subject, so it never prints that line. If the door this
# section deliberately leaves open ACTUALLY OPENS - re-aim engages at Kerbin, the
# outcome this very section calls **THE FINDING OF THE LANE** - the required token
# CANNOT print and the run reds PARSEK-FAIL(expectation) on the finding. That is a
# lane silently gating on the faithful road. The token is REMOVED from `required` and
# kept as the first line to READ (section 5), to be armed at the arming pass with the
# run that shows it. NO D11 CELL IS CLAIMED for the same reason (section 8).
#
