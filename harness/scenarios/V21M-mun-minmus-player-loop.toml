# CLAIM-IS-NOT-GATE, and this list is short because the thing a loop lane usually
# claims D11 for - the ROUTING - is what this run READS rather than asserts.
#   D9  `fast-forward`  gated by the PRODUCT's own `FastForwardToEventUT: jumping
#       to UT=` line, which fires whichever road the unit took.
#   D14 `minmus` / `scene-flight` / `sandbox` are the environment axes; `minmus` is
#       gated by the `body=Minmus` shadow treatment truth line below rather than by
#       the epoch alone (V14T's iteration-1 lesson), which is what makes it a
#       RENDERED-FRAME claim rather than an EPOCH claim.
#
# NOT CLAIMED, DELIBERATELY:
#   D11 `phase-lock` - under the predicted road that line does not fire for this
#       tree at all, and claiming a cell whose gate is one of two possible outcomes
#       would make the claim a coin flip.
#   D11 `re-aim` / `fail-closed-to-faithful` cells. Claiming either would promote a
#       routing/render-policy token from a READING into a GATE, and the one outcome
#       worth the flight is a NON-replication. **THIS IS NO LONGER ONLY A CLAIM
#       QUESTION**: the `fail-closed-to-faithful` token has ALSO been removed from
#       `required` (section 5), because its emit site returns early on
#       `isReaimedMember` and pinning it gated the lane on the faithful road. Claim
#       the cell AND arm the token at the arming pass, with the run that showed them
#       (the V19M/V19T disposition, and the S1.4 rule).
#   D6 `time-jump`, and `mun` / `kerbin` on D14 - the jumps are the instrument, and
#       nothing in this contract gates a Mun- or Kerbin-framed render even though
#       the recording carries both.
[dimensionsCovered]
D9  = ["fast-forward"]
D14 = ["minmus", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header (hlib.validate_spec rejects a bare one written after).
#
# EMPTY. The loop-seam-teleport instrument is armed with no budget so a raise is
# REPORTED as the finding it would be. TWO KNOWN populations this lane may meet and
# does NOT pre-tolerate: the intermittent `line-blink` V15M's control run swept at a
# cycle-2 park epoch, and - far more likely here - the creation-frame family
# (`icon-off-orbit`, `seam-endpoint-outside-soi`), which V17M measured on a subject
# of EXACTLY this class: after a jump crossing a self-overlap re-arm, all 19 live
# protos reverted from the root frame to the recording's CREATION frame and held it
# through a 40-tick dwell, self-correcting by the next distant epoch (report-only
# under MAPRENDER-ICON-OFF-ORBIT-CREATION-FRAME-AFTER-JUMP). This lane uses a
# STEPPED bracket, the silent control in all three earlier programs, so the
# expectation is silence; a raise is a real reading.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir. The (not yet harvested) fixture is PREDICTED to
# ship ONE, and this lane starts no recording of its own, so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +2  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split at EITHER of the
#       recording's TWO body-change seams - **BOTH ON RAILS** (the Mun->Kerbin escape
#       crossing happens 13,759 s of coast after the periapsis burn, past
#       `soiLeadSeconds` and into native warp; the Kerbin->Minmus arrival is a rails
#       coast). That is the case in which rule 3 keeps a same-class Exo body change
#       cohesive, since no PHYSICS-frame burn crosses either seam. B26 flight 3
#       measured both of its kept cohesive and B28 measured its single escape
#       boundary kept cohesive - two data points on an escape boundary, which is not
#       a rule.
#   +1  ADMITTED: B30's third boundary candidate - the stage-2 transfer burn is an
#       ExoBallistic -> ExoPropulsive -> ExoBallistic sandwich with NO body change,
#       which section-3 rule 6 would split on and rule 7's graze collapse should
#       then SUPPRESS (all three of B30's burns are under 10 s against
#       `BriefSectionMaxSeconds = 120`).
# **AND THE LOAD-TIME WALK FIRES FOR THE FIRST TIME ON THIS LANE'S LoadGame** -
# B30's own run commits and flushes without re-loading - so a split B30's count
# never saw can still show up HERE.
# **WHAT THIS WINDOW COSTS, STATED SO IT IS NOT SILENT: A SPLIT THAT LANDS INSIDE THE
# WINDOW STILL REDS TWO REQUIRED RENDER TOKENS.** If the optimizer splits at either
# body-change seam, each resulting recording sees ONE body, `NestedSoiSubtree` returns
# null on its `distinct.Count < 2` guard, and the fail-closed `bodies=Mun/Kerbin/Minmus`
# form can never print (it is not in `required` any more - section 5 - but it is the
# line the header sends the reader to first, and it would be absent for a REASON worth
# knowing); the surviving `segIdx=\d+` shadow pin shifts with the truncated chain too.
# **THAT COUPLING IS ITSELF THE READING**: a green count with a red render pin says the
# optimizer split a subject the family has twice measured it keeping cohesive, which is
# a bigger finding than the count window it passed through. Do not widen either the
# window or the pins to absorb it.
# => { min = 1, max = 4 }, a DERIVED RANGE matching B30's own window and NOT a pin.
count = { min = 1, max = 4 }

[expectations.logContracts]
# SEVEN TOKENS. The ones a reader will notice missing are missing on purpose (header
# section 8): `PhaseLock APPLIED: mission=` and any `Orbital(...) same-parent`
# classification are BOTH phase-lock-road artifacts, and requiring either would gate
# a REPLICATION reading on the outcome it exists to check. **AND SO IS
# `fail-closed-to-faithful ...`, WHICH THE FIRST CUT OF THIS FILE DID REQUIRE** - see
# the block below the render pins for why that was the same mistake wearing a
# render-policy costume.
#   "missionconfig applied:"       - the arm verb ran, and its Info line is where
#                                    the anchor is echoed. THE most important line
#                                    in the log for this lane's re-pin.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door
#                                    and echoed the resolved relaunchUt (read it per
#                                    cycle; the two should differ by exactly spanDur
#                                    under the predicted clock - header 3.1).
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line, which
#                                    makes the D9 claim GATED. Road-independent.
#   THE ANTI-VACUITY / ARRIVAL PIN IS **ONE TOKEN**, not the two the first cut
#       carried. The single obvious pin (`phase=body-orbit ... body=Minmus`) is not
#       used: V17M's runs 2-4 measured that lens printing NOTHING across a 10.3 s
#       dwell on a subject of this class, and header section 5 states that as the
#       flight-scene, lens-specific measurement it is - explicitly NOT as a
#       consequence of the fail-closed classifier, which `PhaseFactory.cs:122-127`
#       and `MapRenderTrace.cs:99-111` both document as DEFINE-ONLY and
#       GEOMETRY-NEUTRAL, and which does not even execute with tracing off.
#   "shadow .*coverage=InSegment segIdx=\\d+ treatment=StockConic visible=True .*body=Minmus"
#       - the ACTUAL Minmus-frame render truth, on the lens that carries it: the
#       Director's shadow drive resolving a Minmus body frame, VISIBLE. **THE
#       TREATMENT WORD IS MEASURED (run 1), NOT DERIVED**: this subject's Minmus
#       approach is a hyperbola (`sma=-113900 ecc=4.1888`) and `ChainAssembler`
#       assigns it `StockConic`, where V17M's Vall approach drove `TracedPath`. Run 1
#       emitted 238 lines of `segIdx=9 treatment=StockConic visible=True body=Minmus`
#       (all `visible=True`) across `driveUT=302995.468 ... 303325.594`, and ZERO
#       `treatment=TracedPath` lines anywhere in the log - see 3.8. **EPOCH-DEPENDENT,
#       AND THE ONLY THING HERE THAT CATCHES A FORWARD JUMP AT THE WRONG EPOCH**
#       (header 3.5) - which it duly did NOT have to, because the brackets were right.
#       **`segIdx` IS `\\d+` DELIBERATELY**: it indexes the ASSEMBLED RENDER
#       CHAIN (`GhostRenderChain.Segments`, built by `ChainAssembler`), not the
#       recorded ORBIT_SEGMENT list, and the family has measured the mapping moving
#       (V7M segIdx=7 on a 10-phase chain; V17M segIdx=11 on 13 recorded segments
#       with `phases=12`; THIS lane segIdx=9 on 13 recorded segments with
#       `phases=11`). Run 1 shows the "express it as the LAST index (`phases-1`)" rule
#       would ALSO have been wrong here - 9 is not 10 - so if a fixed index is ever
#       re-armed it must come off THIS lane's own measured line and nothing else.
#   NOT REQUIRED, AND THAT IS THE MOST IMPORTANT LINE IN THIS BLOCK:
#       "fail-closed-to-faithful surface=ProtoOrbitLine .*producer=nested-soi provenance=faithful-fallback action=render-recorded-verbatim root=Kerbin .*bodies=Mun/Kerbin/Minmus"
#       - the product DECLARING the render policy for exactly this subject, naming all
#       three bodies. **READ IT FIRST; DO NOT GATE ON IT.**
#       `PhaseFactory.EmitFailClosedDecisionTraceIfEnabled` opens with
#       `if (isReaimedMember) return;`, so the line is FAITHFUL-ROAD-ONLY: if re-aim
#       engages at Kerbin - the door header section 1 leaves open and calls THE
#       FINDING OF THE LANE - the token cannot print and a required copy would red the
#       finding as PARSEK-FAIL(expectation). V17M carries the same token but ARMED IT
#       AFTER measuring `reaimed=False`; that is the S1.4 rule, and it is the
#       disposition to repeat here at the arming pass.
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - the PRESENCE form.
#       `sampled=[1-9]` is NOT pinned (the standing
#       FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and
#       it must stay that way on a first run for TWO reasons. (a) The value is
#       unmeasured at this subject. (b) V16T MEASURED that this lens can raise
#       `outsideSoi=1` from a creation-frame binding artifact rather than from real
#       drift, and the mechanism SCALES WITH THE CADENCE MULTIPLE. Pin presence;
#       read the value.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "shadow .*coverage=InSegment segIdx=\\d+ treatment=StockConic visible=True .*body=Minmus",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, NOT THE FAMILY'S SIX. `[ReaimDiag]`, `ENGAGED re-aim` and `FORCED FAITHFUL`
# are all ABSENT from BOTH lists - V14M/V15M/V16M forbid them because on a
# same-parent subject re-aim is structurally unreachable and its appearance would
# falsify the routing claim; HERE THE ROUTING IS THE THING BEING RE-MEASURED, so
# forbidding those tokens would red the one outcome worth the flight (a
# non-replication) and requiring them would gate on the prediction.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 SELF-DETECTION MARKER, carried for family convention and
  # DELIBERATELY NOT OVERSOLD (V19T corrected the family on this): the verb also
  # calls `SetExecResult("REJECTED", null, "backward-jump")`, so a refused jump makes
  # the STEP go unmet and the run driver-INVALID; this token is a redundant
  # grep-stable echo of that catch. **AND ON THIS LANE IT IS NEARLY INERT**, because
  # every seeded UT sits hundreds of kiloseconds in the future - a span error leaves
  # the jumps forward and nothing refuses. What catches a mis-seeded run here is the
  # epoch-dependent render pin above (header 3.5).
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a defect in the RENDER rather than a reading
  # about the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]
# NOT CARRIED AND COULD NOT FIRE: `created 0 ghost vessel\(s\)`. **THE `ghost
# vessel(s)` SHAPE HAS TWO EMITTERS, NOT ONE**, and the correction is worth making
# before anyone arms this forbid on V21T rather than after:
#   `ParsekTrackingStation.cs:229` - `ParsekTrackingStation initialized: created
#     {created} ghost vessel(s), ...`, the init walk this token is aimed at; and
#   `Patches/GhostTrackingStationPatch.cs:615` - `Pre-created {created} ghost
#     vessel(s) before SpaceTracking.Awake`, from the `SpaceTracking.Awake` Prefix.
# A BARE REGEX WOULD MATCH THE SECOND AS A SUBSTRING of the first's text ("...created
# 0 ghost vessel(s)" is a suffix of "Pre-created 0 ghost vessel(s)"), so a forbid
# written without a leading anchor forbids two different product decisions at once.
# The overlap is latent rather than live today - the Prefix wraps its log in
# `if (created > 0)`, so it cannot currently print the zero form - which is precisely
# the kind of guard that changes without anyone re-reading a spec.
# **THE CONCLUSION SURVIVES**: both emitters are TRACKSTATION-only and this lane never
# leaves FLIGHT, so the token is STRUCTURALLY INERT here and an un-fireable forbid is
# a false assurance, not a cheap one. V21T is where the TS scene makes it live, and
# V21T deliberately does not carry it either, for a DIFFERENT and measured reason (see
# that spec).

[expectations.rewind]
# ARMED 2026-08-24 (the V2/B17/V4/V14-V17/V19 arming discipline) off this lane's
# OWN green reading run `2026-08-24_1704` (PASS attempt 1), whose saveParse
# REPORT measured rewindPoints=0, supersedeRows=0, tombstones=0,
# rewindRetirements=0 - every window below already met, so the arming re-pinned
# nothing and moved no verdict. The claim is the family's on the moon-to-moon
# axis at a SECOND parent: a pure replay-observation workflow must author
# NOTHING durable, across a self-overlapping loop whose re-arms the jumps cross.
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# ARMED 2026-08-24, same reading run (`2026-08-24_1704`), which measured
# trees=1, committedTrees=1, recordings=1, terminalStates {Orbiting: 1},
# branchPoints {}, duplicateRecordingIds [], points 1444/1444/1444 - the
# fixture's own on-disk point count, so the loop replayed without authoring or
# splitting anything, and the payload is byte-identical to the sibling lane's -
# the pair's determinism statement, the V17/V21 shape. `trees` keeps V2's
# max = 2 (the duplicate-tree writer hazard), everything else pinned at the
# measured value.
gating = true
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1 } }

# [expectations.recordings.structure] and the points facets are DELIBERATELY ABSENT
# on a first run: a report-only block of PREDICTED numbers reads like a measurement,
# and this lane's predicted topology is unmeasured (one recording, or up to four -
# see the count block). Author it from run 1's own saveParse facets and arm it there.

[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 8x300 TimeJump + 132 RecordingState ticks
# (three 40-tick blocks plus the 12-tick cycle-2 park dwell, ~33-71 wall s) + the fast
# non-deferred verbs + KSP boot + collect. **151 STEPS**, against V17M's 141.
# THREE ATTRIBUTIONS CORRECTED HERE, because the first cut got all three wrong:
#   * the **61-step / 64 s** end-to-end measurement is **V16M's**, not V17M's - V17M's
#     own runtime block says so in terms ("V16M's identical 61-step shape measured 64 s
#     end to end"), and V17M is 141 steps, so it was never a 61-step lane.
#   * this lane is **151** steps (139 as first committed, plus section 4's 12-tick
#     cycle-2 park dwell), so "identical shape" was wrong in both directions.
#   * the game time traversed is measured from the epoch the run STARTS at - the
#     produced save's own UT, A = 305,660 - to the last jump at 887,437, i.e.
#     **~0.58 Ms**. The larger figure that stood here is measured from ut0 (21,747),
#     which is where the RECORDING starts, not where the LoadGame lands.
# The point survives all three: every jump is an instantaneous clock set, so the game
# time costs no wall clock, and 2400 s is many times the measured envelope of the
# shape.
budgetSeconds = 2400

[retry]
# One retry absorbs a transient seam flake. It does NOT absorb a mis-seeded clock -
# that reproduces exactly on attempt 2, which is the point, and on this lane a
# mis-seeded clock is the LIKELY outcome of run 1 rather than an edge case (header
# section 3). A missed render pin on both attempts is the calibration signal, not a
# failure.
policy = "once"

[expectedFail]
bugId = ""
