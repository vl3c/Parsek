# 2. WHAT IS NEW AT THIS PAIR - named so the readings are ATTRIBUTED, not pooled
# ---------------------------------------------------------------------------------
# (i) **A DIFFERENT PARENT.** That is the replication's whole purpose and needs no
#     further defence. Everything V17M/V17T measured at Jool is re-measured at
#     Kerbin, on a recording produced by the same mode from a different donor.
#
# (ii) **MUN AND MINMUS ARE NOT RESONANT, AND THAT REMOVES THE ONE CONVENIENCE V17
#     HAD.** B26's pair sits in Jool's 1:2:4 chain, which put P_Vall and the
#     Laythe-Vall synodic **0.6615 s** apart - so V17M's two candidate jump tables
#     were IDENTICAL on cycle 1 and 1 s apart on cycle 2, both far inside its
#     -180/-60/+140 bracket, and its pre-flight worry that "no seed set can be
#     right for both roads" was refuted by an accident of the Jool system.
#     **P_Minmus / P_Mun = 7.7513** and synodic / P_Minmus = 0.1481. There is no
#     such accident here. It does not bite in the same place, because this lane's
#     road is predicted rather than unknown (section 1) - but it means NOTHING
#     about the seed table is rescued by a coincidence, and the calibration is
#     genuinely harder than V17's was.
#
# (iii) **THE SEAM MAGNITUDE IS WORSE HERE, NOT BETTER.** The research doc's
#     section 5.2 SOI/SMA table carries **Mun at 20.25%** of its own orbit against
#     Laythe's 13.70%, and **Minmus at 4.78%** against Vall's 5.58%; the two seam
#     gaps are 2.4296 Mm + 2.2474 Mm = 4.677 Mm. Section 5.2's physical objection
#     to re-aiming a moon hop - the splice discontinuity is of order one SOI radius
#     and "does not survive the frame change" - is therefore STRONGER at this pair
#     than at the one where it was first written down. If a guard ever declines on
#     seam magnitude rather than on the structural check, this is the pair where it
#     should show first. It is a reading, not a gate.
#
