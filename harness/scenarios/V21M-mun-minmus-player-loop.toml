# 4. THE FORTY-TICK CENSUS-PACING BLOCK, at the cycle-1 park epoch
# ---------------------------------------------------------------------------------
# V16M's block, unchanged, and PROVEN machinery: its reading run `2026-08-19_2114`
# emitted the `seam-endpoint summary` MEASURING line at BOTH arrivals, 11.502 wall
# seconds apart, against the 5.0 s `ParsekLog.VerboseRateLimited` window that
# swallowed V15M's cycle-2 emission on all three of its runs. Sized against
# `run.py`'s 0.25 s `POLL_INTERVAL_SECONDS` floor (>= 10.0 wall s), not V5's
# measured 0.54 s/tick.
#
# WHAT IT COSTS: ~10-22 wall s and ~10-22 GAME seconds of 1x playback at the
# cycle-1 park epoch, against a SEEDED 600 s parked tail with the epoch 70.7% into
# it - i.e. ~176 s of recorded tail left. **THAT MARGIN IS THE THINNEST ANY LANE
# CARRYING THIS BLOCK HAS HAD** (V17M had ~1,296 s, 60x the block) and it is thin
# because the 600 s tail is a seed rather than a measurement. If the re-pin measures
# a shorter tail, MOVE THE PARK EPOCH EARLIER rather than shrinking the block.
#
# The +140 dwell blocks at both arrival brackets are V17M's, kept for the reason
# V17M's run 3 established: a no-change reading from the on-change proto-line lens
# is only evidence if the lens was given time to change its mind. They are the
# standing guard that a silent census window is dwell-backed truth rather than a
# shut rate-limit window.
#
# ---------------------------------------------------------------------------------
# 5. THE LENS - coverage criterion (a), and **THE PIN V17M SPENT FOUR RUNS LEARNING**
# ---------------------------------------------------------------------------------
# `docs/dev/autotest-roadmap.md` -> "The loop-render coverage program" ->
# "Confirmation criteria" -> **(a)**: a spec must NAME which lens it pins the
# destination frame on, and WHY that lens is the right one FOR ITS SUBJECT'S SHAPE.
#
# **THIS SUBJECT IS NESTED-SOI, AND THAT MAKES ONE OBVIOUS PIN STRUCTURALLY
# UNSATISFIABLE.** Visited bodies are {Mun, Kerbin, Minmus}. `NestedSoiSubtree`
# `.FindNestedRoot` looks for a non-root parent with **>= 2 VISITED CHILDREN**;
# **MUN AND MINMUS ARE SIBLINGS UNDER KERBIN**, so Kerbin supplies exactly that,
# the walk returns a nested root, `FailClosedClassifier` fail-closes, and the proto
# orbit line renders THE WHOLE RECORDED PATH VERBATIM IN THE **ROOT (KERBIN)**
# FRAME. Therefore:
#
#     `phase=body-orbit surface=ProtoOrbitLine ... body=Minmus`
#     **CAN NEVER PRINT ON THIS SUBJECT AND IS NOT PINNED.**
#
# **THE SHARPEST WAY TO SEE WHY V19M COULD USE THAT LENS AND THIS LANE CANNOT:**
# V19M's subject visits {Laythe, Jool} - a chain, with NO SIBLING PAIR anywhere in
# it - so Laythe's parent Jool has ONE visited child and Jool's parent Sun has ONE,
# no candidate clears `count < 2`, the walk returns null, and there is no
# fail-closed render at all. V19M pinned `... body=Jool` and MEASURED it 85 times
# (Jool 44 / Laythe 41). **THE DIFFERENCE IS THE SIBLING RELATION, NOT THE SEAM
# COUNT, AND IT IS EXACTLY THE RELATION THAT MAKES THIS LANE A MOON-TO-MOON LANE.**
# A moon-to-moon subject is nested-SOI BY CONSTRUCTION.
#
# SO THE ANTI-VACUITY PIN IS **V17M's FINAL PAIR, WITH MINMUS SUBSTITUTED**, and
# the two tokens do DIFFERENT jobs:
#
#   (1) `fail-closed-to-faithful surface=ProtoOrbitLine .*producer=nested-soi
#        provenance=faithful-fallback action=render-recorded-verbatim root=Kerbin
#        .*bodies=Mun/Kerbin/Minmus`
#       The product DECLARING the policy for exactly this subject, and NAMING ALL
#       THREE BODIES - so it is also the proof that the render side resolved the
#       full Mun/Kerbin/Minmus chain rather than a truncated one. **IT IS
#       EPOCH-INDEPENDENT**: it fires whenever the proto line renders this
#       recording, so it will fire even on a dwell-nowhere run. It proves the SHAPE
#       and the POLICY; it proves nothing about where the clock was parked.
#       (V17M measured the Jool form of this line 5x on its run 3.)
#
#   (2) `shadow .*coverage=InSegment segIdx=11 treatment=TracedPath visible=True
#        .*body=Minmus`
#       **THE ACTUAL MINMUS-FRAME RENDER TRUTH, ON THE LENS THAT CARRIES IT** - the
#       Director's TracedPath drive walking the Minmus approach segment, VISIBLE in
#       a Minmus body frame. **IT IS EPOCH-DEPENDENT, AND IT IS THEREFORE THE ONLY
#       THING IN THIS FILE THAT CATCHES A FORWARD JUMP AT THE WRONG EPOCH** (3.5).
#       A run that never gets here has measured nothing about a Minmus arrival -
#       the V1/V2 vacuity failure.
#
# **`segIdx=11` IS A CALIBRATION SEED AND IS EXPECTED TO BE WHAT REDS RUN 1.**
# V17M's measured value was **11 of 13** ORBIT_SEGMENTs - the second-to-last index.
# It is seeded VERBATIM here rather than scaled, on the argument that ORBIT_SEGMENT
# boundaries are cut by THRUST EVENTS AND SOI CROSSINGS, not by elapsed time: B30
# flies the same parent-relay phase sequence as B26 with the same TWO declared
# correction-trigger rounds, so a 6.9x longer coast should add NO segments. Two
# things could still move it - the correction rounds actually TAKEN are conditional
# on `maxCorrectionDvMps`, and a Minmus capture that needs a second circularization
# pass adds one. **RE-DERIVE IT FROM THE READING RUN'S OWN SEGMENT CHAIN**: grep the
# collected KSP.log for `[MapRender] shadow ... treatment=TracedPath ...
# body=Minmus` and read `segIdx=` off the lines that print; the harvested sidecar's
# ORBIT_SEGMENT list gives the total. A wrong seed here reds on a missed required
# token with every step green - the SAME pre-registered calibration catch V17M's
# run 1 produced, and it is a spec fact, not a product fact.
#
# ---------------------------------------------------------------------------------
# 6. THE NEGATIVE CONTROL owed by coverage criterion (b) - **OWED, NOT YET FLOWN**
# ---------------------------------------------------------------------------------
# Criterion (b) requires the control to invert a REQUIRED **RENDER** TOKEN. The
# standing shared inversion the V program used before V19 - a temporary
# `rewind.supersedeRows = { min = 1 }` - proves the `saveParse` EVALUATOR can red
# and proves NOTHING about whether the render pins can. V19 is the precedent that
# retired it: V19M inverted `body=Jool` -> `body=Vall` inside its required array
# ONLY (run `2026-08-21_0855`, PARSEK-FAIL(expectation), ONE mismatch naming the
# pin, `saveParse` still PASS and `driverValidity` / `anomalySweep` clean), and
# V19T inverted its own TS proto-ICON token on `2026-08-21_0858`.
#
# **THIS PAIR OWES TWO CONTROLS, NOT ONE SHARED, AND THE REASON IS SHARPER HERE
# THAN IT WAS ON V19.** V19's halves pinned different lenses (proto ORBIT LINE vs
# proto ICON) and one shared inversion would have proven exactly one of them. **THIS
# PAIR'S HALVES PIN DIFFERENT LENSES *AND* DIFFERENT PRODUCERS**: V21M pins the
# nested-SOI FAIL-CLOSED declaration plus the Director TracedPath shadow drive,
# while V21T pins the TRACKING STATION's DYNAMIC OVERLAP-PATH proto ICON. Those do
# not share a code path, a producer, a scene, or a frame convention. One shared
# inversion would prove one of four things at most.
#
# THE DESIGN FOR THIS LANE'S CONTROL, to be CUT OFF THE READING BYTES AT ARMING
# (not now - inverting a token whose measured text does not yet exist would be
# inverting a guess):
#   invert ONE character-run inside `[expectations.logContracts].required`, in the
#   ARRAY ONLY, leaving every COMMENT copy and every step / jump / budget / setting
#   untouched. The candidate is the section-5 token (2)'s `body=Minmus` ->
#   `body=Vall`, chosen because this recording never visits Vall and this lane never
#   enters its SOI, so the inverted token reds precisely because the render never
#   puts this ghost in a Vall body frame - which proves the pin measures the
#   RENDERED BODY FRAME rather than proving the evaluator works.
#   **A CONTROL THAT PASSES IS A FAILED CONTROL** (V19T's `2026-08-21_0857` passed
#   because a mis-escaped regex silently made no edit at all, and had to be re-cut).
#   Revert the spec in the same session and record the revert-confirmation run.
#
