  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  # CYCLE-2 PARK EPOCH: the same +383,634.6 offset off the cycle-2 relaunch. It is
  # the counterpart sample of the cycle-1 park and is READ from the collected log
  # rather than asserted - nothing below pins anything at this epoch.
  { cmd = "TimeJump", args = { ut = "1192195" }, expect = "OK", budget = 300 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# CLAIM-IS-NOT-GATE, and this list is short because the thing a loop lane usually
# claims D11 for - the ROUTING - is what this run READS rather than asserts.
#   D9  `fast-forward`  gated by the PRODUCT's own `FastForwardToEventUT: jumping
#       to UT=` line, which fires whichever road the unit took.
#   D14 `minmus` / `scene-flight` / `sandbox` are the environment axes; `minmus` is
#       gated by the `body=Minmus` shadow/TracedPath truth line below rather than by
#       the epoch alone (V14T's iteration-1 lesson), which is what makes it a
#       RENDERED-FRAME claim rather than an EPOCH claim.
#
# NOT CLAIMED, DELIBERATELY:
#   D11 `phase-lock` - under the predicted road that line does not fire for this
#       tree at all, and claiming a cell whose gate is one of two possible outcomes
#       would make the claim a coin flip.
#   D11 `re-aim` / `fail-closed-to-faithful` cells - **especially the last one**,
#       which this lane's required list carries a token for. Claiming it would
#       promote a routing/render-policy token from a READING into a GATE, and the
#       one outcome worth the flight is a NON-replication. Claim it at the arming
#       pass, with the run that showed it (the V19M/V19T disposition).
#   D6 `time-jump`, and `mun` / `kerbin` on D14 - the jumps are the instrument, and
#       nothing in this contract gates a Mun- or Kerbin-framed render even though
#       the recording carries both.
[dimensionsCovered]
D9  = ["fast-forward"]
D14 = ["minmus", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header (hlib.validate_spec rejects a bare one written after).
#
# EMPTY. The loop-seam-teleport instrument is armed with no budget so a raise is
# REPORTED as the finding it would be. TWO KNOWN populations this lane may meet and
# does NOT pre-tolerate: the intermittent `line-blink` V15M's control run swept at a
# cycle-2 park epoch, and - far more likely here - the creation-frame family
# (`icon-off-orbit`, `seam-endpoint-outside-soi`), which V17M measured on a subject
# of EXACTLY this class: after a jump crossing a self-overlap re-arm, all 19 live
# protos reverted from the root frame to the recording's CREATION frame and held it
# through a 40-tick dwell, self-correcting by the next distant epoch (report-only
# under MAPRENDER-ICON-OFF-ORBIT-CREATION-FRAME-AFTER-JUMP). This lane uses a
# STEPPED bracket, the silent control in all three earlier programs, so the
# expectation is silence; a raise is a real reading.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir. The (not yet harvested) fixture is PREDICTED to
# ship ONE, and this lane starts no recording of its own, so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +2  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split at EITHER of the
#       recording's TWO body-change seams (Mun->Kerbin under thrust, Kerbin->Minmus
#       on rails). B26 flight 3 measured both of its kept cohesive and B28 measured
#       its single escape boundary kept cohesive - two data points on an escape
#       boundary, which is not a rule.
#   +1  ADMITTED: B30's third boundary candidate - the stage-2 transfer burn is an
#       ExoBallistic -> ExoPropulsive -> ExoBallistic sandwich with NO body change,
#       which section-3 rule 6 would split on and rule 7's graze collapse should
#       then SUPPRESS (all three of B30's burns are under 10 s against
#       `BriefSectionMaxSeconds = 120`).
# **AND THE LOAD-TIME WALK FIRES FOR THE FIRST TIME ON THIS LANE'S LoadGame** -
# B30's own run commits and flushes without re-loading - so a split B30's count
# never saw can still show up HERE.
# => { min = 1, max = 4 }, a DERIVED RANGE matching B30's own window and NOT a pin.
count = { min = 1, max = 4 }

[expectations.logContracts]
# EIGHT TOKENS. The two a reader will notice missing are missing on purpose (header
# section 8): `PhaseLock APPLIED: mission=` and any `Orbital(...) same-parent`
# classification are BOTH phase-lock-road artifacts, and requiring either would gate
# a REPLICATION reading on the outcome it exists to check.
#   "missionconfig applied:"       - the arm verb ran, and its Info line is where
#                                    the anchor is echoed. THE most important line
#                                    in the log for this lane's re-pin.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door
#                                    and echoed the resolved relaunchUt (read it per
#                                    cycle; the two should differ by exactly spanDur
#                                    under the predicted clock - header 3.1).
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line, which
#                                    makes the D9 claim GATED. Road-independent.
#   THE ANTI-VACUITY / ARRIVAL PIN IS **TWO TOKENS**, V17M's final pair with Minmus
#       substituted, because the single obvious pin
#       (`phase=body-orbit ... body=Minmus`) is STRUCTURALLY UNSATISFIABLE on this
#       subject - PRODUCT POLICY, not an instrument gap. Mun and Minmus are SIBLINGS
#       under Kerbin, so `NestedSoiSubtree.FindNestedRoot` finds a non-root parent
#       with >= 2 visited children and the proto orbit line fail-closes to a verbatim
#       render in the ROOT (Kerbin) frame. See header section 5, which also says why
#       V19M could pin that lens and this lane cannot.
#   "fail-closed-to-faithful surface=ProtoOrbitLine .*producer=nested-soi provenance=faithful-fallback action=render-recorded-verbatim root=Kerbin .*bodies=Mun/Kerbin/Minmus"
#       - the product DECLARING that policy for exactly this subject. Names all
#       three bodies, so it is also the proof the render side resolved the full
#       Mun/Kerbin/Minmus chain. **EPOCH-INDEPENDENT** - it fires even on a
#       dwell-nowhere run, and proves the SHAPE, not the clock.
#   "shadow .*coverage=InSegment segIdx=11 treatment=TracedPath visible=True .*body=Minmus"
#       - the ACTUAL Minmus-frame render truth, on the lens that carries it: the
#       Director's TracedPath drive walking the Minmus approach segment VISIBLE in a
#       Minmus body frame. **EPOCH-DEPENDENT, AND THE ONLY THING HERE THAT CATCHES A
#       FORWARD JUMP AT THE WRONG EPOCH** (header 3.5). **`segIdx=11` IS A
#       CALIBRATION SEED** carried verbatim from V17M's measured 11-of-13 and
#       expected to be what reds run 1; re-derive it from the reading run's own
#       segment chain (header section 5 gives the grep).
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - the PRESENCE form.
#       `sampled=[1-9]` is NOT pinned (the standing
#       FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and
#       it must stay that way on a first run for TWO reasons. (a) The value is
#       unmeasured at this subject. (b) V16T MEASURED that this lens can raise
#       `outsideSoi=1` from a creation-frame binding artifact rather than from real
#       drift, and the mechanism SCALES WITH THE CADENCE MULTIPLE. Pin presence;
#       read the value.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "fail-closed-to-faithful surface=ProtoOrbitLine .*producer=nested-soi provenance=faithful-fallback action=render-recorded-verbatim root=Kerbin .*bodies=Mun/Kerbin/Minmus",
  "shadow .*coverage=InSegment segIdx=11 treatment=TracedPath visible=True .*body=Minmus",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, NOT THE FAMILY'S SIX. `[ReaimDiag]`, `ENGAGED re-aim` and `FORCED FAITHFUL`
# are all ABSENT from BOTH lists - V14M/V15M/V16M forbid them because on a
# same-parent subject re-aim is structurally unreachable and its appearance would
# falsify the routing claim; HERE THE ROUTING IS THE THING BEING RE-MEASURED, so
# forbidding those tokens would red the one outcome worth the flight (a
# non-replication) and requiring them would gate on the prediction.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 SELF-DETECTION MARKER, carried for family convention and
  # DELIBERATELY NOT OVERSOLD (V19T corrected the family on this): the verb also
  # calls `SetExecResult("REJECTED", null, "backward-jump")`, so a refused jump makes
  # the STEP go unmet and the run driver-INVALID; this token is a redundant
  # grep-stable echo of that catch. **AND ON THIS LANE IT IS NEARLY INERT**, because
  # every seeded UT sits hundreds of kiloseconds in the future - a span error leaves
  # the jumps forward and nothing refuses. What catches a mis-seeded run here is the
  # epoch-dependent render pin above (header 3.5).
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a defect in the RENDER rather than a reading
  # about the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]
# NOT CARRIED AND COULD NOT FIRE: `created 0 ghost vessel\(s\)`. Its only emitter is
# `ParsekTrackingStation` and this lane never leaves FLIGHT, so the token is
# STRUCTURALLY INERT here - an un-fireable forbid is a false assurance, not a cheap
# one. V21T is where the TS scene makes it live, and V21T deliberately does not carry
# it either, for a DIFFERENT and measured reason (see that spec).

[expectations.rewind]
# REPORT-ONLY (the ARMED_ALLOWLIST discipline). The claim is the family's on the
# moon-to-moon axis: a pure replay-observation workflow (arm -> Warp-to -> stepped
# arrival brackets -> dwells -> parks, twice over) must author NOTHING durable,
# across a SELF-OVERLAPPING 20-instance loop whose re-arms the jumps repeatedly
# cross. V4/V6M/V14M/V15M/V16M/V17M/V19M all measured 0/0/0. Arm it at the arming
# pass, off THIS lane's own bytes.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# [expectations.recordings.structure] and the points facets are DELIBERATELY ABSENT
# on a first run: a report-only block of PREDICTED numbers reads like a measurement,
# and this lane's predicted topology is unmeasured (one recording, or up to four -
# see the count block). Author it from run 1's own saveParse facets and arm it there.

[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 8x300 TimeJump + 120 RecordingState ticks
# (three 40-tick blocks, ~30-65 wall s) + the fast non-deferred verbs + KSP boot +
# collect. Every jump is an instantaneous clock set, so the ~1.17 Ms of game time
# this lane traverses costs no wall clock; V17M's identical 61-step shape measured
# 64 s end to end.
budgetSeconds = 2400

[retry]
# One retry absorbs a transient seam flake. It does NOT absorb a mis-seeded clock -
# that reproduces exactly on attempt 2, which is the point, and on this lane a
# mis-seeded clock is the LIKELY outcome of run 1 rather than an edge case (header
# section 3). A missed render pin on both attempts is the calibration signal, not a
# failure.
policy = "once"

[expectedFail]
bugId = ""
