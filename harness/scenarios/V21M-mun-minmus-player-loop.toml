# multiplied above is defined in the wait list as "capture burn + circularization +
# the commit's own dwell" - i.e. it STILL CONTAINS SEGMENTED TIME. Seventy percent of
# THAT lands earlier in the recording than seventy percent of the segment-less tail
# does, possibly inside a conic or inside a burn, where the section-5 render pin
# might not print at all (an above-surface OrbitSegment overlapping the window is
# assigned `StockConic` by `ChainAssembler`, not `TracedPath` - a distinction run 1
# then measured the OTHER way round for this subject; see 3.8(C)). **ONLY THE SEED
