#   [ReaimDiag] mission='Duna Rocket' gatheredSegs=13 transferMemberSegs=0
#     plan.Supported=False reason='no member yields a re-aim transfer'
#
# and phase-lock declined too (10612):
#
#   PhaseLock SKIPPED: mission='Duna Rocket' tree=9aa3c87c... support=
#     UnsupportedCrossParent keeping anchor=28896850.262240175 (today's behavior)
#
# **SO THE M-MIS-7 ANSWER, FOR TODAY'S CODE, IS: PARSEK NEITHER RE-AIMS NOR
# PHASE-LOCKS A MOON-TO-MOON HOP. IT REPLAYS IT FAITHFULLY ON THE RAW CADENCE** -
# the V9-dres shape, now measured for a moon pair. The render side agrees:
# `factory chain rec=625d63e0... phases=12 reaimed=False faithfulFallback=False`.
#
# ### WHERE IT DECLINED, EXACTLY
#
# `Source/Parsek/Reaim/ReaimClassifier.cs:270-277`, the PARTIAL-TRANSFER-DEPARTURE
# check:
#
#     bool sunPredecessor = transferStartIdx - 1 >= 0
#         && segs[transferStartIdx - 1].bodyName == commonAncestor;
#     bool parkingDeparture = sunPredecessor
#         && IsHeliocentricParkingDeparture(...);
#     if (sunPredecessor && !parkingDeparture)
#         return ReaimMissionPlan.Unsupported(launchBody, "transfer departs ...");
#
# (The string says "heliocentric" but the variable is `commonAncestor` - the check
# is frame-generic and here the common ancestor is JOOL. The name is a Sun-era
# artifact, not a Sun-only gate.)
#
# **WHY IT FIRED, AND IT IS OUR OWN FLIGHT PROFILE'S DOING.** The parent-relay
# mode necessarily flies TWO burns: an escape from Laythe, then a coast, then the
# stage-2 transfer burn planned from Jool's frame. That middle coast is a real
# Jool orbit - the fixture's segment 4, **a = 26,056,055 m, ecc 0.0126**,
# 28,823,386.230 -> 28,866,569.726 - and it sits immediately before the transfer
# run on a DIFFERENT orbit, so `sunPredecessor` is TRUE.
#
# **AND THE EXCEPTION MISSED BY 15%, WHICH IS THE SHARPEST PART OF THIS READING.**
# `IsHeliocentricParkingDeparture` would have re-admitted the shape (the s15
# Kerbal X #2 path). Its three conjuncts, evaluated against the fixture's bytes:
#
#     near-circular            ecc 0.0126 <= 0.1                        **PASS**
#     co-orbital with Laythe   |26,056,055 - 27,184,000| / 27,184,000
#                              = 4.15% <= 10%                           **PASS**
#     a CLOSED park (>= 1 rev) T = 2*pi*sqrt(a^3/mu_Jool) = 49,717.82 s
#                              duration 43,183.50 s = **0.8686 rev**
#                              -> wholeRevs = floor(0.8686) = 0         **FAIL**
#
# `ReaimLoiterCompressor.DetectRuns` emits a `LoiterRun` only at `wholeRevs >= 1`,
# so no run is found and the `!found` early return fires - whose own comment names
# exactly this case: *"the Sun predecessor is a sub-period (< 1 rev) MCC arc, not
# a closed park"*. **The coast is 6,534.33 s - 15.13% - short of closing one
# revolution.** Two of three gates passed. This is not a structural impossibility;
# it is a duration miss, and it is worth writing down that precisely, because the
# obvious next question ("could a moon-to-moon hop ever re-aim?") has a much more
# interesting answer than "no".
#
# ### WHAT REMAINS UNTESTED, STATED HONESTLY
#
# The classifier's SUPPORTED path needs `sunPredecessor == false`: the segment
# before the transfer run must be the launch-body SOI exit, i.e. **one single
# ejection burn that leaves Laythe already on the Vall transfer**, with no
# intermediate Jool coast. **NO CURRENTLY FLYABLE PROFILE PRODUCES THAT SHAPE**,
# and the reason is documented rather than assumed:
#   * MechJeb's `OperationInterplanetaryTransfer` is the operation that plans a
#     direct single-burn ejection - and it REFUSES a moon-parked origin
#     (B26 flight 1, deterministic; todo -> MECHJEB-INTERPLANETARY-PLANNER-REJECTS-MOON-ORIGIN).
#   * The parent-relay mode that CAN fly the hop is two-burn BY CONSTRUCTION -
#     escape first, plan the transfer from the parent frame second - so it emits
#     the declined shape every time. It does not aim the escape, and aiming it
#     would need the vessel's and Laythe's state vectors in Jool's frame plus an
#     asymptote solve (the mode's stated v1 limitation).
# So the direct-ejection branch of M-MIS-7 is UNREACHABLE by the harness today,
# and saying otherwise would be a guess.
#
# **THE ONE CHEAP THING THAT WOULD MOVE IT** - recorded as an observation, NOT a
# plan, because nobody has tried it: the parking-departure EXCEPTION needs only
# 6,534 s more coast. A profile that let the post-escape Jool coast close one full
# revolution before the stage-2 burn would satisfy all three conjuncts and take
# the `DepartedFromHeliocentricPark` path. That is a DIFFERENT code path from the
# direct-ejection one - it would answer "does the parking-departure exception work
# in a moon frame", not "does a direct moon-to-moon ejection re-aim" - and whether
# MechJeb's `operation_transfer` can be made to plan one revolution later is
# untested. Do not read this paragraph as a scheduled follow-up.
#
