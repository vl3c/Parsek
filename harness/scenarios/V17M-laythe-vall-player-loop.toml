id = "V17M-laythe-vall-player-loop"
# =====================================================================================
# *** RE-PINNED 2026-08-20 AND FLYABLE. *** This lane was committed AHEAD OF ITS
# SUBJECT with a ZERO tree id and eight CALIBRATION-SEED jump UTs. **THE SUBJECT
# NOW EXISTS.** `B26-laythe-vall-transfer` flight 3 (run 2026-08-20_1752, PASS
# attempt 1, mission wall 1,408 s) flew the first completed moon-to-moon transfer
# in the suite, and its produced save is harvested as
# `fixtures/saves/vall-transfer-recorded`. The tree id and all eight jump UTs are
# now DERIVED FROM THAT FIXTURE'S BYTES (section 3), and the self-retiring
# `SharedShipsManifestTests.PENDING_FIXTURE_LANES` exemption is deleted - it
# fired red first, exactly as designed.
#
# IT TOOK B26 THREE FLIGHTS AND THE STORY MATTERS, because two of them are the
# reason the mode this subject was flown with exists at all: flight 1 refused in
# PLAN-TRANSFER on a MechJeb moon-origin limitation, flight 2 flew the
# PARENT-RELAY mode built in response and proved its core while measuring two
# defects in it, and flight 3 flew both fixes green end to end. See
# docs/dev/todo-and-known-bugs.md -> MECHJEB-INTERPLANETARY-PLANNER-REJECTS-MOON-ORIGIN.
#
# **THE SEEDS WERE WEAKER HERE THAN ON ANY PRIOR PAIR - AND THE CALIBRATION
# TURNED THAT AROUND.** V16M's seeds could be derived because the routing was
# known: a same-parent subject takes the phase-lock road, so the anchor is
# `NextWindow(UT0, P, referenceUT)` and the only unknowns were UTs. **THIS LANE
# STILL DOES NOT KNOW ITS OWN ROUTING** - that IS the measurement (section 1) -
# and the two candidate roads produce
# DIFFERENT anchors from different planners. The table in section 3 is seeded
# under the RE-AIM hypothesis and will move under the other one. Section 3 says so
# at length and gives the re-pin recipe; run 1 is a routing read first and a
# bracket calibration second.
#
# =====================================================================================
#
# V17M: THE FIRST MOON-TO-MOON LOOP SUBJECT, and the lane that finally measures a
# code path the research doc says is live, reachable and untested.
#
# ---------------------------------------------------------------------------------
# 1. THE MEASUREMENT - and it is the ROUTING, not a tolerance
# ---------------------------------------------------------------------------------
# Every loop subject the suite has ever had is SAME-PARENT: the recording's launch
# body is the target's parent (Kerbin->Mun, Kerbin->Minmus, Duna->Ike, Eve->Gilly,
# Jool->Laythe), `IsSameParentTarget` returns true, and the unit builder takes the
# PHASE-LOCK road. V14M, V15M and V16M measured that road three times and it is
# now a well-supported general fact: `constraints=1`, `method=single-orbital`,
# `fixedCadenceResidual=0`, `zeroDrift=no`.
#
# **B26's RECORDING IS THE OTHER CLASS.** Vall is not a child of Laythe, so a
# Laythe-rooted recording targeting Vall is CROSS-PARENT. Per
# `docs/dev/research/same-parent-reaim-jool-system.md` section 2.2 the
# discriminator is `IsSameParentTarget` (NOT the classifier), so this subject
# should route to `ApplyReaim` instead - and section 5.1 walks
# `TrySynthesizeTransfer` guard by guard for exactly this shape:
#
#   * `parent = launchBody.referenceBody; if (parent == null ||
#     targetBody.referenceBody != parent) fail` - for Laythe/Vall this **PASSES**;
#     `parent` resolves to Jool.
#   * `double mu = parent.gravParameter` - a parameter, so Jool's 2.82528e14.
#   * `r1`/`r2` from `launchBody.orbit.getRelativePositionAtUT(...)` - both
#     Jool-relative, same frame by construction.
#   * the conic is built `UpdateFromStateVectors(..., parent, departureUT)`, i.e.
#     Jool-relative.
#   * the plane-tilt correction measures inclination against world +Y, and BOTH
#     moons read 0 about Jool, so `InclinationBoundDegrees` is a no-op here (this
#     is the EASIEST pair in the system for that gate - Pol at 4.25 deg and Bop at
#     15 would be the hard ones).
#   * `IsSaneTransferConic` requires `0 <= e < 1, a > 0`; a Laythe->Vall Hohmann in
#     the Jool frame has `a = 35,168,000` and `e = 0.22702`. **PASSES.**
#   * `ReaimWindowPlanner.Plan` spaces windows on
#     `bodyInfo.OrbitPeriod(LaunchBody)` / `...(TargetBody)`, which for a P3 pair
#     are the JOOL-FRAME periods, giving the moon-moon synodic - **105,961.4 s**
#     for Laythe-Vall, a number section 4.1 already tabulates.
#
# The research doc's own conclusion on that walk: the synthesizer "already works
# in a Jool-centric frame for P3 today, unmodified", which it calls "the single
# most surprising finding in this investigation: Parsek may already be re-aiming
# moon-to-moon hops. It is untested, unmeasured, and unrepresented in any harness
# lane."
#
# **THIS LANE IS THAT LANE.** What it measures is which road a cross-parent
# recording actually takes, and NOTHING BELOW GATES ON EITHER ANSWER.
#
# ---------------------------------------------------------------------------------
# 2. THE TWO HYPOTHESES, AND THE EXACT LINES THAT DISCRIMINATE
# ---------------------------------------------------------------------------------
# Both are written out because a pre-registered pair of alternatives is what makes
# the reading scoreable - the V14 lesson (its tidal-collapse prediction was
# REFUTED, and that refutation was worth more than a confirmation).
#
# **H1 - RE-AIM ENGAGES.** Every guard in section 1 passes, the synthesizer builds
# a Jool-frame Lambert, and the window planner spaces on the 105,961.4 s synodic.
# EXPECTED IN THE LOG:
#     `[ReaimDiag]` lines present (the diagnostic channel; V4/V5/V8 emit them)
#     `ENGAGED re-aim`
#     a `re-aimed transfer ready ... devFromRecorded=<n>s state=<retained|noop>`
#       line, the shape V10/V11A/V13A all pin
#     `factory chain rec=... reaimed=True` - the RENDER-side mode, V5's pin
#     NO `PhaseLock APPLIED` for this tree (or one carrying a re-aim road rather
#       than `single-orbital`)
#     `support=` NOT `Supported` for a cross-parent extraction, or no extraction
#       line at all
#
# **H2 - A GUARD DECLINES AND THE CHAIN FALLS BACK TO FAITHFUL.** Candidates, in
# the order the walk makes them plausible:
#     the SEAM MAGNITUDE. Section 5.2 is the physical objection: re-aim splices a
#       centre-to-centre Lambert onto recorded escape/capture legs that end at the
#       SOI SHELL, so the discontinuity is of order one SOI radius. That is 0.23%
#       of the orbit at Duna and **13.70% at Laythe / 5.58% at Vall** - the seam
#       term "does not survive the frame change". If anything declines, this is
#       the most likely reason, and it is a PHYSICAL objection that the mechanical
#       guards in section 1 do not encode.
#     `IsSaneTransferConic` on a degenerate solve, or the tilt gate on a solved
#       plane that (per V13A's four-point finding) is UNCORRELATED with the
#       target's inclination and so cannot be predicted from Vall's 0 deg.
#     a support demotion upstream of the synthesizer.
# EXPECTED IN THE LOG:
#     `FORCED FAITHFUL`, and/or a `[ReaimDiag]` line carrying a decline reason
#     `factory chain rec=... reaimed=False`
#
# **THE SINGLE SHARPEST DISCRIMINATOR** is `factory chain ... reaimed=True|False`:
# one token, one line, and it is the RENDER-side truth rather than a planner
# intention. Read it first; read `[ReaimDiag]` for why.
#
# **NOTHING RE-AIM IS REQUIRED OR FORBIDDEN BELOW.** V14M, V15M and V16M all
# FORBID the re-aim trio, because on a same-parent subject re-aim is structurally
# unreachable and its appearance would falsify the routing claim. HERE THE OPPOSITE
# HOLDS: re-aim is the thing that might legitimately happen, so forbidding those
# tokens would red the interesting outcome and requiring them would gate on a
# prediction. They are left OUT of both lists, deliberately, and that asymmetry is
# the whole reason this lane's posture differs from its three predecessors'.
#
# ---------------------------------------------------------------------------------
# 3. THE SCHEDULE - RE-PINNED OFF THE HARVESTED BYTES (2026-08-20)
# ---------------------------------------------------------------------------------
# **THE PRE-FLIGHT WORRY IS REFUTED, AND THAT IS THE FIRST THING TO READ.** This
# block used to say "the two hypotheses give DIFFERENT anchors, and no seed set
# can be right for both". Measured against the real fixture, THAT IS FALSE AT
# THIS PAIR - and for the same 1:2:4 resonance that made Laythe->Vall the right
# first moon-to-moon subject:
#
#     P_Vall  = 105,962.090 s        (Vall's period about Jool)
#     synodic = 105,961.428 s        (the Laythe-Vall synodic)
#     difference = **0.6615 s**
#
# H1 anchors on the synodic and H2 on `NextWindow(UT0, P_Vall, referenceUT)`, so
# the two candidate anchors sit 0.662 s apart, cycle 2 sits 1.323 s apart, and
# THE TWO JUMP TABLES ARE IDENTICAL ON CYCLE 1 AND DIFFER BY ONE SECOND ON
# CYCLE 2. Both are far inside the -180 / -60 / +140 bracket. So the committed
# table is authored under H1 as planned, the H2 table is printed below as the
# re-pin, and either road lands the brackets on the seam.
#
# **THIS DOES NOT WEAKEN THE MEASUREMENT.** The routing is still read from the
# LOG LINES (`[ReaimDiag]` / `ENGAGED re-aim` / `factory chain ... reaimed=`),
# not from whether the jumps happened to land - and both hypotheses stay
# unrequired and unforbidden. What it removes is the risk that a mis-seeded
# bracket dwells nowhere and the reading run measures nothing.
#
# THE INPUTS, ALL READ FROM `fixtures/saves/vall-transfer-recorded` (B26 flight
# 3, run 2026-08-20_1752, PASS attempt 1):
#   UT0        = **28,817,026.617051531**  the recording's `explicitStartUT`.
#                THE V6M CONVENTION MATTERS HERE AS ALWAYS: segment 0's startUT
#                is 28,817,029.317051470, a **2.700 s** gap, and anchoring on it
#                would put every bracket 2.7 s off.
#   span       = **79,819.425188738 s**    `explicitEndUT - explicitStartUT`
#                (explicitEndUT 28,896,846.042240269). The pre-flight SEED was
#                96,874.9 with a declared band of 43,874.9 -> 149,836.3; the real
#                span lands in the LOW half of it, because the relay's escape
#                places its OWN node at the next park periapsis and therefore
#                spends NO transfer-window wait at all - the free variable the
#                band was built around never opened.
#   ESCAPE seam= **28,823,386.230090793**  Laythe->Jool, offset **6,359.613 s**.
#                SEED was UT0 + 53,470; the real offset is 8.4x smaller, same
#                reason as the span.
#   ARRIVAL seam=**28,892,466.219888370**  Jool->Vall, offset **75,439.603 s**.
#                SEED was UT0 + 92,449.9.
#   dest phase = **4,379.822 s**           (span - arrival offset). SEED 4,425 -
#                the one pre-flight number that was nearly right.
#   THIRTEEN ORBIT_SEGMENTs, Laythe 0-3, Jool 4-9, Vall 10-12.
#
# THE PARK EPOCH IS BASED ON THE TAIL, NOT THE PHASE - the prediction in the
# pre-flight text ("B26's capture burn is ~49 s ... the recording is not expected
# to end with a long segment-less tail") was WRONG, and the fixture says so:
# Vall segments 10-12 are ALL the APPROACH HYPERBOLA (sma -2,733,908.68, ecc
# 1.1715) and the last one ends at 28,896,012.542259, leaving an **833.500 s
# SEGMENT-LESS PARKED TAIL** to explicitEndUT. That is B25/V16M's shape exactly.
# Applying V14M's 70.7% to the whole 4,379.822 s phase would land the epoch on
# the INBOUND hyperbola, which is not what "the park epoch" means on any lane.
# So, V16M's rule:
#     park offset = arrival offset + inbound leg + 0.707 * parked tail
#                 = 75,439.603 + 3,546.322 + 0.707 * 833.500
#                 = **79,575.210 s**
#
# THE ARITHMETIC, H1 (AUTHORED):
#   anchor  = UT0 + synodic = **28,922,988.045**
#   cadence = synodic       = **105,961.428**
#
# THE ARITHMETIC, H2 (THE RE-PIN, if the reading run measures FORCED FAITHFUL):
#   referenceUT = max(save clock 28,896,848.582240213, spanEnd 28,896,846.042240269)
#               = 28,896,848.582240213
#   k_a         = ceil((referenceUT - UT0)/P_Vall - 1e-9) = ceil(0.753307) = **1**
#   anchor      = UT0 + 1 * P_Vall = **28,922,988.707**   (+0.662 s vs H1)
#   cadence     = smallest multiple of P_Vall >= span = 1 * P_Vall
#               = **105,962.090**                        (+0.662 s vs H1)
#
# THE JUMP TABLE (rounded to whole seconds, the V14M/V15M/V16M convention). All
# eight bracket the **ARRIVAL** seam; the escape seam is deliberately not
# bracketed, because one lane cannot read two seams at two cycles without a step
# list nobody can follow - and the arrival is where the census lens looks.
#
# The LEFT value on each line is the AUTHORED H1 figure (what `steps` carries);
# the parenthesised one is the H2 re-pin.
#   cycle-1 anchor       = 28,922,988.045   (H2: 28,922,988.707)
#   cycle-1 arrival seam = 28,998,427.648   (H2: 28,998,428.310)
#     bracket -180 / -60 / +140  -> 28998248 / 28998368 / 28998568
#     ... and under H2 those three round to the SAME whole seconds: IDENTICAL.
#   cycle-1 park (anchor + 79,575.210)  -> 29002563   (H2: 29002564)
#   cycle-2 anchor       = 29,028,949.473   (H2: 29,028,950.796)
#   cycle-2 arrival seam = 29,104,389.076   (H2: 29,104,390.399)
#     bracket -180 / -60 / +140  -> 29104209 / 29104329 / 29104529
#     ... under H2: 29104210 / 29104330 / 29104530, i.e. +1 s each.
#   cycle-2 park                        -> 29108525   (H2: 29108526)
#
# ONLY FOUR OF THE EIGHT MOVE UNDER H2, AND ONLY BY ONE SECOND. If the reading
# run measures H2, substituting the right-hand column is the whole re-pin; if it
# measures H1 nothing moves. Either way the SHAPE to keep is "cadence = one
# Vall-period-or-synodic", which the two roads agree on to 0.0006%.
# ---------------------------------------------------------------------------------
# 4. THE CENSUS-PACING BLOCK IS CARRIED FORWARD, AND IT IS NOW PROVEN MACHINERY
# ---------------------------------------------------------------------------------
# The forty-tick `RecordingState` dwell block between the cycle-1 park epoch and
# the cycle-2 re-arm is V16M's, unchanged, and it is here because V16M MEASURED
# that it works: its reading run `2026-08-19_2114` emitted the `seam-endpoint
# summary` MEASURING line at BOTH arrivals, 11.502 wall-seconds apart, against the
# 5.0 s `ParsekLog.VerboseRateLimited` window that swallowed V15M's cycle-2
# emission on all three of its runs. Research doc section 9.3's RECOURSE 1 is no
# longer a proposal.
#
# WHAT IT COSTS HERE: ~10-22 wall s (sized against `run.py`'s 0.25 s
# `POLL_INTERVAL_SECONDS` floor, not V5's measured 0.54 s/tick) and ~22 GAME
# seconds of 1x playback at the cycle-1 park epoch. The destination phase is
# predicted ~4,425 s with the park epoch 70.7% into it, leaving ~1,296 s of
# recorded tail - 60x the block. Comfortable, and the most comfortable margin any
# lane carrying this block has had.
#
# WHAT IT MIGHT BUY THAT V16M's COULD NOT: this recording has **TWO** cross-body
# seams, so the census has two candidate endpoints per cycle rather than one.
# Whether the lens evaluates one, both, or neither is a reading in its own right.
# Nothing below pins a count.
#
# ---------------------------------------------------------------------------------
# 5. THE WATCH PREDICTION - REJECTED, and the arithmetic is Vall's
# ---------------------------------------------------------------------------------
# The observer is the fixture's own parked craft at Vall. B26's park window admits
# a periapsis in [20,000 m, 600,000 m] about a 300,000 m body, so two co-orbiting
# objects are at most `2a` apart:
#   SMALLEST admissible park  2a = 2 * (300,000 + 20,000)  =   640,000 m
#   LARGEST                   2a = 2 * (300,000 + 600,000) = 1,800,000 m
# Even the smallest is **5.3x** the 120,000 m `GhostVisualRangeMeters` boundary
# that drives the measured refusals (docs/dev/todo-and-known-bugs.md ->
# WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE, the open interval (51.5 km, 144.3 km)),
# so REJECTED is pinned - park-independent across the whole admissible window, as
# on V16M.
#
# **AND READ V16M's RESULT BEFORE READING TOO MUCH INTO THAT.** Its two watch
# steps were also pinned REJECTED and also came back REJECTED - but with
# `reason=no-watchable-ghost`, not a range refusal, with the adjacent engine line
# reading `retired=F zone=Beyond rdist=616131735m`. So the chord arithmetic above
# is UNTESTED at Jool-system scale, and this lane's pinned verdict may well be met
# for the same unpredicted reason. A REJECTED here confirms very little; an OK
# would be the finding.
#
# ---------------------------------------------------------------------------------
# 6. POSTURE - FIRST-RUN READING, AND DELIBERATELY THE THINNEST OF THE FAMILY
# ---------------------------------------------------------------------------------
# `required` is SEVEN tokens, not V16M's nine, and the two that are missing are
# missing on purpose: `PhaseLock APPLIED: mission=` and `Orbital\(...\)
# same-parent` are BOTH phase-lock-road artifacts, and requiring either would gate
# this reading run on H2. What is required is only what must hold under EITHER
# road: the arm/warp lifecycle, the product's own jump line, the ghost reaching a
# Vall-framed map surface, and the two lens PRESENCE forms.
#
# `forbidden` is THREE, not the family's six: the re-aim trio is REMOVED (section
# 2) and what remains is the ERROR floor, the backward-jump self-detection guard -
# which matters more here than anywhere, given how provisional the seeds are - and
# the parity over-tolerance pin. A fourth, `created 0 ghost vessel\(s\)`, was
# dropped as STRUCTURALLY INERT: the only emitter of that line is
# `ParsekTrackingStation`, and this lane never leaves FLIGHT, so the token could
# not fire on any outcome. An un-fireable forbid is a false assurance, not a
# cheap one. V17T keeps it, where the TS scene makes it live.
#
# `[expectations.rewind]` is REPORT-ONLY and `[expectations.recordings.structure]`
# is ABSENT. Author them from run 1's saveParse facets.
# =====================================================================================
tier = "operator"
description = "FLYABLE AT LAST - THE SUBJECT EXISTS AND THIS LANE IS RE-PINNED OFF ITS REAL BYTES, first reading run pending. It took B26 three flights across two mission shapes: flight 1 (2026-08-19) refused in PLAN-TRANSFER on a MechJeb moon-origin limitation (docs/dev/todo-and-known-bugs.md -> MECHJEB-INTERPLANETARY-PLANNER-REJECTS-MOON-ORIGIN); flight 2 (2026-08-20) flew the PARENT-RELAY mode built for it, proved its core (the whole two-stage phase flow, `escapedHomeSoi met=True`) and measured two defects of its own; flight 3 (run 2026-08-20_1752, PASS attempt 1, mission wall 1,408 s) flew both fixes green end to end through ORBIT-COMMITTED and produced `vall-transfer-recorded` - THE SUITE'S FIRST COMPLETED MOON-TO-MOON TRANSFER. The `PENDING_FIXTURE_LANES` exemption is retired. EVERY JUMP UT BELOW IS NOW DERIVED FROM THE HARVESTED BYTES rather than seeded: UT0 = the recording's explicitStartUT 28,817,026.617051531, span 79,819.425188738 s, TWO body-change seams (Laythe->Jool at 28,823,386.230090793, Jool->Vall at 28,892,466.219888370), and a park epoch re-based on the 833.500 s SEGMENT-LESS PARKED TAIL because the three Vall segments are all the approach hyperbola - the B25/V16M shape, which this spec's pre-flight text predicted would NOT happen. AND THE PRE-FLIGHT WORRY IS REFUTED: this header used to say no seed set could be right for both roads, but at this pair the 1:2:4 resonance puts P_Vall and the Laythe-Vall synodic 0.6615 s apart, so H1's and H2's jump tables are IDENTICAL on cycle 1 and 1 s apart on cycle 2 - both far inside the -180/-60/+140 bracket. The table is authored under H1 with the H2 re-pin printed beside it. NONE OF THAT TOUCHES THE MEASUREMENT: the routing is read from the log lines, both hypotheses stay pre-registered, and this lane gates on neither. Committed AHEAD of its subject with a ZERO tree id and eight CALIBRATION-SEED jump UTs, tracked by the self-retiring SharedShipsManifestTests.PENDING_FIXTURE_LANES exemption. THE FIRST MOON-TO-MOON LOOP SUBJECT, and the lane that measures a code path the research doc says is live and untested. Every loop subject so far is SAME-PARENT and takes the phase-lock road (measured three times: `constraints=1`, `method=single-orbital`, residual 0). B26's recording is the OTHER class - Vall is not a child of Laythe, so it is CROSS-PARENT and `MissionConfig loop=true` should reach `ApplyReaim` with the JOOL-frame synodic. `docs/dev/research/same-parent-reaim-jool-system.md` section 5.1 walks `TrySynthesizeTransfer` guard by guard for exactly this shape - the parent gate passes (both resolve to Jool), mu is a parameter, r1/r2 are Jool-relative, the tilt gate is a no-op (both moons inc 0), `IsSaneTransferConic` passes on a=35,168,000 e=0.22702 - and concludes it 'already works in a Jool-centric frame for P3 today, unmodified', calling that 'the single most surprising finding in this investigation'. THIS SPEC GATES ON NEITHER OUTCOME. Both hypotheses are written out with the exact discriminating lines (H1 re-aim engages: `[ReaimDiag]`, `ENGAGED re-aim`, `re-aimed transfer ready`, `factory chain ... reaimed=True`; H2 a guard declines - most plausibly the section-5.2 SEAM MAGNITUDE, which is 0.23% of the orbit at Duna but 13.70% at Laythe: `FORCED FAITHFUL`, `reaimed=False`), and the re-aim trio is left BOTH unrequired AND unforbidden - the exact inversion of V14M/V15M/V16M, which forbid it because on a same-parent subject re-aim is structurally unreachable. THE SEEDS ARE WEAKER THAN ANY PRIOR PAIR'S ON PURPOSE: the anchor formula that served V14M/V15M/V16M is a phase-lock artifact and does not apply under H1, so the table is seeded under H1 at a one-synodic (105,961.4 s = 2.0000 Laythe periods) anchor and WILL move under H2. Run 1 is a routing read first and a bracket calibration second; a dwell-nowhere run 1 is an accepted outcome, not a lane failure. Carries V16M's now-PROVEN forty-tick census-pacing block (it measured both cycles 11.502 wall-s apart where V15M's three runs printed one), with the new question of what the lens does with a recording that has TWO cross-body seams rather than one."
instanceProfile = "stock-minimal"
tags = ["V17", "player-loop", "watch-mode", "loop-playback", "re-aim", "cross-parent",
        "moon-to-moon", "vall", "laythe", "jool", "jool-moon", "census-pacing"]

[fixture]
# *** IT EXISTS. *** `vall-transfer-recorded` is the `--keep-parsek` harvest of
# `B26-laythe-vall-transfer` flight 3's produced save (run 2026-08-20_1752, PASS
# attempt 1). The `PENDING_FIXTURE_LANES` exemption that let this spec be
# committed ahead of it is deleted, and the fixture's payload is pinned in
# `test_saveparse.RECORDED_FIXTURES` so a drift reds there rather than here.
#
# WHAT IT CARRIES, **MEASURED** rather than predicted: ONE tree
# (`9aa3c87c95a147388e6220bd36796fd9`), ONE committed recording
# (`625d63e022c449d6a44b5269c8b54a21`, 746 points, 13 ORBIT_SEGMENTs), zero
# supersede / tombstone / rewind rows, terminal Orbiting at Vall. The count
# prediction below was right at 1 - the optimizer kept BOTH body-change
# boundaries cohesive.
#
# The pre-flight text follows, kept because its uncertainty was real: ONE
# committed tree, ONE recording (the stack flies the whole hop as one piece),
# zero durable rows, terminal Orbiting at Vall - **but with more topological
# uncertainty than
# any predecessor**. B26's recording has TWO body-change seams (Laythe->Jool and
# Jool->Vall), and section-3 rule 3 of `IsSplittableEnvOrBodyBoundary` keeps a
# same-class Exo body change cohesive on a transfer COAST; whether an ESCAPE
# boundary under thrust qualifies is exactly what nobody has measured. B26's own
# count window is `{1, 3}` for that reason and this lane's matches it.
#
# WHY THE ONE-RECORDING TOPOLOGY MATTERS ANYWAY: B23 flight 1 produced a
# mechanically green run whose hop was APPENDED to another tree's committed
# recording. B26 avoids that by pointing at the Parsek-stripped `laythe-park-nerv`.
# See docs/dev/todo-and-known-bugs.md -> SEAM-STARTRECORDING-JOINS-COMMITTED-TREE.
#
# Its PARKED stage at Vall will be the OBSERVER for both watch attempts. THE
# SUBJECT IS CREWED (Valentina Kerman in the mk1pod.v2), the third crewed loop
# subject after B24's and B25's.
saveTemplate       = "fixtures/saves/vall-transfer-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, measured and
  # structural). StopRecording is idempotent-OK and DiscardTree answers OK with
  # nothing-discarded when no plain tree is live; the SetSetting stops a later one.
  # Do NOT read the pair as a latch (B23 flight 1 measured a re-arm 11 ms after
  # DiscardTree on this fixture's shape) - it does not hurt here, because this lane
  # starts no recording of its own and only observes.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins: ghostRenderTracing is the FLIGHT-scene raise gate for the
  # loop-seam-teleport Tier-C instrument; mapRenderTracing arms the map/TS tracer +
