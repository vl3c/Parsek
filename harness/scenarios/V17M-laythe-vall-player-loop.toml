# 1. THE MEASUREMENT - and it is the ROUTING, not a tolerance
# ---------------------------------------------------------------------------------
# Every loop subject the suite has ever had is SAME-PARENT: the recording's launch
# body is the target's parent (Kerbin->Mun, Kerbin->Minmus, Duna->Ike, Eve->Gilly,
# Jool->Laythe), `IsSameParentTarget` returns true, and the unit builder takes the
# PHASE-LOCK road. V14M, V15M and V16M measured that road three times and it is
# now a well-supported general fact: `constraints=1`, `method=single-orbital`,
# `fixedCadenceResidual=0`, `zeroDrift=no`.
#
# **B26's RECORDING IS THE OTHER CLASS.** Vall is not a child of Laythe, so a
# Laythe-rooted recording targeting Vall is CROSS-PARENT. Per
# `docs/dev/research/same-parent-reaim-jool-system.md` section 2.2 the
# discriminator is `IsSameParentTarget` (NOT the classifier), so this subject
# should route to `ApplyReaim` instead - and section 5.1 walks
# `TrySynthesizeTransfer` guard by guard for exactly this shape:
#
#   * `parent = launchBody.referenceBody; if (parent == null ||
#     targetBody.referenceBody != parent) fail` - for Laythe/Vall this **PASSES**;
#     `parent` resolves to Jool.
#   * `double mu = parent.gravParameter` - a parameter, so Jool's 2.82528e14.
#   * `r1`/`r2` from `launchBody.orbit.getRelativePositionAtUT(...)` - both
#     Jool-relative, same frame by construction.
#   * the conic is built `UpdateFromStateVectors(..., parent, departureUT)`, i.e.
#     Jool-relative.
#   * the plane-tilt correction measures inclination against world +Y, and BOTH
#     moons read 0 about Jool, so `InclinationBoundDegrees` is a no-op here (this
#     is the EASIEST pair in the system for that gate - Pol at 4.25 deg and Bop at
#     15 would be the hard ones).
#   * `IsSaneTransferConic` requires `0 <= e < 1, a > 0`; a Laythe->Vall Hohmann in
#     the Jool frame has `a = 35,168,000` and `e = 0.22702`. **PASSES.**
#   * `ReaimWindowPlanner.Plan` spaces windows on
#     `bodyInfo.OrbitPeriod(LaunchBody)` / `...(TargetBody)`, which for a P3 pair
#     are the JOOL-FRAME periods, giving the moon-moon synodic - **105,961.4 s**
#     for Laythe-Vall, a number section 4.1 already tabulates.
#
# The research doc's own conclusion on that walk: the synthesizer "already works
# in a Jool-centric frame for P3 today, unmodified", which it calls "the single
# most surprising finding in this investigation: Parsek may already be re-aiming
# moon-to-moon hops. It is untested, unmeasured, and unrepresented in any harness
# lane."
#
# **THIS LANE IS THAT LANE, AND IT HAS NOW READ THE ANSWER** - see section 0. The
# guard walk above is kept VERBATIM and unedited, because every step of it was
# right: the classifier WAS reached, the single-hop guard did NOT fire, and
# `IsSaneTransferConic` was never the problem. What the walk did not model is the
# structural check on what comes IMMEDIATELY BEFORE the transfer run, which is
# where the decline actually happened. NOTHING BELOW GATES ON THE ANSWER.
#
