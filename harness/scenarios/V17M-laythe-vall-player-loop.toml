# CLAIM-IS-NOT-GATE, and this list is the SHORTEST of the family because the
# routing - the thing a loop lane usually claims D11 for - is what this run
# MEASURES rather than asserts.
#   D9  `fast-forward`  gated by the PRODUCT's own `FastForwardToEventUT: jumping
#       to UT=` line, which fires whichever road the unit took.
#   D14 `vall` / `scene-flight` / `sandbox` are the environment axes; `vall` is
#       gated by the `body=Vall` map-render truth line below rather than by the
#       epoch alone (V14T's iteration-1 lesson).
#
# NOT CLAIMED, DELIBERATELY:
#   D11 `phase-lock` - V14M/V15M/V16M all claim it, gated by `PhaseLock APPLIED:
#       mission=`. **THIS LANE MUST NOT**, because under H1 that line does not
#       fire for this tree at all, and claiming a cell whose gate is one of two
#       possible outcomes would make the claim a coin flip. If run 1 measures H2,
#       the cell can be claimed at the arming pass with the token that showed it.
#   D11 `re-aim` cells - the mirror of the same argument, under H1 rather than H2.
#       Whichever road it takes, the cell is claimed AFTER the measurement.
#   D6 `time-jump`, `laythe` / `jool` on D14 - the jumps are the instrument, and
#       nothing in this contract gates a Laythe- or Jool-framed render even though
#       the recording carries both.
[dimensionsCovered]
D9  = ["fast-forward"]
D14 = ["vall", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header.
#
# EMPTY. The loop-seam-teleport instrument is armed with no budget so a raise is
# REPORTED as the finding it would be. NOTE TWO KNOWN populations this lane may
# meet and does NOT pre-tolerate: the intermittent `line-blink` V15M's control run
# swept at a cycle-2 park epoch, and - more likely here - the creation-frame
# family (`icon-off-orbit`, `seam-endpoint-outside-soi`) that V16T measured. This
# lane uses a STEPPED bracket, which was the silent control in all three earlier
# programs, so the expectation is silence; a raise is a real reading.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir. The (not yet harvested) fixture is predicted to
# ship ONE, and this lane starts no recording of its own, so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +2  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split at EITHER of the
#       recording's TWO body-change seams. Every earlier loop lane had exactly one
#       boundary and all four measured `exoCoastBodyChangeKept=1`; this recording
#       has an ESCAPE boundary (under thrust) and an ARRIVAL boundary (a rails
#       coast), and rule 3's cohesion is argued for the latter shape. The load-time
#       walk fires for the FIRST time on this lane's LoadGame - B26's own run
#       commits and flushes without re-loading - so this is where it would show.
# => { min = 1, max = 3 }, matching B26's own window and deliberately wider than
# every predecessor's {1,2}.
count = { min = 1, max = 3 }

[expectations.logContracts]
# SEVEN TOKENS, and the two that a reader will notice are MISSING are missing on
# purpose (header section 6): `PhaseLock APPLIED: mission=` and an
# `Orbital(...) same-parent` classification are BOTH phase-lock-road artifacts,
# and requiring either would gate this reading run on H2 - i.e. on the outcome the
# research doc's guard walk predicts AGAINST.
#   "missionconfig applied:"       - the arm verb ran, and its Info line is where
#                                    the anchor is echoed. THE most important line
#                                    in the log for this lane.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door
#                                    and echoed the resolved relaunchUt (read it
#                                    per cycle; under H1 the two should differ by
#                                    one 105,961.4 s synodic).
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line, which
#                                    makes the D9 claim GATED. Road-independent.
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Vall" - the ANTI-VACUITY /
#       ARRIVAL pin: a map-render TRUTH line showing the ghost's proto orbit
#       surface REBOUND onto a VALL body frame. A run that never gets the ghost to
#       Vall has measured nothing about a Vall arrival, and reading that as a pass
#       is the V1/V2 vacuity failure. Road-independent: both roads render.
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - the PRESENCE form.
#       `sampled=[1-9]` is NOT pinned (the standing
#       FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and
#       it must stay that way on a first run for TWO reasons rather than one.
#       (a) The value is unmeasured at this subject. (b) V16T MEASURED that the
#       lens can raise `outsideSoi=1` from a creation-frame binding artifact
#       rather than from real drift, and the mechanism it named SCALES WITH THE
#       CADENCE MULTIPLE - so a lane whose cadence is a synodic rather than a
#       moon period is not obviously safe from it either. Pin presence; read the
#       value.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Vall",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, NOT THE FAMILY'S SIX. `[ReaimDiag]`, `ENGAGED re-aim` and `FORCED
# FAITHFUL` are all REMOVED relative to V14M/V15M/V16M - those lanes forbid them
# because on a same-parent subject re-aim is structurally unreachable and its
# appearance would falsify the routing claim. HERE RE-AIM IS THE THING THAT MIGHT
# LEGITIMATELY HAPPEN, so forbidding those tokens would red the interesting
# outcome. They are left out of BOTH lists.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 SELF-DETECTION GUARD, and on a lane whose eight jump UTs are
  # seeded under a HYPOTHESIS rather than derived from a known road, this is by
  # far the most load-bearing forbid in the file: a refused backward jump is only
  # a WARN, so without this token a mis-seeded bracket can green while dwelling
  # nowhere. Expect it to be the thing that reds run 1, and read that as the
  # calibration signal it is.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance
  # is a rendered-vs-recorded drift, which is a defect in the RENDER rather than a
  # reading about the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# REPORT-ONLY (the ARMED_ALLOWLIST discipline). The claim is V4/V6M/V14M/V15M/V16M's:
# a pure replay-observation workflow must author NOTHING durable. Every one of
# those lanes measured 0/0/0. Arm it at the arming pass, off this lane's own bytes.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# [expectations.recordings.structure] and the points facets are DELIBERATELY
# ABSENT on a first run: a report-only block of PREDICTED numbers reads like a
# measurement, and this lane's predicted topology is the least certain of the
# family (one recording or three).

[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 8x300 TimeJump + 40 RecordingState ticks
# (~10-22 wall s) + the fast non-deferred verbs + KSP boot + collect. Every jump is
# an instantaneous clock set; V16M's identical 61-step shape measured 64 s end to
# end.
budgetSeconds = 2400

[retry]
# One retry absorbs a transient seam flake. It does NOT absorb a mis-seeded anchor
# - that reproduces exactly on attempt 2, which is the point, and on this lane it
# is the LIKELY outcome of run 1 rather than an edge case (header section 3). A
# backward-jump red on both attempts is the calibration signal, not a failure.
policy = "once"

[expectedFail]
bugId = ""
