schema = 1
id = "M2-periodicity-solver"
tier = "daily"
# The in-game "Periodicity" category run unattended - the second half of the
# previously-unclaimed D11 space (missions / periodicity / re-aim). Sibling of
# M1-mission-loop-unit; DELIBERATELY a separate spec rather than a second RunTests step,
# because run.py::_driven_category resolves only the FIRST RunTests category and
# hlib.resolve_batch_complete treats per-category lines with no aggregate as a defined
# fault. One batch per spec.
#
# WHAT THIS GATES, AND WHAT IT DOES NOT. This gates the periodicity SOLVER, not the
# playback. The executed tests drive the real re-aim chain - ReaimFeasibilityScan over a
# pinned synodic period, ReaimTransferSynthesizer (UvLambert -> Orbit
# .UpdateFromStateVectors -> CalculatePatch), ReaimWindowPlanner.Plan, the stage-A
# inclination un-projection and the stage-B eccentricity-scaled tof band - against LIVE
# stock ephemerides, and assert that each synodic window either resolves a sane elliptic
# prograde transfer that actually encounters the target, or declines CLEANLY to faithful,
# deterministically across a cache-cleared re-solve. NOT observed here, and deliberately
# NOT claimed: any ghost replaying the re-aimed transfer, any rendered icon or orbit
# line, any loop cycle boundary, any elapsed period. The scenario computes plans and
# checks their geometry; it never advances the clock or spawns anything. A green M2 says
# "the solver still finds correct transfers against the shipped planet pack"; it says
# NOTHING about how the resulting trajectory renders - the map/TS render side is owned by
# S1.4 and the operator-tier observation sessions.
#
# Why in-game rather than xUnit: FlightGlobals is empty headless, so the xUnit siblings
# must inject hand-pinned stock constants. Only this run reads the real bodies.
description = "Run the in-game Periodicity category unattended at the Space Center: the re-aim feasibility scan, Lambert transfer synthesis, window schedule and eccentric/inclined stage-A/stage-B bands solved against real stock ephemerides."
instanceProfile = "stock-minimal"
tags = ["periodicity", "reaim", "solver", "M2", "D11"]

[fixture]
# fresh-sandbox (see M1): vessel-less, so TestCommandLoadGame.DecideLoadRoute settles at
# SPACECENTER, which is where 10 of the category's 11 tests live. The solver tests need
# nothing from the save except a loaded game and a populated FlightGlobals.Bodies.
# No [expectations.ledger] block: this scenario asserts nothing about the economy, so it
# never meets the no-pools seed-baseline gate that blocks L1-passive-sandbox.
saveTemplate = "fixtures/saves/fresh-sandbox"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# Same batch-driver shape as M1 / H5 / H6. autoRecordOnLaunch pinned false so the
# recording rules are correctly suppressed on a run that records nothing. RunTests is
# the single BATCH owner; 540 is the deferred per-step cap (S8).
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "Periodicity" },                 expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
# The SMALLEST honest set, one token per decision an EXECUTED test actually asserts:
#  - reaim-lambert: the Kerbin->Duna canary and the three window tests drive
#    ReaimTransferSynthesizer's UvLambert solve and require a real Duna encounter with a
#    finite future SOI-entry UT.
#  - eccentric-inclined-targets: the Moho (eccentric + inclined + near-180) and Eeloo
#    (high eccentricity) structural-contract tests, including the stage-B
#    eccentricity-scaled band and stage-A's inclination lift; and, since 2026-08-11,
#    the Kerbin->Eve cell, which is the only one that drives the achievability gate's
#    UNREACHABLE-PLANE branch and asserts the retain disposition (an inclined target at
#    an off-node departure keeps its un-flattened conic and still encounters).
#  - heliocentric-parking-departure: Reaim_KerbinToDuna_ParkingDeparture_... pins
#    r1 == park-end (the transfer starts at the ghost's re-phased parking position, not
#    the launch body's center) over both an identity and a non-identity window.
#  - fail-closed-to-faithful: the band-edge test's contract is explicitly "resolve a sane
#    transfer OR decline cleanly to faithful, deterministically".
# NOT claimed: s4-arrival-restitch (its only test is FLIGHT-scene and is filtered out
# here - see the tally derivation), and every loop-behavior token (whole-mission-loop,
# self-overlap, clone, phase-lock, zero-drift-schedule, loiter-compression), none of
# which this scenario runs. D14: SANDBOX fixture, Space Center scene.
D11 = ["reaim-lambert", "eccentric-inclined-targets", "heliocentric-parking-departure",
       "fail-closed-to-faithful"]
D14 = ["sandbox", "scene-ksc"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py:1733 reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. This table must stay AHEAD of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# count.max == 0: nothing is injected and every Periodicity test is a pure planner call
# over explicit inputs - no RecordingStore / MissionStore / RouteStore mutation at all -
# so a .prec in the produced save means something leaked. Also selects the B1
# recording-rules log-validation suppression.
count = { min = 0, max = 0 }

[expectations.logContracts]
# The batch tally is pinned WHOLE (hlib.batch_contract_vacuity_gap). Every number was
# MEASURED off the first live run, 2026-07-26:
#
#   BATCH_COMPLETE v1 total=11 passed=7 failed=0 skipped=4 category=Periodicity scene=SPACECENTER
#
# RE-PINNED 2026-08-11 (+1 total, +1 passed) for the inclined-target tilt-retention
# branch's Phase 2, which adds ONE batch-eligible SPACECENTER cell:
# Reaim_KerbinToEve_UnreachablePlaneRetainsTiltAndStillEncounters. It drives the
# achievability gate's unreachable-plane branch at a Kerbin->Eve off-node departure and
# asserts the RETAIN disposition end to end (the retain arm fires, it logs
# `state=retained reason=unreachable-plane`, the retained un-flattened conic still
# arrives inside Eve's SOI, and the window resolves instead of falling back faithful).
# skipped stays 4: the new cell declares neither Scene = FLIGHT nor
# AllowBatchExecution = false, so it survives both runner filters. Its only skip route is
# an InGameAssert.Skip when the pinned scan band contains no retaining departure - which
# would move passed 8 -> 7 AND skipped 4 -> 5 (InGameTestRunner.RecordSkip sets TestStatus.Skipped; total stays 12). Either way the pinned line mismatches and the gate reds.
#
# RE-PINNED 2026-08-15 (+1 total, +1 passed) for the M-MIS-3 BAND WALK cell,
# Reaim_KerbinToEeloo_BandWalk_AcceptsOutsideTheBaseBand - the closure of the behavioural
# half of M-MIS-3. It walks every step-0-INFEASIBLE departure in the pinned Kerbin->Eeloo
# scan through the product's own candidate list and its own accept/reject arbiter
# (ReaimTransferSynthesizer.TrySynthesizeTransfer), and asserts that at least one accepts
# OUTSIDE the recorded +-6% base band. MEASURED on the 2026-08-15 flight
# (logs/2026-08-15_1517_M2-periodicity-solver): 15 of 48 departures are step-0-infeasible,
# 3 of those accept outside the base band, 10 inside, 2 decline entirely, deepest walk
# 0.1550 of the recorded tof against a 0.0600 base and a 0.1900 scaled band.
# skipped stays 4: the cell declares neither Scene = FLIGHT nor AllowBatchExecution =
# false. Its skip routes are the eTarget guard (stock ecc no longer widening the band) and
# the fixture guards inherited from BuildPinnedScanOrSkip - either would move passed 9 -> 8
# AND skipped 4 -> 5, mismatching this line, which is the intended behavior.
#
# THE FIRST ATTEMPT AT THIS CELL SKIPPED, and the reason is worth keeping. It pinned five
# departures a headless tilt-gate model predicted would walk; the live synthesizer accepted
# step 0 at the first of them, the premise guard fired, and the batch read
# `total=13 passed=8 skipped=5`. The model was not wrong about the tilt gate - it
# reproduces the logged candidate inclinations exactly - it was wrong to assume a fired
# tilt correction then dies at the PatchedConics encounter check. That holds at the M2
# window-1 geometry and is not a law. The cell now MEASURES the map instead of pinning a
# prediction, and the three departures it finds (scanIdx 24, 25, 26 at candidates 32, 48,
# 62) are exactly three of the five the model named - the model's error was additive, not
# directional.
# The pre-flight derivation below was written from the [InGameTest] attributes and the
# live line confirmed it token for token. This category is the one where a naive
# "total=N passed=N skipped=0" pin would be WRONG, so the derivation is kept as the
# explanation of WHY each number is what it is:
#  - total=13: exactly 13 [InGameTest(Category = "Periodicity")] methods exist
#    (ReaimEndToEndInGameTest 11, CrossParentReaimCanaryInGameTest 1,
#    ReaimLandingCoincidenceInGameTest 1 - and that last one is FLIGHT-scene).
#    Re-derive with `grep -c 'Category = "Periodicity"'` over those three files; the
#    11 + 1 + 1 must equal the pinned total. BATCH_COMPLETE's total is
#    `allTests.Count(Status != NotRun)`, which counts every filtered test too.
#  - skipped=4, from TWO different filters applied in order by RunCategory:
#      * FilterSceneEligibleBatchCandidates first drops the 1 Scene = GameScenes.FLIGHT
#        member (S4Restitch_RotatedDeorbitPoint_MeetsRecordedSiteAtTrigger, which needs a
#        real landing site);
#      * PrepareBatchExecution then drops the 3 that declare AllowBatchExecution = false
#        (Reaim_KerbinTo{Moho,Eeloo,Duna}_FeasibilitySweep_Diagnostic at
#        ReaimEndToEndInGameTest.cs:827/836/1015 - measurement artifacts, single-run-only
#        by design).
#    Both filters mark the test Skipped, so all 4 land in the skipped tally.
#  - passed=9: the remaining 9 batch-eligible SPACECENTER tests execute - the other 8 of
#    ReaimEndToEndInGameTest's 11 (EveryWindowResolvesSaneTransfer, BandEdgeWindows,
#    ObservedEdgeDeparture, KerbinToMoho / KerbinToEeloo StructuralContract,
#    KerbinToEve UnreachablePlaneRetainsTiltAndStillEncounters, ParkingDeparture,
#    KerbinToEeloo BandWalk_AcceptsOutsideTheBaseBand) plus
#    the CrossParentReaimCanary. Their
#    InGameAssert.Skip guards fire only on a non-stock body graph, degenerate live orbit
#    data, a fixture offset that stock eccentricity drift has pushed outside the
#    stage-B band, or (the Eve cell) a pinned scan band with no retaining departure -
#    none of which the stock-minimal profile produces (the tests' own
#    comments say "unexpected on stock").
#  - scene=SPACECENTER: the vessel-less fixture's LoadGame route.
# The former PENDING-OPERATOR is CLOSED by the 2026-07-26 flight. A stock rebalance
# tripping one of those guards now reds here with the exact number to re-derive from.
# That is the intended behavior. Do NOT relax this back to a bare failed=0 - the whole
# point of the scenario is that these solvers actually ran.
required  = [
  "BATCH_COMPLETE v1 total=13 passed=9 failed=0 skipped=4 category=Periodicity scene=SPACECENTER",
  # M-MIS-3 BEHAVIOURAL CLOSURE, armed 2026-08-15 off logs/2026-08-15_1517_M2-periodicity-solver.
  # The load-bearing token is `outsideBaseBand=3`: three step-0-infeasible departures accept a
  # candidate beyond the 0.06 base band, i.e. the eccentricity-widened region is ENTERED AND USED
  # rather than merely computed. `deepestWalk=0.1550` pins how far - 2.6x the base-band edge, and
  # still inside the 0.1900 scaled band, so invariant (c) is visible in the same line.
  # Deliberately a token on the cell's OWN line, not on ReaimPlaybackResolver's
  # `re-aimed transfer ready:` line, which V12A arms adjacent substrings of.
  "band walk Kerbin->Eeloo: scanSteps=48 step0Infeasible=15 outsideBaseBand=3 insideBaseBand=10 declined=2 deepestWalk=0.1550 baseHalfWidth=0.0600 scaledHalfWidth=0.1900 eTarget=0.2600",
  # The closure is product-visible, not only synthesizer-level: the deepest-walking departure's
  # windows all RESOLVE through the real resolver.
  "band walk Kerbin->Eeloo resolver end-to-end: scanIdx=24 map=RRRRR resolved=5 declined=0",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# Budget arithmetic (M-A5 S8, mirrors M1/H5/H6): 720 >= 300 LoadGame + 540 RunTests
# ceiling headroom. The three FeasibilitySweep_Diagnostic sweeps - the expensive ones -
# are AllowBatchExecution=false and never run in this batch.
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
