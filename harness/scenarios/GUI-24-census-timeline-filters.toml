schema = 1
id = "GUI-24-census-timeline-filters"
tier = "operator"
# THE GUI CENSUS, WAVE 6: THE TIMELINE WINDOW'S SCALAR VIEW STATE.
#
# WHAT IT BUYS, and every item here reads the SAME value in every dump the census has
# taken so far. The Timeline's filter row carries three independent source toggles
# (`Recordings` / `Actions` / `Events`), an `Archived` toggle, a `Custom` range reveal
# with the window's only two sliders, a five-button preset row and a scrolling entry
# list. Every capture on disk shows all three sources ON, the archive filter OFF, the
# custom range hidden, no preset active and the list at the top. `UiAction op=state`
# (PR #1734) is the first thing that can drive any of them, so this lane is the first
# picture of the other side of each.
#
# HOST: the operator-local census fixture (`fixtures/local-saves/c1-gui`), for the
# reason GUI-1's header argues at length - a census photographs LAYOUT, and a filter
# that removes rows from an empty list photographs as an empty list either way. The
# operator's career carries 110 committed recordings, 18 missions and 50 groups, so each
# source toggle visibly changes the row population and `scrollY` has something below the
# fold to scroll to. Stage it first:
#
#   python harness/tools/stage_local_fixture.py \
#       --from "../Kerbal Space Program/saves/c1" --as c1-gui --no-quicksaves
#
# Without that the run is refused PRE-BOOT as INVALID(staging) with the command in the
# error (hlib.local_fixture_hint); every committed suite stays green either way.
#
# THE ARCHIVE CAPTURE IS THE FILTER TOGGLE, NOT ARCHIVED ROWS, and that is measured
# rather than a compromise. `key=archived` drives `GroupHierarchyStore.HideActive`
# through `TimelineWindowUI.ShowArchivedRecordings`, in the Timeline's POSITIVE sense
# (`state=true` means archived rows contribute). No committed fixture and not the
# operator's own career carries a single `Recording.Hidden` row: the codec writes
# `hidden` only when true and the token appears ZERO times across all 59 committed
# fixtures and in `c1/persistent.sfs`. So the row-level `[archived]` marker has no host
# at all, and what this capture honestly shows is the filter toggle drawn CHECKED with
# the same row set under it - which the dump proves, because `GuiTreeJson` records a
# toggle's own `value`. Filed as
# GUI-CENSUS-NO-HOST-CARRIES-AN-ARCHIVED-RECORDING-OR-MISSION rather than faked.
#
# THE ARCHIVE KEY IS A PERSISTED WRITE and so is nothing else in this lane. Every other
# key here is per-session view state that dies with the process; `archived` survives the
# save. It is written on a STAGED THROWAWAY copy of the host (the harness stages every
# fixture into `${runSave}`), it is restored to `false` two steps later, and NO FIXTURE
# IS EVER HARVESTED FROM THIS RUN.
#
# ONE COMBINATION IS REFUSED BY DESIGN and this lane is deliberately not near it:
# `key=srcRecordings state=false` answers `REJECTED state-clamped-by-tab` while the tier
# filter is `rewindff` or `refly`, because those tabs' own draw pass forces the toggle
# back on. Every source-toggle step runs under `overview` (the preamble's default), and
# the only tab switches are the Career category views at the END, after the last source
# write, so the gate never fires here.
#
# THE TWO-ROW FILTER AREA (2026-09-24). Row 1 is the view group (`Overview`, `Details`,
# `Rewind/FF`, `Re-Fly`, `Career`) plus a `Time: <range>` button; row 2 is the selected
# view's context row (the three source toggles and `Archived` under Overview / Details,
# the five career categories under Career). The old `Custom` button is folded into Time:
# `key=customRange` now opens the Time fold (preset row plus the From / To sliders), so
# `ksc-timeline-customrange-advanced` photographs the open fold, and the two preset
# captures stand over it with the Time label naming the range.
#
# THE CAREER CATEGORY CAPTURES are one per category that has rows on this host: the
# operator's career ledger carries contract accepts and completions, 40 milestone credits
# and 17 tech unlocks, and NO strategy or facility action at all, so `strategies` and
# `facilities` would photograph an empty list under a populated label and are not taken.
# `ksc-timeline-milestones-thisyear-advanced` is the owner ruling in one picture: the time
# range applies in a category view too, with the Time fold CLOSED so the lit
# `Time: This Year` button is the only sign of it.
#
# THE PRESET ROW'S `All` BUTTON IS A CLEAR, not a range, and the seam reports it
# honestly: `ApplyTimeRangePreset` calls `filter.Clear()` for it and
# `ActiveTimeRangePresetForTesting` answers the `All` token whenever the filter is
# inactive, so the settle's `after=All` is a real read-back rather than an echo. The two
# RANGED presets are captured; `Last 7d` / `Last 30d` are the same layout with different
# numbers and buy no new picture.
#
# `scrollY` IS A PNG-ONLY STATE. A `.gui.json` dump carries below-fold content with full
# rects whatever the offset is, so the dump beside the scrolled capture is not the
# product - the PNG is. The seam reports the CLAMPED offset (`after=`), which is why the
# log contract regexes that one value instead of pinning 600.
#
# THE CAREER `pending:` FOLD WAS IN THIS LANE AND IS NOT ANY MORE, and the reason is a
# MEASUREMENT this lane took rather than a scoping choice. `op=expand window=career
# key=none` ran and answered exactly what it should (`state=false expanded=0 total=2`,
# flight `2026-09-21_2252`), and the two captures beside it photographed NO FOLD: the
# Career tab draws `Pending in timeline (N)` only when `RowsEqual(tab.CurrentRows,
# tab.ProjectedRows)` is FALSE (`CareerStateWindowUI.cs:1478`), i.e. only on a career
# whose recorded future DIVERGES from now. The operator's own career reads
# `Mission Control L1 - slots 0/2 now, 0/2 at timeline end`, so the same-as-projected arm
# draws and the fold does not exist to collapse. A capture of the ordinary tab under a
# label claiming a collapsed fold is the exact false reading the census exists to prevent,
# so the two steps are GONE rather than relabelled - GUI-1 already photographs both tabs
# in their resting form on this host. Filed as
# GUI-CENSUS-CAREER-PENDING-FOLD-NEEDS-A-DIVERGING-CAREER.
description = "GUI census wave 6: the Timeline window's scalar view state - each source toggle off, the archive filter on, the Time fold open, two time-range presets, a scrolled entry list, and the Career view's contracts / milestones / tech categories (one under a This Year range) - on the dense operator-local census host."
instanceProfile = "stock-minimal"
tags = ["gui-census", "screenshots", "ui", "timeline", "career", "GUI-24", "pending-operator"]

[fixture]
saveTemplate = "fixtures/local-saves/c1-gui"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  # --- boot, forced to the Space Center (this host's activeVessel is focusable, so the
  # DEFAULT LoadGame route would boot into FLIGHT).
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },

  # --- the host surface. `open window=main` FIRST is a precondition, not just order: the
  # settle for a non-`main` open / rect / state / sort / edit REFUSES while the host's
  # `showUI` is false (`ERROR window-host-hidden`).
  { cmd = "UiAction", args = { op = "complexity", mode = "advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "open", window = "main" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "main", x = "8", y = "8", w = "250", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },

  # --- the Timeline, opened and sized BEFORE any state step: `op=state` answers
  # REJECTED window-not-open on a shut window, and `key=preset` clamps against slider
  # bounds that only a DRAWN frame computes.
  { cmd = "UiAction", args = { op = "open", window = "timeline" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "timeline", x = "270", y = "8", w = "1000", h = "700" }, expect = "OK" },

  # --- STATE 1-3: the three source toggles, one OFF at a time. Each is its own
  # row-population branch and all three read `true` in every dump the census has.
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "srcActions", state = "false" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-noactions-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-noactions-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "srcActions", state = "true" }, expect = "OK" },

  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "srcEvents", state = "false" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-noevents-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-noevents-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "srcEvents", state = "true" }, expect = "OK" },

  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "srcRecordings", state = "false" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-norecordings-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-norecordings-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "srcRecordings", state = "true" }, expect = "OK" },

  # --- STATE 4: the archive filter ON. See the header: the TOGGLE flips (the dump
  # records a toggle's own `value`), the row set does not, because no host carries an
  # archived recording. Restored immediately - it is the one persisted write here.
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "archived", state = "true" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-archivedfilter-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-archivedfilter-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "archived", state = "false" }, expect = "OK" },

  # --- STATE 5: the Time fold open (the `customRange` key) - the preset row plus the
  # window's ONLY two sliders and their From: / To: labels.
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "customRange", state = "true" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-customrange-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-customrange-advanced" }, expect = "OK" },

  # --- STATE 6-7: two ranged presets over the revealed sliders, so the active-range
  # readout and the moved thumbs are both in frame.
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "preset", value = "This Year" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-presetthisyear-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-presetthisyear-advanced" }, expect = "OK" },

  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "preset", value = "Last Day" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-presetlastday-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-presetlastday-advanced" }, expect = "OK" },

  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "preset", value = "All" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "customRange", state = "false" }, expect = "OK" },

  # --- STATE 8: a lower band of the entry list. PNG-only: the dump carries below-fold
  # content at any offset, the viewport-sized image does not.
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "scrollY", value = "600" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-scrolled-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-scrolled-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "scrollY", value = "0" }, expect = "OK" },

  # --- STATE 9-11: the Career view, one capture per category with rows on this host
  # (see the header). Row 2 shows all five category buttons; the list only that
  # category's rows, both tiers, past and future around the "now" divider.
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "contracts" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-contracts-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-contracts-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "milestones" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-milestones-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-milestones-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "tech" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-tech-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-tech-advanced" }, expect = "OK" },

  # --- STATE 12: a category view under a time range, with the Time fold CLOSED (it was
  # closed after STATE 7), so the lit `Time: This Year` label is what says rows are hidden.
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "milestones" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "preset", value = "This Year" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ksc-timeline-milestones-thisyear-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ksc-timeline-milestones-thisyear-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "state", window = "timeline", key = "preset", value = "All" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "overview" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "timeline" }, expect = "OK" },

  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
D14 = ["career", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.logContracts]
# Only this lane's OWN seam records. A local fixture is unreproducible by construction,
# so nothing here claims anything about the host's CONTENT - every line is a seam INFO
# record that an op ran and what it read back.
#
# THE STATE LINES ARE THE LANE'S CENTRAL CLAIM. `want=` is what the step asked for and
# `after=` is the SETTLED read-back taken after a drawn frame, so the pair is a statement
# about the game rather than about the write. `changed=true` on each first write says the
# window was NOT already in that state, which is what separates a real capture from a
# picture of the default. The restore steps are deliberately unpinned - they are
# bookkeeping.
#
# `scrollY` IS THE ONE KEY WHOSE `after=` MAY DIFFER FROM `want=` (the scroll view clamps
# the offset to its own content), so its line regexes the value instead of pinning 600.
# Pinning 600 would pin the host's row count.
required = [
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=12 open=1 openWindows=main",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=12 open=2 openWindows=main,timeline",

  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=srcActions want=false after=false changed=true frames=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=srcEvents want=false after=false changed=true frames=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=srcRecordings want=false after=false changed=true frames=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=archived want=true after=true changed=true frames=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=customRange want=true after=true changed=true frames=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=preset want=This Year after=This Year changed=true frames=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=preset want=Last Day after=Last Day changed=true frames=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=preset want=All after=All changed=true frames=[0-9]+",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction state window=timeline key=scrollY want=600 after=[0-9.]+ changed=true frames=[0-9]+",

  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] capturescreenshot ok label=ksc-timeline-noactions-advanced",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-noactions-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-noevents-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-norecordings-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-archivedfilter-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-customrange-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-presetthisyear-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-presetlastday-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-scrolled-advanced .*patched=17/17",

  # The Career view: each category tab write names its token and its index (4, 7 and 8,
  # appended after `refly`), and each capture beside it dumped whole.
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction tab window=timeline tab=contracts index=4 already=false",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction tab window=timeline tab=milestones index=7 already=false",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction tab window=timeline tab=tech index=8 already=false",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-contracts-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-milestones-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-tech-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=ksc-timeline-milestones-thisyear-advanced .*patched=17/17",
]
forbidden = []

[expectations.analyzer]
# REPORT-ONLY, identical in kind and cause to GUI-1's and GUI-2's: the offline analyzer
# over this host measures FAIL=25 RED=1 on recordings months older than any census lane
# (U1-GUI-CENSUS-LOCAL-HOST-REDS-THE-ANALYZER). A census takes screenshots - it neither
# causes nor observes a recording-invariant finding - and `run.py` always passes
# `-FailOnRed`, so a gating row would red this lane forever. NOT `[expectedFail]`, which
# short-circuits the verifier chain and would skip the log contracts above.
gating = false

[runtime]
# Twelve captures and twelve dumps, a 300 s cold load of a 42 MB career and ~35 single-phase
# UI ops. GUI-1 measures 22 captures plus 22 dumps on the same host at 96 s wall against a
# 1500 s budget; the first flight of this lane (with two more captures than it now has)
# measured 88 s. 900 s is the budget every other census lane uses.
budgetSeconds = 900
# The census frame (`screenResolution`, harness README): 1280x720 cropped every
# Parsek window wider or taller than it, so the census lanes capture at 1920x1080.
screenResolution = "1920x1080"

[retry]
policy = "once"

