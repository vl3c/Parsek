schema = 1
id = "H75-rover-relay-c-second-cycle-hold-career"
tier = "nightly"
# RVR-8-rover-relay-c-second-cycle-hold, CAREER STYLE. RVR-8's driver steps verbatim
# (create, send-once, TimeJump 1100, a second send-once that HOLDS on OriginLacksCargo,
# TimeJump 2400, activate) over `rover-relay-c-recorded-career`; the only variable moved
# is the fixture's game mode.
#
# THE FIXTURE is H74's: `rover-relay-c-recorded` converted to CAREER by
# `harness/tools/build_route_career.py` (drift gate `harness/lib/test_route_career.py`).
# See that builder's docstring and H74's header for the exact edits: career PARAMETERS
# and scenarios, Funding 500000 / R&D 100 / Reputation 0, top-level facilities, the
# ledger's SANDBOX starting-value and award-bearing milestone rows removed so Parsek
# seeds off the career save; vessels, roster, ParsekScenario and every recording sidecar
# byte-identical.
#
# NOT FIT FOR LEDGER GROUND TRUTH (L2-style) CHECKS: the source was flown in SANDBOX, so
# the ledger carries no launch-cost, recovery or hire rows. The ledger block below is
# the SUM-model "nothing moved" diff against the staged pools, not ground truth.
#
# WHAT IT ADDS OVER H74: a blocked cycle, a hold, a pause and a player activate, each a
# route lifecycle step that must stay money-free in a career (LOGISTICS-WITHOUT-MONEY).
# The gates are H74's: `Built route id=.* mode=CAREER`, the two seed lines with the
# career save's values, no `mode=SANDBOX` build, no seed refusal, no
# `Patch<Pool>: <old> -> <new>` pool write (Info, logged only when the patcher moves a
# pool), no drawdown-guard clamp, and the ledger oracle's HARD funds / science /
# reputation diff against the staged 500000 / 100 / 0. The sum model is allowed: the
# driver has TimeJump but no rewind or merge-dialog verb.
#
# PREDICTION FOR THE FIRST FLIGHT (a reading run): RVR-8's tokens all hold, the two seed
# lines appear once each, no pool write. Both structure blocks stay REPORT-ONLY
# (`gating = false`) until a reading run (`test_no_committed_spec_arms_gating`).
#
# FLIGHT 1  `2026-10-21_2018`, PASS attempt 1, wall 56 s, automation DLL sha256 prefix
#           7bdd8016 (worktree 4772612, C# = main 92f3a15). THE PREDICTION HELD: every
#           RVR-8 token matched (the delivered cycle, the OriginLacksCargo hold, the
#           pause and the player activate), both career seed lines present, `Built
#           route id=... mode=CAREER`, zero `[Parsek][ERROR]`, no `Patch<Pool>: <old> ->
#           <new>` write, no drawdown clamp. Ledger oracle PASS (expected funds 500000,
#           science 100, rep 0; no hard divergence). saveParse (report-only): one
#           route, Active; 0 supersede rows, 0 tombstones, 0 rewind points.
#
# FAST-LANE CHECKLIST item 9, flight_efficiency.py (flight 1, `2026-10-21_2018`):
# pre-launch 11.5 s, boot 25.0 s, seam steps 8.4 s (LoadGame 7.82 s), gaps 1.2 s, quit
# 0.7 s, post-quit 9.2 s, retries 0. Nothing to trim: boot and the load are the cost.
description = "RVR-8-rover-relay-c-second-cycle-hold-career style: RVR-8's delivered cycle, held second cycle (OriginLacksCargo) and player activate over rover-relay-c-recorded-career, the same relay save converted to CAREER by build_route_career.py, gating mode=CAREER on the route build, the career-save seeds (funds 500000, science 100), and no Parsek pool write, drawdown clamp or ledger-oracle pool drift across dispatch, delivery, hold and activate. FLOWN GREEN 2026-10-21 on its first flight (2026-10-21_2018, PASS attempt 1, ledger oracle PASS)."
instanceProfile = "stock-minimal"
tags = ["seam-verbs", "logistics", "route-create", "route-hold", "origin-lacks-cargo",
        "route-activate", "career", "recorded-fixture", "H75", "flown",
        "reading-iteration"]

[fixture]
saveTemplate       = "fixtures/saves/rover-relay-c-recorded-career"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                    expect = "OK" },
  { cmd = "DiscardTree",                                                      expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SealSlot",     args = { tree = "88c012a6eed94bf09ff73397a4a31410" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "create", tree = "88c012a6eed94bf09ff73397a4a31410", name = "relay-c" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "send-once", route = "relay-c" },  expect = "OK", budget = 120 },
  { cmd = "TimeJump",     args = { ut = "1100" },                             expect = "OK", budget = 300 },
  { cmd = "RouteCommand", args = { action = "send-once", route = "relay-c" },  expect = "OK", budget = 120 },
  { cmd = "TimeJump",     args = { ut = "2400" },                             expect = "OK", budget = 300 },
  { cmd = "RouteCommand", args = { action = "activate",  route = "relay-c" },  expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                         expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# CLAIM-IS-NOT-GATE: D8 rests on the ledger block's HARD pool diff plus the pool-write
# forbids; D14 career on the fixture's Mode (test_d14_game_mode.py) and mode=CAREER.
D8 = ["funds", "science", "reputation"]
D14 = ["career", "scene-flight"]

[expectations]
allowedAnomalies = []

