# What this lane earned is not a registry cell - it is the first driven promotion of a
# MULTI-HOP relay anywhere, and the first driven proof that a tree with ZERO origin proofs
# is admissible.
#
# WHAT THIS LANE ACTUALLY BUYS, stated so it is not dressed as a coverage row: it is the
# first driven promotion of a MULTI-HOP relay anywhere (RVR-2 promotes a single-hop supply
# run), and the first driven proof that a tree with ZERO origin proofs is admissible. That
# is a real product and it is not a registry cell.
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (the H7 lesson): run.py reads `expectations.allowedAnomalies`,
# and a bare key written AFTER an `[expectations.<sub>]` header is TOML-scoped to that
# sub-table and never read. hlib.validate_spec rejects the misplaced form, so this must
# stay ahead of the sub-tables. No tracer is armed by this spec (the fixture's inherited
# `mapRenderTracing = True` is a SAVE setting, not a spec arm), and NO render-composition
# expectations block is declared, which is what leaves `PARSEK_RENDER_MANIFEST` unset.
allowedAnomalies = []

[expectations.recordings]
# THE ANTI-DATA-LOSS FLOOR, for the H39 census-2 reason: on that flight the batch went
# GREEN and the run red ANYWAY on `recordings.count`, which is how
# QUICKLOAD-OVER-COMMITTED-RESTORE-OVERLAP-DELETES-TREE-ON-SAVE (player-reachable data
# loss) was found. Not one in-game cell could see it; the count row was the only
# instrument pointed at the committed corpus.
#
# MEASURED EXACT 2026-09-02, replacing the authored window `{9, 11}`. The flight read
# `observed.recordings.count = 9` and `saveParse` agreed
# (`recordings.structure.recordings = 9`), so the load-time optimizer split that H35 /
# H39 / H40 all measure on their hosts does NOT happen on this corpus - the same property
# RVR-1 and RVR-2 measured independently on `rover-route-recorded`, and the same reading
# RVR-6's census took over these identical bytes. Below 9 means destroyed sidecars; above
# it means a split these bytes have now been shown not to take.
count = { min = 9, max = 9 }

[expectations.logContracts]
# ############################################################################
# THE PINS BELOW WERE INVERTED ON 2026-09-03 AND MEASURED THE SAME DAY.
# **FLOWN `2026-09-02_2244`: PASS attempt 1, wall 48 s, `mismatches=0`.** Every
# required token below matched on the first attempt and the forbid list stayed
# clean. The paragraph that follows is the AUTHORED standing, kept because the
# inversion and its reasoning are the record - not because anything here is still
# unmeasured.
#
# Until that date this block pinned `eligible=False`,
# `status=MixedPickupDelivery alreadyPromoted=False refusal=CandidateIneligible`,
# `routecommand rejected reason=candidate-ineligible` and a FORBID on
# `routecommand complete action=create`. Both refusal reasons are now closed (see
# the header): PR #1620 made stored cargo match BY KIND, PR #1618 moved the origin
# binding to the undock, and the analysis-side follow-up derives the origin from
# the PICKUP WINDOW. Under the operator ruling that candidates come from the
# ACTIONS, this relay is ADMISSIBLE and yields exactly one route (source B,
# destination A).
#
# AS AUTHORED, NOTHING HERE HAD BEEN MEASURED: tokens 3 and 4 and the create
# step's own `expect = "OK"` were DERIVED FROM THE RULING, and TOKEN 3 was named
# as the instrument that would identify which gate said no if the override had not
# landed - it carries the whole gate walk in ONE contiguous run, including the
# `RouteAnalysisStatus` behind an ineligible verdict. It landed, and token 3 read
# `eligible=True status=Eligible alreadyPromoted=False refusal=None`.
# ############################################################################
#
# EVERY TOKEN IS NOW A MEASURED LINE, and each is still a literal RUN out of the emitting
# `string.Format` / interpolation rather than a whole rendered line - an interpolated
# string is not stored the way it renders, and a token spanning a hole (or an em dash)
# cannot match.
#
# TOKEN 1  THE BOOT, from `TestCommandLoadGame`. Pins `scene=FLIGHT` one layer earlier
#          than anything else, where a failure is legible as a boot fault rather than as
#          a candidacy finding. The same token is measured on the sibling fixture by
#          RVR-1 / RVR-2 / H56 / H59.
#
# TOKEN 2  THE SEAL NO-OP, from `ParsekTestCommandAddon.SealSlot.cs`'s `SealWholeTree` OK
#          branch: "sealslot complete mode=tree tree={0} total={1} sealed={2}
#          remaining=0 alreadySealed={3}". `remaining=0` is a LITERAL in the format string
#          (the branch only runs when the verdict is OK), so `remaining=0
#          alreadySealed=True` is one contiguous run. `sealed=0` says nothing was sealed
#          and `alreadySealed=True` says the verb recognised that as success. `total=7`
#          is DERIVED FROM THE COMMITTED BYTES (the relay tree's RECORDING count, pinned
#          by `verify_seal_state`), so a tree that lost a member reds here rather than at
#          the create. The asymmetry with the count row above is deliberate:
#          `recordings.count` admits a load-time optimizer split (max 11), this token does
#          not - a split inside the relay tree would raise `total=` above 7 and red here
#          while the count row passes. On a first census that red is a reading to act on,
#          not a defect.
#
# TOKEN 3  THE GATE WALK, ONE CONTIGUOUS RUN, and THE lane's instrument. From
#          `RouteCommandCreate`'s pre-decision Info line, whose format string is
#          "routecommand create gate tree={0} treeFound={1} dismissed={2} sealed={3}
#           eligible={4} status={5} alreadyPromoted={6} refusal={7}" with no hole between
#          the fields, so the whole positive reading is one token. It says the tree was
#          FOUND, was NOT dismissed, WAS sealed, and the analysis found it ELIGIBLE - i.e.
#          the admission belongs to the ANALYSIS and to nothing cheaper. THE FIRST THREE
#          CONJUNCTS ARE PROPERTIES OF THE COMMITTED BYTES; `eligible=True status=Eligible
#          refusal=None` IS THE PREDICTION. Pinned as one token rather than as the old
#          two, because that split existed to let the refusal REASON red on its own and
#          there is no reason left to isolate.
#
# TOKEN 4  THE CREATE ACK, from the same file's OK branch. `status=Paused` is the
#          service's `initialStatus: Paused` - a created route does NOT start dispatching,
#          which is what makes this lane's deliberate absence of any send-once step honest
#          rather than incomplete. The route id is a per-run value and is regexed;
#          `name='relay'` pins that the verb built the route the step asked for rather
#          than resolving some other candidate.
#          `intervalSeconds` / `transitSeconds` / `cadence` / `stops` are deliberately NOT
#          pinned before the first flight: the interval is a computed float out of
#          `ComputeRootToUndockSpan`, and `stops=` depends on how the post-fix analysis
#          shapes a pickup-plus-delivery relay - which is exactly what this census is for.
#          RVR-2's history is the standing lesson on pinning a derived number.
#
# TOKEN 5  THE ROUTE STORE IS EMPTY ON THE WAY IN, from `RouteModule`'s recalculation
#          epilogue (`PostWalk: routes={0}, paused=...`). It fires on OnLoad - unlike
#          `DeriveCandidates`, which does not (see the header) - and the fixture already
#          carries `verboseLogging = True`, with step 5 re-asserting it. It is the
#          before-picture the admission is measured against, and together with the
#          `[expectations.routes]` reading of the PRODUCED save it brackets the create:
#          zero in, one out.
#
# WHAT IS DELIBERATELY NOT REQUIRED:
#   * any `DeriveCandidates:` line. It is not a load-time pass; see the header. Requiring
#     one would red a correct run.
#   * any `RouteOriginProof skipped:` line. That producer runs at RECORD time, and this
#     lane records nothing - the absence it caused is already in the committed bytes and
#     is pinned by the builder's `verify_no_route_state`, not by a flight.
#   * any `RouteRunPrompt skipped` line, for the same reason as `DeriveCandidates`: it is
#     emitted on the post-commit prompt path this driver never walks.
#   * any DISPATCH token. This lane drives no cycle at all, and could not usefully: the
#     fixture's live source rover B is drained to LiquidFuel 0 / 400 against the window's
#     200 pickup manifest, and `RouteOriginCargoCheck.HasRequired` is all-or-nothing. The
#     dispatch half of the relay family is RVR-7's.
#
# THE FORBID LIST IS THE VACUITY GUARD AND IS THE POINT, INVERTED WITH THE LANE.
# `routecommand rejected` is the Warn the verb emits on ANY non-`None` refusal, so a run
# whose create was refused would still satisfy tokens 1, 2 and 5 - and if a future
# refactor ever reordered the gate logging, this forbid is what still says "the relay was
# admitted at the end of this lane".
required  = [
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "sealslot complete mode=tree tree=87fba47a981e4c86a598fe855a6e8113 total=7 sealed=0 remaining=0 alreadySealed=True",
  "routecommand create gate tree=87fba47a981e4c86a598fe855a6e8113 treeFound=True dismissed=False sealed=True eligible=True status=Eligible alreadyPromoted=False refusal=None",
  "routecommand complete action=create tree=87fba47a981e4c86a598fe855a6e8113 route=.* name='relay' status=Paused",
  "PostWalk: routes=0",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "routecommand rejected",
]

[expectations.recordings.structure]
# STILL REPORT-ONLY: NO `gating` KEY, deliberately. The standing arming rule
# (`harness/lib/saveparse.py` -> `ARMED_ALLOWLIST`) is that a block is armed only after a
# report-only READING run whose facets match the declared windows, and this spec has now
# had exactly ONE (`2026-09-02_2244`), which read every value below. Arming is the
# separate per-scenario operator decision that reading unlocks; it has not been taken.
# The numbers were MEASURED off the committed fixture bytes by
# `saveparse.observed_structure_facets` and re-asserted in `harness/lib` by
# `RECORDED_FIXTURES`, and the flight confirmed them on the PRODUCED save too - the two
# are different claims, and this block evaluates the second.
#
# `recordings` carries the same window as the count row above and for the same reason.
# `terminalStates` is stated as FLOORS: a load-time optimizer split would add recordings
# and could add terminal states, but it cannot remove one.
# `branchPoints` is EXACT on both bounds, because a split does not create or destroy dock
# and undock seams - and the Dock 2 / Undock 2 alternation is what makes this a RELAY
# rather than a single supply run. Losing one hop is the single most damaging thing a
# re-harvest could do to this fixture while leaving every other facet plausible.
trees          = { min = 3, max = 3 }
committedTrees = { min = 3, max = 3 }
recordings     = { min = 9, max = 11 }
terminalStates = { Landed = { min = 5 }, Docked = { min = 2 } }
branchPoints   = { Dock = { min = 2, max = 2 }, Undock = { min = 2, max = 2 } }

[expectations.routes]
# STILL REPORT-ONLY (no `gating` key) - every value below is MEASURED off
# `2026-09-02_2244`, but arming is a separate per-scenario operator decision taken after a
# reading run, and this block has had exactly one.
#
# THIS IS THE BLOCK THE LANE EXISTS FOR, and it READ `count = 0` until 2026-09-03, when
# the lane pinned the refusal. EXACTLY ONE, both bounds, because the operator's ruling is
# a claim about the NUMBER as much as about the admission: dock, take FROM, undock, dock
# elsewhere, transfer TO, undock is ONE route, not two. A reading of 2 would have meant
# the analysis promoted each window separately. MEASURED 1.
#
# **`stops = 2` IS THE FLIGHT'S OWN FINDING**, and it answers the shape question no
# reading of the bytes could: `stops=2`, `connectionKinds={DockingPort:2}`,
# `destinationVesselPids=[2123618197, 831319732]`, `originBodies={Kerbin:1}` - the two
# recorded windows became the two STOPS of ONE route rather than an origin plus a stop.
# RVR-7's census read the identical shape on the other relay fixture.
#
# `completedCycles = 0` is the honest counterpart of this lane driving NO cycle (see the
# header): the route is created and left Paused, and nothing dispatches. RVR-7 is the lane
# that reads 1 here.
#
# `sourceRefs = 3` is the route's references into the committed corpus - the surface
# `RouteStore.RevalidateSources` compares against a live rebuild, and the one the
# `recordings.count` floor above protects.
#
# `dormant = 0` was derived (`RouteCreationService.CreatePausedFromCandidate` stores a
# COMMITTED route at `initialStatus: Paused`, and nothing in this driver moves one to
# `DORMANT_ROUTES`) and is now measured too.
#
# The M-C2 `routes` facet landed 2026-09-02 (PR #1603) and is live - H59 declares one -
# so this is a real surface rather than a reserved one.
count           = { min = 1, max = 1 }
dormant         = { min = 0, max = 0 }
stops           = { min = 2, max = 2 }
sourceRefs      = { min = 3, max = 3 }
completedCycles = { min = 0, max = 0 }
skippedCycles   = { min = 0, max = 0 }
statuses        = { Paused = { min = 1, max = 1 } }

[runtime]
# Budget arithmetic (M-A5 S8): run.py gives EVERY deferred seam verb
# `required_step_wait(max(step budget, SEAM_FALLBACK_DEFERRAL_SECONDS=600))` = 660 s
# regardless of the declared step budget. Only LoadGame is deferred here, so the worst
# case is 660 plus the four synchronous route/seal/save budgets (120 x 3) and the two
# unbudgeted settings verbs. 1200 clears it with headroom, and trimming it to hug the
# expected ~50 s wall (RVR-2's measured figure for a comparable driven chain on the
# sibling fixture) would convert a slow restore into a KILLED run with no artefact, which
# on a first census destroys the entire product of the flight.
#
# The route and seal verbs are SINGLE-PHASE - build / analyse / store are synchronous
# state mutation, so the read-back is a final answer with no TryComplete counterpart and
# no DeferralBudget row - so their 120 s budgets bound only the game-not-loaded defer and
# none of them can be the slow step.
budgetSeconds = 1200

[retry]
policy = "once"

[expectedFail]
bugId = ""
