# =====================================================================================
# THE ADMISSION OF A COMPLETE TWO-HOP SURFACE RELAY, driven end to end: `SealSlot` proves
# the relay tree is already fully sealed, and `RouteCommand action=create` promotes it
# into exactly ONE route (source rover B, destination rover A).
#
# **THE ID IS UNCHANGED AND THE PRODUCT IS INVERTED. READ THIS FIRST.**
# From 2026-09-02 until 2026-09-03 this lane pinned the REFUSAL of that same relay -
# a REJECTED create verdict, `status=MixedPickupDelivery`, `refusal=CandidateIneligible` -
# the literal `expect` value is deliberately NOT spelled here, because
# `RoverRelaySpecFixtureSyncTests` greps this whole file for it and a quoted obituary would
# read as a live pin (the standing "spec comments quote keys verbatim" trap) - and
# it was the first lane in the suite whose product was a refusal. It never flew in that
# shape. The id, the fixture and the driver are kept (status rows, `harness/README.md` and
# the roadmap all reference `RVR-5`); what flipped, and why, is set out in THE TWO REASONS
# THAT WENT AWAY below. A reader who finds a `RVR-5` citation describing a refusal is
# reading a pre-2026-09-03 document, not a contradiction.
#
# **LIVE-PROVEN 2026-09-02: run `2026-09-02_2244`, PASS attempt 1, wall 48 s, EVERY
# VERIFIER PASS** - expectations `mismatches=0`, analyzer `red=0`, `logValidate` PASS,
# ZERO Unity exceptions - on automation DLL sha256 `2f9309f5e3487257` (`main` + PR #1621).
# It flew ONCE, in the POSITIVE shape, and passed on the first attempt. Authored
# 2026-09-02 as a refusal lane, re-pinned positive 2026-09-03, flown the same day.
#
# WHAT THE FLIGHT MEASURED: `sealslot ... total=7 sealed=0 remaining=0
# alreadySealed=True`, `routecommand create gate ... eligible=True status=Eligible
# alreadyPromoted=False refusal=None`, one route named `relay` at `status=Paused`, and
# `saveParse` reading `routes count=1 statuses={Paused:1} stops=2 sourceRefs=3
# completedCycles=0 dormant=0` over `trees=3 recordings=9 branchPoints={Dock:2,Undock:2}`.
# Nothing below is a prediction any more; where the header still says "prediction" it is
# marked as the AUTHORED standing and is kept as history.
#
# -------------------------------------------------------------------------------------
# WHAT THE FIXTURE IS, AND WHY THE RELAY NEEDED A NEW ONE.
# `rover-relay-recorded` is the operator's hand-flown SANDBOX save `logistics-rover-B`
# (2026-09-02). Three identical 16-part rovers A, B and C sit on the KSC shore, all
# LANDED, each with ONE `ModuleCommand` and ONE `dockingPort2` and no grapple. Rover C
# drove to B, docked at UT 218.22, loaded +200 LiquidFuel (B 200 -> 0), undocked at UT
# 276.00, drove ~780 m to A, docked at UT 340.12, unloaded 126.8 LiquidFuel
# (A 200 -> 326.8), undocked at UT 402.50 and drove off. The save was written at UT
# 443.64 with C's recording stopped.
#
# STRUCTURALLY IT IS AN ELIGIBLE SUPPLY RUN: 3 committed trees, 9 recordings, 4 branch
# points (Dock 2 / Undock 2), 2 `ROUTE_CONNECTION_WINDOWS` with BALANCED resource deltas
# (+200 / -200 and -126.8 / +126.8), 2 `ENDPOINT_AT_DOCK` nodes, both windows
# TARGET-branch with a cross-tree partner recording - and 0 `ROUTES`, 0
# `PROMPTED_ROUTE_CANDIDATES`, 0 `ROUTE_ORIGIN_PROOF`, 0 route ledger actions. It is the
# ZERO-PROOF half of the relay pair: `rover-relay-c-recorded` (RVR-7) is the same shape
# with TWO WRONG proofs persisted, and the two together are what say the admission does
# not depend on a proof being present, absent OR correct. No older fixture can stand in:
# `rover-route-recorded` is a SINGLE-hop candidate host (RVR-2 promotes it) and
# `depot-route-recorded` already carries a route.
#
# -------------------------------------------------------------------------------------
# THE TWO REASONS THAT WENT AWAY, AND WHY THE OUTCOME FLIPPED. Both are recorded in full
# because the header used to argue the opposite conclusion from them, and the next reader
# has to be able to tell a settled question from an open one.
#
# THE RULING (operator, 2026-09-03) is the frame both sit in: "route candidates come from
# the ACTIONS: dock, take fuel or cargo FROM, undock, dock elsewhere, transfer TO, undock
# = a valid route". Under it, neither the vessel TYPE of a docked half nor the presence of
# a persisted origin proof is a candidacy precondition - the WINDOWS are.
#
# FORMER REASON 1 - NO ORIGIN PROOF, BECAUSE NEITHER DOCKED HALF IS A PLAYER-TYPED DEPOT.
#   **CLOSED as a blocker; the absence itself is unchanged and still in the bytes.** The
#   producer really did refuse both dock seams (the log lines below are still what these
#   bytes hold), and PR #1618 then moved the binding to the undock and off the depot type
#   entirely; the analysis-side follow-up derives the ORIGIN from the PICKUP WINDOW - the
#   vessel the transport took cargo FROM - rather than from a bound proof. So a relay with
#   ZERO proofs is admissible, which is exactly what this fixture now measures. The
#   standing todo entry ROUTE-ORIGIN-PROOF-REQUIRES-A-PLAYER-TYPED-DEPOT is what those
#   fixes discharge. WHAT THE PRODUCER DID, kept verbatim because these are still the only
#   committed bytes that hold its output:
#       RouteOriginProof skipped: no depot half recId=1461186781 vessel='rover C'
#           seams=2 candidates=0 isEva=False (neither docked half is typed Base or
#           Station, so no supply origin was recorded; set the depot's type in the
#           tracking station)
#   once per dock, from the source flight's collected KSP.log (`logs/2026-09-02_2041/
#   KSP.log`, lines 20911 and 24463). `seams=2 candidates=0` is the whole statement: the
#   producer SAW both dock seams and admitted neither, because all three rovers are
#   `vesselType = Rover`.
#   NOTE THIS IS A DIFFERENT ZERO FROM `rover-route-recorded`'s. There the producer skips
#   because both trees START AT A KSC SITE (the by-design KSC-origin skip); here it skips
#   after walking two real non-KSC dock seams. Same absence, different branch.
#
# FORMER REASON 2 - THE ANALYSIS REJECTED `MixedPickupDelivery`.
#   **FIXED by PR #1620 (2026-09-02, branch `inventory-kind-matching`).** The measured
#   refusal was real and is worth keeping on the record: over the relay tree in exactly the
#   shape this fixture ships (same log, line 28049, emitted in the same commit as
#   `NotifyLedgerTreeCommitted: tree='rover C' recordings=7`),
#       DeriveCandidates: trees=1 candidates=0 notSealed=0 ineligible=1 alreadyPromoted=0
#           dismissed=0 [missingProof=0 unorderableWindows=0 missingEndpoint=0
#           mixedPickup=1 noManifest=0 undockedStart=0 untrackedGain=0 flowNotClosed=0
#           startTrimUnsupported=0 unsupportedKind=0]
#   THE PLAYER MOVED THE **SAME** PART AND IT RE-HASHED IN TRANSIT. While docked at hop 1
#   the player moved one `DeployedCentralStation` and one `evaChute` out of B's inventory
#   into C's. The chute closed cleanly (transport gain 1, endpoint loss 1, ONE identity)
#   and so did the science kit; the station did not - it left B as `5072997a...` and
#   arrived on C as `5bcde9ad...`, because stock's
#   `ModuleInventoryPart.StoreCargoPartAtSlot(Part, int)` rebuilds a live
#   `ProtoPartSnapshot`, so `ModuleGroundExpControl.OnSave` adds a runtime-computed
#   `canComm = False` the craft-authored `STOREDPART` never had, and
#   `ComputeInventoryPayloadIdentityHash` hashed module-level values by design.
#   THE OPERATOR RULED STORED CARGO GENERIC and matched BY KIND - part name + variant +
#   per-resource fill bucket, module state ignored entirely - so the transit-added value no
#   longer touches the key. PROVEN HEADLESS OVER THESE EXACT FIXTURE BYTES by
#   `Source/Parsek.Tests/Logistics/InventoryPayloadKindKeyTests.cs`:
#   `HasUnwitnessedInventoryGain` now returns FALSE on window
#   `dock-218.22000000003783-target-2123618197` and `BuildInventoryLoadManifest` credits
#   the station. The two hashes are still in the committed bytes and
#   `RoverRelayRecordedFixtureDriftTests` still pins the whole gain/loss walk - the fixture
#   is unchanged; only what the analysis does with it moved.
#
# SO NOTHING REFUSES THIS RELAY ANY MORE, and the lane pins the admission instead. The
# ordering note the old header carried (that the mixed-pickup gate rejected BEFORE the
# proof gate was reached, so fixing one alone would not have helped) is now moot in the
# only way it could be: both were fixed.
#
# -------------------------------------------------------------------------------------
# THE ONE AUTHORING FACT THAT COST THE MOST TO ESTABLISH, RECORDED SO IT IS NOT REDONE.
# **`DeriveCandidates` IS NOT A LOAD-TIME PASS AND CANNOT BE A REQUIRED TOKEN HERE.**
# Its only two callers are `RouteRunPrompt` (the post-TREE-COMMIT prompt) and
# `LogisticsWindowUI` (only while that window is open, on a ~1 Hz throttle). The source
# flight's log carries exactly THREE `DeriveCandidates` lines and all three sit inside a
# merge-dialog commit - the very next line of each is `MergeDialog ... User chose: Tree
# Merge` - against SIX `Scenario OnLoad` lines that produce none. `trees=1` in all three
# is the same fact from the other side: the prompt derives over the ONE tree it just
# committed, not over the committed corpus.
# A driven headless run that only LOADS this fixture therefore prints NO `DeriveCandidates`
# line at all, and requiring one would red a correct run. What carries the same claim is
# TOKEN 3 below: `RouteCommandCreate` runs `RouteAnalysisEngine.AnalyzeTree(tree,
# Diagnostic)` SYNCHRONOUSLY inside the verb and prints the analysis status on its own
# gate line. That is a stronger instrument, not a weaker one - it names the status for the
# tree the step addressed, where the derive line only counts reasons.
#
# -------------------------------------------------------------------------------------
# THE STEPS, AND WHAT EACH ONE IS FOR.
#
# THE PROLOGUE IS RVR-1's / RVR-2's, STEP FOR STEP AND ARG FOR ARG, and it is SAFE ON
# THESE BYTES for a reason that was checked rather than inherited: **all three trees are
# COMMITTED and NONE is active.** The fixture carries ZERO `isActive` keys and ZERO
# `mergeState` keys, so `DiscardTree` - which discards the LIVE plain tree and never a
# committed one - answers OK with nothing-discarded, and `StopRecording` is
# idempotent-OK. The pair is there for the structural reason the recorded-host family
# records: the committed-tree restore path resumes a promotion-stub recording ~1 s into
# the scene, BEFORE any step can run. The `SetSetting autoRecordOnLaunch=false` stops a
# later one.
# ORDERING IS DELIBERATE: discard BEFORE any route verb. If a future edit ever made
# `DiscardTree` touch committed state, this lane would analyse a tree it had just deleted.
#
# STEP 6 - `SealSlot tree=<relay>`. THIS IS NOT SETUP; IT IS WHAT MAKES THE CREATE VERDICT
#   ATTRIBUTABLE EITHER WAY. `TestCommandRouteCommand.ClassifyCreateRefusal` walks
#   found -> dismissed -> sealed -> eligible and returns the FIRST failure, so a create
#   over an unsealed tree refuses `tree-not-sealed` and says nothing about candidacy. The
#   fixture carries no `mergeState` key anywhere (pinned builder-side by
#   `verify_seal_state`), so `RouteCandidateFinder.IsTreeFullySealed` is ALREADY true and
#   the verb is expected to answer the idempotent no-op: `total=7 sealed=0 remaining=0
#   alreadySealed=True`. `total=7` is the relay tree's own recording count, so a tree that
#   lost a member reds here rather than at the create. The asymmetry with the count row
#   below is deliberate: `recordings.count` admits a load-time optimizer split (max 11),
#   but this token does NOT - a split inside the relay tree would raise `total=` above 7
#   and red here while the count row passes. On a first census that red is a reading to
#   act on (re-pin `total=` to the measured tree size), not a defect.
#
# STEP 7 - `RouteCommand action=create`, EXPECTED **OK**. The verdict grammar, read from
#   `ParsekTestCommandAddon.RouteCommand.cs`: on any non-`None` refusal the verb calls
#   `SetExecResult("REJECTED", null, msg)`, so an OK verdict and the `refusal=None` token
#   are two INDEPENDENT instruments on the same fact (the GS-3 / H58 shape), and the
#   `routecommand rejected` forbid below is the third.
#   `interval=` is deliberately OMITTED so the driven create takes
#   `RouteCreationDialog.ComputeRootToUndockSpan(analysis, tree)` - the SAME helper both
#   production create paths funnel their default through, so a driven create and a player
#   create produce the identical interval for one analysis. `name = "relay"` is now
#   LOAD-BEARING where it used to be inert: the create is reached, so the name lands on
#   the built route and token 4 pins it.
#
# STEP 8 - `SaveGame`, so the produced save carries the `ROUTES` node this lane created.
#   The two report-only saveParse blocks read it and the census IS the product; a run that
#   quits without saving leaves the first census nothing to read.
#
# -------------------------------------------------------------------------------------
# WHAT THIS LANE DELIBERATELY DOES NOT PIN, and it is the same omission RVR-7 makes for
# the same measured reason. The fixture's save was written AFTER the relay ran, so the
# live endpoints are SPENT: `rover B` holds LiquidFuel 0 / 400 (it gave all 200 away) and
# `rover A` holds 326.8 / 400. `RouteOriginCargoCheck.HasRequired` is all-or-nothing, so a
# driven cycle over these bytes would BLOCK on the drained source rather than deliver.
# THIS LANE DRIVES NO CYCLE AT ALL - no `send-once`, no `TimeJump` - precisely so it does
# not have to reason about that: its product is the ADMISSION, and the dispatch half of
# the relay family belongs to RVR-7, whose header carries the full gate-order derivation.
#
# THE PAIRED FIXTURE. `rover-relay-c-recorded` (RVR-7) is the operator's SECOND relay,
# flown the same day: same three-rover shape, but it carries TWO PERSISTED
# `ROUTE_ORIGIN_PROOF` NODES AND BOTH NAME THE WRONG ORIGIN. Together the two lanes say
# the admission does not depend on a proof being present (this one has none), absent, or
# correct (that one's are wrong) - the WINDOWS decide.
# =====================================================================================
description = "LIVE-PROVEN 2026-09-02: run 2026-09-02_2244, PASS attempt 1, wall 48 s, EVERY VERIFIER PASS (expectations mismatches=0, analyzer red=0, logValidate PASS, zero Unity exceptions), on automation DLL sha256 2f9309f5e3487257 (main + PR #1621). THE ADMISSION OF A COMPLETE TWO-HOP SURFACE RELAY: three landed 16-part rovers on the KSC shore, C loads +200 LiquidFuel from B at UT 218.22, drives ~780 m, unloads 126.8 to A at UT 340.12, two TARGET-branch windows with cross-tree partner recordings and ZERO ROUTE_ORIGIN_PROOF nodes. MEASURED: SealSlot answered the idempotent no-op total=7 sealed=0 remaining=0 alreadySealed=True; the create gate read eligible=True status=Eligible alreadyPromoted=False refusal=None; one route named relay was built at status=Paused; saveParse read routes count=1 statuses={Paused:1} stops=2 sourceRefs=3 completedCycles=0 dormant=0, over trees=3 recordings=9 branchPoints={Dock:2, Undock:2}. THE ROUTE IS TWO STOPS, which the flight settled and no reading of the bytes could: stops=2, connectionKinds={DockingPort:2}, destinationVesselPids=[2123618197, 831319732] - both windows became STOPS of ONE route. THE ID IS UNCHANGED AND THE PRODUCT IS INVERTED, which is the history worth keeping. From 2026-09-02 until 2026-09-03 this lane pinned the REFUSAL of that same relay (a REJECTED create verdict, status=MixedPickupDelivery, refusal=CandidateIneligible) and it was the first lane in the suite whose product was a refusal. It never flew in that shape, because both fail-closed reasons it was authored around closed first. (1) NO ROUTE_ORIGIN_PROOF, because neither docked half was typed Base or Station: RouteOriginProof skipped: no depot half ... seams=2 candidates=0, once per dock (logs/2026-09-02_2041/KSP.log lines 20911 / 24463), all three rovers being vesselType = Rover. PR #1618 moved the binding to the undock and off the depot type, and the analysis-side follow-up derives the ORIGIN from the PICKUP WINDOW, so a relay with ZERO proofs is admissible - which is what this flight proves - and the standing todo ROUTE-ORIGIN-PROOF-REQUIRES-A-PLAYER-TYPED-DEPOT is discharged. (2) RouteAnalysisStatus.MixedPickupDelivery from an unwitnessed inventory gain (mixedPickup=1, same log line 28049), where the player moved the SAME DeployedCentralStation from B to C and it re-hashed in transit - FIXED by PR #1620, which rules stored cargo GENERIC and matches it BY KIND, proven headless over these exact fixture bytes by InventoryPayloadKindKeyTests. The operator ruling both fixes serve: route candidates come from the ACTIONS - dock, take fuel or cargo FROM, undock, dock elsewhere, transfer TO, undock = a valid route. THE SEAL STEP IS WHAT MAKES THE VERDICT ATTRIBUTABLE EITHER WAY: ClassifyCreateRefusal returns the FIRST failure of found -> dismissed -> sealed -> eligible, so an unsealed tree would have answered tree-not-sealed and the lane would have proved nothing about candidacy. routecommand rejected is the FORBID - the vacuity guard that says the relay was ADMITTED at the end of this lane. THIS LANE DRIVES NO CYCLE, and that is measured rather than omitted: the fixture's save was written after the relay ran, so the live source rover B is drained to LiquidFuel 0/400 against the window's 200 pickup manifest and the all-or-nothing RouteOriginCargoCheck.HasRequired would block a dispatch. The dispatch half of the relay family is RVR-7's, whose fixture is repaired to start-of-cycle for exactly that reason. ONE AUTHORING FACT ESTABLISHED FOR THE FAMILY: DeriveCandidates is NOT a load-time pass (its only callers are the post-tree-commit RouteRunPrompt and the Logistics window), so a driven run prints none and this lane pins the create verb's own synchronous gate line instead. PAIRED WITH RVR-7 over rover-relay-c-recorded, the operator's second relay, whose two persisted origin proofs both name the WRONG origin: together the two lanes say the admission does not depend on a proof being present, absent or correct - the WINDOWS decide. The saveParse structure and routes blocks stay REPORT-ONLY; the values are measured, but arming is a separate per-scenario operator decision."
instanceProfile = "stock-minimal"
tags = ["seam-verbs", "logistics", "route-candidacy", "route-create", "untyped-depot",
        "recorded-fixture", "RVR-5"]

[fixture]
# KNOWN DAMAGED BYTES SHIPPED ON PURPOSE: the two undock background children
# (`49eaec92...` rover B, `0f391265...` rover A) carry `maxDist` of ~735 km and a handful
# of leading flat POINTs that are anchor-local metre offsets written as lat/lon (todo
# UNDOCK-BG-CHILD-WRITES-RELATIVE-METRES-AS-FLAT-LAT-LON). No analyzer rule reads
# `maxDist` or range-checks flat points, so the analyzer verifier passes these bytes; a
# green analyzer row on this lane is NOT a clean bill for that defect.
# `rover-relay-recorded`, the relay harvest: the operator's hand-flown `logistics-rover-B`
# SANDBOX save, collected 2026-09-02, harvested `--keep-parsek --expect-situation
# ORBITING` and finished by `harness/tools/build_rover_relay_recorded.py`. Pinned shape in
# `harness/lib/test_saveparse.py::RECORDED_FIXTURES`; the two route windows, the seal
# state, the cross-tree links, the unwitnessed-gain hashes and the three-rover geometry
# are pinned builder-side and wired in by `RoverRelayRecordedFixtureDriftTests`.
#
# WHAT THIS LANE NEEDS FROM IT, beyond the shape:
#   * ALL THREE TREES FULLY SEALED (no `mergeState` key anywhere) - step 6.
#   * NO `ROUTES` and NO `PROMPTED_ROUTE_CANDIDATES` - so the create is not answered
#     `candidate-already-promoted`, and so there is no prior offer to confuse the reading.
#   * NO `DISMISSED_ROUTE_CANDIDATES` - a dismissed tree is skipped BEFORE the analysis,
#     which would refuse the create for a reason that has nothing to do with candidacy.
#   * NO `ROUTE_ORIGIN_PROOF` anywhere. That absence used to be refusal reason 1; it is
#     now the LANE'S SUBJECT, because a relay admitted with zero proofs is what says the
#     origin comes from the pickup WINDOW. The paired RVR-7 fixture holds the other half
#     (two proofs, both wrong).
#   * the window-1 inventory hash mismatch, which is now INERT (kind matching, PR #1620)
#     and is kept because it is still the only committed subject the re-hash has.
#
# MEASURED on the committed bytes: THREE committed trees (`d33027c4` rover B's launch, 1
# recording; `c7324bee` rover A's launch, 1; `87fba47a` the relay, 7), NINE recordings,
# TWO route windows, FOUR branch points (Dock 2 / Undock 2), ZERO of everything in the
# list above, and no `mergeState` key. Save clock UT 443.64, Mode SANDBOX, 6 FLIGHTSTATE
# vessels of which 3 are real. Active vessel index 1: `rover C`, type=Rover, sit=LANDED,
# 16 parts, 2 `ModuleInventoryPart`, LiquidFuel 273.2 / 400, ElectricCharge 922.3 / 1000,
# NO BaseConverter and NO BaseDrill. The three rovers sit 336 m / 783 m / 983 m apart.
#
# THE ACTIVE VESSEL IS A BUILDER EDIT AND IT IS LOAD-BEARING. The source was saved from
# the SPACE CENTER, so KSP left `activeVessel = 0` pointing at a stock asteroid in solar
# orbit; that save BOOTS (`IsLoadedGameFocusable` accepts it) straight into deep space
# with all three rovers unloaded. The builder re-points to `rover C`.
#
# `mapRenderTracing = True` IS INHERITED AND LEFT ALONE. `rover-route-recorded` carries
# the same value and RVR-1 / RVR-2 / H56 / H59 all fly it green with
# `allowedAnomalies = []`, so it is a proven-safe setting rather than an oversight; a
# builder that flipped it would depart from the sibling for no measured reason.
#
# `injectedRecordings = "none"` is REQUIRED rather than chosen: the payload is carried by
# the TEMPLATE, and injecting a synthetic corpus would give `RouteAnalysisEngine` other
# trees to consider and make the create's candidate resolution un-attributable.
saveTemplate       = "fixtures/saves/rover-relay-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                    expect = "OK" },
  { cmd = "DiscardTree",                                                      expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SealSlot",     args = { tree = "87fba47a981e4c86a598fe855a6e8113" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "create", tree = "87fba47a981e4c86a598fe855a6e8113", name = "relay" }, expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                         expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# BOOT FACTS ONLY, AND NO D10 VALUE IS CLAIMED EVEN AFTER THE GREEN FLIGHT. The obvious
# candidate is `candidate-detection` (this lane DOES find one, where the refusal shape
# found none by construction), and it stays unclaimed for the reason that outlives the
# census: H34 / H35 already own that row, and re-declaring a covered row inflates the
