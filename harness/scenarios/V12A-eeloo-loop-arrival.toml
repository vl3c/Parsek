allowedAnomalies = []

[expectations.recordings]
# RE-PINNED {6,6} on pass 2, from the interim {5,8}, and the +1 over the fixture's own
# measured 5 is IDENTIFIED rather than inferred: both retarget runs emit
# `[Optimizer] SplitAtSection: split 20d890f9f34b466fb8be07d83103a9a7 at UT=224.5`, the
# ordinary deterministic load-time ascent split (Atmospheric -> ExoBallistic), which is
# the SAME mechanism AND THE SAME UT the Dres lanes measured. Recording is OFF throughout,
# so the TimeJumps cannot author anything. saveParse agrees on both runs: recordings 6,
# trees 1, committedTrees 1, terminalStates {Orbiting 3, Destroyed 2}, branchPoints
# {JointBreak 3}, points total 1,685 largest 1,275 smallest 21 unparsed 0.
# DO NOT WIDEN: a 7 means a second split appeared (most likely the V9 cohesion fix
# regressing at the Kerbin->Sun handoff), a 5 means the ascent split stopped, an 8 means a
# scene-entry promotion survived the stub-kill triple. Each of those is a finding.
count = { min = 6, max = 6 }

[expectations.logContracts]
# ARMED POSTURE (2026-08-13). Every token below was verified byte-identical across BOTH
# green retarget runs (`_1513` / `_1515`) before arming, and each also reproduces
# iteration 1's reading. The header's WHAT THIS LANE ARMS section carries the reason each
# one earned it, and WHAT IS STILL DELIBERATELY NOT ARMED carries the reason for each
# omission (the census pair, `suppressed=122`, the candidate count, and the schedule
# digits V12 already owns).
required = [
  "MissionConfig",
  "StartLoopPlayback",
  # The classification: cycle 0 re-aims rather than replaying faithfully.
  "ENGAGED re-aim Kerbin->Eeloo via Sun",
  # THE HEADLINE, armed on the measurement and NOT on the prediction: the disposition at
  # Eeloo's 6.15 deg is noop/in-plane, because the solved conic's 4.0725 deg is BELOW the
  # 6.6500 bound so the excessive-tilt gate never opened (incAch NaN, inc-after ==
  # inc-before). This is a FINDING, filed as REAIM-TILT-NOOP-AT-EELOO-6.15-DEG: Eeloo
  # tested the BOUND ARITHMETIC, not the retention branch.
  "tilt-correction inc-before=4.0725 bound=6.6500 targetInc=6.1500 incAch=NaN inc-after=4.0725 state=noop reason=in-plane",
  # The DERIVABLE half of that literal, armed separately ON PURPOSE: Max(Max(0, 6.15), 0)
  # + 0.5 = 6.65, both F4 and adjacent in the format string. It survives a legitimate
  # change in the geometry that the whole literal would not, so the PAIR of tokens
  # diagnoses a red -- this one green with the literal red means the solved conic moved;
  # both red means the bound arithmetic itself moved. A copied Dres bound=5.5000 would red
  # a CORRECT Eeloo run.
  "bound=6.6500 targetInc=6.1500",
  # The eccentric-target band at e=0.26: clamp(0.06 + 0.5 x 0.26, 0.06, 0.20) = 0.19
  # exactly, cap NOT engaged. THIS PINS THE COMPUTATION HALF ONLY of the M-MIS-3
  # placeholder debt -- devFromRecorded=0s means step 0 was accepted and the expansion
  # band was never walked, so the BEHAVIOURAL half stays open
  # (M-MIS-3-BAND-COMPUTED-NOT-EXERCISED). See the header's M-MIS-3 CLAIM, NARROWED.
  "eTarget=0.2600 halfWidthFraction=0.1900",
  # The synth geometry, all three proximity checks. The SOI constant is armed on the
  # MEASUREMENT (119082942), not on the independent a*(m/M)^0.4 derivation that returned
  # 119082941 -- see the header. @soi=0m rather than Dres's 32832839m because soiEntryUT
  # == arrivalUT on this lane.
  "xfer-vs-Kerbin@depart=0m",
  "xfer-vs-Eeloo@arrival=0m",
  "xfer-vs-Eeloo@soi=0m \\(SOI=119082942\\)",
  # The ready line: cycle 0 re-aims to a real Eeloo encounter at candidate step 0, and
  # its SOI crossing lands at D0 + tof to the digit (no Dres-style centre-arrival gap).
  "re-aimed transfer ready: departUT=54007648.196326263",
  "soiEntryUT=95851632.03180024",
  "devFromRecorded=0s",
  "encounter=Eeloo",
]
# The ERROR floor, plus the ONE decline the tilt-retention fix removed. NARROWED from
# V10's bare "state=declined": the candidate sweep legitimately emits per-candidate
# declines of four other reasons (degenerate-rotation / sane-fail / handedness-flip /
# residual-tilt) on a window that ultimately resolves, and Eeloo would sweep a DERIVED 77
# candidates against Dres's 53 at a higher tilt where the 90 deg retrograde ceiling is
# closer. `reason=unreachable-plane` is the specific pre-fix regression, and the shipped
# code can no longer emit it with `state=declined` at all -- zero false-positive surface,
# same regression floor. Note the count is only observable ON a decline (both emitters sit
# on the failure path), so 77 is derived, never measured here.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "state=declined reason=unreachable-plane",
]

[runtime]
# V10's budget class for the same seam-driven shape and step count. No flight: a
# LoadGame, ~28 seam verbs and a quit; the epoch jumps are instant, so the budget is
# dominated by the KSP boot and the fixture load (V10 measured well inside this).
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
