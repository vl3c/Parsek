  # around (D0 + tof) - 61,000 on the hypothesis that a centre-arrival -> boundary
  # crossing gap generalises from Dres. IT DOES NOT: here soiEntryUT == D0 + tof to the
  # digit, and iteration 1 duly read `evaluated=0 skip.no-usable-ratio=1`.
  { cmd = "TimeJump", args = { ut = "95851442.032" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "TimeJump", args = { ut = "95851572.032" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "TimeJump", args = { ut = "95851812.032" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },

  # (e) Parked tail, INSIDE the MEASURED rendered window: phaseAnchor + compressedSpan =
  # 53,969,923.596983388 + 41,950,304 = 95,920,227.597, so this sits 120 s inside its end.
  # Deliberately not past it -- that is the V8 _0810 line-blink shape. Iteration 1's
  # 95,920,106 was +1.597 s off; the compressedSpan derivation was right.
  { cmd = "TimeJump", args = { ut = "95920107.597" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

