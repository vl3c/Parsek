  # there is ~20.9M s of slack either side, which is why iteration 1's estimate (only
  # -8.886 s off) already got every tilt / band / ready token this lane reports.
  { cmd = "TimeJump", args = { ut = "74929640.114" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },

  # (d) THE CENSUS SEAM. Offsets -190 / -60 / +180 around the PRODUCT'S OWN MEASURED
