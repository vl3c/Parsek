schema = 1
id = "V12A-eeloo-loop-arrival"
# =====================================================================================
# V12A: THE EELOO PROGRAM'S ARRIVAL LANE. V10's shape pointed at the Eeloo fixture:
# a driver that TIME-JUMPS INTO the re-aimed Kerbin->Eeloo transfer so the per-window
# synthesizer runs and the render path reaches the arrival seam.
#
# WHY IT EXISTS, and it is the same structural gap V9/V10 named at Dres. A player-loop
# lane (V12) marks the tree a loop unit, starts loop playback and quits ~1 s later. The
# transfer SYNTHESIZER runs from `ReaimPlaybackResolver` while resolving the re-aimed
# heliocentric leg, and the seam-endpoint CENSUS rides the map render path -- neither is
# reached by a run that ends at the relaunch. So V12 can prove the unit ENGAGED and read
# the schedule, but the tilt disposition, the tof band and the ready line belong here.
#
# THE FOUR QUESTIONS THIS LANE ASKS:
#   1. THE TILT DISPOSITION AT EELOO'S 6.15 DEG. This is the tilt-retention fix's
#      HIGHEST probe: Eve 2.1 -> Dres 5.0 -> Eeloo 6.15, the last stock step below the
#      7 deg Moho case the synthesizer's own comments name as the failing population.
#      The plan's claim scope is explicitly "Eve only ... Moho/Dres/Eeloo are unmeasured
#      collateral", so EVERY disposition here is a finding to report verbatim, not to
#      fix in this lane and not to soften. See THE TILT, below, for the four outcomes.
#   2. THE ECCENTRIC-TARGET TOF BAND. Eeloo (e = 0.26) is the fixture
#      `ReaimTofSearch`'s two MEASURE-FIRST PLACEHOLDER constants were written to be
#      pinned against -- both `EccGain` and `MaxHalfWidthFraction` carry
#      "PLACEHOLDER - pin against the Eeloo fixture" in the source, and the open
#      validation debt is item (3) of the validation-debt list in
#      docs/dev/todo-and-known-bugs.md ("eccentric-target Eeloo/Moho constant
#      pinning (M-MIS-3)"). This lane is where that debt is discharged.
#   3. THE SEAM-ENDPOINT CENSUS at the arrival. Read, NOT armed -- see the census trade
#      carried from V10 below.
#   4. THE RE-AIMED TRANSFER READY LINE for cycle 0 -- departUT and devFromRecorded.
#
# =====================================================================================
# THIS IS A TWO-PASS LANE BY CONSTRUCTION, AND THAT IS THE LANE'S DEFINING CONSTRAINT.
#
# The seven jump UTs are arithmetic on five quantities that only a PRIOR READING RUN's
# log carries: `phaseAnchor`, `D0`, `tof`, the loiter cut, and -- critically -- the
# RE-AIMED ARC'S OWN `soiEntryUT`, which is NOT the recorded arrival mapped through the
# replay clock. V10 iteration 1 made exactly that mistake at Dres and the census
# answered `evaluated=0 skip.no-usable-ratio=1`: the re-aimed conic is a DIFFERENT
# conic and its SOI crossing sat 18,067 s earlier than the bracket.
#
# So: the UTs committed below are PASS-1 ESTIMATES, derived in the ESTIMATE ARITHMETIC
# block that follows and labelled as estimates everywhere they appear. Pass 1 is a
# READING run whose real job is to print the five quantities. Pass 2 recomputes all
# seven from the log, by this recipe:
#
#   Read from `ReaimPlaybackResolver`'s `re-aimed transfer ready:` line
#       departUT (= D0), tof, soiEntryUT
#   and from the `MissionLoopUnit:` Info line
#       phaseAnchor, compressedSpan, loiterCuts / cutSeconds
#   then:
#     jump 1 = phaseAnchor + 120                    cycle-0 Kerbin ascent leg
#     jump 2 = D0 + 600                             post-seam escape observation,
#                                                   POST-D0 ONLY (see NO PRE-D0 JUMP)
#     jump 3 = D0 + tof/2                           mid-transfer: the jump that makes
#                                                   the synthesizer resolve the window
#                                                   and the tilt gate run. THE STEP
#                                                   V12 STRUCTURALLY CANNOT TAKE.
#     jumps 4/5/6 = soiEntryUT - 190 / - 60 / + 180 bracket the PRODUCT'S OWN
#                                                   soiEntryUT off the ready line,
#                                                   never the recorded arrival
#     jump 7 = phaseAnchor + compressedSpan - 120   parked tail, INSIDE the rendered
#                                                   window (not past it -- that is the
#                                                   V8 _0810 line-blink shape)
#
#   Then fly the recomputed shape twice byte-identically, then arm what it measured,
#   then a negative control (invert one armed window, confirm PARSEK-FAIL, revert).
#
# =====================================================================================
# THE ESTIMATE ARITHMETIC (pass 1 only -- every number here is DERIVED, not measured)
#
# Measured inputs, all from B21-eeloo-orbit run `2026-08-12_2239` (PASS attempt 1,
# 3,092 s wall) and from the committed fixture that run produced. `_2239` and NOT the
# earlier green `_2003`: `_2003`'s produced save was destroyed 53 s after it ended by a
# sibling run sharing the same `saveTemplate` leaf (HARNESS-PRODUCED-SAVE-CLOBBERED-BY-
# SIBLING-RUN in docs/dev/todo-and-known-bugs.md), so the committed BYTES are `_2239`'s
# and every pin must be measured against them.
#
#   recorded span      [26.2, 47,036,743.9]        spanDur 47,036,717.7
#   LKO ejection wait  TRANSFER-BURN 2,703.9 -> COAST-TO-TARGET 5,096,457.1
#                                                  = 5,093,753.3 game s
#   Kerbin->Sun escape recorded ut 5,124,183.6     (first heliocentric frame)
#   Sun->Eeloo arrival recorded ut 46,968,150.4    (TARGET-FLYBY entry)
#   heliocentric coast 41,843,966.8 game s         (escape -> SOI entry)
#
# Estimated schedule:
#   synodic   Kerbin-Eeloo   9,776,696.33 s   (exact-period derivation; the same method
#             reproduces the product's emitted Dres synodic 11392903.305957612 to
#             0.004 s, so it is right to ~9 figures and STILL wrong for an R-format
#             substring pin -- which is why no synodic/cadence digit token is armed)
#   spanDur / synodic = 4.8111  ->  multiple 5  ->  cadence ~ 48,883,481.6
#             THE MULTIPLE IS THE FIRST PREDICTION WORTH RECORDING: Dres got 2 (at
#             1.79) and Eve got 2 (at 1.07). Eeloo is the first >= 3 this suite has
#             predicted, and it is a consequence of the long coast, not of the target.
#   loiter cut ~ [2,703.9, 5,096,457.1], len ~ 5,093,753.3  (the LKO ejection-window
#             wait; at Dres the emitted cut len 8,436,248 sat ~9,000 s inside the
#             measured wait, so treat this as an upper estimate)
#   compressedSpan ~ 47,036,717.7 - 5,093,753.3 = 41,942,964.4
#   phaseAnchor ~ spanStart + cadence + cutLen = 53,977,261
#             THIS RELATION IS EMPIRICAL, calibrated on ONE point: at Dres it gives
#             26.24 + 22,785,806.61 + 8,436,248 = 31,222,080.85 against the emitted
#             31,222,080.6814808, a 0.17 s residual (inside the rounding of the quoted
#             cut length). It is also self-consistent as "the first whole cadence
#             boundary after the save's own UT". One point is not a law: if pass 1
#             prints a phaseAnchor that is a whole cadence away, that is the estimate
#             failing, not the product.
#
#   replay(R) = phaseAnchor + (R - spanStart) - (R > cutEnd ? cutLen : 0)
#   D0  ~ 54,007,665      (replay of the recorded escape)
#   tof ~ 41,843,967      (recorded arrival - recorded escape; devFromRecorded=0
#                          would make the used tof exactly this)
#   D0 + tof ~ 95,851,632 = the replay of the recorded arrival
#   rendered window ends ~ 95,920,225 = phaseAnchor + compressedSpan
#
# THE ARRIVAL BRACKET, and this is where V10's iteration-1 lesson is GENERALISED rather
# than merely avoided. `arrivalUT` is where the Lambert conic reaches the target's
# CENTRE; `soiEntryUT` is where it crosses the SOI boundary, necessarily EARLIER. At
# Dres the gap measured 18,067 s against a modelled ~20,700 s SOI-crossing -> periapsis
# coast, i.e. 0.87 of it -- so the 18,067 s was not arbitrary geometry, it was one
# approach time. B21 measured Eeloo's own approach at 69,895.611 s (KSP's own ttPe on
# the first in-SOI frame), so the estimate is
#       soiEntryUT ~ (D0 + tof) - 0.87 x 69,896 ~ 95,851,632 - 61,000 = 95,790,632
# with a HONEST +-35,000 s uncertainty: the re-aimed conic's periapsis is not the flown
# one's, the 0.87 factor rests on a single Dres point, and the mechanism itself
# (centre-arrival vs boundary-crossing) is a hypothesis cross-checked once. Pass 1's
# arrival bracket will very probably MISS, and that costs nothing: the tilt, tof-band
# and ready tokens all come from jump 3, and the census is not armed anyway.
#
# ONE PROPERTY OF THE ESTIMATE THAT WAS CHECKED RATHER THAN ASSUMED: jump 1 sits
# 30,284 s before D0 (the post-ejection Kerbin-SOI climb-out, 5,124,183.6 - 5,096,457.1,
# plus the pre-cut head). V10's equivalent jump sat 54,543 s before its D0 and never
# raised the detector, while the three placements that DID raise sat 60 / 300 / 900 s
# out. 30,284 s is two orders of magnitude clear of the widest raising placement.
#
# =====================================================================================
# ITERATION HISTORY CARRIED FROM V10 -- this is V10's measured Dres history, reproduced
# because it is the reason this lane's step list has the shape it has. Nothing below was
# measured at Eeloo.
#
#   iteration 1 -- FLOWN 2026-08-12_0326, PARSEK-FAIL(anomaly), and it did its job:
#     the synthesizer ran, all three questions got answers, and two things needed
#     moving.
#       (i)  THE DEPARTURE DERIVATION WAS EXACTLY RIGHT. The product's own
#            `re-aimed transfer ready` line reports
#            departUT=31,276,742.826743945 -- identical to the D0 that header
#            derives, to the digit. The escape bracket stays where it is.
#       (ii) THE ARRIVAL BRACKET WAS ON THE WRONG SEAM. It was placed at the
#            RECORDED arrival mapped through the replay clock (43,162,644.6). The
#            re-aimed transfer does not enter Dres's SOI there: the ready line
#            reports soiEntryUT=43,144,577.773317166, which is 18,067 s EARLIER.
#            That is not drift, it is geometry -- the re-aimed conic is a different
#            conic, and its SOI crossing is its own. The census duly read
#            `evaluated=0 skip.no-usable-ratio=1`, i.e. it was asked about a seam
#            the arc does not have.
#       (iii) LINE-BLINK at the escape bracket: `currentUT=31276682.680 ...
#            sinceFrames=1 body=Sun`, i.e. the two straddling jumps
#            31,276,552 -> 31,276,682 landed one visual frame apart. This is the V8
#            detector gap exactly.
#   iteration 2 -- FLOWN 2026-08-12_0329, PARSEK-FAIL(anomaly), and the re-bracket
#     WORKED: the census went `evaluated=0 skip.no-usable-ratio=1` ->
#     `evaluated=1 outsideSoi=0`, which is the rendered-arrival proof that lane was
#     written for. Tilt and ready lines reproduced identically. But line-blink went
#     1 -> 2, and reading WHERE settled what it is: both hits are the SAME jump,
#     31,276,682, at `sinceFrames=1`. That is not inter-jump pacing -- adding
#     spacers around it gave it more frames and it toggled twice instead of once.
#     A 1-frame toggle inside ONE jump's settle means the jump LANDED ON the
#     Sun-leg line's own window edge: 31,276,682 sits 60.8 s before D0
#     31,276,742.83, i.e. within a frame of where the heliocentric leg's line
#     switches on. Spacers cannot fix a toggle that happens inside one settle.
#   iteration 3 -- FLOWN 2026-08-12_0331, PARSEK-FAIL(anomaly). Moving the escape
#     bracket clear of the edge (-900 / -300 / +600) did NOT clear the blink: it
#     followed the middle jump to its new UT, `31,276,442.640 sinceFrames=1
#     body=Sun`. Three runs, three placements, same shape -- so the trigger is not a
#     particular UT edge, it is ANY jump landing in the pre-D0 region: the Sun-leg
#     proto line toggles within one frame because the CLOCK is outside its window,
#     which is exactly the filed V8 detector gap (`bodyChanged` cannot see a
#     clock-leaves-window transition). That lane did not open that gap and cannot
#     close it by pacing.
#   iteration 4 -- FLOWN 2026-08-12_0333 and _0335, both PASS, zero anomalies, and
#     ARMED on them. The pre-D0 jumps are REMOVED; the escape leg keeps one
#     post-seam observation (+600).
#
#     THE ONE THING THAT COST, stated plainly rather than buried: dropping those
#     jumps also dropped the census's SECOND line. Iterations 2 and 3 both emitted
#     `seam-endpoint summary evaluated=1 outsideSoi=0` -- the rendered-arrival proof
#     -- and iteration 4 emits only `evaluated=0 skip.no-usable-ratio=1`. So the
#     census evaluating at all depends on the render having passed through the
#     pre-D0 state, and reaching that state reproduces the filed detector gap. The
#     two cannot both be had in one lane today.
#
#     THE CHOICE, and why: the armed lane is the GREEN one. The census reading is
#     not lost -- it is MEASURED, twice, and recorded here and in the status doc
#     (`evaluated=1 outsideSoi=0`, suppressed 279 / 273) -- but a permanently
#     red-by-detector-gap lane makes a poor regression floor, and the arrival proof
#     is independently carried by a token that lane DOES arm: the synth geometry
#     line's `xfer-vs-Dres@arrival=0m` and `xfer-vs-Dres@soi=32832839m
#     (SOI=32832840)`, i.e. the re-aimed conic meets Dres's SOI boundary to within
#     one metre. That is the same claim the census makes, from the synthesizer
#     rather than the renderer, and it is deterministic on every run.
#     If the detector gap is ever closed, restore iteration 3's escape bracket
#     (-900 / -300 / +600) and arm the census pair too.
#
# HARD CONSTRAINT CARRIED FORWARD: NO PRE-D0 JUMP in the escape bracket. The filed
# finding is LINE-BLINK-JUMP-STRADDLE-DETECTOR-GAP in docs/dev/todo-and-known-bugs.md.
# `RecordingState` spacers CANNOT fix it -- the toggle happens inside one jump's settle.
#
# =====================================================================================
# WHAT THIS LANE ARMS PRE-FLIGHT, AND WHY EACH IS DERIVABLE TO THE DIGIT
#
#   "bound=6.6500 targetInc=6.1500"
#     `ReaimTransferSynthesizer.InclinationBoundDegrees(l, t) = Max(Max(l, t), 0) +
#     InclinationToleranceDegrees`, with the tolerance a compile-time 0.5. Kerbin's
#     orbital inclination is 0, Eeloo's is 6.15, so bound = 6.65 and targetInc = 6.15,
#     both F4. `LogTiltCorrection` emits `bound={F4} targetInc={F4}` adjacently, so the
#     pair is one contiguous substring. A COPIED DRES `bound=5.5000` WOULD RED A
#     CORRECT EELOO RUN -- that is the whole reason this token is spelled out here.
#
#   "eTarget=0.2600 halfWidthFraction=0.1900"
#     `ReaimTofSearch.HalfWidthFraction(e) = clamp(0.06 + 0.5*e, 0.06, 0.20)`; Eeloo's
#     e = 0.26 gives 0.06 + 0.13 = 0.19 EXACTLY, and the 0.20 cap is NOT engaged (it
#     would need EccGain >= (0.20-0.06)/0.26 = 0.5385, so the shipped 0.5 sits 7.7%
#     below engagement). Emitted adjacently on the ready line
#     (`ReaimPlaybackResolver`). PINNING THIS CLOSES THE M-MIS-3 VALIDATION DEBT FOR
#     `EccGain` AT 0.5: it is the only band token that is a pure function of a value
#     stored exactly in the body config rather than of flight geometry. Note the
#     consequence for any future re-pin: raising `EccGain` past 0.5385 immediately
#     engages the 0.20 cap and changes both this token AND the candidate count.
#
# BOTH ARMS ARE ALSO A BET, and it is recorded rather than hidden: their PRESENCE
# assumes the window resolves far enough for the synth to reach the tilt block and emit
# a ready line. If the Eeloo unit classifies FAITHFUL on a member-topology failure (a
# physics-frame ejection that still splits -- the deliberately-unfixed class), this lane
# reds on a legitimate finding. That trade is taken deliberately: these two tokens are
# the measurement the Eeloo program exists to take, and a red saying "the synth never
# ran" is worth more than a green saying nothing. Diagnose it as member topology FIRST
# (`ReaimDiag` member lines), not as a tilt failure.
#
# WHAT IS DELIBERATELY *NOT* ARMED, EACH WITH ITS REASON
#
#   THE SOI CONSTANT `(SOI=119082942)`. It is `targetBody.sphereOfInfluence.ToString
#   ("F0")` and looks derivable -- but an independent computation from the stock mass
#   table, a * (m/M)^0.4 with a = 90,118,820,000, m = 1.1149224e21, M = 1.7565459e28,
#   returns 119,082,940.97 -> "119082941", ONE METRE off the 119082942 the program's
#   own notes carry. KSP stores gravParameter and derives Mass, so the last digit is a
#   rounding artefact of which end of that conversion you start from. A digit that two
#   independent derivations disagree on is not "derivable to the digit". MEASURE IT on
#   pass 1, then arm the full V10-shaped token
#   `xfer-vs-Eeloo@soi=<MEASURED>m \(SOI=<MEASURED>\)` in one piece.
#
#   THE METRE VALUE `xfer-vs-Eeloo@soi=<N>m`. Never derivable: Dres read 32832839
#   against SOI=32832840, one metre inside the boundary. Measure.
#
#   `xfer-vs-Eeloo@arrival=0m`. ~0 by construction (the Lambert connects r1->r2
#   exactly) and it read exactly 0 at Dres, but it is a rendered-arrival CLAIM and this
#   is a reading pass. Arm it on pass 2 with the rest of the geometry line.
#
#   THE TILT DISPOSITION ITSELF. Predicted `state=retained reason=unreachable-plane`
#   (the two measured points give incAch/targetInc = 0.588 at Eve and 0.729 at Dres, so
#   Eeloo extrapolates to incAch ~ 4.0-4.5 and |incAch - 6.15| > 0.5 -> gate UNSAFE ->
#   Retain), but 6.15 deg is the highest tilt the retention arm has ever been probed at.
#   ALL FOUR OUTCOMES ARE FINDINGS, NOT FAILURES:
#     * `state=retained reason=unreachable-plane` -- the prediction;
#     * `state=noop reason=in-plane` -- the solved conic came in at <= 6.65 deg. NOTE,
#       AND THIS CORRECTS A CLAIM MADE IN THE PROGRAM'S OWN PLANNING NOTES: a Noop DOES
#       emit a tilt line (`ReaimTransferSynthesizer.cs`, the `else` arm of the
#       disposition switch, `"noop", "in-plane"`). ABSENCE of a tilt line therefore
#       does NOT mean Noop -- it means the synth never reached the tilt block at all,
#       which is a different and larger finding;
#     * `state=fired reason=ok` -- incAch landed within 0.5 of 6.15; the correction
#       fires and may then die downstream on sane-fail / handedness-flip /
#       residual-tilt / degenerate-rotation;
#     * a retained conic exceeding 90 deg flipping `IsRetrogradeTransfer` into a
#       direction-mismatch decline. Fail-closed and CORRECT, and materially closer at
#       6.15 deg than at Eve's 2.1 -- the measured Eve band topped out at 87.48.
#
#   `departUT` / `devFromRecorded=0s`. `devFromRecorded=0s` holds only if cycle 0
#   resolves at CANDIDATE STEP 0; a non-step-0 window re-times the arrival and the
#   oracle refuses with `reaimed-seam-instant-unknown`. Measure both.
#
#   THE CENSUS. `seam-endpoint summary evaluated=1 outsideSoi=0` only appears when the
#   render passed through the PRE-D0 state, and every such jump reproduces the filed
#   detector gap -- see V10 iteration 4's trade above. The census stays a documented
#   READING. Restoration recipe if the gap is ever closed: restore iteration 3's escape
#   bracket (-900 / -300 / +600) and arm the census pair too.
#
#   THE CANDIDATE COUNT. Eeloo probes a DERIVED 77 candidates (1 + 2*maxSteps, with
#   maxSteps = round(0.19/0.005) = 38) against Dres's 53 and Eve's 27. DERIVED, NOT
#   MEASURABLE ON A GREEN RUN: both emitters are on the failure path (`synth failed
#   across N tof candidates` and `reaim window fell back faithful: ... candidates=N`),
#   so on success there is no count at all. SEEING `candidates=77` IN A LOG MEANS THE
#   WINDOW DECLINED.
#
# THE `state=declined` FORBID IS NARROWED FOR EELOO. V10 forbids the bare substring
# `state=declined`. That is a whole-log scan, and the candidate sweep can legitimately
# emit per-candidate declines (`degenerate-rotation` / `sane-fail` / `handedness-flip` /
# `residual-tilt`) on a window that ULTIMATELY RESOLVES -- the counter comment in
# `ReaimTransferSynthesizer` says so in as many words. Dres got away with the bare
# substring on 53 candidates; Eeloo sweeps 77 at a higher tilt where the 90 deg
# retrograde ceiling is closer, so the bare form is a false-positive waiting to happen.
# Narrowed to `state=declined reason=unreachable-plane`, which is the SPECIFIC
# pre-retention-fix regression V10 actually cares about and which the shipped code can
# no longer emit at all (an unreachable plane now RETAINS). Zero false-positive surface,
# same regression floor.
#
# OTHER PREDICTIONS RECORDED HERE, NONE OF THEM ARMED:
#   * `ENGAGED re-aim Kerbin->Eeloo via Sun` -- the string is fully derivable from
#     `MissionLoopUnitBuilder`, but it is a prediction about product behaviour.
#   * `PhaseLock` reads `UnsupportedCrossParent` (Eeloo is not a child of Kerbin,
#     exactly as Dres). Not a defect.
#   * cadence multiple 5, the suite's first prediction above 2.
#   * recordings: 6 = the fixture's measured 5 plus one deterministic load-time ascent
#     split (Dres's landed at ut 224.5). The window below is wider than the prediction
#     on purpose -- it is a reading pass.
# =====================================================================================
tier = "operator"
description = "READING RUN (pass 1 of two): the Eeloo program's arrival lane -- TimeJump into the re-aimed Kerbin->Eeloo transfer so the per-window synthesizer runs, to read the tilt disposition at Eeloo's 6.15 deg inclination, the eccentric-target tof band that pins the M-MIS-3 placeholder constants, the seam-endpoint census at the arrival, and the cycle-0 re-aimed-transfer-ready line. The seven jump UTs are pass-1 estimates; the header carries the recipe for recomputing them from this run's own log."
instanceProfile = "stock-minimal"
tags = ["V12A", "eeloo", "loop", "playback", "reaim", "tilt"]

[fixture]
# The committed B21 recording, harvested --keep-parsek from run 2026-08-12_2239.
saveTemplate       = "fixtures/saves/eeloo-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

# V10's plumbing verbatim (stub-kill triple + the three tracers + MissionConfig +
# StartLoopPlayback), then the jumps.
#
# PACING SPACERS ARE LOAD-BEARING, the V8 finding verbatim:
# `MapRenderTrace.IsLineBlink` raises when a proto line's ON/OFF toggle pair lands
# within LineBlinkFrameWindow = 8 VISUAL frames (`MapRenderTrace.cs`, verified), and two
# back-to-back seam TimeJumps execute ~4-7 frames apart in WALL time regardless of the
# game-seconds between them. V8 runs _0810 and _0814 both PARSEK-FAILed on exactly that
# shape. The RecordingState pairs put wall frames between straddling jumps.
# `allowedAnomalies` stays [] -- if the detector fires anyway, that is the reading.
#
# NO EnterWatchMode, deliberately. Watch verdicts on a cross-body replay are a separate
# question with their own open finding (WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE), and an
# unexpected OK would read INVALID(driver-verdict-mismatch) and discard this lane's
# actual measurement. This lane asks four questions and spends its verbs on those.
#
# THE TREE GUID is the Eeloo fixture's own committed tree, read off its persistent.sfs
# RECORDING_TREE node: d4ce5c45adae4f3e89c4ac6bbec6b167 (rootRecordingId
# 20d890f9f34b466fb8be07d83103a9a7). A STALE GUID -- e.g. Dres's
# f0c17a694f214fe7a759ea255ef4634a -- makes this lane VACUOUS, NOT RED: both seam verbs
# answer OK-with-nothing-to-do and the run goes green proving nothing.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig",     args = { tree = "d4ce5c45adae4f3e89c4ac6bbec6b167", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "d4ce5c45adae4f3e89c4ac6bbec6b167" }, expect = "OK", budget = 300 },

  # (a) Cycle-0 just after the relaunch: the Kerbin ascent leg of the replay.
  # ESTIMATE phaseAnchor 53,977,261 + 120. It sits 30,284 s before the estimated D0
  # (see the checked-property note in the header), two orders of magnitude clear of the
  # widest placement that ever raised the detector.
  { cmd = "TimeJump", args = { ut = "53977381" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },

  # (b) Kerbin->Sun escape, POST-SEAM ONLY: ESTIMATE D0 54,007,665 + 600.
  # THE PRE-D0 JUMPS ARE NOT HERE AND MUST NOT BE ADDED. Three V10 placements, three
  # runs, one shape: `line-blink ... sinceFrames=1 body=Sun`, the filed
  # LINE-BLINK-JUMP-STRADDLE-DETECTOR-GAP, where a proto line toggles because the CLOCK
  # left its window rather than the body changing. The toggle happens INSIDE one jump's
  # settle, so RecordingState spacers cannot fix it -- V10 iteration 2 added frames and
  # it toggled twice. Those jumps answer none of this lane's four questions.
  { cmd = "TimeJump", args = { ut = "54008265" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },

  # (c) MID-TRANSFER, and this is the step V12 structurally cannot take: park the clock
  # in the middle of the re-aimed heliocentric leg (ESTIMATE D0 + tof/2) so
  # ReaimPlaybackResolver resolves it and the per-window synthesizer -- and with it the
  # tilt gate and the tof-band line -- actually runs. THE MOST FORGIVING JUMP IN THE
  # LANE: the leg is ~41.8M game s wide, so the estimate has ~20.9M s of slack either
  # side and survives anything short of a whole-cadence error in phaseAnchor.
  { cmd = "TimeJump", args = { ut = "74929649" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },

  # (d) THE CENSUS SEAM. Offsets -190 / -60 / +180 around an ESTIMATED soiEntryUT of
  # 95,790,632 = (D0 + tof) - 61,000, where the 61,000 is one approach time: B21's
  # measured 69,896 s Eeloo approach scaled by the 0.87 the single Dres data point
  # gives. Uncertainty +-35,000 s, so THIS BRACKET WILL PROBABLY MISS ON PASS 1 and
  # that is accepted -- pass 2 replaces all three with soiEntryUT off the product's own
  # `re-aimed transfer ready` line, never with the recorded arrival (V10 iteration 1's
  # measured mistake, 18,067 s away from the real seam at Dres).
  { cmd = "TimeJump", args = { ut = "95790442" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "TimeJump", args = { ut = "95790572" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "TimeJump", args = { ut = "95790812" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "RecordingState",                                                  expect = "OK" },

  # (e) Parked tail, INSIDE the estimated rendered window (which ends ~95,920,225 by the
  # phaseAnchor + compressedSpan identity). Deliberately not past it -- that is the
  # V8 _0810 line-blink shape.
  { cmd = "TimeJump", args = { ut = "95920106" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                  expect = "OK" },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# NOTHING CLAIMED on a reading run. Cells get claimed once this lane has a pinned
# contract that backs them -- the post-reading arming call, and a separate decision.
[dimensionsCovered]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every [expectations.<sub>]
# header or TOML scopes it into the sub-table.
#
# EMPTY, the reading-run posture. An anomaly raised here IS the reading; exempting one
# in advance would discard the evidence. The V8 precedent: two line-blink reds were
# filed as a detector gap rather than exempted.
allowedAnomalies = []

[expectations.recordings]
# INTERIM WINDOW, not a pin. The FLOOR is the fixture's own measured 5 (B21 re-pinned
# {5,5} off run _2239, every recording accounted for by span UT) and recording is OFF
# throughout, so the TimeJumps cannot author anything. The CEILING leaves room for
# load-time optimizer splits, whose Eeloo count is unmeasured; the Dres precedent is
# exactly ONE (a deterministic ascent split at ut 224.5, making V9/V10 read 6). RE-PIN
# to {N, N} on pass 2 and state which mechanism produced N -- do NOT widen.
count = { min = 5, max = 8 }

[expectations.logContracts]
# READING POSTURE. Only tokens derivable to the digit from the SOURCE are armed; every
# flight-geometry quantity is measured first. See the header's ARM / DO-NOT-ARM section
# for the reason attached to each omission (the SOI constant, the @soi metre value,
# @arrival=0m, the tilt disposition, departUT / devFromRecorded, the census pair, and
# the candidate count are all deliberately absent).
required = [
  "MissionConfig",
  "StartLoopPlayback",
  # The tilt BOUND PAIR at Eeloo's 6.15 deg: Max(Max(0, 6.15), 0) + 0.5 = 6.65, both
  # F4 and adjacent in the format string. A copied Dres bound=5.5000 would red a
  # CORRECT Eeloo run. The DISPOSITION is deliberately not pinned here.
  "bound=6.6500 targetInc=6.1500",
  # The eccentric-target band: clamp(0.06 + 0.5 x 0.26, 0.06, 0.20) = 0.19 exactly,
  # cap NOT engaged. This is the M-MIS-3 measurement the source's own PLACEHOLDER
  # comments ask for.
  "eTarget=0.2600 halfWidthFraction=0.1900",
]
# The ERROR floor, plus the ONE decline the tilt-retention fix removed. NARROWED from
# V10's bare "state=declined": the candidate sweep legitimately emits per-candidate
# declines of four other reasons on a window that ultimately resolves, and Eeloo sweeps
# 77 candidates against Dres's 53. `reason=unreachable-plane` is the specific pre-fix
# regression, and the shipped code can no longer emit it with `state=declined` at all.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "state=declined reason=unreachable-plane",
]

[runtime]
# V10's budget class for the same seam-driven shape and step count. No flight: a
# LoadGame, ~28 seam verbs and a quit; the epoch jumps are instant, so the budget is
# dominated by the KSP boot and the fixture load (V10 measured well inside this).
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
