#     bracket clear of the edge (-900 / -300 / +600) did NOT clear the blink: it
#     followed the middle jump to its new UT, `31,276,442.640 sinceFrames=1
#     body=Sun`. Three runs, three placements, same shape -- so the trigger is not a
#     particular UT edge, it is ANY jump landing in the pre-D0 region: the Sun-leg
#     proto line toggles within one frame because the CLOCK is outside its window,
#     which is exactly the filed V8 detector gap (`bodyChanged` cannot see a
#     clock-leaves-window transition). That lane did not open that gap and cannot
#     close it by pacing.
#   iteration 4 -- FLOWN 2026-08-12_0333 and _0335, both PASS, zero anomalies, and
#     ARMED on them. The pre-D0 jumps are REMOVED; the escape leg keeps one
#     post-seam observation (+600).
#
#     THE ONE THING THAT COST, stated plainly rather than buried: dropping those
#     jumps also dropped the census's SECOND line. Iterations 2 and 3 both emitted
#     `seam-endpoint summary evaluated=1 outsideSoi=0` -- the rendered-arrival proof
#     -- and iteration 4 emits only `evaluated=0 skip.no-usable-ratio=1`. So the
#     census evaluating at all depends on the render having passed through the
#     pre-D0 state, and reaching that state reproduces the filed detector gap. The
#     two cannot both be had in one lane today.
#
#     THE CHOICE, and why: the armed lane is the GREEN one. The census reading is
#     not lost -- it is MEASURED, twice, and recorded here and in the status doc
#     (`evaluated=1 outsideSoi=0`, suppressed 279 / 273) -- but a permanently
#     red-by-detector-gap lane makes a poor regression floor, and the arrival proof
#     is independently carried by a token that lane DOES arm: the synth geometry
#     line's `xfer-vs-Dres@arrival=0m` and `xfer-vs-Dres@soi=32832839m
#     (SOI=32832840)`, i.e. the re-aimed conic meets Dres's SOI boundary to within
#     one metre. That is the same claim the census makes, from the synthesizer
#     rather than the renderer, and it is deterministic on every run.
#     If the detector gap is ever closed, restore iteration 3's escape bracket
#     (-900 / -300 / +600) and arm the census pair too.
#
# HARD CONSTRAINT CARRIED FORWARD: NO PRE-D0 JUMP in the escape bracket. The filed
# finding is LINE-BLINK-JUMP-STRADDLE-DETECTOR-GAP in docs/dev/todo-and-known-bugs.md.
# `RecordingState` spacers CANNOT fix it -- the toggle happens inside one jump's settle.
#
# =====================================================================================
# WHAT THIS LANE ARMS, AND WHY EACH TOKEN EARNED IT
#
# ARMED 2026-08-13 on the two-consecutive-runs discipline (`_1513` / `_1515`, both PASS
# attempt 1, zero anomalies). EVERY token below was verified byte-identical across BOTH
# retarget runs before arming, and every one also reproduces iteration 1's reading --
# three runs, one set of digits. Nothing that MOVED between the two runs is pinned; the
# moving set is enumerated in iteration 2 (ii) above and none of it is a decision.
#
#   THE TILT LITERAL -- THIS LANE'S HEADLINE, armed on what it MEASURED rather than on
#   what the pre-flight header predicted:
#     `tilt-correction inc-before=4.0725 bound=6.6500 targetInc=6.1500 incAch=NaN
#      inc-after=4.0725 state=noop reason=in-plane`
#   Read THE TILT RESULT below for what this means and, more importantly, for what it
#   does NOT license anyone to claim.
#
#   THE BOUND PAIR `bound=6.6500 targetInc=6.1500`, armed SEPARATELY even though it is a
#   substring of the literal above, and the redundancy is deliberate rather than sloppy.
#   It is the DERIVABLE half -- `ReaimTransferSynthesizer.InclinationBoundDegrees(l, t) =
#   Max(Max(l, t), 0) + InclinationToleranceDegrees`, the tolerance a compile-time 0.5,
#   Kerbin's inclination 0 and Eeloo's 6.15, so bound = 6.65 and targetInc = 6.15, both
#   F4 and adjacent in `LogTiltCorrection`'s format string. It therefore SURVIVES a
#   legitimate change in the geometry that the whole literal would not, and the pair of
#   them DIAGNOSES a red instead of merely raising one: pair green + literal red = the
#   solved conic moved (a reading to re-measure); BOTH red = the bound arithmetic itself
#   moved (a regression). A COPIED DRES `bound=5.5000` would red a CORRECT Eeloo run,
#   which is why it is spelled out here rather than inherited.
#
#   THE ECCENTRIC-TARGET BAND `eTarget=0.2600 halfWidthFraction=0.1900`. See THE M-MIS-3
#   CLAIM, NARROWED below -- the claim this token supports is strictly SMALLER than the
#   one the pre-flight header made for it, and the difference is load-bearing.
#
#   THE SYNTH GEOMETRY, all three proximity checks, now measured: `xfer-vs-Kerbin@
#   depart=0m`, `xfer-vs-Eeloo@arrival=0m`, and `xfer-vs-Eeloo@soi=0m \(SOI=119082942\)`
#   armed in ONE PIECE exactly as the pre-flight header said it must be. THE SOI CONSTANT
#   IS ARMED ON THE MEASUREMENT AND NOT ON A DERIVATION: the header refused to pin it
#   because a*(m/M)^0.4 from the stock mass table returns 119,082,940.97 -> "119082941",
#   ONE off the 119082942 the program's notes carry, and the run settled it --
#   `sphereOfInfluence.ToString("F0")` reads 119082942. The measurement is now the
#   authority and the independent derivation is the thing that was wrong. NOTE `@soi=0m`
#   where Dres read 32832839m: consistent with soiEntryUT == arrivalUT on this lane, i.e.
#   this conic touches the SOI boundary AT its arrival instant rather than before it.
#
#   THE READY LINE: `re-aimed transfer ready: departUT=54007648.196326263`,
#   `soiEntryUT=95851632.03180024`, `devFromRecorded=0s` and `encounter=Eeloo`. The
#   pre-flight header refused `devFromRecorded=0s` because it "holds only if cycle 0
#   resolves at CANDIDATE STEP 0" -- it DID, on three runs, so that condition is now a
#   measurement rather than a hope. That same fact is what NARROWS the M-MIS-3 claim
#   below, so this token is simultaneously the proof and the limit.
#
#   THE CLASSIFICATION `ENGAGED re-aim Kerbin->Eeloo via Sun`. Derivable from
#   `MissionLoopUnitBuilder`, but it is a claim about product BEHAVIOUR, so it waited for
#   the measurement. It has it, three times.
#
# =====================================================================================
# THE TILT RESULT -- THE HEADLINE, AND WHAT IT DOES NOT PROVE
#
# MEASURED, byte-identical on all three runs (`_0120`, `_1513`, `_1515`):
#     tilt-correction inc-before=4.0725 bound=6.6500 targetInc=6.1500 incAch=NaN
#     inc-after=4.0725 state=noop reason=in-plane
#
# The prediction was `state=retained reason=unreachable-plane`. THAT IS NOT WHAT
# HAPPENED, and the reason is STRUCTURAL rather than marginal: inc-before 4.0725 deg is
# BELOW the 6.6500 deg bound, so `IsExcessiveTiltTransfer(incBefore, tiltBound)` is FALSE
# and control never enters the excessive branch at all. `incAch` is NaN because it is
# only computed INSIDE that branch, and `inc-after == inc-before` because nothing was
# touched. EELOO'S 6.15 DEG DID NOT FORCE A TILT ON THIS GEOMETRY.
#
# WHAT THIS MEANS AGAINST THE TILT PLAN'S OWN CLAIM SCOPE, stated plainly because the
# tempting one-line summary is FALSE. The plan scopes itself "Eve only ... Moho/Dres/
# Eeloo are unmeasured collateral". Eeloo is the HIGHEST inclination the retention arm
# has ever been aimed at -- Eve 2.1 -> Dres 5.0 -> Eeloo 6.15 -- and the retention arm
# WAS STILL NOT REACHED, because THE RETENTION BRANCH LIVES INSIDE THE EXCESSIVE-TILT
# GATE AND THE GATE NEVER OPENED. Therefore:
#   * EELOO TESTED THE BOUND ARITHMETIC, NOT THE RETENTION BRANCH. The 6.65 bound and
#     the 6.15 target are confirmed to the digit, and the not-excessive arm is confirmed
#     to LOG a Noop rather than fall silent. That is the whole of what was proven.
#   * THE RETENTION BRANCH REMAINS EVE-ONLY-VALIDATED (plus Dres's retained reading).
#     THIS LANE DOES NOT WIDEN THE PLAN'S CLAIM SCOPE. Any note reading "Eeloo validated
#     retention" would be false. Filed as REAIM-TILT-NOOP-AT-EELOO-6.15-DEG.
#   * WHAT WOULD ACTUALLY EXERCISE IT: a geometry whose SOLVED transfer inclination
#     exceeds the bound -- NOT a higher-inclination TARGET. Target inclination sets the
#     BOUND, so raising it makes the gate HARDER to trip; what trips the gate is the
#     Lambert solution's own plane. Dres reached `inc-before=13.1958` against a 5.5000
#     bound on a shorter, more bent transfer, while this Eeloo window solves nearly
#     in-plane at 4.0725 because a 484-day near-Hohmann coast barely leaves the ecliptic.
#     Moho (7 deg target, but a fast bent INNER transfer) is the better candidate, and it
#     is a NEW FIXTURE, not a re-aim of this one.
# ABSENCE OF A RETAIN LINE IS NOT A DECLINE. A Noop DOES emit a tilt line (the `else` arm
# of the disposition switch, `"noop", "in-plane"`); absence of a tilt line ALTOGETHER
# would mean the synth never reached the tilt block, which is the larger finding. This
# lane got its line.
#
# =====================================================================================
# THE M-MIS-3 CLAIM, NARROWED -- WHAT `eTarget=0.2600 halfWidthFraction=0.1900` PROVES
# AND WHAT IT DOES NOT. The pre-flight header claimed this token "CLOSES the M-MIS-3
# validation debt for EccGain at 0.5". THAT CLAIM WAS TOO BROAD AND IS CORRECTED HERE.
#
# WHAT IS PROVEN -- THE COMPUTATION HALF. `ReaimTofSearch.HalfWidthFraction(e) =
# clamp(BaseHalfWidthFraction + EccGain*e, BaseHalfWidthFraction, MaxHalfWidthFraction)`
# = clamp(0.06 + 0.5 x 0.26, 0.06, 0.20) = 0.19 EXACTLY, and the product emitted
# `halfWidthFraction=0.1900` against `eTarget=0.2600` on three runs. So at e = 0.26 the
# band law COMPUTES correctly on the shipped constants, and the 0.20 cap is NOT engaged:
# engaging it needs EccGain >= (0.20 - 0.06)/0.26 = 0.5385, so the shipped 0.5 sits 7.7%
# BELOW engagement. That is a real measurement against a real fixture, and it is the
# first one the `PLACEHOLDER - pin against the Eeloo fixture` comments have ever had.
#
# WHAT IS *NOT* PROVEN -- THE BEHAVIOURAL HALF, and this is why the debt stays OPEN.
# `ReaimTofSearch.BuildCandidateTofs` is RECORDED-CENTERED, not geom-centered:
#     step 0   = recordedTof, ALWAYS first (the source calls this invariant b)
#     the band = recordedTof +- k*step, with step = recordedTof * stepFraction
#     geomTof  = chooses only the SIDE probed first (`towardSign`) and NOTHING else
# Two consequences follow, and both cut against the broader claim:
#   (1) `devFromGeom=7577876.6049437672s` exceeding 0.19 x geom is IRRELEVANT. The band
#       is never measured against geom, so a large devFromGeom is NOT a band violation
#       and must not be read as one.
#   (2) `devFromRecorded=0s` MEANS CYCLE 0 WAS ACCEPTED AT CANDIDATE STEP 0. The
#       expansion steps (baseSteps+1 .. maxSteps) were NEVER WALKED -- not one candidate
#       past step 0 was probed, on any of the three runs.
# So the widened band was COMPUTED and never EXERCISED. Whether the eccentricity-gated
# expansion BEHAVES -- whether those 26 extra steps land where the law intends, in the
# order it intends, and whether a window that NEEDS them resolves -- IS STILL UNTESTED.
# THE DEBT IS NOT CLOSED. Filed as M-MIS-3-BAND-COMPUTED-NOT-EXERCISED. Discharging the
# behavioural half needs a fixture whose STEP-0 TOF IS REJECTED, which this one's is not.
# (A separate geom-CENTERED function, `BuildParkingCandidateTofs`, serves the
# heliocentric-parking-departure path. `parking=False` on every run here, so that is not
# our path and this lane says nothing about it.)
#
# =====================================================================================
# WHAT IS STILL DELIBERATELY NOT ARMED, EACH WITH ITS REASON
#
#   THE CENSUS PAIR. STILL A DOCUMENTED READING, and after the retarget the reason is
#   BETTER UNDERSTOOD than V10's rather than merely inherited -- see iteration 2 (iii).
#   Measured here, byte-identical on both runs:
#       `[MapRenderTrace] seam-endpoint summary evaluated=0 outsideSoi=0
#        skip.no-usable-ratio=1`
#   and the emitted line is NOT an arrival-bracket reading: it comes from the frame at
#   currentUT=53970043.597, i.e. JUMP 1, because the summary rides a SHARED 5 s
#   `VerboseRateLimited` key that jump 1 primes and the whole rest of the lane executes
#   inside its shadow. The bucket is CORRECT for that frame (a Kerbin-frame escape
#   hyperbola whose cross-body successor destination is the Sun, which has no finite
#   sphere). The arrival seam WAS reached, on independent render-side evidence: at jump 6
#   the proto line closed `reason=past-body-frame-end lineActive=False ...
#   bounds=[54007648.2,95851632.0]`, ending at soiEntryUT to the digit. The census is
#   SILENT about the arrival, not negative about it -- and arming an `evaluated=0` token
#   would pin an INSTRUMENT ARTEFACT as though it were a product contract.
#   V10'S RESTORATION RECIPE IS CARRIED VERBATIM and remains the recipe of record: "if
#   the detector gap is ever closed, restore iteration 3's escape bracket
#   -900 / -300 / +600 and arm the census pair too." NOTE, for whoever executes it, that
#   this lane's own measurement ADDS a condition V10 could not have known: freeing the
#   rate-limit key near the seam (or moving it to a per-onset / per-pid key) is ALSO
#   needed here, because on a ~55 s lane the shared key alone suppresses the arrival
#   sample even when the bracket is dead on the seam. Both are instrument changes, and
#   neither is this lane's business.
#
#   `suppressed=122` AND THE EFFECTIVE-SEGMENTS LINE. Stable across both runs, but it is
#   a render-side count whose stability rests on two runs of ONE jump shape, and it would
#   red on any unrelated render change while proving nothing this lane asks. Recorded as
#   a reading: `map effective segments: RE-AIMED member=1 segs=6 helioSegs=1
#   firstHelioSma=47537901349 | suppressed=122`.
#
#   THE CANDIDATE COUNT. Eeloo probes a DERIVED 77 candidates (1 + 2*maxSteps, with
#   maxSteps = round(0.19/0.005) = 38) against Dres's 53 and Eve's 27. DERIVED AND NOT
#   MEASURABLE ON A GREEN RUN: both emitters sit on the FAILURE path (`synth failed
#   across N tof candidates`, `reaim window fell back faithful: ... candidates=N`), so a
#   success prints no count at all. SEEING `candidates=77` IN A LOG MEANS THE WINDOW
#   DECLINED.
#
#   THE SCHEDULE DIGITS (cadence / synodic / phaseAnchor / loiter cut / compressedSpan).
#   V12 already arms those, on the same fixture and the same tree; duplicating them here
#   would double-pin one measurement across two lanes and make a single product change
#   red twice for one reason. This lane arms the SYNTHESIZER's half; V12 arms the
#   SCHEDULE's.
#
# THE `state=declined` FORBID IS NARROWED FOR EELOO, and the narrowed form is what is
# armed. V10 forbids the bare substring `state=declined`. That is a whole-log scan, and
# the candidate sweep can legitimately emit PER-CANDIDATE declines
# (`degenerate-rotation` / `sane-fail` / `handedness-flip` / `residual-tilt`) on a window
# that ULTIMATELY RESOLVES -- the counter comment in `ReaimTransferSynthesizer` says so
# in as many words. Dres got away with the bare form on 53 candidates; Eeloo would sweep
# a DERIVED 77 at a higher tilt where the 90 deg retrograde ceiling is closer, so the
# bare form here is a false positive waiting for the first window that needs a second
# candidate. NARROWED TO `state=declined reason=unreachable-plane`, which is the SPECIFIC
# pre-retention-fix regression V10 actually cares about and which the shipped code can no
# longer emit at all (an unreachable plane now RETAINS). Zero false-positive surface,
# same regression floor.
# AND NOTE THE ASYMMETRY THAT MAKES THE NARROWING SAFE RATHER THAN MERELY CONVENIENT:
# THE CANDIDATE COUNT IS ONLY OBSERVABLE ON A DECLINE, because both emitters are on the
# failure path. So 77 is DERIVED and was never measured here -- and if a log ever does
# show `candidates=77`, that reading is itself the news that the window declined.
#
# OTHER READINGS RECORDED HERE, NONE OF THEM ARMED:
#   * `PhaseLock` reads `UnsupportedCrossParent` (Eeloo is not a child of Kerbin, exactly
#     as Dres). Not a defect.
#   * cadence multiple 5 CONFIRMED (48,883,481.632992938 / 9,776,696.3265985884 =
#     5.0000), the suite's first prediction above 2. Armed in V12, not here.
#   * `unityExceptions` REPORT-ONLY and NOT stable: total 1 / 1 / 4 across the three runs,
#     every one stock scene teardown (KnowledgeBase.ActivateApps under
#     PlanetariumCamera.OnVesselDestroy, MechJebCore.OnDestroy,
#     CrewHatchController.HideTooltip), all of it AFTER FlushAndQuit answered OK. Not
#     Parsek, and deliberately not gated.
# =====================================================================================
tier = "operator"
description = "ARMED: the Eeloo program's arrival lane -- TimeJump into the re-aimed Kerbin->Eeloo transfer so the per-window synthesizer runs, pinning the tilt disposition at Eeloo's 6.15 deg inclination, the eccentric-target tof band at e=0.26, the three synth-geometry proximity checks including the MEASURED Eeloo SOI constant, and the cycle-0 re-aimed-transfer-ready line. THE HEADLINE IS A FINDING: the tilt came back state=noop reason=in-plane, not the predicted retained -- the solved conic's 4.0725 deg sits BELOW the 6.6500 deg bound, so the excessive-tilt gate never opened and the retention branch was NOT exercised at Eeloo. The seam-endpoint census stays a documented reading (its summary rides a shared 5 s rate-limit key primed by jump 1)."
instanceProfile = "stock-minimal"
tags = ["V12A", "eeloo", "loop", "playback", "reaim", "tilt", "flown"]

