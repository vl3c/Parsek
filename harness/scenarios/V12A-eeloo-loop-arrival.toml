# +20,921,991.9, and the three arrival-bracket jumps 41.8M s past D0.
#
# WHAT THE TOF BAND ACTUALLY PROVED, AND WHAT IT DID NOT. This NARROWS the M-MIS-3 claim
# rather than closing it, and the narrowing is load-bearing.
# `ReaimTofSearch.BuildCandidateTofs` is RECORDED-CENTERED, not geom-centered: step 0 is
# ALWAYS the recorded tof, the band is recordedTof +- k*step with
# step = recordedTof * stepFraction, and geomTof only chooses which SIDE to probe first
# (towardSign). So pass 1's devFromGeom=7,577,876.6 s exceeding 0.19*geom is IRRELEVANT
# -- the band is never measured against geom. AND because devFromRecorded=0s, cycle 0
# was accepted AT STEP 0, so THE EXPANSION BAND WAS NEVER WALKED. Pinning
# `eTarget=0.2600 halfWidthFraction=0.1900` therefore proves the constant is COMPUTED
# correctly for e = 0.26; it does NOT prove the expansion BEHAVES, because no candidate
# past step 0 was ever probed. Claim the computation half only -- the behavioural half of
# the `EccGain` validation debt stays OPEN. (A separate geom-centered function serves the
# heliocentric-parking-departure path; parking=False here, so that is not our path.)
