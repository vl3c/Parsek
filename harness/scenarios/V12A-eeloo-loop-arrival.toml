# THE PRE-D0 DISTINCTION, STATED PRECISELY BECAUSE THE FLAT FORM IS WRONG. "No pre-D0
# jump" is NOT this lane's constraint, and stating it that way would mislead the next
# reader: JUMP 1 IS DELIBERATELY PRE-D0 -- it is the cycle-0 Kerbin ascent leg, and
# V10's own jump 1 sat at D0 - 54,543. The real constraint is narrower: no jump may sit
# in the NEAR-pre-D0 STRADDLE ZONE where the Sun-leg proto line toggles inside one
# settle (the filed LINE-BLINK-JUMP-STRADDLE-DETECTOR-GAP; the three V10 placements that
