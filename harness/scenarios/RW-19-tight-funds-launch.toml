[expectations.recordings]
# The host's 34 recordings plus H; the later launches are unrecorded. Measured on `2026-10-31_0248`.
count = 35

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",
  "kscaction action=upgrade-facility target=SpaceCenter/VehicleAssemblyBuilding applied=true",
  "MISSIONMARK label=rw19-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw19-rewound ut=1857[0-9]{2}\\.",

  # ---- the refusal: the lander's Launch button greys, for its own cost ----
  "MISSIONMARK label=rw19-rewound ut=(?:(?!MISSIONMARK label=rw19-lander-open )[\\s\\S])*?Purchase refused, reserved for later costs: launch pool=Funds cost=1[0-9]{4}(?:\\.[0-9]+)? charged=\\S+ spendable=11950\\.[0-9]+ refused=true",
  "MISSIONMARK label=rw19-rewound ut=(?:(?!MISSIONMARK label=rw19-lander-closed )[\\s\\S])*?\\[LaunchReserve\\] Editor Launch button disabled",

  # ---- the launch that fits: the Flea's cost is inside the same spendable ----
  "MISSIONMARK label=rw19-lander-closed ut=(?:(?!MISSIONMARK label=rw19-flea-launched )[\\s\\S])*?launchfromeditor complete scene=FLIGHT vessel=Jumping Flea",

  # ---- the crossing: the upgrade is paid in full, and the pools end where the rewind began ----
  "MISSIONMARK label=rw19-before-crossing ut=(?:(?!MISSIONMARK label=rw19-crossed )[\\s\\S])*?Clock-crossing reached committed-future rows: crossed=[1-9][0-9]* \\[FacilityUpgrade@",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw19-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw19-crossed ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=",
  "invokerewindtolaunch refused",
  "\\[TakeBack\\] Took back ",
  "take-back shortfall",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
  # ---- a launch that fits never leaves a committed cost unpaid, and never runs a debt ----
  "FundsSpending NOT affordable",
  "Debt charge:",
  # ---- the Flea's own launch is not refused ----
  "Purchase refused, reserved for later costs: launch pool=Funds cost=2[0-9]{3}(?:\\.[0-9]+)? ",
]

