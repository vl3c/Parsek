schema = 1
id = "VN-1-stock-rename-staging-f9"
# RESHAPED 2026-10-20 FOR "LOAD RESTORES THE SAVE" PHASE 2 (design
# docs/dev/design-load-restores-the-save.md 4.1 / 4.7 / 8, which reverses names ruling 5
# (design-vessel-and-mission-names.md 7.6) for save-file loads). NOT FLOWN in this shape.
# THE F9 OUTCOME FLIPS for check (d): the F9 carries `playerLoad=true`, a Cold save-file
# load, and the vessel-name decisions come from the quicksave (VesselNameStore.Load), which
# was written before the Bravo rename. So the pod reloads as "VN1 Alpha" and STAYS "VN1
# Alpha": nothing writes "VN1 Bravo" back (forbidden), the commit after the F9 finalizes
# the pod's legs under "VN1 Alpha", and the Parsek rename of check (c) reads
# `'VN1 Alpha' -> 'VN1 Charlie'`. Checks (g), (a), (b) and (c) and the final names (pod
# "VN1 Charlie", booster "VN1 Alpha Probe") are unchanged. Where the text below says the
# F9 writes Bravo back, it describes the in-session shape flown before Phase 2.
# =====================================================================================
# VN-1: VESSEL NAMES, THE STOCK RENAME ON A RECORDED FLIGHT (design
# docs/dev/design-vessel-and-mission-names.md 15.3, todo GC-7). AUTHORED 2026-10-11 on
# branch `vessel-names-links`. LIVE-PROVEN on its third flight: result `2026-10-12_0458` PASS
# attempt 1 (automation DLL sha256 prefix 62700230107ab2b4), `BATCH_COMPLETE v1 total=3
# passed=3 failed=0 skipped=0`, now pinned WHOLE. The two flights before it were red on SPEC
# defects only, every final name right both times. saveParse stays REPORT-ONLY until an
# operator arms it.
#   - result `2026-10-11_1649` (logs `2026-10-11_1953`): PARSEK-FAIL(expectations) on the
#     recordings count alone (min 3, read 2: pod and booster, no optimizer split, no
#     debris). Floor now 2.
#   - result `2026-10-11_1735` (logs `2026-10-11_2039`): PARSEK-FAIL(expectations) on the
#     pinned `refined=QuickloadFlight` line alone. F5 and F9 were 4-5 physics ticks apart
#     and the F9 regressed the clock 0.08 s, under ParsekScenario's UtBackwardsEpsilon
#     (0.1 s), so ClassifyRefined read InSessionOther (the first flight's 0.10 s just made
#     it). The name write-back happened anyway. A 1x WarpToUT to UT 260 after the Bravo
#     rename now puts ~25 s between F5 and F9.
#
# THE FLIGHT. GS-1's two-stage hop (crewed mk1 pod as root on top, a probe-cored booster
# below), recorded from the pad by StartRecording (autoRecordOnLaunch off, so the launch leg
# opens under the craft's own name). Five checks in one flight:
#   (g) RunTests VesselNames: the category's three FLIGHT cells against the recorded pad
#       vessel (each restores the names and the decision store it found).
#   (a) RenameVessel "VN1 Alpha" on the pad: the stock dialog's accept
#       (Vessel.onVesselRenameAccept by reflection), so the Harmony capture records a
#       StockDialog decision and the open launch leg is renamed.
#   (b) The staging. The booster (no naming part) is named by stock's AutoRename from the
#       parent's name at the split: "VN1 Alpha Probe", a NEW identity with no decision. The
#       mission therefore tracks the sibling under that name. Every later rename of the pod
#       leaves the booster's legs on that automatic name (ruling 4). GS-1's pod keeps ONE recording across the split (the parent keeps its recording; QL-4 / RF-1 logs:
#       recordings=2), so here the launch leg IS the pod leg and legs=1; ruling 7 across a
#       separate launch recording is proven by unit tests, not by this lane. NOT exercised: the post-staging race
#       where the CONTROL part leaves on the new vessel and ModuleDecouple.WaitAndSwitchFocus
#       renames the old vessel one Update later (design 8.17): this craft's root and only
#       crew are in the pod, so the pod keeps control. That needs a craft whose command part
#       is on the lower stage.
#   (a) After landing: F5, then RenameVessel "VN1 Bravo": the pod's identity (its one
#       recording, from the pad) is renamed, the booster is not.
#   (d) StopRecording, F9 in FLIGHT: the quicksave reloads the pod as "VN1 Alpha"; the
#       OnLoad tail proto pass (or the first-tick post-load pass) writes "VN1 Bravo" back.
#       The later Parsek rename's write-through line reads `'VN1 Bravo' -> 'VN1 Charlie'`,
#       which is the outcome reading: the live pod carried Bravo after the F9.
#   (c) Commit in flight (QL-4's StopRecording / CommitTree / StopRecording), then the
#       Missions window's recording rename (UiAction op=edit field=recordingname commit=true)
#       on the pod's leg captured by ListHandles: a ParsekRename decision written through to
#       the live stock pod (ruling 3), renaming the committed legs.
#
# ON A PRE-FIX BUILD (no Phase 2a): no `Stock rename captured` line, no write-through, and
# the commit finalizes the launch leg under 'GS1 Auto-Chute Booster'.
# READING-RUN NOTES: a REJECTED RenameVessel `renamevessel-accept-unavailable` means the
# KSP build lacks the private accept method (the capture patch warned at startup); a
# missing `VN1 Alpha Probe` finalize line with a `GS1 Auto-Chute Booster Probe` one means
# the first rename did not land before staging; an `edit-target-unavailable` REJECTED on the
# op=edit step means the optimizer removed the captured leg id at the commit (re-key the
# step to another committed row of the pod's identity).
# =====================================================================================
tier = "nightly"
description = "VN-1: on GS-1's two-stage hop recorded from the pad, a stock rename dialog accept renames the recorded launch leg; staging names the booster by stock (VN1 Alpha Probe) and that name stays; a second stock rename after landing renames every leg of the pod's identity including the launch leg; the player's F9 (playerLoad=true, a Cold save-file load) to a quicksave from before it restores the save's names, so the pod stays VN1 Alpha; a Parsek recording rename after an in-flight commit writes through to the live pod. Runs the VesselNames in-game category on the recorded pad vessel."
instanceProfile = "stock-minimal"
tags = ["VN-1", "vessel-names", "GC-7", "rename", "staging", "quickload", "in-flight-commit",
        "ingame-batch", "GS1", "reading-run"]

[fixture]
saveTemplate       = "fixtures/saves/gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "gs1_auto_chute_booster"
# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },       expect = "OK", budget = 300 },
  # The launch leg must open under the craft's own name, so recording starts on the pad by
  # the seam rather than at launch.
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },   expect = "OK" },
  # LOAD-BEARING: the apply-pass, live-write and FinalizeTreeRecordings lines are Verbose.
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },        expect = "OK" },
  { cmd = "StartRecording",                                                            expect = "OK", budget = 180 },
  # (g) The in-game category against the recorded pad vessel.
  { cmd = "RunTests",       args = { category = "VesselNames" },                       expect = "OK", budget = 300 },
  # (a) The first player rename, on the pad, before the split.
  { cmd = "RenameVessel",   args = { name = "VN1 Alpha" },                             expect = "OK" },
  { phase = "mission",                                                                 expect = "MISSION-OK", budget = 900 },
  # F5 with the pod (and the booster) down, both under the pre-Bravo names.
  { cmd = "SaveGame",       args = { name = "quicksave" },                             expect = "OK", budget = 120 },
  # (a) The second player rename, after the split.
  { cmd = "RenameVessel",   args = { name = "VN1 Bravo" },                             expect = "OK" },
  # THE ABANDONED FUTURE. 1x (no physics warp while a recording is live) for about 25 s
  # past the F5 (UT 234.7 / 235.0 on the first two flights), so the F9 regresses the clock
  # by far more than ParsekScenario's UtBackwardsEpsilon (0.1 s) and is classified
  # QuickloadFlight, and the Bravo decision sits in a future the F9 throws away. Absolute,
  # not relative: WarpToUT takes only `ut=`, and a handle cannot carry an offset.
  { cmd = "WarpToUT",       args = { ut = "260", maxRate = "1" },                      expect = "OK", budget = 120 },
  # (d) F9 in FLIGHT. The LoadGame seam refuses a live recorder.
  { cmd = "StopRecording",                                                             expect = "OK" },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "quicksave", playerLoad = "true" }, expect = "OK", budget = 300 },
  # Settle (QL-4's measured count): RestoreActiveTreeFromPending runs from OnFlightReady.
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  { cmd = "RecordingState",                                                            expect = "OK" },
  # The resumed tree's active leg: the pod's post-split leg, a row of the pod's identity.
  { cmd = "ListHandles",    args = { kind = "active" }, label = "act",                 expect = "OK" },
  # (c) Commit in flight, then the Parsek rename of a committed row.
  { cmd = "StopRecording",                                                             expect = "OK" },
  { cmd = "CommitTree",                                                                expect = "OK", budget = 120 },
  # CommitTree auto-resumes a recorder on the still-active vessel (H58 flight 1).
  { cmd = "StopRecording",                                                             expect = "OK" },
  { cmd = "UiAction",       args = { op = "complexity", mode = "advanced" },           expect = "OK" },
  { cmd = "UiAction",       args = { op = "open", window = "main" },                   expect = "OK" },
  { cmd = "UiAction",       args = { op = "open", window = "missions" },               expect = "OK" },
  { cmd = "UiAction",       args = { op = "tab", window = "missions", tab = "recordings" }, expect = "OK" },
  { cmd = "UiAction",       args = { op = "edit", window = "missions", field = "recordingname", key = "${act.activeRec}", draft = "VN1 Charlie", commit = "true" }, expect = "OK" },
  { cmd = "FlushAndQuit",                                                              expect = "OK" },
]

[driver.missionParams]
# GS-1's values VERBATIM, except the sibling's name: the booster is named by stock's
# AutoRename from the parent's name at the split, which is "VN1 Alpha" by then.
throttle = 1.0
stagingApoapsisMeters = 700
stagingMaxAltMeters = 1500
apoapsisWindowMeters = { min = 600, max = 1600 }
stageSettleFrames = 2
chuteArmMaxRateMps = 30
chuteFullDeployAltMeters = 600
landedSituations = ["LANDED", "SPLASHED"]
ascentTimeoutSeconds = 90
coastTimeoutSeconds = 120
stageTimeoutSeconds = 60
descentTimeoutSeconds = 300
siblingVesselName = "VN1 Alpha Probe"
siblingDownTimeoutSeconds = 240

[dimensionsCovered]
# D14 values only (each already covered elsewhere). No D value names a vessel rename.
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The pod and the booster (GS-1 / QL-4's floor). FIRST FLIGHT `2026-10-11_1953` committed
# exactly 2 (`Committed tree 'GS1 Auto-Chute Booster' (2 recordings)`): no optimizer split,
# no touchdown debris, and the committed-restore resumes the same recording. The ceiling
# absorbs debris and optimizer splits on another flight.
count = { min = 2, max = 14 }

# REPORT-ONLY until a reading run. The committed legs: the pod's identity (its recording and
# any commit-time optimizer split of it) all "VN1 Charlie", the booster's legs on the automatic "VN1 Alpha Probe",
# no leg left on an earlier name. The save's live vessels: the pod "VN1 Charlie", the
# booster "VN1 Alpha Probe".
[expectations.recordings.structure]
gating         = false
committedTrees = { min = 1, max = 1 }
recordingNames = { "VN1 Charlie" = { min = 1 }, "VN1 Alpha Probe" = { min = 1 }, "VN1 Bravo" = { max = 0 }, "VN1 Alpha" = { max = 0 }, "GS1 Auto-Chute Booster" = { max = 0 } }
vesselNames    = { "VN1 Charlie" = { min = 1, max = 1 }, "VN1 Alpha Probe" = { min = 1, max = 1 }, "VN1 Bravo" = { max = 0 }, "VN1 Alpha" = { max = 0 }, "GS1 Auto-Chute Booster" = { max = 0 } }

[expectations.logContracts]
required = [
  "startrecording recordingId=[0-9a-f]+ already=false",
  # (g) Pinned WHOLE off result `2026-10-12_0458` (three FLIGHT cells, all reachable on the
  # recorded pad vessel).
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=VesselNames scene=FLIGHT",

  # (a) The pad rename: the seam's own line, then Parsek's capture of the stock accept
  # (VesselNameLiveSync.OnStockRenameAccepted) and the decision (VesselNameStore).
  "renamevessel applied pid=[0-9]+ old='GS1 Auto-Chute Booster' new='VN1 Alpha' type=Ship active=true changed=true legs=[1-9][0-9]* decision=StockDialog decisionName='VN1 Alpha'",
  "Stock rename captured: source=StockDialog pid=[0-9]+ guid=[0-9a-f]+ 'GS1 Auto-Chute Booster' -> 'VN1 Alpha' seq=[0-9]+ namingPart=\\S+ currentLeg=[0-9a-f]+",
  "Vessel name decision recorded: identity=\\S+ 'GS1 Auto-Chute Booster' -> 'VN1 Alpha' source=StockDialog seq=[0-9]+ legs=[1-9][0-9]* ",

  # (b) The split: the booster becomes a controlled child under stock's automatic name.
  "ProcessBreakupEvent: controlled child created: pid=[0-9]+",

  # (a) The post-split rename covers the pod's identity (legs >= 1: one recording on GS-1).
  "renamevessel applied pid=[0-9]+ old='VN1 Alpha' new='VN1 Bravo' type=Ship active=true changed=true legs=[1-9][0-9]* decision=StockDialog decisionName='VN1 Bravo'",
  "Vessel name decision recorded: identity=\\S+ 'VN1 Alpha' -> 'VN1 Bravo' source=StockDialog seq=[0-9]+ legs=[1-9][0-9]* ",
  "Apply pass \\(stock-rename\\): identities=[0-9]+ withDecision=[0-9]+ newlyCovered=[0-9]+ newlyUncovered=[0-9]+ legsRenamed=[1-9][0-9]* ",

  # (d) The F9 is a save-file load: the save's names, so the pod reloads as and stays
  # "VN1 Alpha" (no write-back, forbidden below).
  "savegame name=quicksave folder=.+ saved=true",
  "loadgame start save=\\S+ name=quicksave scene=FLIGHT [^\\r\\n]* playerLoad=true",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave route=Focusable",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*\\[LoadPolicy\\] Save-file load intent armed: nodeUT=[0-9.]+ scene=FLIGHT",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave (?:(?!Load classified: )[\\s\\S])*Load classified: early=Cold refined=Cold scene=FLIGHT [^\\r\\n]*\\bcoldReason=save-file\\b",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*Save-scoped session state reset: reason=save-file ",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*OnLoad game state from save node: ledgerRows=[0-9]+ ",

  # (a) + (b) The commit after the F9: every leg of the pod's identity finalizes under the
  # save's "VN1 Alpha", the booster's legs under stock's "VN1 Alpha Probe".
  "committree committed=true",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='VN1 Alpha' points=",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='VN1 Alpha Probe' points=",

  # (c) The Parsek rename of the committed row writes through to the live pod, which
  # carries the save's "VN1 Alpha" at that moment (the F9 outcome).
  "\\[UI\\] Recording 'VN1 Alpha' renamed to 'VN1 Charlie' identity=\\S+ legs=[1-9][0-9]*",
  "Vessel name decision recorded: identity=\\S+ 'VN1 Alpha' -> 'VN1 Charlie' source=ParsekRename ",
  "Apply pass \\(parsek-rename\\): identities=[0-9]+ withDecision=[0-9]+ newlyCovered=[0-9]+ newlyUncovered=[0-9]+ legsRenamed=[1-9][0-9]* ",
  "Write-through applied: vessel pid=[0-9]+ guid=[0-9a-f]+ 'VN1 Alpha' -> 'VN1 Charlie' loaded=true namingPart=\\S+ reason=parsek-rename",
  "uiaction edit window=missions field=recordingname key=[0-9a-f]+ draft=VN1 Charlie committed=true ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "renamevessel rejected",
  "renamevessel error",
  "Parsek rename refused",
  # The F9 is not a revert (no revert undo); it reads the save's names (design 8).
  "Revert undo: dropped",
  "loadgame player-load: firing [\\s\\S]*Load classified: early=InSession refined=QuickloadFlight",
  "loadgame player-load: firing [\\s\\S]*Write-through applied(?: \\(proto\\))?: (?:vessel )?pid=[0-9]+ guid=[0-9a-f]+ '[^'\\r\\n]*' -> 'VN1 Bravo' ",
  # Nothing writes an earlier name back over a later decision.
  "Write-through applied(?: \\(proto\\))?: (?:vessel )?pid=[0-9]+ guid=[0-9a-f]+ '[^'\\r\\n]*' -> '(?:VN1 Alpha|GS1 Auto-Chute Booster)' ",
  # The commit after the F9 finalizes no leg under a replaced name.
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='(?:VN1 Bravo|GS1 Auto-Chute Booster)' points=",
  "Quickload resume prep skipped",
]

[runtime]
# Wall for the whole drive phase including boot (plus the 120 s budget of the ~25 s 1x
# WarpToUT): two LoadGame (max(300,600)+60 each =
# 1320), StartRecording 180, RunTests 300, mission 900, SaveGame 180, CommitTree 120, the
# StopRecording / SetSetting / UiAction / RenameVessel / ListHandles steps on the default
# budget. Expected wall about 10 minutes (boot, a ~100 s mission with a ~240 s booster
# descent, one reload).
budgetSeconds = 3600

[retry]
policy = "once"

[expectedFail]
bugId = ""
