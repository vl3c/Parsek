schema = 1
id = "PPS-0b-capture-spike-modded"
tier = "operator"
# THROWAWAY P0 capture spike for docs/dev/design-part-ghost-parity.md (branch part-parity-spike,
# never merged). One-part vessels spawned co-orbital in LKO, each with its Parsek ghost built
# from its own snapshot and parented at zero offset; a dedicated ortho camera renders each side
# over black and white under a neutral light rig into Screenshots/pps-*.png.
description = "P0 spike: real part vs co-located ghost through a dedicated RenderTexture camera (modded-compat)."
instanceProfile = "modded-compat"
tags = ["ingame-batch", "ghost-visual", "screenshots", "spike"]

[fixture]
saveTemplate = "fixtures/saves/eva2-lko-crewed"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "PartParitySpike" }, expect = "OK", budget = 420 },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
required = [
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=PartParitySpike scene=FLIGHT",
  "\\[Parsek\\]\\[INFO\\]\\[PartParitySpike\\] summary: cases=[0-9]+ files=[0-9]+",
]
forbidden = []

[runtime]
budgetSeconds = 900

[retry]
policy = "none"

[expectedFail]
bugId = ""
