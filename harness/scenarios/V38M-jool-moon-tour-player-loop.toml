schema = 1
id = "V38M-jool-moon-tour-player-loop"
# =====================================================================================
# AUTHORED 2026-11-14, NEVER FLOWN, WAITING ON ITS FIXTURE: `jool-tour-recorded` does
# not exist until B47-jool-moon-tour flies green and is harvested --keep-parsek.
# Until then this lane is listed in harness/lib/test_hlib.py PENDING_FIXTURE_LANES,
# which keeps every committed suite green without the fixture; a run refuses at
# staging.
#
# THE M-MIS-6 READING (todo NEXT-TESTS-TO-BUILD-2026-11-11 item 1). The multi-moon
# configuration hold (docs/dev/design-mission-multimoon-alignment.md) has only ever
# run headless. Its subject is B47's product: the Kerbin -> Jool tree
# `6ec68e87b782476f970a71df8c8b4685` with a Jool -> Laythe -> Vall -> Tylo tail. V33M's shape:
# MissionConfig loop=true + StartLoopPlayback, the build lines, then the
# MoonArrivalHold batch at the Space Center.
#
# WHAT THE LOG MUST SHOW (literals from Source/Parsek/MissionLoopUnitBuilder.cs):
#   `ENGAGED re-aim Kerbin->Jool via Sun`, as on V33M.
#   `ARRIVAL HOLD dest=Jool kind=config Talign=<T_config>s moons=3 ...
#       (aligns the multi-moon configuration phases, mode=` - the config hold with
#       three participants. Design D2: the anchor is Vall (smallest duty) and the
#       scan accepts k = 2, so T_config = 2 x P_Vall = 211,924.18 s (P_Vall
#       105,962.09 s at mu_Jool 2.82528e14).
#   `BATCH_COMPLETE ... category=MoonArrivalHold scene=SPACECENTER`, pinned whole.
# What could move it: a destination-side loiter cut AFTER the Jool SOI entry (the
# tour's Jool coast between legs) makes ComputeMultiMoonConfigHold refuse with an
# amber; ComputeArrivalHoldKeepingMoonLoiterWhole retries with the loiter whole
# first, so the engage is the prediction. A decline reds on the forbidden amber and
# names its reason; read it before re-pinning.
# `alignedWindows=` (design section 2 predicts ~40) is reported on the same line and
# deliberately not pinned until the reading.
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-11-14, NEVER FLOWN, WAITING ON ITS FIXTURE `jool-tour-recorded` (harvested from B47-jool-moon-tour). The player loop on the Kerbin->Jool->Laythe->Vall->Tylo tree: re-aim Kerbin->Jool engages and the M-MIS-6 multi-moon configuration hold engages with three moons on T_config = 2 x P_Vall; the live MoonArrivalHold cell runs at the Space Center."
instanceProfile = "stock-minimal"
tags = ["V38", "player-loop", "loop-playback", "reaim", "arrival-hold", "multi-moon-hold", "jool", "laythe", "vall", "tylo", "moon", "ingame-batch", "pending-fixture", "pending-flight"]

[fixture]
saveTemplate       = "fixtures/saves/jool-tour-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig",     args = { tree = "6ec68e87b782476f970a71df8c8b4685", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "6ec68e87b782476f970a71df8c8b4685" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "RunTests",   args = { category = "MoonArrivalHold" },             expect = "OK", budget = 300 },
  # The export sits right before teardown (RenderComposeVerifierWiringTests placement
  # rule): the recorder accumulates from Awake, so an earlier export drops later steps.
  { cmd = "ExportRenderManifest",                                            expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
D11 = ["arrival-hold"]
D14 = ["jool", "laythe", "vall", "tylo", "scene-flight", "scene-ksc", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# DERIVED (B47's own window): re-pin to {N, N + 1} from the harvested sidecar count.
count = { min = 6, max = 13 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "ENGAGED re-aim Kerbin->Jool via Sun",
  "ARRIVAL HOLD dest=Jool kind=config Talign=21192[34]\\.[0-9]+s moons=3 ",
  "ARRIVAL HOLD dest=Jool kind=config .*\\(aligns the multi-moon configuration phases, mode=",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=MoonArrivalHold scene=SPACECENTER",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "FORCED FAITHFUL",
  "no member yields a re-aim transfer",
  "Arrival amber SET: tree=6ec68e87b782476f970a71df8c8b4685",
  "timejump refused reason=backward-jump",
]

[expectations.rewind]
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
committedTrees = { min = 1, max = 1 }
trees          = { min = 1, max = 2 }

[expectations.renderComposition]

[runtime]
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
