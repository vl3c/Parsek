schema = 1
id = "GS-7-kerbalx-crash-watch-hold"
# =====================================================================================
# THE WATCHED EXPLOSION HOLD: fly the staged Kerbal X, CRASH it deliberately, commit
# through a Space Center hop, Rewind-to-Launch, put the Jumping Flea on the pad and
# WATCH the replay all the way into the ground - so the one watch-mode behaviour the
# whole V-family declined to claim runs under a live camera: the watched ghost's
# terminal explosion, the 5 s watch hold that follows it, the hold's per-frame retarget
# scan, and the `watch hold expired` derender that ends it.
#
# Roadmap: "The ghost-replay coverage program (GS-4 derivatives)", Tier A item 2, and
# the 2026-09-08 priority register's item 3. GS-4 is the template; GS-6 is the
# precedent for an OPT-IN branch of the `kx_rewind_watch` machine that leaves the
# pre-existing graph byte-identical when its key is omitted. This lane adds one such
# key, `impactProfile = true`, and pins what the crash makes observable.
#
# =====================================================================================
# 1. WHY A CRASH, AND NOT THE ROADMAP'S FIRST SUGGESTION
# -------------------------------------------------------------------------------------
# The roadmap entry says "watch the CORE CHILD through its destruction". The core child
# is NOT destroyed inside the recorded span: on every archived GS-4 / GS-6 flight it is
# finalized `terminal=SubOrbital` at the seam commit (`FinalizeTreeRecordings ...
# vessel='Kerbal X Probe' ... terminal=SubOrbital`, e.g. `2026-08-28_1855`), so its
# ghost ends `stale past-end ghost (no longer held)` with no explosion to hold on. The
# booster debris cannot be pinned either: across twelve archived Kerbal X replays
# (GS-4 `2026-08-27_2145` / `_2204`, `2026-08-28_0051` / `_1527` / `_1544` / `_1550`
# / `_1855`, GS-6 `2026-09-02_1420` / `_1505` / `_1524` / `_1542` / `_1551` / `_1601`)
# the pair-1 and pair-2 boosters end by `parent-anchored debris outside relative
# coverage at endpoint` on most flights and by an endpoint explosion on some, with no
# index behaving the same way twice in a row, and the pair-3 boosters explode 1.2 s
# after their ghosts spawn (`Early debris completion ... explosionUT=66.7x` on all
# twelve), a window no watch entry can be timed into. The only ghost whose terminal
# can be MADE Destroyed deterministically is the parent itself, which is the roadmap
# entry's own second suggestion: "a crash-landing profile whose multi-part breakup
# also claims D5 crash-coalescing".
#
# =====================================================================================
# 2. THE CODE FACTS THIS SPEC RESTS ON - read, not assumed.
# -------------------------------------------------------------------------------------
# (1) THE WATCHED EXPLOSION HOLD IS THE POLICY'S DESTROYED BRANCH.
#     `ParsekPlaybackPolicy.HandlePlaybackCompleted` (ParsekPlaybackPolicy.cs ~660-740):
#     when the completed ghost is the watched one, needs no spawn and has no
#     continuation, the hold is `TerminalState.Destroyed ? 5f : 3f` seconds,
#     `StartWatchHoldFromPolicy` arms it, `TriggerExplosionIfDestroyed` fires the stock
#     `FXMonger.Explode` at the ghost's terminal position, and the policy writes
#     `Watch hold started for #<i>: 5s terminal=Destroyed`. Every frame of the hold
#     `WatchModeController.ProcessWatchEndHoldTimer` re-runs `FindNextWatchTarget`
#     (the RETARGET scan: `auto-followed during hold` is the reason it writes when a
#     continuation appears); with none, the hold expires with `Watch hold expired for
#     #<i>` and the ghost is destroyed with reason `watch hold expired`. GS-4 measured
#     the 3 s SubOrbital form of this path; nothing has measured the Destroyed form
#     under a camera.
# (2) WHY THE RETARGET SCAN FINDS NOTHING HERE, BY DESIGN. The parent's
#     `ChildBranchPointId` is the crash split. `GhostPlaybackLogic.FindNextWatchTarget`
#     walks that branch point's children: same-PID children first, then a
#     different-PID fallback that EXCLUDES `IsDebris` recordings. Every child of a crash
#     is debris (`ProcessBreakupEvent: debris child created ... alive=False`, pruned as
#     single-point stubs at finalize), so the scan returns -1 and the hold runs to
#     expiry. The `FindNextWatchTarget: currentIndex=<i>, chainId=null, chainIndex=-1,
#     treeId=<t>, childBpId=<bp>` line is the scan's own evidence and is required.
# (3) PARSEK DOES NOT COMMIT IN FLIGHT AFTER THE ACTIVE VESSEL DIES. `OnVesselWillDestroy`
#     routes an active-vessel death in tree mode to `ShowPostDestructionTreeMergeDialog`
#     (ParsekFlight.cs ~3326-3520): it waits out the coalescer, finalizes the tree
#     (`all leaves terminal - finalizing tree`, or the debris-only-blockers form),
#     STASHES it as a pending tree and explicitly defers the commit to the post-report
#     scene transition (#434: the stock crash report shows first so a player can still
#     revert). The seam `CommitTree` verb refuses `no-active-tree` once the tree is
#     stashed, and `InvokeRewindToLaunch` is `RequiresFlight` and refuses a pending tree
#     through `RecordingStore.CanRewind`. So the machine hops, in this order: a
#     THROWAWAY Jumping Flea is launched from the post-crash FLIGHT scene (kRPC's
#     `LaunchVessel` yields on KSP's pre-flight checks, which only complete in FLIGHT -
#     the first flight measured the Space Center form of that call hanging for its
#     whole budget, see STATUS); `ExitToSpaceCenter` (proceeds under autoMerge=true with
#     `pendingTreeVariant=None`, exactly CL-2's measured gate line) lets the pending
#     tree auto-commit on arrival (`Silent full-fidelity auto-commit (scene-exit)` then
#     `Committed tree ...`); `ListHandles kind=committed` reads back `count>=1` as the
#     commit proof; `SaveGame name=persistent` writes that committed state to disk
#     (the exit's own persistent.sfs still carries the PENDING tree), and because
#     KSP's `FlightState` capture stamps `activeVesselIdx = 0` outside FLIGHT and the
#     Flea is the only vessel left, the save is FOCUSABLE; `LoadGame` then boots it
#     into FLIGHT on the Flea and the rewind verb runs from there - the rewind's
#     quicksave predates the throwaway launch, so that craft is rewound out of
#     existence and the real watcher is launched again after the rewind by the
#     unchanged post-rewind block. `autoMerge=true` is therefore LOAD-BEARING twice
#     over in this lane (GS-4's reason, and the exit gate).
# (4) THE CRASH COALESCER'S OWN VERDICT. This spec was first written expecting the
#     impact to print the same `type=JointBreak, cause=DECOUPLE` shape as a staging
#     drop (CL-1's pod impact, `2026-07-28_1913` lines 10707-10762, did), which would
#     have left the crash claim resting on the destroyed-child lines alone. Run 1
#     measured better: the Kerbal X stack's impact closed as `Coalescer emitted split
#     branch point: ut=127.96, type=Breakup, cause=CRASH, debris=2` - the coalescer's
#     crash classification by name, which no staging drop prints. That line is the D5
#     `crash-coalescing` token; the crash-side lines that ride with it are the
#     coalescer building child recordings for vessels ALREADY GONE inside its window
#     (`CreateBreakupChildRecording: using pre-captured trajectory point for pid=<p>
#     (vessel destroyed)`, `ProcessBreakupEvent: debris child created: ... alive=False`),
#     the recorded vessel's death stamp (`Vessel was destroyed during recording.
#     Distance from launch: <n>m, Max distance: <n>m`) and the parent's
#     `terminal=Destroyed`. `type=Breakup` also matters to code fact 2: for a Breakup
#     branch point `FindNextWatchTarget` refuses the different-PID fallback outright.
# (5) THE PROFILE. All three booster pairs drop exactly as GS-4's do (the recorded
#     population keeps its six `Kerbal X Debris` children); on the LAST drop the
#     machine does not throttle the Mainsail back up, disengages the autopilot, reads
#     the tree id while the recorder is live, and rides the unpowered stack from ~8 km
#     and ~400 m/s over its apex into the ground. IMPACT is OBSERVED by either kRPC
#     signal a destroyed active vessel produces (a `vessel_lost` snapshot, or the
#     frozen-telemetry detector tripping when KSP hands the active vessel to a
#     surviving fragment); both stamp the recording's end UT. The pod stack carries no
#     parachute (GS-6's craft census), so the stack cannot survive the impact.
#
# =====================================================================================
# 3. STATUS: READING RUN 1 FLOWN, `2026-09-08_1130_GS-7-kerbalx-crash-watch-hold` and
# its retry `_1157_a2`, both INVALID(autopilot-flake, mission budget expired) - and
# both attempts MEASURED the whole crash half exactly as the header predicts before
# stalling on one kRPC limit. Launch UT 30.2; the three drops at +29 / +34 / +37 s;
# the stack impacted at UT ~127.7 (`Vessel was destroyed during recording. Distance
# from launch: 374m, Max distance: 7132m`), the coalescer closed it as `type=Breakup,
# cause=CRASH, debris=2` (a line only a crash produces - the staging drops read
# `type=JointBreak, cause=DECOUPLE` - now the D5 `crash-coalescing` token), Parsek
# finalized in flight (`only debris leaves still block same-scene merge - finalizing
# tree in flight`) and stashed, `ExitToSpaceCenter` answered `scene=SPACECENTER` in
# 2.7 s, the tree auto-committed on arrival (`Silent full-fidelity auto-commit
# (scene-exit): tree='Kerbal X' recordings=8 spawnable=0`) and `ListHandles
# kind=committed count=8`. The unpowered stack also kept the boosters inside the
# physics bubble long enough for TWO `Debris TTL expired, ending recording` lines
# (expiry=125.6, the pair dropped at +37 s) - the first flight anywhere to reach the
# TTL-expiry exit rather than the bubble-exit one, which is why D5
# `staging-debris-ttl` is claimed below off a MEASURED line.
# THE STALL: the machine then launched the throwaway Flea FROM THE SPACE CENTER and
# the kRPC `LaunchVessel` RPC never returned - KSP logged no launch at all. Decompiled
# from the instance's `KRPC.SpaceCenter.dll`: `LaunchVessel` yields on
# `WaitForVesselPreFlightChecks` until KSP's pre-flight checks complete, which they
# never do outside FLIGHT. ROUND 2 reorders the hop (code fact 3): launch the Flea from
# the post-crash FLIGHT scene, exit, read the commit back, `SaveGame`, `LoadGame` into
# FLIGHT on the Flea, rewind. Two tokens were re-cut off run 1's bytes: the finalize
# line (the product prints an em dash, which the first regex spelled as a hyphen) and
# the coalescer line above. Every post-commit token below stays a first-flight pin
# until round 2 measures it.
# Pre-flight risks for round 2, each with the line that would name it on a red run:
#   - the stack SURVIVES the impact (a bounce that leaves the pod intact): the machine
#     never observes a loss and flakes on `impactCoastFrames` / `flightMaxSeconds` -
#     driver-INVALID, never PARSEK-FAIL, per mission-vs-Parsek orthogonality;
#   - the throwaway launch from the post-crash FLIGHT scene with the stock crash
#     report on screen (kRPC `launch_vessel` has only ever been issued over a live pad
#     craft): a TEMP-READY give-up naming the observed name/situation;
#   - the reload not landing in FLIGHT (a Space Center save whose activeVesselIdx is
#     not the Flea): `loadgame complete scene=SPACECENTER` and a RELOAD-READY give-up;
#   - the crash debris children surviving finalize as multi-point recordings (the
#     `recordings.count` floor is 7 = parent + 6 boosters for exactly this reason; a
#     higher measured count is re-pinned, not widened);
#   - the watched parent retiring under the camera by some path other than the hold
#     (the required `reason=watch hold expired` token is what reds on it, and that red
#     would be the product finding this lane exists to make visible).
# =====================================================================================
tier = "operator"
description = "Watched explosion hold: staged Kerbal X ascent flown into the ground after its last booster drop, committed through a Space Center hop (post-destruction stash, autoMerge commit on arrival), Rewound-to-Launch from a throwaway pad launch, then WATCHED through its replayed impact - the 5 s Destroyed-terminal watch hold, its retarget scan and its `watch hold expired` derender gated, plus the crash coalescer's destroyed-children tokens."
instanceProfile = "stock-minimal"
tags = ["GS7", "rewind-to-launch", "watch-mode", "ghost-render", "explosion-hold", "crash-coalescing", "ghost-lifecycle"]

[fixture]
# gs1-two-stage-pad, exactly as GS-4 / GS-6 use it. No fixture change.
saveTemplate       = "fixtures/saves/gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "kx_rewind_watch"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
#
# GS-4's prelude verbatim. `autoMerge=true` is load-bearing for the exit gate (code
# fact 3), `verboseLogging=true` for the Group-1 auto-record token, the `[Flight]`
# finalize line, the `[ExplosionFx]` and `[Watch]` lines below, and
# `ghostRenderTracing=true` for every MeshSpawned / MeshDestroyed token.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },      expect = "OK", budget = 300, label = "boot" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" },   expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoMerge", value = "true" },            expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },       expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" },   expect = "OK" },
  { phase = "mission",                                                            expect = "MISSION-OK", budget = 1700 },
  { cmd = "FlushAndQuit",                                                         expect = "OK" },
]

[driver.missionParams]
craftName        = "Kerbal X"
launchSite       = "LaunchPad"
watcherCraftName = "Jumping Flea"
# THE ONE KEY THAT IS THE LANE. Omitted = GS-4's 23-phase graph exactly; true = the
# impact branch described in the header (mlib.kxrw_decide, `impactProfile`).
impactProfile = true
# The impact window: frames the unpowered stack is given to reach the ground after
# the last booster drop. ~8 km up at ~400 m/s means an apex near 16 km and an impact
# ~70-80 s later; 600 frames at the 0.5 s poll is 300 s, and `flightMaxSeconds`
# (default 420 s from the launch click) bounds it again above that.
impactCoastFrames = 600
# Frames held after the loss before the exit verb goes out: the C# post-destruction
# finalize waits up to 5 s real time for the coalescer to close, then stashes.
impactSettleFrames = 16
# The exit spans a full scene load, and the commit read-back is one verb reply.
scExitFrames = 240
scCommittedFrames = 40
# THE RELOAD HALF (code fact 3). `reloadSaveName` is the run's own save folder,
# handed to the mission by R10's reply capture: the boot LoadGame step above is
# labelled `boot` and its OK payload carries `save=<runSave>`, which is the only
# way a mission can learn a name the harness minted at staging. The SaveGame reply
# and the post-load frame bound are one verb reply each; the LoadGame itself blocks
# inside the bridge for its 420 s poll window, so `reloadFrames` bounds silence
# AFTER it, the rewindFrames shape.
reloadSaveName = "${boot.save}"
scSaveFrames = 40
reloadFrames = 40

[dimensionsCovered]
# CLAIM-IS-NOT-GATE. Every value below is backed by a REQUIRED token in this spec's
# own logContracts.
#
# `auto-record-launch` <- "Auto-record started (..." (GS-4's Group 1).
D1 = ["auto-record-launch"]
# `crash-coalescing` <- the coalescer's own crash verdict, MEASURED on run 1:
#   `Coalescer emitted split branch point: ut=<t>, type=Breakup, cause=CRASH, debris=<n>`
#   (every staging drop reads `type=JointBreak, cause=DECOUPLE`), plus the four
#   crash-side lines of code fact 4 (destroyed-child pre-capture, `alive=False` child
#   creation, the death stamp, the parent's `terminal=Destroyed`).
# `staging-debris-ttl` <- `Debris TTL expired, ending recording: vesselPid=<p>
#   expiry=<t> currentUT=<t>` (BackgroundRecorder.cs, Info), MEASURED TWICE on run 1
#   (expiry=125.6): the unpowered stack falls alongside its boosters, so the 60 s TTL
#   runs out while they are still loaded, where every powered profile (GS-4, GS-6,
#   the B lanes) leaves them behind and ends their recordings on bubble exit. The
#   roadmap's item 5 called this cell's token "likely, not certain" on those lanes;
#   here it is structural.
# NOT `controlled-decoupled-child`: this profile never discards the core.
D5 = ["crash-coalescing", "staging-debris-ttl"]
# `basic-playback` / `mesh-lifecycle-derender` <- the MeshSpawned / MeshDestroyed
#   tokens plus the ghostLifecycle declaration (report-only until armed).
# `watch-mode-retarget-explosion-hold` <- THE cell: `Watch hold started for #<i>: 5s
#   terminal=Destroyed`, the `FindNextWatchTarget` retarget scan for the watched index,
#   `Stock FXMonger.Explode for ghost #<i> "Kerbal X"`, `Watch hold expired for #<i>`,
#   and the parent's `phase=MeshDestroyed ... reason=watch hold expired`. The retarget
#   half is the SCAN and its designed empty result (code fact 2): no continuation is
#   reachable from a crash, so `auto-followed during hold` is not produced and not
#   claimed as produced; a lane that wants the resolving form needs a watched ghost
#   whose branch point carries a live non-debris child.
D6 = ["basic-playback", "mesh-lifecycle-derender", "watch-mode-retarget-explosion-hold"]
# `rewind-to-launch` <- the product line and the seam terminal, as GS-4.
D9 = ["rewind-to-launch"]
# `scene-ksc` <- BOTH the exit verb's `exittospacecenter complete scene=SPACECENTER`
#   and the rewind terminal; `scene-map` <- `entermapview ok mapOpen=true`.
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc", "scene-map"]

[expectations]
# PLACEMENT IS LOAD-BEARING: `allowedAnomalies` must precede every
# [expectations.<sub>] header.
allowedAnomalies = []

[expectations.recordings]
# FIRST-FLIGHT FLOOR: parent + six booster debris = 7. Crash debris children are
# pruned as single-point stubs on the CL-1 precedent; any that survive raise the
# measured count and the reading run re-pins it exactly.
count = { min = 7 }

[expectations.logContracts]
# GROUPS, in emission order. [MEASURED] = the exact line was measured on a sibling
# lane / archived log named in the header; [DERIVED] = transcribed from the producer.
#
# GROUP 1 - LAUNCH, RECORDING, THE THREE DROPS (GS-4's tokens, measured 12x).
# GROUP 2 - THE CRASH (CL-1 `2026-07-28_1913` for the finalize / stash / death lines;
#   the `terminal=Destroyed` finalize line is GS-4's `FinalizeTreeRecordings` line
#   with the terminal word swapped, DERIVED).
#   "Active vessel destroyed in tree mode"      ParsekFlight.cs OnVesselWillDestroy (Info)
#   "ShowPostDestructionTreeMergeDialog: ... finalizing tree" (Info) - either the
#       all-leaves-terminal form or the debris-only-blockers form; both finalize. The
#       regex stops before the em dash the product prints (run 1 read the debris form).
#   "Coalescer emitted split branch point: ut=<t>, type=Breakup, cause=CRASH, debris=<n>"
#       ParsekFlight.cs ProcessBreakupEvent (Info) [MEASURED run 1: debris=2]
#   "Debris TTL expired, ending recording: vesselPid=<p> expiry=<t> currentUT=<t>"
#       BackgroundRecorder.cs:1432 (Info) [MEASURED run 1, twice]
#   "ShowPostDestructionTreeMergeDialog: pending tree stashed" (Info)
#   "Vessel was destroyed during recording. Distance from launch: <n>m, Max distance: <n>m"
#       VesselSpawner.cs:4097 (Info). Digits pinned: a stack that crashed on the pad
#       would read a distance under 30 m and be auto-discarded as a pad failure.
#   "CreateBreakupChildRecording: using pre-captured trajectory point for pid=<p> (vessel destroyed)"
#   "ProcessBreakupEvent: debris child created: pid=<p>, name='...', recId=<r>, alive=False"
#   "FinalizeTreeRecordings: rec='<r>' vessel='Kerbal X' points=<n> orbitSegs=<n> terminal=Destroyed"
#       ParsekFlight.cs (VERBOSE - the verboseLogging step above).
# GROUP 3 - THE SPACE CENTER HOP (CL-2's measured exit lines, then the auto-commit).
#   "exittospacecenter start scene=FLIGHT autoMerge=true hasActiveTree=false hasPendingTree=true ..."
#   "exittospacecenter complete scene=SPACECENTER game-loaded=true elapsed="
#   "Silent full-fidelity auto-commit (scene-exit): tree='...' recordings=<n> spawnable=<n>"
#   "Committed tree '...' (<n> recordings)"      RecordingStore.cs (Info) [MEASURED - CL-2]
#   "listhandles kind=committed count=<n> truncated=false"  the commit read-back (Info)
#   "savegame name=persistent folder=<save> saved=true"      the committed state on disk
#   "loadgame complete scene=FLIGHT save=<save> game-loaded=true"  back in FLIGHT on the Flea
# GROUP 4 - REWIND, MAP, WATCH (GS-4's tokens).
# GROUP 5 - THE GHOST LIFECYCLE AND THE HOLD (the lane's heart).
#   MeshSpawned parent + debris [MEASURED - GS-4]; NO probe token (no core discard).
#   "Stock FXMonger.Explode for ghost #<i> \"Kerbal X\" at" GhostPlaybackEngine.cs:8740
#       (VERBOSE, ExplosionFx). The ` at` after the closing quote keeps `Kerbal X
#       Debris` from matching.
#   "FindNextWatchTarget: currentIndex=<i>, chainId=null, chainIndex=-1, treeId=<t>, childBpId=<bp>"
#       WatchModeController.cs:2504 (VERBOSE, rate-limited on a shared key; printed
#       at the watched ghost's completion). `chainId=null`: this lane's parent is a
#       tree recording with no chain, and its childBpId is a real id (the crash split).
#   "Watch hold timer set: holdUntilRealTime="  WatchModeController.cs:3743 (Info)
#   "Watch hold started for #<i>: 5s terminal=Destroyed"  ParsekPlaybackPolicy.cs:733 (Info)
#       The 5 s is the Destroyed branch; GS-4 measured the 3 s SubOrbital branch.
#   "Watch hold expired for #<i> at t="         WatchModeController.cs:2991 (Info)
#   "phase=MeshDestroyed ... vessel=Kerbal X reason=watch hold expired"  - THE token.
#       Deliberately NOT the GS-4 alternation: an auto-follow or a `playback
#       completed` ending here would mean the hold did not run, which is the finding.
#   "phase=MeshDestroyed ... vessel=Kerbal X Debris"  [MEASURED - GS-4]
required  = ["Auto-record started \\((?:PRELAUNCH|LANDED|first staging on pad)",
             "Recording started",
             "Active vessel destroyed in tree mode",
             "ShowPostDestructionTreeMergeDialog: (?:all leaves terminal|only debris leaves still block same-scene merge)",
             "Coalescer emitted split branch point: ut=[0-9.]+, type=Breakup, cause=CRASH, debris=[1-9][0-9]*",
             "Debris TTL expired, ending recording: vesselPid=[0-9]+ expiry=[0-9.]+ currentUT=[0-9.]+",
             "ShowPostDestructionTreeMergeDialog: pending tree stashed",
             "Vessel was destroyed during recording\\. Distance from launch: [0-9]{2,}m, Max distance: [0-9]{4,}m",
             "CreateBreakupChildRecording: using pre-captured trajectory point for pid=[0-9]+ \\(vessel destroyed\\)",
             "ProcessBreakupEvent: debris child created: pid=[0-9]+, name='[^']*', recId=[0-9a-f]+, alive=False",
             "FinalizeTreeRecordings: rec='[0-9a-f]+' vessel='Kerbal X' points=[1-9][0-9]* orbitSegs=[0-9]+ terminal=Destroyed",
             "exittospacecenter start scene=FLIGHT autoMerge=true hasActiveTree=false hasPendingTree=true",
             "exittospacecenter complete scene=SPACECENTER game-loaded=true elapsed=",
             "Silent full-fidelity auto-commit \\(scene-exit\\): tree='.+' recordings=[1-9][0-9]* spawnable=[0-9]+",
             "Committed tree '.+' \\([1-9][0-9]* recordings\\)",
             "listhandles kind=committed count=[1-9][0-9]* truncated=false",
             "savegame name=persistent folder=[^ ]+ saved=true",
             "loadgame complete scene=FLIGHT save=[^ ]+ game-loaded=true",
             "Rewind-to-Launch initiated to UT",
             "invokerewindtolaunch complete rec=",
             "entermapview ok mapOpen=true",
             "exitmapview ok mapOpen=false",
             "enterwatchmode complete: index=",
             "phase=MeshSpawned [^\\r\\n]*vessel=Kerbal X reason=ghost-created",
             "phase=MeshSpawned [^\\r\\n]*vessel=Kerbal X Debris",
             "Stock FXMonger\\.Explode for ghost #[0-9]+ \"Kerbal X\" at",
             "FindNextWatchTarget: currentIndex=[0-9]+, chainId=null, chainIndex=-1, treeId=[0-9a-f]+, childBpId=[0-9a-f]+",
             "Watch hold timer set: holdUntilRealTime=",
             "Watch hold started for #[0-9]+: 5s terminal=Destroyed",
             "Watch hold expired for #[0-9]+ at t=",
             "phase=MeshDestroyed [^\\r\\n]*vessel=Kerbal X reason=watch hold expired",
             "phase=MeshDestroyed [^\\r\\n]*vessel=Kerbal X Debris"]
# The suite-wide ERROR pattern; it also covers the seam verbs' own failure terminals
# (a refused exit, a refused rewind, a watch that never entered all log at ERROR).
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

# REPORT-ONLY until the reading run (GHOSTLIFE_ARMED_SPECS is the arming roster, and
# `test_no_committed_spec_arms_ghost_lifecycle_gating` reds on arming before the
# roster records the flights). INTERIM window: parent + 6 boosters = 7 spawned;
# requireBalanced is the derender tripwire GS-4 established.
[expectations.ghostLifecycle]
spawned = { min = 7 }
requireBalanced = true

# REPORT-ONLY: no Re-Fly machinery may have run (Rewind-to-Launch builds neither).
[expectations.rewind]
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# REPORT-ONLY structural shape, DERIVED: one committed tree; the parent and all six
# boosters terminate Destroyed (the boosters are killed on unload or by impact on
# every archived flight; the parent by this lane's impact); the three drops plus the
# crash split coalesce as JointBreak.
[expectations.recordings.structure]
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 7 }
branchPoints   = { JointBreak = { min = 4 } }
terminalStates = { Destroyed = { min = 7 } }

[runtime]
# GS-4's 2400 re-derived for this profile: the flight is SHORTER (impact ~110 s after
# the click against GS-4's ~105 s + 20 s coast, no part sweep) and the replay wait
# spends the same span again in real time, but the Space Center hop adds one scene
# exit (~30-60 s) and one extra pad rollout (~120 s) before the rewind. Net the same
# order; the number is a kill backstop, not a target.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
# EMPTY, deliberately - an expectedFail key would demote the exact hold / derender
# behaviour this lane exists to gate.
bugId = ""
