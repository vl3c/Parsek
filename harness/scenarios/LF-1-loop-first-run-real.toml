# ARMED 2026-09-23 off reading run `2026-09-22_2350` (PASS attempt 1, wall ~3 min,
# every facet below measured exactly): trees 1, committedTrees 1, recordings 1, Landed 1,
# spawnedVessels 1, vesselNames {Logi Cargo Rig: 1}. SUBJECT MOVED 2026-09-23: the
# census now expects the re-spawned rover plus the untouched pad Rig (a real vessel of
# the fixture, outside the tree) - UNVERIFIED until the reading run.
