schema = 1
id = "LF-1-loop-first-run-real"
# -------------------------------------------------------------------------------------
# D18 `loop-first-run-is-real` (catalog section 2, the B8 additional assertion): after
# loop cycles plus one rewind re-cross of the spawn window, exactly ONE real vessel with
# the recording's spawn pid exists.
#
# WHY THIS SUBJECT. No committed recorded fixture can be rewound to launch: every
# harvest prunes `Parsek/Saves` and clears the `rewindSave = parsek_rw_*` hint (H58's
# note), and the only fixtures with RewindPoints (bdock-recorded, refly-autopilot-recorded)
# carry no spawnable non-chain leaf. So the lane PRODUCES its subject in-run, H58's road:
# StartRecording on the pad probe of `logi-cargo-pad` (a crewless Probe, so no crew
# reservation rides the re-spawn), StopRecording, CommitTree. The subject is a
# single-recording, NON-CHAIN tree with a Landed terminal, which is the shape the #573
# rewind lift (`standalone = string.IsNullOrEmpty(rec.ChainId)`) and the spawn gates
# (`"chain looping"`) both need.
#
# WHY THE LOOP IS ARMED AFTER THE REWIND, NOT BEFORE. Mission loops never fire a
# terminal spawn: a loop-unit member is intercepted ABOVE the past-end completion in
# both the flight engine (`GhostPlaybackEngine` Phase D2, `UpdateUnitMemberPlayback` then
# `continue`) and at KSC (`ParsekKSC` "Phase E parity", `UpdateUnitMemberKsc`, whose doc
# says the looping Mission "never fires the terminal-spawn"). The real vessel of a looped
# mission is therefore the one it already has, and a strip while the loop is armed would
# leave nothing to re-spawn it. The lane rewinds with the loop OFF, lets the re-cross
# materialize the vessel once, then arms the loop and runs three cycles over it.
#
# CLAIM SCOPE: "REWIND, THEN LOOP". The discriminating half is the REWIND: strip to
# pid 0, exactly one `Vessel respawned`, a stable spawnedPid afterwards, and the save
# census. The loop cycles do NOT test the spawn gate: a mission-loop member goes to
# `UpdateUnitMemberPlayback` and `continue`s before `HandlePastEndGhost`
# (GhostPlaybackEngine.cs ~1253-1259), so a loop can never spawn and the count stays 1
# whatever the gate says. They only show the pid survives them (the rate-limited
# `Spawn suppressed: ... already spawned` summary is pinned at least once after a cycle).
# The catalog's rewind re-cross WITH the loop in play is not driven: a loop-armed rewind
# would leave nothing to re-spawn it (zero vessels), filed as the operator question
# LOOP-ARMED-REWIND-LEAVES-ZERO-VESSELS in docs/dev/todo-and-known-bugs.md. The cell is
# claimed with this narrowed scope, the V26T destroyed-half precedent.
#
# SCOPE OF THE LOOP CYCLES, STATED. The reload after the KSC re-spawn reads a save the
# Space Center wrote, which carries `activeVessel = 0` (measured), so FLIGHT focuses the
# host asteroid at index 0, not the Rig: the loop ghost sits in the `Beyond` zone (never
# drawn) through all three cycles. The claim does not need it drawn - the spawn decision
# runs per recording every frame in `ParsekFlight`'s flag pass, render zone or not, and
# the summary line pinned below is that pass. A lane that also wants the cycles DRAWN over
# the pad can reuse PR-E's `pad-runway-pair` (a runway rover at index 0).
# The Missions window is opened before MissionConfig because its draw seeds the default
# mission of a tree committed mid-session (reading 1 refused `unknown-tree` without it;
# GUI-17's opening sequence).
#
# THE WITNESSES. The guard logs nothing per decision, so the claim rests on:
#   (1) the produced save: `spawnedVessels` (FLIGHTSTATE vessels behind a committed
#       recording's spawnedPid) and `vesselNames` (every non-SpaceObject vessel by name,
#       which catches a second copy under a FRESH pid that the pid facet cannot);
#   (2) `ListHandles kind=committed` captures folded into MISSIONMARK lines through the
#       R10 `${label.field}` substitution, so the log carries the recording's spawnedPid
#       at commit, after the rewind, after the KSC re-spawn, after the reload and after
#       each loop cycle - and a back-referenced regex pins the post-spawn pid unchanged.
# -------------------------------------------------------------------------------------
tier = "nightly"
description = "D18 loop-first-run-is-real: produce a single-recording non-chain Landed subject in-run on logi-cargo-pad (StartRecording, StopRecording, CommitTree), Rewind-to-Launch it (the vessel is stripped), let 1x KSC time re-cross EndUT so the vessel re-spawns exactly once, reload into FLIGHT (a Space Center save focuses index 0, the host asteroid, so the loop ghost is never drawn; the spawn decision runs regardless), arm the mission loop through the Missions window and run three StartLoopPlayback cycles. CLAIM SCOPE: rewind, then loop - the rewind half is what discriminates; loop members never reach the spawn path, so the cycles show only that the pid survives them. LIVE-PROVEN 2026-09-22: reading _2350 PASS, armed _2353 PASS, negative control _2355 red on exactly its two seeds. The recording's spawnedPid is folded into MISSIONMARK lines at every stage, and the produced save must hold exactly one real vessel behind the spawn (saveparse spawnedVessels + vesselNames)."
instanceProfile = "stock-minimal"
tags = ["LF-1", "D18", "loop-playback", "rewind-to-launch", "spawn", "first-run-is-real",
        "R10", "runtime-handles"]

