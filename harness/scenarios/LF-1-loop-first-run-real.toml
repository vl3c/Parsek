gating         = true
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Landed = { min = 1, max = 1 } }
spawnedVessels = 1
vesselNames    = { "rover fuel 0" = 1, "Logi Cargo Rig" = 1 }

# Read off `2026-09-22_2350` on the pad subject; the vessel name, the respawn situation
# (regexed) and the retirement guard are UNVERIFIED on the rover until the reading run.
[expectations.logContracts]
required  = [
  "Recording started",
  # The commit ADOPTS the live rover: its own pid, spawned=true (the first run is real).
  "MISSIONMARK label=lf1-commit-count-1-pid-[1-9][0-9]*-spawned-true ",
  "invokerewindtolaunch complete rec=",
  # The strip reset the recording's spawn state.
  "MISSIONMARK label=lf1-rewound-count-1-pid-0-spawned-false ",
  # The #573 lift for a standalone (non-chain) rewind target with no live same-craft vessel.
  "same-recording spawn suppression lifted for standalone rewind target rec=\\S+ vessel=\"rover fuel 0\"",
  # THE CLAIM: exactly one re-spawn, and the recording keeps that vessel's pid through the
  # reload and all three loop cycles.
  "Vessel respawned \\(sit=[A-Z]+, pid=([0-9]+)\\)[\\s\\S]*MISSIONMARK label=lf1-kscspawn-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf1-reload-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf1-loop1-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf1-loop2-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf1-loop3-count-1-pid-\\1-spawned-true ",
  "Vessel spawned for #[0-9]+ \"rover fuel 0\" pid=",
  "missionconfig applied: mission='rover fuel 0' tree=\\S+ loop=True .*unitBuilt=True",
  "startloopplayback complete:[\\s\\S]*startloopplayback complete:[\\s\\S]*startloopplayback complete:",
  # At least one post-cycle frame meets the already-spawned guard (rate-limited summary;
  # it proves one cycle, not each).
  "startloopplayback complete:[\\s\\S]*Spawn suppressed: 1 recording\\(s\\) \\| already spawned \\(VesselSpawned=true\\)=1",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # A SECOND real spawn anywhere in the run, by either spawn path.
  "(?:Vessel respawned|SpawnAtPosition: vessel spawned)[\\s\\S]*(?:Vessel respawned|SpawnAtPosition: vessel spawned)",
  "Spawn ABANDONED",
  # The subject parks outside the KSC exclusion zone, so it must never be retired.
  "Spawn RETIRED",
  "missionconfig error",
  "startloopplayback rejected",
]

