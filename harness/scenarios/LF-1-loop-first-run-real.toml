schema = 1
id = "LF-1-loop-first-run-real"
# -------------------------------------------------------------------------------------
# D18 `loop-first-run-is-real` (catalog section 2, the B8 additional assertion): after
# loop cycles plus one rewind re-cross of the spawn window, exactly ONE real vessel with
# the recording's spawn pid exists.
#
# WHY THIS SUBJECT. No committed recorded fixture can be rewound to launch: every
# harvest prunes `Parsek/Saves` and clears the `rewindSave = parsek_rw_*` hint (H58's
# note), and the only fixtures with RewindPoints (bdock-recorded, refly-autopilot-recorded)
# carry no spawnable non-chain leaf. So the lane PRODUCES its subject in-run, H58's road:
# StartRecording, StopRecording, CommitTree. The subject is a single-recording, NON-CHAIN
# tree with a Landed terminal, which is the shape the #573 rewind lift
# (`standalone = string.IsNullOrEmpty(rec.ChainId)`) and the spawn gates (`"chain
# looping"`) both need.
#
# SUBJECT MOVED OFF THE PAD 2026-09-23 (KSC end-of-flight retirement ruling). The subject
# was `logi-cargo-pad`'s pad probe, 1.8 m from the pad centre: a flight that ENDS parked
# in the KSC exclusion zone (50 m pad-centre and runway-threshold circles) is now RETIRED,
# never spawned, so it can no longer carry a claim that needs a real vessel. The subject
# is now `pad-runway-pair`'s `rover fuel 0` (VESSEL index 0, a crewless Probe, PRELAUNCH
# on the runway 59.7 m from the runway threshold, outside the 50 m circle; the host
# asteroid is index 1 and the pad Rig index 2, focused at boot). ACT 0 focuses it with a
# spec-only road: LoadGame boots on the Rig, ExitToSpaceCenter, and a Space Center
# SaveGame + LoadGame lands in FLIGHT on index 0 (a Space Center save carries
# `activeVessel = 0`, measured on this very fixture by EX-1). NEVER FLOWN ON THIS
# SUBJECT: every token naming `rover fuel 0`, the ACT 0 road and the two-vessel census are
# unverified until the reading run. The mechanism tokens (the spawn path, the loop
# guard) are the ones read off `2026-09-22_2350` on the Rig; the respawn situation is
# regexed (`sit=[A-Z]+`) because the rover's snapshot situation was not measured.
#
# WHY THE LOOP IS ARMED AFTER THE REWIND. This lane is the LOOP-OFF rewind witness: it
# rewinds with the loop off, lets the re-cross materialize the vessel once, then arms the
# loop and runs three cycles over it. The loop-ARMED rewind (the catalog's re-cross with
# the loop in play) is `LF-2-loop-armed-rewind-first-run-real`, which carries the cell at
# full scope since the operator ruled a looping recording's first run real and the fix
# gave both loop dispatchers a first-run spawn seam (LOOP-ARMED-REWIND-LEAVES-ZERO-VESSELS,
# 2026-09-23). Here the cycles run over an already-spawned vessel, so the first-run seam's
# gate (VesselSpawned=true) holds every one of them: the rate-limited `Spawn suppressed:
# ... already spawned` summary is pinned at least once after a cycle.
#
# SCOPE OF THE LOOP CYCLES, STATED. The reload after the KSC re-spawn reads a save the
# Space Center wrote, which carries `activeVessel = 0` (measured), so FLIGHT focuses
# whatever sits at index 0 after the strip and the re-spawn (on the pad subject it was the
# host asteroid; on this fixture it is not measured). The claim does not need the loop
# ghost drawn - the spawn decision runs per recording every frame in `ParsekFlight`'s flag
# pass, render zone or not, and the summary line pinned below is that pass.
# The Missions window is opened before MissionConfig because its draw seeds the default
# mission of a tree committed mid-session (reading 1 refused `unknown-tree` without it;
# GUI-17's opening sequence).
#
# THE WITNESSES. The guard logs nothing per decision, so the claim rests on:
#   (1) the produced save: `spawnedVessels` (FLIGHTSTATE vessels behind a committed
#       recording's spawnedPid) and `vesselNames` (every non-SpaceObject vessel by name,
#       which catches a second copy under a FRESH pid that the pid facet cannot);
#   (2) `ListHandles kind=committed` captures folded into MISSIONMARK lines through the
#       R10 `${label.field}` substitution, so the log carries the recording's spawnedPid
#       at commit, after the rewind, after the KSC re-spawn, after the reload and after
#       each loop cycle - and a back-referenced regex pins the post-spawn pid unchanged.
# -------------------------------------------------------------------------------------
tier = "nightly"
description = "D18 loop-first-run-is-real: produce a single-recording non-chain Landed subject in-run on pad-runway-pair's runway rover (rover fuel 0, 59.7 m from the runway threshold, outside the KSC exclusion zone that now retires a flight ending on the pad or runway threshold), focused through a Space Center save + reload (StartRecording, StopRecording, CommitTree), Rewind-to-Launch it (the vessel is stripped), let 1x KSC time re-cross EndUT so the vessel re-spawns exactly once, reload into FLIGHT, arm the mission loop through the Missions window and run three StartLoopPlayback cycles. The loop-off rewind witness; the loop-armed rewind is LF-2. LIVE-PROVEN 2026-09-22 on the logi-cargo-pad pad probe (reading _2350, armed _2353, negative control _2355); MOVED to the runway rover 2026-09-23 by the KSC retirement ruling and NEVER FLOWN on it. The recording's spawnedPid is folded into MISSIONMARK lines at every stage, and the produced save must hold exactly one real vessel behind the spawn (saveparse spawnedVessels + vesselNames)."
instanceProfile = "stock-minimal"
tags = ["LF-1", "D18", "loop-playback", "rewind-to-launch", "spawn", "first-run-is-real",
        "R10", "runtime-handles"]

