# Every token below was read off the reading run's KSP.log.
[expectations.logContracts]
required  = [
  "Recording started",
  # The commit ADOPTS the live Rig: its own pid, spawned=true (the first run is real).
  "MISSIONMARK label=lf1-commit-count-1-pid-[1-9][0-9]*-spawned-true ",
  "invokerewindtolaunch complete rec=",
  # The strip reset the recording's spawn state.
  "MISSIONMARK label=lf1-rewound-count-1-pid-0-spawned-false ",
  # The #573 lift for a standalone (non-chain) rewind target with no live same-craft vessel.
  "same-recording spawn suppression lifted for standalone rewind target rec=\\S+ vessel=\"Logi Cargo Rig\"",
  # THE CLAIM: exactly one re-spawn, and the recording keeps that vessel's pid through the
  # reload and all three loop cycles.
  "Vessel respawned \\(sit=PRELAUNCH, pid=([0-9]+)\\)[\\s\\S]*MISSIONMARK label=lf1-kscspawn-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf1-reload-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf1-loop1-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf1-loop2-count-1-pid-\\1-spawned-true [\\s\\S]*MISSIONMARK label=lf1-loop3-count-1-pid-\\1-spawned-true ",
  "Vessel spawned for #[0-9]+ \"Logi Cargo Rig\" pid=",
