schema = 1
id = "QL-2-quickload-career-recovery-not-paid"
# =====================================================================================
# QL-2: A REWARD EARNED AFTER AN F5 IS NOT PAID ONCE THE F9 TAKES THE FLIGHT BACK. The
# career half of the manual F9 check "F5 after staging, fly on, merge, F9: the booster is
# recorded again and ends with its new outcome, and a reward earned after the F5 is not
# paid"; the live proof of TA-2 / TA-3 (todos QUICKLOAD-ABANDONED-FUTURE-EVENTS-BOOKED-AT-
# COMMIT and QUICKLOAD-DETACHED-TREE-KEEPS-LEDGER-ROWS) on a FUNDS row. Roadmap "The
# timeline-operation coverage program", Lanes table, row QL-2. QL-4 / QL-4b / QL-4c prove
# the booster half in sandbox, where the only abandoned-future ledger row is a
# kerbal-assignment row (`afterCutoff=0 kerbalAssignment=1` on all three).
#
# In gameplay terms: the player hops the Jumping Flea in a career, lands, presses F5,
# recovers the pod (stock pays the recovery: funds, recovery science and crew XP), and at
# the Space Center presses F9. The game goes back to the landed pod, so the recovery never
# happened; the career must not keep its payout. The player then leaves for the Space
# Center without recovering, and the flight commits again, Landed.
#
# THE MECHANISM UNDER TEST.
#   1. The recovery books its payout at once (LedgerRecoveryFundsPairing
#      .TryAddVesselRecoveryFundsAction: a FundsEarning Recovery row tagged with the
#      recording `LedgerOrchestrator.PickRecoveryRecordingId` picks, here the Flea's), plus
#      the recovery science and crew XP rows, all at a UT after the F5.
#   2. The F9 from the Space Center reaches the committed-copy restore (QL-4b's route):
#      the tree was committed at the recovery's scene exit, after the quicksave, so the
#      quicksave's tree is restored, the committed copy detached and the flight resumed.
#   3. The resume reconcile (ParsekScenario.TrimAndReconcileForQuickloadResume ->
#      RetireAbandonedFutureLedgerRows -> Ledger.RetireAbandonedFutureActions) retires
#      every row tagged to the trimmed set with an occurrence after the cutoff: the
#      recovery rows read `afterCutoff`, the sandbox lanes' gap.
#   4. Every recalc after that walks no Recovery earning, so neither the ledger nor KSP's
#      funds (the quicksave's, which never saw the recovery) carry the payout.
#
# WHY A RECOVERY AND NOT A CONTRACT OR A MILESTONE, AND WHY THE F9 IS FROM THE KSC. The
# roadmap row names an in-flight contract completion; no committed host can complete one
# (a save-authored Active contract does not survive the first tick, todo
# SAVE-AUTHORED-PROGRESS-NODE-DOES-NOT-RESTORE, measured on L5), and no committed career
# flight earns a milestone after the F5 (the hop's records are all set on the ascent).
# The recovery is the one post-F5 earning an existing verb drives (`Recover`, stock's own
# button, measured on ZF-1 / CI-6). It ends the flight, so the first commit is the
# recovery's scene-exit auto-merge rather than an in-flight Merge, and the F9 is the
# Space Center route; the in-flight route is QL-4's and is booster-only. A lane with both
# the booster and a career reward needs what is missing today: a career twin of
# `gs1-two-stage-pad` (built by construction like `career-pad-craft`, fresh-career plus
# the GS-1 craft) AND an in-flight earning that does not leave the scene.
#
# THE HOST. `career-pad-craft` (500000 / 100 / 0, the Jumping Flea on the pad, pid
# 2905720181 as ZF-1 and L3 measured) flown with `b1_pad_hop_career` and B1's parameters
# verbatim (the craft is byte-identical to `b1-pad-craft`'s, so B1's profile transfers).
# `b1_pad_hop_career` is B1's machine, evaluator and schema with ONE control difference,
# `tolerate_unreadable_nodes=True` (safety argument in its make_control). PREMISE MISS,
# READ 2026-10-07: the lane first flew plain `b1_pad_hop` and went INVALID twice
# (`2026-10-07_2231`, retry `_2232_a2`, see `*_mission.stdout.log`): kRPC's maneuver-node
# read raises `Maneuver node editing is not available ... tracking station has not been
# upgraded` on this level-0 career, three consecutive raises escalate to `vessel_lost` at
# PRELAUNCH, and B1 resolves MISSION-ASSERT-FAIL in 1.2 s, before any Parsek step ran.
# The same finding science_bench_recover (L3) and CL-3 recorded; spec changed, not re-flown.
# No injected recordings: the produced save's recordings are this flight's own.
#
# THE TIMELINE (UTs from B1 / L3 readings, not measured on this lane):
#   ~UT 9    launch; recording starts.
#   ~UT 300  the Flea lands; the mission concludes.
#   F5       SaveGame quicksave = THE CUTOFF.
#   +<2 s    60 inert steps (the craft at rest for the button, and UT margin: the resume
#            cutoff read 0.3 s after the loaded UT on QL-4b `_1936`, and the recovery
#            itself lands ~0.7-0.9 s after its press, ZF-1). Short on purpose: a landed
#            tail of 5 s or more would let the exit commit's optimizer split the recording
#            at the touchdown, BEFORE the cutoff (QL-4b's warned shape).
#   Recover  stock recovery: persistent save (sidecar epochs advance), Space Center,
#            auto-commit, then the payout rows tagged to the Flea's recording.
#   F9       LoadGame quicksave at the KSC -> FLIGHT: salvage, detach, resume, reconcile.
#   exit     ExitToSpaceCenter: the scene-exit auto-merge commits the resumed tree, Landed.
#
# BEFORE-FIX CONVENTION: the fix is merged (PR #2025 + the committed-copy restore), so this
# lane is a plain regression lane with no [expectedFail]. On a build without the reconcile
# the prediction is PARSEK-FAIL(expectation): the reconcile and retire lines missing, and
# the forbidden Recovery walk after the F9 matching.
#
# PRE-REGISTERED READINGS (what to check first if the first flight reds):
#   - `recover rejected reason=recover-button-locked` (or not-clear-to-save): the craft was
#     still moving at the press; a premise miss, lengthen the settle.
#   - `VesselRecovery funds patched ... recordingId=(none)`: the pick found no committed
#     recording at the payout (the tree not yet committed); the row is untagged, no
#     reconcile can retire it, and the forbidden `PatchFunds ... (delta=<positive>)` /
#     `GUARDED UPLIFT` tokens will say whether the career kept the money. A product
#     question (an abandoned-future payout booked untagged), file it.
#   - `afterCutoff=0` with `ledgerRowsRetired>=1`: the payout's UT did not pass the resume
#     cutoff (read both UTs on the reconcile and the funds-patched lines); a premise miss
#     only if the recovery UT is genuinely at or below the cutoff.
#   - `action=Unchanged reason=tree-committed-in-quicksave`: something saved the committed
#     tree into the quicksave slot (premise miss).
#   - A forbidden Recovery walk, Recovery XP line or funds uplift after the F9 with the
#     reconcile line green: the payout survived (a re-pair from the leftover KSC event, or
#     a row the reconcile does not classify); a product finding, file it.
#   - An `Optimization pass: split` / `Split recording 'Jumping Flea'` line at the
#     recovery's commit (the landed tail reached 5 s): the payout is tagged to the tail
#     segment, the F9 refreshes a truncated head and splices the tail; read the
#     reconcile's trimmed= / pruned= and the retired row's reason before reading a red as
#     a product finding (QL-4b's header names the same shape).
#   - `terminal=Recovered` on the final finalize: the abandoned ending leaked into the
#     replay (the TA-4 class on the ACTIVE recording); file it.
#   - LedgerGroundTruth is NOT run: it skips while a live or restored tree defers the KSP
#     patch, and it is FLIGHT-only, so it has no window after the final commit here. The
#     funds gate is the recalc walk and patch lines above.
#
# STATUS: AUTHORED 2026-10-07 (branch `ql-lanes`); two INVALID(mission) attempts on the
# premise miss above, mission switched to `b1_pad_hop_career`; NOT YET FLOWN GREEN.
# Every token is quoted from its emitting source line (LedgerRecoveryFundsPairing,
# FundsModule.ProcessFundsEarning, ScienceModule, KspStatePatcher.PatchFunds / EmitDrawdownGuardClamp,
# ParsekScenario.Trim.cs, Ledger.RetireAbandonedFutureActions, TestCommandRecover,
# TestCommandListHandles, ParsekFlight.Finalization) or from QL-4b's flown header; the
# saveParse blocks are REPORT-ONLY until a reading run.
# =====================================================================================
tier = "nightly"
description = "QL-2: the career reward half of the F9 checks. Hop the Jumping Flea in a career, land, F5, recover it (stock pays funds, science and crew XP, booked to the flight), then F9 from the Space Center: the committed copy is detached, the flight resumes, the reconcile retires the payout rows, no later recalc walks a Recovery earning, and the flight commits again Landed."
instanceProfile = "stock-minimal"
tags = ["QL-2", "TA-2", "TA-3", "quickload", "timeline-ops", "career", "recovery", "ledger",
        "scene-exit", "auto-merge", "reading-run"]

[fixture]
saveTemplate       = "fixtures/saves/career-pad-craft"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "b1_pad_hop_career"
# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },       expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "true" },    expect = "OK" },
  # Both commits are scene-exit auto-merges: the recovery's (stock loads the Space Center)
  # and the final ExitToSpaceCenter. No merge modal can stand at either exit.
  { cmd = "SetSetting",     args = { name = "autoMerge", value = "true" },             expect = "OK" },
  # LOAD-BEARING: the FundsEarning / Earning walk lines and FinalizeTreeRecordings are Verbose.
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },        expect = "OK" },
  # B1's hop: launch, coast, chute, land.
  { phase = "mission",                                                                 expect = "MISSION-OK", budget = 900 },
  # THE F5. The cutoff UT of the later quickload.
  { cmd = "SaveGame",       args = { name = "quicksave" },                             expect = "OK", budget = 120 },
  # Settle (~60 frames, under 2 s): the craft at rest for stock's button and game time
  # between the F5 and the payout, kept SHORT so the landed tail stays under the
