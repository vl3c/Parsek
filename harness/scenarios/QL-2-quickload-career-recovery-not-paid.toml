# B1-pad-hop's values VERBATIM (the craft is byte-identical; see B1's spec for each).
throttle                 = 1.0
apoapsisWindowMeters     = { min = 6000, max = 30000 }
chuteArmMaxRateMps       = 30
chuteFullDeployAltMeters = 2500
landedSituations         = ["LANDED", "SPLASHED"]
ascentTimeoutSeconds     = 90
coastTimeoutSeconds      = 180
descentTimeoutSeconds    = 360

[dimensionsCovered]
# D14 values only (each already covered elsewhere). No new claim: no D-value names a
# back-in-time load yet.
D14 = ["kerbin", "career", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The Flea's recording; the ceiling absorbs an optimizer split at either commit.
count = { min = 1, max = 3 }

# REPORT-ONLY until a reading run. Predicted: one tree, committed once (the F9 detached the
# recovery's commit and the final exit re-committed it), the Flea not Recovered, no rewind
# bookkeeping (a single-stage hop authors no rewind point).
[expectations.recordings.structure]
gating         = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 3 }
terminalStates = { Recovered = { max = 0 } }

[expectations.rewind]
gating        = false
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.logContracts]
required = [
  # GROUP 1 - THE FLIGHT AND THE F5.
  "Recording started",
  "savegame name=quicksave folder=.+ saved=true",

  # GROUP 2 - THE REWARD AFTER THE F5, BOOKED TO THE FLIGHT (the premise).
  "recover complete pid=2905720181 vessel=\\S+ scene=SPACECENTER",
  # The recovery's own commit, before the F9.
  "Silent full-fidelity auto-commit \\(scene-exit\\): tree='Jumping Flea' recordings=[1-9][0-9]*[\\s\\S]*loadgame start save=\\S+ name=quicksave ",
  # LedgerRecoveryFundsPairing.TryAddVesselRecoveryFundsAction: the payout row, TAGGED.
  "VesselRecovery funds patched: vessel='Jumping Flea' amount=[1-9][0-9]* ut=[0-9.]+ recordingId=[0-9a-f]{32} quick=False",

  # GROUP 3 - THE F9 FROM THE SPACE CENTER REACHES THE QUICKLOAD RESUME (QL-4b's route).
  "loadgame start save=\\S+ name=quicksave scene=SPACECENTER requestedScene=Unspecified allowLiveRecorder=\\(none\\) recorderLive=false",
  "Load classified: early=InSession refined=(?:QuickloadFlight|InSessionOther) scene=FLIGHT initialLoadDone=true rewinding=false reFlyInvoke=false discardReFly=none",
  "\\[Scenario\\] Quickload committed-copy restore: tree='Jumping Flea' id=\\S+ route=space-center action=ResumeFromQuicksave reason=committed-after-quicksave loadKind=InSession staleMembers=[0-9]+ salvagedFromCommitted=[0-9]+ unsalvaged=[0-9]+ replacesStaleKeep=false",
  "TryRestoreActiveTreeNode: removed committed tree 'Jumping Flea' \\(id=\\S+, [1-9][0-9]* recording\\(s\\)\\)",
  "OnLoad: pending-Limbo tree 'Jumping Flea' deferred to OnFlightReady for quickload-resume",
  "Quickload resume prep: activeRec='[0-9a-f]{32}' cutoffUT=[0-9.]+ preTrimEndUT=[0-9.]+ trimScope=TreeWide",
  "RestoreActiveTreeFromPending: resumed recording tree 'Jumping Flea' activeRec='[0-9a-f]{32}'",

  # =================================================================================
  # THE GATE - THE PAYOUT IS RETIRED. ParsekScenario.TrimAndReconcileForQuickloadResume:
  #   `[Scenario] Quickload abandoned-future reconcile: tree='<n>' kind=<LoadKind>
  #   scope=<scope> cutoffUT=.. loadedUT=.. trimmed=N pruned=N endStatesCleared=N
  #   eventsPurged=N ledgerRowsRetired=N (afterCutoff=N kerbalAssignment=N
  #   prunedRecording=N) skippedCommitted=N ...`
  # Pinned: at least one row retired AS AFTER-CUTOFF (the recovery rows; the sandbox
  # lanes all read afterCutoff=0) and nothing skipped as still committed. eventsPurged and
  # endStatesCleared are read, not pinned: the payout events are captured at the Space
  # Center, untagged, and the exit commit's tail trim may end the recording before the
  # cutoff (then its Recovered ending is not an after-cutoff one).
  "\\[Scenario\\] Quickload abandoned-future reconcile: tree='Jumping Flea' (?=.*\\bkind=(?:QuickloadFlight|InSessionOther)\\b)(?=.*\\bscope=TreeWide\\b)(?=.*\\bledgerRowsRetired=[1-9][0-9]* \\(afterCutoff=[1-9][0-9]* )(?=.*\\bskippedCommitted=0\\b)",
  "RetireAbandonedFutureActions: removed [1-9][0-9]* action\\(s\\) reason=quickload-abandoned-future total=[0-9]+",
  # END GATE
  # =================================================================================

  # GROUP 4 - THE FLIGHT IS RECORDED AGAIN AND COMMITS ONCE MORE, NOT RECOVERED.
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*listhandles kind=committed count=0 truncated=false",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='[^']*' points=[1-9][0-9]* orbitSegs=0 terminal=(?:Landed|Splashed) ",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*Silent full-fidelity auto-commit \\(scene-exit\\): tree='Jumping Flea' recordings=[1-9][0-9]*",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The F9 must reach the resume (QL-4b's defect shapes).
  "dropped entire tree 'Jumping Flea'",
  "TryRestoreActiveTreeNode: skipped active tree 'Jumping Flea'",
  "Quickload resume prep skipped",
  "Quickload committed-copy restore: tree='Jumping Flea' id=\\S+ route=\\S+ action=Unchanged",
  "keeping in-memory pending tree 'Jumping Flea'",
  "Quickload abandoned-future reconcile skipped: tree='Jumping Flea'",
  "listhandles kind=committed count=[1-9]",
  # THE PAYOUT MUST NOT COME BACK. After the reconcile no recalc walks a Recovery earning
  # (FundsModule.ProcessFundsEarning) or the recovery science (ScienceModule's walk line),
  # and nothing clamps or lifts the funds pool off KSP's (the quicksave's, without the
  # recovery: KspStatePatcher.PatchFunds and its keep-what-you-earned guard).
  "Quickload abandoned-future reconcile: tree='Jumping Flea'[\\s\\S]*\\[Funds\\] FundsEarning: \\+[^,\\r\\n]*, source=Recovery",
  "Quickload abandoned-future reconcile: tree='Jumping Flea'[\\s\\S]*\\[ScienceModule\\] Earning: subject=recovery@",
  "Quickload abandoned-future reconcile: tree='Jumping Flea'[\\s\\S]*GUARDED (?:UPLIFT|DRAWDOWN) clamped resource=Funds",
  # After the F9 the replay recovers nothing: no payout is booked again and no patch lifts
  # the funds (a positive delta is the abandoned payout paid).
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*VesselRecovery funds patched: vessel='Jumping Flea'",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*Recovery kerbal XP recorded: ",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*PatchFunds: [0-9.]+ -> [0-9.]+ \\(delta=[0-9]",
  # The abandoned ending must not reach the replay's commit.
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='[^']*' points=[0-9]+ orbitSegs=[0-9]+ terminal=Recovered",
]

[runtime]
# Wall clock for the whole drive phase including boot: two LoadGame (max(300,600)+60 each =
# 1320), SetSetting x3 360, mission 900, SaveGame 180, Recover 180, ExitToSpaceCenter 180,
# ListHandles / FlushAndQuit 240; the inert settle steps answer in about a frame each.
# Expected wall about 10 minutes (boot, a ~300 s hop, a recovery, one reload, one exit).
budgetSeconds = 3600

[retry]
policy = "once"

[expectedFail]
bugId = ""
