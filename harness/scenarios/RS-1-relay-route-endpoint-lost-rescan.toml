schema = 1
id = "RS-1-relay-route-endpoint-lost-rescan"
tier = "nightly"
# =====================================================================================
# RS-1: A LOOP ROUTE LOSES ITS ENDPOINT AT A DELIVERY, AND THE PLAYER PRESSES RE-SCAN.
# AUTHORED 2026-10-25, NEVER FLOWN. Todo LOOP-ROUTE-RESCAN-DOES-NOTHING.
#
# WHAT THIS LANE PROVES, AND WHAT IT CANNOT.
#   PROVES (1): a LOOP route reaches RouteStatus.EndpointLost through the one path that
#   sets it, `ApplyDelivery`'s endpoint re-resolution at a delivery
#   (`endpoint-destroyed-at-delivery:*`). No committed lane has ever driven a route into
#   EndpointLost. (2) The new `RouteCommand action=rescan` presses the Logistics window's
#   "Re-scan for endpoint" click body (`LogisticsEndpointRescan.Run`, shared with the
#   button), and on a scan that MISSES the route stays EndpointLost with no restart.
#   CANNOT: the fix itself (a scan that FINDS every stop restarts the loop route through
#   `RouteOrchestrator.TryRecoverEndpointLostAfterRescan`). Every token below is the same
#   with the fix reverted, because the endpoint never comes back on this host. See "WHY
#   THE ENDPOINT CANNOT COME BACK" and the tail to add once a host can.
#
# WHY A MULTI-STOP ROUTE. On a single-stop loop route the eligibility gate and the
# delivery resolve the SAME endpoint through the SAME resolver in the SAME tick
# (`ProcessLoopRoute` -> `CheckEligibility` -> `EmitLoopCycle` -> `ApplyDelivery`), so an
# endpoint missing at delivery is already missing at the gate, which records a hold and
# skips the cycle without leaving Active. A multi-stop route gates once, at the cycle's
# FIRST window (`ProcessMultiStopCrossings`: "Eligibility gates the cycle at DISPATCH
# only"), and fires each later window at its own dock phase with no re-gate. An endpoint
# that disappears between the windows is therefore found missing only at the later
# window's delivery, which is the EndpointLost transition.
#
# THE HOST is RVR-7's `rover-relay-c-recorded`: rover C loads from B (stop 0, dock UT
# 155.82) and delivers to A (stop 1, dock UT 274.18); the loop span is 162.74 s (RVR-7 /
# RVR-9 headers), so stop 0's window sits about 44.4 s into a cycle and stop 1's at the
# cycle end. The fixture is staged at start-of-cycle (B and A at 200/400 LiquidFuel).
#
# THE CLOCK. `TimeJump ut=1000` (route Paused, nothing fires), then `activate`: TryActivate
# restarts the loop observation at the click, and the backing mission's phase anchor is
# max(LoopAnchorUT, spanEnd) = the activation UT, about 1000. So stop 0's window crosses
# at about 1044.4 and stop 1's at about 1162.7. `TimeJump ut=1060` lands between them:
# cycle-0 dispatches (origin debit at B) and window 0 fires; window 1 is owed later.
# Then the Space Center, where A is recovered through its own KSC marker (about 1080 at
# 1x), and `WarpToUT ut=1250` crosses window 1 with A gone. The resolver then misses at
# every step: A's root part and pid are gone, and within 500 m of A's recorded dock point
# the only surface vessel left is C (313 m), the route's own transport, which the
# proximity step excludes; B is 731 m away.
#
# WHY THE ENDPOINT CANNOT COME BACK on this or any committed fixture. The resolver is
# root-part, then pid, then surface proximity within 500 m (non-transport). A lost
# endpoint comes back only if a vessel carrying its identity reappears (the Ghost Chain
# Rule respawning a chain-held base after a rewind) or a NEW non-transport surface vessel
# stands within 500 m of the recorded point (a player landing or driving a craft there).
# No seam verb can place one there: LaunchFromEditor spawns at the runway threshold, about
# 703 m from A's dock point, or the pad (2.3 km); the relay rovers are uncrewed, so no EVA;
# DriveVessel has no steering; nothing undocks from C. The tail to add once a host can
# (a relocation setup step, or a builder fixture with a vessel the lane can bring inside
# the radius): a second `rescan` asserting `resolved=2/2 [1:'B' 2:'<name>'] (recovering)`,
# `EndpointRescan: route=... loopRoute=1 EndpointLost->Active`, `LifecycleMarker ... type=
# RouteResumed reason=endpoint-rescan`, `routecommand complete action=rescan ...
# recovered=true ... status=Active`, then a TimeJump across the next window with a
# `Delivery write: ... dest=<name>`. All of those go red with the fix reverted.
#
# GUESSES (not measured; read a first red against these):
#   * The window phases (44.4 s and 162.74 s into a cycle) are RVR-7 / RVR-9 era readings
#     of the span; the 2026-09-24 first-play-floor ruling moved the anchor rule, not the
#     span. If the span moved, the TimeJump 1060 may land after window 1 (the cycle then
#     completes, `Delivery write: ... dest=A` appears and the forbid reds) or before
#     window 0 (no dispatch line before the recover).
#   * The KSC part (ExitToSpaceCenter + KscMarkerRecover) spends under 100 s of game time
#     at 1x, so the recover lands before window 1.
#   * The proximity step runs at the Space Center with usable vessel positions (KSC
#     markers draw at them); the miss reason is regexed across
#     `no-candidate-after-transport-exclusion` (C inside the radius, the prediction) and
#     `no-vessel-within-radius`.
#   * The first eligibility pass may TRANSFER stop 1 from the dead recorded pid 2123618197
#     to A (pid 4280917262) through proximity (the RVR-18 ruling); not pinned, but a
#     transfer onto B or C is forbidden.
#   * pickedUp / debited counts in the ListHandles line are regexed `[01]`.
# =====================================================================================
description = "RS-1, NEVER FLOWN: on rover-relay-c-recorded create the two-stop relay route, TimeJump to 1000, activate, TimeJump to 1060 (cycle-0 dispatches and stop 0's window fires; stop 1's window is owed), go to the Space Center and recover A (stop 1's endpoint) through its stock KSC marker, warp to 1250: stop 1's delivery finds no endpoint and the route goes EndpointLost (endpoint-destroyed-at-delivery). Then RouteCommand action=rescan presses the Logistics window's Re-scan click body: stop 0 resolves, stop 1 does not, the route stays EndpointLost and nothing restarts it. Proves the loop-route EndpointLost path and the rescan seam; does NOT discriminate the LOOP-ROUTE-RESCAN-DOES-NOTHING fix (the endpoint never comes back on any committed host; header names the tail to add)."
instanceProfile = "stock-minimal"
tags = ["seam-verbs", "logistics", "route-create", "route-delivery", "endpoint-resolve",
        "endpoint-lost", "endpoint-rescan", "ksc-marker-recover", "recorded-fixture",
        "RS-1"]

[fixture]
saveTemplate       = "fixtures/saves/rover-relay-c-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                    expect = "OK" },
  { cmd = "DiscardTree",                                                      expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoMerge",          value = "true" },  expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SealSlot",     args = { tree = "88c012a6eed94bf09ff73397a4a31410" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "create", tree = "88c012a6eed94bf09ff73397a4a31410", name = "RS1 Relay" }, expect = "OK", budget = 120 },
  # Paused: the jump only pins the activation UT (header, THE CLOCK).
  { cmd = "TimeJump",     args = { ut = "1000" },                             expect = "OK", budget = 300 },
  { cmd = "RouteCommand", args = { action = "activate", route = "RS1 Relay" }, expect = "OK", budget = 120 },
  # Between stop 0's window (about 1044.4) and stop 1's (about 1162.7).
  { cmd = "TimeJump",     args = { ut = "1060" },                             expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "rs1-window0" },                   expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                         expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                expect = "OK", budget = 120 },
  # Stop 1's endpoint, A, recovered through its stock Space Center marker.
  { cmd = "KscMarkerRecover", args = { pid = "4280917262" },                  expect = "OK", budget = 60 },
  { cmd = "MissionMark",  args = { label = "rs1-recovered" },                 expect = "OK" },
  # Across stop 1's window with A gone.
  { cmd = "WarpToUT",     args = { ut = "1250" },                             expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "rs1-lost" },                      expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                         expect = "OK" },
  # The Logistics window's Re-scan for endpoint, through its own click body.
  { cmd = "RouteCommand", args = { action = "rescan", route = "RS1 Relay" },   expect = "OK", budget = 120 },
  { cmd = "MissionMark",  args = { label = "rs1-rescanned" },                 expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                         expect = "OK" },
  { cmd = "SaveGame",                                                         expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# Boot facts only until the first green flight (the H35 claim-is-not-gate rule).
D14 = ["sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# autoRecordOnLaunch is off and nothing is launched: the host's committed recordings.
count = { min = 10, max = 10 }

[expectations.logContracts]
required  = [
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "sealslot complete mode=tree tree=88c012a6eed94bf09ff73397a4a31410 total=8 sealed=0 remaining=0 alreadySealed=True",
  "routecommand create gate tree=88c012a6eed94bf09ff73397a4a31410 treeFound=True dismissed=False sealed=True eligible=True status=Eligible alreadyPromoted=False refusal=None",
  "routecommand complete action=create tree=88c012a6eed94bf09ff73397a4a31410 route=.* name='RS1 Relay' status=Paused",
  "TryActivate: route=\\S+ now Active ",
  "routecommand complete action=activate route=.* name='RS1 Relay' match=name statusBefore=Paused status=Active",
  # WINDOW 0: the cycle dispatches and debits B; stop 1's window is still owed.
  "LoopRoute\\(multi\\): route [0-9a-f]{8} cycle=cycle-0 cMin=[0-9]+ dispatch fired \\(carrierStopIndex=0\\)",
  "Origin debit: route=.* origin=B pid=90564594 resource=LiquidFuel requested=154\\.39",
  "(?s)MISSIONMARK label=rs1-window0 (?:(?!listhandles route ).)*listhandles route index=0 id=\\S+ name='RS1 Relay' status=Active completed=0 skipped=0 [^\\r\\n]* dispatched=1 debited=[01] pickedUp=[01] delivered=0 ",
  # A recovered at the Space Center, before stop 1's window.
  "exittospacecenter complete scene=SPACECENTER",
  "kscrecover complete pid=4280917262 vessel=A scene=SPACECENTER ",
  # THE LOSS: stop 1's delivery re-resolves and finds nothing; the route stops.
  "(?s)MISSIONMARK label=rs1-recovered (?:(?!MISSIONMARK label=rs1-lost ).)*Delivery: route [0-9a-f]{8} cycle=cycle-0 endpoint lost at delivery reason=(?:no-candidate-after-transport-exclusion|no-vessel-within-radius)",
  "EndpointLost: route [0-9a-f]{8} reason=endpoint-destroyed-at-delivery:(?:no-candidate-after-transport-exclusion|no-vessel-within-radius) \\(at delivery\\)",
  "(?s)MISSIONMARK label=rs1-lost (?:(?!listhandles route ).)*listhandles route index=0 id=\\S+ name='RS1 Relay' status=EndpointLost completed=0 skipped=0 [^\\r\\n]* dispatched=1 debited=[01] pickedUp=[01] delivered=0 ",
  # THE RE-SCAN: the button's own line, stop 0 found, stop 1 not.
  "\\[UI\\] Logistics: endpoint re-scan route=[0-9a-f]{8} stops=2 resolved=1/2 \\[1:'B' 2:unresolved\\('(?:no-candidate-after-transport-exclusion|no-vessel-within-radius)'\\)\\] \\(still EndpointLost\\)",
  "routecommand complete action=rescan route=\\S+ name='RS1 Relay' match=name stops=2 resolved=1/2 allResolved=false recovered=false statusBefore=EndpointLost status=EndpointLost",
  # Still stopped; the only RouteResumed row is the activation's.
  "(?s)MISSIONMARK label=rs1-rescanned (?:(?!listhandles route ).)*listhandles route index=0 id=\\S+ name='RS1 Relay' status=EndpointLost completed=0 skipped=0 [^\\r\\n]* delivered=0 paused=[0-9]+ resumed=1 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "routecommand rejected",
  "routecommand refused",
  "kscrecover rejected",
  # The loss must be found at the DELIVERY, not at the gate (a gate miss records a hold
  # and stays Active: the single-stop shape this lane exists to avoid).
  "BLOCKED kind=",
  # A never received this cycle's cargo.
  "Delivery write: route=.* dest=A pid=4280917262",
  # The route must not hand stop 1 to the transport or to stop 0's base.
  "Route endpoint transferred: route=[0-9a-f]{8} stop=1 [^\\r\\n]*to=(?:612987736|90564594)/",
  # A miss restarts nothing.
  "EndpointRescan: route=",
  "type=RouteResumed reason=endpoint-rescan",
]

[expectations.routes]
# REPORT-ONLY until a reading run (the saveParse arming rule).
count           = { min = 1, max = 1 }
dormant         = { min = 0, max = 0 }
stops           = { min = 2, max = 2 }
sourceRefs      = { min = 3, max = 3 }
completedCycles = { min = 0, max = 0 }
skippedCycles   = { min = 0, max = 0 }
statuses        = { EndpointLost = { min = 1, max = 1 } }

[runtime]
# Boot LoadGame, two TimeJumps, the KSC exit, the marker recover and one warp: five
# deferred verbs plus the short steps.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
