schema = 1
id = "RW-9-strategy-repair-rebuy"
# =====================================================================================
# RW-9: A STRATEGY-DISCOUNTED REPAIR INSIDE A COMMITTED TIMELINE, ACROSS A REWIND-TO-LAUNCH
# (the rewind ledger campaign; the live proof of #2313, todo
# STRATEGY-DISCOUNT-ON-GROSS-ROWS-UNLEDGERED).
#
# THE RULE UNDER TEST (game-actions design 3.15 item 7): a strategy's discount or surcharge on
# a part purchase, a building repair or a contract penalty belongs to that purchase, repair or
# penalty. Its conversion legs (funds and reputation) name their cause, so after a rewind they
# are applied once, with the row they belong to, and never as an untagged pool adjustment.
#
# WHY A REPAIR, NOT A PART PURCHASE. The two hosts with entry purchases on
# (`career-pad-craft-hard`, rep 0; `stock-screen-census`, rep 2) cannot pay Aggressive
# Negotiations' reputation setup cost (10..100), and every rep-rich host runs
# BypassEntryPurchaseAfterResearch = True, where a part costs nothing. Aggressive Negotiations
# also scales StructureRepair (funds x1.00..0.99) and adds -1..-6 reputation on a repair, so
# `cs-career-mun4` (rep 115) carries the same leg family through the repair path.
#
# WHY NO SECOND REPAIR. With the repair committed ahead of the clock, a repair of the same
# facility after the rewind is refused (the KB-2 backstop; the seam reads `repair-not-applied`), so the
# todo's "re-buy" cannot reach stock on this path; the lane pins that refusal and then the
# crossing, where the committed repair and its legs must apply once.
#
# PLAN (cs-career-mun4 = CS-6c's produced save, UT ~185734, funds 157546.18, rep 115):
#   boot       LoadGame persistent at the Space Center; warp to 185750.
#   strategy   activate-strategy AgressiveNegotiations (default factor 0.05).
#   demolish   ForeverAlone (R&D, level 0): the building is down in V's rewind save.
#   V          Jumping Flea on the pad, recorded 185800..185840, committed, recovered at its
#              marker (RW-4's shape); its rollout is discounted too.
#   repair     warp to 185900 (T1); repair-facility SpaceCenter/ResearchAndDevelopment -> OK,
#              discounted, its legs naming the repair.
#   rewind     InvokeRewindToLaunch tree=latest: back to V's launch, building down.
#   refused    repair again -> REJECTED blocked-committed; the blocked dialog dismissed.
#   crossing   warp to 185960: the committed repair applies once; the pools after the crossing
#              equal the pools after the original repair.
#   check      an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# STEP SAVES (temporary analysis artifacts, copied with the run under logs/):
#   rw09-01-after-v-commit, rw09-02-after-repair, rw09-03-after-rtl, rw09-04-after-crossing.
#
# STATUS: LIVE-PROVEN 2026-10-28, `2026-10-28_1538` PASS attempt 1 (DLL 8723aa01, main 9619cd468). The repair at UT 185899.9 split its
# Aggressive Negotiations legs onto the annex (funds +1.0000467, rep -1.25, reason=StructureRepair);
# after the rewind (clock 185785.5) the second repair was refused by the backstop (`Blocking facility
# repair ... already repaired by a committed future row`, fundsDelta=0); the crossing applied the
# committed repair and its legs once: funds 155591.16 / rep 97.96 after the original repair and
# after the crossing alike; no StockPoolAdjustment, no GUARDED; 35 recordings; batch passed=3
# skipped=0; LedgerGroundTruth hardFailures=0; ledger_audit.py PASS. History: `_1522` / `_1524`
# INVALID with the actions at 185790, inside the 15 s Rewind-to-Launch lead window (filed as
# REWIND-LEAD-WINDOW-KSC-ACTIONS-LAND-IN-THE-FUTURE, measured by the uncommitted reading variant
# RW-9R `_1535`: a second paid repair and the annex knocked down again at the crossing); `_1527`
# PARSEK-FAIL on three lane pins only (every assertion held).
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, strategy discount on a repair (#2313): on cs-career-mun4 Aggressive Negotiations is activated and the R&D annex demolished, a Jumping Flea V is recorded, committed and recovered, the R&D facility is repaired at UT 185900 with the strategy's discount, a Rewind-to-Launch to V's launch refuses a second repair as committed, and the warp past the repair applies it and its conversion legs once: the pools after the crossing equal the pools after the original repair, with no pool adjustment and no guard clamp; LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-9", "career", "ledger", "rewind", "rewind-to-launch", "strategy",
        "strategy-conversion", "facility-repair", "demolish", "ksc-marker", "editor",
        "ground-truth", "ingame-batch", "timeline-ops", "reading-run"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 4 x 120 KSC warps + 2 x (120 GoToEditor + 180
# LaunchFromEditor) + 180 StartRecording + 120 warp + 120 CommitTree + 120 ExitToSpaceCenter
# + 60 KscMarkerRecover + 300 rewind + 120 check warp + 5 x 120 SaveGame + 5 x 60 KscAction
# + 540 RunTests = 4140; runtime 5200 adds the inert steps and FlushAndQuit.
steps = [
  # scene = "spacecenter": the host's three vessels are Mun debris (RW-1's boot).
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  # Both Space Center actions sit OUTSIDE the 15 s window before V's launch: a Rewind-to-Launch
  # winds the clock back to launch - 15 s, so an action inside that window would read as future
  # while the rewind save already holds its effect (finding of the first flight, see STATUS).
  { cmd = "WarpToUT",       args = { ut = "185750", maxRate = "100" },                     expect = "OK", budget = 120 },
  # ---- the strategy and the damage, both before V's launch (so in its rewind save) ----
  { cmd = "KscAction",      args = { action = "activate-strategy", strategy = "AgressiveNegotiations" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw9-an-active" },                            expect = "OK" },
  { cmd = "KscAction",      args = { action = "demolish-building", building = "ForeverAlone" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw9-demolished" },                           expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },
  # ---- V: the Flea on the pad, recorded, committed, recovered at its marker ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "v",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "185840" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw9-v-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw09-01-after-v-commit" },                   expect = "OK", budget = 120 },
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${v.pid}" },                                 expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw9-v-recovered" },                          expect = "OK" },
  # ---- the discounted repair at T1 = 185900 ----
  { cmd = "WarpToUT",       args = { ut = "185900", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw9-before-repair" },                        expect = "OK" },
  { cmd = "KscAction",      args = { action = "repair-facility", facility = "SpaceCenter/ResearchAndDevelopment" }, expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw9-repaired" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw09-02-after-repair" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw9-before-rewind" },                        expect = "OK" },
  # ---- the rewind to V's launch: the building is down again, the repair is committed future ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw9-rewound" },                              expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw09-03-after-rtl" },                        expect = "OK", budget = 120 },
  # ---- a second repair is refused as committed (KB-2's backstop and its blocked dialog) ----
  { cmd = "KscAction",      args = { action = "repair-facility", facility = "SpaceCenter/ResearchAndDevelopment" }, expect = "REJECTED", budget = 60 },
  { cmd = "UiAction",       args = { op = "dismiss", popup = "actionblocked", press = "OK" }, expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw9-refused" },                              expect = "OK" },
  # ---- the crossing: the committed repair and its legs apply once ----
  { cmd = "WarpToUT",       args = { ut = "185960", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw9-crossed" },                              expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw09-04-after-crossing" },                   expect = "OK", budget = 120 },
  # ---- the check: an unrecorded launch onto the (clear) pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186000" },                                      expect = "OK", budget = 120 },
  # The DEFAULT slot (persistent): the one a harvest reads; the named slots above are side files.
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["funds", "reputation", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 34 recordings plus V; the check launch is unrecorded. Measured 35 on `_1538`.
count = { min = 35, max = 35 }

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- the strategy and the damage ----
  "kscaction action=activate-strategy target=AgressiveNegotiations applied=true manifestKind=strategy-activate [\\s\\S]*?MISSIONMARK label=rw9-an-active ut=",
  "MISSIONMARK label=rw9-an-active ut=[\\s\\S]*?kscaction action=demolish-building target=SpaceCenter/ResearchAndDevelopment/Facility/ForeverAlone applied=true[\\s\\S]*?MISSIONMARK label=rw9-demolished ut=",

  # ---- the discounted repair: applied, its legs naming the repair, recorded under
  # StructureRepair ----
  "MISSIONMARK label=rw9-before-repair ut=[\\s\\S]*?kscaction action=repair-facility target=SpaceCenter/ResearchAndDevelopment applied=true[\\s\\S]*?MISSIONMARK label=rw9-repaired ut=",
  # The repair scope names the cause: both legs split onto the one building.
  "MISSIONMARK label=rw9-before-repair ut=(?:(?!MISSIONMARK label=rw9-repaired )[\\s\\S])*?Facility repair conversion split: legs=2 buildings=1 totalCost=2000 rows=2 unsplitLegs=1 unsplitCause=SpaceCenter/ResearchAndDevelopment/Facility/ForeverAlone",
  "MISSIONMARK label=rw9-before-repair ut=(?:(?!MISSIONMARK label=rw9-repaired )[\\s\\S])*?Strategy conversion recorded: type=FundsEarning, currency=Funds, delta=1\\.0000[0-9]*, UT=(?:18589|18590)[0-9]\\.[0-9], reason=StructureRepair",
  "MISSIONMARK label=rw9-before-repair ut=(?:(?!MISSIONMARK label=rw9-repaired )[\\s\\S])*?Strategy conversion recorded: type=ReputationPenalty, currency=Reputation, delta=-1\\.25, UT=(?:18589|18590)[0-9]\\.[0-9], reason=StructureRepair",

  # ---- after the rewind: a second repair is refused as committed (KB-2's backstop), nothing
  # charged ----
  "MISSIONMARK label=rw9-rewound ut=(?:(?!MISSIONMARK label=rw9-refused )[\\s\\S])*?Blocking facility repair: 'SpaceCenter/ResearchAndDevelopment' - 1 destroyed building\\(s\\) of 1 already repaired by a committed future row[\\s\\S]*?kscaction repair-facility not applied: target=SpaceCenter/ResearchAndDevelopment destroyedBefore=1 destroyedAfter=1 fundsBefore=(\\S+) fundsAfter=\\1 fundsDelta=0[\\s\\S]*?kscaction refused action=repair-facility reason=repair-not-applied target=SpaceCenter/ResearchAndDevelopment",

  # ---- the crossing: the pools equal the pools after the original repair ----
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw9-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw9-crossed ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
]
forbidden = [
  # The discount is never kept as an untagged pool adjustment (the #2313 defect's shape).
  "filed StockPoolAdjustment amount=",
  # No guard clamp anywhere in the lane.
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  # The repair is made once: no second applied repair after the rewind.
  "MISSIONMARK label=rw9-rewound ut=[\\s\\S]*kscaction action=repair-facility target=SpaceCenter/ResearchAndDevelopment applied=true",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

[runtime]
budgetSeconds = 5200

[retry]
policy = "once"

[expectedFail]
bugId = ""
