schema = 1
id = "CS-0-new-career-game"
# THE SCRIPTED CAMPAIGN, STAGE 0, CAREER (docs/dev/autotest-roadmap.md, "The scripted
# campaign program", owner decisions 2026-10-06: a GENUINE stock New Game at Normal
# difficulty, made by a fixture builder rather than the pinned `fresh-*` saves, on the
# stock tech tree). This lane IS that builder. It boots any valid save, then the NewGame
# seam verb does what a player does at the main menu: quit the Space Center to the main
# menu (stock's pause-menu save + MAINMENU load), overwrite the save of the same name
# (stock's OverWriteNewGame delete; the staged Ships/ folder is kept) and run
# MainMenu.CreateAndStartGame's calls - GamePersistence.CreateNewGame with
# GameParameters.GetDefaultParameters(CAREER, Normal), onGameNewStart, Game.Start - landing
# in the new game's Space Center with Parsek loaded on it. SaveGame writes it out.
#
# HARVEST (the stage-to-fixture promotion, by hand once per re-cut):
#   python harness/tools/harvest_bdock_station.py --save-dir harness/results/<runId>_save \
#       --target-name cs-career-new --allow-no-vessel --expect-mode CAREER
# then add the `"cs-career-new" = ["Jumping Flea"]` row to fixtures/shared-ships.toml.
#
# THE TEMPLATE. `fresh-career` only because LoadGame needs a valid save to boot into; NewGame
# deletes it (and the Parsek footprint its load wrote) before the new game is created, so
# none of it reaches the produced save. The new game takes the template's folder name; the
# harvest renames it.
#
# STATUS: NEVER FLOWN. Operator tier: a fixture builder, flown on request when the campaign
# needs a fresh start, never on a cadence.
tier = "operator"
description = "Scripted campaign stage 0 (CAREER): create a genuine stock New Game (CAREER, Normal preset) through stock's own main-menu path and save it, the starting save of the scripted campaign ladder (harvested as cs-career-new)."
instanceProfile = "stock-tree"
tags = ["campaign", "CS-0", "fixture", "new-game", "career-mode", "pending-flight"]

[fixture]
saveTemplate = "fixtures/saves/fresh-career"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",     args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",   args = { name = "verboseLogging", value = "true" },   expect = "OK" },
  { cmd = "NewGame",      args = { mode = "CAREER", preset = "Normal", save = "${runSave}" }, expect = "OK", budget = 300 },
  { cmd = "SaveGame",                                                         expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# Conservative until the reading run pins the pools: the Normal preset's starting values
# are KSP's own (GameParameters.GetDefaultParameters), never authored here.
required = [
  "newgame start mode=CAREER preset=Normal save=fresh-career scene=SPACECENTER",
  "newgame create mode=CAREER preset=Normal save=fresh-career ",
  "newgame complete mode=CAREER preset=Normal save=fresh-career scene=SPACECENTER seed=[0-9]+ ",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]", "newgame error"]


[runtime]
budgetSeconds = 1200

[retry]
policy = "once"

[expectedFail]
bugId = ""
