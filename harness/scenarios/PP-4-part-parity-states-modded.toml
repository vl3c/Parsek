schema = 1
id = "PP-4-part-parity-states-modded"
tier = "operator"
# PART GHOST PARITY, MODDED INSTALL, DEPLOYED STATE CASES IN ORBIT (phase P6 of
# docs/dev/design-part-ghost-parity.md, Appendix D, row S6 of D.10). PP-3's shape on the
# modded-compat instance (ReStock, ReStock+, Waterfall, B9PartSwitch), where PP-2 photographs
# every part STOWED beside its Parsek ghost; this lane photographs every part that transforms
# in its transformed state (deployed, open, lit, jettisoned) beside THREE ghosts
# (D.5): the event route (the stowed snapshot plus the part events the recorder's own pollers
# recorded while stock moved the real part, primed to the end of the clip), the start route
# (the deployed snapshot, the first frame of a recording that starts deployed) and the stowed
# reference. Owner rulings R2 / R3 (2026-11-22): state cases run at the base skin only, in
# their own report-only lanes, never in PP-1 / PP-2. The parachutes are not posed in vacuum
# (R1): their air cases are PP-6's.
#
# WHAT THE LANE FLIES. PP-2's host and setup: `eva2-lko-crewed` (sandbox, every part
# available, the 13-part Kerbal X Probe ORBITING Kerbin at ~100 km) boots into FLIGHT, turns
# every auto-record setting off (no case vessel may be recorded), turns verbose logging on
# (the per-case lines are verbose-tier), warps on rails to UT 1900 (FGV-1's sunlit window),
# clears the label directory (`op=reset`), runs THREE time-boxed `op=run states=all` steps and
# quits. `states=all` with no `contexts=` plans every state case and the stacked context
# cases (`alone` and `stacked`, never `air`) and NO stowed / alone case (design D.2), so
# nothing of PP-2 is repeated; `skins=` is not passed (it governs stowed cases only).
# `controls=true` runs the orbit state control set: PP-2's eight plus
# `ctl-state-events-dropped` (the Communotron 16 deployed with its event-route ghost built
# WITHOUT the polled events, which must fail on shape).
#
# CASES (design D.1, measured by S1 on 2026-11-22 over the post-patch ConfigCache): 117
# single-part state cases, 108 shroud cases (jettisoned and the stacked stowed case), the 8
# fairing parts are excluded `fairing-contexts-pending` until S8, plus 9 controls: 234
# cases. Each step logs the exact counts on its `state cases:` Info line. The two thrust
# reversers became cases later (todo THRUST-REVERSER-NOT-RECORDED): 119 single-part states.
#
# STEP SIZING (design D.8). Measured: 225 cases (+9 controls) in ~558 s of sweep at the 25 s
# cap (first step 452 s / 203 cases, second 106 s, third answers done=true at once). Two steps would
# hold it; the third stays as ~25 % margin for the sun-tracker cap raise (each tracking wave
# may wait up to 25 s) and the slower modded boot, at no cost when not needed.
#
# GATES. (1) The partParity verifier row, from the start: the run's control set (recomputed
# from the manifest's settings) behaved, the state controls re-judged from their sidecars
# (else INVALID(parity-controls)); no family's press path broke (more than half of one
# family's state cases action-failed / state-timeout is INVALID(parity-state-press)); the
# Python recompute of the four-row state atlases agrees with the C# sidecars (else
# INVALID(parity-instrument)); the sweep reached done and every planned case has a complete
# sidecar or a recorded setup fault (else INVALID(parity-incomplete)); the host survived
# (else INVALID(parity-host-damaged)). (2) The part verdicts are REPORT-ONLY
# (`[expectations.partParity] gating = false`). (3) The log pins as a second guard: the
# run-step summary line with `crashed=0` and `controls=ok`, the seam applier's OK line, the
# step's `state cases:` line (proof the step planned a state run), and no `[Parsek][ERROR]`: an ERROR a modded part provokes is a
# finding to file, never a suppression (design 10).
#
# READING THE RESULT. The harvest leg moves `<KSP root>/parsek-partparity/pp4/` into
# `harness/results/<runId>_partparity/pp4/`, where the row writes `partparity-verdicts.json`.
# The viewer (`harness/tools/part_parity_view.py modded=<pp2 dir> modded=<pp4 dir>`) shows each
# part's stowed and deployed cases side by side. Every ghost-visual defect a case shows is
# filed in docs/dev/todo-and-known-bugs.md with its case id.
#
# FAST-LANE CHECKLIST (harness/README.md). (1) Reuse a flight: considered, not applied - PP-2
# flies the same host, but its three 540 s steps are already near full and a state run plans
# no stowed case (D.2), so the two cannot share a step. (2) No idle waits: the one game-time
# wait is an explicit-UT WarpToUT on rails. (3) The time box is the measurement itself. (4)/(5)
# no burns, no coasts. (6) `[retry] policy = "none"`: a retry's `op=reset` would clear the
# files a reading run exists to keep. (7) Recording count pinned at 0. (8)/(9) tier operator
# by purpose (a report-only reading lane), flight_efficiency.py after the first green flight.
#
# LIVE-PROVEN 2026-11-22 (branch `part-parity-p6-s6`, modded-compat): reading flight
# `2026-11-22_1631` (`limit=20`: 20 cases + 9 controls in 65.4 s, PASS); first full flight
# `2026-11-22_1644` PASS attempt 1 (649 s wall) at the 10 s sun-tracker cap; re-flown at the 25 s
# cap as `2026-11-22_1718` PASS attempt 1 (652 s wall, 452.2 s + 105.5 s + 0.2 s of sweep, 225
# cases, controls ok, press ok, complete, recompute 14 / 0 mismatches; report-only verdicts 176
# pass / 21 warn / 28 fail / 0 error, no tracker still moving).
description = "LIVE-PROVEN 2026-11-22 (part ghost parity P6 S6, `2026-11-22_1718`): every transforming modded-compat part (ReStock, ReStock+, Waterfall, B9PartSwitch) in its deployed / open / lit / jettisoned state beside its Parsek ghosts (event route, start route, stowed reference) in LKO over three PartParitySweep states=all steps, judged by the partParity verifier row (controls, press, recompute and completeness gates; part verdicts report-only)."
instanceProfile = "modded-compat"
tags = ["part-parity", "ghost-visual", "modded-compat", "flown", "PP-4"]

[fixture]
saveTemplate = "fixtures/saves/eva2-lko-crewed"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # No spawned case vessel may start a recording.
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnEva", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnFirstModificationAfterSwitch", value = "false" }, expect = "OK" },
  # The per-case lines are verbose-tier.
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  # Into FGV-1's sunlit window. Rails warp, explicit UT.
  { cmd = "WarpToUT",   args = { ut = "1900" }, expect = "OK", budget = 120 },
  # Clear the label directory so no earlier run's files mix in.
  { cmd = "PartParitySweep", args = { label = "pp4", op = "reset" }, expect = "OK", budget = 120 },
  # Three time-boxed state steps over every orbit state case; each resumes.
  { cmd = "PartParitySweep", args = { label = "pp4", op = "run", states = "all", controls = "true", maxSeconds = "480" }, expect = "OK", budget = 540 },
  { cmd = "PartParitySweep", args = { label = "pp4", op = "run", states = "all", controls = "true", maxSeconds = "480" }, expect = "OK", budget = 540 },
  { cmd = "PartParitySweep", args = { label = "pp4", op = "run", states = "all", controls = "true", maxSeconds = "480" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# No D7 claim: the part verdicts are report-only, so no part-event family is gated here.
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Zero: every auto-record setting is off and the spawned case vessels are never recorded.
count = { min = 0, max = 0 }

[expectations.partParity]
# Report-only part verdicts (design D.6); the instrument gates regardless.
gating = false

[expectations.logContracts]
required = [
  # The capture engine's run-step summary line: every control ok, no case crashed.
  "\\[Parsek\\]\\[INFO\\]\\[PartParity\\] PartParity step label=pp4 op=run ok=true label=pp4 done=(true|false) next=[0-9]+ cases=[0-9]+ complete=[0-9]+ crashed=0 setupFaults=[0-9]+ controls=ok wall=[0-9.]+",
  # The seam applier's OK line for a run step.
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] partparitysweep complete label=pp4 elapsed=[0-9.]+s label=pp4 done=(true|false) ",
  # The step planned an orbit state run (design D.2, PartParityStateRules.FormatCounts).
  "\\[Parsek\\]\\[INFO\\]\\[PartParity\\] state cases: states=all contexts=none install=[1-9][0-9]* \\(",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
]

[runtime]
# The step budgets: LoadGame 300, the warp 120, the reset 120, three 540 s run steps
# (2160 s; PP-2's 2400).
budgetSeconds = 2400

[retry]
policy = "none"

[expectedFail]
bugId = ""
