schema = 1
id = "H45-stock-ui-overlay"
tier = "nightly"
# PHASE-4 WAVE 1, the H7-H20 shape. Parsek's decorations on the STOCK KSC facility screens.
#
# WHAT IT COVERS: the overlays Parsek paints onto stock facility UIs and, in the second
# trio, their removal on despawn - the R&D tech tree decorated for a committed future
# node, the Astronaut Complex for reserved and future-hired crew, and Mission Control
# for a committed contract. Every one needs a LIVE stock facility screen instantiated
# in the Space Center scene; headless xUnit has no screen to decorate, so none of these
# six has ever executed anywhere.
#
# WHY A READING RUN - THE AUDIT'S "guards only HighLogic.CurrentGame" IS WRONG. Every
# one of the six carries three to five guards, and while the mode guards are answered by
# a CAREER host, two families are NOT:
#   * `contractPick.SkipReason` (both Mission Control cells) - the cell has to FIND a
#     decoratable contract in the live game, and whether `career-contract-pad`'s
#     contracts are in a state the picker accepts is a runtime fact.
#   * "{buildingName} building instance not found in Space Center scene" and
#     "KerbalsModule.reservations field missing" (`MissionControlOverlaysClearedOnDespawn`)
#     - live scene and reflection conditions.
# So the honest form is open. PREDICTED: the four R&D / Astronaut cells pass on a career
# host and the two Mission Control cells are the open question.
#
# -------------------------------------------------------------------------------------
# READING HISTORY - ONE CENSUS, PREDICTION CONFIRMED EXACTLY.
# `2026-08-28_2220`, **PASS attempt 1**, wall 66 s. MEASURED:
#     BATCH_COMPLETE v1 total=6 passed=4 failed=0 skipped=2
#     category=StockUiOverlay scene=SPACECENTER
# `recordings.count = 0`; every verifier PASS or REPORT.
#
# THE PREDICTION WAS "the four R&D / Astronaut cells pass on a career host and the two
# Mission Control cells are the open question", and that is precisely what happened. The
# four passes are the first execution ANYWHERE of Parsek's decorations on live stock
# facility screens: `RnDOverlayDecoratesCommittedFutureNode`,
# `RnDOverlaysClearedOnDespawn`, `AstronautOverlayDecoratesReservedAndFutureHired`,
# `AstronautOverlaysClearedOnDespawn`.
#
# THE SKIP ROSTER - both runtime, both the SAME cause, quoted verbatim:
#   1 FlightIntegrationTests.MissionControlOverlayDecoratesCommittedContract - "No
#     Mission Control offered contract row with a non-empty title/Guid is available
#     (rows=0, contractRows=0, offeredRows=0, activeRows=0)"
#   2 FlightIntegrationTests.MissionControlOverlaysClearedOnDespawn - identical reason.
# THE COUNTERS ARE THE FINDING, and they resolve the open question ONE LEVEL EARLIER
# than the header expected. `rows=0 contractRows=0 offeredRows=0 activeRows=0` says the
# live Mission Control screen instantiated and was walked and found NOTHING - not that
# the picker inspected a contract and rejected its state, which is the guard family the
# header worried about. So `career-contract-pad` does not put an OFFERED contract in
# front of the screen at all. That makes it a FIXTURE requirement rather than a defect:
# closing it needs a career save carrying at least one offered contract with a non-empty
# title and Guid at the moment the batch runs. Declared as 2 in
# `IngameBatchWiringGroupTests.RUNTIME_SKIPS` so the tally can be pinned WHOLE without
# the group asserting a split this fixture cannot deliver.
#
# -------------------------------------------------------------------------------------
# SECOND READING (2026-09-08) - THE OPEN QUESTION WAS A PRODUCT DEFECT, NOT A FIXTURE.
# `career-earned-ksc` (nine Offered contracts, vessel-less, boots to the Space Center)
# was built to answer the fixture requirement above, and the first census on it (CEN-2,
# `2026-09-07_2017`) still read both Mission Control cells skipping - now with
# `rows=9, contractRows=0`: nine live rows, and the picker could not read a contract out
# of ANY of them. The production overlay logged the same thing on the same screen
# ("MissionControl row contract lookup failed - contract overlays disabled"): stock
# (`MissionControl.AddItem`, KSP 1.12.5) stores a `MissionControl.MissionSelection`
# wrapper in `UIListItem.Data`, and both Parsek's overlay and the test cast it
# `as Contract`, so the Mission Control contract overlays had never decorated a row.
# `StockUiOverlayController.ExtractMissionControlRowContract` now unwraps the
# MissionSelection (a bare Contract payload is still accepted) and the test reads rows
# through it. Census CEN-11 (`2026-09-08_1034`) on the fixed DLL: 6 of 6, the overlay
# logging `MissionControl decorated contractCount=1`. The lane moved to this host and
# pins the whole category executing; `career-contract-pad` stays the L5 lane's host.
# FIRST FLIGHT ON THIS HOST: run `2026-09-08_1039`, PASS attempt 1, wall 49 s, the
# 6/6 line matched verbatim, `recordings.count = 2`, every verifier PASS or REPORT.
#
# -------------------------------------------------------------------------------------
# THIRD SHAPE (2026-09-25, stock-UI overlays PR 2b and PR 2a) - NOT YET FLOWN. No stock
# screen carries a Parsek badge any more.
#  - PR 2b, Mission Control: the badge (`Parsek_ContractOverlay`) is gone; a
#    committed-accept Offered contract carries a status on its OWN stock row label, the
#    committed-accept explanation in the stock detail text, and greyed Accept and
#    Decline, with `Contract.Decline` refused as the backstop. Three cells:
#    `MissionControlAvailableRowLabelSurvivesTabSwitchAndRebuild`,
#    `MissionControlDetailPanelDisablesAcceptAndDeclineWithReason` and
#    `MissionControlStockAnnotationsLeakNothingOverOpenCloseCycles`.
#  - PR 2a, R&D and the Astronaut Complex: their four badge cells were replaced by six
#    cells asserting the stock mechanisms (tinted node icon, stock tooltip / description
#    text, disabled Research, row labels, locked hire / dismiss) and their survival across
#    stock rebuilds (RDTechTree.RefreshUI, AstronautComplex.UpdateCrewCounts, a crew list
#    re-list), a disabled button showing its reason, and no Parsek GameObject on the stock
#    screen across open/close cycles (`InGameTests/StockUiStockDecorationTests.cs`).
# The category is 9 declarations; the pin is `total=9` literal with the split regexed
# (registered in `IngameBatchWiringGroupTests.INTERIM_PIN_IDS`) until the new cells'
# first flight. The guards are career mode, an Offered contract row, an unresearched
# RESEARCHABLE node and the Astronaut Complex building, so the prediction on this host is
# 9 of 9.
description = "INTERIM (re-opened 2026-09-25, the rewritten cells not yet flown): the in-game StockUiOverlay category unattended on a career host with contracts on offer, nine cells, pin total=9 with the split regexed - Parsek's annotations on the live stock R&D, Astronaut Complex and Mission Control screens, all on stock mechanisms (tinted R&D node, stock tooltip / description / detail text, row labels, greyed Research / hire / dismiss / Accept / Decline, Decline backstop) and nothing left behind on close. Earlier shape flown 6 of 6 on 2026-09-08."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "phase4-wave1", "stock-ui", "career", "H45", "reading-run"]

[fixture]
# career-earned-ksc (career-contract-pad until 2026-09-08), and BOTH properties are
# load-bearing. CAREER: the six Astronaut Complex and Mission Control cells skip
# outright on a non-career mode ("Astronaut Complex annotation verification is
# career-only") and the three R&D cells on SANDBOX ("R&D annotation verification needs a
# tech-research-capable mode"),
# so the whole batch would be vacuous on any SANDBOX host including the wave's
# gloops-airshow. CONTRACTS ON OFFER: the three Mission Control cells need an Offered
# contract row to decorate; this fixture carries nine, the old host carried none in
# front of the screen (its one contract is Active, spliced for L5).
#
# It boots via `LoadGame scene=spacecenter` (the R12 argument H34 also uses).
# Its activeVessel would otherwise take the Focusable route into FLIGHT, where
# all nine SPACECENTER-scoped declarations scene-skip and the batch is empty.
saveTemplate = "fixtures/saves/career-earned-ksc"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# verboseLogging=true: the CENSUS is the product, and the header's open question -
# whether the contract picker accepts this fixture's contracts - is answered by a
# skip reason, not by a count.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "StockUiOverlay" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# `career` is the fixture's own `Mode = CAREER`, riding the loadgame line; `scene-ksc`
# is the pinned `scene=SPACECENTER` token. NOT claimed: any D8 ledger value - these
# cells read committed state to decorate a screen and post no game action.
D14 = ["career", "scene-ksc"]

[expectations]
# PLACEMENT IS LOAD-BEARING (see H7): run.py reads `expectations.allowedAnomalies`,
# and a bare key written AFTER an `[expectations.<sub>]` header is TOML-scoped to that
# sub-table and never read.
allowedAnomalies = []

[expectations.recordings]
# Zero: nothing here records, and the overlays are read-side decoration.
# The two committed recordings the earned career carries (H71 pins the same 2).
count = { min = 2, max = 2 }

[expectations.logContracts]
# ANTI-VACUITY plus a DELIBERATELY OPEN SPLIT.
#  - total=9 is ATTRIBUTE-EXACT: 9 `[InGameTest(Category = "StockUiOverlay")]`
#    declarations, all `Scene = GameScenes.SPACECENTER` (the three Mission Control cells in
#    `RuntimeTests.cs`, the six R&D / Astronaut Complex cells in
#    `InGameTests/StockUiStockDecorationTests.cs`). The ATTRIBUTE FLOOR for `skipped` is
#    0 at SPACECENTER.
#  - passed / skipped are OPEN for the reason in the header: the contract-picker and
#    building-instance guards are runtime facts on this host.
#  - failed=0 is the ASSERTION.
#  - scene=SPACECENTER is LOAD-BEARING and is the B10 fail-open guard: a boot that lost
#    the `scene=` argument lands in FLIGHT, where all nine scene-skip and the tally reads
#    `total=9 passed=0 failed=0 skipped=9` - a vacuous line this pin rejects.
#  - 2026-09-25: total=9 (PR 2b rewrote the Mission Control cells and added one, PR 2a
#    replaced the four R&D / Astronaut cells with six), split regexed until the first
#    flight of the new cells - see the header.
required  = ["BATCH_COMPLETE v1 total=9 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=StockUiOverlay scene=SPACECENTER"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# 720, the H7-H20 wave convention. NOTE THE INHERITED FLAW rather than repeating it
# silently: both LoadGame and RunTests are deferred seam verbs, so run.py waits
# `required_step_wait(max(budget, 600))` = 660 s on each and the true worst case is
# 1320 - a seam TIMEOUT here can surface as a harness KILL instead of a retryable
# driver-INVALID, and run.py warns about exactly that. H21 documents it for the whole
# family and deliberately did not change 14 committed budgets; this wave joins the
# family rather than forking its own convention. Raising the whole wave is a separate
# change with its own evidence.
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
