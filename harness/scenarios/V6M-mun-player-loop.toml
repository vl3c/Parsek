# WHAT THE READING RUN ALSO EXPOSED - AN INSTRUMENT GAP, NOT A PRODUCT DEFECT, AND THE
# ONE THING TO RESOLVE BEFORE ARMING. The reading raised THREE report-only RC-OWN FAILs,
# one per cycle, at exactly the three arrival brackets:
#   `recId=4cfa06ce...: a visible TracedPath dwell [296370, 296690] / [576510, 576830]
#    / [985950, 986270] exists with NO ownership record`.
# Diagnosed 2026-08-25 from the manifest + the collected KSP.log + the source; the
# answer is that THIS LANE NEVER OPENS THE MAP VIEW, and the two halves of RC-OWN's
# conservation contract do not share a gate:
#   * the INTENT half (`ShadowRenderDriver.RunFrame`, which stamps the TracedPath
#     intent the DWELL records and the stock line/icon suppression both read) is
#     driven from `ParsekFlight`'s per-frame update and runs map-open or not;
#   * the PUBLISH half (`drewNonOrbitalLegRecordings` ->
#     `RenderCompositionRecorder.NoteOwnershipPublish`) is reached only at the END of
#     the polyline Driver's `LateUpdate` walk, whose SECOND statement is
#     `if (!MapView.MapIsEnabled) return;`.
# The evidence is direct: the collected KSP.log carries the Driver's awake and destroy
# lines and ZERO `Polyline frame:` summaries (that summary is emitted at the end of
# every completed walk, so zero of them means every LateUpdate bailed early, and the
# scene gate cannot be the one that fired because `scene = FLIGHT`); all three descent
# dwells carry `markerPolyline = False` with `markerIconSuppressed = True` (the marker
# rode the icon fallback, not a drawn polyline); and no seam verb opens the map (there
# is no `EnterMapView` command and no production path calls `MapView.EnterMapView`),
# so `ownershipChanges = 0` is the state of EVERY manifest lane today - V24W measured
# 0 as well and escaped only because it never opened a TracedPath dwell. With the map
# closed nothing is drawn on any map surface, so a visible TracedPath dwell is an
# INTENT record and not evidence of a draw: the premise "a draw happened" was never
# established. `rendercompose._rule_own` now says so by name - zero OWNERSHIP_CHANGE
# records ANYWHERE stands the draw->publish direction down as the defined-unevaluable
# `ownership-publish-surface-never-ran`, while ONE publish anywhere proves the walk
# ran and restores the FAIL for any recording that then has none.
# CONSEQUENCE FOR ARMING, and it is a hard one: on this lane RC-OWN's draw half is
# STRUCTURALLY UNEVALUABLE, so an arming pass must not read "no RC-OWN finding" as
# "ownership conserved". Either arm only clauses this drive can actually answer
# (`cycles`, the RC-CYCLE surface, the dwell/treatment counts), or first give the
# suite a map-open lane - which needs a new command-seam verb, i.e. a C# change and a
# flown-shape change, neither of which belongs in an arming pass.
#
# WHY THIS LANE, AND WHY THE THIRD CYCLE. Two separate reasons, and the second is the
# one that made this an extension rather than a one-line declaration.
#
#   (i) THE SUBJECT. `docs/dev/design-autotest-render-composition.md` -> "Harness
#       integration and lanes" names "a phase-lock moon loop (V6/V14 class)" as a first
#       Phase-3 subject. V14M covers the V14 half - an ORBIT-ROOTED, single-constraint,
#       UNIFORM-cadence subject on `method=single-orbital`. This lane is the OTHER half
#       and is structurally different in exactly the way the composition module cares
#       about: PAD-ROOTED, two constraints, and a NON-UNIFORM ZERO-DRIFT SCHEDULE
#       (`zeroDrift=yes`, faithful-k series 13, 26, 45, 58 - visibly not an arithmetic
#       progression). RC-CYCLE's own residual trend (`cycleLengthResidualsSeconds`,
#       computed as `(hi - lo) - unit.cadenceSeconds` per window) is therefore a
#       DIFFERENT surface here than on any lane flown so far: on a uniform-cadence
#       subject the residual is ~0 by construction, while a scheduled unit's window
#       lengths are the schedule's own irregular steps. And it is the MUN - the
#       operator's question was asked about a looped mission to the Mun specifically,
#       and no composition accounting has ever gated on a Mun subject.
#
#  (ii) THE TWO-CLOSED-CYCLE DATASET, which is the first of its kind in the suite. The
#       full derivation lives beside the steps it justifies (the CYCLE 3 banner in
#       `[driver] steps`); the short form is that `rendercompose._cycle_windows` pairs
#       CONSECUTIVE `cycle-rollover` events, so N rollovers close N-1 cycles, and
#       `_rule_cycle` skips any unit with fewer than two closed windows as
#       `no-cycle-rollover-events` unevaluable. Every loop lane in the suite has flown
#       TWO cycles and therefore closed ONE - V14M measured exactly that
#       (`clockEvents {cycle-rollover: 2}` -> `cycles 1`), so RC-CYCLE has never
#       compared two structures anywhere. This lane now enters THREE cycles, closes
#       TWO, and gives the rule its first real comparison: cycle 1's role structure
#       (the sorted `(memberIndex, phaseKind)` set of the closed dwells whose MIDPOINTS
#       fall in the window) against cycle 2's, plus the rollover-forwardness check and
#       two residual samples instead of one.
#
# WHAT THE READING RUN IS EXPECTED TO MEASURE, stated as a PREDICTION so the run can
# refute it rather than confirm whatever it finds:
#   * `cycles` = 2, from `clockEvents {cycle-rollover: 3}`. This is the headline.
#   * RC-CYCLE actually EVALUATING rather than reporting `no-cycle-rollover-events`.
#   * BOTH windows in the SAME warp bucket (`warp1x`), because every clock move on this
#     lane is an instantaneous `TimeJump`. That matters for how RC-CYCLE speaks: its
#     isomorphism clause raises at FAIL level when two SAME-BUCKET cycles differ in role
#     structure and only at INFO across buckets, so a same-bucket pair is the SHARP
#     reading, not a limitation. A FAIL finding here is a MEASUREMENT on a bare block
#     (an unarmed block gates on nothing) and is exactly the sort of thing this dataset
#     exists to surface - a role-structure difference between two cycles of one looped
#     Mun mission is the render-side statement of "cycle 2 does not arrive where cycle 1
#     did", which is the question section 3 asks with coarser instruments.
#   * `warpBuckets` MUST NEVER be declared on this lane, for V14M's reason: the
#     histogram is 1x-only BY CONSTRUCTION and declaring it would pin the drive shape as
#     though it were a property of the product. V24W is the suite's only warp-histogram
#     subject.
# MEASURED 2026-08-25 on `2026-08-25_2056`: the first three predictions ALL landed and
# none was refuted (cycles=2, RC-CYCLE evaluated, both windows `warp1x`); `warpBuckets`
# stays undeclared. The prediction list is kept as written - it is the pre-registration,
# and the ARMING LEDGER above carries what the run actually measured.
#
# WHY THE THREE TRACERS ABOVE ARE LOAD-BEARING FOR THIS ROW TOO: the tangent/endpoint
# capture predicates behind RC-SEAM are `mapRenderTracing`-gated (SPEC decision 2), so a
# manifest taken with the tracer off carries no seam numbers and every RC-SEAM numeric
# clause counts as `seam-data-unavailable-tracing-off` unevaluable. This lane already
# arms all three (steps 5-7) for its arrival-evidence lines, so the row costs nothing
# extra here - and `test_every_declarer_arms_the_tracers_the_seam_capture_needs` pins
# that it keeps doing so.
#
# WHAT DECLARING DOES, and it is the entire mechanism: declaring the block (NOT arming
# it) is what sets `PARSEK_RENDER_MANIFEST=1` at launch
# (`rendercompose.declared_composition_blocks` -> run.py's env build), which arms the C#
# recorder at Awake. Without the declaration the export verb answers
# `REJECTED msg=manifest-not-armed`, which `hlib.validate_spec`'s verb/block coupling
# rule refuses pre-launch rather than letting it fly.
# =====================================================================================
tier = "operator"
description = "THE PLAYER WORKFLOW ON A SAME-PARENT MOON MISSION, twice over: load the committed mun-orbit-recorded save, arm the loop, press Warp-to, cross cycle 1's Kerbin->Mun SOI seam, press Watch at the ghost's Mun park, then press Warp-to AGAIN for cycle 2 and cross its arrival with the same instruments. A Kerbin->Mun mission is ALWAYS phaseLocked, so ApplyReaim is unreachable: this lane pins the OTHER road (Orbital(Mun) same-parent + support=Supported + PhaseLock APPLIED with zeroDrift=yes/scheduleWithinTol=yes + factory chain reaimed=False) and FORBIDS every re-aim token V4 requires. The two-cycle shape is the desync hunt: same-body handoff, seam-teleport silence and hidden-by-zone proximity are compared cycle 1 vs cycle 2. EXTENDED 2026-08-25 with a THIRD cycle and an M-A7 render-composition capture: rendercompose closes N-1 cycles off N cycle-rollover events, so two flown cycles have only ever closed ONE anywhere in the suite - three cycles close TWO and give RC-CYCLE its first same-warp-bucket structure comparison, on the Mun, on a NON-UNIFORM zero-drift schedule. The [expectations.renderComposition] block is BARE; the reading run was taken 2026-08-25 (cycles=2, RC-CYCLE's first real evaluation, isomorphic) and the lane stays UNARMED."
instanceProfile = "stock-minimal"
tags = ["V6", "player-loop", "watch-mode", "loop-playback", "phase-lock", "zero-drift", "mun", "moon", "render-composition", "rc-cycle", "flown"]

[fixture]
# The B11-mun-orbit harvest (run 2026-08-08_1458, PASS attempt 1, --keep-parsek): ONE
# committed tree d18969d6..., EIGHT recordings (the Mun-parked Kerbal X + six radial
# boosters + one flameout-staged remnant this profile drops on a Kerbin-impacting
# trajectory), save UT ~21,746. Its PARKED KERBAL X is the OBSERVER for both watch
# attempts - the player who watches a replay is standing where the flight ended.
saveTemplate       = "fixtures/saves/mun-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, measured on the
  # duna fixture and structural, not fixture-specific): loading a save whose own parked
  # craft is active makes the committed-tree restore path resume a promotion-stub
  # recording ~1 s into the scene, BEFORE any step can run. StopRecording is
  # idempotent-OK and DiscardTree answers OK with nothing-discarded when no plain tree
  # is live, so the pair is safe on any entry state; the SetSetting stops a later one.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins, same rationale as V4: ghostRenderTracing is the FLIGHT-scene
  # raise gate for the loop-seam-teleport Tier-C instrument; mapRenderTracing arms the
  # map/TS tracer + probe (the source of the `surface=Proto*` truth lines this lane's
  # arrival evidence is read off); verboseLogging is LOAD-BEARING for both (the tracer
  # emits Tier-B truth at Verbose - the V1 lesson).
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # STEP 1 OF THE WORKFLOW: the Missions window loop checkbox (production
  # MissionStore.SetLoopEnabled). Its Info line echoes phaseAnchorUt - the number the
  # whole bracket arithmetic above is anchored to. READ IT WHEN RE-PINNING.
  { cmd = "MissionConfig", args = { tree = "d18969d6121444c1a30e4a55ae87a442", loop = "true" }, expect = "OK" },
  # STEP 2: "Warp to..." -> ComputeNextRelaunchUT -> FastForwardToEventUT, an
  # INSTANTANEOUS Planetarium clock set (no rails warp to budget). CYCLE 1.
  { cmd = "StartLoopPlayback", args = { tree = "d18969d6121444c1a30e4a55ae87a442" }, expect = "OK", budget = 300 },
  # CYCLE-1 ARRIVAL BRACKET, strictly forward, straddling the predicted Kerbin->Mun SOI
  # seam 296,547.5 at -177.5 / -57.5 / +142.5 s. Instantaneous, so the seam is CROSSED
  # by the third jump rather than dwelled through.
  { cmd = "TimeJump", args = { ut = "296370" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "296490" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "296690" }, expect = "OK", budget = 300 },
  # CYCLE-1 PARK EPOCH: phaseAnchor + 20,800, deep inside the recorded Mun park - the
  # only epoch where the auto-select's body test can pass for a Mun-parked observer,
  # so the only place the watchable-chord question can be asked at all.
  { cmd = "TimeJump", args = { ut = "300977" }, expect = "OK", budget = 300 },
  # STEP 3: "Watch", auto-select over all committed recordings. PREDICTED REJECTED (the
  # header's "71:29" odds framing is superseded - the separation is a fixed per-cycle
  # geometric fact, not a draw; MEASURED 560,404 m, outside both the 300 km production
  # range term and V7M's measured (51.5 km, 144.3 km) entry boundary); an OK is the
  # finding.
  { cmd = "EnterWatchMode",                                                  expect = "REJECTED" },
  # STEP 4: "Warp to..." AGAIN. This is the desync hunt's second half: the verb
  # rebuilds the unit and resolves NextLaunchAfter(now), so with `now` past cycle 1's
  # arrival it lands on CYCLE 2 (predicted k=26, 560,319.470).
  { cmd = "StartLoopPlayback", args = { tree = "d18969d6121444c1a30e4a55ae87a442" }, expect = "OK", budget = 300 },
  # CYCLE-2 ARRIVAL BRACKET, same -177.5 / -57.5 / +142.5 offsets about the predicted
  # cycle-2 seam 576,690.0. Identical instrument set: whatever differs from cycle 1 is
  # the desync signal.
  { cmd = "TimeJump", args = { ut = "576510" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "576630" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "576830" }, expect = "OK", budget = 300 },
  # CYCLE-2 PARK EPOCH: the same +20,800 offset off the cycle-2 anchor.
  { cmd = "TimeJump", args = { ut = "581119" }, expect = "OK", budget = 300 },
  # STEP 5: "Watch" again, an INDEPENDENT separation from step 3's (the anchor moved;
  # ~110 park revs of accumulated offset). Not a second draw of the same coin - see the
  # superseded-arithmetic banner. MEASURED 561,219 m, again REJECTED.
  { cmd = "EnterWatchMode",                                                  expect = "REJECTED" },
  # =====================================================================================
  # CYCLE 3 - ADDED 2026-08-25, PURELY ADDITIVE (header section 6). NOTHING ABOVE MOVED.
  # This is the block that turns this lane into the suite's first TWO-CLOSED-CYCLE
  # render-composition dataset. The derivation, in three steps, all of it read off
  # rendercompose.py + RenderCompositionRecorder.cs rather than assumed:
  #   1. `RenderCompositionRecorder.ObserveUnitFrame` appends ONE `cycle-rollover` clock
  #      event per owner per CHANGE of `frame.CycleIndex`.
  #   2. On a SCHEDULED (zero-drift) unit - which this lane is - `ComputeSpanLoopFrame`
  #      takes the schedule branch: `CycleIndex = sIdx`, the index of the largest
  #      scheduled launch <= currentUT, and the frame is UNRESOLVED (no emit at all)
  #      before the first scheduled launch. So the rollover count equals the number of
  #      scheduled launches the run's clock actually ENTERS - two, as this lane stood.
  #   3. `rendercompose._cycle_windows` pairs CONSECUTIVE rollovers, N events -> N-1
  #      closed cycles, and deliberately does NOT synthesise the trailing open cycle
  #      against the export UT ("a cycle the export cut in half is not a cycle").
  #      `_rule_cycle` then skips a unit with `len(windows) < 2` as
  #      `no-cycle-rollover-events` unevaluable.
  # Two rollovers therefore close ONE cycle and RC-CYCLE compares nothing - exactly what
  # the V14M sibling measured off this identical two-cycle shape (`clockEvents
  # {cycle-rollover: 2}` -> `cycles 1` + `no-cycle-rollover-events: 1`). A THIRD entered
  # cycle is the minimum that closes TWO, and closing two is what lets RC-CYCLE's
  # isomorphism clause compare cycle 1's role structure against cycle 2's for the first
  # time in the suite.
  #
  # THE CYCLE-3 ANCHOR IS DERIVED THE SAME WAY THE OTHER TWO WERE, and the derivation is
  # already validated twice over: replaying `TryFindNextScheduleK`'s filter
  # (CircularPhaseError(k*T_anchor, T_other) <= tol_other) with the throttle
  # `ceil((L_last + span - ut0)/T_anchor)` reproduces k=13 -> 280,176.9473801677 and
  # k=26 -> 560,319.4747603355 to the digit against the run's MEASURED anchors, and its
  # k=26 residual 4347.54846243246 against the product's own `scheduleWorstResidual`.
  # The same replay continues the header's faithful-k series 13, 26, 45, 58, 71:
  #   throttleK = ceil((560,319.475 + 21,708.120 - 34.42)/21,549.425) = 28
  #   first k >= 28 passing the Mun filter = **k = 45** (residual 3,166.503)
  #   PREDICTED cycle-3 relaunchUt = 34.42 + 45*21,549.425183089825 = **969,758.553**
  # and the same two offsets off that anchor:
  #   cycle-3 seam = 969,758.553 + 16,370.562 = 986,129.115
  #   cycle-3 park = 969,758.553 + 20,800     = 990,558.553
  # RE-PIN THESE THE SAME WAY AS THE OTHER TWO: read cycle 3's `relaunchUt=` off the
  # third `startloopplayback initiated:`. A mis-pin self-detects as
  # `timejump refused reason=backward-jump`, which is FORBIDDEN below.
  #
  # STEP 6: "Warp to..." a THIRD time - the same real player action as steps 2 and 4.
  # `StartLoopPlayback` rebuilds the unit and resolves `NextLaunchAfter(now)`; with `now`
  # past cycle 2's park (581,119) the next scheduled launch is k=45. The press itself
  # fast-forwards the clock onto that launch, which is the frame that emits rollover #3
  # and CLOSES cycle 2.
  { cmd = "StartLoopPlayback", args = { tree = "d18969d6121444c1a30e4a55ae87a442" }, expect = "OK", budget = 300 },
  # CYCLE-3 ARRIVAL BRACKET, the same shape as cycles 1 and 2 about the predicted
  # cycle-3 seam 986,129.115. It is NOT needed to close cycle 2 (the press above already
  # did that) - it is here so cycle 3 carries the SAME instrument set as its two
  # predecessors: the dwells it opens are what a future rollover #4 would close, and the
  # forward clock motion is what closes cycle 2's own dwells so they land in the manifest
  # as CLOSED records rather than in `openDwells` (RC-CYCLE's role structures are built
  # from closed dwells only).
  { cmd = "TimeJump", args = { ut = "985950" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "986070" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "986270" }, expect = "OK", budget = 300 },
  # CYCLE-3 PARK EPOCH: the same +20,800 offset off the cycle-3 anchor, well inside the
  # 21,708 s span. DELIBERATELY NOT FOLLOWED BY A THIRD `EnterWatchMode`: a watch attempt
  # is a PINNED VERDICT bet (header section 4), and this block is an additive
  # render-composition extension, not a new watch measurement. Adding one would put a
  # third coin-toss verdict in a lane whose flown shape is otherwise untouched.
  { cmd = "TimeJump", args = { ut = "990558" }, expect = "OK", budget = 300 },
  # M-A7 RENDER-COMPOSITION CAPTURE (Phase 3). PLACEMENT IS THE WHOLE ARGUMENT and it is
  # pinned by `test_every_declarer_exports_immediately_before_teardown`: the recorder
  # accumulates from Awake, so the only thing placement decides is how much of this
  # lane's observation is already inside the exported file. Here that is every one of the
  # three cycles' arrival brackets, both park-epoch watch decisions and all three
  # rollovers - and it is taken at a CHOSEN instant rather than provoked by the
  # scene-exit auto-flush that follows `FlushAndQuit`.
  # INERT by construction (`hlib.SEAM_VERB_TAIL_ROLE` = inert): it reads the recorder's
  # in-memory accumulation and writes one file in the KSP root, touching no vessel, no
  # save and no Parsek persisted state - so it cannot perturb the two save-structure
  # blocks this lane already gates on.
  { cmd = "ExportRenderManifest",                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

# CLAIM-IS-NOT-GATE.
#   D11 `phase-lock` is gated by the required `PhaseLock APPLIED:` line TOGETHER with
#     `Orbital(Mun) same-parent` + `support=Supported`: the first proves the lock was
#     APPLIED, the pair proves it was applied to the same-parent moon config rather
#     than to something else.
#   D11 `zero-drift-schedule` is gated by `zeroDrift=yes` + `scheduleWithinTol=yes` on
#     that same line - the schedule exists AND every launch it resolved was inside its
#     constraint tolerance. A fixed-cadence fallback prints `zeroDrift=no` and reds.
#   D9 `fast-forward` follows V4's precedent: gated by the PRODUCT's own
#     `FastForwardToEventUT: jumping to UT=` line, not by the seam verb's OK.
#   D14 `mun` / `scene-flight` / `sandbox` are the environment axes this lane runs on.
# NOT claimed: any watch-mode cell (a measured REFUSAL to enter watch mode is not
# evidence of watch behaviour - V4's rule), any D11 arrival cell (this observes an
# arrival epoch, it asserts no arrival geometry), and D6 `time-jump`.
[dimensionsCovered]
D9  = ["fast-forward"]
D11 = ["phase-lock", "zero-drift-schedule"]
D14 = ["mun", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every [expectations.<sub>]
