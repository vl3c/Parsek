[dimensionsCovered]
# EVA-6's cells, the same chain; no registry cell names crew-inventory capture / restore.
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# EVA-6's measured count for the same chain: the fixture's nine plus the kerbal and the
# placed-part member.
count = { min = 11, max = 11 }

# REPORT-ONLY, EVA-6's census: the two spawned vessels once each and the kept capsule.
[expectations.recordings.structure]
gating      = false
vesselNames = { "Grand Slam Passive Seismometer" = 1, "Jebediah Kerman" = 1, "#autoLOC_501232" = 1 }

[expectations.logContracts]
required = [
  # The chain (EVA-6's tokens, the minimum that establishes the story).
  "evaexit complete",
  "startrecording recordingId=[0-9a-f]+ already=false",
  "evagroundscience place start kerbal=Jebediah Kerman part=DeployedSeismicSensor slot=1 inventory=0:evaChute,1:DeployedSeismicSensor",
  "evagroundscience place complete part=DeployedSeismicSensor partPid=[0-9]+ ",
  "Ground part placed: tree member created part='DeployedSeismicSensor' vesselPid=[0-9]+ partPid=[0-9]+ rec=[0-9a-f]+ parentRec=[0-9a-f]+ bp=[0-9a-f]+ ut=[0-9.]+ snapshot=True",
  "committree committed=true",
  "invokerewindtolaunch complete rec=[0-9a-f]{32} tree=[0-9a-f]{32} adjustedUT=",
  # Jeb's own KSC spawn after the rewind, tied to the kerbal recording by its id and to the
  # committed store's read-back by the spawned pid (EVA-6's token, labels renamed).
  "startrecording recordingId=([0-9a-f]+) [\\s\\S]*MISSIONMARK label=eva7-rewound-count-11-[^\\r\\n]*-\\1-false-0(?:-|\\s)[\\s\\S]*\\[KSCSpawn\\] Attempting spawn for #([0-9]+) \\\"Jebediah Kerman\\\" \\(id=\\1\\)[\\s\\S]*\\[KSCSpawn\\] Vessel spawned for #\\2 \\\"Jebediah Kerman\\\" pid=([0-9]+) sit=LANDED [\\s\\S]*MISSIONMARK label=eva7-kscspawn-count-11-[^\\r\\n]*-\\1-true-\\3(?:-|\\s)",
  # CAPTURE: the EVA kerbal's inventory read from his own loaded module.
  "\\[CrewInventory\\] CaptureFromLiveVessel: captured 1 crew inventory\\(ies\\) \\(1 from live module\\) for pid=[0-9]+ vessel='Jebediah Kerman'",
  # RESTORE, inside Jeb's KSC spawn: the recorded ONE-part inventory (post-placement), not
  # the TWO-part roster the rewind restored.
  "\\[KSCSpawn\\] Attempting spawn for #([0-9]+) \\\"Jebediah Kerman\\\" \\(id=[0-9a-f]+\\)[\\s\\S]*?\\[CrewInventory\\] ApplyToRosterKerbal: '[^'\\r\\n]+' roster inventory replaced \\(storedParts=1, droppedLiveInstance=(?:True|False)\\)[\\s\\S]*?\\[CrewInventory\\] RestoreForSpawn: '[^'\\r\\n]*' seated=1 restored=1 noEntry=0 applyFailed=0 unseated=0 \\((?:SpawnAtPosition|RespawnVessel)\\)[\\s\\S]*?\\[KSCSpawn\\] Vessel spawned for #\\1 \\\"Jebediah Kerman\\\" pid=[0-9]+ sit=LANDED",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "\\[Parsek\\]\\[WARN\\]\\[CrewInventory\\]",
  # EXACTLY ONCE: a second restore line anywhere.
  "\\[CrewInventory\\] RestoreForSpawn: '[^'\\r\\n]*' seated=[\\s\\S]*\\[CrewInventory\\] RestoreForSpawn: '[^'\\r\\n]*' seated=",
  # The pre-capture fallback on the kerbal's spawn (the capture did not reach the snapshot).
  "\\[CrewInventory\\] RestoreForSpawn: no recorded crew inventory on 'Jebediah Kerman'",
  # A spawn-failure rollback of the restore.
  "\\[CrewInventory\\] RollbackRestore:",
  "evagroundscience failed",
  "evagroundscience refused",
  "invokerewindtolaunch refused",
  "Spawn RETIRED",
  "Spawn ABANDONED",
  "Spawn FAILED",
  "Spawn not needed for #[0-9]+ \\\"Jebediah Kerman\\\": non-leaf in tree",
]

[runtime]
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
