schema = 1
id = "V39M-jool-laythe-bop-player-loop"
# =====================================================================================
# AUTHORED 2026-11-14, NEVER FLOWN, WAITING ON ITS FIXTURE: `jool-laythe-bop-recorded`
# does not exist until B48-jool-laythe-bop-continuation flies green and is harvested
# --keep-parsek. Until then this lane is listed in harness/lib/test_hlib.py
# PENDING_FIXTURE_LANES, which keeps every committed suite green without the
# fixture; a run refuses at staging.
#
# THE M-MIS-6 DECLINE (design-mission-multimoon-alignment.md D1 / D4, test plan
# item 2 live). B48's tree enters Laythe and Bop; P_Bop / P_Laythe = 10.277 is
# incommensurate, so the config hold must fail closed to faithful WITH an amber that
# names the shape: `ArrivalHoldPlanner.ComputeMultiMoonConfigHold` opens every reason
# with "2 constrained moons of 'Jool'", and `MissionLoopUnitBuilder
# .LogArrivalAmberTransition` logs it as `Arrival amber SET: tree=<id>
# mission='<name>' <reason>`. The rest of the reason (the scan miss with its residual,
# or the slack-clamp budget) is left loose until the reading names it; then pin it.
# The engage line must NOT print. V33M's shape otherwise.
# =====================================================================================
tier = "pending-fixture"
description = "AUTHORED 2026-11-14, NEVER FLOWN, WAITING ON ITS FIXTURE `jool-laythe-bop-recorded` (harvested from B48-jool-laythe-bop-continuation). The player loop on the Kerbin->Jool->Laythe->Bop tree: re-aim Kerbin->Jool engages and the multi-moon configuration hold DECLINES with an amber naming 2 constrained moons of Jool (Bop is incommensurate), never a silent faithful; the live MoonArrivalHold cell runs at the Space Center."
instanceProfile = "stock-minimal"
tags = ["V39", "player-loop", "loop-playback", "reaim", "arrival-hold", "multi-moon-hold", "decline", "jool", "laythe", "bop", "moon", "ingame-batch", "pending-fixture", "pending-flight"]

[fixture]
saveTemplate       = "fixtures/saves/jool-laythe-bop-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig",     args = { tree = "6ec68e87b782476f970a71df8c8b4685", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "6ec68e87b782476f970a71df8c8b4685" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "RunTests",   args = { category = "MoonArrivalHold" },             expect = "OK", budget = 300 },
  # The export sits right before teardown (RenderComposeVerifierWiringTests placement
  # rule): the recorder accumulates from Awake, so an earlier export drops later steps.
  { cmd = "ExportRenderManifest",                                            expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[dimensionsCovered]
D11 = ["arrival-hold"]
D14 = ["jool", "laythe", "bop", "scene-flight", "scene-ksc", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# DERIVED (B48's own window): re-pin to {N, N + 1} from the harvested sidecar count.
count = { min = 7, max = 11 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "ENGAGED re-aim Kerbin->Jool via Sun",
  "Arrival amber SET: tree=6ec68e87b782476f970a71df8c8b4685 mission='[^']*' 2 constrained moons of 'Jool': ",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=MoonArrivalHold scene=SPACECENTER",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "FORCED FAITHFUL",
  "no member yields a re-aim transfer",
  "ARRIVAL HOLD dest=Jool kind=config",
  "timejump refused reason=backward-jump",
]

[expectations.rewind]
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
committedTrees = { min = 1, max = 1 }
trees          = { min = 1, max = 2 }

[expectations.renderComposition]

[runtime]
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
