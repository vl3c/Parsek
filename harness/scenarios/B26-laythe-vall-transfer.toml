# **DEFECT A - THE ESCAPE CONTRACT WAS WRONG, NOT THE ESCAPE.** Nothing above is
# a computation or execution error; the node was exactly what it was asked for.
# What was wrong is what it was asked for. KSP is a PATCHED-CONIC game: it hands
# a departing vessel to the parent AT THE SOI BOUNDARY, not at infinity. Asking
# for a hyperbolic excess of 347.245 m/s therefore delivered
# `sqrt(v_inf^2 + 2*mu_Laythe/r_soi)` = **1,083.69 m/s** of Jool-relative speed -
# **3.12x** - because 3.72 Mm out Laythe's well is still deep. MEASURED
# CONSEQUENCE, at the stage-2 PLAN-TRANSFER frame (`ut=28820998.731
# alt=20968630.330 ap=126333908.680`): a Jool orbit of pe 19.70 / ap 126.33 Mm
# altitude, i.e. **a = 79.0 Mm, ecc 0.675** where the transfer wanted 35.2.
# (A back-of-envelope that reads the 20.97 Mm ENTRY ALTITUDE as the periapsis
# gives 73.6 Mm; the run's own telemetry line reports pe 19.70 Mm, so 79.0 is the
# number. It does not change the diagnosis, only the arithmetic that repeats it.)
# The "effective v_inf ~893 m/s vs 347.24" reading is the same fact the other way
# round: 1,083.69 in an arbitrary direction is what produces it.
#   AND IT IS OUTSIDE BOTH BANDS THAT MATTER: the delivered 1,083.69 admits
#   a = 14.5 - 8,683 Mm (so 79.0 is an ordinary draw from it), while the intended
#   347.245 admits only 17.9 - 51.1 Mm and the CORRECTED 450 only 17.2 - 59.0 Mm.
#   79.0 Mm cannot be produced by the contract the spec thought it had written,
#   which is what makes the SOI term the explanation rather than a story.
#   THE SWEEP MAKES IT WORSE THAN ONE BAD DRAW. Over every direction and exit
#   point, the flown contract's delivered orbit spans a = 14.5 - 8,683 Mm with a
#   17,335 Mm apoapsis, a MINIMUM PERIAPSIS OF 5.51 Mm (below Jool's 6.20 Mm
#   atmosphere top) and 17 samples that ESCAPE JOOL ENTIRELY. The flown a = 73.6
#   Mm was a middling draw.
#   THE FIX IS ONE TERM AND A RENAME: `escapeSoiSpeedMps`, sized
#   `sqrt(v_soi^2 + 2*mu*(1/r_pe - 1/r_soi))`. The old key is REJECTED by name at
#   spec load rather than ignored. And it forced a second correction:
#   `ejectionEccFloor` cannot be the stage-1 evidence, because a correct
#   patched-conic escape from Laythe is BOUND (ecc 0.7586) - reaching a SOI needs
#   an apoapsis past it, not an escape. See both keys.
#
# **DEFECT B - COAST-WARP-THRASH, AND IT IS AN AMBIGUOUS CLOCK.** Verdict:
# `phase COAST-TO-TARGET: coast-warp-thrash (501 native warp_to_ut issues in THIS
# phase, cap 500 ... ut=29041600.577 target=29062180.256 tts=55579.679
# ttPe=43021.364 warp=NONEx1.000)`. The cap did its job - bounded, named, and it
# is not what needs changing.
#   THE MECHANISM, straight off the log. The stage-2 coast's `nextBody` FLAPS
#   between `Vall` and `Laythe` - because the (over-energetic) Jool ellipse, pe
#   19.70 Mm, re-crosses LAYTHE'S OWN 27.184 Mm orbit - and `time_to_soi` steps
#   with it: **145,030.028 s** (to Vall) vs **123,077.921 s** (to Laythe). The
#   time-mode trigger branch derives its native warp target as
#   `ut + (tts - 35,000)`; the flake line's target reproduces exactly
#   (29,041,600.577 + 55,579.679 - 35,000 = 29,062,180.256). A ~22 ks step blows
#   through `WARP_RETARGET_THRESHOLD_SECONDS` in BOTH directions, so every flip
#   cancelled a running warp and re-armed it - the log shows the pairs verbatim
#   (`gate warpToCmd 29062180.256->29043726.703`, `native warp cancelled (factors
#   zeroed)`, `native warp_to dispatched target ut=29043726.703`). Each cancel
#   zeroes the warp factors, which is the 1x<->3x flutter the operator watched.
#   **FIXING DEFECT A DOES NOT REMOVE DEFECT B, and that is why B got its own
#   fix rather than being written off as a symptom.** The corrected escape's
#   delivered band has a minimum periapsis of 11.01 Mm, still BELOW Laythe's
#   27.184 Mm orbit - so any Laythe->Vall transfer starts at Laythe's radius and
#   the parent-frame coast can re-cross it whatever the escape's energy. The
#   ambiguity is a property of the GEOMETRY of this hop, not of the over-burn.
#   THE FIX IS AN IDENTITY CHECK, NOT A WIDER THRESHOLD:
#   `soi_clock_describes_target` / `coast_foreign_soi_clock_hold`. A
#   `time_to_soi` whose `next_body` POSITIVELY names a body that is not the
#   target is not a refinement of the armed target - it is about a different
#   encounter - so the coast HOLDS instead of cancelling, and the same conjunct
#   keeps a Laythe reading from firing a Vall correction round. It fails OPEN on
#   an unread `next_body`, which is why it is safe on every flown lane.
#
# DISPOSITION: both defects fixed at their roots, values and predicates re-derived
# throughout this file, NOT YET RE-FLOWN. Flight 3 is the next reading run.
