# =====================================================================================
# B26: THE FIRST MOON-TO-MOON TRANSFER. The crewed Duna Rocket starts ALREADY
# PARKED in the 87,931 x 56,240 m Laythe orbit B25 delivered, escapes Laythe into
# JOOL's frame, transfers to VALL, captures into a Vall park and commits the tree
# there. THE RECORDING IS THE PRODUCT.
#
# STATUS, IN THREE BEATS, AND READ THEM IN ORDER:
#   (1) BLOCKER MEASURED. Flight 1 (2026-08-19, both attempts, deterministic)
#       proved MechJeb 2.15.1's `OperationInterplanetaryTransfer` cannot plan
#       from a MOON-PARKED origin. Not a Parsek defect, not a spec defect. The
#       FLIGHT LEDGER below is that measurement and it is kept in full.
#   (2) MODE BUILT. The capability the ledger deferred now EXISTS -- the
#       flag-gated PARENT-RELAY mode in `mlib` (`parentRelayTransfer`), which is
#       candidate (a) of the two the ledger named, in its MINIMAL form. THE MODE,
#       AS BUILT (the section after the ledger) describes it, and this spec is
#       re-pointed at it: `interplanetaryTransfer` STAYS ON -- the relay reads it
#       for its stage-1 evidence and its correction domain -- and the relay flag
#       joins it.
#   (3) MODE FLOWN, TWO DEFECTS FIXED, AND **FLIGHT 3 COMPLETED THE HOP**.
#       Flight 2 (2026-08-20) flew the relay: its core worked and it measured two
#       defects - (A) an escape sized for a hyperbolic excess AT INFINITY when
#       KSP hands over AT THE SOI, 3.12x over; (B) a coast-warp thrash on an
#       ambiguous `time_to_soi`. Both were fixed at their roots.
#   (4) **LIVE-PROVEN 2026-08-20, run `2026-08-20_1752`, PASS attempt 1, mission
#       wall 1,408 s.** The full phase chain through ORBIT-COMMITTED, every
#       assertion met, both fixes proven live, and a Vall park at ecc 0.0035.
#       THIS LANE'S PRODUCT NOW EXISTS: `fixtures/saves/vall-transfer-recorded`,
#       the M-MIS-7 subject, which V17M/V17T are re-pinned against. See the
#       FLIGHT 3 ledger.
#
# WHY THIS LANE EXISTS, and it is NOT "a sixth moon". It is the M-MIS-7 SUBJECT -
# the recording that lets someone finally measure a code path the research doc
# says is live and untested.
#
# EVERY same-parent lane so far (B23 Duna->Ike, B24 Eve->Gilly, B25 Jool->Laythe)
# produces a recording whose launch body is the target's PARENT.
# `IsSameParentTarget` classifies those SAME-PARENT, so they route to PHASE-LOCK,
# and all three measured the same road: `constraints=1`, `method=single-orbital`,
# residual 0. **A MOON-TO-MOON RECORDING IS THE OTHER CLASS.** Vall is not a child
# of Laythe, so a Laythe-rooted recording targeting Vall is CROSS-PARENT:
# `MissionConfig loop=true` should reach `ApplyReaim` rather than the phase-lock
# solver, and `ReaimWindowPlanner.Plan` should space its windows on the JOOL-FRAME
# synodic of the two moons.
#
# `docs/dev/research/same-parent-reaim-jool-system.md` section 5.1 walks
# `TrySynthesizeTransfer` guard by guard for exactly this shape and concludes that
# the synthesizer "already works in a Jool-centric frame for P3 today,
# unmodified", and calls that "the single most surprising finding in this
# investigation: Parsek may already be re-aiming moon-to-moon hops. It is
# untested, unmeasured, and unrepresented in any harness lane."
#
# **THIS SPEC ASSERTS NOTHING ABOUT THAT.** B26's job is to fly the hop and commit
# the recording. `V17M-laythe-vall-player-loop` and `V17T-laythe-vall-ts-arrival`
# are the lanes that read the routing, they carry BOTH hypotheses and the log
# lines that discriminate, and they gate on neither. Nothing below requires,
# forbids or predicts a re-aim outcome.
#
# PHASE-0 DOOR: existing fixture, NO FORGE FLIGHT -- via a PARSEK-STRIPPED DERIVED
# COPY, `laythe-park-nerv`, the FOURTH of its kind after `duna-park-probe` (B23),
# `eve-park-kerbalx` (B24) and `jool-park-nerv` (B25). See [fixture].
