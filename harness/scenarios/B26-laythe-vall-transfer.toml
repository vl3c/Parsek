# =====================================================================================
# THE MODE, AS BUILT. Two stages, one flag, and NO new burn machinery -- the whole
# point of the shape is that the escape reuses the executor, the watchdogs and the
# coast the eight flown interplanetary lanes already proved.
#
#   STAGE 1, "ESCAPE" (a new flag-gated PLAN phase between ORBIT and
#   TRANSFER-BURN). mlib computes ONE PROGRADE node itself, at the park's NEXT
#   PERIAPSIS, sized so the departure carries `escapeSoiSpeedMps` of relative
#   speed ACROSS LAYTHE'S SOI BOUNDARY:
#       r  = R_Laythe + periapsis_altitude              (the EXACT burn radius)
#       a  = R_Laythe + (ap_alt + pe_alt) / 2
#       v  = sqrt(mu * (2/r - 1/a))                     (vis-viva, exact)
#       dv = sqrt(v_soi^2 + 2*mu*(1/r - 1/r_soi)) - v
#   The runner adds it through kRPC's OWN `Control.add_node(ut, prograde=dv)` --
#   core kRPC, no MechJeb planner involved, which is precisely why the refusal
#   above cannot recur -- and the SAME autowarping NodeExecutor flies it, with
#   the SAME burn-stagnation watchdog, and the coast out to Laythe's SOI is the
#   SAME COAST-TO-TARGET leg.
#
#   **THE `- 1/r_soi` TERM IS FLIGHT 2's DEFECT-A FIX AND IT IS THE WHOLE
#   DIFFERENCE.** The first cut sized `sqrt(v_inf^2 + 2*mu/r)`, i.e. for an
#   asymptotic excess AT INFINITY. KSP is a PATCHED-CONIC game: it hands a
#   departing vessel to the parent AT THE SOI BOUNDARY, where the home well has
#   not been fully climbed, so what actually crossed was
#   `sqrt(v_inf^2 + 2*mu/r_soi)` = **1,083.69 m/s against 347.245 of intent,
#   3.12x**, and the energy error goes as the square. See the FLIGHT LEDGER.
#
#   ITS BURN-DONE EVIDENCE IS **NOT** `ejectionEccFloor`, and that follows from
#   the same fix: reaching a SOI does not require ESCAPING, only an apoapsis at
#   or past it, so the correctly-sized escape here is BOUND (ecc 0.7586).
#   `_relay_escape_burn_done` reads "already left home, OR hyperbolic, OR the
#   home-frame apoapsis RADIUS reaches the SOI" -- see that key.
#
#   PERIAPSIS PLACEMENT IS NOT INCIDENTAL. It is the one point whose radius the
#   telemetry states exactly, so the burn is sized against the radius it is
#   applied at -- which removes, rather than tolerates, the ~37 m/s sma-vs-radius
#   sizing error this spec's `startInOrbitMaxEccentricity` note quantified for
#   MechJeb's planner. It is also Oberth-optimal, and its clock
#   (`time_to_periapsis`) is already a read channel on every capture lane.
#
#   STAGE 2 IS NOT A PHASE. On the first coast frame whose SOI body reads JOOL,
#   the machine re-enters PLAN-TRANSFER at `relay_stage 1`, where the plan action
#   is MechJeb's MOON-path `OperationTransfer` -- the same targeted-intercept
#   Hohmann B5/B6/B23/B24/B25 fly -- and TRANSFER-BURN's burn-done evidence is the
#   PARENT-FRAME apoapsis floor (`transferMinApoapsisMeters`, real on this lane
#   for the first time). Everything after it is the untouched machine.
#
# **THE ESCAPE IS NOT AIMED, AND THAT IS THE v1 LIMITATION.** A prograde burn at
# whatever periapsis comes next sends the outgoing asymptote in a direction set by
# the park's own orientation, not by where Vall is. Aiming it would need the
# vessel's and Laythe's state VECTORS in Jool's frame plus an asymptote solve --
# a new multi-channel telemetry surface and an ephemeris solver, which was the
# explicit stop rule for v1. THE COST IS PRICED, NOT HAND-WAVED, in the delta-v
# section below: stage 2 re-plans from wherever the escape left us, and the whole
# band is affordable. THE COST IS ALSO NOT ONLY dv -- see the forbidden-token
# derivation, where the unaligned escape is what puts Tylo's shell back in reach.
#
# =====================================================================================
# THE JOOL-FRAME AUDIT. Read this before changing any transfer key; it is the only
# part of this spec that is about the MACHINE rather than about Vall.
#
# **THE AUDIT PREDATES THE RELAY AND IS KEPT AS IT WAS**: every one of its seven
# findings is still true, and finding (3) is now the reason the relay could be
# built at all -- with the phase angle entirely MechJeb's on the ordinary path,
# swapping WHICH MechJeb operation plans stage 2 changes no frame-dependent
# quantity anywhere else. Three of them move under the relay and each is noted at
# its own key below: (3)'s plan action becomes `OperationTransfer` at stage 2,
# (4)'s `ejectionEccFloor` is RETIRED on this lane (flight 2 proved a correct
# patched-conic escape from Laythe is BOUND, so a hyperbolic gate would force a
# 165 m/s larger burn), and `transferMinApoapsisMeters` stops being inert because
# it is stage 2's evidence.
#
# This lane composes two live-proven blocks that have never met: the
# INTERPLANETARY transfer path (B7/B15/B16/B17/B19/B20/B21/B22 - always from
# KERBIN with the SUN as the transfer frame) and the ORBIT-START entry door
# (B23/B24/B25 - always on the MOON path). Jool plays the structural role the Sun
# plays on every flown interplanetary lane. Both `mlib.py` and `mission_runner.py`
# were swept end to end before this spec was written.
#
# **VERDICT: CLEAN, VALUES ONLY.** Nothing in either file was touched. The
# findings, each stated so it is checkable rather than asserted:
#
#   (1) THERE IS NO SUN-FRAME ASSUMPTION ON THE b5 INTERPLANETARY PATH. Every
#       frame-dependent quantity is derived from params (`home_body`,
#       `target_body`, `via_bodies`, `return_body`) or read live from the game
#       (`orbit.body.name`; the runner's one parent lookup is
#       `parent_name = str(target.orbit.body.name)`, which for Vall reads "Jool").
#       Nothing does `vessel.orbit.body.orbit.body` and nothing names a frame.
#   (2) THE HELIOCENTRIC EPHEMERIS IS REAL SUN-HARDCODING AND IS QUARANTINED.
#       `STOCK_HELIO_ELEMENTS` carries only Kerbin/Duna/Eve and `_helio_elements`
#       RAISES on an unknown body - but its whole family
#       (`interplanetary_phase_angle_deg`, `classical_hohmann_phase_angle_deg`,
#       `next_ejection_window_ut`) has exactly THREE live call sites and all three
#       sit inside `if params.pad_align_ejection:`, plus a flag-gated load-time
#       check in `b5_params_from_dict`. With the flag absent, "Laythe" and "Vall"
#       never touch that table. **`padAlignEjection` MUST STAY ABSENT** - it is
#       structurally unreachable anyway (PRELAUNCH checks `start_in_orbit` FIRST
#       and returns unconditionally), and arming it would `ValueError` at spec
#       load. A loud failure, but not one worth provoking.
#   (3) THE PHASE ANGLE IS ENTIRELY MECHJEB'S. `_b5_transfer_plan_action` emits
#       `ACTION_MJ_PLAN_INTERPLANETARY_TRANSFER` with no body and no angle; the
#       runner's handler writes exactly ONE property
#       (`op.wait_for_phase_angle = not (action.value == 0.0)`, which with
#       `padAlignEjection` off means TRUE, the live-proven window-wait path) and
#       calls `make_nodes()`. mlib contributes no angle, no synodic and no window
#       UT on this path.
#   (4) [SUPERSEDED BY FLIGHT 2 - the relay no longer reads this gate at all;
#       kept because the FRAME statement is still true and is what makes
#       `_relay_escape_burn_done`'s apoapsis reading correct in the same frame.]
#       `ejectionEccFloor` READS THE RIGHT FRAME. `_b5_transfer_burn_done`'s ecc
#       branch is gated on `snapshot.body == params.home_body` -> "Laythe", and
#       `snapshot.eccentricity` is always parent-relative, so a Laythe escape
#       drives a LAYTHE-frame hyperbolic reading. The early return
#       (`snapshot.body in via_bodies`) fires correctly once the craft is in
#       Jool's SOI - structurally identical to B7's `body == "Sun" in ("Sun",)`.
#   (5) THE CORRECTION DOMAIN IS EXACT. `_b5_correction_via_bodies` returns
#       `(return_body,)` = `("Jool",)` when interplanetary, and its documented
#       precondition (`return_body` must be a member of `via_bodies`) holds as an
#       identity here: `"Jool" in ("Jool",)`. The narrowing can neither add nor
#       remove a firing opportunity. Its pinning cell in `test_shells.py` is
#       roster-scoped to B7/B15/B16, so a new lane cannot red it - and this lane's
#       params would satisfy it anyway.
#   (6) THE WARP TABLE ALREADY CARRIES ALL THREE BODIES.
#       `mlib.STOCK_WARP_ALTITUDE_LIMITS` has rows for "Jool", "Laythe" AND
#       "Vall", so the factor-clamp is data-complete. (A MISSING key would fail
#       OPEN to factor 7 with the server clamp as backstop, never crash - moot
#       here, but worth knowing.)
#   (7) `startInOrbit` COMPOSES WITH `interplanetaryTransfer` WITH NO COUPLING.
#       PRELAUNCH checks `start_in_orbit` first and returns unconditionally, so
#       PAD-ALIGN and the ascent kickoff are unreachable; the orbit-start step
#       enters the ORBIT waypoint, which hands to the SINGLE shared
#       `_b5_enter_plan_transfer` seam that reads `interplanetary_transfer`.
#       Nothing reads ascent state on this path: `mj_ascent_complete` is read only
#       inside the MJ-ASCENT branch, `peak_apoapsis` is carried but never read in
#       a gate, the `launch_ut` stamp's only readers are pad-align-only rows, and
#       orbit-start emits no actions at all on entry. `b5_params_from_dict` does
#       not reject the pair.
#
# THREE VALUE-LEVEL CONSEQUENCES THE AUDIT NAMED, all handled at their own keys
# below and listed here so none is discovered on a flight:
#   * `correctionTriggerTimeToSoiSeconds` MUST be re-sized. B7's [20,000,000;
#     500,000] against a 38,980 s leg would fire BOTH rounds on the first
#     Jool-SOI frame - the B15-flight-5 failure SHAPE reached by a different
#     route. See that key.
#   * [SUPERSEDED BY FLIGHT 2: the key is retired on this lane, at 0. The note is
#     kept because it is the reason nobody should re-arm it by analogy.]
#     `ejectionEccFloor` MUST be re-calibrated. B7's 1.05 would NEVER BE REACHED
#     here: the required Laythe ejection hyperbola has ecc 1.0352. See that key -
#     this is the single most flight-costing value in the file.
#   * `ARRIVAL_RECORRECT_MIN/MAX_TTS_SECONDS` (600 / 3,600) are hardcoded module
#     constants sized against Duna's arrival leverage, NOT spec-overridable. They
#     may open the extra-round window at an unhelpful moment for a Vall approach.
#     Every term fails closed and `MAX_ARRIVAL_EXTRA_ROUNDS = 2` bounds it, so the
#     worst case is extras that buy little. Watch it on flight 1; do not pre-tune.
#
# **THE ONE THING THE AUDIT COULD NOT ANSWER** was whether MechJeb 2.15.1's own
# `OperationInterplanetaryTransfer` accepts a JOOL-PARENTED pair. It was named as
# the likeliest way flight 1 would fail, and it is exactly how flight 1 failed -
# though not for the reason guessed: the refusal is about the MOON-PARKED ORIGIN,
# not the parentage. **THE RELAY REMOVES THE QUESTION RATHER THAN ANSWERING IT**:
# `OperationInterplanetaryTransfer` is no longer called on this lane at all.
# Stage 1 is a node this repo computes and kRPC's own `add_node` places; stage 2
# is `OperationTransfer`, planned from Jool's frame between two bodies that both
# orbit Jool, which is the shape B5/B6/B23/B24/B25 have flown between them a
# dozen times. What replaces the open question is a NEW one, and it is stated at
# its own key: whether `OperationTransfer` plans a sane targeted intercept from
# the ECCENTRIC, slightly-inclined Jool orbit an unaimed escape delivers.
#
# =====================================================================================
# THE DELTA-V, DERIVED END TO END from the fixture's own bytes and the stock
# constants. Nothing is scaled from another lane.
#
# WHAT THE CRAFT HAS, read off `laythe-park-nerv/persistent.sfs` (unchanged by the
# strip) - the SAME vehicle B25 flew, minus what B25 burned:
#   structural 6.780 t (identical part list to B25: mk1pod.v2, HeatShield1,
#     Decoupler.1, 6x MK1Fuselage, nuclearEngine, 4x radialDecoupler, 8x noseCone,
#     8x strutConnector, 4x fuelLine, 2x solarPanels2, 2x radialDrogue, commDish,
#     parachuteSingle)
#   + Ablator 200/200 x 0.001 = 0.200 t  <- UNCHANGED from B25's start, i.e. the
#     capture produced NO entry heating, which is the expected reading for a
#     vacuum capture and is checked rather than assumed
#   + MonoPropellant 10 x 0.004 = 0.040 t + ElectricCharge 49.99983 x 0 = 0
#   + 1 crew ~0.16 (Valentina, kerbal 0.09375 + stock inventory)
#   => DRY / BURNOUT 7.180 t, identical to B25's
#   PROPELLANT: LiquidFuel **534.869** / 2400 at 0.005 t/unit = **2.674 t**
#     (B25 started with 945.082 and spent 410.213)
#   => WET 9.854 t
#   nuclearEngine (NERV): Isp 800 s vac, 60 kN, 3.0 t
#   => dv = 800 * 9.80665 * ln(9.854 / 7.180) = **2,483.9 m/s**
#
# WHAT THE HOP COSTS. Stock constants: mu_Jool 2.82528e14, a_Laythe 27,184,000,
# a_Vall 43,152,000, mu_Laythe 1.962e12, R_Laythe 500,000, mu_Vall 2.074e11,
# R_Vall 300,000, SOI_Vall 2,406,401.4. Vall has NO ATMOSPHERE and terrain to
# ~8 km.
#
#   THE TRANSFER, in JOOL's frame: a_t = 35,168,000, ecc_t = 0.22702
#     v_Laythe 3,223.84   v at transfer periapsis 3,571.08  => v_inf DEPART 347.24
#     v_Vall   2,558.80   v at transfer apoapsis  2,249.68  => v_inf ARRIVE 309.12
#     TOF = pi*sqrt(a_t^3/mu) = **38,979.9 game s** (0.74 Laythe periods)
#   STAGE 1, THE ESCAPE. **RE-DERIVED AFTER FLIGHT 2 MEASURED THE FIRST CUT
#     WRONG**, and the correction is one term. What KSP hands to the parent is
#     the relative speed AT THE SOI BOUNDARY, not the asymptotic excess at
#     infinity, so the node is sized against `r_soi` as well as `r_pe`:
#       r_pe  = 500,000 + 56,240.3 = 556,240.3 m
#       r_soi = 3,723,645.81 m (Laythe)
#       v at periapsis (vis-viva, a = 572,085.804)              1,903.93
#       v needed = sqrt(450^2 + 2*mu*(1/r_pe - 1/r_soi))        2,490.62
#       => ESCAPE NODE **586.69 m/s**, Laythe orbit ecc **0.7586**,
#          apoapsis radius 4,053,149 m = 8.85% past the SOI
#     WHAT THE FIRST CUT DID: it asked for v_inf 347.245 at INFINITY, sized
#     774.70 m/s, and delivered sqrt(347.245^2 + 2*mu/r_soi) = **1,083.69 m/s**
#     across the boundary - 3.12x - because 3.72 Mm out Laythe's well is still
#     deep. The fix is 188.0 m/s CHEAPER as well as correct.
#     THE FLOOR THIS RUNS AGAINST: a prograde burn at this periapsis cannot
#     reach the SOI with LESS than **370.08 m/s** of relative speed, so 450 is
#     the practical minimum plus 21.6%; `escape_node_plan` refuses anything
#     under the floor by name rather than clamping. `escapeMaxDeltaVMps` is 700,
#     19.3% over this node and 13.6% over the entry gate's worst corner.
#     The escape's in-SOI coast, periapsis -> Laythe SOI, is **5,181 game s**
#     (1.44 h) by elliptic Kepler - longer than the hyperbola's 2,783 s, which
#     is the price of not over-burning and is paid on rails.
#
#   STAGE 2, THE SIBLING TRANSFER, AND THE PRICE OF NOT AIMING THE ESCAPE. The
#     escape crosses the boundary with |v_rel| = 450 in a direction the park
#     sets, so the parent-frame velocity there is `v_Laythe + v_rel_vec`. The dv
#     a single burn needs to turn that into the IDEAL departure velocity is
#     |v_rel_vec - prograde*v_inf|, bounded by 2*|v_rel| whatever the direction.
#     So, in Jool's frame:
#       BEST     v_rel already prograde: only the 450 - 347.245 magnitude
#                excess has to come back off                         102.8
#       TYPICAL  mean over an isotropic asymptote, (4/3)*|v_rel|      600.0
#       WORST    v_rel exactly retrograde: undo and redo it          900.0
#     THE PLANE TERM IS INSIDE THAT BOUND, not additional to it: the park's
#     16.372 deg inclination can put at most 450*sin(16.372) = **126.8 m/s** of
#     v_rel out of Jool's plane, and that component is one part of the same
#     vector difference. This is why the relay's worst case is comparable to the
#     old plan's folded 1,010.4 ejection bound even though it aims nothing: the
#     plane change is paid once, in the parent frame, at 3.2 km/s rather than at
#     the park.
#     THE DELIVERED ORBIT BAND, swept over every v_rel direction and every exit
#     point on the SOI shell: **a = 17.2 - 59.0 Mm, max apoapsis 87.18 Mm, min
#     periapsis 11.01 Mm, and ZERO samples that escape Jool.** The pre-fix
#     contract's band was a = 14.5 - 8,683 Mm with a 17,335 Mm apoapsis, 17
#     JOOL-ESCAPING samples and a minimum periapsis of 5.51 Mm - BELOW Jool's
#     6.20 Mm atmosphere top. The fix does not merely save dv; it removes two
#     lane-ending outcomes that the flown contract admitted.
#     **THE BOUND IS ON WHAT IS ACHIEVABLE, NOT ON WHAT MECHJEB WILL PLAN.**
#     `OperationTransfer` picks its own burn; it may find cheaper (a burn at the
#     resulting orbit's own periapsis usually is) or it may price a phasing
#     transfer above 900. There is no dv cap on a transfer plan on ANY lane -
#     the moon path has never had one - so this is a NAMED watch item, not a
#     guarded quantity. Read the stage-2 node dv in the log against the
#     103 / 600 / 900 band before touching anything.
#   THE CAPTURE at Vall, `sqrt(v_inf^2 + 2*mu/r_p) - sqrt(mu/r_p)`:
#     pe alt  20 km -> 374.7     pe alt 100 km -> 344.1
#     pe alt  30 km -> 370.2     pe alt 300 km -> 299.1
#     pe alt  60 km -> 358.0     pe alt 600 km -> 265.9
#
# THE VERDICT:
#   available            2,483.9 m/s
#   NOMINAL hop          1,530.8 m/s  (586.7 escape + 600.0 typical stage 2 +
#                                      344.1 capture at a ~100 km delivered
#                                      periapsis)          => margin 953.1
#   WORST hop            1,861.4 m/s  (586.7 escape + 900.0 worst-direction
#                                      stage 2 + 374.7 capture at the 20 km park
#                                      floor, the most expensive capture the
#                                      window admits)      => MARGIN **622.5 m/s**
#   i.e. 33% over the WORST hop and 25.1% of the tank. Checked by mass rather
#   than by subtraction: 1,861.4 m/s off a 9.854 t wet stack leaves 7.774 t
#   against a 7.180 t burnout, i.e. 0.594 t of LiquidFuel = 622.3 m/s. The two
#   agree to 0.2 m/s.
#
# NOTE THE FIX BARELY MOVED THE MARGIN (640.0 -> 622.5) EVEN THOUGH IT SAVED
# 188 m/s ON THE ESCAPE, and the reason is worth stating rather than hiding: the
# stage-2 bound is 2*|v_rel| and |v_rel| went UP, from the 347.245 the old
# contract believed it was delivering to the 450 the new one actually delivers.
# The old margin was never real - it was computed against a departure excess the
# flight did not have.
#
# THAT MARGIN IS WHY `maxCorrectionDvMps` DROPPED FROM 150 TO 100, and the
# arithmetic is the whole argument: up to FOUR rounds can fire (the two this
# spec schedules plus mlib's two `MAX_ARRIVAL_EXTRA_ROUNDS` arrival-quality
# extras), so at 150 the worst correction spend is 600 against 622.5 of margin -
# 22 m/s left, which is not a margin. At 100 it is 400, leaving 222.5 m/s. See
# that key for the B20 counter-argument and for what to do if flight 3 shows a
# correction discarded at the cap.
#
# =====================================================================================
# THE ORBITS, AND ONE PLEASING FACT.
#   P_Laythe  =  52,980.879 game s
#   P_Vall    = 105,962.090 game s
#   SYNODIC   = 1/|1/P_L - 1/P_V| = **105,961.428 game s = 2.0000 P_Laythe**
#
# THE SYNODIC IS ESSENTIALLY ONE VALL PERIOD, and that is the 1:2:4 LAYTHE-VALL-
# TYLO RESONANCE showing up in the transfer window rather than in a scheduler.
# `P_Vall - 2*P_Laythe = +0.3 s` (research doc section 3.2), so the two bodies
# return to the same relative geometry once per Vall orbit almost exactly. The
# window wait is therefore at most ~29.4 hours of game time and RECURS ON A CLEAN
# CADENCE - which is also why this pair is the right FIRST moon-to-moon subject
# rather than, say, Vall->Bop (synodic 131,565 s, incommensurate).
#
# =====================================================================================
# THE APPROACH REGIME AT VALL IS **GRAVITY-LEANING**, the fourth distinct answer
# in four lanes, and the sizing floor follows from it:
#   2 * mu_Vall / r_soi = 2 * 2.074e11 / 2,406,401.4 = 1.7238e5 m^2/s^2
#   v_inf^2             = 309.12^2                   = 9.5556e4
#   ratio                                            = **0.554**
#   (Ike 0.24 gravity-dominated, Laythe 1.445 mixed, Gilly 11,600 negligible)
# So the approach hyperbola is solved properly (B23's method), a = -mu/v_inf^2 =
# -2,170,300 m:
#   pe alt  20 km  e = 1.1474   SOI-entry -> periapsis **3,871.8 game s** <- FLOOR
#   pe alt  30 km  e = 1.1520                          3,884.3
#   pe alt  60 km  e = 1.1659                          3,920.7
#   pe alt 100 km  e = 1.1843                          3,966.5
#   pe alt 300 km  e = 1.2764                          4,149.2
#   pe alt 600 km  e = 1.4147                          4,281.6
# SIZE AGAINST 3,860 GAME SECONDS - taken at the 20 km PARK floor rather than at
# the 30 km arrival floor, which is the conservative reading.
#
# THE THREE-RULE WARP CONTRACT (B21's header):
#   RULE 3 -> approachMaxWarpFactor 3 (x50). Budget = 3,860/5 = 772 game s/frame.
#       factor 5 = x1,000 FAILS; factor 4 = x100 passes at 7.8x margin; factor 3 =
#       x50 PASSES at 15.5x. **x100 IS REJECTED FOR A SECOND, HARDER REASON THAN
#       MARGIN**: `STOCK_WARP_ALTITUDE_LIMITS["Vall"]` puts factor 4's floor at
#       40,000 m, ABOVE this lane's 30,000 m arrival floor, so a commanded x100
#       would be clamped down anyway on the last stretch. Factor 3's floor is
#       24,500 m and is legal all the way to the floor. Price: the clamped stretch
#       is approachWindowSeconds/50 = 200 wall s.
#   RULE 1 -> coastWarpFactor 5 (x1,000), soiLeadSeconds 3,000 (6x one nominal
#     0.5 s poll at that rate). The whole 38,980 s coast at the rails cap costs
#     just 39 wall s, so unlike every interplanetary sibling there is no reason to
#     reach for x10,000: this leg is three orders of magnitude shorter than B7's.
#   RULE 2 -> approachWindowSeconds 10,000: 3.3x the lead, and >= 2x one
#     PESSIMISTIC 4 s coast frame at x1,000 (4,000 game s), which is the binding
#     form.
#   IN-SOI PAIR: flybyWarpFactor 2 (x10) / flybyMaxWarpFactor 3 (x50), both at or
#     under the approach ceiling; x10's altitude floor is 24,500 m, legal down to
#     the arrival floor.
#
