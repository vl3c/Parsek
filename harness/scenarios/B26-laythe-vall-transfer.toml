# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams]
# header. The scene-entry preamble is the B23/B24/B25 shape verbatim; read B25's
# header for why the StopRecording/DiscardTree pair is not a latch and why the
# FIXTURE is what actually closes the committed-restore window.
#
# ONE commit, MID-MISSION (ORBIT-COMMIT), and NO post-mission CommitTree.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },   expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                     expect = "OK" },
  { cmd = "DiscardTree",                                                       expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "StartRecording",                                                    expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 5400 },
  { cmd = "FlushAndQuit",                                                      expect = "OK" },
]

# Every value below is a tolerance / threshold / budget, never a golden
# trajectory (validated against b26_laythe_vall.schema.toml). Phase budgets are
# GAME seconds unless a comment says otherwise.
[driver.missionParams]
# --- ORBIT-START: the entry door and its gate --------------------------------
# The four ASCENT keys and the two ascent budgets are DELIBERATELY ABSENT (the
# schema demotes all six to optional for this lane): PRELAUNCH hands straight to
# the ORBIT waypoint and no ascent is ever flown.
startInOrbit                    = true
# THE GATE, stated against the fixture's MEASURED Laythe park (periapsis alt
# 56,240.3 m, apoapsis alt 87,931.3 m, ecc 0.0277):
#   periapsis floor 52,000 m - the SAME line B25's park floor settled on, and for
#     the same reason: Laythe's atmosphere tops out at 50,000 m, so 52,000 is
#     2,000 m of clearance, and it sits 4,240 m below the measured periapsis. A
#     start park that had somehow decayed toward the air is refused before a
#     transfer is planned against a drag-perturbed orbit.
#   apoapsis ceiling 500,000 m - 5.7x the measured ~87.9 km, and 1,000,000 m of
#     RADIUS = 26.9% of Laythe's 3,723,646 m SOI radius, so a park that had
#     drifted out toward the shell (where the ejection geometry stops being a
#     clean two-body escape) is refused. A STRICTLY POSITIVE apoapsis is required
#     regardless (a hyperbolic reading is negative), which is the actual
#     still-bound evidence.
#   eccentricity ceiling 0.10 - and this one is WIDER than B23/B24/B25's 0.05, on
#     purpose. Those lanes started from parks that a CIRCULARIZE had rounded out;
#     THIS park is the delivered product of a finite capture burn and reads 0.0277,
#     which 0.05 would admit at only 1.8x. 0.10 gives 3.6x.
#     **AND THE CONJUNCT MATTERS MORE HERE THAN ON ANY PRIOR LANE, because this is
#     the interplanetary path.** MechJeb's ejection planner sizes the required
#     post-burn speed at the parking orbit's SEMI-MAJOR AXIS and applies it at
#     whatever radius its geometry picks (the decompiled note on
#     `mlib.park_trim_verdict`); on a circular park r == sma and the sizing is
#     exact, on an eccentric one it is not. Quantified for THIS park: r ranges
#     556,243-587,929 against sma 572,086, so the `2*mu*(1/sma - 1/r)` term is at
#     most 1.95e5 m^2/s^2 against v_eject^2 = 6.98e6 - **2.8% in energy, ~1.4% in
#     speed, i.e. ~37 m/s**. Real, small against the 1,115 m/s margin, and NOT
#     fixable from this lane: `parkTrimEccMax`'s round-out step is reachable only
#     from `B5_CIRCULARIZE`, which `startInOrbit` never enters (B25 established
#     that). Recorded as a named first-flight risk rather than mitigated.
startInOrbitMinPeriapsisMeters  = 52000
startInOrbitMaxApoapsisMeters   = 500000
startInOrbitMaxEccentricity     = 0.10
startInOrbitSituations          = ["ORBITING"]
startInOrbitDebounceFrames      = 3
startInOrbitSettleSeconds       = 120

# --- Transfer: the INTERPLANETARY path, one level down -----------------------
homeBodyName               = "Laythe"
targetBodyName             = "Vall"
interplanetaryTransfer     = true
# THE TRANSFER FRAME, replacing "Sun" on every prior interplanetary lane. It is
# read in three places and each matters here: the TARGET-FLYBY multi-hop assert's
# accepted body set ({Vall, Jool} and nothing else), the RETURN terminal, and
# `_b5_correction_via_bodies`, which narrows the correction domain to exactly
# `("Jool",)`.
returnBodyName             = "Jool"
# The SOI the coast legitimately operates in. `_b5_coast_bodies` is
# `("", home) + via` = `("", "Laythe", "Jool")`, so a stray Tylo / Bop / Pol SOI
# entry is an immediate ASSERT-FAIL - which is the behaviour to keep. It must
# contain `returnBodyName` for `_b5_correction_via_bodies`' documented subset
# precondition to hold; here the two are the same body, so the narrowing is an
# identity.
viaBodyNames               = ["Jool"]
# INERT under `ejectionEccFloor` (the schema requires the key; B15's disposition
# is to keep it present at 0).
transferMinApoapsisMeters  = 0
# THE BURN-DONE EVIDENCE, and **THE SINGLE MOST FLIGHT-COSTING VALUE IN THIS
# FILE**. `_b5_transfer_burn_done` reads the LAYTHE-frame eccentricity while the
# craft is still in Laythe's SOI; a bound park reads 0.0277 and a completed
# ejection reads hyperbolic.
#
# **B7's 1.05 WOULD NEVER BE REACHED.** The required ejection is
# `v_inf = 347.24 m/s` from a 572,086 m park radius, whose hyperbola has
#     e = 1 + r_p*v_inf^2/mu = 1 + 572,086*120,575/1.962e12 = **1.0352**
# i.e. only just hyperbolic, because Laythe's gravity well is shallow and the
# moon-to-moon v_inf is small. A 1.05 floor would sit ABOVE the correct answer and
# the phase would ride to its budget on a perfectly good ejection, ending in the
# NAMED under-burn give-up (`ejection eccentricity floor 1.0500 not reached`) -
# which reads exactly like a real defect.
#
# 1.001 is B15/B16/B20's value and is chosen for their reason: comfortably above
# 1, below any physically-plausible reading noise, and 34x clear of the 1.0352 the
# real ejection produces while 36x clear of the 0.0277 the park reads. DO NOT
# RAISE IT toward 1.05 by analogy with B7/B17/B19/B21/B22 - those are KERBIN
# escapes at 10x the v_inf.
ejectionEccFloor           = 1.001
# Requested Vall periapsis ALTITUDE for the course corrections.
#
# THE CORPUS (docs/dev/todo-and-known-bugs.md ->
# FINDING-16D-MISCITED-DIRECTION-AND-DENOMINATOR) sorts k = delivered/requested by
# `req/SOI` and shows the bias inverting above ~4%. Against Vall's 2,406,401.4 m
# SOI, 250,000 m is **10.39%** - essentially the Mun row (10.29%, k = 0.545-0.563).
#
# AND IT IS SIZED AGAINST B25's OWN MEASUREMENT rather than against the corpus
# alone, which is what picks 250 km over the 150 km a 6% req/SOI would have given.
# B25 measured k = **0.283-0.289** at req/SOI 6.71% - BELOW even the Mun row, and
# it refuted that spec's pre-flight assumption of k ~ 1. Applying the same ratio
# band here:
#   k 0.29 -> 72.5 km delivered      k 0.55 -> 137.5 km delivered
# both comfortably above the 30,000 m assertion floor and inside the park window.
# A 150 km request at k 0.29 would deliver 43.5 km, only 1.45x the floor - too
# close for a first flight at a body nobody has aimed at.
#   3x SHORT of the low end -> ~24 km: BELOW the 30 km floor, so a 3x-short draw
#     ASSERT-FAILs rather than crashing (Vall's terrain reaches ~8 km, so even
#     that is 3x clear of the ground). Survivable and correctly named.
#   3x LONG of the high end -> ~412 km = 712 km radius = 29.6% of the SOI radius.
#     Still an encounter, still inside the park window below.
courseCorrectPeriapsisMeters = 250000
# TIME-TO-SOI mode, and **RE-SIZED FOR A 38,980 s LEG - the audit's item (1)**.
# B7's list is [20,000,000; 500,000], sized against a heliocentric coast of ~2e7
# game s. On this leg `time_to_soi` is BELOW 20,000,000 on the very first
# Jool-SOI frame, so both rounds would fire back to back at the start of the coast
# with nothing left for mid-course - the B15-flight-5 failure SHAPE reached by a
# different route (not a wrong body domain, but a threshold list an order of
# magnitude too coarse).
#   35,000  round 0, which fires shortly after Jool-SOI entry (the leg is 38,980 s
#           at the Hohmann geometry, so tts is ~39,000 at the handover): fix the
#           ejection error while there is still coast to fix it in.
#   8,000   round 1, ~2.2 h before arrival. Chosen to sit ABOVE both the ~3,900 s
#           SOI-entry -> periapsis coast and the hardcoded
#           `ARRIVAL_RECORRECT_MAX_TTS_SECONDS = 3,600`, so the scheduled round
#           and the arrival-quality extras cannot collide.
# The ALTITUDE list stays empty: a non-empty time list SELECTS time mode and
# supersedes it.
correctionTriggerTimeToSoiSeconds = [35000, 8000]
correctionTriggerAltsMeters       = []
planTimeoutSeconds         = 300
planRetrySeconds           = 10
planWarpFactor             = 2
# TRANSFER-BURN budget (GAME s). The NodeExecutor autowarps to the ejection node,
# which on this geometry is at most one synodic (105,961.4 s = 2.0000 Laythe
# periods) ahead. 600,000 is ~5.7 synodics - a SLOW bound; the stagnation /
# no-start / under-burn watchdogs bound BROKEN.
transferBurnTimeoutSeconds = 600000
# COAST-TO-TARGET budget (GAME s) against a 38,979.9 s Hohmann leg. 600,000 is
# ~15x it, sized to cover a missed first intercept plus the synodic wait for the
# next window (105,961 + 38,980 = 144,941 per attempt, so this admits ~4).
coastTimeoutSeconds        = 600000
# TARGET-FLYBY budget (GAME s) against the 3,886-4,149 s SOI-entry -> periapsis
# coast: ~14x the longest.
flybyTimeoutSeconds        = 60000
# THE WARP BLOCK - full three-rule derivation in the header. In one line: the
# approach clamp is x50 both because a pessimistic frame at x100 would be 10% of
# the 3,886 s coast AND because Vall's own altitude table makes x100 illegal below
# 40 km anyway; the coast rate stays at x1,000 because the whole leg costs 39 wall
# s there and this is not an interplanetary-scale coast.
coastWarpFactor            = 5
soiLeadSeconds             = 3000
approachWindowSeconds      = 10000
approachMaxWarpFactor      = 3
flybyWarpFactor            = 2
flybyMaxWarpFactor         = 3
nodeArrivalMarginSeconds   = 15
flipPhysicsWarpFactor      = 1
# Min-altitude floor across the WHOLE in-SOI stay. Vall has NO ATMOSPHERE and its
# terrain reaches ~8,000 m; 30,000 clears it by 3.75x. Its job is to catch a
# trajectory heading INTO THE GROUND, not to certify the park (B23's rule, and
# B25's flight 1 is the standing demonstration of what happens when a floor is
# written near the hoped-for park).
#
# AND IT IS DELIBERATELY **NOT** EQUAL TO `parkMinPeriapsisMeters` - the
# B19/B20/B21/B22/B24 convention stays broken in the direction B25 established.
# B25 measured a systematic finite-burn wedge between the arrival periapsis and
# the delivered park periapsis (15.4 km on a 163.5 s capture burn at 5.40 m/s^2).
# THE WEDGE HERE SHOULD BE MUCH SMALLER - the Vall capture is ~344 m/s on a
# ~8.665 t stack, i.e. a **~49 s** burn against a ~3,490 s park period (1.4% of an
# orbit, against B25's 8%) - but "much smaller" is a prediction, not a
# measurement, so the park floor sits 10 km below this one rather than equal to
# it. If flight 1 measures the wedge, re-derive both from it.
targetPeriapsisFloorMeters = 30000

# --- Capture + Vall park + commit (the B11/B12 tail) -------------------------
captureEnabled             = true
capturePlanTimeoutSeconds  = 300
# CAPTURE-BURN budget (GAME s): the executor autowarps the SOI-entry -> periapsis
# coast (3,886-4,149 s) and MechJeb's own 1x pre-ignition WARPALIGN hold is ~600
# game s of it. 60,000 is ~13x that ~4,700 s total.
captureBurnTimeoutSeconds  = 60000
# THE CAPTURE WINDOW (also the PARK gate). Vall's SOI is 2,406,401.4 m from the
# CENTRE and its radius is 300,000 m, so the shell is 2,106,401.4 m of ALTITUDE.
#   parkMinPeriapsisMeters  20,000 m - 2.5x Vall's ~8 km terrain, and 10,000 m
#     below the arrival floor to absorb the (predicted small) finite-burn wedge
#     without redding a healthy park. B25's flight 1 is why this gap exists at all.
#   parkMaxApoapsisMeters   600,000 m - LOAD-BEARING TWICE. (1) A hyperbolic
#     (uncaptured) approach reads a NEGATIVE apoapsis in the Vall frame, so
#     "0 < ap <= 600,000" is the actually-captured evidence. (2) It must ADMIT the
#     corrected-arrival spread: a 3x-long draw off the high end of the k band
#     lands near 412 km, so a tighter ceiling would red a good flight. 600,000 m
#     altitude = 900,000 m radius = 37.4% of the SOI radius, durably inside.
#   parkMaxEccentricity     0.25     - B11's value.
parkMinPeriapsisMeters     = 20000
parkMaxApoapsisMeters      = 600000
parkMaxEccentricity        = 0.25
parkMaxAngularVelocityRadPerSec = 0.05
parkSituations             = ["ORBITING"]
parkDwellSeconds           = 180
parkDebounceFrames         = 3
parkTimeoutSeconds         = 600
commitTimeoutSeconds       = 300

# --- Shared machine housekeeping ---------------------------------------------
# SIZING NOTE: the NERV is 60 kN on a ~9.9 t stack falling to ~8.4 t, i.e.
# ~6.1-7.1 m/s^2. The ejection is ~1,010 m/s (~170 s) and the capture ~344 m/s
# (~49 s) - both comfortably inside the proven watchdog defaults, since
# `burnStagnantSeconds` only starts counting after the apsides STOP moving and
# `burnNoStartSeconds` only while the orbit is UNCHANGED.
burnStagnantSeconds        = 120
burnNoStartSeconds         = 600
correctionThrottle         = 0.25
correctionCutDvMps         = 2.0
correctionSettleSeconds    = 10
maxAttitudeErrorDeg        = 30
frozenTelemetrySamples     = 10
# dv cap (m/s) an acceptable course-correction plan must fit under.
#   THE B15 RULE: 150 is 5.3x below the 790 m/s coplanar ejection it corrects.
#   THE MARGIN RULE: up to FOUR rounds can fire (the two this spec schedules plus
#     mlib's two `MAX_ARRIVAL_EXTRA_ROUNDS` arrival-quality extras), so the worst
#     spend is 4 x 150 = 600 m/s against the header's 1,098.8 m/s of margin - 55%
#     of it, leaving ~499. Tighter than B25's 25%, and that is the inclined park
#     showing up in the correction budget as well as in the hop.
#   THE B20 LESSON pulls the other way (an under-sized cap DISCARDED the
#     encounter-creating correction and cost two INVALID attempts), which is why
#     this is 150 rather than B24's 50. If flight 1 shows a correction discarded
#     at this cap AND the encounter lost, the honest fix is to re-derive the plane
#     term rather than to raise the cap blind.
maxCorrectionDvMps         = 150

# CLAIM-IS-NOT-GATE.
#   D1 commit-in-foreign-soi   gated by the terminalOrbitBody=Vall commit token.
#   D14 laythe / vall          `laythe` by the `Laythe to Jool` escape token,
#       `vall` by `Jool to Vall` plus the commit terminal-body token.
#   D14 jool                   gated by BOTH SOI tokens naming it - this lane
#       spends its whole coast in Jool's SOI, which no prior lane's contract has
#       claimed.
#   D14 warp-rails             the machine cannot complete without it.
#   D14 scene-flight / sandbox the environment axes.
#
# NOT claimed, deliberately:
#   D1 auto-record-launch  - there is no launch.
#   D11 anything           - THE ROUTING IS NOT THIS LANE'S CLAIM. B26 produces
#       the subject; V17M/V17T read it and claim (or decline) the cells.
#   D14 tylo / bop / pol   - the coast crosses no other moon's SOI and the
#       forbidden tokens below assert it.
#   D14 warp-high, soi-count - nothing here gates either.
[dimensionsCovered]
D1  = ["commit-in-foreign-soi"]
D14 = ["laythe", "vall", "jool", "warp-rails", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC, over the PARSEK-STRIPPED fixture.
#   +0  the fixture. `laythe-park-nerv` has no `Parsek/` directory at all, so it
#       ships ZERO `.prec` and ZERO committed trees by construction. (The SOURCE
#       `laythe-orbit-recorded` ships ONE, and 1 is therefore NOT a useful
#       watch-for number here the way B25's 5 was - the tell for a failed strip on
#       this lane is the recording's LAUNCH BODY, which no expectation can express.)
#   +1  THIS lane's product: the stack flies the whole hop as one piece; there is
#       no staging event anywhere in the profile.
#   = 1 EXPECTED.
#   +1  HEADROOM, admitted rather than predicted, for ONE class: an optimizer
#       split. **AND THE PREDICTION IS GENUINELY LESS CONFIDENT HERE THAN ON ANY
#       PRIOR LANE**, which is why the range is kept rather than tightened. The
#       four earlier lanes each had exactly ONE body change on a same-class Exo
#       transfer coast, where section-3 rule 3 keeps the boundary COHESIVE, and
#       all four measured `exoCoastBodyChangeKept=1`. THIS recording has **TWO**
#       body changes (Laythe->Jool and Jool->Vall) and they are not the same
#       shape: the first is an ESCAPE under thrust, the second a rails arrival.
#       Rule 3's cohesion applies to a same-class Exo body change on a transfer
#       COAST; whether an ejection boundary qualifies is exactly what nobody has
#       measured. A count of 2 or 3 here is a READING, not a defect.
# => { min = 1, max = 3 }, a DERIVED RANGE and NOT A PIN - deliberately wider than
# every predecessor's {1,2}, because there are two boundaries rather than one.
#
# THE COUNT IS COMMIT-BLIND (the standing note): sidecars are written for the
# active uncommitted tree too, so this window guards recording TOPOLOGY only and
# is NOT evidence that the commit ran. The commit is guarded by the tokens below.
count = { min = 1, max = 3 }

[expectations.logContracts]
#   "Recording started" / "Recording stopped" - the standing lifecycle floor. It
#       proves a recording exists, NOT that this lane opened one (B23 flight 1
#       measured all five of its `Recording started` lines coming from the
#       committed-restore promotion path while the seam answered `already=true`).
#       What it does not cover is covered by the FIXTURE.
#   "SOI change boundary suppressed in tree mode: Laythe to Jool" - the ESCAPE.
#       This is the token that proves the ejection actually happened rather than
#       the craft sitting in its start park, and NO PRIOR LANE HAS ASSERTED A
#       MOON-TO-PARENT ESCAPE.
#   "SOI change boundary suppressed in tree mode: Jool to Vall" - the ARRIVAL.
#       Together the two are the only evidence that the coast really ran in Jool's
#       frame; a lane that somehow reached Vall without the first token would have
#       done something this spec does not describe.
#   "CommitTreeFlight: starting tree commit at UT=" - the commit path was entered.
#   "CommitTreeFlight terminal: rec=\\w+ terminalState=Orbiting
#       terminalOrbitBody=Vall" - the headline claim's only real evidence:
#       "starting tree commit at UT=" is logged unconditionally, so before this
#       token a tree that ended around LAYTHE or JOOL would produce byte-identical
#       evidence to one that ended around VALL.
#
# FORBIDDEN is the ERROR floor PLUS the SIX named-poison tokens for the three
# moons this transfer must not touch (Tylo, Bop, Pol), in both directions. The
# B17 pattern, and this lane's own reason: the coast climbs from Laythe's
# 27.184 Mm to Vall's 43.152 Mm, crossing no other moon's SHELL - Tylo is at
# 68.5 Mm, Bop at 128.5 and Pol at 179.89, all ABOVE the transfer apoapsis. So
# unlike B25 (which crossed four shells and could plausibly clip one) these three
# are geometrically excluded, and the tokens are a cheap assertion of that
# exclusion rather than a live hazard. Machine-side any of them is already an
# ASSERT-FAIL via `_b5_coast_bodies`.
#
# **NOTHING RE-AIM IS FORBIDDEN OR REQUIRED ANYWHERE IN THIS FILE**, and that is
# deliberate. B26 produces the subject; the routing question belongs to V17M/V17T,
# which leave `[ReaimDiag]` / `ENGAGED re-aim` / `FORCED FAITHFUL` unrequired AND
# unforbidden so their reading runs can MEASURE which road a cross-parent
# recording takes. Adding any of them here would pre-judge that.
#
# THE PHASE-1 OBSERVATION TARGETS, written down before the flight:
#   (1) WHAT MECHJEB DOES WITH A JOOL-PARENTED PAIR. If
#       `OperationInterplanetaryTransfer` refuses, `node_count` stays 0 and the
#       lane flakes in PLAN-TRANSFER with the plan warning in the mission stdout.
#       That is the single likeliest first-flight failure and it is a MechJeb
#       fact, not a Parsek one.
#   (2) THE EJECTION PRICE against the 790 (coplanar) / 1,010 (plane folded)
#       bounds - i.e. how much of the park's 16.372 deg inclination the planner
#       actually pays.
#   (3) THE OPTIMIZER'S ANSWER AT **TWO** BOUNDARIES (see the count block). The
#       load-time pass runs first on V17's LoadGame, as always.
#   (4) THE DELIVERED ARRIVAL PERIAPSIS against the 250,000 m request - a fifth
#       point for the finding-16d corpus, and the first at a body with no
#       atmosphere and a small mu.
required  = [
  "Recording started",
  "Recording stopped",
  "SOI change boundary suppressed in tree mode: Laythe to Jool",
  "SOI change boundary suppressed in tree mode: Jool to Vall",
  "CommitTreeFlight: starting tree commit at UT=",
  "CommitTreeFlight terminal: rec=\\w+ terminalState=Orbiting terminalOrbitBody=Vall",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The three moons ABOVE the transfer's apoapsis. Geometrically excluded rather
  # than merely unlikely - see the block above.
  "SOI change boundary suppressed in tree mode: \\w+ to Tylo",
  "SOI change boundary suppressed in tree mode: Tylo to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Bop",
  "SOI change boundary suppressed in tree mode: Bop to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Pol",
  "SOI change boundary suppressed in tree mode: Pol to \\w+",
]

[expectations.rewind]
# REPORT-ONLY (the ARMED_ALLOWLIST discipline). A clean single-craft flight with
# no separation event and no re-fly must author no RewindPoint, no supersede row
# and no tombstone; B17, B23, B24 and B25 all measured 0/0/0. If this flight
# disagrees that is a finding about what a moon-to-moon transfer does to the
# durable surfaces, and the honest response is to read it.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# [expectations.recordings.structure] and the points facets are DELIBERATELY
# ABSENT: the shape is PREDICTED, not measured, and a report-only block of
# invented numbers reads like a measurement. Author them from flight 1's saveParse
# facets - and note this is the first lane whose predicted TOPOLOGY is genuinely
# uncertain (one recording or three, per the count block).

[runtime]
# WALL arithmetic (the mission budget is WALL; the missionParams budgets are GAME
# seconds):
#   LoadGame                      300  declared
#   preamble seam verbs           ~10
#   PRELAUNCH orbit-start gate     ~5
#   PLAN-TRANSFER                 ~30  300 game s at the x10 plan hold
#   TRANSFER-BURN                ~790  the autowarped window wait (<= 105,961 game
#                                      s) is seconds on rails; ~600 of this is
#                                      MechJeb's OWN 1x pre-ignition WARPALIGN
#                                      hold, plus ~170 s of actual ejection burn
#   COAST-TO-TARGET              ~290  the leg is only 38,980 game s, so even the
#                                      x1,000 rails fallback is 39 wall s; the
#                                      priced part is the 10,000 game-s clamped
#                                      approach window at x50 = 200 wall s
#   two correction rounds       ~1000  each: plan + a ~340 s attitude flip at 2x
#                                      physics + aim-warp + a short burn
#   TARGET-FLYBY                  ~80  3,886-4,149 game s at the x10/x50 stair
#   PLAN-CAPTURE                  ~30
#   CAPTURE-BURN                 ~650  ~600 of it the 1x pre-ignition hold, plus
#                                      ~49 s of burn
#   PARK                         ~180  parkDwellSeconds of GAME time at 1x
#   ORBIT-COMMIT                 <120
#   => ~3,485 nominal. WORST adds up to two arrival-quality extra rounds (+1,000),
#      one bounded stale-node re-plan (+90 s of grace and a second ~600 s
#      pre-ignition hold), and a missed first intercept costing one synodic of
#      autowarp => ~5,300.
# missionBudget 5,400 is ~1.55x nominal and just over that worst case.
# runtime 6,000 >= 300 + ~10 + 5,400 + ~60 FlushAndQuit + ~230 margin (SF-5).
budgetSeconds = 6000

[retry]
# The transient risks are kRPC / MechJeb flakes. One retry prices the flake class.
# It does NOT absorb a systematic failure - a MechJeb refusal of the Jool-parented
# pair, an ejection floor that never trips, or a correction discarded at the cap
# all reproduce on attempt 2 and name themselves, which is what a first flight is
# for. AND NOTE WHAT ONE RETRY COSTS: two full attempts is up to 12,000 wall s.
policy = "once"

[expectedFail]
bugId = ""
