description = "FLOWN 2026-08-19 AND BLOCKED-PENDING A HARNESS CAPABILITY - see docs/dev/todo-and-known-bugs.md -> MECHJEB-INTERPLANETARY-PLANNER-REJECTS-MOON-ORIGIN. THE FIRST MOON-TO-MOON TRANSFER: the crewed Duna Rocket starts already parked in the 87,931 x 56,240 m Laythe orbit B25 delivered, escapes Laythe into JOOL's frame, transfers to VALL and commits the tree in a Vall park. ITS PRODUCT IS THE M-MIS-7 SUBJECT. Every same-parent lane so far (Duna->Ike, Eve->Gilly, Jool->Laythe) produces a recording `IsSameParentTarget` classifies SAME-PARENT, which routes to phase-lock and has now measured `method=single-orbital` three times. A moon-to-moon recording is the OTHER class: Vall is not a child of Laythe, so it is CROSS-PARENT and should reach `ApplyReaim` with the JOOL-frame synodic - a code path `docs/dev/research/same-parent-reaim-jool-system.md` section 5.1 walks guard by guard, concludes already works unmodified, and calls 'the single most surprising finding in this investigation: Parsek may already be re-aiming moon-to-moon hops. It is untested, unmeasured, and unrepresented in any harness lane.' THIS SPEC ASSERTS NOTHING ABOUT THAT - V17M/V17T carry both hypotheses and gate on neither. THE MACHINE SIDE IS A COMPOSITION OF TWO PROVEN BLOCKS THAT HAVE NEVER MET: the INTERPLANETARY path (eight lanes, always Kerbin-from-the-Sun) with JOOL as the transfer frame, entered through the ORBIT-START door (three lanes, always on the moon path). Audited end to end before authoring: ZERO Sun-frame assumptions on the live path (the heliocentric ephemeris is quarantined behind `padAlignEjection`, three call sites, all flag-gated; the phase angle is entirely MechJeb's), `ejectionEccFloor` reads the Laythe frame correctly, `_b5_correction_via_bodies` narrows to an identity, `STOCK_WARP_ALTITUDE_LIMITS` already carries all three bodies, and `startInOrbit` composes with `interplanetaryTransfer` with no coupling and no parse rejection - VERDICT CLEAN, VALUES ONLY. Three value consequences the audit named are handled at their own keys: the time-mode correction triggers re-sized to a 38,980 s leg (B7's would fire both rounds on the first frame), `ejectionEccFloor` re-calibrated to 1.001 because the required Laythe ejection hyperbola has ecc 1.0352 and B7's 1.05 WOULD NEVER BE REACHED, and the hardcoded `ARRIVAL_RECORRECT_*` window flagged to watch. Delta-v derived: 2,483.9 m/s available against a 1,385.1 m/s worst hop, a 79% margin - narrower than B25's 152% entirely because B25 delivered a park inclined 16.372 deg about Laythe and nothing can trim it. The Laythe-Vall synodic is 105,961.4 s = 2.0000 Laythe periods, which is the 1:2:4 resonance showing up in the transfer window and is why this pair is the right FIRST moon-to-moon subject. FLIGHT 1 (runs 2026-08-19_2214 and _2215_a2): BOTH ATTEMPTS INVALID(autopilot-flake), deterministic, refused in PLAN-TRANSFER after ~33 game seconds and 6 wall seconds. The cause is MECHJEB, not this spec and not Parsek: `operation_interplanetary_transfer.make_nodes failed: OrbitExtensions.NextTimeOfRadius: given radius of 3723645.81113302 is never achieved: o.PeR = 572085.800578244 and o.ApR = 3632679.92883477`, thrown out of `KRPC.MechJeb.Maneuver.Operation.MakeNodes`. 3,723,645.8 m is LAYTHE'S SOI RADIUS; the orbit MechJeb asks it of is not the park (ecc 0.028) but a constructed e=0.7279 ejection whose PeR sits 0.003 m from the park SMA and whose apoapsis falls 90,965.9 m (2.443%) SHORT of the SOI, so the crossing it then asks for does not exist. A moon-parked origin, whose park radius is a fifth of its SOI, is unhandled in this MechJeb code path; every flown interplanetary lane departs Kerbin, where the SOI is 12x the park radius. WHY MechJeb sizes it short was not read and is NOT claimed. Everything else behaved: `reachedOrbit met=True`, `startedInHomeOrbit value=0.028 met=True`, and target acquisition WORKED (`set_target_body text=Vall` ran and tgtD snapped 584,660 -> 59,303,828 m, Vall's real separation). DISPOSITION BLOCKED-PENDING a harness transfer capability for moon-origin ejections, with two candidate paths named and NEITHER chosen: (a) a flag-gated manual-ejection mode where mlib computes the node and the existing Jool-frame correction rounds create the encounter (the B17 round-0 pattern, already proven; the pad-align precedent's window math is frame-generic and only STOCK_HELIO_ELEMENTS is Sun-hardcoded), or (b) a different MechJeb operation set (escape then Lambert from Jool orbit). (a) is the house-style fit and is deferred as its own program. The spec stays committed and its dry-run stays valid - flyable-but-blocked, not withdrawn. The PRODUCT question is untouched and still open: whether ApplyReaim engages on a cross-parent moon-to-moon recording stays pre-registered in V17M/V17T, which gate on neither hypothesis."
