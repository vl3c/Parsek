description = "LIVE-PROVEN 2026-08-20 ON FLIGHT 3 - THE FIRST COMPLETED MOON-TO-MOON TRANSFER. THE FIRST MOON-TO-MOON TRANSFER: the crewed Duna Rocket starts already parked in the 87,931 x 56,240 m Laythe orbit B25 delivered, escapes Laythe into JOOL's frame, transfers to VALL and commits the tree in a Vall park. ITS PRODUCT IS THE M-MIS-7 SUBJECT. Every same-parent lane so far (Duna->Ike, Eve->Gilly, Jool->Laythe) produces a recording `IsSameParentTarget` classifies SAME-PARENT, which routes to phase-lock and has now measured `method=single-orbital` three times. A moon-to-moon recording is the OTHER class: Vall is not a child of Laythe, so it is CROSS-PARENT and should reach `ApplyReaim` with the JOOL-frame synodic - a code path `docs/dev/research/same-parent-reaim-jool-system.md` section 5.1 walks guard by guard, concludes already works unmodified, and calls 'the single most surprising finding in this investigation: Parsek may already be re-aiming moon-to-moon hops. It is untested, unmeasured, and unrepresented in any harness lane.' THIS SPEC ASSERTS NOTHING ABOUT THAT - V17M/V17T carry both hypotheses and gate on neither. FLIGHT 1 (runs 2026-08-19_2214 and _2215_a2) BOTH ATTEMPTS INVALID(autopilot-flake), deterministic, refused in PLAN-TRANSFER on a MECHJEB limitation: `operation_interplanetary_transfer.make_nodes failed: OrbitExtensions.NextTimeOfRadius: given radius of 3723645.81113302 is never achieved`. 3,723,645.8 m is LAYTHE'S SOI RADIUS; MechJeb idealised the moon-parked origin to a circle at the park's mean radius and built a sub-escape ejection falling 2.443% short of the SOI. See docs/dev/todo-and-known-bugs.md -> MECHJEB-INTERPLANETARY-PLANNER-REJECTS-MOON-ORIGIN. THE CAPABILITY THAT BLOCKER DEFERRED WAS BUILT AND THIS SPEC RE-POINTED AT IT: the flag-gated PARENT-RELAY mode (`parentRelayTransfer`), candidate (a)-minimal. TWO STAGES, ONE FLAG, NO NEW BURN MACHINERY. Stage 1 is a flag-gated ESCAPE phase where mlib computes ONE prograde node itself at the park's next PERIAPSIS and kRPC's OWN `Control.add_node` places it (core kRPC, no MechJeb planner, which is why the refusal cannot recur), flown by the SAME NodeExecutor and SAME stagnation watchdog. Stage 2 is not a phase: the first coast frame whose SOI body reads JOOL re-enters PLAN-TRANSFER at relay_stage 1, where the plan is MechJeb's MOON-path `OperationTransfer` - legal there by construction - and the evidence is the parent-frame apoapsis floor (`transferMinApoapsisMeters`, real here for the first time at 36,000,000 m). FLIGHT 2 (runs 2026-08-20_1646 and _1701_a2) flew the mode. Both attempts INVALID(autopilot-flake) - AND MOST OF IT WORKED: the whole two-stage phase flow, `escapedHomeSoi met=True`, the node computed/added/read-back exactly once and executed to within 1%, and MechJeb's moon-path OperationTransfer accepting the Jool-parented pair. It measured TWO defects. DEFECT A - the escape CONTRACT was wrong, not the escape: KSP is PATCHED-CONIC and hands a departing vessel to the parent AT THE SOI BOUNDARY, so asking for a hyperbolic excess of 347.245 m/s delivered sqrt(v_inf^2 + 2*mu/r_soi) = 1,083.69 m/s, 3.12x, producing a Jool orbit of a = 79.0 Mm where the transfer wanted 35.2; swept over all directions that contract also admitted a 5.51 Mm periapsis (below Jool's atmosphere) and orbits leaving Jool entirely. Fixed by one term and a rename - `escapeSoiSpeedMps` = 450, sized sqrt(v_soi^2 + 2*mu*(1/r_pe - 1/r_soi)) = 586.69 m/s, 188 m/s cheaper AND correct - with the retired key REJECTED by name at spec load, `ejectionEccFloor` retired to 0 (a correct patched-conic escape from Laythe is BOUND at ecc 0.7586, so stage-1 evidence is `_relay_escape_burn_done`) and the entry-gate apoapsis ceiling tightened 500,000 -> 300,000 m. DEFECT B - coast-warp-thrash, 501 native warp issues against a 500 cap: the stage-2 Jool ellipse re-crosses LAYTHE'S OWN orbit, so `nextBody` flapped Vall<->Laythe and `time_to_soi` stepped 145,030 <-> 123,078 s, blowing through the retarget threshold in both directions so the policy cancelled and re-armed its own warp every flip. Fixed by an IDENTITY check rather than a wider threshold (`soi_clock_describes_target` / `coast_foreign_soi_clock_hold`), failing OPEN on an unread next_body so no flown lane moves. FLIGHT 3 (run 2026-08-20_1752): PASS attempt 1, MISSION-OK, mission wall 1,408 s, the FULL twenty-phase chain through ORBIT-COMMITTED and all eight assertions met. ALL FOUR PRE-REGISTERED OBSERVATION TARGETS CAME BACK WHERE THE FIXES PREDICTED: (1) the delivered Jool orbit read a = 26.06 Mm ecc 0.013 - INSIDE the 17.2-59.0 Mm band the corrected contract predicts, against flight 2's 79.0 Mm outside it; (2) `phaseWarpIssues` peaked at 1 for the whole mission against flight 2's 501 in one phase (5 native warp dispatches, 2 cancels, 10 gate flips in twenty phases) - the thrash is gone, not merely bounded; (3) the escape node read 586.6922 m/s against the derived 586.69, leaving a POSITIVE 4,055,749 m apoapsis radius against the predicted 4,053,149 - the BOUND escape the corrected contract intends, so `_relay_escape_burn_done` fired on its SOI-reach disjunct exactly as designed; (4) the stage-2 node read 415.46 m/s, between the best and typical cases of the 102.8/600.0/900.0 band. The rest: corrections 63.72 and 11.66 m/s (neither discarded at the 100 cap), delivered arrival periapsis 168,783 m against the 250,000 request = k 0.675 at req/SOI 10.39%, the FIFTH finding-16d corpus point and the first at an airless small-mu body; capture 315.07 m/s; Vall park 167,158 x 170,417 m at ecc 0.0035; total spent by propellant mass 1,368.1 m/s against a 1,530.8 nominal and 1,861.4 worst hop, leaving 1,116.6 m/s. THE PRODUCT EXISTS: harvested as `fixtures/saves/vall-transfer-recorded` - one tree, one recording, 746 points, 13 ORBIT_SEGMENTs, two body-change seams, zero durable rows, terminal Orbiting at Vall. The count window measured 1, the BOTTOM of its {1,4} range: the optimizer kept BOTH body-change boundaries cohesive, which is the first data anyone has on an ESCAPE boundary. The PRODUCT question is untouched and still open: whether ApplyReaim engages on a cross-parent moon-to-moon recording stays pre-registered in V17M/V17T, which gate on neither hypothesis."
instanceProfile = "stock-minimal"
tags = ["B26", "vall", "laythe", "jool", "moon-to-moon", "cross-parent", "jool-moon",
        "orbit", "mechjeb", "cross-soi", "capture", "commit-in-foreign-soi",
        "orbit-start", "interplanetary-path", "crewed"]

[fixture]
# `laythe-park-nerv`: a DERIVED, PARSEK-STRIPPED copy of B25's
# `laythe-orbit-recorded` (the run 2026-08-19_2039 --keep-parsek harvest that
# V16M/V16T consume). NO FORGE FLIGHT was spent on it - it is a transform of
# committed bytes.
#
# THE WORLD, unchanged from the source and MEASURED off this save's own bytes: at
# UT 28,817,025.337051559 the Duna Rocket sits parked ORBITING Laythe (REF = 9) -
#   SMA 572,085.80370560708   ECC 0.027697758715375592
#   INC 16.372447690149517 deg   LAN 184.98306525700974
#   periapsis alt 56,240.3 m   apoapsis alt 87,931.3 m
#   type Ship, CREWED (Valentina Kerman, Pilot, in the mk1pod.v2), NERV stage,
#   LiquidFuel 534.869/2400 = 2.674 t usable, ~2,484 m/s dv, Ablator still 200/200
# `activeVessel = 1` IS that stage. RIDE-ALONG AND INERT: the stock asteroid
# Ast. VPA-167 and two `Duna Rocket Debris` vessels in KERBIN orbit, carried
# unchanged through B22 -> B25 -> here.
#
# HOW IT WAS MADE, the now-standard two steps:
#   (1) harvest_bdock_station.py --save-dir fixtures/saves/laythe-orbit-recorded
#       --target-name laythe-park-nerv --expect-situation ORBITING
#       WITHOUT --keep-parsek, so the `Parsek/` sidecar directory is pruned.
#   (2) A MANUAL, BRACE-BALANCED EXCISION of the residual ParsekScenario CHILDREN.
#   FIVE CHILD NODES OF **FOUR** TYPES WERE REMOVED - `RECORDING_TREE` (1),
#   `KERBAL_SLOTS` (1), `CREW_REPLACEMENTS` (1) and `MILESTONE_STATE` (2). NOTE
#   THE DIFFERENCE FROM ITS THREE PREDECESSORS: there is NO `GROUP_HIERARCHY` node
#   here, because B25's tree is a single standalone recording with no debris
#   subgroup to nest, and only TWO milestone rows rather than four. The strip
#   recipe is "excise every child, whatever they are" - not "excise these five
#   names" - and this fixture is the one that shows why that distinction matters.
#   The node now carries only name / scene / missionHideArchived /
#   gameStateEventCount. ZERO `.prec` sidecars, ZERO committed trees; `saveparse`
#   reads trees=0 committedTrees=0 recordings=0.
#
# The source has no `Ships/VAB`, so the harvest dropped nothing: this mission
# never launches anything, needs NO `fixtures/shared-ships.toml` row, and gets
# none.
#
# WHY A DERIVED COPY RATHER THAN THE SOURCE. `laythe-orbit-recorded` carries a
# COMMITTED TREE for this very vessel, and a seam StartRecording cannot open a
# standalone tree on a committed tree's own launch - it no-ops onto the recording
# the committed-restore path re-resumes (MEASURED, B23 flight 1;
# docs/dev/todo-and-known-bugs.md -> SEAM-STARTRECORDING-JOINS-COMMITTED-TREE). It
# also DECOUPLES this lane from V16M/V16T, which read `laythe-orbit-recorded` and
# whose eight jump UTs are calibrated off its exact bytes: nothing here touches
# that fixture, its tree id `0ffee6458331466481f5c7aa0212b515`, or any V16 pin.
saveTemplate       = "fixtures/saves/laythe-park-nerv"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "b26_laythe_vall"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams]
# header. The scene-entry preamble is the B23/B24/B25 shape verbatim; read B25's
# header for why the StopRecording/DiscardTree pair is not a latch and why the
# FIXTURE is what actually closes the committed-restore window.
#
# ONE commit, MID-MISSION (ORBIT-COMMIT), and NO post-mission CommitTree.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },   expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                     expect = "OK" },
  { cmd = "DiscardTree",                                                       expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "StartRecording",                                                    expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 6600 },
  { cmd = "FlushAndQuit",                                                      expect = "OK" },
]

# Every value below is a tolerance / threshold / budget, never a golden
# trajectory (validated against b26_laythe_vall.schema.toml). Phase budgets are
# GAME seconds unless a comment says otherwise.
[driver.missionParams]
# --- ORBIT-START: the entry door and its gate --------------------------------
# The four ASCENT keys and the two ascent budgets are DELIBERATELY ABSENT (the
# schema demotes all six to optional for this lane): PRELAUNCH hands straight to
# the ORBIT waypoint and no ascent is ever flown.
startInOrbit                    = true
# THE GATE, stated against the fixture's MEASURED Laythe park (periapsis alt
# 56,240.3 m, apoapsis alt 87,931.3 m, ecc 0.0277):
#   periapsis floor 52,000 m - the SAME line B25's park floor settled on, and for
#     the same reason: Laythe's atmosphere tops out at 50,000 m, so 52,000 is
#     2,000 m of clearance, and it sits 4,240 m below the measured periapsis. A
#     start park that had somehow decayed toward the air is refused before a
#     transfer is planned against a drag-perturbed orbit.
#   apoapsis ceiling 300,000 m - **TIGHTENED FROM 500,000 BY FLIGHT 2's DEFECT-A
#     FIX**, and the reason is arithmetic rather than caution. The escape's SOI
#     speed has a geometric FLOOR that rises with the park: swept over the old
#     500,000 m gate, a circular park near the ceiling could not reach the SOI
#     with less than **472.33 m/s**, which is ABOVE the committed
#     `escapeSoiSpeedMps` of 450 - so `escape_node_plan` would have REFUSED a
#     park the gate declared legal, and the lane would have died in ESCAPE with a
#     correct-but-baffling give-up. At 300,000 the gate's worst corner needs
#     431.70 m/s and every admissible park is deliverable with 4.1% to spare.
#     300 km is still 3.4x the measured ~87.9 km, and 800,000 m of RADIUS = 21.5%
#     of Laythe's 3,723,646 m SOI radius, so a park that had drifted out toward
#     the shell is still refused. A STRICTLY POSITIVE apoapsis is required
#     regardless (a hyperbolic reading is negative), which is the actual
#     still-bound evidence.
#   eccentricity ceiling 0.10 - and this one is WIDER than B23/B24/B25's 0.05, on
#     purpose. Those lanes started from parks that a CIRCULARIZE had rounded out;
#     THIS park is the delivered product of a finite capture burn and reads 0.0277,
#     which 0.05 would admit at only 1.8x. 0.10 gives 3.6x.
#     **AND THE CONJUNCT MATTERS MORE HERE THAN ON ANY PRIOR LANE, because this is
#     the interplanetary path.** MechJeb's ejection planner sizes the required
#     post-burn speed at the parking orbit's SEMI-MAJOR AXIS and applies it at
#     whatever radius its geometry picks (the decompiled note on
#     `mlib.park_trim_verdict`); on a circular park r == sma and the sizing is
#     exact, on an eccentric one it is not. Quantified for THIS park: r ranges
#     556,243-587,929 against sma 572,086, so the `2*mu*(1/sma - 1/r)` term is at
#     most 1.95e5 m^2/s^2 against v_eject^2 = 6.98e6 - **2.8% in energy, ~1.4% in
#     speed, i.e. ~37 m/s**. Real, small against the margin, and NOT fixable from
#     this lane: `parkTrimEccMax`'s round-out step is reachable only from
#     `B5_CIRCULARIZE`, which `startInOrbit` never enters (B25 established that).
#     **THE RELAY RETIRES THAT PARTICULAR ERROR** - the escape node is sized by
#     vis-viva AT THE PERIAPSIS RADIUS IT IS APPLIED AT, so there is no
#     sma-vs-radius gap left to pay (the measured difference is the 15.3 m/s
#     between the 774.70 the relay computes and the 790.0 the circular-at-sma
#     formula gave). The ceiling is KEPT AT 0.10 anyway and for a different
#     reason: an eccentric start park is still evidence the fixture is not the
#     one this spec sized, and the entry gate is the only place that can say so.
startInOrbitMinPeriapsisMeters  = 52000
startInOrbitMaxApoapsisMeters   = 300000
startInOrbitMaxEccentricity     = 0.10
startInOrbitSituations          = ["ORBITING"]
startInOrbitDebounceFrames      = 3
startInOrbitSettleSeconds       = 120

# --- Transfer: the PARENT-RELAY, over the interplanetary path ----------------
homeBodyName               = "Laythe"
targetBodyName             = "Vall"
# **STAYS ON, AND IT IS NOT VESTIGIAL.** The relay does not replace this flag; it
# rides it. Two live decisions read `interplanetary_transfer` on this lane and
# both are still wanted: `_b5_correction_via_bodies` narrows the correction
# domain to `("Jool",)` only when it is set, and `ejectionEccFloor`'s stage-1
# burn-done branch is the interplanetary evidence path. What the relay DOES
# change is the plan action at stage 2 and nothing else - see the block below.
# `mlib.b5_params_from_dict` REJECTS a spec that arms the relay without it.
interplanetaryTransfer     = true

# THE PARENT-RELAY BLOCK. It is why this lane can fly at all; read THE MODE, AS
# BUILT in the header before changing any of the four values.
parentRelayTransfer        = true
# **THE KEY FLIGHT 2 RENAMED, AND THE RENAME IS THE FIX FOR DEFECT A.** It is the
# relative speed the escape carries ACROSS LAYTHE'S SOI BOUNDARY - which is where
# KSP's patched conic hands the vessel to Jool, and therefore the only departure
# quantity this mode can aim at.
#
# THE FIRST CUT ASKED FOR A HYPERBOLIC EXCESS AT INFINITY (`escapeTargetVInfMps
# = 347.245`, the Hohmann's own departure excess) and mlib sized
# `sqrt(v_inf^2 + 2*mu/r_pe)`. What actually crossed the boundary was
# `sqrt(v_inf^2 + 2*mu/r_soi)` = **1,083.69 m/s, 3.12x the intent**, because
# 3.72 Mm out Laythe's well is still deep. Flight 2 measured the consequence to
# the metre: a Jool-frame orbit with a **126.3 Mm apoapsis** where the transfer
# wanted 43.2. mlib now REJECTS the old key by name rather than ignoring it.
#
# WHY 450 AND NOT 347.245. The ideal is not deliverable: a prograde burn at this
# park's periapsis cannot reach the SOI with less than **370.08 m/s** of relative
# speed (below that the apoapsis never touches the boundary and the escape simply
# does not happen), and `escape_node_plan` REFUSES anything under that floor
# rather than clamping. 450 clears the fixture's floor by 21.6% and clears the
# WHOLE ENTRY GATE's worst corner (431.70 m/s, at a circular park on the apoapsis
# ceiling) by 4.1%, while sitting only 29.6% above the Hohmann's ideal - the
# closest the SOI geometry allows. The node comes out at **586.69 m/s**, i.e.
# 188.0 m/s CHEAPER than the burn flight 2 flew.
escapeSoiSpeedMps          = 450
# SANITY CAP on the COMPUTED node, and the ONLY guard against a wrong
# `STOCK_BODY_GRAVITY` row or a fixture parked somewhere this spec did not size
# for. The node comes out at **586.69 m/s** against the fixture's measured park.
# IT IS SIZED AGAINST THE WHOLE ENTRY GATE, not against the fixture alone: swept
# over the gate's admissible window (pe >= 52,000 m, 0 < ap <= 300,000 m) the
# node's maximum is **616.18 m/s**, at the CIRCULAR park sitting on the periapsis
# floor - an eccentric park is faster at periapsis and therefore cheaper to
# escape from, so the expensive corner is the round low one. 700 is 13.6% above
# that corner and 19.3% above the fixture, narrow enough that a 10x error or a
# wrong-body mu is REFUSED with a named reason instead of flown. TIGHTENED FROM
# 900 with the contract fix: the cap was sized against the old, over-energetic
# formula and would have admitted flight 2's 774.70 m/s burn again.
escapeMaxDeltaVMps         = 700
# The NodeExecutor autowarps to the node and holds a 1x WARPALIGN before
# ignition, so a node a few seconds ahead is a node it cannot fly. 300 game s is
# 15.5% of the park's own 1,941 s period, so at most one extra orbit of waiting
# is ever bought (the planner adds ONE period when the next periapsis is closer
# than this), and it is half of MechJeb's own ~600 s pre-ignition hold - the
# executor starts its warp immediately, so the lead only has to be long enough
# for the node not to be in the past by the time the RPC lands.
escapeNodeMinLeadSeconds   = 300
# ESCAPE budget (GAME s). It bounds PLANNING ONLY - the burn is TRANSFER-BURN's
# and the coast to the SOI exit is COAST-TO-TARGET's - so the quantity to cover
# is "one park period of unreadable telemetry plus the bounded re-plan cadence".
# 2,400 is 1.24 park periods and 240 wall s at the 10x plan hold. Expiry is a
# give-up NAMING the refused reading (`escape-node never computable: ...`), not
# the generic phase timeout, which is the whole reason a longer budget is
# affordable: the failure it bounds says what it was.
#
# ONE HAZARD THIS PHASE HAS THAT NO OTHER PLAN PHASE DOES, closed in the runner
# rather than waited out: `add_node` is PURELY ADDITIVE where `make_nodes` is
# replacing, so the machine's bounded re-issue (`planRetrySeconds` 10 game s,
# ~1 wall s at the 10x hold) could stack a SECOND full escape burn off a
# one-poll-stale `node_count` read. The runner checks LIVE truth immediately
# before adding and SKIPS with a named Warn if any node is already pending, so
# the window is removed rather than survived. If flight 2 ever logs
# `escape node add SKIPPED`, that guard fired and nothing is wrong.
escapeTimeoutSeconds       = 2400
# THE TRANSFER FRAME, replacing "Sun" on every prior interplanetary lane. It is
# read in three places and each matters here: the TARGET-FLYBY multi-hop assert's
# accepted body set ({Vall, Jool} and nothing else), the RETURN terminal, and
# `_b5_correction_via_bodies`, which narrows the correction domain to exactly
# `("Jool",)`.
returnBodyName             = "Jool"
# The SOI the coast legitimately operates in. `_b5_coast_bodies` is
# `("", home) + via` = `("", "Laythe", "Jool")`, so a stray Tylo / Bop / Pol SOI
# entry is an immediate ASSERT-FAIL - which is the behaviour to keep. It must
# contain `returnBodyName` for `_b5_correction_via_bodies`' documented subset
# precondition to hold; here the two are the same body, so the narrowing is an
# identity.
viaBodyNames               = ["Jool"]
# **NO LONGER INERT - THIS IS STAGE 2's BURN-DONE EVIDENCE**, and it is the one
# key whose MEANING the relay changes rather than whose value it tunes. On every
# other interplanetary lane `ejectionEccFloor > 0` disables this floor outright
# and the key is carried at 0 for schema symmetry (B15's disposition). Here the
# machine needs TWO pieces of evidence because there are TWO burns, and they are
# different claims:
#   STAGE 1 claims "the orbit is now HYPERBOLIC about Laythe" -> ejectionEccFloor.
#   STAGE 2 claims "the transfer REACHES VALL'S ORBIT"        -> this floor, read
#     in JOOL's frame.
# Without it stage 2 would have no evidence at all: at stage 2 the craft is
# inside a via body's SOI, so the ecc branch's left-the-home-SOI early return
# fires unconditionally and the exit would collapse to "a node was consumed".
#
# THE VALUE IS DERIVED, NOT CHOSEN. Vall's orbit is 43,152,000 m from Jool's
# centre; kRPC reports apoapsis as an ALTITUDE above Jool's 6,000,000 m surface,
# so an orbit that reaches Vall reads **37,152,000 m** or more - and it must,
# because apoapsis is by definition at least the radius of any point the orbit
# passes through, and Vall's orbit is circular and uninclined in stock. 36,000,000
# sits 1,152,000 m (3.1%) under that, which is slack for reading noise and for a
# transfer whose intercept MechJeb places a hair inside, and 14,816,000 m ABOVE
# the 21,184,000 m altitude an un-escaped orbit at Laythe's own radius reads - so
# it discriminates cleanly in both directions.
transferMinApoapsisMeters  = 36000000
# **RETIRED ON THIS LANE, AND FLIGHT 2 IS WHY - READ THIS BEFORE RE-ARMING IT.**
# On every other interplanetary lane this is the burn-done evidence: a HYPERBOLIC
# home-frame eccentricity proves the ejection happened. The relay cannot use it,
# because a correctly-sized patched-conic escape from Laythe is **BOUND**.
#
# THE ARITHMETIC, which is the whole argument. Reaching a SOI boundary does not
# require ESCAPING - it requires an APOAPSIS at or past it. The committed
# `escapeSoiSpeedMps` of 450 produces a Laythe orbit of ecc **0.7586** whose
# apoapsis radius is 4,053,149 m, 8.85% past the 3,723,646 m SOI. Demanding
# ecc > 1 would force the PARABOLIC burn instead - **752.10 m/s rather than
# 586.69** - and would dump **1,026.55 m/s** across the boundary rather than 450,
# which is most of the way back to the over-energetic escape flight 2 flew.
#
# SO THE STAGE-1 EVIDENCE IS A DIFFERENT PREDICATE, `_relay_escape_burn_done`:
# already left the home SOI, OR a negative (genuinely hyperbolic) home-frame
# apoapsis, OR a home-frame apoapsis RADIUS at/past the SOI. It needs no spec
# value - the machine reads the SOI radius from `STOCK_BODY_GRAVITY`. This key is
# kept present at 0 for schema symmetry (B15's disposition) and is NOT READ on a
# relay lane. DO NOT set it back to 1.001 "for safety": it would not be consulted,
# and if the relay flag were ever dropped it would demand a burn 165 m/s larger
# than the one this spec's whole delta-v section is derived from.
ejectionEccFloor           = 0
# Requested Vall periapsis ALTITUDE for the course corrections.
#
# THE CORPUS (docs/dev/todo-and-known-bugs.md ->
# FINDING-16D-MISCITED-DIRECTION-AND-DENOMINATOR) sorts k = delivered/requested by
# `req/SOI` and shows the bias inverting above ~4%. Against Vall's 2,406,401.4 m
# SOI, 250,000 m is **10.39%** - essentially the Mun row (10.29%, k = 0.545-0.563).
#
# AND IT IS SIZED AGAINST B25's OWN MEASUREMENT rather than against the corpus
# alone, which is what picks 250 km over the 150 km a 6% req/SOI would have given.
# B25 measured k = **0.283-0.289** at req/SOI 6.71% - BELOW even the Mun row, and
# it refuted that spec's pre-flight assumption of k ~ 1. Applying the same ratio
# band here:
#   k 0.29 -> 72.5 km delivered      k 0.55 -> 137.5 km delivered
# both comfortably above the 30,000 m assertion floor and inside the park window.
# A 150 km request at k 0.29 would deliver 43.5 km, only 1.45x the floor - too
# close for a first flight at a body nobody has aimed at.
#   3x SHORT of the low end -> ~24 km: BELOW the 30 km floor, so a 3x-short draw
#     ASSERT-FAILs rather than crashing (Vall's terrain reaches ~8 km, so even
#     that is 3x clear of the ground). Survivable and correctly named.
#   3x LONG of the high end -> ~412 km = 712 km radius = 29.6% of the SOI radius.
#     Still an encounter, still inside the park window below.
courseCorrectPeriapsisMeters = 250000
# TIME-TO-SOI mode, and **RE-SIZED FOR A 38,980 s LEG - the audit's item (1)**.
# B7's list is [20,000,000; 500,000], sized against a heliocentric coast of ~2e7
# game s. On this leg `time_to_soi` is BELOW 20,000,000 on the very first
# Jool-SOI frame, so both rounds would fire back to back at the start of the coast
# with nothing left for mid-course - the B15-flight-5 failure SHAPE reached by a
# different route (not a wrong body domain, but a threshold list an order of
# magnitude too coarse).
#   35,000  round 0, which fires shortly after the STAGE-2 BURN (the leg is
#           38,980 s at the Hohmann geometry, so tts is ~39,000 when the transfer
#           node is consumed): fix the transfer error while there is still coast
#           to fix it in.
#           **THE RELAY MAKES THIS SAFER, NOT RISKIER, AND THE ORDERING IS WHY.**
#           The stage-2 hand-off is checked in COAST-TO-TARGET *before* the
#           correction block, so the Jool-SOI frames that precede it - which
#           satisfy every condition of the no-encounter early trigger, having no
#           node and no encounter by construction - can never spend a round
#           course-correcting a transfer that has not been planned yet.
#   8,000   round 1, ~2.2 h before arrival. Chosen to sit ABOVE both the ~3,900 s
#           SOI-entry -> periapsis coast and the hardcoded
#           `ARRIVAL_RECORRECT_MAX_TTS_SECONDS = 3,600`, so the scheduled round
#           and the arrival-quality extras cannot collide.
# The ALTITUDE list stays empty: a non-empty time list SELECTS time mode and
# supersedes it.
correctionTriggerTimeToSoiSeconds = [35000, 8000]
correctionTriggerAltsMeters       = []
planTimeoutSeconds         = 300
planRetrySeconds           = 10
planWarpFactor             = 2
# TRANSFER-BURN budget (GAME s), and under the relay it covers TWO passes through
# the same phase with very different waits:
#   STAGE 1  the escape node sits at most one park period + the min lead ahead
#            (1,941 + 300 = 2,241 game s), then ~127 s of burn.
#   STAGE 2  MechJeb's targeted intercept can wait for its window, at most one
#            synodic (105,961.4 s = 2.0000 Laythe periods) ahead.
# 600,000 is ~5.7 synodics - a SLOW bound; the stagnation / no-start / under-burn
# watchdogs bound BROKEN, and the budget re-anchors on each phase entry so the
# two passes do not share it.
transferBurnTimeoutSeconds = 600000
# COAST-TO-TARGET budget (GAME s) against a 38,979.9 s Hohmann leg. 600,000 is
# ~15x it, sized to cover a missed first intercept plus the synodic wait for the
# next window (105,961 + 38,980 = 144,941 per attempt, so this admits ~4).
coastTimeoutSeconds        = 600000
# TARGET-FLYBY budget (GAME s) against the 3,886-4,149 s SOI-entry -> periapsis
# coast: ~14x the longest.
flybyTimeoutSeconds        = 60000
# THE WARP BLOCK - full three-rule derivation in the header. In one line: the
# approach clamp is x50 both because a pessimistic frame at x100 would be 10% of
# the 3,886 s coast AND because Vall's own altitude table makes x100 illegal below
# 40 km anyway; the coast rate stays at x1,000 because the whole leg costs 39 wall
# s there and this is not an interplanetary-scale coast.
coastWarpFactor            = 5
soiLeadSeconds             = 3000
approachWindowSeconds      = 10000
approachMaxWarpFactor      = 3
flybyWarpFactor            = 2
flybyMaxWarpFactor         = 3
nodeArrivalMarginSeconds   = 15
flipPhysicsWarpFactor      = 1
# Min-altitude floor across the WHOLE in-SOI stay. Vall has NO ATMOSPHERE and its
# terrain reaches ~8,000 m; 30,000 clears it by 3.75x. Its job is to catch a
# trajectory heading INTO THE GROUND, not to certify the park (B23's rule, and
# B25's flight 1 is the standing demonstration of what happens when a floor is
# written near the hoped-for park).
#
# AND IT IS DELIBERATELY **NOT** EQUAL TO `parkMinPeriapsisMeters` - the
# B19/B20/B21/B22/B24 convention stays broken in the direction B25 established.
# B25 measured a systematic finite-burn wedge between the arrival periapsis and
# the delivered park periapsis (15.4 km on a 163.5 s capture burn at 5.40 m/s^2).
# THE WEDGE HERE SHOULD BE MUCH SMALLER - the Vall capture is ~344 m/s on a
# ~8.665 t stack, i.e. a **~49 s** burn against a ~3,490 s park period (1.4% of an
# orbit, against B25's 8%) - but "much smaller" is a prediction, not a
# measurement, so the park floor sits 10 km below this one rather than equal to
# it. If flight 1 measures the wedge, re-derive both from it.
targetPeriapsisFloorMeters = 30000

# --- Capture + Vall park + commit (the B11/B12 tail) -------------------------
captureEnabled             = true
capturePlanTimeoutSeconds  = 300
# CAPTURE-BURN budget (GAME s): the executor autowarps the SOI-entry -> periapsis
# coast (3,886-4,149 s) and MechJeb's own 1x pre-ignition WARPALIGN hold is ~600
# game s of it. 60,000 is ~13x that ~4,700 s total.
captureBurnTimeoutSeconds  = 60000
# THE CAPTURE WINDOW (also the PARK gate). Vall's SOI is 2,406,401.4 m from the
# CENTRE and its radius is 300,000 m, so the shell is 2,106,401.4 m of ALTITUDE.
#   parkMinPeriapsisMeters  20,000 m - 2.5x Vall's ~8 km terrain, and 10,000 m
#     below the arrival floor to absorb the (predicted small) finite-burn wedge
#     without redding a healthy park. B25's flight 1 is why this gap exists at all.
#   parkMaxApoapsisMeters   600,000 m - LOAD-BEARING TWICE. (1) A hyperbolic
#     (uncaptured) approach reads a NEGATIVE apoapsis in the Vall frame, so
#     "0 < ap <= 600,000" is the actually-captured evidence. (2) It must ADMIT the
#     corrected-arrival spread: a 3x-long draw off the high end of the k band
#     lands near 412 km, so a tighter ceiling would red a good flight. 600,000 m
#     altitude = 900,000 m radius = 37.4% of the SOI radius, durably inside.
#   parkMaxEccentricity     0.25     - B11's value.
parkMinPeriapsisMeters     = 20000
parkMaxApoapsisMeters      = 600000
parkMaxEccentricity        = 0.25
parkMaxAngularVelocityRadPerSec = 0.05
parkSituations             = ["ORBITING"]
parkDwellSeconds           = 180
parkDebounceFrames         = 3
parkTimeoutSeconds         = 600
commitTimeoutSeconds       = 300

# --- Shared machine housekeeping ---------------------------------------------
# SIZING NOTE: the NERV is 60 kN on a 9.854 t stack falling to ~7.8 t, i.e.
# 6.09 -> 7.70 m/s^2. THREE burns now, not two:
#   escape   774.7 m/s at 6.09 m/s^2  ~127 s
#   stage 2  347-695 m/s at 6.76      ~51-103 s
#   capture  374.7 m/s at 6.98         ~54 s
# All three are comfortably inside the proven watchdog defaults, since
# `burnStagnantSeconds` only starts counting after the apsides STOP moving and
# `burnNoStartSeconds` only while the orbit is UNCHANGED.
burnStagnantSeconds        = 120
burnNoStartSeconds         = 600
correctionThrottle         = 0.25
correctionCutDvMps         = 2.0
correctionSettleSeconds    = 10
maxAttitudeErrorDeg        = 30
frozenTelemetrySamples     = 10
# dv cap (m/s) an acceptable course-correction plan must fit under. **LOWERED
# FROM 150 TO 100 BY THE RELAY**, and the reason is arithmetic, not taste.
#   THE MARGIN RULE, which is what moved it: up to FOUR rounds can fire (the two
#     this spec schedules plus mlib's two `MAX_ARRIVAL_EXTRA_ROUNDS`
#     arrival-quality extras). The relay's WORST hop is 1,843.9 m/s against
#     2,483.9 available, i.e. 640.0 m/s of margin - so at 150 the worst
#     correction spend is 600 and the flight lands 6 m/s from dry, which is not a
#     margin at all. At 100 the worst spend is 400 and 239.6 m/s remain.
#   THE B15 RULE still holds at the new value: 100 is 3.5x below the 347.2 m/s
#     best-case stage-2 transfer it refines and 6.9x below the 694.5 worst case.
#     What it is NOT is a cap on that transfer - no lane caps a transfer plan,
#     and this one does not either.
#   THE B20 LESSON pulls the other way (an under-sized cap DISCARDED the
#     encounter-creating correction and cost two INVALID attempts), and it is why
#     this is 100 rather than B24's 50. It also bites LESS here than it did on
#     B20: under the relay the encounter is created by MechJeb's own targeted
#     `OperationTransfer` at stage 2, so a correction round is back to being a
#     refinement of an existing encounter rather than the thing that makes one.
#   IF FLIGHT 2 SHOWS A CORRECTION DISCARDED AT THIS CAP AND THE ENCOUNTER LOST,
#     the honest fix is to read the stage-2 node dv first: a correction that big
#     means the escape's asymptote came out badly aimed, and the answer is either
#     aiming it (the v1 limitation) or admitting a larger hop - not raising the
#     cap blind into a margin that cannot pay for it.
maxCorrectionDvMps         = 100

# CLAIM-IS-NOT-GATE.
#   D1 commit-in-foreign-soi   gated by the terminalOrbitBody=Vall commit token.
#   D14 laythe / vall          `laythe` by the `Laythe to Jool` escape token,
#       `vall` by `Jool to Vall` plus the commit terminal-body token.
#   D14 jool                   gated by BOTH SOI tokens naming it - this lane
#       spends its whole coast in Jool's SOI, which no prior lane's contract has
#       claimed.
#   D14 warp-rails             the machine cannot complete without it.
#   D14 scene-flight / sandbox the environment axes.
#
# NOT claimed, deliberately:
#   D1 auto-record-launch  - there is no launch.
#   D11 anything           - THE ROUTING IS NOT THIS LANE'S CLAIM. B26 produces
#       the subject; V17M/V17T read it and claim (or decline) the cells.
#   D14 tylo / bop / pol   - the coast crosses no other moon's SOI and the
#       forbidden tokens below assert it.
#   D14 warp-high, soi-count - nothing here gates either.
[dimensionsCovered]
D1  = ["commit-in-foreign-soi"]
D14 = ["laythe", "vall", "jool", "warp-rails", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC, over the PARSEK-STRIPPED fixture.
#   +0  the fixture. `laythe-park-nerv` has no `Parsek/` directory at all, so it
#       ships ZERO `.prec` and ZERO committed trees by construction. (The SOURCE
#       `laythe-orbit-recorded` ships ONE, and 1 is therefore NOT a useful
#       watch-for number here the way B25's 5 was - the tell for a failed strip on
#       this lane is the recording's LAUNCH BODY, which no expectation can express.)
#   +1  THIS lane's product: the stack flies the whole hop as one piece; there is
#       no staging event anywhere in the profile.
#   = 1 EXPECTED.
#   +1  HEADROOM, admitted rather than predicted, for ONE class: an optimizer
#       split. **AND THE PREDICTION IS GENUINELY LESS CONFIDENT HERE THAN ON ANY
#       PRIOR LANE**, which is why the range is kept rather than tightened. The
#       four earlier lanes each had exactly ONE body change on a same-class Exo
#       transfer coast, where section-3 rule 3 keeps the boundary COHESIVE, and
#       all four measured `exoCoastBodyChangeKept=1`. THIS recording has **TWO**
#       body changes (Laythe->Jool and Jool->Vall) and they are not the same
#       shape: the first is an ESCAPE under thrust, the second a rails arrival.
#       Rule 3's cohesion applies to a same-class Exo body change on a transfer
#       COAST; whether an ejection boundary qualifies is exactly what nobody has
#       measured. A count of 2 or 3 here is a READING, not a defect.
#   +1  A THIRD BOUNDARY CANDIDATE THE RELAY ADDS, and it is the one change this
#       mode makes to the predicted topology. The stage-2 transfer burn is a
#       PROPULSIVE run in the MIDDLE of the Jool coast, i.e. an
#       ExoBallistic -> ExoPropulsive -> ExoBallistic sandwich with no body
#       change - which section 3's rule 6 would split on, and which rule 7's
#       graze collapse should then SUPPRESS, because the run is 51-103 s long
#       against `BriefSectionMaxSeconds = 120`. "Should" is a prediction, and the
#       ESCAPE burn beside it (~127 s) sits on the OTHER side of the same 120 s
#       line, so the two propulsive runs are not even predicted to behave alike.
#       The window admits the alternative reading rather than redding it.
# => { min = 1, max = 4 }, a DERIVED RANGE and NOT A PIN - one wider than the
# pre-relay {1,3} for the third boundary candidate, and two wider than every
# predecessor's {1,2}.
#
# THE COUNT IS COMMIT-BLIND (the standing note): sidecars are written for the
# active uncommitted tree too, so this window guards recording TOPOLOGY only and
# is NOT evidence that the commit ran. The commit is guarded by the tokens below.
count = { min = 1, max = 4 }

[expectations.logContracts]
#   "Recording started" / "Recording stopped" - the standing lifecycle floor. It
#       proves a recording exists, NOT that this lane opened one (B23 flight 1
#       measured all five of its `Recording started` lines coming from the
#       committed-restore promotion path while the seam answered `already=true`).
#       What it does not cover is covered by the FIXTURE.
#   "SOI change boundary suppressed in tree mode: Laythe to Jool" - the ESCAPE.
#       This is the token that proves the ejection actually happened rather than
#       the craft sitting in its start park, and NO PRIOR LANE HAS ASSERTED A
#       MOON-TO-PARENT ESCAPE.
#   "SOI change boundary suppressed in tree mode: Jool to Vall" - the ARRIVAL.
#       Together the two are the only evidence that the coast really ran in Jool's
#       frame; a lane that somehow reached Vall without the first token would have
#       done something this spec does not describe.
#   "CommitTreeFlight: starting tree commit at UT=" - the commit path was entered.
#   "CommitTreeFlight terminal: rec=\\w+ terminalState=Orbiting
#       terminalOrbitBody=Vall" - the headline claim's only real evidence:
#       "starting tree commit at UT=" is logged unconditionally, so before this
#       token a tree that ended around LAYTHE or JOOL would produce byte-identical
#       evidence to one that ended around VALL.
#
# FORBIDDEN is the ERROR floor PLUS the SIX named-poison tokens for the three
# moons this transfer must not touch (Tylo, Bop, Pol), in both directions. The
# B17 pattern - **AND THE RELAY CHANGED WHAT THEY ARE WORTH, WHICH IS THE ONE
# THING IN THIS FILE THE UNAIMED ESCAPE MADE WORSE RATHER THAN BETTER.**
#
# THE PRE-RELAY CLAIM WAS "GEOMETRICALLY EXCLUDED": a Hohmann coast climbs from
# Laythe's 27.184 Mm to Vall's 43.152 Mm and reaches no further, while Tylo sits
# at 68.5 Mm, Bop at 128.5 and Pol at 179.89. That claim rested on the ejection
# being AIMED. **IT NO LONGER HOLDS AT THE EXTREME.** Swept over the whole family
# of unaimed escapes - every v_rel direction, and every exit point on Laythe's
# 3.7236 Mm SOI shell - the parent-frame orbit the escape delivers has an
# apoapsis of up to **87.18 Mm**, which is ABOVE Tylo's 68.50 Mm shell. (The
# extreme is the prograde direction taken at the OUTWARD side of the SOI, where
# the exit radius is 30.91 Mm rather than 27.18.) Crossing a shell is necessary,
# not sufficient - an encounter also needs the phase - and the stage-2 burn
# lowers the apoapsis to Vall's as soon as the coast reaches Jool's frame. But
# the honest statement is now "unlikely and unguarded by geometry", not
# "impossible".
#
# THE NUMBER MOVED WITH FLIGHT 2's FIX AND IT MOVED UP, from a pre-flight 71.28
# to 87.18, because the delivered excess is the SOI-boundary speed (450) rather
# than the asymptotic one (347.245) the first cut believed. Under the contract
# flight 2 ACTUALLY FLEW the same sweep reaches **17,335 Mm** and includes
# samples that leave Jool's SOI entirely - so these tokens were, on that flight,
# guarding something considerably more real than "unlikely".
#
# SO THESE SIX TOKENS ARE A REAL GUARD ON THIS LANE, not the cheap restatement of
# geometry they were. They mirror a machine-side guard that already exists:
# `_b5_coast_bodies` is `("", "Laythe", "Jool")`, so any of the three is an
# immediate ASSERT-FAIL. Bop and Pol stay geometrically excluded (128.5 and
# 179.89 Mm are far above the 71.28 Mm extreme) and are kept for symmetry and for
# the day someone aims a relay somewhere else.
#
# **NOTHING RE-AIM IS FORBIDDEN OR REQUIRED ANYWHERE IN THIS FILE**, and that is
# deliberate. B26 produces the subject; the routing question belongs to V17M/V17T,
# which leave `[ReaimDiag]` / `ENGAGED re-aim` / `FORCED FAITHFUL` unrequired AND
# unforbidden so their reading runs can MEASURE which road a cross-parent
# recording takes. Adding any of them here would pre-judge that.
#
# THE FLIGHT-2 OBSERVATION TARGETS, written down before the flight and RANKED by
# how likely each is to be what ends the run:
#   (1) WHAT `OperationTransfer` DOES FROM THE ORBIT AN UNAIMED ESCAPE LEAVES.
#       This replaces flight 1's open question and is the new likeliest failure.
#       The moon-path Hohmann has only ever been asked to plan from a ROUND,
#       UNINCLINED park; here it is asked from an orbit that can be eccentric
#       (a up to 35.17 Mm, or down to 22.58 Mm) and inclined up to ~1.7 deg to
#       Jool's plane. If it refuses, `node_count` stays 0, the plan warning lands
#       in the mission stdout and the lane flakes in PLAN-TRANSFER - loud and
#       bounded, exactly as flight 1's refusal was.
#   (2) THE STAGE-2 NODE DV against the 102.8 / 600.0 / 900.0 band. This is the
#       measurement that says what the un-aimed escape actually cost, and it is
#       the number to read BEFORE reacting to anything else on this list.
#   (3) THE ESCAPE NODE ITSELF: the machine logs `escape node added ut=...
#       prograde=...` with a read-back, and its own carried evidence rides the
#       `escapedHomeSoi` assertion row. It should read **586.69 m/s**; a
#       materially different number means the fixture's park is not the one this
#       spec sized against. FLIGHT 2 read 774.705 under the pre-fix contract and
#       executed it to within 1% (LF 534.869 -> 351.228 = 767.4 m/s measured), so
#       this channel is PROVEN to report the truth - what was wrong was what it
#       was told to aim at.
#   (3b) THE DELIVERED JOOL ORBIT at the stage-2 PLAN-TRANSFER frame, against the
#       a = 17.2 - 59.0 Mm band. Flight 2 read a = 79.0 Mm (ap 126.33 Mm), OUTSIDE
#       the band the fixed contract predicts, which is the single cleanest
#       pass/fail on defect A.
#   (3c) `warpToCmd` GATE-FLIP COUNT on the stage-2 coast, and
#       `phaseWarpIssues` at the end of it. Flight 2 spent 501 native warp issues
#       there against a 500 cap; a healthy coast spends a handful. This is
#       defect B's pass/fail.
#   (4) THE OPTIMIZER'S ANSWER AT UP TO **THREE** BOUNDARIES (see the count
#       block). The load-time pass runs first on V17's LoadGame, as always.
#   (5) THE DELIVERED ARRIVAL PERIAPSIS against the 250,000 m request - a fifth
#       point for the finding-16d corpus, and the first at a body with no
#       atmosphere and a small mu.
required  = [
  "Recording started",
  "Recording stopped",
  "SOI change boundary suppressed in tree mode: Laythe to Jool",
  "SOI change boundary suppressed in tree mode: Jool to Vall",
  "CommitTreeFlight: starting tree commit at UT=",
  "CommitTreeFlight terminal: rec=\\w+ terminalState=Orbiting terminalOrbitBody=Vall",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The three moons this transfer must not touch. Under the relay these are a
  # REAL guard rather than a restatement of geometry: an unaimed escape's
  # parent-frame apoapsis reaches 71.28 Mm at the extreme, past Tylo's 68.50 Mm.
  # See the derivation above.
  "SOI change boundary suppressed in tree mode: \\w+ to Tylo",
  "SOI change boundary suppressed in tree mode: Tylo to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Bop",
  "SOI change boundary suppressed in tree mode: Bop to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Pol",
  "SOI change boundary suppressed in tree mode: Pol to \\w+",
]

[expectations.rewind]
# REPORT-ONLY (the ARMED_ALLOWLIST discipline). A clean single-craft flight with
# no separation event and no re-fly must author no RewindPoint, no supersede row
# and no tombstone; B17, B23, B24 and B25 all measured 0/0/0. If this flight
# disagrees that is a finding about what a moon-to-moon transfer does to the
# durable surfaces, and the honest response is to read it.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# [expectations.recordings.structure] and the points facets are DELIBERATELY
# ABSENT: the shape is PREDICTED, not measured, and a report-only block of
# invented numbers reads like a measurement. Author them from flight 2's saveParse
# facets - and note this is the first lane whose predicted TOPOLOGY is genuinely
# uncertain (anywhere from one recording to four, per the count block).

[runtime]
# WALL arithmetic (the mission budget is WALL; the missionParams budgets are GAME
# seconds):
# **RE-DERIVED FOR THE RELAY, WHICH ADDS A WHOLE SECOND PLAN+BURN PASS.** The
# pre-relay arithmetic priced ONE transfer burn; there are now two, and the
# expensive part of each is MechJeb's own ~600 s 1x pre-ignition WARPALIGN hold
# rather than the burn.
#   LoadGame                      300  declared
#   preamble seam verbs           ~10
#   PRELAUNCH orbit-start gate     ~5
#   ESCAPE                        ~15  the node is computed and added on the first
#                                      readable frame; a wait for a usable
#                                      periapsis is at most 2,241 game s at the
#                                      x10 plan hold = ~224 s, and only when the
#                                      entry frame lands inside the min lead
#   TRANSFER-BURN (stage 1)      ~720  the executor autowarps <= 2,241 game s to
#                                      the node (seconds on rails), ~600 of this
#                                      is the 1x pre-ignition hold, plus ~96 s of
#                                      escape burn (flight 2 measured the 127 s
#                                      version of this burn; the fix shortens it)
#   COAST to the Laythe SOI exit  ~25  5,181 game s of elliptic coast (the
#                                      correctly-sized escape is BOUND, so this
#                                      is longer than the pre-fix hyperbola's
#                                      2,783 s and it is paid on rails), and
#                                      NOTE IT RIDES THE RAILS STAIR RATHER THAN
#                                      A NATIVE WARP: `soiLeadSeconds` (3,000) is
#                                      LONGER than the whole escape coast, so
#                                      `time_to_soi > soi_lead` is never true on
#                                      this leg and the coast takes its held
#                                      rails fallback - x1,000 down to ~500 game
#                                      s out, then x100, then x50 into the
#                                      boundary. Correct rather than mis-sized:
#                                      the lead is aimed at the VALL arrival,
#                                      where the SOI-entry -> periapsis coast is
#                                      what must not be warped past. It costs
#                                      ~15 wall s instead of ~3, which is the
#                                      whole consequence
#   PLAN-TRANSFER (stage 2)       ~30  300 game s at the x10 plan hold
#   TRANSFER-BURN (stage 2)      ~730  the autowarped window wait (<= 105,961 game
#                                      s) is seconds on rails; ~600 the 1x hold,
#                                      plus ~51-103 s of transfer burn
#   COAST-TO-TARGET              ~290  the leg is only 38,980 game s, so even the
#                                      x1,000 rails fallback is 39 wall s; the
#                                      priced part is the 10,000 game-s clamped
#                                      approach window at x50 = 200 wall s
#   two correction rounds       ~1000  each: plan + a ~340 s attitude flip at 2x
#                                      physics + aim-warp + a short burn
#   TARGET-FLYBY                  ~80  3,886-4,149 game s at the x10/x50 stair
#   PLAN-CAPTURE                  ~30
#   CAPTURE-BURN                 ~650  ~600 of it the 1x pre-ignition hold, plus
#                                      ~54 s of burn
#   PARK                         ~180  parkDwellSeconds of GAME time at 1x
#   ORBIT-COMMIT                 <120
#   => ~4,205 nominal. WORST adds up to two arrival-quality extra rounds (+1,000),
#      one bounded stale-node re-plan (+90 s of grace and a second ~600 s
#      pre-ignition hold), a missed first intercept costing one synodic of
#      autowarp, and one extra park orbit before the escape node (+225) => ~6,200.
# missionBudget 6,600 is ~1.57x nominal and just over that worst case.
# NOTE 6,600 is 1.22x the pre-relay 5,400, and the whole increase is the SECOND
# plan+burn pass - about 745 of the ~800 added seconds is MechJeb's own 1x
# pre-ignition WARPALIGN hold, not the burn.
# runtime 7,300 >= 300 + ~10 + 6,600 + ~60 FlushAndQuit + ~330 margin (SF-5).
budgetSeconds = 7300

[retry]
# The transient risks are kRPC / MechJeb flakes. One retry prices the flake class.
# It does NOT absorb a systematic failure - a MechJeb refusal of the stage-2 plan
# from an eccentric post-escape orbit, an escape node that is never computable, an
# ejection floor that never trips, or a correction discarded at the cap all
# reproduce on attempt 2 and name themselves, which is what a first flight is for
# (and flight 1 is the standing proof: its refusal was identical to six decimals
# across both attempts). AND NOTE WHAT ONE RETRY COSTS: two full attempts is up to
# 14,600 wall s.
policy = "once"

[expectedFail]
bugId = ""
