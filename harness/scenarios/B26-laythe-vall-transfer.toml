# =====================================================================================
# B26: THE FIRST MOON-TO-MOON TRANSFER. The crewed Duna Rocket starts ALREADY
# PARKED in the 87,931 x 56,240 m Laythe orbit B25 delivered, escapes Laythe into
# JOOL's frame, transfers to VALL, captures into a Vall park and commits the tree
# there. THE RECORDING IS THE PRODUCT.
#
# WHY THIS LANE EXISTS, and it is NOT "a sixth moon". It is the M-MIS-7 SUBJECT -
# the recording that lets someone finally measure a code path the research doc
# says is live and untested.
#
# EVERY same-parent lane so far (B23 Duna->Ike, B24 Eve->Gilly, B25 Jool->Laythe)
# produces a recording whose launch body is the target's PARENT.
# `IsSameParentTarget` classifies those SAME-PARENT, so they route to PHASE-LOCK,
# and all three measured the same road: `constraints=1`, `method=single-orbital`,
# residual 0. **A MOON-TO-MOON RECORDING IS THE OTHER CLASS.** Vall is not a child
# of Laythe, so a Laythe-rooted recording targeting Vall is CROSS-PARENT:
# `MissionConfig loop=true` should reach `ApplyReaim` rather than the phase-lock
# solver, and `ReaimWindowPlanner.Plan` should space its windows on the JOOL-FRAME
# synodic of the two moons.
#
# `docs/dev/research/same-parent-reaim-jool-system.md` section 5.1 walks
# `TrySynthesizeTransfer` guard by guard for exactly this shape and concludes that
# the synthesizer "already works in a Jool-centric frame for P3 today,
# unmodified", and calls that "the single most surprising finding in this
# investigation: Parsek may already be re-aiming moon-to-moon hops. It is
# untested, unmeasured, and unrepresented in any harness lane."
#
# **THIS SPEC ASSERTS NOTHING ABOUT THAT.** B26's job is to fly the hop and commit
# the recording. `V17M-laythe-vall-player-loop` and `V17T-laythe-vall-ts-arrival`
# are the lanes that read the routing, they carry BOTH hypotheses and the log
# lines that discriminate, and they gate on neither. Nothing below requires,
# forbids or predicts a re-aim outcome.
#
# PHASE-0 DOOR: existing fixture, NO FORGE FLIGHT -- via a PARSEK-STRIPPED DERIVED
# COPY, `laythe-park-nerv`, the FOURTH of its kind after `duna-park-probe` (B23),
# `eve-park-kerbalx` (B24) and `jool-park-nerv` (B25). See [fixture].
#
# =====================================================================================
# FLIGHT LEDGER
# =====================================================================================
#
# FLIGHT 1 (2026-08-19, runs `2026-08-19_2214` and `2026-08-19_2215_a2`):
# BOTH ATTEMPTS INVALID(autopilot-flake), DETERMINISTIC, and the lane is now
# BLOCKED-PENDING a harness transfer capability. NOTHING IN THIS SPEC IS AT FAULT
# AND NOTHING IN PARSEK IS AT FAULT. State the verdict that way and no other way.
#
# THE MEASURED CAUSE, verbatim from the a2 mission stdout (a1 identical to six
# decimals, three occurrences per attempt):
#
#   [Mission][Warn][Plan] operation_interplanetary_transfer.make_nodes failed:
#   OrbitExtensions.NextTimeOfRadius: given radius of 3723645.81113302 is never
#   achieved: o.PeR = 572085.800578244 and o.ApR = 3632679.92883477
#
# followed by `at KRPC.MechJeb.Maneuver.Operation.MakeNodes ()`.
#
# READ THE THREE NUMBERS. 3,723,645.81113302 m IS LAYTHE'S SOI RADIUS -- MechJeb's
# `OperationInterplanetaryTransfer.MakeNodes` asks when the vessel's orbit next
# reaches its origin body's SOI, and the orbit it asks that of has no such radius.
# The orbit is NOT this lane's park orbit (ecc 0.028): PeR 572,085.800578244 sits
# 0.003 m from the fixture park's SMA 572,085.80370560708, and ApR 3,632,679.93
# gives e = 0.7279 -- i.e. MechJeb idealised the origin to a circle at the park's
# mean radius and built a SUB-ESCAPE ejection whose apoapsis lands
# **90,965.88 m (2.443%) SHORT of the SOI**, then asked for a crossing that
# therefore does not exist and threw. WHAT IS ESTABLISHED is that this code path
# does not handle a MOON-PARKED ORIGIN, whose park radius is a fifth of its SOI;
# every flown interplanetary lane departs KERBIN, where the SOI is 12x the park
# radius and the same construction escapes comfortably. WHAT IS **NOT**
# ESTABLISHED, and must not be written down as if it were, is why MechJeb sizes
# the ejection short -- that lives inside MechJeb 2.15.1 and was not read.
#
# EVERYTHING ELSE ON THE FLIGHT BEHAVED. Admission, the venv gate, the fixture,
# the ORBIT-START door and the preamble are all clean: `assert reachedOrbit
# value=PLAN-TRANSFER met=True`, `assert startedInHomeOrbit value=0.028 met=True`,
# phasesReached `['PRELAUNCH', 'ORBIT', 'PLAN-TRANSFER']`. TARGET ACQUISITION
# WORKED -- `action set_target_body value=none text=Vall` ran and `tgtD` snapped
# from 584,660 m (no target) to 59,303,828 m, which is Vall's actual separation.
# The refusal is one call deep and one call only.
#
# THE FLIGHT WAS CHEAP: mission wall 5.955 s / 5.976 s to refusal, ~33 game
# seconds, 46 s total per attempt. This is the good failure mode -- a planner that
# refuses in six seconds costs nothing, unlike a phase that rides its budget.
#
# DISPOSITION: **BLOCKED-PENDING** a harness transfer capability for MOON-ORIGIN
# ejections. Filed report-only as `docs/dev/todo-and-known-bugs.md` ->
# MECHJEB-INTERPLANETARY-PLANNER-REJECTS-MOON-ORIGIN. The spec stays committed and
# its dry-run stays valid; it is FLYABLE-BUT-BLOCKED, not withdrawn, because the
# moment the capability exists this is the lane that uses it and every derived
# number below was checked against the fixture's own bytes.
#
# TWO CANDIDATE PATHS FORWARD. **NEITHER IS CHOSEN HERE**, and inventing a
# transfer mechanism was explicitly out of scope for the night that measured this.
#   (a) A FLAG-GATED MANUAL-EJECTION MODE: mlib computes the ejection node itself
#       and MechJeb only executes it. The precedent is PAD-ALIGN, whose window
#       math is already frame-generic -- the only Sun-hardcoded piece is
#       `STOCK_HELIO_ELEMENTS`, which is a TABLE, extendable with Jool-system
#       elements or replaced by live kRPC elements. The Vall encounter itself then
#       does NOT need to come out of the ejection: the EXISTING Jool-frame
#       correction rounds create it, which is the B17 round-0-creates-the-encounter
#       pattern and is already live-proven.
#   (b) A DIFFERENT MECHJEB OPERATION SET: escape Laythe with a plain ejection
#       operation, then Lambert / course-correct to Vall from Jool orbit.
# (a) IS THE HOUSE-STYLE FIT -- pure decision in mlib, thin execution in the
# runner, and it reuses a proven correction loop rather than adding a mechanism.
# It is DEFERRED AS ITS OWN PROGRAM, not smuggled into this lane.
#
# WHAT THIS DOES **NOT** BLOCK. The PRODUCT question stays open and stays
# pre-registered: whether `ApplyReaim` engages on a cross-parent moon-to-moon
# recording is a Parsek question, this flight said nothing about it, and V17M /
# V17T still carry both hypotheses and still gate on neither. What is blocked is
# the harness's ability to PRODUCE the subject recording.
#

# =====================================================================================
# THE JOOL-FRAME AUDIT. Read this before changing any transfer key; it is the only
# part of this spec that is about the MACHINE rather than about Vall.
#
# This lane composes two live-proven blocks that have never met: the
# INTERPLANETARY transfer path (B7/B15/B16/B17/B19/B20/B21/B22 - always from
# KERBIN with the SUN as the transfer frame) and the ORBIT-START entry door
# (B23/B24/B25 - always on the MOON path). Jool plays the structural role the Sun
# plays on every flown interplanetary lane. Both `mlib.py` and `mission_runner.py`
# were swept end to end before this spec was written.
#
# **VERDICT: CLEAN, VALUES ONLY.** Nothing in either file was touched. The
# findings, each stated so it is checkable rather than asserted:
#
#   (1) THERE IS NO SUN-FRAME ASSUMPTION ON THE b5 INTERPLANETARY PATH. Every
#       frame-dependent quantity is derived from params (`home_body`,
#       `target_body`, `via_bodies`, `return_body`) or read live from the game
#       (`orbit.body.name`; the runner's one parent lookup is
#       `parent_name = str(target.orbit.body.name)`, which for Vall reads "Jool").
#       Nothing does `vessel.orbit.body.orbit.body` and nothing names a frame.
#   (2) THE HELIOCENTRIC EPHEMERIS IS REAL SUN-HARDCODING AND IS QUARANTINED.
#       `STOCK_HELIO_ELEMENTS` carries only Kerbin/Duna/Eve and `_helio_elements`
#       RAISES on an unknown body - but its whole family
#       (`interplanetary_phase_angle_deg`, `classical_hohmann_phase_angle_deg`,
#       `next_ejection_window_ut`) has exactly THREE live call sites and all three
#       sit inside `if params.pad_align_ejection:`, plus a flag-gated load-time
#       check in `b5_params_from_dict`. With the flag absent, "Laythe" and "Vall"
#       never touch that table. **`padAlignEjection` MUST STAY ABSENT** - it is
#       structurally unreachable anyway (PRELAUNCH checks `start_in_orbit` FIRST
#       and returns unconditionally), and arming it would `ValueError` at spec
#       load. A loud failure, but not one worth provoking.
#   (3) THE PHASE ANGLE IS ENTIRELY MECHJEB'S. `_b5_transfer_plan_action` emits
#       `ACTION_MJ_PLAN_INTERPLANETARY_TRANSFER` with no body and no angle; the
#       runner's handler writes exactly ONE property
#       (`op.wait_for_phase_angle = not (action.value == 0.0)`, which with
#       `padAlignEjection` off means TRUE, the live-proven window-wait path) and
#       calls `make_nodes()`. mlib contributes no angle, no synodic and no window
#       UT on this path.
#   (4) `ejectionEccFloor` READS THE RIGHT FRAME. `_b5_transfer_burn_done`'s ecc
#       branch is gated on `snapshot.body == params.home_body` -> "Laythe", and
#       `snapshot.eccentricity` is always parent-relative, so a Laythe escape
#       drives a LAYTHE-frame hyperbolic reading. The early return
#       (`snapshot.body in via_bodies`) fires correctly once the craft is in
#       Jool's SOI - structurally identical to B7's `body == "Sun" in ("Sun",)`.
#   (5) THE CORRECTION DOMAIN IS EXACT. `_b5_correction_via_bodies` returns
#       `(return_body,)` = `("Jool",)` when interplanetary, and its documented
#       precondition (`return_body` must be a member of `via_bodies`) holds as an
#       identity here: `"Jool" in ("Jool",)`. The narrowing can neither add nor
#       remove a firing opportunity. Its pinning cell in `test_shells.py` is
#       roster-scoped to B7/B15/B16, so a new lane cannot red it - and this lane's
#       params would satisfy it anyway.
#   (6) THE WARP TABLE ALREADY CARRIES ALL THREE BODIES.
#       `mlib.STOCK_WARP_ALTITUDE_LIMITS` has rows for "Jool", "Laythe" AND
#       "Vall", so the factor-clamp is data-complete. (A MISSING key would fail
#       OPEN to factor 7 with the server clamp as backstop, never crash - moot
#       here, but worth knowing.)
#   (7) `startInOrbit` COMPOSES WITH `interplanetaryTransfer` WITH NO COUPLING.
#       PRELAUNCH checks `start_in_orbit` first and returns unconditionally, so
#       PAD-ALIGN and the ascent kickoff are unreachable; the orbit-start step
#       enters the ORBIT waypoint, which hands to the SINGLE shared
#       `_b5_enter_plan_transfer` seam that reads `interplanetary_transfer`.
#       Nothing reads ascent state on this path: `mj_ascent_complete` is read only
#       inside the MJ-ASCENT branch, `peak_apoapsis` is carried but never read in
#       a gate, the `launch_ut` stamp's only readers are pad-align-only rows, and
#       orbit-start emits no actions at all on entry. `b5_params_from_dict` does
#       not reject the pair.
#
# THREE VALUE-LEVEL CONSEQUENCES THE AUDIT NAMED, all handled at their own keys
# below and listed here so none is discovered on a flight:
#   * `correctionTriggerTimeToSoiSeconds` MUST be re-sized. B7's [20,000,000;
#     500,000] against a 38,980 s leg would fire BOTH rounds on the first
#     Jool-SOI frame - the B15-flight-5 failure SHAPE reached by a different
#     route. See that key.
#   * `ejectionEccFloor` MUST be re-calibrated. B7's 1.05 would NEVER BE REACHED
#     here: the required Laythe ejection hyperbola has ecc 1.0352. See that key -
#     this is the single most flight-costing value in the file.
#   * `ARRIVAL_RECORRECT_MIN/MAX_TTS_SECONDS` (600 / 3,600) are hardcoded module
#     constants sized against Duna's arrival leverage, NOT spec-overridable. They
#     may open the extra-round window at an unhelpful moment for a Vall approach.
#     Every term fails closed and `MAX_ARRIVAL_EXTRA_ROUNDS = 2` bounds it, so the
#     worst case is extras that buy little. Watch it on flight 1; do not pre-tune.
#
# **THE ONE THING THE AUDIT COULD NOT ANSWER**, stated plainly because it is the
# likeliest way flight 1 fails: whether MechJeb 2.15.1's own
# `OperationInterplanetaryTransfer` accepts a JOOL-PARENTED pair. The pinned notes
# in `docs/dev/design-autotest-b7-duna.md` describe only `WaitForPhaseAngle` and
# assert no Sun requirement, but that is absence of evidence. If MechJeb refuses
# it throws server-side, the runner logs and swallows, `node_count` stays 0, and
# the bounded re-plan cadence ends in a PLAN-TRANSFER flake - loud and bounded,
# never silent. It is a MECHJEB question, not a Parsek one.
#
# =====================================================================================
# THE DELTA-V, DERIVED END TO END from the fixture's own bytes and the stock
# constants. Nothing is scaled from another lane.
#
# WHAT THE CRAFT HAS, read off `laythe-park-nerv/persistent.sfs` (unchanged by the
# strip) - the SAME vehicle B25 flew, minus what B25 burned:
#   structural 6.780 t (identical part list to B25: mk1pod.v2, HeatShield1,
#     Decoupler.1, 6x MK1Fuselage, nuclearEngine, 4x radialDecoupler, 8x noseCone,
#     8x strutConnector, 4x fuelLine, 2x solarPanels2, 2x radialDrogue, commDish,
#     parachuteSingle)
#   + Ablator 200/200 x 0.001 = 0.200 t  <- UNCHANGED from B25's start, i.e. the
#     capture produced NO entry heating, which is the expected reading for a
#     vacuum capture and is checked rather than assumed
#   + MonoPropellant 10 x 0.004 = 0.040 t + ElectricCharge 49.99983 x 0 = 0
#   + 1 crew ~0.16 (Valentina, kerbal 0.09375 + stock inventory)
#   => DRY / BURNOUT 7.180 t, identical to B25's
#   PROPELLANT: LiquidFuel **534.869** / 2400 at 0.005 t/unit = **2.674 t**
#     (B25 started with 945.082 and spent 410.213)
#   => WET 9.854 t
#   nuclearEngine (NERV): Isp 800 s vac, 60 kN, 3.0 t
#   => dv = 800 * 9.80665 * ln(9.854 / 7.180) = **2,483.9 m/s**
#
# WHAT THE HOP COSTS. Stock constants: mu_Jool 2.82528e14, a_Laythe 27,184,000,
# a_Vall 43,152,000, mu_Laythe 1.962e12, R_Laythe 500,000, mu_Vall 2.074e11,
# R_Vall 300,000, SOI_Vall 2,406,401.4. Vall has NO ATMOSPHERE and terrain to
# ~8 km.
#
#   THE TRANSFER, in JOOL's frame: a_t = 35,168,000, ecc_t = 0.22702
#     v_Laythe 3,223.84   v at transfer periapsis 3,571.08  => v_inf DEPART 347.24
#     v_Vall   2,558.80   v at transfer apoapsis  2,249.68  => v_inf ARRIVE 309.12
#     TOF = pi*sqrt(a_t^3/mu) = **38,979.9 game s** (0.74 Laythe periods)
#   THE EJECTION, from the measured 572,085.804 m park radius:
#     v_circ 1,851.9   v_eject = sqrt(v_inf^2 + 2*mu/r) = 2,641.9
#     => COPLANAR EJECTION **790.0 m/s**, on a hyperbola of ecc **1.0352**
#   THE PLANE TERM, and it is this lane's one uncomfortable number. The two MOONS
#     are coplanar about Jool (both inc 0), but the CRAFT'S PARK IS INCLINED
#     **16.372 deg** about Laythe - B25 delivered it that way and nothing has
#     trimmed it. The ejection asymptote must lie in Jool's plane, so some plane
#     component is unavoidable. Bounds:
#       pure plane change at the park (worst, and not what a planner does)  527.4
#       folded into the ejection burn vectorially (the pessimistic single-burn
#         bound: |v_eject - v_circ| with a 16.372 deg turn)               1,010.4
#     The table below carries **1,010.4**, the pessimistic folded figure.
#   THE CAPTURE at Vall, `sqrt(v_inf^2 + 2*mu/r_p) - sqrt(mu/r_p)`:
#     pe alt  20 km -> 374.7     pe alt 100 km -> 344.1
#     pe alt  30 km -> 370.2     pe alt 300 km -> 299.1
#     pe alt  60 km -> 358.0     pe alt 600 km -> 265.9
#
# THE VERDICT:
#   available            2,483.9 m/s
#   WORST hop            1,385.1 m/s  (1,010.4 pessimistic ejection + 374.7
#                                      capture at the 20 km park floor, which is
#                                      the most expensive capture the window
#                                      admits)
#   => MARGIN 1,098.8 m/s, i.e. 79% over the worst hop and 44% of the tank.
# Comfortable, but NOT the 152% B25 had - and the difference is entirely the
# inclined park. If flight 1 shows the ejection priced near the 1,010 bound rather
# than near 790, that is the plane term being paid in full and it is expected.
#
# =====================================================================================
# THE ORBITS, AND ONE PLEASING FACT.
#   P_Laythe  =  52,980.879 game s
#   P_Vall    = 105,962.090 game s
#   SYNODIC   = 1/|1/P_L - 1/P_V| = **105,961.428 game s = 2.0000 P_Laythe**
#
# THE SYNODIC IS ESSENTIALLY ONE VALL PERIOD, and that is the 1:2:4 LAYTHE-VALL-
# TYLO RESONANCE showing up in the transfer window rather than in a scheduler.
# `P_Vall - 2*P_Laythe = +0.3 s` (research doc section 3.2), so the two bodies
# return to the same relative geometry once per Vall orbit almost exactly. The
# window wait is therefore at most ~29.4 hours of game time and RECURS ON A CLEAN
# CADENCE - which is also why this pair is the right FIRST moon-to-moon subject
# rather than, say, Vall->Bop (synodic 131,565 s, incommensurate).
#
# =====================================================================================
# THE APPROACH REGIME AT VALL IS **GRAVITY-LEANING**, the fourth distinct answer
# in four lanes, and the sizing floor follows from it:
#   2 * mu_Vall / r_soi = 2 * 2.074e11 / 2,406,401.4 = 1.7238e5 m^2/s^2
#   v_inf^2             = 309.12^2                   = 9.5556e4
#   ratio                                            = **0.554**
#   (Ike 0.24 gravity-dominated, Laythe 1.445 mixed, Gilly 11,600 negligible)
# So the approach hyperbola is solved properly (B23's method), a = -mu/v_inf^2 =
# -2,170,300 m:
#   pe alt  20 km  e = 1.1474   SOI-entry -> periapsis **3,871.8 game s** <- FLOOR
#   pe alt  30 km  e = 1.1520                          3,884.3
#   pe alt  60 km  e = 1.1659                          3,920.7
#   pe alt 100 km  e = 1.1843                          3,966.5
#   pe alt 300 km  e = 1.2764                          4,149.2
#   pe alt 600 km  e = 1.4147                          4,281.6
# SIZE AGAINST 3,860 GAME SECONDS - taken at the 20 km PARK floor rather than at
# the 30 km arrival floor, which is the conservative reading.
#
# THE THREE-RULE WARP CONTRACT (B21's header):
#   RULE 3 -> approachMaxWarpFactor 3 (x50). Budget = 3,860/5 = 772 game s/frame.
#       factor 5 = x1,000 FAILS; factor 4 = x100 passes at 7.8x margin; factor 3 =
#       x50 PASSES at 15.5x. **x100 IS REJECTED FOR A SECOND, HARDER REASON THAN
#       MARGIN**: `STOCK_WARP_ALTITUDE_LIMITS["Vall"]` puts factor 4's floor at
#       40,000 m, ABOVE this lane's 30,000 m arrival floor, so a commanded x100
#       would be clamped down anyway on the last stretch. Factor 3's floor is
#       24,500 m and is legal all the way to the floor. Price: the clamped stretch
#       is approachWindowSeconds/50 = 200 wall s.
#   RULE 1 -> coastWarpFactor 5 (x1,000), soiLeadSeconds 3,000 (6x one nominal
#     0.5 s poll at that rate). The whole 38,980 s coast at the rails cap costs
#     just 39 wall s, so unlike every interplanetary sibling there is no reason to
#     reach for x10,000: this leg is three orders of magnitude shorter than B7's.
#   RULE 2 -> approachWindowSeconds 10,000: 3.3x the lead, and >= 2x one
#     PESSIMISTIC 4 s coast frame at x1,000 (4,000 game s), which is the binding
#     form.
#   IN-SOI PAIR: flybyWarpFactor 2 (x10) / flybyMaxWarpFactor 3 (x50), both at or
#     under the approach ceiling; x10's altitude floor is 24,500 m, legal down to
#     the arrival floor.
#
# =====================================================================================
# COMMIT ACCOUNTING. EXACTLY ONE commit: the MID-MISSION one from ORBIT-COMMIT via
# the route-1 seam bridge. NO post-mission CommitTree - the seam's CommitTreeImpl
# answers ERROR `no-active-tree` when no tree is live, which after the mid-mission
# commit is the expected state, and the step would make every green flight
# driver-INVALID (the B11/B17/B23/B24/B25 accounting rule verbatim).
#
# THE RECORDING IS CREWED (Valentina Kerman in the mk1pod.v2), like B24's and
# B25's products.
#
# POSTURE: FIRST FLIGHT, READING RUN. Nothing armed - no `gating = true` block,
# the recordings window is the DERIVED {1,2} range, and
# `[expectations.recordings.structure]` / points are ABSENT. `tier = "operator"`
# on the calibration discipline.
