schema = 1
id = "H52-reentry-fx"
tier = "nightly"
# PHASE-4 WAVE 1, the H7-H20 shape. Reentry FX emission gates on a live atmospheric body.
#
# WHAT IT COVERS: the reentry-FX gates - the lazy build on an empty ghost root clearing
# its flag and counting a build, stock's FxScalar driving the ghost sheath offer (part
# parity P9 Y1; this cell replaced the Bug538 fire-particle density cell in place), and
# the speed gate matching the reentry-potential floor. All three read live atmospheric
# parameters off `FlightGlobals.ActiveVessel.mainBody`, which headless xUnit has none of.
#
# THE REACHABILITY ARGUMENT, which is what earns the exact pin. Only ONE of the three
# cells carries a guard at all: `Y1_ReentrySheath_StockScalarDrivesTheGhostSheath`
# skips when the "Active vessel body '{body.name}' has no usable atmosphere for
# reentry-...". gloops-airshow's active vessel sits on KERBIN, which has an atmosphere,
# so the guard cannot fire. The other two carry none. That is the whole scan - and it is
# worth contrasting with H43 in this same wave, where a superficially similar
# "one guarded cell" reading turned out to hide three live-geometry conditions.
#
# THE FORM IS AN EXACT PIN ON FIRST AUTHORING, the H7-H20 precedent, and it is earned
# by a REACHABILITY argument rather than by an absence of guards. What the ordinary
# group's own comment calls "a reachable-Skip scan" is the test: a guard that CANNOT
# fire at this lane's boot is not a source of uncertainty, and pinning around it would
# be superstition. Every guard in this category is enumerated above with the reason it
# cannot fire here. If a first flight reds on the split, do NOT widen the pattern -
# read the skip reason out of the log and correct the reachability argument, because
# one of the statements above is then wrong.
#
# THE CLAIM PASS (2026-09-08, roadmap priority item 3, "the cheap CLAIM half first").
# A whole-tally BATCH_COMPLETE pin asserts that the three cells RAN, not what they
# proved, so this lane claims D6 only through a cell's own post-assertion line. Until
# part parity P9 Y1 (2026-11-27) that was the Bug538 fire-particle cell's
# `Bug538_ReentryFireDensity: ... emissionRate=<n>/s ... playing=true` line (MEASURED on
# `2026-09-08_1108`: emissionRate=2102/s lastIntensity=0.453). Y1 removed the particles
# for stock's sheath, and the second cell, now
# `Y1_ReentrySheath_StockScalarDrivesTheGhostSheath`, writes ONE summary line AFTER its
# last assertion (RuntimeTests.cs, subsystem `ReentryFx`):
#     [Parsek][INFO][ReentryFx] Y1_ReentrySheath: stock scalar drove the ghost sheath on
#         <body>: fx=<f> state=<f> decision=<GhostAeroSheathDecision> meshes=<n> speed=<n>m/s
# Placement is the whole argument: a skipped cell throws at InGameAssert.Skip before
# the body runs, and a failed cell throws at the assertion it failed, so the line is
# printed ONLY by a run in which TryBuildReentryFx collected a live ghost mesh, the
# production UpdateReentryFx computed stock's scalar past one half with full reentry
# heat (state 1.00) on live Kerbin atmospheric parameters, and GhostAeroFxRenderer's
# LateUpdate decided the offered sheath. The decision may read Draw, DetailOff (this
# install's AERO_FX_QUALITY is 0) or NoStockAssets: only stock's own gates can refuse
# an in-reach ghost with one mesh (stock's own fire being on no longer stops the
# ghost's, owner ruling 2026-11-28 01:06), and the regex pins that set.
#
# WHAT THE TOKEN PROVES, AND WHAT IT DOES NOT. It proves the ghost engine's reentry
# FX DRIVER and the sheath offer against live Kerbin atmospheric parameters on a
# SYNTHETIC one-cube ghost root positioned at the active vessel. It does NOT prove what
# the sheath looks like (that is the FxReentryRig picture sheet, design-part-ghost-parity
# G.7 "Y1 design") nor that a REPLAYED recording's trajectory reaches that driver: the
# rendered-replay half is the ghost-replay program's Tier A item 3, which stays open.
# The Y1 line has not flown yet; the first H52 flight after Y1 measures it.
description = "Run the in-game ReentryFx category unattended: the lazy ghost-root FX build, stock's FxScalar driving the ghost reentry sheath offer, and the speed gate matching the reentry-potential floor, all against live atmospheric parameters."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "phase4-wave1", "reentry-fx", "H52"]

[fixture]
# gloops-airshow, the wave host, and the one property that matters is that its
# active vessel is on KERBIN - a body with a usable atmosphere. A host parked at
# the Mun or in deep space would skip the fire-density cell and the pin below
# would be wrong.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# No verboseLogging: the only pinned token is BATCH_COMPLETE (Info), and an
# EXACT-pinned lane has no census to read.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "ReentryFx" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# `reentry-fx` <- the `[ReentryFx] Y1_ReentrySheath: ... fx=<f> state=1.00 decision=<d>`
#   token (post-assertion, cell-level; see the header for the exact scope: the FX driver
#   and the sheath offer on a synthetic ghost root, not a watched replay).
D6 = ["reentry-fx"]
# NOT claimed: any D2 ghost-visual value - these cells assert the FX GATES (flag,
# scalar, speed floor) and the live driver, not that a replayed ghost rendered; H15
# owns the corpus-wide ghost build.
D14 = ["sandbox", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (see H7): run.py reads `expectations.allowedAnomalies`,
# and a bare key written AFTER an `[expectations.<sub>]` header is TOML-scoped to that
# sub-table and never read.
allowedAnomalies = []

[expectations.recordings]
# Zero: nothing here records.
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY: tally pinned WHOLE, and derivable exactly.
#  - total=3 is ATTRIBUTE-EXACT: 3 `[InGameTest(Category = "ReentryFx")]` declarations,
#    all `Scene = GameScenes.FLIGHT`, in `RuntimeTests.cs`. Nothing is batch-disabled, so
#    the ATTRIBUTE FLOOR is 0.
#  - skipped=0 rests on the reachability argument in the header: the single guard in the
#    category is an atmosphere check, and this host is on Kerbin.
#  - failed=0 is the ASSERTION.
#  - passed=3 follows.
#  - scene=FLIGHT is the gloops-airshow Focusable route, MEASURED by H13 / H5 / H29.
#  - the Y1 sheath cell's own post-assertion summary line (see the header): the D6
#    `reentry-fx` claim token. `fx` must read above one half (the cell asserts it),
#    `state` full reentry heat, the decision one of stock's own gates or Draw, and at
#    least one mesh.
required  = ["BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=ReentryFx scene=FLIGHT",
             "\\[ReentryFx\\] Y1_ReentrySheath: stock scalar drove the ghost sheath on Kerbin: fx=(?:0\\.[5-9][0-9]{2}|1\\.000) state=1\\.00 decision=(?:Draw|DetailOff|NoStockAssets) meshes=[1-9][0-9]* speed=[0-9]+m/s"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# 720, the H7-H20 wave convention. NOTE THE INHERITED FLAW rather than repeating it
# silently: both LoadGame and RunTests are deferred seam verbs, so run.py waits
# `required_step_wait(max(budget, 600))` = 660 s on each and the true worst case is
# 1320 - a seam TIMEOUT here can surface as a harness KILL instead of a retryable
# driver-INVALID, and run.py warns about exactly that. H21 documents it for the whole
# family and deliberately did not change 14 committed budgets; this wave joins the
# family rather than forking its own convention. Raising the whole wave is a separate
# change with its own evidence.
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
