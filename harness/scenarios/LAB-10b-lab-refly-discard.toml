schema = 1
id = "LAB-10b-lab-refly-discard"
tier = "operator"
# THE SCIENCE-LAB PROGRAM, lane LAB-10b (plan `docs/dev/research/lab-test-program-2026-10-17.md`,
# "LAB-10 Re-Fly, supersede and Discard Re-fly", the DISCARD half).
#
# RESHAPED 2026-10-20 FOR DESIGN SECTION 2.12 (owner ruling 2026-10-19), NOT RE-FLOWN. The old
# act A transmitted the lab's 12.5 BEFORE the Re-Fly, and that ScienceLabEarning in the lab
# slot's retire set now seals the slot (Rule 1: LAB-10 is the negative lane for exactly that).
# So this lane moves to a flight that EARNED NOTHING: act A records, separates the tender and
# commits WITHOUT transmitting; the lab's slot holds no sealing row (only the crew's
# KerbalAssignment rows, which are loss rows) and stays re-flyable. The Re-Fly transmits the
# lab's 12.5 (the attempt's only earning), and the Discard Re-Fly takes it away: Rule 3
# "Discard and Retry remove the attempt's rows" (`RemoveActionsForRecordings`, the field
# `ledgerTagsCleared=` renamed `ledgerRowsRemoved=`), the attempt's events purged, the pool back
# to the rewind point's 100, nothing re-homed or tombstoned.
#
# THE OLD SHAPE flew green on `2026-10-18_0104` (PASS attempt 1, PR #2140's build). Its
# READING RUN `2026-10-17_2341` (main 9a483c4a5): the discard tokens matched
# (the purge `live=3`, no re-home, no tombstone, `slotListed=true`, the point kept); the count
# read 3 (todo ESC-DISCARD-REFLY-LEAVES-ATTEMPT-SIDECARS, PR #2140), kept at {2,2}. The old
# finding (1), the invoke's full-ledger walk patching 100 -> 112.5, does not arise here: no
# committed credit exists, so the pool stays at 100 through the invoke and the attempt's
# transmit lands on 112.5.
#
# HOST AND ACT A: LAB-10's (`lab-lko-seeded-transmit`; record, separate the probe tender with the
# pre-attached port's Undock at UT ~368, the JointBreak / UNDOCK split and its Rewind Point with
# the lab as the focus slot 0), MINUS the transmit: a 1x warp to UT 380 and the scene exit
# auto-commits the tree, then SaveGame persistent. See LAB-10's header for the mechanics.
#
# THE STORY AFTER ACT A. Fly the lab again, Stash its slot (verdict `stashedStableLeaf`: nothing
# seals it), re-fly it from the separation (the lab at 12.50, the pool 100), rails-warp to the
# KSC pass and transmit: a credit `+12.50` tagged to the Re-Fly's provisional (`rec_...`), stock
# landing on 112.5. Then Esc > Revert Flight > Revert to Launch > Discard Re-Fly
# (`ReFlyRevert choice=discard target=launch`, QL-5's verb).
#
# WHAT THE DISCARD DOES WITH THE ATTEMPT'S CREDIT. `RevertInterceptor.DiscardReFlyHandler` ->
# `MergeDialog.PruneActiveReFlyAttemptOwnedTopology` purges the attempt's tagged store events
# (`PurgeEventsForRecordings (RevertInterceptor:DiscardReFly ...): live=N`), REMOVES every ledger
# row the attempt owned (`RemoveActionsForRecordings`, design 2.12 Rule 3; the credit is still an
# event at the discard, never converted, so the removed count may be 0: the gate is `[0-9]+`) and
# loads the rewind point's game, whose pool is 100. It never runs
# `LedgerOrchestrator.PreserveIrreversibleLiveGameplayOnDiscard` and never clears a tag
# (`ClearRecordingTagForRecordings` no longer fires on a Re-Fly discard).
#
# THE SLOT. The stashed lab slot is still offered after the discard: QL-5's read-back
# `reflyrevert complete ... rpKept=true slot=<lab> slotListed=true`, the rewind point kept.
#
# WHAT IS GATED ON BELIEF (reading-run pins): act A as LAB-10's minus the transmit; that the lab
# slot's retire set holds no sealing row (no Rendezvous / milestone booked at the undock: the
# reading runs saw that milestone only after a merge spawned the tender, todo
# MILESTONE-REWARDS-BOOKED-OUTSIDE-CAREER); `live=N` with N >= 1 on the purge; `slotListed=true`;
# the recordings count 2.
#
# NOT HERE: a pre-invoke ledger baseline compared row by row (RF-L4 carries the earned-attempt
# discard against a committed earning); LedgerGroundTruth (unproven in SCIENCE_SANDBOX).
#
# FAST-LANE CHECKLIST: as LAB-10 (shared act A minus the transmit, explicit-UT warps, retry
# `once`, count {2,2}, operator until green, expected about 6 min).
#
# WHAT A FIRST FLIGHT CAN FALSIFY: act A; a stash refused with `recordingAction:` (a sealing row
# the lane did not expect); the pool at the invoke; the purge count; a ledger walk or a row
# naming the attempt after the discard; a re-home line; the slot read-back.
description = "LAB-10b (design 2.12 Rule 3): an orbiting science lab separates its probe tender (a Rewind Point) and commits WITHOUT earning anything, so its slot stays re-flyable; the player stashes and re-flies the lab's slot, transmits 12.5 science in the replacement flight, then picks Discard Re-Fly from the Esc menu: the attempt's rows and events are removed with it, never re-homed or walked, nothing is tombstoned, the pool is back at 100, and the stashed slot and its rewind point stay offered."
instanceProfile = "stock-minimal"
tags = ["science-lab", "science", "transmit", "refly", "rewind", "discard-refly", "revert-dialog",
        "unfinished-flights", "stash", "docking-port", "scene-exit", "rails-warp", "LAB-10b",
        "pending-flight"]

[fixture]
saveTemplate = "fixtures/saves/lab-lko-seeded-transmit"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                              expect = "OK" },
  { cmd = "DiscardTree",                                                                expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoMerge", value = "true" },           expect = "OK" },
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  # ---- ACT A (LAB-10's minus the transmit): record, separate the tender, commit ----
  { cmd = "StartRecording",                                                             expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                             expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "368", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab10b-undock" },                      expect = "OK" },
  { cmd = "PartAction",        args = { button = "undock" }, label = "und",             expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "380", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab10b-split" },                       expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                          expect = "OK", budget = 120 },
  { cmd = "SaveGame",          args = { name = "persistent" },                          expect = "OK", budget = 120 },
  # ---- ACT B: fly the lab, stash its slot, re-fly it, transmit again ----
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent", focusPid = "2200110055" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "StopRecording",                                                              expect = "OK" },
  { cmd = "ListHandles",       args = { kind = "rewindpoints" }, label = "handles",     expect = "OK" },
  { cmd = "StashSlot",         args = { rp = "${handles.rp0}", slot = "0" },            expect = "OK" },
  { cmd = "InvokeRewind",      args = { rp = "${handles.rp0}", slot = "0" },            expect = "OK", budget = 300 },
  { cmd = "ListHandles",       args = { kind = "chains" },                              expect = "OK" },
  { cmd = "RecordingState",    args = { awaitRecorderLive = "refly" },                  expect = "OK" },
  { cmd = "MissionMark",       args = { label = "lab10b-refly-start" },                 expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "2240", maxRate = "50" },                  expect = "OK", budget = 540 },
  { cmd = "WarpToUT",          args = { ut = "2250", maxRate = "1" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab10b-refly-t-before" },              expect = "OK" },
  { cmd = "PartAction",        args = { button = "labtransmit", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "2262", maxRate = "1" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",       args = { label = "lab10b-refly-t-after" },               expect = "OK" },
  { cmd = "PartAction",        args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  # ---- THE DISCARD: Esc > Revert Flight > Revert to Launch > Discard Re-Fly ----
  { cmd = "ReFlyRevert",       args = { choice = "discard", target = "launch" },        expect = "OK", budget = 300 },
  { cmd = "MissionMark",       args = { label = "lab10b-discarded" },                   expect = "OK" },
  { cmd = "ListHandles",       args = { kind = "rewindpoints" }, label = "after",       expect = "OK" },
  { cmd = "RecordingState",                                                             expect = "OK" },
  { cmd = "FlushAndQuit",                                                               expect = "OK" },
]

[dimensionsCovered]
# Every value is backed by a REQUIRED token below.
#   commit-scene-exit / auto-merge  <- `full-fidelity auto-commit (scene-exit...)` + exittospacecenter
#   controlled-decoupled-child      <- `ProcessBreakupEvent: controlled child created: pid=<tender>`
#   rewind-to-separation            <- StartInvoke + Invocation complete
#   unfinished-flights-stash        <- `Stashed slot=0 ...` + `reflyrevert complete ... slotListed=true`
#   revert-during-refly-dialog      <- `Revert dialog shown` + `reflyrevert pressed dialog button='Discard Re-Fly'`
D1  = ["commit-scene-exit", "auto-merge"]
D5  = ["controlled-decoupled-child"]
D8  = ["science"]
D9  = ["rewind-to-separation", "unfinished-flights-stash", "revert-during-refly-dialog"]
D14 = ["kerbin", "science-mode", "scene-flight", "scene-ksc", "warp-1x", "warp-rails"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# DERIVED 2: the lab's recording and the tender's; the attempt's sidecar is deleted by the
# discard. The reading run measured 3 (the attempt's leftover sidecar, ESC-DISCARD-REFLY-LEAVES-
# ATTEMPT-SIDECARS): kept at {2,2} on purpose, red until PR #2140 ships.
count = { min = 2, max = 2 }

[expectations.logContracts]
required = [
  "partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=0\\.00;Research:active=0'",
  # --- ACT A: THE SEPARATION (LAB-10's tokens) ---
  "(?s)MISSIONMARK label=lab10b-undock (?:(?!partaction applied button=).)*?partaction applied button=undock pid=2200110055 part='dockingPort3' partId=[0-9]+ event=Undock newPid=[1-9][0-9]* newName='[^'\\r\\n]*' vessels=1->2 activePid=2200110055 ",
  "=> UNDOCK \\(consumed\\)",
  "SEPARATION emitted: ut=[0-9.]+ type=JointBreak splitCause=UNDOCK decouplerPartId=[0-9]+ controlledChildren=1 debris=0 ",
  "(?s)partaction applied button=undock [^\\r\\n]*newPid=([0-9]+) .*?ProcessBreakupEvent: controlled child created: pid=\\1, name='[^'\\r\\n]*', recId=[0-9a-f]{32}, alive=True, bgRecorder=True",
  "(?s)Controllable split children: \\[[0-9,]+\\] \\(orig=2200110055, .*?RewindPoint begin: rp=(rp_[0-9a-f]{32}) bp=[0-9a-f]{32} slots=2 controllablePids=2 focusSlot=0 ut=[0-9.]+.*?RewindPoint slot capture: rp=\\1 populated=2/2 disabled=0",
  # --- ACT A: THE COMMIT (no transmit: the lab earned nothing) ---
  "full-fidelity auto-commit \\(scene-exit[^\\r\\n]*\\): tree='LABX Orbital Lab' recordings=2 ",
  "CommitTree: promoted 1 normal staging RP\\(s\\)",
  # The lab slot is the focus leaf ending Orbiting (closed); the tender slot opens.
  "CommitTree promoted rec=[0-9a-f]{32} vessel='[^'\\r\\n]*' slot=1 rp=rp_[0-9a-f]{32} reason=stableLeafUnconcluded to CommittedProvisional",
  # --- ACT B: STASH, RE-FLY, TRANSMIT ---
  "Stashed slot=0 rec=\\S+ bp=\\S+ rp=rp_[0-9a-f]{32} tip=\\S+ tipMergeState=CommittedProvisional tipDemoted=True terminal=Orbiting reaperBlocked=True",
  "stashslot complete rp=rp_[0-9a-f]{32} slot=0 tip=\\S+ tipMergeState=Immutable->CommittedProvisional stashed=true unfinishedFlight=true unfinishedRow=\\S+",
  "IsUnfinishedFlight=true rec=\\S+ reason=stashedStableLeaf slot=0 ",
  "Re-Fly \\(Rewind-to-Separation\\) StartInvoke: sess=\\S+ rp=rp_[0-9a-f]{32} slot=0",
  "Invocation complete: sess=\\S+ rp=rp_[0-9a-f]{32} slot=0 activePid=2200110055",
  "recordingstate recording=true tree=\\S+ points=[0-9]+ scene=FLIGHT awaitRecorderLive=refly reFlyMarker=true",
  "(?s)MISSIONMARK label=lab10b-refly-start (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=0\\.00;",
  # The attempt's credit: 12.50 tagged to the Re-Fly's provisional, stock landing on 112.5
  # (the pool at the invoke was the rewind point's 100: no committed credit to walk).
  "(?s)MISSIONMARK label=lab10b-refly-t-before (?:(?!MISSIONMARK label=lab10b-refly-t-after ).)*?Game state: ScienceLabCredited \\+12\\.50 reason='ScienceTransmission' vessel='LABX Orbital Lab' ut=[0-9.]+ recordingId='rec_[0-9a-f]{32}'",
  "(?s)MISSIONMARK label=lab10b-refly-t-before (?:(?!MISSIONMARK label=lab10b-refly-t-after ).)*?Game state: ScienceChanged \\+12\\.5 \\(ScienceTransmission\\)[^0-9\\r\\n]+112\\.5(?![0-9])",
  "(?s)MISSIONMARK label=lab10b-refly-t-after (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.50 dataStored=0\\.00;",
  # --- THE DISCARD (QL-5's tokens; the verb's slot= is the slot origin, the lab's recording) ---
  "(?s)startrecording recordingId=([0-9a-f]{32}) already=false.*?reflyrevert start choice=discard target=launch sess=\\S+ rp=rp_[0-9a-f]{32} slot=\\1 ",
  "reflyrevert pressed revert-option button='[^']*' target=launch launchOffered=true",
  "Revert dialog shown sess=\\S+ target=Launch",
  "reflyrevert pressed dialog button='Discard Re-Fly' choice=discard",
  # The attempt's tagged events (its lab credit among them) are purged with it ...
  "PurgeEventsForRecordings \\(RevertInterceptor:DiscardReFly sess=\\S+\\): live=[1-9][0-9]*, ",
  "PruneActiveReFlyAttemptOwnedTopology callSite=RevertInterceptor:DiscardReFly sess=\\S+ tree=\\S+ attemptIds=[1-9][0-9]* [^\\r\\n]*purgedEvents=[1-9][0-9]* [^\\r\\n]*ledgerRowsRemoved=[0-9]+ ",
  "Origin RP (?:promoted to persistent|already persistent) rp=rp_[0-9a-f]{32}",
  "End reason=discardReFly sess=\\S+ target=Launch facility=-- dispatched=true",
  "Load classified: early=DiscardReFly refined=DiscardReFly scene=SPACECENTER [^\\r\\n]*discardReFly=Launch handoff=present",
  # ... and the stashed lab slot and its point are still offered.
  "(?s)startrecording recordingId=([0-9a-f]{32}) already=false.*?reflyrevert complete choice=discard target=launch scene=SPACECENTER sess=\\S+ rp=rp_[0-9a-f]{32} rpKept=true slot=\\1 slotListed=true unfinishedFlights=[1-9][0-9]* marker=none",
  "(?s)MISSIONMARK label=lab10b-discarded .*?listhandles kind=rewindpoints count=1 truncated=false",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "partaction rejected",
  "partaction error ",
  "warptout refused",
  "exittospacecenter rejected",
  "invokerewind refused",
  "stashslot refused",
  "stashslot readback-failed",
  "reflyrevert rejected",
  "reflyrevert error",
  "Single-controllable split: no RP",
  "OnVesselsUndocking:entry",
  "Tree branch created: type=Undock",
  "IsUnfinishedFlight=false rec=\\S+ reason=recordingAction:",
  "listhandles kind=chains .* evaluated=false",
  # QL-5's carry and point-loss readings.
  "In-session load found no staged-list handoff",
  "DiscardReFly load intent dropped as stale",
  "Reaped rp=",
  "Purged rp=",
  "Deleted rewind quicksave rp=",
  # A discard is not a merge: no split, no tombstone.
  "Split origin \\S+ at UT=",
  "Tombstoned [1-9][0-9]* career actions",
  # A Re-Fly discard reverts KSP with the rewind point's game, so it never re-homes ...
  "PreserveIrreversibleLiveGameplayOnDiscard \\([^)\\r\\n]*\\): re-homed",
  # ... never keeps an attempt-owned row untagged ...
  "ClearRecordingTagForRecordings: cleared=[1-9]",
  # ... and the attempt's credit never reaches a ledger walk, before or after the discard.
  "(?s)Game state: ScienceLabCredited [^\\r\\n]*recordingId='(rec_[0-9a-f]{32})'.*?LabEarning: credit=[^\\r\\n]*recordingId=\\1(?![0-9a-f])",
  # Exactly one lab credit, the attempt's, inside its window.
  "(?s)(?:Game state: ScienceLabCredited .*?){2}",
  "(?s)\\A(?:(?!MISSIONMARK label=lab10b-refly-t-before ).)*?Game state: ScienceLabCredited",
  # The lab slot earned nothing in act A, so nothing seals it.
  "stash-refused recordingAction:",
  "refly-gate recordingAction:",
  # The invoke never walks a committed lab credit (none exists).
  "(?s)Re-Fly \\(Rewind-to-Separation\\) StartInvoke: (?:(?!Invocation complete: ).)*?PatchScience: [^\\r\\n]*target=112\\.5\\)",
  # After the discard no walk carries a lab earning (the attempt's is gone, none was committed).
  "(?s)End reason=discardReFly .*?LabEarning: ",
  # After the discard the pool is the rewind point's 100; nothing patches it back to 112.5.
  "(?s)End reason=discardReFly .*?PatchScience: [^\\r\\n]*target=112\\.5\\)",
  "(?s)MISSIONMARK label=lab10b-refly-t-after .*?Game state: ScienceLabCredited",
  # The attempt's credit is never counted twice.
  "LabEarning: credit=[^\\r\\n]*runningScience=125, ",
  "PatchScience: [^\\r\\n]*target=125\\.0\\)",
  "Lab payout net of a strategy take",
  "Exploded!!",
]

# REPORT-ONLY until the reading run: the point survives, nothing is superseded or tombstoned.
[expectations.rewind]
gating        = false
rewindPoints  = { min = 1, max = 1 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[runtime]
# Act A without its warp to the KSC pass, act B (two LoadGame steps, one ~1,900 s rails warp at
# 50x, the stash and the rewind) and the ReFlyRevert (a deferred verb, up to 300 s, then the
# Space Center load). Sum of the step budgets plus the inert steps: about 2,900 s.
budgetSeconds = 3300

[retry]
policy = "once"

[expectedFail]
bugId = ""
