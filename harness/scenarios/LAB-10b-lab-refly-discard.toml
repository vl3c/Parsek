schema = 1
id = "LAB-10b-lab-refly-discard"
tier = "operator"
# THE SCIENCE-LAB PROGRAM, lane LAB-10b (plan `docs/dev/research/lab-test-program-2026-10-17.md`,
# "LAB-10 Re-Fly, supersede and Discard Re-fly", the DISCARD half; the merge half is LAB-10).
# Still `operator` / `pending-flight`: the reading run below found a product defect.
#
# READING RUN `2026-10-17_2341` (automation DLL = main 9a483c4a5, PR #2138 included): PARSEK-FAIL
# on two mismatches; every other token matched (the purge `live=3`, `ledgerTagsCleared=0`, no
# re-home, no tombstone, `slotListed=true`, the point kept).
#   (1) SPEC PREMISE, re-pinned: the pool after the rewind is the committed 112.5, not 100 (the
#       Re-Fly invoke walks the whole ledger, act A's future credit included: `PatchScience:
#       100.0 -> 112.5` before `Invocation complete`), so the attempt's transmit lands on 125.0.
#       See LAB-10's header, finding 1, and todo REFLY-SESSION-CAREER-SHOWS-THE-REPLACED-
#       FLIGHTS-FUTURE (owner question).
#   (2) PRODUCT, kept red: `recordings.count 3 > max 2`. The third `.prec` is the discarded
#       attempt's own sidecar (`rec_...`): the Esc Discard pruned the committed original
#       instead of the live clone that holds the fork (`PruneActiveReFlyAttemptOwnedTopology ...
#       deletedFiles=0`; todo ESC-DISCARD-REFLY-LEAVES-ATTEMPT-SIDECARS, PR #2140). The {2,2}
#       window stays and turns green only on a DLL carrying PR #2140.
#
# HOST AND ACT A: LAB-10's, verbatim (`lab-lko-seeded-transmit`; record, separate the probe
# tender with the pre-attached port's Undock at UT ~368, the JointBreak / UNDOCK split and its
# Rewind Point with the lab as the focus slot 0, transmit the lab's 12.5 at the KSC pass at UT
# 2280, the scene exit auto-commits the tree and books the credit on the lab's recording, then
# SaveGame persistent). See LAB-10's header for the stock and Parsek mechanics and the KSC
# window arithmetic.
#
# THE STORY AFTER ACT A. Fly the lab again, Stash its slot, re-fly it from the separation (the
# lab back at 12.50, the pool patched to the committed 112.5), rails-warp to the pass and transmit
# again: a second credit `+12.50` tagged to the Re-Fly's provisional (`rec_...`), stock landing on
# 125.0. Then the player changes their mind:
# Esc > Revert Flight > Revert to Launch > Discard Re-Fly (`ReFlyRevert choice=discard
# target=launch`, QL-5's verb and route through the stock menus and Parsek's dialog).
#
# WHAT A DISCARD RE-FLY DOES WITH THE ATTEMPT'S LAB CREDIT (read from the code, 2026-10-18).
# `RevertInterceptor.DiscardReFlyHandler` -> `MergeDialog.PruneActiveReFlyAttemptOwnedTopology`
# purges the attempt's tagged store events (`PurgeEventsForRecordings (RevertInterceptor:
# DiscardReFly ...): live=N`, the ScienceLabCredited and ScienceChanged events among them),
# clears the ledger tag of any row the attempt owned (`ClearRecordingTagForRecordings`: the
# attempt's credit is an EVENT, never converted, so none) and loads the rewind point's game,
# which carries the pool from BEFORE either transmit. It does NOT run
# `LedgerOrchestrator.PreserveIrreversibleLiveGameplayOnDiscard`: that method's own contract
# says "Re-fly / rewind discards must NOT call this: they revert KSP via a quicksave reload, so
# preserving would diverge the other way" (its only callers are the non-rewind discard cores in
# RecordingStore / ParsekFlight). So the plan's "the original credit is kept as a direct
# earning (the rehome rule)" does not apply here: the ORIGINAL credit is not discarded at all
# (it is committed history on the lab's recording, untouched: no merge, no tombstone), and the
# ATTEMPT's credit is dropped with the attempt, not re-homed. This lane pins THAT.
#
# THE LEDGER WITNESSES. Act A's commit books the original credit (`LabEarning: credit=12.5,
# method=Transmitted, runningScience=112.5, recordingId=<lab>`). The attempt's credit must never
# reach a ledger walk (`LabEarning ... recordingId=<rec_...>` forbidden anywhere), never be
# re-homed (`PreserveIrreversibleLiveGameplayOnDiscard (...): re-homed` forbidden), never keep an
# untagged row (`ClearRecordingTagForRecordings: cleared=[1-9]` forbidden), and nothing is
# tombstoned. The Space Center lands at the rewind point's UT (~368, before the original credit's
# UT 2280), so its recalc walks only to that UT (`RecalculateAndPatchForCurrentTimelineUT`) and
# the original credit, a committed-future row there, is not walked after the discard: the lane
# has no positive post-discard witness for it (see "NOT HERE"). No PatchScience may ever target
# 125 (both credits counted).
#
# THE SLOT. The stashed lab slot must still be offered after the discard: QL-5's read-back
# `reflyrevert complete ... rpKept=true slot=<lab> slotListed=true`, the rewind point kept (the
# tender slot is open too, so `unfinishedFlights=2` is expected; the gate is `[1-9]`).
#
# WHAT IS GATED ON BELIEF (reading-run pins): everything LAB-10's act A gates; `live=N` with N >=
# 1 on the purge (the two attempt events); `slotListed=true` (the stash surviving the discard's
# in-session hand-off: the RP list comes from memory for a tree committed in memory); the
# recordings count 2 (the lab and the tender; the attempt's sidecar is deleted: measured 3 on the
# reading run, the product defect above).
#
# NOT HERE: a positive witness that the ORIGINAL credit is still booked after the discard. It
# needs a ledger walk past UT 2280 from the rewound clock (fly the lab again and warp past the
# pass, then a scene change), and in that world the real lab still holds its 12.5 at UT ~368
# while the committed timeline says it transmitted at 2280: what a player sees when he reaches
# the pass again is its own question (a second transmit there would pay twice) and is left to a
# later lane. LedgerGroundTruth (unproven in SCIENCE_SANDBOX).
#
# FAST-LANE CHECKLIST: as LAB-10 (shared act A, explicit-UT warps, retry `once`, count {2,2},
# operator until green, expected about 7 min).
#
# WHAT A FIRST FLIGHT CAN FALSIFY: act A (as LAB-10); the stash and the rewind; the pool reset at
# the rewind; the purge count; a ledger walk or a row naming the attempt; a re-home line; the
# slot read-back (`slotListed=false` with `rpKept=true` would mean the discard lost the stash).
description = "LAB-10b: an orbiting science lab separates its probe tender (a Rewind Point) and transmits 12.5 science tagged to its own recording, committed; the player stashes and re-flies the lab's slot, transmits again in the replacement flight, then picks Discard Re-Fly from the Esc menu: the attempt's tagged lab credit is purged with the attempt, never re-homed, walked or kept as an untagged row, nothing is tombstoned, the original credit stays committed, and the stashed slot and its rewind point stay offered."
instanceProfile = "stock-minimal"
tags = ["science-lab", "science", "transmit", "refly", "rewind", "discard-refly", "revert-dialog",
        "unfinished-flights", "stash", "docking-port", "scene-exit", "rails-warp", "LAB-10b",
        "pending-flight"]

