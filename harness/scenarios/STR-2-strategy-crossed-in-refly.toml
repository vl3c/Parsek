schema = 1
id = "STR-2-strategy-crossed-in-refly"
tier = "operator"
# STRATEGIES x RE-FLY (todo CROSS-SYSTEM-COVERAGE-GAPS-2026-10-16, "strategies across any
# timeline operation"; owner 2026-10-24: strategy activation must be exact, "to not cause
# compounding errors"). AUTHORED 2026-10-25 (branch `claude/project-thread-eo3rd8`). NEVER
# FLOWN: its first flight is a reading run.
#
# WHY. A Re-Fly invoke walks the whole ledger (design 6.8 step 5, the session shows the
# committed career), so at the end of that walk a strategy activated at the Space Center after
# the separation is active. RF-C1 found the same shape on contracts: the invoke's patch made a
# later accept Active at the session's earlier clock. `StrategyStatePatcher` reads the walk at
# the live clock (`ResolveLedgerActiveAtNow`, `futureDated=`), and the in-flight activation gate
# (`StrategyActivationGate`) switches the strategy on when the session's clock reaches its UT;
# no lane has flown either inside a Re-Fly session.
#
# THE STORY (career-gs1-two-stage-pad, RF-L2's, RF-C1's and L13's host and mission):
#   act 1     GS-1's hop: the pod lands, the booster is under canopy at the exit, the tree
#             auto-commits with the booster slot open.
#   KSC       warp to UT 250; activate Appreciation Campaign at its default factor (one slot,
#             Administration level 0). A Space Center row well after the separation and well
#             before the end of the booster's re-flown descent.
#   re-fly    save, reload, re-fly the booster (session clock about UT 30-60). Stock must have
#             Appreciation OFF from the invoke until the clock reaches ~250 (no
#             `PatchStrategies: activated=1` in that window), then the gate switches it on
#             during the descent (warp to 400), without cost or capture. Merge.
#   check     recover the landed booster from the Tracking Station (L13: it blocks the pad),
#             VAB launch of the Settings Probe (unrecorded), warp to 450, save,
#             LedgerGroundTruth: Appreciation active on both sides, pools exact.
#
# THE GATES:
#   - the activation applied at the Space Center;
#   - no strategy switched on between the invoke and the crossing mark, and the gate line for
#     Appreciation between the crossing mark and the merge;
#   - the merge passes the dominance check and commits; nothing tombstoned;
#   - no PatchStrategies switch after the merge (stock and ledger already agree);
#   - LedgerGroundTruth `hardFailures=0` and the strategy facet: managed, ledger-active and
#     save-active all exactly Appreciation, no divergence.
#
# PRE-REGISTERED READINGS:
#   - `PatchStrategies: activated=1 ... activatedIds=[AppreciationCampaignCfg]` between the
#     invoke and the crossing mark: the invoke's patch read the end of the whole-ledger walk
#     (the RF-C1 shape on strategies); a product finding, file it with the `futureDated=` value.
#   - no gate line in the crossing window but stock on at the merge (`matching=1`): stock had
#     it on from the invoke; read the invoke's PatchStrategies line first.
#   - `kscaction refused action=activate-strategy reason=strategy-cannot-activate`: read stock's
#     reason (the recovery summary, slots, reputation); a premise miss.
#   - `Merge dominance check ... result=refuse`: read the pool; the booster's landing earns and
#     loses nothing, and the activation's setup cost was paid at the Space Center.
#   - LedgerGroundTruth `skipped=2`: a live or pending tree after the probe launch.
#
# FAST-LANE CHECKLIST: (1) reuse - L13's act 1, re-fly and check window verbatim; (2)
# explicit-UT warps only; (3)-(5) no dwells, burns or coasts beyond the descent; (6) retry
# `once`; (7) count window {3,8} until the reading run pins it; (8) operator until green, about
# 12 min expected; (9) flight_efficiency.py after the first green flight.
description = "STR-2 (strategies x Re-Fly): GS-1's career hop commits with the booster slot open, Appreciation Campaign is activated at the Space Center later, and re-flying the booster keeps it off in stock until the session's clock reaches the activation, where the gate switches it on; the merge passes and LedgerGroundTruth after the merge finds the strategy list and the pools exact."
instanceProfile = "stock-minimal"
tags = ["STR-2", "strategy", "refly", "rewind", "career", "ledger", "ledger-groundtruth", "GS1",
        "staging", "controlled-child", "scene-exit", "auto-merge", "timeline-ops", "reading-run"]

[fixture]
saveTemplate       = "fixtures/saves/career-gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "gs1_auto_chute_booster_career"
# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "true" },  expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoMerge", value = "true" },           expect = "OK" },
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  # ---- ACT 1: RF-L2's hop; the pod lands, the booster is under canopy at the exit ----
  { phase = "mission",                                                                  expect = "MISSION-OK", budget = 900 },
  { cmd = "ExitToSpaceCenter",                                                          expect = "OK", budget = 120 },
  # ---- THE ACTIVATION: after the separation, before the re-flown descent ends ----
  { cmd = "WarpToUT",          args = { ut = "250", maxRate = "100" },                  expect = "OK", budget = 120 },
  { cmd = "KscAction",         args = { action = "activate-strategy", strategy = "AppreciationCampaignCfg" }, expect = "OK", budget = 60 },
  { cmd = "SaveGame",          args = { name = "persistent" },                          expect = "OK" },
  # ---- ACT 2: re-fly the booster slot (RF-L2's order) ----
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "StopRecording",                                                              expect = "OK" },
  { cmd = "ListHandles",       args = { kind = "rewindpoints" }, label = "handles",     expect = "OK" },
  { cmd = "MissionMark",       args = { label = "str2-invoke" },                        expect = "OK" },
  { cmd = "InvokeRewind",      args = { rp = "${handles.rp0}", slot = "1" },            expect = "OK", budget = 300 },
  { cmd = "ListHandles",       args = { kind = "chains" },                              expect = "OK" },
  { cmd = "RecordingState",    args = { awaitRecorderLive = "refly" },                  expect = "OK" },
  # The booster's VESSEL pid: it lands beside the pad and blocks the probe launch below.
  { cmd = "PartAction",        args = { button = "inspect", part = "probeCoreOcto2.v2" }, label = "bst", expect = "OK" },
  # The descent under canopy crosses the activation's UT.
  { cmd = "MissionMark",       args = { label = "str2-cross" },                         expect = "OK" },
  { cmd = "WarpToUT",          args = { ut = "400", maxRate = "2", ladder = "phys" },   expect = "OK", budget = 540 },
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },                             expect = "OK", budget = 240 },
  { cmd = "MissionMark",       args = { label = "str2-merged" },                        expect = "OK" },
  # The merge leaves the flight scene; recover the landed booster from the Tracking Station
  # (L13's act 3).
  { cmd = "TrackingStationRecover", args = { pid = "${bst.pid}" },                      expect = "OK", budget = 120 },
  # ---- THE CHECK: after the merge, the activation in the past ----
  { cmd = "GoToEditor",        args = { facility = "VAB", craft = "Settings Probe" },   expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                                           expect = "OK", budget = 180 },
  { cmd = "WarpToUT",          args = { ut = "450" },                                   expect = "OK", budget = 120 },
  { cmd = "SaveGame",          args = { name = "persistent" },                          expect = "OK" },
  { cmd = "MissionMark",       args = { label = "str2-check" },                         expect = "OK" },
  { cmd = "RunTests",          args = { category = "LedgerGroundTruth" },               expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                               expect = "OK" },
]

[driver.missionParams]
# RF-L2's (QL-2b's) values VERBATIM.
throttle = 1.0
stagingApoapsisMeters = 700
stagingMaxAltMeters = 1500
apoapsisWindowMeters = { min = 600, max = 1600 }
stageSettleFrames = 2
chuteArmMaxRateMps = 30
chuteFullDeployAltMeters = 600
landedSituations = ["LANDED", "SPLASHED"]
ascentTimeoutSeconds = 90
coastTimeoutSeconds = 120
stageTimeoutSeconds = 60
descentTimeoutSeconds = 300
siblingVesselName = "GS1 Auto-Chute Booster Probe"
siblingAirborneAtExit = true
siblingDownTimeoutSeconds = 240

[dimensionsCovered]
#   rewind-to-separation <- StartInvoke slot=1 + Invocation complete
#   supersede-relation   <- the merge's supersede rows
#   strategies           <- the gate line in the session and the strategy facet
D8  = ["funds", "strategies", "recalc-engine", "ksp-state-patcher"]
D9  = ["rewind-to-separation", "supersede-relation"]
D14 = ["kerbin", "career", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 3, max = 8 }

[expectations.logContracts]
required = [
  # --- ACT 1 (RF-L2's tokens) ---
  "RewindPoint begin: rp=\\S+ bp=\\S+ slots=2 controllablePids=2",
  "Silent full-fidelity auto-commit \\(scene-exit\\): tree='.+' recordings=[1-9][0-9]*",
  # --- THE ACTIVATION ---
  "kscaction action=activate-strategy target=AppreciationCampaignCfg applied=true manifestKind=strategy-activate observedAfter=factor=[0-9.]+ slots=1/1 setupFunds=[1-9][0-9.]* ",
  # --- THE RE-FLY ---
  "Re-Fly \\(Rewind-to-Separation\\) StartInvoke: sess=\\S+ rp=rp_[0-9a-f]{32} slot=1",
  "Invocation complete: sess=\\S+ rp=rp_[0-9a-f]{32} slot=1 ",
  "recordingstate recording=true tree=\\S+ points=[0-9]+ scene=FLIGHT awaitRecorderLive=refly reFlyMarker=true",
  # THE GATE: the session's clock reaches the activation and stock switches it on there.
  "(?s)MISSIONMARK label=str2-cross (?:(?!MISSIONMARK label=str2-merged ).)*?Committed strategy activation reached: strategy=AppreciationCampaignCfg activateUT=[0-9.]+ factor=[0-9.]+ nowUT=[0-9.]+ \\(switched on without cost or capture\\)",
  # --- THE MERGE ---
  "Merge dominance check sess=\\S+ result=pass pool=\\S+ ut=\\S+ before=\\S+ after=\\S+ ",
  "answermergedialog complete choice=merge result=committed",
  # --- THE CHECK ---
  "(?s)MISSIONMARK label=str2-check .*?BATCH_COMPLETE v1 total=3 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LedgerGroundTruth scene=FLIGHT",
  "(?s)MISSIONMARK label=str2-check .*?result: hardFailures=0 ",
  "(?s)MISSIONMARK label=str2-check .*?CompareStrategies: managed=\\[AppreciationCampaignCfg\\] ledgerActive=\\[AppreciationCampaignCfg\\] saveActive=\\[AppreciationCampaignCfg\\] diverged=0 \\[\\]",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "invokerewind refused",
  "kscaction refused",
  "warptout refused",
  "result: hardFailures=[1-9]",
  "Tombstoned [1-9][0-9]* career actions",
  "Merge dominance check sess=\\S+ result=refuse",
  "Committed strategy activation reached but stock left",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped resource=(?:Funds|Reputation)",
  # Nothing switches the strategy on between the invoke and the crossing (the session's clock
  # is before the activation there).
  "(?s)MISSIONMARK label=str2-invoke (?:(?!MISSIONMARK label=str2-cross ).)*?PatchStrategies: activated=[1-9]",
  # After the merge stock and the ledger already agree: no patch switches anything.
  "(?s)MISSIONMARK label=str2-merged .*?PatchStrategies: activated=(?:[1-9]|[0-9]+ deactivated=[1-9])",
]

[expectations.rewind]
gating        = false
supersedeRows = { min = 1 }
tombstones    = { max = 0 }

[runtime]
# LoadGame x2 (660 each), mission 900, ExitToSpaceCenter 180, WarpToUT x2 (240 each) plus the
# descent 540, KscAction 120, SaveGame x2 (120 each), InvokeRewind 660, AnswerMergeDialog 300,
# TrackingStationRecover 180, GoToEditor 180, LaunchFromEditor 240, RunTests 600, about 12
# inert steps at 120: about 8,200 s.
budgetSeconds = 8700

[retry]
policy = "once"

[expectedFail]
bugId = ""
