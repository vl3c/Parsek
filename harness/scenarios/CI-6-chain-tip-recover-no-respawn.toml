  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c2", expect = "OK" },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# D18 `chain-terminated-destruction-recovery` is NOT claimed here: this lane drives the whole
# RECOVERY half (Real Spawn of a chain tip, Switch-To, stock Recover, a new flight scene) and
# the product's answer is the respawn defect quarantined below, so it has not flown green.
# V26T keeps the cell for the DESTROYED half; the recovery half is claimed when the fix flips
# this lane to XPASS and the quarantine comes off.
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

# Fixed: the tip recording, re-stamped Recovered (or a Recovered continuation under it).
# Defect (reading run `2026-10-03_1014`): the two injected recordings, unchanged.
[expectations.recordings]
count = { min = 2, max = 3 }

# REPORT-ONLY census (not armed: the expectation row carries the quarantine signature, and
# one PARSEK-FAIL classifies under one subkind). On the reading run the produced save holds
# ONE `CTR Lander`: the respawn, pid 3842087101, stamped as the tip's spawnedPid.
[expectations.recordings.structure]
gating         = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
vesselNames    = { "CTR Lander" = { min = 0, max = 0 }, "mk1-capsule" = { min = 1, max = 1 } }

[expectations.logContracts]
required  = [
  # Boot: the walker claims the lander via BACKGROUND_EVENT and builds a live chain.
  "\\[ChainWalker\\] Chain built: vessel=1344998135 links=1 tip=ctr-tip-rec spawnUT=622\\.2 terminated=False",
  # Act 1: Real Spawn Control spawns the chain tip with its original pid.
  "\\[Ghoster\\] Chain tip spawn: pid=1344998135 vessel=CTR Lander preserveIdentity=true",
  "realspawn complete rec=ctr-tip-rec pid=1344998135 vessel=CTR Lander ",
  # Act 1: stock's Recover button, the request Parsek arms, stock's recovery.
  "\\[Recovery\\] In-flight recovery requested: vessel='CTR Lander' pid=1344998135 ",
  "recover observed onVesselRecovered pid=1344998135 vessel=CTR Lander fromTrackingStation=false",
  "recover complete pid=1344998135 vessel=CTR Lander scene=SPACECENTER",
  # Act 2: a new flight scene, where the walker re-reads the committed tree.
  "launchfromeditor complete scene=FLIGHT vessel=Kerbal X ",
  # DESIGNED, MISSING ON THE DEFECT: the recovery is recorded, so the new flight's walker
  # resolves the chain as terminated by recovery.
  "\\[ChainWalker\\] ResolveTermination: vessel=1344998135 tip=[^ ]+ terminalState=Recovered",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "realspawn rejected",
  "recover rejected",
  # THE DEFECT, measured on the reading run `2026-10-03_1014`: the scene-exit no-op resume
  # discard reverts the resumed tip to its committed original, the recovery request is then
  # dropped, and on the next flight scene the spawn-death pass resets the tip and spawns the
  # recovered lander again.
  "\\[Recovery\\] In-flight recovery request dropped unapplied: vessel='CTR Lander'",
  "\\[Policy\\] Spawn-death detected: #[0-9]+ \"CTR Lander\"",
  "\\[Spawner\\] Vessel spawn for #[0-9]+ \\(CTR Lander\\)",
]

[runtime]
budgetSeconds = 1800

[retry]
policy = "once"

[expectedFail]
bugId = "CHAIN-TIP-RECOVER-AFTER-SWITCH-RESPAWNS-DUPLICATE"
subkind = "expectation"
mismatches = [
  "logContracts.required not matched: \\[ChainWalker\\] ResolveTermination: vessel=1344998135 tip=[^ ]+ terminalState=Recovered",
  "logContracts.forbidden matched: \\[Recovery\\] In-flight recovery request dropped unapplied: vessel='CTR Lander'",
  "logContracts.forbidden matched: \\[Policy\\] Spawn-death detected: #[0-9]+ \"CTR Lander\"",
  "logContracts.forbidden matched: \\[Spawner\\] Vessel spawn for #[0-9]+ \\(CTR Lander\\)",
]
