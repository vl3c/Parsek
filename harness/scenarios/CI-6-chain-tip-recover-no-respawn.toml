# CI-6: the player spawns a ghost chain's tip through Real Spawn Control, switches to it and
# recovers it through stock's Recover button; the recovered vessel must not come back
# (D18 `chain-terminated-destruction-recovery`, the RECOVERY half).
#
# FLOWN 2026-10-03 (branch `d18-recovery`, automation DLL sha256 `cdb8e2e7...`, an origin/main
# build): reading `2026-10-03_1014` measured the defect, armed `2026-10-03_1021` EXPECTED-FAIL:
# the recovered lander SPAWNED AGAIN on the next flight scene (todo
# CHAIN-TIP-RECOVER-AFTER-SWITCH-RESPAWNS-DUPLICATE). FIXED 2026-10-03 (branch
# `tip-recover-respawn`): the LoadScene prefix's no-op discards keep a resumed clone holding an
# armed in-flight recovery, the scene-exit finalize stamps the tip Recovered, and the commit no
# longer re-installs the old spawn claim on a Recovered recording. On the fix: `2026-10-03_1154`
# (the discard half only) PARSEK-FAIL on `Spawn-death detected`, `2026-10-03_1234` XPASS; the
# quarantine came off and the census was armed off `_1234`'s facets.
#
# HOST: `gloops-airshow` (RSC-1's host: the mk1-capsule on the Launch Pad) plus the
# `chain-tip-recovery` preset: ONE committed tree `tree-ctr-carrier-rec`:
#   ctr-carrier-rec  ROOT, `CTR Carrier`, ended SubOrbital 20 s before the save (plays and
#                    spawns nothing, claims nothing, keeps one live leaf in the tree);
#   ctr-tip-rec      `CTR Lander`, a PARENTLESS background recording (no branch point) with
#                    an engine ignite / shutdown, in progress at the save UT on
#                    spawn-control-target's spot ~130 m from the pad, Landed. The walker
#                    claims its pid via BACKGROUND_EVENT (CI-5's production shape), so it is
#                    a chain tip, and Real Spawn Control lists it as a Ready row, its Warp live.
#
# ACT 1 (flight): RealSpawn the chain tip, Switch-To it through the stock click, let the
# continuation record a few seconds, Recover it through stock's own button (the scene goes
# to the Space Center, stock fires onVesselRecovered).
# ACT 2 (back to flight through the SPH): the walker re-reads the committed tree on the new
# flight scene, and the spawn pass meets the tip recording whose spawned vessel is gone.

schema = 1
id = "CI-6-chain-tip-recover-no-respawn"
# 2026-10-07 (todo HARNESS-FAST-POLLS-SHRINK-INERT-STEP-WAITS, branch `scene-wait`): the
# 1x waits this lane sized in inert seam steps (0.25 s each at the old poll; one frame
# since PR #2017) are `WarpToUT maxRate=1` waits to explicit UTs, deterministic in
# FLIGHT, the Space Center and the Tracking Station since TC-1. Spec changed, not
# re-flown.
# 2026-10-09 (todo FAST-POLL-SETTLES-STILL-RACE, branch `seam-load-waits-flight-ready`): the
# twelve inert steps between the switch click and Recover (0.25 s each before PR #2017, one
# frame since) are one `WarpToUT ut=625 maxRate=1`. RealSpawn leaves the clock at UT ~622.2
# (the tip's spawn UT) and the switch lands at ~622.34; Parsek's switch-intent consume
# refuses an on-surface target (`on-surface-defer-to-trigger`), so the tip's recorder is bound by
# ParsekFlight's 1 Hz committed-spawned restore retry (Time.unscaledTime, real seconds), up
# to a second after the switch. Green `2026-10-07_2143` won that by luck (the retry fired
# 4 ms after the switch, Recover 0.4 s later, `boundRec=ctr-tip-rec`); nightly
# `2026-10-08_1917` and `2026-10-09_0200` pressed Recover 0.35 s after the switch with
# nothing bound (`boundRec=(none)`, then `In-flight recovery request dropped unapplied`).
# 2.7 s of 1x time covers the retry with margin. Spec changed, not re-flown.
tier = "nightly"
description = "D18 chain-terminated-destruction-recovery, the RECOVERY half: over gloops-airshow plus the chain-tip-recovery preset (a committed tree whose parentless background recording of a landed lander is a ghost chain tip ~130 m from the pad), RealSpawn the tip, switch to it, Recover it through stock, then re-enter flight through the SPH and require that the recovered lander does not spawn again."
instanceProfile = "stock-minimal"
tags = ["CI-6", "D18", "chain-interaction", "ghost-chain", "real-spawn", "recover",
        "injected-recordings", "R10", "runtime-handles", "kerbin", "sandbox"]

[fixture]
saveTemplate       = "fixtures/saves/gloops-airshow"
injectedRecordings = "chain-tip-recovery"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # The supported shape for a scene-exit verb: no merge modal can stand at the exit.
  { cmd = "SetSetting", args = { name = "autoMerge", value = "true" }, expect = "OK" },
  { cmd = "ListHandles", args = { kind = "chains" }, label = "chains", expect = "OK" },
  # THE SETTLE: the proximity scan admits a row only on its second sighting, 1.5 s apart.
  # Eight inert steps (~2 s) were too few on the first reading run (`realspawn-not-a-candidate
  # candidates=0` 130 ms before the `Proximity notification`); twenty buy ~5 s.
  # 1x FLIGHT time to UT 27: the proximity scan admits a row on its second sighting 1.5 s apart; ~5 s after the save UT 21.16 (20 inert steps before 2026-10-07: since PR #2017 one costs a
  # frame, not the 0.25 s poll; todo HARNESS-FAST-POLLS-SHRINK-INERT-STEP-WAITS).
  { cmd = "WarpToUT", args = { ut = "27", maxRate = "1" }, expect = "OK", budget = 120 },
  # ACT 1.
  { cmd = "RealSpawn", args = { rec = "${chains.chain0tip}" }, label = "spawn", expect = "OK", budget = 120 },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "SimulateStockSwitchClick", args = { pid = "${spawn.pid}" }, expect = "OK" },
  # THE RECORDER-BIND WAIT (header, 2026-10-09): ~2.7 s of 1x time past the switch (UT
  # ~622.34) so the 1 Hz committed-spawned restore binds the tip's recorder before Recover.
  { cmd = "WarpToUT", args = { ut = "625", maxRate = "1" }, expect = "OK", budget = 120 },
  { cmd = "Recover", args = { pid = "${spawn.pid}" }, expect = "OK", budget = 120 },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c1", expect = "OK" },
  { cmd = "MissionMark", args = { label = "ctr-recovered-count-${c1.count}" }, expect = "OK" },
  # ACT 2.
  { cmd = "GoToEditor", args = { facility = "SPH", craft = "Kerbal X" }, expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor", expect = "OK", budget = 180 },
  { cmd = "ListHandles", args = { kind = "chains" }, label = "chains2", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c2", expect = "OK" },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# D18 `chain-terminated-destruction-recovery`, the RECOVERY half (V26T holds the DESTROYED
# half): a player-recovered chain tip is recorded Recovered, the next flight's walker resolves
# the chain terminated by recovery, and the vessel does not come back.
D14 = ["kerbin", "sandbox", "scene-flight"]
D18 = ["chain-terminated-destruction-recovery"]

[expectations]
allowedAnomalies = []

# The two injected recordings; the tip re-committed in place, ending Recovered.
[expectations.recordings]
count = { min = 2, max = 2 }

# ARMED 2026-10-03 off the XPASS reading `2026-10-03_1234` (trees / committedTrees 1,
# recordings 2, Recovered 1 / SubOrbital 1, spawnedVessels 0, no `CTR Lander` in the save).
# On the defect (`2026-10-03_1014`) the save held ONE `CTR Lander`, the respawn, pid
# 3842087101, stamped as the tip's spawnedPid.
[expectations.recordings.structure]
gating         = true
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 2, max = 2 }
terminalStates = { Recovered = { min = 1, max = 1 }, SubOrbital = { min = 1, max = 1 } }
spawnedVessels = { min = 0, max = 0 }
vesselNames    = { "CTR Lander" = { min = 0, max = 0 }, "mk1-capsule" = { min = 1, max = 1 } }

[expectations.logContracts]
required  = [
  # Boot: the walker claims the lander via BACKGROUND_EVENT and builds a live chain.
  "\\[ChainWalker\\] Chain built: vessel=1344998135 links=1 tip=ctr-tip-rec spawnUT=622\\.2 terminated=False",
  # Act 1: Real Spawn Control spawns the chain tip with its original pid.
  "\\[Ghoster\\] Chain tip spawn: pid=1344998135 vessel=CTR Lander preserveIdentity=true",
  "realspawn complete rec=ctr-tip-rec pid=1344998135 vessel=CTR Lander ",
  # Act 1: stock's Recover button, the request Parsek arms, stock's recovery.
  "\\[Recovery\\] In-flight recovery requested: vessel='CTR Lander' pid=1344998135 ",
  "recover observed onVesselRecovered pid=1344998135 vessel=CTR Lander quick=false",
  "recover complete pid=1344998135 vessel=CTR Lander scene=SPACECENTER",
  # Act 2: a new flight scene, where the walker re-reads the committed tree.
  "launchfromeditor complete scene=FLIGHT vessel=Kerbal X ",
  # The fix: the no-session resume discard keeps the clone, the finalize stamps the tip,
  # and the commit leaves the old spawn claim off the Recovered recording.
  "\\[Recovery\\] Auto-discard refused: fastPath=noop-no-session-resume dest=SPACECENTER tree='CTR Carrier' ",
  "\\[Recovery\\] In-flight recovery: recording 'ctr-tip-rec' vessel='CTR Lander' pid=1344998135 terminal Landed -> Recovered ",
  "\\[RecordingStore\\] PreserveLiveRuntimeFieldsOnReplace: spawn stamp pid=1344998135 not re-installed for recording \"CTR Lander\" id=ctr-tip-rec: its terminal Recovered leaves no vessel",
  # The recovery is recorded, so the new flight's walker resolves the chain as terminated
  # by recovery.
  "\\[ChainWalker\\] ResolveTermination: vessel=1344998135 tip=[^ ]+ terminalState=Recovered",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "realspawn rejected",
  "recover rejected",
  # THE DEFECT, measured on `2026-10-03_1014` before the fix: the scene-exit no-op resume
  # discard reverted the resumed tip to its committed original, the recovery request was
  # dropped, and on the next flight scene the spawn-death pass reset the tip and spawned the
  # recovered lander again. No lane may print these again.
  "\\[Recovery\\] In-flight recovery request dropped unapplied: vessel='CTR Lander'",
  "\\[Policy\\] Spawn-death detected: #[0-9]+ \"CTR Lander\"",
  "\\[Spawner\\] Vessel spawn for #[0-9]+ \\(CTR Lander\\)",
]

[runtime]
budgetSeconds = 1800

[retry]
policy = "once"
