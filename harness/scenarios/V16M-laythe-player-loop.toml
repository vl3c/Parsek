steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, measured
  # and structural rather than fixture-specific): loading a save whose own parked
  # craft is active makes the committed-tree restore path resume a promotion-stub
  # recording ~1 s into the scene, BEFORE any step can run. StopRecording is
  # idempotent-OK and DiscardTree answers OK with nothing-discarded when no plain
  # tree is live, so the pair is safe on any entry state; the SetSetting stops a
  # later one.
  #
  # AND DO NOT READ IT AS A LATCH: B23 flight 1 MEASURED the committed-restore
  # path re-arming 11 ms after DiscardTree on a save carrying a committed tree for
  # its own parked craft, which is exactly this fixture's shape. That does not
  # hurt HERE - this lane starts no recording of its own and only observes - but
  # the pair does not guarantee no recorder is live afterwards.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins, same rationale as V4/V6M/V14M/V15M: ghostRenderTracing is
  # the FLIGHT-scene raise gate for the loop-seam-teleport Tier-C instrument;
  # mapRenderTracing arms the map/TS tracer + probe (the source of the
  # `surface=Proto*` truth lines the arrival evidence is read off); verboseLogging
  # is LOAD-BEARING for both (Tier-B truth is at Verbose - the V1 lesson), AND for
  # the two census lenses this lane exists to read twice, which are
  # VerboseRateLimited.
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
