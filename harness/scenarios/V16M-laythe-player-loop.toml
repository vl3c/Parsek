  { cmd = "TimeJump", args = { ut = "29873894" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "29874014" }, expect = "OK", budget = 300 },
  { cmd = "TimeJump", args = { ut = "29874214" }, expect = "OK", budget = 300 },
