# =====================================================================================
# *** NOT FLYABLE YET. *** This spec is committed AHEAD OF ITS SUBJECT: its
# `saveTemplate` names `fixtures/saves/laythe-orbit-recorded`, which does not
# exist until `B25-laythe-orbit` flies GREEN and its produced save is harvested.
# The tree id is a ZERO PLACEHOLDER and all EIGHT TimeJump UTs are CALIBRATION
# SEEDS. Running this before the harvest stages nothing and arms nothing.
#
# THE SEEDS WERE RE-DERIVED 2026-08-19 FROM B25 FLIGHT 1's MEASURED TIMELINE.
# That flight (runs `_1948` / `_2001`) came back INVALID(driver-flake) on its park
# WINDOW rather than on the flight - it flew Jool -> Laythe clean through capture -
# so its CLOCK is real even though its verdict is not, and section 3 now derives
# every jump from it. The correction was not cosmetic: the originally authored
# seam offset was 14,768 s off, against a bracket that is +-180 s wide, so the
# whole cycle-1 bracket would have missed the arrival. The seam offset is STILL a
# draw (it inherits the transfer-window wait), but `k = 20` is now BOUNDED across
# the entire wait band rather than seeded - see sections 1(B) and 3.
#
# It is committed early ON PURPOSE, and the exemption that allows it is
# self-retiring: `SharedShipsManifestTests.PENDING_FIXTURE_LANES`
# (harness/lib/test_hlib.py) lists this spec and REDS the moment
# `laythe-orbit-recorded` appears, which is the reminder that the calibration
# pass is owed. The reason to pay that price is the V14/V15 precedent: a
# PRE-REGISTERED prediction is worth more than a post-hoc description, and the
# V14 pair's REFUTED tidal-collapse prediction is the standing demonstration.
# Section 2 below is written to be SCORED, not to be right.
#
# THE CALIBRATION PASS OWES, in one commit:
#   (1) substitute the tree id from the harvested save's RECORDING_TREE node;
#   (2) re-derive the eight jump UTs from section 3's formulas using the
#       recording's OWN `explicitStartUT` / `explicitEndUT` / ORBIT_SEGMENT seam;
#   (3) pin the harvested payload in
#       `test_saveparse.py::CommittedFixtureSweepTests.RECORDED_FIXTURES`;
#   (4) delete this spec's `PENDING_FIXTURE_LANES` entry and V16T's;
#   (5) score sections 2, 4 and 5 against what the run actually printed.
# =====================================================================================
#
# V16M: THE PLAYER WORKFLOW ON THE FIRST JOOL-MOON SUBJECT - and the first loop
# lane in the suite whose CADENCE IS NOT ONE MOON PERIOD.
#
# ---------------------------------------------------------------------------------
# 1. WHAT THIS LANE ADDS OVER V14M AND V15M, STATED AS THE TWO THINGS IT IS
# ---------------------------------------------------------------------------------
# V14M measured the routing on B23's Duna->Ike recording and V15M measured it
# again on B24's Eve->Gilly one. Both printed the same road:
#
#   ExtractConstraints: ... members=1 launchBody=<parent> support=Supported
#     constraints=1 [Orbital(<moon>) same-parent P=<moon period> off=<seam>]
#   PhaseLock APPLIED: ... method=single-orbital cadence <span>-><P>
#     fixedCadenceResidual=0 fixedCadenceWithinTol=yes zeroDrift=no
#
# and the general fact behind it (`docs/dev/research/same-parent-reaim-jool-system.md`
# section 3.5) is that an ORBIT-ROOTED recording emits NO Rotation constraint, so
# a park-rooted single-moon subject reaches `single-orbital` BY CONSTRUCTION.
#
# THIS LANE DOES NOT RE-ASK THAT EITHER. It predicts the same classification and
# treats it as the control. What it adds is two things neither predecessor could:
#
#   (A) THE FIRST JOOL MOON. Section 3.1 of that research doc carries a committed
#       five-row table of the Jool moons and reasons over it for the whole of
#       sections 3.3 / 3.4 / 6 - the 1:2:4 resonance, the Vall-anchored lattice,
#       the "Bop makes the hold 7.4x longer than the window", the "Pol has no k
#       in 4,096" - and NOT ONE ROW HAS EVER BEEN FLOWN. Laythe's row:
#
#         SMA 27,184,000 m   ecc 0   P 52,980.879454 s   v_orb 3,223.8 m/s
#         SOI 3,723,645.8 m  tol = SOI/v_orb = 1,155.03 s   duty = tol/P = 2.180e-2
#
#       Laythe is the LOOSEST-tolerance row in the table and 34x looser than
#       Gilly's 6.37e-4, which is exactly why it is the right FIRST Jool moon: it
#       is the deliberate complement to B24/V15. Gilly asked the TOLERANCE
#       question where a residual could not hide; Laythe asks the RECURRENCE
#       question where a residual cannot corrupt the reading.
#
#       WHAT THIS LANE ACTUALLY DISCHARGES FROM THAT DOCUMENT'S J1-J5 OPEN-ITEMS
#       TABLE, stated narrowly so "starts populating the J-table" is a checkable
#       claim rather than a slogan: **one third of J1, and nothing else.** J1 asks
#       for the LIVE `P_Laythe / P_Vall / P_Tylo`, and this lane's own required
#       token `Orbital(Laythe) same-parent P=...` prints the period the GAME
#       resolves - which is exactly the Laythe third, and is also the number the
#       whole cadence prediction in (B) below turns on, so the run cannot green
#       without producing it. J2 (live SOI radii) is NOT measured here - nothing
#       prints an SOI radius, and the 3,723,645.8 m this header uses is the
#       table's own WIKI figure, which J2 flags for re-reading. J3/J4/J5 are
#       properties of a MULTI-moon constraint set and are structurally
#       unreachable from a single-moon subject.
#
#   (B) THE FIRST k > 1 CADENCE, AND IT IS THE SHARPEST NEW PREDICTION IN THIS
#       FILE. `QuantizeCadenceToMultipleOfP` takes the smallest `k*P` at or above
#       the raw cadence, and the raw cadence is floored at the recording's SPAN.
#       Every prior loop subject had a span BELOW one moon period, so k was 1 and
#       the cadence was exactly one moon period:
#
#         V14M  span  21,212 s  /  P_Ike    65,518 s  = 0.324  -> k = 1
#         V15M  span 115,361 s  /  P_Gilly 388,587 s  = 0.297  -> k = 1
#         V16M  span 1,029,700 s /  P_Laythe 52,981 s  = 19.435 -> k = 20
#
#       B25's span is dominated by a 1,014,005 s transfer coast - the Hohmann
#       half-period from a 590.33 Mm park down to Laythe's 27.18 Mm orbit - which
#       alone is 19.14 Laythe periods.
#
#       **AND B25 FLIGHT 1 MOVED THE k CLAIM IN BOTH DIRECTIONS - INCLUDING ONE
#       THIS BLOCK ORIGINALLY HAD WRONG.** The pre-flight version claimed
#       `k >= 20, possibly 21`, because the TRANSFER WINDOW WAIT is a free
#       variable in [0, one synodic] and only the upper end had been checked.
#       Flight 1 MEASURED the span at 1,029,700 s (`span/P = 19.4353`) on a
#       27,865.5 s wait, and re-basing that measurement across the whole band
#       gives:
#
#         wait <= 4,802.2 s (8.97% of the synodic)  ->  span <= 19*P  ->  k = 19
#         wait  > 4,802.2 s                         ->                    k = 20
#         k = 21 would need 57,783.1 s of wait - 4,273.4 s MORE than a full
#         synodic - so it is **EXCLUDED OUTRIGHT**.
#
#       SO BOTH HALVES OF THE ORIGINAL CLAIM WERE OFF BY ONE: the floor is 19, not
#       20, and the ceiling is 20, not 21. THE EXCLUSION IS THE LOAD-BEARING HALF,
#       because k = 21 is the case that would move every cycle-2 jump by a whole
#       period; k = 19 vs 20 stays a ~9%-probability read for the calibration
#       pass, and the committed seeds take the 91% branch. Section 3 carries the
#       arithmetic, and the pass should still read the cadence off
#       `PhaseLock APPLIED` rather than trust any of it.
#
#       WHAT k > 1 MEANS FOR THE MEASUREMENT, which is the reason it matters
#       rather than being a curiosity. Faithful playback replays a FIXED
#       body-frame position at an epoch shifted by `(N-1) * cadence`. The moon
#       returns to the same place iff the cadence is an exact multiple of its TRUE
#       period, so a model error `dP` walks the moon `v_orb * (N-1) * k * dP`
#       metres along its orbit, and the SOI buys `dP <= tol / ((N-1) * k)`:
#
#         V15M cycle 2:  tol 200.2 s / (1 * 1)  =  200.2 s of dP budget
#         V16M cycle 2:  tol 1,155.0 s / (1 * 20) =  57.8 s of dP budget
#
#       i.e. THIS LANE IS ~3.5x SHARPER IN dP THAN V15M despite reading at a
#       tolerance 5.8x looser, because each cycle boundary is twenty moon orbits
#       rather than one. That is the first time the suite has had any leverage on
#       the multi-orbit recurrence question at all.
#
# ---------------------------------------------------------------------------------
# 2. THE PREDICTIONS - written down before the flight so they can be scored
# ---------------------------------------------------------------------------------
# THE ROUTING, PREDICTED AND ONLY PARTLY GATED (the value-free `PhaseLock
# APPLIED: mission=` prefix is required; `method=` is deliberately NOT, because
# it is the thing being measured - V14M's header records what pre-pinning a
# predicted method costs):
#
#   ExtractConstraints: tree=<B25 tree> members=1 launchBody=Jool
#     ut0=<explicitStartUT> support=Supported constraints=1
#     [Orbital(Laythe) same-parent P=52980.879... off=<seam offset>]
#   PhaseLock APPLIED: mission='<B25 mission name>' tree=<B25 tree>
#     anchor <base>-><anchor> P=52980.879... method=single-orbital
#     cadence <span>->1059617.589... fixedCadenceResidual=0
#     fixedCadenceWithinTol=yes zeroDrift=no
#
#   P DERIVED FROM STOCK ELEMENTS, digits shown so the calibration pass can check
#   the product against arithmetic rather than against another log:
#     a = 27,184,000 m, mu_Jool = 2.82528e14 m^3/s^2
#     a^3        = 2.008921...e22
#     a^3 / mu   = 7.110173...e7
#     sqrt       = 8,432.19...
#     x 2*pi     = 52,980.879454 s
#   AND THE CADENCE IS **NOT** THAT NUMBER, which is the whole of (B): it is
#   `k * P` with k = ceil(span / P) >= 20. At the section-3 span seed that is
#   20 * 52,980.879454 = 1,059,617.589 s.
#
#   NOTE WHAT DOES **NOT** CHANGE. `fixedCadenceResidual` is still predicted 0 and
#   `zeroDrift` still `no`: a single-constraint solve reports residual 0 by
#   construction (`count == 1 -> method = "single-orbital", residual 0`) and
#   `TryBuildRelaunchSchedule` returns false on `rawCount < 2`. Quantizing the
#   cadence to a MULTIPLE of P does not touch either. So the pre-registered
#   prediction is: SAME ROAD, SAME RESIDUAL, DIFFERENT MULTIPLE - and if the
#   multiple comes back 1 anyway, that is a finding about
#   `QuantizeCadenceToMultipleOfP` (or about the span) and not a spec bug.
#
# THE INSTRUMENTS, and this lane finally has TWO CYCLES OF BOTH:
#
#   `seam-endpoint summary evaluated=N outsideSoi=M` - per evaluated cross-body
#     seam, is the replayed endpoint still INSIDE the destination SOI at the
#     replay epoch? All three moon lanes before this read it at CYCLE 1 ONLY (see
#     2b). `outsideSoi > 0` here would mean the ghost's recorded Jool->Laythe
#     entry point is no longer within 3,723,646 m of Laythe at the re-anchored
#     time - the replay arriving where the moon USED to be.
#   `faithful-parity summary sampled=N overTolerance=M` - the per-pid
#     rendered-vs-recorded parity pass; a nonzero `overTolerance` is a render
#     drift independent of the moon. NOTE the standing blind spot: V6M, V14T,
#     V15M and V15T all read `sampled=0 skip.reaimed-or-foreign-seed=1` where
#     V14M read `sampled=1` (docs/dev/todo-and-known-bugs.md ->
#     FAITHFUL-PARITY-SEED-FRAGMENT-REBASE), so the pin below is the PRESENCE
#     form on purpose and `sampled=[1-9]` is NOT predicted.
#
# ---------------------------------------------------------------------------------
# 2b. THE CENSUS-PACING UPGRADE - THIS LANE'S OWN MACHINERY, AND WHY IT IS HERE
# ---------------------------------------------------------------------------------
# V15M was designed around a CYCLE-1-vs-CYCLE-2 census comparison and COULD NOT
# READ IT. Its three runs each emitted the `seam-endpoint summary` exactly ONCE,
# at cycle 1, byte-identically. The mechanism is named precisely in
# `docs/dev/todo-and-known-bugs.md` -> SEAM-ENDPOINT-CENSUS-UNREADABLE-ON-A-SHORT-LANE
# and in research section 9.3:
#
#   Both lenses log through `ParsekLog.VerboseRateLimited(..., 5.0)`. The
#   2026-08-14 `line-blink-census` work CLASS-SPLIT the key into
#   `seam-endpoint-summary-measured` / `-skip-only` so a skip-only pass can no
#   longer shadow a measuring one - AND THAT SPLIT WORKS (V15M printed both
#   classes). What the split deliberately left alone is the 5.0 s limiter WITHIN
#   a class, which is correct for every lane that has ONE arrival. A multi-cycle
#   lane has TWO, both in the measuring class, and every `TimeJump` is an
#   INSTANTANEOUS Planetarium clock set - so V15M's 388,587 GAME-seconds between
#   cycles cost NO wall time and its two arrival brackets landed ~1.4 WALL-seconds
#   apart. The cycle-2 measuring pass fell inside the window the cycle-1 pass had
#   already spent, and was dropped.
#
# THAT ENTRY'S "MEASURE SHADOWS MEASURE" SUBSECTION IS THE MOTIVATION FOR THE STEP
# BLOCK BELOW, and section 9.3's RECOURSE 1 is what it implements verbatim:
# "wall-space the brackets ... `RecordingState` spacers are the established
# instrument - V8 used them to re-pace a bracket for the line-blink straddle ...
# Cheapest; changes pacing only, not the measurement, and costs log volume on NO
# other lane."
#
# THE SIZING, done honestly rather than by feel. `run.py`'s `POLL_INTERVAL_SECONDS`
# is 0.25, and a seam verb needs at least a submit poll and a result poll, so
# 0.25 s is the ABSOLUTE floor per `RecordingState` round trip and 0.5 s the
# realistic one; V5 MEASURED two of them costing 1.08 s of 1x on run
# 2026-08-08_1144, i.e. 0.54 wall s each. FORTY TICKS therefore spend:
#     >= 10.0 wall s at the 0.25 s hard floor      (2.0x the 5.0 s window)
#     ~ 21.6 wall s at V5's measured 0.54 s        (4.3x)
# on top of the ~1.4-3 wall s the intervening verbs already spend (V15M's
# measured inter-bracket gap with NO ticks). Sizing at 2x the window AT THE HARD
# FLOOR is the point: a 12-tick block would clear 5.0 s only at the measured rate
# and not at the floor, which is exactly the kind of margin that turns a
# calibration run into a second calibration run.
#
# WHAT THE TICKS COST, priced rather than waved away:
#   * ~22 wall s on a 2,400 s budget. Negligible.
#   * ~22 GAME seconds of 1x playback at the cycle-1 park epoch. The recorded
#     destination phase is 2,562.7 s (measured) and the park epoch sits 70.7%
#     into it, so ~751 s of recorded tail remain - 34x the dwell. The ghost cannot run off
#     the end of its own span. (On V15M's 381 s Gilly phase the same block would
#     have left 112 s of margin, which is why this instrument is being introduced
#     HERE rather than retrofitted there.)
#   * NOTHING ELSE. `RecordingState` is `AnyScene` and side-effect-free; it reads
#     state and returns. It is the only time-passing instrument the seam has -
#     there is no sleep/wait verb - and inventing one for this would be a product
#     change for a pacing problem.
#
# SO THIS PAIR IS THE SUITE'S FIRST k > 1 RECURRENCE INSTRUMENT, and the two
# halves are independent: (B) gives it a cadence worth reading twice, and this
# block gives it the ability to read it twice. Either alone measures nothing new.
#
# WHAT IT STILL CANNOT DO, stated so the reading is not over-claimed: two cycles
# is N = 2. If the cycle-2 census reads `outsideSoi=0` that bounds `dP < 57.8 s`,
# which is a REAL bound and the first of its kind - but it is not a drift RATE,
# and nothing here distinguishes "no residual" from "a residual too small to walk
# 3.7 Mm in twenty orbits". A third cycle would.
#
# ---------------------------------------------------------------------------------
# 3. THE SCHEDULE - CALIBRATION SEEDS, WITH EVERY FORMULA SHOWN
# ---------------------------------------------------------------------------------
# EVERY NUMBER IN THIS SECTION IS NOW DERIVED FROM **B25 FLIGHT 1'S MEASURED
# TIMELINE** (runs 2026-08-19_1948 / _2001, both INVALID(driver-flake) on the park
# WINDOW rather than on the flight - B25's FLIGHT LEDGER has the account). That
# flight flew Jool -> Laythe clean through capture, so its clock is real even
# though its verdict is not: the seam, the arrival periapsis UT and the window
# wait are MEASUREMENTS. Only the tail past the capture burn (the park dwell and
# the commit, ~282 s) is still estimated, because the run flaked before reaching
# it. The FORMULAS remain the contract; the values are now measured seeds.
#
# THE FIRST AUTHORED SEED SET WOULD HAVE MISSED THE ARRIVAL ENTIRELY, which is
# worth recording as the value of flying B25 before calibrating: it put the seam
# offset at 1,041,905 s where the flight measured 1,027,137 s, a **14,768 s
# error** against a bracket that is +-180 s wide. Nothing about that was sloppy -
# it was a plan estimate, and this is exactly what a calibration run is for.
#
# With no zero-drift schedule the anchor is the plain Tier-1 window snap:
#   `phaseAnchorUT = solution.NextWindowUT = NextWindow(extraction.UT0, P, referenceUT)`
#   (MissionLoopUnitBuilder.cs:386), where
#   `referenceUT = max(mission.LoopAnchorUT, spanEndUT)` (:295 + :378),
#   i.e. `phaseAnchorUT = UT0 + k_a*P` with `k_a = ceil((referenceUT - UT0)/P - 1e-9)`.
#
# THE FOUR INPUTS (each names what will replace it at the harvest):
#   UT0        = 27,787,320   MEASURED to ~1 s. B25's machine reports
#                `startInOrbitAnchorUt=27787321.200` (its first finite-UT frame)
#                and `launchUt=27787322.260`; the seam StartRecording ran in the
#                preamble, just before both. The fixture's own FLIGHTSTATE UT is
#                27,787,319.42, so the recording's `explicitStartUT` is pinned
#                inside a ~3 s window.
#                REPLACE WITH: the recording's `explicitStartUT` - NOT segment 0's
#                startUT. The V6M convention, settled three times now (V6M exact,
#                V14M to 0.04 s, V15M's fixture reproducing a 2.500 s gap between
#                the two candidates); using segment 0 would put every bracket off
#                by that gap.
#   seam       = 28,814,457.3  MEASURED, and this is the number the first seed set
#                got badly wrong. The last Jool-framed telemetry frame is at
#                ut 28,814,453.058 and the first Laythe-framed one at
#                28,814,494.178 with `alt=3,174,048.114` (r = 3,674,048, already
#                49,598 m inside the 3,723,645.8 m SOI) closing at 1,345.35 m/s,
#                so the crossing is 36.9 s before that frame. KSP.log line 11725
#                carries the boundary itself
#                (`SOI change boundary suppressed in tree mode: Jool to Laythe`).
#                REPLACE WITH: the adjacent `endUT == startUT` BODY-CHANGE pair in
#                the `.prec.txt` ORBIT_SEGMENT chain.
#   spanEnd    = 28,817,020    PART-MEASURED. The capture node - which IS the
#                arrival periapsis - sits at 28,816,737.965 (ttPe 2,235.877 at
#                ut 28,814,502.088 lands exactly there). Add half of the 163.5 s
#                capture burn plus the ~200 s of PARK debounce + 180 s dwell +
#                commit that flight 1 never reached. THE ONLY ESTIMATED TERM IN
#                THIS SECTION, and it is ~282 s on a 1.03 Ms span.
#                REPLACE WITH: `explicitEndUT`.
#   save UT    = ~ spanEnd + 3   the produced save's FLIGHTSTATE `UT` (the loop is
#                armed on the first frames after LoadGame, so LoopAnchorUT ~ this).
#
# THE ARITHMETIC:
#   P            = 2*pi*sqrt(27,184,000^3 / 2.82528e14) = 52,980.879454 s
#   span         = 28,817,020 - 27,787,320       = **1,029,700**
#   seam offset  = 28,814,457.3 - 27,787,320     = **1,027,137.3**
#   dest phase   = span - seam offset            = **2,562.7**
#   referenceUT  = max(save UT, spanEndUT)       = UT0 + 1,029,703
#   k_a          = ceil(1,029,703 / 52,980.879454 - 1e-9) = ceil(19.4353) = **20**
#   phaseAnchorUt= 27,787,320 + 20 * 52,980.879454 = **28,846,937.589**
#   cadence      = QuantizeCadenceToMultipleOfP(raw floored at span 1,029,700)
#                = 20 * P = **1,059,617.589**
#
#   **k = 21 IS NOW EXCLUDED, AND k = 20 IS THE 91% BRANCH.** The pre-flight
#   version of this section said "k >= 20, probably 20, possibly 21" and was off by
#   one at BOTH ends, because the TRANSFER WINDOW WAIT is a free variable in
#   [0, one synodic] and only the upper end had been checked. The flight MEASURED
#   that wait at `transferNodeUt 27,815,187.750 - launchUt 27,787,322.260 =
#   27,865.5 s` (0.521 synodic), which fixes the wait-free part of the span at
#   1,029,700 - 27,865.5 = 1,001,834.5 s. Against `19*P = 1,006,636.710` and
#   `20*P = 1,059,617.589`:
#       wait <= 4,802.2 s (8.97% of the synodic)  ->  k = 19
#       wait  > 4,802.2 s                         ->  k = 20
#       k = 21 needs 57,783.1 s of wait, 4,273.4 s MORE than a full synodic
#                                                 ->  IMPOSSIBLE
#   THE EXCLUSION IS WHAT MATTERS to this table: k = 21 is the branch that would
#   move every cycle-2 jump by a whole period, and it cannot happen. k = 19 is a
#   ~9% branch that would move it the other way by one period, and the seeds below
#   take the 91% one. READ THE CADENCE off `PhaseLock APPLIED: ... cadence
#   <raw>-><quantized>` at the calibration pass regardless - a bound is not a
#   proof, and the ~282 s estimated tail in `spanEnd` sits inside these margins.
#
# THE JUMP TABLE, and every value in `steps` below is one of these rounded to the
# nearest whole second (V14M/V15M's convention):
#
#   cycle-1 anchor (relaunchUt)  28,846,937.589
#   cycle-1 seam   anchor + 1,027,137.3  = 29,874,074.889
#     bracket -180 / -60 / +140          -> 29873895 / 29874015 / 29874215
#   cycle-1 park   anchor + 1,028,949.1  -> 29875887
#   cycle-2 anchor cycle-1 + cadence     = 29,906,555.178
#   cycle-2 seam   anchor + 1,027,137.3  = 30,933,692.478
#     bracket -180 / -60 / +140          -> 30933512 / 30933632 / 30933832
#   cycle-2 park   anchor + 1,028,949.1  -> 30935504
#
# WHERE THE PARK OFFSET COMES FROM: 70.7% of the way through the destination
# phase - V14M's own fraction (its park sat 2,917 s into a 4,128 s Ike phase) and
# V15M's - i.e. seam + 1,811.8 s into a 2,562.7 s phase, leaving ~751 s of
# recorded tail after it. That tail is what the 40-tick dwell block (section 2b)
# runs inside, and it is 34x longer than the block needs.
#
# WHAT IS STILL A DRAW, AND MUST NOT BE READ AS PINNED: the SEAM OFFSET inherits
# the window-wait variance. Flight 1 waited 0.521 synodic; the next flight can
# wait anywhere in [0, 53,509.6] s, which moves the seam offset by up to
# -27,865 / +25,644 s relative to the value above. The bracket is +-180 s wide, so
# **the calibration pass MUST re-derive the offset from the harvested recording's
# own bytes rather than trusting this table.** The table's job is to be RIGHT IN
# SHAPE and close in value, not to be final. (The one thing that does NOT move
# with the wait is k, per the bound above.)
#
# THE FAILURE IS SELF-DETECTING IN ONE DIRECTION ONLY: a jump that lands BACKWARD
# of the live clock answers `REJECTED reason=backward-jump`, which is only a WARN,
# so that token is FORBIDDEN below. A jump that lands FORWARD but at the wrong
# epoch greens while dwelling nowhere, and nothing catches it but a human reading
# the two echo lines. ON A SEEDED TABLE THAT IS THE LIKELIER FAILURE, which is
# why the re-pin recipe is written out rather than implied.
#
# (THE RE-PIN RECIPE, V2-sense: read `phaseAnchorUt=` off `missionconfig
# applied:` and each cycle's `relaunchUt=` off `startloopplayback initiated:`,
# and the cadence off `PhaseLock APPLIED: ... cadence <raw>-><quantized>`. The
# offsets above are all relative to the anchor, so ONE anchor substitution fixes
# four jumps and ONE cadence substitution fixes the other four.)
#
# ---------------------------------------------------------------------------------
# 4. THE DESYNC HUNT - what the second cycle is for (V6M/V14M/V15M's shape)
# ---------------------------------------------------------------------------------
# Cycle 1 cannot show a cumulative arrival desync by definition, so this lane
# crosses cycle 1's arrival, presses "Warp to..." AGAIN (a real player action;
# mechanically `StartLoopPlayback` rebuilds the unit and resolves
# `NextLaunchAfter(now)`), and crosses cycle 2's arrival with the identical
# instrument set. Four legs, every one a MEASUREMENT and not a gate:
#   (a) does the ghost's map surface still rebind to a **Laythe-framed** orbit at
#       the cycle-2 arrival, as at cycle 1's?
#   (b) does the armed `loop-seam-teleport` Tier-C instrument raise on cycle 2
#       where it stayed silent on cycle 1?
#   (c) how far is the ghost from the parked observer at each cycle's park epoch
#       (the engine's own `engine-frame-iter [... zone= rdist=]` line)? EXPECT A
#       LARGE WALK and do NOT read it as a desync: V15M measured 775 m -> 115.6 km
#       between its cycles and research section 9.4 diagnosed it as co-orbital
#       PHASE walking, because the observer's own park period is incommensurate
#       with the cadence. Here the observer's Laythe park period is ~1,880-7,431 s
#       (depending on the delivered periapsis) against a 1,059,618 s cadence, so
#       the walk is expected to be at least as large.
#   (d) NEW, AND THE POINT OF THE PAIR: does the `seam-endpoint summary ...
#       outsideSoi=` census read TWICE, and do the two readings agree? Section 2b
#       is the machinery that makes this askable at all.
#
# ---------------------------------------------------------------------------------
# 5. THE WATCH PREDICTION - **REJECTED**, and unlike V15M's it does not depend on
#    the delivered park
# ---------------------------------------------------------------------------------
# The observer is the fixture's OWN parked craft - the player who watches a replay
# is standing where the flight ended - and at its park epoch the ghost flies that
# same recorded orbit, so the body test passes and only the separation decides.
# The measured boundary (docs/dev/todo-and-known-bugs.md ->
# WATCH-ENTRY-REFUSED-INSIDE-QUOTED-RANGE, the SINGLE authority) is the open
# interval **(51.5 km, 144.3 km)**: V7M ENTERED at 51,503 m with `zone=Visual`
# and was REFUSED at 144,349 / 191,497 / 198,711 m, every refusal carrying
# `zone=Beyond`. The render-zone hide is the plausible shared DRIVER of the
# refusals and the zone boundary is `GhostVisualRangeMeters = 120,000 m`.
#
# NOW THE GEOMETRY. Two co-orbiting objects on the same orbit are at most `2a`
# apart at any phase. B25's park window admits a periapsis anywhere in
# [60,000 m, 900,000 m] of altitude about a 500,000 m body, so:
#
#   SMALLEST admissible park   2a = 2 * (500,000 + 60,000)  = 1,120,000 m
#   LARGEST  admissible park   2a = 2 * (500,000 + 900,000) = 2,800,000 m
#
# and even the SMALLEST is **9.3x the 120,000 m render-zone boundary** and 3.7x
# the 300,000 m `WatchEnterCutoffMeters` range term. THAT IS THE INVERSION OF
# V15M: its Gilly park had `2a = 79,345 m`, the first loop subject whose ENTIRE
# orbit fit inside the measured bracket, so its OK depended on the park B24
# actually delivered. HERE THE VERDICT IS PARK-INDEPENDENT ACROSS THE WHOLE
# ADMISSIBLE WINDOW, which is a stronger statement than V14M's (Ike 2a = 340.9 km,
# also REJECTED, but only 2.8x the boundary).
#
# TWO HONEST CAVEATS:
#   (i) `2a` is the MAXIMUM separation, not the separation. The two craft sit at
#       a per-cycle phase that could be anywhere in [0, 2a], so an unlucky (or
#       lucky) phase could put them close and produce an OK. That would be the
#       FINDING - a second watch entry, at a third parent - not a spec bug. What
#       the arithmetic says is that the great majority of phases are beyond
#       120 km, not that every phase is.
#   (ii) `retry = once` does NOT absorb an unlucky phase. Both craft advance on
#       the same orbit, so the separation is a fixed per-cycle geometric fact
#       that moves only when the phase anchor does (V6M's superseded-arithmetic
#       banner). A REJECTED reproduces exactly on attempt 2.
# The grammar has ONE `expect` per step, so the likelier verdict is what is
# pinned; an OK lands as driver-INVALID and IS THE INTERESTING FINDING. If a step
# comes back INVALID, re-shape it per the finding - NEVER re-roll for the pinned
# verdict.
#
# AND A CONSEQUENCE WORTH PRE-REGISTERING: because the watch steps are predicted
# REJECTED, **the NRE storm is predicted ABSENT**.
# `docs/dev/todo-and-known-bugs.md` -> WATCH-LOOPED-PARK-TARGET-LOSS-NRE-STORM is
# V15M's 447-then-443 NullReferenceException population, and its only known
# trigger is watch mode ACTIVE ACROSS A LOOP-CYCLE BOUNDARY - the intersection
# V15M is the only run in the suite ever to have reached, and one this lane
# cannot reach if the first EnterWatchMode is refused. So:
#   * a clean `unityExceptions` reading here CONFIRMS the trigger hypothesis by
#     the same shape V15T did (V15T has no watch steps, same fixture, zero NREs);
#   * an NRE population here WITH both watch steps REJECTED would REFUTE it, and
#     that is a sharper result than another 443. `unityExceptions` is report-only
#     either way and nothing below arms it.
#
# ---------------------------------------------------------------------------------
# 6. POSTURE - FIRST-RUN READING, NOTHING ARMED ON THE MEASUREMENT SIDE
# ---------------------------------------------------------------------------------
# `required` is the NINE-token reading set (V15M's pre-flight set with the body
# swapped): the lifecycle chain, the value-free `PhaseLock APPLIED: mission=`
# prefix, the `Orbital(Laythe) same-parent` classification, the STRONG arrival
# pin, and the two lens PRESENCE pins. DELIBERATELY NOT REQUIRED YET:
# `method=single-orbital ... zeroDrift=no` (the conjunction is exactly what this
# run measures at a k > 1 cadence), `support=Supported`, `reaimed=False`, the
# `exoCoastBodyChangeKept=1` cohesion pin, and any VALUE form of the census - all
# of which are what the arming pass adds, off this run's own bytes.
#
# `forbidden` IS ALREADY AT V14M/V15M's FULL SIX, and that asymmetry is
# deliberate rather than an oversight: every one of the six guards a PREMISE
# (an ERROR, a re-aim on a same-parent subject that structurally cannot re-aim, a
# refused backward jump on a SEEDED table, a rendered-vs-recorded parity drift)
# rather than deferring a MEASUREMENT. There is nothing to learn by letting any
# of them pass.
#
# `[expectations.rewind]` is declared REPORT-ONLY; `[expectations.recordings.structure]`
# and the points facets are ABSENT, because a report-only block of PREDICTED
# numbers reads like a measurement. Author them from run 1's saveParse facets.
# =====================================================================================
tier = "operator"
description = "NOT YET FLYABLE - committed AHEAD of its subject with a ZERO tree id and eight jump UTs RE-DERIVED 2026-08-19 from B25 FLIGHT 1's MEASURED timeline (tracked by the self-retiring SharedShipsManifestTests.PENDING_FIXTURE_LANES exemption, which reds the moment `laythe-orbit-recorded` appears). The player workflow (arm -> Warp-to -> cross the arrival -> Watch), twice over, on B25's Jool->Laythe recording - THE FIRST JOOL MOON anyone has flown, and the first row of the five-moon table docs/dev/research/same-parent-reaim-jool-system.md section 3.1 reasons over. TWO THINGS ARE NEW AND ONE IS THE POINT. (1) THE FIRST k > 1 CADENCE: B25's span is dominated by a 1,014,005 s transfer coast = 19.14 Laythe periods, so `QuantizeCadenceToMultipleOfP` takes k = ceil(span/P) >= 20 rather than the k = 1 every prior loop subject had, and cycle 2 therefore lands cycle-1 + k*P = TWENTY moon orbits later instead of one. That inverts the sensitivity: the dP budget a cycle boundary buys is tol/((N-1)*k) = 1,155.0/20 = 57.8 s here against V15M's 200.2 s, i.e. ~3.5x SHARPER despite reading at a tolerance 5.8x looser. AND B25 FLIGHT 1 MOVED THAT CLAIM IN BOTH DIRECTIONS, including one half this spec originally had wrong: it measured span 1,029,700 s (span/P = 19.4353) on a 27,865.5 s window wait, and re-basing that across the whole wait band gives k = 19 for a wait under 4,802.2 s (8.97% of the synodic), k = 20 above it, and k = 21 EXCLUDED OUTRIGHT (it would need 4,273.4 s more wait than a full synodic can supply). So the pre-flight 'k >= 20, possibly 21' was off by one at BOTH ends; the exclusion is the load-bearing half and the seeds take the 91% k = 20 branch. That flight also moved the seam offset from the authored 1,041,905 s to a measured 1,027,137.3 s, a 14,768 s correction against a bracket +-180 s wide, which is precisely the miss a calibration run exists to catch. (2) THE CENSUS-PACING UPGRADE, which is what makes (1) readable: forty `RecordingState` dwell ticks between the cycle-1 park epoch and the cycle-2 re-arm, spending >= 10 wall s at run.py's 0.25 s poll floor (2.0x the 5.0 s VerboseRateLimited window) and ~21.6 s at V5's measured 0.54 s/tick, so the cycle-2 `seam-endpoint summary` escapes the limiter window that swallowed it on all three V15M runs. This implements research section 9.3's RECOURSE 1 verbatim and makes the pair the suite's FIRST k > 1 recurrence instrument. The watch steps are pinned REJECTED and, unlike V15M's, the verdict is PARK-INDEPENDENT: B25's park window admits 2a from 1,120,000 to 2,800,000 m, so even the smallest admissible orbit is 9.3x the 120 km render-zone boundary. Because of that the WATCH-LOOPED-PARK-TARGET-LOSS-NRE-STORM population is predicted ABSENT, and an NRE storm with both watch steps refused would REFUTE that entry's trigger hypothesis - a sharper result than another 443."
