# CLAIM-IS-NOT-GATE, and on a reading run the list is short for that reason.
#   D9  `fast-forward`  is gated by the PRODUCT's own `FastForwardToEventUT: jumping
#       to UT=` line (V4/V6M/V14M/V15M's precedent), NOT by the seam verb's OK - a
#       seam that reported OK without the product jumping fails it.
#   D11 `phase-lock`    is gated by the Info-level `PhaseLock APPLIED: mission=`
#       line. That token is VALUE-FREE and therefore survives EITHER outcome of
#       the routing prediction: it fires whenever `solution.ShouldPhaseLock` held,
#       whatever `method=` and the cadence multiple then read. If the lock does
#       NOT apply this reds - which is the correct outcome, because the claim
#       would be false.
#   D14 `laythe` / `scene-flight` / `sandbox` are the environment axes this lane
#       runs on; `laythe` is gated by the `body=Laythe` map-render truth line
#       below rather than by the epoch alone (V14T's iteration-1 lesson, applied
#       up front).
#
# NOT CLAIMED, DELIBERATELY:
#   D11 `zero-drift-schedule` - V6M's cell, gated there by `zeroDrift=yes` +
#       `scheduleWithinTol=yes`. This lane PREDICTS `zeroDrift=no` (one
#       constraint, so `TryBuildRelaunchSchedule` returns false on `rawCount < 2`),
#       so claiming it would be claiming the opposite of what the run is expected
#       to measure. NOTE the k > 1 cadence does NOT change this: quantizing a
#       fixed cadence to a multiple of P is not a schedule.
#   ANY WATCH-MODE CELL - D6 carries `watch-mode-retarget-explosion-hold`, which
#       is about retarget / explosion-hold behaviour, and there is no plain
#       watch-ENTRY cell to claim. V7M and V15M, the only two lanes that have
#       ever entered, claim none either. And this lane predicts REJECTED anyway.
#   D11 any arrival cell - this OBSERVES an arrival epoch; it asserts no arrival
#       geometry.
#   D6 `time-jump`, and `jool` on D14 - the jumps are the instrument rather than
#       the subject, and although the recording's early ORBIT_SEGMENTs are
#       Jool-framed nothing in THIS spec's contract gates a Jool-framed render.
[dimensionsCovered]
D9  = ["fast-forward"]
D11 = ["phase-lock"]
D14 = ["laythe", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header or TOML scopes it into the sub-table
# (hlib.validate_spec rejects that form).
#
# EMPTY, deliberately: the loop-seam-teleport instrument is armed with no budget
# so a raise is REPORTED as the finding it would be rather than pre-budgeted
# away. That instrument is half of the desync hunt.
#
# AND ONE KNOWN INTERMITTENT IS PRICED RATHER THAN PRE-TOLERATED: V15M's negative
# control run swept `hits=['line-blink']` at its CYCLE-2 PARK epoch (1-of-3 on a
# byte-identical shape; the ghost's proto orbit line, dark edge, `sinceFrames=8`,
# OFF decided by `director-traced-path-suppress` - a case the window-exit
# exemption deliberately does not cover). This lane's cycle-2 park is
# structurally the same moment at a much larger separation, so the same raise is
# PLAUSIBLE here. It stays untolerated: a red on `line-blink` is a real reading
# to be read, and `retry = once` will spend an attempt on it when it fires. Full
# account: docs/dev/todo-and-known-bugs.md -> LINE-BLINK-JUMP-STRADDLE-DETECTOR-GAP.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the
# produced save's `Parsek/Recordings` dir, and the (not yet harvested) fixture is
# predicted to ship exactly ONE - B25 flies its hop as one piece, as that spec's
# own count block derives. This lane starts no recording of its own - it arms,
# warps, watches, jumps and dwells - so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +1  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split. THE PREDICTION IS
#       NO SPLIT. This recording has no atmospheric phase at all (it starts in
#       orbit and B25's 60 km floor keeps it out of Laythe's 50 km air) and its
#       ONE body change is the Jool->Laythe seam, where section-3 rule 3 of
#       `IsSplittableEnvOrBodyBoundary` keeps a same-class Exo body change
#       COHESIVE for transfer coasts - explicitly including the
#       OrbitalCheckpoint-framed on-rails variant, which this crossing is (B25
#       flies the whole approach under its warp clamp, never under physics). V14M
#       MEASURED that rule firing at Duna->Ike and V15M/V15T at Eve->Gilly;
#       Jool->Laythe is the THIRD body pair and the first at a GAS GIANT parent.
#       The 2 is admitted because the load-time walk fires for the FIRST time on
#       this lane's LoadGame - B25's own run commits and flushes without
#       re-loading - so this is where it would show.
# => the pre-flight window was { min = 1, max = 2 }, a derived range.
#
# MEASURED 1 on the reading run `2026-08-19_2114`, with the optimizer's own reason
# in the same log (`Split summary: rec=370d3824... evaluated=1 ...
# exoCoastBodyChangeKept=1` at 10141): the LOAD-TIME pass evaluated the
# Jool->Laythe boundary and KEPT IT COHESIVE - the same answer V14M got at
# Duna->Ike and V15M/V15T got at Eve->Gilly, now at a FOURTH body pair and the
# first at a gas-giant parent. That token is REQUIRED below so the answer cannot
# silently regress into a split.
#
# PINNED EXACTLY AT 1: a 2 means the cohesion rule stopped firing (or a promotion
# stub survived the StopRecording/DiscardTree pair), and a 0 means the fixture
# lost its recording. Both are findings, which is what a tight window is for.
count = { min = 1, max = 1 }

[expectations.logContracts]
# THE LIFECYCLE CHAIN (each the product's own line except the two seam-verb Info
# lines):
#   "missionconfig applied:"       - the arm verb ran; ALSO echoes phaseAnchorUt,
#                                    the single most important number to read
#                                    when calibrating the brackets.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired, not
#                                    just the seam.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door
#                                    and echoed the resolved relaunchUt (read
#                                    this per cycle; the two should differ by the
#                                    CADENCE, not by one moon period).
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line. This is
#                                    what makes the D9 claim GATED rather than
#                                    asserted.
#   "PhaseLock APPLIED: mission="   - Info, from the builder. Gates D11
#                                    `phase-lock`, and is deliberately the
#                                    VALUE-FREE prefix so the claim does not
#                                    depend on the routing prediction being right
#                                    - which matters MORE here than on V14M/V15M,
#                                    because this lane's cadence prediction is
#                                    genuinely new.
#   "Orbital\(Laythe\) same-parent" - the extraction classified the destination as
#                                    a direct child of the launch body, which is
#                                    what keeps Support=Supported and makes
#                                    re-aim structurally unreachable. STRUCTURAL
#                                    rather than measured (Laythe IS a child of
#                                    Jool), so it is safe to require on a first
#                                    run where `method=` is not.
# THE ANTI-VACUITY / ARRIVAL PIN:
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Laythe" - a map-render TRUTH
#       line showing the ghost's proto orbit surface REBOUND onto a LAYTHE body
#       frame. A run that never gets the ghost to Laythe has measured nothing
#       about a Laythe arrival, and reading that as a pass is the V1/V2 vacuity
#       failure. This is the STRONG form (V14M/V15M's, not V6M's weaker
#       `Proto(Icon|OrbitLine)` which also matches a creation line). EXPECTED
#       TWICE, once per cycle - but the count is not pinned on a first run.
# THE PROBE / LENS PINS, in their PRESENCE form because both are being measured:
#   "faithful-parity summary sampled=\d+ overTolerance=\d+" - emitted only when
#       the per-pid parity pass touched the lens, so PRESENCE cannot be produced
#       by a frame with no resolved ghost. `sampled=[1-9]` is DELIBERATELY NOT
#       pinned: V6M/V14T/V15M/V15T all read `sampled=0
#       skip.reaimed-or-foreign-seed=1` where V14M read `sampled=1`
#       (docs/dev/todo-and-known-bugs.md -> FAITHFUL-PARITY-SEED-FRAGMENT-REBASE).
#   "seam-endpoint summary evaluated=\d+ outsideSoi=\d+" - THE LANE'S OWN
#       INSTRUMENT, and required only in the PRESENCE form on this run. The VALUE
#       form (`evaluated=[1-9]\d* outsideSoi=0`, V14M/V15M's armed pin) is what
#       the arming pass should add - AND the thing to check first is not its
#       value but its COUNT: this run exists to find out whether the 40-tick
#       dwell block made it fire TWICE. A single emission means the pacing was
#       still short and the k > 1 comparison is still unread (raise the tick
#       count); two emissions with equal `outsideSoi` readings is the result the
#       whole pair was built for.
# ---------------------------------------------------------------------------
# ARMED 2026-08-19 OFF THIS LANE'S OWN READING RUN `2026-08-19_2114` (PASS
# attempt 1, wall 64 s, all 61 steps met, `anomalySweep hits=[] hitCounts={}`,
# recordings count 1, saveParse 1/1/1 with every rewind facet 0). Every regex
# below was grepped in its EXACT form against that run's KSP.log before being
# written here, with PYTHON regex semantics (the harness's), and the match count
# is quoted per token so a future reader can tell a thin pin from a fat one.
#
#   "Orbital\(Laythe\) same-parent" (4) + "support=Supported" (8) - the
#     extraction classified the destination as a direct child of the launch body
#     and did NOT demote. MEASURED line (10602):
#       `ExtractConstraints: tree=0ffee645... members=1 launchBody=Jool
#        ut0=27787320.679510832 support=Supported constraints=1
#        [Orbital(Laythe) same-parent P=52980.879059379578
#         off=1027136.1469265819]`
#     NOTE `launchBody=Jool`: the recording is rooted at the JOOL park, and the
#     same-parent classification is Jool -> Laythe. THE DERIVATION HELD - the
#     product's `off=` is 0.040 s from header section 3's 1,027,136.107, the same
#     residue V14M and V15M measured and for the same reason (`ut0` reads
#     0.040 s below the fixture node's `explicitStartUT`).
#   "PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no" (4) - ONE
#     regex over ONE line, pinning the whole routing verdict as a conjunction
#     rather than as three presence checks that would pass on three different
#     lines. THE PRE-FLIGHT POSTURE IS DISCHARGED: the reading run required only
#     the VALUE-FREE prefix because `method=` was the thing being measured at a
#     k > 1 cadence. MEASURED line (10605):
#       `PhaseLock APPLIED: mission='Duna Rocket' tree=0ffee645...
#        anchor 28817027.07705152->28846938.260698423 P=52980.879059379578
#        method=single-orbital cadence 1029703.4375407547->1059617.5811875917
#        fixedCadenceResidual=0 fixedCadenceWithinTol=yes zeroDrift=no`
#     THIS IS THE THIRD ORBIT-ROOTED CONFIRMATION of the section-3.5 general fact
#     (after Duna->Ike and Eve->Gilly) and the FIRST at a gas-giant parent.
#     The derived anchor 28,846,938.309 came back 28,846,938.260698423 - **0.048
#     s** - and NO jump UT moved at arming.
#   **AND k = 20 IS CONFIRMED LIVE, WHICH IS THIS LANE'S HEADLINE.** The cadence
#     quantized 1,029,703.438 -> 1,059,617.581 = 20 * P, and cycle 2 resolved to
#     `relaunchUt=29906555.841886014` = cycle 1 + EXACTLY that (12752). The suite
#     has never had a loop cadence that was not one moon period; it does now.
#   "factory chain ... reaimed=False" (40) - the RENDER-side mode pin, the exact
#     inversion of V5's `reaimed=True`: what the map pipeline assembled is the
#     FAITHFUL chain, not a re-aimed one.
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Laythe" (40) - the STRONG
#     arrival pin (V14M/V15M's form, not V6M's weaker one which also matches a
#     creation line). A run that never gets the ghost to Laythe has measured
#     nothing about a Laythe arrival, and reading that as a pass is the V1/V2
#     vacuity failure.
#   "Split summary: rec=\w+ .*exoCoastBodyChangeKept=1" (1) - the LOAD-TIME
#     optimizer evaluated the Jool->Laythe boundary and KEPT IT COHESIVE
#     (section-3 rule 3). This is where B25 handed the question off, and it is
#     the **FOURTH body pair** to answer the same way after Duna->Ike,
#     Eve->Gilly and Gilly's TS half. Required so the answer cannot silently
#     regress into a split - the recordings count would move too, but the count
#     cannot say WHY and this token can.
#   "faithful-parity summary sampled=\d+ overTolerance=\d+" (2) - the PRESENCE
#     form. `sampled=[1-9]` is DELIBERATELY NOT pinned: this lane measured
#     `sampled=0 overTolerance=0 skip.reaimed-or-foreign-seed=2` (10859), the
#     same blind spot V6M/V14T/V15M/V15T read and different from V14M's
#     `sampled=1` (docs/dev/todo-and-known-bugs.md ->
#     FAITHFUL-PARITY-SEED-FRAGMENT-REBASE). The count is 2 rather than V15M's 1
#     because this lane crosses two arrivals.
#
# =====================  THE HEADLINE PIN  =====================================
#   "seam-endpoint summary evaluated=[1-9]\d* outsideSoi=0" (2) - and TWO
#   MATCHES IS THE WHOLE POINT OF THIS LANE. The census fired at BOTH arrivals:
#       cycle 1 (10860, 00:14:39.433)  `evaluated=2 outsideSoi=0`
#       cycle 2 (13199, 00:14:50.935)  `evaluated=2 outsideSoi=0 | suppressed=25`
#   **THIS IS THE SUITE'S FIRST k > 1 RECURRENCE MEASUREMENT.** At cycle 2 the
#   replay is re-anchored by a full cadence = TWENTY Laythe periods, and the
#   replayed Jool->Laythe SOI-entry endpoints are STILL INSIDE the 3,723,646 m
#   SOI. Every phase-lock statement this programme could previously make was a
#   k = 1 statement (research doc section 9.3 named that as its most consequential
#   gap); this one is not.
#
#   AND THE CENSUS-PACING BLOCK IS WHAT BOUGHT IT. The two measuring lines are
#   **11.502 wall-seconds apart** (39.433 -> 50.935), i.e. 2.3x the 5.0 s
#   `ParsekLog.VerboseRateLimited` window that swallowed V15M's cycle-2 emission
#   on all three of its runs. The forty-tick `RecordingState` block sits between
#   them and is the only thing in the step list that costs wall time. Research
#   doc section 9.3's RECOURSE 1 is now PROVEN, not merely proposed.
#
#   WHY THE VALUE FORM AND NOT THE PRESENCE FORM, stated because it is now
#   load-bearing in a way it was not on V15M: `evaluated=[1-9]\d* outsideSoi=0`
#   STRUCTURALLY EXCLUDES an `outsideSoi=1` reading. V16T measured exactly such a
#   line and it is a known instrument artifact (the creation-frame lens
#   mis-binding - see V16T's header and
#   docs/dev/todo-and-known-bugs.md ->
#   MAPRENDER-SEAM-LENS-EVALUATES-UNSHIFTED-EPOCH-ON-CREATION-FRAME). THIS LANE'S
#   censuses are taken at STEPPED bracket epochs where the loop shift has bound,
#   so a nonzero `outsideSoi` HERE would not be that artifact - it would be a REAL
#   phase-lock drift, which is precisely the eccentric-moon failure mode the Jool
#   research doc predicts for Bop/Pol. An armed red on this token is a finding to
#   read, not a pin to relax.
# ==============================================================================
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "Orbital\\(Laythe\\) same-parent",
  "support=Supported",
  "PhaseLock APPLIED: mission=.*method=single-orbital.*zeroDrift=no",
  "factory chain rec=\\w+ idx=\\d+ inst=\\d+ phases=\\d+ reaimed=False",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Laythe",
  "Split summary: rec=\\w+ .*exoCoastBodyChangeKept=1",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=[1-9]\\d* outsideSoi=0",
]
# V14M/V15M'S FULL SIX, ARMED FROM THE START. Every one guards a PREMISE rather
# than deferring a MEASUREMENT (header section 6), so there is nothing to learn
# by letting any of them pass.
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE RE-AIM FORBID TRIO - the falsifiable half of the routing claim. Each is a
  # token V4's re-aim lane either requires or guards; here every one of them
  # appearing would mean the same-parent mission took the interplanetary road,
  # which `!phaseLocked` says it cannot.
  "\\[ReaimDiag\\]",
  "ENGAGED re-aim",
  "FORCED FAITHFUL",
  # THE V3C RUN-3 SELF-DETECTION GUARD, and on a lane whose eight jump UTs are
  # CALIBRATION SEEDS rather than measurements this is BY FAR the most
  # load-bearing forbid in the file: a refused backward jump is only a WARN, so
  # without this token a mis-seeded bracket can green while dwelling nowhere.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance
  # is a rendered-vs-recorded drift, which is a defect in the RENDER rather than
  # a reading about the moon.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# ARMED 2026-08-19 (the V2/B17/V4/V14M/V15M arming discipline) off this lane's OWN
# reading run `2026-08-19_2114`, whose saveParse REPORT measured rewindPoints=0,
# supersedeRows=0, tombstones=0, rewindRetirements=0 - every window below already
# met, so the arming re-pinned nothing and moved no verdict.
#
# The claim being armed is V4/V6M/V14M/V15M's on a new axis: a pure
# replay-observation workflow (arm -> warp -> watch -> two cycles of forward jumps
# -> a forty-tick dwell) must author NOTHING durable, and a future change that
# starts writing an RP / supersede row / tombstone out of it reds here instead of
# passing as a REPORT footnote. THE DWELL BLOCK IS THE NEW SURFACE: forty extra
# seam round-trips is forty more chances to touch a durable store, and this is the
# gate that says they did not.
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# ARMED 2026-08-19, same reading run, which measured trees=1, committedTrees=1,
# recordings=1, terminalStates {Orbiting: 1}, branchPoints {} - i.e. exactly one
# committed tree survives the workflow: the scene-entry promotion stub never
# commits, and the StopRecording/DiscardTree pair leaves nothing behind.
#
# `trees` keeps V2's max = 2 - the documented duplicate-tree writer hazard (OnSave
# re-writes a still-active tree on ~3% of production saves) - deliberately WIDER
# than the single measurement rather than pinned to it. Everything else is pinned
# at the measured value, and `recordings = {1,1}` is doing double duty: it is also
# the FIXTURE CONTRACT (see [fixture] - a 2 or a FIVE would mean B23 flight 1's
# seam-StartRecording defect was back).
gating = true
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1 } }

[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 8x300 TimeJump + 40 RecordingState
# ticks (~10-22 wall s - the ONLY step block here that deliberately costs wall
# time) + the fast non-deferred verbs (2 watch attempts at the 60 s default, 6
# settings/recorder verbs) + KSP boot + collect. Every jump is an instantaneous
# clock set, so the ~3.16 Ms of game time this lane traverses costs no wall
# clock; V6M's 21-step shape measured 54 s end to end, V14M's 50 s and V15M's
# similar, and this lane's 61 steps add the dwell block to that. 2,400 is the
# family's budget and is ~30x any plausible reading.
budgetSeconds = 2400

[retry]
# One retry absorbs a transient seam flake. It does NOT absorb a MIS-SEEDED
# ANCHOR - that reproduces exactly on attempt 2, which is the point: a
# calibration miss must self-detect, not be retried away - and it does not
# absorb an unlucky watch phase either, because the separation is a fixed
# geometric fact rather than a draw (header section 5, caveat ii).
#
# AND IT IS PRICED FOR THE `line-blink` INTERMITTENT: `allowedAnomalies` is
# empty on purpose, so if that raise fires the retry spends an attempt on it.
# That is the deliberate trade (V15M's, verbatim) - a real reading is worth an
# attempt.
policy = "once"

[expectedFail]
bugId = ""
