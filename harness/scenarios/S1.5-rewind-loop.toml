schema = 1
id = "S1.5-rewind-loop"
# tier = "nightly" (RE-TIERED 2026-07-26, rewind-loop lane). It was "operator" on two
# stated reasons, and BOTH were factually wrong at HEAD:
#
#   1. "the seam has NO flight-entry verb, so from the gloops SPACECENTER host every
#      RequiresFlight verb only DEFERS to a TIMEOUT". FALSE, and it was never true.
#      `LoadGame` IS the flight-entry verb: it realizes the .sfs and, when
#      `game.flightState.activeVesselIdx` names a focusable vessel, takes the FOCUS
#      route - FlightCameraReloadPin.Arm + StartAndFocusVessel - landing in FLIGHT
#      (ParsekTestCommandAddon.LoadGameImpl + TestCommandLoadGame.DecideLoadRoute; the
#      SPACECENTER route is only the NO-VESSEL fallback). This spec's own template is
#      NOT a SPACECENTER host: fixtures/saves/gloops-airshow carries `activeVessel = 1`
#      over two VESSEL nodes, so the first step lands in FLIGHT. LIVE EVIDENCE: EVA-1
#      (nightly, FULL PASS 2026-07-24) drives six RequiresFlight verbs - StartRecording,
#      EvaExit, PlantFlag, EvaBoard, StopRecording, CommitTree - from this exact
#      template, and EVA-2 / EVA-3 / S0.5 / S0.6 do the same.
#   2. "DEPENDENCY: do NOT schedule before the integration-fixes PR merges" (the
#      TimeJump completion-decider fix). That PR is #1322, MERGED - `git log --oneline
#      origin/main --grep=integration-fixes` -> eb94607dd "Merge pull request #1322 from
#      vl3c/autotest-integration-fixes".
#
# Neither operator-tier reason therefore survives: reason (a) "PASS unreachable
# unattended" is the premise corrected above, and reason (b) "EXPENSIVE AND UNFLOWN"
# needs BOTH - this is a flight-free seam run whose happy path is ~800 s, not a
# B16-class 4,700 s lane. COST OF A FIRST-FLIGHT FAILURE, since that is what reason (b)
# actually weighs: the 2400 s budget below bounds the DEFER path, and the defer path is
# exactly what the correction above removes. With the verbs EXECUTING, a bad run ends on
# a fast terminal verdict (`REJECTED unknown-rp` / `refly-gate <reason>` / an unmet step)
# within seconds of the boot, so the real repeated cost is ~2 short KSP boots a night,
# not 2 x 2400 s. nightly rather than daily because it is still UNFLOWN: its first
# scheduled run IS its live-prove, and a failure there classifies driver-INVALID
# (retryable), never a false PARSEK-FAIL. The pending-operator TAG stays until that
# first green run; the tag alone is non-gating.
#
# NOT VERIFIED BY A RUN: this re-tier is derived from the code + EVA-1's live precedent,
# not from an S1.5 flight (the rewind-loop lane was headless by constraint). If the first
# nightly reds on something structural rather than a real Parsek finding, put it back.
tier = "nightly"
# S1.5 rewind loop (core loop, D18), DRIVABLE SUBSET. The full catalog S1.5 is
# "fly B1, commit, warp past EndUT (vessel spawns), quicksave, rewind via seam,
# assert vessel stripped, ghost replays, vessel re-spawns situation-corrected;
# crew re-reservation + resource reset against the ledger oracle." Several of those
# legs need capabilities M-C1 does not provide (see the GAP note below), so this
# spec drives the fly-FREE subset the M-C1 verbs CAN reach: reuse the injected
# rewind-b9 tree instead of flying B1, TimeJump past the injected recording's EndUT
# to trigger the end-of-recording spawn (D6 time-jump + D18 time-jump-observables),
# then use the fixture-provided RewindPoint as the "quicksave-equivalent" and drive
# the rewind-strip-respawn cycle through the seam (D18 rewind-strip-respawn-cycle).
#
# GAP (documented in docs/dev/todo-and-known-bugs.md): the FULL S1.5 additionally
# needs (a) a live B1 flight + commit -> the mission-autopilot library, not a seam
# verb (the rewind-loop lane's `r1_rewind_loop` mission is the first cut of that);
# (b) a way to target a RewindPoint the flight itself authored rather than an
# injected one. That needs TWO things neither of which exists: a flight that
# performs a MULTI-CONTROLLABLE split (ParsekFlight.TryAuthorRewindPointForSplit ->
# SegmentBoundaryLogic.IsMultiControllableSplit; a dropped booster carries no
# ModuleCommand so an ordinary ascent authors NO RP), and a seam channel exposing
# the live RewindPoint id (InvokeRewind matches RewindPointId EXACTLY and live ids
# are fresh GUIDs from RewindPointAuthor.cs; RecordingState's payload is
# recording/tree/points/scene only). The injected rp_b9_root stands in until then;
# (c) a career fixture + ledger oracle for the crew-re-reservation / resource-reset
# asserts (rewind-b9's host is a sandbox save). Those three live asserts stay
# PENDING-OPERATOR. Flight-scene entry is NO LONGER a gap - see the tier note.
description = "S1.5 drivable subset: TimeJump past an injected recording EndUT to spawn, then rewind-strip-respawn via the seam using the injected rewind-b9 RewindPoint."
instanceProfile = "stock-minimal"
tags = ["rewind", "loop", "time-jump", "S1.5", "D18", "pending-operator"]
# NOTE on the runtime budget below: it is UNCHANGED by the re-tier. It sizes the
# worst DEFER path so every step surfaces a clean per-step TIMEOUT instead of a
# run-budget KILL; on the FLIGHT path the real wall clock is ~800 s.

[fixture]
# rewind-b9 (RewindB9Fixture via `dotnet test --filter InjectRewindB9`): a committed
# tree + the rp_b9_root RewindPoint. Here the injected committed recordings stand in
# for the "fly B1, commit" leg, and rp_b9_root stands in for the live "quicksave"
# (both slots have EndUTs the TimeJump crosses to spawn the end-of-recording ghost).
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "rewind-b9"
craft = []

[driver]
kind = "seam"
# TimeJump deltaSeconds must exceed the injected recordings' remaining time-to-EndUT
# (RewindB9Fixture ends the siblings ~115s after the save UT); 600 clears both with
# margin. Edge case 15 (design): a jump-then-rewind leaves NO seam residual (no
# marker, no context), so the following InvokeRewind sees a clean gate. slot 0 is
# the surviving upper stage (S1.5's single looping vessel); AnswerMergeDialog merge
# folds the conclusion scene-exit and the trailing RecordingState confirms the
# merged tree.
steps = [
  { cmd = "LoadGame",         args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting",       args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "TimeJump",         args = { deltaSeconds = "600.0" },                    expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                         expect = "OK" },
  { cmd = "InvokeRewind",     args = { rp = "rp_b9_root", slot = "0" },             expect = "OK", budget = 300 },
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },                         expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                         expect = "OK" },
  { cmd = "FlushAndQuit",                                                           expect = "OK" },
]

[dimensionsCovered]
# HONEST: TimeJump epoch-shifts the clock past the recording EndUTs (D6 time-jump),
# spawning the end-of-recording ghost and letting the run OBSERVE the epoch-shift
# contract (D18 time-jump-observables); the epoch-shift keeps orbits position-frozen
# and recalcs the ledger at the post-jump UT (D8 epoch-isolation, recalc-engine).
# The seam rewind then strips and re-spawns the recording (D18
# rewind-strip-respawn-cycle) via a real Rewind-to-Separation (D9
# rewind-to-separation, refly-gate). NOT claimed: loop-first-run-is-real (no loop
# re-cross is driven), crew/resource ledger facets (PENDING-OPERATOR career gap).
D6  = ["time-jump"]
D18 = ["time-jump-observables", "rewind-strip-respawn-cycle"]
D8  = ["epoch-isolation", "recalc-engine"]
D9  = ["rewind-to-separation", "refly-gate"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# Floor only: the tree survives the jump + rewind + merge.
count = { min = 1 }

[expectations.logContracts]
# The re-fly milestones prove the strip-respawn cycle ran end-to-end. The TimeJump
# spawn / stripped-vessel / situation-corrected respawn asserts are PENDING-OPERATOR
# (live-only), named in the coordinator runbook.
#
# Route-rewind timeline wave additions: InvokeRewind's post-load path is
# RewindInvoker.ConsumePostLoad -> ReconciliationBundle.Restore(cutoff) (NOT the
# HandleRewindOnLoad go-back branch, so no "OnLoad go-back:" lines here). The
# cutoff-carrying restore line proves the route-retire + pending-science-aware
# Restore overload ran, and the terminal "Restored:" summary now carries the
# pendingScience= count unconditionally. The conditional lines (retired route
# rows / dormanted routes / dropped science) cannot be required: the rewind-b9
# fixture carries no routes or pending science - the unattended H6 scenario owns
# those.
required  = ["Re-Fly \\(Rewind-to-Separation\\) StartInvoke", "Invocation complete",
             "ConsumePostLoad: restoring bundle with route-retire cutoffUT=",
             "Restored: recs=.* pendingScience="]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
# Budget arithmetic (M-A5 S8): sized so the WORST DEFER path surfaces a clean per-step
# TIMEOUT (driver-INVALID) for every step instead of a run-budget KILL. run.py waits
# max(step_budget, 600) + 60 per DEFERRED verb (LoadGame/TimeJump/InvokeRewind) and
# step_budget for the rest; the run-budget ceiling must exceed the SUM so no step-wait
# is capped (a capped deferred wait can KILL mid-step instead of surfacing the seam
# TIMEOUT). The previous 1000 was BELOW the LoadGame(660)+TimeJump(660)+InvokeRewind(660)
# defer windows and would KILL mid-InvokeRewind. Sum:
#   LoadGame        max(240,600)+60 = 660
#   SetSetting      (default)       =  60
#   TimeJump        max(120,600)+60 = 660
#   RecordingState  (default)       =  60
#   InvokeRewind    max(300,600)+60 = 660
#   AnswerMergeDialog (budget)      = 120
#   RecordingState  (default)       =  60
#   FlushAndQuit    (default)       =  60   -> sum 2340; +60 margin = 2400.
# On the happy path (verbs execute in FLIGHT) the real wall-clock is ~800s,
# far under this ceiling; the ceiling only governs the unattended defer path.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
