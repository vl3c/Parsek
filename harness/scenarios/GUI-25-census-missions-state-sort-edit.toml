[expectations.recordings]
# The anti-vacuity floor for the whole lane: every subject here is DERIVED from committed
# trees, so a run that staged nothing would photograph empty tables under labels claiming
# sorted rows and armed editors. Bounded rather than pinned exactly because this lane
# never records and never deletes - the number is the fixture's, and B32 / V26M / V26T /
# GUI-3 fly the same host.
count = { min = 1 }

[expectations.logContracts]
# Only this lane's OWN seam records.
#
# THE SORT LINES CARRY `tab=`, which is what proves WHICH of the window's two tables
# moved: both draw an index and a name column, so a bare column token cannot say.
# `changed=true` separates "this op re-ordered it" from "it was already sorted that way".
#
# THE EDIT LINES ARE PINNED ON `drew=true`, NOT on `armed=`. The row key is a field the op
# WROTE, so it survives a collapsed group, an unselected tab and a closed window alike,
# while the focus sentinel is written by the text field's own first draw pass - it is the
# one signal here the seam cannot fake.
#
# THE TWO REFUSALS ARE PINNED BY REASON, so a fixture that grew a dormant route or a live
# candidate reds this lane instead of silently photographing a dialog under no label.
required = [
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=12 open=1 openWindows=main",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=12 open=2 openWindows=main,missions",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=12 open=2 openWindows=main,logistics",

  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction sort window=missions tab=recordings column=name dir=desc changed=true frames=[0-9]+",
