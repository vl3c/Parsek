schema = 1
id = "GUI-25-census-missions-state-sort-edit"
tier = "operator"
# THE GUI CENSUS, WAVE 6: THE MISSIONS WINDOW'S DRIVEABLE STATE, AND THE LOGISTICS
# WINDOW'S SORT + ROUTE-LINK STATES.
#
# WHAT IT BUYS. Four wave-6 ops meet on one host here, and each one's subject is a state
# that NO capture in the census carries:
#   - `op=state key=expandedStats`: the Recordings tab's `Info` toggle, six extra columns
#     (`MaxAlt`, `MaxSpd`, `Dist`, `Pts`, `Start`, `End`) and the window's largest single
#     layout change. Zero dumps contain any of those header strings today.
#   - `op=state key=archived` / `key=archivedMissions`: the two archive filters, which are
#     DIFFERENT flags over different lists with OPPOSITE polarities - see below.
#   - `op=sort`: the 44 unphotographed sort states. Three of them here, over two tables
#     that COLLIDE on their index and name columns, which is why the op applies to the
#     live tab and REJECTS a column of the other one.
#   - `op=edit`: three in-place rename editors, each a LAYOUT change (a label becomes a
#     `GUILayout.TextField`) that no census gesture could reach - the arming gesture is a
#     double-click, which the seam does not synthesise.
#
# HOST: `fixtures/saves/interbody-route-recorded`, and it is the only committed fixture
# that carries all four subjects at once. Measured off its bytes: FOUR `MISSION` nodes
# with STABLE ids (so `op=edit field=missiontitle key=` can be a literal a committed spec
# may carry), four `RECORDING_TREE`s with `autoGeneratedRootGroupName` values in
# `GROUP_HIERARCHY` (so `field=groupname` can too), and TWO committed `ROUTE`s - one
# `Paused` (KSC -> Mun), one `Active` (KSC -> Duna) - which is what gives
# `RouteCommand action=link` a partner to link to. GUI-3 already names both route ids as
# literals on this host, so the precedent for pinning them is its own.
#
# WHAT THE LOGISTICS SORT BUYS HERE, STATED EXACTLY, because the obvious reading is wrong:
# the two routes are in DIFFERENT sections, so each table holds ONE row and NO ROW ORDER
# MOVES. What the capture shows is the `Status` header carrying its direction arrow on
# BOTH tables at once, which is the measured proof that one sort state drives them both
# (`LogisticsRouteSortColumn` is a single field and the header click writes it for the
# whole window). The row-ORDER half of `op=sort` is paid by the Missions window's two
# tabs below, which have nine and thirteen rows.
#
# READ THE TWO ARCHIVE POLARITIES BEFORE EDITING THIS LANE; they are opposite and "both
# archive filters on" is not a thing a step can ask for. `archived state=true` SHOWS
# archived recordings (the Timeline's positive sense over
# `GroupHierarchyStore.HideActive`, the same persisted flag the Recordings tab's Archive
# header checkbox writes in the opposite LABEL sense). `archivedMissions state=true`
# HIDES archived missions (`MissionStore.HideArchived`, kept in the store's own sense).
#
# NEITHER FILTER MOVES A ROW ON ANY HOST, and that is measured rather than a limitation
# of this fixture. The `hidden` key a `Recording.Hidden` row would write appears ZERO
# times across all 59 committed fixtures and in the operator's own career; `archived`
# reads `False` in all 9 of its occurrences. So what both captures honestly show is the
# FILTER CONTROL in its other position, which the dump proves because `GuiTreeJson`
# records a toggle's own `value`. The row-level `[archived]` marker and the
# archived-missions-dropped list have no host at all and are filed as
# GUI-CENSUS-NO-HOST-CARRIES-AN-ARCHIVED-RECORDING-OR-MISSION.
#
# THE TWO RECORDINGS-TAB EDITORS CANNOT BOTH BE ARMED, and the second arm COMMITS the
# first. That is production behaviour reproduced exactly, not a seam quirk: the group
# rename and the recording rename share `activeRenameRect`, and a player's double-click
# on one COMMITS a rival draft rather than discarding it (`TryBeginRecordingRenameForTesting`
# calls `CommitGroupRename`, and the mirror). So the order here is deliberate - the
# RECORDING rename is armed and photographed FIRST, then the GROUP rename is armed, which
# commits the recording one. The consequence is one renamed recording in the staged copy,
# which is why this lane, like every wave-6 lane, runs on a THROWAWAY save and NO FIXTURE
# IS EVER HARVESTED FROM IT. The mission-title editor lives on a different window class
# (`MissionsWindowUI`) and is independent of both.
#
# `commit=` IS ABSENT ON EVERY EDIT STEP and must stay that way. It defaults to FALSE,
# and committing a group or mission-title rename runs
# `MissionGroupLink.RenameMissionGroup`, which renames the root group plus its auto
# `/ Debris` and `/ Crew` subgroups plus `Mission.Name` atomically and rejects BOTH halves
# on a collision. A census wants the mid-edit PICTURE.
#
# WHAT THIS LANE LEAVES BEHIND IN THE STAGED COPY, listed so no reader has to derive it:
# the recording rename the group arm commits, and `set-cadence 2` on the Mun route. The
# LINK is undone (`action=unlink` is the last route step) and the cadence deliberately is
# NOT - restoring it would need a second `set-cadence 1`, and the throwaway copy is
# discarded with the run, so the step would only be ceremony. Both archive flags ARE
# restored, because a lane that died mid-list would otherwise leave the fixture filtered
# for whatever ran next on the same template.
#
# `op=expand key=all` RUNS BEFORE THE EDITS, and it is a precondition rather than
# decoration: `op=edit` asserts `drew=true`, the DRAW-produced focus sentinel, and a row
# inside a collapsed group leaves the row key standing while the text field never draws -
# which answers `ERROR edit-not-drawn` naming the remedy.
#
# AND `key=all` IS NOT ENOUGH FOR EVERY ROW, which this lane's first flight measured
# (`2026-09-21_2254`, INVALID at the recording-rename step with `edit-not-drawn`). The
# Recordings tab draws TWO kinds of collapsible block and the seam enumerates only one:
# `DrawChainBlock` keys its block by `Recording.ChainId`, which
# `EnumerateChainIdsForTesting` walks, while `DrawGroupedRecordingBlock` keys its block
# `"<groupName>::<identity>"` (`RecordingsTableUI.cs:5713`), a shape NO expand set
# produces. The multi-member `Kerbal X (2)` block on this host is the second kind, so
# `key=all` answered `changed=29 expanded=52 total=52` - every key it knows - and that
# block still drew its collapsed caret. Any recording inside such a block is therefore
# UNDRAWABLE through the seam today. The remedy taken here is the lane's: key the edit to
# a SINGLE-member block, which draws as a plain row. Filed as
# GUI-CENSUS-GROUPED-DISPLAY-BLOCKS-ARE-NOT-EXPANDABLE-THROUGH-THE-SEAM.
#
# TWO REFUSALS ARE DECLARED RATHER THAN AVOIDED, and both are the gate working. This host
# carries NO dormant route (the dormant list is disjoint from the committed one) and NO
# live route candidate (its eligible trees have already become routes - GUI-13's header
# derives the same fact from the other side), so `popup=deletedormantroute` and
# `popup=createroute` each answer `REJECTED dialog-target-unavailable`. The Create Route
# confirm's own picture is GUI-26's, on the candidate-carrying host. The Delete Dormant
# Route confirm has NO host in the committed set at all and is filed as
# GUI-CENSUS-NO-FIXTURE-CARRIES-A-DORMANT-ROUTE.
#
# THE WINDOW DOES NOT FIT THIS INSTANCE, the GUI-1 residue verbatim: `missions` is laid
# out for 1355 px and its `Info` form for 1663, against the profile's 1280x720 screen, so
# both are honestly CLIPPED at the client edge rather than squeezed into a layout no drag
# can produce (GUI-CENSUS-TWO-WINDOWS-EXCEED-THE-INSTANCE-WIDTH). The expanded-stats
# capture commands the WIDE rect itself because the accessor deliberately does not resize
# the window.
description = "GUI census wave 6: the Missions window's expanded-stats columns, both archive filters, three sort states across its two tables and all three in-place rename editors, plus the Logistics window's sorted route table, its Delete Route confirm and a round-trip-linked route at a non-1x cadence."
instanceProfile = "stock-minimal"
tags = ["gui-census", "screenshots", "ui", "missions", "logistics", "GUI-25", "pending-operator"]

