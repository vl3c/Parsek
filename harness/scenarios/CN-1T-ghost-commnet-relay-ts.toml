# CN-1T: the ghost CommNet relay (design 15.6) against the real stock network, TRACKING
# STATION half. FLOWN AND ARMED 2026-09-26 (see STATUS below). Same subject and cells as
# CN-1-ghost-commnet-relay (read its header first): the `ghost-commnet-relay` preset on
# gloops-airshow, category GhostCommNet.
#
# WHY THE LANE BOOTS TO FLIGHT FIRST. The Tracking Station notes a recording's playhead
# (PlaybackScopeTracker.NotePlayhead) only on its map-presence paths, and the create path
# declines a playback-disabled recording before it gets there, so a TS that is the FIRST
# scene to see relay B's start never latches B into replay scope and excludes it as
# `historical-never-replayed`. In play the Tracking Station is always entered from the Space
# Center or a flight, and both note every committed recording every frame, so B is latched
# long before; `LoadGame scene=trackstation` from the main menu is the one road that skips
# them. The lane therefore boots to FLIGHT (which latches A and B at the save's clock, one
# second before their start), then re-enters through `LoadGame scene=trackstation` -
# V14T's FLIGHT -> TRACKSTATION road. The scope latches are keyed by recording id and are
# cleared only on a main-menu transition, which the seam's in-game LoadGame does not make.
# autoRecordOnLaunch=false keeps the recorder off, so the second LoadGame is not refused
# `recording-active`.
#
# In the Tracking Station a node's position is A's map ProtoVessel (built from the same
# orbit segment) and B's orbit segment (a hidden recording has no ProtoVessel).
#
# THE CELLS. MEASURED `passed=4 skipped=5`, as predicted: the 5 FLIGHT cells scene-skip and
# the four TRACKSTATION cells (synthetic route, registered-node state, the real
# registered-node route with its negative control and the control-source hop, the preset
# rulings) execute.
#
# STATUS. First flight 2026-09-26_1122: PARSEK-FAIL on ONE cell,
# GhostRelayNodeBridgesEndpointToHome_TrackingStation, the same TEST geometry defect as
# CN-1's first flight (the synthetic endpoint reached a registered preset relay directly),
# fixed in commit 9eee0e80e; every product cell passed. READING RUN 2026-09-26_1131
# (automation DLL sha256 fcbe2979...): PASS attempt 1, 60 s, `total=9 passed=4 failed=0
# skipped=5`, zero GhostCommNet WARN / ERROR lines, the TRACKSTATION registrations and cell
# lines field-for-field identical to CN-1's. ARMED from it (the id left INTERIM_PIN_IDS);
# offline negative control in docs/dev/autotest-status.md. Armed confirmation re-flight
# pending.
#
# COVERAGE: claims D6 `commnet-relay` with CN-1, in the Tracking Station.

schema = 1
id = "CN-1T-ghost-commnet-relay-ts"
tier = "operator"
description = "The ghost CommNet relay (design 15.6) in the TRACKING STATION over gloops-airshow plus the ghost-commnet-relay preset (A crewed with a Pilot over the KSC, B playback-disabled, C looped with its real run over), entered FLIGHT -> LoadGame scene=trackstation so the relays are latched in replay scope: run the in-game GhostCommNet category and require that A and B register nodes, a free endpoint routes home through each real registered node and is cut off without it, A is a multi-hop control source, B relays while hidden, and C registers nothing."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "ghost-commnet", "commnet-relay", "injected-recordings", "tracking-station", "CN-1T",
        "flown", "D6", "armed"]

[fixture]
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "ghost-commnet-relay"
craft = []

[driver]
