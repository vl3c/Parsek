# CN-1T: the ghost CommNet relay (design 15.6) against the real stock network, TRACKING
# STATION half. FLOWN AND ARMED 2026-09-26 (see STATUS below). Same subject and cells as
# CN-1-ghost-commnet-relay (read its header first): the `ghost-commnet-relay` preset on
# gloops-airshow, category GhostCommNet.
#
# THE LANE BOOTS STRAIGHT INTO THE TRACKING STATION (changed 2026-09-26, branch
# `commnet-followups`, todo GHOSTCOMMNET-TS-PLAYBACK-DISABLED-NEVER-LATCHED). One
# `LoadGame scene=trackstation` from the main menu, so the Tracking Station is the FIRST
# scene to see the relays. It now notes every committed recording's playhead every frame
# (PlaybackScopeTracker.NotePlayheadSweep from ParsekTrackingStation.Update), as FLIGHT and
# the Space Center do, so relay B (playback disabled, no map ProtoVessel) is latched into
# replay scope at the save's clock, one second before its start, and relays while hidden.
# Until that fix the lane booted FLIGHT first and re-entered the Tracking Station through a
# second LoadGame, because a TS entered first excluded B as `historical-never-replayed`;
# that detour is gone, so this lane is now the live proof of the fix: the B registration
# token and the preset-rulings cell's `relayB=registered` red if the Tracking Station stops
# latching a hidden recording. C (looped, real run over) must still read
# `historical-never-replayed` (BUG-B unchanged: a start already behind the playhead is never
# latched, whichever scene sweeps it).
#
# In the Tracking Station a node's position is A's map ProtoVessel (built from the same
# orbit segment) and B's orbit segment (a hidden recording has no ProtoVessel).
#
# THE CELLS. MEASURED `passed=4 skipped=5`, as predicted: the 5 FLIGHT cells scene-skip and
# the four TRACKSTATION cells (synthetic route, registered-node state, the real
# registered-node route with its negative control and the control-source hop, the preset
# rulings) execute.
#
# STATUS. First flight 2026-09-26_1122: PARSEK-FAIL on ONE cell,
# GhostRelayNodeBridgesEndpointToHome_TrackingStation, the same TEST geometry defect as
# CN-1's first flight (the synthetic endpoint reached a registered preset relay directly),
# fixed in commit 9eee0e80e; every product cell passed. READING RUN 2026-09-26_1131
# (automation DLL sha256 fcbe2979...): PASS attempt 1, 60 s, `total=9 passed=4 failed=0
# skipped=5`, zero GhostCommNet WARN / ERROR lines, the TRACKSTATION registrations and cell
# lines field-for-field identical to CN-1's. ARMED from it (the id left INTERIM_PIN_IDS);
# offline negative control in docs/dev/autotest-status.md. Armed re-flight `2026-09-26_1151`
# PASS attempt 1 on the exact pins (FLIGHT-first shape). The direct-boot shape above keeps
# the same cells and pins; it has NOT been flown yet (re-flight pending).
#
# COVERAGE: claims D6 `commnet-relay` with CN-1, in the Tracking Station.

schema = 1
id = "CN-1T-ghost-commnet-relay-ts"
# PROMOTED to nightly 2026-09-26 by operator decision after the armed re-flights.
tier = "nightly"
description = "The ghost CommNet relay (design 15.6) in the TRACKING STATION over gloops-airshow plus the ghost-commnet-relay preset (A crewed with a Pilot over the KSC, B playback-disabled, C looped with its real run over), booted straight into the Tracking Station (the first scene to see the relays, so it must latch them into replay scope itself): run the in-game GhostCommNet category and require that A and B register nodes, a free endpoint routes home through each real registered node and is cut off without it, A is a multi-hop control source, B relays while hidden, and C registers nothing."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "ghost-commnet", "commnet-relay", "injected-recordings", "tracking-station", "CN-1T",
        "flown", "D6", "armed"]

[fixture]
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "ghost-commnet-relay"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "trackstation" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  # 1x Tracking Station time so the relays' window is open and the lifecycle tick
  # (0.25 s) has registered them when the batch runs.
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RunTests",   args = { category = "GhostCommNet" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
D6  = ["commnet-relay"]   # asserted: A and B registered, the real-node route and its cut control
D14 = ["sandbox", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 3, max = 3 }

[expectations.logContracts]
required  = [
  "BATCH_COMPLETE v1 total=9 passed=4 failed=0 skipped=5 category=GhostCommNet scene=TRACKSTATION",
  "\\[GhostCommNet\\] Stock CommNet available in scene TRACKSTATION: ghost CommNet nodes enabled",
  "\\[GhostCommNet\\] Registered ghost node: key=cn-relay-a node=ParsekGhost:cn-relay-a vessel=\"CN Relay A\" scene=TRACKSTATION reason=in-window ut=[0-9.]+ window=\\[[0-9.]+,[0-9.]+\\] hold=False dark=False relay=2000000000 transmit=5000 relayCombined=False transmitCombined=False control=True multiHop=True antennas=3",
  "\\[GhostCommNet\\] Registered ghost node: key=cn-relay-b node=ParsekGhost:cn-relay-b vessel=\"CN Relay B\" scene=TRACKSTATION reason=in-window ut=[0-9.]+ window=\\[[0-9.]+,[0-9.]+\\] hold=False dark=False relay=2000000000 transmit=5000 relayCombined=False transmitCombined=False control=False multiHop=True antennas=2",
  "\\[TestRunner\\] GhostCommNet routing probe \\(TRACKSTATION\\): home=\"[^\"]+\" homePower=40000 hops=2 viaGhost=True negativeControl=cut",
  "\\[TestRunner\\] GhostCommNet registered nodes \\(TRACKSTATION\\): checked=2 dark=0",
  "\\[TestRunner\\] GhostCommNet registered relay route \\(TRACKSTATION\\): probed=2 viaGhost=2 negativeControlCut=2 controlSourceAtGhost=1 noRelay=0 homes=9 keys=cn-relay-a,cn-relay-b\\s",
  "\\[TestRunner\\] GhostCommNet preset rulings \\(TRACKSTATION\\): relayA=registered control=True multiHop=True relay=2000000000 relayB=registered playbackEnabled=False control=False relay=2000000000 relayC=unregistered loop=True reason=historical-never-replayed",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "Ghost node pre-update threw",
  "DriveGhostCommNet threw",
  "Registered ghost node: key=cn-relay-c ",
  "Ghost node dark this rebuild: key=cn-relay-[ab] vessel=\"[^\"]*\" reason=(position-unresolved|exception)",
  "No ghost node for key=cn-relay-[ab] vessel=\"[^\"]*\": (?!before-window)",
  "Removed ghost node: key=cn-relay-[ab] .* reason=(?!Parsek(Flight|TrackingStation) destroyed)",
]

[runtime]
