  "drivevessel dock couple: port='dockingPort3' partnerPart='dockingPort3' partnerPid=4030840545 partnerName='Ore Silo' ut=",
  "partaction applied button=transfer pid=110406740 part='RadialOreTank' [^\\r\\n]* resource=Ore moved=75\\.0000 sources=[1-9] destBefore=0\\.0000 destAfter=75\\.0000 destMax=75\\.0000",
  "(?s)MISSIONMARK label=mine4-undock-depot (?:(?!partaction applied button=).)*?partaction applied button=undock pid=110406740 part='dockingPort3' partId=[0-9]+ event=Undock newPid=[1-9][0-9]* newName='[^'\\r\\n]*' vessels=[0-9]+->[0-9]+ activePid=110406740 ",
  "(?s)MISSIONMARK label=mine4-undock-silo (?:(?!partaction applied button=).)*?partaction applied button=undock pid=110406740 part='dockingPort3' partId=[0-9]+ event=Undock newPid=[1-9][0-9]* newName='[^'\\r\\n]*' vessels=[0-9]+->[0-9]+ activePid=110406740 ",
  # Ore conserved: 150 before, 150 docked to the depot, 75 + 75 after each undock.
  "(?s)MISSIONMARK label=mine4-dock-depot (?:(?!MISSIONMARK label=mine4-undock-depot).)*?readvesselresources expect resource=Ore expected=150\\.0000 actual=150\\.0000 diff=-?0\\.00[0-9]{2} tolerance=0\\.0100 match=true",
  "(?s)MISSIONMARK label=mine4-undock-silo (?:(?!MISSIONMARK label=mine4-committed).)*?readvesselresources expect resource=Ore expected=75\\.0000 actual=75\\.0000 diff=-?0\\.00[0-9]{2} tolerance=0\\.0100 match=true",
  # 2. The route: the depot window is the docked origin, the silo the one stop.
  "sealslot complete mode=tree tree=[0-9a-f]{32} ",
  "routecommand create gate tree=[0-9a-f]{32} treeFound=True dismissed=False sealed=True eligible=True status=Eligible alreadyPromoted=False refusal=None",
  "RouteAnalysis: mid-tree docked origin resolved originWindowSource=[0-9a-f]{32} window=[^ \\r\\n]+ dockUT=[0-9.E+-]+ undockUT=[0-9.E+-]+ stops=1",
  "RouteAnalysis eligible: source=[0-9a-f]{32} window=[^ \\r\\n]+ stops=1 resources=1 [^\\r\\n]*harvestOrigin=0 midTreeOrigin=1",
  "routecommand complete action=create tree=[0-9a-f]{32} route=[^ \\r\\n]+ name='MINE4 Ore Shuttle' status=Paused ",
  # 3. IR-9: the visitor docked back, the depot debited, the silo credited through the
  # composite on its own parts only. An undocked half comes back under a NEW persistentId
  # (flight `_1014`: the depot 1705213322, the silo 3097086691), so these lines take any pid
  # for the depot and the silo and only pin the miner's.
  "(?s)MISSIONMARK label=mine4-visitor-dock (?:(?!MISSIONMARK label=mine4-visitor-delivered).)*?drivevessel dock couple: port='dockingPort3' partnerPart='dockingPort3' partnerPid=[1-9][0-9]* partnerName='Ore Silo' ut=",
  "(?s)MISSIONMARK label=mine4-visitor-dock (?:(?!MISSIONMARK label=mine4-visitor-delivered).)*?Origin debit: route=[^ \\r\\n]+ origin=Ore Depot pid=[1-9][0-9]* resource=Ore requested=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? debited=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? [^\\r\\n]*path=loaded",
  "(?s)MISSIONMARK label=mine4-visitor-dock (?:(?!MISSIONMARK label=mine4-visitor-delivered).)*?Endpoint resolved through a DOCKED COMPOSITE: rootPartUId=[0-9]+ recordedPid=[0-9]+ compositePid=110406740 ",
  "(?s)MISSIONMARK label=mine4-visitor-dock (?:(?!MISSIONMARK label=mine4-visitor-delivered).)*?Delivery write: route=[^ \\r\\n]+ dest=Mining Rover RC pid=110406740 resource=Ore requested=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? written=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? tankBefore=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? tankAfter=(?:150|149\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? capacity=150 path=loaded parts=own=24/53",
  # The visitor's tanks unchanged, the silo full, the depot empty (three reads that match).
  "(?s)MISSIONMARK label=mine4-visitor-delivered (?:(?!MISSIONMARK label=ir7-rewind).)*?readvesselresources expect resource=Ore expected=0\\.0000 actual=0\\.0000 diff=-?0\\.00[0-9]{2} tolerance=0\\.0100 match=true(?:(?!MISSIONMARK label=ir7-rewind).)*?readvesselresources expect resource=Ore expected=150\\.0000 actual=150\\.0000 diff=-?0\\.00[0-9]{2} tolerance=0\\.0100 match=true(?:(?!MISSIONMARK label=ir7-rewind).)*?readvesselresources expect resource=Ore expected=0\\.0000 actual=0\\.0000 diff=-?0\\.00[0-9]{2} tolerance=0\\.0100 match=true",
  # 4. IR-7: the rewind puts the route to sleep; it materializes Paused at its creation and
  # one more cycle runs on the spawned tips.
  "(?s)MISSIONMARK label=ir7-rewind-[1-9] (?:(?!MISSIONMARK label=ir7-rewound).)*?OnLoad: go-back route reconcile at cutoff=[0-9.E+-]+ retiredRouteRows=[1-9][0-9]* committedRoutes=1 dormantRoutes=0 ",
  "(?s)MISSIONMARK label=ir7-rewind-[1-9] (?:(?!MISSIONMARK label=ir7-rewound).)*?OnLoad go-back: routes at rewind cutoff [0-9.E+-]+: kept=0 \\(reconciled=0\\) dormant=1 \\(newly=1\\)",
  "(?s)MISSIONMARK label=ir7-rewound (?:(?!MISSIONMARK label=ir7-materialized).)*?Materialize: 1 dormant route\\(s\\) materialized at ut=[0-9.E+-]+ \\(MINE4 Ore Shuttle\\); 0 dropped occupied; 0 still dormant",
  "(?s)MISSIONMARK label=ir7-materialized (?:(?!MISSIONMARK label=ir7-delivered).)*?Origin debit: route=[^ \\r\\n]+ origin=Ore Depot pid=[0-9]+ resource=Ore requested=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? debited=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? tankBefore=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? tankAfter=(?:0|[0-9.]+E-[0-9]+) path=unloaded",
  "(?s)MISSIONMARK label=ir7-materialized (?:(?!MISSIONMARK label=ir7-delivered).)*?Delivery write: route=[^ \\r\\n]+ dest=Ore Silo pid=[0-9]+ resource=Ore requested=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? written=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? tankBefore=(?:75|74\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? tankAfter=(?:150|149\\.9[0-9]*)(?:\\.[0-9]+)?(?:E[+-]?[0-9]+)? capacity=150 path=unloaded",
]
