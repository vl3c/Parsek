[expectations.recordings.structure]
# REPORT-ONLY until a reading run: one tree, two docks and two undocks.
gating = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
branchPoints   = { Dock = { min = 2, max = 2 }, Undock = { min = 2, max = 2 } }

[expectations.routes]
# REPORT-ONLY until a reading run: the one route, materialized after the rewind, one cycle
# completed on the rewound timeline, paused after it.
