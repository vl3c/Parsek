# CI-9: the player spawns a ghost chain's ORBITAL tip through Real Spawn Control and
# docks with it (the D18 player-action residue "spawn a ghost as a real vessel, then dock
# with it", todo D18-REALSPAWN-RECOVER-SEAM-VERB-PAIR "Lanes owed": RealSpawn hands the
# tip to a dock mission).
#
# READING RUN `2026-10-03_1647` PASS attempt 1 (automation DLL sha256 `2b9a47af...`, an
# origin/main build, no C# product change): every token below was read off it. ARMED
# `2026-10-03_1710` PASS attempt 1 (same DLL) with `recordings.structure` gating. Offline
# negative controls over both runs red on exactly their seeded tokens (no supersede, a
# spawn-death respawn, a two-parent dock); see the autotest-status row.
#
# THE SPAWN GEOMETRY IS A DEFECT, NOT A LANE CHOICE (todo
# REALSPAWN-ORBITAL-TIP-SPAWNS-AWAY-FROM-ITS-GHOST): the tip's ghost stood 140 m ahead
# (`Proximity notification: ... distance=140m`), the press jumped 53.8 s, and the tip
# spawned on its recorded orbit at the new UT while the epoch shift kept the Kerbal X where
# it was, 120.4 km behind (kRPC read `tgtD=120413.977` at TD-TARGET). Design 14.5 says the
# jump spawns the tip where its ghost stood. The mission therefore flies a MechJeb
# rendezvous first; on the fixed product the first target distance (~140 m) falls inside
# `rendezvousAboveMeters` and the mission takes its MATCH-VELOCITY branch instead, with
# every token below unchanged.
#
# HOST: `eva2-lko-crewed` (CI-5's host: the focused 28-part Kerbal X orbital stage in LKO,
# 8 RCS blocks, a Ready Clamp-O-Tron on the pod, and the 16 m Kerbal X Probe) plus the
# `chain-tip-dock` preset: ONE committed tree `tree-ctd-carrier-rec`:
#   ctd-carrier-rec  ROOT, `CTD Carrier`, ended Destroyed 20 s before the save (plays and
#                    spawns nothing, claims nothing);
#   ctd-tip-rec      `CTD Target`, a PARENTLESS background recording (no branch point) of a
#                    small docking target (OKTO, Spark, Clamp-O-Tron with a Ready
#                    ModuleDockingNode; pid 3156176881 and launch guid derived from its id,
#                    absent from the save) with an engine ignite / shutdown, then a 60 s
#                    orbit tail on the Kerbal X's OWN orbit led by 2.0e-4 rad (~140 m), to
#                    an Orbiting end at UT 481.2. The walker claims its pid via
#                    BACKGROUND_EVENT (CI-5's production shape), so it is a live chain tip
#                    beside the active vessel at zero relative speed, and Real Spawn
#                    Control lists it with "Warp to Spawn" live.
#
# ACT 1 (seam): RealSpawn the chain tip (the button's own click body, an epoch-shift jump
# to the tip's EndUT, the playback loop's chain-tip spawn with the original pid), then
# StartRecording on the focused Kerbal X.
# ACT 2 (mission ci9_tip_dock): target the spawned `CTD Target`, MechJeb rendezvous when
# it lies beyond `rendezvousAboveMeters`, match velocity, hard dock.
# ACT 3 (seam): CommitTree, then read the committed list back.

schema = 1
id = "CI-9-chain-tip-dock"
tier = "nightly"
description = "D18 player action, dock with a Real-Spawned chain tip: over eva2-lko-crewed plus the chain-tip-dock preset (a committed tree whose parentless background recording of a small docking target is an orbital ghost chain tip ~140 m ahead of the focused Kerbal X), RealSpawn the tip, start a recording on the Kerbal X, fly mission ci9_tip_dock to rendezvous with and dock to the spawned tip, commit the tree."
instanceProfile = "stock-minimal"
tags = ["CI-9", "D18", "chain-interaction", "ghost-chain", "real-spawn", "dock",
        "mechjeb", "injected-recordings", "R10", "runtime-handles", "kerbin", "sandbox"]

[fixture]
saveTemplate       = "fixtures/saves/eva2-lko-crewed"
injectedRecordings = "chain-tip-dock"
craft              = []

[driver]
kind    = "autopilot"
mission = "ci9_tip_dock"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnFirstModificationAfterSwitch", value = "false" }, expect = "OK" },
  { cmd = "ListHandles", args = { kind = "chains" }, label = "chains", expect = "OK" },
  # THE SETTLE: the proximity scan admits a row only on its second sighting, 1.5 s apart
  # (CI-6's twenty inert steps; the probe flight `2026-10-03_1642` pressed at +6.2 s).
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  # ACT 1.
  { cmd = "RealSpawn", args = { rec = "${chains.chain0tip}" }, label = "spawn", expect = "OK", budget = 120 },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "StartRecording", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  # ACT 2.
  { phase = "mission", expect = "MISSION-OK", budget = 6000 },
  # ACT 3.
  { cmd = "CommitTree", expect = "OK" },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c1", expect = "OK" },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[driver.missionParams]
targetName                  = "CTD Target"
# Rendezvous only when the spawned tip lies beyond Real Spawn Control's button radius.
rendezvousAboveMeters       = 250
startSettleSeconds          = 5
targetTimeoutSeconds        = 60
settleSeconds               = 10
# bdock_dock_transfer's rendezvous / match / dock values (BDOCK-1 / BDOCK-2, nightly).
approachDistanceMeters      = 100
maxPhasingOrbits            = 5
matchSpeedMetersPerSec      = 1.0
matchTimeoutSeconds         = 600
dockSpeedMetersPerSec       = 0.5
rendezvousTimeoutSeconds    = 30000
dockTimeoutSeconds          = 1800
dockNoProgressSeconds       = 120

[dimensionsCovered]
# Second witnesses of two claimed values (no new cell): the dock is a FOREIGN dock onto a
# vessel another committed tree recorded (D5, BDOCK-1 / M1 hold it), and the spawn is
# Real Spawn Control's "Warp to Spawn" for an ORBITAL tip (D13, RSC-1 holds the landed one).
# D18 has no registry value for "dock with a spawned tip"; the RealSpawn pid equals the
# chain's original pid here too, but `chain-tip-original-pid` is CI-8's claim.
D5  = ["cross-tree-foreign-dock"]
D13 = ["real-spawn-control"]
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

# The two injected recordings plus the Kerbal X's two (pre-dock parent, merged child).
[expectations.recordings]
count = { min = 4, max = 4 }

# ARMED off the reading run `2026-10-03_1647` (PASS attempt 1): two committed trees (the
# injected carrier tree and the Kerbal X's), one Dock branch point, the injected root
# Destroyed, the Kerbal X parent Docked, the tip and the merged child Orbiting, the merged
# child's own adoption stamp the one spawned vessel, and no `CTD Target` left in the save
# (absorbed by the dock).
[expectations.recordings.structure]
gating          = true
trees           = { min = 2, max = 2 }
committedTrees  = { min = 2, max = 2 }
recordings      = { min = 4, max = 4 }
branchPoints    = { Dock = { min = 1, max = 1 } }
terminalStates  = { Destroyed = { min = 1, max = 1 }, Docked = { min = 1, max = 1 }, Orbiting = { min = 2, max = 2 } }
ghostChainNodes = { max = 0 }
spawnedVessels  = { min = 1, max = 1 }
vesselNames     = { "Kerbal X" = { min = 1, max = 1 }, "Kerbal X Probe" = { min = 1, max = 1 }, "CTD Target" = { min = 0, max = 0 } }

[expectations.logContracts]
required  = [
  # Boot: the walker claims the target via BACKGROUND_EVENT and builds a live chain.
  "\\[ChainWalker\\] Vessel PID=3156176881 claimed by tree=tree-ctd-carrier-rec via BACKGROUND_EVENT at UT=421\\.2",
  "\\[ChainWalker\\] Chain built: vessel=3156176881 links=1 tip=ctd-tip-rec spawnUT=481\\.2 terminated=False",
  "(?m)listhandles chain index=0 pid=3156176881 links=1 trees=1 treeIds=tree-ctd-carrier-rec tip=ctd-tip-rec$",
  # Act 1: the ghost is a live Real Spawn Control row beside the Kerbal X, the press jumps
  # to the tip's EndUT, and the playback loop spawns the tip with its original pid.
  "\\[Flight\\] Proximity notification: 'CTD Target' recording #1 distance=1[0-9]{2}m endUT=481\\.2",
  "realspawn pressed rec=ctd-tip-rec index=1 vessel=CTD Target endUT=481\\.2 ",
  "WarpToRecordingEnd: jumping to UT=481\\.2 for 'CTD Target' ",
  "\\[Ghoster\\] Chain tip spawn: pid=3156176881 vessel=CTD Target preserveIdentity=true",
  "realspawn complete rec=ctd-tip-rec pid=3156176881 vessel=CTD Target ",
  "\\[Flight\\] StartRecording succeeded: pid=3620499050, tree=True",
  # Act 2: a docking-port couple onto the spawned tip. The Kerbal X survives as the merged
  # vessel, the tip is the absorbed partner, and the dock supersedes the tip's committed
  # terminal spawn (the phantom-spawn rule) under the SAME continuation the single-parent
  # Dock branch point creates.
  "OnPartCouple producer classified: kind=DockingPort fromPart=dockingPort2 toPart=dockingPort2 ",
  "OnPartCouple: captured pre-couple partner snapshot partnerPid=3156176881 parts=3",
  "OnPartCouple route-partner resolve: selfPid=3620499050 mergedPid=3620499050 isTarget=True .* partnerPidFromEvent=3156176881 .* partnerPidStamped=3156176881",
  "(?s)CreateMergeBranch: terminal spawn for recording 'ctd-tip-rec' vessel='CTD Target' superseded by dock-merge continuation '([0-9a-f]+)' absorbedPid=3156176881 mergedPid=3620499050 match=baked-pid .*?Dock-merge superseded 1 committed terminal spawn\\(s\\): absorbedPid=3156176881 routeTargetPid=3156176881 mergedPid=3620499050 continuation=\\1.*?Tree merge created: type=Dock, bp=[0-9a-f]+, parents=\\[[0-9a-f]+\\], child=\\1 \\(pid=3620499050\\)",
  "Tree dock merge completed",
  # Act 3: the commit closes the parent Docked; the readback holds all four recordings.
  "CommitTreeFlight terminal: rec=[0-9a-f]+ terminalState=Docked ",
  "(?m)listhandles kind=committed count=4 truncated=false$",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "realspawn rejected",
  # The absorbed tip is a merge, never a death: no spawn-death reset, no second spawn.
  "Spawn-death detected[^\\n]*CTD Target",
  "Chain tip spawn: pid=3156176881[\\s\\S]*Chain tip spawn: pid=3156176881",
  "\\[Spawner\\] Vessel spawn for #[0-9]+ \\(CTD Target\\)",
  # A two-parent dock would mean the spawned tip was a member of the active tree.
  "Tree merge created: type=Dock, bp=[0-9a-f]+, parents=\\[[0-9a-f]+,",
]

[runtime]
budgetSeconds = 7200

[retry]
policy = "once"
