recordSettleFrames = 8
bayHoldFrames      = 20

[dimensionsCovered]
# CLAIMED 2026-09-26 off reading run `2026-09-25_2218` (PASS attempt 1, mismatches=0; armed
# re-flight `2026-09-25_2230` PASS attempt 1, the same four applier lines). The
# recorder logged all six edges (CargoBayOpened / CargoBayClosed on mk3CargoRamp, mk3CargoBayM
# and mk3CargoBayL), the KSC ghost entered range at StartUT (targetUT=29.9, recUT=[29.9,55.3]),
# and the applier moved the doors IN REAL TIME, 9 s and 12 s after the ghost spawned rather than
# in a spawn-frame catch-up: `apply family=CargoBayOpened surface=deployable ... applied=1
# skipped=0` (the ramp) then `applied=2 skipped=0` (the two bays), and the same two lines for
# CargoBayClosed. `bays` rides the two applier tokens; the forbidden pair below makes a skipped
# bay or a jettison-panel fallback red rather than silently present beside the passing lines.
D7  = ["bays"]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1 }

[expectations.logContracts]
required  = ["Auto-record started \\(first staging on pad",
             "Part event: CargoBayOpened '[^']+' pid=[0-9]+",
             "Part event: CargoBayClosed '[^']+' pid=[0-9]+",
             "committree committed=true",
             "invokerewindtolaunch complete rec=",
             "\\[KSCGhost\\] Ghost #[0-9]+ \"Mallard\" entered range",
             "\\[GhostPartEvents\\] apply family=CargoBayOpened surface=deployable rec=[0-9]+ pid=[0-9]+ applied=[1-9]",
             "\\[GhostPartEvents\\] apply family=CargoBayClosed surface=deployable rec=[0-9]+ pid=[0-9]+ applied=[1-9]"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]",
             "apply family=CargoBay(?:Opened|Closed) surface=[a-z-]+ rec=[0-9]+ pid=[0-9]+ applied=[0-9]+ skipped=[1-9]",
             "apply family=CargoBay(?:Opened|Closed) surface=jettison-panel"]

[runtime]
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
