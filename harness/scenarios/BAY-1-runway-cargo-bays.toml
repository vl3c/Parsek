schema = 1
id = "BAY-1-runway-cargo-bays"
# 2026-10-07 (todo HARNESS-FAST-POLLS-SHRINK-INERT-STEP-WAITS, branch `scene-wait`): the
# 1x waits this lane sized in inert seam steps (0.25 s each at the old poll; one frame
# since PR #2017) are `WarpToUT maxRate=1` waits to explicit UTs, deterministic in
# FLIGHT, the Space Center and the Tracking Station since TC-1. Spec changed, not
# re-flown.
# -------------------------------------------------------------------------------------
# D7 `bays`: CARGO-BAY DOORS ANIMATE ON THE GHOST. Coverage wave 7 (2026-09-26).
#
# Operator-confirmed 2026-09-26: a runway bay toggle on an
# unflown plane may claim `bays`, because the bay animation is the subject, not the
# flight. This lane is that toggle.
#
# THE ROAD.
#   1. MISSION `bay1_runway_bays` (kRPC, raw): roll the stock KSP 1.12 `Mallard` out onto
#      the Runway (craft committed physically in this fixture's Ships/VAB, `ship =` line
#      de-localized to the literal `Mallard` because kRPC never localizes), stage it
#      where it stands with brakes on and throttle zero - Parsek's own
#      first-staging-on-the-pad trigger, which reads PRELAUNCH and a runway rollout IS
#      PRELAUNCH, so `Auto-record started (first staging on pad` opens the recording -
#      then open every cargo bay (kRPC `CargoBay.open`: mk3CargoBayM, mk3CargoBayL and
#      the mk3CargoRamp), hold 20 frames, close them, hold 20 frames. The plane never
#      moves.
#   2. SEAM: StopRecording, CommitTree, StopRecording (CommitTree re-adopts a recorder
#      on the still-active vessel, H58 flight 1), then InvokeRewindToLaunch: the Mallard
#      is stripped and the scene lands in the SPACE CENTER 15 s before the recording's
#      StartUT, keeping the committed tree as a future ghost.
#   3. Inert RecordingState steps (~0.25 s each) let 1x Space Center time run through
#      StartUT, the open, the close and EndUT. `ParsekKSC` replays the recording as a
#      KSC ghost on the runway (well inside its 25 km cull range) and runs the SAME
#      `GhostPlaybackLogic.ApplyPartEvents` the flight scene runs, so the applier's
#      `apply family=CargoBayOpened / CargoBayClosed surface=deployable` lines are the
#      replay witness.
#
# #1783 KSC END-OF-FLIGHT RETIREMENT. The Mallard ends its recording parked at the
# runway spawn point, which is where the runway-threshold exclusion circle sits, so at
# EndUT the spawn call may RETIRE the recording (no vessel). That is expected and is NOT
# what this lane reads: every gating token below is a GHOST fact (the KSC ghost entered
# range, the applier moved its bay doors), never a spawn.
#
# WHY THE SPACE CENTER AND NOT A FLIGHT RELOAD (EX-1's road). This fixture's VESSEL
# index 0 is an asteroid, and a Space Center save reloads into FLIGHT focused on index 0:
# every ghost would then be LOD-hidden 6e9 m away (the LF-2 post-strip trap). The KSC
# scene needs no focus vessel and replays through the same applier.
#
# THE DEPLOY LIMIT. The fixture craft carries the stock Mallard's own bay limits:
# ModuleAnimateGeneric `allowDeployLimit` with `deployPercent = 44` (mk3CargoBayM), `45`
# (mk3CargoBayL) and `51` (mk3CargoRamp), so the doors stop part-way, at normalized animTime
# 0.56 / 0.55 / 0.49 (closedPosition 1, revClampPercent). The recorder calls a bay open when it
# has settled at that stop (`FlightRecorder.ResolveCargoBayDeployLimitStop`, todo
# CARGOBAY-DEPLOY-LIMITED-BAY-RECORDS-NOTHING, fixed 2026-09-27), and the ghost samples its open
# pose at the same stop from the snapshot's persisted deployPercent. The census line's
# `limitStop=` field and the ghost build's `deploy-limited open pose sampled at animTime=` line
# are required per bay, so a regression back to "open only at the far end" reds here.
# HISTORY: reading 1 `2026-09-25_2214` (stock limits, pre-fix) recorded no bay event at all;
# readings `_2218` / `_2230` flew a fixture copy set to `deployPercent = 100`. The stock limits
# were restored 2026-09-27 with the fix; the new per-bay tokens are UNFLOWN until the next
# reading run (the lane is a re-read), after which the numbers may be pinned.
#
# THE HOST FIXTURE. gs1-two-stage-pad (GS-1..GS-12's pad world): its pre-placed GS1
# Auto-Chute Booster sits on the LAUNCH PAD, so a Runway rollout recovers nothing, and
# Bill / Bob are Available for the Mk3 cockpit's default crew. The Mallard is this
# fixture's third physically committed craft and its only consumer is this lane.
# -------------------------------------------------------------------------------------
tier = "operator"  # calibration discipline; reading `2026-09-25_2218` PASS, armed `2026-09-25_2230` PASS (deployPercent=100 fixture); stock-limit re-read owed
description = "D7 bays: roll the stock Mallard out onto the Runway, stage it in place (Parsek's first-staging auto-record trigger), cycle its three Mk3 cargo bays open and shut, commit, Rewind-to-Launch, and let the Space Center replay the recording as a KSC ghost; the applier's CargoBayOpened / CargoBayClosed surface=deployable lines are the witness that the ghost's bay doors animated."
instanceProfile = "stock-minimal"
tags = ["BAY1", "part-events", "cargo-bay", "ghost-render", "applier", "rewind-to-launch", "ksc-ghost", "D7"]

[fixture]
saveTemplate       = "fixtures/saves/gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "bay1_runway_bays"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
# verboseLogging=true is load-bearing: the applier and recorder part-event lines are
# VERBOSE. It is set before the recording starts, so the rewind quicksave carries it.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },      expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" },   expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },       expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" },   expect = "OK" },
  { phase = "mission",                                                            expect = "MISSION-OK", budget = 600 },
  { cmd = "StopRecording",                                                        expect = "OK" },
  { cmd = "CommitTree",                                                           expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                        expect = "OK" },
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                     expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "bay1-rewound" },                      expect = "OK" },
  # 1x Space Center time through the replay: StartUT lands 15 s after the rewind,
  # the open ~4 s after StartUT, the close ~10 s after that, EndUT ~10 s later.
  # 1x Space Center time to UT 75: the rewind lands ~15 and the replay spans ~[30, 51] (reading `2026-09-26_0116`), so 75 crosses StartUT, the open, the close and EndUT (200 inert steps before 2026-10-07: since PR #2017 one costs a
  # frame, not the 0.25 s poll; todo HARNESS-FAST-POLLS-SHRINK-INERT-STEP-WAITS).
  { cmd = "WarpToUT", args = { ut = "75", maxRate = "1" }, expect = "OK", budget = 180 },
  { cmd = "MissionMark",  args = { label = "bay1-dwell-done" },                   expect = "OK" },
  { cmd = "FlushAndQuit",                                                         expect = "OK" },
]

[driver.missionParams]
craftName          = "Mallard"
expectedVesselName = "Mallard"
launchSite         = "Runway"
recordSettleFrames = 8
bayHoldFrames      = 20

[dimensionsCovered]
# CLAIMED 2026-09-26 off reading run `2026-09-25_2218` (PASS attempt 1, mismatches=0; armed
# re-flight `2026-09-25_2230` PASS attempt 1, the same four applier lines). The
# recorder logged all six edges (CargoBayOpened / CargoBayClosed on mk3CargoRamp, mk3CargoBayM
# and mk3CargoBayL), the KSC ghost entered range at StartUT (targetUT=29.9, recUT=[29.9,55.3]),
# and the applier moved the doors IN REAL TIME, 9 s and 12 s after the ghost spawned rather than
# in a spawn-frame catch-up: `apply family=CargoBayOpened surface=deployable ... applied=1
# skipped=0` (the ramp) then `applied=2 skipped=0` (the two bays), and the same two lines for
# CargoBayClosed. `bays` rides the two applier tokens; the forbidden pair below makes a skipped
# bay or a jettison-panel fallback red rather than silently present beside the passing lines.
D7  = ["bays"]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1 }

[expectations.logContracts]
required  = ["Auto-record started \\(first staging on pad",
             "Visual coverage \\[CargoBay\\] [0-9]+: .*mk3CargoBayM\\[pid=[0-9]+\\]\\(deployIdx=[0-9]+,closed=[0-9.]+,limitStop=0\\.[0-9]+\\)",
             "Visual coverage \\[CargoBay\\] [0-9]+: .*mk3CargoBayL\\[pid=[0-9]+\\]\\(deployIdx=[0-9]+,closed=[0-9.]+,limitStop=0\\.[0-9]+\\)",
             "Visual coverage \\[CargoBay\\] [0-9]+: .*mk3CargoRamp\\[pid=[0-9]+\\]\\(deployIdx=[0-9]+,closed=[0-9.]+,limitStop=0\\.[0-9]+\\)",
             "Part event: CargoBayOpened 'mk3CargoBayM' pid=[0-9]+",
             "Part event: CargoBayOpened 'mk3CargoBayL' pid=[0-9]+",
             "Part event: CargoBayOpened 'mk3CargoRamp' pid=[0-9]+",
             "Part event: CargoBayClosed 'mk3CargoBayM' pid=[0-9]+",
             "Part event: CargoBayClosed 'mk3CargoBayL' pid=[0-9]+",
             "Part event: CargoBayClosed 'mk3CargoRamp' pid=[0-9]+",
             "CargoBay 'mk3CargoBayM': deploy-limited open pose sampled at animTime=0\\.[0-9]+",
             "CargoBay 'mk3CargoBayL': deploy-limited open pose sampled at animTime=0\\.[0-9]+",
             "CargoBay 'mk3CargoRamp': deploy-limited open pose sampled at animTime=0\\.[0-9]+",
             "committree committed=true",
             "invokerewindtolaunch complete rec=",
             "\\[KSCGhost\\] Ghost #[0-9]+ \"Mallard\" entered range",
             "\\[GhostPartEvents\\] apply family=CargoBayOpened surface=deployable rec=[0-9]+ pid=[0-9]+ applied=[1-9]",
             "\\[GhostPartEvents\\] apply family=CargoBayClosed surface=deployable rec=[0-9]+ pid=[0-9]+ applied=[1-9]"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]",
             "apply family=CargoBay(?:Opened|Closed) surface=[a-z-]+ rec=[0-9]+ pid=[0-9]+ applied=[0-9]+ skipped=[1-9]",
             "apply family=CargoBay(?:Opened|Closed) surface=jettison-panel"]

[runtime]
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
