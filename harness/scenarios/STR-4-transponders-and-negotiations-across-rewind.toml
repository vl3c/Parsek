[expectations.recordings]
# V only; the check launch is unrecorded (RW-23 measured 1 on the same shape).
count = { min = 1, max = 1 }

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- Recovery Transponders: the setup cost, then V recovered under it ----
  "kscaction action=activate-strategy target=RecoveryTransponders applied=true manifestKind=strategy-activate observedAfter=factor=[0-9.]+ slots=1/1 setupFunds=94000 setupSci=0 setupRep=0 fundsDelta=-94000 [\\s\\S]*?MISSIONMARK label=str4-rt-active ut=",
  "MISSIONMARK label=str4-before-recover ut=(?:(?!MISSIONMARK label=str4-t1 )[\\s\\S])*?VesselRecovery funds patched: vessel='[^']+' amount=[1-9][0-9]* ut=[0-9.]+ recordingId=\\S+ quick=",

  # ---- T1: the deactivation, the activation in the freed slot, the discounted upgrade ----
  "MISSIONMARK label=str4-t1 ut=(?:(?!MISSIONMARK label=str4-rt-off )[\\s\\S])*?kscaction action=deactivate-strategy target=RecoveryTransponders applied=true manifestKind=strategy-deactivate observedAfter=slots=0/1",
  "MISSIONMARK label=str4-rt-off ut=(?:(?!MISSIONMARK label=str4-an-active )[\\s\\S])*?kscaction action=activate-strategy target=AgressiveNegotiations applied=true manifestKind=strategy-activate observedAfter=factor=[0-9.]+ slots=1/1 setupFunds=0 setupSci=0 setupRep=[1-9][0-9.]* fundsDelta=0 ",
  "MISSIONMARK label=str4-an-active ut=(?:(?!MISSIONMARK label=str4-upgraded )[\\s\\S])*?kscaction action=upgrade-facility target=SpaceCenter/Runway applied=true manifestKind=facility-upgrade observedAfter=level=1",
  # The row is the observed NET debit: 75000 gross times 0.9995 at the default factor.
  "MISSIONMARK label=str4-an-active ut=(?:(?!MISSIONMARK label=str4-before-rewind )[\\s\\S])*?Game state: FacilityUpgraded 'SpaceCenter/Runway' 0\\.00 .{1,3} 0\\.50 \\(event-driven\\) cost=749[0-9]{2}(?:\\.[0-9]+)? costSource=observed-debit",
  # The strategy's reputation leg on the construction, its own row (no funds leg: see forbidden).
  "MISSIONMARK label=str4-an-active ut=(?:(?!MISSIONMARK label=str4-before-rewind )[\\s\\S])*?Strategy conversion recorded: type=ReputationPenalty, currency=Reputation, delta=-[0-9][0-9.E+-]*, UT=(?:19[0-9]|20[0-9])\\.[0-9], reason=StructureConstruction",

  # ---- after the rewind: a second upgrade refused as committed, nothing charged ----
  "MISSIONMARK label=str4-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=str4-rewound ut=",
  "MISSIONMARK label=str4-rewound ut=(?:(?!MISSIONMARK label=str4-refused )[\\s\\S])*?kscaction upgrade-facility not applied: target=SpaceCenter/Runway levelBefore=0 levelAfter=0 fundsBefore=(\\S+) fundsAfter=\\1 fundsDelta=0 ",
  "MISSIONMARK label=str4-rewound ut=(?:(?!MISSIONMARK label=str4-refused )[\\s\\S])*?kscaction refused action=upgrade-facility reason=blocked-committed target=SpaceCenter/Runway",
  "MISSIONMARK label=str4-rewound ut=(?:(?!MISSIONMARK label=str4-refused )[\\s\\S])*?\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction dismiss ok popup=actionblocked press=OK open=false",

  # ---- the crossing: the upgrade, the deactivation and the activation applied once ----
  "MISSIONMARK label=str4-refused ut=(?:(?!MISSIONMARK label=str4-crossed )[\\s\\S])*?Clock-crossing reached committed-future rows: crossed=[0-9]+ \\[[^\\]]*FacilityUpgrade@",
  "MISSIONMARK label=str4-refused ut=(?:(?!MISSIONMARK label=str4-crossed )[\\s\\S])*?PatchFacilities: 'SpaceCenter/Runway' level 0 -> 1 ",
  "MISSIONMARK label=str4-refused ut=(?:(?!MISSIONMARK label=str4-crossed )[\\s\\S])*?PatchStrategies: activated=[0-9]+ deactivated=[0-9]+ [^\\r\\n]*activatedIds=\\[AgressiveNegotiations\\]",
  "MISSIONMARK label=str4-refused ut=(?:(?!MISSIONMARK label=str4-crossed )[\\s\\S])*?PatchStrategies: activated=[0-9]+ deactivated=[1-9][0-9]* [^\\r\\n]*deactivatedIds=\\[RecoveryTransponders\\]",
  # The pools after the crossing equal the pools before the rewind (RW-23's form).
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=str4-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=str4-crossed ut=",

  # ---- the check rollout runs under Aggressive Negotiations: its reputation leg ----
  "MISSIONMARK label=str4-crossed ut=(?:(?!MISSIONMARK label=str4-check )[\\s\\S])*?Strategy conversion recorded: type=ReputationPenalty, currency=Reputation, delta=-[0-9][0-9.E+-]*, UT=[0-9.]+, reason=VesselRollout",

  # ---- the ground truth: the pools and the strategy list exact ----
  "(?s)MISSIONMARK label=str4-check .*?BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  "(?s)MISSIONMARK label=str4-check .*?result: hardFailures=0 ",
  "(?s)MISSIONMARK label=str4-check .*?CompareStrategies: managed=\\[[^\\]]*AgressiveNegotiations[^\\]]*RecoveryTransponders[^\\]]*\\] ledgerActive=\\[AgressiveNegotiations\\] saveActive=\\[AgressiveNegotiations\\] diverged=0 \\[\\]",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "warptout refused",
  "invokerewindtolaunch refused",
  # The strategy verbs must all apply; the one expected refusal is the committed upgrade.
  "kscaction refused action=(?:activate-strategy|deactivate-strategy)",
  "kscaction refused action=upgrade-facility reason=(?!blocked-committed )",
  # A funds leg on an observed row (the construction or a rollout) is the double discount.
  "Strategy conversion recorded: type=Funds[A-Za-z]*, currency=Funds, [^\\r\\n]*reason=(?:StructureConstruction|VesselRollout)",
  # The discount is never kept as an untagged pool adjustment, and no guard clamps.
  "filed StockPoolAdjustment amount=",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  # The discounted upgrade reconciles against its observed debit.
  "KSC reconciliation \\(funds\\): action FacilityUpgrade",
  # The upgrade is bought once, and the crossing patches the Runway up once, never down.
  # Both patch lines are scoped (first flight `2026-11-07_0020`): the purchase's own recalc
  # patches 0 -> 1 before stock sets the level, and the rewind's OnLoad patches the OUTGOING
  # scene's Runway 1 -> 0 before stock's ScenarioUpgradeableFacilities loads the rewind save
  # (`Loading...` after it; the rewind game was written to persistent.sfs). Neither touches the
  # rewound world. A 1 -> 0 after that load is the #2181 shape (the old world came back).
  "MISSIONMARK label=str4-rewound ut=[\\s\\S]*kscaction action=upgrade-facility target=SpaceCenter/Runway applied=true",
  "MISSIONMARK label=str4-before-rewind ut=[\\s\\S]*PatchFacilities: 'SpaceCenter/Runway' level 0 -> 1 [\\s\\S]*PatchFacilities: 'SpaceCenter/Runway' level 0 -> 1 ",
  "Rewind-to-Launch initiated to UT [\\s\\S]*?\\[ScenarioUpgradeableFacilities\\]: Loading[\\s\\S]*PatchFacilities: 'SpaceCenter/Runway' level 1 -> 0 ",
  # From the rewind to the refusal no load switches a strategy: Transponders stays on (its
  # deactivation is committed future), Negotiations stays off (its activation is).
  "MISSIONMARK label=str4-before-rewind ut=(?:(?!MISSIONMARK label=str4-refused )[\\s\\S])*?PatchStrategies: activated=(?:[1-9]|0 deactivated=[1-9])",
  "Committed strategy activation reached but stock left",
]

[runtime]
