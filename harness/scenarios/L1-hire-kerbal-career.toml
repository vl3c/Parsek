schema = 1
id = "L1-hire-kerbal-career"
# The header here used to read "pending-fixture: fixtures/saves/fresh-career is not
# committed yet ... Re-tier to daily once the fixture lands." BOTH halves are done and
# were left standing: `harness/fixtures/saves/fresh-career` IS committed (built by
# construction, not by a forge flight), and the re-tier already happened - `tier` below
# has read "daily" for some time.
tier = "daily"
description = "Career: hire one applicant; the funds pool drops by exactly the fixture-pinned hire cost, no other drift."
instanceProfile = "stock-minimal"
# `pending-operator` DROPPED 2026-07-31 as the last piece of that same leftover. The tag
# was pending-FIXTURE residue, not a record of outstanding operator work: this spec names
# no `VERIFY-PENDING-OPERATOR` assert anywhere, it is not `tier = "operator"`, and it was
# LIVE-PROVEN 2026-07-23 (`2026-07-23_1952_L1-hire-kerbal-career`, 52 s) and re-confirmed
# 2026-07-25. Directly precedented by `L1-passive-sandbox`, whose identical stale tag was
# dropped 2026-07-26 for exactly this reason. All four L1 siblings (dismiss,
# research-node-career, research-node-science, upgrade-facility) lost theirs in the same
# pass: each named a VERIFY-PENDING-OPERATOR constant that its own green run had already
# discharged, which a first draft of this work missed by reading the specs for a string
# without checking `fixtures/saves/README.md`, the ledger that records those markers.
tags = ["ledger", "L1"]

[fixture]
saveTemplate = "fixtures/saves/fresh-career"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# hire-kerbal drives KerbalRoster.HireApplicant; stock charges the recruit cost ONCE and
# automatically -- the Funding scenario module subscribes to GameEvents.OnCrewmemberHired
# (Funding.onCrewHired -> AddFunds(-GetRecruitHireCost(count), CrewRecruited)), which
# HireApplicant fires. The seam does NOT mirror a debit (an earlier "mirror the stock debit"
# AddFunds double-charged the pool). "Verhat Kerman" is the ONE known applicant the
# fresh-career fixture pins (the hire TARGET, not the cost determinant -- the recruit-cost
# curve keys on the HIRED-CREW COUNT of 4). Recorded in harness/fixtures/saves/README.md.
# LIVE-CONFIRMED (first L-track batch, 2026-07-23): the single debit is 62113 (the
# recorder-observed cost= for Verhat/Engineer at hired-count 4), seed 500000 -> 437887.
steps = [
  { cmd = "LoadGame",     args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",   args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "KscAction",    args = { action = "hire-kerbal", kerbal = "Verhat Kerman" }, expect = "OK", budget = 60 },
  { cmd = "RecordingState", expect = "OK" },
  { cmd = "FlushAndQuit",   expect = "OK" },
]

[dimensionsCovered]
D8  = ["kerbals", "funds", "recalc-engine", "orchestrator", "ksp-state-patcher", "action-blocking"]
D12 = ["hire-dismiss-patches"]
D14 = ["career", "scene-ksc"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# "kscaction action=hire-kerbal target=... applied=true manifestKind=kerbal-hire ..."; the
# stock hire reaches Parsek's recorder-observer (GameStateRecorder.Handlers OnCrewmemberHired:
# "Game state: CrewHired '<name>' ...").
required  = ["kscaction action=hire-kerbal .* applied=true", "Game state: CrewHired"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[expectations.ledger]
seedFrom     = "template"
tolerances   = "default"
rec3CarveOut = false

[[expectations.ledger.manifest]]
  ut         = 0.0
  kind       = "kerbal-hire"
  # AUTHOR CONSTANT (STATE-DEPENDENT-BUT-FIXTURE-PINNED, OQ2): the hire cost rises with the
  # HIRED-CREW COUNT via the GameVariables recruit-cost curve. The fixture PINS the roster
  # to EXACTLY the 4 stock hired kerbals (zero Parsek reservations / stand-ins), so the cost
  # is DETERMINISTIC at hired-count 4. LIVE-CONFIRMED (2026-07-23) at -62113: seed 500000
  # minus one recruit debit lands the save at 437887 (GetRecruitHireCost(4) = 62113, the
  # single stock CrewRecruited charge). If the pinned hired roster ever drifts, the curve
  # input changes and this constant goes stale -- re-derive from observedAfter=funds= on the
  # next live run.
  funds      = -62113.0
  provenance = "seam-declared"

[runtime]
# Happy path: LoadGame ~300 + KscAction ~60 + light verbs, under 600. (This used to end
# "Pending-fixture -> never scheduled unattended" - the third piece of the same stale
# pending-fixture story the header carried. The fixture landed, the tier is `daily`, and
# this spec HAS been scheduled unattended since 2026-07-23.)
# Budget check (seed funds 500000 affords the pinned hire cost): 500000 + (-62113) >= 0.
budgetSeconds = 600

[retry]
policy = "once"

[expectedFail]
bugId = ""
