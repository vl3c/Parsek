  "Corrected unsafe snapshot situation: FLYING -> LANDED \\(terminal=Landed\\)[\\s\\S]*?Vessel spawn for #[0-9]+ \\(Situation Hopper\\) pid=[1-9][0-9]* sit=LANDED ",
  # terminal-orbit-safety: the Orbiting spawn propagates the recorded orbit, is under
  # the 75 km safe altitude with the 60 km periapsis, and is deferred...
  "Spawn #[0-9]+ \\(Low Perigee Probe\\): using recorded terminal orbit propagated to current UT",
  "Terminal orbit spawn deferred: rec=terminal-orbit-safety-rec idx=[0-9]+ vessel=\"Low Perigee Probe\" reason=current-altitude-below-safe-altitude currentUT=[0-9.]+ nextSafeUT=9[0-9][0-9]\\.[0-9]+ propagatedAlt=[67][0-9]{4}\\.[0-9] safeAlt=75000\\.0 atmosphereDepth=70000\\.0 periapsis=(59999|60000)\\.[0-9]",
  # ...and the deferred queue holds it (the claim token).
  "Deferred spawn held for terminal orbit safety: #[0-9]+ \"Low Perigee Probe\" id=terminal-orbit-safety-rec reason=current-altitude-below-safe-altitude; nextUT=9[0-9][0-9]\\.[0-9]+ currentUT=7[0-9][0-9]\\.[0-9]+",
  # What happens next: past the next safe UT the re-evaluation refuses on the periapsis.
  "Cannot spawn terminal orbit safely: rec=terminal-orbit-safety-rec idx=[0-9]+ vessel=\"Low Perigee Probe\" [^\\r\\n]*decision=CannotSpawnSafely reason=periapsis-below-safe-altitude",
  "Deferred spawn (cannot execute safely|resolved as cannot-spawn-safely): #[0-9]+ \"Low Perigee Probe\" id=terminal-orbit-safety-rec reason=periapsis-below-safe-altitude",
  # In order: deferred, held, refused.
  "Terminal orbit spawn deferred: rec=terminal-orbit-safety-rec[\\s\\S]*?Deferred spawn held for terminal orbit safety: #[0-9]+ \"Low Perigee Probe\"[\\s\\S]*?Cannot spawn terminal orbit safely: rec=terminal-orbit-safety-rec[^\\r\\n]*reason=periapsis-below-safe-altitude",
]
