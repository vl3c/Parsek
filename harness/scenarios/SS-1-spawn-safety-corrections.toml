  "MISSIONMARK label=ss1-loaded-count-2-",
  # Both completions arrive inside WARP 1.
  "Deferred spawn during warp: #[0-9]+ \"Situation Hopper\"",
  "Deferred spawn during warp: #[0-9]+ \"Low Perigee Probe\"",
  # situation-correction: the Landed spawn's snapshot is corrected, then the vessel
