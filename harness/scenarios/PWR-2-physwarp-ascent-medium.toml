# PWR-2-physwarp-ascent-medium - the RECORDER under PHYSICS warp at the Medium sampling density.
#
# WHAT IT PROVES. Every lane before this family tested ghost PLAYBACK under physics
# warp (V7W) and nothing held the RECORDER to its contract while the player's game ran
# physics-warped. This lane flies B2's LKO ascent (the stock Kerbal X, MechJeb ascent
# autopilot) with `samplingDensity = 1` (Medium: min 0.2 s, max 3.0 s, 2.0 deg,
# 5.0 %), so the recording carries three stretches:
#   1. the lower ascent at 1x (liftoff to ~42 km, throttle up, gravity turn);
#   2. the upper ascent under MechJeb's OWN physics warp (it escalates to 2x from
#      ~42 km to ~70 km with the engine burning; KRPC.MechJeb exposes no toggle, see
#      b2_lko_ascent.py) - physics warp WITH dynamics;
#   3. a post-mission LKO coast driven by `WarpToUT ladder=phys` at the stock physics
#      ceiling (4x), where one physics frame is 0.08 game seconds.
# Each density's family member flies the same profile (PWR-1 Low, PWR-2 Medium, PWR-3
# High), so the three lanes compare like with like.
#
# THE WITNESS is the saveParse row's [expectations.recordings.sampling] block
# (harness/lib/samplingq.py), measured off the produced save's `.prec.txt` sidecar
# mirrors and classified per sample pair by the recorder's own `warpRuns=` token on
# `TrackSection closed:` (Source/Parsek/SectionWarpRuns.cs). It holds every gap of the
# focused vessel's absolute per-frame sections to the density's bounds with a one-frame
# allowance of 0.02 * rate (KSP physics warp sets fixedDeltaTime = 0.02 * rate, so the
# recorder - which spaces by GAME time - can only land on those frames):
#   overMax      no gap beyond maxInterval + one frame (the backstop held);
#   duplicates / backsteps   no repeated or reversed UT inside a section;
#   dirMisses / speedMisses  no gap across which the turn / speed change already
#                exceeded the threshold one frame before the later sample;
#   jumps        no chord longer than the faster speed (plus surface rotation) covers;
#   physGaps / physTriggered  the anti-vacuity floors: gaps really were recorded under
#                physics warp, and at least one of them closed on a trigger rather
#                than the backstop.
# The analyzer row (INV1..INV12) runs on the same save as on every lane.
#
# B2 ABSORBED (2026-10-14, owner ruling B on the shared-flight audit,
# docs/dev/research/harness-dwell-and-shared-flight-audit-2026-10-14.md section B2):
# B2-lko-ascent flew this exact mission, fixture and missionParams with the default
# samplingDensity (1, the same Medium this lane sets) and committed right after the
# circularization, so its flight is a prefix of this one and it is retired. Every gate
# B2 held already runs here verbatim: recordings.count {7,8} (B2's population, re-pin
# contract below), the required tokens `Recording started`, `ProcessBreakupEvent:
# debris child created` (the FOREGROUND debris-creation site: the Kerbal X sheds its
# boosters while it is the active vessel, so the background site never fires on this
# profile; re-derive against a log before widening it) and the commit-caused
# `Recording stopped.` token, and the ERROR forbid. B2's [dimensionsCovered] claims
# move here (D1 auto-record-launch, D3 orbital-checkpoint + parent-anchored-debris,
# D4 atmospheric + exo-propulsive). Evaluated offline against this lane's
# `2026-10-12_0741` (PASS): B2's 3 tokens present, forbidden clean, count 8 in {7,8};
# its KSP.log closes an Atmospheric, an ExoPropulsive and an OrbitalCheckpoint
# section on the focused vessel. The cost: B2's committed recording no longer ends at
# the circularization; it carries the physics-warp coast. B2's full per-token
# rationale is in git history (harness/scenarios/B2-lko-ascent.toml at origin/main
# 41abe0984). PENDING A CONFIRM FLIGHT of this host on the merged spec.
schema = 1
id = "PWR-2-physwarp-ascent-medium"
tier = "nightly"
description = "Recorder under PHYSICS warp at the Medium sampling density: B2's MechJeb LKO ascent (its own 2x physics warp mid-ascent) plus a 4x WarpToUT ladder=phys orbital coast, with samplingDensity=1; the saveParse sampling block holds every recorded gap to the Medium min/max/threshold bounds with a one-physics-frame allowance and requires gaps recorded under physics warp."
instanceProfile = "stock-minimal"
tags = ["PWR", "PWR-2", "B2", "S0.2", "physics-warp", "sampling", "flown", "mechjeb"]

[fixture]
saveTemplate       = "fixtures/saves/b2-lko-craft"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "b2_lko_ascent"

# Budget: B2's 780 s mission + a 180 game-second 4x coast (~50 wall s with the ramp)
# + commit. The coast target is ABSOLUTE (WarpToUT takes no relative UT): B2's mission
# ends at UT ~300 on every flight on disk (2026-10-01_1127 299.9, _1812 299.5), so 480
# leaves a 180 s span.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  # The density under test. samplingDensity is install-wide (ParsekSettings, the
  # settings sidecar route): the harness rewrites the sidecar to its baseline at stage
  # and in the per-attempt teardown, which drops this key again, so no later run
  # inherits it (run.py reset_settings_sidecar).
  { cmd = "SetSetting", args = { name = "samplingDensity", value = "1" }, expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 780 },
  { cmd = "WarpToUT", args = { ut = "480", ladder = "phys" }, expect = "OK", budget = 300 },
  { cmd = "CommitTree",                                          expect = "OK" },
  { cmd = "FlushAndQuit",                                        expect = "OK" },
]

[driver.missionParams]
targetApoapsisMeters      = 80000
targetPeriapsisMeters     = 80000
apoErrorMeters            = 5000
periErrorMeters           = 5000
eccentricityMax           = 0.02
inclinationErrorDeg       = 2.0
ascentTimeoutSeconds      = 420
circularizeTimeoutSeconds = 300

[dimensionsCovered]
# MOVED FROM B2 (2026-10-14 merge, see the header):
# `auto-record-launch` <- `Recording started` under autoRecordOnLaunch.
D1  = ["auto-record-launch"]
D2  = ["density-presets", "physics-warp-medium"]
# `parent-anchored-debris` <- the `ProcessBreakupEvent: debris child created` token:
# both creation sites call Recording.ApplyParentAnchorContract unconditionally and its
# only reachable no-op is an empty parent id, which neither call site can pass, so "a
# debris child recording was created" implies "parent-anchored" here. The token gates
# CREATION, not the anchor resolving at playback (the analyzer INV rules own that).
# `orbital-checkpoint` <- the MechJeb coast to apoapsis closes an OrbitalCheckpoint
# section on the focused vessel (claimed by B2 off the same flight).
D3  = ["orbital-checkpoint", "parent-anchored-debris"]
D4  = ["atmospheric", "exo-propulsive"]
D14 = ["kerbin", "warp-phys"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# B2's population (main ascent + the in-flight optimizer's ascent-exit split + six
# booster debris children); density does not move a split. The pin is B2's (moved
# with the 2026-10-14 merge): `b2_decide` has exactly one ACTION_ACTIVATE_STAGE, at
# ignition, and the spent core never autostages off, so 1 root + 6 boosters = 7 is
# structural and the 8th slot absorbs the split. MEASURED 7 on B2's
# `2026-07-25_0824_B2-lko-ascent` (before #1931's in-flight optimizer split); 8 since,
# on B2 `2026-10-11_1234` and on this lane's `2026-10-03_1044` / `2026-10-12_0741`.
# RE-PIN CONTRACT: if a run
# legitimately differs, re-pin to the measured value and record which recordings it
# produced; do NOT widen back toward 1.
count = { min = 7, max = 8 }

[expectations.recordings.sampling]
# ARMED 2026-10-02 off the report-only reading run `2026-10-02_2057` (PASS attempt 1):
# gaps 294 (1x 204 p50 0.22 s max 3.02 s; phys 85 p50 3.04 s max 3.04 s at 4x, 8 triggered), subMin 3, every other count 0.
# Windows: the zero pins are the quality contract and are NOT loosened for a
# finding; subMin ~2x the reading (a denser preset than declared leaves 100+);
# physGaps / physTriggered at about half the reading (anti-vacuity: the stretch
# really was recorded under physics warp, and a trigger fired inside it).
gating = true
density = "medium"
overMax = 0
subMin = { max = 10 }
# Duplicate UTs, all pair classes and the pairs touching physics warp. The all-class total
# was REPORTED only while duplicate sample UTs at 1x staging / off-rails boundaries were an
# open recorder defect (todo SECTION-DUPLICATE-UT-SAMPLES, PWR-1 `2026-10-02_2122` red on one
# at booster staging); pinned 2026-10-03 after the fix, off `2026-10-03_1044` (duplicates 0).
duplicates = 0
warpDuplicates = 0
backsteps = 0
dirMisses = 0
speedMisses = 0
jumps = 0
physGaps = { min = 40 }
physTriggered = { min = 4 }

[expectations.logContracts]
required = [
  "Recording started",
  "ProcessBreakupEvent: debris child created",
  # The recorder classified frames as physics-warped on the active vessel.
  "\\[Parsek\\]\\[INFO\\]\\[Recorder\\] TrackSection closed: .* warpRuns=\\S*phys:",
  # The 4x coast: started on the physics ladder and completed at the physics top rung.
  "warptout start ut=480 .*ladder=phys",
  "warptout complete reachedUT=\\S+ ut=480 .*maxRate=4 ladder=phys",
  "CommitTreeFlight: starting tree commit at UT=[0-9.]+[\\s\\S]{0,8000}?Recording stopped\\. ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "warptout refused",
]

[runtime]
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
