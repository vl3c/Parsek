schema = 1
id = "B10-career-passive-safety"
# daily. The comment here used to say "pending-fixture (NOT daily): the
# fixtures/saves/fresh-career template is not committed yet" - stale since 2026-07-23,
# when the career fixtures were file-constructed and committed and this was re-tiered.
tier = "daily"
# The v1 seam driver does a cold LoadGame into an in-scene test batch; it has NO warp
# or scene-change verb (design ~541 defers R1's warp/scene-change economy-drift trigger
# to the TimeJump/scene verbs), so the description names what the driver actually does
# and the R1 tag is dropped (it is not covered here; tags feed --tag selection only,
# not the coverage registry, so removal breaks no consumer).
#
# BATCH CATEGORY CORRECTED 2026-07-26 (RecordingInvariants -> GameActionsHealth).
# THE DEFECT: this scenario shipped daily and read GREEN while executing ZERO tests,
# proved live on the real automation instance:
#   BATCH_COMPLETE v1 total=2 passed=0 failed=0 skipped=2 category=RecordingInvariants scene=SPACECENTER
#   Scene eligibility skip summary: skipped=2 currentScene=SPACECENTER byRequiredScene=FLIGHT:2
# Both RecordingInvariants tests are Scene = GameScenes.FLIGHT; fresh-career has ZERO
# VESSEL nodes by construction (that IS the scenario), so
# TestCommandLoadGame.DecideLoadRoute takes the NoVesselSpaceCenter route and the batch
# runs at the Space Center where neither test is eligible. The old contract
# (`BATCH_COMPLETE v1 .* failed=0\b`) could not tell that apart from 2 passes.
# THE FIX IS NOT A STRONGER PIN ON THE SAME CATEGORY: a vessel-less career fixture can
# NEVER host a FLIGHT-scene category, so pinning `total=2 passed=2` would just convert a
# permanent false green into a permanent red. The category moves to one that genuinely
# runs where this fixture lands AND is what a passive-career-safety cell wants asserted:
# GameActionsHealth is 4 scene-agnostic (RequiredScene == AnyScene), batch-allowed,
# READ-ONLY tests - GameStateRecorder's three suppression flags are not stuck (the
# "silently stopped recording" class) plus Funding / ResearchAndDevelopment / Reputation
# singletons resolve with in-range pools. Read-only matters: this scenario's ledger
# oracle asserts a ZERO career delta, so the batch must not move the economy, and these
# four tests write nothing.
description = "Fresh career, stock actions only, cold load into an in-scene game-actions-health batch; no economy drift."
instanceProfile = "stock-minimal"
tags = ["ledger", "B10", "R2"]

[fixture]
# saveTemplate leaf ("fresh-career") IS runSaveName: staged into saves/fresh-career/,
# and the driver's first LoadGame save arg must resolve to that same save.
saveTemplate = "fixtures/saves/fresh-career"
# v1 value set is exactly "none" | "all-synthetic" (S4). B10 injects nothing.
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# The literal ${runSave} is substituted with runSaveName (the saveTemplate leaf)
# before the line is written to the channel, so LoadGame cannot drift from the
# staged save. A RunTests step budget is capped at 540s (S8; the seam's own
# fallback ceiling is 600s).
steps = [
  { cmd = "LoadGame",    args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",  args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",    args = { category = "GameActionsHealth" },            expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                       expect = "OK" },
]

# Dimension values this scenario covers (validated against coverage/registry.toml).
# D16 schema-gate DROPPED 2026-07-26 (same vacuity audit as the batch category above):
# the load-time schema gate is per-recording (RecordingSidecarStore ->
# RecordingStore.IsRecordingSchemaCompatible; analyzer INV5 likewise), and this
# scenario injects NOTHING and records NOTHING (injectedRecordings = "none",
# recordings.count 0..0). The gate therefore ran over an empty set and the cell was
# claimed without being exercised. H5-invariants-corpus covers it honestly over 306
# recordings, so no registry cell is lost.
# D14 scene-ksc is claimed because the batch genuinely runs at the Space Center: the
# vessel-less fresh-career fixture routes LoadGame through DecideLoadRoute's
# NoVesselSpaceCenter branch (measured, see the logContracts note).
[dimensionsCovered]
D8  = ["funds", "science", "reputation", "recalc-from-ut0"]
D14 = ["career", "cold-load-ut0", "scene-ksc"]

[expectations.recordings]
# count.max == 0 selects the recording-rules log-validation suppression (B1): a
# legitimately recording-free run must not red on REC-001/REC-003.
count = { min = 0, max = 0 }

[expectations.logContracts]
# LITERAL KSP.log line patterns, NOT anomaly tokens.
# The level token is UPPERCASE in ParsekLog.Write ("[Parsek][ERROR][...]"), and
# the forbidden patterns are case-sensitive re.search; match ERROR, not Error.
#
# The batch tally is pinned WHOLE (hlib.batch_contract_vacuity_gap enforces that a
# RunTests spec carry a pin an empty / all-skipped batch cannot satisfy). Derivation,
# all four numbers:
#  - total=4: ExtendedRuntimeTests declares exactly 4
#    [InGameTest(Category = "GameActionsHealth")] methods, and BATCH_COMPLETE's total is
#    `allTests.Count(Status != NotRun)` over the single RunCategory batch.
#  - skipped=0 / passed=4: all 4 are RequiredScene == AnyScene (no Scene = argument) and
#    AllowBatchExecution default-true, so none is filtered. The three singleton tests
#    self-skip only when HighLogic.CurrentGame is null or the mode is not CAREER
#    (ScienceSingletonAccessible also accepts SCIENCE_SANDBOX); fresh-career is
#    GAME { Mode = CAREER } and the seam loads it before the batch, so none fires.
#  - scene=SPACECENTER: fresh-career has zero VESSEL nodes, so LoadGame takes
#    DecideLoadRoute's NoVesselSpaceCenter route. Pinning the scene is what makes the
#    original defect impossible to repeat silently - a route change reds here.
required  = ["BATCH_COMPLETE v1 total=4 passed=4 failed=0 skipped=0 category=GameActionsHealth scene=SPACECENTER"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

# The scenario's bounded, documented exceptions to the harness-owned Tier-C
# anomaly sweep. Empty = the sweep must find zero anomaly lines.
allowedAnomalies = []

# The ledger-oracle (M-B2, chain slot 8). Its PRESENCE activates the oracle: the
# harness captures the fixture's seed baseline pre-launch (the analyzer over the
# staged template), accumulates the action manifest post-run, computes expected
# career totals, and diffs them against the produced save's careerSave block. A
# hard-pool drift (funds / science / reputation) reds PARSEK-FAIL(ledger).
#
# B10 is the flagship ZERO-delta scenario: the manifest is EMPTY, so expected ==
# seed. The oracle proves the produced save's funds/science/reputation still equal
# the seed within tolerance AND that no unexpected stock award fired (a nonempty
# capture on an empty manifest is itself the economy-drift signal). This automates
# the R2/BUG-F cold-load-wipe-at-UT=0 guard (the cold LoadGame) and the in-scene
# no-op passivity guard (the RunTests batch must not move the economy).
[expectations.ledger]
seedFrom     = "template"   # parse the staged fixture save for the seed baseline.
tolerances   = "default"    # FacetTolerances.Default (funds 1.0, science 0.1, rep 0.1).
rec3CarveOut = false        # no route residual in a passive-safety scenario.
# Declared career effects go under [[expectations.ledger.manifest]]; B10 declares
# NONE (empty manifest = zero expected delta).

[runtime]
budgetSeconds = 600

[retry]
policy = "once"

[expectedFail]
bugId = ""
