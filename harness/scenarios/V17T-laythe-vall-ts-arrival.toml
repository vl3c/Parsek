# ---------------------------------------------------------------------------------
# 0. THE ROUTING IS ANSWERED, AND IT IS **H3** (V17M run `2026-08-20_1841`)
# ---------------------------------------------------------------------------------
# **NEITHER PRE-REGISTERED HYPOTHESIS WAS RIGHT.** V17M's reading run reached the
# classifier and it DECLINED - not on the single-hop guard (H1's failure mode) and
# not on the seam magnitude (H2's), but on the PARKING-ORBIT / MID-COURSE
# structural check, `Source/Parsek/Reaim/ReaimClassifier.cs:270-277`:
#
#   [ReaimDiag] mission='Duna Rocket' member#0 segs=13 startBody=Laythe
#     supported=False reason='transfer departs from a heliocentric parking orbit
#     or mid-course correction (deferred); staying faithful'
#
# and phase-lock declined too (`support=UnsupportedCrossParent`), so the loop runs
# **PLAIN FIXED-CADENCE FAITHFUL** - the V9-dres shape, now measured for a moon
# pair. THE M-MIS-7 ANSWER FOR TODAY'S CODE: Parsek neither re-aims nor
# phase-locks moon-to-moon hops.
#
# THE MECHANISM IS OUR OWN FLIGHT PROFILE'S. The parent-relay mode necessarily
# flies two burns with a Jool coast between them (the fixture's segment 4,
# a = 26,056,055 m, ecc 0.0126), so a DIFFERENT-orbit common-ancestor segment sits
# immediately before the transfer run. The re-admitting exception
# (`IsHeliocentricParkingDeparture`) missed by ONE CONJUNCT OF THREE: near-circular
# PASSED (0.0126 <= 0.1), co-orbital PASSED (4.15% <= 10%), but the coast is
# **0.8686 revolutions** against a 49,717.82 s period - `wholeRevs = 0`, so
# `DetectRuns` emits no closed park. **6,534 s short.** The full derivation, the
# untested-remainder statement and the honest "no flyable profile produces the
# direct-ejection shape" argument live in V17M's section 0 and are not duplicated
# here.
#
# **WHAT THIS LANE STILL ADDS.** The routing question is answered, but the RENDER
# question is not: `factory chain rec=... reaimed=True|False` is a TS-side truth,
# and V5 is the only TS lane that ever pinned `reaimed=True`. V17M read
# `reaimed=False faithfulFallback=False` from the FLIGHT scene; whether the TS
# scene assembles the same faithful chain for a cross-parent subject with TWO
# body-change seams is this lane's own measurement. The trio stays UNREQUIRED and
# UNFORBIDDEN - the routing is measured, but a re-fly should RECORD it, not gate
# on it.
#

