[driver]
kind = "seam"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # Kill the scene-entry auto-recorder. HARD precondition, not hygiene: the SECOND
  # LoadGame below is REJECTED `recording-active` by the dispatch guard if a
  # recorder is live, and SaveGame would persist a half-recorded stub into the save
  # the TS half then reads.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # mapRenderTracing arms the map/TS tracer + probe; verboseLogging is LOAD-BEARING
  # (the Tier-B truth lines are Verbose - the V1 lesson). Settings are
  # process-global, so both survive the LoadGame into TS.
  { cmd = "SetSetting", args = { name = "mapRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",   value = "true" }, expect = "OK" },
  # ARM (FLIGHT-only): the production MissionStore.SetLoopEnabled path. THIS is
  # where a CROSS-PARENT tree either reaches ApplyReaim or does not.
  # TREE ID: B26 flight 3's committed tree, read from the harvested fixture.
  { cmd = "MissionConfig", args = { tree = "9aa3c87c95a147388e6220bd36796fd9", loop = "true" }, expect = "OK" },
  # WARP TO CYCLE 1's LAUNCH (FLIGHT-only): an instantaneous Planetarium clock set.
  # Its `relaunchUt=` echo is the number the whole seed table hangs off.
  { cmd = "StartLoopPlayback", args = { tree = "9aa3c87c95a147388e6220bd36796fd9" }, expect = "OK", budget = 300 },
  # FORWARD TO ~140 s PAST THE SEEDED CYCLE-1 Jool->Vall SEAM (FLIGHT-only).
  # V17M's third cycle-1 bracket jump, reused verbatim. CALIBRATION SEED under H1.
  { cmd = "TimeJump", args = { ut = "28976421" }, expect = "OK", budget = 300 },
  # PERSIST the armed mission state + the jumped clock.
  { cmd = "SaveGame",   args = { name = "persistent" },                      expect = "OK" },
  # RE-KILL THE RECORDER immediately before the load the guard rejects (V5's
  # measured re-arm race - see the header).
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  # RE-ENTER IN THE TRACKING STATION (R12's additive `scene=` arg, the H23 route).
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "trackstation" }, expect = "OK", budget = 300 },
  # FORTY DWELL TICKS - grown from two at the run-1 re-pin (2026-08-20_1917),
  # because on THIS subject the dwell is not census pacing but SPAWN-THROTTLE
