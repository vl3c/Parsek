cle-1 bracket, re-derived from the harvested bytes so the pair still observes the SAME instant from the two scenes; it lands 140 s past the recording's Jool->Vall seam at 28,892,466.219888370. None of it touches the routing question this lane asks, which stays unanswered and gated on neither hypothesis. Committed AHEAD of its subject with a ZERO tree id and ONE calibration-seed jump UT (V17M's third cycle-1 bracket jump, reused so the two lanes observe the same instant from the two scenes), tracked by the self-retiring SharedShipsManifestTests.PENDING_FIXTURE_LANES exemption. The tracking-station half of the Laythe->Vall pair and THE FIRST TS LOOP SUBJECT WHOSE RECORDING IS CROSS-PARENT. V5 put a looped RE-AIMED interplanetary member in the tracking station and pinned `reaimed=True`; V6T, V14T, V15T and V16T each asked the same question of a SAME-PARENT subject and got the exact inversion four times over, at four parents. This is the first TS subject since V5 that might legitimately go either way - Vall is not a child of Laythe, so `IsSameParentTarget` is false and the unit should reach `ApplyReaim`, and whether the TS render then assembles a re-aimed chain or falls back to the faithful one IS the measurement. `factory chain rec=... reaimed=True|False` is the single sharpest discriminator and is deliberately left UNREQUIRED and UNFORBIDDEN, as is the whole re-aim trio - the exact inversion of V14T/V15T/V16T, which forbid it because on a same-parent subject re-aim is structurally unreachable. THE CONIC IS WRITTEN OUT AS ARITHMETIC AND NOT PINNED, for a reason specific to this lane: a re-aimed chain does not render the RECORDED conic at all, so the conic a reader sees is itself a routing signal and predicting 'the recorded hyperbola' would assume the answer. IT SHIPS WITH allowedAnomalies = [] ON PURPOSE and is EXPECTED TO RED on `icon-off-orbit` - the V15T/V16T pattern, now a deterministic property of the single-jump shape across six runs at three parents (94.05 / 26.49 / 129.15 deg) with the stepped-bracket controls silent on all six of theirs; a fourth pair tests whether V16T's first-ever count > 1 reading is the new normal or was specific to its k = 20 cadence. A SECOND, SHARPER PREDICTION IS PRE-REGISTERED AND EXPECTED TO COME BACK NEGATIVE: V16T's `seam-endpoint-outside-soi` raise came from a creation-frame binding gap whose displacement SCALES WITH THE CADENCE MULTIPLE, and this lane's cadence is a synodic rather than 20 moon periods, so the raise should NOT recur - if it does anyway that is a finding about the mechanism rather than about the lane."
