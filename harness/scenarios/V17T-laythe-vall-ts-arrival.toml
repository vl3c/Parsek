# =====================================================================================
# *** RE-PINNED 2026-08-20 AND FLYABLE. *** This lane was committed AHEAD OF ITS
# SUBJECT, exactly as V17M was. **THE SUBJECT NOW EXISTS**:
# `B26-laythe-vall-transfer` flight 3 (run 2026-08-20_1752, PASS attempt 1) flew
# the suite's first completed moon-to-moon transfer and its produced save is
# harvested as `fixtures/saves/vall-transfer-recorded`. The tree id and the
# single TimeJump UT are now DERIVED from that fixture's bytes (the UT is still
# V17M's third cycle-1 bracket jump, reused verbatim so the two lanes observe the
# SAME instant from the two scenes). The self-retiring
# `SharedShipsManifestTests.PENDING_FIXTURE_LANES` exemption is deleted.
#
# ---------------------------------------------------------------------------------
# RUN 1 LEDGER (2026-08-20_1917, PARSEK-FAIL(expectations) attempt 1) - the red
# was the pre-registered calibration catch, but NOT on the surface this header
# predicted. THREE readings:
#
# (1) BOTH TS anti-vacuity pins missed and the `created 0` forbid fired - all
# three against the SAME product mechanism, measured for the first time on a
# self-overlapping TS subject: the init walk skips the loop-armed base recording
# (`noOrbit=1`: the Vall tail is segment-less, no orbit source resolves), the
# real ghosts come from the DYNAMIC overlap path at `MaxSpawnsPerFrame = 2` per
# lifecycle tick NEWEST-CYCLE-FIRST, and the two-tick TS phase (~0.65 s, 3
# ticks) ended after 6 ghosts (cycles 14-19) - before cycle 1, the one instance
# in its Vall leg. The pins are re-targeted to the dynamic path, the forbid is
# retired as measuring a deliberate product behavior, and the TS phase carries
# the forty-tick dwell (see the step-list comments at each site).
#
# (2) THE EXPECTED `icon-off-orbit` RED DID NOT HAPPEN - `anomalySweep` PASSED
# clean, BREAKING the 6/6 single-jump streak. The step shape is IDENTICAL to
# V14T/V15T/V16T (FLIGHT jump -> SaveGame -> TS re-entry), so the discriminating
# variable is NOT the workflow - it is the subject: first self-overlapping loop,
# and first nested-SOI recording whose ProtoOrbitLine fail-closes to a
# root-frame verbatim render (V17M's run-3 finding). WHICH of those breaks the
# trigger is NOT determined by this run; recorded as an open reading on the
# family entry, no mechanism claimed.
#
# (3) The sharper pre-registered negative held too: no `seam-endpoint-outside-soi`
# raise (the displacement scales with the cadence multiple, and this subject's
# effective multiple at the observed epoch is small).
# ---------------------------------------------------------------------------------
#
# THE DERIVATION LIVES IN V17M'S HEADER SECTION 3 and is deliberately not
# duplicated here. **READ ITS FINDING**: the pre-flight warning that no seed set
# could serve both roads is REFUTED at this pair - the 1:2:4 resonance puts
# P_Vall and the Laythe-Vall synodic 0.6615 s apart, so the two candidate tables
# are identical on cycle 1. The warning it replaced said: the anchor formula that
# served V14/V15/V16 is a PHASE-LOCK
# artifact and this subject may not take that road. The table is seeded under the
# RE-AIM hypothesis and will move under the other one.
# =====================================================================================
#
# V17T: THE TRACKING-STATION OBSERVATION OF A LOOPED **MOON-TO-MOON** ARRIVAL -
# the TS half of the V17 pair, and the first TS loop subject whose recording is
# CROSS-PARENT.
#
# V5 put a looped, RE-AIMED, INTERPLANETARY member in the tracking station and
# pinned `reaimed=True`. V6T, V14T, V15T and V16T each asked the same question of
# a SAME-PARENT subject and got the exact inversion - `reaimed=False`, the faithful
# chain - four times over, at four parents.
#
# **THIS LANE IS THE FIRST TS SUBJECT SINCE V5 THAT MIGHT LEGITIMATELY GO EITHER
# WAY**, and that is the whole reason it exists as a separate reading rather than
# as V17M's shadow. Vall is not a child of Laythe, so `IsSameParentTarget` is false
# and the unit should reach `ApplyReaim`; whether the TS render then assembles a
# RE-AIMED chain (V5's answer) or falls back to the faithful one (V6T/V14T/V15T/
# V16T's) is the measurement. V17M's header sections 1 and 2 carry the full guard
# walk, both hypotheses and the discriminating lines; they are not restated here.
#
# THE ONE-LINE VERSION: `factory chain rec=... reaimed=True|False` is the single
# sharpest discriminator, it is a RENDER-side truth rather than a planner
# intention, and **THE TS SCENE IS WHERE THE RENDER CHAIN IS ASSEMBLED MOST
# CLEANLY** - which is why the pair's routing verdict is worth reading from both
# scenes rather than only from FLIGHT.
#
# ---------------------------------------------------------------------------------
# WHY THE STEP CHAIN LOOKS LIKE THIS - V5's precondition, unchanged and still
# binding. MissionConfig, StartLoopPlayback and TimeJump are ALL `RequiresFlight`
# in `TestCommandDispatcher.Preconditions`: in TRACKSTATION each would DEFER
# `not-in-flight` until its budget expired and the run would die on a timeout
# having armed nothing. So arming and clock work happen in FLIGHT, are PERSISTED,
# and only then re-entered in TS:
#   FLIGHT: kill the entry stub -> arm tracers -> MissionConfig (loop ON)
#           -> StartLoopPlayback -> TimeJump past the cycle-1 Jool->Vall SOI seam
#   SaveGame (persists the armed MissionStore state AND the jumped clock; ghost
#             ProtoVessels are stripped by GhostMapPresence.StripFromSave)
#   TRACKSTATION: LoadGame scene=trackstation, then two AnyScene dwell ticks.
# There is no shorter honest chain.
#
# **AND NOTE WHAT THIS LANE DELIBERATELY DOES NOT CARRY**: V17M's forty-tick
# census-pacing block. A single-arrival shape has exactly one census emission to
# make and no second one to rescue, so the block would buy nothing - and it would
# blur the pair's OTHER axis. That axis matters more here than on any predecessor,
# because of the paragraph below.
#
# WHERE THE CLOCK IS PARKED. 29,015,577 is ~140 s PAST the SEEDED cycle-1
# Jool->Vall SOI entry (29,015,437.328). It is V17M's third cycle-1 bracket jump,
# reused verbatim so the two lanes observe the SAME instant from the two scenes.
# The inputs are V17M section 3's, in brief: UT0 seed 28,817,026, span seed
# 96,874.9 s (band 43,874.9 -> 149,836.3, a 3.4x spread driven by the transfer
# window wait), arrival-seam offset seed 92,449.9, anchor seeded at one synodic
# (105,961.428 s) past UT0 under H1.
#
# A non-forward jump answers `REJECTED reason=backward-jump`, only a WARN. That
# token is FORBIDDEN below, and **ON THIS SEED SET IT IS THE LIKELY OUTCOME OF RUN
# 1** - which is acceptable and is what run 1 is for (V17M section 3).
#
# ---------------------------------------------------------------------------------
# THE SINGLE-JUMP SHAPE, AND WHAT IT IS NOW EXPECTED TO COST
# ---------------------------------------------------------------------------------
# `docs/dev/todo-and-known-bugs.md` ->
# MAPRENDER-ICON-OFF-ORBIT-CREATION-FRAME-AFTER-JUMP is a MEASURED, deterministic
# property of exactly this shape: ONE large TimeJump straight onto an epoch just
# inside a foreign moon's SOI raises `icon-off-orbit` on the ghost-proto CREATION
# frame. It has fired on all six runs of V14T, V15T and V16T, at three parents
# (Duna/Ike 94.05 deg, Eve/Gilly 26.49, Jool/Laythe 129.15), while the
# stepped-bracket V14M/V15M/V16M controls stayed silent on all six of theirs.
#
# **SO THIS LANE SHIPS WITH `allowedAnomalies = []` AND IS EXPECTED TO RED**, the
# V15T/V16T pattern verbatim: a PARSEK-FAIL(anomaly) with every step green is the
# PRE-REGISTERED CORRECT CATCH, and pre-tolerating the token would swallow whatever
# a FOURTH body pair has to say. What a fourth point can add:
#   * V16T measured the FIRST count > 1 reading (TWO raises, one frame, two proto
#     pids), which falsified the "one per run" property the earlier four runs had
#     established. A fourth pair tests whether count > 1 is the new normal or was
#     specific to a k = 20 cadence.
#   * The MAGNITUDE is recorded as correlating with nothing three points can
#     separate. A fourth is the cheapest possible next datum.
# If it fires, arm the BARE token WITH the run that shows it (S1.4), and note that
# V16T's reading already moved the deferred ceiling from `maxCount = 1` to 2.
#
# **AND A SECOND, SHARPER EXPECTATION THIS LANE INHERITS.** V16T also measured
# `seam-endpoint-outside-soi` on a SECOND lens - the seam-endpoint lens evaluating
# the recording's UN-SHIFTED epoch on the proto's creation frame, filed as
# MAPRENDER-SEAM-LENS-EVALUATES-UNSHIFTED-EPOCH-ON-CREATION-FRAME. The mechanism
# that entry names **SCALES WITH THE CADENCE MULTIPLE**: at k = 1 the un-shifted
# epoch sits under one moon period from the live clock and the lens skips on
# `body-mismatch`; at k = 20 it was 1.06 Ms away and the lens had something to fail
# on. THIS LANE'S CADENCE IS A SYNODIC (105,961.4 s under H1), so the displacement
# is of the same order as V15T's rather than V16T's - **the prediction is therefore
# that this raise does NOT recur here**, and if it does anyway that is a finding
# about the mechanism rather than about the lane. Neither outcome is gated.
#
# ---------------------------------------------------------------------------------
# THE TS DWELL IS SHORT, AND V5 MEASURED HOW SHORT. No seam verb passes time in TS
# (all RequiresFlight), so the dwell is the LoadGame settle plus the harness poll
# interval across two cheap AnyScene reads - V5 measured 1.08 s of 1x. Enough for
# the question this spec asks (does the TS host materialize the looped member at
# all, and on which chain) and not enough for anything needing a rate-limited
# instrument. `probe frame summary` is therefore not pinned (VerboseRateLimited on
# a shared process-global key, no scene token - V5 run 1 attempt 2 measured that
# race). A real TS dwell needs a TS-legal time-passing verb, which does not exist.
#
# THE RE-KILL PAIR BEFORE THE TS LOAD IS NOT BELT-AND-BRACES: V5 run 1 attempt 1
# died there on `reject cmd=LoadGame reason=recording-active`, because the
# scene-entry promotion recorder RE-ARMS on some entry orderings and not others.
# Running the pair immediately before the load the guard rejects is the only
# placement that makes the outcome deterministic.
#
# ---------------------------------------------------------------------------------
# WHAT THE TS HOST SHOULD MATERIALIZE - AND THE CONIC IS DELIBERATELY NOT
# PREDICTED THIS TIME
# ---------------------------------------------------------------------------------
# V6T's TS ghost printed the fixture's own recorded Mun approach hyperbola,
# V14T's Ike's, V15T's Gilly's, V16T's Laythe's. V15T PREDICTED its conic and was
# WRONG BY THREE ORDERS OF MAGNITUDE through a factor-1000 slip; V16T predicted its
# own and landed within a factor of 1.7. The arithmetic here would be
# `a = -mu_Vall/v_inf^2 = -2.074e11/309.12^2 = -2,170,300 m` with
# `e = 1 + r_p/|a|`, giving e ~ 1.15-1.28 across the admissible park window.
#
# **THAT IS WRITTEN DOWN AS ARITHMETIC AND NOT AS A PIN, for a reason specific to
# this lane**: under H1 the TS chain is RE-AIMED, and a re-aimed chain does not
# render the recorded conic at all - it renders the synthesized one. So the conic
# a reader sees is itself a routing signal, and predicting "the recorded
# hyperbola" would be assuming H2. Read the conic; do not pin it (V14T's standing
# rule about six-figure floats applies regardless).
#
# What IS required below is the `body=Vall scene=TRACKSTATION` half, which is
# road-independent: both chains put a ghost at Vall at this epoch.
#
# ---------------------------------------------------------------------------------
# POSTURE - FIRST-RUN READING, AND THE THINNEST TS SET OF THE FAMILY
# ---------------------------------------------------------------------------------
# `required` is TEN tokens, against V16T's armed thirteen, and the three that are
# absent are absent on purpose: `Orbital(...) same-parent`, `support=Supported` and
# any `PhaseLock APPLIED` form are ALL phase-lock-road artifacts that will not fire
# under H1. `factory chain ... reaimed=False` is likewise ABSENT - it is V6T's
# sharpest line and V16T's armed pin, and here it is exactly half of the
# measurement, so requiring it would gate on H2.
#
# `forbidden` is FOUR, not V14T's six: the re-aim trio is removed for the reason in
# V17M section 2.
#
# `[expectations.rewind]` is REPORT-ONLY and `[expectations.recordings.structure]`
# is ABSENT. Arm both from this lane's own bytes - and note V5's rule that a
# DOUBLE-ENTRY spec owes the tighter pin, because it writes a save mid-run and
# reads it back through a SECOND scene load.
# =====================================================================================
