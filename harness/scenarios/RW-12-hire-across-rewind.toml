schema = 1
id = "RW-12-hire-across-rewind"
# =====================================================================================
# RW-12: A SPACE CENTER HIRE INSIDE A COMMITTED TIMELINE, ACROSS A REWIND-TO-LAUNCH (the rewind
# ledger campaign).
#
# THE RULES UNDER TEST: a KSC hire is a committed-future KerbalHire row once the clock is wound
# back before it. Until the clock reaches it the kerbal stays an applicant in the rewind save's
# roster and a second hire of him is blocked by the stock-UI reservation rule
# (`KerbalHirePatch`, the committed-future index); when the clock reaches the row,
# `KerbalsModule.PromoteReachedCommittedHires` turns him from Applicant to Crew without stock's
# hire event, so the cost is charged once, by the row.
#
# THE HOST HAS NO NAMED APPLICANT: cs-career-mun4's persistent.sfs carries no `type = Applicant`
# (every kerbal is Crew or a tourist); stock fills the pool at run time with random names, so the
# hire names its kerbal with `kerbal=applicant-first` (new on this branch: the first applicant in
# the live pool; the name comes back as `target` and the second hire uses it).
#
# PLAN (cs-career-mun4 = CS-6c's produced save, UT ~185734):
#   boot       LoadGame persistent at the Space Center; warp to 185800.
#   H          a Jumping Flea on the pad, recorded to 185840, committed, recovered at its marker.
#   hire       warp to 185900 (T1, outside H's 15 s lead window): hire the first applicant.
#   rewind     InvokeRewindToLaunch onto H's tree: the clock goes to ~185785.
#   refused    the same applicant hired again before T1: REJECTED. MEASURED ANSWER: either
#              `blocked-committed` (he is still an applicant in the rewind save and the committed
#              row blocks the hire) or `kerbal-not-applicant` (stock had not generated him before
#              the launch save). The first flight reads which; the lane pins the one it sees.
#   crossing   warp to 186000: the row crosses once, the kerbal is promoted to Crew, the cost is
#              not charged again, and the pools come back to the ones before the rewind.
#   check      an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# NO DISMISSAL HALF: a dismissal across the rewind needs its own committed dismissal row and
# probe; left for its own lane.
#
# PINNED LITERALS (read 2026-10-28 on main b7d02854b):
#   kscaction hire-kerbal resolved applicant-first -> '<name>'   TestCommands/TestCommandKscAction.cs
#   KerbalHirePatch blocking hire for name=                      Patches/KerbalHirePatch.cs (KB-3)
#   Committed hire applied: '<name>' Applicant -> Crew           KerbalsModule.cs
#   Clock-crossing reached committed-future rows:                GameActions/LedgerOrchestrator.cs
#   KSC spending recorded: type=KerbalHire                       GameActions/LedgerOrchestrator.cs
#
# STATUS: AUTHORED 2026-10-28 (branch `rw12-hire`), NEVER FLOWN. The refusal kind after the
# rewind, the hire cost, the recordings count and the batch split are interim until measured.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, a Space Center hire inside a committed timeline: on cs-career-mun4 a committed pad Flea, then the first applicant hired at T1 (kerbal=applicant-first); after a Rewind-to-Launch before T1 the same applicant's second hire is refused, the warp past T1 promotes him to Crew through the committed row with the hire cost charged once, and the pools come back; LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-12", "career", "ledger", "rewind", "rewind-to-launch", "kerbal-hire", "kerbals",
        "ksc-marker", "editor", "ground-truth", "ingame-batch", "timeline-ops", "reading-run"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 3 x 120 warps + 2 x (120 GoToEditor + 180 LaunchFromEditor)
# + 180 StartRecording + 120 warp + 120 CommitTree + 120 ExitToSpaceCenter + 60 KscMarkerRecover
# + 300 rewind + 120 check warp + 5 x 120 SaveGame + 2 x 60 KscAction + 540 RunTests = 3920;
# runtime 4800 adds the inert steps and FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  # Stock generates applicants ONLY when the Astronaut Complex opens (decompiled
  # `AstronautComplex` -> `CrewRoster.Update(UT)` -> `AddApplicant`); without it the pool stays
  # empty (run `2026-10-28_2020`: `no-applicant`). Opened here, before H's launch save, so the
  # applicants are in the rewind save too.
  { cmd = "StockScreen",    args = { screen = "astronaut", act = "open" },                 expect = "OK" },
  { cmd = "StockScreen",    args = { screen = "astronaut", act = "close" },                expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },
  # ---- H: the Flea on the pad, recorded, committed, recovered at its marker ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "h",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "185840" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw12-h-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw12-01-after-h-commit" },                   expect = "OK", budget = 120 },
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${h.pid}" },                                 expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw12-h-recovered" },                         expect = "OK" },
  # ---- the hire at T1 = 185900, outside H's lead window ----
  { cmd = "WarpToUT",       args = { ut = "185900", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw12-before-hire" },                         expect = "OK" },
  { cmd = "KscAction",      args = { action = "hire-kerbal", kerbal = "applicant-first" }, label = "hire", expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw12-hired" },                               expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw12-02-after-hire" },                       expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw12-before-rewind" },                       expect = "OK" },
  # ---- the rewind: the hire is committed future ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw12-rewound" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw12-03-after-rtl" },                        expect = "OK", budget = 120 },
  # ---- the same applicant hired again before T1: refused ----
  { cmd = "KscAction",      args = { action = "hire-kerbal", kerbal = "${hire.target}" },  expect = "REJECTED", budget = 60 },
  { cmd = "UiAction",       args = { op = "dismiss", popup = "actionblocked", press = "OK" }, expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw12-refused" },                             expect = "OK" },
  # ---- the crossing ----
  { cmd = "WarpToUT",       args = { ut = "186000", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw12-crossed" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw12-04-after-crossing" },                   expect = "OK", budget = 120 },
  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186030" },                                      expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["funds", "kerbals", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 34 recordings plus H; the check launch is unrecorded. INTERIM window.
count = { min = 35, max = 36 }

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- the hire at T1: the first applicant, charged once by stock, booked as a KSC row ----
  "MISSIONMARK label=rw12-before-hire ut=(?:(?!MISSIONMARK label=rw12-hired )[\\s\\S])*?kscaction hire-kerbal resolved applicant-first -> '[^'\\r\\n]+' applicants=[1-9][0-9]*",
  "MISSIONMARK label=rw12-before-hire ut=(?:(?!MISSIONMARK label=rw12-hired )[\\s\\S])*?kscaction action=hire-kerbal target=[^\\r\\n]* applied=true",
  "MISSIONMARK label=rw12-before-hire ut=(?:(?!MISSIONMARK label=rw12-hired )[\\s\\S])*?Game state: FundsChanged -[0-9]+ \\(CrewRecruited\\)",
  "MISSIONMARK label=rw12-before-hire ut=(?:(?!MISSIONMARK label=rw12-hired )[\\s\\S])*?KSC spending recorded: type=KerbalHire, UT=1859[0-9]{2}\\.[0-9]",

  # ---- the rewind ----
  "MISSIONMARK label=rw12-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw12-rewound ut=1857[0-9]{2}\\.",

  # ---- the second hire of the same applicant before T1: refused (the committed-future block) ----
  "kscaction hire-kerbal resolved applicant-first -> '([^'\\r\\n]+)' [\\s\\S]*?MISSIONMARK label=rw12-rewound ut=(?:(?!MISSIONMARK label=rw12-refused )[\\s\\S])*?\\[KerbalHirePatch\\] blocking hire for name=\\1 - committed future hire ut=\\d+ nowUT=\\d+ recording=\\(ksc\\)",
  "MISSIONMARK label=rw12-rewound ut=(?:(?!MISSIONMARK label=rw12-refused )[\\s\\S])*?kscaction refused action=hire-kerbal reason=blocked-committed target=",

  # ---- the crossing: the row reached once, the kerbal promoted, no second charge ----
  "MISSIONMARK label=rw12-refused ut=(?:(?!MISSIONMARK label=rw12-crossed )[\\s\\S])*?Clock-crossing reached committed-future rows: [^\\r\\n]*KerbalHire@1859[0-9]{2}\\.",
  "kscaction hire-kerbal resolved applicant-first -> '([^'\\r\\n]+)' [\\s\\S]*?MISSIONMARK label=rw12-refused ut=(?:(?!MISSIONMARK label=rw12-crossed )[\\s\\S])*?Committed hire applied: '\\1' Applicant -> Crew as the clock reached its row",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw12-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw12-crossed ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  # One hire, one charge: the second hire never applies and stock never charges again.
  "MISSIONMARK label=rw12-rewound ut=[\\s\\S]*kscaction action=hire-kerbal target=[^\\r\\n]* applied=true",
  "MISSIONMARK label=rw12-rewound ut=[\\s\\S]*Game state: FundsChanged -[0-9]+ \\(CrewRecruited\\)",
  "Committed hire reached but",
  "filed StockPoolAdjustment amount=",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

[runtime]
budgetSeconds = 4800

[retry]
policy = "once"

[expectedFail]
bugId = ""
