schema = 1
id = "GUI-15-census-career-contracts"
tier = "operator"
# THE GUI CENSUS: CAREER CONTRACTS ON THE TIMELINE, POPULATED, WITH THE SLOT COUNTS.
#
# REPOINTED 2026-09-27. This lane photographed the Career State window's Contracts tab
# until the owner removed that window (its dated rows were already the Timeline's Career
# view, and stock's Mission Control carries Parsek's reservation overlays). The ONE fact
# only that window showed - how many contract and strategy slots the committed future
# reserves - is now the last sentence of the hover on the Timeline's `Contracts` and
# `Strategies` view buttons (`CareerSlotSummary.FormatSlotSentence`, free first, then
# active, then reserved: `Contract slots: 4 of 7 free now (2 active, 1 reserved for
# later).`). So the lane now photographs the Timeline's Contracts view on the same host
# and reads that hover three ways: the dump's `tooltip` key on the `Contracts` toggle,
# the `Career slot hover rebuilt` log line, and one pointer capture.
#
# THE HOST IS STILL THE ONE FIXTURE WHOSE WHOLE POINT IS CONTRACT ROWS.
# `career-contract-pad` differs from its donor on ONE line of the save plus ONE sidecar,
# `Parsek/GameState/ledger.pgld`, which carries exactly TWO `type = 5` (contract accept)
# rows and NO terminal row of any kind - asserted by its builder's `--check` and wired
# through `CareerContractPadFixtureDriftTests`. So the Contracts view lists two dated
# accept rows. The hover's counts are NOT the ledger's, and that is by design: they are
# the LIVE Mission Control forecast (`ContractSlotReservation.ForecastNow()`, the one the
# accept block reads), which counts stock's own active contracts - and this fixture's
# stock `CONTRACTS` node is EMPTY by assertion. So the first flight (`2026-09-27_2121`)
# MEASURED `Contract slots: 2 of 2 free now (0 active).` with `source=live`, beside two
# ledger accept rows; the ledger fallback is used only when stock's contract state is
# unreadable. Nothing in the recorded future accepts a contract, so no slot is reserved
# and the reserved clause is absent - the zero-reserved form; the reserved form is
# unit-proven (`CareerSlotSummaryTests`).
#
# THE HOVER CAPTURE IS NOT A GATE. On the first flight (`2026-09-27_2121`) it PAINTED: the
# echo strip of `cc-timeline-contracts-hover-advanced.png` reads the whole hover, although
# the pointer step's own read-back said `tooltip=-` (the park step read it a moment later,
# `tooltipFrame=5947`). On the second (`_2126`) it did not paint, and the pointer answer
# says `via=find-product` rather than `via=active` - the known intermittent
# GUI-CENSUS-POINTER-LANDS-BUT-HOVER-DOES-NOT-PAINT - so the pointer pin regexes both
# `via=` spellings. The COUNTS do not depend on it: the tree dump records every control's
# GUIContent tooltip, so `cc-timeline-contracts-advanced.gui.json` carries the whole hover
# text on the `Contracts` node whether or not the strip painted, and the log line below
# pins the same string.
#
# `scene = "spacecenter"` IS REQUIRED. This host's `activeVessel = 0` names a focusable
# vessel, so a plain LoadGame takes `TestCommandLoadGame.DecideLoadRoute`'s Focusable
# branch and boots into FLIGHT. R12's additive `scene=` arg forces the NoVesselSpaceCenter
# route.
#
# THE MAIN-WINDOW CAPTURE stays: it is the picture that shows the `Career` launcher gone.
description = "GUI census: the Timeline's Career > Contracts view on the one fixture whose ledger sidecar carries two contract accepts and no terminal row, with the Contracts button's hover (the Career-mode slot counts that replaced the removed Career State window) read from the dump, the log and one pointer attempt, plus the Strategies view and the main window without its Career launcher."
instanceProfile = "stock-minimal"
tags = ["gui-census", "screenshots", "ui", "career", "timeline", "GUI-15", "pending-operator"]

[fixture]
saveTemplate = "fixtures/saves/career-contract-pad"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  # --- boot, forced to the Space Center (activeVessel = 0 is focusable) ---
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },

  # --- the host surface. `open window=main` FIRST is a precondition: a non-`main` open
  # or rect settle REFUSES while the host's `showUI` is false. This capture is also the
  # proof the `Career` launcher is gone.
  { cmd = "UiAction", args = { op = "complexity", mode = "advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "open", window = "main" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "main", x = "8", y = "8", w = "250", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "cc-main-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "cc-main-advanced" }, expect = "OK" },

  # --- THE CAPTURE THIS LANE EXISTS FOR: the Contracts view, its two accept rows, and the
  # `Contracts` button whose hover (the dump's `tooltip` key) carries the slot counts ---
  { cmd = "UiAction", args = { op = "open", window = "timeline" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "timeline", x = "270", y = "8", w = "1000", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "contracts" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "cc-timeline-contracts-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "cc-timeline-contracts-advanced" }, expect = "OK" },

  # --- the hover attempt (see the header): resolve the `Contracts` toggle by its words,
  # land the cursor on it at the op's strongest settings, capture, park ---
  { cmd = "UiAction", args = { op = "find", window = "timeline", text = "Contracts" }, label = "findcontracts", expect = "OK" },
  { cmd = "UiAction", args = { op = "pointer", x = "${findcontracts.cx}", y = "${findcontracts.cy}", focus = "true", nudge = "true" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "cc-timeline-contracts-hover-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "cc-timeline-contracts-hover-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "pointer", park = "true" }, expect = "OK" },

  # --- the Strategies view on the same host: no strategy row, and its button's hover
  # reads Administration L1's one slot free ---
  { cmd = "UiAction", args = { op = "tab", window = "timeline", tab = "strategies" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "cc-timeline-strategies-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "cc-timeline-strategies-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "timeline" }, expect = "OK" },

  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# BASICS ONLY. `L5-career-contract-complete` is the lane that claims this fixture's D8
# contract-lifecycle values and gates the state machine; a census over the same bytes
# claims nothing behavioural - a dimension value records that a value was exercised with
# a verdict attached, and the verdict here is an image.
D14 = ["career", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# ZERO. This host carries a ledger sidecar and NO recordings, and nothing in this lane
# records.
count = { min = 0, max = 0 }

[expectations.logContracts]
# This lane's OWN seam records, the ONE production line that says the ledger sidecar
# loaded at all (its README: "Its `Accept:` line is what says the sidecar loaded at all"),
# and the hover rebuild line that carries the slot counts verbatim, pinned WHOLE off the
# first flight (`2026-09-27_2121`, see the header for why the live count is 0 active).
#
# The describe echoes are the in-run mapping check: `open=<n> openWindows=<names>`
# pinned as a literal is an EXACT claim, since a third open window would move the count.
required = [
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=12 open=1 openWindows=main",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=12 open=2 openWindows=main,timeline",
  "Accept:",
  "\\[Parsek\\]\\[VERBOSE\\]\\[Timeline\\] Career slot hover rebuilt liveUT=[0-9]+ contractSlots=active=0/limit=2/peak=0/reserved=0/free=2/source=live strategySlots=active=0/limit=1/peak=0/reserved=0/free=1 missionControl=L1 administration=L1 contractsHover='Only contract rows, past and future\\. Contract slots: 2 of 2 free now \\(0 active\\)\\.' strategiesHover='Only strategy rows, past and future\\. Strategy slots: 1 of 1 free now \\(0 active\\)\\.'",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction find window=timeline text=Contracts ctrl=\\w+ match=exact matches=[0-9]+ rect=",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction pointer at=[0-9.-]+,[0-9.-]+ park=false via=[a-z-]+ frames=[0-9]+ focus=true nudge=(true|false) fgOutcome=(already|direct|attached|refused|no-window) fg=(true|false) tooltip=",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction pointer at=[0-9.-]+,[0-9.-]+ park=true via=",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] capturescreenshot ok label=cc-timeline-contracts-advanced",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=cc-main-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=cc-timeline-contracts-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=cc-timeline-contracts-hover-advanced .*patched=17/17",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] dumpguitree ok label=cc-timeline-strategies-advanced .*patched=17/17",
]
forbidden = []

[runtime]
# Four captures and four dumps, a 300 s cold-load allowance, one OS-cursor move and ~15
# single-phase UI ops on a one-vessel career with a two-row ledger sidecar. The old form
# of this lane (seven captures) measured 64 s. 900 s is an order of magnitude over that and
# stays generous because the PRODUCT is the images and the trees, and a KILLED run leaves
# neither.
budgetSeconds = 900
# The census frame (`screenResolution`, harness README): 1280x720 cropped every
# Parsek window wider or taller than it, so the census lanes capture at 1920x1080.
screenResolution = "1920x1080"

[retry]
policy = "once"

[expectedFail]
bugId = ""
