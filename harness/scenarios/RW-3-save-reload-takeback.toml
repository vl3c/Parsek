schema = 1
id = "RW-3-save-reload-takeback"
# =====================================================================================
# RW-3: A SAVE AND A COLD RELOAD INSIDE A REWOUND TIMELINE, THEN AN ALREADY-CREDITED
# WORLD-FIRST REPEATED (the rewind ledger campaign, plan row 15 "save and reload, then
# repeat": RTL, SaveGame, LoadGame playerLoad=true, then repeat an already-credited
# identity; the plan expects the take-back to still fire because the timeline break is saved
# in the LEDGER node).
#
# THE RULINGS UNDER TEST: records and world-firsts pay once, the earliest crossing wins; a
# plain Rewind-to-Launch only moves the clock; stock is stopped first and corrected second
# (design 3.15 step 5, owner ruling 2026-10-26, prevention plus take-back). A player's load
# of a save file is a cold load (design-load-restores-the-save.md 4.1): the session forgets
# the in-memory ledger and reads the save's own, so everything the take-back needs (the era
# and the timeline break) must come back from the save's LEDGER node.
#
# WHAT THE CODE DOES WITH A REPEAT (read 2026-10-28, StockShadowTakeBack.cs,
# MilestonesModule.cs:126-162, CommittedMilestoneReach.cs header, KspStatePatcher.cs:3053):
#   - The take-back fires only for a repeat that walks AFTER its crediting row (the witness),
#     was captured after a timeline break, and whose witness the break separates from it
#     (witness captured before the break, witness UT after the break's loaded UT:
#     StockShadowTakeBack.IsWitnessForgotten, :343-359).
#   - A replay that re-earns the identity BEFORE the committed row's UT is not a repeat: it
#     walks first, so it is the credit (earliest crossing wins) and stock's payment is the
#     one payment; the committed row is zeroed (`Duplicate milestone`) with the replay as its
#     witness, captured after the break, so no take-back (StockShadowTakeBackTests
#     RecordRow_ZeroedBecauseALaterCaptureWalkedEarlier_IsNotTakenBack is the record twin).
#   - A replay AFTER the committed row's UT is the one ordering where stock could pay an
#     identity the timeline already credited. Prevention closes it first: once the clock is
#     at or past the committed row, PatchMilestones (a full patch, the Space Center crossing)
#     or CommittedMilestoneReach.Apply (a deferred patch, the flight clock cursor) marks the
#     stock node complete without reward, and stock's once-ever handler (decompiled
#     `SurfaceEVA.OnGoEVA`: `if (!IsComplete) { Complete(); AwardProgressStandard(...); }`)
#     pays nothing. The take-back is the backstop for whatever prevention misses, and it is
#     the backstop that needs the persisted break.
# So this lane flies the after-the-row ordering across the cold load and gates the OUTCOME
# the plan wants, paid once: either stock pays nothing (prevention, what the code predicts)
# or stock pays and the next update takes it back (`Took back ... milestone
# 'Kerbin/SurfaceEVA'`, the take-back reading the reloaded break). A second stock payment
# with no take-back reds. The persisted break is gated directly on its reload line.
#
# HOW THE LANE MAKES ITS PAST. RW-1's proven H verbatim: the Jumping Flea rolled out of the
# VAB, recorded on the pad, committed in flight and recovered. The committed future is an
# UNRECORDED second Flea (F) launched right after H's recovery: its pad EVA earns
# Kerbin/SurfaceEVA, which stock pays (RW-2 measured it on this host: `Milestone enriched:
# 'Kerbin/SurfaceEVA' funds=3200 rep=1.0 sci=0.0`, an untagged row written at once,
# `KSC spending recorded: type=MilestoneAchievement`), the kerbal boards back and F is
# recovered. That row W (UT ~186000.5) is the witness: captured before the rewind, dated
# after the rewind's landing. autoRecordOnEva is off from the start, so W is untagged and
# no flight but H records.
#
# THE HOST. `cs-career-mun4`, as RW-1 / RW-2: Career, funds 157546.18, rep 115.0, save UT
# 185734.04, the Astronaut Complex at 0.5 (EVA allowed). Kerbin's ProgressTracking subtree is
# reached with no SurfaceEVA node (persistent.sfs ProgressTracking, read 2026-10-28), so the
# first pad EVA is a world-first stock pays. Its ledger carries `takeBackFromCseq = 177`
# (persistent.sfs:4643) and no `timelineBreak`, so the take-back era is 177 and the break
# count starts at 0 (RW-2's boot read `Loaded take-back facts from 'GAME_STATE/LEDGER':
# era=177 breaks=0 badBreaks=0` on this fixture).
#
# THE TIMELINE (UTs are the plan):
#   185800     WarpToUT at the Space Center (RW-1's reason: clear of the fixture's last rows).
#   H          VAB launch (rollout -2932), StartRecording, warp in flight to 186000, stop,
#              CommitTree, Recover on the pad (+2932). Jeb's hold ends at the recovery.
#   F          at ~186000.5: the Flea again, unrecorded (Jeb is free), EvaExit (on the
#              ladder: the world-first, W), EvaBoard, Recover (+2932).
#   rewind     InvokeRewindToLaunch tree=latest from the Space Center: clock ~185785.4 (H's
#              start minus 15 s). `Timeline break recorded: kind=PlainRewind ... breaks=1`,
#              with a capture high water past W's capture. H's rows and F's rows (W among
#              them) are the committed future.
#   save       SaveGame to two named slots: rw03-03 (the step save) and rw03-04 (the plan's
#              SaveGame, the file the reload reads).
#   reload     LoadGame name=rw03-04-reload-source scene=spacecenter playerLoad=true: a Cold
#              save-file load (`coldReason=save-file`). The ledger comes back from the save's
#              node with `era=177 breaks=1`, and the load's recalc walks at the clock
#              (`useCurrentUtCutoff=True`), so no pool is lifted by the rows still ahead.
#   crossing   WarpToUT 186100 at the Space Center (RW-1's proven crossing shape, after a fresh
#              load, so no mission summary holds the warp): H's rows, F's rows and W cross
#              once; W is credited by the walk (`Credited milestone 'Kerbin/SurfaceEVA' at
#              UT=1860..`) and stock's node is marked.
#   repeat     The Flea from the VAB (unrecorded), EvaExit: the already-credited world-first
#              repeated. Stock pays nothing (or pays and the update takes it back). EvaBoard,
#              warp to 186130 in flight (L8's reason: the save clock off the rollout row).
#   check      SaveGame to the default slot, LedgerGroundTruth in that FLIGHT scene.
#
# THE STEP SAVES (owner's ask, for after-flight bug hunting). `SaveGame name=<slot>` writes the
# live game to `saves/<run save>/<slot>.sfs` (RW-2's shape); the last SaveGame writes the
# default slot `persistent`, the one a harvest reads.
#   rw03-01-after-h-commit        Space Center, H committed and recovered (~186000.2)
#   rw03-02-after-future-eva      Space Center, F's world-first written and F recovered
#   rw03-03-after-rtl             Space Center, rewound to ~185785, one timeline break
#   rw03-04-reload-source         the plan's SaveGame: the file the cold load reads
#   rw03-05-after-cold-reload     Space Center, the save's ledger reloaded
#   rw03-06-before-crossing       Space Center, every committed row still ahead
#   rw03-07-after-crossing        Space Center at ~186100, every committed row crossed
#   rw03-08-after-repeat          FLIGHT at ~186130, the repeated EVA done and boarded
#   persistent                    the same instant as rw03-08, the default slot
#
# THE LEDGER-AUDIT EXPECTATIONS FILE: harness/scenarios/ledger-audit/RW-3-save-reload-takeback.toml
# (a subdirectory, so no `scenarios/*.toml` discovery reads it as a spec). It marks the
# planned take-back (`stock paid again for milestone 'Kerbin/SurfaceEVA'`) EXPECTED for
# `tools/ledger_audit.py --expect`; any other take-back stays a FAIL. With prevention
# working the audit lists it under "expectations never matched", which does not fail.
#
# DEPARTURES FROM THE PLAN (row 15 as stated), each following the code:
#   - "Take-back must still fire": NOT REQUIRED. Prevention runs first (above), so with the
#     shipped code a repeat of an already-credited world-first is not paid by stock and no
#     `Took back` line is expected. The lane requires the money outcome (paid once) and the
#     reload of the break; a take-back is allowed only for this identity. A deterministic
#     in-game take-back needs a prevention gap: the known one is contract completion in
#     flight under a live recorder (todo LEDGER-EVENT-IDENTITY step 5 "Not done": completion
#     is taken back but not mirrored in flight), which no pad flight on this host reaches.
#   - The repeat comes AFTER the crossing, not right after the reload: a repeat before the
#     committed row's UT is the earliest crossing, a legitimate first credit, and can never
#     be taken back.
#   - The repeated identity is a Space-Center-dated (untagged) world-first from an
#     unrecorded flight, not one of H's rows: a recorded EVA inside H would add EVA and board
#     branches to the tree (recordings count unmeasured) for no extra coverage, and RW-2
#     measured the unrecorded EVA's untagged row on this host.
#
# THE RW-2 SYMPTOM, FORBIDDEN HERE. RW-2 found that a stock revert inside a rewound timeline
# ran one recalc with cutoffUT=null and paid the committed future early (`PatchFunds:
# 151682.2 -> 192114.2 (delta=40432.0`). A cold load also runs a full-replay recalc whenever
# the clock is not ready (LedgerOrchestrator.cs:5172-5208, BUG-F), so this lane forbids,
# from the rewind to the crossing, any positive `PatchFunds: a -> b (delta=` (no credit is
# due in that window: the only stock movement is none) and any walk that credits the
# committed SurfaceEVA row before the clock reaches it; it requires the reload's recalc
# decision to read `useCurrentUtCutoff=True` (STR-1's flown save-file load with future rows,
# archived run 2026-10-25_1151, read the same shape).
#
# LITERALS (Source/Parsek/..., verified 2026-10-28 by grep):
#   launchfromeditor complete scene=FLIGHT    TestCommands/TestCommandEditorRoute.cs:517
#   Game state: FundsChanged                  GameStateRecorder.cs:945
#   MISSIONMARK label=                        TestCommands/TestCommandMissionMark.cs:22
#   [LedgerTrace] phase=Structural / Anomaly  LedgerTrace.cs:268 / :333
#   evaexit start / complete                  TestCommands/ParsekTestCommandAddon.Eva.cs:160 / :277
#   evaboard complete                         TestCommands/ParsekTestCommandAddon.Eva.cs:946
#   Game state: MilestoneAchieved '<id>'      GameStateRecorder.Handlers.cs:1165
#   Milestone enriched: '<id>'                GameStateRecorder.Handlers.cs:1516
#   Emit: <type> key='<k>' tag='<rec>'        GameStateRecorder.cs:176
#   KSC spending recorded: type=              GameActions/LedgerOrchestrator.cs:6095
#   Credited milestone '<id>' at UT=          GameActions/MilestonesModule.cs:137
#   Rewind-to-Launch initiated to UT          RecordingStore.cs:5651
#   invokerewindtolaunch invoking / refused   TestCommands/ParsekTestCommandAddon.InvokeRewindToLaunch.cs:176 / :103
#   Load classified:                          LoadReconcilePolicy.cs:381 (coldReason save-file :301)
#   Timeline break recorded / not recorded    GameActions/StockShadowTakeBack.cs:335 / :318
#   Loaded take-back facts from '<label>'     GameActions/StockShadowTakeBack.cs:468 (label
#                                             'GAME_STATE/LEDGER', GameActions/Ledger.cs:948)
#   [TakeBack] Took back ... stock paid again for milestone '<id>'
#                                             GameActions/StockShadowTakeBack.cs:514 (Warn at
#                                             GameActions/KspStatePatcher.cs:6052)
#   loadgame start / player-load: firing      TestCommands/ParsekTestCommandAddon.cs:2192 / :2262
#   Save-file load intent armed:              SaveFileLoadIntent.cs:50
#   Save-scoped session state reset: reason=  ParsekScenario.SessionReset.cs:107
#   OnLoad game state from save node:         ParsekScenario.SessionReset.cs:319
#   OnKspLoad recalc decision:                GameActions/LedgerOrchestrator.cs:5197
#   Clock-crossing reached                    GameActions/LedgerOrchestrator.cs:2763
#   PatchFunds: <from> -> <to> (delta=        GameActions/KspStatePatcher.cs:2494
#   GUARDED (UPLIFT|DRAWDOWN) clamped         GameActions/KspStatePatcher.cs:6287-6288
#   filed StockPoolAdjustment                 GameActions/KspStatePatcher.cs:6117
#   ABORTING rewind ledger patch              GameActions/KspStatePatcher.cs:89
#   Recording started: vessel=                FlightRecorder.cs:6826
#   savegame name=<n> folder= saved=true      TestCommands/ParsekTestCommandAddon.cs:2098
#   ground-truth game mode= / result: hardFailures=
#                                             InGameTests/LedgerGroundTruthHarness.cs:125 / :246
#   BATCH_COMPLETE v1                         InGameTests/InGameTestRunner.cs:1219
#
# PRE-REGISTERED READINGS (check these first if the first flight reds):
#   - `evaexit refused reason=kerbal-not-aboard` / no `evaexit start` on F: F rolled out with
#     crew=0 (`launchfromeditor start ... crew=0`); read `Cleared reserved` and
#     `Reservation released: 'Jebediah Kerman'` against F's launch UT (RW-2 measured the
#     release at H's recovery, 186000.2).
#   - `Milestone enriched: 'Kerbin/SurfaceEVA'` with other amounts: the reward differs from
#     RW-2's at UT 185786 (a strategy or multiplier); re-pin it, not a defect by itself.
#   - no `Loaded take-back facts ... breaks=1` after the reload: read the label; a
#     `Ledger file '...'` source with breaks=0 means the cold load read the ledger file of the
#     default slot, not the named save's node (the save's LEDGER node lost the break).
#   - `useCurrentUtCutoff=False ... currentUtReady=False` at the reload: the clock was not
#     ready, the full replay ran, and the forbidden PatchFunds lift is the RW-2 symptom on a
#     cold load (file it with RW-2's todo).
#   - a positive `PatchFunds` between rw3-rewound and rw3-before-crossing: read the
#     `RecalculateAndPatch: actionsTotal=N, actionsAfterCutoff=N, cutoffUT=null` before it.
#   - `Credited milestone 'Kerbin/SurfaceEVA' at UT=1857..`: the walk credited a different
#     row than W (a SurfaceEVA earned after the rewind; nothing in the lane EVAs there).
#   - a `Game state: MilestoneAchieved 'Kerbin/SurfaceEVA'` after rw3-relaunched: prevention
#     missed the reloaded row; then the take-back must name it (`Took back ... milestone
#     'Kerbin/SurfaceEVA' ... already credited by milestone 'Kerbin/SurfaceEVA' at
#     ut=1860..`). Read the `[CommittedMilestones]` and `PatchMilestones:` lines at the
#     crossing.
#   - `invokerewindtolaunch invoking ... startUT=` outside 1858xx: `latest` picked a fixture
#     tree, not H.
#   - recordings 36: something recorded after H (an auto-record setting the reload reset).
#
# STATUS: AUTHORED 2026-10-28 (branch `rw3-save-reload-takeback`), NEVER FLOWN. Every pinned
# literal is derived from source (file:line above), the fixture, and the flown RW-1 / RW-2
# logs of the same H and the same EVA on this host, not from a flight of this lane.
# Owed off the first flight:
#   - the batch split (`total=3` pinned from the source, `passed` / `skipped` regexed;
#     IngameBatchWiringGroupTests.INTERIM_PIN_IDS until then);
#   - which path kept stock from paying the repeat (PatchMilestones at the Space Center
#     crossing, expected, or a `[CommittedMilestones] Apply: marked ... Kerbin/SurfaceEVA`),
#     and W's exact UT;
#   - the crossing lines' batching (the label list is capped at ten, so W's
#     `MilestoneAchievement@` may not print; the walk's Credited line is gated instead);
#   - the end pools (funds expected 157546.18 - 3 x 2932 + 2 x 2932 + 3200 = 157814.18; no
#     ledger oracle block until measured);
#   - the tier call (operator: stock-tree is not in the nightly instance set).
#
# FAST-LANE CHECKLIST: (1) reuse: RW-1's H verbatim, RW-2's unrecorded pad EVA, QL-1's
# player-load LoadGame, RW-1's Space Center crossing warp, L8's flight warp off the rollout
# row; (2) explicit-UT warps only; (3)-(5) no dwell, burn or coast, both EVAs stay on the
# ladder; (6) retry `once`; (7) recordings window 35..35; (8) operator, ~5 min expected
# (RW-1 flew 147 s, RW-2 2m19s of log); (9) flight_efficiency.py after the first green flight.
tier = "operator"
description = "Rewind ledger campaign, a save and a cold reload inside a rewound timeline (plan row 15): on cs-career-mun4 a pad flight is recorded and committed and an unrecorded Flea's pad EVA earns Kerbin's SurfaceEVA world-first; after a Rewind-to-Launch the game is saved and loaded back as the player's load (a cold save-file load) with the timeline break restored from the save's ledger and no pool lifted by the rows still ahead; warping past the committed rows credits the world-first once, a relaunched Flea's EVA repeats it without a second payment (or with the take-back of one), and LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-3", "career", "ledger", "rewind", "rewind-to-launch", "quickload", "cold-load",
        "take-back", "milestone", "eva", "editor", "ground-truth", "ingame-batch",
        "timeline-ops", "reading-run"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 2 x 300 LoadGame + 300 rewind + 3 x (120 GoToEditor + 180
# LaunchFromEditor) + 180 StartRecording + 3 x 120 warps + 120 CommitTree + 2 x 120 Recover
# + 2 x 120 EvaExit + 2 x 240 EvaBoard + 120 warp + 9 x 120 SaveGame + 540 RunTests = 5160;
# runtime 6200 adds the inert steps and FlushAndQuit.
steps = [
  # scene = "spacecenter": the host's three vessels are Mun debris (RW-1's boot).
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  # Clear of the fixture's last rows (185732-185734) and their 60 s rollout window.
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },

  # ---- flight H: recorded on the pad, committed, recovered (RW-1 verbatim) ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "h",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186000" },                                      expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "Recover",        args = { pid = "${h.pid}" },                                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw3-h-committed" },                          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw03-01-after-h-commit" },                   expect = "OK", budget = 120 },

  # ---- the committed future: an unrecorded Flea's pad EVA earns the world-first (W) ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "f",             expect = "OK", budget = 180 },
  { cmd = "MissionMark",    args = { label = "rw3-f-launched" },                           expect = "OK" },
  # No release: the kerbal stays on the hatch ladder; the EVA itself is the world-first.
  { cmd = "EvaExit",                                                                       expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw3-future-eva" },                           expect = "OK" },
  { cmd = "EvaBoard",                                                                      expect = "OK", budget = 240 },
  { cmd = "Recover",        args = { pid = "${f.pid}" },                                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw3-future-recovered" },                     expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw03-02-after-future-eva" },                 expect = "OK", budget = 120 },

  # ---- the rewind to H's launch: one timeline break ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw3-rewound" },                              expect = "OK" },
  # The rewind save carries the settings of H's recording start; asserted so nothing after
  # the rewind records, and so the reload source carries them too.
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw03-03-after-rtl" },                        expect = "OK", budget = 120 },

  # ---- plan row 15: SaveGame, then the player's load of that save (a Cold load) ----
  { cmd = "SaveGame",       args = { name = "rw03-04-reload-source" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw3-saved" },                                expect = "OK" },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "rw03-04-reload-source", scene = "spacecenter", playerLoad = "true" }, expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw3-reloaded" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },          expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw03-05-after-cold-reload" },                expect = "OK", budget = 120 },

  # ---- the crossing at the Space Center: every committed row reached once ----
  { cmd = "SaveGame",       args = { name = "rw03-06-before-crossing" },                  expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw3-before-crossing" },                      expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "186100", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw3-crossed" },                              expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw03-07-after-crossing" },                   expect = "OK", budget = 120 },

  # ---- the repeat: the already-credited world-first again, from an unrecorded Flea ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "r",             expect = "OK", budget = 180 },
  { cmd = "MissionMark",    args = { label = "rw3-relaunched" },                           expect = "OK" },
  { cmd = "EvaExit",                                                                       expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw3-repeated" },                             expect = "OK" },
  { cmd = "EvaBoard",                                                                      expect = "OK", budget = 240 },
  # Off the rollout row (L8's reason), in flight; the ground truth skips at the Space Center.
  { cmd = "WarpToUT",       args = { ut = "186130" },                                      expect = "OK", budget = 120 },
  { cmd = "SaveGame",       args = { name = "rw03-08-after-repeat" },                     expect = "OK", budget = 120 },
  # The DEFAULT slot (persistent): the one a harvest reads; the named slots above are side files.
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["funds", "reputation", "milestones", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 34 recordings plus H (RW-1 and RW-2 measured 35 with the same H); F and the
# repeat Flea are unrecorded, and neither the rewind nor the reload removes one.
count = { min = 35, max = 35 }

[expectations.logContracts]
required = [
  # ---- three Flea launches (H, F, the repeat), each rolled out once; H and F recovered ----
  "\\A(?:[\\s\\S]*?launchfromeditor complete scene=FLIGHT vessel=Jumping Flea pid=[0-9]+ site=LaunchPad situation=PRELAUNCH){3}",
  "\\A(?:[\\s\\S]*?Game state: FundsChanged -2932 \\(VesselRollout\\)){3}",
  "Game state: FundsChanged \\+2932 \\(VesselRecovery\\)[\\s\\S]*?MISSIONMARK label=rw3-h-committed ut=",
  "MISSIONMARK label=rw3-future-eva ut=[\\s\\S]*?Game state: FundsChanged \\+2932 \\(VesselRecovery\\)[\\s\\S]*?MISSIONMARK label=rw3-future-recovered ut=",
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- the committed future: F's pad EVA earns Kerbin/SurfaceEVA, an untagged row (W) ----
  "MISSIONMARK label=rw3-f-launched ut=[\\s\\S]*?evaexit start kerbal=[^\\r\\n]+ fromPid=[0-9]+ release=false[\\s\\S]*?MISSIONMARK label=rw3-future-eva ut=",
  "MISSIONMARK label=rw3-f-launched ut=[\\s\\S]*?Game state: MilestoneAchieved 'Kerbin/SurfaceEVA' \\(awaiting reward enrichment\\)[\\s\\S]*?MISSIONMARK label=rw3-future-eva ut=",
  "MISSIONMARK label=rw3-f-launched ut=[\\s\\S]*?Emit: MilestoneAchieved key='Kerbin/SurfaceEVA' tag='' [\\s\\S]*?MISSIONMARK label=rw3-future-eva ut=",
  "MISSIONMARK label=rw3-f-launched ut=[\\s\\S]*?KSC spending recorded: type=MilestoneAchievement, UT=1860[0-9]{2}\\.[0-9], key=Kerbin/SurfaceEVA[\\s\\S]*?MISSIONMARK label=rw3-future-eva ut=",
  # RW-2 measured this reward for the same node on this host (its KSP.log line 21535).
  "MISSIONMARK label=rw3-f-launched ut=[\\s\\S]*?Milestone enriched: 'Kerbin/SurfaceEVA' funds=3200 rep=1\\.0 sci=0\\.0[\\s\\S]*?MISSIONMARK label=rw3-future-eva ut=",
  "MISSIONMARK label=rw3-future-eva ut=[\\s\\S]*?evaboard complete kerbal=[^\\r\\n]+ boardedPid=[0-9]+[\\s\\S]*?MISSIONMARK label=rw3-future-recovered ut=",

  # ---- the rewind: a plain Rewind-to-Launch onto H's tree, ONE timeline break ----
  "MISSIONMARK label=rw3-future-recovered ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT ",
  "MISSIONMARK label=rw3-future-recovered ut=[\\s\\S]*?Load classified: early=PlainRewind refined=PlainRewind ",
  "invokerewindtolaunch invoking tree=[0-9a-f]{32} rec=[0-9a-f]{32} startUT=1858[0-9]{2}\\.[0-9] - plain Rewind-to-Launch \\(NOT a Re-Fly\\)",
  "MISSIONMARK label=rw3-future-recovered ut=[\\s\\S]*?\\[TakeBack\\] Timeline break recorded: kind=PlainRewind loadedUT=1857[0-9]{2}(?:\\.[0-9]+)? captureHighWater=[0-9]+ breaks=1 [\\s\\S]*?MISSIONMARK label=rw3-rewound ut=",

  # ---- plan row 15: the save, then the player's load of it, a Cold save-file load ----
  "savegame name=rw03-04-reload-source folder=\\S+ saved=true[\\s\\S]*?MISSIONMARK label=rw3-saved ut=",
  "MISSIONMARK label=rw3-saved ut=[\\s\\S]*?loadgame start save=\\S+ name=rw03-04-reload-source scene=SPACECENTER requestedScene=SpaceCenter [^\\r\\n]* playerLoad=true",
  "MISSIONMARK label=rw3-saved ut=[\\s\\S]*?loadgame player-load: firing onGameStatePostLoad save=\\S+ name=rw03-04-reload-source route=\\S+",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=rw03-04-reload-source [\\s\\S]*?\\[LoadPolicy\\] Save-file load intent armed: nodeUT=1857[0-9.]+ scene=SPACECENTER",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=rw03-04-reload-source (?:(?!Load classified: )[\\s\\S])*Load classified: early=Cold refined=Cold scene=SPACECENTER [^\\r\\n]*\\bcoldReason=save-file\\b",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=rw03-04-reload-source [\\s\\S]*?Save-scoped session state reset: reason=save-file [\\s\\S]*?MISSIONMARK label=rw3-reloaded ut=",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=rw03-04-reload-source [\\s\\S]*?OnLoad game state from save node: ledgerRows=[0-9]+ [\\s\\S]*?MISSIONMARK label=rw3-reloaded ut=",
  # THE ROW-15 GATE: the break comes back from the saved LEDGER node (era from the fixture,
  # persistent.sfs:4643; one break, the rewind's).
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=rw03-04-reload-source [\\s\\S]*?\\[TakeBack\\] Loaded take-back facts from '[^'\\r\\n]+': era=177 breaks=1 badBreaks=0[\\s\\S]*?MISSIONMARK label=rw3-reloaded ut=",
  # The reload walks at the clock, so the rows still ahead stay ahead.
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=rw03-04-reload-source [\\s\\S]*?OnKspLoad recalc decision: useCurrentUtCutoff=True maxUT=1857[0-9]{2}(?:\\.[0-9]+)? featureSupportsCutoff=True currentUtReady=True hasFutureActions=True[\\s\\S]*?MISSIONMARK label=rw3-reloaded ut=",

  # ---- the crossing: the rows reached once, W credited by the walk ----
  "MISSIONMARK label=rw3-before-crossing ut=[\\s\\S]*?Clock-crossing reached committed-future rows: crossed=[1-9][0-9]* [\\s\\S]*?MISSIONMARK label=rw3-crossed ut=",
  "MISSIONMARK label=rw3-before-crossing ut=[\\s\\S]*?\\[Milestones\\] Credited milestone 'Kerbin/SurfaceEVA' at UT=1860[0-9]{2}\\.[0-9] \\(recording=null, funds=3200, rep=1, sci=0\\.0\\)[\\s\\S]*?MISSIONMARK label=rw3-crossed ut=",

  # ---- the repeat: the already-credited world-first again, after the crossing ----
  "MISSIONMARK label=rw3-relaunched ut=[\\s\\S]*?evaexit start kerbal=[^\\r\\n]+ fromPid=[0-9]+ release=false[\\s\\S]*?evaexit complete kerbal=[^\\r\\n]+ evaPid=[0-9]+ released=false [\\s\\S]*?MISSIONMARK label=rw3-repeated ut=",
  "MISSIONMARK label=rw3-repeated ut=[\\s\\S]*?evaboard complete kerbal=[^\\r\\n]+ boardedPid=[0-9]+",

  # ---- the step saves (named side slots for after-flight reading) and the default slot ----
  "savegame name=rw03-01-after-h-commit folder=\\S+ saved=true",
  "savegame name=rw03-02-after-future-eva folder=\\S+ saved=true",
  "savegame name=rw03-03-after-rtl folder=\\S+ saved=true",
  "savegame name=rw03-05-after-cold-reload folder=\\S+ saved=true",
  "savegame name=rw03-06-before-crossing folder=\\S+ saved=true",
  "savegame name=rw03-07-after-crossing folder=\\S+ saved=true",
  "savegame name=rw03-08-after-repeat folder=\\S+ saved=true",
  "MISSIONMARK label=rw3-repeated ut=[\\s\\S]*?savegame name=persistent folder=\\S+ saved=true",

  # ---- the ground truth, in FLIGHT on the unrecorded repeat Flea ----
  "ground-truth game mode=CAREER pools=funds,science,reputation",
  "result: hardFailures=0 ",
  # INTERIM: total=3 from the source (the LedgerGroundTruth category's FLIGHT cells); the
  # split is owed off the first flight (RW-1 read passed=3 skipped=0 on this host).
  "BATCH_COMPLETE v1 total=3 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LedgerGroundTruth scene=FLIGHT",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "GUARDED (UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=\\S+ reason=leak ",
  "invokerewindtolaunch refused",
  "loadgame rejected",
  "loadgame failed",
  "savegame refused ",
  "savegame failed ",
  # ---- the break: recorded once, never dropped, carried by every later load ----
  "Timeline break not recorded for load kind=",
  "\\[TakeBack\\] Timeline break recorded: [^\\r\\n]*breaks=[2-9]",
  "Loaded take-back facts from '[^'\\r\\n]*': [^\\r\\n]*badBreaks=[1-9]",
  "MISSIONMARK label=rw3-rewound ut=[\\s\\S]*Loaded take-back facts from '[^'\\r\\n]*': era=\\S+ breaks=0 ",
  # ---- the RW-2 symptom: nothing lifts a pool, and no walk reaches W, while the clock is
  # still before the committed rows (no credit is due in this window) ----
  "MISSIONMARK label=rw3-rewound ut=(?:(?!MISSIONMARK label=rw3-before-crossing )[\\s\\S])*\\[KspStatePatcher\\] PatchFunds: [0-9.]+ -> [0-9.]+ \\(delta=[1-9]",
  "MISSIONMARK label=rw3-rewound ut=(?:(?!MISSIONMARK label=rw3-before-crossing )[\\s\\S])*Credited milestone 'Kerbin/SurfaceEVA' at UT=",
  # ---- paid once: a second stock payment of the world-first must be taken back ----
  "Game state: MilestoneAchieved 'Kerbin/SurfaceEVA'[\\s\\S]*Game state: MilestoneAchieved 'Kerbin/SurfaceEVA'(?![\\s\\S]*\\[TakeBack\\] Took back [^\\r\\n]*stock paid again for milestone 'Kerbin/SurfaceEVA')",
  # A take-back of anything else is a finding (only this identity is repeated).
  "\\[TakeBack\\] Took back (?![^\\r\\n]*stock paid again for milestone 'Kerbin/SurfaceEVA')",
  "Clock-crossing reached committed-future rows: [^\\r\\n]*MilestoneAchievement@[\\s\\S]*Clock-crossing reached committed-future rows: [^\\r\\n]*MilestoneAchievement@",
  # ---- nothing records after H, and no rollout is mistaken for H's ----
  "MISSIONMARK label=rw3-h-committed ut=[\\s\\S]*Recording started: vessel=",
  "OnVesselRolloutSpending: skipping duplicate rollout",
]

