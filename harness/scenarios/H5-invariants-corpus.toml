schema = 1
id = "H5-invariants-corpus"
tier = "daily"
# The in-game RecordingInvariants (M-A3 hook H5) category run over the FULL
# injected synthetic corpus. B10 runs the same category over an EMPTY store (a
# trivial edge-15 pass); this cell instead loads the 274-recording corpus and
# walks it through the M-A1 pure invariant core (RecordingInvariantsHold
# OverLiveStore -> InvariantEvaluator over RecordingStore.CommittedRecordings), so
# a Fail finding on any real recording reds. Two guards: the corpus LOADS INTACT
# (walk-count line) and it is structurally VALID (BATCH failed=0). No live
# recording, so the REC rules are suppressed (injection-seeded run).
description = "Load the full injected synthetic corpus and walk it through the in-game RecordingInvariants (H5) core; corpus loads intact and holds every invariant."
instanceProfile = "stock-minimal"
tags = ["invariants", "analyzer", "H5", "R21", "R22"]

[fixture]
# gloops-airshow SANDBOX pod host (see S0.5). injectedRecordings="all-synthetic"
# seeds the 274-recording corpus that the H5 live-store walk then evaluates.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "all-synthetic"
craft = []

[driver]
kind = "seam"
# Non-live run: no StartRecording and autoRecordOnLaunch pinned false, so
# spec_expects_live_recording is False and REC-001/REC-003 are correctly
# suppressed (the save holds recordings it never recorded live). RunTests is the
# single BATCH owner; its 540 per-step budget is exactly the deferred cap (S8).
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "RecordingInvariants" },          expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# HONEST: loading the 274-recording corpus reads each recording from its .prec
# sidecar and runs the load-time schema-compatibility gate (D16). The run is
# SANDBOX and the H5 category is FLIGHT-scoped (D14). Not claimed: a specific
# invariant-family dimension - the invariant sweep is a structural regression
# guard, not new registry-token coverage; the tokens above are what the DRIVER
# (load + in-flight batch) actually exercises.
D14 = ["sandbox", "scene-flight"]
D16 = ["sidecar-prec", "schema-gate"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# The injected corpus, unchanged (no live recording). Pinned to the same 274 S1.4
# uses on stock-minimal; a load that lost recordings reds. Update alongside corpus
# or profile changes.
count = { min = 274, max = 274 }

[expectations.logContracts]
# The walk counts RECORDINGS, not injected trees: the 274-tree corpus hydrates
# to 308 recordings across 278 walked trees (chain trees contain multiple
# member recordings). The exact "recordings=308 trees=278" pair is the
# HIGH-confidence guard that the full corpus hydrated into the store and was
# walked - the R21/R22 index-integrity family. failed=0 is the invariant-clean
# guard; the first live run (2026-07-19) confirmed fails=0 warns=0 over
# recordings=306 / trees=276, resolving the former PENDING-OPERATOR check.
#
# THAT 306/276 PAIR WAS THE PRE-2026-08-11 CORPUS; the numbers pinned above are the
# corpus THIS commit produces. recorded-signal-fixes grew the corpus by TWO rows
# (the chute-repack showcase + the surface rover drive, both added to
# InjectAllRecordings), so 272/276/306 -> 274/278/308. All three are DERIVED (+2),
# NOT re-measured: run.py's count_recordings counts .prec files,
# ScenarioWriter.WriteSidecarFiles writes one per v3 builder, and each
# AddRecordingAsTree adds exactly one builder / one tree / one recording. The next
# flight of this spec is what confirms it; if it reds on this pin, read the ACTUAL
# pair off the collected KSP.log and re-pin here plus recordings.count above.
#
# If a synthetic recording is deliberately degenerate, quarantine it via
# expectedFail keyed to a todo-doc bug id rather than weakening failed=0. Update
# BOTH numbers here and recordings.count above whenever the corpus changes.
#
# ANTI-VACUITY (hlib.batch_contract_vacuity_gap). The old pin was
# `BATCH_COMPLETE v1 .* failed=0\b`, which a ZERO-EXECUTED batch satisfies
# (`total=2 passed=0 failed=0 skipped=2` has failed=0 too - the B10 defect).
# The tally is now pinned WHOLE. Every number is MEASURED, not derived: the
# 2026-07-19 live run logged exactly
#   BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=RecordingInvariants scene=FLIGHT
# and it agrees with the attributes (RecordingInvariants has exactly 2 tests,
# both Scene = FLIGHT and AllowBatchExecution default-true; the gloops-airshow
# fixture carries a focusable vessel so LoadGame takes the FLIGHT route). If a
# test is added to the category, BOTH numbers move here in the same commit.
required  = ["RecordingInvariants walk: recordings=308 trees=278\\b",
             "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=RecordingInvariants scene=FLIGHT"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

# The raw-Unity-exception scan (hlib.scan_unity_exceptions), armed with a small
# CEILING rather than 0: only n=3 driver-valid readings exist - 4 and 2 in the
# failure population, 0 on the fresh 2026-08-04 run - so the observed max is 4 on
# a THIN sample. 5 is the top of the status doc's short-spec band, chosen because
# a three-reading sample cannot honestly pin a tighter one. Re-pin when n grows.
[expectations.unityExceptions]
maxTotal = 5

[runtime]
# Budget arithmetic (M-A5 S8): runtime 720 >= 300 LoadGame + 540 RunTests ceiling
# headroom (steps normally finish well under their per-step budgets, so the run
# watchdog need not be their sum); RunTests budget 540 == the deferred cap.
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
