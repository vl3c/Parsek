schema = 1
id = "L4-ledger-groundtruth-strict"
# PROMOTED operator -> nightly 2026-08-20, in the SAME commit that pins the
# measurements - the tier discipline L2's B.1 established and 4c wrote down. It
# shipped `operator` for exactly as long as its numbers were PREDICTIONS, and
# they are now measurements off run `2026-08-20_1519`. Nothing operator-shaped
# was ever owed: seam driver, no RequiresFlight verb, no human judgement in the
# loop. `nightly` rather than `daily` is the batch-only shape's home, matching
# L2 next door.
tier = "nightly"
# WHAT THIS IS. The career-ledger lane's B.4 STRICT-PER-IDENTITY scenario: L2's
# ground-truth loop, run against a career that EARNED, with
# `LedgerGroundTruthDiff.StrictPerIdentityForTesting` armed through the
# `RunTests strict=` seam.
#
# WHAT STRICT DOES, stated exactly, because the whole spec follows from it:
# `LedgerDivergenceReport.HardFailures(strict)` promotes EVERY report-only
# divergence to a hard failure - per-subject science, facilities, contracts,
# milestones, roster, tech, kerbal career logs, pid-only recovery matches and
# phantoms alike. It is not a per-facet dial. So on any subject the run's verdict
# is "the reconstruction agrees with KSP's own save on every identity it names",
# and `reportOnly` on a strict run is 0 BY CONSTRUCTION (the promotion empties
# it), which is why the token below pins that half as a derivation rather than a
# measurement.
#
# WHY IT NEEDED A NEW FIXTURE, AND WHY NEITHER CHEAPER SHAPE WORKS. The in-game
# cell (Source/Parsek/InGameTests/LedgerGroundTruthHarness.cs) is
# `Scene = GameScenes.FLIGHT` and carries a live/pending-tree guard, and the two
# obvious shapes each die on one of them:
#
#   (a) ADD A `RunTests strict=true` STEP TO `L3-career-science-recover`, the
#       flight that earns the career. Dead twice over. DURING the mission
#       `autoRecordOnLaunch` is true, so `GameStateRecorder.HasLiveRecorder()` is
#       true and the cell Skips - a green run measuring nothing. AFTER the
#       mission the facets exist but the scene does not: stock recovery DESTROYS
#       the vessel and leaves FLIGHT, so every post-mission seam step runs at
#       SPACECENTER (that spec's own header records the same settle), and a
#       FLIGHT-scene declaration scene-skips.
#   (b) BOOT THE HARVESTED SAVE DIRECTLY. It carries zero `VESSEL` nodes -
#       `C2CareerPostFixReplayTests.FixtureSave_CarriesNoVessel_BecauseTheCraft`
#       `WasRecovered` asserts exactly that - so `LoadGame` routes
#       NoVesselSpaceCenter and the batch scene-skips its only declaration: the
#       vacuity defect B10 and L1-passive-sandbox were re-flown to fix.
#
# So the subject has to be the earned career PLUS a focusable craft, which is
# what `career-earned-pad` is. There is no third seam route: `LoadGame` is the
# only verb that reaches FLIGHT, and it reaches it only through a save that
# already holds a focusable vessel.
description = "Armed: drive the LedgerGroundTruth category with strict per-identity mode against a career that earned flight science and a crewed recovery, and gate that EVERY per-identity facet - not merely the seeded pools - reconstructs to agree with KSP's own save."
instanceProfile = "stock-minimal"
tags = ["ledger", "L4", "ingame-batch", "ground-truth", "strict"]

[fixture]
# `career-earned-pad`: the save harness run `2026-08-19_2130_L3-career-science-`
# `recover` produced (committed as `Source/Parsek.Tests/Fixtures/C2CareerPostFix/`
# and proven to close to zero by `C2CareerPostFixReplayTests`), with ONE
# `type = Ship` PRELAUNCH `VESSEL` spliced into its own FLIGHTSTATE. Built BY
# CONSTRUCTION by `harness/tools/build_career_earned_pad.py`; every post-condition
# and the byte-identity of a fresh rebuild are gated by
# `CareerEarnedPadFixtureDriftTests` in `harness/lib/test_career_earned_pad.py`.
#
# THE FOUR IN-GAME SKIP GUARDS, satisfied and each for a stated reason:
#   1. `HighLogic.CurrentGame != null`  - any driven boot.
#   2. `Mode == Game.Modes.CAREER`      - GAME { Mode = CAREER }, inherited.
#   3. Funding / RnD / Reputation singletons initialized - all three SCENARIO
#      nodes are carried, at the EARNED values (536558 / 111.599998 / 1.99999881).
#   4. no pending tree, no active uncommitted tree, NO LIVE RECORDER - the tree
#      the fixture carries is COMMITTED (no `isActive` key, asserted by the
#      builder), the craft sits at PRELAUNCH, and the SetSetting step below keeps
#      auto-record off. Guard 4 is why that step is mandatory rather than
#      cosmetic: a live recorder makes the cell Skip instead of run.
#
# THE ONE FIXTURE PROPERTY THAT IS PURE STRICT-MODE PLUMBING, recorded here
# because getting it wrong would have produced a red that reads exactly like a
# product defect: the spliced vessel's `pid` and `persistentId` are RE-STAMPED off
# the donor's. The donor craft IS the craft this career flew and RECOVERED, so its
# committed identity (`f77e4207...` / `2905720181`) is byte-identical to both
# recordings' `recordedVesselGuid` / `vesselPersistentId`.
# `LedgerGroundTruthDiff.CompareRecovery` treats a recovery credit whose vessel is
# STILL PRESENT in the save as a divergence - ALWAYS-HARD when guid-corroborated,
# report-only when pid-only, and strict promotes the report-only one anyway. A
# verbatim splice would therefore have red this run on a fixture artifact.
#
# THE SECOND FIXTURE PROPERTY THAT IS PURE GATE PLUMBING, added 2026-08-20: ONE of
# the career's seven `Offered` `CONTRACT` rows is RE-STATED as `Active`, and a
# matching `type = 5` (`ContractAccept`) row is appended to the copied
# `Parsek/GameState/ledger.pgld`. That pair is the D8 `contracts` claim; see the
# block under [dimensionsCovered] for why it cannot be driven, and
# `build_career_earned_pad.py` for the three arithmetic traps it honors.
# WHICH row was re-stated is itself load-bearing: `19e7ba6c...` tests
# `liquidEngine2.v2` (LV-T45) at `sit = LANDED`, and the pad craft carries neither
# that part nor that situation, so the contract cannot resolve during the batch.
# The obvious alternative tests `solidBooster.sm.v2` at `PRELAUNCH` - the part the
# parked craft carries, in the situation it is parked in. This cell measures the
# LIVE career as of its own quicksave, so a contract that resolved mid-batch would
# read `saveActive=0` and red the run on a fixture artifact, the same class of trap
# controls 1 and 2 established from the other direction.
saveTemplate = "fixtures/saves/career-earned-pad"
# LOAD-BEARING. The fixture brings its OWN two recordings (the flown main
# recording plus the post-recovery continuation), which is what the recovery
# credit resolves through; an injection preset would add synthetic ones and move
# `recordings.count` off the fixture's own truth.
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# NO `isolated` ARG, on L2's derivation, which transfers verbatim: the
# LedgerGroundTruth declarations carry `AllowBatchExecution = true`, so the
# ordinary admission filter already admits the same set the isolated filter
# would, and adding the arg would trip
# `CommittedBatchTallySourceSyncTests.test_an_isolated_spec_would_red_if_its_`
# `isolated_arg_were_dropped`.
#
# `strict = "true"` IS THE ARMING, and the spelling is the contract:
# `TestCommandRunTests.TryParseStrictArg` accepts ONLY the lowercase wire
# literals, because the value reaches the wire through `run.py::encode_value` ==
# `str(value)` and a TOML bool would arrive as `strict=True` and be REJECTED. The
# assignment at the call site is unconditional, so the flag is per-scenario rather
# than per-process-sticky.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },          expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" },      expect = "OK" },
  { cmd = "RunTests",   args = { category = "LedgerGroundTruth", strict = "true" },   expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                             expect = "OK" },
]

[dimensionsCovered]
# CLAIMED IN THE ARMING COMMIT (2026-08-20), and the wording of the claim matters
# as much as the list.
#
# WHAT IS CLAIMED, and what BACKS it. `result: hardFailures=0 reportOnly=0
# facetsCompared=10 strict=True` is the whole backing: under strict, `hardFailures`
# counts EVERY per-identity divergence, so a zero there is a positive statement
# about each facet below rather than about the pools alone.
#
#   `science`     `CompareSubjectScience: reconSubjects=3 saveSubjects=3
#                 mismatches=0 phantoms=0` - three flight subjects (crewReport,
#                 mysteryGoo, recovery@KerbinFlew) reconstructed per identity, not
#                 merely summed into the pool. THIS is the facet L2 could not claim:
#                 on career-pad-craft the same compare reads 0 against 0.
#   `milestones`  `CompareMilestones: reconCredited=5 saveCompleted=4 phantoms=0
#                 missing=0` - a two-sided compare in BOTH directions.
#   `funds`       `CompareRecovery: credits=1 hardViolations=0 reportOnly=0
#                 consistent=1` - the vessel-recovery credit resolved to a real
#                 recording and correlated against the save's vessel set.
#
#   `contracts`   `CompareContracts: reconActive=1 saveActive=1 phantoms=0
#                 mismatches=0 missing=0` - ADDED 2026-08-20 with the fixture's
#                 Active-contract splice, and the "1" on each side is the whole
#                 claim. See the block below for why it is fixture-carried.
#
# D8 `ground-truth-harness` is NOT re-claimed: L2 already covers that cell, and the
# LOOP is not what this spec adds.
#
# ---- THE `kerbals` CELL, CLAIMED 2026-08-20 AFTER TWO REFUSALS ------------
# This is the claim L2's header PREDICTED, this spec's first arming DECLINED, and
# the 2026-08-20 re-harvest finally earned. The refusals were right both times and
# the history is kept because it is the whole argument for the claim now:
#
#   L2 predicted a fixture carrying a recorded crewed recovery would flip the P9a
#   cell to passing. This fixture HAS one, and the cell still SKIPPED - because it
#   needs a `GameActionType.KerbalExperience` row specifically, which a recovery
#   did not by itself produce. Prediction falsified, claim declined.
#
#   The reason it did not produce one was a PRODUCT gap, not a fixture thinness:
#   KERBAL-XP-UNTAGGED-RECOVERY-HAS-NO-LEDGER-ROW. The recovery's crew-experience
#   note was observed and then filed against no flight, so it never became a row.
#   Fixed on branch `kerbal-xp-row` and live-proven by run
#   `2026-08-20_1925_L3-career-science-recover_run2`; this spec's subject was
#   re-harvested from that run.
#
# WHAT GATES IT, and each half is a separate witness rather than one fact stated
# twice. The DIFF half is the pinned `CompareKerbalCareerLogs: kerbals=1
# divergent=0` token plus `facetsCompared=11`: the facet SKIPS entirely when the
# reconstruction credits no entries, so a subject that lost the row would drop the
# count to 10 AND lose the token. The RE-ASSERT half is the batch tally's
# `passed=2 skipped=0` - the P9a in-game cell walks the effective ledger's XP rows
# onto the live roster and Skips loudly when there are none, so a `skipped=1` here
# says the row is gone even if the diff somehow still counted.
#
# HONEST NOTE ON THE REGISTRY VALUE: D8 `kerbals` is ALREADY CLAIMED by CL-2,
# L1-hire and L1-dismiss, so this claim does not move `covered` and is not new
# coverage in the tally's sense. It is recorded anyway because those three claim
# the ROSTER LIFECYCLE (hire / dismiss / crew tombstoning) and this one claims the
# CAREER LOG under strict per-identity comparison - a different property of the
# same dimension value, and the dimension has no finer cell to name it with.
#
# ---- THE `contracts` CELL, AND WHY IT IS FIXTURE-CARRIED ------------------
# A DRIVEN accept is not merely expensive here, it is UNREACHABLE. The M-A2
# command seam's `KscAction` has exactly four kinds - ResearchNode,
# UpgradeFacility, HireKerbal, DismissKerbal
# (`Source/Parsek/TestCommands/TestCommandKscAction.cs`) - so no verb accepts a
# contract; and `Contract.Accept()` is a UI-only entry point that Parsek itself
# Harmony-PREFIXES to block (`Source/Parsek/Patches/ContractAcceptPatch.cs`).
#
# THE FIXTURE-CARRIED ROW IS FAITHFUL, and that is measured rather than argued:
# the real hand-played c2 career's ledger carries a `PartTest` accept+complete
# pair whose accept row has NO `recordingId` and originates at KSC. The spliced
# row is that row's shape field for field, minus the completion (which would free
# the contract's slot and put `reconActive` back to 0 - the exact vacuity this
# cell exists to end). `build_career_earned_pad.py` states the three arithmetic
# traps the splice honors - zero advance funds, an unelapsed deadline, and no
# `type = 6` row - and `verify_ledger` asserts all three.
#
# WHAT WAS THERE BEFORE, because "the facet already ran" is the trap: the base
# career carries seven contracts, ALL `Offered`. That is enough to keep
# `CompareContracts` from taking its "save has no contract facet -> skip" exit, so
# the facet has always counted toward `facetsCompared=10` - and not enough to make
# it compare anything, because both sides read 0 and the zero divergences it
# reported were about nothing. The count was honest and the claim would not have
# been, which is why `contracts` was not claimed until now.
D8 = ["science", "milestones", "funds", "contracts", "kerbals"]
D14 = ["career", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING: run.py reads `expectations.allowedAnomalies`, and a
# bare key written after an [expectations.<sub>] header is TOML-scoped to that
# sub-table and silently never read.
allowedAnomalies = []

[expectations.recordings]
# TWO, and they are the FIXTURE's, not this run's: auto-record is off, nothing is
# injected, and the batch writes no recording. Pinned exactly because a different
# number means either the fixture changed or something recorded that should not
# have. The B1 REC-001/REC-003 suppression is selected by
# `hlib.spec_expects_live_recording` (no StartRecording step, no
# autoRecordOnLaunch=true), NOT by this count, so a non-zero pin costs nothing.
count = { min = 2, max = 2 }

[expectations.logContracts]
# ############ MEASURED 2026-08-20, AND ONE OF THE TWO MOVED ############
# The first two lines below are read TOKEN FOR TOKEN out of the collected KSP.log
# of run `2026-08-20_1519_L4-ledger-groundtruth-strict` (PASS attempt 1, 55 s),
# and both came back byte-identical on `_1545` and again on the two contracts-cell
# runs `2026-08-20_1644` and `_1726`. The reading run `2026-08-20_1508` measured a DIFFERENT
# `result:` line, and the difference is the whole story of this arming - see the
# ledger at the bottom. The THIRD line was added 2026-08-20 with the contracts
# splice and first flew on `_1644`; its own note sits beside it. The two runs also re-measured the FACET count: `facetsCompared` did
# NOT move when the contract facet stopped being vacuous, which is the measurement
# proving it was always counted.
#
# THE TALLY. `total=2` was DERIVED before either flight (`hlib.derive_batch_tally`
# over the C# attributes: total 2, scene-skipped 0, batch-skipped 0, executable 2)
# and both flights confirmed it. The split is MEASURED:
#   passed=2   BOTH cells EXECUTING and closing, RE-MEASURED 2026-08-20 on the
#              re-harvested subject (run `2026-08-20_1953`). The split was
#              `passed=1 skipped=1` until then, and the flip is the story:
#
#              The ground-truth cell cleared all six guards, quicksaved the live
#              career, re-parsed that file off disk, ran RecalculateAndPatch over
#              the fixture's 15-action ledger and diffed 11 facets to zero.
#
#              The P9a cell (`KerbalExperienceReassertTest
#              .SurvivingCareerLogEntriesAreOnTheLiveRoster`) USED TO SKIP, with
#              the reason "No KerbalExperience rows in the effective ledger -
#              recover a crewed vessel first, then rerun." L2's header predicted a
#              fixture carrying a recorded crewed recovery would flip it; this
#              fixture HAD one and the cell STILL skipped, because it needs a
#              `GameActionType.KerbalExperience` row specifically and a recovery
#              did not by itself produce one. THAT WAS A PRODUCT GAP, not a
#              fixture thinness - KERBAL-XP-UNTAGGED-RECOVERY-HAS-NO-LEDGER-ROW,
#              fixed on branch `kerbal-xp-row`. The re-harvested subject carries
#              the row, the cell now runs, and it measured
#              `KerbalExperienceReassert: kerbals=1 entries=3 absent=0 missing=0`.
#              `kerbals` is claimed in D8 above as a consequence.
#
#   skipped=0  DERIVED as well as measured: `hlib.derive_batch_tally` over the C#
#              attributes reads total 2, scene-skipped 0, batch-skipped 0,
#              executable 2, so with neither cell taking a runtime Skip the whole
#              category executes. A `skipped=1` here means the XP row left the
#              subject.
#
# THE RESULT LINE, and every token in it does work:
#   `hardFailures=0`     the value the cell's own InGameAssert.IsTrue(hard == 0)
#                        reads, so the pin and the assertion cannot drift apart.
#                        UNDER STRICT this is the strong form: it counts every
#                        per-identity divergence, not just the seeded pools.
#   `reportOnly=0`       a DERIVATION, not a measurement - strict promotes the whole
#                        report-only set, so the residue is 0 by construction. A
#                        non-zero one means `HardFailures` stopped promoting.
#   `facetsCompared=11`  the ANTI-VACUITY half, and FOUR MORE THAN L2's 7 - the
#                        measured difference between a thin subject and a rich one.
#                        RE-MEASURED 2026-08-20 (run `2026-08-20_1953`) after the
#                        re-harvest, which moved it 10 -> 11.
#
#                        THE ENUMERATION IS CORRECTED HERE, because the version
#                        that stood at 10 was WRONG in a way the number could not
#                        show: it read "this career adds the recovery, milestone
#                        and kerbal-career-log facets", and the kerbal-career-log
#                        facet was the one facet NOT being counted -
#                        `CompareKerbalCareerLogs` takes a no-entries exit BEFORE
#                        its `FacetsCompared++` when the reconstruction credits no
#                        career entries, which was exactly this subject's state.
#                        The three the rich subject added over L2 were recovery,
#                        milestone and contract; the kerbal-career-log facet is the
#                        ELEVENTH, and it arrived with the re-harvest that gave the
#                        reconstruction a `KerbalExperience` row to credit.
#
#                        A facet that silently stopped comparing reds here instead
#                        of greening on an emptier loop.
#   `strict=True`        capital T: it is `bool.ToString(InvariantCulture)`, not the
#                        lowercase wire literal. It is BOTH the arming's witness and
#                        the DLL verification - a batch that ran the default diff
#                        cannot emit it, so greening on a stale automation DLL is
#                        impossible.
#
# RE-PIN CONTRACT: a flight that measures different text gets these lines REPLACED
# with the measured ones plus the run id, and the facet count re-derived
# deliberately - never nudged toward what was expected.
# #######################################################################
#
# THE THIRD LINE, added 2026-08-20 with the Active-contract splice. It is the ONLY
# pin here that is a per-facet reading rather than a batch total, and it is pinned
# for a reason the other two do not need: `hardFailures=0` and `facetsCompared=10`
# BOTH held while the contract facet was vacuous (seven Offered rows kept it from
# skipping, and it compared 0 against 0), so neither token can tell an agreeing
# contract identity from an absent one. `reconActive=1 saveActive=1` is what makes
# the D8 `contracts` claim falsifiable: lose the ledger row and it reads
# `reconActive=0`, lose the save's Active state and it reads `saveActive=0`, and
# either way this line stops matching. Read TOKEN FOR TOKEN out of the collected
# KSP.log of runs `2026-08-20_1644` and `2026-08-20_1726` (identical text on both)
# - the format string lives at
# `LedgerGroundTruthDiff.CompareContracts`' tail and its five counters are in that
# order.
#
# THE FOURTH LINE, added 2026-08-20 with the kerbal-XP re-harvest, and pinned for
# the same reason the contracts line was: neither `hardFailures=0` nor the facet
# count can tell an AGREEING kerbal identity from an ABSENT one. `kerbals=1` is
# the anti-vacuity half (the facet compared a real kerbal rather than an empty
# accumulator) and `divergent=0` is the agreement half (every career-log entry the
# reconstruction credits Jebediah is on the save's own roster). Lose the ledger
# row and the line vanishes entirely along with the facet; keep the row but break
# the re-assert and it reads `divergent=1`. Read TOKEN FOR TOKEN out of the
# collected KSP.log of run `2026-08-20_1953`; the format string lives at
# `LedgerGroundTruthDiff.CompareKerbalCareerLogs`' tail.
# RE-DERIVED 2026-09-02, NOT MEASURED: a third LedgerGroundTruth declaration was added
# (`CurrencyTooltipLiveInvariantTest.TooltipsReconcileWithTheLiveBar`, FLIGHT,
# batch-allowed, career-only guards this fixture satisfies), so total=3 passed=3; the
# first flight after this replaces the prediction with the measured line.
required = [
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 reportOnly=0 facetsCompared=11 strict=True",
  "CompareContracts: reconActive=1 saveActive=1 phantoms=0 mismatches=0 missing=0",
  "CompareKerbalCareerLogs: kerbals=1 divergent=0",
]
# The cell reports every facet at Warn (report.Format()), never at Error, so a
# Parsek ERROR line here is a genuine defect signal and not the diff talking.
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

# STILL NO [expectations.ledger] AND NO [expectations.unityExceptions] BLOCK, and
# both are now DECLINED rather than deferred - a different thing from the reading
# run's posture, so it is restated rather than left standing.
#
# unityExceptions: run `2026-08-20_1519` measured `total=0` across all four counted
# classes, so the number is in hand. It is NOT armed because ONE reading is the
# thinner half of the evidence an armed 0 wants, and this spec's gate already
# carries the whole claim: a raw Unity exception during the diff would have to pass
# through `hardFailures=0` to green. The scan runs report-only on every run and
# records the count in `detail.unityExceptions` meanwhile.
#
# ledger: the M-B2 oracle has no report-only mode, and unlike L2's fixture this
# career does NOT reconstruct to exactly its own pools - it closes to float noise
# (science +2.14e-06, reputation +2.36e-07; see `C2CareerPostFixReplayTests`). Both
# residuals sit below `FacetTolerances.Default` AND below the patchers' own 0.01
# restore thresholds, and run `2026-08-20_1519` came out with the produced save at
# the staged values - but an empty-manifest oracle block asserts bit-equality of the
# PRODUCED save against the SEED across a patch-then-restore, and arming that on a
# subject whose reconstruction is deliberately not bit-exact would be arming a
# float-noise tripwire. The gate this spec exists for is the diff, not the pools.

[runtime]
# 720, matching L2's batch-only shape on this instance profile: 300 (LoadGame) +
# 540 (RunTests) exceeds it on paper, but those are per-step ceilings and the
# measured wall for a one-category batch on a career template is ~50-60 s.
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""

# ===========================================================================
# THE ARMING RUN LEDGER (career-ledger wave C, 2026-08-20)
#
# THREE FLIGHTS, TWO DLLs, and the DLL split is the point rather than a footnote:
