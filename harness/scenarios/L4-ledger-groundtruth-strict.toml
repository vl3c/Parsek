#                      EVERYTHING ELSE AGREED, which is what made the diagnosis
#                      cheap: `CompareSubjectScience: reconSubjects=3 saveSubjects=3
#                      mismatches=0 phantoms=0`, `CompareRecovery: credits=1
#                      hardViolations=0 reportOnly=0 consistent=1` (the re-stamp
#                      working exactly as designed), roster / tech / contracts /
