#                      Every verifier PASS or REPORT: driverValidity PASS,
#                      batchComplete PASS `failed=0`, analyzer red=0, logValidate
#                      PASS, anomalySweep `hits=[] counts={}`, unityExceptions
#                      REPORT `total=0`, expectations `mismatches=0`, saveParse
#                      REPORT clean (1 tree, 2 recordings, 527 points), recordings
#                      2 exactly as pinned.
#                      THE FIX MOVED EXACTLY WHAT IT SHOULD AND NOTHING ELSE:
