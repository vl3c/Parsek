schema = 1
id = "CX-5-idle-visit-frees-held-kerbal"
# =====================================================================================
# CX-5: AN IDLE VISIT WHOSE HELD KERBAL STEPS OUT IS KEPT, SO HIS HOLD CLOSES
# (todo CX4-IDLE-DISCARDED-FLIGHT-LEAVES-THE-HOLD-OPEN, owner ruling 2026-10-25).
# AUTHORED 2026-10-25 (branch `claude/project-thread-ssl7ge`). LIVE-PROVEN on its first flight
# `2026-10-25_0937` (DLL sha256 prefix ac9d3ccd): the veto printed from `IsTreeIdleOnPad`
# (the scene exit's check), tree B committed, Jeb released; 12 recordings.
#
# CX-4's flight WITHOUT the flag. CX-4's first flight (`2026-10-24_2336`) measured the
# defect: tree B (a fresh recording of tree A's landed capsule, Jeb steps out and is
# recovered by stock Recover) never moved 30 m, so the scene exit's idle-on-pad rule
# discarded it (`Idle on pad at scene exit - auto-discarding tree`). Stock had already
# recovered Jeb, but the only recordings that could end tree A's open-ended hold on him (the
# GC-6 foreign-recording claim, then his EVA's Recovered row) were the discarded ones, so
# he stayed held for tree A forever. CX-4 was re-cut to plant a flag (the existing veto);
# this lane flies the plain shape.
#
# THE FIX. `ParsekFlight.TreeMovesHeldKerbalForIdle` vetoes the idle-on-pad and pad-failure
# discards of a tree carrying an EVA recording of a kerbal the committed timeline holds
# now (`KerbalsModule.IsReservedNow`), logging `<caller>: not idle - held kerbal '<name>'
# left his vessel on EVA (recording <id>) tree='<name>'`. Tree B then commits at the scene
# exit and CX-4's whole hand-off chain runs: A's hold is bounded at B's start, handed to
# Jeb's EVA, which ends Recovered, and the walk releases him.
#
# THE HOST, THE FLIGHT AND THE GATE are CX-4's (read its header) minus step (2)'s flag:
# (0) boot hygiene, (1) StartRecording on the capsule (tree B), ~10 s at 1x, (2) Jeb's EVA
# release, (3) stock Recover of Jeb (the scene exit commits B), (4) SaveGame + cold reload.
#
# WHY IT DISCRIMINATES. Without the fix the scene exit prints `Idle on pad at scene exit`
# (forbidden), tree B is gone, no foreign-recording bound and no release print, and the
# reload reads Jeb held until INDEFINITE (forbidden). No flag is planted, so the existing
# flag veto cannot be what kept B (`planted flag` is forbidden).
#
# GUESSES (CONFIRMED by the first flight: `IsTreeIdleOnPad`, 12 recordings): which idle predicate logs the veto first (the
# pre-transition `IsActiveTreeIdleOnPad` or the scene exit's `IsTreeIdleOnPad`; the pin
# accepts any caller), and the recordings count (CX-4's window).
#
# FAST-LANE CHECKLIST (harness/README.md): (1) CX-4 flies the flag variant of this shape on
# the same host; this lane is its no-flag twin and cannot share a flight (the flag is the
# variable); (2) one explicit-UT 1x wait; (3)-(5) no burns or coasts; (6) seam-only;
# (7) count window until the first flight pins it; (8) nightly, expected ~3 min.
# =====================================================================================
tier = "nightly"
description = "An idle visit whose held kerbal steps out is kept, so his hold closes: on kerbin-splashdown-recorded, whose committed Kerbal X tree holds Jebediah Kerman open-ended aboard the landed capsule, a fresh recording of the capsule starts a second tree, Jeb steps out (EVA split) and is recovered with the stock Recover button without the capsule moving 30 m and without a flag; the scene exit keeps the flight (the held-kerbal idle veto) instead of discarding it as idle-on-pad, the reservation walk bounds tree A's hold at the new tree's start (the GC-6 foreign-recording claim), hands Jeb through the EVA to his Recovered row, releases him, and after a cold reload never reads him held indefinitely."
instanceProfile = "stock-minimal"
tags = ["CX-5", "CX-4", "GC-6", "idle-on-pad", "crew", "reservation", "cross-tree", "eva", "recover", "scene-exit",
        "kerbin", "sandbox"]

[fixture]
saveTemplate       = "fixtures/saves/kerbin-splashdown-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  # (0) Boot hygiene: drop the resumed clone of tree A (EVA-6's recipe).
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },          expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                                expect = "OK" },
  { cmd = "DiscardTree",                                                                  expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },      expect = "OK" },
  # Keeps the deferred EVA auto-record path (a fresh tree, no split) out of the picture (CI-1).
  { cmd = "SetSetting",     args = { name = "autoRecordOnEva", value = "false" },         expect = "OK" },
  # LOAD-BEARING: the fix line and the hand-off lines are Verbose.
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },           expect = "OK" },
  # The Recover's Space Center load commits the live tree; without autoMerge the verb
  # refuses `dialog-required`.
  { cmd = "SetSetting",     args = { name = "autoMerge", value = "true" },                expect = "OK" },
  { cmd = "MissionMark",    args = { label = "cx5-boot-clean" },                          expect = "OK" },
  # (1) Tree B: a fresh recording of the capsule, Jeb aboard.
  { cmd = "StartRecording",                                                               expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                               expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "1290", maxRate = "1" },                        expect = "OK", budget = 120 },
  # (2) Jeb steps out: the EVA split ends B's root.
  { cmd = "EvaExit",        args = { kerbal = "Jebediah Kerman", release = "true" }, label = "eva", expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                               expect = "OK" },
  { cmd = "MissionMark",    args = { label = "cx5-recover-before" },                      expect = "OK" },
  # (3) Stock Recover of the EVA kerbal: the scene exit commits tree B.
  { cmd = "Recover",        args = { pid = "${eva.evaPid}" },                             expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "cx5-recovered" },                           expect = "OK" },
  # (4) Save, then a cold reload of that save at the Space Center.
  { cmd = "SaveGame",       args = { name = "cx5-after" },                                expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "cx5-before-reload" },                       expect = "OK" },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "cx5-after", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "cx5-reloaded" },                            expect = "OK" },
  { cmd = "FlushAndQuit",                                                                 expect = "OK" },
]

[dimensionsCovered]
# Values only, each already covered elsewhere; no D value names a cross-tree crew hold.
D1  = ["commit-scene-exit", "auto-merge"]
D5  = ["eva-branch"]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc", "warp-1x"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Tree A's 9 plus tree B's 3 (root, ship continuation, Jeb's EVA); 13 allows one optimizer
# split of the EVA. A window until the first flight pins it.
count = { min = 12, max = 13 }

[expectations.recordings.structure]
# Report-only: tree A plus tree B, both committed.
trees          = { min = 2, max = 2 }
committedTrees = { min = 2, max = 2 }
recordings     = { min = 12, max = 13 }

[expectations.logContracts]
required = [
  # (1) Tree B is a fresh single-node tree on the capsule, not a resumed clone of A.
  "startrecording recordingId=[0-9a-f]{32} already=false",
  "Always-tree: created single-node tree id=[0-9a-f]{32}, root=[0-9a-f]{32}, vessel=[^\\r\\n]*?\\(pid=2708531065\\)",

  # (2) The EVA split off the capsule, Jeb the EVA kerbal (GUESS: bgChild is Jeb, CI-1).
  "Tree branch created: type=EVA, bp=[0-9a-f]{32}, activeChild=[0-9a-f]{32} \\(pid=2708531065\\), bgChild=[0-9a-f]{32} \\(pid=[0-9]+\\)[^\\r\\n]*evaCrew=Jebediah Kerman",
  "evaexit complete kerbal=Jebediah Kerman evaPid=[0-9]+ released=true",
  # THE FIX LINE: the idle check reads Jeb's EVA as a held kerbal leaving his vessel and
  # keeps the flight (any of the three idle predicates may print it first).
  "(?:IsTreeIdleOnPad|IsActiveTreeIdleOnPad|IsTreePadFailure): not idle - held kerbal 'Jebediah Kerman' left his vessel on EVA \\(recording [0-9a-f]{32}\\) tree=",

  # (3) The stock Recover of the EVA kerbal, the scene-exit stamp on HIS EVA recording, and
  # the commit. MEASURED `2026-10-24_2336`: `boundRec=(none)` (Jeb stays background-tracked,
  # the foreground recorder idle until a first modification), so the request accepts either;
  # the identity-based stamp is what must land on the EVA recording.
  "(?s)Tree branch created: type=EVA, bp=[0-9a-f]{32}, activeChild=[0-9a-f]{32} \\(pid=2708531065\\), bgChild=([0-9a-f]{32}) \\(pid=([0-9]+)\\)[^\\r\\n]*evaCrew=Jebediah Kerman.*?In-flight recovery requested: vessel='Jebediah Kerman' pid=\\2 guid=[0-9a-f]{32} boundRec=(?:\\1|\\(none\\)) ",
  "(?s)Tree branch created: type=EVA, bp=[0-9a-f]{32}, activeChild=[0-9a-f]{32} \\(pid=2708531065\\), bgChild=([0-9a-f]{32}) \\(pid=([0-9]+)\\)[^\\r\\n]*evaCrew=Jebediah Kerman.*?In-flight recovery: recording '\\1' vessel='Jebediah Kerman' pid=\\2 terminal [A-Za-z<>]+ -> Recovered ",
  "(?s)MISSIONMARK label=cx5-recover-before .*?full-fidelity auto-commit \\(scene-exit[^\\r\\n]*\\): tree='[^']+' recordings=[1-9][0-9]* ",
  "recover complete pid=[0-9]+ vessel=Jebediah Kerman scene=SPACECENTER elapsed=",

  # THE FIX LINE (a). Tree A's hold on Jeb (its root, Aboard) is bounded by tree B's root,
  # which recorded the capsule itself; tree and child tied to the Always-tree line.
  "(?s)Always-tree: created single-node tree id=([0-9a-f]{32}), root=([0-9a-f]{32}), vessel=[^\\r\\n]*?\\(pid=2708531065\\).*?\\[KerbalsModule\\] Reservation bounded by foreign recording of the vessel: 'Jebediah Kerman' recording '28b6e543d67c4d1c9e4763b451c01df5' \\(Aboard\\) endUT=[0-9.]+ tree='\\1' child='\\2' pid=2708531065",

  # (b) B's root hands Jeb to his EVA at the split (GUESS: Unknown, no terminal state), and
  # the EVA reads him Recovered.
  "(?s)Always-tree: created single-node tree id=[0-9a-f]{32}, root=([0-9a-f]{32}), vessel=[^\\r\\n]*?\\(pid=2708531065\\).*?Tree branch created: type=EVA, bp=([0-9a-f]{32}), activeChild=[0-9a-f]{32} \\(pid=2708531065\\), bgChild=([0-9a-f]{32}) .*?Reservation bounded by split handoff: 'Jebediah Kerman' recording '\\1' \\((?:Unknown|Aboard)\\) endUT=[0-9.]+ bp='\\2' child='\\3'",
  "(?s)MISSIONMARK label=cx5-recover-before .*?InferCrewEndState: crew='Jebediah Kerman' terminalState=Recovered -> Recovered",

  # (c) THE OUTCOME. With A's hold handed on, Jeb's hold ends at his recovery and the walk
  # releases him. Before the fix his hold stayed INDEFINITE and this line never printed.
  "(?s)MISSIONMARK label=cx5-recover-before .*?\\[KerbalsModule\\] Reservation released: 'Jebediah Kerman' endUT=[0-9.]+ nowUT=[0-9.]+ \\(the clock has reached the Recovered flight's end - the kerbal is free again\\)",
  # The cold reload's walk re-derives the bounded hold from disk (finite).
  "(?s)MISSIONMARK label=cx5-before-reload .*?\\[KerbalsModule\\] Reservation bounded by foreign recording of the vessel: 'Jebediah Kerman' recording '28b6e543d67c4d1c9e4763b451c01df5' \\(Aboard\\) .*?MISSIONMARK label=cx5-reloaded ",
  "MISSIONMARK label=cx5-reloaded ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "startrecording start-refused",
  "evaexit refused",
  "evaexit timeout",
  # No flag: the existing flag veto must not be what keeps tree B.
  "planted flag",
  # THE DEFECT (CX-4's first flight): tree B discarded as idle-on-pad at the scene exit.
  "Idle on pad at scene exit",
  "Idle on pad detected",
  "Recording discarded - (?:idle on pad|vessel idle on pad|pad failure)",
  "warptout refused",
  "recover rejected",
  "recover error",
  # B must be a fresh tree: a second committed-tree restore after the discard would make B
  # tree A's clone (the same tree), where the foreign-recording claim cannot apply.
  "(?s)MISSIONMARK label=cx5-boot-clean .*?TryRestoreCommittedTreeForSpawnedActiveVessel: restored tree",
  # THE OLD OPEN-HOLD SHAPE. After tree B committed and the save reloaded, no walk reads Jeb
  # held until INDEFINITE (the `Reservation:` line formats infinity through ToString("F1"),
  # `Reservation extended:` through :F1; KB-5 measured `endUT->Infinity`).
  "(?s)MISSIONMARK label=cx5-before-reload .*?\\[KerbalsModule\\] Reservation(?: extended)?: 'Jebediah Kerman' endUT(?:=|->)(?:Infinity|INDEFINITE)",
  # Jeb is never read lost.
  "Death hold: 'Jebediah Kerman'",
  "InferCrewEndState: crew='Jebediah Kerman'[^\\r\\n]*-> Dead",
  # PREMISE: no crew-close row owned by tree A's root. One would mean the recovered vessel
  # continued tree A and closed the hold by the pre-fix path, so the lane would prove nothing.
  "Crew reservation closed by recovery: 'Jebediah Kerman' [^\\r\\n]*recordingId=28b6e543d67c4d1c9e4763b451c01df5",
]

[runtime]
# Two LoadGame steps (300 s each), StartRecording 180, EvaExit 120, WarpToUT
# 120 (~10 s of 1x), Recover 120 (Space Center load + recovery), SaveGame 120, the rest on
# the default.
budgetSeconds = 1500

[retry]
policy = "once"

[expectedFail]
bugId = ""
