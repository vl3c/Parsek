  "(?s)MISSIONMARK label=lab6-away (?:(?!MISSIONMARK).)*?readvesselresources vessel index=0 rec=- found=true pid=2200110055 name='LABX Orbital Lab' loaded=false parts=26 ElectricCharge=1[89][0-9]{2}\\.[0-9]{4}/1900\\.0000",
