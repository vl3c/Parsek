[expectations.logContracts]
required = [
  # The reference recording: the four processes at the live stock values, 50 data, committed.
  "partaction applied button=labprocess pid=2200110055 part='sensorThermometer' [^\\r\\n]*event=OnSendToLab [^\\r\\n]* labRoute=(?:page|review) labValue=5\\.00",
  "partaction applied button=labprocess pid=2200110055 part='GooExperiment' [^\\r\\n]*event=OnSendToLab [^\\r\\n]* labRoute=(?:page|review) labValue=15\\.00",
  "partaction applied button=labprocess pid=2200110055 part='science\\.module' [^\\r\\n]*event=OnSendToLab [^\\r\\n]* labRoute=(?:page|review) labValue=22\\.00",
  "partaction applied button=labprocess pid=2200110055 part='sensorBarometer' [^\\r\\n]*event=OnSendToLab [^\\r\\n]* labRoute=(?:page|review) labValue=8\\.00",
  "committree committed=true",
  "MISSIONMARK label=lab6-reference-1-[0-9a-f]{32} ",
  # ... its end snapshot is the instrument's zero: storedScience 0, 50 data, four subjects.
  "(?s)MISSIONMARK label=lab6-reference-1-[0-9a-f]{32} (?:(?!MISSIONMARK).)*?partaction snapshot rec=[0-9a-f]{32} partId=1270217782 field=storedScience live=0\\.0000 snapshot=0\\.0000 diff=0\\.0000 match=true",
  "(?s)MISSIONMARK label=lab6-reference-1-[0-9a-f]{32} (?:(?!MISSIONMARK).)*?partaction snapshot rec=[0-9a-f]{32} partId=1270217782 field=experiments live=4 snapshot=4 ",
  "(?s)MISSIONMARK label=lab6-reference-1-[0-9a-f]{32} (?:(?!MISSIONMARK).)*?partaction snapshot complete rec=[0-9a-f]{32} parts=1 compared=1 [^\\r\\n]*snapshotMatch=true ",
  # Research on at 1x; b0 about 0.0001, the batteries full.
  "partaction applied button=startconverter pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*event=StartResourceConverter [^\\r\\n]*state='lab:storedScience=0\\.00 dataStored=50\\.00;Research:active=1'",
  "(?s)MISSIONMARK label=lab6-b0 (?:(?!MISSIONMARK).)*?partaction snapshot rec=[0-9a-f]{32} partId=1270217782 field=storedScience live=0\\.000[0-3] snapshot=0\\.0000 ",
  "(?s)MISSIONMARK label=lab6-b0 (?:(?!MISSIONMARK).)*?readvesselresources vessel index=0 rec=- found=true pid=2200110055 name='LABX Orbital Lab' loaded=true parts=26 ElectricCharge=1[89][0-9]{2}\\.[0-9]{4}/1900\\.0000",
