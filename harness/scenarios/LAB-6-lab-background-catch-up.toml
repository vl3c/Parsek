schema = 1
id = "LAB-6-lab-background-catch-up"
tier = "operator"
# THE SCIENCE-LAB PROGRAM, lane LAB-6 (plan `docs/dev/research/lab-test-program-2026-10-17.md`,
# "LAB-6 background lab and switch back"). NEVER FLOWN: its first flight is a READING run, so it
# is `operator` and tagged `pending-flight` until that run pins the measured values.
#
# HOST: `lab-lko-science` (the LAB-2 / LAB-3 host): SCIENCE_SANDBOX, the LABX Orbital Lab (vessel
# persistentId 2200110055) ORBITING Kerbin at about 107 x 92 km, Bob (Scientist, level 0) in the
# Large.Crewed.Lab (part persistentId 1700054019, flightID 1270217782), 1,900 EC in full
# batteries, 8 RTGs. Fixture UT 355.8. The shared-ships overlay gives the save `Settings Probe`.
#
# THE STORY. Research is running when the player leaves the lab for another vessel and lets six
# hours of real time pass, then comes back to it. The lab is unloaded while away, so stock runs
# nothing for it and catches up ONCE when it loads again; Parsek must add nothing (a stock warp
# is not a Parsek jump, so no `Converter jump policy` line may appear). The other vessel is
# `Settings Probe` launched from the VAB (GoToEditor + LaunchFromEditor), the six hours a rails
# `WarpToUT` on the pad, and "coming back" is a save and `LoadGame focusPid=` of the lab (the
# Tracking Station Fly shape, as MINE-8: `SimulateStockSwitchClick` refuses an unloaded target,
# and stock's own far Switch-To is a save plus a scene load too). The OKTO tender was not used:
# its first undock is a PreAttached decouple at about 1 m/s, so over hours it drifts out of the
# 2.5 km physics range and the switch back would face an unloaded target anyway.
#
# THE CATCH-UP IS EC-LIMITED, SO IT IS NOT "THE ELAPSED TIME'S WORTH" (decompiled
# BaseConverter.GetDeltaTime / GetBestDeltaTime, ModuleScienceConverter.PostProcess). On load the
# converter owes `now - lastUpdateTime`, about 21,600 s, but its first catch-up slices are cut to
# what the inputs can pay: 1,900 EC / 5 EC/s = 380 s of research. After ten such frames the rest
# runs with the converter's TimeFactor scaled to the EC that trickles in, which adds nothing
# measurable. So one catch-up raises storedScience by about 0.0048 (380 s x 1.25e-5) and drains
# the batteries to about 0; six hours of production (0.27) never happens, and the "once, not
# twice" question is answered by the EC: a second catch-up of the same absence, on a later load,
# would drain the recharged batteries again.
#
# HOW STORED SCIENCE IS READ AT F4. The inspect line's `storedScience` is F2, and 0.0048 is under
# half a step. The only F4 lab reader is `inspect expectSnapshot=true rec=<id>`, which prints the
# live lab beside a committed recording's END snapshot (`partaction snapshot ... field=
# storedScience live=<F4> snapshot=<F4> diff=<F4>`). So the lane first commits a short REFERENCE
# recording made while processing the experiments (before Research starts, so its end snapshot
# holds storedScience 0.0000 and the F4 `live=` value is the absolute amount), and reads every
# later lab state against it with `tolerance=1` (a WIDE tolerance on purpose: the comparison is
# the instrument, not the gate, and a match keeps the summary at INFO). The recording is a
# measuring tool; it changes nothing the lab does. After the commit, RC-6's StopRecording and a
# DiscardTree leave no live tree, so the exit has no merge to make; every later load of the lab
# re-takes the committed tree (`TryRestoreCommittedTreeForSpawnedActiveVessel ... resumes in
# place`, LAB-3's log) and the same StopRecording + DiscardTree pair drops it again (MINE-12's
# shape), so the committed count stays 1.
#
# EXPECTED VALUES (stock 1.25e-5 science/s at 50 data, LAB-3's measured rate; RTGs 6 EC/s
# against 5 EC/s of research). b0 after about 9 s of research: storedScience 0.0001. While away
# the lab's SAVED charge is unchanged (nothing runs unloaded). b1 after the load and 10 s at 1x:
# storedScience about 0.0049 (window 0.0020 .. 0.0079), dataStored about 49.9990, EC under 300.
# A 2,800 s rails recharge (about 60 s at 50x) refills the batteries (net +1 EC/s) and adds
# 0.035: b2 about 0.0400 (window 0.0350 .. 0.0459), F2 0.04, EC 1,800 or more. Then a second
# save and load: EC within 50 of b2's and F2 storedScience still 0.04 (no second catch-up).
#
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse - LAB-5 flies the same pad route for the
# jumps; a real-time absence and a jump in one flight would make the EC catch-up ambiguous, and
# LAB-7's Space Center stay is a SPAWNED lab's catch-up (a different restore path), so this
# original-vessel catch-up stays its own lane. (2) no idle waits - every wait is an explicit-UT
# WarpToUT; 10 s at 1x after each load covers stock's 1 s post-load hold on converter steps.
# (3) the absence is the plan's six hours at up to 1000x (about 25 s); the recharge is the
# shortest that refills 1,900 EC with margin. (4) no burns. (5) no coast. (6) fail fast - a
# refused verb fails its step; retry `once` until the first flight shows the lane deterministic.
# (7) count window - the one reference recording, pinned {1,1}. (8) tier - operator until the
# reading run; promote by the measured p50 (expected about 5 min). (9) flight_efficiency.py
# after the first green flight.
#
# WHAT A FIRST FLIGHT CAN FALSIFY: the EC-limited catch-up (b1 near 0.0001 means no catch-up ran;
# b1 near 0.27 means stock produced the whole absence, either way the plan's finding 10 is wrong
# and the windows are re-derived); "nothing runs unloaded" (the pad readings of the lab's saved
# charge differ); a second catch-up on the reload (EC drops again, a Parsek finding if the lab's
# saved clock went stale); the reference-recording instrument (its `snapshotMatch=true` and the
# 0.0000 snapshot); the editor route; the restore-and-discard cycle on each load (a count of 2
# means a resumed copy was committed); research still on throughout.
description = "LAB-6: a crewed science lab in low Kerbin orbit is researching when the player leaves it for a probe launched from the pad and lets six hours pass; the unloaded lab produces nothing while away (its saved charge unchanged), catches up exactly once when it is flown again, limited by its stored electric charge to about 0.005 science rather than the six hours' 0.27, keeps researching, and a second save and load of the lab catches up nothing more; Parsek applies no converter jump policy to a stock warp."
instanceProfile = "stock-minimal"
tags = ["science-lab", "science", "converter", "scene-editor", "rails-warp", "LAB-6", "pending-flight"]

[fixture]
saveTemplate = "fixtures/saves/lab-lko-science"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  # 1. The REFERENCE recording: the four experiments processed while recording (50 data),
  #    committed before Research starts, so its end snapshot holds storedScience 0.
  { cmd = "StartRecording",                                                          expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                          expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "sensorThermometer" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "370", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "labprocess", part = "sensorThermometer" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "GooExperiment" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "376", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "labprocess", part = "GooExperiment" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "science.module" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "382", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "labprocess", part = "science.module" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "experiment", part = "sensorBarometer" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "388", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "PartAction",     args = { button = "labprocess", part = "sensorBarometer" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "CommitTree",                                                              expect = "OK", budget = 120 },
  # CommitTree re-takes the committed tree for the still-active vessel; stop it (RC-6) and
  # drop the re-taken copy, so no tree is live when the player leaves.
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c0",             expect = "OK" },
  { cmd = "MissionMark",    args = { label = "lab6-reference-${c0.count}-${c0.rec0}" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab", expectSnapshot = "true", rec = "${c0.rec0}" }, expect = "OK" },
  # 2. Research on at 1x; read the lab at F4 (b0) and the charge (e0).
  { cmd = "MissionMark",    args = { label = "lab6-research-on-before" },            expect = "OK" },
  { cmd = "PartAction",     args = { button = "startconverter", part = "Large.Crewed.Lab" }, expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "397", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "lab6-b0" },                            expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab", expectSnapshot = "true", rec = "${c0.rec0}", tolerance = "1" }, expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge" }, label = "e0", expect = "OK" },
  # 3. Leave the lab for a probe on the pad; six hours of real time pass there.
  { cmd = "MissionMark",    args = { label = "lab6-leaving" },                       expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                       expect = "OK", budget = 120 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Settings Probe" },   expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                                        expect = "OK", budget = 180 },
  { cmd = "MissionMark",    args = { label = "lab6-away" },                          expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge" }, label = "p0", expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "22000", maxRate = "1000" },               expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "lab6-away-warped" },                   expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge", expect = "ElectricCharge:${p0.ElectricCharge}", tolerance = "0.01" }, expect = "OK" },
  # 4. Come back to the lab: it loads and catches up once.
  { cmd = "SaveGame",       args = { name = "lab6-away" },                           expect = "OK", budget = 120 },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "lab6-away", focusPid = "2200110055" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "22010", maxRate = "1" },                  expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "lab6-back" },                          expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab", expectSnapshot = "true", rec = "${c0.rec0}", tolerance = "1" }, expect = "OK" },
  # 5. Research continues loaded and the RTGs refill the batteries (2,800 s, about 60 s at 50x).
  { cmd = "WarpToUT",       args = { ut = "24810", maxRate = "50" },                 expect = "OK", budget = 300 },
  { cmd = "WarpToUT",       args = { ut = "24820", maxRate = "1" },                  expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "lab6-recharged" },                     expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge" }, label = "e2", expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab", expectSnapshot = "true", rec = "${c0.rec0}", tolerance = "1" }, expect = "OK" },
  # 6. A second save and load of the lab: no second catch-up.
  { cmd = "SaveGame",       args = { name = "lab6-back" },                           expect = "OK", budget = 120 },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "lab6-back", focusPid = "2200110055" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "24830", maxRate = "1" },                  expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "lab6-reloaded" },                      expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2200110055", resources = "ElectricCharge", expect = "ElectricCharge:${e2.ElectricCharge}", tolerance = "50" }, expect = "OK" },
  { cmd = "PartAction",     args = { button = "inspect", part = "Large.Crewed.Lab", expectSnapshot = "true", rec = "${c0.rec0}", tolerance = "1" }, expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c1",             expect = "OK" },
  { cmd = "MissionMark",    args = { label = "lab6-done-${c1.count}" },              expect = "OK" },
  { cmd = "SaveGame",                                                                expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                            expect = "OK" },
]

[dimensionsCovered]
