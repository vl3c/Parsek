schema = 1
id = "B4-reentry-splashdown"
# nightly: fixture committed (shares b2-lko-craft with B2) and flown missions
# are too long for daily. LIVE-PROVEN 2026-07-20: the full cycle PASSed (ascent,
# ~350s retrograde flip, aligned deorbit burn, stage drop, exo warp hops, chute
# at 2950m (pre-2026-09-24 profile), splashdown; flakedThenPassed).
tier = "nightly"
description = "Full flight cycle: MechJeb ascent to LKO, retrograde deorbit burn, staged reentry, chute splashdown INTACT; assert orbit reached + landed situation + the OBSERVED canopy (craftCanopyObserved reads the live ParachuteState, never the deploy command)."
instanceProfile = "stock-minimal"
tags = ["B4", "flown", "mechjeb", "reentry"]

[fixture]
# Same pre-placed Kerbal X fixture as B2 (committed 2026-07-19): the ascent half
# is byte-for-byte the B2 mission path; only the post-ORBIT phases are new.
saveTemplate       = "fixtures/saves/b2-lko-craft"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "b4_reentry"

# `steps` MUST stay in the [driver] table, so it is declared ABOVE the
# [driver.missionParams] header (a key after the sub-table header would be scoped
# to driver.missionParams.steps and the spec would validate as having zero steps).
# Budget arithmetic (design invariant, re-sized to the LIVE-MEASURED flight):
# missionBudget 1900 (WALL) >= 30 connect + ascent ~250 + circularize ~100 +
# deorbit ~350 flip + burn (the pod reaction wheel turns the fuel-heavy orbiter
# at ~0.5 deg/s, measured 2026-07-20) + reentry (exo-only rails hops above 70km;
# real-time below; ~1,040 s of mission wall to the 3 km mark, measured
# 2026-09-24_1727) + the chute descent from the 12 km arm altitude + margin.
# Phase budgets in missionParams are GAME time (deorbit 600); runtime 2300 >= 240
# LoadGame + 1900 mission + margin.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 1900 },
  { cmd = "CommitTree",                                          expect = "OK" },
  { cmd = "FlushAndQuit",                                        expect = "OK" },
]

# Ascent half = B2's proven tolerances verbatim; deorbit/reentry half all
# thresholds / budgets (validated against b4_reentry.schema.toml), never a
# golden trajectory. Phase timeouts are GAME seconds (rails hops advance them
# fast; reentryTimeoutSeconds is sized for a worst-case near-full-orbit coast).
[driver.missionParams]
targetApoapsisMeters      = 80000
targetPeriapsisMeters     = 80000
apoErrorMeters            = 5000
periErrorMeters           = 5000
ascentTimeoutSeconds      = 420
circularizeTimeoutSeconds = 300
deorbitPeriapsisMeters    = 25000
retroSettleSeconds        = 10
warpAboveAltMeters        = 70000
warpHopSeconds            = 120
# 12000, not 3000 (2026-09-24). This is the ARM altitude, and the fixture's
# parachuteLarge persists `automateSafeDeploy = 0` (open only while SAFE), so an
# armed chute simply WAITS until the descent is slow enough and then semi-deploys by
# itself; the full canopy follows at the module's own deployAltitude (1000 m).
# Arming at 3000 m was B1's inert-chute trap: run 2026-09-24_1727 armed at 2,951 m
# at -368 m/s and the chute read Armed all the way to impact. The craftCanopyObserved
# assertion reads the OBSERVED ParachuteState, so a chute that never opens reds.
chuteDeployAltMeters      = 12000
# Drop the Mainsail core, fire the Poodle stage at zero throttle, drop the Poodle
# stack: the pod reenters alone with its heat shield. Each activation waits
# stageSettleSeconds (default 2) after the throttle cut / the previous one.
reentryStageCount         = 3
# 600, not 300: the pod reaction wheel flips the whole fuel-heavy orbiter
# at ~0.5 deg/s (live 2026-07-20: 175 deg to go = ~340s of game time before
# the attitude gate opens), plus the burn itself.
deorbitTimeoutSeconds     = 600
reentryTimeoutSeconds     = 3600
# 900, not 600: the chute now arms at 12 km and the descent under canopy runs at
# 1x (no warp below 70 km).
descentTimeoutSeconds     = 900
landedSituations          = ["LANDED", "SPLASHED"]

# Coverage: the registry (harness/coverage/registry.toml) has no dedicated
# reentry/splashdown recording value; nearest existing cells are cited instead:
# D4 atmospheric (the reentry aero phase + launch) / exo-propulsive (ascent +
# deorbit burns) / exo-ballistic (the post-burn coast), and D14 warp-rails (the
# machine-issued warp_to hops record under rails warp). Gap noted in the todo
# doc's B4 section.
[dimensionsCovered]
D1  = ["auto-record-launch"]
# D3 parent-anchored-debris: gated by the debris-child-creation token below.
# The claim is sound because both creation sites CALL
# Recording.ApplyParentAnchorContract unconditionally - for debris and controlled
# children alike (ParsekFlight.cs:7166) - and the helper's only REACHABLE no-op
# is an empty parent id (Recording.cs:1193 also guards `child == null`, which
# cannot happen: the child was `new`'d one statement earlier). An empty parent id
# cannot occur at either call site either - ProcessBreakupEvent returns at
# ParsekFlight.cs:7446 when the active recording id is null/empty, and the BG
# site passes the continuation-or-parent id. So "a debris child recording was
# created" implies "parent-anchored" on these paths. Claimed here and not before
# because presence had no gate at all: the count window's old min of 1 admitted
# the total loss of the population.
# NOTE the token gates CREATION, not the anchor RESOLVING correctly at playback;
# the analyzer's INV rules own malformation, this owns absence.
D3  = ["orbital-checkpoint", "parent-anchored-debris"]
D4  = ["atmospheric", "exo-propulsive", "exo-ballistic"]
D14 = ["kerbin", "warp-rails"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# Main ascent recording + up to 6 dropped Kerbal X boosters recorded as
# parent-anchored debris children (exactly 7 sidecars on the live B2 flight
# 2026-07-20) + 1 LES-tower margin (unestablished under MechJeb autostage, same
# WATCH-4 rationale as B2's max 8) + 1 for the deorbited service stage B4 stages
# off before reentry.
#
# MIN 1 -> 8 (autotest-roadmap R1, raised from 7 on review). B4 drives
# `mlib.b4_decide`, which does NOT reach `_b5_flameout_stage` - but the flameout
# watchdog is not the only thing that drops a recorded stage. `b4_decide` has
# TWO `ACTION_ACTIVATE_STAGE` sites: launch ignition, and the reentryStageCount
# (3) activations the SOLE transition out of B4_DEORBIT leaves OWED
# (`stages_owed`) and REENTRY pays stageSettleSeconds apart: drop the Mainsail
# core, fire the Poodle stage at zero throttle, drop the Poodle stack. REENTRY
# runs nothing else while one is owed, so no path reaches SPLASHDOWN without all
# three. And `run.py` evaluates expectations only for a driver-valid,
# non-short-circuited run (`if driver_valid and not short_circuited`), and a
# driver-valid B4 run ends in SPLASHDOWN. Every run this window ever judges has
# therefore dropped both stacks, making the judged population
# 1 root + 6 boosters + the core + the Poodle stack = 9.
# MIN 8 -> 9 (2026-09-24), MEASURED: run 2026-09-24_1820_B4-reentry-splashdown
# (verdict PASS) carries
# `verifiers.expectations.observed.recordings.count = 9`. Until 2026-09-24 the
# flight dropped only the core (population 8) and reentered with the Poodle stack
# still on the pod, which is why its chute could not open (known-gate 7). Both
# dropped stacks are well past `ShouldRecordDebris` (>= 3 parts OR >= 0.5 t).
# The first cut floored this at 7 on the grounds that the service stage is
# "additional, not part of the floor". That was wrong in the direction this whole
# change exists to close: it left the exact one-below-population value B11/B12
# record as considered-and-rejected. It was also inconsistent - B6 was raised to
# 8 on an inference from a CONDITIONAL watchdog, while B4 was left at 7 despite
# an UNCONDITIONAL commanded action in its own decide function.
# MEASURED 2026-07-27, and the measurement CONFIRMS the derivation above: run
# 2026-07-25_0828_B4-reentry-splashdown (verdict PASS) carries
# `verifiers.expectations.observed.recordings.count = 8`. That field only exists
# on runs after 72cf344fb (2026-07-25 06:48), which is why the structural
# argument had to stand alone when this floor was first written.
# DO NOT re-derive this count from an archived `logs/*_B4-*/` folder. run.py
# collects logs on NON-PASS only (run.py:2324), so all eight archived B4 folders
# are INVALID runs, and run.py evaluates expectations only
# `if driver_valid and not short_circuited` - an INVALID run's count is SKIPPED,
# never judged. Counting `.prec` sidecars in those folders yields 7, because
# they aborted before the deorbit stage was judged: all eight logs show exactly
# six `alive=True` debris children (the ascent boosters, 1 root + 6 = the 7), and
# the late deorbit-era children that four of the eight also logged are all
# `alive=False` and never became sidecars. Reading that 7 as a contradiction of
# this floor and lowering it would re-open the exact one-below-population hole
# B11/B12 reject.
# Never widen back toward 1.
count = { min = 9, max = 10 }

[expectations.logContracts]
# POPULATION gate: the count window cannot be one (it is COMMIT-BLIND, and a
# window wide enough to absorb staging variance is also wide enough to absorb a
# missing population).
#
# THE TOKEN IS THE FOREGROUND CREATION SITE, and the evidence is a log grep.
# Two debris-child creation sites are reachable on this profile, and which one
# fires depends on whether the parent was FOREGROUND or BACKGROUND at the split.
# (A third exists - the parent-continuation debris recording at
# BackgroundRecorder.cs:638, logging `Parent continuation is debris, TTL set:` -
# but it needs a background split of a Generation-0 debris parent, which
# `ShouldSkipForCascadeCap` refuses at Generation >= 1 with
# MaxRecordingGeneration = 1. It cannot fire here. Stated because an earlier
# draft's error WAS an absolute enumeration asserted from a grep;
# Source/Parsek.Tests/DebrisParentAnchorContractTests.cs is the maintained list.)
#   - foreground (this profile): ParsekFlight.ProcessBreakupEvent ->
#     CreateBreakupChildRecording, logging `ProcessBreakupEvent: debris child
#     created` (Info, tag Coalescer, ParsekFlight.cs:7668; the pattern stops
#     before `: pid=` deliberately, so a message-format tweak cannot red it).
#   - background: BackgroundRecorder.RegisterChildRecordingsFromSplit, logging
#     `Child recording created (debris, TTL=60s):` (Info, BackgroundRecorder.cs:1177).
# The Kerbal X sheds its boosters while it is the ACTIVE focused vessel, and
# RecordingTree.IsBackgroundMapEligible excludes `rec.RecordingId ==
# ActiveRecordingId`, so OnBackgroundPartJointBreak early-returns and the
# BACKGROUND line is never reached on this profile.
#
# An earlier cut accepted EITHER site, because that trace was argued from source
# and never confirmed against a log. GREPPED 2026-07-27 over every archived
# B-lane KSP.log under `logs/` (60 folders: B2 10, B4 8, B5 27, B6 6, B7 9). The
# foreground token appears in 58 of the 60. The substring `Child recording
# created` - deliberately broader than the background token, so it would also
# catch the CONTROLLED sibling line at BackgroundRecorder.cs:1185 - appears in
# ZERO of the 60. The two logs without the foreground token are
# 2026-07-20_{1846,1854}_B2-lko-ascent, both INVALID runs that produced no
# recordings at all. A green ascent emits it exactly 6 times, once per booster,
# in three pairs (2026-07-20_1938_B2-lko-ascent: UT 48.48, 64.12, 83.16).
# The alternation is therefore gone and the gate no longer bets on the path. If
# a future profile genuinely backgrounds the parent before the split, THIS token
# reds and the red is the finding: re-derive it against a log, do not widen it
# back to an alternation on the assumption that the red is spurious.
# Both debris sites are ParsekLog.Info.
#
# THE TWO PART-EVENT TOKENS ARE THE PARSEK-SIDE PROOF OF THE CANOPY (known-gate 7,
# armed 2026-09-24). The mission's craftCanopyObserved row proves KSP opened the
# chute (observed ParachuteState, never the deploy command); these prove PARSEK
# RECORDED it as the two-phase ParachuteSemiDeployed -> ParachuteDeployed pair on
# the pod's parachuteLarge. Measured on reading run 2026-09-24_1820: SemiDeployed
# at about 11 km, Deployed at the module's 1000 m deployAltitude, splashdown at
# -8.4 m/s; ARMED on run 2026-09-24_1842 (PASS attempt 1, both tokens matched,
# count 9). They are emitted at Verbose. Unlike B1 this spec does NOT pin
# verboseLogging with a SetSetting step: DebrisPopulationGateTests forbids one on
# the debris-gated specs so the Info-level debris token can never come to depend on
# it. ParsekSettings defaults verboseLogging true (the reading run logged both lines
# with no step), and if the setting ever drifted off these two tokens would RED - a
# fail-closed direction, never a silent pass. The part-name prefix stops before the
# closing quote like B1's. Both would have FAILED every B4 flight on the old profile
# (2026-09-24_1727 + _a2: the chute read Armed to impact).
required  = ["Recording started",
             "ProcessBreakupEvent: debris child created",
             "Part event: ParachuteSemiDeployed 'parachuteLarge",
             "Part event: ParachuteDeployed 'parachuteLarge",
             "Recording stopped"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 2300

[retry]
policy = "once"

[expectedFail]
bugId = ""
