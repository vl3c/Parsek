count = { min = 2, max = 8 }

# REPORT-ONLY until a reading run. Predicted: one tree committed once (the F9 detached
# the in-flight commit, the exit re-committed), both stages Landed, the abandoned EVA
# branch point pruned, no rewind bookkeeping.
[expectations.recordings.structure]
gating         = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 2, max = 8 }
terminalStates = { Landed = { min = 2 }, SubOrbital = { max = 0 } }
branchPoints   = { JointBreak = { min = 1 }, EVA = { max = 0 } }

[expectations.rewind]
gating        = false
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.logContracts]
required = [
  # GROUP 1 - THE FLIGHT, THE SPLIT AND THE F5 (QL-4's tokens).
  "Recording started",
  "ProcessBreakupEvent: controlled child created: pid=[0-9]+",
  "savegame name=quicksave folder=.+ saved=true",
  "warptout complete",

  # GROUP 2 - THE REWARD AFTER THE F5, BOOKED TO THE FLIGHT AT THE IN-FLIGHT COMMIT.
  # The EVA (TestCommandEvaExit's completion line).
  "evaexit complete kerbal=Valentina Kerman evaPid=[0-9]+ released=true",
  # Stock completes the node (GameStateRecorder.RegisterPendingMilestoneEvent's Info line),
  # after the F5 and before the F9, and pays the funds into KSP's pool (OnFundsChanged).
  "savegame name=quicksave folder=.+ saved=true[\\s\\S]*Game state: MilestoneAchieved 'Kerbin/SurfaceEVA' \\(awaiting reward enrichment\\)[\\s\\S]*Game state: FundsChanged \\+[1-9][0-9]* \\(Progression\\)[\\s\\S]*loadgame start save=\\S+ name=quicksave ",
  # The AwardProgress postfix's enrichment: a funds reward (1600 on EVA-5's sandbox run).
  "Milestone enriched: 'Kerbin/SurfaceEVA' funds=[1-9][0-9]* rep=",
  # The in-flight commit (CommitTreeFlight, F1), after the warp (it stops one tick short).
  "CommitTreeFlight: starting tree commit at UT=(149|1[5-9][0-9]|[2-9][0-9]{2})\\.[0-9]",
  "committree committed=true",
  # The commit's recalc credits the milestone to a recording at the EVA's UT
  # (MilestonesModule.ProcessAction) and FundsModule counts its funds, both before the F9.
  "Credited milestone 'Kerbin/SurfaceEVA' at UT=(?:149|1[5-9][0-9])\\.[0-9] \\(recording=[0-9a-f]{32}, funds=[1-9][0-9]*, [\\s\\S]*loadgame start save=\\S+ name=quicksave ",
  "Milestone funds: \\+[1-9][0-9.]*, actionId=\\S+, milestoneId=Kerbin/SurfaceEVA, recordingId=[0-9a-f]{32}, [\\s\\S]*loadgame start save=\\S+ name=quicksave ",
  # The abandoned future's booster ending: committed while still under canopy.
  "FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='GS1 Auto-Chute Booster Probe' points=[1-9][0-9]* orbitSegs=0 terminal=SubOrbital",

  # GROUP 3 - THE F9 REACHES THE QUICKLOAD RESUME (QL-4's route).
  "loadgame start save=\\S+ name=quicksave scene=FLIGHT requestedScene=Unspecified allowLiveRecorder=\\(none\\) recorderLive=false",
  "Load classified: early=InSession refined=QuickloadFlight scene=FLIGHT initialLoadDone=true rewinding=false reFlyInvoke=false discardReFly=none",
  "\\[Scenario\\] Quickload committed-copy restore: tree='GS1 Auto-Chute Booster' id=\\S+ route=in-flight action=ResumeFromQuicksave reason=committed-after-quicksave ",
  # The committed copy's EVA children reach the loaded tree (spliced) before the detach.
  "SpliceMissingCommittedRecordings: tree 'GS1 Auto-Chute Booster' \\(id=\\S+\\) loadedBefore=[0-9]+ committed=[0-9]+ after=[0-9]+ splicedRecordings=[0-9]+ refreshedRecordings=[1-9][0-9]* ",
  "TryRestoreActiveTreeNode: removed committed tree 'GS1 Auto-Chute Booster' \\(id=\\S+, [1-9][0-9]* recording\\(s\\)\\)",
  "OnLoad: pending-Limbo tree 'GS1 Auto-Chute Booster' deferred to OnFlightReady for quickload-resume",
  # The resume trim prunes the abandoned EVA branch: its children and its branch point.
  "Quickload tree trim: tree='GS1 Auto-Chute Booster' cutoffUT=[0-9.]+ trimmedRecordings=[0-9]+/[0-9]+ prunedFutureRecordings=[1-9][0-9]* prunedBranchPoints=[1-9][0-9]* ",
  "Quickload resume prep: activeRec='[0-9a-f]{32}' cutoffUT=[0-9.]+ preTrimEndUT=[0-9.]+ trimScope=TreeWide",
  "RestoreActiveTreeFromPending: resumed recording tree 'GS1 Auto-Chute Booster' activeRec='[0-9a-f]{32}'",

  # =================================================================================
  # THE GATE - THE ABANDONED REWARD IS PURGED AND RETIRED
  # (ParsekScenario.TrimAndReconcileForQuickloadResume, ParsekScenario.Trim.cs):
  #   `[Scenario] Quickload abandoned-future reconcile: tree='<n>' kind=<LoadKind>
  #   scope=<scope> cutoffUT=<R> loadedUT=<R> trimmed=N pruned=N endStatesCleared=N
  #   eventsPurged=N ledgerRowsRetired=N (afterCutoff=N kerbalAssignment=N
  #   prunedRecording=N) skippedCommitted=N skippedQuicksaveHistory=N ... quicksaveFacts=..`
  # (PR #2049 appends ` mergeStatesReset=N`; every field is read through a lookahead and
  # nothing anchors at the line end.) Pinned: an in-flight F9 (QuickloadFlight, TreeWide),
  # the EVA branch pruned (pruned >= 1), the booster's ending cleared (endStatesCleared
  # >= 1), the TAGGED events purged (eventsPurged >= 1: the sandbox QL-4 family read 0,
  # and QL-2's payout is captured untagged at the Space Center, so this is TA-2's first
  # live purge), and the milestone row retired AS AFTER-CUTOFF (the sandbox lanes read
  # afterCutoff=0), nothing skipped as still committed.
  "\\[Scenario\\] Quickload abandoned-future reconcile: tree='GS1 Auto-Chute Booster' (?=.*\\bkind=QuickloadFlight\\b)(?=.*\\bscope=TreeWide\\b)(?=.*\\bpruned=[1-9][0-9]*\\b)(?=.*\\bendStatesCleared=[1-9][0-9]*\\b)(?=.*\\beventsPurged=[1-9][0-9]*\\b)(?=.*\\bledgerRowsRetired=[1-9][0-9]* \\(afterCutoff=[1-9][0-9]* )(?=.*\\bskippedCommitted=0\\b)",
  # GameStateStore.PurgeEventsForRecordingAfterUT (the pod's events after the cutoff) or,
  # if a split re-tagged them, PurgeEventsForRecordings (a pruned recording's).
  "PurgeEventsForRecording(?:AfterUT \\(quickload-abandoned-future\\): rec=[0-9a-f]{32} cutoffUT=\\S+ live=(?:[1-9][0-9]*, milestone=[0-9]+|0, milestone=[1-9])|s \\(quickload-abandoned-future\\): live=[1-9])",
  "RetireAbandonedFutureActions: removed [1-9][0-9]* action\\(s\\) reason=quickload-abandoned-future total=[0-9]+",
  # The booster's leaked SubOrbital is the ending cleared (QL-4's per-recording line).
  "Quickload abandoned-future end state cleared: rec=[0-9a-f]{32} previousTerminal=SubOrbital preTrimEndUT=\\S+",
  # THE CONTROL that makes the forbidden walk tokens below mean something: the ledger IS
  # walked after the retire (the reconcile's own recalc and the exit commit's), and the
  # walk still credits the pre-F5 FirstLaunch milestone of the same pod recording.
  "RetireAbandonedFutureActions: removed [1-9][0-9]* action\\(s\\) reason=quickload-abandoned-future[\\s\\S]*Credited milestone 'FirstLaunch' at UT=[0-9.]+ \\(recording=[0-9a-f]{32}, ",
  # END GATE
  # =================================================================================

  # GROUP 4 - THE BOOSTER IS RECORDED AGAIN (QL-4's tokens).
  "RestoreActiveTreeFromPending: attached BackgroundRecorder for tree 'GS1 Auto-Chute Booster' \\([1-9][0-9]* background entry\\(ies\\)\\)",
  # Exactly the booster: the abandoned EVA kerbal is not in the resumed tree's map.
  "listhandles kind=active count=1 truncated=false",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='GS1 Auto-Chute Booster Probe' points=[1-9][0-9]* orbitSegs=0 terminal=Landed maxDist=[0-9]+m snapshot=True leaf=True",
  "exittospacecenter start scene=FLIGHT autoMerge=true hasActiveTree=true hasPendingTree=false",
  "Silent full-fidelity auto-commit \\(scene-exit\\): tree='GS1 Auto-Chute Booster' recordings=[1-9][0-9]*",
  "exittospacecenter complete scene=SPACECENTER game-loaded=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The F9 must reach the resume (QL-4 / QL-4b's defect shapes).
  "dropped entire tree 'GS1 Auto-Chute Booster'",
  "TryRestoreActiveTreeNode: skipped active tree 'GS1 Auto-Chute Booster'",
  "Quickload resume prep skipped",
  "Quickload committed-copy restore: tree='GS1 Auto-Chute Booster' id=\\S+ route=\\S+ action=Unchanged",
  "keeping in-memory pending tree 'GS1 Auto-Chute Booster'",
  "Quickload abandoned-future reconcile skipped: tree='GS1 Auto-Chute Booster'",
  # THE BOOSTER LEAK, three ways (QL-4's pre-fix readings).
  "RestoreActiveTreeFromPending: attached BackgroundRecorder for tree 'GS1 Auto-Chute Booster' \\(0 background entry\\(ies\\)\\)",
  "listhandles kind=active count=0 truncated=false",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='GS1 Auto-Chute Booster Probe' points=[0-9]+ orbitSegs=0 terminal=SubOrbital",
  # THE ABANDONED EVA MUST NOT REACH THE REPLAY: no kerbal recording at the final commit.
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*FinalizeTreeRecordings: rec='[0-9a-f]{32}' vessel='Valentina Kerman'",
  # THE REWARD MUST NOT BE PAID AGAIN. From the retire on, no walk credits the milestone
  # or counts its funds (the walk lines between the F9 and the retire still read the old
  # ledger, so these anchor on the retire line, which precedes the reconcile's recalc).
  "RetireAbandonedFutureActions: removed [0-9]+ action\\(s\\) reason=quickload-abandoned-future[\\s\\S]*Credited milestone 'Kerbin/SurfaceEVA'",
  "RetireAbandonedFutureActions: removed [0-9]+ action\\(s\\) reason=quickload-abandoned-future[\\s\\S]*Milestone funds: \\+[0-9.]+, actionId=\\S+, milestoneId=Kerbin/SurfaceEVA,",
  "RetireAbandonedFutureActions: removed [0-9]+ action\\(s\\) reason=quickload-abandoned-future[\\s\\S]*GUARDED (?:UPLIFT|DRAWDOWN) clamped resource=Funds",
  # After the F9 nothing books the milestone again, re-marks the stock node, or lifts the
  # funds pool off the quicksave's (a positive delta is the abandoned reward paid).
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*Game state: MilestoneAchieved 'Kerbin/SurfaceEVA'",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*PatchMilestones: set achieved 'Kerbin/SurfaceEVA'",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*PatchFunds: [0-9.]+ -> [0-9.]+ \\(delta=[0-9]",
]

[runtime]
# QL-4's budget: two LoadGame, the ~120 s hop, two phys-ladder warps (~20 s and ~145 s
# measured on QL-4), the EVA, the exit; the inert steps answer in about a frame each.
budgetSeconds = 3600

[retry]
policy = "once"

[expectedFail]
bugId = ""
