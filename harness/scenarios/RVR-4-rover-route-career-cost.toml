# `harness/tools/build_rover_route_career.py` - no harvest, no forge flight, no operator
# session. What it adds over `rover-route-recorded`, and nothing else:
#   * GAME `Mode = CAREER` (+ this fixture's own Title leaf);
#   * the seven career SCENARIO nodes lifted VERBATIM from `fresh-career` - Funding,
#     ResearchAndDevelopment, Reputation, ScenarioUpgradeableFacilities, StrategySystem,
#     ScenarioContractEvents, ContractSystem - at the positions that reproduce
#     `fresh-career`'s own ordering, with `funds` reseeded to 11000;
#   * `ScenarioNewGameIntro` (SANDBOX-only) dropped.
# Facility levels are the donor's, i.e. all ten at `lvl = 0`, the mode default every
# career fixture in the corpus carries. Nothing in this lane reads one: it loads straight
# into FLIGHT and `TimeJump` moves the clock with `Planetarium.SetUniversalTime` rather
# than through TimeWarp, so no tracking-station warp tier is in the path.
#
# EVERYTHING RVR-2 NEEDS IS STILL THERE BY CONSTRUCTION, not by re-assertion: the
# ParsekScenario node and the whole FLIGHTSTATE are byte-identical to the sandbox
# sibling's, gated by `verify_payload_unchanged` / `verify_flightstate_unchanged`, and
# the sandbox builder's OWN `verify_save` / `verify_tree` run verbatim over this save
# (two sealed trees, five recordings, the TARGET-branch route window, no `ROUTES` node,
# the repaired endpoint inventory, 19 authoritative sidecars).
#
# `injectedRecordings = "none"`: the payload is the TEMPLATE's, and a synthetic corpus on
# top would give `RouteAnalysisEngine` other trees to consider and make the create's
# candidate resolution un-attributable. Same call RVR-2 made.
saveTemplate       = "fixtures/saves/rover-route-career"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
# RVR-2's THIRTEEN STEPS, VERBATIM. That is the design: a step this lane changed would be
# a variable this lane did not mean to move, and the whole claim is that only
# `env.IsCareer` differs. The prologue (StopRecording / DiscardTree / the two SetSettings)
# is H39's / H40's / RVR-1's / RVR-2's, for the same reasons - the committed-tree restore
# path resumes a promotion-stub recording ~1 s into the scene, StopRecording is
# idempotent-OK, DiscardTree answers OK with nothing-discarded when no plain tree is live
# (and it discards the LIVE PLAIN tree, never a committed one), and `verboseLogging=true`
# is REQUIRED because the `FundsCost basis=` breadcrumb this lane exists for is a Verbose
# line.
#
# THE TWO TimeJumps ARE +600 s EACH from the fixture's save clock of UT 979.48 -> 1600 ->
# 2200, unchanged and generous on purpose. RVR-2 measured `warp jump=21` and `warp
# jump=12` at these exact UTs on these exact bytes, so the clock is settled and a red on
# a delivery token is not a clock diagnosis.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                    expect = "OK" },
  { cmd = "DiscardTree",                                                      expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SealSlot",     args = { tree = "73e50f1e3aa24c299919016cd9e92269" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "create", tree = "73e50f1e3aa24c299919016cd9e92269", name = "RVR4 Career Supply" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "send-once", route = "RVR4 Career Supply" }, expect = "OK", budget = 120 },
  { cmd = "TimeJump",     args = { ut = "1600" },                             expect = "OK", budget = 300 },
  { cmd = "RouteCommand", args = { action = "send-once", route = "RVR4 Career Supply" }, expect = "OK", budget = 120 },
  { cmd = "TimeJump",     args = { ut = "2200" },                             expect = "OK", budget = 300 },
  { cmd = "SaveGame",                                                         expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# BOOT FACTS ONLY, on the H35 CLAIM-IS-NOT-GATE rule. The rows this lane would eventually
# earn are D10 `ksc-origin` (the career flavor - the funds gate and the charge are the
# ONLY things that make a KSC origin behave differently from any other) and, once the
# funds-short subject exists, `hold-reasons`. Both are declared in the commit that
# measures this lane green, never on an unflown spec.
D14 = ["kerbin", "career", "scene-flight"]

[expectations]
# PLACEMENT IS LOAD-BEARING (the H7 lesson): a bare key after an `[expectations.<sub>]`
# header is TOML-scoped to that sub-table and never read. No tracer is armed by this
# spec, so the empty list is honest, and NO render-composition expectations block is
# declared - declaring one would set `PARSEK_RENDER_MANIFEST=1`, and a confirmed dock
# crossing appends `route-dock-crossing` CLOCK-EVENTs to that manifest.
allowedAnomalies = []

[expectations.recordings]
# THE ANTI-DATA-LOSS FLOOR, EXACT AT 5, both bounds - RVR-2's pin, unchanged, and it is
# not bookkeeping. The route this lane creates holds `SOURCE` references into the
# committed corpus which `RouteStore.RevalidateSources` compares against a live rebuild;
# a recording destroyed mid-run would flip the fresh route to `SourceChanged`, which never
# auto-recovers, and the failure would present as a route defect rather than as data loss.
# RVR-2's two flights both observed exactly 5 on these bytes, and the career stamp touches
# no RECORDING node (`verify_payload_unchanged` gates that as byte-identity), so 5 is a
# measured number here rather than an inherited guess.
count = { min = 5, max = 5 }

[expectations.logContracts]
# FIFTEEN TOKENS, AND EVERY ONE IS NOW MEASURED. Each is a literal RUN taken from the
# emitting `string.Format` / interpolation in source and confirmed verbatim against
# `harness/results/2026-09-01_2228_RVR-4-rover-route-career-cost_shots/KSP.log` - never a
# line pasted from a log (an interpolated string is not stored the way it renders) and
# never a run spanning an em dash, which several of these lines carry.
#
# TOKENS 1-5, 9-10 AND 12, 14 ARE RVR-2's, and they are this lane's CONTROL: RVR-2 run 2
# measured them green in sandbox over the identical recorded payload, and flight 2
# measured them green here. If any of them reds, the run diverged from the sandbox
# baseline somewhere OTHER than the career surface, and that is the first thing to know.
# Read RVR-2's own per-token commentary for what each asserts; only this lane's own
# tokens are argued below.
#
# TOKEN 6  THE COSTING BASIS - the fix, and the reason this lane exists. From
#          `ComputeDispatchFundsCostForRoute`'s Verbose line, whose format string is
#            "FundsCost basis={0} route={1} source={2} snapshotSource={3} fallback={4}"
#            + subsetTerm + " snapshotSurface={5}" + partsTerm + " cost={6}"
#          MEASURED: basis=launch-manifest, source == snapshotSource == the ROOT
#          `cf8d06fc...`, fallback=0, snapshotSurface=ghost, cost=7410.0000023841858.
#          FOUR assertions in one token, and the fourth is an ABSENCE:
#            * `basis=launch-manifest` - the resource term came from the root's COMPLETE
#              run manifest (the launch load), not from a stop snapshot.
#            * `source=cf8d06fc... snapshotSource=cf8d06fc...`, the SAME literal id
#              twice: THE ROOT PRICED ITSELF. Pinned exactly rather than as a regex
#              because it is the whole finding - flight 1 could not price this tree at
#              all, and the round-2 fix works here by letting the root resolve a surface
#              rather than by walking to a member.
#            * `snapshotSurface=ghost` - the surface is the `_ghost.craft` copy, which is
#              the point of the follow-on fix: `VesselSnapshot` is nulled in memory by
#              ParsekScenario's OnLoad crew-auto-unreserve sweep on every aged committed
#              recording, and the ghost copy survives it.
#            * `fallback=0 snapshotSurface=ghost` CONTIGUOUS - `subsetTerm` is emitted
#              between those two fields, so a match proves the transport-subset path did
#              NOT run. That path stays a valid fallback for a subject whose root carries
#              neither surface; this fixture is not that subject, and pinning the absence
#              is what stops the lane silently changing what it measures.
#          `route=` stays a regex - it is a per-run route id.
#
# TOKEN 7  THE CHARGE, from `EmitDispatchDebit`'s Info line
#            "DispatchDebit: route {0} cycle={1} ut={2} cost={3} careerKsc={4}"
#          plus a `physicalSuffix` that is EMPTY on a KSC origin, so `careerKsc=1` ends
#          the rendered line. TWO claims and both are the point. `cost=7410` says the
#          dispatch was priced AND priced correctly - flight 1 read `cost=0` here, which
#          is precisely what ROUTE-DISPATCH-COST-FREE-ON-SNAPSHOTLESS-ROOT produced.
#          `careerKsc=1` says the career + KSC-origin predicate held, i.e. the branch
#          sandbox can never reach; a `careerKsc=0` would mean the career stamp did not
#          take (a missing `Funding` SCENARIO node makes `Funding.Instance` null and
#          `PatchFunds` log `funding-null (sandbox mode)`), and the lane would be RVR-2
#          with extra steps.
#
# TOKEN 8  THE LIVE DEBIT, from `ApplyDeliveryFromPlan` step 7. The authored spec left
#          this out on the standing "pin what you have measured" rule; flight 2 measured
#          it, so it is in. It is the half that actually MOVES the pool - token 7 proves
#          the cost was computed, this proves it was charged - and it is what makes the
#          funds-short arithmetic in token 11 arrive.
#
# TOKEN 11 THE FUNDS-SHORT HOLD, from `ProcessLoopRoute`'s Info line. THE TOKEN THIS
#          LANE EXISTS FOR AND THE ONE THE AUTHORED HEADER SAID COULD NEVER FIRE.
#          `shortfall=3820` is `2 * cost - FUNDS_SEED` and is derived from those two in
#          `harness/lib`, so a re-harvest that moved the parts multiset moves the pin
#          with it. The rendered line continues past an em dash (`emitted nothing,
#          snapped lastObserved=32`), so the run stops at the shortfall.
#          THIS REPLACES the authored `BLOCKED kind=DestinationFull reason=LiquidFuel`
#          token, which is what round 1 measured when the cost was still 0. Both
#          refusals are true on these bytes; the funds gate is step 7 of
#          `CheckEligibility` and capacity is step 8, so once the dispatch is charged
#          funds wins. A DestinationFull token here would now red a correct run, and its
#          absence is gated in `harness/lib`.
#
# TOKEN 13 THE ARMED-PAUSE PROVENANCE, extended by `hold kind=FundsShort`. The whole run
#          `reason=blocked-then-paused armedBy=send-once hold kind=FundsShort` is
#          contiguous in the emitter, and the third field is what makes this token say
#          WHICH refusal consumed the one-shot - the same line reads
#          `hold kind=DestinationFull` on round 1 and in sandbox.
#
# TOKEN 15 THE RECOVERY CREDIT'S ABSENCE, from `EmitPendingRecoveryCredit`. The roadmap
#          asks this lane for a recovery credit; the ledger carries no recovery rows, so
#          the honest answer is a measured absence rather than a paragraph. Pinning the
#          skip makes it a gate: a fixture that later gained a recovery row would red
#          here and the claim would be re-examined instead of quietly becoming false.
#
# WHAT IS DELIBERATELY NOT PINNED, each with its reason:
#   * `PatchFunds: GUARDED UPLIFT clamped resource=Funds ...`. It is the MECHANISM the
#     whole funds-short chain rests on, and it is still not pinned: it is a property of a
#     FILE-CONSTRUCTED career (ledger award rows with no matching live-pool history), it
#     repeats every recalc, and a fixture that later gained a spending channel would stop
#     emitting it. Pinning it would freeze a fixture artifact as a product contract.
#     Recorded report-only in `docs/dev/todo-and-known-bugs.md` instead.
#   * `Credited milestone '...'` - same class, and nothing asserts over the 18,200.
#   * any `status=DestinationFull` reading. On the loop path a blocked route ends at
#     `Paused` with `LastHoldKind` set; `RouteStatus.DestinationFull` belongs to the dead
#     self-timer path. Unchanged from RVR-2.
required  = [
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  "sealslot complete mode=tree tree=73e50f1e3aa24c299919016cd9e92269 total=4 sealed=0 remaining=0 alreadySealed=True",
  "routecommand create gate tree=73e50f1e3aa24c299919016cd9e92269 treeFound=True dismissed=False sealed=True eligible=True status=Eligible alreadyPromoted=False refusal=None",
  "routecommand complete action=create tree=73e50f1e3aa24c299919016cd9e92269 route=.* name='RVR4 Career Supply' status=Paused",
  "PauseAfterCurrentCycle=true \\(route will dispatch one cycle when conditions allow, then transition to Paused\\)",
  "FundsCost basis=launch-manifest route=\\S+ source=cf8d06fc7bf74e1a82bc70fc79290847 snapshotSource=cf8d06fc7bf74e1a82bc70fc79290847 fallback=0 snapshotSurface=ghost cost=7410(\\.[0-9]+)?",
  "DispatchDebit: route .* cost=7410(\\.[0-9]+)? careerKsc=1",
  "Delivery: route .* Career KSC funds debited: -7410(\\.[0-9]+)?",
  "Delivery write: route=.* resource=LiquidFuel .* path=unloaded",
  "Inventory store: route=.* path=unloaded",
  "cycle=cycle-1 BLOCKED kind=FundsShort reason=funds-short shortfall=3820(\\.[0-9]+)?",
  "ArmedPause: route .* BLOCKED cycle consumed the armed pause",
  "reason=blocked-then-paused armedBy=send-once hold kind=FundsShort",
  "LifecycleMarker: route .* type=RoutePaused reason=blocked-then-paused",
  "credit-skip zero-recovery \\(recoveryRows=0\\)",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

# NO [expectations.ledger] BLOCK, and the reason is L5-career-contract-complete's own,
# not a different one: the M-B2 oracle has no report-only mode, so an armed manifest must
# account for EVERY pool movement of the run. Here that is the five committed milestone
# awards (18,200 funds, plus Kerbin/BaseConstruction's 1 reputation, both landing through
# the load-time recalc rather than through anything this driver does) AND the dispatch
# debit, whose exact amount is the very thing the first flight exists to measure. Arming
# a manifest built on an unmeasured cost would be a manifest that reds on the run that
# measures it. What this spec DOES gate is the ROW: token 13 carries the charge's own
# `RouteCargoDebited` breadcrumb, so a dispatch that charged a different-shaped amount
# reds there. Arming the ledger block is a separate decision with its own measurements,
# taken after the first green run.

[runtime]
# RVR-2's budget arithmetic, unchanged: `run.py` gives EVERY deferred seam verb
# `required_step_wait(max(step budget, SEAM_FALLBACK_DEFERRAL_SECONDS=600))` = 660 s
# regardless of the declared step budget. LoadGame and both TimeJumps are deferred, so
# the worst case is 660 x 3 = 1980; the six synchronous route/seal/save verbs add their
# own budgets on top. 2400 clears it with headroom, and RVR-2's own runs came in at 50 s
# wall on the identical driver.
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
