schema = 1
id = "KB-4-more-click-blocks-after-rewind"
# =====================================================================================
# SEVEN MORE STOCK-SCREEN CLICK-BLOCKS AFTER A REWIND, LIVE: the strategy Cancel, contract
# Decline, the contract-slot Accept, contract Cancel, kerbal dismissal (a held kerbal and a
# stand-in), part purchase, and the VAB crew-dialog seat.
#
# WHY THIS LANE EXISTS. KB-2 and KB-3 press five stock controls the committed timeline
# reserves (facility repair; tech research, facility upgrade, hire, contract accept). The
# overlay program shipped more blocks (docs/dev/research/stock-ui-reservation-overlays-
# 2026-09-25.md, section 4 S1 / C2 / C3 / C4 / K1 / P1), each proven only by unit cells and
# in-game DECISION cells, which never press a control. This lane presses the ones the
# census fixture reaches. The strategy ACTIVATION block is KB-5's: on this fixture stock
# itself refuses every activation (1 of 1 Administration slot used) and Parsek's reason
# stands aside by the stock-first precedence ruling (F7), so it cannot be pressed here.
#
# THE HOST IS GUI-28's and KB-3's. `stock-screen-census` (a rewound career: save clock UT
# 409.56, every committed row 30000 s or more after it; built by
# Source/Parsek.Tests/StockScreenCensusFixture.cs) already carries every reservation below:
#   Administration  AppreciationCampaignCfg active now, deactivated later (KSC-origin row)
#   Mission Control survey 90e4faaf accepted later (KSC-origin ContractAccept)
#                   both level-1 slots needed later -> Offered 375b4446 slot-blocked
#                   decoupler test 07c8e34d Active, completed later by 'Census Hopper'
#   Astronaut Cplx  Bill Kerman held by the committed flight 'Census Hopper';
#                   Debwig Kerman the stand-in covering Jebediah Kerman's seat
#   Part tooltip    probeCoreSphere.v2 unpurchased now, bought later (bypass OFF)
#   VAB crew dialog Bill Kerman (the same hold) on the Jumping Flea's crew list
# A lane at 1x never reaches the first committed row.
#
# FOR EACH BLOCK, pinned below (KB-3's four facets):
#   (a) THE HOVER. The stock screen is opened and the row selected or hovered through
#       `StockScreen`; the capture writes the decision the screen draws
#       (`[StockUiOverlay] record label=<capture> ... blocked=true why="..."`) and, for a
#       button, stock's own state of it (`control ... interactable=false`).
#   (b) THE REFUSED CLICK. `KscAction` makes the stock call behind the control:
#       press-strategy-cancel -> Administration.BtnInputAccept("cancel") on the selected
#       strategy (the Cancel button's own handler); decline-contract -> Contract.Decline()
#       (Mission Control's Decline); accept-contract on the slot-blocked offer ->
#       Contract.Accept(); cancel-contract -> Contract.Cancel() (Mission Control's Cancel);
#       sack-kerbal -> KerbalRoster.SackAvailable (the Astronaut Complex's dismiss button);
#       purchase-part -> RDTech.PurchasePart on the part's node (the R&D part tooltip's
#       Purchase); seat-crew -> the crew dialog's drop of the row onto the pod's one seat
#       (BaseCrewAssignmentDialog.DropOnCrewList; the pod's seat holds Jeb's stand-in, so
#       the row's assign button has no empty seat to use). Each is refused by the backstop
#       that reads the greyed control's own predicate, which writes its Blocking line and
#       shows the blocked dialog; the seam reads the target's state and the funds, science
#       and reputation pools identical on both sides (`kscaction <action> not applied:`,
#       backreferences) and refuses `blocked-committed`.
#   (c) THE SAME TEXT. Each refusal's dialog line `[CommittedAction] Blocked action: <title>
#       - <body>` must END in exactly the `why` its hover record carried (backreference
#       `\1`). ONE PAIR DIFFERS BY DESIGN: the stand-in's Astronaut Complex tooltip appends
#       the seat-count sentence ("They share <owner>'s seat and do not count against the
#       Astronaut Complex limit.", StandInSeatCount.AppendSeatSharedSentence, the
#       STAND-INS-EXCEED-THE-CREW-LIMIT fix), which is not part of the refusal; the Debwig
#       contract captures the refusal text before that sentence and requires the dialog to
#       carry exactly it.
#   (d) THE LEDGER UNCHANGED. The ledger loads 26 rows and every save of it (each screen
#       close, the editor entry and exit, FlushAndQuit) still holds 26; no row is added, no
#       KSC spending recorded, and no game-state event recorded (only the facility cache
#       seed line may read `Game state:`).
#
# A POINTER LANE. The `act=hover` steps move the OS cursor machine-wide
# (`stockscreen pointer moving the OS cursor ...`); nothing gated depends on the pictures.
#
# DRIVER NOTE. A KscAction refused for any reason reads REJECTED, including a seam
# pre-check; the `kscaction refused ... reason=blocked-committed` tokens are what say the
# committed-timeline backstop refused each click. A strategy press Parsek let through
# would open stock's confirmation, which the seam takes down and reports OK
# (`reached stock confirmation`, forbidden below).
#
# THE LAST ACT IS IN THE EDITOR. `UiAction op=dismiss` runs hostless in every scene since
# this lane (the editor hosts no Parsek UI), so the crew dialog's refusal is dismissed
# like the others.
#
# READING RUN AND ARMING: see the status block the arming commit writes here.
tier = "nightly"
description = "Rewound career whose committed timeline deactivates a strategy, accepts a survey (filling both contract slots), completes an Active contract, holds Bill Kerman (with a stand-in for Jeb) and buys a part after the clock: the Administration Cancel, Mission Control Decline, the slot-blocked Accept, Mission Control Cancel, two Astronaut Complex dismissals, the R&D part Purchase and the VAB crew-dialog seat are each refused through the stock call behind them with the blocked dialog carrying the hover's explanation, changing no state, funds, science, reputation or ledger row."
instanceProfile = "stock-minimal"
tags = ["ledger", "stock-ui", "action-blocking", "career", "KB-4"]

