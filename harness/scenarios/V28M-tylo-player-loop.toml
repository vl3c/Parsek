  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "MissionConfig", args = { tree = "f1f73e8a500c442d892872c3d70c9fe5", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "f1f73e8a500c442d892872c3d70c9fe5" }, expect = "OK", budget = 300 },
