schema = 1
id = "H72-kerbal-inventory-spawn"
tier = "nightly"
# BATCH-ONLY scenario, H7-H20 shape (H31's in particular). The live half of
# KERBAL-INVENTORY-NOT-RESTORED-AT-SPAWN (docs/dev/todo-and-known-bugs.md, PR #1899):
# `CrewInventorySnapshot` captures each crew member's inventory with every recorded
# snapshot (`VesselSpawner.TryBackupSnapshot`) and restores it onto the roster at
# spawn. The pure codec, stand-in renames and restore planning are xUnit
# (`CrewInventorySnapshotTests`); what only a live game has is the two halves this
# category drives, `KerbalInventorySpawnInGameTest.cs`:
#   1. SnapshotCapturesEverySeatedKerbalsInventory - a real `TryBackupSnapshot` of the
#      active vessel carries one PARSEK_CREW_INVENTORY entry per crew member with a
#      stored inventory (roster backing field / live KerbalInventoryScenario instance),
#      keyed by a seated name, and the capture writes no default inventory onto a
#      kerbal who had none.
#   2. RosterApplyReplacesTheRosterInventory - the spawn restore's roster applier
#      replaces crew[0]'s roster inventory (empty INVENTORY in, zero stored parts out),
#      drops any live KerbalInventoryScenario instance, and the spawn-failure rollback
#      writer (`WriteRosterPrior`) puts the prior back, null included.
#
# LIVE-PROVEN 2026-09-27: reading run 2026-09-27_1339 (PASS attempt 1, wall 65 s)
# measured `BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0`, so the batch line is
# pinned WHOLE and the id has left IngameBatchWiringGroupTests.INTERIM_PIN_IDS. Every
# CrewInventory token below was a prediction from the source and this fixture, and the
# run measured each as predicted (ApplyToRosterKerbal storedParts=0
# droppedLiveInstance=True, WriteRosterPrior null=False storedParts=2).
description = "Run the in-game KerbalInventorySpawn category unattended over a crewed pad craft: a real TryBackupSnapshot captures the seated kerbal's stored inventory without mutating the roster, and the spawn restore's roster applier replaces that kerbal's roster inventory, drops the live instance, and rolls back to the prior."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "crew-inventory", "H72"]

[fixture]
# b1-pad-craft: the active vessel is the one-seat pod on the pad in PRELAUNCH with
# Jebediah Kerman seated (`state = Assigned`), and his ROSTER entry carries an
# INVENTORY node with TWO STOREDPARTs (evaChute, evaJetpack) - so cell 1's
# "no crew member has a stored inventory" skip cannot fire (the roster backing field
# is non-null from the load), and cell 2's rollback has a non-null prior with
# storedParts=2. Both cells' "needs a crewed active vessel" skip is the fixture's
# premise. The same template boots FLIGHT for M3-mission-phasing-airborne-anchor
# (measured scene=FLIGHT there).
#
# injectedRecordings = "none": nothing here reads the recording store, and an
# injected corpus would only add spawn traffic whose CrewInventory lines could be
# mistaken for this batch's.
saveTemplate = "fixtures/saves/b1-pad-craft"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
# verboseLogging=true is LOAD-BEARING: the capture line is VerboseRateLimited, and
# the applier / rollback lines and the runner's per-cell PASSED lines are Verbose.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "RunTests",   args = { category = "KerbalInventorySpawn" },        expect = "OK", budget = 300 },
  { cmd = "FlushAndQuit",                                                  expect = "OK" },
]

[dimensionsCovered]
# No registry cell names crew-inventory capture / restore; basics only.
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Zero: auto-record is off and neither cell records or commits anything.
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY: total=2 is ATTRIBUTE-EXACT (two FLIGHT declarations, neither
# batch-disabled; hlib.derive_batch_tally reads total=2 executable=2 at FLIGHT), kept
# in sync by CommittedBatchTallySourceSyncTests. The split is the one the reading run
# 2026-09-27_1339 measured (passed=2 skipped=0), pinned whole; the two PASSED witnesses
# below require it cell by cell.
#
# Per-cell witnesses: InGameTestRunner writes `PASSED: {Type}.{Method} (<ms>ms)` at
# Verbose. A Skip of either cell is the lane failing its own premise, so both SKIPPED
# forms are forbidden too.
#
# CrewInventory tokens (literal runs from CrewInventorySnapshot.cs, holes regexed
# only where the value is not a fixture property):
#  - CaptureFromLiveVessel (VerboseRateLimited, keyed per vessel pid, so the first
#    capture of the pad craft always prints): "captured 1" = one seated kerbal with a
#    stored inventory. The "N from live module" count depends on whether stock has
#    built a KerbalInventoryScenario instance for Jeb by then, so it is regexed.
#  - ApplyToRosterKerbal: cell 2 applies an EMPTY INVENTORY, so storedParts=0.
#  - WriteRosterPrior: the finally-block rollback restores Jeb's fixture inventory,
#    null=False storedParts=2 (evaChute + evaJetpack).
required = [
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=KerbalInventorySpawn scene=FLIGHT",
  "PASSED: KerbalInventorySpawnInGameTest\\.SnapshotCapturesEverySeatedKerbalsInventory \\(",
  "PASSED: KerbalInventorySpawnInGameTest\\.RosterApplyReplacesTheRosterInventory \\(",
  "\\[CrewInventory\\] CaptureFromLiveVessel: captured 1 crew inventory\\(ies\\) \\([0-9]+ from live module\\) for pid=[0-9]+ vessel='",
  "\\[CrewInventory\\] ApplyToRosterKerbal: 'Jebediah Kerman' roster inventory replaced \\(storedParts=0, droppedLiveInstance=(True|False)\\)",
  "\\[CrewInventory\\] WriteRosterPrior: 'Jebediah Kerman' roster inventory rolled back \\(null=False, storedParts=2\\)",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "\\[Parsek\\]\\[WARN\\]\\[CrewInventory\\]",
  "FAILED: KerbalInventorySpawnInGameTest\\.",
  "SKIPPED: KerbalInventorySpawnInGameTest\\.",
]

[runtime]
budgetSeconds = 600

[retry]
policy = "once"

[expectedFail]
bugId = ""
