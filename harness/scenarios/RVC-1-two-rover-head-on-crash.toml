schema = 1
id = "RVC-1-two-rover-head-on-crash"
tier = "operator"
# =============================================================================
# RVC-1: TWO ROVERS OF ONE TREE CRASH HEAD-ON, RECORDED AND REPLAYED.
#
# Authored 2026-11-16 for todo NEXT-TESTS-TO-BUILD-2026-11-11 item 3a ("two rovers crash
# into each other, to check the reliability of the recording system and playback
# rendering"). LIVE-PROVEN 2026-11-17 on its fourth flight (tag `flown`), after three red
# or INVALID flights and two re-shapes (after flight 1 and after flights 2 and 3, below).
# Every regex below matches a literal found in C# source (file cited); the windows that
# depend on stock physics (the impact speed, how far the depot is pushed) are left open.
#
# FLIGHT 4, LIVE-PROVEN (2026-11-17, `2026-11-17_1740`, PASS attempt 1, 358 s; runner run
# spawn-reflight-2026-11-17 on V's PC, Debug DLL from main e9353aa5; diagnostics on branch
# forge-logs-2026-11-17-spawn): the timed drive pushed the depot again (`Environment
# transition: pid=1093449218 -> SurfaceMobile at UT=130.08`, `drivevessel end: outcome=moved
# ... gameSeconds=20.02 ... maxSrfSpeed=18.85`), both explodes applied, `[Recorder] Part event:
# Destroyed 'radPanelSm' pid=4129919072` and `Part death on background vessel: Destroyed
# 'radPanelSm' pid=2576286852 vesselPid=1093449218`; the commit read `recordings=4` (mark
# `rvc1-committed-4`), both leaves `terminal=Landed`; the replay applied `apply family=Destroyed
# surface=visibility rec=2 pid=4129919072` and `rec=3 pid=2576286852`. Report-only: ghost
# lifecycle 4 spawned / 4 destroyed, structure one tree, one Dock, one Undock. The recording
# count and the two commit-count pins are now the measured 4.
#
# FLIGHT 1 (2026-11-17, `2026-11-17_1411`, Debug DLL from main 65ac33ee8, PARSEK-FAIL
# (expectation) attempt 1, 348 s; every other verifier green). Red on exactly two tokens,
# both a wrong assumption of this spec, not a Parsek defect:
#   * the background `Part death on background vessel ... vesselPid=<bgChild>` line: the
#     depot (bgChild 717435167) lost NO part. The miner hit it head-on at about 15 m/s
#     (BgRecorder `dist=` 109 m at UT 120.2, 34 m at 125.3, 1 m at 130.3 and 135.4) and
#     pushed it about 70 m north (`Environment transition: pid=717435167 -> SurfaceMobile
#     at UT=130.14`, back to SurfaceStationary at 141.28) with nothing broken on either
#     side; the miner then slid off it and wrecked itself about 36 m further on
#     (`drivevessel crash hit: part='fuelTankSmall' ... vesselPid=110406740 ... own=true
#     impactSrfSpeed=5.69 ut=140.08`, `crash end: ... firstPartVesselPid=110406740
#     ownPartsLost=1 otherPartsLost=0`, mark `rvc1-after-crash-110406740-1-0`). Every stock
#     `Exploded!!` line between the crash marks is a miner part or a `Mining Rover RC
#     Debris` part (fuelTankSmall, 4 rtg, radialRCSTank, MiniISRU, radPanelSm), the
#     background recorder sampled the depot as a loaded BackgroundMap member throughout,
#     its onPartDie handler was subscribed, and the depot leaf committed `terminal=Landed`
#     with its 24 parts. So the recorder had nothing to record.
#   * the replay's two-distinct-recordings `apply family=Destroyed` token: both lines are
#     on rec=2, the miner's post-undock recording (fuelTankSmall 740760190, MiniISRU
#     98504651), correct for a depot that lost nothing.
# Re-shaped after it: a head-on rover impact does not reliably break the struck rover, so
# the background part death is now made deterministic by `PartAction button=explode` on one
# depot radiator (stock Part.explode, the crash path: FX then Die, so onPartDie fires as on
# an impact) once the wreck has settled, and a new token gates that the impact REACHED the
# depot (its background `Environment transition: pid=<bgChild> -> SurfaceMobile` between the
# crash mark and the explode), which a miss followed by a terrain crash would not give.
# Read on flight 1: the active-side split ran (`Deferred split classified: source=joint-break,
# result=DebrisSplit, newVessels=8 ... recordedPid=110406740`, the coalescer window opened,
# four `ProcessBreakupEvent: debris child created ... alive=False`); those four one-point
# debris recordings were dropped from the commit (tree 8 -> 4 recordings, analyzer WARN
# INV5-ORPHAN-SIDECAR x4, not red); 4 ghost meshes spawned and 4 destroyed (balanced); the
# structure block read one tree, one Dock, one Undock.
#
# FLIGHTS 2 AND 3 (2026-11-17, `2026-11-17_1531` and its retry `_1534_a2`, runner run
# refly-2026-11-17, the same Debug DLL from main 65ac33ee8; diagnostics on branch
# forge-logs-2026-11-17-refly). Both driver INVALID (driver-verdict-mismatch): steps
# 0001-0020 OK, then the crash drive answered ERROR `drivevessel-did-not-crash`
# (`gameSeconds=30.00 maxSrfSpeed=20.02 pathMeters=365.4 displacementMeters=365.1
# firstPart='' ownPartsLost=0 otherPartsLost=0`; `_a2`: 20.01, 367.8, 357.9). NOT A MISS:
# the run-up was the same line on all three flights, to the metre. The dock coupled at
# UT 63.86-64.06 after 1.5 m, the undock left the depot 2.4 m root to root, the reverse
# went 88.8-88.9 m path / 89.1-89.2 m displacement in 10.02 s (end speed 15.93-15.94 m/s),
# the settle stopped it in 7.70-7.72 s, and the depot's BgRecorder `dist=` samples read
# 147-148 m at the crash start, 107-109 m at UT ~120.3 and 30-34 m at ~125.4 (about
# 15 m/s closing). On all three flights the miner then hit the depot (`dist=1m` at
# ~130.4) and pushed it: `Environment transition: pid=<bgChild> -> SurfaceMobile at
# UT=130.14` / `130.06` / `130.12` (3 s debounce, so contact at ~127.1), back to
# SurfaceStationary at 141.28 / 138.36 / 138.76. What differed is only AFTER the impact:
# on flight 1 the miner pushed the depot ~11 s, slid off it and wrecked itself on the
# terrain at UT 140.08 (`own=true impactSrfSpeed=5.69`, the only part death of the three
# flights); on flights 2 and 3 it slid past the depot after ~8 s (`dist=` 21-23 m at
# ~135.5, 98-100 m at ~140.6) and drove on at 20 m/s with nothing broken, and the 30 s
# span ran out. No `Exploded!!` line at all on flights 2 and 3. So a ~15 m/s head-on
# rover impact breaks no part on either rover: three impacts out of three, zero part
# deaths at the impact. `DriveVessel` holds no heading and steers nothing (it writes the
# wheel throttle only); the line needs no steering, it is the part death that never
# comes.
# Re-shaped after them, the RW-7 way (`PartAction button=explode` instead of a bet on a
# physics impact): the crash drive is a plain timed drive (`wheelThrottle=1 seconds=20`,
# from UT ~113.5 to ~133.5, past the contact at ~127.1 and the depot's transition at
# ~130.1, ending before the post-impact slide that broke flight 1's miner), then the
# lane explodes one radiator on EACH rover (the miner's `radPanelSm` 4129919072 and the
# depot's 2576286852, both leaves on the MiniISRU) after the 1x wait to UT 170. The
# impact itself stays gated by the depot's SurfaceMobile transition between the crash
# mark and the explodes, which held on all three flights. `DriveVessel untilCrash=true`
# has no flier after this.
#
# HOST: `rover-crash-watched` (harness/tools/build_rover_crash_watched.py): V's
# "Mining Rover RC" (pid 110406740, index 0, active, 28 parts, a Clamp-O-Tron Jr on its
# front), the "Ore Depot" (pid 3950359723, index 2, 24 parts, a copy of the miner without
# drills, its port facing the miner's 1.5 m ahead, so 2.3 m root to root) and the crewless
# "Miner Watcher" (pid 3179797026, index 1) 120 m north, the FLIGHT host after the rewind.
#
# HOW TWO ROVERS GET INTO ONE TREE. The seam drives only the ACTIVE vessel, and a switch to
# a vessel outside the tree does not add it (StartRecording refuses
# `active-recording-id-missing`). So the depot joins the tree the way MINE-5b / MINE-4 made
# it join, both LIVE-PROVEN: the miner drives forward into it until the ports couple
# (`DriveVessel untilDocked=true`, a Dock merge with a foreign vessel,
# ParsekFlightSplitBrancher.cs `Tree merge created: type=Dock`), then `PartAction
# button=undock` splits it off again as a new vessel (`Tree branch created: type=Undock ...
# bgChild=<depot rec> (pid=<new depot pid>)`). From then on the depot is a LOADED
# background member of the miner's tree, recorded by BackgroundRecorder while the miner is
# driven. `PartAction button=controlfrom` on the miner's own probe core first, or stock
# moves the focus to the depot's half at the undock (MINE-4 flight 2026-11-07_0931).
#
# THE CRASH. The miner backs straight away from the depot at full reverse for 10 s (south,
# downhill: the braked miner creeps that way, MINE-4 flight _1003), stops on its brakes,
# then drives straight back at full throttle for 20 s (a plain timed DriveVessel: wheel
# throttle only, no steering, the parking brake restored at the end). No steering is
# needed: the depot sits on the line the miner backed out along, and all three flights hit
# it at UT ~127.1 and pushed it (flights 1-3 above). The 1x wait to UT 170 lets both rovers
# come to rest while both recorders run; then one radiator on each rover is destroyed by
# stock Part.explode (FX then Die, so onPartDie fires as on an impact), since the impact
# itself breaks nothing.
#
# WHAT IT GATES (the reliability question, recording half):
#   * both rovers recorded at once next to each other: the Dock merge and the Undock branch
#     with the depot as the background child, by recording id and pid;
#   * the impact reached the depot: its background `Environment transition: pid=<bgChild>
#     -> SurfaceMobile` (BackgroundRecorder.TrackSections.cs) after the crash mark and before
#     the explodes (flight 1: the miner pushed the depot about 70 m; flights 2 and 3 too);
#   * part loss on BOTH vessels while recording, after the impact: the active recorder's
#     `Part event: Destroyed 'radPanelSm' pid=4129919072` (FlightRecorder.PartEvents.cs
#     OnPartDie) for the miner radiator the lane explodes, and the background recorder's
#     `Part death on background vessel: Destroyed 'radPanelSm' pid=2576286852
#     vesselPid=<the undock's bgChild pid>` (BackgroundRecorder.GameEventHandlers.cs) for
#     the depot radiator it explodes (flights 1-3: the impact broke no part on the depot,
#     and on the miner none at the impact), both between the crash marks;
#   * the scene-exit commit of the whole tree (GS-7's tokens: either an active or a pending
#     tree reaches the Space Center under autoMerge) with at least three recordings.
# (playback half, after Rewind-to-Launch and a reload onto the watcher):
#   * a ghost mesh for the miner and one for the depot's own recording, by its recording id
#     (`[GhostRenderTrace] phase=MeshSpawned ... recId=<bgChild>`, GhostRenderTrace.cs);
#   * the ghosts apply the recorded part deaths on TWO distinct recordings
#     (`apply family=Destroyed surface=visibility rec=N ... applied=[1-9]`,
#     GhostPartEventApplyLog.cs FormatLine; the second rec index differs by back-reference),
#     the two exploded radiators by their part pids.
#   * [expectations.ghostLifecycle] (REPORT-ONLY): every MeshSpawned balanced by a
#     MeshDestroyed by the end of the replay; [expectations.recordings.structure]
#     (REPORT-ONLY): one tree, one Dock, one Undock.
# READ, NOT GATED: the active side's split check (`Deferred split classified:
# ... recordedPid=110406740`; it runs only after a joint break or decouple, which a lone
# leaf-part death may not fire; flight 1's terrain wreck gave `result=DebrisSplit`),
# whether a joint break reached the crash coalescer (`Coalescing window opened`, `BREAKUP
# emitted`, `ProcessBreakupEvent: debris child created`; a dead leaf part leaves one
# connected vessel, so WithinSegment is legal), the background split check (`Scheduled
# deferred split check for background vessel:`), the ghost explosion FX
# (`FXMonger.Explode queued for destroyed part pid=`), the hold ghost a chain may draw for
# the real depot before the replayed dock, and the end spawns of two rovers that may touch.
#
# FLIGHT RISKS (each is a driver or physics outcome, never a Parsek verdict):
#   * a miss: with no steering the miner may not retrace its line; the impact token reds
#     (read the BgRecorder `dist=` samples before calling it a Parsek verdict). Flights 1-3
#     retraced it to the metre.
#   * the impact (or a slide after it) breaking an exploded radiator (pids 4129919072,
#     2576286852): that explode answers ERROR (part not found; driver INVALID); pick another
#     leaf part of that rover. Flights 1-3 broke nothing at the impact; flight 1's terrain
#     wreck came at 26.5 s of driving, the drive now stops at 20 s.
#   * the miner's root probe core is behind its adapter and port; if it dies the tree goes
#     pending, which ExitToSpaceCenter's alternation covers.
#   * the undock leaves the miner FLYING for a few frames (MINE-4 _0945_a2), hence the wait
#     to UT 95.6 before driving.
#   * UT budget: the dock ends by UT 80, the reverse and its settle by about UT 113.5 and
#     the impact drive by about UT 133.5 (flights 1-3: crash mark at 113.46-113.50), so
#     every WarpToUT target is ahead of the clock (a target in the past is a driver
#     refusal).
#
# FAST-LANE CHECKLIST (harness/README.md): (1) a shared flight considered: MINE-4 and MINE-5b
# fly this dock and undock, but each keeps its wreck-free vessels for route gates after it,
# so the crash cannot ride either; (2) every wait is an explicit-UT WarpToUT; (3) all of the
# recording is 1x physics (the drives need it); the replay runs 5x on rails to the dock and
# 1x through the crash; (4)-(5) no burns, no coast; (6) retry once (a missed impact is
# physics); (7) count pinned at the measured 4; (8)/(9) owed after the first green flight.
description = "LIVE-PROVEN 2026-11-17 (run 2026-11-17_1740, fourth flight). RVC-1: V's mining rover docks the ore depot rover and undocks it so both are members of one recording tree, backs away and drives head-on into it at full throttle for 20 s (the impact pushes the depot but breaks nothing), then explodes one radiator on each rover; gates the impact reaching the depot, both recorders' part-death lines and the scene-exit commit, then after Rewind-to-Launch replays both ghosts from a neighbouring rover through the impact and gates the ghost meshes and the destroyed-part visibility applied on both recordings."
instanceProfile = "stock-minimal"
tags = ["rover", "crash", "dock-undock", "part-destroyed", "background-recording", "rewind", "ghost-playback", "RVC-1", "flown", "reading-run"]

[fixture]
saveTemplate = "fixtures/saves/rover-crash-watched"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",            args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                                expect = "OK" },
  { cmd = "DiscardTree",                                                                  expect = "OK" },
  { cmd = "SetSetting",          args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",          args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  # The scene-exit commit needs autoMerge (ExitToSpaceCenter refuses `dialog-required`).
  { cmd = "SetSetting",          args = { name = "autoMerge", value = "true" },           expect = "OK" },
  # The control point on the miner's own probe core (2300437286): with no reference part
  # aboard, stock moves the focus to the undocked half (MINE-4 flight 2026-11-07_0931).
  { cmd = "PartAction",          args = { button = "controlfrom", part = "probeStackSmall", partPid = "2300437286" }, expect = "OK" },
  { cmd = "StartRecording",                                                               expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                               expect = "OK" },
  { cmd = "WarpToUT",            args = { ut = "60", maxRate = "1" },                     expect = "OK", budget = 120 },
  # 1. Into the tree: forward into the depot until the ports couple (MINE-4's dock, <= 20 s).
  { cmd = "MissionMark",         args = { label = "rvc1-dock" },                          expect = "OK" },
  { cmd = "DriveVessel",         args = { wheelThrottle = "0.5", seconds = "20", untilDocked = "true", maxSpeed = "0.25" }, label = "dk", expect = "OK" },
  { cmd = "WarpToUT",            args = { ut = "95", maxRate = "1" },                     expect = "OK", budget = 120 },
  # 2. Undock: stock offers the event on the absorbed half's port only, so no port is named;
  # the control point keeps the focus on the miner and the depot becomes the bg child.
  { cmd = "MissionMark",         args = { label = "rvc1-undock" },                        expect = "OK" },
  { cmd = "PartAction",          args = { button = "undock" }, label = "und",             expect = "OK" },
  # On the ground again within 0.4 s of the undock at about UT 94.9 (MINE-4 _1003).
  { cmd = "WarpToUT",            args = { ut = "95.6", maxRate = "1" },                   expect = "OK", budget = 60 },
  # 3. The run-up: straight back at full reverse, then stop on the brakes.
  { cmd = "MissionMark",         args = { label = "rvc1-reverse" },                       expect = "OK" },
  { cmd = "DriveVessel",         args = { wheelThrottle = "-1", seconds = "10" },         label = "rv", expect = "OK" },
  { cmd = "DriveVessel",         args = { settleBelow = "0.05", seconds = "30" },         expect = "OK" },
  # 4. THE IMPACT: full throttle back along the same line for 20 s (from UT ~113.5; flights
  # 1-3 met the depot at ~127.1 and pushed it), then the brakes go back on. A plain timed
  # drive: the crash mode ended ERROR on flights 2 and 3 because the impact breaks nothing.
  { cmd = "MissionMark",         args = { label = "rvc1-crash" },                         expect = "OK" },
  { cmd = "DriveVessel",         args = { wheelThrottle = "1", seconds = "20" },          label = "cr", expect = "OK" },
  # Both rovers come to rest at 1x with both recorders running (the drive ends by about
  # UT 133.5).
  { cmd = "WarpToUT",            args = { ut = "170", maxRate = "1" },                    expect = "OK", budget = 120 },
  # The part deaths, made deterministic (no impact of flights 1-3 broke a part at the
  # impact): one radiator per rover, each a leaf on its MiniISRU (no split), by stock
  # Part.explode (FX then Die, so onPartDie fires as on an impact). The miner's first (the
  # active recorder), then the depot's by the undock's new pid (the background recorder).
  { cmd = "PartAction",          args = { button = "explode", pid = "110406740", part = "radPanelSm", partPid = "4129919072" }, label = "mx", expect = "OK" },
  { cmd = "PartAction",          args = { button = "explode", pid = "${und.newPid}", part = "radPanelSm", partPid = "2576286852" }, label = "dx", expect = "OK" },
  { cmd = "WarpToUT",            args = { ut = "185", maxRate = "1" },                    expect = "OK", budget = 60 },
  { cmd = "MissionMark",         args = { label = "rvc1-after-crash" },                   expect = "OK" },
  { cmd = "RecordingState",                                                               expect = "OK" },
  # 5. THE COMMIT: leave for the Space Center (an active OR a pending tree, GS-7's gate).
  { cmd = "ExitToSpaceCenter",                                                            expect = "OK", budget = 120 },
  # Back into FLIGHT for the rewind verb: a Space Center save focuses vessel 0.
  { cmd = "SaveGame",            args = { name = "rvc1-committed" },                      expect = "OK", budget = 120 },
  { cmd = "LoadGame",            args = { save = "${runSave}", name = "rvc1-committed" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                                expect = "OK" },
  { cmd = "DiscardTree",                                                                  expect = "OK" },
  { cmd = "ListHandles",         args = { kind = "committed" }, label = "c0",             expect = "OK" },
  { cmd = "MissionMark",         args = { label = "rvc1-committed-${c0.count}" },         expect = "OK" },
  # EVA-9's preamble flake: a re-adopted recorder would refuse the rewind `recording-active`.
  { cmd = "StopRecording",                                                                expect = "OK" },
  # 6. Rewind, then FLIGHT on the watcher (vessel 0 once the miner is stripped).
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                             expect = "OK", budget = 300 },
  { cmd = "SaveGame",            args = { name = "rvc1-rewound" },                        expect = "OK", budget = 120 },
  { cmd = "LoadGame",            args = { save = "${runSave}", name = "rvc1-rewound" },   expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                                expect = "OK" },
  { cmd = "DiscardTree",                                                                  expect = "OK" },
  { cmd = "SetSetting",          args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",          args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  # Every MeshSpawned / MeshDestroyed line (GhostRenderTrace is off unless set).
  { cmd = "SetSetting",          args = { name = "ghostRenderTracing", value = "true" },  expect = "OK" },
  { cmd = "MissionMark",         args = { label = "rvc1-rewound-reloaded" },              expect = "OK" },
  # 7. THE REPLAY: 5x on rails to just before the undock, then 1x through the reverse, the
  # crash and the recordings' end (the exit at about UT 185).
  { cmd = "WarpToUT",            args = { ut = "90", maxRate = "5" },                     expect = "OK", budget = 120 },
  { cmd = "ListHandles",         args = { kind = "committed" }, label = "c1",             expect = "OK" },
  { cmd = "MissionMark",         args = { label = "rvc1-replay-before-undock" },          expect = "OK" },
  { cmd = "WarpToUT",            args = { ut = "205", maxRate = "1" },                    expect = "OK", budget = 240 },
  { cmd = "ListHandles",         args = { kind = "committed" }, label = "c2",             expect = "OK" },
  { cmd = "MissionMark",         args = { label = "rvc1-replayed" },                      expect = "OK" },
  { cmd = "SaveGame",                                                                     expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                                 expect = "OK" },
]

[dimensionsCovered]
# `cross-tree-foreign-dock` and `undock-split` <- the depot joins the miner's tree by a dock
# with a vessel outside it and leaves as the Undock branch's background child (MINE-5b's
# pair); `bg-recording` <- the depot is recorded as a loaded background member through the
# crash (its impact `Environment transition` and, for the exploded radiator, its `Part death
# on background vessel` line are gated).
D5  = ["cross-tree-foreign-dock", "undock-split", "bg-recording"]
# `decouple-stage-destroy` <- parts destroyed (one radiator per rover by stock Part.explode,
# after the impact), recorded as `Destroyed` part events on both recorders and applied
# on both ghosts; `dock-undock` <- the dock and undock.
D7  = ["decouple-stage-destroy", "dock-undock"]
D1  = ["commit-scene-exit", "auto-merge"]
D6  = ["basic-playback"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc", "warp-1x"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The pre-dock recording, the docked one and the Undock branch's two children (Dock merge +
# Undock split); the impact makes no debris since the re-shape. Flight 4 read 4.
count = { min = 4, max = 4 }

[expectations.recordings.structure]
# REPORT-ONLY until a reading run: one tree, one dock and one undock.
gating = false
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
branchPoints   = { Dock = { min = 1, max = 1 }, Undock = { min = 1, max = 1 } }

[expectations.ghostLifecycle]
# REPORT-ONLY until a reading run: at least the miner's and the depot's ghosts, every one
# that spawned also destroyed by the end of the replay (the end spawn retires each ghost).
gating = false
spawned = { min = 2 }
requireBalanced = true

[expectations.logContracts]
required = [
  # --- 1. The dock (TestCommandDriveVessel.cs dock lines; MINE-5b's live-proven tokens) ---
  "drivevessel dock start: vessel=Mining Rover RC pid=110406740 wheelThrottle=0\\.50 seconds=20\\.0 maxSpeed=0\\.25 readyPorts=1 ",
  "drivevessel dock couple: port='dockingPort3' partnerPart='dockingPort3' partnerPid=3950359723 partnerName='Ore Depot' ut=",
  "drivevessel dock end: outcome=docked vessel=Mining Rover RC pid=110406740 [^\\r\\n]*activePid=110406740 activeName='Mining Rover RC' activeParts=52",
  # The foreign dock is a merge branch point (ParsekFlightSplitBrancher.cs CreateMergeBranch).
  "(?s)MISSIONMARK label=rvc1-dock .*?Tree merge created: type=Dock, bp=[^,\\r\\n]+, parents=\\[[^\\]\\r\\n]*\\], child=[0-9a-f]+ \\(pid=110406740\\).*?MISSIONMARK label=rvc1-undock ",
  # --- 2. The undock: the miner stays active, the depot is the background child ---
  "(?s)MISSIONMARK label=rvc1-undock (?:(?!partaction applied button=).)*?partaction applied button=undock pid=110406740 part='dockingPort3' partId=[0-9]+ event=Undock newPid=[1-9][0-9]* newName='[^'\\r\\n]*' vessels=[0-9]+->[0-9]+ activePid=110406740 ",
  "(?s)MISSIONMARK label=rvc1-undock .*?Tree branch created: type=Undock, bp=[^,\\r\\n]+, activeChild=[0-9a-f]+ \\(pid=110406740\\), bgChild=[0-9a-f]+ \\(pid=[1-9][0-9]*\\).*?MISSIONMARK label=rvc1-reverse ",
  # --- 3. The run-up (TestCommandDriveVessel.cs FormatStartLine) ---
  "drivevessel start: vessel=Mining Rover RC pid=110406740 situation=LANDED wheelThrottle=-1\\.00 seconds=10\\.0 wheelMotors=4 ",
  # --- 4. THE IMPACT (TestCommandDriveVessel.cs FormatStartLine / the plain end line) ---
  "drivevessel start: vessel=Mining Rover RC pid=110406740 situation=LANDED wheelThrottle=1\\.00 seconds=20\\.0 wheelMotors=4 ",
  "(?s)MISSIONMARK label=rvc1-crash (?:(?!MISSIONMARK label=).)*?drivevessel end: outcome=moved vessel=Mining Rover RC pid=110406740 ",
  # The miner radiator destroyed by the explode step, on the miner (TestCommandPartAction.cs).
  "(?s)MISSIONMARK label=rvc1-crash (?:(?!MISSIONMARK label=).)*?partaction applied button=explode pid=110406740 part='radPanelSm' partId=[0-9]+ event=explode ",
  # Part loss on the ACTIVE miner while recording (FlightRecorder.PartEvents.cs OnPartDie):
  # that radiator, by its part pid.
  "(?s)MISSIONMARK label=rvc1-crash (?:(?!MISSIONMARK label=).)*?\\[Recorder\\] Part event: Destroyed 'radPanelSm' pid=4129919072(?![0-9])(?:(?!MISSIONMARK label=).)*?MISSIONMARK label=rvc1-after-crash ",
  # The impact REACHED the depot: the background recorder saw the parked depot start moving
  # (BackgroundRecorder.TrackSections.cs) after the crash mark and before the explodes below
  # (flights 1-3: `Environment transition: pid=<bgChild> -> SurfaceMobile at UT=130.14` /
  # `130.06` / `130.12`, the miner pushing it). A miss leaves the depot parked.
  "Tree branch created: type=Undock, [^\\r\\n]*bgChild=[0-9a-f]+ \\(pid=([1-9][0-9]*)\\)[\\s\\S]*MISSIONMARK label=rvc1-crash (?:(?!MISSIONMARK label=|partaction applied button=explode )[\\s\\S])*?\\[BgRecorder\\] Environment transition: pid=\\1 -> SurfaceMobile at UT=(?:(?!MISSIONMARK label=)[\\s\\S])*?partaction applied button=explode pid=\\1 part='radPanelSm' partId=[0-9]+ event=explode ",
  # Part loss on the BACKGROUND depot while recording, on the undock's bgChild pid
  # (BackgroundRecorder.GameEventHandlers.cs; the pid by back-reference): the radiator the
  # explode step destroys (the impact token above gates the explode's own applied line).
  "Tree branch created: type=Undock, [^\\r\\n]*bgChild=[0-9a-f]+ \\(pid=([1-9][0-9]*)\\)[\\s\\S]*MISSIONMARK label=rvc1-crash (?:(?!MISSIONMARK label=)[\\s\\S])*?Part death on background vessel: Destroyed 'radPanelSm' pid=2576286852 vesselPid=\\1(?:(?!MISSIONMARK label=)[\\s\\S])*?MISSIONMARK label=rvc1-after-crash ",
  # --- 5. THE COMMIT (GS-7's tokens; ParsekTestCommandAddon.ExitToSpaceCenter.cs,
  # ParsekScenario.AutoCommit.cs Silent / Limbo-preserving full-fidelity) ---
  "exittospacecenter start scene=FLIGHT autoMerge=true hasActiveTree=(?:false hasPendingTree=true|true hasPendingTree=false)",
  "exittospacecenter complete scene=SPACECENTER game-loaded=true ",
  "full-fidelity auto-commit \\(scene-exit[^\\r\\n]*\\): tree='Mining Rover RC' recordings=4 ",
  # ListHandles kind=committed counts committed RECORDINGS, not trees (AST-1 / COM-1 pin -2).
  "MISSIONMARK label=rvc1-committed-4 ",
  # Both rovers' recordings end as leaves with a ground terminal (a wreck that kept its root
  # stays Landed; a vessel the crash removed is Destroyed), finalized after the crash
  # (ParsekFlight.Finalization.cs; the depot's name by back-reference to the undock's).
  "(?s)MISSIONMARK label=rvc1-crash .*?FinalizeTreeRecordings: rec='[0-9a-f]+' vessel='Mining Rover RC' points=[1-9][0-9]* orbitSegs=[0-9]+ terminal=(?:Landed|Destroyed) [^\\r\\n]*leaf=True.*?MISSIONMARK label=rvc1-committed-",
  "partaction applied button=undock [^\\r\\n]*newName='([^'\\r\\n]+)'[\\s\\S]*MISSIONMARK label=rvc1-crash [\\s\\S]*?FinalizeTreeRecordings: rec='[0-9a-f]+' vessel='\\1' points=[1-9][0-9]* orbitSegs=[0-9]+ terminal=(?:Landed|Destroyed) [^\\r\\n]*leaf=True[\\s\\S]*?MISSIONMARK label=rvc1-committed-",
  # --- 6. The rewind (ParsekTestCommandAddon.InvokeRewindToLaunch.cs) ---
  "invokerewindtolaunch complete rec=[0-9a-f]{32} tree=[0-9a-f]{32} adjustedUT=",
  # --- 7. THE REPLAY (GhostRenderTrace.cs MeshSpawned; GhostPartEventApplyLog.cs) ---
  "(?s)MISSIONMARK label=rvc1-rewound-reloaded .*?\\[GhostRenderTrace\\] phase=MeshSpawned [^\\r\\n]*vessel=Mining Rover RC reason=",
  # The depot's own recording (the undock's bgChild) built a ghost mesh.
  "Tree branch created: type=Undock, [^\\r\\n]*bgChild=([0-9a-f]+) \\(pid=[0-9]+\\)[\\s\\S]*MISSIONMARK label=rvc1-rewound-reloaded [\\s\\S]*?\\[GhostRenderTrace\\] phase=MeshSpawned rec=\\S+ recId=\\1 ",
  # The recorded deaths hidden on TWO distinct ghosts during the replay.
  "(?s)MISSIONMARK label=rvc1-replay-before-undock .*?apply family=Destroyed surface=visibility rec=([0-9]+) pid=[0-9]+ applied=[1-9][0-9]* .*?apply family=Destroyed surface=visibility rec=(?!\\1 )[0-9]+ pid=[0-9]+ applied=[1-9][0-9]* .*?MISSIONMARK label=rvc1-replayed ",
  # The depot radiator the background recorder recorded and the miner radiator the active
  # recorder recorded, each by its part pid.
  "(?s)MISSIONMARK label=rvc1-replay-before-undock .*?apply family=Destroyed surface=visibility rec=[0-9]+ pid=2576286852 applied=[1-9][0-9]* .*?MISSIONMARK label=rvc1-replayed ",
  "(?s)MISSIONMARK label=rvc1-replay-before-undock .*?apply family=Destroyed surface=visibility rec=[0-9]+ pid=4129919072 applied=[1-9][0-9]* .*?MISSIONMARK label=rvc1-replayed ",
]
forbidden = [
