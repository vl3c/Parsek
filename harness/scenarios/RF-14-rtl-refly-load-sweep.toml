schema = 1
id = "RF-14-rtl-refly-load-sweep"
# =====================================================================================
# GHOST-REPLAY TIER B ITEM 7: REWIND-TO-LAUNCH x RE-FLY, AND THE LOAD-TIME SWEEP LIVE.
#
# THE PLAYER STORY. Fly a staged Kerbal X (the core comes off with its own probe core, so
# the split authors a RewindPoint with two open slots), commit, decide the whole flight
# was wrong and Rewind-to-LAUNCH it. Since PR #1788 the RewindPoint SURVIVES that rewind
# and its slots stay in Unfinished Flights, but the Re-Fly is refused until the clock
# reaches the split again. So: sit on the pad in a watcher while the first flight replays
# past the split, then Re-Fly the core's slot, quicksave in the middle of that re-fly,
# quickload it, and merge. That F5/F9 is the load the sweep has to get right: the save
# carries a live ReFlySessionMarker AND the session's NotCommitted provisional, and
# `LoadTimeSweep.Run` must validate the marker (six durable fields, one of which,
# RewindPointId, now names a point that exists only because the rewind carried it
# across) and SPARE the provisional instead of discarding it as a zombie.
#
# WHICH SWEEP BEHAVIOUR THIS CELL MEANS, and why not the others. The sweep has three
# decisions a player can meet: (1) marker validation + the spare set (a live session
# survives a reload), (2) the zombie discard (a NotCommitted provisional with no valid
# marker), (3) the session-provisional RP discard (a CreatingSessionId-scoped RP whose
# session is gone). This lane claims (1) only. What was re-derived about the others
# (corrected 2026-09-24 in review):
#   - (3) IS reachable in ordinary play, just not by this lane. Staging DURING a re-fly
#     authors a session-scoped RP (`RewindPointAuthor` stamps `CreatingSessionId =
#     ActiveReFlySessionMarker?.SessionId`). While the marker is valid the sweep SPARES it
#     (`AddSessionScopedEntriesToSpare`); a conclusion un-scopes it
#     (`MergeJournalOrchestrator.TagRpsForReap`, the merge-dialog discard). The sweep
#     discards it only after the marker was lost or invalidated, i.e. a crash or a load
#     that dropped the session. RF-14 stages nothing during its re-fly, so its only RP is
#     the unscoped flight-authored one (`Keeping session-prov rp=... with no session
#     scope` when no session is live).
#   - (2) via "Rewind-to-Launch mid-re-fly": while the re-fly recorder is live,
#     `RecordingStore.CanRewind` refuses "Stop recording before rewinding", and no
#     player-facing control stops a recorder (the only `ParsekFlight.StopRecording()`
#     callers are the seam verbs). One code path reads as an exception and is filed, not
#     flown: todo REFLY-DESTROYED-THEN-RTL-MID-SESSION (the re-flown vessel is destroyed
#     while other leaves live, the recorder is backgrounded and nulled, and nothing then
#     refuses the rewind).
#   - The rewind's own OnLoad never runs the sweep: `HandleRewindOnLoad` returns early
#     from `ParsekScenario.OnLoad`, ahead of the `load-time-sweep` phase, after clearing
#     any loaded marker (`ClearActiveReFlyMarkerForPlainRewind`).
# CI-3 already drives the same F5/F9 on a recorded fixture and logs the same two lines,
# unclaimed; what this lane adds is the rewind in front of it, and the backreference
# below that ties the marker's rp= to the point the rewind carried.
#
# THE HOST IS GS-4's, verbatim: `kx_rewind_watch` on `gs1-two-stage-pad` with the same
# three mission params. GS-4 measured the whole first half (`2026-09-23_2012`): the core
# split authors `RewindPoint begin: ... slots=2 ... focusSlot=0 ut=118.82`, CommitTree
# promotes BOTH slots CommittedProvisional (slot 0 the pod stack, slot 1 `Kerbal X
# Probe`), the rewind reads `RewindPoints carried across rewind: installed=1
# loadedFromSave=0 restored=1`, and the watcher's playback wait walks the clock to
# commitUT+30, past the split. So the Re-Fly after the mission needs no TimeJump.
#
# READING RUN `2026-09-23_2147` (DLL sha256 2f8ae726, origin/main c84bec834, no C#
# change): PARSEK-FAIL on exactly ONE token, `recorderLive=true` on the F9, and that
# reading re-shaped the driver. Everything the lane is about came back as derived:
#   `RewindPoints carried across rewind: installed=1 loadedFromSave=0 restored=1
#    staleDropped=0 [rp_1608aaff...@ut=118.70]`, then `listhandles kind=rewindpoints
#    count=1`, StartInvoke and `Invocation complete` on that same rp, then on the F9's
#    OnLoad `Marker valid sess=sess_ffd67652... rp=rp_1608aaff...` and
#    `[LoadSweep] Marker valid=True; spare=1 discarded=0`, then `End reason=merged`;
#    saveParse rewindPoints 1 / supersedeRows 1 / tombstones 0, 9 recordings.
# THE MISS WAS TIMING, NOT PRODUCT. The re-fly recorder binds at OnFlightReady, about
# two seconds after `AtomicMarkerWrite`, and the SaveGame followed the invoke's OK by
# 0.14 s, so the F5 caught the session before its recorder existed (that save logged
# `outcome=unbound-refly-provisional reason=refly-provisional-has-no-trajectory-at-save`,
# the state ReFlyProvisionalBinding documents as reachable from ordinary play). The
# sweep's answer was the same. The lane is about an F5 in the MIDDLE of a re-fly, so the
# driver now idles about six seconds of 1x time first (24 inert RecordingState
# steps, EX-1's idiom, ~0.25 s each; 12 on the armed flight `_2200`, doubled in review) and keeps the recorderLive=true pin. CI-3's F9 came
# ~1.1 s after its marker write and read true.
#
# LIVE-PROVEN 2026-09-24. ARMED RE-FLIGHT `2026-09-23_2200` (same DLL, spec at 80dccb2f5):
# PASS attempt 1, wall 357 s, MISSION-OK, expectations mismatches 0 (every token below,
# `recorderLive=true` included), saveParse rewind PASS gating (rewindPoints 1,
# supersedeRows 1, tombstones 0), 9 recordings, analyzer red 0, unityExceptions total 0.
# NEGATIVE CONTROL DISCHARGED OFFLINE (the GS-9 / BDOCK-1 precedent), over that run's own
# bytes through the real evaluators, with no flight:
#   scratchpad `rf14_offline_negctl.py` (sha256 33953b74...) loads this spec through
#   run.load_all_specs and calls hlib.evaluate_expectations over the collected KSP.log
#   (sha256 e32c1b87...):
#     INTACT                                        PASS, 0 mismatches
#     log edited to the zombie world (the F9 sweep reads `valid=False; spare=0
#       discarded=1`)                              FAIL, exactly 2: the spare token and
#                                                   the discarded=[1-9] forbid
#     marker rp= edited to a different point       FAIL, exactly 1: the carried-point
#                                                   backreference
#     the `Marker valid sess=` line deleted        FAIL, exactly 2: both backreferences
#   and `rf14_rewind_negctl.py` over the produced save through
#   saveparse.evaluate_save_structure: supersedeRows {0,0} FAIL `rewind.supersedeRows 1 >
#   max 0`, rewindPoints {0,0} FAIL `rewind.rewindPoints 1 > max 0`, intact PASS.
# RE-FLIGHT `2026-09-23_2223` after the review doubled the idle to 24 steps (DLL sha256
# 82ed3f48, branch source with origin/main merged): PASS attempt 1, wall 350 s,
# expectations 0 mismatches, saveParse rewind PASS (1 / 1 / 0), 9 recordings.
# WHAT THE OFFLINE CONTROL DOES NOT PROVE: it exercises the evaluator against real
# bytes, not a second product, so it cannot witness a product change between runs.
# =====================================================================================
tier = "operator"
description = "Ghost-replay Tier B item 7, Rewind-to-Launch x Re-Fly: fly GS-4's staged Kerbal X so the core split authors a two-slot RewindPoint, commit, Rewind-to-Launch (the point survives, PR #1788), let the watcher's replay carry the clock past the split, Re-Fly the core's slot off the carried point, then quicksave and quickload in the middle of that re-fly and pin that LoadTimeSweep validated the live marker against the carried point and spared the session's provisional, before the merge concludes it with no zombie left."
instanceProfile = "stock-minimal"
tags = ["RF-14", "rewind", "rewind-to-launch", "refly", "load-time-sweep", "quicksave",
        "quickload", "runtime-handles", "kerbin", "sandbox"]

[fixture]
# GS-4's host and GS-4's reasons (see that spec): the forge pad save, whose Ships/VAB
# carries the Kerbal X the mission flies and the Jumping Flea it launches as the watcher.
saveTemplate       = "fixtures/saves/gs1-two-stage-pad"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "kx_rewind_watch"

# `steps` MUST stay in [driver], ABOVE the [driver.missionParams] header.
#
# ACT 1 (the mission, GS-4 byte for byte): fly, commit, Rewind-to-Launch, watcher on the
#   pad, replay walked past commitUT. `autoMerge=true` and `autoRecordOnLaunch=true` are
#   GS-4's load-bearing settings; the mission turns auto-record OFF before the watcher.
#   `ghostRenderTracing` is left out: this lane asserts nothing about ghost meshes.
# ACT 2 (the re-fly off the carried point): read the point back through a LABELLED
#   enumeration and re-fly slot 1 (`Kerbal X Probe`, unmanned, the slot CI-3 re-flies
#   on the same craft). `StopRecording` is idempotent hygiene: the watcher is unrecorded.
# ACT 3 (the F5/F9): SaveGame quicksave, then LoadGame of it through RF-3/A1's opt-in
#   `allowLiveRecorder=refly` (S4.4's and CI-3's exact pair). That load's OnLoad runs
#   the sweep with the session live - the subject.
# ACT 4: merge. The conclusion's scene exit runs one more sweep with the marker gone,
#   which must find nothing NotCommitted left to discard.
steps = [
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "SetSetting",        args = { name = "autoRecordOnLaunch", value = "true" },  expect = "OK" },
  { cmd = "SetSetting",        args = { name = "autoMerge", value = "true" },           expect = "OK" },
  { cmd = "SetSetting",        args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { phase = "mission",                                                                   expect = "MISSION-OK", budget = 1600 },
  # --- ACT 2: re-fly the core's slot off the point the rewind carried -------------------
  { cmd = "StopRecording",                                                               expect = "OK" },
  { cmd = "ListHandles",       args = { kind = "rewindpoints" }, label = "handles",      expect = "OK" },
  { cmd = "InvokeRewind",      args = { rp = "${handles.rp0}", slot = "1" },             expect = "OK", budget = 300 },
  # ~6 s of 1x time so the re-fly recorder binds (OnFlightReady, measured ~2 s after the
  # marker write) before the F5, with margin; see the reading-run note in the header.
  # Doubled from 12 steps in review 2026-09-24 (12 left ~1 s over the measured bind).
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "RecordingState",                                                              expect = "OK" },
  # --- ACT 3: F5 / F9 in the middle of the re-fly ----------------------------------------
  { cmd = "SaveGame",          args = { name = "quicksave" },                            expect = "OK" },
  { cmd = "LoadGame",          args = { save = "${runSave}", name = "quicksave", allowLiveRecorder = "refly" }, expect = "OK", budget = 300 },
  # --- ACT 4: conclude --------------------------------------------------------------------
  { cmd = "AnswerMergeDialog", args = { choice = "merge" },                              expect = "OK", budget = 120 },
  { cmd = "RecordingState",                                                              expect = "OK" },
  { cmd = "FlushAndQuit",                                                                expect = "OK" },
]

# GS-4's three names, and nothing else: every other key takes the machine default GS-4
# flies on, so ACT 1 is the flight GS-4 has measured green.
[driver.missionParams]
craftName        = "Kerbal X"
launchSite       = "LaunchPad"
watcherCraftName = "Jumping Flea"

[dimensionsCovered]
# CLAIM-IS-NOT-GATE; every value is backed by a REQUIRED token below, measured on the
# reading run `2026-09-23_2147`.
# `load-time-sweep` <- the F9's two `LoadTimeSweep.Run` lines: `Marker valid sess=...`
#   (the accept branch of the marker validation, on a non-null marker, with rp= tied by
#   backreference to the point the rewind carried) and `[LoadSweep] Marker valid=True;
#   spare=1 discarded=0` (the spare-set decision), plus the consequence token (the
#   recorder resumes on that session's active recording). SCOPE, stated so nobody
#   overreads it: this is the sweep's marker-validation + spare-set half. The zombie
#   discard, the invalid-marker clear and the session-scoped RP discard are not driven
#   here (see the header: (3), and possibly one path to (2), are reachable in other
#   shapes), and the `discarded=[1-9]` forbid is all this lane says about them: none fired.
# `rewind-to-launch` <- "Rewind-to-Launch initiated to UT" + "invokerewindtolaunch
#   complete rec=" (re-claim, GS-4's tokens).
# `rewind-to-separation` <- the StartInvoke backreference + "Invocation complete"
#   (re-claim).
D9 = ["rewind-to-launch", "rewind-to-separation", "load-time-sweep"]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# MEASURED 9 on the reading run: GS-4's structural 8 (pod stack + 6 booster debris + the
# core child) plus the re-fly's in-place fork of the core's slot, which the merge keeps.
count = { min = 9, max = 9 }

[expectations.logContracts]
# ORDERED AS THE MECHANISM RUNS.
#
# PRECONDITION (GS-4's measured lines): the split authors a two-slot point, the commit
# opens slot 1, the rewind carries the point across its reload.
#
# THE CARRIED POINT IS THE ONE RE-FLOWN AND THE ONE VALIDATED (backreference). \1 is the
# rp id the carry-over line names; the StartInvoke line and the sweep's marker line must
# both name the same id. A run that re-flew some other point, or whose marker validated
# against a point the save re-read rather than the carried one, cannot satisfy it.
#
# THE SUBJECT, two lines of `LoadTimeSweep.Run`, both on the F9's OnLoad:
#   `Marker valid sess=... rp=...`  (Info, ReFlySession) - printed only on the branch
#       where `MarkerValidator.Validate` passed on a NON-null marker; a null marker takes
#       neither branch, an invalid one prints `Marker invalid field=`.
#   `[LoadSweep] Marker valid=True; spare=1 discarded=0` - the summary: the session's
#       provisional was put in the spare set and NOTHING was discarded. Without the
#       valid marker the same provisional is `MergeState.NotCommitted` with no spare
#       entry, i.e. exactly the zombie the discard pass removes (`discarded=1`).
#
# THE CONSEQUENCE AND THE CONCLUSION: the recorder resumes on the spared session, and the
# merge ends it.
required = [
  "RewindPoint begin: rp=\\S+ bp=\\S+ slots=2 controllablePids=2",
  "CommitTree promoted rec=\\S+ vessel='Kerbal X Probe' slot=1 rp=\\S+ reason=stableLeafUnconcluded to CommittedProvisional",
  "Rewind-to-Launch initiated to UT",
  # Whole counter tuple pinned (known-gate 17): the launch save predates the RP
  # (loadedFromSave=0), the one carried RP is restored, and none is dropped as stale;
  # all four archived runs read exactly this.
  "RewindPoints carried across rewind: installed=1 loadedFromSave=0 restored=1 staleDropped=0 ",
  "invokerewindtolaunch complete rec=",
  "listhandles kind=rewindpoints count=1 truncated=false",
  "RewindPoints carried across rewind: installed=1 [^\\r\\n]*\\[(rp_[0-9a-f]{32})@[\\s\\S]*?Re-Fly \\(Rewind-to-Separation\\) StartInvoke: sess=\\S+ rp=\\1 slot=1[\\s\\S]*?Marker valid sess=\\S+ tree=\\S+ active=\\S+ origin=\\S+ rp=\\1 ",
  "Invocation complete",
  "loadgame start save=\\S+ name=quicksave [^\\r\\n]*allowLiveRecorder=refly recorderLive=true",
  "\\[LoadSweep\\] Marker valid=True; spare=1 discarded=0 ",
  # THE SPARED SESSION IS THE ONE THAT KEPT FLYING (backreference): the recorder that
  # resumes after the F9 resumes on the marker's active recording, inside the session the
  # sweep validated. Had the sweep discarded that provisional there would be no activeRec
  # to resume on. Measured on the reading run (`Quickload resume prep: activeRec=
  # 'rec_26cbe71e...' ... (refly-active sess=sess_ffd67652...`).
  "Marker valid sess=(sess_[0-9a-f]{32}) tree=\\S+ active=(rec_[0-9a-f]{32}) [\\s\\S]*?Quickload resume prep: activeRec='\\2' [^\\r\\n]*\\(refly-active sess=\\1 ",
  # MEASURED on the reading run: the merge journal concludes the session.
  "End reason=merged sess=sess_[0-9a-f]{32} provisional=rec_[0-9a-f]{32}",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The F9 must not END the session (S4.4's question, answered there: it does not).
  "End reason=treeDiscarded",
  # No marker in this run may fail validation: the only marker is the live session's.
  "Marker invalid field=",
  # NO ZOMBIE ANYWHERE IN THE RUN. Every sweep line must say discarded=0: a nonzero count
  # on the F9 means the spare set missed the provisional, and on the post-merge load it
  # means the conclusion left a NotCommitted recording behind.
  "\\[LoadSweep\\] Marker valid=(?:True|False); spare=[0-9]+ discarded=[1-9]",
  # The re-fly must not have been refused by the future gate: the watcher's replay is
  # what carries the clock past the split, and a refusal here means it did not.
  "refly-gate This separation is in your future",
]

# ARMED 2026-09-24 off the reading run `2026-09-23_2147` (saveParse rewindPoints 1,
# supersedeRows 1, tombstones 0), each number the derivation predicted:
#   rewindPoints  {1,1}: the merge closes slot 1 only; slot 0 (the pod stack) stays open,
#                 so the reaper keeps the point the rewind carried.
#   supersedeRows {1,1}: the re-fly's in-place fork supersedes the core's priorTip, one
#                 row, and nothing rolls it back (no rewind follows the merge).
#   tombstones    nobody dies: the re-flown core is unmanned and the pod never lands.
[expectations.rewind]
gating        = true
rewindPoints  = { min = 1, max = 1 }
supersedeRows = { min = 1, max = 1 }
tombstones    = { max = 0 }

[runtime]
# GS-4's 2400 (boot + LoadGame 300 + mission 1600 + margin) plus the post-mission steps
# at run.py's pricing: StopRecording 120 + ListHandles 120 + InvokeRewind 660 + the idle
# RecordingState x24 2880 + SaveGame 120 + LoadGame 660 + AnswerMergeDialog 180 +
# RecordingState 120 = 4860. 7400 clears it. The armed run's whole wall was ~6 min.
budgetSeconds = 7400

[retry]
policy = "once"

[expectedFail]
bugId = ""
