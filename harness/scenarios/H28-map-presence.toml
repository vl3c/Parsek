schema = 1
id = "H28-map-presence"
tier = "nightly"
# BATCH-ONLY scenario, H7-H20 shape. Inventory bucket B6, wave 2.
#
# WHAT IT COVERS, as MEASURED on 2026-08-05 (run `2026-08-05_1855`) rather than
# as derived: the SYNTHETIC half of the ghost map-presence surface - the
# same-body ghost TARGETING path (create ghost, set as stock map target, verify
# it sticks across the hosted verification coroutine) and the chain-ghost
# reverse-map write/clear pair. Those two cells build their own ghost and are
# fixture-independent.
#
# WHAT IT DOES NOT COVER, corrected 2026-08-05 against a measured run: the
# LIVE-lifecycle half - the pid -> proto-vessel resolution invariant and pid
# collision against real vessels. The pre-2026-08-05 comment here reasoned that
# because flight-map ghost presence is driven every FLIGHT frame regardless of
# map view (ParsekFlight -> DriveMapPresence -> UpdateFlightMapGhostLifecycle),
# a FLIGHT batch must exercise the real lifecycle. It does not:
# GhostMapPresence.ghostMapVesselPids was EMPTY at batch time on the measured
# run, with the corpus injected, so both cells honestly Skip. See the fixture
# note for what that means for the injection rationale.
description = "Run the in-game MapPresence category unattended over the 274-recording injected corpus: synthetic same-body ghost map targeting and the chain-ghost reverse map execute; the two live-lifecycle cells (pid->ProtoVessel resolution, pid collision vs real vessels) Skip on an empty ghost-map pid set, as measured."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "map-presence", "B6", "H28"]

[fixture]
# gloops-airshow + all-synthetic.
#
# CORRECTED 2026-08-05 BY MEASUREMENT - read this before re-deriving the old
# claim. This comment used to assert that the injection "changes the run's
# MEANING without changing its tally": that two of the five cells
# (GhostPidsResolveToProtoVessels, NoPidCollisionWithRealVessels) bail on an
# empty ghostMapVesselPids which the batch-start PerformBetweenRunCleanup
# empties, that under all-synthetic live ghosts respawn within frames of batch
# start, and that the corpus count pin below was therefore "the proof the walk
# had something to walk". THE FIRST HALF IS TRUE AND THE SECOND IS NOT. Run
# `2026-08-05_1855` measured both cells SKIPPING on an empty ghostMapVesselPids
# WITH the all-synthetic corpus injected: no ghost acquires map presence during
# the driven FLIGHT batch, so nothing repopulates the set that
# PerformBetweenRunCleanup emptied. (The same-session evidence that the corpus
# genuinely landed: AntennaSpecsProduceRelayPower's skip message reports it
# walked 306 committed recordings, and the produced save carried the then-pinned 272;
# both are +2 as of 2026-08-11 - see the count pin's derivation note.)
# The old passed=5 pin was itself the vacuous-pass evidence - it was green
# BECAUSE the two cells returned silently, which is exactly the fourth trap the
# W2-VACUOUS-CELLS conversion turned into honest Skips.
#
# WHAT THE INJECTION STILL BUYS, so it is not reverted to "none": the 274-row
# corpus loads through the sidecar path under the schema gate (the count pin
# below, and the D16 claim that rests on it), and AntennaSpecsProduceRelayPower
# walks all 308 committed recordings for antenna specs rather than an empty
# store - a real, if negative, sweep. What it does NOT buy is ghost map presence.
# Making cells 1-2 REAL needs whatever creates ghost map presence in a driven
# batch (deferred follow-up in todo-and-known-bugs.md, W2-VACUOUS-CELLS), not a
# different injectedRecordings value.
#
# WHAT INJECTION DOES NOT FIX, so nobody re-derives it: AntennaSpecsProduceRelayPower
# is vacuous under EVERY committed asset - no generator ever sets
# Recording.AntennaSpecs (grep Source/Parsek.Tests/Generators: zero writers), so
# the D6 commnet-relay cell stays unclaimable off this spec. Closing it is
# generator work (a RecordingBuilder.WithAntennaSpecs), not spec authoring.
# Filed in the wave notes in todo-and-known-bugs.md.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "all-synthetic"
craft = []

[driver]
kind = "seam"
# NO isolated arg: all 5 declarations are AllowBatchExecution (default) with no
# restore flag - identical admission either way.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "MapPresence" },                expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                   expect = "OK" },
]

[dimensionsCovered]
# D6 ghost-map-presence is claimed on direct exercise, NARROWED 2026-08-05 to
# what the measured run actually executes: the chain-ghost CreateGhostVessel,
# CreateGhostVesselForRecording (called DIRECTLY by the targeting cell, not via
# the DriveMapPresence driver), SetGhostMapNavigationTarget and the
# pid->recordingId reverse map all run under the pinned tally, driven by the two
# cells that pass. S1.4 already claims the
# same cell, so this adds backing depth rather than new coverage - stated so the
# coverage report's reader is not misled.
# WHAT THIS CLAIM NO LONGER RESTS ON, stated in the same style as the unclaimed
# commnet-relay note below rather than left standing silently: the LIVE-lifecycle
# path (CreateGhostVesselForRecording reached through DriveMapPresence ->
# UpdateFlightMapGhostLifecycle) is NOT exercised here. The two cells that read
# its output - GhostPidsResolveToProtoVessels, NoPidCollisionWithRealVessels -
# measurably Skip on an empty ghostMapVesselPids (see the fixture note). The
# claim survives on the synthetic-ghost half alone, which is genuine
# ghost-map-presence exercise; it is thinner than the pre-2026-08-05 wording
# implied, and S1.4 remains the cell's first claim.
# NOT claimed: D6 commnet-relay (see the fixture note - the only cell that would
# back it is vacuous under every committed asset).
D6  = ["ghost-map-presence"]
D14 = ["sandbox", "scene-flight"]
D16 = ["sidecar-prec", "schema-gate"]

[expectations]
# PLACEMENT IS LOAD-BEARING (see H7).
allowedAnomalies = []

[expectations.recordings]
# The corpus pin, exactly as H14-H17 carry it. If the corpus size moves,
# re-derive here AND in H5 / H14 / H15 / H16 / H17 / H27 / S1.4 in one commit.
# NOTE 2026-08-11 (recorded-signal-fixes): the shared InjectAllRecordings corpus
# grew 272 -> 274 (chute-repack + surface-rover showcase rows). This pin moved by
# DERIVATION (+2), not re-measurement; if it reds on the next flight, read the
# actual count off the collected KSP.log before touching anything else.
count = { min = 274, max = 274 }

[expectations.logContracts]
# ANTI-VACUITY: tally pinned WHOLE.
#
# EVIDENCE STANDING: MEASURED, RE-MEASURED 2026-08-05 AFTER A DELIBERATE MOVE.
# First flown 2026-08-04 (run `2026-08-04_2210_H28-map-presence`: PASS on
# attempt 1, 70 s wall, mismatches=0) against the previous pin
# `total=5 passed=5 failed=0 skipped=0`. That PASS is now understood as VACUOUS
# EVIDENCE, not retracted evidence: three of the five cells were reporting
# PASSED having asserted nothing, and the whole-tally pin is blind to that
# because the attribute derivation does not scan method bodies. The
# W2-VACUOUS-CELLS conversion (branch `vacuous-cells-conversion`, 2026-08-05)
# turned all three into honest InGameAssert.Skips, which moves the split.
#
# The pin below is the line run `2026-08-05_1855_H28-map-presence` PRINTED, read
# token-for-token out of the collected `KSP.log`
# (`../logs/2026-08-05_2156_H28-map-presence/`). That run classified
# PARSEK-FAIL, and the reason is the point: its SOLE verifier mismatch was
# `logContracts.required not matched` against the stale passed=5 pin above -
# batchComplete PASS, testResults PASS (0 failures), analyzer PASS (red=0),
# logValidate PASS, anomalySweep PASS with zero hits, expectations' observed
# recordings.count=272 on the nose (274 as of 2026-08-11 - see the count pin),
# ledgerOracle SKIPPED, saveParse/unityExceptions
# REPORT with zero exceptions. So the flight was clean and the NUMBER was stale;
# this commit moves the number to what was measured, and does NOT adjust it by
# prediction. CONFIRMED GREEN against the new pin the same day: run
# `2026-08-05_1915_H28-map-presence`, PASS on attempt 1, every verifier
# PASS/SKIPPED - the runner printed the pinned line token for token.
#  - total=5 is ATTRIBUTE-EXACT and UNMOVED: 5 [InGameTest(Category =
#    "MapPresence")] declarations (3 AnyScene + 2 FLIGHT). Kept in sync by
#    CommittedBatchTallySourceSyncTests.
#  - skipped=3 is MEASURED, not derived. The ATTRIBUTE floor is still 0 (nothing
#    scene-skips at FLIGHT, nothing is batch-disabled); all three are run-time
#    InGameAssert.Skip firings, declared in
#    IngameBatchWiringGroupTests.RUNTIME_SKIPS so the group's floor cell models
#    them instead of reding on a correct pin. Named, with the fixture property
#    each one states:
#      * GhostPidsResolveToProtoVessels - "no ghost map vessels registered in
#        GhostMapPresence.ghostMapVesselPids". The set is empty for the whole
#        driven batch even under the injected corpus (see the fixture note).
#      * NoPidCollisionWithRealVessels - same empty set; its collision walk
#        would compare every real vessel against nothing.
#      * AntennaSpecsProduceRelayPower - walked all 306 committed recordings (308 as of
#        2026-08-11) and
#        none carries AntennaSpecs, because no generator ever sets it. Corpus-
#        INDEPENDENT, so no injectedRecordings value fixes it (see the fixture
#        note); D6 commnet-relay stays unclaimed.
#  - failed=0 is the ASSERTION.
#  - passed=2 follows, and is the honest count of cells that executed real
#    assertions: ChainGhost_ReverseMap_WrittenOnCreate_ClearedOnRemove (16.4 ms)
#    and GhostMapVesselTargeting_SyntheticSameBodyGhost_Sticks (84.5 ms). The
#    targeting cell was the derivation's predicted first-flight red on 2026-08-04
#    and has now held across two unattended runs.
#  - scene=FLIGHT is the gloops-airshow Focusable route, MEASURED by H13 / H5 /
#    S1.4 on this exact fixture.
required  = ["BATCH_COMPLETE v1 total=5 passed=2 failed=0 skipped=3 category=MapPresence scene=FLIGHT"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
