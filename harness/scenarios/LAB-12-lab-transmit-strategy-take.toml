[expectations.recordings]
# Nothing records: auto-record is off and a pad flight records only on launch.
count = { min = 0, max = 0 }

[expectations.logContracts]
required = [
  # --- THE SPACE CENTER: the activation, its setup cost, as a player click ---
  "kscaction action=activate-strategy target=PatentsLicensingCfg applied=true manifestKind=strategy-activate observedAfter=factor=0\\.05 slots=1/1 setupFunds=0 setupSci=263\\.2[0-9]* setupRep=0 fundsDelta=0 ",
  "Game state: StrategyActivated 'PatentsLicensingCfg' title='Patents Licensing' dept='[^']*' factor=0\\.05 setupFunds=0 setupSci=263\\.[23] setupRep=0\\.0",
  "(?s)MISSIONMARK label=lab12-ksc (?:(?!MISSIONMARK label=lab12-flight ).)*?Game state: ScienceChanged -263\\.[23] \\(StrategySetup\\)[^0-9\\r\\n]+136\\.[78](?![0-9])",
  # --- THE PAD: the lab as seeded ---
  "(?s)MISSIONMARK label=lab12-flight (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=204\\.00;Research:active=0'",
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!partaction applied button=).)*?partaction applied button=labtransmit pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*event=TransmitScience [^\\r\\n]*state='lab:storedScience=12\\.50 dataStored=204\\.00;",
  # --- THE TRANSMIT, inside its window ---
  # Stock's converter takes 5 % of the gross ...
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?\\[CurrencyConverter for Patents Licensing\\]: 0\\.625 Science taken, yields 5[0-9.]+ Funds",
  # ... Parsek's query-family door reads it off the query: science -0.625, funds +52.5x ...
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?Game state: strategy currency conversion - reason=ScienceTransmission inF=0 dF=5[0-9]\\.[0-9]+ inS=12\\.5 dS=-0\\.625 inR=0 dR=0 legs=2",
  # ... and books it ONCE as a strategy science debit plus a strategy funds earning, untagged.
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?Strategy conversion recorded: type=StrategyScienceDebit, currency=Science, delta=-0\\.625, UT=[0-9.]+, reason=ScienceTransmission(?:, recordingId=\\(none\\))?\\r?\\n",
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?Strategy conversion recorded: type=FundsEarning, currency=Funds, delta=5[0-9]\\.[0-9]+, UT=[0-9.]+, reason=ScienceTransmission(?:, recordingId=\\(none\\))?\\r?\\n",
  # Stock's R&D gain is the NET 11.875 (136.75 -> 148.625), the funds the yield ...
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?Game state: ScienceChanged \\+11\\.[89] \\(ScienceTransmission\\)[^0-9\\r\\n]+148\\.6(?![0-9])",
  # (the +52.5 funds yield sits under GameStateRecorder's 100-funds threshold, so stock's
  # FundsChanged for it is logged only as ignored; the ledger row above carries it)
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?Ignored FundsChanged delta=\\+5[0-9]\\.[0-9] below threshold=100\\.0",
  # Stock completes the fresh career's first-science milestone at the same transmission
  # (measured on the first flight); the converter takes no science from a funds-only award.
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?Game state: MilestoneAchieved 'Kerbin/Science'",
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?Game state: FundsChanged \\+1600 \\(Progression\\)",
  # ... the capture sees the pool move by less than the gross ...
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?\\[ScienceLabCapture\\] Lab payout net of a strategy take: gross=12\\.5 poolDelta=11\\.87[0-9]* reason='ScienceTransmission'",
  # ... and books the GROSS 12.50 lab credit, untagged, as a KSC row.
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?Game state: ScienceLabCredited \\+12\\.50 reason='ScienceTransmission' vessel='LABX Orbital Lab' ut=[0-9.]+ recordingId=''",
  "(?s)MISSIONMARK label=lab12-t-before (?:(?!MISSIONMARK label=lab12-t-after ).)*?KSC spending recorded: type=ScienceLabEarning, UT=[0-9.]+, key=ScienceTransmission",
  # The lab keeps the fraction (the take is out of the pool's gain, never out of the lab).
  "(?s)MISSIONMARK label=lab12-t-after (?:(?!partaction applied button=).)*?partaction applied button=inspect pid=2200110055 part='Large\\.Crewed\\.Lab' [^\\r\\n]*state='lab:storedScience=0\\.50 dataStored=204\\.00;",
  # --- THE LEDGER CLOSES against KSP's own save ---
  # The never-flown interim pin: total exact, the split regexed (predicted passed=2 skipped=1);
  # the `result:` line below exists only if the harness cell itself ran rather than skipped.
  "BATCH_COMPLETE v1 total=3 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 reportOnly=[0-9]+ facetsCompared=[0-9]+ strict=False",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "partaction rejected",
  "partaction error ",
  "kscaction refused",
  "warptout refused",
  "GUARDED UPLIFT clamped",
  "GUARDED DRAWDOWN clamped",
  # Exactly one lab credit, and none before the press.
  "(?s)(?:Game state: ScienceLabCredited .*?){2}",
  "(?s)\\A(?:(?!MISSIONMARK label=lab12-t-before ).)*?Game state: ScienceLabCredited",
  # The credit is the gross, never the net.
  "Game state: ScienceLabCredited \\+11\\.",
  # The take is read off the query once, and booked once.
  "(?s)(?:Game state: strategy currency conversion - reason=ScienceTransmission .*?){2}",
  "(?s)(?:Strategy conversion recorded: type=StrategyScienceDebit[^\\r\\n]*reason=ScienceTransmission.*?){2}",
  "(?s)(?:Strategy conversion recorded: type=FundsEarning[^\\r\\n]*reason=ScienceTransmission.*?){2}",
  # Nothing on a ScienceTransmission reason before the press.
  "(?s)\\A(?:(?!MISSIONMARK label=lab12-t-before ).)*?\\(ScienceTransmission\\)",
  "(?s)\\A(?:(?!MISSIONMARK label=lab12-t-before ).)*?reason=ScienceTransmission",
  # A second stock R&D gain on the transmission (only the zero-delta echo, which Parsek ignores).
  "(?s)(?:Game state: ScienceChanged \\+[^\\r\\n]*\\(ScienceTransmission\\).*?){2}",
  "Exploded!!",
]

