  "phase=MeshDestroyed [^\\r\\n]*vessel=Part Showcase - [^\\r\\n]*reason=(?:playback completed|stale past-end ghost \\(no longer held\\))",

  "Applied [0-9]+ part events for ghost #[0-9]+ \\(evtIdx now [0-9]+\\)",

  "Part pid=[0-9]+: applied heat level (?:Hot|Medium|Cold)",
  "FX magnitude \\(engine\\) pid=[0-9]+ midx=[0-9]+ power=",
  "FX magnitude \\(rcs\\) pid=[0-9]+ midx=[0-9]+ power=",
]
# The suite-wide ERROR pattern, PLUS the per-part resolution floor (code fact 4). The
# second is the strongest single expression of "check if the parts get rendered": one
# showcase part whose prefab `PartLoader` cannot find reds the run and NAMES the part.
# [INTERIM on the second token only] - reading run 1 built no ghost, so this path never
# ran and its silence there proves nothing. Its one way to red for a non-Parsek reason
# (a profile missing an expansion) is written out in code fact (4) so a reader can tell
# the two apart in one grep.
forbidden = ["\\[Parsek\\]\\[ERROR\\]",
             "ResolveAvailablePart failed for '"]

# REPORT-ONLY (gating defaults false; arming is a separate operator decision through
# GHOSTLIFE_ARMED_SPECS in harness/lib/test_hlib.py, after a reading run whose facets
# match this window). THE CENSUS: `spawned` counts DISTINCT recordings that emitted a
# MeshSpawned line, so a floor of 243 is the statement "every showcase row rendered a
# ghost mesh" - the whole eyeball pass, in one number, which no regex can express
# because the recIds are fresh GUIDs. Reading run 1 measured 0 for a TIMING reason; the
# floor is unchanged, because the number it asserts was never the thing in doubt.
#
# `requireBalanced` FLIPS ON, and only because reading run 1 changed the mechanism
# reading. v1 set it false on the argument that these rows self-overlap and demote
# primaries without destroying them; the run refuted that at the source
# (`SanitizeNonLoopableLoopPlayback` strips the loop flag from all 243), so what is
# actually playing is 243 ORDINARY one-shot windows that END - and an ended window
# destroys its ghost. The staircase above deliberately lands past 81.16 so the endings
# happen inside the run rather than at teardown. If reading run 2 shows unbalanced rows,
# read the reason census before touching this: a short dwell and a leaked mesh look
# nothing alike in the report.
[expectations.ghostLifecycle]
# ARMED 2026-08-28 after reading runs 2 and 3 (`2026-08-28_2010` red only on
# the since-cut colour-changer token, `2026-08-28_2014` green, PASS attempt 1) BOTH
# measured spawned=243 spawnLines=243 destroyLines=243 unbalanced=0 - the
# exact census, twice, with every window already met. Armed re-flight and
# negative-control ids in GHOSTLIFE_ARMED_SPECS (harness/lib/test_hlib.py).
gating = true
spawned = { min = 243 }
requireBalanced = true

[runtime]
# WALL clock for the whole drive phase including KSP boot. Reading run 1's shape,
# measured: boot + two LoadGames + ~8 probes fitted comfortably inside 1500 s. The added
# work is 5 TimeJumps (~2 s each at the seam) and 33 more probes (0.253 s each,
# MEASURED) = ~20 s, so the budget is untouched and remains a kill backstop rather than
# a target.
budgetSeconds = 1500

[retry]
