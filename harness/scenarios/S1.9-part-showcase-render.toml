count = { min = 243, max = 243 }

[expectations.logContracts]
# GROUPS, ordered as the run emits them. ERROR is UPPERCASE in ParsekLog.Write and the
# patterns are case-sensitive. Every pattern below avoids non-ASCII: the product message
# that contains an em dash (`ResolveAvailablePart failed for ... - all lookups
# exhausted`) is pinned on its ASCII prefix only, deliberately, so the contract cannot
# break on an encoding.
#
# GROUP 1 - THE CORPUS IS THE SHOWCASE CORPUS, AND IT IS NOT A LOOPING ONE.
# [MEASURED - reading run 1, verbatim] `SanitizeNonLoopableLoopPlayback` clears
# LoopPlayback on every row that fails `Recording.IsLoopableRecording`, and it reported
# exactly 243. Pinning the COUNT ties the token to the corpus size, and pinning the line
# at all keeps the premise the whole window arithmetic rests on under a gate: if the
# sanitizer ever stops firing, these rows become loops, the window stops ending, and the
# derender half of this spec silently changes meaning. THIS TOKEN REPLACES v1'S TWO LOOP
# TOKENS, which were pinned on the opposite (and wrong) premise.
#
# GROUP 2 - THE JUMP LANDED. `timejump complete reachedUT=<R>` is the seam verb's own
# terminal, emitted only after `DecideJumpCompletion` sees the clock at the target. Its
# presence is what separates "no ghosts because nothing rendered" from "no ghosts because
# the clock never moved" on the NEXT reading run - the exact ambiguity that cost run 1.
# [DERIVED from ParsekTestCommandAddon.TimeJumpKscAction.cs]
#
# GROUP 3 - THE CENSUS, ONE REQUIRED TOKEN PER PART FAMILY. This is the lane. Each is
# `phase=MeshSpawned ... vessel=<row> reason=ghost-created` from
# `GhostPlaybackEngine.EmitMeshLifecycleTrace` + `GhostRenderTrace.BuildPrefix`; the
# trailing ` reason=ghost-created` is not decoration, it is the ANCHOR that stops a name
# prefix-matching a longer sibling ("Fairing Size 1" vs "Fairing Size 1.5",
# "Service Bay" vs "Service Bay 2.5", "LV-T30" vs "LV-T30 v2", "Parachute Mk16" vs
# "Parachute Mk16-XL", "Heat Shield 1" vs "Heat Shield 1.5",
# "Control Surface Airliner" vs "... Airliner Tail"). Every name is MEASURED LOCALLY:
# the injector's own asserts check all 26 of these strings byte for byte in the produced
# save, so a renamed row reds in `dotnet test` before it can red here. "Surface Rover
# Drive" is the one showcase-band row whose vesselName is not prefixed "Part Showcase - "
# (and the one whose clip runs 30 s rather than 24 - it is why the union window ends at
# 81.16). The families with no stock member (robotics, deployed science, robot arm
# scanners) are Breaking Ground parts - see code fact (4) for why they are expected to
# resolve. [DERIVED - run 1 built no ghost, so none of these has ever fired]
#
# GROUP 4 - THE DERENDER. A one-shot window ENDS, and the staircase deliberately lands
# past 81.16 so it ends before the quit. The two accepted reasons are the two a healthy
# past-end pass can produce: `ParsekPlaybackPolicy.HandlePlaybackCompleted` destroys with
# "playback completed", and the engine's own past-end sweep uses "stale past-end ghost
# (no longer held)" - GS-4 measured BOTH on its unwatched populations. Anything else
# fails the match and reds. [DERIVED]
#
# GROUP 5 - THE PART-EVENT APPLIER RAN AT ALL. `GhostPlaybackLogic.ApplyPartEvents`
# emits its aggregate only when `appliedCount > 0`, so this line existing IS the
# statement that recorded part events were applied to a ghost. VerboseRateLimited, which
# is why `verboseLogging` is pinned twice above. [DERIVED]
#
# GROUP 6 - THE FOUR FAMILIES THAT DO LOG THEIR APPLY (code fact 2). Heat levels render
# through `HeatLevel.ToString()`; the colour-changer state renders through
# `bool.ToString()` (capital True/False); the FX-magnitude `kind` is the literal
# "engine" or "rcs" and the line is suppressed entirely when nothing was scaled, so a
# match is proof a real emitter moved. [DERIVED]
required = [
  "SanitizeNonLoopableLoopPlayback: cleared LoopPlayback on 243 non-loopable recording\\(s\\)",

  "timejump complete reachedUT=",

  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Lights v1 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Solar Tracking reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Gear Bay reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Service Bay reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - LV-T30 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Ladder Bay reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - RCS RV-105 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Fairing Size 1 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Radiator Large reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Drill-O-Matic reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Deployed Central Station reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - ISRU reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Parachute Mk16 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Docking Port Shielded reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Heat Shield 1 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Robotics Hinge G-11 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Airbrake reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Robot Arm Scanner S1 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Control Surface Airliner reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Wheel Dynamics Rover M1 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - AnimateHeat Nacelle Body reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - ColorChanger Cupola reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Parachute Repack Mk16 reason=ghost-created",
  "phase=MeshSpawned [^\\r\\n]*vessel=Part Showcase - Inventory Placement reason=ghost-created",
