schema = 1
id = "RW-16-transmit-then-recover-earlier"
# =====================================================================================
# RW-16: A SUBJECT TRANSMITTED BY A COMMITTED FLIGHT, RECOVERED EARLIER AFTER A REWIND (the
# rewind ledger campaign, plan row 12).
#
# THE RULING UNDER TEST: science goes to the earliest earning in UT order, capped per subject
# (owner ruling 2026-10-26, design 12.6 / 12.7). SCI-1 flies recovery against recovery. This
# lane is transmission against recovery: the committed row is a TRANSMITTED one, and a rewound
# recovery of the same subject lands before it.
#
# WHAT THE CODE DOES (read 2026-10-31, main e96d2c9bb, ScienceModule.ProcessEarning): a subject
# is keyed by experiment and situation whatever the method. headroom = maxValue - creditedTotal,
# effective = min(awarded, headroom). So G's recovery walks first and takes the full value, and
# F's transmission walks second as `Earning (cap hit)` with only the remainder.
#
# THE SUBJECT: crewReport@KerbinSrfLandedLaunchPad. cs-career-mun4 holds mysteryGoo at the pad
# and no crew report there, and CS-2 measured the crew report transmitted by this mission
# (+1.5, one send, the pod's crew report is the craft's first experiment).
#
# THE CRAFT: `Flea Antenna` (CS-2's Flea with a Communotron 16-S and a 2HOT Thermometer), the one
# craft the mission can transmit from. The pod's INTERNAL antenna cannot send science.
#
# PLAN (UTs are the plan):
#   boot       LoadGame persistent at the Space Center; warp to 185800.
#   F          science_bench_recover, CS-2's keys: pad crew report and thermometer, the hop, the
#              landed sweep, ONE transmission (the crew report, ~200 s after launch), recovery.
#              Recorded by autoRecordOnLaunch, committed by the scene exit.
#   rewind     Rewind-to-Launch onto F: clock ~185785, before every F row.
#   G          Flea Antenna again, unrecorded (the stand-in aboard): the pod's crew report on the
#              pad, kept, and recovered at ~185805: an untagged earning before F's transmission.
#   crossing   warp at the Space Center past F's recovery: the walk gives G's recovery the full
#              value and F's transmission the remainder.
#   check      an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# THE POOLS. Funds differ by G's launch and recovery. Science does not: G earns what F's
# transmission gave up, so the pool after the crossing is the pool before the rewind.
#
# STATUS: LIVE-PROVEN 2026-10-31, `2026-10-31_0217` PASS attempt 1 (DLL c39bde83, main e96d2c9bb). F's hop transmitted its pad crew report
# (1.5 science, recordingId=F); the rewind landed at 185786.9; G's stand-in recovered the same report at
# 185805.4 (`KSC science recorded ... method=Recovered`). The walk gave the recovery the full 1.5 and logged
# the transmission `Earning (cap hit) ... awarded=1.5, effective=0, headroom=0, creditedTotal=1.5, maxValue=1.5`.
# Funds 157381.22, science 29.52 and rep 115 all ended as before the rewind; no take-back, no pool adjustment;
# LedgerGroundTruth 3/3 hardFailures=0; ledger_audit PASS.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, a transmitted subject recovered earlier after a rewind (plan row 12): on cs-career-mun4 a committed Flea Antenna hop transmits its pad crew report, a Rewind-to-Launch onto it, and a second Flea recovers the same report before that transmission: the walk gives the recovery the full value and the transmission only the remainder, credited science stays within the subject's cap, the science pool ends where the rewind began and LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-16", "career", "ledger", "rewind", "rewind-to-launch", "science", "transmit",
        "recovery", "editor", "ground-truth", "ingame-batch", "timeline-ops"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun4"
injectedRecordings = "none"
craft = []

[driver]
kind    = "autopilot"
mission = "science_bench_recover"

# Budget arithmetic: 300 LoadGame + 3 x 120 warps + 3 x (120 GoToEditor + 180 LaunchFromEditor)
# + 1440 mission + 300 rewind + 180 G's wait + 120 Recover + 4 x 120 SaveGame + 540 RunTests =
# 4360; runtime 5200 adds the inert steps and FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "true" },        expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoMerge", value = "true" },                 expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185800", maxRate = "100" },                     expect = "OK", budget = 120 },
  # ---- F: the hop; its pad crew report is transmitted after the landing ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Flea Antenna" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "f",             expect = "OK", budget = 180 },
  { phase = "mission",                                                                     expect = "MISSION-OK", budget = 1440 },
  # The recovery leaves FLIGHT, so the tree auto-commits at the scene exit.
  { cmd = "CommitTree",                                                                    expect = "REJECTED" },
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw16-f-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw16-01-after-f-commit" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw16-before-rewind" },                       expect = "OK" },
  # ---- the rewind onto F's launch ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw16-rewound" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw16-02-after-rtl" },                        expect = "OK", budget = 120 },
  # ---- G: the same crew report, recovered before F's transmission ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Flea Antenna" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "g",             expect = "OK", budget = 180 },
  { cmd = "PartAction",     args = { button = "experiment", part = "mk1pod.v2" },          expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "185805", maxRate = "1" },                       expect = "OK", budget = 180 },
  { cmd = "PartAction",     args = { button = "inspect", part = "mk1pod.v2" },             expect = "OK" },
  # From the Space Center marker: stock's recovery summary after a flight Recover holds warp.
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${g.pid}" },                                 expect = "OK", budget = 60 },
  { cmd = "MissionMark",    args = { label = "rw16-g-recovered" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw16-03-after-g-recovery" },                 expect = "OK", budget = 120 },
  # ---- the crossing of F's rows ----
  { cmd = "MissionMark",    args = { label = "rw16-before-crossing" },                     expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "186600", maxRate = "100" },                     expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw16-crossed" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw16-04-after-crossing" },                   expect = "OK", budget = 120 },
  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "186630" },                                      expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

# The flight half is CS-2's, key for key (the same hop off the same pad); only the credit is
# measured on funds, as L3 does in a career.
[driver.missionParams]
throttle                 = 1.0
apoapsisWindowMeters     = { min = 6000, max = 30000 }
chuteArmMaxRateMps       = 30
chuteFullDeployAltMeters = 2500
landedSituations         = ["LANDED", "SPLASHED"]
ascentTimeoutSeconds     = 90
coastTimeoutSeconds      = 180
descentTimeoutSeconds    = 360
padExperiments           = ["crewReport", "temperatureScan"]
padCollectTimeoutSeconds = 60
flightExperiments        = ["mysteryGoo"]
collectMinExperiments    = 4
collectTimeoutSeconds    = 120
# One send, in part order: the pod's crew report (the craft's first experiment).
transmitMaxExperiments = 1
transmitMinScienceGain = 0.5
transmitTimeoutSeconds = 120
recoverMinFundsGain   = 1.0
recoverTimeoutSeconds = 180

[dimensionsCovered]
D8  = ["funds", "science", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 34 recordings plus F's hop; G and the check launch are unrecorded. Measured on `2026-10-31_0217`.
count = 35

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",

  # ---- before the rewind the transmission is the earning ----
  "\\[ScienceModule\\] Earning: subject=crewReport@KerbinSrfLandedLaunchPad, [^\\r\\n]*recordingId=[0-9a-f]{32}[\\s\\S]*?MISSIONMARK label=rw16-before-rewind ut=",

  # ---- the rewind lands before F's rows ----
  "MISSIONMARK label=rw16-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw16-rewound ut=1857[0-9]{2}\\.",

  # ---- G's recovery earns it, an untagged row ----
  "MISSIONMARK label=rw16-rewound ut=(?:(?!MISSIONMARK label=rw16-g-recovered )[\\s\\S])*?KSC science recorded: subject='crewReport@KerbinSrfLandedLaunchPad'",

  # ---- the walk: the recovery has the full value, the transmission only the remainder ----
  "MISSIONMARK label=rw16-before-crossing ut=[\\s\\S]*\\[ScienceModule\\] Earning: subject=crewReport@KerbinSrfLandedLaunchPad, [^\\r\\n]*recordingId=\\(none\\)",
  "MISSIONMARK label=rw16-before-crossing ut=[\\s\\S]*\\[ScienceModule\\] Earning \\(cap hit\\): subject=crewReport@KerbinSrfLandedLaunchPad, [^\\r\\n]*recordingId=[0-9a-f]{32}",

  # ---- the science pool ends where the rewind began ----
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\S+ science=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw16-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\S+ science=\\1 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw16-crossed ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=",
  "invokerewindtolaunch refused",
  # ---- the transmission never takes the subject again once the recovery walks first ----
  "MISSIONMARK label=rw16-before-crossing ut=[\\s\\S]*\\[ScienceModule\\] Earning: subject=crewReport@KerbinSrfLandedLaunchPad, [^\\r\\n]*recordingId=[0-9a-f]",
  "\\[TakeBack\\] Took back ",
  "take-back shortfall",
  "Game state: ContractCompleted ",
  "Game state: ContractFailed ",
]

[runtime]
budgetSeconds = 5200

[retry]
policy = "once"

[expectedFail]
bugId = ""
