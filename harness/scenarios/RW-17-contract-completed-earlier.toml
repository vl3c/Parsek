schema = 1
id = "RW-17-contract-completed-earlier"
# =====================================================================================
# RW-17: A MULTI-PARAMETER CONTRACT COMPLETED EARLIER AFTER A REWIND (the rewind ledger campaign,
# plan row 16, "Two-part contract").
#
# THE RULING UNDER TEST: one outcome pays once, the earliest crossing wins; a plain Rewind-to-Launch
# only moves the clock. F completes the contract; after the rewind G completes the same contract
# earlier.
#
# WHAT THE CODE DOES (read 2026-10-31, main e96d2c9bb, ContractsModule.ProcessComplete): the walk
# credits the first completion row in UT order; a later one is zeroed
# (`Complete: contractId=... effective=false (already credited)`), with G's row as its witness,
# captured after the rewind's break, so nothing is taken back.
#
# THE CONTRACT, AND WHAT THIS LANE DOES NOT COVER. No committed host carries a cheap contract whose
# parts pay separately: every parameter a pad or hop flight can finish pays nothing, and the one
# paid multi-part offer a flight could start (`f89d782a` on cs-career-mun4: SPACEWALK, RENDEZVOUS,
# CREWTRANSFER) needs orbit, a second vessel and a transfer. So this lane flies the cheapest real
# multi-parameter contract, `4b53ec52` on cs-career-mun1: test an LV-909 on the pad, PartTest over
# ReachDestination and ReachSituation, parameters paying 0, completion paying 4375 funds, 1.07
# science and 0.98 rep. It proves the completion half of plan row 16. A parameter's own reward
# paid once is held by `ContractsModuleTests` and is not flown here.
#
# THE CRAFT: `CS Engine Test`, the Jumping Flea with one LV-909 under its booster
# (`tools/build_cs_engine_test_craft.py`). Accepting the contract makes the engine an experimental
# part, so the VAB can build it on a tech tree without it. The engine is never lit.
#
# THE SEAM: `PartAction button=runtest part=liquidEngine3.v2`, the part menu's Run Test
# (`ModuleTestSubject.RunTestEvent`), live only while the contract has the part under test.
#
# PLAN (cs-career-mun1, UT ~59962; UTs are the plan):
#   boot       LoadGame persistent at the Space Center; warp to 60020.
#   accept     the contract at 60020; warp to 60100, so the rewind below stays after the accept.
#   F          the craft on the pad, recorded; warp in flight to 60210; Run Test: the contract
#              completes at ~60210. Commit, recover.
#   rewind     Rewind-to-Launch onto F: clock ~60086, the contract Active again.
#   G          the craft again, recorded (the stand-in aboard): Run Test at ~60090, stock pays the
#              completion live. Commit, recover at the Space Center marker (stock's recovery summary
#              after a flight Recover holds warp).
#   crossing   warp to 60400: the walk credits G's row and zeroes F's.
#   check      an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# THE POOLS. G's row gives what F's did and a pad recovery refunds G's launch in full, so every pool
# ends where it was before the rewind.
#
# STATUS: LIVE-PROVEN 2026-10-31, `2026-10-31_0227` PASS attempt 1 (DLL 6182208c, main e96d2c9bb plus the runtest seam). F pressed Run Test at UT 60209.9 and
# stock completed contract 4b53ec52 (+4375 funds, +1 science, +1.07 rep); the rewind landed at 60085.4; G's Run
# Test at 60086.0 completed it again, stock paying live. The walk logged one `Complete: ... effective=true` and
# one `effective=false (already credited), rewards zeroed`, no take-back, no pool adjustment; funds 183757.65,
# science 31.50 and rep 104.07 all ended as before the rewind; LedgerGroundTruth 3/3 hardFailures=0;
# ledger_audit PASS. The parameters paid nothing, so a paid part stays held by the unit tests only.
# =====================================================================================
tier = "operator"
description = "Rewind ledger campaign, a multi-parameter contract completed earlier after a rewind (plan row 16): on cs-career-mun1 a committed pad flight completes a part test contract, a Rewind-to-Launch onto it, and a second flight completes it before that row: stock pays once, the walk credits the earlier completion and zeroes the later one, nothing is taken back, the pools end where the rewind began and LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["RW-17", "career", "ledger", "rewind", "rewind-to-launch", "contracts", "part-test",
        "editor", "ground-truth", "ingame-batch", "timeline-ops"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-mun1"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 4 x 120 warps + 3 x (120 GoToEditor + 180 LaunchFromEditor)
# + 2 x 180 StartRecording + 60 KscAction + 2 x 120 CommitTree + 120 Recover + 120 ExitToSpaceCenter
# + 60 KscMarkerRecover + 300 rewind + 5 x 120 SaveGame + 540 RunTests = 3600; runtime 4400 adds the
# inert steps and FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "60020", maxRate = "100" },                      expect = "OK", budget = 120 },
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "4b53ec52-1dbe-49d3-aa1e-936fe79774a4" }, expect = "OK", budget = 60 },
  { cmd = "WarpToUT",       args = { ut = "60100", maxRate = "100" },                      expect = "OK", budget = 120 },
  # ---- F: the contract completed 100 s after launch ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "CS Engine Test" },         expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "f",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "60210" },                                       expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw17-f-before-test" },                       expect = "OK" },
  { cmd = "PartAction",     args = { button = "runtest", part = "liquidEngine3.v2" },      expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw17-f-tested" },                            expect = "OK" },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "Recover",        args = { pid = "${f.pid}" },                                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw17-f-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw17-01-after-f-commit" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw17-before-rewind" },                       expect = "OK" },
  # ---- the rewind onto F's launch ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "rw17-rewound" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw17-02-after-rtl" },                        expect = "OK", budget = 120 },
  # ---- G: the same contract, before F's row ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "CS Engine Test" },         expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "g",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "MissionMark",    args = { label = "rw17-g-before-test" },                       expect = "OK" },
  { cmd = "PartAction",     args = { button = "runtest", part = "liquidEngine3.v2" },      expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw17-g-tested" },                            expect = "OK" },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "MissionMark",    args = { label = "rw17-g-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw17-03-after-g-commit" },                   expect = "OK", budget = 120 },
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${g.pid}" },                                 expect = "OK", budget = 60 },
  # ---- the crossing of F's rows ----
  { cmd = "MissionMark",    args = { label = "rw17-before-crossing" },                     expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "60400", maxRate = "100" },                      expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "rw17-crossed" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "rw17-04-after-crossing" },                   expect = "OK", budget = 120 },
  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "60430" },                                       expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["funds", "contracts", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The host's 14 recordings plus F and G; the check launch is unrecorded. Measured on `2026-10-31_0227`.
count = 16

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",
  "kscaction action=accept-contract target=4b53ec52-1dbe-49d3-aa1e-936fe79774a4 applied=true",

  # ---- F completes the contract, 100 s after its launch ----
  "MISSIONMARK label=rw17-f-before-test ut=(?:(?!MISSIONMARK label=rw17-f-tested )[\\s\\S])*?Game state: ContractCompleted '[^'\\r\\n]+' \\(funds=",

  # ---- the rewind lands before F's row, after the accept ----
  "MISSIONMARK label=rw17-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=rw17-rewound ut=60[01][0-9]{2}\\.",

  # ---- G completes it again, earlier: no prevention, stock pays ----
  "MISSIONMARK label=rw17-g-before-test ut=60[01][0-9]{2}\\.(?:(?!MISSIONMARK label=rw17-g-tested )[\\s\\S])*?Game state: ContractCompleted '[^'\\r\\n]+' \\(funds=",

  # ---- the walk: the earlier row is the credit, the later one is zeroed ----
  "MISSIONMARK label=rw17-g-committed ut=[\\s\\S]*Complete: contractId='4b53ec52-1dbe-49d3-aa1e-936fe79774a4' effective=true,",
  "MISSIONMARK label=rw17-g-committed ut=[\\s\\S]*Complete: contractId='4b53ec52-1dbe-49d3-aa1e-936fe79774a4' effective=false \\(already credited\\), rewards zeroed",

  # ---- paid once: the pools end where the rewind began ----
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=(\\S+) science=(\\S+) rep=(\\S+) (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw17-before-rewind ut=[\\s\\S]*\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=\\1 science=\\2 rep=\\3 (?:(?!\\[LedgerTrace\\] phase=Structural )[\\s\\S])*?MISSIONMARK label=rw17-crossed ut=",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=",
  "invokerewindtolaunch refused",
  # ---- stock's payment to G is the one payment: nothing to take back, no third completion ----
  "\\[TakeBack\\] Took back ",
  "take-back shortfall",
  "MISSIONMARK label=rw17-g-committed ut=[\\s\\S]*Game state: ContractCompleted '[^'\\r\\n]+' \\(funds=",
  "Game state: ContractFailed ",
]

[runtime]
budgetSeconds = 4400

[retry]
policy = "once"

[expectedFail]
bugId = ""
