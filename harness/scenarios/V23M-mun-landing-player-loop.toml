#     required: "Orbit line decision: pid=\\d+ reason=polyline-owns-phase .*iconSuppressed=True belowAtmosphere=False"
#     inverted: "... .*iconSuppressed=False belowAtmosphere=False"
#
# `iconSuppressed=False` is chosen over a body swap because it inverts the CLAIM
# rather than the subject: it asserts the icon was NOT suppressed at a landed arrival,
# which is precisely the render behaviour this lane exists to confirm. The run must
# red on exactly that token and nothing else.
