# -------------------------------------------------------------------------------------
# 0. WHAT THIS LANE MEASURES: **V6 WITH THE ENDPOINT MOVED FROM ORBIT TO SURFACE**
# -------------------------------------------------------------------------------------
# The flight-map half of the Mun landing pair, and the CLEAN half of roadmap gap G3a.
#
# V6M/V6T loop a Kerbin -> Mun recording that ends in MUN ORBIT. This lane loops a
# Kerbin -> Mun recording that ends LANDED ON THE MUN. Same launch body, same target,
# same parent, same phase-lock road, same craft family, same fixture ancestry
# (`b2-lko-craft`). **EXACTLY ONE SHAPE DIMENSION MOVES: THE ENDPOINT TYPE.**
#
# That is the form the induction caveat asks for and which its cautionary case, V17T,
# could not have - it changed two dimensions at once and its icon-off-orbit
# non-recurrence is consequently unattributable. It is also the form the SIBLING lane
# V22M cannot have: a Kerbin splashdown moves the endpoint AND the recording count at
# once, because no single-recording landed subject exists. **SO THIS PAIR IS THE
# CONTROL THAT SEPARATES V22's TWO VARIABLES**, and that is a reason to fly it even
# though the Mun is the more expensive subject.
#
# V6M IS THEREFORE THE A/B, not merely a predecessor. Where this spec and V6M differ,
# the difference should be attributable to the endpoint and nothing else; where they
# agree, the agreement is the phase-lock road surviving a surface arrival.
#
# -------------------------------------------------------------------------------------
# 1. ROUTING - PRE-REGISTERED AS PHASE-LOCK, AND **REQUIRED**, WHICH IS A DEPARTURE
# -------------------------------------------------------------------------------------
# V17M and V22M both leave both roads unrequired and unforbidden, because on those
# subjects THE ROUTING IS THE MEASUREMENT and requiring either road gates the reading
# on its own answer. **THIS LANE IS NOT IN THAT POSITION AND SHOULD NOT PRETEND TO
# BE.** Kerbin -> its own moon is the phase-lock road, measured five times over at
# four parents (V6, V7, V14, V15, V16), and V6M/V6T are Kerbin -> Mun EXACTLY. The
# routing here is not open; it is the control variable.
#
# So this lane REQUIRES the phase-lock artifacts, in V6M's own vocabulary:
#     `Orbital\(Mun\) same-parent`   `support=Supported`   `PhaseLock APPLIED: mission=`
#     `zeroDrift=yes`                `scheduleWithinTol=yes`
#     `factory chain rec=... reaimed=False`
# and FORBIDS V6M's re-aim trio (`\[ReaimDiag\]`, `ENGAGED re-aim`, `FORCED FAITHFUL`)
# for V6M's reason: on a same-parent subject re-aim is structurally unreachable, so
# any of those three appearing means the moon mission took the interplanetary road.
#
# **WHAT REQUIRING THEM BUYS, AND IT IS THE POINT OF THE LANE:** if a SURFACE endpoint
# perturbs the phase-lock solver - if the arrival being landed rather than orbital
# changes the anchor, the quantization, the drift, or the schedule tolerance - this
# lane reds on the specific artifact that moved, instead of quietly reporting a
# faithful fallback nobody asked about. `zeroDrift=yes` and `scheduleWithinTol=yes`
# are carried for exactly that reason: they are the phase-lock QUALITY assertions, and
# a landed arrival is the first thing ever asked to satisfy them.
#
# -------------------------------------------------------------------------------------
# 2. THE LENS - AND THE ONE PIN THAT MUST *NOT* BE COPIED FROM V6M
# -------------------------------------------------------------------------------------
# V6M's arrival pin is `surface=Proto(Icon|OrbitLine) .*body=Mun`. **DO NOT CARRY IT.**
# Not because it would fail - it would PASS - but because on this subject it means
# something else. The harness matches `re.search(pat, WHOLE log text)` with no flags
# (`hlib.py:3897`), and this loop spends most of every cycle in a Mun ORBIT that draws
# a proto line perfectly well. The pin would be satisfied by the COAST and would say
# nothing whatever about the TOUCHDOWN. VACUOUS, not unsatisfiable - and a vacuous pin
# that goes green is worse than one that reds, because nothing prompts a second look.
# This is the same trap V22M documents; it bites harder here precisely because V6M's
# line is sitting right there, already written, and looks like the obvious reuse.
#
# The arrival claim therefore rests only on below-surface-approach tokens:
#     `Polyline frame: scene=FLIGHT drawn=[1-9]\d* warp=`     (5.0 s, shared key)
#     `TracedPath OWNS leg pid=\d+ .*body=Mun drawn=True`     (2.0 s per pid)
#     `Director TracedPath suppress pid=\d+ frame=\d+ \(polyline owns the leg, proto icon hidden\)`
#                                                              (1.0 s per pid)
#     `Orbit line decision: pid=\d+ reason=polyline-owns-phase .*iconSuppressed=True belowAtmosphere=False`
#
# **AND THE LAST ONE IS WHERE THIS LANE AND V22M *MUST* DIVERGE. THE MUN IS AIRLESS.**
# `belowAtmosphere = body != null && body.atmosphere && orbit.altitude <
# body.atmosphereDepth` (`GhostOrbitLinePatch.cs:903-906`). The Mun has no atmosphere,
# so the `below-atmosphere` branch NEVER FIRES on this subject and the icon is
# suppressed under `polyline-owns-phase` with `belowAtmosphere=False` instead.
# Copying V22M's Kerbin line here would be STRUCTURALLY UNSATISFIABLE - the V17M
# failure mode, in the sibling spec's clothing. The two lanes pin different reason
# tokens ON PURPOSE and neither is a typo of the other.
#
# NOT PINNED, DELIBERATELY: `AssertDrawnRecordingsAccounted` /
# `unaccounted-drawn-recording` emits NOTHING on the clean path
# (`GhostMapPresence.cs:9724` fires its callback only per UNACCOUNTED recording) and
# is report-only in the harness, so requiring it would demand an instrumentation gap
# in order to pass.
#
