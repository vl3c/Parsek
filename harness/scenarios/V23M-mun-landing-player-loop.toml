# THE EIGHT JUMP UTs ARE STILL CALIBRATION SEEDS, and the handoff's instruction to
# take the anchor and applied `k` from the run's own `PhaseLock APPLIED` line COULD
# NOT BE FOLLOWED: a harvest flight records, it does not loop, so B13's KSP.log
# carries zero `PhaseLock APPLIED` and zero `missionconfig applied:` lines (grepped).
# What section 3 does instead is compute the schedule from V6M's published formula
# over this fixture's MEASURED UT0 and span - and the k-series it produces reproduces
# V6M's measured 13 / 26 / 45 / 58 / 71 / 84 exactly, which is a real corroboration
# rather than a substitute for the flight.
#
# **AND THE THING IT WAS WAITING FOR WAS ONLY A HARVEST.** `B13-mun-landing` was
# committed and LIVE-PROVEN - full PASS on flight 1, 2026-07-25, measured wall
# 2,747.9 s, terminal `CommitTreeFlight terminal: rec=... terminalState=Landed
# terminalOrbitBody=Mun` - and the 2026-08-24 re-fly reproduced that on attempt 1.
# THE MISSION LIBRARY HAS BEEN ABLE TO LAND SINCE WELL BEFORE
# THE PARENT-RELAY MODE EXISTED: `landingEnabled` is a flag-gated, inert-by-default
# phase (`mlib.py:3891-3895`, B5_DESCENT at `mlib.py:464`) driving MechJeb's
# `LandingAutopilot.LandUntargeted` through
# `mission_runner._perform_land_untargeted` (`mission_runner.py:2832`), verified
# against the INSTALLED darchambault KRPC.MechJeb v0.8.1 pin rather than inferred
# (`mlib.py:1578-1582`, `provision/pins.toml:91-104`). No new mission mode, no new
# mlib phase, no runner seam. This lane costs one re-fly and one harvest command.
# =====================================================================================
