# =====================================================================================
# *** ITS SUBJECT EXISTS. RE-PINNED 2026-08-24 OFF THE HARVESTED BYTES. ***
# `fixtures/saves/mun-landing-recorded` was harvested `--keep-parsek` from
# `B13-mun-landing` run **2026-08-24_1449**, PASS attempt 1 (wall 2,811 s, mission
# wall 2,764.1 s - the suite's most expensive scenario - MISSION-OK across the full
# twenty-one-phase chain through SURFACE-COMMITTED). The tree id below is REAL and the
# `PENDING_FIXTURE_LANES` entry is deleted in the same commit.
#
# THE EIGHT JUMP UTs ARE STILL CALIBRATION SEEDS, and the handoff's instruction to
# take the anchor and applied `k` from the run's own `PhaseLock APPLIED` line COULD
# NOT BE FOLLOWED: a harvest flight records, it does not loop, so B13's KSP.log
# carries zero `PhaseLock APPLIED` and zero `missionconfig applied:` lines (grepped).
# What section 3 does instead is compute the schedule from V6M's published formula
# over this fixture's MEASURED UT0 and span - and the k-series it produces reproduces
# V6M's measured 13 / 26 / 45 / 58 / 71 / 84 exactly, which is a real corroboration
# rather than a substitute for the flight.
#
# **AND THE THING IT WAS WAITING FOR WAS ONLY A HARVEST.** `B13-mun-landing` was
# committed and LIVE-PROVEN - full PASS on flight 1, 2026-07-25, measured wall
# 2,747.9 s, terminal `CommitTreeFlight terminal: rec=... terminalState=Landed
# terminalOrbitBody=Mun` - and the 2026-08-24 re-fly reproduced that on attempt 1.
# THE MISSION LIBRARY HAS BEEN ABLE TO LAND SINCE WELL BEFORE
# THE PARENT-RELAY MODE EXISTED: `landingEnabled` is a flag-gated, inert-by-default
# phase (`mlib.py:3891-3895`, B5_DESCENT at `mlib.py:464`) driving MechJeb's
# `LandingAutopilot.LandUntargeted` through
# `mission_runner._perform_land_untargeted` (`mission_runner.py:2832`), verified
# against the INSTALLED darchambault KRPC.MechJeb v0.8.1 pin rather than inferred
# (`mlib.py:1578-1582`, `provision/pins.toml:91-104`). No new mission mode, no new
# mlib phase, no runner seam. This lane costs one re-fly and one harvest command.
# =====================================================================================
#
# -------------------------------------------------------------------------------------
# 0. WHAT THIS LANE MEASURES: **V6 WITH THE ENDPOINT MOVED FROM ORBIT TO SURFACE**
# -------------------------------------------------------------------------------------
# The flight-map half of the Mun landing pair, and the CLEAN half of roadmap gap G3a.
#
# V6M/V6T loop a Kerbin -> Mun recording that ends in MUN ORBIT. This lane loops a
# Kerbin -> Mun recording that ends LANDED ON THE MUN. Same launch body, same target,
# same parent, same phase-lock road, same craft family, same fixture ancestry
# (`b2-lko-craft`). **EXACTLY ONE SHAPE DIMENSION MOVES: THE ENDPOINT TYPE.**
#
# That is the form the induction caveat asks for and which its cautionary case, V17T,
# could not have - it changed two dimensions at once and its icon-off-orbit
# non-recurrence is consequently unattributable. It is also the form the SIBLING lane
# V22M cannot have: a Kerbin splashdown moves the endpoint AND the recording count at
# once, because no single-recording landed subject exists. **SO THIS PAIR IS THE
# CONTROL THAT SEPARATES V22's TWO VARIABLES**, and that is a reason to fly it even
# though the Mun is the more expensive subject.
#
# V6M IS THEREFORE THE A/B, not merely a predecessor. Where this spec and V6M differ,
# the difference should be attributable to the endpoint and nothing else; where they
# agree, the agreement is the phase-lock road surviving a surface arrival.
#
# -------------------------------------------------------------------------------------
# 1. ROUTING - PRE-REGISTERED AS PHASE-LOCK, AND **REQUIRED**, WHICH IS A DEPARTURE
# -------------------------------------------------------------------------------------
# V17M and V22M both leave both roads unrequired and unforbidden, because on those
# subjects THE ROUTING IS THE MEASUREMENT and requiring either road gates the reading
# on its own answer. **THIS LANE IS NOT IN THAT POSITION AND SHOULD NOT PRETEND TO
# BE.** Kerbin -> its own moon is the phase-lock road, measured five times over at
# four parents (V6, V7, V14, V15, V16), and V6M/V6T are Kerbin -> Mun EXACTLY. The
# routing here is not open; it is the control variable.
#
# So this lane REQUIRES the phase-lock artifacts, in V6M's own vocabulary:
#     `Orbital\(Mun\) same-parent`   `support=Supported`   `PhaseLock APPLIED: mission=`
#     `zeroDrift=yes`                `scheduleWithinTol=yes`
#     `factory chain rec=... reaimed=False`
# and FORBIDS V6M's re-aim trio (`\[ReaimDiag\]`, `ENGAGED re-aim`, `FORCED FAITHFUL`)
# for V6M's reason: on a same-parent subject re-aim is structurally unreachable, so
# any of those three appearing means the moon mission took the interplanetary road.
#
# **WHAT REQUIRING THEM BUYS, AND IT IS THE POINT OF THE LANE:** if a SURFACE endpoint
# perturbs the phase-lock solver - if the arrival being landed rather than orbital
# changes the anchor, the quantization, the drift, or the schedule tolerance - this
# lane reds on the specific artifact that moved, instead of quietly reporting a
# faithful fallback nobody asked about. `zeroDrift=yes` and `scheduleWithinTol=yes`
# are carried for exactly that reason: they are the phase-lock QUALITY assertions, and
# a landed arrival is the first thing ever asked to satisfy them.
#
# -------------------------------------------------------------------------------------
# 2. THE LENS - AND THE ONE PIN THAT MUST *NOT* BE COPIED FROM V6M
# -------------------------------------------------------------------------------------
# V6M's arrival pin is `surface=Proto(Icon|OrbitLine) .*body=Mun`. **DO NOT CARRY IT.**
# Not because it would fail - it would PASS - but because on this subject it means
# something else. The harness matches `re.search(pat, WHOLE log text)` with no flags
# (`hlib.py:3897`), and this loop spends most of every cycle in a Mun ORBIT that draws
# a proto line perfectly well. The pin would be satisfied by the COAST and would say
# nothing whatever about the TOUCHDOWN. VACUOUS, not unsatisfiable - and a vacuous pin
# that goes green is worse than one that reds, because nothing prompts a second look.
# This is the same trap V22M documents; it bites harder here precisely because V6M's
# line is sitting right there, already written, and looks like the obvious reuse.
#
# The arrival claim therefore rests only on below-surface-approach tokens:
#     `Polyline frame: scene=FLIGHT drawn=[1-9]\d* warp=`     (5.0 s, shared key)
#     `TracedPath OWNS leg pid=\d+ .*body=Mun drawn=True`     (2.0 s per pid)
#     `Director TracedPath suppress pid=\d+ frame=\d+ \(polyline owns the leg, proto icon hidden\)`
#                                                              (1.0 s per pid)
#     `Orbit line decision: pid=\d+ reason=polyline-owns-phase .*iconSuppressed=True belowAtmosphere=False`
#
# **AND THE LAST ONE IS WHERE THIS LANE AND V22M *MUST* DIVERGE. THE MUN IS AIRLESS.**
# `belowAtmosphere = body != null && body.atmosphere && orbit.altitude <
# body.atmosphereDepth` (`GhostOrbitLinePatch.cs:903-906`). The Mun has no atmosphere,
# so the `below-atmosphere` branch NEVER FIRES on this subject and the icon is
# suppressed under `polyline-owns-phase` with `belowAtmosphere=False` instead.
# Copying V22M's Kerbin line here would be STRUCTURALLY UNSATISFIABLE - the V17M
# failure mode, in the sibling spec's clothing. The two lanes pin different reason
# tokens ON PURPOSE and neither is a typo of the other.
#
# NOT PINNED, DELIBERATELY: `AssertDrawnRecordingsAccounted` /
# `unaccounted-drawn-recording` emits NOTHING on the clean path
# (`GhostMapPresence.cs:9724` fires its callback only per UNACCOUNTED recording) and
# is report-only in the harness, so requiring it would demand an instrumentation gap
# in order to pass.
#
# -------------------------------------------------------------------------------------
# 3. THE MEASURED BYTES, AND WHAT IS STILL A SEED
# -------------------------------------------------------------------------------------
# **RE-PINNED 2026-08-24 OFF `mun-landing-recorded`'s REAL BYTES.**
#
# MEASURED (persistent.sfs `RECORDING_TREE` + the main recording's `.prec.txt`):
#
#     tree             0da22482a8a648c6835b7bcd6b0f200d
#     main recording   61f3775361fe4130a66a69b1425b7209
#     UT0              34.5199999999998        (`explicitStartUT` - V6M convention)
#     explicitEndUT    23,256.9452936296
#     span             **23,222.425293630 s**  (the 23,000 s seed was within 1%)
#     pointCount       1442   terminalState 1 = Landed   endpointBodyName Mun
#     save clock       23,258.405293629632     (FLIGHTSTATE UT)
#     structure        1 tree / 1 committed / **8 recordings** (1 subject + 7 debris),
#                      5 JointBreak branch points, terminals 1 Landed + 7 Destroyed
#     ELEVEN ORBIT_SEGMENTs: `Kerbin` 0-7 then `Mun` 8-10, ONE body-change seam at the
#                      adjacent `endUT == startUT` pair **16,425.168889** - a seam
#                      offset of **16,390.648889 s** off UT0, which is the number
#                      `Orbital(Mun) same-parent ... off=` should reproduce (compare
#                      V6M's 16,370.562 on the orbit-only sibling: 20 s apart, which
#                      is the shape agreement this A/B wants).
#                      The chain ENDS at 20,966.465294, so the recording closes with a
#                      **2,290.480 s SEGMENT-LESS DESCENT-AND-LANDED TAIL** - the part
#                      this lane exists to read, and five times the Kerbin sibling's.
#
# **UT0 vs SEGMENT 0 MATTERS MORE HERE THAN ANYWHERE IN THE CORPUS.** Segment 0 starts
# at 230.013733, a **195.494 s** gap off `explicitStartUT` - against the vall fixture's
# 2.700 s. Anchoring on the wrong one would move every bracket by 195 s, wider than
# the -180 bracket itself. `test_the_v6m_convention_is_used_and_it_matters` exists for
# exactly this.
#
# STILL A SEED - THE PHASE-LOCK SCHEDULE. The handoff asked for the anchor and applied
# `k` to be taken from the run's own `PhaseLock APPLIED` line rather than recomputed.
# THAT LINE DOES NOT EXIST: B13 is a RECORDING flight, nothing loops in it, and its
# KSP.log carries zero `PhaseLock APPLIED` and zero `missionconfig applied:` lines
# (grepped). So the schedule below is COMPUTED from V6M's published formula over this
# fixture's measured UTs, and it is offered as a better-grounded seed, not as a
# measurement:
#
#     T_anchor = Rotation(Kerbin)  21,549.425183089825 s
#     other    = Orbital(Mun)      P 138,984.37657447575 s, tol SOI/v_orb = 4,478.5 s
#     filter   = CircularPhaseError(k*T_anchor, P_Mun) <= tol   (purely periodic)
#     floorUT  = save clock 23,258.405  ->  kFloor = ceil((23,258.405-34.520)/T) = 2
#     first k >= 2 passing = **k = 13** (residual 2,173.774)
#         L1 = 34.520 + 13*T = **280,177.047**
#     kFloor2 = ceil((L1 + span - UT0)/T) = 15; first k >= 15 passing = **k = 26**
#         (residual 4,347.548)  ->  L2 = 34.520 + 26*T = **560,319.575**
#
# **THE k-SERIES REPRODUCES V6M's MEASURED ONE EXACTLY** - 13, 26, 45, 58, 71, 84,
# with V6M's own residuals to the decimal - which is the strongest corroboration this
# derivation can have short of a flight, and follows because this fixture's kFloor is
# also 2. It is still NOT a measurement: V6M's `fixedCadenceWithinTol=no` beside
# `scheduleWithinTol=yes` is the kind of thing only the run prints.
#
# THE JUMP TABLE, on V6M's press-driven model (each `StartLoopPlayback` press resolves
# `NextLaunchAfter(now)` to a relaunch epoch L; the jump target is L + offset, and the
# arrival offset here is the SPAN because this recording ends at the touchdown):
#
#     cycle-1 arrival  L1 + span = **303,399.47**  -> 303,219 / 303,339 / 303,539
#                                                     settle +1,200 -> 304,739
#     press 2 at ~304,739 -> L2 = NextLaunchAfter(304,739) = 560,319.575 (k=26)
#     cycle-2 arrival  L2 + span = **583,542.00**  -> 583,362 / 583,482 / 583,682
#                                                     settle +1,200 -> 584,882
#
# Brackets are the family's -180 / -60 / +140, off V6M's committed table (296,370 /
# 296,490 / 296,690 around a 296,550 seam). The +1,200 settle is KEPT here (unlike
# V22M, which had to rescale to +300): this span is 23,222 s, so a 1,200 s settle is
# 5% of a cycle and every jump stays strictly increasing.
#
# ONE CORRECTION TO THE OLD SEED TABLE, recorded rather than silently fixed: it read
# the arrivals as bare `k*T_anchor` (64,648 / 129,297), which is neither a launch nor
# an arrival - it omitted UT0 and the arrival offset both. The rows above are
# launch + span on the measured clock.
#
# **THE CADENCE IS NON-UNIFORM BY CONSTRUCTION and the k values remain the weakest
# part of this table.** V6M section "WINDOW ARITHMETIC" records that cycle 2 is NOT
# anchor + P: the throttle skips to `ceil((L0 + span - ut0)/T_anchor)` and then takes
# the next k that satisfies the phase filter, so consecutive cycles are not evenly
# spaced. Re-pin cycle 2 off the MEASURED cycle-1 clock rather than by doubling it.
#
# WHAT RUN 1 STILL OWES: read `phaseAnchorUt=` off `missionconfig applied:` and each
# cycle's `relaunchUt=` off `startloopplayback initiated:`, confirm or correct the two
# anchors above, and re-fly. A dwell-nowhere run 1 is an accepted outcome, not a lane
# failure (V17M's precedent).
#
# -------------------------------------------------------------------------------------
# 4. THE FORTY-TICK CENSUS-PACING BLOCK
# -------------------------------------------------------------------------------------
# V16M's proven machinery: it measured both cycles 11.502 wall-s apart where V15M's
# three runs printed one. The mechanism is the 5.0 s `VerboseRateLimited` window - a
# short dwell issues its census, the window swallows the second emission, and the lane
# reads one sample as the steady state. Three of this lane's four render pins are
# per-pid rate-limited (2.0 s, 1.0 s) and one is change-only, so forty seam
# round-trips (~10 wall-s at run.py's ~0.25 s pacing) is the floor that lets every
# limiter print.
#
# -------------------------------------------------------------------------------------
# 5. THE NEGATIVE CONTROL - IT MUST INVERT A REQUIRED RENDER TOKEN
# -------------------------------------------------------------------------------------
# **CRITERION (b) WAS FIRST DISCHARGED BY THE V19 PAIR ON 2026-08-21, AND IT
# ESTABLISHED A RULE THIS LANE FOLLOWS: THE CONTROL IS PER-LANE, NOT PER-PAIR.**
# Every V pair BEFORE V19 shared one inversion - a temporary `rewind.supersedeRows`
# minimum - which proves the saveParse EVALUATOR can red and NOTHING about whether
# the render pins can. V19M and V19T each ran their OWN control on their OWN lens
# (`2026-08-21_0855` red on `surface=ProtoOrbitLine .*body=Vall`, `_0858` on
# `surface=ProtoIcon pid=\d+ .*body=Vall scene=TRACKSTATION`), BECAUSE the two
# halves pin different lenses and a shared control would have proven exactly one of
# them. G3a's lanes diverge FURTHER than V19's did, so each of the five owes its own.
# Designed at ARMING off the reading run's own bytes, then REVERTED.
#
# THE INVERSION OF RECORD FOR THIS LANE:
#     required: "Orbit line decision: pid=\\d+ reason=polyline-owns-phase .*iconSuppressed=True belowAtmosphere=False"
#     inverted: "... .*iconSuppressed=False belowAtmosphere=False"
#
# `iconSuppressed=False` is chosen over a body swap because it inverts the CLAIM
# rather than the subject: it asserts the icon was NOT suppressed at a landed arrival,
# which is precisely the render behaviour this lane exists to confirm. The run must
# red on exactly that token and nothing else.
#
# -------------------------------------------------------------------------------------
# 6. POSTURE, AND THE SCOPING NOTE THAT IS NOT AN OMISSION
# -------------------------------------------------------------------------------------
# NOTHING IS ARMED. No `gating = true`; `rewind` and `structure` are report-only so the
# reading run prints their facets without gating on unmeasured values. Unlike V22,
# `terminalStates` IS safe to reason about here - B13 pins `terminalState=Landed
# terminalOrbitBody=Mun` in its own contract - but it is still left undeclared until
# measured, because what B13 asserts about its FLIGHT is not automatically what the
# harvested fixture's saveParse facets will report.
#
# **THERE IS NO KSC HALF OF THIS PAIR, AND THAT IS A SCOPING FACT RATHER THAN A GAP -
# BUT THE REASON IS NARROWER THAN "THE HOST IS VACUOUS", AND THE LOOSE VERSION IS
# WRONG.** This recording LAUNCHES FROM KERBIN, so `IsKscStructurallyEligible`
# (`ParsekKSC.cs:1483`, which gates on `Points[0].bodyName == "Kerbin"` - the FIRST
# point only, with terminal state not consulted at all) ADMITS it, and the KSC host
# would happily render its Kerbin ascent leg. What it cannot render is the part this
# pair exists to measure: the per-frame pose resolvers gate EVERY point
# (`ParsekKSC.Playback.cs:288-296`, `:362-372`), so every Mun-frame point - the whole
# descent and the touchdown - is skipped with `KSC point skipped ... body=Mun`.
# **THE ARRIVAL IS VACUOUS ON THAT HOST, NOT THE RECORDING**, and an arrival lane is
# what a KSC half would have to be. The asymmetry with V22K, whose subject is
# Kerbin-frame END TO END, is the gate working as designed rather than an
# inconsistency between the two pairs.
#
# `allowedAnomalies = []` ON PURPOSE. Tier-C `rigid-seam-tangent-discontinuity` raises
# at the owned descent draw (`CrossMemberSeamStitcher.cs:409`) and IS gated
# (`hlib.py:247`, position 5 of `ANOMALY_TOKENS`), so a raise reds this spec with
# every step green - the pre-registered correct catch. It fires ONCE PER ONSET per
# (pid, signature) per scene session, so expect one line, not a stream. If it raises,
# the token is added BARE with the flight that showed it, never as a count budget.
# **AN AIRLESS DESCENT IS A DIFFERENT GEOMETRY FROM V22M's ATMOSPHERIC ONE** - no
# chute phase, a powered suicide-burn-shaped profile - so whether the two lanes agree
# on this raise is itself a reading the pair produces for free.
#
# -------------------------------------------------------------------------------------
# 7. FLIGHT LEDGER
# -------------------------------------------------------------------------------------
# THIS LANE HAS NOT FLOWN. Ledgered here is the PRODUCER flight that made its subject
# exist, verdict-neutrally, because it is the provenance section 3 rests on.
#
#   `B13-mun-landing` run **2026-08-24_1449** - **PASS, attempt 1**.
#     wall 2,811 s (mission wall 2,764.1 s - the suite's most expensive scenario, and
#     within 0.6% of the 2,747.9 s flight-1 measurement), tier nightly, instance
#     stock-minimal, kspExit clean. MISSION-OK across twenty-one phases: PRELAUNCH ->
#     MJ-ASCENT -> CIRCULARIZE -> ORBIT -> PLAN-TRANSFER -> TRANSFER-BURN ->
#     COAST-TO-TARGET -> PLAN-CORRECTION -> CORRECTION-BURN (x2 more rounds) ->
#     TARGET-FLYBY -> PLAN-CAPTURE -> CAPTURE-BURN -> PARK -> DESCENT ->
#     LANDED-SETTLE -> SURFACE-COMMIT -> SURFACE-COMMITTED, with `landedOnTargetBody
#     value=Mun met=True` and `landedStable value=SURFACE-COMMIT met=True` (twenty
#     consecutive settled windows at alt 2.944 m, hspd 0.002 m/s). Verifier chain all
#     PASS/SKIPPED: analyzer RED=0, `anomalySweep hits=[]`, driverValidity PASS,
#     expectations `recordings.count = 8` against B13's own {8,8} window, ledgerOracle,
#     logValidate, missionOutcome, saveParse REPORT (supersedeRows 0, tombstones 0,
#     rewindPoints 0, pointsTotal 1871, largest 1442, smallest 44, unparsed 0,
#     mismatches 0), testResults, unityExceptions.
#     Produced save harvested `--keep-parsek` as `fixtures/saves/mun-landing-recorded`
#     and registered in `test_saveparse.RECORDED_FIXTURES` with its full provenance.
#     DLL provenance: the post-#1523 auto-merge-ON build, deployed hash prefix
#     27f5f31907efce27.
#
#   WHAT DID NOT COME BACK, and section 3 says so where it matters: a `PhaseLock
#   APPLIED` line. A recording flight does not loop, so the anchor and applied `k`
#   could not be read off it and remain derived. Also worth one line because it is a
#   population fact nobody had looked at: the tree's FIRST branch point (UT 34.52,
#   `debrisCount = 3`) carries NO `childId` rows - three launch-clamp children
#   coalesced away without minting recordings - which is why 5 branch points yield 7
#   debris rather than 10. Verdict-neutral; the auto-merge-ON default is the obvious
#   suspect and nothing here tests it.
# -------------------------------------------------------------------------------------
tier = "operator"
description = "**RE-PINNED 2026-08-24 OFF ITS FIXTURE'S REAL BYTES**, `PENDING_FIXTURE_LANES` entry retired in the same commit. `fixtures/saves/mun-landing-recorded` EXISTS, harvested `--keep-parsek` from `B13-mun-landing` run 2026-08-24_1449 - PASS attempt 1, wall 2,811 s / mission wall 2,764.1 s, MISSION-OK across all twenty-one phases through SURFACE-COMMITTED, `landedOnTargetBody value=Mun` and `landedStable value=SURFACE-COMMIT` both met, every verifier PASS/SKIPPED, anomalySweep clean. Real tree id; measured UT0 34.520 / span 23,222.425 / seam 16,425.169 (offset 16,390.649) / 8 recordings / terminal Landed on Mun / a 2,290.5 s segment-less descent-and-landed tail. THE EIGHT JUMP UTs REMAIN CALIBRATION SEEDS AND THE HANDOFF'S RECIPE FOR THEM COULD NOT BE FOLLOWED: it asked for the anchor and applied `k` to come off the run's own `PhaseLock APPLIED` line, and a RECORDING flight emits none (grepped: zero in B13's KSP.log) - so the schedule is COMPUTED from V6M's published formula over the measured UTs, giving k=13 -> L1 280,177.047 and k=26 -> L2 560,319.575, and the k-series it produces (13/26/45/58/71/84, V6M's residuals to the decimal) reproduces V6M's MEASURED series exactly, which corroborates the derivation without substituting for the flight. B13 was already LIVE-PROVEN full PASS on flight 1 (2026-07-25, wall 2,747.9 s, `terminalState=Landed terminalOrbitBody=Mun`) and THE MISSION LIBRARY HAS BEEN ABLE TO LAND SINCE WELL BEFORE THE PARENT-RELAY MODE EXISTED (`landingEnabled` is a flag-gated inert-by-default phase driving MechJeb `LandingAutopilot.LandUntargeted` through `mission_runner._perform_land_untargeted`, verified against the INSTALLED darchambault KRPC.MechJeb v0.8.1 pin rather than inferred). No new mission mode, no new mlib phase, no runner seam. **THIS LANE IS V6 WITH THE ENDPOINT MOVED FROM ORBIT TO SURFACE**: same launch body, target, parent, road, craft family and fixture ancestry as V6M/V6T, with EXACTLY ONE shape dimension moved. That is the form the induction caveat asks for and which V17T could not have (it moved two and its icon-off-orbit non-recurrence is unattributable), and which the sibling V22M cannot have either (a Kerbin splashdown moves the endpoint AND the recording count, because no single-recording landed subject exists) - **so this pair is the CONTROL THAT SEPARATES V22's TWO VARIABLES**, which is a reason to fly it despite the Mun being the more expensive subject. ROUTING IS REQUIRED HERE, WHICH IS A DEPARTURE FROM V17M AND V22M and is justified rather than assumed: on those lanes the routing IS the measurement so requiring a road gates the reading on its own answer, whereas Kerbin -> its own moon is the phase-lock road measured five times at four parents and V6M/V6T are Kerbin -> Mun exactly - the routing is the control variable, not the question. So the phase-lock artifacts are required in V6M's own vocabulary (including `zeroDrift=yes` and `scheduleWithinTol=yes`, the QUALITY assertions a landed arrival is the first thing ever asked to satisfy) and V6M's re-aim trio is forbidden; if a surface endpoint perturbs the solver, this lane reds on the artifact that moved instead of quietly reporting a fallback nobody asked about. THE ONE PIN THAT MUST NOT BE COPIED FROM V6M is its `surface=Proto(Icon|OrbitLine) .*body=Mun` arrival pin - not because it would fail but because it would PASS, satisfied by the Mun-ORBIT coast the same loop spends most of every cycle in, saying nothing about the touchdown. Vacuous, not unsatisfiable, and worse for it: a vacuous green prompts no second look. AND THE MUN IS AIRLESS, so the suppression reason token is `polyline-owns-phase` with `belowAtmosphere=False` - `below-atmosphere` never fires here and copying V22M's Kerbin line would be structurally unsatisfiable. The two sibling lanes pin different reason tokens ON PURPOSE. NO KSC HALF EXISTS and that is a scoping fact rather than a gap - though the reason is narrower than \"the host is vacuous\", and the loose version is wrong: this recording LAUNCHES FROM KERBIN, so `IsKscStructurallyEligible` (which gates on `Points[0].bodyName`, the FIRST point only) ADMITS it and the KSC host would render its Kerbin ascent leg. What it cannot render is the part this pair measures - the per-frame pose resolvers gate EVERY point, so the whole Mun-frame descent and touchdown are skipped. THE ARRIVAL is vacuous on that host, not the recording, and an arrival lane is what a KSC half would have to be; the asymmetry with V22K, whose subject is Kerbin-frame END TO END, is the gate working. `allowedAnomalies = []` on purpose, expecting the gated Tier-C `rigid-seam-tangent-discontinuity` raise at the owned descent draw; whether an AIRLESS powered descent agrees with V22M's atmospheric one on that raise is a reading the pair produces for free. NOTHING IS ARMED."
