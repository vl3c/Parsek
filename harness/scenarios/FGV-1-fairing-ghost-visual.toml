  "\\[Parsek\\]\\[INFO\\]\\[FairingGhostVisual\\] config 2 interstage-truss: structure separated real=\\[[A-Za-z0-9,]+\\] ghost=\\[[A-Za-z0-9,]+\\] match=True",
  "\\[Parsek\\]\\[INFO\\]\\[FairingGhostVisual\\] config 2 interstage-truss: structure separated-branch real=\\[[A-Za-z0-9,]+\\] ghost=\\[[A-Za-z0-9,]+\\] match=True",
  # Every image was written and settled.
  "\\[Parsek\\]\\[INFO\\]\\[FairingGhostVisual\\] capture ok label=fgv-1-intact path=Screenshots/fgv-1-intact\\.png bytes=[1-9]",
  "\\[Parsek\\]\\[INFO\\]\\[FairingGhostVisual\\] capture ok label=fgv-1-jettisoned path=Screenshots/fgv-1-jettisoned\\.png bytes=[1-9]",
