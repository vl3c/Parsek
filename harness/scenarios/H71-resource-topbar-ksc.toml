schema = 1
id = "H71-resource-topbar-ksc"
tier = "nightly"
# THE RESOURCE TOP BAR ON A CAREER SPACE CENTER. `ResourceTopBar`'s two cells are
# career-only AND read the stock funds / science / reputation widgets, which exist
# only at the Space Center - so they skipped on every host before this one: LT-2's
# `fresh-sandbox` ("career-only"), LT-1's and the CEN-1 census's FLIGHT careers ("no
# currency widget present"). Host: `career-earned-ksc`, the vessel-less sibling of
# `career-earned-pad` derived by `harness/tools/build_career_earned_ksc.py` from the
# same xUnit base (an earned ledger, two committed recordings, nine Offered
# contracts, no VESSEL node, so LoadGame takes the NoVesselSpaceCenter route).
# Measured on the 2026-09-07 second census (scratch CEN-2, run `2026-09-07_2017`,
# 4 candidate categories): ResourceTopBar 1 of 2, then 2 of 2 on the 2026-09-08 census
# CEN-11 (run `2026-09-08_1034`) after the cell was re-pinned to the guard.
#
# BOTH CELLS EXECUTE. `TopBarReflectsLedgerAfterRecalc` used to skip here because the
# ledger reconstruction runs ABOVE the live pools and the drawdown guard uplift-clamps
# the funds / science patch - and it did the same on `fresh-career` (CEN-8), because
# seed == live on every seeded career, so the probe credit ALWAYS runs above live.
# The cell now asserts that guard (live funds / science hold, no change event fires)
# instead of skipping past it; `CurrencyTooltipResolvesWidgetScreenRects` executes and
# passes as before. The three sibling categories the census read on this host
# are owned elsewhere: `Ledger` 4 of 4 (H48), `StockUiOverlay` 6 of 6 (H45; the two
# Mission Control cells read "rows=9, contractRows=0" here until 2026-09-08, when the
# row-contract lookup was fixed - stock stores a MissionSelection wrapper, not the
# Contract, in the row - and both now pass wherever a contract is on offer),
# `CrewReservationLive` 0 of 2 (no spawned vessels; LT-4 carries it).
# FLOWN (2-of-2 re-pin): run `2026-09-08_1038`, PASS attempt 1, wall 46 s; re-flown after
# the guard branch gained its reputation assertions: run `2026-09-08_1113`, PASS attempt 1,
# wall 51 s. Both: the pinned line matched verbatim, one ERROR line (the carve-out) and no
# other, every verifier PASS or REPORT.
description = "Run the in-game ResourceTopBar category unattended at the Space Center of a vessel-less earned career, both cells executing, pinned whole."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "resource-topbar", "career", "H71"]

[fixture]
saveTemplate = "fixtures/saves/career-earned-ksc"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "ResourceTopBar" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
D14 = ["career", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The two committed recordings the career carries (its pad sibling pins the same 2).
count = { min = 2, max = 2 }

[expectations.logContracts]
required  = ["BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=ResourceTopBar scene=SPACECENTER"]
# The ERROR gate carries ONE named carve-out, measured on the census (CEN-2, one
# line): `TopBarReflectsLedgerAfterRecalc` seeds a synthetic probe action whose
# VesselRecovery science leg has, by construction, no ScienceChanged event, so
# `PostWalkActionReconciler` writes its `Science reconcile dump (post-walk)` at
# ERROR for that action id and nothing else. The lookahead exempts exactly the
# probe's own id prefix; any other ERROR line still reds.
forbidden = ["\\[Parsek\\]\\[ERROR\\](?!\\[LedgerOrchestrator\\] Science reconcile dump \\(post-walk\\): action=parsek-overlay-topbar-phase5-topbar-)"]

[runtime]
budgetSeconds = 720

[retry]
policy = "once"

[expectedFail]
bugId = ""
