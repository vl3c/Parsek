schema = 1
id = "B38-jool-laythe-continuation"
# =====================================================================================
# B38: the Kerbin -> Jool -> Laythe forge. AUTHORED 2026-11-07, NEVER FLOWN.
#
# WHAT IT IS FOR. The lone-moon arrival hold (PR #2468) needs a looped tree that
# crosses Jool's SOI AND one moon's. B25 starts from the Parsek-stripped
# `jool-park-nerv` on purpose (its hop is its own Jool-rooted tree); this lane
# flies B25's machine unchanged from the UNSTRIPPED `jool-orbit-recorded` (B22's
# harvest), so the hop is appended to B22's committed Kerbin -> Jool tree
# `6ec68e87b782476f970a71df8c8b4685`. Its produced save is the
# `jool-laythe-recorded` fixture the V33M loop lane replays. One Jool moon first;
# Vall / Tylo / Bop / Pol (B33-B35 machines) follow if this one is green.
#
# THE FIXTURE. `jool-orbit-recorded` is byte-identical to `jool-park-nerv`
# outside the ParsekScenario node (diffed 2026-11-07), so B25's entry gate and
# delta-v hold verbatim: the crewed Duna Rocket (NERV) parks at SMA
# 590,325,784.59 m, ECC 7.94e-06, INC 3.005 deg around Jool at UT 27,787,319.42
# (activeVessel = 1), 3,967 m/s available against a 1,574 m/s worst hop (B25
# header). No missionParam moved. The source still carries B22's crew bookkeeping
# (Valentina reserved, Debmal as stand-in), which B25's strip removed; the commit
# may log a crew swap on the live vessel.
#
# THE ONE MACHINE CHANGE: NO StopRecording / DiscardTree in the preamble, for the
# reason B36's header gives (a seam DiscardTree suppresses the committed-spawned
# restore since 2026-10-03, which would make StartRecording mint a fresh tree).
# Here the restore resumes B22's tree and StartRecording answers `already=true`.
# Read B36's "READ BEFORE HARVESTING" note too: the restore prefers the tree's
# `activeRecordingId` (ddcc6d00...), which a load-time split leaves on the head.
#
# Fast-lane checklist: B25's measured machine, nothing re-sized (no b5 lead: the
# only crossing is the target approach; test_mlib DROPPED_2026_10_14 flew B25 red
# with one). Items 7-9 wait on the first flight.
#
# HARVEST after a green flight, from the run's own snapshot, never `--force`:
#   python tools/harvest_bdock_station.py --save-dir results/<runId>_save
#       --target-name jool-laythe-recorded --expect-situation ORBITING --keep-parsek
# =====================================================================================
tier = "operator"
description = "AUTHORED 2026-11-07, NEVER FLOWN. The Kerbin->Jool->Laythe forge for the lone-moon arrival hold: B25's orbit-start Jool->Laythe machine flown from the UNSTRIPPED `jool-orbit-recorded` (B22's harvest), with no StopRecording/DiscardTree, so the committed-spawned restore resumes B22's tree and the seam StartRecording answers `already=true`. The Laythe hop is appended to the Kerbin->Jool tree 6ec68e87, giving one tree that crosses Jool's SOI and Laythe's. Produces the `jool-laythe-recorded` fixture for the V33M loop lane."
instanceProfile = "stock-minimal"
tags = ["B38", "laythe", "jool", "moon", "orbit", "mechjeb", "cross-soi", "capture", "commit-in-foreign-soi", "orbit-start", "inward-transfer", "tree-continuation", "lone-moon-hold", "pending-flight"]

[fixture]
saveTemplate       = "fixtures/saves/jool-orbit-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "b25_laythe_orbit"

# `steps` MUST stay above the [driver.missionParams] header. No kill pair: see the
# header. StartRecording is kept as the seam's own evidence (`already=true`).
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" },   expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  { cmd = "StartRecording",                                                    expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 5400 },
  { cmd = "FlushAndQuit",                                                      expect = "OK" },
]

# B25's missionParams verbatim (derivations in B25-laythe-orbit.toml).
[driver.missionParams]
startInOrbit                    = true
startInOrbitMinPeriapsisMeters  = 250000000
startInOrbitMaxApoapsisMeters   = 800000000
startInOrbitMaxEccentricity     = 0.05
startInOrbitSituations          = ["ORBITING"]
startInOrbitDebounceFrames      = 3
startInOrbitSettleSeconds       = 120
homeBodyName               = "Jool"
targetBodyName             = "Laythe"
interplanetaryTransfer     = false
returnBodyName             = "Jool"
transferMinApoapsisMeters  = 0
ejectionEccFloor           = 0.55
courseCorrectPeriapsisMeters = 250000
correctionTriggerAltsMeters = [0]
planTimeoutSeconds         = 300
planRetrySeconds           = 10
planWarpFactor             = 2
transferBurnTimeoutSeconds = 300000
coastTimeoutSeconds        = 4000000
flybyTimeoutSeconds        = 60000
coastWarpFactor            = 5
soiLeadSeconds             = 3000
approachWindowSeconds      = 10000
approachMaxWarpFactor      = 3
flybyWarpFactor            = 2
flybyMaxWarpFactor         = 3
nodeArrivalMarginSeconds   = 15
flipPhysicsWarpFactor      = 1
targetPeriapsisFloorMeters = 60000
captureEnabled             = true
capturePlanTimeoutSeconds  = 300
captureBurnTimeoutSeconds  = 60000
parkMinPeriapsisMeters     = 52000
parkMaxApoapsisMeters      = 900000
parkMaxEccentricity        = 0.25
parkMaxAngularVelocityRadPerSec = 0.05
parkSituations             = ["ORBITING"]
parkDwellSeconds           = 60
parkDebounceFrames         = 3
parkTimeoutSeconds         = 600
commitTimeoutSeconds       = 300
