correctionThrottle         = 0.25
correctionCutDvMps         = 2.0
correctionSettleSeconds    = 10
maxAttitudeErrorDeg        = 30
frozenTelemetrySamples     = 10
maxCorrectionDvMps         = 200

# B25's claims, gated by the same tokens below.
[dimensionsCovered]
D1  = ["commit-in-foreign-soi"]
D14 = ["jool", "laythe", "warp-rails", "scene-flight", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# DERIVED, not measured: the fixture ships 5 sidecars and reads 6 after the
# load-time split (V13); the commit-time optimizer may split the resumed recording
# once or twice more. Re-pin from the first reading.
count = { min = 5, max = 9 }

[expectations.logContracts]
# Tree identity, as B36: the restore took B22's tree back, the seam found the
# recorder already live, and the Laythe crossing was recorded INTO tree 6ec68e87.
# The other-moon poison tokens are B25's: the inward descent crosses the Pol, Bop,
# Tylo and Vall shells and must enter none of their SOIs.
required  = [
  "Recording started",
  "Recording stopped",
  "TryRestoreCommittedTreeForSpawnedActiveVessel: restored tree 'Duna Rocket'",
  "startrecording recordingId=\\w+ already=true",
  "SOI change boundary suppressed in tree mode: Jool to Laythe \\(tree=6ec68e87b782476f970a71df8c8b4685,",
  "CommitTreeFlight: starting tree commit at UT=",
  "CommitTreeFlight terminal: rec=\\w+ terminalState=Orbiting terminalOrbitBody=Laythe",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "startrecording recordingId=\\w+ already=false",
  "discardtree discarded=true",
  "SOI change boundary suppressed in tree mode: \\w+ to Vall",
  "SOI change boundary suppressed in tree mode: Vall to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Tylo",
  "SOI change boundary suppressed in tree mode: Tylo to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Bop",
  "SOI change boundary suppressed in tree mode: Bop to \\w+",
  "SOI change boundary suppressed in tree mode: \\w+ to Pol",
  "SOI change boundary suppressed in tree mode: Pol to \\w+",
]

[expectations.rewind]
# REPORT-ONLY: B25 read 0 / 0 / 0; V13 on this fixture arms nothing.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# REPORT-ONLY. One committed tree is the save-side proof the hop joined B22's tree.
committedTrees = { min = 1, max = 1 }

[runtime]
# B25's arithmetic: 300 LoadGame + 5,400 mission + tail.
budgetSeconds = 6000

[retry]
policy = "once"

[expectedFail]
bugId = ""
