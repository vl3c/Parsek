# EMPTY, the census host decision: a career's cold-OnLoad ERROR surface (ledger recalc over
# 15 actions, contract patching over nine) is not what a LAYOUT review controls or observes,
# and it is gated where it is attributable (`H45`, `H71`).
forbidden = []

[runtime]
# 17 captures and 17 dumps, one in-memory `op=find` capture, two OS-cursor moves, about 55
# single-phase UI ops, and a cold load of a vessel-less career with a 15-action ledger.
# Sized off GUI-1's MEASURED 96 s for 22 captures plus 22 dumps plus an in-game batch on a
# 42 MB career; this lane is smaller and drives no batch. Generous rather than tight because
# the PRODUCT is the images and a KILLED run leaves none of them.
budgetSeconds = 1200

[retry]
policy = "once"

[expectedFail]
# EMPTY, like every other committed spec.
bugId = ""
