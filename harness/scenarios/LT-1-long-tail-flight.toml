schema = 1
id = "LT-1-long-tail-flight"
tier = "nightly"
# THE LONG TAIL, ONE BOOT. Thirty in-game categories that were never driven
# because each is too small to justify its own KSP boot (the inventory's bucket B5,
# the roadmap's "Cause E: one category per spec") - run as ONE multi-category
# batch through the seam's comma-list RunTests selector. The runner batches each
# constituent in turn and prints its own BATCH_COMPLETE line, then the
# category=multi:30 aggregate; the contract that makes that honest is per
# constituent, not per aggregate: every category below pins its own whole line,
# so a constituent that executes nothing reds by name (hlib's
# SINGLE_BATCH_SELECTOR_RULE as amended 2026-09-07).
#
# WHAT THE FIRST CENSUS MEASURED (scratch run `2026-09-07_0840` over 38 candidate
# categories, 386 s wall, 92 cells): 54 passed, 1 FAILED, 37 skipped. The one
# failure was PartEventTiming's deployable cell asserting the pre-S2 snap - test
# drift in a cell no batch had ever run, re-pinned to the animated contract in the
# same branch and PASSING 2/2 on its control flight `2026-09-07_0853`. SEVEN of
# the 38 candidates are NOT constituents here. Five moved to hosts that execute more
# of them on the 2026-09-07 second census (CEN-1/3/4, scratch, not committed):
# `Contracts` and `TestCommands` to LT-3 on the `career-earned-pad` career (both
# career-only cells execute there; here Contracts executed nothing and TestCommands
# 1 of 4), `GhostLifecycle` and `PartEventFX` to LT-5 over the part-showcase corpus
# with playback armed (4 of 17 and 1 of 6 instead of 2 of 17 and nothing),
# `Structure` and `RouteLiveAnchor` to LT-4 on a recorded supply route (Structure's
# route cell and the live-anchor cell both need a committed route). Two are
# constituents NOWHERE: `CrewReservationLive` (no spawned vessel pids on any
# seam-driven host) and `DisabledHoverEcho` (its one cell needs the OS pointer
# inside the game window to measure a hover - it passed on the census and skipped
# on the first pinned flight, and nothing in the seam can place the pointer).
# Pinning either here would be exactly the vacuous slice the contract refuses.
#
# THE SKIPS THAT REMAIN ARE MEASURED AND NAMED, and the whole pin carries every one
# of them: BackgroundSeeder 1 (no stateful parts to seed on the 1-part pod), GhostMapOrbits 1
# (no ghost map vessels), MissionPhasing 1 (wants an airborne vessel), Spawner 1
# (no autostrut parts in range),
# SwitchIntentPatch 2 (its KSC and TS cells scene-skip),
# TestRunnerIsolation 1 (the SPACECENTER cell). LT-2 takes the SPACECENTER slices.
# FLOWN (the 30-constituent re-pin): run `2026-09-07_2030`, PASS attempt 1, wall 292 s, every per-constituent
# line above matched verbatim and every verifier PASS or REPORT.
description = "Run the 30 long-tail in-game categories as one multi-category batch at FLIGHT over the injected synthetic corpus, every constituent pinned whole."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "multi-category", "long-tail", "LT-1"]

[fixture]
# gloops-airshow (1-part crewed pod, PRELAUNCH) with the synthetic corpus injected:
# the store-reading constituents (RecordingStore, TerminalOrbit, RewindSaves,
# Structure's mission cell, IdentityLoss, Watch) read the 274 committed recordings
# rather than passing vacuously over an empty store, which is why this lane carries
# S1.4 / H14's count pin. Categories that mutate the store (Optimizer) are LT-2's,
# on an EMPTY store, for exactly the opposite reason.
saveTemplate = "fixtures/saves/gloops-airshow"
injectedRecordings = "all-synthetic"
craft = []

[driver]
kind = "seam"
# autoRecordOnLaunch pinned false as every H-spec does: several constituents guard
# on an idle recorder. Budget: the 540 s RunTests cap is the M-A5 deferred-step cap;
# the census measured about 8 s of per-category batch overhead (baseline capture,
# crash marker, results export) on top of cells that all finish in under 0.3 s, so
# 30 constituents sit near 270 s (measured 242 s of batch time on the 33-constituent
# pinned flight `2026-09-07_1511`, a 2.2x margin under the 540 s cap - thinner than
# any single-category lane, and the reason a 31st constituent should go to another lane). See runtime.budgetSeconds.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "BackgroundSeeder,Bug289,ContinuationIntegrity,FinalizeLimbo,Flight,ForwardRender,GhostMapOrbits,IdentityLoss,MissionPhasing,PartEventTiming,Pipeline-Anchor-BubbleEntry,Pipeline-AnchorPropagate,Pipeline-Frame,Pipeline-Outlier,Pipeline-Terrain,RecordingStore,RenderComposition,ResourceManifest,RevertVesselStrip,RewindSaves,SpawnCollision,SpawnTerminalOrbit,Spawner,StockWarpLimits,SwitchIntentPatch,TerminalOrbit,TestRunner,TestRunnerIsolation,Unity,Watch" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# Only the environment axes. The 30 constituents touch a dozen dimensions between
# them, but a dimension cell is claimed by a lane that asserts the product
# behaviour the cell names, and a whole-tally pin over a category asserts that its
# cells RAN, not what they proved. The per-category rows in the inventory say what
# each category covers.
D14 = ["sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The injected corpus, unchanged by any constituent (S1.4 / H14 pin the same 274).
count = { min = 274, max = 274 }

[expectations.logContracts]
# ANTI-VACUITY, PER CONSTITUENT: one whole literal line per category, each the
# measured census line (PartEventTiming from its post-fix control flight), plus the
# aggregate whose counts are the sums. `failed=0` on every line is the assertion.
required  = [
  "runtests start category=BackgroundSeeder,Bug289,ContinuationIntegrity,FinalizeLimbo,Flight,ForwardRender,GhostMapOrbits,IdentityLoss,MissionPhasing,PartEventTiming,Pipeline-Anchor-BubbleEntry,Pipeline-AnchorPropagate,Pipeline-Frame,Pipeline-Outlier,Pipeline-Terrain,RecordingStore,RenderComposition,ResourceManifest,RevertVesselStrip,RewindSaves,SpawnCollision,SpawnTerminalOrbit,Spawner,StockWarpLimits,SwitchIntentPatch,TerminalOrbit,TestRunner,TestRunnerIsolation,Unity,Watch isolated=false strict=false multi=30",
  "BATCH_COMPLETE v1 total=2 passed=1 failed=0 skipped=1 category=BackgroundSeeder scene=FLIGHT",
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=Bug289 scene=FLIGHT",
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=ContinuationIntegrity scene=FLIGHT",
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=FinalizeLimbo scene=FLIGHT",
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=Flight scene=FLIGHT",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=ForwardRender scene=FLIGHT",
  "BATCH_COMPLETE v1 total=2 passed=1 failed=0 skipped=1 category=GhostMapOrbits scene=FLIGHT",
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=IdentityLoss scene=FLIGHT",
  "BATCH_COMPLETE v1 total=4 passed=3 failed=0 skipped=1 category=MissionPhasing scene=FLIGHT",
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=PartEventTiming scene=FLIGHT",
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=Pipeline-Anchor-BubbleEntry scene=FLIGHT",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=Pipeline-AnchorPropagate scene=FLIGHT",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=Pipeline-Frame scene=FLIGHT",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=Pipeline-Outlier scene=FLIGHT",
