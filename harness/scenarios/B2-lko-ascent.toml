schema = 1
id = "B2-lko-ascent"
# nightly: the fixtures/saves/b2-lko-craft template is committed (operator
# 2026-07-19) and the mission is live-proven flyable (B2 PASS 2026-07-20,
# MISSION-OK, all verifiers green); flown missions are too long for daily.
tier = "nightly"
description = "LKO ascent: MechJeb AscentAutopilot to an 80 km near-circular orbit; assert orbit-parameter windows."
instanceProfile = "stock-minimal"
tags = ["B2", "S0.2", "flown", "mechjeb"]

[fixture]
# Pre-placed LKO-capable rocket on the pad. Fixture committed (operator
# 2026-07-19). The vessel is KSP's own stock "Kerbal X"
# (Ships/VAB/Kerbal X.craft, the canonical two-stage Mainsail orbiter).
# See the operator runbook's M-B1 section.
saveTemplate       = "fixtures/saves/b2-lko-craft"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "b2_lko_ascent"

# `steps` MUST stay in the [driver] table, so it is declared ABOVE the
# [driver.missionParams] header (a key after the sub-table header would be scoped
# to driver.missionParams.steps and the spec would validate as having zero steps).
# Budget arithmetic (design invariant): missionBudget 780 >= 30 connect +
# (420+300) phases + margin; runtime 1200 >= 240 LoadGame + 780 mission + margin.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 780 },
  { cmd = "CommitTree",                                          expect = "OK" },
  { cmd = "FlushAndQuit",                                        expect = "OK" },
]

# Tolerances tuned from actuals per plan section 10; validated against
# b2_lko_ascent.schema.toml.
[driver.missionParams]
targetApoapsisMeters      = 80000
targetPeriapsisMeters     = 80000
apoErrorMeters            = 5000
periErrorMeters           = 5000
eccentricityMax           = 0.02
inclinationErrorDeg       = 2.0
ascentTimeoutSeconds      = 420
circularizeTimeoutSeconds = 300

[dimensionsCovered]
D1  = ["auto-record-launch"]
# D3 parent-anchored-debris: gated by the debris-child-creation token below.
# The claim is sound because BOTH creation sites stamp the anchor contract
# UNCONDITIONALLY - ParsekFlight.CreateBreakupChildRecording calls
# Recording.ApplyParentAnchorContract for debris and controlled children alike
# (ParsekFlight.cs:7166) - so "a debris child recording was created" implies
# "parent-anchored". Claimed here and not before because presence had no gate at
# all: the count window's old min of 1 admitted the total loss of the population.
# NOTE the token gates CREATION, not the anchor RESOLVING correctly at playback;
# the analyzer's INV rules own malformation, this owns absence.
D3  = ["orbital-checkpoint", "parent-anchored-debris"]
D4  = ["atmospheric", "exo-propulsive"]
D14 = ["kerbin"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# The flight commits ONE main ascent recording, but the Kerbal X drops six
# boosters on the way up and each becomes a parent-anchored debris child
# recording (first live B2 flight 2026-07-20: exactly 7 sidecars, analyzer
# RED=0 over all of them - Parsek modeling staging debris is CORRECT
# behavior the original {1,1} expectation failed to model). max is main +
# 6 boosters + 1 for the launch-escape tower (the live flight produced
# exactly 7 - the LES jettison did not record - but whether that is
# deterministic under MechJeb autostage is unestablished, so the window
# absorbs an 8th rather than redding on staging-timing variance; Fable
# review of the PR #1328 tail, WATCH-4).
#
# MIN 1 -> 7 (autotest-roadmap R1). B2 drives `mlib.b2_decide`, which does NOT
# reach `_b5_flameout_stage`, so this profile has no 8th flameout-staged core:
# its population is 1 root + 6 boosters = 7, which is exactly what the
# 2026-07-20 flight measured. 7 is therefore the TIGHT pin here, not a
# one-below-population floor - note that B11/B12 REJECTED min=7 for themselves
# for the opposite reason (their population IS 8, so 7 is what a single dropped
# recording would produce). Do not copy 7 to an 8-population spec.
# RE-PIN CONTRACT (EVA-4's precedent): if a later run legitimately differs,
# RE-PIN to the newly measured value and record WHICH recordings the run
# produced; do NOT widen back toward 1.
count = { min = 7, max = 8 }

[expectations.logContracts]
# POPULATION gate: the count window cannot be one (it is COMMIT-BLIND, and a
# window wide enough to absorb staging variance is also wide enough to absorb a
# missing population).
#
# THE ALTERNATION IS DELIBERATE, and the first draft of this gate got it wrong.
# Parsek creates a debris child recording at exactly TWO sites, and which one
# fires depends on whether the parent was FOREGROUND or BACKGROUND at the split:
#   - foreground (this profile): ParsekFlight.ProcessBreakupEvent ->
#     CreateBreakupChildRecording, logging `ProcessBreakupEvent: debris child
#     created: pid=` (Info, tag Coalescer, ParsekFlight.cs:7668).
#   - background: BackgroundRecorder.RegisterChildRecordingsFromSplit, logging
#     `Child recording created (debris, TTL=60s):` (Info, BackgroundRecorder.cs:1177).
# The Kerbal X sheds its boosters while it is the ACTIVE focused vessel, and
# RecordingTree.IsBackgroundMapEligible excludes `rec.RecordingId ==
# ActiveRecordingId`, so OnBackgroundPartJointBreak early-returns and the
# BACKGROUND line is never reached on this profile. Pinning it alone (as the
# first draft did) would have red every one of these flights on a token that
# cannot fire. Accepting EITHER proves the claim actually being made - "a debris
# child recording was created" - without betting on the path.
# Both are ParsekLog.Info, so no verboseLogging pin is needed and this spec
# deliberately adds no SetSetting step for one.
# The `(` in the background form is ESCAPED because hlib.evaluate_expectations
# applies each required pattern with re.search: a bare `(` is a group, not text.
# The outer parentheses are an intentional alternation group.
# TIGHTEN-ON-EVIDENCE: once an archived B-lane KSP.log is grepped, replace this
# alternation with whichever single token that log actually contains.
required  = ["Recording started",
             "(ProcessBreakupEvent: debris child created|Child recording created \\(debris, TTL=)",
             "Recording stopped"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 1200

[retry]
policy = "once"

[expectedFail]
bugId = ""
