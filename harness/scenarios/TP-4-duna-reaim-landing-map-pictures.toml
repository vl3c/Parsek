  { cmd = "StopRecording", expect = "OK" },
  { cmd = "DiscardTree", expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "EnterMapView", expect = "OK", budget = 60 },
  { cmd = "MissionConfig", args = { tree = "ced7848157674b8ea19311377c0f6fbc", loop = "true" }, expect = "OK" },
  { cmd = "StartLoopPlayback", args = { tree = "ced7848157674b8ea19311377c0f6fbc" }, expect = "OK", budget = 300 },
  # INSTANT c1-transfer at UT 5355451927: mid heliocentric transfer, the midpoint of V25M's departure D0 5,350,759,909.58 and the recorded-map Duna SOI entry 5,360,143,945.17
  { cmd = "TimeJump", args = { ut = "5355451927" }, expect = "OK", budget = 300 },
  { cmd = "WarpToUT", args = { ut = "5355451932", maxRate = "1" }, expect = "OK", budget = 120 },
  # view tp4-c1-transfer-sys-top: Sun pitch=90 heading=0 distance=50000000000 m
  { cmd = "MapCamera", args = { focus = "Sun", pitch = "90", heading = "0", distance = "50000000000", hold = "4.5" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "tp4-c1-transfer-sys-top" }, expect = "OK" },
  { cmd = "DumpMapGeometry", args = { label = "tp4-c1-transfer-sys-top" }, expect = "OK" },
  # view tp4-c1-transfer-sys-edge: Sun pitch=0 heading=0 distance=50000000000 m
  { cmd = "MapCamera", args = { focus = "Sun", pitch = "0", heading = "0", distance = "50000000000", hold = "4.5" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "tp4-c1-transfer-sys-edge" }, expect = "OK" },
  { cmd = "DumpMapGeometry", args = { label = "tp4-c1-transfer-sys-edge" }, expect = "OK" },
