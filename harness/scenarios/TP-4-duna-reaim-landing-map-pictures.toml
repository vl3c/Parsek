  # INSTANT c1-arrival at UT 5357320632: 600 s before the re-aimed capture 5,357,321,232 (the shifted parking conic's start): the inbound Duna hyperbola
  { cmd = "TimeJump", args = { ut = "5357320632" }, expect = "OK", budget = 300 },
  { cmd = "WarpToUT", args = { ut = "5357320637", maxRate = "1" }, expect = "OK", budget = 120 },
