schema = 1
id = "TP-4-duna-reaim-landing-map-pictures"
# =====================================================================================
# TP-4: PICTURES OF THE RE-AIMED KERBIN -> DUNA LOOP, DOWN TO THE DUNA LANDING.
#
# MODEL CHOICE. The request named V24W-duna-one-warp-stair / V25M-duna-park-player-loop
# and asked for the seam-driven one whose instants reuse without the kRPC mission. V24W
# flies an autopilot mission (`m3_loop_arrival_dwell`) before it observes anything, so its
# instants belong to a live flight; V25M is pure seam over the committed
# `duna-park-recorded` fixture (tree ced78481... 'Kerbal X #2', re-aim engaged with a
# heliocentric parking departure). TP-4 copies V25M and adds `EnterMapView` (V25M never
# opens the map).
#
# MODEL LANE FACTS RELIED ON (V25M header sections 3 and the window map): phaseAnchorUT
# 5,336,966,486.98; window UT = phaseAnchor + (recordedUT - 2,547,277,477.43) for every
# recorded UT at or before the Duna capture; departure D0 5,350,759,909.58; recorded-map
# Duna SOI entry 5,360,143,945.17; V25M's measured arrival jump 5,360,144,085; the
# exported destination loiter cut (7,993.44 s starting at the recorded Duna capture
# 2,570,492,255.34) and the measured arrival hold (`hold=3918.2542181015015s`, inserted at
# the recorded SOI entry, `ArrivalHoldPlanner` / `DestinationLoiterTrim`: HoldAtUT =
# recordedArrivalUT).
#
# THE DUNA INSTANTS ARE READ OFF A FLIGHT'S OWN LOG (run 2026-11-11_2238), NOT DERIVED.
# The first two flights jumped to the RECORDED loop-clock slots of the arrival and the
# descent (5,360,144,085 / 5,360,227,434 / 5,360,227,534) and photographed no lander: a
# re-aimed landing does not play there. The re-aimed transfer is shorter than the recorded
# one (`geomTof=6524003 recordedTof=9384036`, `captureShift=-2860032.857s`), so the ghost
# reaches Duna early, and the descent trigger (`Reaim/DescentTrigger.cs`) plays the recorded
# deorbit -> entry -> landing clip from the first moment Duna's rotation matches the
# recorded deorbit. That run stepped over the clip and the product printed its window:
#   DESCENT SKIPPED cycle=0: reached Done at liveUT=5360144085 with NO frame inside the
#   descent window [5357413107.29558,5357433620.6203632] ... cause=frame-stepped-over-window
# Inside the window the head is recorded 2,570,542,380.99 (the deorbit seam) plus
# (liveUT - 5,357,413,107.30): the Atmo descent `acf1435a...` (49,991 m -> 4,534 m) is the
# first 239.25 s, the surface run `c5d0148a...` the next 22.8 s, then the Landed leaf
# `5466feba...`. Before the window, live UT = loop UT + 2,789,689,009.51 (phaseAnchor -
# spanStart): the re-aimed Sun conic ends at Duna's SOI at 5,357,283,912 and the shifted
# parking conic starts (the capture) at 5,357,321,232.
#
# THE OLD ARRIVAL SLOT IS A FINDING, NOT AN ARRIVAL. At 5,360,144,085, 31 days after the
# landing clip ended, that run's dump and trace still show the transfer member's proto
# icon in the Duna parking orbit (todo REAIM-PARKING-ICON-AFTER-LANDING). The `c1-after`
# view photographs Duna close up after the landing so the page shows what is drawn there.
#
# INSTANTS AND VIEWS (label tp4-<instant>-<view>; one cycle, as V25M flies one; every
# jump is forward):
#   c1-transfer 5,355,451,927  midpoint of D0 and the recorded-map SOI entry: the
#                              heliocentric transfer
#                              sys-top / sys-edge (Sun, 5e10), duna-soi-top (Duna, 1.05e8)
#   c1-arrival  5,357,320,632  600 s before the capture: the inbound Duna hyperbola
#                              duna-soi-top (Duna, 1.05e8), duna-top / duna-edge (Duna, 5e6:
#                              stock fades an orbit line out once the camera is 25 SMA away,
#                              so the SOI-scale view shows the icon and the close ones the line)
#   c1-descent  5,357,413,167  60 s into the descent window (recorded 2,570,542,441)
#                              duna-low-top / duna-low-edge (Duna, 1.5e6), duna-top (7e6)
#   c1-landing  5,357,413,297  190 s into the window; with the 5 s settle and three held
#                              views the pictures fall about 200 to 215 s in, before the
#                              239 s end of the atmospheric descent
#                              duna-low-top, duna-low-edge, duna-low-oblique (30 deg, 1.2e6)
#   c1-after    5,357,440,000  6,380 s after the window closed (the lander is down)
#                              duna-low-top (Duna, 1.5e6)
#
# THE PICTURE PROTOCOL (design-map-mirror.md -> "How to get the pictures"). Every view is
# three steps under ONE label: `MapCamera` (focus / pitch / heading / distance, so the
# frame is the same on every run, and `hold = "4.5"`: 4.5 real seconds after the camera
# settles, so stock's orbit-line zoom fade, about 4 s at 1x, has finished before the
# picture; game time runs on at 1x meanwhile, so each view of an instant is taken a few
# seconds after the previous one), `CaptureScreenshot label=L` (the PNG) and
# `DumpMapGeometry label=L` (the same frame as data, `Screenshots/L.map.json`). The harvest
# copies both into `results/<runId>_shots/`, and `tools/map_mirror.py <shots-dir>` pairs
# them by label into one page. Distances are metres from the focus body's centre, sized
# off the body radius, SOI or the orbit the view must hold (about 2.2x the radius that
# has to fit). Stock clamps pitch near +-86 deg and keeps the camera two radii out;
# `mapcamera ok` reports any clamp, it is not a refusal.
#
# LIGHT EXPECTATIONS BY DESIGN. Each label's `capturescreenshot ok` and
# `dumpmapgeometry ok` line is required, every refusal / error line of the three verbs
# is forbidden, the model lane's anomaly allowance and recording-count window are
# copied, and nothing else is asserted: no render-composition block, no gating block,
# no routing tokens. The lane exists to produce pictures for a human and the mirror
# page; the model lane keeps owning every behavioural claim about the same flight.
#
# FAST-LANE CHECKLIST (harness/README.md "Authoring a fast lane"):
#   1 reuse a flight - NOT APPLIED: the request was a separate picture lane per subject
#     with the model lane left byte-unchanged, and a model lane that also took pictures
#     would change the frames its armed census reads (MapCamera moves the live camera).
#   2 no idle waits - applied: every wait is an explicit-UT `WarpToUT maxRate=1` of 5 s
#     (flight) or the model lane's own two `RecordingState` pacing ticks (TS); the
#     clock moves by `TimeJump`, which costs no wall time.
#   3 minimal dwells - applied: one 5 s 1x settle per instant, so the newly placed ghost
#     and its lines have drawn before the first camera move.
#   4 burns at 1x / 5 b5 coasts / 6 fail fast - not applicable: no mission is flown, the
#     lane replays a committed fixture.
#   7 tight count windows - the model lane's window, copied; tightened after the first
#     flight only if it reads otherwise.
#   8 tier by measured cost / 9 flight_efficiency.py - the first flights (2026-11-11)
#     took 56 to 91 s wall per lane and 88 to 150 s with the hold; flight_efficiency.py over them is
#     still owed. The tier is `operator` because the lane is run on request for pictures.
# =====================================================================================
tier = "operator"
description = "PICTURE LANE, AUTHORED 2026-11-11, FIRST FLOWN GREEN 2026-11-11 (run 2026-11-11_2154; again with the MapCamera hold, run 2026-11-11_2238). V25M's re-aimed Kerbin->Duna loop (heliocentric parking departure) on duna-park-recorded, with the flight map opened (V25M never opens it): at the heliocentric transfer, the inbound Duna hyperbola, the Duna atmospheric descent, just before touchdown and after the landing it frames the map camera, photographs each view and dumps the same frame's geometry under one label, 13 views in all. The Duna instants were re-pinned on 2026-11-11 off the descent window run 2026-11-11_2238 printed (the first two flights photographed the recorded loop-clock slots, where a re-aimed landing does not play); the re-pinned instants and the after-landing view are not flown yet. Expectations are only that every view was taken and none was refused."
instanceProfile = "stock-minimal"
tags = ["TP", "TP-4", "map-pictures", "map-geometry", "screenshots", "map-render", "loop-playback", "flown", "duna", "reaim", "landing", "cross-parent"]

[fixture]
saveTemplate       = "fixtures/saves/duna-park-recorded"
