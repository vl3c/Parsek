schema = 1
id = "PP-1-part-parity-stock"
tier = "operator"
# PART GHOST PARITY, STOCK INSTALL, FULL READING RUN (phase P3 of
# docs/dev/design-part-ghost-parity.md). The part ghost parity tool spawns each part as a real
# one-part vessel co-orbital with the active vessel, builds Parsek's ghost of it from the real
# vessel's own snapshot, photographs the pair from fixed views and measures the difference.
# P2 flew this lane as a 20-part dev run (`limit=20`, default skins; Appendix C). P3 widens it
# to the WHOLE stock part list in EVERY skin (`skins=all`, no `limit`) and judges the result
# with the `partParity` verifier row (harness/lib/partparity.py).
#
# WHAT THE LANE FLIES. `eva2-lko-crewed` (sandbox, every part available, the 13-part Kerbal X
# Probe ORBITING Kerbin at ~100 km; FGV-1's host, design 4.1) boots into FLIGHT, turns every
# auto-record setting off (so no spawned case vessel is recorded), turns verbose logging on
# (the per-case lines are verbose-tier), warps on rails to UT 1900 (FGV-1's sunlit window:
# the pair is lit ~UT 1366-2676 on this orbit, see FGV-1's header arithmetic), clears the
# label directory (`op=reset`), runs TWO time-boxed sweep steps and quits. Nothing is staged
# on the host and the run's save is a throwaway staged copy.
#
# STEP SIZING (design Appendix C). About 0.7 s per case; the stock install loads 479 parts,
# 11 excluded (EVA kerbals, flag, space objects), and `skins=all` roughly doubles the 468
# default-skin cases to ~940, plus the 8 controls: ~660 s of sweep. Each `op=run` step is
# time-boxed at maxSeconds=480 (budget 540, the S8 deferred-step cap) and resumes where the
# previous one stopped (design 5.3), so two steps hold ~960 s of sweep, ~300 s of margin. A
# step after completion answers `done=true` at once. If the second step still answers
# `done=false`, the partParity row reds INVALID(parity-incomplete) with
# `progress.complete=False`: add a third step (that is the measurement this flight makes).
#
# GATES. (1) The partParity verifier row, from the start: every control case reached its
# required outcome (else INVALID(parity-controls)), the sweep reached done and every planned
# case has a complete sidecar or a recorded setup fault (else INVALID(parity-incomplete)),
# and the Python recompute of the shape measures over every control plus a run-id-seeded 2 %
# sample of the part atlases agrees with the C# sidecars (else INVALID(parity-instrument)).
# (2) The part verdicts are REPORT-ONLY (`[expectations.partParity] gating = false`): arming
# them is a later operator decision taken after this reading run (PARTPARITY_ARMED_SPECS in
# harness/lib/test_hlib.py). (3) The interim log pins stay as a second guard on the same
# facts: the engine's run-step summary line with `crashed=0` and `controls=ok`, the seam
# applier's OK line, no `[Parsek][ERROR]`.
#
# READING THE RESULT. The harvest leg moves `<KSP root>/parsek-partparity/pp1/` into
# `harness/results/<runId>_partparity/pp1/` (design 5.1), where the row writes
# `partparity-verdicts.json` beside the sweep. The `verify partParity` line names the
# counts and the worst cases. Every ghost-visual defect a case shows is filed in
# docs/dev/todo-and-known-bugs.md with its case id (design 10).
#
# LOG CONTRACT. The capture engine writes one `[PartParity]` Info line per step summary
# (design 11 "Logging"), e.g.
#   PartParity step label=pp1 op=run ok=true label=pp1 done=true next=20 cases=20 complete=20
#   crashed=0 setupFaults=0 controls=ok wall=21.8
# The first pin requires a RUN step's line with `ok=true`, `crashed=0` and `controls=ok` (both
# run steps print one; the reset step's line says `op=reset ... controls=pending` and never
# matches). The second pin is the seam applier's own OK line.
#
# FAST-LANE CHECKLIST (harness/README.md). (1) Reuse a flight: considered, not applied - FGV-1
# flies the same host and setup, but its batch photographs fairings beside the active vessel
# and a sweep's co-orbital spawns would share its frames and its 420 s budget; the sweep needs
# its own 540 s steps. (2) No idle waits: the one game-time wait is an explicit-UT WarpToUT on
# rails. (3) The time box is the measurement itself (maxSeconds=480, the step's whole budget
# less teardown), not a dwell. (4)/(5) no burns, no coasts. (6) `[retry] policy = "none"`: a
# red is deterministic for one build and install, and a retry's `op=reset` would clear the
# files a reading run exists to keep. (7) Recording count pinned at 0. (8)/(9) after the first
# flight: tier by measured p50 and a flight_efficiency.py check.
#
# LIVE-PROVEN 2026-11-21 in its P2 shape on its fifth flight (`2026-11-21_1739`, PASS attempt
# 1, 134 s wall, 19.0 s of sweep wall over 4 waves, controls=ok). LIVE-PROVEN 2026-11-22 in
# THIS P3 SHAPE (all parts, all skins, two steps, the partParity row): `2026-11-22_0033`, PASS
# attempt 1, 660 s wall, 792 cases, controls ok, complete, recompute 24 / 0 mismatches.
description = "LIVE-PROVEN 2026-11-22 in its P3 shape (all stock parts, skins=all, two PartParitySweep steps, the partParity row): every stock part photographed beside its Parsek ghost in LKO, judged by the partParity verifier row (controls, completeness and the Python recompute gate; part verdicts ARMED 2026-11-23 (P5): the regression gate against harness/partparity/ reds PARSEK-FAIL(part-parity))."
instanceProfile = "stock-minimal"
tags = ["part-parity", "ghost-visual", "flown", "PP-1"]

[fixture]
saveTemplate = "fixtures/saves/eva2-lko-crewed"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # No spawned case vessel may start a recording.
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnEva", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnFirstModificationAfterSwitch", value = "false" }, expect = "OK" },
  # The per-case lines are verbose-tier.
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  # Into FGV-1's sunlit window. Rails warp, explicit UT.
  { cmd = "WarpToUT",   args = { ut = "1900" }, expect = "OK", budget = 120 },
  # Clear the label directory so no earlier run's files mix in.
  { cmd = "PartParitySweep", args = { label = "pp1", op = "reset" }, expect = "OK", budget = 120 },
  # Two time-boxed steps over the whole part list in every skin; the second resumes.
  { cmd = "PartParitySweep", args = { label = "pp1", op = "run", skins = "all", controls = "true", maxSeconds = "480" }, expect = "OK", budget = 540 },
  { cmd = "PartParitySweep", args = { label = "pp1", op = "run", skins = "all", controls = "true", maxSeconds = "480" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# No D7 claim: the cases are stand-alone ghosts built beside real vessels, not a recorded
# event replayed by playback.
D14 = ["kerbin", "sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# Zero: every auto-record setting is off and the spawned case vessels are never recorded.
count = { min = 0, max = 0 }

[expectations.partParity]
# ARMED 2026-11-23 (P5, design section 10 and Appendix F) after two matching reading runs
# (2026-11-22_2159 / 2026-11-22_2317): the regression gate against harness/partparity/baseline-<profile>.json
# and harness/partparity/accepted.toml reds PARSEK-FAIL(part-parity) on a measure past its
# drift tolerance, an unaccepted fail, a gone case or a missing baseline. The instrument
# gates (controls, completeness, recompute, host, press) gate regardless.
gating = true

[expectations.logContracts]
required = [
  # The capture engine's run-step summary line (design 11 "Logging"): every control ok,
  # no case crashed. A second guard on what the partParity row gates.
  "\\[Parsek\\]\\[INFO\\]\\[PartParity\\] PartParity step label=pp1 op=run ok=true label=pp1 done=(true|false) next=[0-9]+ cases=[0-9]+ complete=[0-9]+ crashed=0 setupFaults=[0-9]+ controls=ok wall=[0-9.]+",
  # The seam applier's OK line for a run step.
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] partparitysweep complete label=pp1 elapsed=[0-9.]+s label=pp1 done=(true|false) ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
]

[runtime]
# Boot and load ~180 s, the warp 120, the reset 120, two 540 s run steps.
budgetSeconds = 1800

[retry]
policy = "none"

[expectedFail]
bugId = ""
