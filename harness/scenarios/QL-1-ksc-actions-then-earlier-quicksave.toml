schema = 1
id = "QL-1-ksc-actions-then-earlier-quicksave"
# =====================================================================================
# QL-1 (timeline-operation program, docs/dev/autotest-roadmap.md): career actions at the
# Space Center AFTER a quicksave, then that quicksave loaded at the Space Center. The
# first lane that loads a save back in time with KSC purchases in the abandoned stretch.
#
# RESHAPED AGAIN 2026-10-20 FOR "LOAD RESTORES THE SAVE" PHASE 2 (design
# docs/dev/design-load-restores-the-save.md 4.1 / 4.3 / 5 S2 / 8). NOT FLOWN in this shape.
# The load now carries `playerLoad=true`, so it is a Cold save-file load: the session reset
# forgets the in-memory ledger and the cold load reads the quicksave's own GAME_STATE node,
# written before the four purchases. The four rows are therefore simply not there; nothing
# retires them, so the `Untagged rows after the save retired` and
# `RetireAbandonedFutureActions ... reason=quickload-untagged-after-save` lines of the
# reshape below are now FORBIDDEN, and the gate is the save-file classification plus the
# repeat presses and the ledger oracle (unchanged). The block below is the earlier reshape,
# kept as history; this paragraph is authoritative where they differ.
#
# RESHAPED 2026-10-20 FOR THE OWNER RULING OF 2026-10-19 ("a quickload also undoes Space
# Center purchases made after the quicksave", design parsek-rewind-to-separation-design.md
# section 2.12 Rule 3; plan docs/dev/plans/refly-ledger-safety-implementation.md Phase 2
# step 3, which flips LoadReconcilePolicy's UntaggedLedgerRowsAfterCutoff cell for
# QuickloadFlight / InSessionOther from Keep to a retire). NOT FLOWN in this shape. The
# lane used to pin ruling D2 / QL-R2 (the KSC rows stay as committed future, each control
# is refused `blocked-committed`, and the rows apply when the clock crosses them); that
# ruling is reversed, so the expectation flips:
#   - the load retires the four untagged Space Center rows dated after the save
#     (`[LoadPolicy] Untagged rows after the save retired: kind=<k> saveUT= clockUT=
#     retired=<n> ...` and `[Ledger] RetireAbandonedFutureActions: removed <n> action(s)
#     reason=quickload-untagged-after-save`, Phase 2's literals);
#   - stock is back at the quicksave (the node unresearched, the Tracking Station at level
#     0, Verhat an applicant, the survey Offered), and NOTHING blocks the four controls:
#     the player may buy each again, and each applies at once (applied=true), charged once;
#   - no clock crossing ever happens (there is no committed future left to cross), so the
#     old UT 1300 warp is dropped (fast-lane item 2).
#
# FLOW (career-earned-ksc, vessel-less, save clock UT 409.56):
#   F5 at the Space Center (`SaveGame name=quicksave`), wait to UT 1000, research
#   basicRocketry, upgrade the Tracking Station, hire Verhat Kerman, accept the survey
#   90e4faaf, then load the quicksave at the Space Center (`LoadGame name=quicksave
#   scene=spacecenter`, the TC-1 `Quickload` stand-in QL-2 uses). Press the four controls
#   again: each applies. Quit.
#
# POOLS. The ledger oracle is unchanged and still valid: the first four actions are gone
# with the load, the second four are the ones the end save carries, so the end save is the
# seed plus each declared action ONCE. A kept row (the old ruling) reds the four repeat
# presses (`blocked-committed`); a kept row that also let the repeat through would charge
# twice and red the oracle. (hlib refuses a ledger block beside InvokeRewind /
# InvokeRewindToLaunch / AnswerMergeDialog, not beside LoadGame.)
#
# GATED ON BELIEF (a first flight can falsify): the load is classified InSessionOther (or
# QuickloadFlight; both kinds retire); `retired=` counts at least the four rows (a facility
# upgrade or a hire may book a second row, so the count is a floor); the hire's cost after
# the load is the same 62113 (the hired count is the save's again).
#
# FAST-LANE CHECKLIST: (1) reuse - this IS the plan's "quickload past a Space Center
# purchase" lane, so no new spec carries it; (2) explicit-UT warp, the one left; (3)-(5)
# n/a (no dwell, burn or coast); (6) retry `once`, deterministic; (7) counts n/a;
# (8) nightly stays (about 3 min measured on the old shape, now shorter);
# (9) flight_efficiency.py after the first green flight.
# =====================================================================================
tier = "nightly"
description = "QL-1: career actions at the Space Center after a quicksave (research, facility upgrade, hire, contract accept), then the quicksave loaded at the Space Center as the player's load (playerLoad=true), a Cold save-file load. The load undoes the purchases (owner ruling 2026-10-19): the career is the save's own ledger, which never had the four rows, stock is back at the save, and the player can buy each again, charged once."
instanceProfile = "stock-minimal"
tags = ["QL-1", "timeline-ops", "quickload", "ledger", "career", "action-blocking"]

[fixture]
saveTemplate       = "fixtures/saves/career-earned-ksc"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # F5 at the Space Center.
  { cmd = "SaveGame",   args = { name = "quicksave" },                           expect = "OK", budget = 120 },
  { cmd = "WarpToUT",   args = { ut = "1000", maxRate = "100" },                 expect = "OK", budget = 120 },

  # ---- the abandoned stretch: four KSC actions ----
  { cmd = "KscAction", args = { action = "research-node", node = "basicRocketry" },                               expect = "OK", budget = 60 },
  { cmd = "KscAction", args = { action = "upgrade-facility", facility = "SpaceCenter/TrackingStation" },          expect = "OK", budget = 60 },
  { cmd = "KscAction", args = { action = "hire-kerbal", kerbal = "Verhat Kerman" },                               expect = "OK", budget = 60 },
  { cmd = "KscAction", args = { action = "accept-contract", contract = "90e4faaf-2029-4c6b-8bc1-40226bb0fc27" },  expect = "OK", budget = 60 },

  # ---- back in time: the purchases are undone ----
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "quicksave", scene = "spacecenter", playerLoad = "true" }, expect = "OK", budget = 300 },

  # ---- nothing is blocked: each action applies again, charged once ----
  { cmd = "KscAction", args = { action = "research-node", node = "basicRocketry" },                               expect = "OK", budget = 60 },
  { cmd = "KscAction", args = { action = "upgrade-facility", facility = "SpaceCenter/TrackingStation" },          expect = "OK", budget = 60 },
  { cmd = "KscAction", args = { action = "hire-kerbal", kerbal = "Verhat Kerman" },                               expect = "OK", budget = 60 },
  { cmd = "KscAction", args = { action = "accept-contract", contract = "90e4faaf-2029-4c6b-8bc1-40226bb0fc27" },  expect = "OK", budget = 60 },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
D8  = ["science", "funds", "kerbals", "facilities", "contracts", "recalc-engine", "ksp-state-patcher", "action-blocking"]
D14 = ["career", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The fixture's two committed recordings; nothing in this lane records.
count = { min = 2, max = 2 }

[expectations.logContracts]
required = [
  # ---- the four actions applied after the F5 ----
  "kscaction action=research-node target=basicRocketry applied=true",
  "kscaction action=upgrade-facility target=SpaceCenter/TrackingStation applied=true",
  "kscaction action=hire-kerbal target=Verhat Kerman applied=true",
  "kscaction action=accept-contract target=90e4faaf-2029-4c6b-8bc1-40226bb0fc27 applied=true",
  "loadgame start save=\\S+ name=quicksave ",
  # ---- the load is a save-file load: a Cold load that reads the save's own ledger ----
  "loadgame start save=\\S+ name=quicksave scene=SPACECENTER requestedScene=SpaceCenter [^\\r\\n]* playerLoad=true",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave route=NoVesselSpaceCenter",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*\\[LoadPolicy\\] Save-file load intent armed: nodeUT=[0-9.]+ scene=SPACECENTER",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave (?:(?!Load classified: )[\\s\\S])*Load classified: early=Cold refined=Cold scene=SPACECENTER [^\\r\\n]*\\bcoldReason=save-file\\b",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*Save-scoped session state reset: reason=save-file ",
  "loadgame player-load: firing onGameStatePostLoad save=\\S+ name=quicksave [\\s\\S]*OnLoad game state from save node: ledgerRows=[0-9]+ ",
  # ---- after the load each control applies again (stock back at the save) ----
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*kscaction action=research-node target=basicRocketry applied=true",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*kscaction action=upgrade-facility target=SpaceCenter/TrackingStation applied=true",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*kscaction action=hire-kerbal target=Verhat Kerman applied=true",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*kscaction action=accept-contract target=90e4faaf-2029-4c6b-8bc1-40226bb0fc27 applied=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The old ruling (D2 / QL-R2): a kept row blocking a control, or held back as future.
  "kscaction refused action=\\S+ reason=blocked-committed",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*Clock-crossing reached committed-future rows",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*PatchScience: 111\\.6 -> 106\\.6",
  # Nothing is refused after the load, by a backstop or by stock state.
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*kscaction refused ",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*GUARDED (UPLIFT|DRAWDOWN) clamped",
  "loadgame start save=\\S+ name=quicksave [\\s\\S]*An item with the same key has already been added",
  # The old in-session route (design 8): no in-session classification of the F9, and no
  # retire, because the four rows are not in the save.
  "loadgame player-load: firing [\\s\\S]*Load classified: early=InSession ",
  "\\[LoadPolicy\\] Untagged rows after the save retired: ",
  "RetireAbandonedFutureActions: removed [0-9]+ action\\(s\\) reason=quickload-",
]

# The ledger oracle: seed (the staged fixture) plus each declared action ONCE, diffed HARD
# against the final save. Valid across the back-in-time load because the save's ledger
# never had the first four rows and the end save carries only the repeat presses (header).
[expectations.ledger]
seedFrom     = "template"
tolerances   = "default"

[[expectations.ledger.manifest]]
  ut         = 0.0
  kind       = "tech-unlock"
  # basicRocketry, 5 science (stock tree; L1-research-node-career, KB-3).
  science    = -5.0
  provenance = "seam-declared"

[[expectations.ledger.manifest]]
  ut         = 0.0
  kind       = "facility-upgrade"
  # Tracking Station level 0 -> 1 (L1-upgrade-facility-career, live-proven).
  funds      = -150000.0
  provenance = "seam-declared"

[[expectations.ledger.manifest]]
  ut         = 0.0
  kind       = "kerbal-hire"
  # The recruit cost depends on the hired count; this career's is 62113, measured by the
  # first flight (2026-10-16_1124_a2 charged 62113 for the hire).
  funds      = -62113.0
  provenance = "seam-declared"

[[expectations.ledger.manifest]]
  ut           = 0.0
  kind         = "contract-accept"
  contractGuid = "90e4faaf-2029-4c6b-8bc1-40226bb0fc27"
  # The survey's advance, the third `values` field of its CONTRACT node in the fixture.
  funds        = 7574.99992847443
  provenance   = "seam-declared"

[runtime]
# Budget arithmetic (M-A5 S8): each deferred verb waits max(step budget, 600) + 60 = 660 s
# at worst. Two LoadGames and one WarpToUT are deferred (1980); SaveGame (120), eight
# KscActions (480) and the light verbs add theirs. 3600 clears it.
budgetSeconds = 3600

[retry]
policy = "once"

[expectedFail]
bugId = ""
