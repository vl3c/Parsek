schema = 1
id = "V3C-flight-arrival-companion"
# =====================================================================================
# V3C: the COMPANION FLIGHT -- the only shape that can reach the re-aim seam
# defect's actual surface. V3F/V3R measured WHY a parked observer cannot: the
# flight engine's zone LOD hides a far loop ghost BEFORE positioning
# (GuardSkip reason=hidden-by-zone, 903 frames per dwell, both modes), so no
# seam instrument can fire for it by construction. The 2026-06-15 forensics
# fired because the PLAYER was flying a fresh Duna mission ALONGSIDE the
# looped ghost -- this spec mechanizes exactly that: the flown B17 pad-align
# mission (verbatim missionParams) flies a fresh DD1 to Duna while the
# INJECTED looped-interplanetary recording (the same flown geometry, the
# S1.8 corpus) replays ENGAGED RE-AIM beside it. Both the live craft and the
# phase-locked ghost target the same next synodic window, so the live vessel
# rides inside the ghost's zone through the transfer, the engine positions
# the ghost every frame, and the [ReaimSeam] trace + the new Tier-C
# loop-seam-teleport instrument finally sample the handoff seams.
#
# READING RUN, armed sweep: the EXPECTED outcome is the ~62-deg seam teleport
# (87.76 Mm at Kerbin->Sun, 49.19 Mm at Sun->Duna, ~1.03-1.04x SOI) raising
# loop-seam-teleport at one or both handoffs -> PARSEK-FAIL(anomaly) IS the
# lane earning its keep (the GS-3 inversion; the post-reading arming pins the
# reproduction as tolerate-plus-require). A clean sweep with the [ReaimSeam]
# dist[] trace demonstrably LIVE would instead re-scope the 2026-06-15
# defect honestly. A run where the trace never fires at the seam instants is
# VACUOUS for the seam question (the V3F/V3R lesson) and must be treated as
# a finding about zone reach, never as a clean bill.
#
# READING LEDGER (three attempts 2026-08-07, spec iterated once):
#   Run 1 (2026-08-07_2257, PASS 913 s, the pre-cycle-alignment spec): GREEN
#   BUT VACUOUS - the engaged anchor floors at the recording's SPAN END, so
#   the ghost's cycle begins one synodic (D0=24,396,028.99) after the 4.65M
#   window a fresh pad flies; the whole flight ended before the unit ever
#   activated (unit-span-clock-unresolved x694, zero trace lines). That
#   measurement produced the TimeJump-to-23.0M cycle alignment below.
#   Run 2 attempts 1+2 (2026-08-07_2315/_2324, both INVALID MISSION-FLAKE):
#   the cycle-aligned flight REACHED THE TRACE - [ReaimSeam] dist[] x48 with
#   full Sun/Kerbin/Duna range readings while inside the ghost's zone
#   (in/out churn: hidden-by-zone x290) - the FIRST time any unattended run
#   drove the flight-engine seam surface. But the mission itself MISSED the
#   Duna encounter at the cycle-2 window (post-apoapsis tgtD growing, COAST
#   timeout at ~UT 34.2M): the B17 window solve + correction budget are
#   tuned on the cycle-1 window, and Duna's e=0.051 makes window quality
#   cycle-dependent. The seam instants were crossed out-of-zone, so the
#   seams remain UNMEASURED. NEXT STEP (this spec stays reading-posture):
#   encounter tuning for the ghost-cycle window - likely a wider correction
#   budget or a planner-matched window solve - then the GS-3 pin.
#   TUNING BRANCH, runs 3-5 (2026-08-08; attempts named per the run-3-to-5
#   scheme: run 3 = _0747/_0802, run 4 = _0825/_0836, run 5 = _0852/_0903,
#   preceded by _0746, an environment abort - Parsek.Tests was never built
#   in the fresh worktree, so the injector no-op'd; the runs also placed
#   this spec in flake quarantine, rate 0.67 over 7d):
#   - THE 800 CAP CLOSED THE ENCOUNTER: run 2's miss traced to
#     'course-correction dv 522.1 m/s exceeds cap 450.0; plan removed'
#     (a second disqualification measured 529.9); with the cap at 800 every
#     branch flight reached Duna. Run 3 attempt 2 (_0802) is the PASS:
#     283 km park under the then-narrow windows, commit UT 29,216,350.
#   - THE BACKWARD-JUMP LESSON, corrected after five-agent review: the
#     seam REJECTS a backward TimeJump loudly ('timejump refused
#     reason=backward-jump', WARN + verdict=REJECTED met=false on all three
#     bracket steps of _0802). The run STILL classified PASS because
#     post-mission seam steps in the recording role are non-gating on a
#     MISSION-OK run (driverValidity PASS with allExpectedMet=false) - the
#     REAL trap: a green V3C run can silently dwell nowhere. The forbidden
#     token below makes that self-detecting.
#   - THE SEAM ARITHMETIC, corrected the same way: the span clock rides
#     phaseAnchor (24,306,768.36, AFTER the PadAlignLaunch shift of
#     +7,378.5 s - not the schedule anchor 24,299,389.85 this header
#     previously used) and the unit's span start 4,653,692.598 (not the
#     recording's explicitStartUT). True cycle-0 arrival seam =
#     D0 + tof = 28,781,184.52 (triple-confirmed against the synth-geometry
#     line's soiEntryUT); cycle-1 = +cadence = 48,434,260.29. The commit
#     lands 435 ks past cycle 0's seam (the live cycle-2 transfer runs
#     ~353 ks longer than the recorded tof).
#   - THE ZONE WALL (the decisive correction): the hide gate is
#     DistanceThresholds.GhostVisualRangeMeters = 120,000 m (ParsekConfig),
#     NOT the ~55.8 Mm this header previously inferred (that figure was
#     merely the smallest HIDDEN sample of a monotonic series - an upper
#     bound with no lower bound). The Sun->Duna seam sits AT Duna's SOI
#     radius (47,921,949 m) while any park orbits ~5.65 Mm radius: the
#     separation is ~400x the gate, so THE ARRIVAL SEAM IS UNOBSERVABLE
#     FROM ANY DUNA PARK, at any bracket UT, by construction. The cycle-1
#     bracket steps were therefore REMOVED (their targets were also
#     7,190 s short per the arithmetic above). What the co-flight DID
#     measure: [ReaimSeam] dist[] samples x56 during the early coast -
#     the live craft genuinely rode inside the 120 km corridor of the
#     engaged ghost for stretches - so the engine surface IS reachable by
#     co-flight; observing a SEAM INSTANT needs the observer inside 120 km
#     AT that instant (a to-the-second co-departure, or a temporary
#     zone-relax debug aid in the MapRenderWarpControl mold - a DESIGN
#     decision for the next session, not a spec parameter).
#   - THE IKE MODE, causality corrected: the transit is ARRIVAL-GEOMETRY
#     VARIANCE, not the park windows (run 4 attempt 1, _0825, hit Ike
#     UNDER THE NARROW WINDOWS; the windows are post-capture acceptance
#     predicates evaluated after the SOI guard and cannot steer the
#     hyperbola). The correction rounds aim courseCorrectPeriapsisMeters =
#     300 km altitude - dead centre of Ike's funnel (shell ~1,734-4,026 km
#     ALTITUDE) - and achieved 5,330 km alt on run 4 (Ike-clear, the
#     natural high-band capture) vs 2,081 km alt on run 5 (inside the
#     shell; its capture node also planned 1,554 s AFTER Ike entry). The
#     Ike-clear lever is the AIMED ARRIVAL PERIAPSIS: >= ~4,300 km alt
#     (high band, what run 4 flew naturally) or <= ~1,600 km alt (low
#     band, ~135 km inside the shell's inner edge) - a follow-up flight.
#   SEAM INSTANT RESOLVED (2026-09-07, v3c-seam-instant; the roadmap section
#   "The re-aim seam instant (V3C): the co-location decision" is the design
#   record). Re-reading run 3 attempt 1 (_0747, collected as
#   logs/2026-08-08_1102_V3C-flight-arrival-companion) frame by frame around
#   the seam refuted the ZONE WALL paragraph above on three counts:
#   - THE CORRIDOR NEVER EXISTED: every dist[] sample coincides with a
#     '[Zone] ... beyond visual range (...) but exempt during warp (orbital
#     ghost)' line at render distances of 55.9-163.6 Mm. The trace fired
#     because the #171 warp exemption (zone Beyond + warp > 1x + orbit
#     segments) lifts the 120 km hide; that gate binds ONLY at 1x, and the
#     x413 hidden-by-zone GuardSkips all sit in the 1x planning windows.
#   - THE GATE AT THE SEAM WAS THE WARP HIDE: the seam (28,781,184.52,
#     confirmed by this run's icon bounds=[24396029.0,28781184.5]) was
#     crossed at 10,000x with GuardSkip reason=unit-member-warp-hidden (x46),
#     from suppressGhosts = !mapViewEnabled && warp > 50x (WarpThresholds.
#     GhostHide); engine-frame-iter read hs=F [out:none] for the whole coast,
#     so nothing was positioned and neither instrument could run. A zone-relax
#     aid would have changed nothing at that frame (option 2 not built);
#     a to-the-second co-departure needs ~13 s launch timing and ~0.03 m/s
#     velocity agreement against a 1,500 s margin and a 2.0 m/s burn cutoff
#     (option 1 not achievable).
#   - MAP VIEW LIFTS IT: suppressGhosts is false whenever MapView.MapIsEnabled
#     (#290, ghosts stay positioned at any warp for the map markers), and the
#     warp exemption covers the zone hide, so a flight-scene observer with the
#     map OPEN under rails warp keeps the far loop ghost positioned through the
#     seam instant at any distance. Hence the EnterMapView step below and the
#     REQUIRED '[ReaimSeam] SEAM ... body=Duna' anti-vacuity token.
#   RATE ARITHMETIC for reading the Tier-C verdict: the teleport threshold is
#   max(1,000 km, (bodySpeed + 15 km/s) * dt * 4). At 10,000x and the instance's
#   measured 60 fps (dt ~167 s) it is ~14.8 Mm, so the ~49 Mm seam jump raises
#   loop-seam-teleport; at 100,000x (dt ~1,667 s) it is ~148 Mm and the jump
#   reads as expected motion, so only the SEAM line reports it. _0747 crossed
#   the seam at 10,000x (KSP's WarpTo ramp), so the GS-3 red is EXPECTED but
#   depends on the ramp on the day; the SEAM line's jump= value is the
#   rate-independent measurement.
#   READING RUN UNDER THE MAP-OPEN SHAPE (2026-09-07_1906, PASS attempt 1,
#   wall 953 s, mission 893 s, MISSION-OK, every verifier PASS/SKIPPED; DLL
#   built from this branch at origin/main 31dd5764a + docs, deployed hash
#   dfa0cc19...3252 re-asserted before launch). THE SEAM WAS OBSERVED, FOR THE
#   FIRST TIME BY ANY UNATTENDED RUN:
#     [ReaimSeam] SEAM member=0 seg#3->4 body=Duna loopUT 9126287->9128287
#       jump=47431188m (prevPos->thisPos discontinuity)
#   47.43 Mm at the Sun->Duna handoff = 0.990 x Duna's SOI radius
#   (47,921,949 m): the 2026-06-15 transform teleport, reproduced. The
#   prediction in the roadmap section held on every count: entermapview ok
#   mapOpen=true; unit-member-warp-hidden x0 (was x46 on _0747); the #171
#   exempt line x37 and dist[] x88 (was 25 / 56) with the ghost tracked to
#   dist[Duna]=128 Mm one frame before the seam; hidden-by-zone x412 all in
#   the 1x planning windows (the zone gate at 1x is untouched by the map, as
#   stated). loop-seam-teleport did NOT raise, by the rate arithmetic above:
#   the seam frame's loop clock stepped 2,000 s (100,000x effective), so the
#   threshold was ~177 Mm against the 47.4 Mm jump. Census: recordings 3
#   (injected + live DD1 + one JointBreak debris), trees 2, committedTrees 2,
#   terminalStates Orbiting 2 / Destroyed 1, points total 582, anomalies none,
#   analyzer red=0, ledger oracle PASS, structure clean.
#   ARMED OFF THAT RUN'S BYTES (the GS-3 inversion, tolerate-plus-require):
#   the required SEAM token now pins seg#3->4 and the DEFECT CLASS
#   jump=[1-9][0-9]{6,}m (>= 1,000 km, the same floor the Tier-C instrument
#   uses; healthy recorded seams measure 7-10 km on S1.8), so this lane REDS
#   WHEN THE TELEPORT IS FIXED - which is the point: it is the regression
#   target that flips when the option-3 work lands, at which time the token
#   is inverted to the healthy class. loop-seam-teleport is TOLERATED (it is
#   rate-dependent - a seam frame at <= 10,000x raises it, at 100,000x it
#   does not - and the SEAM token already carries the reproduction); the
#   recordings count is pinned at 3 and the structure block is declared
#   REPORT-ONLY with the observed integers.
#   ARMED RE-FLIGHT (2026-09-07_1932, PASS attempt 1, wall 930 s, mission
#   876 s; DLL rebuilt after the origin/main merge, deployed hash 433291dc...
#   743da re-asserted): SEAM member=0 seg#3->4 body=Duna loopUT
#   9126127->9128127 jump=47523736m (0.992 x SOI; 0.2% from the reading's
#   47,431,188 m), unit-member-warp-hidden x0, exempt x36, dist[] x85,
#   hidden-by-zone x410, anomalies none, census identical to the integer
#   (recordings 3, trees 2, committedTrees 2, Orbiting 2 / Destroyed 1,
#   JointBreak 1). The armed windows hold against a run they were not
#   written from.
#   NEGATIVE CONTROL (2026-09-07_1955, PARSEK-FAIL(expectation), wall 930 s): the required jump
#   class was inverted to the healthy one (jump=[0-9]{1,6}m) and flown; the
#   seam reproduced (jump=47525840m) so the token MISSED and the run red on
#   exactly that expectation with every sibling row green, proving the pin
#   discriminates the defect class from a healthy seam. Reverted in the
#   same change; the committed token is the defect-class one above.
# =====================================================================================
tier = "operator"
description = "COMPANION FLIGHT: the flown B17 pad-align Duna mission flies a fresh DD1 while the injected looped-interplanetary recording replays ENGAGED re-aim alongside, with the MAP OPEN for the whole flight (EnterMapView before the mission phase) so the flight engine keeps the far loop ghost positioned through the Sun->Duna seam instant under rails warp (map view lifts the >50x warp hide, the #171 warp exemption lifts the 120 km zone hide - the 2026-09-07 co-location decision, roadmap section). ghostRenderTracing + the loop-seam-teleport Tier-C instrument armed; ARMED 2026-09-07 off reading run 2026-09-07_1906 (PASS attempt 1, wall 953 s), which observed the seam for the first time from any unattended run: [ReaimSeam] SEAM member=0 seg#3->4 body=Duna jump=47431188m, 0.990 x Duna's SOI radius - the 2026-06-15 teleport reproduced. The required token pins that DEFECT CLASS (jump >= 1,000 km; the GS-3 inversion: this lane reds when the teleport is fixed), loop-seam-teleport is tolerated because its raise is rate-dependent (silent at the 100,000x the seam frame rode), the recordings census is pinned at 3."
instanceProfile = "stock-minimal"
tags = ["V3", "flight-arrival", "companion", "reaim", "interplanetary", "flown", "armed"]

[fixture]
# Stamped by FORGE-b17-duna-pad + harvest_bdock_station.py --target-name
# b17-duna-pad (see that spec's header for the exact command). The DD1 sits
# PRELAUNCH on the pad, UNCREWED, in a sandbox save whose difficulty carries
# requireSignalForControl = False (the A7 comm-link margin note).
saveTemplate       = "fixtures/saves/b17-duna-pad"
injectedRecordings = "looped-interplanetary"
craft              = []

[driver]
kind    = "autopilot"
mission = "b17_duna_direct"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header
# (a key after the sub-table header would be TOML-scoped into it and the spec would
# validate as having zero steps).
#
# ONE commit, MID-MISSION (ORBIT-COMMIT). No post-mission CommitTree step -- the
# B11/B12/B13 accounting rule: a second CommitTree against a no-longer-active tree
# answers ERROR no-active-tree and would make every green flight driver-INVALID.
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  # THE COMPANION ARM: loop the injected synthetic tree (the flown geometry)
  # BEFORE launch, so the engaged unit phase-locks to the same next synodic
  # window the pad-align mission is about to jump to and fly.
  { cmd = "MissionConfig", args = { tree = "tree-loopedinterp0000000000000000dd17", loop = "true" }, expect = "OK" },
  # FLIGHT-scene tracer (the loop-seam-teleport raise gate) + verbose floor.
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # THE CYCLE ALIGNMENT (reading run 1, 2026-08-07_2257, measured): the
  # engaged unit's phase anchor FLOORS AT THE RECORDING'S SPAN END (9.16M),
  # so its replay cycle starts at D0=24,396,028.99 (anchor 24,299,389.85) -
  # one synodic AFTER the 4.65M window a fresh pad flies. Run 1 flew the
  # 4.65M window and ENDED before the ghost's cycle even began
  # (unit-span-clock-unresolved x694; zero [ReaimSeam] lines - vacuous for
  # the seam question). Jump the pad epoch to 23.0M so the pad-align machine
  # targets the SAME 24.3M-family window the ghost replays, and the live
  # craft flies alongside the engaged replay - the co-flight corridor that
  # produced this spec's dist[] sampling (x56 on run 3).
  { cmd = "TimeJump", args = { ut = "23000000" },  expect = "OK", budget = 300 },
  # THE CO-LOCATION DECISION (2026-09-07, header ledger + roadmap section): open
  # the MAP before the mission phase and leave it open. With MapView.MapIsEnabled
  # the engine's suppressGhosts (= !mapViewEnabled && warp > 50x) is false, so the
  # coast at 10,000x-100,000x no longer skips the loop member as
  # unit-member-warp-hidden (the gate that hid the seam on _0747), and under
  # warp > 1x the #171 exemption keeps a Beyond-zone orbital ghost positioned,
  # so both seam instruments (inside PositionFromOrbit) run at the seam frame at
  # any distance. The mission machine is camera-agnostic (kRPC + MechJeb; the
  # mid-mission pad-align TimeJump touches warp, never the map). Budget as B32.
  { cmd = "EnterMapView",                                                    expect = "OK", budget = 120 },
  { phase = "mission",  expect = "MISSION-OK", budget = 4200 },
  # NO post-mission seam bracket: the arrival seam is crossed MID-MISSION
  # (28,781,184.52, ~435 ks before the commit) with the map open, which is
  # where this spec measures it; the required SEAM token below is the
  # anti-vacuity pin, and a post-park bracket would be a backward TimeJump the
  # seam refuses (the forbidden token below).
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[driver.missionParams]
# --- Ascent to a MINIMAL 100 km park. B7/B16 park at 700 km SOLELY to make the
# WaitForPhaseAngle window wait warp-legal; B17 never waits (the pad jump killed
# the wait), so the park is the cheapest legal one: circularize low, trim round,
# eject on the next plan. The low park also makes the ejection marginally cheaper.
targetApoapsisMeters       = 100000
targetPeriapsisMeters      = 100000
apoErrorMeters             = 15000
# MEASURED, flight 1 (2026-08-05_2143 + _2253, both attempts): the DD1's
# hot-staged Terrier ascent + MechJeb circularization delivers 106.7 x 92.8 km
# (ecc 0.010) against the 100 km target, and the original 5,000 m floors sat
# the machine in CIRCULARIZE at 1x until the wall budget died. The gates are
# ENTRY sanity floors, not the roundness contract -- parkTrimEccMax = 0.02 is
# the roundness contract (flight 1's 0.010 already passes it) -- so they are
# widened to admit the measured profile (B16's equivalent window is ~21% of
# target; these are 15-20%).
periErrorMeters            = 20000
ascentTimeoutSeconds       = 2400
circularizeTimeoutSeconds  = 12000
# The B15 lesson, applied from day one: an eccentric park breaks MechJeb's
# ejection sizing (park_trim_verdict's measured 123 m/s shortfall); B7 never set
# this and B17 must.
parkTrimEccMax             = 0.02

# --- PAD-ALIGN (the no-loiter mechanism; the four keys this lane adds).
padAlignEjection           = true
# Ascent (~600 game-s) + circularize/trim (~600) + plan latency, so the ejection
# burn lands AT the window. A miss either side is priced into the correction
# budget (roughly 65-70 m/s per degree of phase when corrected at round 0), never
# waited out.
padAlignMarginSeconds      = 1500
padAlignTimeoutSeconds     = 300
# 6 h: the named missed-window ASSERT-FAIL fires far below any autowarpable wait
# (one synodic period is ~19.6M s) while admitting every healthy ASAP plan (the
# decompiled burnUT pick is within ONE ~35-min park orbit). NOTE this value does
# double duty: the machine guard measures node-vs-PLAN-TIME, while the
# padAlignedDirectEjection row measures node-vs-LAUNCH (absorbing ascent +
# circularize, worst-case ~14,700 game-s under the budgets above) -- keep it
# comfortably above ascent+circularize+plan or a healthy slow flight could fail
# the row while passing the guard.
padAlignWindowGuardSeconds = 21600

# --- Interplanetary transfer (B7's five, retargeted at Duna).
targetBodyName             = "Duna"
homeBodyName               = "Kerbin"
interplanetaryTransfer     = true
# "Sun" ONLY, deliberately NOT B16's ["Sun", "Mun"]: a Mun (or Minmus) transit on
# the ejection leg would break the "clean direct" escape structure exactly the way
# Ike breaks the arrival, so the machine's ejected-terminal ASSERT-FAIL plus the
# forbidden tokens below make a moon graze a NAMED failure, not a legal via.
viaBodyNames               = ["Sun"]
returnBodyName             = "Sun"
transferMinApoapsisMeters  = 0
# Ejection burn-done evidence is the hyperbolic Kerbin-frame ecc. At a 100 km park
# the Duna-transfer v-inf (~920 m/s) prices ecc-1 at ~0.16, so the B7 floor 1.05
# discriminates cleanly.
ejectionEccFloor           = 1.05
# SMALL, deliberately (B16 uses 18,000,000 because its NodeExecutor autowarp
# legitimately carries the window wait). B17's ejection node is minutes ahead by
# construction; 20,000 game-s admits the aim + autowarp + burn with an order of
# magnitude to spare while making a silently-waited window PHYSICALLY unable to
# fit inside the phase budget -- the second structural no-loiter guard.
transferBurnTimeoutSeconds = 20000

# --- Correction rounds (time-to-SOI mode; the B7 shape, B15-sized budget).
courseCorrectPeriapsisMeters = 300000
# CYCLE-2 CAP (reading run 2, 2026-08-07_2324, measured): the ghost-cycle
# window prices the mid-course correction at 522.1 m/s - 16% over B17's
# cycle-1 cap of 450, so the machine disqualified the plan and the raw
# intercept missed Duna (Duna e=0.051 makes window quality cycle-dependent;
# ~522/67 = ~7.8 deg effective phase cost at this cycle). 800 admits the
# measured correction with margin while staying far under the DD1's
# ~1,700 m/s transfer-stage reserve (A6 arithmetic); B17's own 450 cap is
# deliberately untouched - it is the cycle-1 cleanliness contract.
maxCorrectionDvMps         = 800
correctionTriggerAltsMeters       = []
# Round 0 right after Sun-SOI entry: with an ASAP ejection the transfer reaches
# Duna's ORBIT but not necessarily Duna (the pad jump owns the phase), so the
# finding-18 no-encounter early trigger + this round CREATE the encounter
# mid-course; round 1 at ~5.8 days out fine-tunes the arrival periapsis.
correctionTriggerTimeToSoiSeconds = [20000000, 500000]
planTimeoutSeconds         = 300
planRetrySeconds           = 10
planWarpFactor             = 2
coastTimeoutSeconds        = 9500000
flybyTimeoutSeconds        = 600000
coastWarpFactor            = 7
flybyWarpFactor            = 5
flybyMaxWarpFactor         = 6
nodeArrivalMarginSeconds   = 15
soiLeadSeconds             = 30
flipPhysicsWarpFactor      = 1
# Duna's atmosphere tops out at 50 km; the sampled in-SOI floor must clear it
# (an atmospheric graze would both perturb the trajectory and pollute the
# recording with an Atmospheric section).
targetPeriapsisFloorMeters = 55000

# --- Capture + observer-grade park + commit (B11/B12 tail; the Ike-clear
# heliocentric traverse).
captureEnabled             = true
capturePlanTimeoutSeconds  = 300
captureBurnTimeoutSeconds  = 400000
# (The 300 km-class "park IS the cleanliness contract" text that stood here
# is B17's contract, deliberately NOT this spec's - see the observer-grade
# block below. Review note: no green capture has yet been produced UNDER
# the widened windows - run 3's PASS parked at 283 km under the then-narrow
# ones; the widening is justified by run 4's measured 5,330 km-altitude
# Ike-clear capture that the narrow windows falsely rejected as under-burn,
# but it is a posture awaiting its first green, not a proven one.)
# OBSERVER-GRADE park (run 4 attempt 2, 2026-08-08_0836, measured): the
# cycle-2 arrival geometry captured into a perfectly good 5,330 km-altitude
# circular Duna orbit (Ike-CLEAR - the shell tops out ~4,026 km altitude)
# that B17's 300 km-class park windows rejected as under-burn, discarding a
# healthy flight. V3C's live craft is an OBSERVER - it only needs to
# survive and stay bound inside the SOI - so the park windows accept any
# safe bound orbit; the mlib left-the-target-SOI guard still reds an Ike
# transit REGARDLESS of these windows (it runs before the acceptance
# check), so the widening cannot mask a moon brush. The 300 km-class
# cleanliness contract is B17's, deliberately not duplicated here.
parkMinPeriapsisMeters     = 60000
parkMaxApoapsisMeters      = 40000000
parkMaxEccentricity        = 0.9
parkMaxAngularVelocityRadPerSec = 0.05
parkSituations             = ["ORBITING"]
parkDwellSeconds           = 180
parkDebounceFrames         = 3
parkTimeoutSeconds         = 600
commitTimeoutSeconds       = 300

# --- Shared machine housekeeping.
burnStagnantSeconds        = 120
burnNoStartSeconds         = 600
correctionThrottle         = 0.25
correctionCutDvMps         = 2.0
correctionSettleSeconds    = 10
maxAttitudeErrorDeg        = 30
frozenTelemetrySamples     = 10

# CLAIM-IS-NOT-GATE. Every value below is backed by a gate in THIS spec's own
# contract: auto-record-launch by the Recording-started token + the SetSetting
# step; commit-in-foreign-soi by the terminalOrbitBody=Duna commit token; the
# D14 bodies by the SOI-traverse tokens; warp cells by the mission's rails/high
# warp policy the machine cannot complete without (coast budget vs 1x is the
# ~111-wall-hour arithmetic). NOT claimed, deliberately: D14 "ike" (this lane's
# contract is Ike's ABSENCE), D14 "soi-count" (nothing here gates a count beyond
# the two required transitions), and any Sun cell (the registry carries no sun
# value; the B7 gap note).
[dimensionsCovered]
# CLAIM-IS-NOT-GATE, reading-run minimalism: the companion's coverage claims
# wait for the armed follow-up; the subject flight's cells stay claimed by
# B17 itself (this spec deliberately claims nothing it shares with B17).
D14 = ["scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header or TOML scopes it into the sub-table
# (hlib.validate_spec rejects the misplaced form).
# loop-seam-teleport is TOLERATED, not required: its raise is rate-dependent
# (threshold max(1,000 km, (bodySpeed + 15 km/s) * dt * 4); a seam frame at
# <= 10,000x raises it, the 100,000x frame _1906 rode did not), and the
# reproduction itself rides the required [ReaimSeam] SEAM defect-class token,
# which is rate-independent. Tolerate-plus-require, per the header's GS-3 plan.
allowedAnomalies = ["loop-seam-teleport"]

[expectations.recordings]
# PINNED off _1906: the injected synthetic recording + the live DD1's main
# recording + its one JointBreak debris (the hot-staged booster) = 3.
count = { min = 3, max = 3 }

[expectations.recordings.structure]
# REPORT-ONLY (gating stays false): the observed integers from _1906, so a
# drift in the topology is reported without gating a lane whose contract is
# the seam token. Arming waits for a second matching reading, per the
# saveParse discipline.
trees          = { min = 2, max = 2 }
committedTrees = { min = 2, max = 2 }
recordings     = { min = 3, max = 3 }
terminalStates = { Orbiting = { min = 2, max = 2 }, Destroyed = { min = 1, max = 1 } }
branchPoints   = { JointBreak = { min = 1, max = 1 } }

[expectations.rewind]
# REPORT-ONLY on the reading run.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.logContracts]
# Reading-run pins:
#   the seam-instant anti-vacuity token (the [ReaimSeam] SEAM line, see below);
#   the loop-arm evidence (missionconfig applied / SetLoopEnabled);
#   the mode evidence: ReaimDiag classify + the ENGAGED line for the injected
#     member (no mission-name prefix: the injected tree's default mission
#     name is seeded, not pinned);
#   FORCED FAITHFUL is forbidden (no knob step in this spec).
# The subject flight's own health rides MISSION-OK; B17's commit/SOI tokens
# stay B17's contract, deliberately not duplicated here.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "\\[ReaimDiag\\] mission=",
  "ENGAGED re-aim Kerbin->Duna via Sun",
  # THE ANTI-VACUITY PIN (2026-09-07): the [ReaimSeam] trace logs a SEAM line
  # only on the frame where the positioned ghost's orbit segment changes, and
  # body= names the segment ENTERED, so this token is satisfiable only if the
  # engine positioned the ghost on both sides of the Sun->Duna handoff. A run
  # that never reached the seam surface (the V3F/V3R/_0747 lesson) reads as a
  # mismatch here instead of a clean bill. The jump= value on the matched line
  # is the rate-independent seam measurement.
  # ARMED 2026-09-07 off _1906's own line (seg#3->4, jump=47431188m): the DEFECT
  # CLASS is pinned (jump >= 1,000 km = seven or more digits; healthy recorded
  # seams measure 7-10 km on S1.8), so this token FLIPS when the teleport is
  # fixed - invert it to jump=[0-9]{1,6}m at that time. It is also the
  # negative-control token (see header).
  "\\[ReaimSeam\\] SEAM member=0 seg#3->4 body=Duna loopUT [0-9]+->[0-9]+ jump=[1-9][0-9]{6,}m",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "FORCED FAITHFUL",
  # Self-detecting guard for the run-3 trap: a refused backward jump is a
  # WARN the driver-validity carve-out cannot red on a MISSION-OK run;
  # this token makes it a gating expectations mismatch instead.
  "timejump refused reason=backward-jump",
]

[runtime]
# The B16 arithmetic (same machine, same warp policy, one fewer autowarped wait):
# LoadGame 240 + mission 4200 + fast tail verbs + margin.
budgetSeconds = 4700

[retry]
# The single inbound Ike-shell transit is a real per-attempt encounter risk (the
# measured B7 flake was ~50% per attempt at a 300 km flyby target; a capture lane
# crosses the shell once, not twice, so the residual is smaller but not zero).
# One retry keeps a phase-of-Ike loss from discarding an otherwise-green lane.
policy = "once"

[expectedFail]
bugId = ""
