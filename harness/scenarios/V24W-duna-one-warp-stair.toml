#
# ---- THE CEILING GRAMMAR, AND WHY THE ENTRIES ARE BARE -----------------------------
# THE CEILINGS THIS MEASUREMENT AUTHORIZES ARE STATED HERE AND CANNOT YET BE
# DECLARED, and that is a whole-suite property rather than a decision about this
# lane. `hlib.parse_allowed_anomalies` accepts a per-token budget
# (`{ token = "icon-teleport", maxCount = 130 }`), but TWO whole-set cells in
# `harness/lib/test_hlib.py` hold that mechanism INERT across every committed spec:
# `test_no_committed_spec_arms_a_count_budget` (no spec may carry a table entry) and
# `test_every_committed_spec_parses_under_the_budget_surface` (every parsed budget
# must come back `None`). V14T and V15T both wrote the budget form FIRST and both
# reverted to a BARE token for exactly this reason; their headers say arming one
# "means moving that invariant cell to a named allowlist in the same edit", and that
# allowlist move is an operator decision that should cover those two lanes at the
# same time as this one, not a side effect of this lane's ledger commit.
#
# So the entries below are BARE - V15T's and V17T's actual spelling - and the
# ceilings are recorded as arithmetic ready for that one edit:
#
#   icon-teleport       ceiling 130  = 2x the measured 65. DOUBLE rather than a
#                       tight bracket because the probe's own calibration defect is
#                       FILED and unfixed (the icon-jump/icon-teleport threshold
#                       entry in todo-and-known-bugs.md: 95 raises on a hand-played,
#                       visually-validated session), the suspected discriminator is
#                       rails warp, and THIS LANE COMMANDS RAILS BY CONSTRUCTION -
#                       a stair of 10x/50x/100x/1000x/100x/50x/10x at each of three
#                       windows. The count is therefore expected to move with
#                       whatever rate the server actually grants, which is not a
#                       quantity this spec controls. 2x is headroom for that, and it
#                       is still two orders of magnitude below a per-frame leak.
#   icon-off-orbit      ceiling 8    = 4x the measured 2. The V14T/V15T/V16T family
#                       measured this token at 1-2 per run on single-jump shapes and
#                       called it deterministic; 2 here on a three-jump shape is
#                       consistent with that. 8 bounds a per-seam raise on a lane
#                       with 15 cataloged seams without tolerating a per-frame one.
#   loop-seam-teleport  ceiling 8    = 4x the measured 2. Same argument: the
#                       instrument is per-orbit-segment-change and this lane crosses
#                       a bounded number of them (rigid 11 / flexible-soi 4).
#
# NOT LISTED, DELIBERATELY: `seam-endpoint-outside-soi`. It is REPORT-ONLY - absent
# from `hlib.ANOMALY_TOKENS`, reported through `unlistedReasons`, and it moved no
# verdict on flight 2. Declaring a tolerance for an ungated token is an INERT
# declaration that `parse_allowed_anomalies` emits a warning for, and
# `test_every_committed_spec_parses_under_the_budget_surface` asserts ZERO warnings
# across the suite, so listing it would red the harness suite while buying nothing.
# Its first-ever live raise is recorded in section 1 and in the design doc instead.
# =====================================================================================
tier = "operator"
description = "THE RC-WARP LANE, TWO READINGS FLOWN, NOTHING ARMED - flight 3 (a clean reading with the new tolerances) is the next gate. A loop-arrival map dwell over the free-play-validated Kerbin -> Duna re-aim recording, driven through a COMMANDED rails warp stair (10x/50x/100x/1000x/100x/50x/10x, up and back down, held 10 poll frames per step) at each of its three span-clock windows. It is the suite's answer to the last Phase-3 debt: RC-WARP is satisfiable only by a real rails ladder, and every other committed subject moves the clock with instantaneous TimeJumps whose histogram is 1x-only by construction (confirmed four times on V14M and V8). READING FLIGHT 1 (2026-08-25_1415, PASS/REPORT) measured an EMPTY observation and both its root causes - recorded-clock dwell windows against a compressing loop clock, and a no-op warp cancel - were fixed before the re-fly. READING FLIGHT 2 (2026-08-25_1502) MEASURED THE WHOLE COMPOSITION and red PARSEK-FAIL(anomaly) on attempt 1, which is the outcome this spec's own header pre-registered in writing rather than a lane defect: all ten driver steps green, every other verifier row green, wall 2,895 s inside the unchanged budgets. What it bought: the first histogram in the suite that is not 1x-only-by-construction (warp1x 322078 / warp100 10602 / warp1000 2170) with holdsAboveOneX 1 and seamsAboveOneX 2 - the first time any committed subject put a cataloged seam AND a hold above 1x - plus dwells 2 (+2 open), treatments StockConic 2, seams rigid 11 / flexible-soi 4, maxEndpointRatio 0.4367, four INFO RC-QUAL findings and nothing worse, and the FIRST EVER live raise of the report-only seam-endpoint-outside-soi instrument on the Sun->Duna arrival handoff. The red itself is the measurement the icon-teleport calibration pass was owed: hitCounts icon-teleport 65 / icon-off-orbit 2 / loop-seam-teleport 2, all three now tolerated BARE with that run id beside them (the ceilings 130/8/8 are argued in the header but cannot be declared while the whole-suite inert-budget invariant stands). The renderComposition block is still BARE; warpBuckets gets written FROM flight 3's histogram at arming, never predicted here."
instanceProfile = "stock-minimal"
tags = ["V24", "rc-warp", "warp-stair", "render-composition", "loop-arrival",
        "map-dwell", "re-aim", "interplanetary", "kerbin", "duna",
        "free-play-subject"]

[fixture]
# The harvest of the first free-play ground-truth session (see header section 2).
saveTemplate       = "fixtures/saves/duna-one-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "m3_loop_arrival_dwell"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, structural
  # rather than fixture-specific): loading a save whose own parked craft is active
  # makes the committed-tree restore path resume a promotion-stub recording ~1 s into
  # the scene, BEFORE any step can run. StopRecording is idempotent-OK by construction
  # and DiscardTree answers OK with nothing-discarded when no plain tree is live, so
  # the pair is safe on any entry state; the SetSetting stops a later one. The pair
  # kills ONE stub and is not a latch - which is why the recordings window below
  # admits a stub rather than forbidding it.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins, and all three are LOAD-BEARING for the manifest, not just for
  # log evidence: the seam tangent/endpoint capture predicates behind RC-SEAM are
  # `mapRenderTracing`-gated (SPEC decision 2), so a manifest taken with the tracer
  # off carries no seam numbers at all and every RC-SEAM numeric clause counts as
  # `seam-data-unavailable-tracing-off` unevaluable - a lane that declared the block
  # without arming the tracer would fly, green, and measure nothing.
  # `ghostRenderTracing` is the FLIGHT-scene raise gate for the loop-seam-teleport
  # Tier-C instrument; `verboseLogging` is load-bearing beside both, because the
  # tracer emits its Tier-B truth at Verbose (the V1 lesson).
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # The mission: arm the loop, observe the map camera, then three legs and three
  # stair-then-hold windows. Budget arithmetic in header section 5.
  { phase = "mission",  expect = "MISSION-OK", budget = 3000 },
  # M-A7 RENDER-COMPOSITION CAPTURE, at the only defensible instant: AFTER every
  # observation (all three windows and all three stairs are inside the accumulation)
  # and IMMEDIATELY BEFORE FlushAndQuit (so the export is taken at a CHOSEN moment
  # rather than provoked by the scene-exit auto-flush, whose composition is a
  # teardown one). The recorder accumulates from Awake, so placement decides only how
  # much of the lane is already inside the file - an earlier export silently drops
  # whatever followed it. INERT by construction (`hlib.SEAM_VERB_TAIL_ROLE` = inert):
  # it reads an in-memory accumulation and writes one file in the KSP root, touching
  # no vessel, no save and no Parsek persisted state.
  { cmd = "ExportRenderManifest",                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

[driver.missionParams]
treeId               = "1ccdb19215034ac19f3a8e31697b05ed"
# RECORDED-UT deltas from the recording's own start; header section 4 argues each.
departOffsetSeconds  = 11474541.813229546
arriveOffsetSeconds  = 18329155.146610025
# arrive + 61,354, past the Ike return - the supervisor decision in section 4.
parkOffsetSeconds    = 18390509.0
dwellLeadSeconds     = 300
dwellHoldSeconds     = 900
mapCamera            = true
cameraFocusBody      = "Duna"
cameraPitchDeg       = -60
cameraHeadingDeg     = 0
cameraDistanceMeters = 2000000000
armTimeoutSeconds    = 300
cameraTimeoutSeconds = 120
# MUST exceed dwellHoldSeconds: the machine's stall detector fires between the two,
# so V2's 600 against a 900 s hold would flake every window by construction.
holdTimeoutSeconds   = 1800
# THE RAILS WARP STAIR (header section 3). COMMANDED KSP rails indices: 10x, 50x,
# 100x, 1000x, 100x, 50x, 10x - up and back down, once per dwell window.
dwellRampFactors     = [2, 3, 4, 5, 4, 3, 2]
dwellRampStepFrames  = 10
dwellRampFrames      = 600

# CLAIM-IS-NOT-GATE, and on a reading run the list is deliberately one value.
#   D14 `scene-map` is the environment axis this lane runs on (V2's precedent).
#
# NOT CLAIMED, DELIBERATELY: D14 `warp-rails` and `warp-high`, which are exactly the
# axes this lane exists to cover. Nothing gates them today - the renderComposition
# block is BARE, so the histogram is recorded and asserted on by nothing - and a
# coverage claim backed by no gate is the vacuity this register exists to avoid.
# They get claimed AT ARMING, in the same commit that declares `warpBuckets`, which
# is the gate that makes them true.
[dimensionsCovered]
D14 = ["scene-map"]

[expectations]
# PLACEMENT IS LOAD-BEARING (hlib.validate_spec rejects a bare allowedAnomalies
# written after any [expectations.<sub>] header).
#
# THREE TOLERATED TOKENS, ADDED 2026-08-25 WITH THE FLIGHT THAT SHOWS THEM - the
# S1.4 rule verbatim. The flight is reading run `2026-08-25_1502`
# (PARSEK-FAIL(anomaly) attempt 1, all ten driver steps green, every other verifier
# row green), and it measured `hitCounts = {icon-teleport: 65, icon-off-orbit: 2,
# loop-seam-teleport: 2}`. Header section 6 carries the full argument, the ceiling
# arithmetic each entry would take (130 / 8 / 8), and the whole-suite invariant that
# keeps the ceilings undeclarable today; the one-line rationale per token is here.
#
# THE LIST SHIPPED EMPTY ON PURPOSE AND RED BECAUSE OF IT, which is the whole reason
# these three can be trusted: had any been pre-tolerated, the count it fired at
# would never have been recorded.
allowedAnomalies = [
  # 65 raises, `2026-08-25_1502`. The probe's icon-jump/icon-teleport threshold has
  # a FILED, unfixed over-sensitivity above warp1000, and this lane commands a rails
  # stair at every window, so this token is expected here. Ceiling 130 (2x measured)
  # pending the budget-mechanism allowlist move - section 6.
  "icon-teleport",
  # 2 raises, `2026-08-25_1502`. The ghost-proto creation-frame trigger the
  # V14T/V15T/V16T family measured as parent-independent, seen here on a three-jump
  # shape. Ceiling 8 (4x measured) pending the same move.
  "icon-off-orbit",
  # 2 raises, `2026-08-25_1502`. The FLIGHT-scene loop-seam instrument, raised at
  # orbit-segment changes; this lane crosses 15 cataloged seams (rigid 11 /
  # flexible-soi 4). Ceiling 8 (4x measured) pending the same move.
  "loop-seam-teleport",
]

[expectations.recordings]
# RE-PINNED OFF THE FIXTURE'S REAL BYTES (the V21 / V22M precedent). This window was
# first written while `duna-one-recorded` did not yet exist, as a guess bracketing
# nothing; the fixture landed the same day and MEASURES 1 RECORDING_TREE, 13 RECORDING
# nodes and 13 `.prec` sidecars, so the bracket is now anchored to a count instead of
# to an intuition. It is still NOT a measurement of this LANE - no run has happened -
# which is why it stays a bracket rather than becoming a pin.
#
# THE CEILING, 24. The fixture's 13, plus the scene-entry promotion stub the step
# triple above kills (V2 measured exactly this: its 2-recording fixture reads 3), plus
# headroom for the load-time optimizer splitting at the FOUR cross-body seams this
# subject crosses (Kerbin->Sun, Sun->Duna, Duna->Ike, Ike->Duna). What the optimizer
# actually answers on those crossings is a reading-run measurement - the same question
# V14M's `exoCoastBodyChangeKept` recorded for a same-parent crossing - and the first
# draft's 16 sat only 3 above the fixture's own population, so a split at any two
# seams would have red this lane for a reason that is not what it exists to measure.
# 24 is a runaway guard: a per-frame recording leak would be in the hundreds.
#
# THE FLOOR, 10, and it is deliberately BELOW the fixture's 13 rather than equal to
# it - but NOT because anything here can auto-merge. That was this comment's first
# draft, and it was traced and REFUTED against the fixture's own chain before the
# reading run. `RecordingOptimizer.CanAutoMerge` considers ADJACENT PAIRS within one
# chain (`a.ChainId == b.ChainId`, `b.ChainIndex == a.ChainIndex + 1`), so the
# candidate population is pairs, NOT "the snapshot-less segments" - the head and the
# tail are as involved as the rest. Chain aff63064eefd4ee0a099f5c57728bb55 has FOUR
# members, hence THREE pairs, and this is the measured table:
#
#   idx 0  5d68d429  surface / Kerbin   evaCrewName ''
#   idx 1  61e91771  exo     / Kerbin   evaCrewName ''
#   idx 2  0b91670c  atmo    / Duna     evaCrewName ''
#   idx 3  7609b87b  surface / Duna     evaCrewName ''
#
# Every pair crosses a phase boundary, so `samePhase` is false at all three, and the
# only different-phase escape hatch - `CanMergeContinuousEvaAtmoSurfaceBoundary` -
# opens with `HasSameEvaIdentity`, which needs `IsEvaRecording` on BOTH sides, i.e. a
# non-empty `EvaCrewName` (`RecordingOptimizer.cs:2011-2039`). All four are VESSEL
# recordings with an empty one, so the hatch is closed on every pair. The other NINE
# recordings carry no `chainId` at all, and `CanAutoMerge` rejects an empty `ChainId`
# outright. So 13 is STABLE under auto-merge, and a sub-13 count on
# a run of this fixture is a REAL finding (a recording lost or merged illegally),
# not a benign optimizer outcome. 10 is margin for the UNKNOWN - this is the first
# flight of a free-play-harvested fixture - while keeping the anti-vacuity half
# that matters: a dwell that observed one or two recordings has stopped being a
# dwell over this subject. The reading run re-pins both halves from what it reads,
# and if it reads below 13 the number is to be INVESTIGATED, not window-widened.
count = { min = 10, max = 24 }

[expectations.renderComposition]
# M-A7. BARE ON PURPOSE - no `gating`, no assertion key, and above all no
# `warpBuckets`. `rendercompose`'s own docstring: the facets are "Recorded
# UNCONDITIONALLY on a parseable manifest: that is how a lane earns its first honest
# window off a green report-only run". Declaring a window here would be declaring a
# PREDICTION and then reading it back as a measurement - the mistake V14M's and V8's
# headers refuse for their save-structure blocks and their own composition blocks.
#
# WHAT THE DECLARATION ALREADY BUYS, and it is the entire mechanism: declaring the
# block (NOT arming it) is what sets `PARSEK_RENDER_MANIFEST=1` at launch
# (`rendercompose.declared_composition_blocks` -> run.py's env build), arming the C#
# recorder at Awake. The `renderCompose` verifier row then reads the manifest and
# reports its facets, moving no verdict.
#
# THIS IS THE ONE LANE IN THE SUITE ENTITLED TO DECLARE `warpBuckets` at arming -
# V14M's and V8's headers both say it may NEVER appear on them - and the arming pass
# owes it a reading run whose histogram the window is written from, an armed
# re-flight, and a negative control inverting a required token of this lane's own.

[runtime]
# 300 LoadGame + 3000 mission (arm + camera gate + three instantaneous legs + three
# 35-wall-second stairs + three 900 game-second 1x holds = ~2,850 s) + the fast tail
# verbs + margin. Header section 5 carries the arithmetic; V2's 2100 is for 300 s
# holds and does not transfer.
budgetSeconds = 3600

[retry]
policy = "once"

[expectedFail]
bugId = ""
