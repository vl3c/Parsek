# ---------------------------------------------------------------------------------
# 3. THE WARP STAIR - what the machine actually does differently
# ---------------------------------------------------------------------------------
# `m3_loop_arrival_dwell` gained a flag-gated rails stair for this lane (the
# `startInOrbit` precedent: inert by default, so V2 / V3F / V3R keep their flown
# shape byte-identically - pinned by `M3WarpStairInertnessTests`). With
# `dwellRampFactors` declared, each of the three HOLD windows becomes
# STAIR-THEN-HOLD:
#
#   1. the leg's TimeJump lands at `window - dwellLeadSeconds`;
#   2. the window's arrival UT is STAMPED (unchanged - `dwelledAllWindows` still
#      measures the leg's arrival, not the stair's end);
#   3. the COMMANDED ladder climbs and descends, each factor held
#      `dwellRampStepFrames` poll frames;
#   4. warp is CANCELLED at the stair's end;
#   5. the existing 1x hold runs its full `dwellHoldSeconds` from there.
#
# THE LADDER: `[2, 3, 4, 5, 4, 3, 2]` are COMMANDED KSP rails indices - 10x, 50x,
# 100x, 1000x, 100x, 50x, 10x - up and back down, V1's DWELL-WARP-RAMP shape
# verbatim, because the design's warp-schedule bullet asks for "step-up and
# step-down transitions across at least one seam and one hold (the known step-up
# hole)". The server clamps to legality; the machine never gates on an ACHIEVED
# rate, exactly as V1 does not. What lands in the histogram is therefore a
# MEASUREMENT and not a prediction, which is the second reason `warpBuckets` stayed
# undeclared until reading runs existed - and is why the ARMED window names only the
# two buckets both readings actually counted (`warp100`, `warp1000`) and not the
# `warpHigh` the ladder's top rung might have reached had the server granted it.
#
# ARITHMETIC, so the wall cost is not a surprise (poll interval 0.5 s,
# `mission_runner.POLL_INTERVAL_SECONDS`): 7 factors x 10 frames x 0.5 s = 35 wall
# seconds of stair per window, nominally burning 5 s x (10+50+100+1000+100+50+10) =
# ~6,600 game seconds if the game achieves every commanded rate. Three stairs = ~105
# wall s. The stair therefore CROSSES each window instant at rails - which is the
# point, RC-WARP's "at least one cataloged seam ... traversed at above-1x warp" - and
# the 1x hold that follows dwells 900 further game seconds on the far side.
#
# THE EARLY-EXIT GUARD is the NEXT window's leg target (that window's instant minus
# `dwellLeadSeconds`), V1's soi-guard shape: checked BEFORE the stair advances, so a
# high factor can never carry the clock into the following dwell, and the stair's end
# is then named `next-window-guard` rather than dishonestly `completed`. The tightest
# gap here is arrive -> park at 61,354 s against a nominal ~6,600 s stair, so the
# guard is a safety rail that should not fire; if it DOES fire on the reading run,
# that is a measurement about achieved rails rates and belongs in the arming ledger.
#
# `max_physics_warp` stays 1.0 on the mission spec: the stair is RAILS-ONLY and
# physics warp is not a target of RC-WARP at all.
#
# ---------------------------------------------------------------------------------
# 4. THE THREE WINDOWS, and the one supervisor decision inside them
# ---------------------------------------------------------------------------------
# Offsets are RECORDED-UT deltas from the recording's own start; the machine turns
# each into an absolute UT with the MissionConfig-returned UNIT PHASE ANCHOR (never
# the arm-time LoopAnchorUT - the V2 flight-5 lesson, where a dwell riding the wrong
# anchor watched 127 probe frames of EMPTY map).
#
#   depart  11,474,541.813229546   the Kerbin departure seam
#   arrive  18,329,155.146610025   the Duna arrival seam
#   park    18,390,509.0           arrive + 61,354
#
# THEY STAY ON THE RECORDED CLOCK ON PURPOSE - see section 4a, which is the whole
# reason flight 1 saw nothing and is the thing to read before touching these three
# numbers.
#
# THE PARK OFFSET IS A SUPERVISOR DECISION AND IS DELIBERATELY NOT THE RECORDING'S
# TAIL: it sits 61,354 s past the arrival seam, AFTER the Ike return, so the
# arrive -> park leg's own TimeJump crosses BOTH Ike seams. Those crossings are taken
# at the jump (instantaneous) rather than at rails; what this lane puts at rails is
# each window's own neighbourhood, via the stair. A reading run that finds the park
# window outside the recorded span, or the arrive stair rolling the loop cycle over,
# is measuring the fixture and belongs in the ledger - neither is pre-judged here.
#
# `dwellLeadSeconds = 300` / `dwellHoldSeconds = 900` are V2's shape at 3x, because
# the stair needs room: the hold must still SPAN a meaningful stretch after ~6,600
# game seconds of ladder have gone by. `holdTimeoutSeconds` MUST exceed
# `dwellHoldSeconds` by construction (the machine's stall detector fires between the
# two), so it is 1800 rather than V2's 600.
#
# ---------------------------------------------------------------------------------
# 4a. THE WINDOW ARITHMETIC - RECORDED offsets against a COMPRESSED clock
#     (re-written 2026-08-25 from reading flight 1, which measured it the hard way)
# ---------------------------------------------------------------------------------
# The three offsets above are RECORDED-UT deltas. The live loop does NOT run on the
# recorded clock: a re-aim unit EXCISES whole-period loiter intervals from its
# timeline (`GhostPlaybackLogic.LoopCut` / `CompressSpanUT`), because the recorded
# mission parks for months waiting on the transfer window and replaying that wait
# would make the loop unwatchable. This subject's own arm line says so:
#
#   MissionLoopUnit: ... ENGAGED re-aim Kerbin->Duna via Sun; ...
#     loiterCuts=1 cutSeconds=11393869 compressedSpan=7001129/18394999
#
# So the ACTIVE span is 7,001,129 s, and ALL THREE offsets above are larger than it.
# Flight 1 built `window = phaseAnchorUt + RECORDED offset`, landed every dwell past
# the compressed span, and sat in the INTER-CYCLE TAIL (`isInInterCycleTail`), where
# the clock parks at spanEnd and nothing renders. The cycle advance itself was
# correct - `phaseAnchorUt` came back forward-advanced by eight cadences - which is
# exactly why the arithmetic looked right: `5348663714.30 + 11474541.81 - 300 =
# 5360137956.1`, the target the log shows, and nothing about it is wrong except the
# clock it is expressed in.
#
# THE MACHINE NOW DOES THE MAPPING, so these params stay recorded-clock. The
# `MissionConfig` seam publishes the unit's cut list and clock primitives
# (`loiterCutCount`, `loiterCuts` as `startOffset:length` pairs relative to
# `spanStartUt`, `compressedSpanSeconds`, `spanSeconds`) and
# `m3_loop_arrival_dwell` compresses every offset through them at the ONE place an
# offset becomes a live UT. The cut here lies wholly before the departure, so all
# three compress by the full 11,393,869 s and land inside the active span with
# room to spare:
#
#   depart   11,474,541.8 -> 80,672.8      (1.2 % of the compressed span)
#   arrive   18,329,155.1 -> 6,935,286.1   (99.06 %)
#   park     18,390,509.0 -> 6,996,640.0   (99.94 %, 4,489 s of headroom)
#
# THE PARK WINDOW IS THE THIN ONE and is now the number to re-check first if this
# fixture is ever re-harvested: 4,489 s of headroom against a compressed span the
# cut length dominates. It is not a guess any more - the machine REFUSES at arm
# time, by name, on each of the three distinguishable faults, so a bad re-pin fails
# in seconds instead of after three empty dwells:
#   - past the RAW span      -> the offset belongs to a different recording;
#   - INSIDE a loiter cut    -> that recorded instant has no live UT at all, the
#                               cut collapses to one compressed instant (refused
#                               rather than clamped: a clamp would green a run that
#                               dwelled somewhere other than the instant this spec
#                               names);
#   - at/past the COMPRESSED span -> the right recording read on the wrong clock,
#                               i.e. flight 1's exact fault.
#
# ---------------------------------------------------------------------------------
# 5. BUDGET ARITHMETIC, stated because it is the one number that could only ever
#    have expired if copied from V2
# ---------------------------------------------------------------------------------
# Three 900 game-second holds at 1x cost 2,700 WALL seconds by construction (at 1x,
# game time IS real time), plus ~105 s of stair, plus the arm round trip, the camera
# gate and three instantaneous legs. The mission phase budget is 3000 s and the run
# budget 3600 s. V2's 1500 / 2100 are for 300-second holds and do not transfer.
#
# FLIGHT 1 COST 455 WALL SECONDS, AND THAT WAS THE SECOND DEFECT, not slack in this
# arithmetic. Each "1x hold" ran its full 900 GAME seconds at RAILSx10 (128
# consecutive `warp=RAILSx10.000` telemetry frames per hold) because
# `mission_runner`'s `ACTION_CANCEL_WARP` zeroed the warp factors only through a
# native `WarpService` this mission never creates - its legs are seam `TimeJump`
# epoch shifts, so it never issues `ACTION_WARP_TO_UT`. Measured per hold: 126.7
# wall s = 35.0 s of stair + 90.3 s of 900-game-second hold at 10x. Fixed
# 2026-08-25 (the reset is now unconditional); the re-fly should land near the
# ~2,850 s this section sizes, INSIDE the unchanged 3000 / 3600 budgets.
#
# ---------------------------------------------------------------------------------
# 6. `allowedAnomalies` - THE PRE-REGISTRATION PAID OFF, AND THIS IS WHAT IT BOUGHT
#    (rewritten 2026-08-25 from reading flight 2, the run that red on the empty list)
# ---------------------------------------------------------------------------------
# WHAT THIS SECTION USED TO SAY, kept because it is the reason the numbers below can
# be trusted: the free-play session that proves this subject ALSO raised
# `icon-teleport` 95 times while the operator was calling the render visually
# correct (FILED, NOT FIXED - todo-and-known-bugs.md), this lane drives the same
# histogram shape, so a `PARSEK-FAIL(anomaly)` on that token was a live possibility
# AND was the single most interesting thing the lane could measure. The list shipped
# EMPTY on purpose so that if it fired, the red would name the token and the count
# rather than being silently swallowed by a tolerance nobody had earned.
#
# IT FIRED. Reading flight 2 (`2026-08-25_1502`) came back PARSEK-FAIL(anomaly) on
# attempt 1 with all ten driver steps green and every other verifier row green, and
# the measurement is:
#
#   icon-teleport       65
#   icon-off-orbit       2
#   loop-seam-teleport   2
#   (+ seam-endpoint-outside-soi 1, REPORT-ONLY and NOT listed below)
#
# THE THREE TOKENS ARE NOW TOLERATED, per the S1.4 rule verbatim - a token is added
# WITH the flight that shows it, and every entry below cites `2026-08-25_1502`.
#
# ---- THE CEILING GRAMMAR, AND WHY THE ENTRIES ARE BARE -----------------------------
# THE CEILINGS THIS MEASUREMENT AUTHORIZES ARE STATED HERE AND CANNOT YET BE
# DECLARED, and that is a whole-suite property rather than a decision about this
# lane. `hlib.parse_allowed_anomalies` accepts a per-token budget
# (`{ token = "icon-teleport", maxCount = 130 }`), but TWO whole-set cells in
# `harness/lib/test_hlib.py` hold that mechanism INERT across every committed spec:
# `test_no_committed_spec_arms_a_count_budget` (no spec may carry a table entry) and
# `test_every_committed_spec_parses_under_the_budget_surface` (every parsed budget
# must come back `None`). V14T and V15T both wrote the budget form FIRST and both
# reverted to a BARE token for exactly this reason; their headers say arming one
# "means moving that invariant cell to a named allowlist in the same edit", and that
# allowlist move is an operator decision that should cover those two lanes at the
# same time as this one, not a side effect of this lane's ledger commit.
#
# So the entries below are BARE - V15T's and V17T's actual spelling - and the
# ceilings are recorded as arithmetic ready for that one edit:
#
#   icon-teleport       ceiling 130  = 2x the measured 65. DOUBLE rather than a
#                       tight bracket because the probe's own calibration defect is
#                       FILED and unfixed (the icon-jump/icon-teleport threshold
#                       entry in todo-and-known-bugs.md: 95 raises on a hand-played,
#                       visually-validated session), the suspected discriminator is
#                       rails warp, and THIS LANE COMMANDS RAILS BY CONSTRUCTION -
#                       a stair of 10x/50x/100x/1000x/100x/50x/10x at each of three
#                       windows. The count is therefore expected to move with
#                       whatever rate the server actually grants, which is not a
#                       quantity this spec controls. 2x is headroom for that, and it
#                       is still two orders of magnitude below a per-frame leak.
#   icon-off-orbit      ceiling 8    = 4x the measured 2. The V14T/V15T/V16T family
#                       measured this token at 1-2 per run on single-jump shapes and
#                       called it deterministic; 2 here on a three-jump shape is
#                       consistent with that. 8 bounds a per-seam raise on a lane
#                       with 15 cataloged seams without tolerating a per-frame one.
#   loop-seam-teleport  ceiling 8    = 4x the measured 2. Same argument: the
#                       instrument is per-orbit-segment-change and this lane crosses
#                       a bounded number of them (rigid 11 / flexible-soi 4).
#
# NOT LISTED, DELIBERATELY: `seam-endpoint-outside-soi`. It is REPORT-ONLY - absent
# from `hlib.ANOMALY_TOKENS`, reported through `unlistedReasons`, and it moved no
# verdict on flight 2. Declaring a tolerance for an ungated token is an INERT
# declaration that `parse_allowed_anomalies` emits a warning for, and
# `test_every_committed_spec_parses_under_the_budget_surface` asserts ZERO warnings
# across the suite, so listing it would red the harness suite while buying nothing.
# Its first-ever live raise is recorded in section 1 and in the design doc instead.
# =====================================================================================
tier = "operator"
description = "THE RC-WARP LANE, ARMED 2026-08-25 off TWO MATCHING READINGS (`2026-08-25_1502` full measurement + `2026-08-25_1616` clean PASS): gating = true with dwells {1,32}, unevaluable {max 500000}, requireSeamKinds [rigid, flexible-soi] and - the FIRST IN THE SUITE - warpBuckets [warp100, warp1000]. THE THREE-RUN WORKFLOW IS COMPLETE: the armed re-flight flew TWICE (2026-08-25_1722 and 2026-08-25_1811, both PASS attempt 1, gating=True, zero mismatches - 1811 was intended as the control and never armed, so it counts as a second re-flight) and the negative control flew as 2026-08-25_1925, PARSEK-FAIL(render-composition) attempt 1 on the single mismatch RC-WARP [FAIL] warpBuckets.warpHigh with every sibling row clean, reverted in the same change. A loop-arrival map dwell over the free-play-validated Kerbin -> Duna re-aim recording, driven through a COMMANDED rails warp stair (10x/50x/100x/1000x/100x/50x/10x, up and back down, held 10 poll frames per step) at each of its three span-clock windows. It is the suite's answer to the last Phase-3 debt: RC-WARP is satisfiable only by a real rails ladder, and every other committed subject moves the clock with instantaneous TimeJumps whose histogram is 1x-only by construction (confirmed four times on V14M and V8). READING FLIGHT 1 (2026-08-25_1415, PASS/REPORT) measured an EMPTY observation and both its root causes - recorded-clock dwell windows against a compressing loop clock, and a no-op warp cancel - were fixed before the re-fly. READING FLIGHT 2 (2026-08-25_1502) MEASURED THE WHOLE COMPOSITION and red PARSEK-FAIL(anomaly) on attempt 1, which is the outcome this spec's own header pre-registered in writing rather than a lane defect: all ten driver steps green, every other verifier row green, wall 2,895 s inside the unchanged budgets. What it bought: the first histogram in the suite that is not 1x-only-by-construction (warp1x 322078 / warp100 10602 / warp1000 2170) with holdsAboveOneX 1 and seamsAboveOneX 2 - the first time any committed subject put a cataloged seam AND a hold above 1x - plus dwells 2 (+2 open), treatments StockConic 2, seams rigid 11 / flexible-soi 4, maxEndpointRatio 0.4367, four INFO RC-QUAL findings and nothing worse, and the FIRST EVER live raise of the report-only seam-endpoint-outside-soi instrument on the Sun->Duna arrival handoff. The red itself is the measurement the icon-teleport calibration pass was owed: hitCounts icon-teleport 65 / icon-off-orbit 2 / loop-seam-teleport 2, all three now tolerated BARE with that run id beside them (the ceilings 130/8/8 are argued in the header but cannot be declared while the whole-suite inert-budget invariant stands). READING FLIGHT 3 (2026-08-25_1616) then re-flew the unchanged spec with those three tolerances and came back a CLEAN PASS: the anomaly counts recurred IDENTICALLY (65 / 2 / 2), every composition facet equals flight 2's integer (dwells 2 +2 open, cycles 1, transitions 2, seams rigid 11 / flexible-soi 4, holdsAboveOneX 1, seamsAboveOneX 2, four INFO RC-QUAL and nothing worse), and the histogram matched within 0.5 % bucket for bucket (warp1x 322868 / warp100 10626 / warp1000 2160 / warpHigh 0 / warpPhys 0). The block is ARMED off that PAIR - a histogram read once is a sample - and warpBuckets is written FROM the two measured histograms, never predicted."
instanceProfile = "stock-minimal"
tags = ["V24", "rc-warp", "warp-stair", "render-composition", "loop-arrival",
        "map-dwell", "re-aim", "interplanetary", "kerbin", "duna",
        "free-play-subject"]

[fixture]
# The harvest of the first free-play ground-truth session (see header section 2).
saveTemplate       = "fixtures/saves/duna-one-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
mission = "m3_loop_arrival_dwell"

steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # KILL THE SCENE-ENTRY AUTO-RECORDER FIRST (V2 flight 4 / V5 run 1, structural
  # rather than fixture-specific): loading a save whose own parked craft is active
  # makes the committed-tree restore path resume a promotion-stub recording ~1 s into
  # the scene, BEFORE any step can run. StopRecording is idempotent-OK by construction
  # and DiscardTree answers OK with nothing-discarded when no plain tree is live, so
  # the pair is safe on any entry state; the SetSetting stops a later one. The pair
  # kills ONE stub and is not a latch - which is why the recordings window below
  # admits a stub rather than forbidding it.
  { cmd = "StopRecording",                                                   expect = "OK" },
  { cmd = "DiscardTree",                                                     expect = "OK" },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  # Three tracer pins, and all three are LOAD-BEARING for the manifest, not just for
  # log evidence: the seam tangent/endpoint capture predicates behind RC-SEAM are
  # `mapRenderTracing`-gated (SPEC decision 2), so a manifest taken with the tracer
  # off carries no seam numbers at all and every RC-SEAM numeric clause counts as
  # `seam-data-unavailable-tracing-off` unevaluable - a lane that declared the block
  # without arming the tracer would fly, green, and measure nothing.
  # `ghostRenderTracing` is the FLIGHT-scene raise gate for the loop-seam-teleport
  # Tier-C instrument; `verboseLogging` is load-bearing beside both, because the
  # tracer emits its Tier-B truth at Verbose (the V1 lesson).
  { cmd = "SetSetting", args = { name = "ghostRenderTracing", value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "mapRenderTracing",   value = "true" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging",     value = "true" }, expect = "OK" },
  # The mission: arm the loop, observe the map camera, then three legs and three
  # stair-then-hold windows. Budget arithmetic in header section 5.
  { phase = "mission",  expect = "MISSION-OK", budget = 3000 },
  # M-A7 RENDER-COMPOSITION CAPTURE, at the only defensible instant: AFTER every
  # observation (all three windows and all three stairs are inside the accumulation)
  # and IMMEDIATELY BEFORE FlushAndQuit (so the export is taken at a CHOSEN moment
  # rather than provoked by the scene-exit auto-flush, whose composition is a
  # teardown one). The recorder accumulates from Awake, so placement decides only how
  # much of the lane is already inside the file - an earlier export silently drops
  # whatever followed it. INERT by construction (`hlib.SEAM_VERB_TAIL_ROLE` = inert):
  # it reads an in-memory accumulation and writes one file in the KSP root, touching
  # no vessel, no save and no Parsek persisted state.
  { cmd = "ExportRenderManifest",                        expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                    expect = "OK" },
]

