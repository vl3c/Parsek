# this lane's own drive shape: `2026-08-25_1502` (the full-measurement reading, red by
# this spec's own pre-registered anomaly doctrine) and `2026-08-25_1616` (the clean
# PASS re-fly of the unchanged spec with the three tolerances flight 2 authored). The
# V14M/V8 precedent arms off ONE green reading; this lane arms off a PAIR because its
# whole subject is a histogram, and a histogram read once is a sample. Every window
# below is written FROM those two runs' facets, and NOTHING IN THE FLOWN SHAPE MOVED
# at arming: no offset, no ladder, no hold length, no budget, no tolerance, no other
# expectation. That is the S4.1 rule.
#
# WHY THE PAIR IS A PAIR AND NOT TWO RUNS: the anomaly counts came back IDENTICAL
# (icon-teleport 65 / icon-off-orbit 2 / loop-seam-teleport 2 on both), every
# structural facet is equal to the integer (dwells 2 + 2 open, cycles 1, transitions
# 2, treatments StockConic 2, coverages InSegment 2, chainBuilds 2, lineBranches 2,
# seams rigid 11 / flexible-soi 4, seamEndpoints 1024, seamTangents 0,
# holdsAboveOneX 1, seamsAboveOneX 2, findings 4 x INFO RC-QUAL and nothing worse),
# and the histogram matched within 0.5 % bucket for bucket. That is what turns each
# number below from an observation into a property this lane reproduces.
#
# WHAT ARMING BUYS. `run.py` writes `verifiers["render_composition_mismatch"]` only
# `if rc.gating`, so from here a window miss, a required seam kind absent from the
# chain records, a declared warp bucket the manifest counted zero frames in, or ANY
# FAIL-level rule finding classifies the run `PARSEK-FAIL(render-composition)`.
# Unarmed, every one of those was a report-only footnote. The lane is registered in
# `RENDERCOMPOSE_ARMED_SPECS` (harness/lib/test_hlib.py) with its run ids.
#
# THE WINDOWS, each against its two measurements and with the margin stated:
#
#   dwells = { min = 1, max = 32 }
#     MEASURED 2 closed (+2 open at export) on `2026-08-25_1502` AND on
#     `2026-08-25_1616` - the same integer twice. `min` is the ANTI-VACUITY floor and
#     the load-bearing half: a manifest that observed no dwell at all is the
#     "greened while measuring nothing" shape this module exists to refuse, and 1 is
#     the smallest honest floor. `max` is an order-of-magnitude runaway guard, not a
#     pin: the count follows how many Director segments the three windows walk, which
#     a legitimate render change may move by a few. DELIBERATELY IDENTICAL to the
#     V14M and V8 siblings' window, so all three lanes state ONE claim about the
#     product rather than three claims about three subjects.
#
#   unevaluable = { max = 500000 }
#     MEASURED 334342 (`_1502`) and 335146 (`_1616`). A CEILING ONLY, ~1.5x the
#     larger reading, and it is deliberately NOT the ~3.3x ratio the two sibling
#     lanes carry, because this census is not the same population as theirs.
#     WHAT DOMINATES IT: the SEAM_ENDPOINT decimation - `decimated-section-seam_endpoint`
#     292546 / 293250 plus `truncated-section-seam_endpoint` 41280 / 41380 - i.e.
#     99.8 % of the count is the per-pid cap doing its job LOUDLY (the Phase-1
#     contract: thin and say so, never drop silently), on a rails drive shape that
#     generates endpoint records at a rate no 1x lane approaches. All four INFO
#     RC-QUAL findings on both runs confirm the kept 1024 records still span the
#     session, so the trend stayed readable at the coarser rate. The ceiling is
#     therefore the honest ANTI-VACUITY bound for THIS drive shape and nothing more;
#     tightening it below the decimation regime would red on the instrument's own
#     bookkeeping rather than on anything the render pipeline did. What it still
#     catches is the collapse case - an instrument that stops measuring turns clauses
#     into unevaluables wholesale - with ~165k of headroom over the larger reading.
#     NO `min`: an unevaluable count is not a thing to require.
#
#   warpBuckets = ["warp100", "warp1000"]
#     THE WINDOW THIS LANE EXISTS TO AUTHOR, and the first in the suite: V14M's and
#     V8's headers both say the key may NEVER appear on them, their clocks being
#     instantaneous TimeJumps whose histogram is 1x-only BY CONSTRUCTION (confirmed
#     four times, 173/296 reading and 177/295 armed, every other bucket zero).
#     MEASURED HERE: warp100 10602 / warp1000 2170 on `_1502` and 10626 / 2160 on
#     `_1616` - both buckets non-zero on both runs, matching within 0.5 %. The clause
#     says the commanded ladder ACTUALLY VISITED the rails regimes it commands; a
#     drive that silently fell back to 1x (flight 1's exact defect, when
#     `ACTION_CANCEL_WARP` was a no-op the other way round) would green every count
#     window above and red exactly here.
#     DECLARING THE KEY ALSO ARMS TWO CLAUSES THAT ARE NOT LISTS, and this is the
#     whole of RC-WARP's anti-vacuity statement rather than a side effect
#     (`rendercompose._rule_warp`): with `warpBuckets` declared, `seamsAboveOneX == 0`
#     and `holdsAboveOneX == 0` become FAIL-level findings. Both are backed twice -
#     `seamsAboveOneX 2` and `holdsAboveOneX 1` on BOTH runs - so this arms an
#     existing, reproduced fact: a cataloged seam AND a hold traversed above 1x.
#     `warpHigh` IS DELIBERATELY NOT REQUIRED, and the omission is a MEASUREMENT:
#     it read 0 on both runs. The ladder's top rung is a COMMANDED index 5 (1000x)
#     and the server clamps to legality, so 1000x is this subject's histogram
#     ceiling; `warpHigh` counts frames ABOVE it and there are none to require. A
#     floor over a facet measured at zero twice would red the runs it was armed off.
#     It is instead this lane's NEGATIVE CONTROL token - inverting `warpBuckets` to
#     `["warpHigh"]` reds on a composition token of this lane's OWN, which is the
#     roadmap's confirmation criterion (b) and is what the V14M/V8 pair each did with
#     a window of their own rather than sharing one.
#     `warp1x` IS ALSO NOT REQUIRED although it is the largest bucket (322078 /
#     322868): requiring it would pin the 1x HOLD that follows each stair, which is
#     V2's shape and not this lane's contribution, and RC-WARP's statement is about
#     the above-1x half. `warpPhys` read 0 twice by construction
#     (`max_physics_warp = 1.0`; the stair is rails-only).
#
#   requireSeamKinds = ["rigid", "flexible-soi"]
#     MEASURED {rigid: 11, flexible-soi: 4} on BOTH runs, to the integer. Both kinds
#     present, so this arms an existing fact rather than a hope, and it is the
#     sharpest clause in the block: it says this subject's chain records must keep
#     carrying BOTH same-body rigid seams and cross-SOI flexible ones, which is the
#     structural signature of an interplanetary re-aim rendered through the phase
#     spine. A change that collapsed the chain to one seam kind would green every
#     count window above and red exactly here. Vocabulary is
#     `rendercompose.SEAM_KINDS_REQUIRABLE`, which admits no other token.
#
# `cycles` IS DELIBERATELY OMITTED, and the omission is a MEASUREMENT rather than an
# oversight - the V8 precedent for stating one. The facet read 1 CLOSED cycle on BOTH
# runs (two `cycle-rollover` events bounding exactly one, with
# `no-cycle-rollover-events: 2` as the matching unevaluable for the open tail), so a
# `{ min = 1, max = 16 }` window in V14M's spelling WOULD hold. It is left off because
# it would assert nothing this lane owns: the closed-cycle count here is a function of
# where three supervisor-chosen dwell windows fall on a COMPRESSED span clock and of
# the export instant, i.e. of the drive shape that is itself the thing under
# development (the stair, the compression mapping, the park offset's 4,489 s of
# headroom). V14M owns the cycles clause on a subject whose loop count is its
# construction; this lane owns the warp histogram. `dwells` and `requireSeamKinds`
# carry the anti-vacuity floors, so nothing is lost by declining a third.
#
# ALSO NOT DECLARED, each for a measured reason:
#   * any RC-CUT surface - `cut-run-period-absent: 2` on BOTH runs, so RC-CUT's
#     whole-ratio check could not evaluate this subject's loiter cut at all
#     (`cutWholeRatios` came back empty twice). A window armed off that would arm a
#     clause that never fires. Exactly V8's measured constraint, reproduced here.
#   * any RC-HOLD clause - the observed hold (7050.236864 s on `_1502`, 7061.161390 s
#     on `_1616`) sits at ~18-20 % of the per-cycle plan ([39607.052804,
#     35444.407972]) at BOTH plan units on BOTH runs. That gap is a MEASUREMENT this
#     lane HANDS to RC-HOLD, and it is stable across the pair - but it is one
#     engage/release pair per run, and the design's own note says sizing that half
#     wants a lane that dwells THROUGH a hold at a known warp. A window is not owed
#     off a ratio nobody has yet explained.
#   * `seamTangents` / `maxEndpointRatio` count or band windows - seamTangents read 0
#     twice and the endpoint population is DECIMATED (see the unevaluable window), so
#     the endpoint census on this drive shape is a sampled population and a count
#     window over it would pin the sampler, not the product.
#
# THE DECLARATION (not the arming) remains what sets `PARSEK_RENDER_MANIFEST=1` at
# launch (`rendercompose.declared_composition_blocks` -> run.py's env build), arming
# the C# recorder at Awake; without it the export step answers
# `REJECTED msg=manifest-not-armed`. That coupling is enforced pre-launch by
# `hlib.validate_spec`'s verb/block rule.
#
# NOTHING IS OWED (see the header's ARMING LEDGER): the three-run workflow is
# COMPLETE. The ARMED RE-FLIGHT flew TWICE (`2026-08-25_1722`, `2026-08-25_1811`,
# both PASS attempt 1, zero mismatches) and the NEGATIVE CONTROL flew as
# `2026-08-25_1925`, `PARSEK-FAIL(render-composition)` attempt 1 on the single
# mismatch `RC-WARP [FAIL] warpBuckets.warpHigh`, reverted in the same change.
# THE OPERATOR TRAP THAT COST THE FIRST CONTROL ATTEMPT STANDS FOR ANY FUTURE ONE:
# the control's first attempt (1811) never armed - a substring edit hit a rationale
# COMMENT quoting this same key ahead of the line below - so INVERT THE LINE BELOW
# BY LINE ANCHOR, never by substring, and confirm with
# `run.py --id V24W-duna-one-warp-stair --dry-run` (its [VERIFY] line prints
# `declared: {...}`) before taking the machine lock.
gating = true
dwells = { min = 1, max = 32 }
unevaluable = { max = 500000 }
warpBuckets = ["warp100", "warp1000"]
requireSeamKinds = ["rigid", "flexible-soi"]

[runtime]
# 300 LoadGame + 3000 mission (arm + camera gate + three instantaneous legs + three
# 35-wall-second stairs + three 900 game-second 1x holds = ~2,850 s) + the fast tail
# verbs + margin. Header section 5 carries the arithmetic; V2's 2100 is for 300 s
# holds and does not transfer.
budgetSeconds = 3600

[retry]
policy = "once"

[expectedFail]
bugId = ""
