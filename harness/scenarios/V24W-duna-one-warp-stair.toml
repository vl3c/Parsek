# V24W: THE RC-WARP LANE. A loop-arrival map dwell over the free-play-validated
# Kerbin -> Duna re-aim recording, driven through a RAILS WARP STAIR at each of its
# three windows so the render-composition manifest's warp histogram carries something
# other than `warp1x`.
#
# `W` IS A NEW SUFFIX AND THIS SPEC MINTS IT: the established lane suffixes name the
# RENDER HOST (`M` player/flight-map, `T` tracking station, `K` KSC). `W` names the
# DRIVE SHAPE instead - a warp-schedule lane - because that is the whole and only
# reason this lane exists separately from V2, whose host it shares. The register in
# `docs/dev/autotest-roadmap.md` reserves V24 across suffixes and records the mint.
