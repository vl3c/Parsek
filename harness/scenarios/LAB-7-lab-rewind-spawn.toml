schema = 1
id = "LAB-7-lab-rewind-spawn"
tier = "operator"
# THE SCIENCE-LAB PROGRAM, lane LAB-7 (plan `docs/dev/research/lab-test-program-2026-10-17.md`,
# "LAB-7 rewind, ghost, spawn"). NEVER FLOWN: its first flight is a READING run, so it is
# `operator` and tagged `pending-flight` until that run pins the measured values.
#
# HOST: `lab-lko-science` (the LAB-2 / LAB-3 host): SCIENCE_SANDBOX, the LABX Orbital Lab (vessel
# persistentId 2200110055) ORBITING Kerbin at about 107 x 92 km, Valentina in the Mk1 pod, Bob
# (Scientist, level 0) in the Large.Crewed.Lab (part persistentId 1700054019, flightID
# 1270217782), 1,900 EC in full batteries, 8 RTGs. Fixture UT 355.8. The shared-ships overlay
# gives the save `Settings Probe` for the pad.
#
# THE STORY. Record the lab processing its four experiments and researching for 3,200 s of rails
# warp (it ends the recording STILL researching), commit, and Rewind-to-Launch (MINE-2's route):
# the rewind lands at the Space Center with the lab stripped and replaying as a ghost, Bob and
# Valentina reserved to it. A probe launched from the VAB holds FLIGHT (the rewound world has no
# other vessel and TimeJump is FLIGHT-only), and that pad state is saved. Then two branches:
#   * WARP: a real rails warp on the pad past the recording's end; the real lab spawns there, and
#     flown (LoadGame focusPid) it matches the end snapshot (`inspect expectSnapshot=true`,
#     storedScience / dataStored / the four subjects) with Research ON and Bob aboard; 3,600 s of
#     rails warp then show it researching (about +0.045); a Space Center stay of six hours then
#     shows stock's EC-limited catch-up on the SPAWNED vessel (LAB-6's finding: batteries
#     drained, about +0.005, never the six hours' 0.27).
#   * JUMP: reload the pad state, TimeJump past the end so the lab spawns AFTER the jump; the
#     spawn removes the jumped span from the snapshot clock (`Converter jump policy (spawn): ...
#     removed=69x.x`, owner ruling 2026-10-17), so flown it still matches the end snapshot at F4
#     and its charge matches the snapshot's (a missed shift would catch up about 690 s: the
#     batteries drained and +0.0048 science).
# Nothing in the lane earns science, so no lab credit may appear anywhere.
#
# THE CONVERTER-RESTORE QUESTION (asked by the plan, answered from source). Parsek has NO
# spawn-time restore for the lab's `ModuleScienceConverter`: `SpawnedHarvesterRestore` arms only
# `ModuleResourceHarvester` modules (`HarvesterModuleName`, `CollectActiveHarvesters`, called
# from VesselSpawner's RespawnVessel and SpawnAtPosition), and `CarryIntoSavedFlightState` marks
# only harvesters. None is needed by stock's rules: the end snapshot carries the converter's
# `IsActivated = True` and both kerbals, and stock switches research off in exactly one place,
# `ModuleScienceConverter.PostProcess` with no ScienceSkill crew IN THE LAB PART (decompiled
# 1.12.5). The drills' failure mode (a ground raycast that misses while a landed spawn settles)
# has no lab analogue, and `SwapReservedCrewInFlight` skips a Parsek-spawned vessel, so Bob stays
# in the spawned lab. So this lane EXPECTS `Research:active=1` on both spawns with no Parsek help;
# a 0 there would be a product gap to file (the spawn lost or moved the scientist), not a lane
# fault, and the "keeps researching" and catch-up checks after it would red with it.
#
# THE WATCH. The plan's EnterWatchMode + CaptureScreenshot step is not here: watch mode needs the
# ghost inside the 120 km visual range of the active vessel, and after the rewind the only
# FLIGHT vessel is the probe on the pad, about 100 km below the ghost's orbit only at an
# overpass. The lane photographs the SPAWNED lab instead (CaptureScreenshot after it is flown).
#
# THE CREW. The commit's walk reserves both kerbals (LAB-8's lines: `Reservation: 'Bob Kerman'`,
# `PostWalk summary: reservations=2`), the walks after the rewind keep them reserved while the
# ghost plays, and each spawn carries them (`Spawning vessel: "LABX Orbital Lab" sit=ORBITING,
# crew=[... Bob Kerman ...]`), with no crew stripped by the duplicate check.
#
# THE RECORDING IS RE-TAKEN ON EVERY FLY. Each LoadGame focused on a spawned lab re-takes the
# committed tree (`TryRestoreCommittedTreeForSpawnedActiveVessel`, a resumed-spawn segment,
# MINE-13's shape); the lane stops and discards that copy each time (MINE-8 / MINE-12's
# StopRecording + DiscardTree), so the committed count stays 1 and the Space Center exit has no
# merge to make.
#
# EXPECTED VALUES (stock 1.25e-5 science/s at 50 data, LAB-3's measured rate). End of recording
# (UT about 3607): storedScience about 0.0402 (F2 0.04), dataStored about 49.988. Warp spawn,
# flown at UT about 3700: a catch-up of the time since the end (about 0.0012) and 10 s at 1x, so
# diff about +0.0013. After 3,600 s more: diff about +0.0465. After the Space Center stay: diff
# about +0.051, batteries under 300 EC. Jump spawn, flown at UT about 4300: diff under 0.0010,
# charge within 300 EC of the snapshot.
#
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse - MINE-2 / MINE-7 / MINE-9 fly this route for
# a landed miner; the lab is its own host, and LAB-3's lane ends researching-off, so a spawn of
# its recording could not test the research state. (2) no idle waits - every wait is an
# explicit-UT WarpToUT; 10 s at 1x after each load covers stock's 1 s post-load hold on converter
# steps. (3) the research warp is 3,200 s (about 70 s at 50x), enough for F2 science; the pad warp
# at up to 1000x; the Space Center stay at up to 1000x (about 25 s). (4) no burns. (5) no coast.
# (6) fail fast - a refused verb fails its step; retry `once` until the first flight shows the
# lane deterministic. (7) count window - one committed recording, pinned {1,1}. (8) tier -
# operator until the reading run; promote by the measured p50 (expected about 8 min).
# (9) flight_efficiency.py after the first green flight.
#
# WHAT A FIRST FLIGHT CAN FALSIFY: the restore belief above (`Research:active=0` on a spawn); the
# end-snapshot equality on both spawns (a lab that spawned empty, or with the absence produced);
# the spawn-snapshot clock shift for a lab (`removed=` window; EC drained on the jump spawn); the
# crew on the spawns (the `crew=[...]` list, a dedup strip); the reservation lines after the
# rewind; the editor route in the rewound world; the restore-and-discard cycle (a count of 2);
# the EC-limited catch-up on a spawned lab; the UT windows (the pad warp spawns the lab on the
# frame UT passes the end, so the flown reading's catch-up depends on how late the spawn lands).
description = "LAB-7: a crewed science lab in low Kerbin orbit records four experiments processed and 3,200 s of research, commits still researching and is rewound to launch; with a probe on the pad holding the flight, a warp past the recording's end spawns the real lab with its end snapshot, research on and its scientist aboard, still researching afterwards and catching up once (charge-limited) after a Space Center stay, while a time jump past the end spawns it with the jumped span removed from its converter clock so it matches the end snapshot exactly; the crew stay reserved while the ghost plays and no lab science is paid anywhere."
instanceProfile = "stock-minimal"
tags = ["science-lab", "science", "converter", "rewind", "real-spawn", "time-jump", "LAB-7", "pending-flight"]

