  # The Space Center stay: one charge-limited catch-up on the spawned lab.
  "exittospacecenter start scene=FLIGHT autoMerge=(?:true|false) hasActiveTree=false hasPendingTree=false",
  "(?s)MISSIONMARK label=lab7-ksc-back (?:(?!MISSIONMARK).)*?readvesselresources vessel index=0 rec=- found=true pid=[0-9]+ name='LABX Orbital Lab' loaded=true parts=26 ElectricCharge=(?:[0-9]{1,2}|[12][0-9]{2})\\.[0-9]{4}/1900\\.0000",
  "(?s)MISSIONMARK label=lab7-ksc-back (?:(?!MISSIONMARK).)*?partaction snapshot rec=[0-9a-f]{32} partId=[0-9]+ field=storedScience live=0\\.0[6-9][0-9]{2} snapshot=0\\.0[3-5][0-9]{2} diff=0\\.0(?:39|[4-5][0-9]|6[0-4])[0-9] ",
  "(?s)MISSIONMARK label=lab7-ksc-back (?:(?!MISSIONMARK).)*?partaction applied button=inspect pid=(?!2200110055 )[0-9]+ part='Large\\.Crewed\\.Lab' [^\\r\\n]*;Research:active=1'",
  # JUMP branch: the pad state reloaded; the jump crosses the end and the lab spawns after it,
  # its snapshot clock moved past the jumped span (about 4300 - 3607 = 693 s), Bob aboard.
  "loadgame start save=\\S+ name=lab7-pad scene=FLIGHT requestedScene=Unspecified allowLiveRecorder=\\(none\\) recorderLive=false",
  "timejump start target=4300 delta=",
  "(?s)MISSIONMARK label=lab7-jump-before (?:(?!MISSIONMARK).)*?Converter jump policy \\(spawn\\): (?:RespawnVessel|SpawnAtPosition) vessel=LABX Orbital Lab modules=1 removed=69[0-9]\\.[0-9] spans=1 ut=430[0-9]\\.[0-9]",
  "(?s)MISSIONMARK label=lab7-jump-before (?:(?!MISSIONMARK).)*?Spawning vessel: \"LABX Orbital Lab\" sit=ORBITING, crew=\\[[^\\]\\r\\n]*Bob Kerman[^\\]\\r\\n]*\\]",
  "MISSIONMARK label=lab7-jump-spawned-true-[0-9]+ ",
  # Flown, it matches the end snapshot at F4 (only the 10 s at 1x since the jump) ...
  "(?s)MISSIONMARK label=lab7-jump-spawn-flown (?:(?!MISSIONMARK).)*?partaction snapshot rec=[0-9a-f]{32} partId=[0-9]+ field=storedScience live=0\\.0[3-5][0-9]{2} snapshot=0\\.0[3-5][0-9]{2} diff=0\\.000[0-9] match=true",
  "(?s)MISSIONMARK label=lab7-jump-spawn-flown (?:(?!MISSIONMARK).)*?partaction snapshot complete rec=[0-9a-f]{32} parts=1 compared=1 [^\\r\\n]*snapshotMatch=true ",
  "(?s)MISSIONMARK label=lab7-jump-spawn-flown (?:(?!MISSIONMARK).)*?partaction applied button=inspect pid=(?!2200110055 )[0-9]+ part='Large\\.Crewed\\.Lab' [^\\r\\n]*;Research:active=1' [^\\r\\n]*snapshotMatch=true",
  # ... and its charge matches the snapshot's (a missed shift drains the 1,900 EC).
  "(?s)MISSIONMARK label=lab7-jump-spawn-flown (?:(?!MISSIONMARK).)*?readvesselresources snapshot rec=[0-9a-f]{32} pid=[0-9]+ resource=ElectricCharge live=1[0-9]{3}\\.[0-9]{4} snapshot=1[89][0-9]{2}\\.[0-9]{4} diff=-?[0-9]+\\.[0-9]{4} match=true",
  "(?s)MISSIONMARK label=lab7-jump-spawn-flown (?:(?!MISSIONMARK).)*?readvesselresources complete vessels=1 missing=0 uidCollisions=0 [^\\r\\n]*snapshotMatch=true",
  # One committed recording at the end: every re-taken copy was dropped.
  "MISSIONMARK label=lab7-done-1 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "partaction rejected ",
  "partaction-lab-value-zero",
  "partaction error ",
  "readvesselresources rejected",
  "invokerewindtolaunch refused",
  "timejump refused",
  "Spawn RETIRED",
  "Spawn ABANDONED",
  "Spawn FAILED",
  "uidCollisions=[1-9]",
  # No crew is stripped from the lab's spawns.
  "Crew dedup: removed [1-9]",
  "Removed dead/missing crew",
  # Nothing earns science: no lab credit and no stock science gain anywhere.
  "ScienceLabCredited",
  "Game state: ScienceChanged",
  "Exploded!!",
  "IsTreeIdleOnPad: all [0-9]+ recordings",
  "TrimBoringTail: trimmed 'LABX Orbital Lab'",
  # The recording never logs research switching off (it ends researching).
  "(?s)MISSIONMARK label=lab7-recording-live (?:(?!MISSIONMARK label=lab7-commit-before ).)*?Part event: ConverterDeactivated 'Large\\.Crewed\\.Lab'",
  # The warp spawn is real time: no jumped span may touch its snapshot.
  "(?s)MISSIONMARK label=lab7-recording-live (?:(?!MISSIONMARK label=lab7-jump-before ).)*?Converter jump policy \\(spawn\\)",
  # Exactly two spawns of the lab in the run (one per branch).
  "(?s)Spawning vessel: \"LABX Orbital Lab\".*?Spawning vessel: \"LABX Orbital Lab\".*?Spawning vessel: \"LABX Orbital Lab\"",
]

[runtime]
# Six LoadGame steps and the rewind (about 7 s each measured, up to 300 s budgeted), about 40 s of
# 1x game time, 3,200 s and 3,600 s of rails warp at 50x (about 70 + 78 s), the pad warp and the
# Space Center stay at up to 1000x (about 35 s), the editor and a launch (about 10 s), a jump.
budgetSeconds = 2400

[retry]
policy = "once"

