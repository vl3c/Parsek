schema = 1
id = "LAB-7-lab-rewind-spawn"
tier = "operator"
# THE SCIENCE-LAB PROGRAM, lane LAB-7 (plan `docs/dev/research/lab-test-program-2026-10-17.md`,
# "LAB-7 rewind, ghost, spawn"). FIRST FLIGHTS `2026-10-17_2308` / `_2318_a2` INVALID
# (driver-arg) on BOTH attempts, from a PRODUCT DEFECT the warp branch ran into (below): the lab
# never spawned at its recording's end, so `ListHandles` answered `rec0spawnedPid=0` and every
# later step that named the spawn (`LoadGame focusPid=0`, `PartAction pid=0`, ...) was refused.
# Restructured so the defect reads PARSEK-FAIL instead of driver-INVALID; not re-flown.
#
# THE PRODUCT DEFECT (stays red here on purpose). In the warp branch the end-of-recording spawn
# was deferred by the warp and then refused: `Tail-derived terminal orbit: ... tailUT=3606.65
# sma=596265.8 ecc=0.1622 periAlt=-100447.2 apoAlt=92978.8`, `TryBuildRecordedTerminalOrbitForSpawn:
# ... source=trajectory-tail`, `Terminal spawn safety decision: ... decision=CannotSpawnSafely
# reason=periapsis-below-safe-altitude ... periapsis=-100447.2`, `Held ghost released (cannot spawn
# safely): ... the ghost ends at EndUT without a spawn`. The recording's stored orbit segment says
# sma 699,745.8 / ecc 0.0104 (periapsis 92.5 km, apoapsis 107 km), and the jump branch, whose spawn
# is 693 s past the tail and so skips the tail seed (`rotation-drift-out-of-bounds ... limit=30.00s`),
# spawned from that segment and was safe (`source=stored-segment`, `decision=SpawnNow`). The tail
# seed (`OrbitReseed.FromLatLonAltAndRecordedVelocity`) read |vel| 2,066 m/s at 92.95 km where the
# orbit's inertial speed is about 2,240 m/s, so it looks like a rotating-frame (surface-relative)
# velocity taken as inertial: the tail point lies below Kerbin's inverse-rotation altitude. Effect
# for a player: an orbiting vessel whose recording ends below that altitude, reached by warp or
# 1x within 30 s of its end, never comes back as the real vessel. Kept red by
# `MISSIONMARK label=lab7-warp-spawned-true-`, the warp-branch snapshot read and a forbidden
# `decision=CannotSpawnSafely` line, until the spawn path is fixed.
#
# HOST: `lab-lko-science` (the LAB-2 / LAB-3 host): SCIENCE_SANDBOX, the LABX Orbital Lab (vessel
# persistentId 2200110055) ORBITING Kerbin at about 107 x 92 km, Valentina in the Mk1 pod, Bob
# (Scientist, level 0) in the Large.Crewed.Lab (part persistentId 1700054019, flightID
# 1270217782), 1,900 EC in full batteries, 8 RTGs. Fixture UT 355.8. The shared-ships overlay
# gives the save `Settings Probe` for the pad.
#
# THE STORY. Record the lab processing its four experiments and researching for 3,200 s of rails
# warp (it ends the recording STILL researching), commit, and Rewind-to-Launch (MINE-2's route):
# the rewind lands at the Space Center with the lab stripped and replaying as a ghost, Bob and
# Valentina reserved to it. A probe launched from the VAB holds FLIGHT (the rewound world has no
# other vessel and TimeJump is FLIGHT-only), and that pad state is saved. Then two branches, the
# one that works today FIRST so its checks run:
#   * JUMP: TimeJump past the end so the lab spawns AFTER the jump; the spawn removes the jumped
#     span from the snapshot clock (`Converter jump policy (spawn): ... removed=693.0`, owner
#     ruling 2026-10-17), so flown (LoadGame focusPid of the spawn) it matches the end snapshot at
#     F4 (diff 0.0002 measured) and in charge, with Research ON and Bob aboard; 3,600 s of rails
#     warp then show it researching (about +0.045); a six-hour Space Center stay then shows stock's
#     catch-up on the SPAWNED lab: the whole absence (about +0.27, LAB-6's measured behaviour), the
#     batteries still full.
#   * WARP: reload the pad state and warp on the pad past the recording's end; the real lab must
#     spawn with its end snapshot. This branch reads the spawn only by recording id
#     (`ReadVesselResources rec=<it> expectSnapshot=true`, which answers OK with `missing=1` when
#     the spawn did not happen), so the defect above fails the lane's contracts, not its driver.
# Nothing in the lane earns science, so no lab credit may appear anywhere.
#
# THE CATCH-UP PREMISE, CORRECTED. The authored lane expected a catch-up cut to the batteries'
# 1,900 EC (380 s of research, the batteries drained). LAB-6's first flight measured the opposite:
# the RTGs' output is part of stock's catch-up, so an unloaded lab catches up the whole absence
# (one 21,600 s MaxDeltaTime slice) and keeps its batteries full. So a missed spawn-clock shift in
# the jump branch would add about 693 s of research (+0.0087) with the charge unchanged: the F4
# `diff=0\.000[0-9]` window is the discriminator, and the charge check only pins "full".
#
# THE CONVERTER-RESTORE QUESTION (asked by the plan, answered from source, CONFIRMED by the jump
# spawn: `Research:active=1`). Parsek has NO spawn-time restore for the lab's
# `ModuleScienceConverter`: `SpawnedHarvesterRestore` arms only `ModuleResourceHarvester`. None is
# needed: the end snapshot carries `IsActivated = True` and both kerbals, stock switches research
# off only with no ScienceSkill crew in the lab part (`ModuleScienceConverter.PostProcess`), and
# `SwapReservedCrewInFlight` skips a Parsek-spawned vessel. The first flight's jump spawn read
# `crew=[Valentina Kerman, Bob Kerman]` and `Research:active=1`.
#
# THE WATCH. The plan's EnterWatchMode step is not here: watch mode needs the ghost inside the
# 120 km visual range of the active vessel, and after the rewind the only FLIGHT vessel is the
# probe on the pad. The lane photographs the spawned lab instead.
#
# THE RECORDING IS RE-TAKEN ON EVERY FLY. Each LoadGame focused on a spawned lab re-takes the
# committed tree (`TryRestoreCommittedTreeForSpawnedActiveVessel ... continues in new segment`);
# the lane stops and discards that copy each time (StopRecording + DiscardTree), so the committed
# count stays 1 (the first flight: `lab7-done-1`).
#
# MEASURED / EXPECTED VALUES. End of recording (UT 3607): storedScience 0.0402, dataStored
# 49.9883, charge 1,900. Jump spawn flown at UT 4313: diff 0.0002, charge 1,900 = snapshot.
# After 3,600 s more: diff about +0.045 (window 0.0350 .. 0.0599). After the Space Center stay:
# diff about 0.316 (window 0.3000 .. 0.3399), charge full. Warp spawn: snapshot charge, unloaded.
#
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse - MINE-2 / MINE-7 / MINE-9 fly this route for
# a landed miner; the lab is its own host, and LAB-3's lane ends researching-off. (2) no idle
# waits - every wait is an explicit-UT WarpToUT; 10 s at 1x after each load covers stock's 1 s
# post-load hold on converter steps. (3) the research warp is 3,200 s (79 s measured); the pad
# warp (43 s measured) and the Space Center stay (61 s measured) at up to 1000x. (4) no burns.
# (5) no coast. (6) fail fast - a refused verb fails its step; retry `once`. (7) count window -
# one committed recording, pinned {1,1}. (8) tier - operator. (9) flight_efficiency.py after the
# first green flight.
#
# WHAT A RE-FLIGHT CAN FALSIFY: the jump-branch checks (all matched on the first flight, except
# the moved researching / Space Center readings, which ran on the warp spawn that never came);
# the full catch-up on a spawned lab; and, once the spawn path is fixed, the warp spawn's
# snapshot. Until then the lane is PARSEK-FAIL on the warp branch by design.
description = "LAB-7: a crewed science lab in low Kerbin orbit records four experiments processed and 3,200 s of research, commits still researching and is rewound to launch; with a probe on the pad holding the flight, a time jump past the recording's end spawns the real lab with the jumped span removed from its converter clock, matching its end snapshot with research on and its scientist aboard, still researching afterwards and catching up the whole absence once after a Space Center stay, and a warp past the end must spawn it with its end snapshot too (red today: the end spawn is refused as unsafe from a wrong tail-derived orbit); the crew stay reserved while the ghost plays and no lab science is paid anywhere."
instanceProfile = "stock-minimal"
tags = ["science-lab", "science", "converter", "rewind", "real-spawn", "time-jump", "LAB-7", "pending-flight"]

