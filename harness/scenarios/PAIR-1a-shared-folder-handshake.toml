[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
required = []
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
]

[runtime]
budgetSeconds = 900

[retry]
policy = "none"

