schema = 1
id = "GUI-3-census-logistics-routes"
tier = "operator"
# THE GUI CENSUS, WAVE 2: THE POPULATED LOGISTICS HOST. GUI-1 and GUI-2 photographed
# every Parsek window's CHROME; what they could not photograph is any window's populated
# BODY, because the two things a census needs of a body - rows of the right shape, and a
# disclosure opened - were out of reach. This lane closes the first half for Logistics
# (a different `saveTemplate`) and the second half everywhere it goes (`op=expand`,
# `op=target`, `op=picker`, the six ops the sibling branch `gui-census-ops` added).
# The targets it claims are named row by row in `docs/dev/design-gui-inventory.md`
# section 6.1 and section 6.2; what it CANNOT reach is at the bottom of this header.
#
# WHY THIS FIXTURE. `fixtures/saves/interbody-route-recorded` is the only committed save
# that carries TWO routes in DIFFERENT states plus a dismissed-candidate list, which is
# what turns the Logistics window from a box with a header into a layout. Read off its
# own `persistent.sfs` rather than off the fixture README, because the states are the
# whole point:
#   ROUTE 8f644e71b1164df3bb735330127d2ee7  "Route: KSC -> Mun"   status = Paused,
#     completedCycles = 0, pauseAfterCurrentCycle = False  -> the `New (not yet run)`
#     row form, which no capture has ever shown;
#   ROUTE 71a983a16dc04d78bc2a2b90f1d184b0  "Route: KSC -> Duna"  status = Active,
#     completedCycles = 0, pauseAfterCurrentCycle = True   -> the send-once-armed row;
#   DISMISSED_ROUTE_CANDIDATES with TWO treeIds -> the `Dismissed (2)` header;
#   four MISSIONs with ASCII names (`Kerbal X #3`, `Kerbal X #4`, `Kerbal X #5`,
#     `Duna Supply 1`) and the same four as `autoGeneratedRootGroupName` values.
# THE ROUTES ARE ADDRESSED BY ID, NOT BY NAME, and that is a house-style decision rather
# than a preference: both display names carry a U+2192 RIGHT ARROW, and a committed spec
# in this repo is plain ASCII. `op=target` / `op=picker` resolve the id on their FIRST
# rung (`TryResolveRouteTarget`), so the id is also the cheaper lookup.
#
# WHAT IT PHOTOGRAPHS (14 PNGs, each with a `<label>.gui.json` dump beside it):
#   - the Logistics window POPULATED and COLLAPSED, then the same window with every
#     disclosure open (`op=expand window=logistics key=all` walks the route rows, the
#     `cand:` candidate rows AND the three fixed section keys, so one step opens the
#     largest un-photographed control cluster in the mod);
#   - the Structure window (`Parsek - Structure`, the Log) on a ROUTE and on a MISSION.
#     GUI-1's `ksc-structure-advanced` is a picture of the empty "Nothing to show."
#     chrome because `op=open window=structure` raises a flag and nothing else; `op=target`
#     calls the production `StructureListWindowUI.OpenForRoute` / `OpenForMission`, which
#     set the target and REBUILD before raising it. That closes
#     GUI-CENSUS-STRUCTURE-WINDOW-HAS-NO-DRIVEABLE-TARGET for the KSC half;
#   - the Missions tab and the Recordings tab over a four-mission corpus, collapsed and
#     then fully expanded (`op=expand window=missions key=all` drives all five of that
#     window's independent sets - groups, chains, vessels, legs and the `Events (N)`
#     digests - through their own production key enumerations);
#   - BOTH group-picker titles: `Manage Groups` (`recording=first`) and `Set Parent Group`
#     (`group=Kerbal X #3`). Those are two of the three window hosts the seam's window
#     table deliberately excludes, reached through their own production openers;
#   - the Logistics round-trip LINK PICKER, the third excluded host;
#   - one attempt at a POPULATED TOOLTIP ECHO STRIP on the main window, via `op=find` ->
#     `op=pointer`. MEASURED 2026-09-11: the cursor LANDS and the hover does NOT PAINT, so
#     `ib-main-tooltip-logistics-advanced` is a picture of the UN-hovered window - see the
#     FLOWN block at the bottom of this header and
#     GUI-CENSUS-POINTER-LANDS-BUT-HOVER-DOES-NOT-PAINT. The label is kept as it is because
#     the run id cites it.
#
# IT MOVES THE OPERATOR'S MOUSE. `op=pointer` is the only op in the seam that reaches
# outside the process: `Input.mousePosition` is read-only and Unity fills
# `Event.current.mousePosition` from it, so a hover cannot be synthesised in managed code
# at all. The cursor is a single machine-wide resource, so a run of this lane yanks the
# operator's pointer once, parks it in the client corner immediately afterwards, and logs
# an Info line at every move naming both points. An operator who moves his own mouse
# during the hover invalidates it, and the capture is then a picture of an unhovered
# control - readable back from `KSP.log`, which is why the caveat is recorded here rather
# than guarded.
#
# STEP ORDER IS DEFENSIVE, and the reason is measured on this lane's own two siblings:
# GUI-1 and GUI-2 both read INVALID on their first flight, each on ONE step, and BOTH
# still harvested every picture they had taken by then (the always-collect leg runs on a
# driver-INVALID run exactly as it does on a PASS). So the ordering rule here is that a
# step whose answer is a QUESTION goes as late as its own capture allows. The two
# questions this lane asks are the `Set Parent Group` picker (whether
# `GroupPickerPresentation.BuildTreeModel` publishes the auto-generated root group under
# exactly the name the recording carries) and the link picker (whether
# `OpenLinkPickerForTesting` opens over a route with no arming click), and both sit in the
# last third.
#
# THE PICKERS ARE NOT CLOSED BY A SEAM OP, and nothing needs one: the Advanced -> Basic
# complexity switch closes the gated, lock-owning windows, the group picker INCLUDED, so
# the Basic pass at the bottom starts from a clean screen. That is also why every picker
# capture sits at the END of the Advanced pass - a picker left standing over a later
# capture would be an overlay under a label that does not name it.
#
# `op=open window=main` FIRST IS A PRECONDITION, not just the natural order: the settle
# for a non-`main` `open` / `rect` REFUSES while the host's `showUI` is false
# (`ERROR window-host-hidden`). This lane opens `main` first and leaves it open.
#
# WHY `scene = "spacecenter"` IS REQUIRED. The host's `activeVessel = 0` names a focusable
# vessel, so a plain `LoadGame` takes `TestCommandLoadGame.DecideLoadRoute`'s Focusable
# branch and boots into FLIGHT. R12's additive `scene=` arg forces the KSC route.
#
# THE ANALYZER ROW IS LEFT GATING, unlike GUI-1 / GUI-2. Those two declare
# `[expectations.analyzer] gating = false` because their host is the operator's own career
# and carries pre-existing findings no census causes or observes. This host is a COMMITTED
# fixture that three other committed lanes already fly green (`B32-interbody-route-scope`,
# `V26M`, `V26T`), so there is nothing to exempt and `ANALYZER_REPORT_ONLY_ALLOWLIST` stays
# exactly as it is.
#
# WHAT THIS LANE CANNOT PHOTOGRAPH, named rather than left to a reader to notice:
#   - ANY `PopupDialog`. All 21 of them stay dark, and the cause is structural rather than
#     a missing lane. `op=dialog` is the READ-ONLY half (it reports a live popup and holds
#     nothing), and nothing in the seam can RAISE one and leave it standing:
#     `ExitToSpaceCenter` REFUSES `dialog-required` rather than driving an exit into a
#     modal, `AnswerMergeDialog` drives the re-fly conclusion AND invokes the button in one
#     call (`DriveReFlyConclusion` -> `TryInvokeMergeButton`) with no window in between,
#     and `SimulateStockSwitchClick` turns all three pre-switch dialog cases into typed
#     REJECTEDs. So this lane's `op=dialog` step asserts the NEGATIVE - that no Parsek modal
#     stands over the census - which is the one thing the op can prove here and is worth
#     pinning, because a modal nobody expected would silently sit over every later capture.
#     `docs/dev/design-gui-inventory.md` section 6.2 names the two prerequisites a dialog
#     capture needs and neither shipped with `gui-census-ops`.
#   - the Logistics red / cyan tints and the route phase colours: a GUI tree carries no
#     colour field, so those claims live in the PNG alone (section 6.3) and this lane
#     produces the PNG without asserting on it.
#   - the window's right-hand columns. `LogisticsWindowUI.MinWindowWidth` is 1410 and the
#     `stock-minimal` profile's screen is 1280x720, so the window is commanded at its own
#     floor (`op=rect` clamps to it anyway) and honestly CLIPPED at the client edge.
#     Residue GUI-CENSUS-TWO-WINDOWS-EXCEED-THE-INSTANCE-WIDTH, unchanged.
#
# FLOWN 2026-09-11: reading run `2026-09-11_1548`, PASS on attempt 1, 80 s wall, all 78 steps
# met, 14 PNGs + 14 dumps (every dump `patched=17/17`, `recordFaults=0`), every verifier PASS
# or REPORT, `expectations mismatches=0`. Every `[expectations.logContracts]` line below is one
# of this lane's OWN seam records; nothing is asserted about the host's own log surface, for
# GUI-1's reason.
#
# WHAT THE RUN MEASURED, beyond meeting its steps:
#   - THE ROUTES ARE POPULATED, which is the one fact this lane exists for. The `saveParse`
#     row read `routes=2 routeStatuses={'Paused': 1, 'Active': 1}`, and
#     `ib-logistics-expanded-advanced` (190 nodes against the collapsed form's 121) carries
#     `Active Routes` with `Route: KSC -> Duna` to `Depot Station Duna I`
#     (`New (not yet run)`, `Next launch window T-1y 291d 5h 22m 0s`, `Delivers per cycle:
#     LiquidFuel 257.8, Oxidizer 315.1`), `Paused Routes` with `Route: KSC -> Mun`, and a
#     `Dismissed (2)` disclosure. `op=expand key=all` answered `changed=5 expanded=5 total=5`.
#   - BOTH QUESTIONS ANSWERED YES. `Set Parent Group` resolved `group=Kerbal X #3`, so
#     `GroupPickerPresentation.BuildTreeModel` does publish the auto-generated root group
#     under the name the recording carries; and the link picker opened with no arming click
#     (`Link 'Route: KSC -> Duna' with:` over the one other route).
#   - The Structure openers reported `steps=4` on the route and `steps=38` on the mission,
#     and the windows are titled after their subjects rather than reading "Nothing to show.".
#   - The `Candidates` section is present and EMPTY (`No eligible Supply Runs...`): this host
#     carries a DISMISSED list, not live candidates, which the inventory's 6.1 row already
#     says. A populated Candidates picture still wants a `rover-route-recorded` lane.
#   - `op=dialog` answered `open=false count=0`, so nothing stood over any capture.
description = "GUI census wave 2, the populated Logistics host: photograph the Logistics window with two routes and a dismissed list, collapsed then fully expanded, the Structure window opened ON a route and ON a mission, the Missions and Recordings tabs expanded over a four-mission corpus, both group-picker titles, the round-trip link picker and one populated tooltip echo strip."
instanceProfile = "stock-minimal"
tags = ["gui-census", "screenshots", "ui", "logistics", "GUI-3", "pending-operator"]

[fixture]
saveTemplate = "fixtures/saves/interbody-route-recorded"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  # --- boot, forced to the Space Center ---
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },

  # --- Advanced pass ---
  { cmd = "UiAction", args = { op = "complexity", mode = "advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "open", window = "main" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "main", x = "8", y = "8", w = "250", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-main-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-main-advanced" }, expect = "OK" },

  # THE TOOLTIP ECHO STRIP, and the reason it is taken FIRST is that it is the only
  # capture in the lane whose subject is the MAIN window on its own. `op=find` records one
  # in-memory GUI tree, matches the control by the words a reviewer can read, and answers a
  # centre; `${findlogi.cx}` / `${findlogi.cy}` carry that centre into the pointer step, so
  # nothing here is a hard-coded coordinate (a window's layout depends on its rect, its
  # mode, the save's row counts and the skin). `Logistics` is the target because its
  # tooltip - "Supply routes that repeat a delivery you already flew." - is the one this
  # lane's whole subject is about.
  { cmd = "UiAction", args = { op = "find", window = "main", text = "Logistics" }, label = "findlogi", expect = "OK" },
  { cmd = "UiAction", args = { op = "pointer", x = "${findlogi.cx}", y = "${findlogi.cy}" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-main-tooltip-logistics-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-main-tooltip-logistics-advanced" }, expect = "OK" },
  # Park at the client corner so every later capture is hover-free under a label that does
  # not claim a hover.
  { cmd = "UiAction", args = { op = "pointer", park = "true" }, expect = "OK" },

  # --- Logistics, the subject ---
  # Commanded at its OWN MinWindowWidth (1410) at x=0: `op=rect` clamps to that floor, so a
  # smaller number would produce the same rect with `clamped=true` and a spec that lies
  # about what it asked for.
  { cmd = "UiAction", args = { op = "open", window = "logistics" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "logistics", x = "0", y = "8", w = "1410", h = "700" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-logistics-collapsed-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-logistics-collapsed-advanced" }, expect = "OK" },
  # ONE STEP OPENS THE WHOLE WINDOW. `key=all` enumerates the window's own row keys
  # (`LogisticsWindowUI.EnumerateRowKeysForTesting`: route ids, `cand:` candidate keys and
  # the three published section-key constants), so the capture below carries the route
  # detail panels, the candidate detail panels and the near-miss / dismissed / dormant
  # disclosures at once. `changed=` in the payload is what separates "already open" from
  # "opened by this step" when the two pictures look alike.
  { cmd = "UiAction", args = { op = "expand", window = "logistics", key = "all" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-logistics-expanded-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-logistics-expanded-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "logistics" }, expect = "OK" },

  # --- the Structure window, POPULATED, both target modes ---
  # `op=target` is the whole difference from GUI-1's `ksc-structure-advanced`: it calls the
  # production opener, which sets the target and rebuilds the step list BEFORE raising the
  # flag, and reports the row count it produced as `steps=`.
  { cmd = "UiAction", args = { op = "target", window = "structure", route = "8f644e71b1164df3bb735330127d2ee7" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "structure", x = "270", y = "8", w = "1000", h = "520" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-structure-route-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-structure-route-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "structure" }, expect = "OK" },

  # The mission form of the same window. `mission=` resolves on three rungs (tree id,
  # Mission display NAME, tree name); `Duna Supply 1` is the display name this fixture's
  # MISSION node carries, which is what a reviewer reads off the window.
  { cmd = "UiAction", args = { op = "target", window = "structure", mission = "Duna Supply 1" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "structure", x = "270", y = "8", w = "1000", h = "520" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-structure-mission-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-structure-mission-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "structure" }, expect = "OK" },

  # --- the Missions window over a route-bound corpus ---
  # What is new here against GUI-1's pair of the same two tabs is the DATA: four missions,
  # three of them route-backed, so the Missions tab draws the `Looped by route` header
  # label with its greyed Loop control and the Recordings tab draws the route-bound greyed
  # Loop toggles (`AnyRecordingRouteBound` scans every committed recording). Neither needs
  # a click; both are invisible on a corpus with no routes.
  { cmd = "UiAction", args = { op = "open", window = "missions" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "missions", x = "0", y = "8", w = "1355", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "missions" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-missions-missions-collapsed-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-missions-missions-collapsed-advanced" }, expect = "OK" },
  # All five of this window's independent expansion sets at once - group names, chain
  # block ids, `missionId:headId` vessel rows, the INVERTED leg set and the mission-id
  # digest set - each enumerated by the window class through the same flattened row model
  # the draw walks, which is what makes `key=all` agree with the tree the player sees.
  { cmd = "UiAction", args = { op = "expand", window = "missions", key = "all" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-missions-missions-expanded-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-missions-missions-expanded-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "recordings" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-missions-recordings-expanded-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-missions-recordings-expanded-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "missions" }, expect = "OK" },

  # --- the Logistics link picker, one of the three excluded window hosts ---
  # A QUESTION, and placed here for that reason: `OpenLinkPickerForTesting` wraps the same
  # private `OpenLinkPicker` a row click reaches, but no committed run has ever opened it
  # without an arming mouse position, so the popup's rect comes from wherever the cursor
  # was parked. The picture is the reading. The window under it is the Logistics window,
  # which is how a player sees it.
  { cmd = "UiAction", args = { op = "open", window = "logistics" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "logistics", x = "0", y = "8", w = "1410", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "picker", window = "logistics", route = "71a983a16dc04d78bc2a2b90f1d184b0" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-logistics-linkpicker-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-logistics-linkpicker-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "logistics" }, expect = "OK" },

  # --- both group-picker titles, over the Missions window that arms them ---
  # The MODE is derived from which opener ran (`groupPopupGroup != null`), not from an arg,
  # so these two steps are the only way to photograph the two titles apart.
  { cmd = "UiAction", args = { op = "open", window = "missions" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "missions", x = "0", y = "8", w = "1355", h = "700" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "tab", window = "missions", tab = "recordings" }, expect = "OK" },
  # `recording=first` exists because a committed spec cannot name a save-specific recording
  # id and the popup looks the same over any row; the payload reports the id it resolved.
  { cmd = "UiAction", args = { op = "picker", window = "missions", recording = "first" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-missions-grouppicker-manage-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-missions-grouppicker-manage-advanced" }, expect = "OK" },
  # THE SECOND QUESTION. `group=` resolves through `EnumerateGroupNamesForTesting`, which
  # walks the PRODUCTION `GroupPickerPresentation.BuildTreeModel`, and the name asked for
  # here is the `autoGeneratedRootGroupName` the fixture's first tree carries verbatim. If
  # the tree model publishes it under another spelling this step is a REJECTED whose own
  # message LISTS the names that exist - which is the reading, and every capture above it
  # is already on disk.
  { cmd = "UiAction", args = { op = "picker", window = "missions", group = "Kerbal X #3" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-missions-grouppicker-setparent-advanced" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-missions-grouppicker-setparent-advanced" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "missions" }, expect = "OK" },

  # THE NEGATIVE DIALOG ASSERTION. See the header: no seam path raises a Parsek modal and
  # leaves it standing, so the only thing `op=dialog` can prove on a census is that none
  # is up - which matters, because a modal nobody expected would sit over every capture
  # above under a label that does not name it.
  { cmd = "UiAction", args = { op = "dialog" }, expect = "OK" },

  # --- Basic pass ---
  # The mode switch also closes the gated, lock-owning windows - the group picker INCLUDED
  # - so the two captures below start from a clean screen without a close op for a window
  # the table does not carry.
  { cmd = "UiAction", args = { op = "complexity", mode = "basic" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-main-basic" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-main-basic" }, expect = "OK" },

  { cmd = "UiAction", args = { op = "open", window = "logistics" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "describe" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "rect", window = "logistics", x = "0", y = "8", w = "1410", h = "700" }, expect = "OK" },
  { cmd = "CaptureScreenshot", args = { label = "ib-logistics-basic" }, expect = "OK" },
  { cmd = "DumpGuiTree", args = { label = "ib-logistics-basic" }, expect = "OK" },
  { cmd = "UiAction", args = { op = "close", window = "logistics" }, expect = "OK" },

  # Leave the install in Advanced. Belt and braces on a harness run (run.py rewrites the
  # instance's settings sidecar to its own baseline at stage and teardown either way), kept
  # because it costs one op and it is the right thing to do to a shared install.
  { cmd = "UiAction", args = { op = "complexity", mode = "advanced" }, expect = "OK" },
  { cmd = "FlushAndQuit", expect = "OK" },
]

[dimensionsCovered]
# BASICS ONLY, deliberately. A dimension claim says a value was EXERCISED AND OBSERVED,
# and this lane observes LAYOUT: it opens windows over a route corpus and photographs
# them. It drives no route, creates none and runs none, so no D10 value is earned here -
# `B32-interbody-route-scope` is the lane that claims those on this same host. The two
# below are properties of the host and hold the moment the boot lands.
D14 = ["sandbox", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.logContracts]
# This lane's OWN seam records only, the GUI-1 discipline: a capture lane may assert that
# a window DREW and what the seam DID, never what the window contained.
#
# THE DESCRIBE ECHOES ARE THE IN-RUN MAPPING CHECK. `open=<n> openWindows=<names>` paired
# with the count is an EXACT claim - a third open window would move the count - which is
# what catches a seam whose window token is wired to a different window's fields, a class
# of error the headless suite cannot see. `scene=SPACECENTER` on every line proves the
# whole census ran where it said.
#
# THE FIVE CENSUS-OP LINES ARE PINNED WITH THEIR VALUE FIELDS REGEXED. `changed=` /
# `expanded=` / `total=` / `steps=` are counts of whatever the save happened to hold, so a
# literal would pin the fixture's row arithmetic rather than the op's behaviour; the
# TOKENS (`key=all`, `state=true`, `target=route`, `picker=manage`) are literal, because
# those are the claim.
required = [
  # --- describe echoes, in step order ---
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=1 openWindows=main",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,logistics",
  "\\[Parsek\\]\\[INFO\\]\\[TestCommands\\] uiaction describe scene=SPACECENTER complexity=advanced windows=11 open=2 openWindows=main,structure",
