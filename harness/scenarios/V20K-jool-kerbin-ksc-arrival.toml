[expectations]
# Placement is load-bearing: a bare allowedAnomalies after an [expectations.<sub>]
# header is rejected by hlib.validate_spec. Empty on purpose (section 6).
allowedAnomalies = []

[expectations.recordings]
# The READING WIDTH (section 6). V20M and V20T each measured 1 over this fixture; that is
# a sibling's reading, so this lane tightens only off its own run.
count = { min = 1, max = 3 }

[expectations.logContracts]
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "loadgame spacecenter route \\(requested\\): resuming to SPACECENTER save=",
  "loadgame complete scene=SPACECENTER save=.* game-loaded=true expected=SpaceCenter",
  "ParsekKSC initialized, \\d+ committed recordings, \\d+ eligible for KSC ghost playback",
  "\\[KSCGhost\\] Eligible breakdown: looping=\\d+",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "timejump refused reason=backward-jump",
]

[expectations.rewind]
# REPORT-ONLY (no gating). The claim a later arming would gate: a FLIGHT-arm / SaveGame /
# SPACECENTER re-entry authors nothing durable.
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# REPORT-ONLY (no gating). V20T's measured windows, except `recordings`, held at the
# reading width like the count above.
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 3 }
terminalStates = { Orbiting = { min = 1 } }

[expectations.renderComposition]
# DECLARED BARE ON PURPOSE: no `gating`, no window, no list. Declaring sets
# `PARSEK_RENDER_MANIFEST=1` at launch; `rendercompose` then records facets on a parseable
# manifest, which is how a lane earns a first honest window. READING PENDING.

[runtime]
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
