# 2. THE FOUR PRE-REGISTERED ROADS, with the exact discriminating lines
# ---------------------------------------------------------------------------------
# **THE ROUTING IS NOW MEASURED AND IT IS R3.** Green reading run
# `2026-08-21_0746` (PASS attempt 1, wall 98 s). The four roads below are KEPT
# VERBATIM as they were pre-registered - none is deleted and none is re-worded to
# match the answer - and each carries the verdict the run gave it:
#   **R3 CONFIRMED**, on all four of its pre-registered lines at once.
