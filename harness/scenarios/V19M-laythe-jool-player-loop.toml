#   **R2 REFUTED**  - `[ReaimDiag] ... supported=False` on both diag lines and
#                     `factory chain ... reaimed=False` on every render line.
#   **R4 REFUTED**  - zero `[Parsek][ERROR]`, and the decline reason printed IS one of
#                     the pre-registered three, so no unlisted door was taken.
# THE MEASURED CLASSIFIER OUTPUT, quoted:
#     `ExtractConstraints: tree=91be0ffd... members=1 launchBody=Laythe
#      ut0=28817026.557051532 support=UnsupportedCrossParent constraints=1
#      [Orbital(Jool) cross-parent P=104661432.1079886 off=6359.6406222730875]
#      why=orbital target 'Jool' is not a direct child of launch body 'Laythe'
#      (synodic, Phase 4)`
#     `[ReaimDiag] mission='Duna Rocket' member#0 segs=8 startBody=Laythe
#      supported=False reason='no target arrival leg after the heliocentric coast'`
#     `[ReaimDiag] ... gatheredSegs=8 transferMemberSegs=0 plan.Supported=False
#      reason='no member yields a re-aim transfer'`
#     `MissionLoopUnit: mission='Duna Rocket' not re-aim (no member yields a re-aim
#      transfer); faithful`
#     `factory chain rec=28f5cc0158c8461eb995ea1e505aa67e idx=0 inst=0 phases=5
#      reaimed=False window=[28817026.6,28829018.4] faithfulFallback=False`
#
# **ONE READING WORTH A SENTENCE AND NOT A DEFECT.** `P=104661432.1079886` in the
# constraint above is JOOL'S OWN SOLAR PERIOD (`2*pi*sqrt(a^3/mu_Sun)` with
# a = 68,773,560,320 m gives 1.0466e8 s) - rule 4 emitted the target's period about ITS
# OWN parent, which is the physically wrong recurrence for Laythe/Jool relative
# geometry. It FAILS CLOSED: `support=UnsupportedCrossParent`, so nothing downstream
# consumes it and the anchor is kept as-is. Recorded as a reading; NOT written up as a
# bug and NOT gated on.
#
# **AND THE DECLINE MECHANISM IS NEW - THIS IS THE MEASUREMENT THE LANE EXISTED FOR.**
# V17M's cross-parent subject declined on the PARKING-ORBIT / MID-COURSE structural
# check. THIS ONE DECLINES ON THE ARRIVAL-LEG SCAN, and ONLY AN INVERTED-DIRECTION
# SUBJECT CAN REACH THAT DOOR. The chain, measured rather than argued: because Jool is
# a strict ANCESTOR of Laythe, the Jool park SATISFIES `helioIdx`, so the
# MissingHeliocentricLeg decline every prior V lane printed cannot fire;
# `commonAncestor` resolves to `"Jool"`; and the arrival scan then looks for a segment
# whose body is neither `"Jool"` nor `"Laythe"` and finds none, because this recording
# visits exactly two bodies. Hence `reason='no target arrival leg after the
# heliocentric coast'` - **A STRING NO COMMITTED LANE HAD EVER PRINTED.** The
# same-parent inversion is therefore ASYMMETRIC, and that asymmetry is now MEASURED
# rather than inferred from a code walk.
#
# **R1 - PHASE-LOCK ENGAGES.** The lines that would say so:
#     `PhaseLock APPLIED: mission=` ... `method=single-orbital`
#     `Orbital(Jool) same-parent P=`
#   Code reading says NO: `IsSameParentTarget` compares `ReferenceBodyName("Jool")`,
#   which is `"Sun"`, against the launch body `"Laythe"`. But an inspection RANKS a
#   queue, it does not CLOSE it - V17M's own guard walk was right at every step it
#   modelled and still missed the step that decided the answer.
#
# **R2 - RE-AIM ENGAGES.** The lines that would say so:
#     `[ReaimDiag] ... supported=True`
#     `MissionLoopUnit: mission='...' ENGAGED re-aim Laythe->Jool via ...`
#     `factory chain rec=... reaimed=True` - GREP `reaimed=True` ALONE, NOT a longer
#     quoted run (see the note under R3: the emitter interposes `window=[...]`).
#
# **R3 - PLAIN FAITHFUL FIXED CADENCE**, the code-read prediction. The lines:
#     `PhaseLock SKIPPED: mission='...' tree=... support=UnsupportedCrossParent keeping anchor=`
#     `[ReaimDiag] ... supported=False reason='no target arrival leg after the heliocentric coast'`
#     `MissionLoopUnit: mission='...' not re-aim (no member yields a re-aim transfer); faithful`
#     `factory chain rec=... reaimed=False ... faithfulFallback=False`
#   **DO NOT GREP THOSE TWO FIELDS ADJACENT.** `MapRender/PhaseFactory.cs:118` formats
#   the line as `factory chain rec={0} idx={1} inst={2} phases={3} reaimed={4}
#   window=[{5:F1},{6:F1}] faithfulFallback={7}`, so `window=[...]` sits BETWEEN them
#   and a literal `reaimed=False faithfulFallback=False` matches nothing - which reads
#   like "no factory chain line at all", i.e. the R4 discriminator. Grep `reaimed=`
#   alone, which is what this section's own "one token, one line" rule asks for. (The
#   same mis-quote is inherited from V17M's description and is corrected here rather
#   than propagated.)
#   **THAT DECLINE STRING HAS NEVER BEEN PRINTED BY ANY COMMITTED LANE**, and the
#   mechanism is specific to this inversion. Because JOOL is a strict ANCESTOR of
#   Laythe, the Jool park SATISFIES the heliocentric-leg scan
#   (`Source/Parsek/Reaim/ReaimClassifier.cs:106-119`: `launchAncestors` for Laythe is
#   {Jool, Sun}, so `helioIdx` resolves on the FIRST Jool-bodied segment). So the
#   MissingHeliocentricLeg decline that every prior V lane printed CANNOT fire here;
#   `commonAncestor` resolves to `"Jool"`; and the arrival scan (`:141-152`) then looks
#   for a segment whose body is neither `"Jool"` nor `"Laythe"` and finds none, because
#   this recording visits exactly two bodies. A DIFFERENT decline, reached through a
#   different door, on a subject built to open it.
#
# **R4 - A DEGENERATE PATH SPECIFIC TO TARGET-IS-AN-ANCESTOR.**
#   `TryFindCommonAncestor("Laythe","Jool")` returns `targetToAncestor` EMPTY - the
#   target IS the least common ancestor - a shape no committed subject has produced.
#   DISCRIMINATOR: any `[Parsek][ERROR]` (forbidden below, so it reds), or a decline
#   reason not in the three lists above.
#
# **THE SHARPEST SINGLE DISCRIMINATOR IS `factory chain ... reaimed=True|False`**:
# one token, one line, and it is the RENDER-side truth rather than a planner
# intention. Read it first; read `[ReaimDiag]` for why.
#
# **POSTURE ON THE TRIO, AND IT IS V17M's FOR V17M's REASON.** `[ReaimDiag]`,
# `ENGAGED re-aim` and `FORCED FAITHFUL` are left OUT of BOTH `required` and
# `forbidden`. V14M/V15M/V16M FORBID them because on a same-parent subject re-aim is
# structurally unreachable and its appearance would falsify the routing claim. HERE
# RE-AIM IS ONE OF THE THINGS THAT MIGHT LEGITIMATELY HAPPEN, so forbidding those
# tokens would red the interesting outcome and requiring them would gate the reading
# on a prediction. That asymmetry is deliberate and is the whole reason this lane's
# posture differs from the three same-parent predecessors'.
# **AND IT IS KEPT AT THE ARMING PASS, NOT CASHED IN.** Now that the answer is
# measured, the pre-registered option was to promote a routing token into `required`
# and claim a D11 cell with it. That option is DECLINED and the reason is recorded
# rather than left silent: promoting `factory chain ... reaimed=` (or the
# `[ReaimDiag]` decline reason) into `required` would turn a lane that reads the
# routing into a lane that gates on it, on the same run that first measured it, and
# the arming pass exists to pin what the run left behind - not to widen the gate set.
# No D11 cell is claimed (see `[dimensionsCovered]`); the routing reading lives in
# this section as MEASURED prose and stays ungated.
