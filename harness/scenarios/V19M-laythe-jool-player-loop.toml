# ---------------------------------------------------------------------------------
# 4. THE FORTY-TICK CENSUS-PACING BLOCK, AND WHY IT SITS AT THE COAST EPOCH
# ---------------------------------------------------------------------------------
# The block is V16M's, verbatim, and it is PROVEN machinery rather than a proposal:
# V16M's reading run `2026-08-19_2114` emitted the `seam-endpoint summary` MEASURING
# line at BOTH arrivals, **11.502 wall-seconds apart**, against the 5.0 s
# `ParsekLog.VerboseRateLimited` window that swallowed V15M's cycle-2 emission on all
# three of its runs. Forty `RecordingState` ticks cost `>= 10.0 wall s` at `run.py`'s
# 0.25 s `POLL_INTERVAL_SECONDS` hard floor (2.0x the window) and ~21.6 s at V5's
# MEASURED 0.54 s/tick (4.3x). Sizing at 2x the window AT THE FLOOR is the point: a
# twelve-tick block clears 5.0 s only at the measured rate, which is exactly the margin
# that turns a calibration run into a second calibration run.
#
# **IT SITS AT THE COAST EPOCH RATHER THAN AT THE WATCH EPOCH, AND THAT IS THIS LANE'S
# ONE PLACEMENT DECISION.** The block buys two things and the coast epoch is where both
# are cheapest:
#   (a) WALL-TIME SEPARATION between the two cycles' census emissions - which is
#       placement-independent, so it is not what decides.
#   (b) GAME-TIME DWELL ON A FRAME WHERE THE DESTINATION-FRAME LENS CAN ACTUALLY
#       EMIT. `phase=body-orbit surface=ProtoOrbitLine` is an ON-CHANGE Verbose truth
#       line (MapRenderProbe.cs:652-671): it prints when a proto's body / sma / ecc
#       key CHANGES, and it prints per live proto. At the coast epoch every instance
#       whose replay clock is on the Jool side is sitting on a stable Jool-framed
#       conic, and the twenty instances are re-arming past each other underneath the
#       dwell, so the key changes have somewhere to come from. At the TAIL epoch the
#       ghost of interest is on a 178 s parked stub instead.
# WHAT IT COSTS: ~22 GAME seconds of 1x playback dropped into a **4,799.86 s** recorded
# coast with 1,439.96 s of it still ahead - **65x the dwell**, the most comfortable
# margin any lane carrying this block has had (V16M ran it inside 104.54 s of recorded
# tail). The ghost cannot run off the end of its own span here.
# WHAT IT MIGHT BUY THAT V17M's COULD NOT: this recording has ONE cross-body seam
# against V17M's two, so the census has exactly one candidate endpoint per cycle. That
# makes `evaluated=` a cleaner number to read and a worse number to guess, which is why
# nothing below pins its value.
#
# ---------------------------------------------------------------------------------
# 5. THE SHAPE AND THE LENS - the coverage-criterion (a) obligation, discharged
# ---------------------------------------------------------------------------------
# `docs/dev/autotest-roadmap.md` -> "The loop-render coverage program" ->
# "Confirmation criteria" -> **(a)**: a spec must NAME which lens it pins the
# destination frame on, and why that is the right one FOR ITS SUBJECT'S SHAPE, because
# a nested-SOI subject fail-closes its proto orbit line to the ROOT frame and makes a
# `surface=ProtoOrbitLine ... body=<destination>` pin STRUCTURALLY UNSATISFIABLE
# rather than merely unmet. V17M spent four reading runs learning that.
#
# **THIS SUBJECT IS NOT NESTED-SOI, SO IT KEEPS THE PROTO-ORBIT-LINE LENS.** Visited
# bodies are {Laythe, Jool}. `NestedSoiSubtree.FindNestedRoot`
# (Source/Parsek/MapRender/NestedSoiSubtree.cs:183-220) needs a parent with **>= 2
# VISITED children** that is itself non-root; here Laythe's parent Jool has ONE visited
# child and Jool's parent Sun has ONE, so no candidate clears `count < 2`, the walk
# returns null, and `FailClosedClassifier` leaves the decision SUPPORTED. There is no
# fail-closed root-frame render on this subject and there is no
# `producer=nested-soi provenance=faithful-fallback` declaration line to re-target onto.
#
# SO THE ANTI-VACUITY PIN IS THE PROTO LINE CARRYING THE DESTINATION FRAME:
#
#     phase=body-orbit surface=ProtoOrbitLine .*body=Jool
#
# which is the exact form V16M measured 40 times as `... body=Laythe` on its own
# subject. **IF IT DOES NOT PRINT, THAT IS A FINDING, NOT A RECALIBRATION.** The lens
# was chosen from this subject's own topology before the flight; moving the pin after a
# miss would be re-targeting to green rather than measuring.
#
# **THE SELF-OVERLAP CAVEAT, STATED HONESTLY.** With twenty concurrent instances alive
# and roughly nine or ten of them past their seams at any Jool-side epoch, a
# Jool-framed proto line is EASY to satisfy. What keeps the pin non-vacuous is that the
# recording ALSO has a Laythe phase carrying the other ten instances, and V17M MEASURED
# protos reverting to their CREATION frame after a jump that crosses a self-overlap
# re-arm (all 19 live protos flipped from root-frame Jool to creation-frame Laythe and
# HELD it through a 40-tick dwell; report-only under
# MAPRENDER-ICON-OFF-ORBIT-CREATION-FRAME-AFTER-JUMP). The creation frame here IS
# Laythe, and eight of this lane's ten jumps cross a re-arm. The pin has a real way to
# fail.
#
