# CLAIM-IS-NOT-GATE, and this list is short because the thing a loop lane usually
# claims D11 for is the thing this run MEASURES.
#   D9  `fast-forward`  gated by the PRODUCT's own `FastForwardToEventUT: jumping to
#       UT=` line, which fires whichever of the four roads the unit took.
#   D14 `jool` / `scene-flight` / `sandbox` are the environment axes. **`jool` is gated
#       by the BODY-FRAMED RENDER token** (`phase=body-orbit surface=ProtoOrbitLine
#       .*body=Jool`) rather than by the epoch alone - V14T's iteration-1 lesson: an
#       epoch claim says where the clock was, not what was rendered.
#
# NOT CLAIMED, DELIBERATELY:
#   ANY D11 ROUTING CELL. `phase-lock` is V14M/V15M/V16M's claim, gated by
#       `PhaseLock APPLIED: mission=`; the `re-aim` cells are its mirror. **THIS LANE
#       MUST CLAIM NEITHER**, because THE ROUTING IS WHAT RUN 1 MEASURED and its gate
#       was one of FOUR possible outcomes (header section 2). Claiming a cell whose
#       gate is one branch of a four-way read is a coin flip dressed as coverage.
#       **THE PRE-REGISTERED OPTION - "whichever road run 1 shows, the cell is claimed
#       AT THE ARMING PASS with the token that showed it" - IS KEPT HERE AND WAS NOT
#       TAKEN**, and the reason is recorded rather than left silent: run 1 measured R3,
#       and claiming a cell for it would mean promoting a routing token
#       (`factory chain ... reaimed=`, or the `[ReaimDiag]` decline reason) into
#       `required` - turning a lane that READS the routing into one that GATES on it,
#       on the strength of the same single run that first measured it. The arming pass
#       pins what the run LEFT BEHIND; it does not widen the gate set. The routing
#       reading lives in header section 2 as MEASURED prose and stays ungated. A future
#       lane that wants the cell should require the token deliberately and say so.
#   D14 `laythe` - the recording carries a Laythe phase and ten of the twenty instances
#       replay it, but NOTHING in this contract gates a Laythe-framed render, so the
#       cell would be an epoch claim.
#   D6 `time-jump` - the jumps are the instrument, not the subject.
[dimensionsCovered]
D9  = ["fast-forward"]
D14 = ["jool", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header, or TOML scopes it into the sub-table and
# hlib.validate_spec rejects it.
#
# EMPTY. The loop-seam-teleport instrument is armed with no budget so a raise is
# REPORTED as the finding it would be. TWO known populations this lane may meet and
# does NOT pre-tolerate: the intermittent `line-blink` V15M's control run swept at a
# cycle-2 park epoch, and the creation-frame family (`icon-off-orbit`,
# `seam-endpoint-outside-soi`) V16T measured - more likely here than on a same-parent
# lane, because the creation frame is Laythe and SIX of the ten jumps cross a
# self-overlap re-arm (corrected from "eight" - the four short bracket hops span 120 s
# and 200 s against a 599.59 s launch pitch and contain no launch epoch). This lane
# uses a STEPPED bracket, the silent control in all three earlier programs, so the
# expectation is silence and a raise is a real reading. MEASURED on run
# `2026-08-21_0746`: the sweep came back `hits=[] counts={}` - silence, on a lane that
# pre-tolerated nothing.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir. The harvested fixture ships exactly ONE (measured:
# 28f5cc0158c8461eb995ea1e505aa67e.prec, 201 points), and this lane starts no recording
# of its own, so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +1  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split at the recording's ONE
#       body-change seam. `IsSplittableEnvOrBodyBoundary` rule 3 keeps a same-class Exo
#       body change cohesive on a transfer COAST, and this seam is a coast boundary -
#       the escape burn ended at 28,818,269.937, **5,116.26 s BEFORE** the
#       28,823,386.198 crossing - so cohesion is the prediction. Five prior loop lanes
#       measured `exoCoastBodyChangeKept=1` (V17M at BOTH of its two seams, across four
#       runs). But the load-time walk fires for the FIRST time on THIS lane's LoadGame -
#       B28's own run commits and flushes without re-loading - so this is where a split
#       would show, and B28's own window admitted the same possibility.
#
# **TIGHTENED {1,2} -> {1,1} AT THE ARMING PASS, 2026-08-21.** The admitted split DID
# NOT MATERIALIZE: run `2026-08-21_0746` measured `recordings.count = 1` and the
# optimizer printed `Split summary: rec=28f5cc0158c8461eb995ea1e505aa67e evaluated=1
# grazeForward=0 grazeBackward=0 surfaceGrazeForward=0 surfaceGrazeBackward=0
# seamSkipped=0 exoCoastBodyChangeKept=1 splittableButRejected=0` - cohesion, exactly as
# the rule-3 argument predicted, at the one body-change seam. The wide {1,2} window
# above STAYS ON THE RECORD as the committed reading-era admission (a pre-registration
# is not deleted because the run answered it); it is simply SUBSUMED by this gate and
# by the `exoCoastBodyChangeKept=1` required token, which is the V14M precedent for
# making the cohesion answer regress LOUDLY rather than silently.
count = { min = 1, max = 1 }

[expectations.logContracts]
# EIGHT TOKENS - the reading run's seven, plus the optimizer-cohesion pin armed
# 2026-08-21. The two a reader will notice are missing are missing on purpose
# (header section 8): `PhaseLock APPLIED: mission=` and an `Orbital(...) same-parent`
# classification are BOTH phase-lock-road artifacts, and requiring either would have
# gated the reading run on R1 - the road the code walk ranked LAST and the run refuted.
#   "missionconfig applied:"       - the arm verb ran, and its Info line is where the
#                                    anchor is echoed (`anchorUt=` / `phaseAnchorUt=`).
#                                    THE most important line in the log for this lane.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired, not a test
#                                    back door.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door and
#                                    echoed the resolved relaunchUt. Read it PER CYCLE:
#                                    under R3 the two differ by exactly the span. FLOWN:
#                                    28,829,620.784766804 and 28,841,612.601638552,
#                                    difference 11,991.816871748 = spanDur to the digit.
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line, which makes
#                                    the D9 claim GATED. Road-independent.
#   THE ANTI-VACUITY / DESTINATION-FRAME PIN, and header section 5 argues the LENS
#   CHOICE from this subject's own topology rather than inheriting it:
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Jool"
#       - the ghost's proto orbit line REBOUND ONTO A JOOL-FRAMED CONIC. This subject
#       visits {Laythe, Jool} only, so `NestedSoiSubtree.FindNestedRoot` finds no
#       parent with >= 2 visited children and returns null: the fail-closed ROOT-frame
#       render that made V17M's `body=Vall` pin structurally unsatisfiable CANNOT
#       happen here, and the proto-line lens is the right one. A run that never prints
#       this has measured nothing about a Jool arrival - the V1/V2 vacuity failure.
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - the PRESENCE form.
#       `sampled=[1-9]` is NOT pinned (the standing
#       FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and it
#       stays that way on a first run for TWO reasons rather than one. (a) The value is
#       unmeasured at this subject, which has ONE seam where V16M/V17M had one and two.
#       (b) V16T MEASURED that this lens can raise `outsideSoi=1` from a creation-frame
#       binding artifact rather than from real drift. Pin presence; read the value.
#       MEASURED on run `2026-08-21_0746`, for the record and NOT pinned: two emissions,
#       `evaluated=0 outsideSoi=0 skip.reaimed-seam-instant-unknown=1` and
#       `evaluated=0 outsideSoi=0 skip.body-mismatch=9`.
#   THE OPTIMIZER-COHESION PIN, ARMED 2026-08-21 FROM THE MEASUREMENT (the V14M
#   precedent for turning a measured structural answer into a gate):
#   "Split summary: .*exoCoastBodyChangeKept=1 splittableButRejected=0"
#       - the load-time walk evaluated this recording's ONE body-change seam and KEPT
#       it cohesive, which is what `IsSplittableEnvOrBodyBoundary` rule 3 says a
#       same-class Exo body change on a transfer COAST must do. Run `2026-08-21_0746`
#       printed exactly `Split summary: rec=28f5cc0158c8461eb995ea1e505aa67e
#       evaluated=1 grazeForward=0 grazeBackward=0 surfaceGrazeForward=0
#       surfaceGrazeBackward=0 seamSkipped=0 exoCoastBodyChangeKept=1
#       splittableButRejected=0`. WITHOUT this token a regression that started
#       splitting the seam would show up only as a `recordings.count` window miss, and
#       only because that window was tightened to {1,1} in the same pass - the token
#       names the MECHANISM rather than its side effect. The trailing
#       ` splittableButRejected=0` is load-bearing: it stops `...Kept=1` from matching
#       a future `...Kept=10`.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Jool",
  "Split summary: .*exoCoastBodyChangeKept=1 splittableButRejected=0",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, NOT THE SAME-PARENT FAMILY'S SIX. `[ReaimDiag]`, `ENGAGED re-aim` and
# `FORCED FAITHFUL` are all REMOVED relative to V14M/V15M/V16M - those lanes forbid
# them because on a same-parent subject re-aim is structurally unreachable and its
# appearance would falsify the routing claim. HERE RE-AIM IS ONE OF FOUR ROADS THAT
# MIGHT LEGITIMATELY BE TAKEN, so forbidding those tokens would red the interesting
# outcome. They are in NEITHER list, deliberately (header section 2).
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 MARKER. CORRECTED 2026-08-21: this used to be described as the
  # "self-detection guard" a mis-seeded bracket would otherwise slip past, on the claim
  # that a refused backward jump "is only a WARN". It is not only a WARN -
  # `ParsekTestCommandAddon.TimeJumpKscAction.cs:55-57` logs the Warn AND calls
  # `SetExecResult("REJECTED", null, "backward-jump")`, and every TimeJump step here
  # carries `expect = "OK"`, so the STEP itself goes unmet and the run is
  # driver-INVALID on both attempts. This forbid is a redundant, grep-stable marker of
  # that catch - kept because it is family convention and costs nothing, not because
  # anything leans on it. **THE CASE NOTHING CATCHES** is a jump that lands FORWARD at
  # the WRONG epoch: read `anchorUt=` and both `relaunchUt=` echoes (header section 3).
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a defect in the RENDER rather than a reading
  # about the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# **ARMED 2026-08-21** (the V2/B17/V4/V14M/V15M/V16M/V17M arming discipline) off this
# lane's OWN green reading run `2026-08-21_0746` (PASS attempt 1), whose saveParse
# REPORT measured rewindPoints=0, supersedeRows=0, tombstones=0, rewindRetirements=0 -
# every window below ALREADY MET, so the arming re-pinned nothing and moved no verdict.
# The reading run carried these same three windows REPORT-ONLY; the numbers did not
# change, only their gating did.
# The claim is the family's, on the RETURN-DIRECTION axis: a pure replay-observation
# workflow (arm -> Warp-to -> stepped seam bracket -> a forty-tick coast dwell -> a
# tail read -> Watch, twice over) must author NOTHING durable, across a
# SELF-OVERLAPPING 20-instance loop whose re-arms six of the ten jumps cross.
gating = true
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[expectations.recordings.structure]
# **ARMED 2026-08-21**, same reading run `2026-08-21_0746`, which measured trees=1,
# committedTrees=1, recordings=1, terminalStates {Orbiting: 1}, branchPoints {},
# duplicateRecordingIds [] - and the points facet read 201/201/201 unparsed 0, the exact
# on-disk point count of the harvested fixture, so the 103-step replay authored nothing
# and split nothing.
# THE PRE-FLIGHT REASON THIS BLOCK WAS ABSENT IS KEPT ON THE RECORD RATHER THAN
# DELETED: the fixture's facets were already known and it would have been trivial to
# transcribe them, which is exactly why it was wrong to - they were the PRODUCER's
# numbers, and what this block claims is what THIS lane's LoadGame + load-time
# optimizer walk + 103-step replay leaves behind. That has now been run once, so the
# numbers below are THIS lane's measurement rather than B28's.
# The deferred worry the wide `[expectations.recordings] count` window admitted - a
# load-time optimizer split at the ONE body-change seam - DID NOT MATERIALIZE
# (`exoCoastBodyChangeKept=1 splittableButRejected=0`), so `recordings = {1,1}` here is
# the sharp armed statement and the wide count window stays as the committed
# reading-era admission, subsumed by this gate.
#
# `trees` keeps V2's max = 2 - the documented duplicate-tree writer hazard -
# deliberately WIDER than the single measurement rather than pinned to it.
gating = true
trees          = { min = 1, max = 2 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1 } }

[runtime]
# 300 LoadGame + 2x300 StartLoopPlayback + 10x300 TimeJump + 80 RecordingState ticks
# (~20-44 wall s across the two blocks) + the fast non-deferred verbs + KSP boot +
# collect. Every jump is an INSTANTANEOUS Planetarium clock set, not a warp, so the
# per-step budgets are watchdogs rather than a cost estimate: V16M's 61-step shape
# measured 64 s end to end and V17M carries the same 2,400 for a 103-step shape with
# eight jumps. Two more jumps do not move a budget that already sits far above the
# measured wall. **MEASURED on run `2026-08-21_0746`: 98 s end to end**, i.e. the budget
# sits ~24x above it. Left at 2,400 unchanged - it is a watchdog, and sizing it down to
# the one measurement would trade headroom for nothing.
budgetSeconds = 2400

[retry]
# One retry absorbs a transient seam flake. It does NOT absorb a mis-seeded anchor -
# that reproduces exactly on attempt 2, which is the point - and it does NOT absorb an
# unlucky watch phase, because the separation is a fixed per-cycle geometric fact that
# moves only when the anchor does (V6M's superseded-arithmetic banner). A backward-jump
# on both attempts is the calibration signal, not a failure - and note (header section
# 3) that it reds through the STEP's own REJECTED rather than through the forbid.
# The reading run spent no retry: PASS on attempt 1.
policy = "once"

[expectedFail]
bugId = ""
