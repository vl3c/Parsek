# CLAIM-IS-NOT-GATE, and this list is short because the thing a loop lane usually
# claims D11 for is the thing this run MEASURES.
#   D9  `fast-forward`  gated by the PRODUCT's own `FastForwardToEventUT: jumping to
#       UT=` line, which fires whichever of the four roads the unit took.
#   D14 `jool` / `scene-flight` / `sandbox` are the environment axes. **`jool` is gated
#       by the BODY-FRAMED RENDER token** (`phase=body-orbit surface=ProtoOrbitLine
#       .*body=Jool`) rather than by the epoch alone - V14T's iteration-1 lesson: an
#       epoch claim says where the clock was, not what was rendered.
#
# NOT CLAIMED, DELIBERATELY:
#   ANY D11 ROUTING CELL. `phase-lock` is V14M/V15M/V16M's claim, gated by
#       `PhaseLock APPLIED: mission=`; the `re-aim` cells are its mirror. **THIS LANE
#       MUST CLAIM NEITHER**, because THE ROUTING IS WHAT THIS RUN MEASURES and its
#       gate is one of FOUR possible outcomes (header section 2). Claiming a cell whose
#       gate is one branch of a four-way read is a coin flip dressed as coverage.
#       Whichever road run 1 shows, the cell is claimed AT THE ARMING PASS with the
#       token that showed it.
#   D14 `laythe` - the recording carries a Laythe phase and ten of the twenty instances
#       replay it, but NOTHING in this contract gates a Laythe-framed render, so the
#       cell would be an epoch claim.
#   D6 `time-jump` - the jumps are the instrument, not the subject.
[dimensionsCovered]
D9  = ["fast-forward"]
D14 = ["jool", "scene-flight", "sandbox"]

[expectations]
# PLACEMENT IS LOAD-BEARING: allowedAnomalies must precede every
# [expectations.<sub>] header, or TOML scopes it into the sub-table and
# hlib.validate_spec rejects it.
#
# EMPTY. The loop-seam-teleport instrument is armed with no budget so a raise is
# REPORTED as the finding it would be. TWO known populations this lane may meet and
# does NOT pre-tolerate: the intermittent `line-blink` V15M's control run swept at a
# cycle-2 park epoch, and the creation-frame family (`icon-off-orbit`,
# `seam-endpoint-outside-soi`) V16T measured - more likely here than on a same-parent
# lane, because the creation frame is Laythe and eight of the ten jumps cross a
# self-overlap re-arm. This lane uses a STEPPED bracket, the silent control in all
# three earlier programs, so the expectation is silence and a raise is a real reading.
allowedAnomalies = []

[expectations.recordings]
# THE ARITHMETIC. `run.py count_recordings` counts `.prec` SIDECARS in the produced
# save's `Parsek/Recordings` dir. The harvested fixture ships exactly ONE (measured:
# 28f5cc0158c8461eb995ea1e505aa67e.prec, 201 points), and this lane starts no recording
# of its own, so:
#   +1  the fixture's own committed recording, carried in and untouched.
#   +1  ADMITTED, NOT PREDICTED: a LOAD-TIME optimizer split at the recording's ONE
#       body-change seam. `IsSplittableEnvOrBodyBoundary` rule 3 keeps a same-class Exo
#       body change cohesive on a transfer COAST, and this seam is a coast boundary -
#       the escape burn ended at 28,818,269.937, **5,116.26 s BEFORE** the
#       28,823,386.198 crossing - so cohesion is the prediction. Five prior loop lanes
#       measured `exoCoastBodyChangeKept=1` (V17M at BOTH of its two seams, across four
#       runs). But the load-time walk fires for the FIRST time on THIS lane's LoadGame -
#       B28's own run commits and flushes without re-loading - so this is where a split
#       would show, and B28's own window admitted the same possibility.
# => { min = 1, max = 2 }, matching B28's producer-side window.
count = { min = 1, max = 2 }

[expectations.logContracts]
# SEVEN TOKENS. The two a reader will notice are missing are missing on purpose
# (header section 8): `PhaseLock APPLIED: mission=` and an `Orbital(...) same-parent`
# classification are BOTH phase-lock-road artifacts, and requiring either would gate
# this reading run on R1 - the road the code walk ranks LAST.
#   "missionconfig applied:"       - the arm verb ran, and its Info line is where the
#                                    anchor is echoed (`anchorUt=` / `phaseAnchorUt=`).
#                                    THE most important line in the log for this lane.
#   "SetLoopEnabled: loop ON"      - the PRODUCTION MissionStore path fired, not a test
#                                    back door.
#   "startloopplayback initiated:" - the Warp-to verb entered the production door and
#                                    echoed the resolved relaunchUt. Read it PER CYCLE:
#                                    under R3 the two differ by exactly the span,
#                                    11,990.436871778 s.
#   "FastForwardToEventUT: jumping to UT=" - the PRODUCT's own jump line, which makes
#                                    the D9 claim GATED. Road-independent.
#   THE ANTI-VACUITY / DESTINATION-FRAME PIN, and header section 5 argues the LENS
#   CHOICE from this subject's own topology rather than inheriting it:
#   "phase=body-orbit surface=ProtoOrbitLine .*body=Jool"
#       - the ghost's proto orbit line REBOUND ONTO A JOOL-FRAMED CONIC. This subject
#       visits {Laythe, Jool} only, so `NestedSoiSubtree.FindNestedRoot` finds no
#       parent with >= 2 visited children and returns null: the fail-closed ROOT-frame
#       render that made V17M's `body=Vall` pin structurally unsatisfiable CANNOT
#       happen here, and the proto-line lens is the right one. A run that never prints
#       this has measured nothing about a Jool arrival - the V1/V2 vacuity failure.
#   "faithful-parity summary sampled=\\d+ overTolerance=\\d+" - the PRESENCE form.
#       `sampled=[1-9]` is NOT pinned (the standing
#       FAITHFUL-PARITY-SEED-FRAGMENT-REBASE blind spot).
#   "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+" - the PRESENCE form, and it
#       stays that way on a first run for TWO reasons rather than one. (a) The value is
#       unmeasured at this subject, which has ONE seam where V16M/V17M had one and two.
#       (b) V16T MEASURED that this lens can raise `outsideSoi=1` from a creation-frame
#       binding artifact rather than from real drift. Pin presence; read the value.
required  = [
  "missionconfig applied:",
  "SetLoopEnabled: loop ON",
  "startloopplayback initiated:",
  "FastForwardToEventUT: jumping to UT=",
  "phase=body-orbit surface=ProtoOrbitLine .*body=Jool",
  "faithful-parity summary sampled=\\d+ overTolerance=\\d+",
  "seam-endpoint summary evaluated=\\d+ outsideSoi=\\d+",
]
# THREE, NOT THE SAME-PARENT FAMILY'S SIX. `[ReaimDiag]`, `ENGAGED re-aim` and
# `FORCED FAITHFUL` are all REMOVED relative to V14M/V15M/V16M - those lanes forbid
# them because on a same-parent subject re-aim is structurally unreachable and its
# appearance would falsify the routing claim. HERE RE-AIM IS ONE OF FOUR ROADS THAT
# MIGHT LEGITIMATELY BE TAKEN, so forbidding those tokens would red the interesting
# outcome. They are in NEITHER list, deliberately (header section 2).
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # THE V3C RUN-3 SELF-DETECTION GUARD, and on a lane whose anchor is a SEED it is the
  # most load-bearing forbid in the file: a refused backward jump is only a WARN, so
  # without this token a mis-seeded bracket can green while dwelling nowhere. If run 1
  # reds here, read it as the calibration signal it is and re-pin off the echoed
  # anchor (header section 3), not as a product defect.
  "timejump refused reason=backward-jump",
  # The S1.6/S1.7 parity pin verbatim: any faithful-parity sample OVER tolerance is a
  # rendered-vs-recorded drift, which is a defect in the RENDER rather than a reading
  # about the routing. Road-independent.
  "faithful-parity summary sampled=\\d+ overTolerance=[1-9][0-9]*",
]

[expectations.rewind]
# REPORT-ONLY ON THE READING RUN, and NOT armed even though every window is expected to
# be met. The claim is the family's, on the return-direction axis: a pure
# replay-observation workflow (arm -> Warp-to -> stepped seam bracket -> a forty-tick
# coast dwell -> a tail read -> Watch, twice over) must author NOTHING durable, across
# a SELF-OVERLAPPING 20-instance loop whose re-arms eight of the ten jumps cross.
# ARM IT off run 1's measured facets, not off these predicted zeros - a report-only
# block of PREDICTED numbers reads like a measurement (V17M's stated reason).
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

# NOTE: there is deliberately NO [expectations.recordings.structure] block on the
# reading run. The fixture's facets are known (trees 1, committedTrees 1, recordings 1,
# terminalStates {Orbiting: 1}, branchPoints {}, duplicateRecordingIds [], points
# 201/201/201 unparsed 0) and it would be trivial to transcribe them here - which is
