# 6. THE NEGATIVE CONTROL owed by coverage criterion (b) - DESIGNED, NOT FLOWN
# ---------------------------------------------------------------------------------
# Criterion (b) requires the control to invert a REQUIRED **RENDER** TOKEN, because the
# standing shared inversion (a temporary `rewind.supersedeRows` minimum) proves the
# `saveParse` EVALUATOR can red and proves nothing about whether the render pins can.
#
# THE DESIGN, and it is one character-run inside ONE array:
#
#     [expectations.logContracts].required
#         ... surface=ProtoOrbitLine .*body=Jool
#     becomes
#         ... surface=ProtoOrbitLine .*body=Vall
#
# Leave every COMMENT copy of the token intact and change NOTHING in the flown shape -
# no step, no jump, no budget, no setting. `Vall` is chosen because this recording
# never visits it (the eight ORBIT_SEGMENTs are Laythe and Jool only) and this lane
# never enters its SOI, so the inverted token reds precisely because the render never
# puts this ghost in a Vall body frame - which proves the pin measures the RENDERED
# BODY FRAME rather than proving the evaluator works. PRECEDENT: V10's control
# `2026-08-14_2002` inverted two required map-render tokens and red `PARSEK-FAIL`
# subkind `expectation` naming exactly those two with every other verifier PASS; V12
# and V12A did the same with one digit of one measured token.
#
# ---------------------------------------------------------------------------------
# 7. THE WATCH PREDICTION - **REJECTED**, and the arithmetic is derived here rather
#    than carried over from V17M, because the geometry is the opposite one
# ---------------------------------------------------------------------------------
# The observer is the fixture's OWN parked craft - the player who watches a replay is
# standing where the flight ended - and on THIS subject the ghost and the observer are
# BOTH in the same Jool orbit at different PHASES. V17M's chord argument (two objects on
# ONE circular orbit are at most `2a` apart, so a big orbit refuses on range) is the
# wrong shape for that, and it is re-derived instead of quoted.
#
# THE OBSERVER, off B28's measured final park: ap 19,728,666.573 / pe 19,728,628.891
# ALTITUDE about Jool = ecc ~7.3e-7, so with Jool's 6,000,000 m radius
#   a_obs = **25,728,647.732 m**,  2a = **51,457,295 m**
#   P_obs = 2*pi*sqrt(a^3/mu_Jool) = **48,783.7 s**   (mu_Jool = 2.82528004e14)
#   v_obs = sqrt(mu/a) = 3,313.8 m/s
# The park sits ENTIRELY INSIDE Laythe's 27,184,000 m orbit, which is what B28's spec
# predicted, and its radius is the approach orbit's PERIAPSIS radius **to within 1.3 m**
# (a(1-e) = 26,056,049.851 * 0.98743476 = 25,728,649 m) - the capture burn
# circularized AT periapsis, so the two conics are tangent there and the whole recorded
# Jool arc sits within 76 km of the observer's shell. **RADIUS THEREFORE EXCLUDES
# NOTHING ON THE JOOL SIDE; ONLY THE PHASE DOES**, which is why the comb below is
# evaluated instance by instance rather than bounded by a `2a` argument.
#
# THE BOUNDARY. `GhostVisualRangeMeters = 120,000 m` (ParsekConfig.cs:41) is the
# render-zone term that drives the measured refusals; `WatchEnterCutoffMeters =
# 300,000 f` (WatchModeController.cs:71) is the range term. `2a` is **428.8x** the
# first and **171.5x** the second, so a chord under 120 km needs ANGULAR agreement of
#   2*asin(60,000 / 25,728,648) = **0.2672 deg** = 0.0742% of a revolution
#   = **36.2 s** of the observer's period.
# That is the whole question: not "is the orbit big" (it is, hugely) but "does any live
# instance sit within 36 s of the observer's phase".
#
# THE TWENTY INSTANCES ARE A COMB, AND THE COMB CAN BE EVALUATED. Instance k replays
# recorded time `tr_k = t - (R_k - spanStart)`, so at a fixed epoch the instances tile
# the recorded timeline at the 599.5218 s overlap pitch. AT THE CYCLE-1 WATCH EPOCH
# (t = 28,841,520) the replay offsets are `12,499.0 - 599.5218*k`:
#   k = 1..10  -> offsets 11,899.5 down to 6,503.8  = the JOOL legs (k=1 in the
#                 post-capture park tail, k=2..10 on the approach ellipse)
#   k = 11..20 -> offsets 5,904.3 down to 508.6     = the LAYTHE legs (k=11..18 on the
#                 post-escape ellipse, k=19..20 in the Laythe park)
#
# **THE JOOL FAMILY IS SETTLED AND IT IS DECISIVE.** Both conics share a plane and a
# periapsis direction (the capture burn was a 12.1 s retrograde at periapsis), so one
# in-plane angle suffices. Propagating the observer from the save state (186.7 s past
# the capture periapsis 28,828,832.78) and each ghost from its own replay clock:
#   observer true anomaly at cycle 1  = **93.626 deg**
