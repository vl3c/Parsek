schema = 1
id = "LT-2-long-tail-spacecenter"
tier = "nightly"
# THE LONG TAIL'S SPACECENTER SLICE, ONE BOOT. Six categories whose executable cells
# are SPACECENTER-scoped or need an EMPTY store, as one multi-category batch (the
# LT-1 contract, at the other scene the seam can boot to). `fresh-sandbox` has no
# vessel, so TestCommandLoadGame.DecideLoadRoute takes the NoVesselSpaceCenter
# route - the same door H48 / H45 use - and every pinned line reads
# scene=SPACECENTER.
#
# WHY AN EMPTY STORE. Optimizer's two cells run RunOptimizationPass over the live
# store and skip when any committed recording is present ("308 live committed
# recording(s) present ... snapshot/restore cannot undo the mutation"): the first
# SPACECENTER census (`2026-09-07_0847`, corpus injected) measured both SKIPPED, and
# the second (`2026-09-07_0854`, `injectedRecordings = "none"`) measured both
# PASSED. So this lane injects nothing, and the store-READING categories that would
# be vacuous over an empty store (RecordingStore, TerminalOrbit, RewindSaves,
# Structure) are pinned by LT-1 over the corpus instead, not here.
#
# NOT constituents, all measured on the empty-store census: `CrewReservationLive`
# (no spawned vessels), `GhostMapOrbits` (no ghost map vessels), `ResourceTopBar`
# (career-only; the currency bar is hidden in sandbox), and the scene-agnostic
# categories LT-1 already pins. Skips inside the pinned lines: TestRunnerIsolation 1
# (the SPACECENTER in-memory-restore gate cell, self-skipped pending its own green
# run) and SwitchIntentPatch 2 (its FLIGHT and TS cells scene-skip here; the KSC
# marker patch cell is the one this scene buys). `WarpToTime`'s cell measures the
# far-future ForwardOnly resolution and the defined UT-0 plan kind here; its
# rewind-reachability half needs a rewind target and a moved clock, which this
# empty-store host does not provide, so that half is exercised by no committed lane.
#
# THE SEVENTH CONSTITUENT, `SceneAndPatch`, APPENDED 2026-09-10 IN READING SHAPE (the
# claim-gap wave, package A1-4). The six constituents above stay pinned WHOLE off run
# `2026-09-07_1516`; the new line and the aggregate were interim until the reading below.
#   WHY IT IS HERE: `ParsekKscRelativePlaybackUsesRecordedAnchor`
#   (ExtendedRuntimeTests.cs, SPACECENTER) commits a tree whose probe carries a
#   `ReferenceFrame.Relative` section with `anchorRecordingId`, plays it through the
#   PRODUCTION KSC positioner (`ParsekKSC.InterpolateAndPositionKsc` -> the Relative
#   branch -> the recorded-anchor pose resolver) and asserts the ghost lands within
#   0.25 m of the anchor-local offset. It is the only production KSC Relative-playback
#   assertion in the suite, and no lane executes it: H53 batches the category at
#   FLIGHT, where both SPACECENTER cells scene-skip.
#   WHAT THE ATTRIBUTES ADMIT HERE: 7 declared, 3 eligible at SPACECENTER (the two
#   SPACECENTER cells plus the scene-agnostic `PreTransitionForVesselSwitch_LiveTreeShape_
#   Bug266`), 4 scene-skipped (three FLIGHT, one TRACKSTATION). All three eligible cells
#   meet this scene for the first time.
#   WHY LAST: the KSC cell inserts a committed tree (removed in its finally), and
#   `Optimizer` skips whenever a committed recording is present. Last means it cannot
#   disturb any measured constituent.
#   THE PIN, NOW MEASURED (see THE READING below). The reading shape was `total=7`
#   literal with the split regexed, and the aggregate likewise, registered in
#   `MultiCategoryBatchWiringGroupTests.INTERIM_PIN_IDS` + `INTERIM_CONSTITUENTS` (this
#   constituent only). The reading converted both lines to whole pins and the id left
#   both tables.
#   `verboseLogging=true` is now LOAD-BEARING for two required tokens: the KSC probe's
#   post-assert line and the positioner's `RELATIVE KSC playback resolved` line are both
#   Verbose. The setting defaults true (run `_1508`'s log carries VERBOSE lines with no
#   such step); the step pins it against a persisted false.
#   ORDER SIDE EFFECT: both `Optimizer` cells set `RecordingStore.SuppressLogging = true`
#   and never restore it, so every `RecordingStore.Log` line after them is silent for the
#   rest of the process, including the KSC cell's own tree insert / remove lines. The
#   probe line is a direct `ParsekLog.Verbose` call and is unaffected. Filed in
#   docs/dev/todo-and-known-bugs.md as OPTIMIZER-INGAME-CELLS-LEAK-RECORDINGSTORE-
#   SUPPRESSLOGGING.
#   PRE-REGISTERED OUTCOMES OF THE READING (classified before the flight):
#     (A) `total=7 passed=3 failed=0 skipped=4` and one
#         `KSC relative runtime probe resolved anchorRec=runtime-ksc-recorded-anchor
#         error=0.NNNm` line. Then: pin whole, require the probe line, fly armed + a
#         negative control, and only then claim D3 `relative-anchored-nonloop`.
#     (B) The KSC cell SKIPS on its own guard ("No ParsekKSC instance" / "Kerbin body
#         unavailable"): `passed=2 skipped=5` and no probe line. No D3 claim; whether
#         the constituent stays (it still executes 2) is a supervisor decision.
#     (C) Any SceneAndPatch cell FAILS: PARSEK-FAIL, a finding filed in the todo, never
#         re-flown away, no claim.
#     (D) `recordings.count` reads nonzero: the KSC cell's cleanup leaked its tree into
#         the produced save. A finding.
#     (E) Any of the six whole lines moves: an ordering regression. A finding.
#   THE READING, FLOWN 2026-09-10 (`2026-09-10_1734_LT-2-long-tail-spacecenter`, wave
#   DLL a0abbed1, PASS attempt 1, 51 s wall, mismatches=0, recordings=0, zero ERROR
#   lines, zero WARN lines in the SceneAndPatch window): OUTCOME (A).
#   `BATCH_COMPLETE v1 total=7 passed=3 failed=0 skipped=4 category=SceneAndPatch
#   scene=SPACECENTER`. All three eligible cells PASSED (`ParsekKscExistsInSpaceCenter`,
#   `ParsekKscRelativePlaybackUsesRecordedAnchor`, `PreTransitionForVesselSwitch_
#   LiveTreeShape_Bug266`). The four skips are the runner's pre-run scene filter
#   (`Scene eligibility skip summary: skipped=4 currentScene=SPACECENTER
#   byRequiredScene=FLIGHT:3,TRACKSTATION:1`), which prints no per-cell line. Aggregate
#   `total=17 passed=10 failed=0 skipped=7 category=multi:7`. The six whole lines
#   re-read token for token. Both new lines are now pinned WHOLE.
#   The same reading measured the wave DLL's `BgOnRailsNoEnvSectionsWitness` line (the
#   `Recording` constituent, package A1-2) and the Optimizer's production
#   `TrimBoringTail` line. Both are required below, with the KSC probe pair.
#   THE ARMED RE-FLIGHT AND THE THREE CONTROLS, 2026-09-10, all on the wave DLL a0abbed1
#   against the committed spec (5f201f2c5), one inverted token per control flight:
#     armed    `2026-09-10_1957_LT-2-long-tail-spacecenter` PASS attempt 1, 48 s,
#              mismatches=0 over 13 required + 1 forbidden, recordings=0, zero ERROR
#              lines; every cell token matched exactly once.
#     control  `2026-09-10_2000` `5 points` -> `6 points` (D4 tail-trim)
#     control  `2026-09-10_2002` `perFrameEnvSections=0` -> `=1` (D5 bg-on-rails)
#     control  `2026-09-10_2005` `error=0\.[0-9]{3}m` -> `error=[1-9][0-9]*\.[0-9]{3}m`
#              (D3 relative-anchored-nonloop; the positioner line stayed matched)
#   Each control read PARSEK-FAIL(expectation) with exactly one mismatch, on its own
#   inverted entry, with every other verifier row PASS / REPORT / SKIPPED. The drift
#   gate held in each control's own KSP.log: the original pattern matched 1 line, the
#   inverted 0. Each was reverted with `git checkout`. The three claims in
#   [dimensionsCovered] rest on this record.
description = "Run the seven SPACECENTER-scoped long-tail in-game categories as one multi-category batch over an empty store: all seven constituents and the aggregate pinned whole (SceneAndPatch appended 2026-09-10 and measured by its reading run), plus four cell tokens that gate D3 relative-anchored-nonloop, D4 tail-trim and D5 bg-on-rails (armed re-flight and one negative control per token, 2026-09-10)."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "multi-category", "long-tail", "LT-2"]

[fixture]
saveTemplate = "fixtures/saves/fresh-sandbox"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "Optimizer,Recording,ResourceReconciliation,WarpToTime,TestRunnerIsolation,SwitchIntentPatch,SceneAndPatch" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# The environment axes, plus three cells claimed 2026-09-10 (claim-gap wave A1) after the
# armed re-flight and one negative control per token (see the header). A tally pin claims
# no behaviour cell (see LT-1), so each claim below rests on a CELL token instead:
#  - D3 `relative-anchored-nonloop`: the KSC probe's post-assert line is the claim
#    token, and it is the one with its own negative control (`_2005`).
#    ParsekKscRelativePlaybackUsesRecordedAnchor plays a Relative section carrying
#    `anchorRecordingId` through the production KSC positioner. The probe line prints
#    only after the < 0.25 m assert held. The positioner's own `RELATIVE KSC playback
#    resolved` line is also required, but only as corroboration: no control inverted
#    it (`_2005` left it matched), so the claim does not rest on it.
#  - D4 `tail-trim`: the production `TrimBoringTail: trimmed ...` line from
#    RunOptimizationPass's tail trim. The grazing cell does not assert the trim, so the
#    claim rests on the production line itself, which is fixture-literal and
#    deterministic.
#  - D5 `bg-on-rails`: the post-assert `BgOnRailsNoEnvSectionsWitness` line, WITH the
#    three bypasses the logContracts comment names. Only the CheckpointAllVessels close
#    path is production.
D3  = ["relative-anchored-nonloop"]
D4  = ["tail-trim"]
D5  = ["bg-on-rails"]
D14 = ["sandbox", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY, PER CONSTITUENT: every per-category line and the aggregate pinned
# WHOLE. The six original lines are the empty-store census off run `2026-09-07_1516`;
# the SceneAndPatch line and the multi:7 aggregate are measured off the reading run
# `2026-09-10_1734` (see the header).
#
# THE CELL TOKENS, added 2026-09-10 off the same reading (claim-gap wave A1). The
# registry claims they support were taken after this lane's armed re-flight
# (`2026-09-10_1957`) and one negative control per token (`_2000`, `_2002`, `_2005`);
# see the header.
#  - `TrimBoringTail: trimmed ...` (INFO, the Optimizer's tail trim inside the
#    production RunOptimizationPass that EccentricGrazing_StaysOneSegment_InGame
#    drives). The basis for D4 `tail-trim`. Every value in it is a fixture literal (the
#    rec id, endUT 21580.0, the 5 trimmed points), byte-equal to run `_1508`'s line, so
#    the pattern is literal. UNSCOPED ON PURPOSE: the first Optimizer cell runs before
#    the runner logs `runtests start` (13 lines earlier in the reading), so this token
#    must never be bracketed by the start token.
#  - `BgOnRailsNoEnvSectionsWitness: ...` (INFO, the wave's one C# line, printed only
#    after every assertion of BgGrazingPeriapsisInvariantTest held). The basis for D5
#    `bg-on-rails`. Its numbers (50 orbits, pid 8888001, 0 per-frame env sections, 50
#    checkpoint sections, 50 orbit segments) are the cell's fixture constants.
#    WHAT THE CELL BYPASSES, so nobody overreads it: it seeds the on-rails state with
#    InjectOnRailsStateForTesting (OnVesselGoOnRails does not run), injects each open
#    OrbitSegment with InjectOpenOrbitSegmentForTesting (segment opening does not
#    run), and passes a null vessel finder (OnBackgroundPhysicsFrame's packed
#    early-return is not reached; xUnit EccentricOrbitOptimizerInvariantTests covers
#    it). What IS production is the CheckpointAllVessels close path and the section
#    emission it drives.
#  - `KSC relative runtime probe resolved ... error=N.NNNm` (Verbose, printed after the
#    asserts of ParsekKscRelativePlaybackUsesRecordedAnchor) plus the positioner's own
#    `RELATIVE KSC playback resolved: ... anchorRec=runtime-ksc-recorded-anchor` line
#    (Verbose, ParsekKSC.Playback, emitted only on a successful Relative pose). The
#    probe line is the D3 `relative-anchored-nonloop` claim token (control `_2005`);
#    the positioner line is uncontrolled corroboration. The reading measured
#    `error=0.000m`; the error is a float residual whose size depends on the scene's
#    floating origin, so it is regexed to under 1 m (the cell itself asserts under
#    0.25 m). The positioner line's dx / dy / dz and |offset| are the cell's fixture
#    offset and are literal.
required  = [
  "runtests start category=Optimizer,Recording,ResourceReconciliation,WarpToTime,TestRunnerIsolation,SwitchIntentPatch,SceneAndPatch isolated=false strict=false multi=7",
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=Optimizer scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=Recording scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=ResourceReconciliation scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=WarpToTime scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=2 passed=1 failed=0 skipped=1 category=TestRunnerIsolation scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=3 passed=1 failed=0 skipped=2 category=SwitchIntentPatch scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=7 passed=3 failed=0 skipped=4 category=SceneAndPatch scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=17 passed=10 failed=0 skipped=7 category=multi:7 scene=SPACECENTER",
  "TrimBoringTail: trimmed 'Persistence Smoke Grazing Probe' \\(rec_persistence_smoke_grazing\\) from endUT=21580\\.0 to 20080\\.0 \\(removed 1500\\.0s, 5 points; trimUT=20090\\.0 lastInterestingUT=20080\\.0\\)",
  "BgOnRailsNoEnvSectionsWitness: on-rails BG vessel emitted no env-classified TrackSections across 50 orbits pid=8888001 perFrameEnvSections=0 checkpointSections=50 orbitSegments=50",
  "KSC relative runtime probe resolved anchorRec=runtime-ksc-recorded-anchor error=0\\.[0-9]{3}m",
  "RELATIVE KSC playback resolved: recording=rec\\[runtime-\\|Runtime KSC Relative Probe\\|tree\\|-\\] contract=anchor-local version=1 dx=15\\.00 dy=25\\.00 dz=35\\.00 anchorRec=runtime-ksc-recorded-anchor \\|offset\\|=45\\.55m",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 1400

[retry]
policy = "once"

[expectedFail]
bugId = ""
