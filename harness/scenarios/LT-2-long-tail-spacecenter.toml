schema = 1
id = "LT-2-long-tail-spacecenter"
tier = "nightly"
# THE LONG TAIL'S SPACECENTER SLICE, ONE BOOT. Six categories whose executable cells
# are SPACECENTER-scoped or need an EMPTY store, as one multi-category batch (the
# LT-1 contract, at the other scene the seam can boot to). `fresh-sandbox` has no
# vessel, so TestCommandLoadGame.DecideLoadRoute takes the NoVesselSpaceCenter
# route - the same door H48 / H45 use - and every pinned line reads
# scene=SPACECENTER.
#
# WHY AN EMPTY STORE. Optimizer's two cells run RunOptimizationPass over the live
# store and skip when any committed recording is present ("308 live committed
# recording(s) present ... snapshot/restore cannot undo the mutation"): the first
# SPACECENTER census (`2026-09-07_0847`, corpus injected) measured both SKIPPED, and
# the second (`2026-09-07_0854`, `injectedRecordings = "none"`) measured both
# PASSED. So this lane injects nothing, and the store-READING categories that would
# be vacuous over an empty store (RecordingStore, TerminalOrbit, RewindSaves,
# Structure) are pinned by LT-1 over the corpus instead, not here.
#
# NOT constituents, all measured on the empty-store census: `CrewReservationLive`
# (no spawned vessels), `GhostMapOrbits` (no ghost map vessels), `ResourceTopBar`
# (career-only; the currency bar is hidden in sandbox), and the scene-agnostic
# categories LT-1 already pins. Skips inside the pinned lines: TestRunnerIsolation 1
# (the SPACECENTER in-memory-restore gate cell, self-skipped pending its own green
# run) and SwitchIntentPatch 2 (its FLIGHT and TS cells scene-skip here; the KSC
# marker patch cell is the one this scene buys). `WarpToTime`'s cell measures the
# far-future ForwardOnly resolution and the defined UT-0 plan kind here; its
# rewind-reachability half needs a rewind target and a moved clock, which this
# empty-store host does not provide, so that half is exercised by no committed lane.
#
# THE SEVENTH CONSTITUENT, `SceneAndPatch`, APPENDED 2026-09-10 IN READING SHAPE (the
# claim-gap wave, package A1-4). The six constituents above stay pinned WHOLE off run
# `2026-09-07_1516`; only the new line and the aggregate are interim.
#   WHY IT IS HERE: `ParsekKscRelativePlaybackUsesRecordedAnchor`
#   (ExtendedRuntimeTests.cs, SPACECENTER) commits a tree whose probe carries a
#   `ReferenceFrame.Relative` section with `anchorRecordingId`, plays it through the
#   PRODUCTION KSC positioner (`ParsekKSC.InterpolateAndPositionKsc` -> the Relative
#   branch -> the recorded-anchor pose resolver) and asserts the ghost lands within
#   0.25 m of the anchor-local offset. It is the only production KSC Relative-playback
#   assertion in the suite, and no lane executes it: H53 batches the category at
#   FLIGHT, where both SPACECENTER cells scene-skip.
#   WHAT THE ATTRIBUTES ADMIT HERE: 7 declared, 3 eligible at SPACECENTER (the two
#   SPACECENTER cells plus the scene-agnostic `PreTransitionForVesselSwitch_LiveTreeShape_
#   Bug266`), 4 scene-skipped (three FLIGHT, one TRACKSTATION). All three eligible cells
#   meet this scene for the first time.
#   WHY LAST: the KSC cell inserts a committed tree (removed in its finally), and
#   `Optimizer` skips whenever a committed recording is present. Last means it cannot
#   disturb any measured constituent.
#   THE PIN: `total=7` literal, `passed` / `skipped` regexed, and the aggregate
#   `total=17 ... category=multi:7` with its split regexed. Registered in
#   `MultiCategoryBatchWiringGroupTests.INTERIM_PIN_IDS` + `INTERIM_CONSTITUENTS` (this
#   constituent only) until the reading, then converted to measured.
#   `verboseLogging=true` is DEFENSIVE, not load-bearing: the setting defaults true and
#   run `_1508`'s log already carries VERBOSE lines with no such step. The KSC probe's
#   post-assert line is Verbose.
#   ORDER SIDE EFFECT: both `Optimizer` cells set `RecordingStore.SuppressLogging = true`
#   and never restore it, so every `RecordingStore.Log` line after them is silent for the
#   rest of the process, including the KSC cell's own tree insert / remove lines. The
#   probe line is a direct `ParsekLog.Verbose` call and is unaffected. Filed in
#   docs/dev/todo-and-known-bugs.md as OPTIMIZER-INGAME-CELLS-LEAK-RECORDINGSTORE-
#   SUPPRESSLOGGING.
#   PRE-REGISTERED OUTCOMES OF THE READING (classified before the flight):
#     (A) `total=7 passed=3 failed=0 skipped=4` and one
#         `KSC relative runtime probe resolved anchorRec=runtime-ksc-recorded-anchor
#         error=0.NNNm` line. Then: pin whole, require the probe line, fly armed + a
#         negative control, and only then claim D3 `relative-anchored-nonloop`.
#     (B) The KSC cell SKIPS on its own guard ("No ParsekKSC instance" / "Kerbin body
#         unavailable"): `passed=2 skipped=5` and no probe line. No D3 claim; whether
#         the constituent stays (it still executes 2) is a supervisor decision.
#     (C) Any SceneAndPatch cell FAILS: PARSEK-FAIL, a finding filed in the todo, never
#         re-flown away, no claim.
#     (D) `recordings.count` reads nonzero: the KSC cell's cleanup leaked its tree into
#         the produced save. A finding.
#     (E) Any of the six whole lines moves: an ordering regression. A finding.
#   The same reading also measures the wave DLL's `BgOnRailsNoEnvSectionsWitness` line
#   (the `Recording` constituent, package A1-2). Nothing is pinned or claimed off it here.
description = "Run the seven SPACECENTER-scoped long-tail in-game categories as one multi-category batch over an empty store: six constituents pinned whole, the seventh (SceneAndPatch, appended 2026-09-10) in reading shape until its first flight."
instanceProfile = "stock-minimal"
tags = ["ingame-batch", "multi-category", "long-tail", "LT-2"]

[fixture]
saveTemplate = "fixtures/saves/fresh-sandbox"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" }, expect = "OK" },
  { cmd = "RunTests",   args = { category = "Optimizer,Recording,ResourceReconciliation,WarpToTime,TestRunnerIsolation,SwitchIntentPatch,SceneAndPatch" }, expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                     expect = "OK" },
]

[dimensionsCovered]
# Environment axes only; see LT-1 for why a tally pin claims no behaviour cell.
D14 = ["sandbox", "scene-ksc"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 0, max = 0 }

[expectations.logContracts]
# ANTI-VACUITY, PER CONSTITUENT: the measured empty-store census lines, whole, for the
# six measured constituents. The SceneAndPatch line and the aggregate are INTERIM (see
# the header): `total=` literal, the split regexed, `passed=[1-9][0-9]*` so a vacuous
# slice still reds, `failed=0` the assertion.
required  = [
  "runtests start category=Optimizer,Recording,ResourceReconciliation,WarpToTime,TestRunnerIsolation,SwitchIntentPatch,SceneAndPatch isolated=false strict=false multi=7",
  "BATCH_COMPLETE v1 total=2 passed=2 failed=0 skipped=0 category=Optimizer scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=Recording scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=ResourceReconciliation scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=WarpToTime scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=2 passed=1 failed=0 skipped=1 category=TestRunnerIsolation scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=3 passed=1 failed=0 skipped=2 category=SwitchIntentPatch scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=7 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=SceneAndPatch scene=SPACECENTER",
  "BATCH_COMPLETE v1 total=17 passed=[1-9][0-9]* failed=0 skipped=[0-9]+ category=multi:7 scene=SPACECENTER",
]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 1400

[retry]
policy = "once"

[expectedFail]
bugId = ""
