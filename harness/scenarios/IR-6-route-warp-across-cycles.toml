schema = 1
id = "IR-6-route-warp-across-cycles"
tier = "nightly"
# =====================================================================================
# IR-6 (roadmap "The logistics integration program", Phase B; test-gap audit 2026-10-31
# item 5): a supply route under REAL time warp across several cycles, ticking in FLIGHT
# and at the Space Center, with the destination tank read at every step. AUTHORED
# 2026-10-31; first flight INVALID (spec faults, below), re-authored, NOT YET GREEN.
#
# THE STORY. The player creates and activates the rover route, warps in flight past one
# delivery, goes to the Space Center and warps past one more, reloads the save there, and
# warps hours ahead at full speed. Every lane before this one moved the clock with
# TimeJump (an instant shift) or a 1x WarpToUT; none drove the stock rails ladder across
# several cycles, and none watched the route tick outside FLIGHT.
#
# THE RULE UNDER TEST is logistics design 10.7 AS BUILT: the route ticks once per second
# of game time (RouteTickClock, RouteOrchestrator.TickIntervalSec = 1) and each tick fires
# at most once, for the newest owed dock cycle. So:
#   * a warp whose frames advance less than one loop period delivers EVERY cycle it
#     crosses, one by one (phases A and B: no `warp jump=` line);
#   * a warp whose frames advance more than a period collapses the cycles a frame spans
#     into one fire (phase C: a `warp jump=` line, every fire there BLOCKED);
#   * cargo is conserved: the tank ends at its start fill plus one manifest per delivery,
#     and a full destination blocks the cycle whole (the all-or-nothing capacity gate).
# The xUnit half of the same rule is RouteTimelineFuzzerTests (seeded warp + Re-Fly
# sequences against an independent model of the loop clock).
#
# THE HOST is IR-1's (`rover-route-recorded`, save clock UT 979.48): tree 73e50f1e... is
# the transport rover's sealed committed tree, the route's one stop is `rover fuel 0`
# (pid 2123618197, PRELAUNCH on the runway, two ConformalStorageUnit containers of three
# slots). MEASURED manifest per cycle (flight 2026-10-31_1847_a2): 97.6 LiquidFuel plus
# THREE inventory items (evaChute, evaScienceKit, DeployedCentralStation), one container
# per delivery (`inventoryUnits=3/3`).
#
# THE LIVE STATE sets the endpoint so exactly TWO deliveries fit, on both limits at once:
#   * LiquidFuel 200 / 400: headroom 200 = two 97.6 deliveries, then 4.8 left;
#   * inventory cleared: six free slots = two cycles of three items.
# The third cycle blocks DestinationFull; which short token the capacity probe names
# first when both are short is not pinned (`reason=\S+`).
#
# THE CLOCK (MEASURED, 2026-10-31_1847_a2). Activation at A = 981.2 is re-anchored by the
# mission PhaseLock: `PhaseLock APPLIED ... anchor 981.2->983.5 P=5 cadence 45.04->50`.
# The dock crossings are therefore anchor + 45.04 + 50 k: measured cycle-0 at 1029.38,
# cycle-1 at 1079.44, cycle-2 at 1128.74. The targets sit about 20 s clear of each:
#   Phase A  FLIGHT       WarpToUT 1048  maxRate 10      -> cycle-0 (one delivery, loaded)
#   Phase B  Space Center WarpToUT 1100  maxRate 10      -> cycle-1 (one delivery, unloaded)
#   Phase C  Space Center WarpToUT 20000 maxRate 100000  -> ~377 periods from cycle-2 on,
#            every fire BLOCKED; frames of 200+ s collapse several periods into one fire.
# Tank: 200.0 -> 297.6 (A) -> 395.2 (B) -> 395.2 (C).
#
# SCENE ROUTES. ExitToSpaceCenter (the stock exit). Before phase C the lane saves and
# reloads persistent at the Space Center: an InSessionOther load at the same instant
# (LoadReconcilePolicy Routes x InSessionOther: "a forward or same-instant scene change
# finds none and touches nothing"), so the route state in memory carries over.
#
# WHY NOT THE TRACKING STATION (flight 1, 2026-10-31_1845 / _1847_a2, both INVALID):
#   - phase C was flown in the Tracking Station and refused `warptout refused
#     reason=warp-locked ut=20000 holders=intro_TS`: this fixture holds
#     `ScenarioNewGameIntro tsComplete = False`, so stock's first-visit TS tutorial lock
#     holds every rate above 1x. Only the TrackingStationRecover verb presses that intro;
#     a TS rails warp needs a seam intro press or a re-built fixture. The Space Center
#     (`kscComplete = True`) runs the same route tick on the same unloaded path.
#   - the old arithmetic assumed two items and cadence 45.04 (three deliveries); the
#     third blocked `reason=stored-part:evaChute` at 1128.74. Measured and fixed above.
#   - phase B asked maxRate 50 but the ladder capped at 10x for a 91 s delta; asked 10 now.
#   What flew green inside it: two deliveries, each on its own tick, 0 `warp jump=`
#   lines, the unloaded write's tankAfter equal to the proto read, the route carried
#   unchanged across the same-instant reload.
#
# PRE-REGISTERED READINGS (check these first if the next flight reds):
#   - a delivery missing in A or B: the PhaseLock anchor moved (read `PhaseLock APPLIED`
#     and the `DOCK CROSSING confirmed ... at ut=` lines, then move the targets).
#   - `warp jump=` inside phase A or B: the warp ladder ran faster than maxRate, or the
#     route ticked less often than once per second of game time (a product finding).
#   - a delivery in phase C: the capacity gate let a cycle overflow (product defect).
#   - `readvesselresources ... match=false` at the Space Center: the unloaded delivery
#     write and the proto read disagree (product defect).
#   - no `warp jump=` in phase C: the ladder never reached a rate whose frame spans a
#     period before the target; raise the target (driver reading).
# =====================================================================================
description = "IR-6: on rover-route-recorded with the endpoint set so two deliveries fit (LiquidFuel 200 / 400, inventory cleared: six slots, three items per cycle), create and activate the rover route and drive REAL warp across several cycles: FLIGHT at 10x past one crossing (one delivery, tank 297.6), the Space Center at 10x past one more (one delivery on the unloaded path, tank 395.2), then a same-instant reload at the Space Center and 100000x across hundreds of periods (every fire BLOCKED DestinationFull, frames collapse several periods into one fire, `warp jump=`). The route read-back must show completed=2 dispatched=2 delivered=2 and blocked cycles counted, and the tank must read 395.2 exactly: cargo conserved, no cycle lost under moderate warp, no cycle doubled, the collapse rule of logistics design 10.7."
instanceProfile = "stock-minimal"
tags = ["IR-6", "logistics", "route", "warp", "timeline-ops", "recorded-fixture"]

[fixture]
saveTemplate       = "fixtures/saves/rover-route-recorded"
injectedRecordings = "none"
craft              = []

[[fixture.liveState]]
pid       = 2123618197
resources = { LiquidFuel = 200 }
inventory = "clear"

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",     args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  # The kill triple, as on every rover-route-recorded lane (RVR-3's header).
  { cmd = "StopRecording",                                                      expect = "OK" },
  { cmd = "DiscardTree",                                                        expect = "OK" },
  { cmd = "SetSetting",   args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",   args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SealSlot",     args = { tree = "73e50f1e3aa24c299919016cd9e92269" },   expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "create", tree = "73e50f1e3aa24c299919016cd9e92269", name = "IR6 Rover Supply" }, expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "activate", route = "IR6 Rover Supply" }, expect = "OK", budget = 120 },
  { cmd = "MissionMark",  args = { label = "ir6-activated" },                   expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2123618197", resources = "LiquidFuel", expect = "LiquidFuel:200", tolerance = "0.01" }, expect = "OK" },
  # PHASE A, FLIGHT: one crossing at a warp whose frames are a fraction of a period.
  { cmd = "WarpToUT",     args = { ut = "1048", maxRate = "10" },               expect = "OK", budget = 180 },
  { cmd = "MissionMark",  args = { label = "ir6-flight-warped" },               expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2123618197", resources = "LiquidFuel", expect = "LiquidFuel:297.6", tolerance = "0.01" }, expect = "OK" },
  # PHASE B, SPACE CENTER: one more crossing, on the unloaded path.
  { cmd = "StopRecording",                                                      expect = "OK" },
  { cmd = "DiscardTree",                                                        expect = "OK" },
  { cmd = "ExitToSpaceCenter",                                                  expect = "OK", budget = 120 },
  { cmd = "MissionMark",  args = { label = "ir6-ksc" },                         expect = "OK" },
  { cmd = "WarpToUT",     args = { ut = "1100", maxRate = "10" },               expect = "OK", budget = 180 },
  { cmd = "MissionMark",  args = { label = "ir6-ksc-warped" },                  expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2123618197", resources = "LiquidFuel", expect = "LiquidFuel:395.2", tolerance = "0.01" }, expect = "OK" },
  # PHASE C, SPACE CENTER after a same-instant reload: hundreds of periods at full speed
  # against a full destination.
  { cmd = "SaveGame",     args = { name = "persistent" },                       expect = "OK", budget = 120 },
  { cmd = "LoadGame",     args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                     expect = "OK" },
  { cmd = "MissionMark",  args = { label = "ir6-reloaded" },                    expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "WarpToUT",     args = { ut = "20000", maxRate = "100000" },          expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "ir6-long-warped" },                 expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "2123618197", resources = "LiquidFuel", expect = "LiquidFuel:395.2", tolerance = "0.01" }, expect = "OK" },
  { cmd = "FlushAndQuit",                                                       expect = "OK" },
]

[dimensionsCovered]
# Boot facts only until the first green flight (the H35 claim-is-not-gate rule).
D14 = ["sandbox", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# No step creates or removes a recording: the host's five committed recordings.
count = { min = 5, max = 5 }

[expectations.logContracts]
required = [
  "routecommand complete action=create tree=73e50f1e3aa24c299919016cd9e92269 route=.* name='IR6 Rover Supply' status=Paused",
  "TryActivate: route=\\S+ now Active ",
  # BEFORE: activated, nothing run, the endpoint at the live-state fill.
  "(?s)MISSIONMARK label=ir6-activated (?:(?!listhandles route ).)*listhandles route index=0 id=\\S+ name='IR6 Rover Supply' status=Active completed=0 skipped=0 cursor=-1 [^\\r\\n]* stopPids=2123618197 [^\\r\\n]* dispatched=0 debited=0 pickedUp=0 delivered=0 ",
  "(?s)MISSIONMARK label=ir6-activated (?:(?!readvesselresources expect ).)*readvesselresources expect resource=LiquidFuel expected=200\\.0000 actual=(?:200\\.0|199\\.9)[0-9]{3} [^\\r\\n]*match=true",
  # PHASE A: exactly one delivery in flight (the forbid below holds the count), 200 -> 297.6.
  "(?s)MISSIONMARK label=ir6-activated (?:(?!MISSIONMARK label=ir6-flight-warped ).)*LoopRoute: route \\S+ cycle=cycle-0 FIRED full cycle ",
  "(?s)MISSIONMARK label=ir6-activated (?:(?!MISSIONMARK label=ir6-flight-warped ).)*Delivery write: route=\\S+ dest=rover fuel 0 pid=2123618197 resource=LiquidFuel requested=97\\.(?:6|599999)[0-9]* written=97\\.(?:6|599999)[0-9]* tankBefore=(?:200|199\\.999)[0-9.]* tankAfter=297\\.(?:6|599999)[0-9]* capacity=400 path=(?:loaded|unloaded)",
  "(?s)MISSIONMARK label=ir6-flight-warped (?:(?!listhandles route ).)*listhandles route index=0 id=\\S+ name='IR6 Rover Supply' status=Active completed=1 skipped=0 cursor=0 [^\\r\\n]* dispatched=1 debited=[01] pickedUp=0 delivered=1 ",
  "(?s)MISSIONMARK label=ir6-flight-warped (?:(?!readvesselresources expect ).)*readvesselresources expect resource=LiquidFuel expected=297\\.6000 actual=297\\.[56][0-9]{3} [^\\r\\n]*match=true",
  # PHASE B: one delivery at the Space Center, on the unloaded path, 297.6 -> 395.2.
  "(?s)MISSIONMARK label=ir6-ksc (?:(?!MISSIONMARK label=ir6-ksc-warped ).)*LoopRoute: route \\S+ cycle=cycle-1 FIRED full cycle ",
  "(?s)MISSIONMARK label=ir6-ksc (?:(?!MISSIONMARK label=ir6-ksc-warped ).)*Delivery write: route=\\S+ dest=rover fuel 0 pid=2123618197 resource=LiquidFuel requested=97\\.(?:6|599999)[0-9]* written=97\\.(?:6|599999)[0-9]* tankBefore=297\\.(?:6|599999)[0-9]* tankAfter=395\\.(?:2|199999)[0-9]* capacity=400 path=unloaded",
  "(?s)MISSIONMARK label=ir6-ksc-warped (?:(?!listhandles route ).)*listhandles route index=0 id=\\S+ name='IR6 Rover Supply' status=Active completed=2 skipped=0 cursor=1 [^\\r\\n]* dispatched=2 debited=[0-2] pickedUp=0 delivered=2 ",
  "(?s)MISSIONMARK label=ir6-ksc-warped (?:(?!readvesselresources expect ).)*readvesselresources expect resource=LiquidFuel expected=395\\.2000 actual=395\\.[12][0-9]{3} [^\\r\\n]*match=true",
  # PHASE C: the same route after the same-instant reload, then every fire blocked, with
  # frames that span several periods collapsing into one fire.
  "(?s)MISSIONMARK label=ir6-reloaded (?:(?!listhandles route ).)*listhandles route index=0 id=\\S+ name='IR6 Rover Supply' status=Active completed=2 skipped=0 cursor=1 [^\\r\\n]* dispatched=2 debited=[0-2] pickedUp=0 delivered=2 ",
  "(?s)MISSIONMARK label=ir6-reloaded (?:(?!MISSIONMARK label=ir6-long-warped ).)*LoopRoute: route \\S+ cycle=cycle-[0-9]+ BLOCKED kind=DestinationFull reason=\\S+ ",
  "(?s)MISSIONMARK label=ir6-reloaded (?:(?!MISSIONMARK label=ir6-long-warped ).)*LoopRoute: route \\S+ warp jump=(?:[2-9]|[1-9][0-9]+) ",
  "(?s)MISSIONMARK label=ir6-long-warped (?:(?!listhandles route ).)*listhandles route index=0 id=\\S+ name='IR6 Rover Supply' status=Active completed=2 skipped=[1-9][0-9]* cursor=[0-9]+ [^\\r\\n]* dispatched=2 debited=[0-2] pickedUp=0 delivered=2 ",
  "(?s)MISSIONMARK label=ir6-long-warped (?:(?!readvesselresources expect ).)*readvesselresources expect resource=LiquidFuel expected=395\\.2000 actual=395\\.[12][0-9]{3} [^\\r\\n]*match=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "listhandles rejected",
  "readvesselresources rejected",
  "readvesselresources expect [^\\r\\n]*match=false",
  "warptout refused",
  # No collapse at moderate warp: phases A and B deliver each cycle on its own tick.
  "(?s)MISSIONMARK label=ir6-activated (?:(?!MISSIONMARK label=ir6-ksc-warped ).)*LoopRoute: route \\S+ warp jump=",
  # Phase A delivers once, phase B once, phase C never.
  "(?s)MISSIONMARK label=ir6-activated (?:(?!MISSIONMARK label=ir6-flight-warped ).)*Delivery write: route=(?:(?!MISSIONMARK label=ir6-flight-warped ).)*Delivery write: route=",
  "(?s)MISSIONMARK label=ir6-ksc (?:(?!MISSIONMARK label=ir6-ksc-warped ).)*Delivery write: route=(?:(?!MISSIONMARK label=ir6-ksc-warped ).)*Delivery write: route=",
  "(?s)MISSIONMARK label=ir6-reloaded (?:(?!MISSIONMARK label=ir6-long-warped ).)*Delivery write: route=",
  # A cycle blocked before the destination was full.
  "(?s)MISSIONMARK label=ir6-activated (?:(?!MISSIONMARK label=ir6-ksc-warped ).)*BLOCKED kind=",
]

[runtime]
# One LoadGame boot, one same-instant reload, three WarpToUT and a scene exit, plus the
# short steps (flight 1 measured 77 s wall for the first two phases).
budgetSeconds = 2400

[retry]
policy = "once"

[expectedFail]
bugId = ""
