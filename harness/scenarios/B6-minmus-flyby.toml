schema = 1
id = "B6-minmus-flyby"
# nightly: same fixture and machine as B5, different target body.
# LIVE-PROVEN 2026-07-22: PASS (flakedThenPassed) - Minmus SOI entered, 512 km
# flyby, free-return into Kerbin SOI, wall 1167 s; the non-blocking rails-warp
# rework validated live end to end (held 1000x coast, single factor changes).
tier = "nightly"
description = "Minmus flyby / free-return: MechJeb ascent to LKO, ManeuverPlanner Hohmann transfer to Minmus, autowarped burn, dv-capped course-correction, cross-SOI coast, Minmus flyby, return into Kerbin SOI."
instanceProfile = "stock-minimal"
tags = ["B6", "flown", "mechjeb", "minmus", "cross-soi"]

[fixture]
# Same pre-placed Kerbal X fixture as B2/B4/B5.
saveTemplate       = "fixtures/saves/b2-lko-craft"
injectedRecordings = "none"
craft              = []

[driver]
kind    = "autopilot"
# Thin alias over the body-parameterized B5 machine (see b6_minmus_flyby.py);
# the flight differs from B5 only in these params.
mission = "b6_minmus_flyby"

# `steps` MUST stay in the [driver] table (above the [driver.missionParams]
# header). Budget arithmetic (ESTIMATED): the ~46,400 km Minmus transfer coast
# is ~9 days of game time vs the Mun's ~1-2 days -- more rails hops, so the
# wall budget grows: missionBudget 3000 >= 30 connect + ascent ~250 +
# circularize ~100 + plan+burn ~300 + correction ~120 + coast hops ~600 +
# flyby hops ~300 + settle + margin.
# runtime 3500 (review SF-5) >= 240 LoadGame + ~5 SetSetting + 3000 mission
# + ~120 CommitTree + ~60 FlushAndQuit + ~75 margin: the post-mission seam
# steps must survive a FULL-budget mission (previously only ~60 s remained).
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 240 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "true" }, expect = "OK" },
  { phase = "mission",  expect = "MISSION-OK", budget = 3000 },
  { cmd = "CommitTree",                                          expect = "OK" },
  { cmd = "FlushAndQuit",                                        expect = "OK" },
]

# Ascent half = B2's proven tolerances verbatim; transfer half = B5's proven
# shape re-sized for Minmus (validated against b6_minmus_flyby.schema.toml).
[driver.missionParams]
targetApoapsisMeters       = 80000
targetPeriapsisMeters      = 80000
apoErrorMeters             = 5000
periErrorMeters            = 5000
ascentTimeoutSeconds       = 420
circularizeTimeoutSeconds  = 300
targetBodyName             = "Minmus"
homeBodyName               = "Kerbin"
# Minmus orbits at ~46,400 km; a transfer burn that raised apoapsis past
# 40,000 km is unambiguous burn evidence (floor, not a window).
transferMinApoapsisMeters  = 40000000
# Course-correct the flyby periapsis to 20 km: above the ~5.7 km Minmus peaks
# + the 6 km assertion floor. Same dv cap as B5: it blocks the wild-burn
# insanity class only, not genuine corrections (the DIY burner + aligned
# debounce + no-progress give-up own the wild-burn risk; B5's seventeenth
# flight priced a legitimate round-2 at ~170 m/s; finding 14).
courseCorrectPeriapsisMeters = 20000
maxCorrectionDvMps         = 300
# Two rounds like B5: post-TLI + a mid-coast refinement at 20,000 km (Minmus
# orbits at ~46,400 km).
correctionTriggerAltsMeters = [0, 20000000]
planTimeoutSeconds         = 300
planRetrySeconds           = 10
# The burn itself is B5-sized, but the executor may autowarp up to a full
# parking orbit to the node first; same 4000 game-second budget as B5.
transferBurnTimeoutSeconds = 4000
# ~9-day transfer coast (game seconds) + margin; runs at a HELD 10,000x via
# non-blocking set_rails_warp, no per-hop ramp sawtooth.
coastTimeoutSeconds        = 2000000
flybyTimeoutSeconds        = 400000
# Warp shaping (2026-07-22 warp-optimization pass; see
# docs/dev/research/warp-optimization-findings.md and the B5 spec comments).
# Same values as B5; note the Minmus altitude-limit table is the tightest of
# the three bodies (100x needs >= 12 km, 10,000x >= 48 km), which the
# machine's per-body clamp handles automatically during the low flyby.
coastWarpFactor            = 6
flybyWarpFactor            = 5
flybyMaxWarpFactor         = 6
nodeArrivalMarginSeconds   = 15
planWarpFactor             = 2
soiLeadSeconds             = 30
flipPhysicsWarpFactor      = 1
targetPeriapsisFloorMeters = 6000

# Coverage: same cross-SOI recording cells as B5 with the minmus body axis.
[dimensionsCovered]
D1  = ["auto-record-launch"]
# D3 parent-anchored-debris: gated by the `Child recording created \(debris, TTL=`
# token below, the SOLE log site that creates a parent-anchored debris child
# (BackgroundRecorder.cs:1177; its only sibling at :1185 is the CONTROLLED child
# line). See B2-lko-ascent.toml for the full derivation.
D3  = ["orbital-checkpoint", "parent-anchored-debris"]
D4  = ["atmospheric", "exo-propulsive", "exo-ballistic", "cohesive-cross-body-coast"]
D14 = ["kerbin", "minmus", "warp-rails"]

[expectations]
# PLACEMENT IS LOAD-BEARING. run.py reads `expectations.allowedAnomalies`; a bare
# `allowedAnomalies` written after an `[expectations.<sub>]` header is TOML-scoped to
# that SUB-table and is never read. Every spec but S1.6 carried it that way until
# 2026-07-26; hlib.validate_spec now REJECTS the misplaced form, so this table must
# stay ahead of the sub-tables below.
allowedAnomalies = []

[expectations.recordings]
# Same as B5: main + up to 6 boosters + LES margin + 1 flameout-staged dry
# core (live finding 15).#
# MIN TIGHTENED 1 -> 7 (autotest-roadmap R1, 2026-07-27). The old min of 1 was set
# when one flight had been measured and hedged "even if debris admission varies".
# FIVE flights on this exact fixture have now measured the population and it has
# never varied: B2 2026-07-20 = 7 (1 root + 6 boosters); B11 flight 4, B12 flight 5,
# B13 flight 1 and B14 flight 1 = 8 each (1 root + 6 boosters + 1 flameout-staged
# ascent core). 6 boosters is the deterministic part of every one of them, so
# 1 + 6 = 7 is the floor this flight actually supports. At min 1 the window read
# PASS with the ENTIRE debris population missing - the regression class it exists
# to catch. RE-PIN CONTRACT (EVA-4's precedent): if a later run legitimately
# differs, RE-PIN to the newly measured value and record which recordings it
# produced; do NOT widen back toward 1.
count = { min = 7, max = 9 }

[expectations.logContracts]
# `Child recording created \(debris, TTL=` is the POPULATION gate the count window
# cannot be. Sourced from the emitting call BackgroundRecorder.cs:1177, and it is
# ParsekLog.INFO - NOT Verbose - so it needs no verboseLogging pin and this spec
# deliberately adds no SetSetting step for it. The literal line is
# `Child recording created (debris, TTL=60s): recId=... vesselPid=...`; the
# parenthesis is ESCAPED because hlib.evaluate_expectations applies each required
# pattern with re.search, so a bare `(` is a regex group, not text.
required  = ["Recording started",
             "Child recording created \\(debris, TTL=",
             "Recording stopped"]
forbidden = ["\\[Parsek\\]\\[ERROR\\]"]

[runtime]
budgetSeconds = 3500

[retry]
policy = "once"

[expectedFail]
bugId = ""
