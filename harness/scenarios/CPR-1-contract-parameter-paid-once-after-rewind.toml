schema = 1
id = "CPR-1-contract-parameter-paid-once-after-rewind"
# =====================================================================================
# CPR-1: A CONTRACT PARAMETER'S OWN REWARD PAID ONCE ACROSS A REWIND (test-gap list 2026-11-18,
# batch 4; RW-17's header leaves "a parameter's own reward paid once" to the unit tests).
#
# THE RULING UNDER TEST: one outcome pays once and the earliest crossing wins; a plain
# Rewind-to-Launch only moves the clock. RW-17 proved it for a contract's COMPLETION over
# parameters that paid nothing. This lane proves it for a PARAMETER that pays on its own.
#
# THE CONTRACT. `a5a1f217` on cs-career-new is the World-Firsts FIRSTLAUNCH offer: one
# ProgressTrackingParameter (FIRSTLAUNCH) that pays 3200 funds, 1 science and 1 rep on its own,
# and a contract completion that pays 2080 funds. Stock completes FIRSTLAUNCH at liftoff (PRELAUNCH
# to FLYING with a positive vertical speed for 1 s, decompiled `FirstLaunch`), and the contract
# completes in the same tick, since that is its only parameter. CS-3 proved both captures live
# (`ContractParameterCompleted ... param=0 (funds=3200, rep=1, sci=1)`, run `2026-10-26_0254`).
# CS-4's REACHSPACE (32000) was the brief's suggestion. It needs the MechJeb orbit mission;
# FIRSTLAUNCH needs only a Flea hop, so it is the cheaper host for the same walk.
#
# WHAT THE CODE DOES (read 2026-11-23, main 0003b8107, ContractsModule.ProcessParameterComplete):
# the walk credits the first (contract, parameter) row in walk order (`effective=true,
# fundsReward=...`). A later row for the same key is zeroed FIRST, before the after-completion
# check (`ParameterComplete: ... effective=false (already credited), rewards zeroed`), with the
# credited row as its witness. G's rows are captured after the rewind's break, so nothing is
# taken back.
#
# THE CRAFT: the stock `Jumping Flea` (Mk1 pod, Mk16 chute, Flea; no decoupler, so the hop leaves
# no debris and the vessel keeps its launch pid). The hop is RW-11's measured profile: activate
# the Flea, the chute at about +47 s, landed on KSC grass by about +190 s, all at 1x.
#
# PLAN (cs-career-new, UT ~0.4; the UTs are the plan):
#   boot      LoadGame persistent at the Space Center (the host holds stock's asteroid, CS-1's
#             first-flight trap); accept the contract; warp to 100.
#   F         the Flea on the pad, recorded; warp on the pad to 300; activate: the parameter and
#             the contract complete at ~301; the hop lands by 490. Commit, recover.
#   rewind    Rewind-to-Launch onto F: the clock lands near F's launch (~85-100), with the
#             contract Active again. Warp to 110 to fix the clock.
#   G         the Flea again, recorded: activate at ~111, so the parameter completes at ~112,
#             before F's row; stock pays live. Land by 300, commit, recover at the Space Center
#             marker (a flight Recover's stock summary holds warp).
#   crossing  warp to 600: the walk credits G's rows and zeroes F's.
#   check     an unrecorded Flea onto the pad, the default save, LedgerGroundTruth.
#
# GATES: G's parameter row is the credited one, and F's is zeroed as "already credited". The
# contract completion pair is gated as in RW-17. There is no take-back, no StockPoolAdjustment,
# and the ground truth closes. No pool-equality pin: F's landed recovery and G's are not the
# same value, so the pools do not return to the pre-rewind numbers.
#
# PRE-REGISTERED READINGS. (a) A rewind landing after 110 refuses the warp backward
# (`warptout refused reason=`); re-plan the G warp. (b) The chute at +47 s after a late
# activation fails to slow the pod: the hop crashes, which is a mission problem, not Parsek's.
# (c) G's parameter row walked after its contract completion at the same UT logs
# `effective=true, ... (walked after its contract's completion ...)`; the pin takes that suffix.
#
# STATUS: AUTHORED 2026-11-23 (test-gap list batch 4, branch `b4-career`), never flown. Todo
# TEST-GAPS-BATCH4-CAREER.
# =====================================================================================
tier = "operator"
description = "A contract parameter's own reward paid once across a rewind: on cs-career-new a committed Flea hop completes the FIRSTLAUNCH contract (its parameter pays 3200 funds on its own), a Rewind-to-Launch onto it, and a second hop completes it earlier: stock pays live, the walk credits the earlier parameter and contract rows and zeroes the later ones, nothing is taken back and LedgerGroundTruth closes the career."
instanceProfile = "stock-tree"
tags = ["CPR-1", "career", "ledger", "rewind", "rewind-to-launch", "contracts", "contract-parameter",
        "editor", "ground-truth", "ingame-batch", "timeline-ops", "pending-flight"]

[fixture]
saveTemplate = "fixtures/saves/cs-career-new"
injectedRecordings = "none"
craft = []

[driver]
kind = "seam"

# Budget arithmetic: 300 LoadGame + 60 KscAction + 3 x 120 KSC warps + 3 x (120 GoToEditor +
# 180 LaunchFromEditor) + 2 x 180 StartRecording + 120 pad warp + 4 x 240 hop warps + 120 check
# warp + 2 x 120 CommitTree + 120 Recover + 120 ExitToSpaceCenter + 60 KscMarkerRecover + 300
# rewind + 5 x 120 SaveGame + 540 RunTests = 4320; runtime 5000 adds the inert steps and
# FlushAndQuit.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent", scene = "spacecenter" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },            expect = "OK" },
  { cmd = "SetSetting",     args = { name = "ledgerTracing", value = "true" },             expect = "OK" },
  { cmd = "KscAction",      args = { action = "accept-contract", contract = "a5a1f217-d79b-4ef9-8122-f051ecdd1681" }, expect = "OK", budget = 60 },
  { cmd = "WarpToUT",       args = { ut = "100", maxRate = "100" },                        expect = "OK", budget = 120 },
  # ---- F: the parameter completed ~200 s after launch ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "f",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "300" },                                         expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "cpr1-f-before-liftoff" },                    expect = "OK" },
  { cmd = "PartAction",     args = { button = "activate", part = "solidBooster.sm.v2" },   expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "347", maxRate = "1" },                          expect = "OK", budget = 240 },
  { cmd = "MissionMark",    args = { label = "cpr1-f-flown" },                             expect = "OK" },
  { cmd = "PartAction",     args = { button = "chute", part = "parachuteSingle" },         expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "490", maxRate = "1" },                          expect = "OK", budget = 240 },
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "Recover",        args = { pid = "${f.pid}" },                                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "cpr1-f-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "cpr1-01-after-f-commit" },                   expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "cpr1-before-rewind" },                       expect = "OK" },
  # ---- the rewind onto F's launch ----
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                              expect = "OK", budget = 300 },
  { cmd = "MissionMark",    args = { label = "cpr1-rewound" },                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" },       expect = "OK" },
  { cmd = "SaveGame",       args = { name = "cpr1-02-after-rtl" },                        expect = "OK", budget = 120 },
  { cmd = "WarpToUT",       args = { ut = "110", maxRate = "100" },                        expect = "OK", budget = 120 },
  # ---- G: the same parameter, before F's row ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "g",             expect = "OK", budget = 180 },
  { cmd = "StartRecording",                                                                expect = "OK", budget = 180 },
  { cmd = "MissionMark",    args = { label = "cpr1-g-before-liftoff" },                    expect = "OK" },
  { cmd = "PartAction",     args = { button = "activate", part = "solidBooster.sm.v2" },   expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "158", maxRate = "1" },                          expect = "OK", budget = 240 },
  { cmd = "MissionMark",    args = { label = "cpr1-g-flown" },                             expect = "OK" },
  { cmd = "PartAction",     args = { button = "chute", part = "parachuteSingle" },         expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "300", maxRate = "1" },                          expect = "OK", budget = 240 },
  { cmd = "RecordingState",                                                                expect = "OK" },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "CommitTree",                                                                    expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                                 expect = "OK" },
  { cmd = "MissionMark",    args = { label = "cpr1-g-committed" },                         expect = "OK" },
  { cmd = "SaveGame",       args = { name = "cpr1-03-after-g-commit" },                   expect = "OK", budget = 120 },
  { cmd = "ExitToSpaceCenter",                                                             expect = "OK", budget = 120 },
  { cmd = "KscMarkerRecover", args = { pid = "${g.pid}" },                                 expect = "OK", budget = 60 },
  # ---- the crossing of F's rows ----
  { cmd = "MissionMark",    args = { label = "cpr1-before-crossing" },                     expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "600", maxRate = "100" },                        expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "cpr1-crossed" },                             expect = "OK" },
  { cmd = "SaveGame",       args = { name = "cpr1-04-after-crossing" },                   expect = "OK", budget = 120 },
  # ---- the check: an unrecorded launch onto the pad, the save, the ground truth ----
  { cmd = "GoToEditor",     args = { facility = "VAB", craft = "Jumping Flea" },           expect = "OK", budget = 120 },
  { cmd = "LaunchFromEditor",                                     label = "gt",            expect = "OK", budget = 180 },
  { cmd = "WarpToUT",       args = { ut = "630" },                                         expect = "OK", budget = 120 },
  { cmd = "SaveGame",                                                                      expect = "OK", budget = 120 },
  { cmd = "RunTests",       args = { category = "LedgerGroundTruth" },                     expect = "OK", budget = 540 },
  { cmd = "FlushAndQuit",                                                                  expect = "OK" },
]

[dimensionsCovered]
D8  = ["funds", "contracts", "recalc-engine", "ksp-state-patcher", "ground-truth-harness"]
D9  = ["rewind-to-launch"]
D14 = ["kerbin", "career", "scene-ksc", "scene-editor", "scene-flight"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# F and G, one recording each (the Flea has no decoupler); the check launch is unrecorded.
# Two hops, each split by the commit's optimizer at its landing (measured 4 on the first flight,
# `2026-11-23_2138`).
count = { min = 4, max = 4 }

[expectations.logContracts]
required = [
  "\\[LedgerTrace\\] phase=Structural recalcSeq=[0-9]+ funds=",
  "kscaction action=accept-contract target=a5a1f217-d79b-4ef9-8122-f051ecdd1681 applied=true",

  # ---- F completes the parameter at liftoff, and stock pays it ----
  "MISSIONMARK label=cpr1-f-before-liftoff ut=(?:(?!MISSIONMARK label=cpr1-f-flown )[\\s\\S])*?Game state: ContractParameterCompleted '[^'\\r\\n]+' param=0 \\(funds=3200, rep=1, sci=1\\)",

  # ---- the rewind lands before F's row, after the accept ----
  "MISSIONMARK label=cpr1-before-rewind ut=[\\s\\S]*?\\[Rewind\\] Rewind-to-Launch initiated to UT [\\s\\S]*?MISSIONMARK label=cpr1-rewound ut=",

  # ---- G completes it again, earlier: no prevention, stock pays live ----
  "MISSIONMARK label=cpr1-g-before-liftoff ut=1[0-9]{2}\\.(?:(?!MISSIONMARK label=cpr1-g-flown )[\\s\\S])*?Game state: ContractParameterCompleted '[^'\\r\\n]+' param=0 \\(funds=3200, rep=1, sci=1\\)",

  # ---- the walk: the earlier parameter row is the credit, the later one is zeroed ----
  "MISSIONMARK label=cpr1-g-committed ut=[\\s\\S]*ParameterComplete: contractId='a5a1f217-d79b-4ef9-8122-f051ecdd1681' param='0' effective=true, fundsReward=3200 repReward=1 scienceReward=1",
  "MISSIONMARK label=cpr1-g-committed ut=[\\s\\S]*ParameterComplete: contractId='a5a1f217-d79b-4ef9-8122-f051ecdd1681' param='0' effective=false \\(already credited\\), rewards zeroed",
  # ---- and the contract completion beside it, RW-17's pair ----
  "MISSIONMARK label=cpr1-g-committed ut=[\\s\\S]*Complete: contractId='a5a1f217-d79b-4ef9-8122-f051ecdd1681' effective=true,",
  "MISSIONMARK label=cpr1-g-committed ut=[\\s\\S]*Complete: contractId='a5a1f217-d79b-4ef9-8122-f051ecdd1681' effective=false \\(already credited\\), rewards zeroed",

  # ---- the ground truth ----
  "BATCH_COMPLETE v1 total=3 passed=3 failed=0 skipped=0 category=LedgerGroundTruth scene=FLIGHT",
  "result: hardFailures=0 ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "result: hardFailures=[1-9]",
  "\\[LedgerTrace\\] phase=Anomaly ",
  "ABORTING rewind ledger patch",
  "GUARDED (?:UPLIFT|DRAWDOWN) clamped",
  "filed StockPoolAdjustment amount=",
  "invokerewindtolaunch refused",
  "warptout refused reason=",
  # ---- stock's payment to G is the one payment: nothing to take back, no third payment ----
  "\\[TakeBack\\] Took back ",
  "take-back shortfall",
  "MISSIONMARK label=cpr1-g-committed ut=[\\s\\S]*Game state: ContractParameterCompleted '[^'\\r\\n]+' param=0 \\(funds=",
  "ParameterComplete: contractId='a5a1f217-d79b-4ef9-8122-f051ecdd1681' param='0' effective=false \\(contract already completed earlier",
  "Game state: ContractFailed ",
  "completed by no flight, filed untagged",
]

[runtime]
budgetSeconds = 5000

[retry]
policy = "once"

[expectedFail]
bugId = ""
