schema = 1
id = "RCN-1-route-conservation-across-loads"
tier = "nightly"
# =====================================================================================
# RCN-1: A TWO-STOP SUPPLY ROUTE CHECKED BY RESOURCE CONSERVATION, BOTH ENDS READ, ACROSS
# TWO F9s AND A GO-BACK REWIND. AUTHORED 2026-11-06 (branch `routecons`), NEVER FLOWN.
# Todos TEST-GAP-AUDIT-2026-10-31-RESIDUE (C1 remainder: "no per-resource conservation
# check, origin debit = delivered + by-design loss") and CROSS-SYSTEM-COVERAGE-GAPS-
# 2026-10-16 ("Resource amounts ... routes are still unchecked"); also the first flight
# of ROUTE-LOAD-MID-CYCLE-MULTISTOP-REDISPATCH's fix (xUnit only until now: "a lane is
# owed: no committed route lane flies a multi-stop route across a load").
#
# THE STORY. The player activates a relay route that picks fuel up at depot rover B and
# delivers it to base rover A. They press F5 before the cycle, warp across the pickup,
# press F5 again between the two windows, warp across the delivery, then F9 back to the
# between-windows save, warp again, F9 back to the before-the-cycle save, run the whole
# cycle again, and finally rewind a fresh recording to its launch (a go-back rewind to a
# rewind save written between the windows) and let the delivery come round once more.
# At every one of the ten reading points both endpoints' tanks are read by
# `ReadVesselResources` (what is really in the tanks, never Parsek's own delivery lines)
# and the SUM over origin and destination is gated against the conservation equation.
#
# THE HOST is RVR-7's `rover-relay-c-recorded` (save clock UT 410.40, staged at
# start-of-cycle by its builder): three 16-part rovers on the KSC shore. Relay tree
# 88c012a6... is C's run: dock at B, LOAD 154.4 LiquidFuel (window 0, the pickup), dock at
# A, UNLOAD 200 LiquidFuel (window 1, the delivery). Live pids, from
# `build_rover_relay_c_recorded.py`: B (origin) 90564594, A (destination) 4280917262, C
# (transport, the active vessel) 612987736. Staged tanks: B 200/400, A 200/400, C
# 154.4/400 LiquidFuel.
#
# THE CONSERVATION EQUATION, derived from the design, not measured. Per resource, per
# completed cycle (design 19.2.4 flow closure, with the transport replayed and never
# materialized, 19.2.3):
#     origin debit + transport drawdown = destination credit + by-design loss
# where every term is read off the route's own recorded windows
# (`ROUTE_WINDOW_RESOURCE_ROWS` in the builder):
#   * origin debit       = window 0's transport gain, 354.4 - 200 = 154.4 (the pickup
#                          writer takes exactly this off B: `Origin debit: requested=`);
#   * destination credit = window 1's endpoint gain, 400 - 200 = 200 (A's headroom is
#                          exactly 200, so the all-or-nothing capacity gate passes and
#                          nothing is clamped);
#   * transport drawdown = C's fill at the first dock minus at the last undock,
#                          200 - 154.4 = 45.6: the transport's LAUNCH cargo (design
#                          19.2.2 item 1). Since LOGISTICS-WITHOUT-MONEY it is not
#                          priced, so each cycle this relay ADDS 45.6 to B + A. On this
#                          host the term is a gain; on `rover-relay-recorded` (B -200,
#                          A +126.8) the same term is a 73.2 LOSS: the residual that stays
#                          on the transport, which never materializes.
#   * by-design loss     = 0 here. The only other loss terms the design has are cargo
#                          picked up and never delivered (an endpoint lost at delivery,
#                          RS-1; "a crashed disposition still debits", 19.2.5) and the
#                          partial-destination clamp, which the shipped gate no longer
#                          takes (RVR-14: a short destination BLOCKS the cycle whole).
# So 154.4 + 45.6 = 200 + 0, and the gated readings are (B + A):
#     before the cycle               200   + 200   = 400
#     between the windows            45.6  + 200   = 245.6   (154.4 in transit on the
#                                                             replayed transport)
#     after the delivery             45.6  + 400   = 445.6   (= 400 + 45.6)
# and C reads 154.4 at every reading in FLIGHT (the pickup writer removes from the
# SOURCE only and the delivery writer stores into the DESTINATION only; a write into
# the transport's real tanks would show here). `harness/lib/
# test_build_rover_relay_c_recorded.py::RouteConservationSpecTests` re-derives every
# expected sum below from the fixture bytes and the builder's window rows, so a re-harvest
# that moved a number reds there, not on a flight.
#
# THE CLOCK (RS-1's, MEASURED there on the same host): the relay's loop span is 162.74 s,
# the landed anchors take no PhaseLock (RVR-9), and the anchor is the activation UT, so
# with the activation at ~1001 the pickup window is crossed at ~1045 and the delivery at
# ~1164 (RS-1: 1163.66); the next cycle's pickup would be ~1209, past every target here,
# so the second cycle (which would BLOCK on B's 45.6, RVR-8) is never reached.
#   create (Paused) at boot ~410; TimeJump 1000; READ before; activate; F5 `rcn-pre`
#   TimeJump 1075  -> pickup        READ rcn-picked; F5 `rcn-mid` (between the windows)
#   TimeJump 1175  -> delivery      READ rcn-delivered
#   F9 `rcn-mid`                    READ rcn-mid-reloaded
#   TimeJump 1175  -> delivery ONLY READ rcn-mid-redelivered (the cycle resumes)
#   F9 `rcn-pre`                    READ rcn-pre-reloaded
#   TimeJump 1075  -> pickup        READ rcn-pre-picked
#   StartRecording / StopRecording / CommitTree / StopRecording on C (the rewind save,
#   ~1080, between the windows; H58's exact sequence and its reasons)
#   TimeJump 1175  -> delivery      READ rcn-pre-redelivered
#   InvokeRewindToLaunch latest     READ rcn-rewound (Space Center, clock ~1065)
#   WarpToUT 1175  -> delivery ONLY READ rcn-rewind-redelivered
#
# THE THREE LOAD EXITS. Both F9s are Cold save-file loads (design-load-restores-the-save
# 4.1): `RouteStore.LoadRoutesFrom` puts the save's own route, event log and per-stop
# cursors back, and the tanks come back from the save. The go-back rewind is the other
# exit: `RouteLoadReconcile.ReconcileAtGoBackRewind` retires the route rows after the
# rewind save's UT (the delivery) and puts the save's cursors AND cycle counters back
# (`RestoreCycleCountersFromSave`, the ROUTE-LOAD-MID-CYCLE-MULTISTOP-REDISPATCH fix).
# Without that fix the rebuild counts the half-delivered cycle as completed, the next
# window fires under a fresh cycle id, `IsDispatchAlreadyLogged` misses and the cycle is
# DISPATCHED AGAIN: a second `dispatch fired` and a second `Origin debit:` after the
# `rcn-rewound` mark (forbidden below). Then B + A would read 445.6 - 154.4 = 291.2 at
# the end, not 445.6.
#
# WHAT EACH FAILURE WOULD LOOK LIKE:
#   * a second pickup on a resume: B cannot cover a second 154.4, so the gate BLOCKs
#     (`BLOCKED kind=` is forbidden everywhere) and that cycle's delivery never comes;
#     a partial second debit would leave B + A short of the equation;
#   * a double delivery: A cannot take a second 200 (it is full at 400): `BLOCKED` or
#     `written=0`, and the per-segment Delivery-write count forbids;
#   * a load that kept memory's tanks or route (the pre-#2155 in-session shape): the
#     post-load readings are 445.6 instead of 245.6 / 400, and the read-back's counters
#     are memory's (`delivered=1`);
#   * a write into the transport's or a visitor's tanks (A5): C off 154.4.
#
# FAST-LANE CHECKLIST (harness/README.md). 1 (reuse a flight): no committed flight is a
# prefix. RS-1 shares the create / TimeJump 1000 / activate / pickup prefix but recovers A
# at the Space Center right after it, and RVR-7 runs a send-once from the boot UT; the F5s
# must sit between activation and the pickup, so neither host's flight can carry these
# reads. 2 (no idle waits): every game-time move is an explicit-UT TimeJump or WarpToUT.
# 3 (dwells): none. 6 (fail fast): the outcome is deterministic, so `[retry] policy =
# "none"`. 7 (tight windows): `recordings.count` is a 11..12 guess until the first flight
# (H58 measured exactly one new recording for the same Start/Stop/Commit on its host).
# 8 / 9: tier and flight_efficiency.py after the first green flight.
#
# GUESSES (not measured; read a first red against these):
#   * read-back tokens after a pickup: `dispatched=1 debited=0 pickedUp=1 delivered=0`
#     (RS-1 measured exactly that shape on this route) and `stopFired=<n>,-1`;
#   * `index=0` / `index=1` vessel lines follow the pid order of the selector;
#   * B's tank prints `45.6000` (200 - 154.3999999999952);
#   * the go-back cutoff is the rewind save's UT (~1080, H58 re-pin, `cutoffSource=
#     rewind-save-ut`) and it retires at least the delivery row;
#   * C's claimed recording is held by the rewind and spawned at its end; nothing reads
#     C after the StartRecording, because a spawn may re-pid it;
#   * every Delivery write after the rewind runs at the Space Center (`path=` not pinned).
#
# IR-9 (a docked visitor at the destination during a delivery) is NOT in this lane: no
# seam verb docks two vessels, and no committed route host has a visitor docked at a
# route's destination. See the todo for the fixture it needs.
# =====================================================================================
description = "RCN-1, NEVER FLOWN: on rover-relay-c-recorded, create and activate the two-stop relay route (pickup 154.4 LiquidFuel at rover B, delivery 200 at rover A), F5 before the cycle and F5 between the windows, F9 back to each, and finally a go-back Rewind-to-Launch to a rewind save written between the windows. At ten reading points ReadVesselResources reads BOTH ends and gates the SUM B + A against the conservation equation derived from the route's own windows (origin debit 154.4 + transport launch-cargo drawdown 45.6 = destination credit 200, no by-design loss on this host): 400 before a cycle, 245.6 between the windows, 445.6 after the delivery; the transport C stays at 154.4. Each resume after a load must fire the remaining window exactly once with no second dispatch or origin debit (first flight of ROUTE-LOAD-MID-CYCLE-MULTISTOP-REDISPATCH's go-back fix)."
instanceProfile = "stock-minimal"
tags = ["RCN-1", "logistics", "route", "route-pickup", "route-delivery", "conservation",
        "quickload", "rewind-to-launch", "timeline-ops", "recorded-fixture"]

[fixture]
saveTemplate       = "fixtures/saves/rover-relay-c-recorded"
injectedRecordings = "none"
craft              = []

[driver]
kind = "seam"
# The kill triple at boot and after each F9, as on IR-1 and every rover-relay-c lane: the
# committed restore path can resume a promotion-stub recording of the active rover C
# before the first step runs. After the CommitTree only StopRecording runs (H58's
# reasoning: a DiscardTree there would reap the tree just committed).
steps = [
  { cmd = "LoadGame",     args = { save = "${runSave}", name = "persistent" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                      expect = "OK" },
  { cmd = "DiscardTree",                                                        expect = "OK" },
  { cmd = "SetSetting",   args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",   args = { name = "verboseLogging",     value = "true" },  expect = "OK" },
  { cmd = "SealSlot",     args = { tree = "88c012a6eed94bf09ff73397a4a31410" },   expect = "OK", budget = 120 },
  { cmd = "RouteCommand", args = { action = "create", tree = "88c012a6eed94bf09ff73397a4a31410", name = "RCN Relay" }, expect = "OK", budget = 120 },
  { cmd = "TimeJump",     args = { ut = "1000" },                               expect = "OK", budget = 300 },
  # BEFORE: the route exists (Paused), nothing has run. B + A = 400; C = 154.4.
  { cmd = "MissionMark",  args = { label = "rcn-before" },                      expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "90564594,4280917262", resources = "LiquidFuel", expect = "LiquidFuel:400", tolerance = "0.01" }, expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "612987736", resources = "LiquidFuel", expect = "LiquidFuel:154.4", tolerance = "0.01" }, expect = "OK" },
  { cmd = "RouteCommand", args = { action = "activate", route = "RCN Relay" },  expect = "OK", budget = 120 },
  # F5 #1, right after the activation and ~44 s before the pickup window.
  { cmd = "SaveGame",     args = { name = "rcn-pre" },                          expect = "OK", budget = 120 },
  # The pickup window (~1045): B -154.4, A unchanged.
  { cmd = "TimeJump",     args = { ut = "1075" },                               expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "rcn-picked" },                      expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "90564594,4280917262", resources = "LiquidFuel", expect = "LiquidFuel:245.6", tolerance = "0.01" }, expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "612987736", resources = "LiquidFuel", expect = "LiquidFuel:154.4", tolerance = "0.01" }, expect = "OK" },
  # F5 #2, between the two windows.
  { cmd = "SaveGame",     args = { name = "rcn-mid" },                          expect = "OK", budget = 120 },
  # The delivery window (~1164): A +200.
  { cmd = "TimeJump",     args = { ut = "1175" },                               expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "rcn-delivered" },                   expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "90564594,4280917262", resources = "LiquidFuel", expect = "LiquidFuel:445.6", tolerance = "0.01" }, expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "612987736", resources = "LiquidFuel", expect = "LiquidFuel:154.4", tolerance = "0.01" }, expect = "OK" },
  # F9 #1: back to the save between the windows (a Cold save-file load).
  { cmd = "LoadGame",     args = { save = "${runSave}", name = "rcn-mid", playerLoad = "true" }, expect = "OK", budget = 300 },
  { cmd = "RecordingState",                                                     expect = "OK" },
  { cmd = "RecordingState",                                                     expect = "OK" },
