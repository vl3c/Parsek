  { cmd = "RecordingState",                                                     expect = "OK" },
  { cmd = "RecordingState",                                                     expect = "OK" },
  { cmd = "RecordingState",                                                     expect = "OK" },
  { cmd = "StopRecording",                                                      expect = "OK" },
  { cmd = "DiscardTree",                                                        expect = "OK" },
  { cmd = "MissionMark",  args = { label = "rcn-pre-reloaded" },                expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "90564594,4280917262", resources = "LiquidFuel", expect = "LiquidFuel:400", tolerance = "0.01" }, expect = "OK" },
  # The re-flown cycle, pickup first.
  { cmd = "TimeJump",     args = { ut = "1075" },                               expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "rcn-pre-picked" },                  expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "90564594,4280917262", resources = "LiquidFuel", expect = "LiquidFuel:245.6", tolerance = "0.01" }, expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "612987736", resources = "LiquidFuel", expect = "LiquidFuel:154.4", tolerance = "0.01" }, expect = "OK" },
  # The rewind save, written between the windows by recording the transport for a frame
  # (H58's sequence: StopRecording after CommitTree clears the commit's own auto-resume).
  { cmd = "StartRecording",                                                     expect = "OK", budget = 180 },
  { cmd = "StopRecording",                                                      expect = "OK" },
  { cmd = "CommitTree",                                                         expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                      expect = "OK" },
  { cmd = "TimeJump",     args = { ut = "1175" },                               expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "rcn-pre-redelivered" },             expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "90564594,4280917262", resources = "LiquidFuel", expect = "LiquidFuel:445.6", tolerance = "0.01" }, expect = "OK" },
  # The go-back rewind back across the delivery, to the rewind save between the windows.
  # It lands at the Space Center, so the delivery comes round on a WarpToUT.
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                   expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "rcn-rewound" },                     expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "90564594,4280917262", resources = "LiquidFuel", expect = "LiquidFuel:245.6", tolerance = "0.01" }, expect = "OK" },
  { cmd = "WarpToUT",     args = { ut = "1175", maxRate = "10" },               expect = "OK", budget = 300 },
  { cmd = "MissionMark",  args = { label = "rcn-rewind-redelivered" },          expect = "OK" },
  { cmd = "ListHandles",  args = { kind = "routes" },                           expect = "OK" },
  { cmd = "ReadVesselResources", args = { pid = "90564594,4280917262", resources = "LiquidFuel", expect = "LiquidFuel:445.6", tolerance = "0.01" }, expect = "OK" },
  { cmd = "FlushAndQuit",                                                       expect = "OK" },
]

