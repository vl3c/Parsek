forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "routecommand rejected",
  "listhandles rejected",
  "readvesselresources rejected",
  # The conservation gate itself: any reading off its equation.
  "readvesselresources expect [^\\r\\n]*match=false",
  # No cycle may hold: a second pickup would meet B's 45.6, a second delivery A's full tank.
  "BLOCKED kind=",
  "reject id=[0-9]+ cmd=InvokeRewindToLaunch reason=recording-active",
  "invokerewindtolaunch refused: rewind-gate",
  # Exactly two pickups in the whole run (the first cycle and the re-flown one after
  # F9 #2) and exactly four deliveries (one per future): a third origin debit or a fifth
  # delivery is a double fire somewhere.
  "(?s)Origin debit: (?:.*?Origin debit: ){2}",
  "(?s)dispatch fired \\(carrierStopIndex=(?:.*?dispatch fired \\(carrierStopIndex=){2}",
  "(?s)Delivery write: (?:.*?Delivery write: ){4}",
  # Per segment: no second pickup after a resume, no double delivery in any one future.
  "(?s)MISSIONMARK label=rcn-picked (?:(?!MISSIONMARK label=rcn-pre-reloaded ).)*Origin debit: ",
  "(?s)MISSIONMARK label=rcn-mid-reloaded (?:(?!MISSIONMARK label=rcn-pre-reloaded ).)*dispatch fired ",
  "(?s)MISSIONMARK label=rcn-pre-picked .*Origin debit: ",
  "(?s)MISSIONMARK label=rcn-rewound (?:(?!MISSIONMARK label=rcn-rewind-redelivered ).)*dispatch fired ",
  "(?s)MISSIONMARK label=rcn-rewound (?:(?!MISSIONMARK label=rcn-rewind-redelivered ).)*Delivery write: (?:(?!MISSIONMARK label=rcn-rewind-redelivered ).)*Delivery write: ",
  "(?s)MISSIONMARK label=rcn-mid-reloaded (?:(?!MISSIONMARK label=rcn-mid-redelivered ).)*Delivery write: (?:(?!MISSIONMARK label=rcn-mid-redelivered ).)*Delivery write: ",
]

[runtime]
# Three LoadGames, six TimeJumps, a Rewind-to-Launch and a WarpToUT (deferred verbs),
# plus about 60 short steps; the expected wall is a few minutes.
budgetSeconds = 3600

[retry]
policy = "none"

[expectedFail]
bugId = ""
