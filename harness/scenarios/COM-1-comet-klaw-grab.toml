schema = 1
id = "COM-1-comet-klaw-grab"
tier = "nightly"
# =====================================================================================
# COM-1 (owner rulings V 2026-11-15, the Klaw lanes). AUTHORED 2026-11-15 on branch
# `ast-lanes`. AST-1 with a COMET. FLOWN GREEN 2026-11-15: reading run
# `2026-11-15_2010_COM-1-comet-klaw-grab` (branch claude/project-thread-7yabo0 at 4c6915a7, the
# fcceccd DLL, PASS attempt 1, wall 332 s, mission 227 s; results on branch
# `ast-flights-2026-11-15`, folder `ast-klaw-2026-11-15c`). Every window below is re-pinned off
# that run and the tier promoted operator -> nightly by its measured wall.
#
# THE RULINGS UNDER TEST: AST-1's (not recorded before the grab, a Dock merge of couple kind
# Grapple, claimed and held after a rewind with no second copy, real at the tip), for a
# `PotatoComet` rather than a `PotatoRoid`. A comet is the large case: its nucleus radius is
# about 44 m, so a hold ghost drawn at a fixed asteroid size is visibly wrong.
#
# HOST: `com-klaw-lko` (harness/tools/build_ast_klaw_fixtures.py): `AST Klaw` (active, pid
# 2710401000) at UT 355.83, the comet `UnknownComet` of `depot-route-recorded` (pid 3656867723,
# nucleus radius 44.47 m, size 5 kept) 150 m ahead on the same orbit, `AST Watcher` (pid
# 2710403000) 300 m behind, the post-rewind flight focus.
#
# THE FLIGHT: AST-1's, with the standoff at the nucleus radius (44 m) and a longer approach
# give-up (the comet is 150 m out, 106 m of it above the standoff).
#
# THE MISSION'S GAME-TIME BOUND: UT 370 + settle 5 + arm 5 + target <= 30 + approach <= 400 +
# hold 15 + settle 5 = UT 830 on OK; the post-rewind warp to UT 1100 is past it and the tip.
#
# SIBLING-FIX DEPENDENCIES: `RockGhost built: path=` (the comet's hold ghost at its own size;
# the run read `path=stock-generator kind=comet part='PotatoComet' ... radius=44.47`).
#
# WHAT THE READING RUN ANSWERED: AST-1's, plus: the Klaw captures the nucleus at this approach
# (the stock target at 149.5 m, the couple `fromPart=PotatoComet toPart=GrapplingDevice`), so
# the 44 m standoff is a working contact distance; the comet's coma / tail FX are NOT on the
# hold ghost (`cometVfx=skipped-needs-live-comet-vessel`); the hold (`evidence=chain`) is
# released `reason=claimed` at the ghost grab (UT 577.3) and the tip takes `Chain tip spawn
# complete: #1 "AST Klaw" pid=2710401000`, one `UnknownComet` part in the produced save.
#
# FAST-LANE CHECKLIST: as AST-1; the approach give-up is 400 s (the longest 1x span); count
# 2..2 and every structure window pinned to the reading run; nightly, 332 s measured.
# flight_efficiency.py on the reading run: 227 s of mission wall, 195 s the 1x RCS approach;
# the 30 s it ranks recoverable as a coast is the drift between RCS corrections.
# =====================================================================================
description = "COM-1: AST-1 with a comet. A probe grabs the comet UnknownComet (a PotatoComet, nucleus about 44 m) with the Klaw in low Kerbin orbit, commits, and after Rewind-to-Launch the ghost chain claims the comet, the rewind holds it out of the world with a hold ghost at the comet's own size until the ghost probe grabs it, and at the tip the probe and the comet spawn real as one vessel with no second copy."
instanceProfile = "stock-minimal"
tags = ["comet", "asteroid", "klaw", "grapple", "dock", "ghost-chain", "rewind-to-launch",
        "rewind-hold", "rcs", "COM-1", "reading-run", "flown"]

[fixture]
saveTemplate = "fixtures/saves/com-klaw-lko"
injectedRecordings = "none"
craft = []

[driver]
kind = "autopilot"
mission = "ast_klaw_grab"

# `steps` MUST stay in the [driver] table, ABOVE the [driver.missionParams] header.
steps = [
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "persistent" },     expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "StartRecording",                                                          expect = "OK", budget = 180 },
  { cmd = "RecordingState",                                                          expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "370", maxRate = "1" },                    expect = "OK", budget = 120 },
  { cmd = "MissionMark",    args = { label = "com1-grab" },                          expect = "OK" },
  { phase = "mission",      expect = "MISSION-OK", budget = 1000 },
  { cmd = "MissionMark",    args = { label = "com1-held" },                          expect = "OK" },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "CommitTree",                                                              expect = "OK", budget = 120 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c0",             expect = "OK" },
  { cmd = "MissionMark",    args = { label = "com1-committed-${c0.count}" },         expect = "OK" },
  { cmd = "InvokeRewindToLaunch", args = { tree = "latest" },                        expect = "OK", budget = 300 },
  { cmd = "SaveGame",       args = { name = "com1-rewound" },                        expect = "OK", budget = 120 },
  { cmd = "LoadGame",       args = { save = "${runSave}", name = "com1-rewound", focusPid = "2710403000" }, expect = "OK", budget = 300 },
  { cmd = "StopRecording",                                                           expect = "OK" },
  { cmd = "DiscardTree",                                                             expect = "OK" },
  { cmd = "SetSetting",     args = { name = "autoRecordOnLaunch", value = "false" }, expect = "OK" },
  { cmd = "SetSetting",     args = { name = "verboseLogging", value = "true" },      expect = "OK" },
  { cmd = "ListHandles",    args = { kind = "chains" }, label = "ch",                expect = "OK" },
  { cmd = "MissionMark",    args = { label = "com1-reloaded-chains-${ch.count}" },   expect = "OK" },
  { cmd = "WarpToUT",       args = { ut = "1100", maxRate = "50" },                  expect = "OK", budget = 300 },
  { cmd = "ListHandles",    args = { kind = "committed" }, label = "c2",             expect = "OK" },
  { cmd = "MissionMark",    args = { label = "com1-ended-a-${c2.rec0spawned}-${c2.rec0spawnedPid}-b-${c2.rec1spawned}-${c2.rec1spawnedPid}-end" }, expect = "OK" },
  { cmd = "SaveGame",                                                                expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                            expect = "OK" },
]

[driver.missionParams]
rockName               = "UnknownComet"
startSettleSeconds     = 5
armSeconds             = 5
targetTimeoutSeconds   = 30
# The nucleus radius (44.47 m): the slowdown ends at the surface, not at the centre.
standoffMeters         = 44
approachTimeoutSeconds = 400
holdSeconds            = 15
settleSeconds          = 5

[dimensionsCovered]
D5  = ["cross-tree-foreign-dock"]
D9  = ["rewind-to-launch"]
D10 = ["claw-producer"]
D14 = ["kerbin", "sandbox", "scene-flight", "scene-ksc", "warp-1x", "warp-rails"]
D18 = ["committed-interaction-claiming"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The root (ends in the Dock merge) and the merge child; the reading run read 2.
count = { min = 2, max = 2 }

[expectations.recordings.structure]
# REPORT-ONLY, AST-1's shape. The reading run of 2026-11-15
# (`2026-11-15_2010_COM-1-comet-klaw-grab`) matched every window below; arming is the
# operator's call.
gating            = false
trees             = { min = 1, max = 1 }
committedTrees    = { min = 1, max = 1 }
branchPoints      = { Dock = { min = 1, max = 1 } }
spaceObjectParts  = { "UnknownComet" = { min = 1, max = 1 } }
spawnedVessels    = { min = 1, max = 1 }
vesselNames       = { "AST Klaw" = { min = 1, max = 1 }, "AST Watcher" = { min = 1, max = 1 } }
recordingNames    = { "AST Klaw" = { min = 2, max = 2 }, "UnknownComet" = { min = 0, max = 0 } }

