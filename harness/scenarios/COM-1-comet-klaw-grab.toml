  "\\[Parsek\\]\\[ERROR\\]",
  "invokerewindtolaunch refused",
  "warptout refused",
  "Rewind strip scope: strip spawned pid=3656867723 ",
  "\\[Ghoster\\] Vessel ghosted: pid=3656867723 ",
  "Claimed vessel hold ghost not drawn",
