[dimensionsCovered]
D14 = ["kerbin", "sandbox", "scene-flight"]
D18 = ["ghost-extension-past-endut"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
count = { min = 1, max = 1 }

# REPORT-ONLY until the reading run: the injected shape must survive the load (one
# committed tree, one recording, Orbiting, and still ONE flat point).
[expectations.recordings.structure]
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1, max = 1 } }

[expectations.recordings.points]
total   = { min = 1, max = 1 }
largest = { min = 1, max = 1 }

[expectations.logContracts]
required  = [
  "MISSIONMARK label=ex2-loaded-count-1-pid-0-spawned-false ",
  "PlaybackCompleted index=[0-9]+ vessel=Single Point Holder ghostWasActive=True pastEffectiveEnd=True needsSpawn=True",
  # The single-point branch of CheckSpawnCollisions, blocked by the probe.
  "Spawn blocked for #[0-9]+ \\(Single Point Holder\\): overlaps 'Kerbal X Probe' at [0-9]+m \\(single-point trajectory\\)",
  "Ghost held pending spawn retry: #[0-9]+ \"Single Point Holder\" id=single-point-hold-rec - spawn blocked, ghost stays visible",
  "Stale past-end cleanup after completion delivery: ghost #[0-9]+ \"Single Point Holder\" kept \\(held by the policy\\)",
  "Held ghost timed out: #[0-9]+ \"Single Point Holder\" id=single-point-hold-rec held=5\\.[0-9]s",
  "Ghost #[0-9]+ \"Single Point Holder\" destroyed \\(held-spawn-timeout\\)",
  # The four in order, one match.
  "Ghost held pending spawn retry: #[0-9]+ \"Single Point Holder\"[\\s\\S]*?kept \\(held by the policy\\)[\\s\\S]*?Held ghost timed out: #[0-9]+ \"Single Point Holder\" id=\\S+ held=5\\.[0-9]s[\\s\\S]*?\"Single Point Holder\" destroyed \\(held-spawn-timeout\\)",
  # The vessel never spawned in the session.
  "MISSIONMARK label=ex2-after-hold-count-1-pid-0-spawned-false ",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  "Held ghost spawn succeeded on retry",
  "Vessel spawned for #[0-9]+ \"Single Point Holder\"",
  "Vessel respawned",
  "Spawn RETIRED for #[0-9]+ \\(Single Point Holder\\)",
  "walkback rewrote spawn position for #[0-9]+ \\(Single Point Holder\\)",
  "Duplicate blocker detected for #[0-9]+ \\(Single Point Holder\\)",
  "Ghost held pending spawn retry: #[0-9]+ \"Single Point Holder\" [^\\r\\n]*no ghost to keep visible",
  # REGRESSION (D18-HELD-GHOST-DESTROYED-BY-STALE-PAST-END-CLEANUP-SAME-FRAME): the stale
  # past-end cleanup must not destroy the held ghost before the hold times out.
  "Ghost #[0-9]+ \"Single Point Holder\" destroyed \\(stale past-end ghost \\(no longer held\\)\\)[\\s\\S]*?Held ghost timed out: #[0-9]+ \"Single Point Holder\"",
]

[runtime]
budgetSeconds = 1800

[retry]
policy = "once"
