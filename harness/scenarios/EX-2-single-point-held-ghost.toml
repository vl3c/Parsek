  "Orbital vessel spawn for #[0-9]+ \\(Single Point Holder\\)",
  "Vessel respawned",
  "Spawn RETIRED for #[0-9]+ \\(Single Point Holder\\)",
  "walkback rewrote spawn position for #[0-9]+ \\(Single Point Holder\\)",
  "Duplicate blocker detected for #[0-9]+ \\(Single Point Holder\\)",
  "Ghost held pending spawn retry: #[0-9]+ \"Single Point Holder\" [^\\r\\n]*no ghost to keep visible",
