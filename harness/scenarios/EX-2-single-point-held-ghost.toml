total   = { min = 1, max = 1 }
largest = { min = 1, max = 1 }

[expectations.logContracts]
required  = [
  "MISSIONMARK label=ex2-loaded-count-1-pid-0-spawned-false ",
  "PlaybackCompleted index=[0-9]+ vessel=Single Point Holder ghostWasActive=True pastEffectiveEnd=True needsSpawn=True",
  # The spawn takes the terminal-orbit route, not the last point (read off `2026-09-23_2110`
  # and `_2113`).
  "Spawn #[0-9]+ \\(Single Point Holder\\): using recorded terminal orbit propagated to current UT",
  # The single-point branch of CheckSpawnCollisions, blocked by the probe.
  "Spawn blocked for #[0-9]+ \\(Single Point Holder\\): overlaps 'Kerbal X Probe' at [0-9]+m \\(single-point trajectory\\)",
  "Ghost held pending spawn retry: #[0-9]+ \"Single Point Holder\" id=single-point-hold-rec - spawn blocked, ghost stays visible",
  "Stale past-end cleanup after completion delivery: ghost #[0-9]+ \"Single Point Holder\" kept \\(held by the policy\\)",
  "Held ghost timed out: #[0-9]+ \"Single Point Holder\" id=single-point-hold-rec held=5\\.[0-9]s",
  "Ghost #[0-9]+ \"Single Point Holder\" destroyed \\(held-spawn-timeout\\)",
  # The four in order, one match.
  "Ghost held pending spawn retry: #[0-9]+ \"Single Point Holder\"[\\s\\S]*?kept \\(held by the policy\\)[\\s\\S]*?Held ghost timed out: #[0-9]+ \"Single Point Holder\" id=\\S+ held=5\\.[0-9]s[\\s\\S]*?\"Single Point Holder\" destroyed \\(held-spawn-timeout\\)",
  # No vessel in the session: pid 0, not settled (`2026-09-23_2110`: the post-timeout
