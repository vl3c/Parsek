schema = 1
id = "EX-2-single-point-held-ghost"
# -------------------------------------------------------------------------------------
# D18 `ghost-extension-past-endut` (catalog section 2: "ghost extension past EndUT while
# blocked"; design `docs/parsek-flight-recorder-design.md` 13.2 / 13.5 / 13.7), SCOPED TO
# THE SINGLE-POINT COLLISION HOLD: the non-chain path on which a ghost outlives EndUT
# because its end-of-playback spawn is blocked and cannot walk back. Todo
# D18-GHOST-EXTENSION-SINGLE-POINT-HOST; replaces EX-1's claim, which the KSC retirement
# ruling (2026-09-23) removed.
#
# LIVE-PROVEN 2026-09-24 on automation DLL sha256 `bbfc81c5...` (origin/main build, no C#
# change): armed `2026-09-23_2110` PASS attempt 1 (blocked by `Kerbal X Probe` at 70 m,
# held, kept, `held=5.0s`, `destroyed (held-spawn-timeout)`, after-hold mark pid 0
# spawned-false, the post-timeout retry at block=7/150); negative control `_2113` PARSEK-FAIL
# on exactly its one seeded forbidden token (the timeout line), reverted. Readings `_2054` /
# `_2103` PARSEK-FAILed on fixture geometry (FIXTURE GEOMETRY below).
#
# WHAT HOLDS A GHOST PAST EndUT ON THIS PATH (source, 2026-09-23):
# `ParsekPlaybackPolicy.HandlePlaybackCompleted` writes "Ghost held pending spawn retry:"
# only when the spawn call returns with `VesselSpawned` still false AND the ghost was live
# at completion (`GhostWasActive`). `VesselSpawner.CheckSpawnCollisions` leaves
# `VesselSpawned` false only on its single-point branch ("(single-point trajectory) - will
# retry next frame"); a recording with two or more points walks back instead, and an
# exhausted walkback abandons with `VesselSpawned = true`, which is never held. A
# point-ONLY one-point recording is never live (ghost activation starts at its only point,
# which is also EndUT), so the host shape is one flat point PLUS an orbit tail: the
# background on-rails shape. `RetryHeldGhostSpawns` retries every 1 s and gives up at 5 s
# ("Held ghost timed out: ... destroying ghost without spawn"); the release destroys the
# ghost with reason `held-spawn-timeout`.
#
# THE ROAD. `eva2-lko-crewed` (the focused 28-part `Kerbal X` in LKO, and a separate
# `Kerbal X Probe` coasting about 16 m away) plus the `single-point-hold` injected preset
# (`SyntheticRecordingTests.SinglePointOrbitalHold`): one committed single-recording tree,
# `Single Point Holder`, with ONE point at the save UT on the probe's saved position, a
# 20 s orbit tail on the probe's ORBIT elements with a small along-track lead (see FIXTURE
# GEOMETRY), an Orbiting terminal carrying that orbit, and a three-part probe snapshot.
# After the load, 1x time carries the ghost (drawn from the orbit tail, about 70 m ahead of
# the probe) through EndUT; the spawn propagates the terminal orbit, its collision box
# covers the probe, and the probe (loaded, not the active vessel, a different name so
# no #112 recovery) blocks it on the single-point branch. The policy holds the live ghost,
# retries and times out. LKO is far from the KSC exclusion circles, so the #1783
# retirement cannot intercept it.
#
# FIXTURE GEOMETRY, and why (both readings PARSEK-FAIL on geometry, not on the hold):
# - The recorded orbit (segment AND terminal) leads the probe's by 1.0e-4 rad of mean
#   anomaly, about 70 m along track. Reading `2026-09-23_2103` parked the ghost exactly on
#   the probe: Parsek's map-presence ghost ProtoVessel collided with it when both
#   unpacked, the probe broke into 7 `Kerbal X Probe Debris`, the overlap check filters
#   Debris, and the spawn read CLEAR (filed as todo
#   GHOST-MAP-PROTOVESSEL-COLLIDES-WITH-A-REAL-VESSEL-IN-PHYSICS-RANGE).
# - Two outrigger parts 150 m out give the spawn collision box about 155 m half-extent, so
#   the probe stays inside it for the whole 5 s window despite the drift between the
#   propagated orbit and the probe's physics orbit. Reading `2026-09-23_2054` (one-part
#   box) grazed the Mainsail at 13.4 m, cleared on the 1 s retry and spawned the vessel.
# -------------------------------------------------------------------------------------
tier = "nightly"
description = "D18 ghost-extension-past-endut, SCOPED TO THE SINGLE-POINT COLLISION HOLD (design 13.5): an injected one-point recording with an orbit tail (single-point-hold preset) ends on eva2-lko-crewed's loaded, non-active Kerbal X Probe in LKO. At EndUT the spawn is collision-blocked on the single-point branch (no walkback possible), ParsekPlaybackPolicy holds the live ghost, retries every 1 s and times out at 5 s, and the release destroys the ghost with held-spawn-timeout. Asserts the ghost survives the hold (the engine keeps it after the completion reaches the policy, no stale past-end destroy before the timeout) and no vessel spawns."
instanceProfile = "stock-minimal"
tags = ["EX-2", "D18", "held-ghost", "spawn-blocked", "single-point",
        "injected-recordings", "R10", "runtime-handles"]

