# recording, Orbiting, and still ONE flat point).
[expectations.recordings.structure]
gating         = true
trees          = { min = 1, max = 1 }
committedTrees = { min = 1, max = 1 }
recordings     = { min = 1, max = 1 }
terminalStates = { Orbiting = { min = 1, max = 1 } }

[expectations.recordings.points]
