schema = 1
id = "TSS-3-two-deliveries-same-spot-ts"
tier = "operator"
# =============================================================================
# TSS-3: TWO LANDED DELIVERIES THAT END ON THE SAME SPOT, BOTH CROSSED AT MAX WARP IN THE
# TRACKING STATION. THE REGRESSION LANE FOR A FIXED DEFECT.
#
# Authored 2026-11-17 for the end-of-recording spawn audit (todo
# END-SPAWN-SCENE-LANES-2026-11-17, scope 1c). LIVE-PROVEN 2026-11-20 on its re-flight
# (below; tag `flown`).
#
# THE DEFECT (todo SPAWN-TS-STACK-NO-DE-OVERLAP, FIXED 2026-11-17, branch `wip/spawnfix3`):
# the Space Center end spawn nudged a landed spawn away from an existing landed vessel
# (`SpawnCollisionDetector.ComputeDeOverlappedLandedSpawn`), but the Tracking Station
# handoff had no such guard, and its collision check
# (`SpawnCollisionDetector.CheckOverlapAgainstLoadedVessels`, a Physics.OverlapBox) sees
# only LOADED vessels, of which the Tracking Station has none. So two deliveries that ended
# on one spot while the player sat in the Tracking Station were placed inside each other.
# THE FIX: the shared end-of-recording spawn (`VesselSpawner.SpawnOrRecoverIfTooClose`,
# which the handoff calls) now runs the same de-overlap against every UNLOADED same-body
# landed vessel before its collision check (`ApplyEndOfRecordingLandedDeOverlap`, logged
# `De-overlap for #N "<name>": nudged <M>m (site=end-of-recording, ...`). The tokens:
#   * the two `Spawning vessel: "<name>" ... nearest vessel=<D>m` lines
#     (VesselSpawner.EndOfRecording.cs LogSpawnContext; D is the distance from the
#     RESOLVED spawn position to the nearest vessel on Kerbin, unloaded ones included, via
#     GetWorldPos3D). Both are pinned >= 10 m (the de-overlap keeps 15 m).
#   * the de-overlap line of the later probe (whichever of the two spawns second).
#   * the FLIGHT visit afterwards: both probes at their terminal place (LeafVesselPlacement
#     compared=2 ok=2, within 100 m) with no `Spawn-death detected` (ParsekPlaybackPolicy.cs)
#     and no `LeafPlacement:` row whose verdict is not ok.
#
# HOST: `gloops-airshow` (CN-1T / RSC-1's) plus the synthetic preset `spawn-stack`
# (SyntheticRecordingTests.SpawnStackRecording): two committed single-recording trees,
# "Stack Probe A" and "Stack Probe B", ProbeShips that settle onto the SAME KSC grass
# point (-0.1000, -74.8300, 66 m; SS-1's spot, outside both 50 m KSC circles) and end
# Landed there with a TerminalPosition, A at save + 30,060 s, B 20 s later. Three points,
# no TrackSections (the load-time tail trim skips them). The save's own vessels: the
# mk1-capsule on the pad (Jebediah, ~2.9 km from the spot) and an asteroid.
#
# THE FLIGHT: boot straight into the Tracking Station (the first scene to see the
# recordings, so its playhead sweep latches them; CN-1T's shape), then an UNCAPPED
# WarpToUT to 200,000. AS AUTHORED: the ladder reaches 100,000x well before UT 30,060.
# AS FLOWN (first flight, below): the ladder tops at 10,000x for this span and the ends
# are crossed on the climb; one handoff pass still sees both (the worst case for
# stacking). Then SaveGame, LoadGame FLIGHT focused on the first
# spawned pid, and LeafVesselPlacement in FLIGHT with both probes loaded (one RunTests per
# spec; TSS-1 owns the Tracking Station run of the cell).
# (Authored as the lane that crosses a LANDED end at 100,000x; the first flight showed it
# does not, see FIRST FLIGHT.)
#
# FIRST FLIGHT 2026-11-17_2333 (parallel runner run spawn-flight-2026-11-18, main
# 64c68379, Debug DLL bd950021...): PARSEK-FAIL(expectation) on two halves, BOTH spec
# errors; every defect token matched (both `Spawning vessel` lines >= 10 m, the de-overlap
# line, LeafVesselPlacement compared=2 ok=2 in FLIGHT, no spawn-death).
#   * the rate: `warptout complete reachedUT=199999.78... ut=200000 rate=1 maxRate=10000`.
#     A 200,000 s request is under the 250,000 s the 100,000x rung needs, so 10,000x is
#     the ladder's top here, and the ends (save + 30,060 s) were crossed on the climb, 4 s
#     into the warp, both in one handoff pass (`Tracking-station handoff spawned #0 "Stack
#     Probe A" pid=3516968520` and `#1 "Stack Probe B" pid=3074612544`, 5 ms apart). The
#     header's "crossed at 100,000x" was wrong; the token now pins maxRate=10000, and no
#     lane yet crosses a LANDED end at 100,000x.
#   * the count, 3 not 2: the FLIGHT visit focuses Stack Probe A, and flying a vessel
#     Parsek spawned restores its committed tree and continues it in a new segment
#     (`TryRestoreCommittedTreeForSpawnedActiveVessel: restored tree 'Stack Probe A' for
#     vessel 'Stack Probe A' pid=3516968520 via PromoteFromBackground (continues in new
#     segment ...)`, ParsekFlight.TreeRestore.cs, by design). Pinned exact 3, with that
#     line required.
# RE-FLOWN 2026-11-20, LIVE-PROVEN: run 2026-11-20_2157, PASS attempt 1, 173 s
# (parallel runner run tip-spawn-reflight-2026-11-20, main c11d6cde2, Debug DLL 72189e6d...).
# The re-pin held, every defect token green: `Spawning vessel: "Stack Probe A" sit=LANDED,
# nearest vessel=2852m` and `"Stack Probe B" ... nearest vessel=2845m`, both handed off in
# one pass, the warp at `maxRate=10000`, count 3; in FLIGHT LeafVesselPlacement `compared=2
# ok=2` (distM 0.1 and 14.9, height checked=2 ok=2), batch `total=1 passed=1 failed=0
# skipped=0`, now pinned whole; the id left INTERIM_PIN_IDS.
#
# FIRST-FLIGHT RISKS: whether the handoff spawns both in one tick or two (the second sees
# the first's proto vessel either way); how far apart the two probes really are (read the
# nearest-vessel distances and the de-overlap line).
#
# FAST-LANE CHECKLIST (harness/README.md): (1) reuse: a synthetic host, no flight to fly;
# SS-1's spot, RSC-1's host. (2) one explicit-UT WarpToUT. (3) no dwell keys. (4) no
# burns. (5) b5 coasts do not apply. (6) every verb refuses in one frame. (7) count exact
# (2, injected). (8) tier operator until flown. (9)
# flight_efficiency.py owed after the first green flight.
# =============================================================================
description = "Regression lane for todo SPAWN-TS-STACK-NO-DE-OVERLAP (fixed 2026-11-17); LIVE-PROVEN 2026-11-20 (run 2026-11-20_2157, the re-flight; todo END-SPAWN-SCENE-LANES-2026-11-17, scope 1c; the 2026-11-17 first flight matched every defect token and failed only on two spec pins, the warp's top rate and the recording count, re-pinned): gloops-airshow plus the spawn-stack preset (two committed Landed probes ending 20 s apart on the same KSC grass point, 30,000 s after the save). Boots into the Tracking Station, warps uncapped (10,000x for this span) across both ends, and pins that the two spawns are placed at least 10 m apart (the spawn-context nearest-vessel distance), then LeafVesselPlacement in FLIGHT on the spot with both probes loaded and no spawn-death."
instanceProfile = "stock-minimal"
tags = ["TSS-3", "spawn", "end-spawn", "tracking-station", "ts-handoff", "warp", "max-warp",
        "spawn-overlap", "landed-de-overlap", "leaf-placement", "ingame-batch", "kerbin",
        "sandbox", "flown"]

[fixture]
saveTemplate       = "fixtures/saves/gloops-airshow"
injectedRecordings = "spawn-stack"
craft              = []
# The fixture carries `ScenarioNewGameIntro tsComplete = False`, so stock's first
# Tracking Station visit sets the `intro_TS` lock, which holds TIMEWARP and makes
# WarpToUT refuse above 1x there (`warptout refused reason=warp-locked
# holders=intro_TS`). The stage step sets it complete in the staged copy
# (savepatch.apply_ts_intro_done; logged `trackingStationIntroDone patched`).
trackingStationIntroDone = true

[driver]
kind = "seam"
steps = [
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", scene = "trackstation" }, expect = "OK", budget = 300 },
  { cmd = "SetSetting", args = { name = "autoRecordOnLaunch", value = "false" },               expect = "OK" },
  { cmd = "SetSetting", args = { name = "verboseLogging", value = "true" },                    expect = "OK" },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c0",                          expect = "OK" },
  { cmd = "MissionMark", args = { label = "tss3-ts-${c0.count}-${c0.rec0spawned}-${c0.rec1spawned}" }, expect = "OK" },
  # THE SUBJECT: uncapped; the ladder tops at 10,000x for this span (first flight).
  { cmd = "WarpToUT",   args = { ut = "200000" },                                              expect = "OK", budget = 300 },
  { cmd = "ListHandles", args = { kind = "committed" }, label = "c1",                          expect = "OK" },
  { cmd = "MissionMark", args = { label = "tss3-spawned-${c1.count}-${c1.rec0name}-${c1.rec0spawned}-${c1.rec0spawnedPid}-${c1.rec1name}-${c1.rec1spawned}-${c1.rec1spawnedPid}-end" }, expect = "OK" },
  { cmd = "SaveGame",   args = { name = "persistent" },                                        expect = "OK", budget = 120 },
  { cmd = "LoadGame",   args = { save = "${runSave}", name = "persistent", focusPid = "${c1.rec0spawnedPid}" }, expect = "OK", budget = 300 },
  { cmd = "MissionMark", args = { label = "tss3-flight" },                                     expect = "OK" },
  { cmd = "RunTests",   args = { category = "LeafVesselPlacement" },                           expect = "OK", budget = 300 },
  { cmd = "SaveGame",                                                                          expect = "OK", budget = 120 },
  { cmd = "FlushAndQuit",                                                                      expect = "OK" },
]

[dimensionsCovered]
D6  = ["spawn-at-end-pid-dedup"]
D13 = ["bbox-block"]
D14 = ["kerbin", "warp-rails", "warp-high", "scene-ts", "scene-flight", "sandbox"]

[expectations]
allowedAnomalies = []

[expectations.recordings]
# The two injected stack probes, plus the segment the FLIGHT visit opens on Stack Probe A
# (its committed tree restored and continued, by design; first flight, header).
count = { min = 3, max = 3 }

# REPORT-ONLY: two committed trees, both Landed, both spawned once.
[expectations.recordings.structure]
gating         = false
trees          = { min = 2, max = 2 }
committedTrees = { min = 2, max = 2 }
terminalStates = { Landed = { min = 2, max = 2 } }
spawnedVessels = { min = 2, max = 2 }
vesselNames    = { "Stack Probe A" = 1, "Stack Probe B" = 1, "mk1-capsule" = 1 }

[expectations.logContracts]
required = [
  "loadgame complete scene=TRACKSTATION save=.* game-loaded=true expected=TrackingStation",
  # Both injected, neither spawned before the warp (ListHandles, TestCommandListHandles.cs).
  "MISSIONMARK label=tss3-ts-2-false-false ",
  # GhostMapPresence.TrackingStationLifecycle.cs: both handed off during the warp.
  # maxRate=10000: 200,000 s is under the 250,000 s the top rung needs (first flight).
  "Tracking-station handoff spawned #[0-9]+ \"Stack Probe A\" pid=[0-9]+ [\\s\\S]*?warptout complete reachedUT=[0-9.]+ ut=200000 rate=[0-9.]+ maxRate=10000 ",
  "Tracking-station handoff spawned #[0-9]+ \"Stack Probe B\" pid=[0-9]+ [\\s\\S]*?warptout complete reachedUT=[0-9.]+ ut=200000 ",
  # THE DEFECT TOKENS (header): each probe's resolved spawn spot is at least 10 m from the
  # nearest vessel on Kerbin, so the later one is not inside the earlier one.
  "\\[Spawner\\] Spawning vessel: \"Stack Probe A\" sit=[A-Z_]+, nearest vessel=[1-9][0-9]+m",
  "\\[Spawner\\] Spawning vessel: \"Stack Probe B\" sit=[A-Z_]+, nearest vessel=[1-9][0-9]+m",
  # THE FIX (VesselSpawner.EndOfRecording.cs FormatEndOfRecordingDeOverlapLine): the later
  # probe is nudged clear of the earlier one's unloaded proto vessel.
  "\\[Spawner\\] De-overlap for #[0-9]+ \\\"Stack Probe [AB]\\\": nudged [0-9.]+m \\(site=end-of-recording, existing unloaded landed=[1-9]",
  "MISSIONMARK label=tss3-spawned-2-Stack Probe [AB]-true-[0-9]+-Stack Probe [AB]-true-[0-9]+-end ",
  # LeafVesselPlacement.cs (FormatSummary) + InGameTestRunner.cs, in FLIGHT on the spot
  # (both probes loaded, physics running).
  "loadgame complete scene=FLIGHT save=.* game-loaded=true expected=Flight",
  # ParsekFlight.TreeRestore.cs: the focused probe's committed tree continues in a new
  # segment (the third recording).
  "TryRestoreCommittedTreeForSpawnedActiveVessel: restored tree 'Stack Probe A' for vessel 'Stack Probe A' pid=[0-9]+ via [A-Za-z]+ \\(continues in new segment ",
  "MISSIONMARK label=tss3-flight [\\s\\S]*?LeafPlacement summary: scene=FLIGHT compared=2 ok=2 bad=0 absent=0 duplicate=0 unsupported=0 bodies=\\[Kerbin\\]",
  "BATCH_COMPLETE v1 total=1 passed=1 failed=0 skipped=0 category=LeafVesselPlacement scene=FLIGHT",
  "savegame name=persistent folder=\\S+ saved=true",
]
forbidden = [
  "\\[Parsek\\]\\[ERROR\\]",
  # The physical consequence of a stack on the first FLIGHT load (ParsekPlaybackPolicy.cs).
  "Spawn-death detected",
  "Spawn-death loop abandoned",
  # Each probe spawns once, from the Tracking Station, and is never skipped as historical.
  "Spawning vessel: \"Stack Probe A\"[\\s\\S]*Spawning vessel: \"Stack Probe A\"",
  "Spawning vessel: \"Stack Probe B\"[\\s\\S]*Spawning vessel: \"Stack Probe B\"",
  "spawn handoff skipped #[0-9]+ \"Stack Probe [AB]\": historical",
  "Spawn RETIRED",
  "Spawn ABANDONED",
  "Vessel spawn failed",
  "warptout refused",
  "timejump ",
  "LeafPlacement: [^\\r\\n]*verdict=(?!ok)",
]

[expectations.rewind]
rewindPoints  = { max = 0 }
supersedeRows = { max = 0 }
tombstones    = { max = 0 }

[runtime]
# 300 load + 300 warp + 120 save + 300 load + 300 tests + 120 save + margin.
budgetSeconds = 1800

[retry]
# A defect reproduces; one retry prices a boot flake.
policy = "once"

[expectedFail]
bugId = ""
