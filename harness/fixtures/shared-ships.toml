# Shared craft overlay for the committed save fixtures.
#
# WHY THIS FILE EXISTS. A save fixture needs its craft under `<save>/Ships/VAB/`,
# because that is the directory kRPC's `SpaceCenter.launch_vessel("VAB", <name>, ...)`
# resolves `<save>/Ships/VAB/<name>.craft` against (`mission_runner.py`, ACTION_LAUNCH_VESSEL).
# Committing a physical copy per save satisfied that, and cost 180,799 duplicated
# lines across 27 files -- twelve byte-identical copies of `Kerbal X.craft` alone.
# Worse than the size: each copy was an independent drift risk, which is why
# `build_dd1_craft.py` had grown a `COMMITTED_CRAFT_PATHS` tuple naming "EVERY
# committed copy of the craft" so its byte-level gate could walk all of them.
#
# THE CONTRACT. One copy of each shared craft lives in `harness/fixtures/ships/`.
# This file names, per save fixture, which of them are overlaid into
# `<save>/Ships/VAB/` when `run.py::stage_fixture` stages that save. The overlay
# is ADDITIVE and runs after the template copytree; a craft used by exactly one
# fixture stays physically in that fixture and is NOT listed here
# (`gloops-airshow/Ships/VAB/Auto-Saved Ship.craft` is the only one today; its
# byte-identical twin in `gloops-airshow-career` is a BUILT copy, regenerated by
# `tools/build_route_career.py` and byte-gated by `lib/test_route_career.py`, so it
# is not an independent drift risk).
#
# THE INVARIANT, and where it is enforced. No committed file under
# `fixtures/saves/` may be byte-identical to a file in `fixtures/ships/`; every
# ship named here must exist in the library; every library ship must have at
# least two consumers; and no save may declare a ship it also carries physically.
# All four are gated by `SharedShipsManifestTests` in `harness/lib/test_hlib.py`,
# so a re-introduced copy reds the suite instead of silently restoring the
# duplication. The pure resolver is `hlib.plan_shared_ship_overlay`.
#
# ADDING A FIXTURE that needs a shared craft: add the save's row here rather than
# copying the .craft into it. Promoting a craft to shared: move the single copy
# into `fixtures/ships/`, delete the others, and list every consumer here.

[ships]
"b17-duna-pad" = ["DD1 Duna Direct Probe", "GS1 Auto-Chute Booster", "Kerbal X"]
"b18-dres-pad" = ["DD1 Duna Direct Probe", "Duna Rocket", "GS1 Auto-Chute Booster", "Kerbal X"]
"bdock-forge-base" = ["DD1 Duna Direct Probe", "Duna Rocket", "GS1 Auto-Chute Booster", "Kerbal X", "LABX Orbital Lab", "Logi Cargo Rig"]
"bdock-recorded" = ["Kerbal X"]
# The career copy (tools/build_route_career.py) stages exactly what its source stages.
"bdock-recorded-career" = ["Kerbal X"]
"bdock-second-dock-recorded" = ["Kerbal X"]
"bdock-station-craft" = ["Kerbal X"]
"bdock-station-pad" = ["Kerbal X"]
"dres-orbit-recorded" = ["DD1 Duna Direct Probe", "Duna Rocket", "GS1 Auto-Chute Booster", "Kerbal X"]
"moho-orbit-recorded" = ["DD1 Duna Direct Probe", "Duna Rocket", "GS1 Auto-Chute Booster", "Kerbal X"]
"duna-direct-recorded" = ["DD1 Duna Direct Probe", "GS1 Auto-Chute Booster", "Kerbal X"]
"eeloo-orbit-recorded" = ["DD1 Duna Direct Probe", "Duna Rocket", "GS1 Auto-Chute Booster", "Kerbal X"]
"jool-orbit-recorded" = ["DD1 Duna Direct Probe", "Duna Rocket", "GS1 Auto-Chute Booster", "Kerbal X"]
"eva2-lko-crewed" = ["Kerbal X"]
"eva3-pad-3crew" = ["Kerbal X"]
"gs1-two-stage-pad" = ["GS1 Auto-Chute Booster", "Jumping Flea", "Kerbal X"]
# The game-settings axis's two career hosts launch a probe from the VAB (HC-2, ZF-1): under
# ProbesBeforeCrew the Mk1 pod and the Mk16 chute sit behind unresearched nodes, so neither
# career can launch the stock Jumping Flea (stock refuses `ExperimentalPartsAvailable`, flown
# ZF-1 `2026-10-03_1446`), and the one-part `Settings Probe` (a start-node Stayputnik) is the
# cheapest craft both can.
"career-science-pad-hard" = ["Settings Probe"]
"career-pad-craft-zero-funds" = ["Settings Probe"]
# L8 launches the probe twice on L2's host after its rewinds strip the Jumping Flea. KD-1
# opens the stock Jumping Flea in the VAB after its rewind to try the dead kerbal in the
# crew dialog (the fixture's own Flea is a pad VESSEL, not a craft file).
"career-pad-craft" = ["Jumping Flea", "Settings Probe"]
# SCI-1 launches the library Jumping Flea twice from the VAB after its Rewind-to-Launch
# strips the host's own Flea (the host carries its craft on the pad, nothing in the VAB).
"career-science-pad" = ["Jumping Flea"]
# L13 launches the probe from the VAB for its ground-truth window after the Re-Fly merge
# (the host carries its GS-1 craft on the pad, nothing in the VAB).
"career-gs1-two-stage-pad" = ["Settings Probe"]
# RF-9's produced save, harvested. The row is INHERITED rather than chosen: the
# fixture is a copy of what a `gs1-two-stage-pad` run left behind, so its
# `Ships/VAB` held the same two craft and the harvester dropped them as already
# library-owned. It launches NEITHER today - the lanes that will read it are seam
# lanes over its committed recordings - but the row keeps the staged save identical
# to the one the flight produced, which is the whole claim a harvested fixture
# makes. Dropping it would make a future `launch_vessel` lane over this host fail
# on a missing file rather than on anything it was written to measure.
"refly-autopilot-recorded" = ["GS1 Auto-Chute Booster", "Jumping Flea", "Kerbal X"]
"refly-split-crewed-recorded" = ["GS1 Auto-Chute Booster", "Jumping Flea", "Kerbal X"]
"refly-split-crewed-merged" = ["GS1 Auto-Chute Booster", "Jumping Flea", "Kerbal X"]
"gs2-orbital-stack" = ["GS1 Auto-Chute Booster", "Kerbal X"]
# The FORGE-logi-pad harvest, and the row restores what the harvest dropped: the forge
# ran over `bdock-forge-base`, whose four library craft arrive through THIS overlay
# rather than physically, so the produced save's own `Ships/VAB` carried only the craft
# the forge launched. Listing them here puts the fixture back on the same footing as
# every other save derived from that base.
#
# `Logi Cargo Rig` IS THE FIFTH ENTRY, and its promotion is the reason this row and
# `bdock-forge-base`'s were edited together. The craft was committed physically into
# the forge base while it had ONE consumer (a library craft needs two, and a craft
# used once belongs in the fixture that uses it). The harvest gave it its second, as
# `build_logi_craft.py`'s PROMOTION note predicted it would - verbatim: the produced
# fixture arrived holding a byte-identical second copy - so BOTH physical copies were
# deleted, the single library copy went into `fixtures/ships/`, and both consumers are
# declared here. The same route `GS1 Auto-Chute Booster` and `Duna Rocket` took.
"logi-cargo-pad" = ["DD1 Duna Direct Probe", "Duna Rocket", "GS1 Auto-Chute Booster", "Kerbal X", "Logi Cargo Rig"]
# THE ONE ROW HERE THAT IS NOT ABOUT LAUNCHING. `PPB-1-untouched-career-backup`
# never calls `launch_vessel` - its craft is PAYLOAD FOR THE BACKUP. The pre-Parsek
# backup copies `Ships/` and `Subassemblies/` alongside persistent.sfs, and with no
# craft in the staged save that copy loop would run over nothing: the in-game
# assertion that the backup mirrors the player's saved craft file-for-file would
# pass VACUOUSLY, and `FileIOUtils.CopyDirectory` inside the real backup path would
# never execute in game at all. The row makes `craftDirsMirrored=1` a real
# measurement, which PPB-1 pins as a required log token.
"preparsek-untouched-career" = ["Kerbal X"]
# The LABX-1 harvest and its science-mode derivative. `LABX Orbital Lab` (built by
# construction, build_lab_orbit_craft.py) was committed physically into
# bdock-forge-base while it had ONE consumer; the harvest of LABX-1's produced save
# arrived holding a byte-identical second copy, so both physical copies left the
# fixtures and the single library copy went into `fixtures/ships/` - the route
# `Logi Cargo Rig` took. `lab-lko-sandbox` restores everything the harvest dropped
# (the forge base's library craft arrive through the overlay, as for
# `logi-cargo-pad`). `lab-lko-science` (build_lab_lko_science.py) is SCIENCE_SANDBOX
# with only the LABX craft's tech researched. `Settings Probe` (a lone Stayputnik,
# a start-node part) is the second vessel the lab lanes launch from the pad
# (GoToEditor + LaunchFromEditor, LAB-5 / LAB-6 / LAB-7): it holds FLIGHT while the
# orbiting lab is unloaded, which is what an unloaded TimeJump and a spawn after a
# rewind need, and it carries no converter and no crew of its own.
"lab-lko-sandbox" = ["DD1 Duna Direct Probe", "Duna Rocket", "GS1 Auto-Chute Booster", "Kerbal X", "LABX Orbital Lab", "Logi Cargo Rig"]
"lab-lko-science" = ["LABX Orbital Lab", "Settings Probe"]
# `lab-lko-tender-rcs` (build_lab_lko_tender_rcs.py, the LAB-13b host) launches
# nothing: its d5_redock mission names the lab VESSEL in `craftName` to tell the two
# halves apart after the split. The row keeps the craft file a launching reader of
# that param would resolve, exactly as `bdock-second-dock-recorded` does for SD-1.
"lab-lko-tender-rcs" = ["LABX Orbital Lab"]
# The stock Jumping Flea (KSP 1.12, every part on the stock start node), promoted to the
# library 2026-10-25 when the scripted campaign's first stage needed it: six fixtures
# carried byte-identical copies. The campaign's starting saves add their rows when they are
# harvested (CS-1 launches it from the VAB).
"cs-career-new" = ["Jumping Flea"]
"cs-science-new" = ["Jumping Flea"]
"stock-screen-census" = ["Jumping Flea"]
# `fresh-science` gains the Flea for SH-1, the one lane on it that launches (a pad flight to
# rewind to). L1-research-node-science, GUI-8 and CS-0 never open the editor; CS-0 keeps the
# staged Ships/ folder, and its harvest (harvest_bdock_station.py) strips library craft.
"fresh-science" = ["Jumping Flea"]
"stock-screen-census-repair" = ["Jumping Flea"]
