[D6]  # playback / ghost engine
# "mesh-lifecycle-derender" (added with GS-4-kerbalx-rewind-watch, per the growth
# rule the D9 `world-preservation` entry set): the flight-scene ghost MESH
# lifecycle CLOSES - every ghost a replay spawns (the parent AND every
