# "commit-in-foreign-soi" (added with the B11/B12 Mun+Minmus ORBIT lane, per the
# growth rule): committing a tree whose recording CLOSES while the vessel is
# parked in ANOTHER body's SOI. Distinct from every other commit cell - the
# existing ones all commit a recording whose terminal state is at/near Kerbin -
# and it is the cell the ORBIT lane exists to claim (commit path + terminal
# classification).
# NOTE on its axis: this value is a CONTEXT (WHERE the vessel was when the tree
# closed) in a dimension whose other values are TRIGGERS / MECHANISMS (what
# caused the commit: revert-merge, scene exit, abort). The two axes are
# orthogonal, so a future scenario could legitimately claim BOTH
# `commit-in-foreign-soi` and `commit-scene-exit` for a single commit; that is
# not double-counting.
#
# "commit-landed-foreign-body" (added with the B13/B14 Mun+Minmus LANDING lane,
# per the growth rule): committing a tree whose recording CLOSES while the vessel
# is LANDED ON another body. DISTINCT from "commit-in-foreign-soi" on the axis
# that matters to Parsek - the TERMINAL CLASSIFICATION. An in-foreign-SOI commit
# closes with terminalState=Orbiting and terminal ORBIT metadata; a landed commit
# closes with terminalState=Landed and a terminal SURFACE POSITION instead
# (ParsekFlight.CaptureTerminalOrbit only fires for ORBITING / SUB_ORBITAL /
# FLYING / ESCAPING, and UsesTerminalOrbitMetadata excludes Landed), which is a
# different commit-time code path, a different ghost/playback surface and a
# different set of recorded TrackSection classes. B13/B14 legitimately claim BOTH:
# a landed craft IS inside the foreign SOI, and both facts are gated (the machine
# ASSERT-FAILs on leaving the target SOI anywhere in the tail, and the landed
# terminal is gated by the landedOnTargetBody assertion + the airless
# Approach -> Surface* log token).
