# `tombstone-rep-penalty` IS REACHABLE since 2026-09-10 (branch `tombstone-rep-penalty`)
# and IS PINNED. Until that day it was UNREACHABLE BY ANY FLIGHT (2026-08-02 record):
# `Source/Parsek/` had one production construction site for
# `GameActionType.ReputationPenalty` (the Bail-Out Grant in
# `GameStateEventConverter.cs`, hardcoded `Strategy`), nothing constructed a
