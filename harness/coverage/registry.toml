# that means only that is a duplicate label on one measurement, not coverage. The
# `permanent=0` term is a SEPARATE, FALSIFIABLE-IN-THE-RIGHT-DIRECTION observation of
# the ELS recompute: a tombstone that fails to strip the Dead row leaves `permanent=1`
# and REDS. It is also the death-scoped reading the registry's own rationale sentence
# above already warranted - "stopping the Effective Ledger Set from re-deriving a
# reservation and a stand-in for a corpse the merged timeline says never died" - which
# is about the CORPSE's derivation, not about the kerbal's name never appearing again.
# `CL-3` claims this cell from `2026-08-05`. The `permanent=`/`temporary=` terms first
# ship with that branch's DLL, so the same-PR confirm fly is the live proof of the
# token's exact shape. Full forensic write-up in docs/dev/todo-and-known-bugs.md.
