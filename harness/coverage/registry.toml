# invented). `TombstoneEligibility.IsSupersedeTombstoneEligible` already listed the
# type, so `SupersedeCommit.CommitTombstones` tombstones the row with the death.
# THE DEFINITION A CLAIM MUST GATE ON: a `ReputationPenalty(KerbalDeath)` row in the
# superseded subtree tombstoned by the re-fly merge, observable as a non-zero
# `Reputation=` term in the merge tail's summary -
# `Tombstoned [1-9][0-9]* career actions \(.*Reputation=[1-9]` (the same line whose
# `Kerbal=[1-9]` term is CL-3's `tombstones` token; CL-3 read `Reputation=0`). First
# measured `2026-09-09_2158_CL-4-refly-crew-standin`: `Tombstoned 2 career actions
# (... Reputation=1, Kerbal=1 ...)` with the save facet `tombstones=2`.
# `CL-4-refly-crew-standin` claims the cell off that REQUIRED token (2026-09-10).
# WHAT THE ROW DOES NOT DO, so nobody over-reads the claim: a row produced before the
# `ReputationInitial` seed existed, or in the same tree commit that read the seed off
# the live pool, is stamped `insideRepSeed` (the lazy seed is read at the first commit,
# after the death, so that value already contains the penalty) and `ReputationModule`
# does not apply it; every other KerbalDeath row applies regardless of game UT (a
# rewind moves the clock, so UT cannot order a death against the seed - the first cut
# compared UTs and `2026-09-09_2225` seeded at UT 13.8 with the death at UT 124). The
# CL fixture carries no seed, so the seed is read at the merge commit and the row is
# inside it: on this lane the tombstone removes a row the walk was not applying and
# the pool does not move. The cell is the TOMBSTONE of the row, not a pool delta; a
# pool-delta claim needs a death filed after the seed existed and a lane of its own.
