# product change:
# `LedgerOrchestrator.CreateKerbalDeathRepPenaltyActions` (commit step 3d, through
# `DeduplicateAgainstLedger`) files ONE `ReputationPenalty` row with `RepPenaltySource
# = KerbalDeath` per recording that has a dead crew member AND a recording-scoped
