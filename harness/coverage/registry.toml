# boundary has never been the measured variable.
# "loop-period-modes" and "overlap-expiry-soft-caps" were REDEFINED 2026-09-24 (operator
# ruling, ghost-replay Tier C) to match the code as it stands; the value strings stay so no
# spec or history row is renamed.
#   loop-period-modes: the three real launch-to-launch behaviours - (1) ONE copy at a time
#   when the period is at least the flight span (the engine reuses the same ghost object
#   across the boundary, but a claim of this mode witnesses one-at-a-time, not the reuse,
#   unless it names a reuse witness), (2) OVERLAPPING copies when the
#   period is shorter than the span, (3) the global Auto period (`LoopTimeUnit.Auto` reads
