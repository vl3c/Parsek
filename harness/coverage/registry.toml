# Dimension registry (M-A5). Committed materialization of the scenario-catalog
# section 1 (docs/dev/automated-testing-scenario-catalog.md) dimension space
# D1-D18. AUTHORITATIVE machine source of the dimension value set: spec
# validation (hlib.validate_spec) and the coverage denominator (hlib.compute_coverage)
# both read THIS file, nothing else. The catalog markdown stays a narrative
# companion kept in sync by a human in the same PR that adds a value (design N9).
#
# One table per dimension; each `values` list is token-per-value, kebab-case.
# A spec citing a (dimension, value) absent here fails validation, and an
# uncovered value here surfaces as the visible backlog in the coverage report.
#
# Growth rule (plan section 4 item 5): a new Parsek feature adds its dimension
# values here in the SAME PR, so the coverage report immediately shows the gap.
# Plain ASCII.

schema = 1

[D1]  # recording lifecycle
# "commit-in-foreign-soi" (added with the B11/B12 Mun+Minmus ORBIT lane, per the
# growth rule): committing a tree whose recording CLOSES while the vessel is
# parked in ANOTHER body's SOI. Distinct from every other commit cell - the
# existing ones all commit a recording whose terminal state is at/near Kerbin -
# and it is the cell the ORBIT lane exists to claim (commit path + terminal
# classification).
# NOTE on its axis: this value is a CONTEXT (WHERE the vessel was when the tree
# closed) in a dimension whose other values are TRIGGERS / MECHANISMS (what
# caused the commit: revert-merge, scene exit, abort). The two axes are
# orthogonal, so a future scenario could legitimately claim BOTH
# `commit-in-foreign-soi` and `commit-scene-exit` for a single commit; that is
# not double-counting.
#
# "commit-landed-foreign-body" (added with the B13/B14 Mun+Minmus LANDING lane,
# per the growth rule): committing a tree whose recording CLOSES while the vessel
# is LANDED ON another body. DISTINCT from "commit-in-foreign-soi" on the axis
# that matters to Parsek - the TERMINAL CLASSIFICATION. An in-foreign-SOI commit
# closes with terminalState=Orbiting and terminal ORBIT metadata; a landed commit
# closes with terminalState=Landed and a terminal SURFACE POSITION instead
# (ParsekFlight.CaptureTerminalOrbit only fires for ORBITING / SUB_ORBITAL /
# FLYING / ESCAPING, and UsesTerminalOrbitMetadata excludes Landed), which is a
# different commit-time code path, a different ghost/playback surface and a
# different set of recorded TrackSection classes. B13/B14 legitimately claim BOTH:
# a landed craft IS inside the foreign SOI, and both facts are gated (the machine
# ASSERT-FAILs on leaving the target SOI anywhere in the tail, and the landed
# terminal is gated by the landedOnTargetBody assertion + the airless
# Approach -> Surface* log token).
#
# "switch-backgrounds-recording" (RENAMED 2026-09-15 from "stop-on-switch", operator
# ruling B3 off memo s3 of docs/dev/research/wave-0910-open-decisions-2026-09-11.md):
# the old name described a decision that DOES NOT EXIST. In always-tree mode
# `FlightRecorder.DecideOnVesselSwitch` (FlightRecorder.cs:11676) has no Stop branch at
# all - switching to a vessel already in the tree's BackgroundMap returns
# PromoteFromBackground, switching to any other vessel returns TransitionToBackground,
# and the safety fallback returns TransitionToBackground too. So the cell's SUBJECT is
# what a vessel switch actually does to the live recording: it is BACKGROUNDED, not
# stopped. `FlightRecorder.TransitionToBackground` (:11178-11281) disconnects the
# physics-frame patch, unsubscribes the part events and leaves `IsRecording` TRUE.
# THE WITNESS is that method's own terminal line, "Transitioned to background (pid="
# (FlightRecorder.cs:11280).
# The old name was one of the two R2 "phantom cell" registry defects and was recorded
# as UNCLAIMABLE AS WRITTEN for exactly that reason; the rename retires that status,
# and any roadmap / catalog text that still calls it unclaimable is stale from here on.
# DECLARER: CI-1-eva-switch-bg-member, off one gating required token (see that spec).
#
# "sub-2-point-drop" IS NOT THAT CELL, and the two have been confused. Its drop lives
# in `RecordingStore.CreateRecordingFromFlightData`, which the always-tree commit path
# does not use: MC-3 measured the tree commit KEEPING a 1-point recording. This note
# records only that the rename above does not touch it. UPDATED 2026-09-15 (merge of
# the Gloops PR): register item B4 has since been RULED and the cell is defined, closed
# and FLOWN - see its own entry directly below, which also supersedes this paragraph's
# two loose ends (the S0.5 / S0.6 spec comments are corrected there, and the caller set
# is re-derived in full rather than named in part).
#
# "manual-gloops" and "sub-2-point-drop" (both long-standing values, CLAIMED AND
# FLOWN 2026-09-15 by GL-1 / GL-2, each LIVE-PROVEN + ARMED on its first flight
# with the full three-run discipline - reading, armed re-flight, negative control):
# the GLOOPS recorder is the only producer of "manual-gloops", and the only SEAM
# VERB whose subject is the drop.
#   "manual-gloops" is the MANUAL, career-invisible recorder - a parallel
#   FlightRecorder whose take commits IsGhostOnly with looping off. It is NOT the
#   auto-record tree StartRecording drives, so no auto-record lane covers it, and
#   its three buttons live in one window whose open flag only a player click ever
#   wrote until the GloopsStart / GloopsStop seam pair landed. MEASURED on GL-1's
#   reading run 2026-09-15_1601: the stationary PRELAUNCH pod commits a take of
#   THREE points at samplingDensity=2, which is the number its armed tokens pin.
#   "sub-2-point-drop" is RecordingStore.CreateRecordingFromFlightData refusing a
#   take of fewer than two trajectory points. Re-derived from the FULL caller set
#   (todo D1-SUB-2-POINT-DROP-UNREACHABLE-IN-TREE-MODE) rather than assumed: in
#   always-tree mode a tree commit never passes through that factory - it appends
#   through TryAppendCapturedToTree, which KEEPS a 1-point recording - so no
#   StartRecording lane can produce this drop however short its take. The factory's
#   remaining callers are: the Gloops commit (this claim's subject) and a set of
#   abnormal split-edge aborts no seam verb can provoke on demand. The dock/undock
#   chain-segment path that also reached it was unreachable in always-tree mode and
#   has been removed. So the honest scope is "the only seam VERB whose SUBJECT is
#   the drop".
#   MEASURED on GL-2's reading run 2026-09-15_1621: the take lands on EXACTLY ONE
#   point at samplingDensity=0 with the stop step adjacent to the start, and the
#   refusal Warn precedes the seam's own committed=false report by 1.0 ms.
#   S0.5 and S0.6 each attributed a possible count to "the stationary-pod
#   sub-2-point-drop", wording that predates always-tree mode and describes a path
#   their own commits no longer take; both are corrected in the same change.
#
# "commit-abort" (DEFINED 2026-09-26, OPERATOR-CONFIRMED 2026-09-26; claimed by CA-1-commit-abort-booster-live): the post-destruction
# auto-merge is ABORTED because the ACTIVE vessel was destroyed while another leaf of
# the same tree is still a blocker that is NOT debris, and the tree keeps recording
# instead of finalizing. Code: ParsekFlight.ClassifyPostDestructionMergeResolution
# (ParsekFlight.TerminalEvents.cs) returns AbortAndKeepRecording, and its one consumer,
# the ShowPostDestructionTreeMergeDialog coroutine (ParsekFlight.cs), logs "not all
# leaves terminal" and yields out BEFORE FinalizeTreeRecordings / StashPendingTree, so
# no merge dialog is owed and nothing is committed at the death.
#   Re-derived from the FULL caller set, not the comments. The classifier has one
#   caller (that coroutine); the coroutine has two starters. OnVesselWillDestroy starts
#   it on DestructionMode.TreeAllLeavesCheck, i.e. the ACTIVE vessel died in tree mode.
#   DeferredDestructionCheck starts it only after AreAllLeavesTerminal already answered
#   true for a BACKGROUND death, so that starter lands on FinalizeNow. Abort therefore
#   means: active vessel destroyed, no pending split / coalescer work (that is
#   WaitForPendingCrashResolution), AreAllLeavesTerminal false AND
#   AreAllActiveCrashBlockersDebris false - at least one non-active, non-debris leaf is
#   either still live (no terminal state) or ended in a SPAWNABLE terminal (Landed,
#   Splashed, Orbiting, SubOrbital...). That second half is a refinement of the ruling's
#   "a non-debris leaf is still live": a controlled vessel left standing also blocks.
#   An EVA kerbal is a non-debris leaf too, in either direction.
#   In gameplay terms: the vessel you are flying is destroyed but another controlled
#   vessel of the flight survives, so Parsek does not end the mission.
