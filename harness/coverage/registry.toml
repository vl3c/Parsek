[D12]  # crew / kerbals
# "crew-death-in-flight" (added with CL-1-pod-impact, the crew-loss atom, per the
# growth rule): a crewed vessel is destroyed in flight and its kerbal dies, observed
# live. D12 had no value for it - every existing cell is either a RESERVATION concern
# (`reservation-auto-hire`, `stand-ins`, `seat-matching`, `crew-swap`,
# `missed-endut-auto-free`), a KSC roster mutation (`hire-dismiss-patches`), or a
# RE-FLY consequence of a death that already happened (`dead-crew-strip`,
# `tombstone-rep-penalty`). The death itself - Parsek's recording of it and the
# `KerbalAssignment` / `KerbalEndState.Dead` ledger row it produces at commit - was
# not nameable. The two re-fly cells stay uncovered on purpose: they are what this
# atom is meant to be extended into, and the coverage report should keep showing them
# as the backlog rather than absorbing them into this claim.
#
# STILL UNCOVERED after `CL-2-pod-impact-ledger` (the extension's STAGE A, 2026-07-30),
# and deliberately so: CL-2 reaches the pending-tree AUTO-COMMIT and claims the D8
# commit-time cells, but `SupersedeCommit` is the ONLY producer of a `LedgerTombstone`
# and `CommitTombstones` runs strictly inside the RE-FLY merge tail, which no
# auto-commit can reach. Both cells belong to stage B (a rewind ACROSS the crew loss).
#
# `dead-crew-strip` IS NOW PINNED (2026-08-02, CL stage B). It was unfalsifiable while
# it had no definition; the definition below is what a claim must gate on, and it is
# stated so a reader can tell which half is Parsek's doing and which half is the
# quicksave's:
#
#   After a re-fly merge whose supersede subtree contains a `KerbalAssignment` action
#   carrying `KerbalEndState.Dead`, (i) that action is TOMBSTONED - observable as a
#   non-zero `Kerbal=` term in `CommitTombstones`'s `Tombstoned N career actions
#   (... Kerbal=K ...)` line and as `tombstones >= 1` in the M-C2 save parse - and
#   (ii) the ELS recompute that follows leaves NO PERMANENT (death-derived)
#   reservation for that kerbal - observable as `permanent=0` in
#   `CrewReservationManager.RecomputeAfterTombstones`'s `Recomputed after tombstones:
#   N reservations remain (permanent=P temporary=T)` line. Reservations sourced from
#   live or committed recordings OUTSIDE the supersede write-set - above all the
#   re-flown continuation itself, which carries the same kerbal alive - legitimately
#   SURVIVE as temporary, and the stand-in that demotion triggers is the strip
#   WORKING, not a leak: `PostWalk` `continue`s permanent reservations BEFORE slot
#   creation, so a corpse gets no slot and no stand-in, and releasing it is exactly
#   what lets the slot and stand-in appear.
#
# WHAT THE CELL DOES NOT MEAN, and this is the part the old "back in the roster as
# Available or Assigned" phrasing got wrong: NOTHING IN PARSEK FLIPS A `Dead` ROSTER
# STATUS BACK. `CrewReservationManager.RescueOrphanedCrew` explicitly skips Dead crew
# ("Dead crew are skipped") and `RescueReservedCrewAfterEvaRemoval` only rescues
# Missing. The kerbal is alive after a re-fly because the REWIND QUICKSAVE PREDATES
# THE DEATH and KSP reloads the roster from it - so asserting the roster status proves
# the quicksave loaded, not that the tombstone did anything. The tombstone's real job
# is (i)+(ii): stopping the Effective Ledger Set from re-deriving a reservation and a
# stand-in for a corpse the merged timeline says never died.
# `InGameTests/KerbalRecoveryOnSupersedeTest` still asserts the roster half as a
# corroboration; it is the weaker of its two invariants and must not be the sole gate.
# Details in docs/dev/todo-and-known-bugs.md.
#
# THE (ii) SENTENCE ABOVE IS A RE-PIN (2026-08-05, branch `small-fixes-2`), and it is
# recorded as one rather than presented as the original wording. The 2026-08-02 pin
# said (ii) leaves "NO surviving reservation or stand-in for the dead kerbal" - a
# NAME-SCOPED reading that no same-crew re-fly can ever satisfy. Two measurements and
# one code reading forced the change:
#
#   `2026-08-03_1834` (crewed fixture root): half (i) HELD (`Tombstoned 1 career
#   actions (... Kerbal=1 ...)`); the name-scoped (ii) FAILED with `Recomputed after
#   tombstones: 1 reservations remain.` + `Stand-in generated: 'Philsted Kerman' ...
#   for slot 'Jebediah Kerman'`. The surviving reservation came from `cl-stack-root`,
#   OUTSIDE the supersede subtree - a FIXTURE artifact, but not discriminated from a
#   product defect, so the cell stayed unclaimed pending a crewless-root re-fly.
#
#   `2026-08-04_2136` (crewless fixture root, the discriminating run): the fixture
#   hypothesis CONFIRMED - the root-sourced reservation is GONE, and the DEATH-SOURCED
#   one is RELEASED (pre-tombstone `Reservation: 'Jebediah Kerman' endUT=INDEFINITE
#   (Dead), recording 'cl-pod-a'`; after the tombstone no (Dead)/INDEFINITE line ever
#   appears again). Yet `1 reservations remain` again - the survivor is
#   `endUT=Infinity (Unknown), recording 'rec_c5b16ffb…'`, THE RE-FLY SESSION'S OWN
#   LIVE FORK, with Jebediah alive and aboard the active vessel. Correct by design.
#
# THE OLD CANDIDATE GATE WAS INVERTED, which is the finding that matters. A pre-
# tombstone Dead row MERGES into the reservation entry and sets `IsPermanent=true`,
# and `PostWalk` skips permanent reservations before slot creation - so NO stand-in.
# Removing the Dead row (the strip WORKING) demotes the entry to temporary -> slot ->
# stand-in. Measured: pre-tombstone `reservations=1 permanent=1 temporary=0 slots=0`;
# post-tombstone `reservations=1 permanent=0 temporary=1 slots=1` + `Stand-in
# generated: 'Tilan Kerman'`. A `forbidden = ["Stand-in generated"]` candidate would
# therefore have passed EXACTLY WHEN THE TOMBSTONE DID NOTHING and failed because it
# worked. And `0 reservations remain` is STRUCTURALLY UNREACHABLE on any same-crew
# re-fly: `CrewReservationManager` rebuilds from ELS and `ProcessAction` adds an entry
# for every non-Tourist `KerbalAssignment` with resolvable meta, and the fork always
# carries the kerbal. Two alternate hypotheses were ruled out with code + log evidence
# before re-pinning: `Aboard` and `Unknown` produce byte-identical non-permanent
# reservations (`permanent = (endState == Dead)`), so the `aboard=0/unknown=1` split is
# a red herring; and identity resolution did not fail (fork pid == live vessel pid,
# and nothing in the reservation path consults vessel identity at all).
#
# WHY THIS IS A RE-PIN AND NOT A RELAXATION TO HALF (i). THE STANDING WARNING IS
# KEPT: half (i) alone is already claimed as D9 `tombstones`, and a `dead-crew-strip`
# that means only that is a duplicate label on one measurement, not coverage. The
# `permanent=0` term is a SEPARATE, FALSIFIABLE-IN-THE-RIGHT-DIRECTION observation of
# the ELS recompute: a tombstone that fails to strip the Dead row leaves `permanent=1`
# and REDS. It is also the death-scoped reading the registry's own rationale sentence
# above already warranted - "stopping the Effective Ledger Set from re-deriving a
# reservation and a stand-in for a corpse the merged timeline says never died" - which
# is about the CORPSE's derivation, not about the kerbal's name never appearing again.
# `CL-3` claims this cell from `2026-08-05`. The `permanent=`/`temporary=` terms first
# ship with that branch's DLL, so the same-PR confirm fly is the live proof of the
# token's exact shape. Full forensic write-up in docs/dev/todo-and-known-bugs.md.
#
# `tombstone-rep-penalty` IS UNREACHABLE BY ANY FLIGHT, not merely uncovered
# (2026-08-02, CL stage B; mechanical, re-check by grep before ever claiming it).
# The cell needs a `GameActionType.ReputationPenalty` action in the supersede subtree.
# `Source/Parsek/` has exactly ONE PRODUCTION construction site for that type (the only other occurrence in the tree is a synthetic in-game-test fixture, `InGameTests/RuntimeTests.cs`, which builds one with `RepPenaltySource = Other` and is not a flight path) -
# `GameActions/GameStateEventConverter.cs` (the Bail-Out Grant), which hardcodes
# `RepPenaltySource = ReputationPenaltySource.Strategy`. No code path ever constructs
# a `ReputationPenaltySource.KerbalDeath` action, so a crew death produces NO Parsek
# rep row: stock applies the hit directly (`Added -9.999828 (-10) reputation:
# 'VesselLoss'.`, measured by CL-1 and CL-2) and the ledger absorbs it through the
# generic captured-award path, which is not a `GameAction` and cannot be tombstoned.
# `TombstoneEligibility.TryPairBundledRepPenalty` therefore has nothing to pair on a
# flown death - and note it is called ONLY from `SupersedeCommit`'s autoseal /
# retry-blocking classifier (`IsWorldStateChangingRecordingAction`), NEVER from
# `CommitTombstones`, which gates on `IsSupersedeTombstoneEligible`. So the older
# note naming it "the named producer" for this cell was doubly wrong: it produces no
# tombstone, and its input never exists.
# UNBLOCKING IT IS A PRODUCT CHANGE, NOT A FLIGHT: Parsek would have to construct a
# KerbalDeath rep penalty on crew death, which moves CL-2's armed ledger totals and
# so belongs in its own PR with its own oracle re-pin.
values = ["reservation-auto-hire", "stand-ins", "seat-matching", "rescue-marker",
