# end, measured via the GhostRenderTrace MeshSpawned/MeshDestroyed pair plus the
# ghostLifecycle balance evaluator. No existing value stretches to mean it:
# `basic-playback` asserts a replay RAN and `recorded-vs-rendered-parity`
# compares positions WHILE rendered; neither says anything about ghosts
# appearing or being DERENDERED, which is exactly the observed regression class
# (booster ghosts never rendering after separation / lingering past playback)
# this value exists to pin.
# "watch-entry-distance-cutoff" (added with W1-watch-distance-cutoff, per the same
# growth rule): watch-mode ENTRY is refused when the ghost is at or beyond
# `WatchModeController.WatchEnterCutoffMeters` (300 km) from the active vessel ON THE
