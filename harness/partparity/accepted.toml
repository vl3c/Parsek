# Part ghost parity: the accepted differences (design docs/dev/design-part-ghost-parity.md
# section 10, Appendix F). Every entry names the ruling or open todo that owns it. A fix that
# removes a difference removes its entry and re-pins the baseline in the same commit
# (harness/tools/part_parity_baseline.py). Keys: case (exact case id), profile (optional),
# view (* | a view | event:<view> | start:<view>), measure (shape-blob | color-blob | iou |
# structure | skin | flag:<flag>[*] | *), noisy (the measure moves run to run, so the drift
# rule is waived for it too; otherwise only the fail verdict is waived and drift still gates),
# reason, todo.

schema = 1

