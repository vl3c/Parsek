# Declared param schema for mission rf12s_refly_orbit_insert (the RF-12S re-fly
# orbit-insertion burn; see the machine header in mlib: `rfo_decide`).
#
# run.py parses this with tomllib and injects it into hlib's pure validator, which
# checks required-key presence and per-value type/range. Every value is a target /
# tolerance / bound, never a golden trajectory. None is required: the defaults are
# the ones the machine header's burn sweep chose for `refly-autopilot-recorded`.

# Surface-frame AP attitude held for the whole burn (kRPC target_pitch_and_heading).
# Negative pitch trades the restored stack's surplus vertical speed for horizontal.
[params.pitchDeg]
required = false
type = "number"
min = -45.0
max = 45.0

[params.headingDeg]
required = false
type = "number"
min = 0.0
max = 360.0

[params.throttle]
required = false
type = "number"
min = 0.05
max = 1.0

# The burn ends when the orbit's periapsis ALTITUDE clears this (Kerbin's atmosphere
# tops out at 70 km), read on periapsisDebounceFrames consecutive frames.
[params.targetPeriapsisMeters]
required = false
type = "number"
min = 70000.0

[params.periapsisDebounceFrames]
required = false
type = "int"
min = 1
max = 20

# The first-frame handoff gate: an AIRBORNE craft above this altitude with at least
# minCrew aboard, i.e. the restored crewed stack and not whatever else is active.
[params.minStartAltitudeMeters]
required = false
type = "number"
min = 0.0

[params.minCrew]
required = false
type = "int"
min = 0
max = 16

# FRAME bounds (post-rewind, so never game seconds): ignition must read thrust within
# igniteFrames of the stage command, and the whole burn within burnFrames.
[params.igniteFrames]
required = false
type = "int"
min = 1
max = 1000

[params.burnFrames]
required = false
type = "int"
min = 1
max = 10000

# THE PITCH PROGRAM (RF-13; see the machine header in mlib). raiseApoapsisMeters > 0
# swaps the single fixed-pitch burn for RAISE (hold raisePitchDeg until the apoapsis
# clears raiseApoapsisMeters) -> COAST (throttle 0 until vertical speed drops to
# circStartVerticalSpeedMps) -> BURN (circularize on a vertical-speed pitch law).
# 0 (the default) keeps RF-12S's single burn.
[params.raiseApoapsisMeters]
required = false
type = "number"
min = 0.0

[params.raisePitchDeg]
required = false
type = "number"
min = 0.0
max = 90.0

[params.circStartVerticalSpeedMps]
required = false
type = "number"
min = -200.0
max = 500.0

# Degrees of pitch per m/s of fall during the circularization burn, clamped to
# [circPitchMinDeg, circPitchMaxDeg].
[params.circPitchGainDegPerMps]
required = false
type = "number"
min = 0.0
max = 10.0

[params.circPitchMinDeg]
required = false
type = "number"
min = -45.0
max = 45.0

[params.circPitchMaxDeg]
required = false
type = "number"
min = 0.0
max = 90.0

# FRAME bound on the coast to the circularization start.
[params.coastFrames]
required = false
type = "int"
min = 1
max = 10000
