# Declared param schema for mission r1_rewind_loop (the rewind-loop lane).
#
# hlib.validate_spec does NOT read this file itself: run.py (shell / I/O) parses
# every harness/missions/<mission>.schema.toml with tomllib into a registry
# { mission-name -> schema-dict } and INJECTS it as validate_spec's
# `mission_schemas` argument. hlib's PURE validator (_validate_mission_params)
# then drives required-key presence and per-value type/range checks from the
# `params` table below.
#
# The ASCENT half is the b2_lko_ascent schema VERBATIM (the machine delegates to
# mlib.b2_decide over the same dict, so the same keys must be required with the
# same bounds); the rewind half adds the InvokeRewind target, the three FRAME
# budgets, and the two OBSERVED-gate thresholds. Every value is a target /
# tolerance / budget, never a golden trajectory.

# ---- ascent leg (delegated b2_decide; keys identical to b2_lko_ascent) ----

[params.targetApoapsisMeters]
required = true
type = "number"
min = 0.0

[params.targetPeriapsisMeters]
required = true
type = "number"
min = 0.0

[params.apoErrorMeters]
required = true
type = "number"
min = 0.0

[params.periErrorMeters]
required = true
type = "number"
min = 0.0

[params.eccentricityMax]
required = true
type = "float"
min = 0.0
max = 1.0

[params.inclinationErrorDeg]
required = true
type = "number"
min = 0.0

[params.ascentTimeoutSeconds]
required = true
type = "number"
min = 0.0

[params.circularizeTimeoutSeconds]
required = true
type = "number"
min = 0.0

[params.launchSiteLatitude]
required = false
type = "float"
min = -90.0
max = 90.0

[params.frozenTelemetrySamples]
required = false
type = "int"
min = 2
max = 1000

# ---- rewind leg ----

# The InvokeRewind target. REQUIRED: ParsekTestCommandAddon.InvokeRewindImpl
# matches RewindPoint.RewindPointId EXACTLY and answers REJECTED unknown-rp
# otherwise, so an absent id can only ever produce a rejected verb. mlib's
# R1Params carries a -1 UNREAD sentinel on the SLOT so the machine ALSO fails
# closed on frame 1 (`rewind-target-unresolved`) if a future caller bypasses this
# schema. The ID no longer carries one (R10): an EMPTY rewindPointId is the legal
# spelling of "resolve it at runtime" - the RESOLVE phase issues
# `ListHandles kind=rewindpoints` and folds the selected member's live Guid into
# InvokeRewind. Still `required = true`, because a spec must SAY which of the two
# modes it wants rather than getting one by omission.
[params.rewindPointId]
required = true
type = "string"

[params.rewindSlot]
required = true
type = "int"
min = 0

# WHICH member of the ListHandles enumeration the RESOLVE phase picks. Read ONLY
# when rewindPointId is empty; ignored otherwise. "last" (the default) is
# rp<count-1> - RewindPoints are in APPEND order, so that is the NEWEST, the one a
# just-flown ascent authored. "first" is rp0. Any other spelling is a frame-1
# give-up, never a silent fallback to a member the author did not choose.
[params.rewindPointSelect]
required = false
type = "string"

# RESOLVE's frame bound, sized like the other post-ascent phases above and for the
# same reason (a game-time budget cannot bound a phase whose clock may run
# backward).
[params.resolveFrames]
required = false
type = "int"
min = 1
max = 10000

# FRAME budgets for the post-ascent phases. Frames, NOT game seconds: past the
# rewind the game clock runs BACKWARD, so a `ut - phase_entry_ut` budget can never
# expire and the phase would hang with no named give-up.
[params.commitFrames]
required = false
type = "int"
min = 1
max = 10000

# STOP (seam StopRecording) and RECORDER-IDLE (seam RecordingState polling until
# the reply reads recording=false). Both exist because of the flight-1 failure:
# `TestCommandDispatcher` REJECTS InvokeRewind with `recording-active` while a
# recorder is live, and the commit-then-keep-flying promotion re-arms one ~14 ms
# after CommitTree returns OK. idleFrames bounds the poll; each frame either
# issues a probe or reads its reply, so it is ~half that many probes.
[params.stopFrames]
required = false
type = "int"
min = 1
max = 10000

[params.idleFrames]
required = false
type = "int"
min = 1
max = 10000

[params.rewindFrames]
required = false
type = "int"
min = 1
max = 10000

[params.verifyFrames]
required = false
type = "int"
min = 1
max = 10000

# THE OBSERVED GATE: seconds the game clock must have run BACKWARD before the
# rewind counts as having happened. Any positive value proves an earlier state
# was loaded; the floor keeps float noise or a sub-second read from qualifying.
[params.minUtRegressionSeconds]
required = false
type = "number"
min = 0.001

# Corroboration: metres the post-rewind altitude must differ from the pre-rewind
# altitude for the WORLD state (not merely the clock) to read as having changed.
# A situation change satisfies the same row on its own.
[params.minAltitudeChangeMeters]
required = false
type = "number"
min = 0.0

# ---- closing the loop (the SECOND flight) ----
#
# A rewind that is never flown again is only HALF a loop, and it is the half that
# leaves the re-fly's provisional recording EMPTY - which makes
# SupersedeCommit.ValidateSupersedeTarget refuse to write any supersede rows
# (`reason=empty Points`). Flight 2 (2026-07-26) rewound perfectly and still red
# the run on exactly that. These four drive the relaunch and gate it on two
# OBSERVED facts: the craft CLIMBED, and the climb was RECORDED.

[params.relaunchThrottle]
required = false
type = "float"
min = 0.0
max = 1.0

# A FLOOR, not a target altitude: metres gained over the post-rewind reading
# before the relaunch counts as powered flight. A craft sitting on the pad with a
# dead engine can never cross it, which is the whole point - "we sent throttle" is
# a commanded reading, climbing is an observed one.
[params.relaunchMinAltitudeGainMeters]
required = false
type = "number"
min = 1.0

[params.relaunchFrames]
required = false
type = "int"
min = 1
max = 10000

# Bound on the post-rewind RecordingState poll (`points > 0`).
[params.loopPointsFrames]
required = false
type = "int"
min = 1
max = 10000

# ---- the RE-FLY CONCLUSION PROFILE (opt-in; off by default) ----
#
# A closed loop still leaves the re-fly's provisional recording UNCONCLUDED, and
# `SupersedeCommit.ValidateSupersedeTarget` refuses a provisional whose
# `TerminalStateValue` is null - which is why nine in-game `Rewind` cells skip.
# With this on, the mission rides PAST LOOP-CLOSED: it cuts the throttle and waits,
# debounced and bounded, for the re-flown craft to be DESTROYED or to read landed,
# then ends the mission IN FLIGHT with the Re-Fly session marker still live and
# nothing committed - the scenario's own post-mission steps close the tree.
#
# MEASURED, and it is why a DESTRUCTION is the outcome this profile is built for:
# `TerminalState.Landed` is stamped only at finalization
# (`ParsekFlight.FinalizeTreeRecordings`), never on the frame the wheels touch,
# while `TerminalState.Destroyed` is stamped with the scene still FLIGHT by
# `ParsekFlight.TerminalEvents.ApplyTerminalDestruction`.
#
# NO `min` / `max` HERE: bounds are consulted only inside hlib's numeric branch, so
# a bound on a bool reads as checked and checks nothing (the repo-wide sweep
# `test_bounds_are_only_declared_on_types_that_consult_them` reds on one).
[params.reflyConclusionProfile]
required = false
type = "bool"

# CONCLUDE-COAST's bound. FRAMES, not game seconds, and the choice is forced twice:
# every post-ascent phase in this machine is frame-bounded (see the rewind-leg
# header above), and the destruction this wait exists for is the very event that
# stops telemetry being readable - a `ut`-derived budget would freeze exactly when
# the give-up matters. At the runner's 0.5 s poll the default 900 is ~450 s.
[params.reflyConclusionFrames]
required = false
type = "int"
min = 1
max = 10000

# The situations that count as the LANDED conclusion (default LANDED + SPLASHED).
# Gated on having been airborne first: KSP reports `situation = LANDED` on a
# climbing craft for the first ~30 s (MEASURED on GS-1 flight 1 at alt 230 m,
# +113 m/s), so an ungated read would conclude a flight that had not happened. An
# EMPTY list is refused BY NAME on frame 1 rather than silently replaced by the
# default (`mlib.r1_refly_conclusion_profile_conflict`).
[params.reflyConclusionSituations]
required = false
type = "list"
