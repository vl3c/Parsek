# Declared param schema for mission m3_loop_arrival_dwell (the Tier-2
# loop-arrival map dwell). Consumed by run.py's schema registry and driven by
# hlib._validate_mission_params; shape:
#   {"params": {"<name>": {"required": bool, "type": "<t>", "min": <num?>, "max": <num?>}}}
#
# The three *OffsetSeconds are RECORDED-UT deltas from the committed
# recording's own start (pinned per fixture from its flown segment table);
# the machine adds the MissionConfig-returned loop anchor to each. Every
# value is a tolerance / threshold / budget or a pinned recorded offset,
# never a golden trajectory.

[params.treeId]
required = true
type = "string"

[params.departOffsetSeconds]
required = true
type = "number"
min = 0.0

[params.arriveOffsetSeconds]
required = true
type = "number"
min = 0.0

[params.parkOffsetSeconds]
required = true
type = "number"
min = 0.0

[params.loopIntervalSeconds]
required = false
type = "number"
min = 0.0

[params.dwellLeadSeconds]
required = false
type = "number"
min = 0.0

[params.dwellHoldSeconds]
required = false
type = "number"
min = 0.0

# TYPE SPELLING: `bool`, NOT `boolean`. The accepted spellings are exactly
# `hlib.MISSION_PARAM_TYPES`, and that list is CLOSED -- it is deliberately NOT
# restated here, so there is nothing to leave stale when it changes. `boolean` fell
# through the entire if/elif chain and returned no errors, so the declaration
# validated ANY value -- a string, a list, 7. That is worse than no declaration,
# because it LOOKS checked. Guarded by test_hlib.MissionSchemaDeclaredTypeTests.
# V3F and V3R set `mapCamera = false` and V2 omits it (mlib defaults it True), so
# every committed value is a real bool and the check is live.
[params.mapCamera]
required = false
type = "bool"

[params.cameraFocusBody]
required = false
type = "string"

[params.cameraPitchDeg]
required = false
type = "number"

[params.cameraHeadingDeg]
required = false
type = "number"

[params.cameraDistanceMeters]
required = false
type = "number"
min = 0.0

[params.armTimeoutSeconds]
required = false
type = "number"
min = 0.0

[params.cameraTimeoutSeconds]
required = false
type = "number"
min = 0.0

[params.holdTimeoutSeconds]
required = false
type = "number"
min = 0.0

# --- THE RAILS WARP STAIR (M-A7 RC-WARP), FLAG-GATED AND INERT BY DEFAULT ---
# Omit `dwellRampFactors` (or give it []) and the machine is byte-identically
# the pre-RC-WARP one: no stair branch, no extra action, no extra assertion
# row. V2 / V3F / V3R all omit it and are unchanged.
#
# Declared non-empty, EACH of the three dwell windows (depart / arrive / park)
# climbs and descends the COMMANDED rails ladder before its 1x hold, which is
# the only drive shape in the suite that can put anything but `warp1x` in the
# manifest's warp histogram - the thing RC-WARP exists to assert on and that
# no `TimeJump`-driven lane can ever produce. Factor indices are COMMANDED
# (KSP rails 0=1x, 1=5x, 2=10x, 3=50x, 4=100x, 5=1000x); the server clamps to
# legality and the machine never gates on an achieved rate, exactly as V1's
# DWELL-WARP-RAMP does not.
[params.dwellRampFactors]
required = false
type = "list"

[params.dwellRampStepFrames]
required = false
type = "int"
min = 1
max = 1000

[params.dwellRampFrames]
required = false
type = "int"
min = 1
max = 100000
