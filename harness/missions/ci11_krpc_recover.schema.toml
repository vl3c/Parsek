# Declared param schema for mission ci11_krpc_recover (CI-11: the player recovers a
# Real-Spawned chain tip they are not flying, through kRPC's Vessel.Recover). run.py
# parses this with tomllib and injects it as validate_spec's `mission_schemas`
# argument. Only DECLARED params are checked.

# The vessel to recover. Exactly one vessel with this name must exist; none or
# several refuses and asks nothing (a MISSION-ASSERT-FAIL, driver-INVALID).
[params.targetName]
required = true
type = "string"

# KR-START dwell in game seconds before the ask (the spawned vessel loads).
[params.startSettleSeconds]
required = false
type = "number"
min = 0.0

# Polls (0.5 s each) to wait for the perform-seam token before flaking.
[params.requestTimeoutFrames]
required = false
type = "int"
min = 1
max = 10000

# Polls to wait for FLIGHT to be torn down after the issue before flaking.
[params.sceneTimeoutFrames]
required = false
type = "int"
min = 1
max = 100000

# CONSECUTIVE vessel_lost polls that prove the scene left FLIGHT.
[params.sceneLostFrames]
required = false
type = "int"
min = 1
max = 100
