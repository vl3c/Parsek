# Declared param schema for mission air3_drone_intercept (the AIR-3 lane: roll
# `AIR Drone Carrier` - the stock Mallard with a parachute drone under its right wing -
# out onto the Runway, take off and climb out exactly as AIR-1 does, climb on over the
# sea, release the drone level, extend, turn back and fly the Mallard into the drone).
#
# Consumed exactly like every sibling schema: run.py parses it into the
# { mission -> schema } registry and hlib's pure _validate_mission_params reads the
# `params` table and nothing else. min/max are consulted only on numeric types.
# Every default lives in `mlib.ax_params_from_dict` (which reads AIR-1's keys through
# `mlib.air_params_from_dict`). The AIR-1 keys below keep AIR-1's meaning verbatim.

# The craft FILE launched (`<save>/Ships/VAB/<craftName>.craft`). Required: the machine
# refuses to roll out an empty name.
[params.craftName]
required = true
type = "string"

# What the ACTIVE VESSEL must read back before the machine stages anything: the
# `ship = ` line inside the craft file. Defaults to craftName.
[params.expectedVesselName]
required = false
type = "string"

# kRPC launch site. Defaults to "Runway".
[params.launchSite]
required = false
type = "string"

# Frame bound on the rollout's read-back gate before the machine gives up by name.
[params.rolloutFrames]
required = false
type = "int"
min = 1
max = 10000

# Frames between the stage click (the auto-record trigger) and the brake release, so
# the recorder's first samples are the plane standing on the runway.
[params.recordSettleFrames]
required = false
type = "int"
min = 1
max = 600

# Surface speed (m/s) at which the elevator starts raising the nose to rotatePitch (the
# AutoPilot stays off and the nose wheel keeps steering until airborne is sustained).
# Default 45: the first flight's Mallard was already lifting at 0.5 deg of pitch by
# 43-47 m/s (2026-11-16_1955).
[params.rotateSpeed]
required = false
type = "float"
min = 20.0
max = 200.0

# Pitch (deg above the horizon) the elevator holds from rotation until airborne is
# sustained (control.pitch from the pitch error, AutoPilot off).
[params.rotatePitch]
required = false
type = "float"
min = 0.0
max = 20.0

# +1 = a positive kRPC control.pitch raises the nose; -1 = the opposite. Unverified
# offline; the machine flips it once on the rotation if the pitch keeps falling under a
# nose-up command.
[params.rotatePitchSign]
required = false
type = "float"
min = -1.0
max = 1.0

# Ground roll (m from the brake release) after which a plane still on the runway is a
# named give-up: throttle cut, brakes on, MISSION-FLAKE. The runway is ~2.4 km long.
[params.takeoffMaxDistance]
required = false
type = "float"
min = 300.0
max = 2400.0

# Pitch (deg) held in the straight climb-out up to turnAltitude.
[params.climbPitch]
required = false
type = "float"
min = 2.0
max = 25.0

# Altitude (m above the surface) where the straight climb-out ends; AIR-3's loiter climb
# to releaseAltitude begins there.
[params.turnAltitude]
required = false
type = "float"
min = 60.0
max = 5000.0

# Airspeed (m/s) target on the loiter climb.
[params.cruiseSpeed]
required = false
type = "float"
min = 40.0
max = 300.0

# Ground distance (m) inside which a loiter point counts as reached (or three times
# that, flown abeam).
[params.captureRadius]
required = false
type = "float"
min = 100.0
max = 5000.0

# Largest bank (deg) commanded in a turn (limited further below 150 m).
[params.maxBank]
required = false
type = "float"
min = 5.0
max = 60.0

# +1 = a positive bank target (in the surface-frame roll READING) banks right; -1 = the
# opposite. The third flight (2026-11-16_2126) read roll -38 while the heading fell
# 090 -> 072, so +1 is right; the machine still flips it once in flight if a turn's
# heading error grows under a bank.
[params.bankSign]
required = false
type = "float"
min = -1.0
max = 1.0

# +1 = a positive kRPC control.roll raises the roll reading (rolls right); -1 = the
# opposite. Unverified offline; the machine confirms it on a 1.5 deg response the
# commanded way, or flips it once on two frames of opposite response.
[params.rollInputSign]
required = false
type = "float"
min = -1.0
max = 1.0

# Ground roll nose-wheel steering: kRPC wheel_steering per deg of heading error to the
# runway heading (plus a fixed damping term), clamped to 0.5 either way.
[params.groundSteerGain]
required = false
type = "float"
min = 0.0
max = 1.0

# +1 = kRPC's documented wheel_steering sign (+1 steers left, so a right turn is a
# negative value); -1 = the opposite. The machine flips it once on the roll if the
# heading error keeps growing under a corrective command.
[params.groundSteerSign]
required = false
type = "float"
min = -1.0
max = 1.0

# Heading error (deg) to the runway heading at which a plane still on the ground gives
# up by name: throttle cut, brakes on, MISSION-FLAKE naming the drift.
[params.groundHeadingAbortDeg]
required = false
type = "float"
min = 0.5
max = 45.0

# ---- AIR-3's own keys (mlib.ax_params_from_dict) ----

# The drone's vessel name, as the sibling watch the release arms matches it. KSP names
# a split-off probe-cored vessel "<ship> Probe" (GS-1 read "GS1 Auto-Chute Booster
# Probe"). Defaults to expectedVesselName + " Probe".
[params.targetVesselName]
required = false
type = "string"

# The loiter leg the climb to releaseAltitude flies between (two "lat,lon" points over
# the sea east of KSC, swapped on capture), so the climb stays inside the Space
# Center's 25 km ghost range.
[params.loiterPoints]
required = false
type = "string"

# Altitude (m) of the release; the Mk16's own full-deploy altitude is 2400 m (the
# craft builder's CHUTE_DEPLOY_ALTITUDE), so the canopy opens seconds after it.
[params.releaseAltitude]
required = false
type = "float"
min = 500.0
max = 4000.0

# The release waits until the plane is east of this longitude (over the sea).
[params.releaseMinLongitude]
required = false
type = "float"
min = -180.0
max = 180.0

# Seconds of straight flight after the release and after every missed pass, before the
# turn back toward the drone.
[params.extendSeconds]
required = false
type = "float"
min = 5.0
max = 120.0

# Surface speed (m/s) the pursuit holds.
[params.pursueSpeed]
required = false
type = "float"
min = 50.0
max = 150.0

# Degrees of bank per degree of heading error in the pursuit (clamped to maxBank).
[params.pursueBankGain]
required = false
type = "float"
min = 0.5
max = 6.0

# Range (m) inside which an approach counts: a range that opens again after coming
# inside it is a missed pass, and so is an approach pointed at the drone inside it
# that is not closing at minClosingSpeed.
[params.approachGate]
required = false
type = "float"
min = 300.0
max = 5000.0

# Closing speed (m/s) an approach inside approachGate must hold.
[params.minClosingSpeed]
required = false
type = "float"
min = 5.0
max = 100.0

# The last range read (m) under which a part-count drop, a drone gone or a chaser lost
# is THE collision; anything farther is a named give-up.
[params.collisionRange]
required = false
type = "float"
min = 20.0
max = 1000.0

# Missed passes before the lane gives up.
[params.maxAttempts]
required = false
type = "int"
min = 1
max = 10

# The drone's altitude (m) under which the pursuit gives up (low passes over the sea).
[params.minTargetAltitude]
required = false
type = "float"
min = 50.0
max = 1500.0

# The drone farther than this (m) is a give-up.
[params.maxRange]
required = false
type = "float"
min = 1000.0
max = 25000.0

# Seconds after the collision before the mission may end, and the bound on waiting for
# both vessels to be down or gone.
[params.aftermathMinSeconds]
required = false
type = "float"
min = 0.0
max = 600.0

[params.aftermathTimeoutSeconds]
required = false
type = "float"
min = 60.0
max = 1200.0
