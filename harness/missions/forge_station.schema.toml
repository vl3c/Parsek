# Declared param schema for mission forge_station (the FIXTURE-FORGE runner;
# B-DOCK design section 2 + the 2026-07-22 operator-principle override).
#
# run.py parses this file with tomllib and injects it as validate_spec's
# `mission_schemas` argument; hlib's pure _validate_mission_params drives
# required-key presence + per-value type/range from the `params` table. Only
# DECLARED params are checked (extras are ignored), and every value is a budget /
# debounce depth, never a golden trajectory.

# The craft to launch onto the pad (resolves <save>/Ships/VAB/<craftName>.craft).
[params.craftName]
required = true
type = "string"

# The launch site (kRPC launch_vessel launch_site). Optional; defaults LaunchPad.
[params.launchSite]
required = false
type = "string"

# Game-seconds to see the newly launched craft settle in a settle situation
# before the FORGE flakes (mlib.ForgeParams defaults 300).
[params.launchTimeoutSeconds]
required = true
type = "number"
min = 0.0

# Optional: consecutive settled (PRELAUNCH-on-pad) frames before the forge
# declares the craft settled (mlib.ForgeParams defaults 3).
[params.settleDebounceFrames]
required = false
type = "int"
min = 1
max = 100

# Optional: explicit KERBAL NAMES to seed the pod, e.g.
# crewNames = ["Valentina Kerman", "Bob Kerman", "Bill Kerman"]. Omitted / empty
# = KSP's default crew assignments (crew=[]). By NAME, never a count: kRPC 0.5.4
# exposes no roster-enumeration API to resolve a count to names, only
# get_kerbal(name) + launch_vessel(crew: List[str]). Used by the EVA-3 3-crew
# pad fixture (FORGE-eva3-pad.toml) the same forge produces.
[params.crewNames]
required = false
type = "list"

# Minimum kerbals that must READ aboard before the pad settle may complete (and
# the crewAboard assertion's floor). OMITTED = defaults to len(crewNames), so a
# forge that requests names is gated on ALL of them unless it explicitly opts
# out; an explicit 0 disables the gate. Any positive value fails CLOSED on the
# -1 unread sentinel. The gate exists because kRPC launch_vessel does NOT fail
# when a requested name cannot be seated (e.g. the kerbal is already Assigned
# in the boot save) -- it silently launches an EMPTY pod and leaves the kerbal
# Missing, which is how the gs1-two-stage-pad fixture was originally stamped
# with an empty Mk1 pod (measured 2026-08-11 on the first b18-dres-pad forge
# run; re-forged crewed 2026-08-12). With the gate armed, the forge flakes ON
# THE PAD naming the crew shortfall instead.
[params.minCrew]
required = false
type = "int"
min = 0
max = 16
