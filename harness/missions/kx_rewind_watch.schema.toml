# Declared param schema for mission kx_rewind_watch (the ghost-render-lifecycle
# lane: fly a staged Kerbal X, commit, Rewind-to-LAUNCH, launch a watcher onto the
# pad, and watch the first flight replay as a ghost).
#
# hlib.validate_spec does NOT read this file itself: run.py (shell / I/O) parses
# every harness/missions/<mission>.schema.toml with tomllib into a registry
# { mission-name -> schema-dict } and INJECTS it as validate_spec's
# `mission_schemas` argument. hlib's PURE validator (_validate_mission_params)
# then drives required-key presence and per-value type/range checks from the
# `params` table below. Shape consumed by hlib:
#   {"params": {"<name>": {"required": bool, "type": "<t>", "min": <num?>, "max": <num?>}}}
# where <t> in {float, int, number, window, list, string, bool}. hlib reads
# `params` and NOTHING else, and it consults min/max only on the numeric types -
# a bound on a string/list/window declaration reads as checked and checks nothing
# (both pinned by hlib's MissionSchemaDeclaredTypeTests).
#
# NOTHING HERE IS REQUIRED. Every key has a live default in
# `mlib.kxrw_params_from_dict`, and the machine's fail-closed behaviour does not
# depend on any of them being declared: an omitted key takes the default, and the
# two defaults that could bite (the fueled-core throttle epsilon and the playback
# frame cap) are both bounds rather than permissions. A spec that wants a
# different flight length or a different watcher declares only what it changes.
# Every value is a WINDOW / threshold / budget, never a golden trajectory.

# ---- craft + site -------------------------------------------------------------

# The craft flown, recorded, committed and then REPLAYED. `Kerbal X` is the
# committed fixture at harness/fixtures/ships/, and the machine's staging plan is
# derived from THAT file's inverse stages (istg 6/5/4/3/2). Pointing this at a
# craft with a different staging layout without re-reading the machine header is
# how a green run stages the wrong thing.
#
# IT IS A FILE NAME, NOT A VESSEL NAME. `launch_vessel` resolves
# `<save>/Ships/VAB/<craftName>.craft`; the name the ACTIVE VESSEL reads back is
# the `ship = ` line INSIDE that file, and the two are only equal by coincidence.
# See rolloutExpectedVesselName below for the identity half of the gate.
[params.craftName]
required = false
type = "string"

# THE EXPECTED VESSEL NAME for the ROLLOUT gate: what the ACTIVE VESSEL must READ
# BACK (after .strip()) before the machine will stage anything, because
# `activate_next_stage` stages whatever is active and this lane's own save
# pre-places a different craft on the pad. Defaults to `craftName`.
#
# IT IS DECLARED SEPARATELY BECAUSE STOCK CRAFT FILES SHIP A LOCALIZATION TOKEN AS
# THEIR SHIP NAME. `Jumping Flea.craft` opens `ship = #autoLOC_501224`, and KSP
# never localizes it on the way out - `ShipConstruct.LoadShip` / `Vessel.GetName`
# hand the raw token to kRPC and the save persists `name = #autoLOC_501224`. So on
# a stock craft the FILE name and the VESSEL name differ, a gate that compares
# against the file name never settles, and the phase deadlocks into its give-up on
# EVERY run. That coincidence is a trap for every future stock-craft lane: a lane
# flying a stock craft either declares the `#autoLOC_*` token here or re-authors
# the fixture's `ship =` line (which is what this lane did to its Jumping Flea).
# The give-up text names both the file and the expected name, and says so.
[params.rolloutExpectedVesselName]
required = false
type = "string"

# The pad/runway kRPC launches BOTH craft from (SpaceCenter.launch_vessel's
# launch_site): the ROLLOUT puts `craftName` here, and after the rewind the
# WATCHER-LAUNCH puts `watcherCraftName` here too. One site for both is
# deliberate - the watcher has to come up where the recorded flight did, or the
# ghost replays somewhere it cannot be seen from.
[params.launchSite]
required = false
type = "string"

# The craft launched onto the (now clear) pad AFTER the rewind, from which the
# replay is watched. It is never flown: it exists so the flight scene has a live
# vessel, because a ghost needs somewhere to be watched FROM. Small and
# cheap-to-launch is the whole specification - `Jumping Flea` is the stock choice.
# It must exist as <save>/Ships/VAB/<name>.craft or launch_vessel raises. A FILE
# name, like craftName; the identity half is watcherExpectedVesselName.
[params.watcherCraftName]
required = false
type = "string"

# THE EXPECTED VESSEL NAME for the WATCHER-READY gate - the same discipline as the
# rollout, and for the same reason (a launch is a scene reload, so "a craft on the
# pad in PRE_LAUNCH" was already true of whatever it replaced). Defaults to
# `watcherCraftName`. Same #autoLOC trap as rolloutExpectedVesselName above, and
# this is the param it actually bit: the committed
# `fixtures/saves/gs1-two-stage-pad/Ships/VAB/Jumping Flea.craft` shipped
# `ship = #autoLOC_501224` (stock's own line) while the gate compared against
# "Jumping Flea", so WATCHER-READY could only ever burn its bound. The fixture now
# reads `ship = Jumping Flea`; this key is what makes the next such craft a
# one-line declaration instead of a re-authored fixture.
[params.watcherExpectedVesselName]
required = false
type = "string"

# ---- rollout ------------------------------------------------------------------

# Frames in which the rolled-out craft must become the ACTIVE vessel, reading back
# `craftName` in a `rolloutReadySituations` situation. Generous: it spans a full
# FLIGHT scene reload (kRPC's LaunchVessel recovers the pad occupant and brings the
# subject up in its place), every frame of which arrives vessel_lost.
[params.rolloutFrames]
required = false
type = "int"
min = 1
max = 10000

# Situations the ROLLED-OUT craft must read. PRE_LAUNCH only, and deliberately
# NARROWER than watcherReadySituations: a craft that is already LANDED or FLYING is
# not one that just rolled out, and accepting those would let the gate pass on the
# very pad occupant the rollout exists to replace.
[params.rolloutReadySituations]
required = false
type = "list"

[params.rolloutReadyDebounceFrames]
required = false
type = "int"
min = 1
max = 50

# ---- ascent -------------------------------------------------------------------

[params.launchThrottle]
required = false
type = "float"
min = 0.0
max = 1.0

# The gravity-turn program: 90 deg (straight up) below turnStartAltitudeMeters,
# turnFinalPitchDeg at and above turnEndAltitudeMeters, linear in between, on
# turnHeadingDeg. A PROGRAM, not a trajectory: nothing asserts the resulting
# track, and the only thing riding on it is that the flight leaves the pad and
# gains altitude for a few minutes so there is a real recording to replay.
[params.turnStartAltitudeMeters]
required = false
type = "number"
min = 0.0

[params.turnEndAltitudeMeters]
required = false
type = "number"
min = 0.0

[params.turnFinalPitchDeg]
required = false
type = "number"
min = -90.0
max = 90.0

[params.turnHeadingDeg]
required = false
type = "number"
min = 0.0
max = 360.0

# Re-command the autopilot only when the programmed pitch has moved this far. A
# COST knob, not a flight knob: one RPC per poll for a value that changes by
# hundredths of a degree is pure waste, and the AP holds its last target between
# commands.
[params.pitchCommandStepDeg]
required = false
type = "number"
min = 0.0

# ---- staging ------------------------------------------------------------------

# Radial-decoupler stages fired between launch and the core drop. THREE on the
# committed Kerbal X (istg 5, 4 and 3, two decouplers each). This is a fact about
# the craft file, so it moves only when the craft does.
[params.boosterStageCount]
required = false
type = "int"
min = 0
max = 10

# Fraction of the PEAK available thrust at or below which the boosters read as
# flamed out. Peak-relative rather than absolute because LV-T45 available thrust
# RISES with altitude (vac ISP), so an absolute floor would be a bet on one
# altitude.
[params.boosterDropThrustFraction]
required = false
type = "float"
min = 0.0
max = 1.0

# The peak must first reach this before the fraction test above can fire - the
# "there WAS an engine" half of the reading (GS-1's pre_stage_thrust discipline).
# Without it the ignition frame's 0 N satisfies `0 <= 0 * fraction` and the
# boosters come off on the pad.
[params.boosterLiveThrustFloorNewtons]
required = false
type = "number"
min = 0.0

# Two BACKSTOPS, either of which arms the drop on its own: a craft whose thrust
# channel never moves must still shed its stages. Neither is a tuning knob.
[params.boosterDropBackstopAltitudeMeters]
required = false
type = "number"
min = 0.0

[params.boosterDropBackstopSeconds]
required = false
type = "number"
min = 0.0

# Frames held between a throttle cut and the stage click it precedes, so engine
# thrust has decayed before a decoupler blows (GS-1's stageSettleFrames verbatim,
# and GS-1 flight 2's collision is why it exists).
[params.stageSettleFrames]
required = false
type = "int"
min = 1
max = 50

# |throttle| at or below which the LIVE READBACK counts as OFF. THE fueled-core
# discard is gated on this reading, never on the cut having been commanded, so it
# is the one epsilon here that is about safety rather than tuning. An UNREAD
# (NaN) throttle is not zero.
[params.throttleZeroEpsilon]
required = false
type = "float"
min = 0.0
max = 1.0

# ---- the fueled-core discard, the coast, and the flight bound -----------------

# The core comes off when the orbit apoapsis reaches this OR the flight has run
# coreDiscardMaxFlightSeconds, whichever fires first. The clock arm is what keeps
# the RECORDED SPAN bounded - and the recorded span is what the playback wait
# later spends in REAL TIME, so these two numbers set the length of the whole run.
[params.coreDiscardApoapsisMeters]
required = false
type = "number"
min = 0.0

[params.coreDiscardMaxFlightSeconds]
required = false
type = "number"
min = 0.0

# Game seconds coasted on the remaining top stack (the Poodle is deliberately
# never ignited) before the seam bridge runs, so the recorder authors real
# post-separation coverage on BOTH halves of the split.
[params.coastSeconds]
required = false
type = "number"
min = 0.0

# Hard bound on the WHOLE pre-commit flight, measured from the launch click. ONE
# bound over the flight rather than a budget per phase: the ascent legitimately
# bounces between ASCENT and the staging phases, so a per-phase clock resets on
# every bounce and bounds nothing.
[params.flightMaxSeconds]
required = false
type = "number"
min = 0.0

# ---- the RF-9 coast exit (OPTIONAL; omitted = the pre-RF-9 lane) --------------
#
# WHAT IT CHANGES. With `coastExitProfile = true` the machine ends at COAST-EXIT,
# in FLIGHT, with the recorder live and the top stack coasting ABOVE the
# atmosphere: no CommitTree, no rewind, no watcher, no playback, and four
# assertion rows instead of eight. The SPEC's own `ExitToSpaceCenter` step is what
# commits the tree, so the committed recording spans an Atmospheric ->
# ExoBallistic boundary - which is the only boundary the optimizer's
# `PersistedPhaseChange` split predicate cuts on, and the split is the precondition
# of the sealing defect PR #1658 fixed. No other profile in this machine produces
# one: the ordinary lane commits from a still-atmospheric coast, and the impact
# profile flies the same stack into the ground.
#
# THE CORE MUST COME OFF LOW ENOUGH TO SPLIT AND HIGH ENOUGH TO CLIMB OUT. A lane
# declaring this profile raises `coreDiscardApoapsisMeters` above the atmosphere
# top (the default 60 km leaves the stack inside it for the whole flight, which is
# what GS-4 / GS-7 want and what makes their recordings single-environment) while
# leaving the discard itself in the atmosphere. That pair is the shape, and the
# gate below is what MEASURES the second half of it rather than assuming it.
#
# REFUSED WITH `impactProfile` or `partSweepSteps`, on the machine's FIRST decision
# frame - before a stage click, never after an ascent
# (`mlib.kxrw_coast_exit_profile_conflict` carries both arguments).
[params.coastExitProfile]
required = false
type = "bool"

# The altitude the hand-over gate wants. 71 km by default rather than 70: Kerbin's
# atmosphere ends at exactly 70 000 m, the point is to be OUTSIDE it, and a
# kilometre is margin against a poll landing on the boundary itself.
[params.coastExitMinAltitudeMeters]
required = false
type = "number"
min = 0.0

# Situations the gate accepts. `["SUB_ORBITAL"]` by default and by intent: an
# ORBITING stack has its periapsis outside the atmosphere, so its scene-exit tail
# is a closed orbit rather than the predicted impact that makes the promoted slot
# read `reason=crashed`.
[params.coastExitSituations]
required = false
type = "list"

# Consecutive in-gate frames before the hand-over. Debounced for the reason every
# gate in this machine is: one glitched poll must not end a flight.
[params.coastExitDebounceFrames]
required = false
type = "int"
min = 1
max = 50

# SILENCE bound for the gate, in frames. What it catches is a stack that never got
# there - an under-performing ascent, a core discarded too low - which is a MISSION
# give-up rather than a Parsek finding, and the flake says so by name.
[params.coastExitFrames]
required = false
type = "int"
min = 1
max = 10000

# ---- the GS-6 part-event sweep (OPTIONAL; omitted = the pre-GS-6 lane) --------
#
# THE SCRIPTED TIMELINE. `partSweepSteps` is an ordered list of step NAMES from
# the closed vocabulary in `mlib.KXRW_SWEEP_STEP_ACTIONS`; the machine fires one
# per settle window during the COAST-to-COMMIT window, on the craft that is still
# RECORDING, so each Parsek part-event family lands in the recording and its ghost
# REPLAY can be gated per family through the applier's
# `[GhostPartEvents] apply family=... applied=N` lines.
#
# OMITTING THE KEY IS THE PRE-GS-6 LANE, exactly. An empty list keeps COAST
# advancing straight to TREE-STATE (`mlib.kxrw_coast_next_phase`), so GS-4 and
# every other consumer runs the identical 22-phase sequence it always ran;
# PART-SWEEP is an OPT-IN phase, entered only on request.
#
# MUTUALLY EXCLUSIVE WITH `impactProfile` below, and refused by name on the
# machine's first decision frame: that profile needs the stack to fall unattended
# to the ground, and this vocabulary carries steps (`chutes-arm` / `chutes-deploy`,
# `throttle-up`, `engines-on`) that keep it alive - a survived stack reads to
# IMPACT-COAST exactly as a stalled clock does, so the give-up would name the
# product for a spec choice.
#
# THE VOCABULARY, and what each step is FOR (Parsek family in brackets):
#   gear-down / gear-up            [GearDeployed / GearRetracted]
#   lights-on / lights-off         [LightOn / LightOff]
#   deployables-out / -in          [DeployableExtended / DeployableRetracted]
#                                  (solar panels AND antennas AND radiators - one
#                                   step because Parsek records all three through
#                                   the same family pair)
#   bays-open / bays-close         [CargoBayOpened / CargoBayClosed]
#   converters-on / -off           [ConverterActivated / ConverterDeactivated]
#   rcs-on / rcs-off               [RCSActivated / RCSStopped]
#   chutes-arm / -deploy / -cut    [ParachuteSemiDeployed / ParachuteDeployed /
#                                   ParachuteCut]
#   throttle-up / throttle-zero    [EngineIgnited / EngineThrottle / EngineShutdown]
#   engines-on / engines-off       [EngineIgnited / EngineShutdown] by MODULE
#                                  ACTIVATION (kRPC Engine.active) rather than by
#                                  throttle - the only route to an engine the
#                                  staging plan never activates
#   brakes-on / brakes-off         (no Parsek family; for craft that bind a part
#                                   action to the Brakes group)
#   ag1 .. ag10                    the escape hatch: any part action the craft's
#                                  designer bound to a custom action group
#
# AN UNKNOWN NAME IS REJECTED, not skipped, in THREE places, and the first of them
# is the one that matters: `values` below is a CLOSED VOCABULARY hlib enforces at
# ADMIT, before a KSP process starts. Until 2026-09-02 it was only the machine's
# own COAST entry gate - which runs AFTER the ascent, so a typo burned a whole
# flight and then failed closed as an autopilot flake the retry policy would fly
# again. The third is a committed-spec cell in test_hlib that walks every spec's
# partSweepSteps against mlib's vocabulary and also pins `values` below EQUAL to
# it, so the two copies cannot drift. A silently-dropped step is a family that
# never fires, and the lane would then read as "the applier never logged it" -
# blaming the product for a spec typo.
#
# NOTHING HERE IS ASSERTED BY THE MISSION. Steps are COMMANDED; no readback gates
# any of them, and no sweep step can fail the mission. Whether the ghost replays
# the event is the SPEC's question (mission-vs-Parsek orthogonality: a mission
# that did not fly is driver-INVALID, never PARSEK-FAIL).
[params.partSweepSteps]
required = false
type = "list"
# PINNED EQUAL to mlib.KXRW_SWEEP_STEP_NAMES by SweepStepVocabularyTests; edit
# there and here together or the cell reds.
values = ["ag1", "ag10", "ag2", "ag3", "ag4", "ag5", "ag6", "ag7", "ag8", "ag9", "bays-close", "bays-open", "brakes-off", "brakes-on", "chutes-arm", "chutes-cut", "chutes-deploy", "converters-off", "converters-on", "deployables-in", "deployables-out", "engines-off", "engines-on", "gear-down", "gear-up", "lights-off", "lights-on", "rcs-off", "rcs-on", "throttle-up", "throttle-zero"]

# Frames held between two sweep steps. NOT a tuning knob: two part actions issued
# inside one physics frame can coalesce into a single recorded event, which would
# under-count families in the replay through no fault of the applier.
[params.partSweepSettleFrames]
required = false
type = "int"
min = 1
max = 500

# SILENCE bound for the whole sweep, in FRAMES (the post-rewind frame-budget
# discipline applied forward). Steps are commanded and never read back, so this
# bounds a machine that stopped advancing, never a part that refused.
[params.partSweepFrames]
required = false
type = "int"
min = 1
max = 100000

# ---- the IMPACT PROFILE (OPTIONAL; omitted = the pre-profile lane) ------------
#
# WHAT IT CHANGES, AND WHAT IT DELIBERATELY DOES NOT. The FLOWN ASCENT IS
# UNCHANGED: every booster drop, the throttle-up after the last one, the fueled-core
# gate, the discard and the coast run exactly as they do on the ordinary lane. The
# profile diverges only AFTER the tree id has been read, and the tree then reaches
# the rewind through the SPACE CENTER instead of through CommitTree:
#
#   COAST -> TREE-STATE -> IMPACT-AUTORECORD-OFF -> IMPACT-COAST -> IMPACT-SETTLE
#   -> SC-EXIT -> SC-COMMITTED -> TEMP-LAUNCH -> TEMP-READY -> REWIND -> (as before)
#
# WHAT MAKES THE STACK FALL is the ordinary core gate. ASCENT enters CORE-CUT with
# the throttle cut and the autopilot disengaged, CORE-DISCARD drops the fueled
# Mainsail, and this lane never presses the Poodle - so from
# `coreDiscardApoapsisMeters` on, the pod stack is unpowered, has no parachute, and
# reaches the ground without the machine doing anything further.
#
# THE CRASH HAPPENS FAR FROM THE PAD, and the history of that choice matters more
# than the choice. An earlier revision diverged at the LAST BOOSTER DROP (cut there,
# never throttle up) and left the stack falling back within 330-374 m of the pad,
# measured on runs 2026-09-08_1130 / _1157_a2 and 2026-09-08_1302 / _1331_a2, and
# the launch that followed hung. The first hypothesis was the pad (KSP's
# `PreFlightTests.LaunchSiteClear.Test()` waiting on an obstruction dialog). Moving
# the cut to the core discard (73 km downrange, runs 2026-09-08_1429 / _1503_a2)
# REFUTED it: only the launch clamps sat at the pad and the launch hung the same
# way (`LaunchSiteClear` waves Debris through anyway). The blocker is the ROSTER,
# below. The far crash is KEPT because it is the shape every green flight flew and
# the shape GS-7's tokens are cut to, not because the pad needs it. The scene was
# never the blocker either: TEMP-LAUNCH is the kRPC launch GS-4's post-rewind
# WATCHER-LAUNCH issues from SPACECENTER on every flight.
#
# WHY THE DISARM PRECEDES THE FALL. When the stack breaks up KSP hands the active
# vessel to a SURVIVING FRAGMENT, and with `autoRecordOnLaunch` still armed Parsek
# opens a NEW recording tree on it (measured: `StartRecording: clearing stale chain
# state without active tree`). The exit gate this lane pins reads
# the tree state (`hasActiveTree=false hasPendingTree=true` on the stash shape,
# `hasActiveTree=true hasPendingTree=false` on the pending-split shape), so a
# fragment recording can refuse the exit outright, and either way it lands in the
# save the spec's log contracts read. IMPACT-AUTORECORD-OFF
# sends the same `SetSetting autoRecordOnLaunch=false` pair the post-rewind
# AUTORECORD-OFF phase sends, one frame after the tree id is captured; it cannot run
# any earlier, because that setting is what auto-started this flight's own recording
# at the PRELAUNCH click. A non-OK is FATAL.
#
# WHY THE HOP, and it is Parsek's own shape rather than a driver preference.
# Destroying the active vessel does NOT commit its tree in flight:
# `ParsekFlight.ShowPostDestructionTreeMergeDialog` finalizes the tree and STASHES
# it as pending, deferring the commit to the scene transition. So CommitTree is
# refused `no-active-tree` from there on; `ExitToSpaceCenter` proceeds under
# autoMerge=true and the pending tree auto-commits on arrival in SPACECENTER;
# `ListHandles kind=committed` (RequiresGameLoaded, so it answers with no active
# vessel) is what READS that commit back rather than assuming it; and
# `InvokeRewindToLaunch` is RequiresFlight, which is the only reason a temporary
# craft is put on the pad at all. That craft is NOT the watcher - the rewind's
# quicksave predates it, so it is rewound out of existence and the real watcher is
# launched afterwards by the unchanged WATCHER-LAUNCH phase. Nothing between the
# arrival's in-memory commit and the rewind reads a .sfs: the rewind is commanded in
# the same process the commit landed in, so there is no save-and-reload leg.
#
# THE THROWAWAY IS `craftName` ITSELF, and the WATCHER CRAFT CANNOT SERVE, which is
# why this block declares no craft key of its own. The crash leaves an ALL-MISSING
# crew roster (the pod's crew died in the impact, the rest went with the recovered
# pad occupant; measured on GS-7 round 3, runs 2026-09-08_1429 / _1503_a2), so
# `DefaultCrewForVessel` builds an EMPTY manifest for the next launch. A craft whose
# command module declares `minimumCrew = 1` - the Mk1 pod `watcherCraftName`'s
# Jumping Flea is built on - then has NO CONTROL SOURCE, KSP's
# `PreFlightTests.NoControlSources` raises its "launch anyway?" dialog, and kRPC's
# `LaunchVessel` yields on `WaitForVesselPreFlightChecks` forever (only that check's
# own callback sets `preFlightChecksComplete`). The recorded Kerbal X carries the
# RC-L01 `probeStackLarge` (`minimumCrew = 0`) and launches unattended. TEMP-READY
# therefore reads `rolloutExpectedVesselName` / `rolloutReadySituations` /
# `rolloutReadyDebounceFrames` back, and only its FRAME BOUND stays
# `watcherLaunchFrames` - a Space Center launch is the watcher's operation, not the
# rollout's FLIGHT->FLIGHT reload. THE REWIND DOES NOT REFILL THE POOL (round 4,
# runs 2026-09-08_1627 / _a2: throwaway launched, rewind complete, the Flea hung on
# the identical `NoControlSources` line): the `parsek_rw_*` quicksave carries the
# crew aboard the recorded craft, the strip reserves them and the ledger keeps them
# dead, and `CrewReservationManager.ReserveCrewIn` hires the stand-in GS-4 / GS-8's
# Flea flies on only for LIVING reserved crew. A spec that turns this profile on
# must therefore also name a probe-cored `watcherCraftName` (GS-7: the
# `GS1 Auto-Chute Booster`, launched empty by its Octo2).
#
# OMITTING THE KEY IS THE PRE-PROFILE LANE, exactly: the phase graph, the emitted
# actions and the assertion rows are byte-identical. ONE row is SUBSTITUTED when it
# is on (never added - the count stays eight): `treeCommittedAtSpaceCenter` for
# `treeCommitted`, because there is no CommitTree verdict to read.
# `coreDiscardedWithEnginesOff` is untouched - the profile runs that gate the
# ordinary way - and the crash rides `recordedSpanSeconds`, which additionally FAILS
# when no impact was observed (that row's `recording_end_ut` IS the impact stamp).
#
# REFUSED WITH `partSweepSteps` above, on the machine's FIRST decision frame -
# before a stage click, never after an ascent.
[params.impactProfile]
required = false
type = "bool"

# Frames IMPACT-COAST waits for the impact before giving up BY NAME. The fall from
# the core-discard apoapsis is real time at 1x (this lane warps nowhere) and takes
# minutes, so this is generous on purpose; what it actually catches is a stack that
# SURVIVED - still flying, or landed softly - or a clock that stalled, neither of
# which the two impact readings can see on their own. IMPACT-COAST is also a FLIGHT
# phase, so `flightMaxSeconds` bounds it too and has to admit the whole fall.
[params.impactCoastFrames]
required = false
type = "int"
min = 1
max = 10000

# Frames held between the observed impact and the ExitToSpaceCenter click. NOT a
# tuning knob: the C# finalize waits up to 5 s of REAL time for the destruction
# coalescer before it stashes the tree, so the settle has to outlast that or the
# exit tears down the scene the finalize is running in, racing the very stash the
# whole hop depends on. 16 frames at the standard 0.5 s poll is 8 s.
[params.impactSettleFrames]
required = false
type = "int"
min = 1
max = 10000

# SC-EXIT's SILENCE bound. The largest in the impact block because the verb spans
# a whole scene load (FLIGHT teardown -> SPACECENTER bootstrap ->
# ParsekScenario.OnLoad -> the pending-tree auto-commit), every frame of which
# arrives as a vessel_lost snapshot. A non-OK answer is FATAL rather than bounded:
# the exit is this profile's only route to a committed tree.
[params.scExitFrames]
required = false
type = "int"
min = 1
max = 10000

# SC-COMMITTED's bound: frames in which `ListHandles kind=committed` must report
# at least one committed recording, re-probing under a fresh wire tag until it
# does. It bounds a REREAD, not a scene change - ExitToSpaceCenter already
# answered OK, so the scene moved; what this waits on is the arrival's auto-commit
# landing in the store, which is the one thing that OK does not say. The gate is
# `count >= 1`, an ABSOLUTE floor rather than a delta: it is a commit proof only
# over a save that starts with zero committed recordings (GS-7's
# `gs1-two-stage-pad` does; a spec turning this profile on over a save that
# already holds committed recordings would pass the gate before the arrival's
# auto-commit landed, and needs a pre-exit baseline read of its own).
[params.scCommittedFrames]
required = false
type = "int"
min = 1
max = 10000

# IMPACT-AUTORECORD-OFF has NO knob of its own: it is bounded by
# `autoRecordOffFrames` below. The two phases issue the identical one-frame
# SetSetting verb, so a second key would be two names for one number and the one
# that drifts is the one nobody re-pins.

# ---- FRAME budgets ------------------------------------------------------------
#
# FRAMES, not game seconds, and the reason is structural: Rewind-to-Launch puts
# the clock back to launchUT-15 s, so `ut - phaseEntryUt` is NEGATIVE past the
# rewind and a game-time budget can never expire - the phase would hang with no
# named give-up. R1 established the rule; this lane extends it to every
# post-flight phase. The seam bridge BLOCKS inside perform() for its whole poll
# window, so a terminal token normally lands on the very next frame; these bounds
# exist for the case where the action never executed at all (no seam configured ->
# an immediate ERROR token) or the result never rides a snapshot.

[params.stageCutFrames]
required = false
type = "int"
min = 1
max = 10000

[params.treeStateFrames]
required = false
type = "int"
min = 1
max = 10000

[params.commitFrames]
required = false
type = "int"
min = 1
max = 10000

[params.stopFrames]
required = false
type = "int"
min = 1
max = 10000

# RECORDER-IDLE's bound. Each frame in the phase either issues one RecordingState
# probe or reads its reply, so this is ~half that many probes. It exists because
# the dispatcher REJECTS a rewind `recording-active` while a recorder is live, and
# the commit-then-keep-flying promotion re-arms one ~14 ms after CommitTree
# returns OK (R1 flight 1 died on exactly that).
[params.idleFrames]
required = false
type = "int"
min = 1
max = 10000

[params.rewindFrames]
required = false
type = "int"
min = 1
max = 10000

# SPACECENTER's bound: frames in which the OBSERVED backward clock must appear
# after InvokeRewindToLaunch answers OK. Generous, because it straddles a full
# world teardown + cold load and every frame of it arrives as a vessel_lost
# snapshot (SPACECENTER has no active vessel).
[params.spaceCenterFrames]
required = false
type = "int"
min = 1
max = 10000

# AUTORECORD-OFF's bound, and IMPACT-AUTORECORD-OFF's: frames in which a
# `SetSetting autoRecordOnLaunch=false` step must answer. It is a one-frame
# AnyScene verb riding the 60 s C# default, so its reply lands on the very next
# frame; this bounds a seam that never answers at all. A non-OK answer is FATAL
# rather than bounded at BOTH sites - leaving the setting armed means the watcher
# launch auto-starts a second recording, and on the impact profile a surviving
# fragment does the same, in the save the spec's log contracts are about to read.
[params.autoRecordOffFrames]
required = false
type = "int"
min = 1
max = 10000

# WATCHER-READY's bound: frames in which the watcher craft must settle into one of
# watcherReadySituations after its launch_vessel click. The IMPACT PROFILE's
# TEMP-READY reuses THIS bound (and nothing else of the watcher's - it settles the
# RECORDED craft, on the rollout's own name / situations / debounce): what it
# bounds is a launch out of the SPACE CENTER, which is the watcher's operation
# rather than the rollout's FLIGHT->FLIGHT reload. See the impact block above.
[params.watcherLaunchFrames]
required = false
type = "int"
min = 1
max = 10000

# MAP-VIEW / WATCH bounds. These bound SILENCE, not refusal: a REJECTED render
# verb is recorded and flown past by design (it is a Parsek finding, carried by
# the spec's log contracts), and only a seam that never answers at all - a
# transport fault - trips these.
[params.mapViewFrames]
required = false
type = "int"
min = 1
max = 10000

# watchFrames bounds silence PER ATTEMPT (the WATCH phase can issue several - see
# watchEntryRetryFrames below), and it also bounds the pre-attempt hold.
[params.watchFrames]
required = false
type = "int"
min = 1
max = 10000

# ---- the WATCH entry race (MEASURED on the GS-4 reading run) ------------------
#
# THE RACE, in that run's own stamps. The lane issued its single EnterWatchMode at
# 00:48:27 and Parsek answered REJECTED `no-watchable-ghost`; the parent ghost's
# `phase=MeshSpawned ... vessel=Kerbal X` landed at 00:48:32. Five seconds early.
# Watch never entered, so the parent's derender came out as `stale past-end ghost
# (no longer held)` instead of a watch-hold reason - and the run red on BOTH the
# `enterwatchmode complete: index=` token and the parent MeshDestroyed alternation.
# The flight itself was fine (MISSION-OK; ghostLifecycle spawned=8 destroyLines=8
# unbalanced=0): the DRIVER asked too early. That is a measurement, not a defect,
# and RETRYING is the fix - failing was what the measurement cost.
#
# WHY THE WINDOW OPENS WHERE IT DOES. The committed recording spans
# [launchUT, commitUT], a non-loop ghost replays at its RECORDED absolute UTs, and
# Rewind-to-Launch had put the clock back to launchUT - 15 s - so the parent ghost
# does not exist until the live clock reaches launchUT. The machine already stamps
# launchUT itself (at the PRELAUNCH click) and the run proved both readings sit on
# the same clock, so no new observation is needed to know when to ask.
#
# Seconds past launchUT the clock must reach before the FIRST EnterWatchMode goes
# out. A RACE SHORTENER rather than a gate: an unreadable clock asks immediately
# instead of burning the phase, because the retry loop below is the actual fix.
[params.watchEntryLeadSeconds]
required = false
type = "number"
min = 0.0

# THE WHOLE WATCH-ENTRY BUDGET, measured from the phase's entry: the hold above
# AND every retry below. One budget because both are the same wait - the game clock
# reaching a ghost - and deliberately NOT watchFrames, which the hold alone can
# consume (the machine arrives at ~launchUT-15 and the window opens at
# launchUT+lead, so ~20 s = ~40 frames at the 0.5 s poll = watchFrames' entire
# default; bounding the hold with it would put a give-up on the normal case).
# watchFrames keeps its own narrower job: the SILENCE bound of ONE attempt.
#
# Within it, a `no-watchable-ghost` refusal is RE-ASKED (a fresh wire tag per
# attempt, on a fixed internal cadence). That refusal is the only one meaning "not
# yet" rather than "no": every other terminal still records and advances on the
# spot, bound exhaustion still records the last rejection and advances, and NOTHING
# here is fatal - the record-do-not-fail rule for render verbs is untouched.
# Generous on purpose: an over-short bound rebuilds the lost watch leg this exists
# to prevent, and the bound's only cost is real time in a phase already waiting on
# a clock.
[params.watchEntryRetryFrames]
required = false
type = "int"
min = 1
max = 10000

# THE PLAYBACK WAIT'S ONLY BOUND, and the one cap that stops this mission running
# forever. Frames rather than UT because a STUCK clock is precisely the failure a
# UT budget cannot see; at the standard 0.5 s poll the default (1600) is ~13 real
# minutes. A breach is MISSION-FLAKE naming the target it never reached.
#
# IT IS SIZED OFF recordedSpanWindowSeconds' MAX, and the two knobs move together.
# The wait walks the clock from the post-rewind reading (launchUT - 15 s) to
# commitUT + playbackMarginSeconds, i.e. span + 45 s of REAL time (this lane uses
# no warp anywhere). At the 600 s span ceiling that is 645 s = 1290 frames, which
# the previous 1200 default could not have covered at all: a max-span flight would
# have flaked on the cap rather than on anything real. Raising either number
# without the other rebuilds that inconsistency.
[params.playbackWaitFrames]
required = false
type = "int"
min = 1
max = 100000

# ---- the OBSERVED rewind gate + the watcher settle ---------------------------

# Seconds the game clock must have run BACKWARD before the rewind counts as having
# happened. THE OBSERVED GATE: InvokeRewindToLaunch answering OK is a COMMANDED
# reading, and a rewind that did not move the clock did not happen. A healthy
# cycle regresses by the whole recorded span plus the 15 s pre-launch lead, so any
# positive floor is comfortable; the floor only keeps float noise from qualifying.
[params.minUtRegressionSeconds]
required = false
type = "number"
min = 0.001

# Situations the WATCHER must read before the render verbs are driven. PRE_LAUNCH
# is what a freshly launched craft sitting on the pad reports; LANDED is accepted
# because KSP flips to it once physics settles under the clamps. The gate ALSO
# requires the active vessel to read back `watcherCraftName` - same discipline as
# the rollout, and for the same reason (a launch is a scene reload, so "a craft on
# the pad in PRE_LAUNCH" was already true of whatever it replaced).
[params.watcherReadySituations]
required = false
type = "list"

[params.watcherReadyDebounceFrames]
required = false
type = "int"
min = 1
max = 50

# ---- the playback wait --------------------------------------------------------

# Game seconds past the RECORDED END the clock must reach before the mission is
# done. The recorded span is [launchUT, commitUT], both stamped by the machine,
# and a non-loop ghost replays at its recorded absolute UTs - so passing commitUT
# is what puts the ghost's whole lifecycle (spawn -> replay -> RETIRE) inside the
# log. The margin is what keeps the retire itself inside it rather than one frame
# past the end.
[params.playbackMarginSeconds]
required = false
type = "number"
min = 0.0

# ---- assertion window ---------------------------------------------------------

# {min, max} game seconds the committed recording must span (commitUT - launchUT).
# A WINDOW on the flight this mission actually flew, never a golden duration - and
# sizing evidence for the operator, because this span is exactly what the playback
# wait spends in REAL TIME afterwards. THE MAX IS TIED TO playbackWaitFrames: a
# ceiling this window admits but that cap cannot sit through is a lane whose own
# assertion window contradicts its own bound. Move the two together.
[params.recordedSpanWindowSeconds]
required = false
type = "window"

# Airborne frozen-telemetry samples before the craft is presumed destroyed (KSP
# hands active-vessel to invalid debris and kRPC then reports bit-identical orbit
# telemetry forever while UT advances). FLIGHT phases only.
[params.frozenTelemetrySamples]
required = false
type = "int"
min = 2
max = 1000
