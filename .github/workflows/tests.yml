name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The job executes PR-authored shell (scripts/cloud-test.sh); keep the ambient
# token read-only.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded runs on PR updates only. Main-branch pushes must each run
  # to completion: back-to-back merges would otherwise leave the earlier merge
  # commit with a cancelled (never verified) check and a cancelled README badge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fork PRs get no repo secrets, so the private DLL checkout below cannot
      # authenticate; fail fast with a readable reason instead of an opaque
      # "repository not found" from actions/checkout.
      - name: Check ksp-refs access
        env:
          HAS_KEY: ${{ secrets.KSP_REFS_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::KSP_REFS_DEPLOY_KEY is unavailable (fork PRs receive no secrets). CI needs the private vl3c/ksp-refs reference-DLL repo, so it can only run for branches on vl3c/Parsek itself."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # FULL HISTORY, and one committed test cell depends on it.
          # `SbrDwellCompatibilityTests` proves the recover mission's optional
          # `preRecoverDwellSeconds` left `L3-career-science-recover`'s pinned
          # timeline untouched by REPLAYING both machines - the committed one and
          # the one `git show 96ac15dfb:harness/missions/lib/mlib.py` produces -
          # over one scripted flight. `actions/checkout` defaults to depth 1, so
          # that sha would not resolve and the class would SELF-SKIP on every CI
          # run: the claim would read green while proving nothing. This repo
          # refuses that shape elsewhere (the pwsh grep-audit gates fall back to a
          # managed scan rather than skip), so it is refused here too. The cost is
          # one full clone of a small repo. Only THIS checkout is deepened; the
          # ksp-refs one below wants its tip only.
          fetch-depth: 0

      # Private KSP/Unity/mod reference DLLs (see the ksp-refs README).
      # Authenticated via a read-only deploy key stored as a repo secret;
      # the default GITHUB_TOKEN cannot reach other repos.
      - name: Checkout ksp-refs (reference DLLs)
        uses: actions/checkout@v4
        with:
          repository: vl3c/ksp-refs
          ssh-key: ${{ secrets.KSP_REFS_DEPLOY_KEY }}
          path: ksp-refs
          persist-credentials: false

      # The runner's nuget cache is always cold, so without this the
      # xunit.runner.console prefetch in cloud-test.sh plus the test-project
      # restore hit nuget.org on every run.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Source/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The three harness Python suites (stdlib-only, no venv needed). These were
      # NEVER run in CI before 2026-08-26 - Actions ran only cloud-test.sh, so a
      # drift in the four cells that read OUTSIDE harness/ (the BATCH tally, the
      # doc sync, the pointCount writer, the career-earned-pad splice) could sit
      # on main indefinitely (todo: HARNESS-PYTHON-SUITES-NEVER-RUN-IN-CI, and it
      # happened: the science-pad ULP drift). Runs BEFORE the mono install so a
      # pure-Python red fails fast without waiting on apt. Gate on exit codes,
      # never on test counts. Two cells self-skip with stated platform reasons
      # (one Windows-only by construction, one defeated by root); Actions runners
      # are non-root, so only the Windows-only cell skips here.
      - name: Harness Python suites
        run: |
          cd harness
          python3 -m unittest discover -s lib -q
          python3 -m unittest discover -s missions/lib -q
          python3 -m unittest discover -s provision -q

      # The architecture map's own suite. Its real-tree cells are the placement
      # contract (every production file matched by a rule in
      # scripts/arch/modules.toml) and the knot / first-cut canaries; before
      # 2026-11-01 nothing ran them, and 50 unplaced files plus six stale
      # canaries sat on main unseen. Uses the full-history checkout above for
      # the co-change cells. Gate on the exit code.
      - name: Architecture map tests
        run: python3 -m unittest discover -s scripts/arch -q

      # Ubuntu's apt-built .NET SDK ships no net472 testhost, so the suite
      # runs under mono + the xunit console runner via scripts/cloud-test.sh
      # (same path cloud agent sessions use). dotnet SDK is preinstalled;
      # mono-devel also supplies the net472 targeting pack the build needs.
      # apt calls are bounded + retried: a stalled mirror fetch otherwise hangs
      # silently until the job timeout (it killed the first two runs at 20 min
      # with zero output).
      - name: Install mono
        run: |
          # ikdasm (mono-devel) disassembles Parsek.dll for the semantic
          # architecture graph below; a runner image with mono but without
          # mono-devel still installs it.
          if command -v mono >/dev/null && command -v ikdasm >/dev/null; then
            echo "mono already present: $(mono --version | head -1)"
            exit 0
          fi
          # The runner's mirror list starts at azure.archive.ubuntu.com, then
          # archive.ubuntu.com and security.ubuntu.com. When a host does not
          # resolve, apt waits 20 s per file on it and reaches the next mirror
          # only after its retries, which outlasts the job. So drop the hosts
          # that do not resolve before the first apt call, and when no Ubuntu
          # host resolves use an independent full mirror; apt still verifies
          # every package against the image's own keyring.
          MIRRORS=/etc/apt/apt-mirrors.txt
          if [ -f "$MIRRORS" ]; then
            for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
              if ! timeout 10 getent hosts "$host" >/dev/null 2>&1; then
                echo "$host does not resolve; dropping it from the apt mirror list"
                sudo sed -i "\\|//$host/|d" "$MIRRORS"
              fi
            done
            if ! grep -q '[^[:space:]]' "$MIRRORS"; then
              echo "no Ubuntu mirror resolves; using mirrors.edge.kernel.org"
              echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee "$MIRRORS" >/dev/null
            fi
            cat "$MIRRORS"
          fi
          for i in 1 2 3; do
            sudo timeout 120 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 && break
            echo "apt-get update attempt $i stalled or failed; retrying"
            sleep 10
          done
          install_mono() {
            sudo timeout "$1" apt-get install -y -o Acquire::Retries="$2" -o Acquire::http::Timeout=15 mono-devel
          }
          # A healthy install takes well under a minute. A mirror that resolves
          # can still stall, so the first attempt is short, and a failure drops
          # the default mirror before the retries.
          if ! install_mono 90 0; then
            echo "apt-get install stalled or failed on the default mirror; dropping it from the mirror list"
            if [ -f "$MIRRORS" ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$MIRRORS"
              grep -q '[^[:space:]]' "$MIRRORS" || echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee "$MIRRORS" >/dev/null
              cat "$MIRRORS"
            fi
            sudo timeout 120 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 || echo "apt-get update on the remaining mirrors failed; trying the install anyway"
            for i in 1 2; do
              install_mono 300 1 && break
              echo "apt-get install fallback attempt $i stalled or failed; retrying"
              sleep 10
            done
          fi
          command -v mono >/dev/null || { echo "::error::mono install failed after retries"; exit 1; }
          command -v ikdasm >/dev/null || { echo "::error::ikdasm (mono-devel) missing after install"; exit 1; }

      - name: Build + run xUnit suite
        env:
          KSPDIR: ${{ github.workspace }}/ksp-refs
        run: scripts/cloud-test.sh

      # The semantic type graph (scripts/arch/ilgraph.py + semantic.py): the
      # same knot and cut residue as the architecture map, measured on the
      # compiled Parsek.dll the step above built, where a call through a
      # forwarder counts as a call to the forwarded type. Its real-tree cells
      # skip only when PARSEK_ARCH_IL is unset, so here they always run; the
      # report (residue next to the text scan's, every disagreement
      # classified) goes to the step log. The pattern also picks up
      # test_ilfacts.py (the per-member facts layer), test_ilanalysis.py
      # (the three code-facts ratchets pinned in scripts/arch/facts_pins.toml)
      # and test_metrics.py (a metrics history row built from the model,
      # semantic result and facts the other cells already hold: a pull
      # request's proof that the row can still be built), which read the
      # same parse through ilgraph.load_parsed, so the DLL is disassembled and
      # parsed once for all. About two and a half minutes. test_iltags.py (the
      # log-tag map the harness lane health reads, scripts/arch/logtags.py)
      # disassembles the DLL once more for its own stack walk, about 40 s.
      - name: Architecture semantic graph (compiled IL)
        env:
          PARSEK_ARCH_IL: ${{ github.workspace }}/Source/Parsek/bin/Debug/Parsek.dll
        run: python3 -m unittest discover -s scripts/arch -p 'test_[ims]*.py' -q

      # The metrics history row for this main commit (scripts/arch/metrics.py,
      # README "Metrics history"): the text scan, the semantic graph, the code
      # facts with test reach, and the size counts, in one process over the
      # DLLs the build step made (about 170 s). Main pushes only: a pull
      # request keeps no row, and the compiled-IL step above already proves
      # one can be built. The history gates nothing, so this step and the
      # upload are continue-on-error and can never turn the required `tests`
      # check red; when they fail there is no artifact, and the `metrics` job
      # below fails visibly at its download instead.
      - name: Metrics history row
        id: metrics_row
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/metrics-row"
          python3 scripts/arch/metrics.py --sha "$GITHUB_SHA" --date "$(git show -s --format=%cI "$GITHUB_SHA")" \
            --dll Source/Parsek/bin/Debug/Parsek.dll \
            --tests-dll Source/Parsek.Tests/bin/Debug/net472/Parsek.Tests.dll \
            --out "$RUNNER_TEMP/metrics-row/row.json"

      - name: Upload metrics row
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.metrics_row.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: metrics-row
          path: ${{ runner.temp }}/metrics-row/row.json
          if-no-files-found: error
          retention-days: 14

  # Appends main's row to metrics.jsonl on the `metrics` branch
  # (scripts/arch/metrics_append.py; it creates the branch as an orphan when
  # it is missing, and a push rejected by a concurrent append is retried on
  # the new tip). The only job with write access, and it runs only for a
  # push to main, after `tests` passed, on code already merged: no pull
  # request reaches it, and nothing here can fail a PR. A missing row (the
  # row step failed) fails this job at the download. GitHub keeps at most one
  # pending run per concurrency group, so when merges land back to back a
  # queued run can be cancelled and that commit gets no row. The job is
  # continue-on-error: its failure shows on the job itself and leaves the
  # run's conclusion, and so the README badge, to `tests`.
  metrics:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    concurrency:
      group: metrics-history
      cancel-in-progress: false
    steps:
      # The default persist-credentials keeps the job token in this checkout's
      # git config; the metrics worktree below shares it for the push.
      - uses: actions/checkout@v4

      - name: Download metrics row
        uses: actions/download-artifact@v4
        with:
          name: metrics-row
          path: ${{ runner.temp }}/metrics-row

      - name: Append the row to the metrics branch
        run: |
          python3 scripts/arch/metrics_append.py publish --row "$RUNNER_TEMP/metrics-row/row.json" \
            --repo . --remote origin --branch metrics --workdir "$RUNNER_TEMP/metrics-branch"
